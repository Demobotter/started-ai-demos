<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Revealer — Sacred Context</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #2a1f1a 0%, #1a1410 100%);
      color: #e8dcc8;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    h1 {
      font-family: 'Merriweather', serif;
      font-size: 2.5em;
      color: #d4a574;
      margin-bottom: 10px;
      font-style: italic;
    }
    .tagline {
      color: #a89968;
      font-size: 0.95em;
      margin-bottom: 30px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }
    button {
      background: #d4a574;
      color: #1a1410;
      border: none;
      padding: 12px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      font-size: 0.9em;
      transition: all 0.2s;
    }
    button:hover {
      background: #e8b88e;
      transform: translateY(-2px);
    }
    button.active {
      background: #f5eaa2;
      color: #1a1410;
    }
    .main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 40px;
    }
    @media (max-width: 900px) {
      .main { grid-template-columns: 1fr; }
    }
    .text-panel {
      background: rgba(60, 36, 20, 0.5);
      border: 1px solid #5a4a3a;
      border-radius: 8px;
      padding: 25px;
      max-height: 500px;
      overflow-y: auto;
    }
    .text-panel h2 {
      font-family: 'Merriweather', serif;
      color: #d4a574;
      font-size: 1.2em;
      margin-bottom: 15px;
    }
    .text-panel p {
      font-family: 'Merriweather', serif;
      color: #d4cbb8;
      line-height: 1.8;
      font-size: 1.05em;
      margin-bottom: 12px;
      cursor: pointer;
      padding: 8px 0;
      transition: color 0.2s;
    }
    .text-panel p:hover {
      color: #f5eaa2;
    }
    .text-panel p.selected {
      background: rgba(212, 165, 116, 0.2);
      border-left: 3px solid #d4a574;
      padding-left: 12px;
    }
    .context-panel {
      background: rgba(60, 36, 20, 0.5);
      border: 1px solid #5a4a3a;
      border-radius: 8px;
      padding: 25px;
      max-height: 500px;
      overflow-y: auto;
    }
    .context-card {
      background: rgba(90, 74, 58, 0.3);
      border-left: 3px solid #d4a574;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 4px;
    }
    .context-card h3 {
      font-family: 'Merriweather', serif;
      color: #f5eaa2;
      font-size: 0.95em;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .context-card p {
      color: #d4cbb8;
      font-size: 0.9em;
      line-height: 1.6;
    }
    .comparison {
      background: rgba(60, 36, 20, 0.5);
      border: 1px solid #5a4a3a;
      border-radius: 8px;
      padding: 25px;
      margin-bottom: 30px;
    }
    .comparison h2 {
      font-family: 'Merriweather', serif;
      color: #d4a574;
      font-size: 1.2em;
      margin-bottom: 20px;
    }
    .quote-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (max-width: 900px) {
      .quote-pair { grid-template-columns: 1fr; }
    }
    .quote-box {
      background: rgba(90, 74, 58, 0.3);
      border: 1px solid #5a4a3a;
      padding: 15px;
      border-radius: 4px;
    }
    .quote-box .source {
      color: #a89968;
      font-size: 0.85em;
      margin-bottom: 10px;
      font-style: italic;
    }
    .quote-box .text {
      color: #d4cbb8;
      font-family: 'Merriweather', serif;
      font-size: 0.95em;
      line-height: 1.6;
    }
    .timeline {
      background: rgba(60, 36, 20, 0.5);
      border: 1px solid #5a4a3a;
      border-radius: 8px;
      padding: 25px;
    }
    .timeline h2 {
      font-family: 'Merriweather', serif;
      color: #d4a574;
      font-size: 1.2em;
      margin-bottom: 20px;
    }
    .timeline-item {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #5a4a3a;
    }
    .timeline-item:last-child {
      border-bottom: none;
    }
    .timeline-dot {
      width: 12px;
      height: 12px;
      background: #d4a574;
      border-radius: 50%;
      margin-top: 5px;
      flex-shrink: 0;
    }
    .timeline-content h3 {
      font-family: 'Merriweather', serif;
      color: #f5eaa2;
      font-size: 0.95em;
      margin-bottom: 5px;
    }
    .timeline-content p {
      color: #d4cbb8;
      font-size: 0.9em;
      line-height: 1.5;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .stat-box {
      background: rgba(90, 74, 58, 0.3);
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #5a4a3a;
      text-align: center;
    }
    .stat-value {
      font-size: 1.8em;
      color: #f5eaa2;
      font-weight: 700;
      margin-bottom: 5px;
    }
    .stat-label {
      font-size: 0.8em;
      color: #a89968;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .freq-heatmap {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }
    .freq-item {
      background: rgba(90, 74, 58, 0.5);
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      border-left: 3px solid transparent;
    }
    .freq-item.high {
      border-left-color: #f5eaa2;
      background: rgba(212, 165, 116, 0.2);
    }
    .freq-word {
      color: #d4a574;
      font-weight: 600;
      font-size: 0.9em;
    }
    .freq-count {
      color: #a89968;
      font-size: 0.8em;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📖 Quote Revealer</h1>
      <p class="tagline">Explore sacred texts, compare traditions, track evolution across cultures</p>
    </header>

    <div class="controls">
      <button onclick="loadText('bible')">Bible (John 3:16)</button>
      <button onclick="loadText('plato')">Plato's Republic</button>
      <button onclick="loadText('quran')">Quran (Al-Fatiha)</button>
      <button onclick="loadText('bhagavad')">Bhagavad Gita</button>
      <button onclick="loadText('marx')">Marx's Manifesto</button>
    </div>

    <div class="main">
      <div class="text-panel">
        <h2 id="textTitle">Select a text</h2>
        <div id="textContent"></div>
      </div>
      <div class="context-panel">
        <h2>Context & Interpretation</h2>
        <div id="contextCards"></div>
      </div>
    </div>

    <div class="comparison">
      <h2>Parallel Traditions</h2>
      <div id="comparisons"></div>
    </div>

    <div class="timeline">
      <h2>Evolution of Concept: "Love" / "Compassion"</h2>
      <div id="timelineContent"></div>
      
      <h3 style="margin-top: 25px; color: #d4a574; font-family: 'Merriweather', serif;">Concept Frequency Heatmap</h3>
      <div class="freq-heatmap" id="freqHeatmap"></div>
      
      <div class="stats">
        <div class="stat-box">
          <div class="stat-value" id="wordCount">0</div>
          <div class="stat-label">Total Words</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="uniqueWords">0</div>
          <div class="stat-label">Unique Terms</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="avgSentence">0</div>
          <div class="stat-label">Avg Sentence</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const texts = {
      bible: {
        title: "Bible — John 3:16",
        content: "For God so loved the world that he gave his one and only Son, that whoever believes in him shall not perish but have eternal life. God did not send his Son into the world to condemn the world, but to save the world through him. Whoever believes in him is not condemned, but whoever does not believe stands condemned already because they have not believed in the name of God's one and only Son.",
        source: "Gospel of John, Chapter 3, Verses 16-18",
        context: [
          { title: "Historical Context", text: "Written ~90-110 CE, John's Gospel emphasizes eternal life and belief as the pathway to salvation, distinctly different from Matthew and Mark's emphasis on the Kingdom of God." },
          { title: "Author Intent", text: "The Evangelist John emphasizes Jesus as the divine Logos (Word), presenting salvation through faith rather than works, revolutionary for early Christian theology." },
          { title: "Theological Meaning", text: "'Love' here (Greek: agapē) refers to unconditional divine love, distinct from romantic or familial love, representing God's redemptive intention for all humanity." }
        ],
        parallels: [
          { tradition: "Islamic", quote: "God loves those who are kind. (Quran 2:195)", source: "Al-Birr (Kindness)" },
          { tradition: "Buddhist", quote: "Goodwill toward all beings is the highest good. (Dhammapada 183)", source: "Metta (Loving-kindness)" },
          { tradition: "Stoic", quote: "We are made for one another. (Aurelius)", source: "Meditations, Book 2" }
        ]
      },
      plato: {
        title: "Plato's Republic — Book VI",
        content: "And so, Glaucon, a man who has received a true education ought to be gentle, not harsh. The guardians of the state must be philosophers, lovers of wisdom and truth. They must resist the allure of power and wealth, dedicating themselves to the good of the whole. The greatest happiness comes not from pleasure, but from the harmony of the soul and the pursuit of eternal forms of goodness and truth.",
        source: "Plato's Republic, Book VI, translated by Benjamin Jowett",
        context: [
          { title: "Philosophical Context", text: "Plato (428–348 BCE) argues that justice comes from the proper ordering of the soul, where reason rules over appetite, creating a tripartite model of human nature." },
          { title: "Central Idea", text: "The allegory of the cave suggests that enlightenment (education) is the journey from ignorance to knowledge of eternal truths, not mere opinion." },
          { title: "Influence", text: "Shaped Western philosophy for 2,300+ years. Christianity adopted the concept of eternal forms and the immortal soul; Enlightenment thinkers built on his rationalism." }
        ],
        parallels: [
          { tradition: "Confucian", quote: "The superior man seeks harmony, not sameness. (Analects 13:23)", source: "Doctrine of the Mean" },
          { tradition: "Hindu", quote: "Truth alone triumphs. (Mundaka Upanishad 3.1.6)", source: "Upanishadic Philosophy" },
          { tradition: "Kantian", quote: "Act only according to that maxim whereby you can will it to be universal law. (Kant)", source: "Categorical Imperative" }
        ]
      },
      quran: {
        title: "Quran — Surah Al-Fatiha (The Opening)",
        content: "In the name of Allah, the Most Gracious, the Most Merciful. All praise is due to Allah, Lord of all the worlds. The Most Gracious, the Most Merciful. Master of the Day of Judgment. You alone we worship, and You alone we ask for help. Guide us along the straight path. The path of those upon whom You have bestowed favor, not of those who have earned anger, nor of those who go astray.",
        source: "Quran, Chapter 1 (Al-Fatiha), 7 verses, Saheeh International translation",
        context: [
          { title: "Recitation Significance", text: "Recited in every Islamic prayer (Salah), making it the most frequently recited chapter. Traditionally considered the spiritual heart of the Quran." },
          { title: "Theological Themes", text: "'Ar-Rahman' (The Merciful) and 'Ar-Rahim' (The Compassionate) establish divine mercy as central to faith. Emphasizes submission (Islam) and dependence on divine guidance." },
          { title: "Practical Application", text: "Serves as a petition for guidance and right action. Muslim scholars note its comprehensive coverage of Islamic belief, action, and relationship with the Divine." }
        ],
        parallels: [
          { tradition: "Christian", quote: "Thy will be done, on earth as in heaven. (Lord's Prayer, Matthew 6:10)", source: "Christian Liturgy" },
          { tradition: "Jewish", quote: "Blessed are You, Lord our God, Ruler of the universe. (Brachot — Blessings)", source: "Jewish Prayer" },
          { tradition: "Sikh", quote: "There is one God. Truth is His name. (Ik Onkar)", source: "Sikh Creed" }
        ]
      },
      bhagavad: {
        title: "Bhagavad Gita — Chapter 2, Verse 47",
        content: "You have a right to perform your prescribed duty, but you are not entitled to the fruits of action. Never consider yourself the cause of the results of your activities, and never be attached to not doing your duty. Perform your duty with equanimity, O Arjuna, abandoning all attachment to success or failure. Such equanimity is called yoga. Yoga is skill in action, O Dhananjaya.",
        source: "Bhagavad Gita, Chapter 2 (Sankhya-yoga), translation by A.C. Bhaktivedanta Swami Prabhupada",
        context: [
          { title: "Philosophical Foundation", text: "Krishna teaches Arjuna the doctrine of Karma Yoga — action without attachment to results. This reconciles duty (dharma) with spiritual liberation (moksha)." },
          { title: "Historical Context", text: "Written 200 BCE–200 CE, embedded in the epic Mahabharata. Reflects Hindu synthesis of Vedic ritual, Upanishadic philosophy, and Yoga traditions." },
          { title: "Practical Teaching", text: "Yoga here means 'skill,' suggesting that proper action performed with right intention and detachment leads to spiritual excellence and inner peace." }
        ],
        parallels: [
          { tradition: "Stoic", quote: "Amor fati — love your fate. (Nietzsche, echoing Marcus Aurelius)", source: "Meditations, Book 5" },
          { tradition: "Taoist", quote: "Act without action; do without doing. (Daodejing 2)", source: "Wu Wei — Non-action" },
          { tradition: "Christian", quote: "Not my will, but Yours be done. (Luke 22:42)", source: "Prayer of Surrender" }
        ]
      },
      marx: {
        title: "Communist Manifesto — Opening",
        content: "A spectre is haunting Europe — the spectre of communism. All the powers of old Europe have entered into a holy alliance to exorcise this spectre. From this union arose the demand for a new theory expounding the social and political system of the expected new society. Let the ruling classes tremble at a communistic revolution. The proletarians have nothing to lose but their chains. They have a world to win. Working men of all countries, unite!",
        source: "The Communist Manifesto, Karl Marx & Friedrich Engels, 1848, English translation by Samuel Moore",
        context: [
          { title: "Historical Moment", text: "Written in 1848, amid European revolutions. Marx and Engels synthesize Hegelian philosophy, political economy, and revolutionary politics into a manifesto for working-class emancipation." },
          { title: "Central Argument", text: "History is driven by class struggle. Capitalism contains inherent contradictions that will lead to its collapse and replacement by a classless communist society." },
          { title: "Rhetorical Power", text: "The opening metaphor ('spectre haunting Europe') became iconic. The conclusion ('Workers of the world, unite!') mobilized millions and shaped 20th-century politics." }
        ],
        parallels: [
          { tradition: "Utopian Socialist", quote: "From each according to ability, to each according to need. (Charles Fourier)", source: "Socialist Ideals" },
          { tradition: "Buddhist", quote: "There is no such thing as private property; all is interdependent. (Buddhist Economics)", source: "Schumacher's 'Buddhist Economics'" },
          { tradition: "Islamic", quote: "Wealth and children are adornments in this world; the everlasting good deeds are better. (Quran 18:46)", source: "Islamic Social Justice" }
        ]
      }
    };

    const timeline = [
      { era: "600 BCE", concept: "Love (Philia)", tradition: "Ancient Greek Philosophy", text: "Plato and Aristotle distinguish multiple forms of love: romantic, familial, platonic, and divine agape." },
      { era: "500 BCE", concept: "Ahimsa (Non-harm)", tradition: "Hindu/Buddhist", text: "Jainism and early Buddhism emphasize non-violence toward all sentient beings as the foundation of ethics." },
      { era: "1 CE", concept: "Agapē (Divine Love)", tradition: "Christianity", text: "Jesus and Paul introduce agape — unconditional, universal love transcending social hierarchy and tribe." },
      { era: "622 CE", concept: "Rahmah (Mercy)", tradition: "Islam", text: "Quran emphasizes divine mercy (Ar-Rahman) as foundational; human compassion modeled on divine attribute." },
      { era: "1200 CE", concept: "Caritas", tradition: "Medieval Christianity", text: "Christian scholasticism (Aquinas) synthesizes Aristotelian friendship with Christian love through theological virtue." },
      { era: "1800 CE", concept: "Solidarity", tradition: "Modern Humanism", text: "Marx and social movements reframe love as solidarity among workers and oppressed classes, extending compassion to universal struggle." },
      { era: "2000 CE", concept: "Ubuntu", tradition: "African Philosophy", text: "'I am because we are' — Ubuntu philosophy embodies interdependence and shared humanity across post-colonial discourse." }
    ];

    function loadText(key) {
      const text = texts[key];
      if (!text) return;

      // Update title and content
      document.getElementById('textTitle').textContent = text.title;
      document.getElementById('textContent').innerHTML = `<p>${text.content}</p>`;

      // Update context cards
      let contextHTML = '';
      text.context.forEach(ctx => {
        contextHTML += `
          <div class="context-card">
            <h3>${ctx.title}</h3>
            <p>${ctx.text}</p>
          </div>
        `;
      });
      document.getElementById('contextCards').innerHTML = contextHTML;

      // Update parallel traditions
      let compHTML = '';
      text.parallels.forEach((p, i) => {
        compHTML += `
          <div class="quote-pair">
            <div class="quote-box">
              <div class="source">${text.title}</div>
              <div class="text">${text.content.split('. ')[0]}.</div>
            </div>
            <div class="quote-box">
              <div class="source">${p.tradition} — ${p.source}</div>
              <div class="text">${p.quote}</div>
            </div>
          </div>
        `;
      });
      document.getElementById('comparisons').innerHTML = compHTML;

      // Update stats
      const words = text.content.split(/\s+/).length;
      const unique = new Set(text.content.toLowerCase().match(/\b\w+\b/g)).size;
      const sentences = text.content.split(/[.!?]+/).length - 1;
      const avgSent = Math.round(words / sentences);

      document.getElementById('wordCount').textContent = words;
      document.getElementById('uniqueWords').textContent = unique;
      document.getElementById('avgSentence').textContent = avgSent;

      // Word frequency heatmap for key concepts
      const concepts = {
        'love': (text.content.match(/love/gi) || []).length,
        'god': (text.content.match(/god|allah/gi) || []).length,
        'truth': (text.content.match(/truth/gi) || []).length,
        'soul': (text.content.match(/soul|spirit|atman/gi) || []).length,
        'action': (text.content.match(/action|duty|karma/gi) || []).length,
        'freedom': (text.content.match(/freedom|liberty|liberation/gi) || []).length
      };

      let freqHTML = '';
      Object.entries(concepts)
        .sort(([, a], [, b]) => b - a)
        .forEach(([word, count]) => {
          const isHigh = count >= 3;
          freqHTML += `
            <div class="freq-item ${isHigh ? 'high' : ''}">
              <div class="freq-word">${word}</div>
              <div class="freq-count">${count}×</div>
            </div>
          `;
        });
      document.getElementById('freqHeatmap').innerHTML = freqHTML;

      // Update active button
      document.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }

    // Timeline content
    function renderTimeline() {
      let html = '';
      timeline.forEach(item => {
        html += `
          <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="timeline-content">
              <h3>${item.era} — ${item.concept}</h3>
              <p><strong>${item.tradition}:</strong> ${item.text}</p>
            </div>
          </div>
        `;
      });
      document.getElementById('timelineContent').innerHTML = html;
    }

    // Load default text on page load
    window.addEventListener('load', () => {
      loadText('bible');
      renderTimeline();
    });
  </script>
</body>
</html>
