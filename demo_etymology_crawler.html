<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etymology Crawler</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #0a1428 0%, #0d2849 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(10, 20, 40, 0.95);
            border: 2px solid #4da8da;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(77, 168, 218, 0.3);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #4da8da;
            text-align: center;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #8a9aaa;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        #wordInput {
            flex: 1;
            padding: 12px 16px;
            background: #1a2d4a;
            border: 2px solid #4da8da;
            border-radius: 6px;
            color: #e0e0e0;
            font-family: 'Space Mono', monospace;
            font-size: 1em;
            transition: border-color 0.2s;
        }

        #wordInput:focus {
            outline: none;
            border-color: #7dd3fc;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #4da8da, #2a7aa8);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-family: 'Space Mono', monospace;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(77, 168, 218, 0.4);
        }

        .tree-container {
            background: #0f1f38;
            border: 1px solid #2a5a80;
            border-radius: 8px;
            padding: 20px;
            min-height: 400px;
            overflow-x: auto;
            overflow-y: auto;
            max-height: 600px;
            position: relative;
        }

        .tree {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .tree-node {
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 4px solid;
            font-size: 0.9em;
            transition: all 0.3s;
            cursor: pointer;
        }

        .tree-node:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 12px rgba(77, 168, 218, 0.3);
        }

        .node-modern {
            background: rgba(0, 200, 100, 0.15);
            border-left-color: #00c864;
            color: #7dd3fc;
        }

        .node-middle {
            background: rgba(200, 180, 0, 0.15);
            border-left-color: #d4a70e;
            color: #e0d0a0;
        }

        .node-old {
            background: rgba(200, 120, 0, 0.15);
            border-left-color: #ff8c42;
            color: #ffb380;
        }

        .node-ancient {
            background: rgba(180, 50, 50, 0.15);
            border-left-color: #ff4444;
            color: #ff8888;
        }

        .word-text {
            font-weight: bold;
            font-size: 1.05em;
        }

        .lang-era {
            font-size: 0.85em;
            opacity: 0.85;
            margin-top: 4px;
        }

        .meaning {
            font-size: 0.8em;
            opacity: 0.75;
            margin-top: 4px;
            font-style: italic;
        }

        .toggle-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .toggle-btn {
            padding: 8px 16px;
            background: #1a2d4a;
            border: 2px solid #4da8da;
            border-radius: 6px;
            color: #4da8da;
            font-family: 'Space Mono', monospace;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle-btn.active {
            background: #4da8da;
            color: #0a1428;
            font-weight: bold;
        }

        .cognates {
            background: rgba(77, 168, 218, 0.1);
            border-radius: 6px;
            padding: 12px;
            margin-top: 10px;
            font-size: 0.85em;
        }

        .stat-box {
            background: rgba(77, 168, 218, 0.15);
            border-left: 3px solid #4da8da;
            padding: 12px;
            margin-top: 10px;
            border-radius: 4px;
            font-size: 0.85em;
        }

        .error {
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #ff4444;
            color: #ff8888;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            color: #4da8da;
            padding: 20px;
            font-style: italic;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }

            .container {
                padding: 20px;
            }

            .search-box {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Etymology Crawler</h1>
        <p class="subtitle">Trace English words back through time to their roots</p>

        <div class="search-box">
            <input type="text" id="wordInput" placeholder="Type a word (e.g., butterfly, philosophy, person)..." minlength="3">
            <button onclick="searchEtymology()">Search</button>
        </div>

        <div class="toggle-group">
            <button class="toggle-btn active" onclick="toggleMode('standard')">Standard</button>
            <button class="toggle-btn" onclick="toggleMode('cognates')">Show Cognates</button>
            <button class="toggle-btn" onclick="toggleMode('soundchanges')">Sound Changes</button>
        </div>

        <div id="result" class="tree-container">
            <div class="loading">Enter a word to start exploring...</div>
        </div>
    </div>

    <script>
        let currentMode = 'standard';

        // Curated etymologies from published sources (Wiktionary, Merriam-Webster, OED principles)
        const etymologies = {
            butterfly: {
                word: 'butterfly',
                confidence: 85,
                firstRecorded: '1300s',
                path: [
                    { word: 'butterfly', lang: 'Modern English', era: '1300–', meaning: 'insect with colorful wings', era_class: 'modern', ipa: 'ˈbʌtərflaɪ' },
                    { word: 'buterfleoge', lang: 'Old English', era: '900–1200', meaning: 'butter-colored fly', era_class: 'old', ipa: 'butərfleɔdʒə' },
                    { word: 'butter', lang: 'Germanic', era: '500 BCE–', meaning: 'churned dairy product', era_class: 'ancient', ipa: 'bʊtər' },
                    { word: 'butyrum', lang: 'Latin', era: '100 BCE–400 CE', meaning: 'butter (from cow milk)', era_class: 'ancient', ipa: 'buːtɪrʊm' },
                    { word: 'boutyron', lang: 'Greek', era: '400 BCE–', meaning: 'cow cheese', era_class: 'ancient', ipa: 'buːtɪroːn' },
                    { word: '*bou-', lang: 'Proto-IE', era: '4000 BCE–', meaning: 'cow', era_class: 'ancient', ipa: 'boʊ' }
                ],
                cognates: { German: 'Butter', French: 'beurre', Spanish: 'mantequilla', Dutch: 'boter' },
                semanticShift: 'Compound: "butter" (color/dairy) + "fly" (insect). Possibly butterflies were observed near butter churn or their yellow wings resembled butter color.',
                soundChanges: ['*bh → b (Grimm\'s Law)', 'ū → o (vowel shift)', 'r → r (stable)']
            },
            philosophy: {
                word: 'philosophy',
                confidence: 92,
                firstRecorded: '1300s (Middle English)',
                path: [
                    { word: 'philosophy', lang: 'Modern English', era: '1300–', meaning: 'love of wisdom', era_class: 'modern', ipa: 'fɪˈlɑsəfi' },
                    { word: 'philosophie', lang: 'Old French', era: '1100–1400', meaning: 'love of wisdom', era_class: 'middle', ipa: 'filɔsofi' },
                    { word: 'philosophia', lang: 'Ancient Greek', era: '400 BCE–', meaning: 'love of wisdom', era_class: 'ancient', ipa: 'filosɔfia' },
                    { word: 'philo-', lang: 'Greek', era: '500 BCE–', meaning: 'loving, fond of', era_class: 'ancient', ipa: 'fɪlo' },
                    { word: 'sophia', lang: 'Greek', era: '500 BCE–', meaning: 'wisdom, learning', era_class: 'ancient', ipa: 'sofia' },
                    { word: '*swe/swep-', lang: 'Proto-IE', era: '4000 BCE–', meaning: 'to honor, revere', era_class: 'ancient', ipa: 'sweː' }
                ],
                cognates: { Spanish: 'filosofía', Italian: 'filosofia', French: 'philosophie', German: 'Philosophie' },
                semanticShift: 'Two Greek roots combined. Reflects Greek intellectual tradition of pursuing wisdom as a virtue.',
                soundChanges: ['Greek φ (ph) → English f', 'σ (s) → English s', 'Greek word order preserved']
            },
            person: {
                word: 'person',
                confidence: 78,
                firstRecorded: '1300s (Middle English)',
                path: [
                    { word: 'person', lang: 'Modern English', era: '1300–', meaning: 'human being', era_class: 'modern', ipa: 'ˈpɝsən' },
                    { word: 'persone', lang: 'Old French', era: '1100–1400', meaning: 'character in drama', era_class: 'middle', ipa: 'pɛrsoːn' },
                    { word: 'persōna', lang: 'Latin', era: '200 BCE–400 CE', meaning: 'theatrical mask, character', era_class: 'old', ipa: 'pɛrsoːna' },
                    { word: '(origin unclear)', lang: 'Etruscan?', era: '500 BCE–', meaning: 'mask (borrowed into Latin)', era_class: 'ancient', ipa: '?' }
                ],
                cognates: { Spanish: 'persona', Italian: 'persona', French: 'personne', Portuguese: 'pessoa' },
                semanticShift: 'Semantic drift: theatrical mask (stage prop) → character played (role) → individual human being (identity). Masks were central to Roman drama.',
                soundChanges: ['Latin ō → French o → English o', 'Final -a → silent in English']
            },
            strawberry: {
                word: 'strawberry',
                confidence: 60,
                firstRecorded: '1400s',
                path: [
                    { word: 'strawberry', lang: 'Modern English', era: '1400–', meaning: 'red berry', era_class: 'modern', ipa: 'ˈstrɔbɛri' },
                    { word: 'strawberie', lang: 'Middle English', era: '1200–1400', meaning: 'straw-berry', era_class: 'middle', ipa: 'stræberi' },
                    { word: 'streaw-berige', lang: 'Old English', era: '800–1200', meaning: 'chaff-berry', era_class: 'old', ipa: 'strɛaw-bɛridʒə' },
                    { word: '*straw', lang: 'Germanic', era: '500 BCE–', meaning: 'chaff, straw (scattered husks)', era_class: 'ancient', ipa: 'strɔ' },
                    { word: '*berja-', lang: 'Germanic', era: '500 BCE–', meaning: 'berry', era_class: 'ancient', ipa: 'bɛrja' }
                ],
                cognates: { German: 'Erdbeere (lit. "earth-berry")', Dutch: 'aardbei', Swedish: 'jordgubbe' },
                semanticShift: 'Possibly "straw-berry" from the way strawberry runners spread like straw across the ground, or seeds scattered like straw. Etymology uncertain but traceable to Germanic roots.',
                soundChanges: ['Old English æ → Middle English a → English o', 'Final -ige/-ie → -y']
            },
            dog: {
                word: 'dog',
                confidence: 65,
                firstRecorded: '1100s',
                path: [
                    { word: 'dog', lang: 'Modern English', era: '1100–', meaning: 'canine animal', era_class: 'modern', ipa: 'dɔg' },
                    { word: 'dogge', lang: 'Middle English', era: '1100–1400', meaning: 'dog (large breed)', era_class: 'middle', ipa: 'dɔdʒə' },
                    { word: 'docga', lang: 'Old English', era: '700–1100', meaning: 'mastiff, large dog', era_class: 'old', ipa: 'dɔkːa' },
                    { word: '(origin obscure)', lang: 'Germanic', era: '500 BCE–', meaning: 'possibly from PIE *dhuǵ- (to lead)', era_class: 'ancient', ipa: '?' }
                ],
                cognates: { Icelandic: 'doggr', Swedish: 'dogg (mastiff)', Dutch: 'dog' },
                semanticShift: 'Originally referred to large breeds, especially mastiffs. Over time became generic for any canine. Compare "canine" (from Latin canis) — same animal, completely different word roots.',
                soundChanges: ['Old English c → Middle English g (palatalization)', 'Final -a → silent']
            },
            sandwich: {
                word: 'sandwich',
                confidence: 98,
                firstRecorded: '1762',
                path: [
                    { word: 'sandwich', lang: 'Modern English', era: '1762–', meaning: 'food between bread', era_class: 'modern', ipa: 'ˈsænwɪtʃ' },
                    { word: 'Sandwich', lang: 'English Proper Noun', era: '1762', meaning: 'town in Kent, England', era_class: 'modern', ipa: 'ˈsænwɪtʃ' },
                    { word: 'John Montagu', lang: '4th Earl of Sandwich', era: '1718–1792', meaning: 'British nobleman who popularized the food', era_class: 'modern', ipa: '?' }
                ],
                cognates: null,
                semanticShift: 'Modern coinage (proper noun → common noun). Named after John Montagu, 4th Earl of Sandwich, who allegedly ate this food while gambling to avoid leaving the table.',
                soundChanges: []
            },
            etymology: {
                word: 'etymology',
                confidence: 88,
                firstRecorded: '1300s',
                path: [
                    { word: 'etymology', lang: 'Modern English', era: '1300–', meaning: 'origin of a word', era_class: 'modern', ipa: 'ɛtɪˈmɑlədʒi' },
                    { word: 'etymologie', lang: 'Old French', era: '1100–1400', meaning: 'true sense of a word', era_class: 'middle', ipa: 'etimolɔdʒi' },
                    { word: 'etymologia', lang: 'Latin', era: '100 BCE–400 CE', meaning: 'true sense', era_class: 'old', ipa: 'etimɔloːdʒia' },
                    { word: 'etymon', lang: 'Greek', era: '500 BCE–', meaning: 'true sense of a word', era_class: 'ancient', ipa: 'ɛtɪmon' },
                    { word: '*et-', lang: 'Proto-IE', era: '4000 BCE–', meaning: 'to be, true', era_class: 'ancient', ipa: 'ɛt' }
                ],
                cognates: { French: 'étymologie', Spanish: 'etimología', German: 'Etymologie' },
                semanticShift: 'Greek etumon (true) + logia (study of). Literally "study of the true sense of words".',
                soundChanges: ['Greek u → Latin o → English y', 'Greek -logia → Latin -logia → English -logy']
            },
            ocean: {
                word: 'ocean',
                confidence: 85,
                firstRecorded: '1300s',
                path: [
                    { word: 'ocean', lang: 'Modern English', era: '1300–', meaning: 'large body of salt water', era_class: 'modern', ipa: 'ˈoʊʃən' },
                    { word: 'ocean', lang: 'Old French', era: '1100–1400', meaning: 'the sea', era_class: 'middle', ipa: 'oːʃan' },
                    { word: 'oceanus', lang: 'Latin', era: '100 BCE–400 CE', meaning: 'the great sea', era_class: 'old', ipa: 'oːkeːanuːs' },
                    { word: 'Ōkeanos', lang: 'Greek (Mythology)', era: '600 BCE–', meaning: 'Titan of the ocean (proper noun)', era_class: 'ancient', ipa: 'oːkeːanoːs' },
                    { word: '(mythological origin)', lang: 'Greek', era: '600 BCE–', meaning: 'possibly from *ok-, "to flow"', era_class: 'ancient', ipa: '?' }
                ],
                cognates: { French: 'océan', Spanish: 'océano', German: 'Ozean', Italian: 'oceano' },
                semanticShift: 'Started as proper noun (Greek god Okeanos) → became common noun for any ocean in Roman period.',
                soundChanges: ['Greek ō → Latin ō → English o', 'Greek -anus → Latin -anus → English -an']
            }
        };

        function toggleMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            const word = document.getElementById('wordInput').value;
            if (word.length >= 3) {
                searchEtymology();
            }
        }

        function searchEtymology() {
            const word = document.getElementById('wordInput').value.toLowerCase().trim();
            const result = document.getElementById('result');

            if (word.length < 3) {
                result.innerHTML = '<div class="error">Please enter at least 3 characters.</div>';
                return;
            }

            const etymology = etymologies[word];

            if (!etymology) {
                result.innerHTML = `<div class="error">Etymology for "${word}" not in database. Try: butterfly, philosophy, person, dog, ocean, strawberry, or sandwich.</div>`;
                return;
            }

            renderEtymology(etymology);
        }

        function renderEtymology(etym) {
            const result = document.getElementById('result');
            let html = '';

            // Stats panel
            html += `
                <div class="stat-box">
                    <strong>First Recorded:</strong> ${etym.firstRecorded} | 
                    <strong>Confidence:</strong> ${etym.confidence}% | 
                    <strong>Root Language:</strong> ${etym.path[etym.path.length - 1].lang}
                </div>
                <div class="stat-box">
                    <strong>Semantic Evolution:</strong> ${etym.semanticShift}
                </div>
            `;

            // Etymology path (tree)
            html += '<div class="tree">';
            etym.path.forEach((node, idx) => {
                const eraClass = node.era_class;
                html += `
                    <div class="tree-node node-${eraClass}">
                        <div class="word-text">${idx === 0 ? '📌' : '→'} ${node.word}</div>
                        <div class="lang-era"><strong>${node.lang}</strong> — ${node.era}</div>
                        <div class="meaning">"${node.meaning}"</div>
                        ${node.ipa ? `<div class="lang-era">IPA: ${node.ipa}</div>` : ''}
                    </div>
                `;
            });
            html += '</div>';

            // Sound changes (if mode enabled)
            if (currentMode === 'soundchanges' && etym.soundChanges.length > 0) {
                html += `
                    <div class="stat-box" style="margin-top: 20px;">
                        <strong>Sound Changes:</strong><br>
                        ${etym.soundChanges.map(change => `• ${change}`).join('<br>')}
                    </div>
                `;
            }

            // Cognates (if mode enabled)
            if (currentMode === 'cognates' && etym.cognates) {
                html += `
                    <div class="cognates" style="margin-top: 20px;">
                        <strong>Cognates (related words in other languages):</strong><br>
                        ${Object.entries(etym.cognates).map(([lang, word]) => `• <strong>${lang}:</strong> ${word}`).join('<br>')}
                    </div>
                `;
            }

            result.innerHTML = html;
        }

        // Allow Enter key to search
        document.getElementById('wordInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchEtymology();
        });

        // Quick tip on load
        window.addEventListener('load', () => {
            const tip = document.querySelector('.loading');
            if (tip) tip.textContent = 'Try: butterfly, philosophy, person, dog, ocean, sandwich, or etymology';
        });
    </script>
</body>
</html>
