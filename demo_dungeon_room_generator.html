<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Room Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #1a1410 0%, #2d241f 100%);
            color: #d4af37;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 950px;
            width: 100%;
            background: #0f0b08;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 2px solid #4a3a2a;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            color: #d4af37;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        .subtitle {
            text-align: center;
            color: #a89060;
            margin-bottom: 30px;
            font-size: 1em;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            color: #c4a560;
            font-size: 0.9em;
            font-weight: bold;
        }

        select, input[type="range"] {
            padding: 8px 12px;
            background: #1a1410;
            border: 1px solid #4a3a2a;
            color: #d4af37;
            border-radius: 4px;
            font-family: 'Georgia', serif;
            font-size: 0.95em;
        }

        .slider-label {
            color: #d4af37;
            font-size: 0.85em;
            font-weight: bold;
        }

        button {
            grid-column: 1 / -1;
            padding: 14px 28px;
            background: linear-gradient(135deg, #d4af37, #c4a560);
            color: #0f0b08;
            border: none;
            border-radius: 4px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Georgia', serif;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .canvas-container {
            background: #1a1410;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #4a3a2a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 420px;
        }

        canvas {
            display: block;
            border-radius: 2px;
        }

        .room-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .detail-section {
            background: #1a1410;
            padding: 18px;
            border-radius: 4px;
            border-left: 3px solid #d4af37;
        }

        .detail-title {
            color: #d4af37;
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .detail-text {
            color: #a89060;
            font-size: 0.95em;
            line-height: 1.6;
        }

        .features {
            list-style: none;
            margin-left: 0;
        }

        .features li {
            color: #a89060;
            padding: 4px 0;
            font-size: 0.95em;
            padding-left: 20px;
            position: relative;
        }

        .features li:before {
            content: "⚔️";
            position: absolute;
            left: 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .stat-box {
            background: #2d241f;
            padding: 12px;
            border-radius: 3px;
            border: 1px solid #4a3a2a;
            text-align: center;
        }

        .stat-value {
            color: #d4af37;
            font-size: 1.3em;
            font-weight: bold;
        }

        .stat-label {
            color: #8a7a60;
            font-size: 0.8em;
            margin-top: 4px;
        }

        @media (max-width: 800px) {
            .controls {
                grid-template-columns: 1fr;
            }

            button {
                grid-column: 1;
            }

            .room-details {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ Dungeon Room Generator</h1>
        <p class="subtitle">Procedurally craft unique fantasy dungeon chambers</p>

        <div class="controls">
            <div class="control-group">
                <label for="roomType">Room Type</label>
                <select id="roomType" onchange="updateStats()">
                    <option value="chamber">Grand Chamber</option>
                    <option value="throne">Throne Hall</option>
                    <option value="treasury">Treasury Vault</option>
                    <option value="library">Forbidden Library</option>
                    <option value="ritual">Ritual Sanctum</option>
                    <option value="barracks">Barracks</option>
                </select>
            </div>

            <div class="control-group">
                <label for="size">Room Size: <span class="slider-label" id="sizeLabel">Medium</span></label>
                <input type="range" id="size" min="1" max="3" value="2" step="1" oninput="updateStats()">
            </div>

            <div class="control-group">
                <label for="hazard">Hazard Level: <span class="slider-label" id="hazardLabel">Moderate</span></label>
                <input type="range" id="hazard" min="1" max="5" value="2" step="1" oninput="updateStats()">
            </div>

            <button onclick="generateRoom()">Generate Room</button>
        </div>

        <div class="canvas-container">
            <canvas id="dungeonCanvas" width="500" height="400"></canvas>
        </div>

        <div class="room-details">
            <div class="detail-section">
                <div class="detail-title">Room Description</div>
                <div class="detail-text" id="description">A vast chamber awaits exploration...</div>
            </div>

            <div class="detail-section">
                <div class="detail-title">Features & Encounters</div>
                <ul class="features" id="features">
                    <li>Stone pillars</li>
                    <li>Carved stonework</li>
                </ul>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-value" id="dimensions">40×30</div>
                <div class="stat-label">Dimensions (ft)</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="obstacleCount">3</div>
                <div class="stat-label">Obstacles</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="trapCount">1</div>
                <div class="stat-label">Traps</div>
            </div>
        </div>
    </div>

    <script>
        const roomTemplates = {
            chamber: {
                name: 'Grand Chamber',
                baseSize: 40,
                features: ['Soaring vaulted ceiling', 'Ancient stone columns', 'Echoing acoustics', 'Weathered carvings'],
                treasures: ['Gold coins', 'Jeweled crown', 'Ancient texts', 'Ceremonial weapons'],
                hazards: ['Unstable floor', 'Poisonous gas vents', 'Collapsing stone', 'Ancient guardians'],
                color: '#b8860b'
            },
            throne: {
                name: 'Throne Hall',
                baseSize: 50,
                features: ['Massive throne of obsidian', 'Marble staircase', 'Royal tapestries', 'Ornate chandeliers'],
                treasures: ['Royal scepter', 'Crown jewels', 'Ancient deed', 'Artifact throne'],
                hazards: ['Animated statues', 'Magical wards', 'Pressure plates', 'Dragon guardian'],
                color: '#8b4513'
            },
            treasury: {
                name: 'Treasury Vault',
                baseSize: 30,
                features: ['Iron reinforced walls', 'Locked chests', 'Gold bars stacked', 'Pressure-sealed door'],
                treasures: ['Mountains of gold', 'Diamond hoard', 'Enchanted gems', 'Legendary coins'],
                hazards: ['Gas traps', 'Blade pendulums', 'Acid pools', 'Timed detonators'],
                color: '#ffd700'
            },
            library: {
                name: 'Forbidden Library',
                baseSize: 35,
                features: ['Towering bookshelves', 'Mystical tomes', 'Arcane circles', 'Floating candles'],
                treasures: ['Spell codex', 'Forbidden knowledge', 'Ancient grimoire', 'Truth serum'],
                hazards: ['Cursed books', 'Magical runes', 'Summoned creatures', 'Knowledge madness'],
                color: '#8b7355'
            },
            ritual: {
                name: 'Ritual Sanctum',
                baseSize: 45,
                features: ['Pentagram floors', 'Skulls and bones', 'Smoking incense', 'Bloodstained altar'],
                treasures: ['Cursed artifact', 'Dark tome', 'Soul crystal', 'Ritual reagents'],
                hazards: ['Summoned demons', 'Curse aura', 'Blood ritual', 'Ethereal beings'],
                color: '#8b0000'
            },
            barracks: {
                name: 'Barracks',
                baseSize: 40,
                features: ['Weapon racks', 'Training dummies', 'Cot rows', 'Armor on stands'],
                treasures: ['Fine weapons', 'Armor sets', 'Military map', 'Commander\'s journal'],
                hazards: ['Sleeping soldiers', 'Guard patrols', 'Tripwires', 'Alarm bells'],
                color: '#4a4a4a'
            }
        };

        function generateRoom() {
            const roomType = document.getElementById('roomType').value;
            const sizeLevel = parseInt(document.getElementById('size').value);
            const hazardLevel = parseInt(document.getElementById('hazard').value);

            const template = roomTemplates[roomType];
            const width = template.baseSize + (sizeLevel - 1) * 20;
            const height = Math.floor(template.baseSize * 0.75) + (sizeLevel - 1) * 15;

            const obstacles = Math.floor(2 + sizeLevel + hazardLevel * 0.5);
            const traps = Math.floor(hazardLevel * 0.6);

            document.getElementById('dimensions').textContent = `${width}×${height}`;
            document.getElementById('obstacleCount').textContent = obstacles;
            document.getElementById('trapCount').textContent = traps;

            // Generate description
            const sizeWords = ['cramped', 'moderate', 'expansive'];
            const hazardWords = ['safe', 'cautious', 'dangerous', 'perilous', 'deadly'];
            const desc = `A ${sizeWords[sizeLevel - 1]} ${template.name.toLowerCase()} shrouded in ${hazardWords[hazardLevel - 1]} conditions. ${template.features[Math.floor(Math.random() * template.features.length)]}. Treasures rumored: ${template.treasures[Math.floor(Math.random() * template.treasures.length)]}.`;
            document.getElementById('description').textContent = desc;

            // Generate features
            const selectedFeatures = template.features.sort(() => Math.random() - 0.5).slice(0, Math.min(3, template.features.length));
            const selectedHazards = template.hazards.sort(() => Math.random() - 0.5).slice(0, Math.min(2, hazardLevel));
            const allFeatures = [...selectedFeatures, ...selectedHazards];

            document.getElementById('features').innerHTML = allFeatures.map(f => `<li>${f}</li>`).join('');

            // Draw room
            drawRoom(width, height, obstacles, traps, template.color);
        }

        function drawRoom(width, height, obstacles, traps, color) {
            const canvas = document.getElementById('dungeonCanvas');
            const ctx = canvas.getContext('2d');
            const scale = Math.min(canvas.width / (width + 20), canvas.height / (height + 20));

            ctx.fillStyle = '#1a1410';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const offsetX = (canvas.width - width * scale) / 2;
            const offsetY = (canvas.height - height * scale) / 2;

            // Draw outer walls
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.strokeRect(offsetX, offsetY, width * scale, height * scale);

            // Draw columns (obstacles)
            ctx.fillStyle = color;
            for (let i = 0; i < obstacles; i++) {
                const cx = offsetX + 15 * scale + (Math.random() * (width - 30) * scale);
                const cy = offsetY + 15 * scale + (Math.random() * (height - 30) * scale);
                const cw = (5 + Math.random() * 10) * scale;
                const ch = (5 + Math.random() * 10) * scale;
                ctx.fillRect(cx, cy, cw, ch);
            }

            // Draw trap markers
            ctx.fillStyle = '#ff6b6b';
            for (let i = 0; i < traps; i++) {
                const tx = offsetX + 20 * scale + (Math.random() * (width - 40) * scale);
                const ty = offsetY + 20 * scale + (Math.random() * (height - 40) * scale);
                ctx.beginPath();
                ctx.arc(tx, ty, 4 * scale, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw entrance
            ctx.fillStyle = '#d4af37';
            ctx.fillRect(offsetX - 2, offsetY + height * scale / 2 - 5 * scale, 8, 10 * scale);
        }

        function updateStats() {
            const sizeMap = { 1: 'Small', 2: 'Medium', 3: 'Large' };
            const hazardMap = { 1: 'Safe', 2: 'Moderate', 3: 'Dangerous', 4: 'Perilous', 5: 'Deadly' };

            document.getElementById('sizeLabel').textContent = sizeMap[document.getElementById('size').value];
            document.getElementById('hazardLabel').textContent = hazardMap[document.getElementById('hazard').value];
        }

        // Initialize
        updateStats();
        generateRoom();
    </script>
</body>
</html>
