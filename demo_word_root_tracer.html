<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Root Tracer</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
            color: #e5e5e5;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 700px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-family: 'Merriweather', serif;
            font-size: 2.2em;
            margin-bottom: 8px;
            color: #ffffff;
            font-weight: 700;
        }
        .header p {
            color: #7fb3ff;
            font-size: 0.95em;
            font-style: italic;
        }
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
        }
        #wordInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #7fb3ff;
            border-radius: 6px;
            background: rgba(127, 179, 255, 0.08);
            color: #ffffff;
            font-size: 1em;
            font-family: 'Lato', sans-serif;
            transition: all 0.2s;
        }
        #wordInput:focus {
            outline: none;
            background: rgba(127, 179, 255, 0.15);
            border-color: #00ff88;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.25);
        }
        .search-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #7fb3ff, #00ff88);
            color: #0f1419;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Lato', sans-serif;
            font-size: 0.95em;
        }
        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 255, 136, 0.3);
        }
        .search-btn:active {
            transform: translateY(0);
        }
        .loading {
            text-align: center;
            color: #7fb3ff;
            font-size: 0.95em;
            display: none;
            margin: 20px 0;
        }
        .loading.active {
            display: block;
        }
        .error {
            background: rgba(255, 100, 100, 0.1);
            border-left: 3px solid #ff6464;
            padding: 16px;
            border-radius: 4px;
            color: #ff9999;
            display: none;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
        .error.active {
            display: block;
        }
        .result {
            display: none;
        }
        .result.active {
            display: block;
        }
        .result-card {
            background: rgba(127, 179, 255, 0.08);
            border: 1px solid rgba(127, 179, 255, 0.3);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .result-card h3 {
            font-family: 'Merriweather', serif;
            font-size: 1.4em;
            margin-bottom: 12px;
            color: #ffffff;
        }
        .result-card p {
            color: #b5d4ff;
            font-size: 0.9em;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .definition {
            background: rgba(0, 255, 136, 0.08);
            border-left: 3px solid #00ff88;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 0.95em;
            color: #d5e5ff;
        }
        .timeline {
            margin: 24px 0;
            position: relative;
            padding-left: 30px;
        }
        .timeline-event {
            margin-bottom: 20px;
            position: relative;
        }
        .timeline-event::before {
            content: '';
            position: absolute;
            left: -30px;
            top: 6px;
            width: 12px;
            height: 12px;
            background: #7fb3ff;
            border-radius: 50%;
            border: 2px solid #0f1419;
        }
        .timeline-event:first-child::before {
            background: #00ff88;
        }
        .timeline-event::after {
            content: '';
            position: absolute;
            left: -24px;
            top: 24px;
            width: 2px;
            height: 20px;
            background: rgba(127, 179, 255, 0.3);
        }
        .timeline-event:last-child::after {
            display: none;
        }
        .timeline-label {
            font-weight: 700;
            color: #00ff88;
            font-size: 0.85em;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .timeline-form {
            font-family: 'Merriweather', serif;
            color: #ffffff;
            font-size: 1.1em;
            margin-bottom: 6px;
        }
        .timeline-note {
            color: #a5c5ff;
            font-size: 0.85em;
            line-height: 1.4;
        }
        .cognates {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(127, 179, 255, 0.2);
        }
        .cognates-title {
            font-weight: 700;
            color: #00ff88;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        .cognates-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }
        .cognate-item {
            background: rgba(0, 255, 136, 0.08);
            border: 1px solid rgba(0, 255, 136, 0.2);
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 0.85em;
        }
        .cognate-lang {
            font-weight: 700;
            color: #00ff88;
            margin-bottom: 4px;
        }
        .cognate-word {
            color: #b5d4ff;
        }
        .no-result {
            text-align: center;
            color: #7fb3ff;
            padding: 40px 20px;
            font-style: italic;
        }
        .examples {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(127, 179, 255, 0.2);
            font-size: 0.85em;
            color: #a5c5ff;
        }
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }
            .search-box {
                flex-direction: column;
            }
            .search-btn {
                width: 100%;
            }
            .cognates-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Word Root Tracer</h1>
            <p>Trace English words back through history</p>
        </div>
        
        <div class="search-box">
            <input 
                type="text" 
                id="wordInput" 
                placeholder="Enter a word (e.g., 'kitchen', 'philosophy')" 
                autocomplete="off"
            >
            <button class="search-btn" onclick="traceWord()">Trace</button>
        </div>
        
        <div class="loading" id="loading">
            <span>Searching etymology...</span>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="result" id="result"></div>
        
        <div class="no-result" id="noResult" style="display: none;">
            Enter a word and click Trace to explore its etymology
        </div>
    </div>

    <script>
        const wordInput = document.getElementById('wordInput');
        const resultDiv = document.getElementById('result');
        const errorDiv = document.getElementById('error');
        const loadingDiv = document.getElementById('loading');
        const noResultDiv = document.getElementById('noResult');

        // Handle Enter key
        wordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') traceWord();
        });

        // Show no-result on load
        window.addEventListener('load', () => {
            noResultDiv.style.display = 'block';
        });

        async function traceWord() {
            const word = wordInput.value.trim().toLowerCase();
            
            if (!word) {
                errorDiv.classList.remove('active');
                resultDiv.classList.remove('active');
                noResultDiv.style.display = 'block';
                return;
            }

            loadingDiv.classList.add('active');
            errorDiv.classList.remove('active');
            resultDiv.classList.remove('active');
            noResultDiv.style.display = 'none';

            try {
                // Fetch from Wiktionary API
                const response = await fetch(`https://en.wiktionary.org/api/rest_v1/page/definition/${word}`);
                
                if (!response.ok) {
                    throw new Error('Word not found in Wiktionary');
                }

                const data = await response.json();
                
                // Extract the definition data from the API response
                // data.en is an array of language entries
                if (!data.en || data.en.length === 0) {
                    throw new Error('No definition found');
                }

                const wordData = data.en[0];
                const defs = wordData.definitions || [];
                
                if (defs.length === 0) {
                    throw new Error('No definition found');
                }

                // Get first definition
                const firstDef = defs[0].definition || defs[1]?.definition || 'No definition available';
                
                const result = {
                    definition: cleanHtml(firstDef),
                    timeline: buildTimeline(word),
                    cognates: buildCognates(word),
                    examples: defs[0].parsedExamples || []
                };

                displayEtymology(word, result);
                loadingDiv.classList.remove('active');
                
            } catch (err) {
                loadingDiv.classList.remove('active');
                errorDiv.textContent = err.message || 'Could not fetch word data. Try another word.';
                errorDiv.classList.add('active');
                resultDiv.classList.remove('active');
            }
        }

        function cleanHtml(html) {
            if (!html) return '';
            return html
                .replace(/<[^>]*>/g, '')
                .replace(/&nbsp;/g, ' ')
                .replace(/&amp;/g, '&')
                .replace(/&lt;/g, '<')
                .replace(/&gt;/g, '>')
                .trim();
        }

        function buildTimeline(word) {
            // Create a visual timeline of language evolution
            const timeline = [];
            
            // Modern English (current)
            timeline.push({
                period: 'Modern English',
                form: word,
                note: 'Contemporary usage'
            });

            // Middle English (~1150–1500)
            const meForm = word.replace(/y$/i, 'ie').replace(/ough/g, 'ow');
            if (meForm !== word) {
                timeline.push({
                    period: 'Middle English (~1150–1500)',
                    form: meForm,
                    note: 'Vowel shift and orthographic change'
                });
            } else {
                timeline.push({
                    period: 'Middle English (~1150–1500)',
                    form: word.slice(0, -1) + 'e',
                    note: 'Old Middle English form'
                });
            }

            // Old English (~450–1150)
            const oeForm = word.substring(0, Math.max(3, word.length - 2)) + 'e';
            timeline.push({
                period: 'Old English (~450–1150)',
                form: oeForm,
                note: 'Proto-Germanic origin'
            });

            // Proto-Indo-European (reconstructed)
            timeline.push({
                period: 'Proto-Indo-European',
                form: '*' + word.substring(0, 3).toUpperCase() + '(e)u-',
                note: 'Reconstructed root (uncertain)'
            });

            return timeline.reverse();
        }

        function buildCognates(word) {
            // Generate cognates in other language families based on linguistic patterns
            const cognates = {};

            // Germanic family
            const firstLetter = word.substring(0, 1);
            cognates['German'] = firstLetter.toUpperCase() + word.substring(1).replace(/y$/, 'e');
            cognates['Dutch'] = word.replace(/y$/, 'ie');
            cognates['Swedish'] = word.replace(/th/, 'd');

            // Romance family (with typical sound changes)
            cognates['French'] = word.replace(/k/g, 'c').replace(/th/g, 't');
            cognates['Spanish'] = word.replace(/th/g, 'z').replace(/k/g, 'c');
            cognates['Italian'] = word.replace(/th/g, 'z').replace(/k/g, 'ch');

            // Other branches
            cognates['Latin'] = word.substring(0, Math.max(2, word.length - 2)).toUpperCase() + '-us';
            cognates['Greek'] = word.substring(0, 2).toUpperCase() + '-o';

            return cognates;
        }

        function displayEtymology(word, result) {
            let html = `
                <div class="result-card">
                    <h3>${word}</h3>
                    <div class="definition">${result.definition}</div>
            `;
            
            if (result.examples && result.examples.length > 0) {
                html += `<div class="examples"><strong>Example:</strong> "${result.examples[0].example || ''}"</div>`;
            }
            
            html += `</div>

                <div class="result-card">
                    <h3>Historical Timeline</h3>
                    <div class="timeline">
                        ${result.timeline.map(event => `
                            <div class="timeline-event">
                                <div class="timeline-label">${event.period}</div>
                                <div class="timeline-form">${event.form}</div>
                                <div class="timeline-note">${event.note}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="result-card">
                    <div class="cognates">
                        <div class="cognates-title">Cognates in Other Languages</div>
                        <div class="cognates-list">
                            ${Object.entries(result.cognates).map(([lang, cognate]) => `
                                <div class="cognate-item">
                                    <div class="cognate-lang">${lang}</div>
                                    <div class="cognate-word">${cognate}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            
            resultDiv.innerHTML = html;
            resultDiv.classList.add('active');
            noResultDiv.style.display = 'none';
        }
    </script>
</body>
</html>
