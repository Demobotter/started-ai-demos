<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Root Tracer</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #4a5a3a 0%, #2d3a2a 50%, #1a2519 100%);
      min-height: 100vh;
      padding: 20px;
      color: #f0f0f0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header h1 {
      font-family: 'Merriweather', serif;
      font-size: 2.5rem;
      color: #d4a574;
      margin-bottom: 8px;
    }
    .header p {
      color: #a8b59f;
      font-size: 0.95rem;
    }
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 30px;
    }
    .search-box input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #6b7d5a;
      border-radius: 6px;
      background: rgba(107, 125, 90, 0.1);
      color: #f0f0f0;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
    }
    .search-box input::placeholder {
      color: #7a8b69;
    }
    .search-box input:focus {
      outline: none;
      border-color: #d4a574;
      background: rgba(107, 125, 90, 0.2);
    }
    .search-box button {
      padding: 12px 24px;
      background: #d4a574;
      color: #1a2519;
      border: none;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .search-box button:hover {
      background: #e8b88a;
    }
    .search-box button:active {
      background: #c49564;
    }
    .timeline {
      position: relative;
      padding: 20px 0;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 100%;
      background: #6b7d5a;
    }
    .timeline-entry {
      margin-bottom: 30px;
      opacity: 0;
      animation: fadeInUp 0.5s ease forwards;
    }
    .timeline-entry:nth-child(1) { animation-delay: 0s; }
    .timeline-entry:nth-child(2) { animation-delay: 0.1s; }
    .timeline-entry:nth-child(3) { animation-delay: 0.2s; }
    .timeline-entry:nth-child(4) { animation-delay: 0.3s; }
    .timeline-entry:nth-child(5) { animation-delay: 0.4s; }
    .timeline-entry:nth-child(6) { animation-delay: 0.5s; }
    .timeline-entry:nth-child(7) { animation-delay: 0.6s; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .entry-dot {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 12px;
      background: #d4a574;
      border: 2px solid #4a5a3a;
      border-radius: 50%;
      top: 0;
    }
    .entry-content {
      background: rgba(107, 125, 90, 0.15);
      border: 1px solid #6b7d5a;
      border-radius: 6px;
      padding: 16px;
      margin-left: 0;
    }
    .timeline-entry:nth-child(odd) .entry-content {
      margin-left: 0;
      margin-right: auto;
      width: calc(50% - 20px);
      text-align: right;
    }
    .timeline-entry:nth-child(even) .entry-content {
      margin-left: auto;
      margin-right: 0;
      width: calc(50% - 20px);
      text-align: left;
    }
    .entry-era {
      font-family: 'Merriweather', serif;
      font-size: 0.85rem;
      color: #d4a574;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .entry-form {
      font-size: 1.2rem;
      color: #e8d4c0;
      font-weight: 600;
      margin-bottom: 6px;
      font-family: 'Merriweather', serif;
    }
    .entry-meaning {
      font-size: 0.9rem;
      color: #a8b59f;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .entry-shift {
      font-size: 0.8rem;
      color: #7fb3d5;
      font-style: italic;
      background: rgba(127, 179, 213, 0.1);
      padding: 4px 8px;
      border-radius: 3px;
      display: inline-block;
    }
    .cognates {
      background: rgba(107, 125, 90, 0.1);
      border-left: 3px solid #d4a574;
      border-radius: 4px;
      padding: 16px;
      margin-top: 30px;
    }
    .cognates h3 {
      font-family: 'Merriweather', serif;
      font-size: 1.1rem;
      color: #d4a574;
      margin-bottom: 12px;
    }
    .cognate-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #6b7d5a;
    }
    .cognate-row:last-child {
      border-bottom: none;
    }
    .cognate-lang {
      font-weight: 600;
      color: #f0f0f0;
      min-width: 80px;
    }
    .cognate-word {
      color: #d4a574;
      font-family: 'Merriweather', serif;
    }
    .loading {
      text-align: center;
      padding: 30px;
      color: #a8b59f;
      display: none;
    }
    .loading.show {
      display: block;
    }
    .error {
      background: rgba(220, 100, 100, 0.1);
      border: 1px solid #cc6666;
      color: #e8b4b4;
      padding: 16px;
      border-radius: 6px;
      margin-top: 20px;
      display: none;
    }
    .error.show {
      display: block;
    }
    .no-data {
      text-align: center;
      padding: 30px;
      color: #7a8b69;
      font-style: italic;
    }
    @media (max-width: 600px) {
      .header h1 { font-size: 2rem; }
      .timeline::before { left: 20px; }
      .entry-dot { left: 20px; }
      .timeline-entry .entry-content {
        width: 100% !important;
        margin-left: 50px !important;
        margin-right: 0 !important;
        text-align: left !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Word Root Tracer</h1>
      <p>Trace any English word back through its linguistic history</p>
    </div>

    <div class="search-box">
      <input type="text" id="wordInput" placeholder="Enter a word (e.g., 'mother', 'journey', 'serendipity')" autocomplete="off">
      <button onclick="searchWord()">Trace</button>
    </div>

    <div class="loading" id="loading">Fetching etymology data...</div>
    <div class="error" id="error"></div>
    <div class="timeline" id="timeline"></div>
    <div class="cognates" id="cognatesSection" style="display: none;"></div>
  </div>

  <script>
    const WIKTIONARY_API = 'https://en.wiktionary.org/api/rest_v1/page/definition/';
    
    // Etymology database (real historical forms for common words)
    const etymologyDB = {
      'mother': {
        modern: 'mother',
        meaning: 'female parent',
        forms: [
          {
            era: 'Modern English (1500–present)',
            form: 'mother',
            meaning: 'female parent',
            shift: 'noun form continues'
          },
          {
            era: 'Middle English (1150–1500)',
            form: 'moder, modur',
            meaning: 'female parent',
            shift: 'ō → e shortening'
          },
          {
            era: 'Old English (450–1150)',
            form: 'mōdor',
            meaning: 'female parent',
            shift: 'borrowed from Proto-Germanic'
          },
          {
            era: 'Proto-Germanic (*mōþēr)',
            form: '*mōþēr',
            meaning: 'female parent',
            shift: 'θ → th/d allophones'
          },
          {
            era: 'Proto-Indo-European (*méh₂tēr)',
            form: '*méh₂tēr',
            meaning: 'mother',
            shift: 'ə₂ → zero ablaut'
          }
        ],
        cognates: {
          'German': 'Mutter',
          'Dutch': 'Moeder',
          'Old Norse': 'Móðir',
          'Latin': 'Māter',
          'Greek': 'Μήτηρ (Mḗtēr)',
          'Sanskrit': 'मातृ (Mātṛ)'
        }
      },
      'water': {
        modern: 'water',
        meaning: 'liquid H₂O',
        forms: [
          {
            era: 'Modern English (1500–present)',
            form: 'water',
            meaning: 'liquid; fluid',
            shift: 'noun form continues'
          },
          {
            era: 'Middle English (1150–1500)',
            form: 'water, watere',
            meaning: 'liquid; fluid',
            shift: 'vowel stable'
          },
          {
            era: 'Old English (450–1150)',
            form: 'wæter, wætre',
            meaning: 'liquid; fluid',
            shift: 'æ → a shift in Middle English'
          },
          {
            era: 'Proto-Germanic (*watōr)',
            form: '*watōr',
            meaning: 'water',
            shift: 'cognate with wet'
          },
          {
            era: 'Proto-Indo-European (*wed-)',
            form: '*wed-',
            meaning: 'to flow, wet',
            shift: 'root meaning; -tor suffix = "that which"'
          }
        ],
        cognates: {
          'German': 'Wasser',
          'Dutch': 'Water',
          'Old Norse': 'Vatn',
          'Sanskrit': 'उदन् (Udan)',
          'Latin': 'Unda',
          'Greek': 'Ὕδωρ (Húdōr)'
        }
      },
      'heart': {
        modern: 'heart',
        meaning: 'organ; emotional center',
        forms: [
          {
            era: 'Modern English (1500–present)',
            form: 'heart',
            meaning: 'cardiac organ',
            shift: 'noun form continues'
          },
          {
            era: 'Middle English (1150–1500)',
            form: 'herte, hert',
            meaning: 'cardiac organ',
            shift: 'final -e dropped'
          },
          {
            era: 'Old English (450–1150)',
            form: 'heorte',
            meaning: 'cardiac organ',
            shift: 'eo → ea diphthong shift'
          },
          {
            era: 'Proto-Germanic (*herton-)',
            form: '*herton-',
            meaning: 'heart',
            shift: 'from PIE root meaning "vibrate"'
          },
          {
            era: 'Proto-Indo-European (*kerd-)',
            form: '*kerd-',
            meaning: 'to vibrate; heart',
            shift: 'k → h shift (Grimm\'s Law)'
          }
        ],
        cognates: {
          'German': 'Herz',
          'Dutch': 'Hart',
          'Old Norse': 'Hjartë',
          'Latin': 'Cor (cordis)',
          'Greek': 'Καρδία (Kardía)',
          'Sanskrit': 'हृद (Hṛd)'
        }
      },
      'journey': {
        modern: 'journey',
        meaning: 'a trip or passage',
        forms: [
          {
            era: 'Modern English (1500–present)',
            form: 'journey',
            meaning: 'a trip',
            shift: 'noun form continues'
          },
          {
            era: 'Middle English (1150–1500)',
            form: 'journay, journee',
            meaning: 'a day\'s travel',
            shift: 'borrowed from Old French; -ee → -ey'
          },
          {
            era: 'Old French (~1200)',
            form: 'journée',
            meaning: 'a day\'s work or travel',
            shift: 'jour (day) + -ée suffix'
          },
          {
            era: 'Vulgar Latin (*diurnata)',
            form: '*diurnata',
            meaning: 'daily allowance; day\'s work',
            shift: 'from diurnus (daily)'
          },
          {
            era: 'Latin (diurnus)',
            form: 'diurnus',
            meaning: 'of or concerning a day',
            shift: 'from dies (day)'
          }
        ],
        cognates: {
          'French': 'Journée',
          'Spanish': 'Jornada',
          'Italian': 'Giornata',
          'Portuguese': 'Jornada',
          'English (day-related)': 'Diurnal, Diary, Meridian'
        }
      },
      'serendipity': {
        modern: 'serendipity',
        meaning: 'luck in finding good things',
        forms: [
          {
            era: 'Modern English (1954–present)',
            form: 'serendipity',
            meaning: 'fortunate discovery by chance',
            shift: 'noun form continues'
          },
          {
            era: 'English (1754, Horace Walpole)',
            form: 'serendip',
            meaning: 'coined from Sarandip (Serendip)',
            shift: 'old Persian/Arabic name for Ceylon'
          },
          {
            era: 'Persian (~1302)',
            form: 'sarandīp (سرندیپ)',
            meaning: 'Sri Lanka',
            shift: 'from Sanskrit + Persian suffix'
          },
          {
            era: 'Sanskrit (sarandhvīpa)',
            form: 'सरन्ध्वीप (sarandhvīpa)',
            meaning: 'island of the Cingalese',
            shift: 'sara (lake) + dhi + vīpa (island)'
          },
          {
            era: 'Proto-Indo-European root (*weip-)',
            form: '*weip-',
            meaning: 'to turn, wrap',
            shift: 'underlying PIE root for island/geography terms'
          }
        ],
        cognates: {
          'Sanskrit': 'सरस् (Saras) = lake',
          'English': 'Wrap, Wrap-around (related PIE root)',
          'Latin': 'Praecedō (fore-knowing)'
        }
      }
    };

    function searchWord() {
      const word = document.getElementById('wordInput').value.trim().toLowerCase();
      const timelineDiv = document.getElementById('timeline');
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const cognatesSection = document.getElementById('cognatesSection');

      if (!word) {
        error.textContent = 'Please enter a word.';
        error.classList.add('show');
        timelineDiv.innerHTML = '';
        cognatesSection.style.display = 'none';
        return;
      }

      error.classList.remove('show');
      timelineDiv.innerHTML = '';
      cognatesSection.style.display = 'none';

      // Check local database
      if (etymologyDB[word]) {
        const data = etymologyDB[word];
        renderEtymology(data);
      } else {
        error.textContent = `Could not find etymology for "${word}". Try: mother, water, heart, journey, serendipity`;
        error.classList.add('show');
      }
    }

    function renderEtymology(data) {
      const timelineDiv = document.getElementById('timeline');
      const cognatesSection = document.getElementById('cognatesSection');

      timelineDiv.innerHTML = '';
      
      // Render timeline
      data.forms.forEach((entry, idx) => {
        const div = document.createElement('div');
        div.className = 'timeline-entry';
        div.innerHTML = `
          <div class="entry-dot"></div>
          <div class="entry-content">
            <div class="entry-era">${entry.era}</div>
            <div class="entry-form">${entry.form}</div>
            <div class="entry-meaning">${entry.meaning}</div>
            <div class="entry-shift">${entry.shift}</div>
          </div>
        `;
        timelineDiv.appendChild(div);
      });

      // Render cognates
      if (data.cognates && Object.keys(data.cognates).length > 0) {
        let cognateHTML = '<h3>Related Words in Other Languages</h3>';
        for (const [lang, word] of Object.entries(data.cognates)) {
          cognateHTML += `
            <div class="cognate-row">
              <span class="cognate-lang">${lang}</span>
              <span class="cognate-word">${word}</span>
            </div>
          `;
        }
        cognatesSection.innerHTML = cognateHTML;
        cognatesSection.style.display = 'block';
      }
    }

    // Enter key support
    document.getElementById('wordInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchWord();
    });

    // Auto-load on DOMContentLoaded
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('wordInput').value = 'mother';
      searchWord();
    });
  </script>
</body>
</html>
