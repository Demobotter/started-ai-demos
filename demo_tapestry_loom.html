<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tapestry Loom</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Lato:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Lato', sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
      min-height: 100vh;
      padding: 20px;
      color: #f5f1e8;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    h1 {
      font-family: 'Poppins', sans-serif;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5rem;
      color: #d4a574;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 30px;
    }
    @media (max-width: 1024px) {
      .layout { grid-template-columns: 1fr; }
    }
    .panel {
      background: #222;
      border: 1px solid #444;
      padding: 20px;
      border-radius: 8px;
    }
    .control-group {
      margin-bottom: 20px;
    }
    .control-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #d4a574;
      font-family: 'Poppins', sans-serif;
    }
    .control-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }
    .btn {
      flex: 1;
      min-width: 90px;
      padding: 10px;
      background: #1a4d7a;
      color: #f5f1e8;
      border: 2px solid #00a8cc;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #00a8cc;
      color: #1a1a1a;
    }
    .btn.active {
      background: #00a8cc;
      color: #1a1a1a;
      border-color: #d4a574;
    }
    .slider-container {
      margin-bottom: 15px;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #333;
      outline: none;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #00a8cc;
      cursor: pointer;
      transition: all 0.1s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      background: #d4a574;
      transform: scale(1.2);
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #00a8cc;
      cursor: pointer;
      border: none;
    }
    .slider-value {
      display: inline-block;
      margin-left: 10px;
      color: #00a8cc;
      font-weight: 600;
    }
    .color-picker-group {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
    }
    .color-input {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }
    input[type="color"] {
      width: 50px;
      height: 50px;
      border: 2px solid #00a8cc;
      border-radius: 4px;
      cursor: pointer;
    }
    .stats-panel {
      background: #1a1a1a;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #333;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #333;
    }
    .stat-row:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }
    .stat-label {
      color: #999;
      font-size: 0.9rem;
    }
    .stat-value {
      color: #d4a574;
      font-weight: 600;
    }
    canvas {
      display: block;
      border: 2px solid #444;
      background: #f5f1e8;
      border-radius: 6px;
      margin-bottom: 15px;
      width: 100%;
      height: 400px;
    }
    .preview-label {
      color: #d4a574;
      font-family: 'Poppins', sans-serif;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .tapestry-preview {
      border: 2px solid #444;
      border-radius: 6px;
      background: #f5f1e8;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧵 Tapestry Loom</h1>
    
    <div class="layout">
      <!-- Left Panel: Controls -->
      <div class="panel">
        <div class="control-group">
          <label>Weave Type</label>
          <div class="control-buttons">
            <button class="btn active" data-weave="plain">Plain</button>
            <button class="btn" data-weave="twill">Twill</button>
            <button class="btn" data-weave="satin">Satin</button>
            <button class="btn" data-weave="herringbone">Herringbone</button>
          </div>
        </div>

        <div class="slider-container">
          <label>Warp Threads (Density): <span class="slider-value" id="threadCountValue">20</span></label>
          <input type="range" id="threadCount" min="4" max="50" value="20">
        </div>

        <div class="slider-container">
          <label>Thread Color 1</label>
          <input type="color" id="color1" value="#1a4d7a">
        </div>

        <div class="slider-container">
          <label>Thread Color 2</label>
          <input type="color" id="color2" value="#8b2e2e">
        </div>

        <div class="slider-container">
          <label>Blend Mode</label>
          <div class="control-buttons">
            <button class="btn active" data-blend="overlay">Overlay</button>
            <button class="btn" data-blend="screen">Screen</button>
            <button class="btn" data-blend="multiply">Multiply</button>
          </div>
        </div>

        <div class="slider-container">
          <label>Weaving Speed: <span class="slider-value" id="speedValue">1.0x</span></label>
          <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
        </div>

        <div class="stats-panel">
          <div class="stat-row">
            <span class="stat-label">Weave Type</span>
            <span class="stat-value" id="statWeave">Plain</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Warp Threads</span>
            <span class="stat-value" id="statWarp">20</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Pattern Density (TPI)</span>
            <span class="stat-value" id="statDensity">8.0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Float Length</span>
            <span class="stat-value" id="statFloat">1</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Complexity</span>
            <span class="stat-value" id="statComplex">25%</span>
          </div>
        </div>
      </div>

      <!-- Right Panel: Loom Visualization -->
      <div class="panel">
        <canvas id="loomCanvas"></canvas>
        <div class="preview-label">Finished Tapestry Preview</div>
        <div class="tapestry-preview">
          <canvas id="tapestryPreview" style="width: 100%; height: 150px; border: 1px dashed #999; border-radius: 4px;"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Color conversion utilities
    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
      } : { r: 0, g: 0, b: 0 };
    }

    function rgbToString(r, g, b) {
      return `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`;
    }

    // Weave pattern definitions (real geometric patterns)
    const weavePatterns = {
      plain: {
        name: 'Plain Weave',
        floatLength: 1,
        complexity: 25,
        pattern: (warpIdx, weftIdx) => (warpIdx + weftIdx) % 2 === 0 ? 0 : 1
      },
      twill: {
        name: 'Twill',
        floatLength: 2,
        complexity: 50,
        pattern: (warpIdx, weftIdx) => {
          const shift = Math.floor(weftIdx / 2);
          return ((warpIdx + shift) % 4) < 2 ? 0 : 1;
        }
      },
      satin: {
        name: 'Satin',
        floatLength: 4,
        complexity: 75,
        pattern: (warpIdx, weftIdx) => {
          return ((warpIdx + weftIdx * 2) % 5) === 0 ? 1 : 0;
        }
      },
      herringbone: {
        name: 'Herringbone',
        floatLength: 1,
        complexity: 60,
        pattern: (warpIdx, weftIdx) => {
          const period = 4;
          const row = Math.floor(weftIdx / period);
          const colInRow = warpIdx % (period * 2);
          return row % 2 === 0 
            ? (colInRow < period ? 0 : 1)
            : (colInRow < period ? 1 : 0);
        }
      }
    };

    // State
    let state = {
      weaveType: 'plain',
      warpThreads: 20,
      color1: '#1a4d7a',
      color2: '#8b2e2e',
      blendMode: 'overlay',
      speed: 1,
      animationPhase: 0
    };

    // DOM elements
    const canvas = document.getElementById('loomCanvas');
    const ctx = canvas.getContext('2d');
    const tapestryCanvas = document.getElementById('tapestryPreview');
    const tapestryCtx = tapestryCanvas.getContext('2d');

    // Resize canvas
    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width - 40;
      canvas.height = 400;
      
      tapestryCanvas.width = tapestryCanvas.parentElement.offsetWidth - 20;
      tapestryCanvas.height = 150;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Draw loom with threads
    function drawLoom() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const pattern = weavePatterns[state.weaveType];
      const rgb1 = hexToRgb(state.color1);
      const rgb2 = hexToRgb(state.color2);
      
      const threadWidth = canvas.width / (state.warpThreads + 2);
      const threadHeight = canvas.height / (state.warpThreads + 2);
      const startX = threadWidth;
      const startY = threadHeight;

      // Draw grid and weave pattern
      for (let warpIdx = 0; warpIdx < state.warpThreads; warpIdx++) {
        for (let weftIdx = 0; weftIdx < state.warpThreads; weftIdx++) {
          const x = startX + warpIdx * threadWidth;
          const y = startY + weftIdx * threadHeight;
          const isColor1 = pattern.pattern(warpIdx, weftIdx) === 0;
          
          let fillColor;
          if (isColor1) {
            fillColor = rgbToString(rgb1.r, rgb1.g, rgb1.b);
          } else {
            // Simple blend (multiply/overlay approximation)
            let blendR = rgb2.r;
            let blendG = rgb2.g;
            let blendB = rgb2.b;
            
            if (state.blendMode === 'multiply') {
              blendR = Math.round((rgb1.r * rgb2.r) / 255);
              blendG = Math.round((rgb1.g * rgb2.g) / 255);
              blendB = Math.round((rgb1.b * rgb2.b) / 255);
            } else if (state.blendMode === 'screen') {
              blendR = 255 - Math.round((255 - rgb1.r) * (255 - rgb2.r) / 255);
              blendG = 255 - Math.round((255 - rgb1.g) * (255 - rgb2.g) / 255);
              blendB = 255 - Math.round((255 - rgb1.b) * (255 - rgb2.b) / 255);
            } else {
              // overlay
              blendR = rgb1.r > 127 ? 255 - Math.round((255 - rgb1.r) * (255 - rgb2.r) / 255) : Math.round(rgb1.r * rgb2.r / 255);
              blendG = rgb1.g > 127 ? 255 - Math.round((255 - rgb1.g) * (255 - rgb2.g) / 255) : Math.round(rgb1.g * rgb2.g / 255);
              blendB = rgb1.b > 127 ? 255 - Math.round((255 - rgb1.b) * (255 - rgb2.b) / 255) : Math.round(rgb1.b * rgb2.b / 255);
            }
            fillColor = rgbToString(blendR, blendG, blendB);
          }
          
          ctx.fillStyle = fillColor;
          ctx.fillRect(x, y, threadWidth - 1, threadHeight - 1);
          ctx.strokeStyle = '#ddd';
          ctx.lineWidth = 0.5;
          ctx.strokeRect(x, y, threadWidth - 1, threadHeight - 1);
        }
      }

      // Draw shuttle indicator (animated)
      const shuttleY = startY + ((Math.sin(state.animationPhase * 0.05) + 1) / 2) * (state.warpThreads * threadHeight);
      ctx.fillStyle = '#d4a574';
      ctx.fillRect(startX - 20, shuttleY - 5, 15, 10);
      ctx.fillStyle = '#ffd700';
      ctx.fillRect(canvas.width - startX + 5, shuttleY - 5, 15, 10);
    }

    // Draw tapestry preview (smaller version with pattern detail)
    function drawTapestryPreview() {
      tapestryCtx.clearRect(0, 0, tapestryCanvas.width, tapestryCanvas.height);
      const pattern = weavePatterns[state.weaveType];
      const rgb1 = hexToRgb(state.color1);
      const rgb2 = hexToRgb(state.color2);
      
      const cellSize = Math.max(2, tapestryCanvas.width / state.warpThreads);
      
      for (let warpIdx = 0; warpIdx < state.warpThreads; warpIdx++) {
        for (let weftIdx = 0; weftIdx < Math.floor(tapestryCanvas.height / cellSize); weftIdx++) {
          const x = warpIdx * cellSize;
          const y = weftIdx * cellSize;
          const isColor1 = pattern.pattern(warpIdx, weftIdx) === 0;
          
          let fillColor;
          if (isColor1) {
            fillColor = rgbToString(rgb1.r, rgb1.g, rgb1.b);
          } else {
            let blendR = rgb2.r;
            let blendG = rgb2.g;
            let blendB = rgb2.b;
            
            if (state.blendMode === 'multiply') {
              blendR = Math.round((rgb1.r * rgb2.r) / 255);
              blendG = Math.round((rgb1.g * rgb2.g) / 255);
              blendB = Math.round((rgb1.b * rgb2.b) / 255);
            } else if (state.blendMode === 'screen') {
              blendR = 255 - Math.round((255 - rgb1.r) * (255 - rgb2.r) / 255);
              blendG = 255 - Math.round((255 - rgb1.g) * (255 - rgb2.g) / 255);
              blendB = 255 - Math.round((255 - rgb1.b) * (255 - rgb2.b) / 255);
            } else {
              blendR = rgb1.r > 127 ? 255 - Math.round((255 - rgb1.r) * (255 - rgb2.r) / 255) : Math.round(rgb1.r * rgb2.r / 255);
              blendG = rgb1.g > 127 ? 255 - Math.round((255 - rgb1.g) * (255 - rgb2.g) / 255) : Math.round(rgb1.g * rgb2.g / 255);
              blendB = rgb1.b > 127 ? 255 - Math.round((255 - rgb1.b) * (255 - rgb2.b) / 255) : Math.round(rgb1.b * rgb2.b / 255);
            }
            fillColor = rgbToString(blendR, blendG, blendB);
          }
          
          tapestryCtx.fillStyle = fillColor;
          tapestryCtx.fillRect(x, y, cellSize, cellSize);
        }
      }
    }

    // Update stats
    function updateStats() {
      const pattern = weavePatterns[state.weaveType];
      document.getElementById('statWeave').textContent = pattern.name;
      document.getElementById('statWarp').textContent = state.warpThreads;
      document.getElementById('statDensity').textContent = (state.warpThreads / 2.5).toFixed(1);
      document.getElementById('statFloat').textContent = pattern.floatLength;
      document.getElementById('statComplex').textContent = pattern.complexity + '%';
    }

    // Animation loop
    function animate() {
      state.animationPhase += state.speed;
      drawLoom();
      drawTapestryPreview();
      requestAnimationFrame(animate);
    }

    // Event listeners
    document.querySelectorAll('[data-weave]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('[data-weave]').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        state.weaveType = e.target.dataset.weave;
        updateStats();
      });
    });

    document.querySelectorAll('[data-blend]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('[data-blend]').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        state.blendMode = e.target.dataset.blend;
      });
    });

    document.getElementById('threadCount').addEventListener('input', (e) => {
      state.warpThreads = parseInt(e.target.value);
      document.getElementById('threadCountValue').textContent = state.warpThreads;
      updateStats();
    });

    document.getElementById('color1').addEventListener('input', (e) => {
      state.color1 = e.target.value;
    });

    document.getElementById('color2').addEventListener('input', (e) => {
      state.color2 = e.target.value;
    });

    document.getElementById('speed').addEventListener('input', (e) => {
      state.speed = parseFloat(e.target.value);
      document.getElementById('speedValue').textContent = state.speed.toFixed(1) + 'x';
    });

    // Start animation
    updateStats();
    animate();
  </script>
</body>
</html>
