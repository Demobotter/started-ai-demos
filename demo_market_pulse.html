<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Pulse</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f172a; color: #e2e8f0; font-family: 'Inter', sans-serif; padding: 2rem 1rem; }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 1.5rem; text-align: center; }
    .gauge-box { background: #1e293b; border-radius: 8px; padding: 2rem; margin-bottom: 2rem; text-align: center; }
    .gauge-label { font-size: 0.9rem; color: #94a3b8; margin-bottom: 0.5rem; }
    .gauge-value { font-size: 3rem; font-weight: 700; margin-bottom: 1rem; }
    .gauge-bar { width: 100%; height: 12px; background: #334155; border-radius: 6px; overflow: hidden; margin-bottom: 0.5rem; }
    .gauge-fill { height: 100%; transition: width 0.3s ease, background-color 0.3s ease; }
    .gauge-emoji { font-size: 2rem; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #1e293b; padding: 1rem; text-align: left; font-weight: 600; font-size: 0.85rem; color: #cbd5e1; border-bottom: 1px solid #334155; }
    td { padding: 1rem; border-bottom: 1px solid #334155; }
    tr:hover { background: rgba(255,255,255,0.02); }
    .coin-name { font-weight: 600; }
    .emoji { font-size: 1.2rem; margin-right: 0.5rem; }
    .price { font-family: 'Courier New', monospace; font-size: 0.95rem; }
    .change { font-weight: 600; font-size: 0.95rem; }
    .change.up { color: #10b981; }
    .change.down { color: #ef4444; }
    .loading { text-align: center; color: #64748b; font-size: 0.95rem; }
    .error { color: #fbbf24; padding: 1rem; background: rgba(251,191,36,0.1); border-radius: 6px; }
    .footer { text-align: center; color: #64748b; font-size: 0.8rem; margin-top: 2rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 Market Pulse</h1>
    <div class="gauge-box">
      <div class="gauge-label">CRYPTO FEAR & GREED INDEX</div>
      <div class="gauge-value"><span class="gauge-emoji" id="emoji">😐</span> <span id="fgScore">—</span></div>
      <div class="gauge-bar"><div class="gauge-fill" id="gaugeFill" style="width: 50%;"></div></div>
      <div class="gauge-label" id="status">Loading sentiment…</div>
    </div>
    <table>
      <thead>
        <tr>
          <th>COIN</th>
          <th>PRICE (USD)</th>
          <th>24H CHANGE</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="3" class="loading">Fetching live data…</td></tr>
      </tbody>
    </table>
    <div class="footer">Updates every 60 seconds • Live CoinGecko data</div>
  </div>

  <script>
    const coins = ['bitcoin', 'ethereum', 'solana', 'ripple', 'dogecoin', 'cardano', 'avalanche-2', 'chainlink'];
    const coinDisplay = { bitcoin: 'BTC', ethereum: 'ETH', solana: 'SOL', ripple: 'XRP', dogecoin: 'DOGE', cardano: 'ADA', 'avalanche-2': 'AVAX', chainlink: 'LINK' };

    async function fetchFearGreedIndex() {
      try {
        const r = await fetch('https://api.alternative.me/fng/?limit=1&format=json', { signal: AbortSignal.timeout(5000) });
        if (!r.ok) throw new Error(`FNG: ${r.status}`);
        const d = await r.json();
        if (!d.data || d.data.length === 0) throw new Error('No FNG data');
        const score = parseInt(d.data[0].value);
        return score;
      } catch (e) {
        console.error('Fear/Greed fetch:', e.message);
        return null;
      }
    }

    async function fetchCryptoPrices() {
      try {
        const ids = coins.join('%2C');
        const r = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_market_cap=false&include_24hr_vol=false&include_24hr_change=true`, { signal: AbortSignal.timeout(8000) });
        if (!r.ok) throw new Error(`CoinGecko: ${r.status}`);
        const d = await r.json();
        return d;
      } catch (e) {
        console.error('CoinGecko fetch:', e.message);
        return null;
      }
    }

    function getScoreStatus(score) {
      if (score < 25) return { emoji: '😱', text: 'Extreme Fear' };
      if (score < 45) return { emoji: '😟', text: 'Fear' };
      if (score < 55) return { emoji: '😐', text: 'Neutral' };
      if (score < 75) return { emoji: '🙂', text: 'Greed' };
      return { emoji: '😍', text: 'Extreme Greed' };
    }

    function getChangeColor(change) {
      return change >= 0 ? 'up' : 'down';
    }

    async function updateData() {
      const [fgScore, priceData] = await Promise.all([fetchFearGreedIndex(), fetchCryptoPrices()]);

      if (fgScore !== null) {
        const status = getScoreStatus(fgScore);
        document.getElementById('fgScore').textContent = fgScore;
        document.getElementById('emoji').textContent = status.emoji;
        document.getElementById('status').textContent = status.text;
        const pct = fgScore;
        const fill = document.getElementById('gaugeFill');
        fill.style.width = pct + '%';
        if (fgScore < 40) fill.style.backgroundColor = '#ef4444';
        else if (fgScore < 60) fill.style.backgroundColor = '#f59e0b';
        else fill.style.backgroundColor = '#10b981';
      }

      if (priceData) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        coins.forEach(id => {
          const d = priceData[id];
          if (!d) return;
          const price = d.usd;
          const change24 = d.usd_24h_change;
          const symbol = coinDisplay[id];
          const changeClass = getChangeColor(change24);
          const changeText = change24 >= 0 ? `+${change24.toFixed(2)}%` : `${change24.toFixed(2)}%`;
          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="coin-name"><span class="emoji">${change24 >= 0 ? '📈' : '📉'}</span>${symbol}</td>
            <td class="price">$${price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
            <td class="change ${changeClass}">${changeText}</td>
          `;
          tbody.appendChild(row);
        });
      }
    }

    updateData();
    setInterval(updateData, 60000);
  </script>
</body>
</html>
