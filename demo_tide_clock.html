<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tidal Window</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a2e4a 0%, #1a4d6d 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: rgba(15, 45, 70, 0.8);
      border-radius: 16px;
      padding: 32px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(100, 180, 220, 0.2);
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      margin-bottom: 8px;
      text-align: center;
      color: #64b4dc;
    }
    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #7fa8c4;
      margin-bottom: 24px;
    }
    .city-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 8px 14px;
      border: 1px solid rgba(100, 180, 220, 0.3);
      background: rgba(25, 60, 90, 0.6);
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }
    button:hover {
      background: rgba(100, 180, 220, 0.2);
      border-color: rgba(100, 180, 220, 0.6);
    }
    button.active {
      background: #64b4dc;
      border-color: #64b4dc;
      color: #0a2e4a;
    }
    .gauge-section {
      margin-bottom: 32px;
    }
    .gauge-label {
      font-size: 13px;
      color: #7fa8c4;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .gauge-container {
      position: relative;
      height: 80px;
      background: rgba(10, 45, 70, 0.5);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(100, 180, 220, 0.15);
    }
    .gauge-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, #00d4ff 0%, #0099cc 100%);
      transition: height 1s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0a2e4a;
      font-weight: 600;
      font-size: 14px;
    }
    .gauge-value {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
      font-weight: 600;
      color: #64b4dc;
      z-index: 2;
    }
    .tide-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .tide-item {
      background: rgba(25, 60, 90, 0.4);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(100, 180, 220, 0.1);
    }
    .tide-item-label {
      font-size: 11px;
      color: #7fa8c4;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .tide-item-value {
      font-size: 18px;
      font-weight: 600;
      color: #64b4dc;
    }
    .tide-item-time {
      font-size: 12px;
      color: #5a8bb0;
      margin-top: 2px;
    }
    .update-time {
      font-size: 11px;
      color: #5a8bb0;
      text-align: center;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌊 Tidal Window</h1>
    <div class="subtitle">Pick a coastal city, watch the tides flow</div>
    
    <div class="city-selector">
      <button class="city-btn active" data-city="London">London</button>
      <button class="city-btn" data-city="New York">New York</button>
      <button class="city-btn" data-city="Sydney">Sydney</button>
      <button class="city-btn" data-city="Tokyo">Tokyo</button>
      <button class="city-btn" data-city="Paris">Paris</button>
      <button class="city-btn" data-city="Rio">Rio</button>
    </div>

    <div class="gauge-section">
      <div class="gauge-label">Current Water Level</div>
      <div class="gauge-container">
        <div class="gauge-fill" id="gaugeFill" style="height: 0%">
          <span id="gaugeValue"></span>
        </div>
        <div class="gauge-value" id="gaugePercent">0%</div>
      </div>
    </div>

    <div class="tide-info">
      <div class="tide-item">
        <div class="tide-item-label">🌊 High Tide</div>
        <div class="tide-item-value" id="highTime">--</div>
        <div class="tide-item-time" id="highHeight">-- m</div>
      </div>
      <div class="tide-item">
        <div class="tide-item-label">🏜️ Low Tide</div>
        <div class="tide-item-value" id="lowTime">--</div>
        <div class="tide-item-time" id="lowHeight">-- m</div>
      </div>
    </div>

    <div class="update-time">Last updated: <span id="updateTime">--</span></div>
  </div>

  <script>
    const cityData = {
      'London': { range: [2.2, 6.8], offset: 0 },
      'New York': { range: [0.8, 2.5], offset: 5 },
      'Sydney': { range: [0.5, 2.2], offset: 2 },
      'Tokyo': { range: [0.3, 2.0], offset: 3 },
      'Paris': { range: [1.8, 6.0], offset: 1 },
      'Rio': { range: [0.3, 1.4], offset: 4 }
    };

    let currentCity = 'London';

    function formatTime(date) {
      return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    }

    function updateTides() {
      const city = currentCity;
      const { range, offset } = cityData[city];
      const [minTide, maxTide] = range;
      const tideRange = maxTide - minTide;

      const now = new Date();
      const timeOfDay = (now.getHours() * 60 + now.getMinutes()) / (24 * 60);
      
      // Tide cycle: ~12h 25m (0.518 cycles per day)
      const tidePhase = ((timeOfDay + offset / 24) * Math.PI * 2) % (Math.PI * 2);
      const currentLevel = minTide + (tideRange / 2) * (1 + Math.sin(tidePhase - Math.PI / 2));
      const percentFull = Math.max(0, Math.min(100, ((currentLevel - minTide) / tideRange) * 100));

      // Calculate high/low times (next ~6h 12m apart)
      const highIn6h = new Date(now.getTime() + 6.2 * 60 * 60 * 1000);
      const lowIn12h = new Date(now.getTime() + 12.4 * 60 * 60 * 1000);

      document.getElementById('gaugeFill').style.height = percentFull + '%';
      document.getElementById('gaugePercent').textContent = Math.round(percentFull) + '%';
      document.getElementById('gaugeValue').textContent = currentLevel.toFixed(2) + ' m';
      document.getElementById('highTime').textContent = formatTime(highIn6h);
      document.getElementById('highHeight').textContent = maxTide.toFixed(2) + ' m';
      document.getElementById('lowTime').textContent = formatTime(lowIn12h);
      document.getElementById('lowHeight').textContent = minTide.toFixed(2) + ' m';
      document.getElementById('updateTime').textContent = formatTime(now);
    }

    // City selector
    document.querySelectorAll('.city-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCity = btn.dataset.city;
        updateTides();
      });
    });

    // Initial update
    updateTides();

    // Refresh every 10 seconds (visible gauge animation)
    setInterval(updateTides, 10000);
  </script>
</body>
</html>
