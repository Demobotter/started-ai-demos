<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tidal Window — Live Tide Times & Height</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a2463 0%, #247ba0 50%, #1b4d6d 100%);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: #0a2463;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .city-selector {
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        select:focus {
            outline: none;
            border-color: #247ba0;
        }
        .loading {
            text-align: center;
            color: #999;
            font-size: 14px;
            padding: 20px;
        }
        .error {
            background: #ffe0e0;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .data-section {
            display: none;
        }
        .data-section.active {
            display: block;
        }
        .tide-info {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .tide-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .tide-row:last-child {
            margin-bottom: 0;
        }
        .tide-label {
            color: #666;
            font-weight: 500;
        }
        .tide-value {
            color: #0a2463;
            font-weight: 600;
            text-align: right;
        }
        .gauge-container {
            margin-bottom: 20px;
        }
        .gauge-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            font-size: 14px;
            text-align: center;
        }
        .gauge {
            background: #e8e8e8;
            height: 40px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            border: 2px solid #ddd;
        }
        .gauge-fill {
            background: linear-gradient(90deg, #247ba0, #1b95d8);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 12px;
        }
        .gauge-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #333;
            font-weight: 600;
            font-size: 12px;
            white-space: nowrap;
            z-index: 10;
        }
        .next-tides {
            background: #f5f5f5;
            padding: 16px;
            border-radius: 12px;
            font-size: 13px;
        }
        .next-tides h3 {
            color: #333;
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .tide-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ddd;
        }
        .tide-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .tide-type {
            color: #666;
        }
        .tide-time {
            color: #0a2463;
            font-weight: 600;
        }
        .refresh-time {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌊 Tidal Window</h1>
        <p class="subtitle">Live tide times & water gauge</p>
        
        <div class="city-selector">
            <label for="city-select">Select a Coastal City:</label>
            <select id="city-select">
                <option value="">Choose city...</option>
                <option value="Sydney,Australia,-33.8688,151.2093">Sydney, Australia</option>
                <option value="San Francisco,USA,37.7749,-122.4194">San Francisco, USA</option>
                <option value="Miami,USA,25.7617,-80.1918">Miami, USA</option>
                <option value="Vancouver,Canada,49.2827,-123.1207">Vancouver, Canada</option>
                <option value="London,UK,51.5074,-0.1278">London, UK</option>
                <option value="Tokyo,Japan,35.6762,139.6503">Tokyo, Japan</option>
                <option value="Singapore,Singapore,1.3521,103.8198">Singapore, Singapore</option>
                <option value="Cape Town,South Africa,-33.9249,18.4241">Cape Town, South Africa</option>
                <option value="Rio de Janeiro,Brazil,-22.9068,-43.1729">Rio de Janeiro, Brazil</option>
                <option value="Melbourne,Australia,-37.8136,144.9631">Melbourne, Australia</option>
            </select>
        </div>

        <div id="error-msg" class="error" style="display: none;"></div>
        
        <div id="loading" class="loading" style="display: none;">Fetching tidal data...</div>
        
        <div id="data" class="data-section">
            <div class="tide-info">
                <div class="tide-row">
                    <span class="tide-label">Current Time (UTC)</span>
                    <span class="tide-value" id="current-time">--:--</span>
                </div>
                <div class="tide-row">
                    <span class="tide-label">Current Water Height</span>
                    <span class="tide-value" id="current-height">-- m</span>
                </div>
                <div class="tide-row">
                    <span class="tide-label">Tidal Range</span>
                    <span class="tide-value" id="tidal-range">-- m</span>
                </div>
            </div>

            <div class="gauge-container">
                <div class="gauge-label">Water Level Cycle</div>
                <div class="gauge">
                    <div class="gauge-fill" id="gauge-fill">
                        <span id="gauge-percent">0%</span>
                    </div>
                    <div class="gauge-text" id="gauge-label">0%</div>
                </div>
            </div>

            <div class="next-tides">
                <h3>Next 4 Tides (UTC)</h3>
                <div id="tide-list"></div>
            </div>

            <div class="refresh-time">Updates every 60s</div>
        </div>
    </div>

    <script>
        const cities = {
            'Sydney,Australia,-33.8688,151.2093': { name: 'Sydney', lat: -33.8688, lon: 151.2093 },
            'San Francisco,USA,37.7749,-122.4194': { name: 'San Francisco', lat: 37.7749, lon: -122.4194 },
            'Miami,USA,25.7617,-80.1918': { name: 'Miami', lat: 25.7617, lon: -80.1918 },
            'Vancouver,Canada,49.2827,-123.1207': { name: 'Vancouver', lat: 49.2827, lon: -123.1207 },
            'London,UK,51.5074,-0.1278': { name: 'London', lat: 51.5074, lon: -0.1278 },
            'Tokyo,Japan,35.6762,139.6503': { name: 'Tokyo', lat: 35.6762, lon: 139.6503 },
            'Singapore,Singapore,1.3521,103.8198': { name: 'Singapore', lat: 1.3521, lon: 103.8198 },
            'Cape Town,South Africa,-33.9249,18.4241': { name: 'Cape Town', lat: -33.9249, lon: 18.4241 },
            'Rio de Janeiro,Brazil,-22.9068,-43.1729': { name: 'Rio', lat: -22.9068, lon: -43.1729 },
            'Melbourne,Australia,-37.8136,144.9631': { name: 'Melbourne', lat: -37.8136, lon: 144.9631 }
        };

        let selectedCity = null;
        let refreshInterval = null;

        document.getElementById('city-select').addEventListener('change', (e) => {
            const key = e.target.value;
            if (key) {
                selectedCity = cities[key];
                fetchTideData();
                clearInterval(refreshInterval);
                refreshInterval = setInterval(fetchTideData, 60000);
            } else {
                selectedCity = null;
                clearInterval(refreshInterval);
                document.getElementById('data').classList.remove('active');
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error-msg').style.display = 'none';
            }
        });

        async function fetchTideData() {
            if (!selectedCity) return;

            const loading = document.getElementById('loading');
            const error = document.getElementById('error-msg');
            const data = document.getElementById('data');

            loading.style.display = 'block';
            error.style.display = 'none';
            data.classList.remove('active');

            try {
                const now = new Date();
                const startDate = now.toISOString().split('T')[0];
                const endDate = new Date(now.getTime() + 2 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];

                const url = `https://marine-api.open-meteo.com/v1/marine?latitude=${selectedCity.lat}&longitude=${selectedCity.lon}&start_date=${startDate}&end_date=${endDate}&timezone=UTC`;

                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch tidal data');

                const json = await response.json();
                const tideHeights = json.water_level || [];
                const times = json.time || [];

                if (!tideHeights || tideHeights.length === 0) {
                    throw new Error('No tidal data available for this location');
                }

                updateDisplay(times, tideHeights, now);
                loading.style.display = 'none';
                data.classList.add('active');

            } catch (err) {
                console.error(err);
                error.textContent = err.message;
                error.style.display = 'block';
                loading.style.display = 'none';
            }
        }

        function updateDisplay(times, heights, now) {
            const currentTime = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
            document.getElementById('current-time').textContent = currentTime + ' UTC';

            const nowMs = now.getTime();
            let currentHeight = heights[0];
            let minHeight = Math.min(...heights);
            let maxHeight = Math.max(...heights);

            for (let i = 0; i < times.length; i++) {
                const timeMs = new Date(times[i]).getTime();
                if (timeMs <= nowMs && (i + 1 < times.length && new Date(times[i + 1]).getTime() > nowMs)) {
                    const t1 = new Date(times[i]).getTime();
                    const t2 = new Date(times[i + 1]).getTime();
                    const h1 = heights[i];
                    const h2 = heights[i + 1];
                    const frac = (nowMs - t1) / (t2 - t1);
                    currentHeight = h1 + (h2 - h1) * frac;
                    break;
                }
            }

            const range = maxHeight - minHeight;
            document.getElementById('current-height').textContent = currentHeight.toFixed(2) + ' m';
            document.getElementById('tidal-range').textContent = range.toFixed(2) + ' m';

            const percentage = Math.max(0, Math.min(100, ((currentHeight - minHeight) / range) * 100));
            const fillEl = document.getElementById('gauge-fill');
            fillEl.style.width = percentage + '%';
            document.getElementById('gauge-percent').textContent = Math.round(percentage) + '%';
            document.getElementById('gauge-label').textContent = Math.round(percentage) + '%';

            const tideList = document.getElementById('tide-list');
            tideList.innerHTML = '';

            const localExtremaIndices = findLocalExtrema(heights);
            let count = 0;
            for (let idx of localExtremaIndices) {
                if (count >= 4) break;
                const time = new Date(times[idx]).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
                const height = heights[idx].toFixed(2);
                const isHigh = idx > 0 && heights[idx] > heights[idx - 1];
                const type = isHigh ? 'High Tide' : 'Low Tide';
                const item = document.createElement('div');
                item.className = 'tide-item';
                item.innerHTML = `<span class="tide-type">${type}</span><span class="tide-time">${time}</span>`;
                tideList.appendChild(item);
                count++;
            }
        }

        function findLocalExtrema(heights) {
            const extrema = [];
            for (let i = 1; i < heights.length - 1; i++) {
                if ((heights[i] > heights[i - 1] && heights[i] > heights[i + 1]) ||
                    (heights[i] < heights[i - 1] && heights[i] < heights[i + 1])) {
                    extrema.push(i);
                }
            }
            return extrema;
        }
    </script>
</body>
</html>
