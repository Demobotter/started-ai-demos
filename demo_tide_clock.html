<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tide Clock</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a1f3d 0%, #1a2d4d 100%);
      font-family: 'Space Mono', monospace;
      color: #e0f2fe;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: rgba(10, 31, 61, 0.8);
      border: 2px solid #4da8da;
      border-radius: 12px;
      padding: 30px;
      max-width: 1200px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5em;
      margin-bottom: 10px;
      color: #4da8da;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
      font-size: 0.95em;
    }
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 30px;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .control-group {
      background: rgba(77, 168, 218, 0.05);
      border: 1px solid #2d9d5f;
      border-radius: 8px;
      padding: 16px;
    }
    .control-label {
      font-weight: bold;
      color: #4da8da;
      margin-bottom: 10px;
      font-size: 0.9em;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select, input[type="date"], input[type="range"], button {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #4da8da;
      background: rgba(31, 41, 55, 0.6);
      color: #e0f2fe;
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      cursor: pointer;
      font-size: 0.9em;
    }
    button {
      background: linear-gradient(135deg, #2d9d5f 0%, #1f7a47 100%);
      border: 1px solid #4da8da;
      padding: 10px;
      margin-top: 8px;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    button:hover {
      background: linear-gradient(135deg, #3bb26f 0%, #2a9255 100%);
      box-shadow: 0 0 12px rgba(77, 168, 218, 0.3);
    }
    .hour-display {
      text-align: center;
      color: #4da8da;
      margin-top: 8px;
      font-weight: bold;
    }
    .toggle-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .toggle-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid #4da8da;
      background: rgba(45, 157, 95, 0.2);
      color: #e0f2fe;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8em;
      font-family: 'Space Mono', monospace;
      transition: all 0.3s;
    }
    .toggle-btn.active {
      background: rgba(45, 157, 95, 0.6);
      border-color: #2d9d5f;
    }
    .stats-box {
      background: rgba(45, 157, 95, 0.1);
      border-left: 4px solid #2d9d5f;
      border-radius: 4px;
      padding: 10px;
      font-size: 0.85em;
      line-height: 1.6;
      color: #cbd5e1;
    }
    .stat-label {
      color: #4da8da;
      font-weight: bold;
    }
    .stat-value {
      color: #f5f5f5;
      font-weight: bold;
    }
    .main {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    canvas {
      background: linear-gradient(180deg, #0a1f3d 0%, #1a2d4d 100%);
      border: 2px solid #4da8da;
      border-radius: 8px;
      width: 100%;
      height: auto;
      display: block;
    }
    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
      h1 { font-size: 2em; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌊 Tide Clock</h1>
    <div class="subtitle">Real lunar mechanics & coastal tidal predictions</div>
    
    <div class="layout">
      <div class="sidebar">
        <!-- Location Select -->
        <div class="control-group">
          <div class="control-label">Location</div>
          <select id="location">
            <option value="sf">San Francisco (1.9m)</option>
            <option value="sydney">Sydney Harbour (2.0m)</option>
            <option value="bordeaux">Bordeaux (13.5m)</option>
            <option value="venice">Venice (1.0m)</option>
            <option value="bay-of-fundy">Bay of Fundy (14.6m)</option>
            <option value="puget">Puget Sound (3.6m)</option>
            <option value="gulf">Gulf of Mexico (0.6m)</option>
            <option value="thames">Thames Estuary (7.8m)</option>
          </select>
        </div>

        <!-- Date Picker -->
        <div class="control-group">
          <div class="control-label">Date</div>
          <input type="date" id="datePicker" />
        </div>

        <!-- Hour Slider -->
        <div class="control-group">
          <div class="control-label">Hour</div>
          <input type="range" id="hourSlider" min="0" max="23" value="12" />
          <div class="hour-display" id="hourDisplay">12:00</div>
        </div>

        <!-- Animation Controls -->
        <div class="control-group">
          <button id="animate24h">▶ Animate 24h</button>
          <div class="control-label" style="margin-top: 12px;">Speed</div>
          <input type="range" id="speedSlider" min="0.5" max="5" step="0.5" value="2" />
        </div>

        <!-- Toggles -->
        <div class="control-group">
          <div class="control-label">View Modes</div>
          <div class="toggle-group">
            <button class="toggle-btn active" data-toggle="lunar">Lunar</button>
            <button class="toggle-btn" data-toggle="constituents">Components</button>
          </div>
        </div>

        <!-- Stats Display -->
        <div class="stats-box">
          <div><span class="stat-label">Lunar Age:</span> <span class="stat-value" id="lunarAge">14.0 days</span></div>
          <div><span class="stat-label">Phase:</span> <span class="stat-value" id="lunarPhase">Full Moon</span></div>
          <div style="margin-top: 8px;"><span class="stat-label">Tidal Range:</span> <span class="stat-value" id="tidalRange">1.9m</span></div>
          <div><span class="stat-label">Height Now:</span> <span class="stat-value" id="heightNow">+0.5m</span></div>
        </div>

        <div class="stats-box">
          <div><span class="stat-label">Next High Tide:</span> <span class="stat-value" id="nextHigh">14:30</span></div>
          <div><span class="stat-label">Next Low Tide:</span> <span class="stat-value" id="nextLow">20:50</span></div>
          <div style="margin-top: 8px;"><span class="stat-label">Current Velocity:</span> <span class="stat-value" id="velocity">+2.1 cm/s</span></div>
        </div>
      </div>

      <div class="main">
        <canvas id="canvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    // Location tidal data (spring range / neap range)
    const locations = {
      sf: { name: 'San Francisco', spring: 1.9, neap: 0.95 },
      sydney: { name: 'Sydney Harbour', spring: 2.0, neap: 1.0 },
      bordeaux: { name: 'Bordeaux', spring: 13.5, neap: 6.75 },
      venice: { name: 'Venice', spring: 1.0, neap: 0.5 },
      'bay-of-fundy': { name: 'Bay of Fundy', spring: 14.6, neap: 7.3 },
      puget: { name: 'Puget Sound', spring: 3.6, neap: 1.8 },
      gulf: { name: 'Gulf of Mexico', spring: 0.6, neap: 0.3 },
      thames: { name: 'Thames Estuary', spring: 7.8, neap: 3.9 }
    };

    // M2 semidiurnal tide period = 12.42 hours
    // S2 semidiurnal sun tide period = 12.0 hours
    const M2_PERIOD = 12.42; // hours
    const S2_PERIOD = 12.0;
    const LUNAR_MONTH = 29.53; // days

    let canvas, ctx;
    let currentLocation = 'sf';
    let showLunar = true;
    let showConstituents = false;
    let isAnimating = false;
    let animationSpeed = 2;
    let animationTime = 0;

    const state = {
      date: new Date(),
      hour: 12,
      location: 'sf'
    };

    function init() {
      canvas = document.getElementById('canvas');
      ctx = canvas.getContext('2d');
      
      // Set canvas size
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      // Set today's date in picker
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      document.getElementById('datePicker').value = `${yyyy}-${mm}-${dd}`;

      // Event listeners
      document.getElementById('location').addEventListener('change', (e) => {
        state.location = e.target.value;
        updateStats();
        draw();
      });

      document.getElementById('datePicker').addEventListener('change', (e) => {
        const [yyyy, mm, dd] = e.target.value.split('-');
        state.date = new Date(yyyy, mm - 1, dd);
        updateStats();
        draw();
      });

      document.getElementById('hourSlider').addEventListener('input', (e) => {
        state.hour = parseInt(e.target.value);
        document.getElementById('hourDisplay').textContent = String(state.hour).padStart(2, '0') + ':00';
        updateStats();
        draw();
      });

      document.getElementById('speedSlider').addEventListener('input', (e) => {
        animationSpeed = parseFloat(e.target.value);
      });

      document.getElementById('animate24h').addEventListener('click', () => {
        isAnimating = !isAnimating;
        if (isAnimating) animate();
      });

      document.querySelectorAll('[data-toggle]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const mode = e.target.dataset.toggle;
          document.querySelectorAll('[data-toggle]').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          
          if (mode === 'lunar') {
            showLunar = true;
            showConstituents = false;
          } else {
            showLunar = false;
            showConstituents = true;
          }
          draw();
        });
      });

      updateStats();
      draw();
    }

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = Math.min(rect.width * 0.6, 500);
    }

    function getLunarAge(date) {
      // Simplified: use date from known new moon (Jan 29, 2026)
      const knownNewMoon = new Date(2026, 0, 29);
      const daysSince = (date - knownNewMoon) / (1000 * 60 * 60 * 24);
      return ((daysSince % LUNAR_MONTH) + LUNAR_MONTH) % LUNAR_MONTH;
    }

    function getLunarPhase(age) {
      const names = ['New Moon', 'Waxing Crescent', 'First Quarter', 'Waxing Gibbous', 'Full Moon', 'Waning Gibbous', 'Last Quarter', 'Waning Crescent'];
      const index = Math.floor((age / LUNAR_MONTH) * 8) % 8;
      return names[index];
    }

    function getTidalHeight(date, hour, location, includeS2 = true) {
      // Time since known reference
      const refDate = new Date(2026, 0, 1, 0, 0, 0); // Jan 1, 2026 00:00 UTC
      const totalHours = (date - refDate) / (1000 * 60 * 60) + hour;
      
      // M2 (moon tide) — dominant component
      const m2Phase = (totalHours / M2_PERIOD) * 2 * Math.PI;
      const m2Amplitude = 0.8;
      const m2 = m2Amplitude * Math.sin(m2Phase);
      
      // S2 (sun tide) — weaker, modulates spring-neap
      let s2 = 0;
      if (includeS2) {
        const s2Amplitude = 0.2;
        const s2Phase = (totalHours / S2_PERIOD) * 2 * Math.PI;
        s2 = s2Amplitude * Math.sin(s2Phase);
      }
      
      // Spring-neap modulation via lunar phase
      const lunarAge = getLunarAge(date);
      const springNeapFactor = Math.sin((lunarAge / LUNAR_MONTH) * 2 * Math.PI);
      const springNeapMod = 0.5 + 0.5 * Math.abs(springNeapFactor); // 0.5 to 1.0
      
      return (m2 + s2) * springNeapMod;
    }

    function updateStats() {
      const loc = locations[state.location];
      const lunarAge = getLunarAge(state.date);
      const phase = getLunarPhase(lunarAge);
      
      // Determine if spring or neap based on lunar age
      const lunarFraction = lunarAge / LUNAR_MONTH;
      const isSprings = Math.abs(lunarFraction - 0.0) < 0.1 || Math.abs(lunarFraction - 0.5) < 0.1;
      const range = isSprings ? loc.spring : loc.neap;
      
      const height = getTidalHeight(state.date, state.hour, state.location) * range;
      const nextHighTime = state.hour + 6.21; // M2 half-period
      const nextLowTime = state.hour + 12.42; // M2 full period
      
      // Velocity = dh/dt, max at half-tide
      const heightNext = getTidalHeight(state.date, state.hour + 0.1, state.location) * range;
      const dhdt = (heightNext - height) / 0.1; // cm/s approximation
      const velocity = dhdt * 100;
      
      document.getElementById('lunarAge').textContent = lunarAge.toFixed(1) + ' days';
      document.getElementById('lunarPhase').textContent = phase;
      document.getElementById('tidalRange').textContent = range.toFixed(1) + 'm';
      document.getElementById('heightNow').textContent = (height >= 0 ? '+' : '') + height.toFixed(2) + 'm';
      document.getElementById('velocity').textContent = (velocity >= 0 ? '+' : '') + velocity.toFixed(1) + ' cm/s';
      
      const nextHighHour = Math.floor(nextHighTime % 24);
      const nextHighMin = Math.floor((nextHighTime % 1) * 60);
      const nextLowHour = Math.floor(nextLowTime % 24);
      const nextLowMin = Math.floor((nextLowTime % 1) * 60);
      
      document.getElementById('nextHigh').textContent = String(nextHighHour).padStart(2, '0') + ':' + String(nextHighMin).padStart(2, '0');
      document.getElementById('nextLow').textContent = String(nextLowHour).padStart(2, '0') + ':' + String(nextLowMin).padStart(2, '0');
    }

    function draw() {
      const w = canvas.width;
      const h = canvas.height;
      
      // Clear
      ctx.fillStyle = '#0a1f3d';
      ctx.fillRect(0, 0, w, h);
      
      if (showLunar) {
        drawLunarPanel(w, h);
      } else if (showConstituents) {
        drawConstituentsPanel(w, h);
      }
      
      drawTidePanel(w, h);
    }

    function drawLunarPanel(w, h) {
      const panelHeight = h * 0.35;
      const lunarAge = getLunarAge(state.date);
      const fraction = lunarAge / LUNAR_MONTH;
      
      // Title
      ctx.fillStyle = '#4da8da';
      ctx.font = 'bold 14px "Space Mono"';
      ctx.fillText('Lunar Mechanics', 20, 25);
      
      // Moon circle (showing phase)
      const moonX = 80;
      const moonY = 60;
      const moonRadius = 25;
      
      ctx.strokeStyle = '#4da8da';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(moonX, moonY, moonRadius, 0, Math.PI * 2);
      ctx.stroke();
      
      // Moon illumination (simple)
      const illumination = Math.sin(fraction * Math.PI); // 0 = new, 1 = full, 0 = new
      ctx.fillStyle = '#f5f5f5';
      if (illumination > 0.5) {
        // Right side lit (waxing)
        const litFraction = (illumination - 0.5) * 2;
        ctx.beginPath();
        ctx.arc(moonX, moonY, moonRadius, -Math.PI / 2, Math.PI / 2, false);
        ctx.lineTo(moonX - moonRadius * litFraction, moonY + moonRadius);
        ctx.lineTo(moonX - moonRadius * litFraction, moonY - moonRadius);
        ctx.fill();
      } else {
        // Left side lit (waning)
        const litFraction = illumination * 2;
        ctx.beginPath();
        ctx.arc(moonX, moonY, moonRadius, Math.PI / 2, -Math.PI / 2, false);
        ctx.lineTo(moonX + moonRadius * litFraction, moonY + moonRadius);
        ctx.lineTo(moonX + moonRadius * litFraction, moonY - moonRadius);
        ctx.fill();
      }
      
      // Sun position
      const sunX = 200 + Math.cos((fraction - 0.5) * Math.PI * 2) * 40;
      const sunY = 60 + Math.sin((fraction - 0.5) * Math.PI * 2) * 20;
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(sunX, sunY, 8, 0, Math.PI * 2);
      ctx.fill();
      
      // Spring/Neap label
      const springNess = Math.abs(Math.sin(fraction * Math.PI));
      const springLabel = springNess > 0.7 ? 'SPRING TIDE' : 'NEAP TIDE';
      ctx.fillStyle = springNess > 0.7 ? '#ff6b6b' : '#4da8da';
      ctx.font = 'bold 12px "Space Mono"';
      ctx.fillText(springLabel, 20, panelHeight - 10);
    }

    function drawConstituentsPanel(w, h) {
      const panelHeight = h * 0.35;
      
      // Title
      ctx.fillStyle = '#4da8da';
      ctx.font = 'bold 14px "Space Mono"';
      ctx.fillText('Tidal Components (M2 + S2)', 20, 25);
      
      // Draw component curves
      const startX = 20, startY = 50, graphW = w - 40, graphH = panelHeight - 60;
      
      // Graph background
      ctx.fillStyle = 'rgba(45, 157, 95, 0.05)';
      ctx.fillRect(startX, startY, graphW, graphH);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1;
      ctx.strokeRect(startX, startY, graphW, graphH);
      
      // M2 curve
      ctx.strokeStyle = '#4da8da';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = 0; x <= graphW; x += 2) {
        const hour = (x / graphW) * 24;
        const val = getTidalHeight(state.date, hour, state.location, false);
        const y = startY + graphH / 2 - val * graphH / 4;
        if (x === 0) ctx.moveTo(startX + x, y);
        else ctx.lineTo(startX + x, y);
      }
      ctx.stroke();
      
      // S2 curve
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      for (let x = 0; x <= graphW; x += 2) {
        const hour = (x / graphW) * 24;
        const refDate = new Date(2026, 0, 1, 0, 0, 0);
        const totalHours = (state.date - refDate) / (1000 * 60 * 60) + hour;
        const s2Phase = (totalHours / S2_PERIOD) * 2 * Math.PI;
        const s2 = 0.2 * Math.sin(s2Phase);
        const y = startY + graphH / 2 - s2 * graphH / 4;
        if (x === 0) ctx.moveTo(startX + x, y);
        else ctx.lineTo(startX + x, y);
      }
      ctx.stroke();
      ctx.globalAlpha = 1.0;
    }

    function drawTidePanel(w, h) {
      const panelY = h * 0.35;
      const panelHeight = h - panelY - 20;
      
      // Title
      ctx.fillStyle = '#4da8da';
      ctx.font = 'bold 14px "Space Mono"';
      ctx.fillText('Tidal Curve — Next 24 Hours', 20, panelY + 25);
      
      // Tide graph
      const graphX = 20, graphY = panelY + 50, graphW = w - 40, graphH = panelHeight - 80;
      
      ctx.fillStyle = 'rgba(45, 157, 95, 0.05)';
      ctx.fillRect(graphX, graphY, graphW, graphH);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1;
      ctx.strokeRect(graphX, graphY, graphW, graphH);
      
      // Draw tide curve
      const loc = locations[state.location];
      const lunarAge = getLunarAge(state.date);
      const springNess = 0.5 + 0.5 * Math.abs(Math.sin((lunarAge / LUNAR_MONTH) * Math.PI));
      const range = loc.spring * springNess + loc.neap * (1 - springNess);
      
      ctx.strokeStyle = '#4da8da';
      ctx.fillStyle = 'rgba(77, 168, 218, 0.2)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      let firstPoint = true;
      for (let x = 0; x <= graphW; x += 2) {
        const hour = state.hour + (x / graphW) * 24;
        const val = getTidalHeight(state.date, hour, state.location) * range;
        const y = graphY + graphH / 2 - val * graphH / 3;
        if (firstPoint) {
          ctx.moveTo(graphX + x, y);
          firstPoint = false;
        } else {
          ctx.lineTo(graphX + x, y);
        }
      }
      ctx.lineTo(graphX + graphW, graphY + graphH / 2);
      ctx.lineTo(graphX, graphY + graphH / 2);
      ctx.fill();
      ctx.stroke();
      
      // Current point on curve
      const currentVal = getTidalHeight(state.date, state.hour, state.location) * range;
      const currentY = graphY + graphH / 2 - currentVal * graphH / 3;
      ctx.fillStyle = '#ff6b6b';
      ctx.beginPath();
      ctx.arc(graphX, currentY, 6, 0, Math.PI * 2);
      ctx.fill();
      
      // Labels
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '11px "Space Mono"';
      ctx.textAlign = 'center';
      ctx.fillText(String(state.hour).padStart(2, '0') + ':00', graphX, graphY + graphH + 15);
      ctx.fillText(String((state.hour + 24) % 24).padStart(2, '0') + ':00', graphX + graphW, graphY + graphH + 15);
    }

    function animate() {
      if (!isAnimating) return;
      
      animationTime += 0.016 * animationSpeed; // 60fps
      if (animationTime >= 24) {
        animationTime = 0;
        isAnimating = false;
        return;
      }
      
      state.hour = (state.hour + 0.016 * animationSpeed) % 24;
      document.getElementById('hourSlider').value = Math.floor(state.hour);
      document.getElementById('hourDisplay').textContent = String(Math.floor(state.hour)).padStart(2, '0') + ':' + String(Math.floor((state.hour % 1) * 60)).padStart(2, '0');
      
      updateStats();
      draw();
      requestAnimationFrame(animate);
    }

    init();
  </script>
</body>
</html>
