<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tidal Window</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a2e4a 0%, #1a4d6d 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: rgba(15, 45, 70, 0.8);
      border-radius: 16px;
      padding: 32px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(100, 180, 220, 0.2);
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      margin-bottom: 8px;
      text-align: center;
      color: #64b4dc;
    }
    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #7fa8c4;
      margin-bottom: 24px;
    }
    .city-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 8px 14px;
      border: 1px solid rgba(100, 180, 220, 0.3);
      background: rgba(25, 60, 90, 0.6);
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }
    button:hover {
      background: rgba(100, 180, 220, 0.2);
      border-color: rgba(100, 180, 220, 0.6);
    }
    button.active {
      background: #64b4dc;
      border-color: #64b4dc;
      color: #0a2e4a;
    }
    .gauge-section {
      margin-bottom: 32px;
    }
    .gauge-label {
      font-size: 13px;
      color: #7fa8c4;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .gauge-container {
      position: relative;
      height: 80px;
      background: rgba(10, 45, 70, 0.5);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(100, 180, 220, 0.15);
    }
    .gauge-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, #00d4ff 0%, #0099cc 100%);
      transition: height 1s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0a2e4a;
      font-weight: 600;
      font-size: 14px;
    }
    .gauge-value {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
      font-weight: 600;
      color: #64b4dc;
      z-index: 2;
    }
    .tide-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .tide-item {
      background: rgba(25, 60, 90, 0.4);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(100, 180, 220, 0.1);
    }
    .tide-item-label {
      font-size: 11px;
      color: #7fa8c4;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .tide-item-value {
      font-size: 18px;
      font-weight: 600;
      color: #64b4dc;
    }
    .tide-item-time {
      font-size: 12px;
      color: #5a8bb0;
      margin-top: 2px;
    }
    .error {
      background: rgba(220, 80, 80, 0.2);
      border: 1px solid rgba(220, 80, 80, 0.4);
      color: #ff9999;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
    }
    .loading {
      text-align: center;
      color: #7fa8c4;
      font-size: 13px;
      padding: 20px;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(100, 180, 220, 0.3);
      border-top-color: #64b4dc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .update-time {
      font-size: 11px;
      color: #5a8bb0;
      text-align: center;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌊 Tidal Window</h1>
    <div class="subtitle">Pick a coastal city, watch the tides flow</div>
    
    <div class="city-selector">
      <button class="city-btn active" data-lat="51.5074" data-lon="-0.1278" data-name="London">London</button>
      <button class="city-btn" data-lat="40.7128" data-lon="-74.0060" data-name="New York">New York</button>
      <button class="city-btn" data-lat="-33.8688" data-lon="151.2093" data-name="Sydney">Sydney</button>
      <button class="city-btn" data-lat="35.6762" data-lon="139.6503" data-name="Tokyo">Tokyo</button>
      <button class="city-btn" data-lat="48.8566" data-lon="2.3522" data-name="Paris">Paris</button>
      <button class="city-btn" data-lat="-22.9068" data-lon="-43.1729" data-name="Rio">Rio</button>
    </div>

    <div class="gauge-section">
      <div class="gauge-label">Current Water Level</div>
      <div class="gauge-container">
        <div class="gauge-fill" id="gaugeFill" style="height: 0%">
          <span id="gaugeValue"></span>
        </div>
        <div class="gauge-value" id="gaugePercent">0%</div>
      </div>
    </div>

    <div class="tide-info">
      <div class="tide-item">
        <div class="tide-item-label">🌊 High Tide</div>
        <div class="tide-item-value" id="highTime">--</div>
        <div class="tide-item-time" id="highHeight">-- m</div>
      </div>
      <div class="tide-item">
        <div class="tide-item-label">🏜️ Low Tide</div>
        <div class="tide-item-value" id="lowTime">--</div>
        <div class="tide-item-time" id="lowHeight">-- m</div>
      </div>
    </div>

    <div id="error" style="display:none;" class="error"></div>
    <div id="loading" style="display:none;" class="loading"><span class="spinner"></span>Loading tide data...</div>
    <div class="update-time">Last updated: <span id="updateTime">--</span></div>
  </div>

  <script>
    const cities = {
      'London': { lat: 51.5074, lon: -0.1278 },
      'New York': { lat: 40.7128, lon: -74.0060 },
      'Sydney': { lat: -33.8688, lon: 151.2093 },
      'Tokyo': { lat: 35.6762, lon: 139.6503 },
      'Paris': { lat: 48.8566, lon: 2.3522 },
      'Rio': { lat: -22.9068, lon: -43.1729 }
    };

    let currentCity = 'London';
    let lastHighTide = null;
    let lastLowTide = null;

    function formatTime(date) {
      return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
    }

    function formatShortTime(date) {
      return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    }

    async function fetchTideData(city) {
      const { lat, lon } = cities[city];
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      
      loading.style.display = 'block';
      error.style.display = 'none';

      try {
        // Open-Meteo Marine API: free, no auth needed
        const url = `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&daily=wave_height_max,tide_surface_elevation_max,tide_surface_elevation_min&timezone=auto`;
        const response = await fetch(url);
        const data = await response.json();

        // Parse response
        const now = new Date();
        const today = now.toISOString().split('T')[0];
        
        // Get today's tide data
        const dailyData = data.daily;
        const todayIndex = dailyData.time.indexOf(today);
        
        if (todayIndex === -1) {
          throw new Error('No tide data available');
        }

        // Simulate tides based on time of day (sine wave approximation)
        // In reality, Open-Meteo Marine gives max/min, so we interpolate
        const maxTide = dailyData.tide_surface_elevation_max[todayIndex] || 2.5;
        const minTide = dailyData.tide_surface_elevation_min[todayIndex] || -2.5;
        const range = maxTide - minTide;

        // Approximate high/low tide times (in a real app, use astronomical data)
        // Tides cycle ~every 12h 25m, but we'll estimate based on time of day
        const hoursIntoDay = now.getHours() + now.getMinutes() / 60;
        const tidePhase = (hoursIntoDay / 24) * 2; // 0-2 = full cycle approximation
        
        let nextHighTime = new Date(now);
        let nextLowTime = new Date(now);
        
        // Simple cyclic approximation
        const tideOffset = (tidePhase % 2) * 6.2; // ~12.4 hour cycle
        nextHighTime.setHours(nextHighTime.getHours() + (6 - (hoursIntoDay % 12.4 < 6.2 ? hoursIntoDay % 6.2 : 0)));
        nextLowTime.setHours(nextLowTime.getHours() + (12 - (hoursIntoDay % 12.4 < 6.2 ? hoursIntoDay % 6.2 : 0)));

        // Calculate current water level (sine wave between min and max)
        const timeOfDay = (now.getHours() * 60 + now.getMinutes()) / (24 * 60); // 0-1
        const tideLevel = minTide + (range / 2) * (1 + Math.sin(timeOfDay * Math.PI * 2 - Math.PI / 2));
        const percentFull = Math.max(0, Math.min(100, ((tideLevel - minTide) / range) * 100));

        // Update UI
        document.getElementById('gaugeFill').style.height = percentFull + '%';
        document.getElementById('gaugePercent').textContent = Math.round(percentFull) + '%';
        document.getElementById('gaugeValue').textContent = tideLevel.toFixed(2) + ' m';
        
        document.getElementById('highTime').textContent = formatShortTime(nextHighTime);
        document.getElementById('highHeight').textContent = maxTide.toFixed(2) + ' m';
        
        document.getElementById('lowTime').textContent = formatShortTime(nextLowTime);
        document.getElementById('lowHeight').textContent = minTide.toFixed(2) + ' m';
        
        document.getElementById('updateTime').textContent = formatTime(now);
        
        loading.style.display = 'none';
      } catch (err) {
        error.style.display = 'block';
        error.textContent = '⚠️ Unable to load tide data. Please try again.';
        loading.style.display = 'none';
      }
    }

    // City selector
    document.querySelectorAll('.city-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCity = btn.dataset.name;
        fetchTideData(currentCity);
      });
    });

    // Initial load
    fetchTideData(currentCity);

    // Refresh every 60s
    setInterval(() => fetchTideData(currentCity), 60000);
  </script>
</body>
</html>
