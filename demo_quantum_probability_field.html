<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Probability Field</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0e27;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: #0f1628;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 8px 32px rgba(0, 128, 255, 0.1);
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      margin-bottom: 8px;
      color: #00ffff;
    }
    .subtitle {
      font-size: 14px;
      color: #7080a0;
      margin-bottom: 24px;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (max-width: 600px) {
      .controls { grid-template-columns: 1fr; }
    }
    .control-group {
      background: #0a0e27;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #1a2d4f;
    }
    .control-label {
      font-size: 12px;
      color: #00ffff;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      background: #1a2d4f;
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
      accent-color: #00ffff;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #00ffff;
      border-radius: 50%;
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: #00ffff;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }
    .value-display {
      font-size: 13px;
      color: #ffff00;
      margin-top: 4px;
      font-family: 'Courier New', monospace;
    }
    .eigenstate-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .eigenstate-btn {
      padding: 8px 12px;
      background: #1a2d4f;
      border: 2px solid #00d9ff;
      border-radius: 6px;
      color: #00d9ff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .eigenstate-btn.active {
      background: #00d9ff;
      color: #0a0e27;
    }
    .eigenstate-btn:hover {
      border-color: #00ffff;
    }
    .canvas-wrapper {
      background: #0a0e27;
      border: 1px solid #1a2d4f;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 4px;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 600px) {
      .info-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .info-card {
      background: #0a0e27;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #1a2d4f;
      text-align: center;
    }
    .info-label {
      font-size: 11px;
      color: #7080a0;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .info-value {
      font-size: 16px;
      color: #ffff00;
      font-family: 'Courier New', monospace;
      font-weight: 600;
    }
    .action-buttons {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    button {
      flex: 1;
      padding: 12px;
      background: #00d9ff;
      color: #0a0e27;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    button:hover {
      background: #00ffff;
      box-shadow: 0 0 16px rgba(0, 255, 255, 0.4);
    }
    button:active {
      transform: scale(0.98);
    }
    .mode-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .mode-btn {
      flex: 1;
      padding: 10px;
      background: #1a2d4f;
      border: 2px solid #00d9ff;
      color: #00d9ff;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: #00d9ff;
      color: #0a0e27;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚛️ Quantum Probability Field</h1>
    <div class="subtitle">1D Particle-in-a-Box Schrödinger Solver</div>

    <div class="mode-selector">
      <button class="mode-btn active" data-mode="single">Single Eigenstate</button>
      <button class="mode-btn" data-mode="superposition">Superposition</button>
    </div>

    <div class="controls">
      <div class="control-group">
        <label class="control-label">Wall Separation (L)</label>
        <input type="range" id="wallSeparation" min="20" max="200" value="100" step="5">
        <div class="value-display" id="wallValue">100 units</div>
      </div>
      <div class="control-group" id="energySelectControl" style="display: none;">
        <label class="control-label">Energy Level (n)</label>
        <div class="eigenstate-selector" id="eigenstateSelector"></div>
      </div>
      <div class="control-group" id="superpositionControl" style="display: none;">
        <label class="control-label">State Mix: |ψ₁⟩ vs |ψ₂⟩</label>
        <input type="range" id="superpositionRatio" min="0" max="100" value="50" step="1">
        <div class="value-display"><span id="ratioDisplay">50</span>% |ψ₁⟩ / <span id="ratioDisplay2">50</span>% |ψ₂⟩</div>
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="probabilityCanvas" width="750" height="300"></canvas>
    </div>

    <div class="info-grid">
      <div class="info-card">
        <div class="info-label">Eigenvalue (E)</div>
        <div class="info-value" id="energyDisplay">E₁ = 1.00</div>
      </div>
      <div class="info-card">
        <div class="info-label">State</div>
        <div class="info-value" id="stateDisplay">|ψ₁⟩</div>
      </div>
      <div class="info-card">
        <div class="info-label">Peak |ψ|²</div>
        <div class="info-value" id="peakDisplay">0.000</div>
      </div>
    </div>

    <div class="action-buttons">
      <button id="measureBtn">🔬 Measure Position</button>
      <button id="resetBtn">↻ Reset</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('probabilityCanvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = 750 * dpr;
    canvas.height = 300 * dpr;
    ctx.scale(dpr, dpr);

    const state = {
      L: 100,
      mode: 'single',
      eigenstate: 1,
      superpositionRatio: 0.5,
      measuredPosition: null,
      animationTime: 0
    };

    const palette = {
      bg: '#0a0e27',
      dark: '#0f1628',
      blue: '#0080ff',
      cyan: '#00ffff',
      yellow: '#ffff00',
      red: '#ff6b00'
    };

    // Real Schrödinger solver: compute eigenstate wavefunctions
    function computeWavefunction(x, n, L) {
      // Particle in a box: ψ_n(x) = sqrt(2/L) * sin(n*π*x/L)
      return Math.sqrt(2 / L) * Math.sin((n * Math.PI * x) / L);
    }

    function getEigenvalue(n, L) {
      // E_n = n² * π² * ℏ² / (2*m*L²) -> normalized to n²
      return n * n;
    }

    function colorFromIntensity(intensity) {
      // Map intensity (0-1) to color gradient: blue→cyan→yellow→red
      const t = intensity;
      if (t < 0.25) {
        const a = t / 0.25;
        return lerpColor(palette.blue, palette.cyan, a);
      } else if (t < 0.5) {
        const a = (t - 0.25) / 0.25;
        return lerpColor(palette.cyan, palette.yellow, a);
      } else if (t < 0.75) {
        const a = (t - 0.5) / 0.25;
        return lerpColor(palette.yellow, palette.red, a);
      } else {
        const a = (t - 0.75) / 0.25;
        const r1 = parseInt(palette.red.slice(1, 3), 16);
        const g1 = parseInt(palette.red.slice(3, 5), 16);
        const b1 = parseInt(palette.red.slice(5, 7), 16);
        const r2 = Math.floor(r1 * (1 - a));
        const g2 = Math.floor(g1 * (1 - a));
        const b2 = Math.floor(b1 * (1 - a));
        return `rgb(${r2}, ${g2}, ${b2})`;
      }
    }

    function lerpColor(c1, c2, t) {
      const r1 = parseInt(c1.slice(1, 3), 16);
      const g1 = parseInt(c1.slice(3, 5), 16);
      const b1 = parseInt(c1.slice(5, 7), 16);
      const r2 = parseInt(c2.slice(1, 3), 16);
      const g2 = parseInt(c2.slice(3, 5), 16);
      const b2 = parseInt(c2.slice(5, 7), 16);
      const r = Math.floor(r1 + (r2 - r1) * t);
      const g = Math.floor(g1 + (g2 - g1) * t);
      const b = Math.floor(b1 + (b2 - b1) * t);
      return `rgb(${r}, ${g}, ${b})`;
    }

    function getProbabilityDensity(x) {
      let psi = 0;
      if (state.mode === 'single') {
        psi = computeWavefunction(x, state.eigenstate, state.L);
      } else {
        const psi1 = computeWavefunction(x, 1, state.L);
        const psi2 = computeWavefunction(x, 2, state.L);
        psi = Math.sqrt(state.superpositionRatio) * psi1 + Math.sqrt(1 - state.superpositionRatio) * psi2;
      }
      return psi * psi; // |ψ|²
    }

    function drawCanvas() {
      const width = 750;
      const height = 300;
      const padding = 40;
      const graphWidth = width - 2 * padding;
      const graphHeight = height - 2 * padding;

      // Clear
      ctx.fillStyle = palette.dark;
      ctx.fillRect(0, 0, width, height);

      // Draw grid background
      ctx.strokeStyle = '#1a2d4f';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= 5; i++) {
        const y = padding + (graphHeight * i) / 5;
        ctx.beginPath();
        ctx.moveTo(padding, y);
        ctx.lineTo(width - padding, y);
        ctx.stroke();
      }

      // Draw heatmap
      const pixelWidth = graphWidth / 200;
      let maxProb = 0;
      const probs = [];
      for (let i = 0; i < 200; i++) {
        const x = (i / 200) * state.L;
        const prob = getProbabilityDensity(x);
        probs.push(prob);
        maxProb = Math.max(maxProb, prob);
      }

      for (let i = 0; i < 200; i++) {
        const intensity = probs[i] / (maxProb || 1);
        ctx.fillStyle = colorFromIntensity(intensity);
        ctx.fillRect(padding + i * pixelWidth, padding, pixelWidth, graphHeight);
      }

      // Draw axes
      ctx.strokeStyle = palette.cyan;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(padding, height - padding);
      ctx.lineTo(width - padding, height - padding);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(padding, padding);
      ctx.lineTo(padding, height - padding);
      ctx.stroke();

      // Axis labels
      ctx.fillStyle = palette.cyan;
      ctx.font = '12px Inter';
      ctx.textAlign = 'center';
      ctx.fillText('x', width - 20, height - 15);
      ctx.save();
      ctx.translate(15, height / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText('|ψ|²', 0, 0);
      ctx.restore();

      // Measured position indicator
      if (state.measuredPosition !== null) {
        const xPos = padding + (state.measuredPosition / state.L) * graphWidth;
        ctx.fillStyle = 'rgba(255, 255, 0, 0.6)';
        ctx.beginPath();
        ctx.arc(xPos, height - padding, 6, 0, 2 * Math.PI);
        ctx.fill();
        ctx.strokeStyle = palette.yellow;
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // Title
      ctx.fillStyle = palette.cyan;
      ctx.font = 'bold 14px Syne';
      ctx.textAlign = 'left';
      ctx.fillText('Probability Density |ψ(x)|²', padding, 20);
    }

    function updateInfo() {
      const energyVal = getEigenvalue(state.mode === 'single' ? state.eigenstate : 0, state.L);
      const probs = [];
      let maxProb = 0;
      for (let i = 0; i < 200; i++) {
        const x = (i / 200) * state.L;
        const prob = getProbabilityDensity(x);
        probs.push(prob);
        maxProb = Math.max(maxProb, prob);
      }

      if (state.mode === 'single') {
        document.getElementById('energyDisplay').textContent = `E${state.eigenstate} = ${energyVal.toFixed(2)}ℏ²π²/2mL²`;
        document.getElementById('stateDisplay').textContent = `|ψ${state.eigenstate}⟩`;
      } else {
        document.getElementById('energyDisplay').textContent = 'Mixed State';
        document.getElementById('stateDisplay').textContent = `|ψ₁⟩ + |ψ₂⟩`;
      }

      document.getElementById('peakDisplay').textContent = maxProb.toFixed(4);
      document.getElementById('wallValue').textContent = `${state.L} units`;
    }

    function buildEigenstateButtons() {
      const container = document.getElementById('eigenstateSelector');
      container.innerHTML = '';
      for (let n = 1; n <= 5; n++) {
        const btn = document.createElement('button');
        btn.className = 'eigenstate-btn' + (n === state.eigenstate ? ' active' : '');
        btn.textContent = `n=${n}`;
        btn.dataset.n = n;
        btn.onclick = () => {
          state.eigenstate = n;
          state.measuredPosition = null;
          updateAllButtons();
          drawCanvas();
          updateInfo();
        };
        container.appendChild(btn);
      }
    }

    function updateAllButtons() {
      document.querySelectorAll('.eigenstate-btn').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.n) === state.eigenstate);
      });
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === state.mode);
      });
    }

    // Event listeners
    document.getElementById('wallSeparation').addEventListener('input', (e) => {
      state.L = parseFloat(e.target.value);
      state.measuredPosition = null;
      drawCanvas();
      updateInfo();
    });

    document.getElementById('superpositionRatio').addEventListener('input', (e) => {
      state.superpositionRatio = parseFloat(e.target.value) / 100;
      document.getElementById('ratioDisplay').textContent = e.target.value;
      document.getElementById('ratioDisplay2').textContent = (100 - e.target.value);
      state.measuredPosition = null;
      drawCanvas();
      updateInfo();
    });

    document.getElementById('measureBtn').addEventListener('click', () => {
      // Measure: collapse to random position weighted by |ψ|²
      let totalProb = 0;
      const probs = [];
      for (let i = 0; i < 500; i++) {
        const x = (i / 500) * state.L;
        const prob = getProbabilityDensity(x);
        probs.push(prob);
        totalProb += prob;
      }
      const r = Math.random() * totalProb;
      let cumulative = 0;
      for (let i = 0; i < probs.length; i++) {
        cumulative += probs[i];
        if (cumulative >= r) {
          state.measuredPosition = (i / 500) * state.L;
          break;
        }
      }
      drawCanvas();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      state.measuredPosition = null;
      drawCanvas();
    });

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.mode = btn.dataset.mode;
        state.measuredPosition = null;
        document.getElementById('energySelectControl').style.display = state.mode === 'single' ? 'block' : 'none';
        document.getElementById('superpositionControl').style.display = state.mode === 'superposition' ? 'block' : 'none';
        updateAllButtons();
        buildEigenstateButtons();
        drawCanvas();
        updateInfo();
      });
    });

    // Init
    buildEigenstateButtons();
    updateAllButtons();
    drawCanvas();
    updateInfo();
    window.addEventListener('resize', () => {
      canvas.width = 750 * dpr;
      canvas.height = 300 * dpr;
      ctx.scale(dpr, dpr);
      drawCanvas();
    });
  </script>
</body>
</html>
