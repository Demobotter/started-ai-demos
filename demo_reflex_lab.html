<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflex Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #e2e8f0;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(30, 27, 75, 0.8);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }
        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 32px;
            margin-bottom: 8px;
            color: #f1f5f9;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .stimulus-zone {
            width: 100%;
            height: 200px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(148, 163, 184, 0.3);
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .stimulus-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(100, 200, 255, 0.3);
            position: absolute;
            display: none;
            box-shadow: 0 0 30px rgba(100, 200, 255, 0.5);
        }
        
        .stimulus-circle.active {
            display: block;
            animation: pulse 0.3s ease-out;
        }
        
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .ready-text {
            color: #64b5f6;
            font-size: 16px;
            font-weight: 500;
        }
        
        .hidden { display: none !important; }
        
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: rgba(148, 163, 184, 0.2);
            color: #cbd5e1;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: rgba(148, 163, 184, 0.3);
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-box {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        
        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        
        .stat-value {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #60a5fa;
        }
        
        .feedback {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }
        
        .feedback.show {
            display: block;
        }
        
        .feedback.good {
            background: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.3);
            color: #86efac;
        }
        
        .feedback.slow {
            background: rgba(249, 115, 22, 0.1);
            border-color: rgba(249, 115, 22, 0.3);
            color: #fdba74;
        }
        
        .feedback.miss {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
        
        .results {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            padding: 20px;
            display: none;
        }
        
        .results.show {
            display: block;
        }
        
        .results h3 {
            font-family: 'Poppins', sans-serif;
            margin-bottom: 15px;
            color: #f1f5f9;
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .result-item {
            padding: 10px;
            background: rgba(59, 130, 246, 0.05);
            border-radius: 6px;
            text-align: center;
        }
        
        .result-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        
        .result-val {
            font-family: 'Poppins', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #60a5fa;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }
            h1 {
                font-size: 24px;
            }
            .stimulus-zone {
                height: 160px;
            }
            .stimulus-circle {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Reflex Lab</h1>
        <p class="subtitle">Test your reaction speed. Click when the circle appears.</p>
        
        <div class="controls">
            <button class="btn-primary" id="startBtn">Start Test</button>
            <button class="btn-secondary" id="clearBtn">Clear Stats</button>
        </div>
        
        <div class="stimulus-zone">
            <div class="stimulus-circle" id="circle"></div>
            <div class="ready-text" id="readyText">Waiting...</div>
        </div>
        
        <div class="feedback" id="feedback"></div>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Current</div>
                <div class="stat-value" id="currentMs">—</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Best</div>
                <div class="stat-value" id="bestMs">—</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Average</div>
                <div class="stat-value" id="avgMs">—</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Total</div>
                <div class="stat-value" id="countTests">0</div>
            </div>
        </div>
        
        <div class="results" id="results">
            <h3>Session Results</h3>
            <div class="results-grid" id="resultsGrid"></div>
            <div style="text-align: center; font-size: 12px; color: #94a3b8;">Tests in this session. <strong>Keep practicing!</strong></div>
        </div>
    </div>
    
    <script>
        const circle = document.getElementById('circle');
        const readyText = document.getElementById('readyText');
        const startBtn = document.getElementById('startBtn');
        const clearBtn = document.getElementById('clearBtn');
        const feedback = document.getElementById('feedback');
        const currentMsEl = document.getElementById('currentMs');
        const bestMsEl = document.getElementById('bestMs');
        const avgMsEl = document.getElementById('avgMs');
        const countTestsEl = document.getElementById('countTests');
        const resultsEl = document.getElementById('results');
        const resultsGrid = document.getElementById('resultsGrid');
        
        let stimulusTime = 0;
        let reactionMs = 0;
        let testActive = false;
        let sessionResults = [];
        
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function loadStats() {
            const saved = localStorage.getItem('reflexLabStats');
            return saved ? JSON.parse(saved) : { best: null, times: [] };
        }
        
        function saveStats(stats) {
            localStorage.setItem('reflexLabStats', JSON.stringify(stats));
        }
        
        function playTone(freq, duration) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + duration);
        }
        
        function showFeedback(ms) {
            let msg, className;
            if (ms < 200) {
                msg = `⚡ ${ms}ms — Excellent!`;
                className = 'good';
                playTone(800, 0.1);
            } else if (ms < 300) {
                msg = `✓ ${ms}ms — Good!`;
                className = 'good';
                playTone(700, 0.1);
            } else if (ms < 400) {
                msg = `△ ${ms}ms — Average`;
                className = 'slow';
                playTone(500, 0.1);
            } else {
                msg = `◊ ${ms}ms — Slower`;
                className = 'slow';
                playTone(350, 0.1);
            }
            feedback.textContent = msg;
            feedback.className = `feedback show ${className}`;
            setTimeout(() => {
                feedback.classList.remove('show');
            }, 2000);
        }
        
        function updateDisplay() {
            const stats = loadStats();
            if (stats.times.length > 0) {
                const best = Math.min(...stats.times);
                const avg = Math.round(stats.times.reduce((a, b) => a + b, 0) / stats.times.length);
                bestMsEl.textContent = `${best}ms`;
                avgMsEl.textContent = `${avg}ms`;
                countTestsEl.textContent = stats.times.length;
            }
        }
        
        function triggerStimulus() {
            const delay = 1000 + Math.random() * 3000;
            setTimeout(() => {
                if (!testActive) return;
                stimulusTime = Date.now();
                circle.classList.add('active');
                readyText.classList.add('hidden');
                playTone(1000, 0.1);
            }, delay);
        }
        
        function startTest() {
            testActive = true;
            sessionResults = [];
            resultsEl.classList.remove('show');
            readyText.classList.remove('hidden');
            readyText.textContent = 'Get ready...';
            circle.classList.remove('active');
            currentMsEl.textContent = '—';
            startBtn.disabled = true;
            clearBtn.disabled = true;
            triggerStimulus();
        }
        
        function handleClick() {
            if (!testActive || stimulusTime === 0) return;
            
            reactionMs = Date.now() - stimulusTime;
            testActive = false;
            
            const stats = loadStats();
            stats.times.push(reactionMs);
            saveStats(stats);
            sessionResults.push(reactionMs);
            
            currentMsEl.textContent = `${reactionMs}ms`;
            circle.classList.remove('active');
            readyText.classList.remove('hidden');
            readyText.textContent = 'Ready for another?';
            showFeedback(reactionMs);
            updateDisplay();
            
            if (sessionResults.length < 10) {
                setTimeout(() => {
                    startTest();
                }, 1500);
            } else {
                endSession();
            }
        }
        
        function endSession() {
            startBtn.disabled = false;
            clearBtn.disabled = false;
            testActive = false;
            stimulusTime = 0;
            readyText.textContent = 'Session complete!';
            
            if (sessionResults.length > 0) {
                const best = Math.min(...sessionResults);
                const worst = Math.max(...sessionResults);
                const avg = Math.round(sessionResults.reduce((a, b) => a + b, 0) / sessionResults.length);
                
                resultsGrid.innerHTML = `
                    <div class="result-item">
                        <div class="result-label">Best</div>
                        <div class="result-val">${best}ms</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Worst</div>
                        <div class="result-val">${worst}ms</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Average</div>
                        <div class="result-val">${avg}ms</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Tests</div>
                        <div class="result-val">${sessionResults.length}</div>
                    </div>
                `;
                resultsEl.classList.add('show');
            }
        }
        
        function clearStats() {
            if (confirm('Clear all stats?')) {
                localStorage.removeItem('reflexLabStats');
                sessionResults = [];
                bestMsEl.textContent = '—';
                avgMsEl.textContent = '—';
                countTestsEl.textContent = '0';
                currentMsEl.textContent = '—';
                resultsEl.classList.remove('show');
                startBtn.disabled = false;
                clearBtn.disabled = false;
                testActive = false;
                stimulusTime = 0;
                readyText.textContent = 'Waiting...';
                circle.classList.remove('active');
                playTone(400, 0.15);
            }
        }
        
        startBtn.addEventListener('click', startTest);
        clearBtn.addEventListener('click', clearStats);
        document.addEventListener('click', (e) => {
            if (e.target !== startBtn && e.target !== clearBtn && testActive) {
                handleClick();
            }
        });
        
        updateDisplay();
    </script>
</body>
</html>
