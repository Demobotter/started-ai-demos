<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game of Life</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Space Mono", monospace;
            background: #0a1428;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: #1a2332;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-family: "Playfair Display", serif;
            font-size: 2.5rem;
            margin-bottom: 8px;
            text-align: center;
            color: #7dd3fc;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.8rem;
            }
        }

        canvas {
            border: 2px solid #4da8da;
            border-radius: 8px;
            background: #0a1428;
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .control-group {
            border-left: 3px solid #4da8da;
            padding-left: 12px;
        }

        .control-label {
            font-weight: 700;
            color: #7dd3fc;
            margin-bottom: 6px;
            display: block;
            font-size: 0.9rem;
        }

        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            background: #2a4a6a;
            border: 2px solid #4da8da;
            color: #ffffff;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: "Space Mono", monospace;
            font-weight: 700;
            transition: all 0.2s ease;
            font-size: 0.85rem;
        }

        button:hover {
            background: #4da8da;
            color: #0a1428;
        }

        button.active {
            background: #4da8da;
            color: #0a1428;
        }

        select {
            background: #2a4a6a;
            border: 2px solid #4da8da;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: "Space Mono", monospace;
            font-size: 0.9rem;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #2a4a6a;
            outline: none;
            -webkit-appearance: none;
            accent-color: #4da8da;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #7dd3fc;
            cursor: pointer;
            border: 2px solid #4da8da;
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #7dd3fc;
            cursor: pointer;
            border: 2px solid #4da8da;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }

        .stat-box {
            background: #0a1428;
            border-left: 3px solid #4da8da;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .stat-value {
            font-weight: 700;
            color: #7dd3fc;
            font-size: 1.2rem;
        }

        .stat-label {
            color: #888;
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .preset-button {
            padding: 8px 12px;
            font-size: 0.8rem;
        }

        .hint {
            color: #666;
            font-size: 0.8rem;
            margin-top: 12px;
            padding: 10px;
            background: #0a1428;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧬 Game of Life</h1>
        <p class="subtitle">Conway's cellular automaton — watch chaos organize into patterns</p>

        <div class="content">
            <div>
                <canvas id="canvas" width="400" height="400"></canvas>
                <div class="hint">💡 Click cells to draw, hit Play to evolve</div>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label class="control-label">PLAYBACK</label>
                    <div class="button-group">
                        <button id="playBtn">▶ Play</button>
                        <button id="pauseBtn">⏸ Pause</button>
                        <button id="stepBtn">⏭ Step</button>
                        <button id="resetBtn">↻ Reset</button>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label">SPEED (gen/sec)</label>
                    <input type="range" id="speedSlider" min="1" max="10" value="3">
                    <div style="color: #888; font-size: 0.8rem; margin-top: 4px;">
                        <span id="speedValue">3</span> gen/sec
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label">PRESETS</label>
                    <select id="presetSelect">
                        <option value="clear">Clear</option>
                        <option value="random">Random</option>
                        <option value="glider">Glider</option>
                        <option value="blinker">Blinker</option>
                        <option value="toad">Toad</option>
                        <option value="beacon">Beacon</option>
                        <option value="pulsar">Pulsar</option>
                        <option value="glidergun">Gosper Gun</option>
                    </select>
                </div>

                <div class="control-group">
                    <label class="control-label">STATISTICS</label>
                    <div class="stats">
                        <div class="stat-box">
                            <div class="stat-value" id="genValue">0</div>
                            <div class="stat-label">Generation</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value" id="cellValue">0</div>
                            <div class="stat-label">Live Cells</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value" id="densityValue">0%</div>
                            <div class="stat-label">Density</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value" id="statusValue">Still</div>
                            <div class="stat-label">Pattern</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GRID_SIZE = 50;
        const CELL_SIZE = 8;

        let grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));
        let nextGrid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));
        let generation = 0;
        let isPlaying = false;
        let speed = 3;
        let lastGen = [];

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let animationId = null;

        // Initialize UI
        document.getElementById('playBtn').addEventListener('click', play);
        document.getElementById('pauseBtn').addEventListener('click', pause);
        document.getElementById('stepBtn').addEventListener('click', step);
        document.getElementById('resetBtn').addEventListener('click', reset);
        document.getElementById('speedSlider').addEventListener('input', (e) => {
            speed = parseInt(e.target.value);
            document.getElementById('speedValue').textContent = speed;
        });
        document.getElementById('presetSelect').addEventListener('change', (e) => {
            loadPreset(e.target.value);
        });

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / CELL_SIZE);
            const y = Math.floor((e.clientY - rect.top) / CELL_SIZE);
            if (x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE) {
                grid[y][x] = grid[y][x] ? 0 : 1;
                draw();
            }
        });

        function play() {
            isPlaying = true;
            document.getElementById('playBtn').classList.add('active');
        }

        function pause() {
            isPlaying = false;
            document.getElementById('playBtn').classList.remove('active');
        }

        function step() {
            evolve();
        }

        function reset() {
            grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));
            generation = 0;
            isPlaying = false;
            document.getElementById('playBtn').classList.remove('active');
            draw();
        }

        function loadPreset(preset) {
            grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));
            generation = 0;
            isPlaying = false;

            const patterns = {
                random: () => {
                    for (let i = 0; i < GRID_SIZE; i++) {
                        for (let j = 0; j < GRID_SIZE; j++) {
                            grid[i][j] = Math.random() > 0.85 ? 1 : 0;
                        }
                    }
                },
                glider: () => {
                    const pos = [10, 10];
                    grid[pos[0]][pos[1] + 1] = 1;
                    grid[pos[0] + 1][pos[1] + 2] = 1;
                    grid[pos[0] + 2][pos[1]] = 1;
                    grid[pos[0] + 2][pos[1] + 1] = 1;
                    grid[pos[0] + 2][pos[1] + 2] = 1;
                },
                blinker: () => {
                    const pos = [25, 20];
                    grid[pos[0]][pos[1]] = 1;
                    grid[pos[0]][pos[1] + 1] = 1;
                    grid[pos[0]][pos[1] + 2] = 1;
                },
                toad: () => {
                    const pos = [24, 20];
                    grid[pos[0]][pos[1] + 1] = 1;
                    grid[pos[0]][pos[1] + 2] = 1;
                    grid[pos[0]][pos[1] + 3] = 1;
                    grid[pos[0] + 1][pos[1]] = 1;
                    grid[pos[0] + 1][pos[1] + 1] = 1;
                    grid[pos[0] + 1][pos[1] + 2] = 1;
                },
                beacon: () => {
                    const pos = [23, 20];
                    grid[pos[0]][pos[1]] = 1;
                    grid[pos[0]][pos[1] + 1] = 1;
                    grid[pos[0] + 1][pos[1]] = 1;
                    grid[pos[0] + 3][pos[1] + 2] = 1;
                    grid[pos[0] + 3][pos[1] + 3] = 1;
                    grid[pos[0] + 2][pos[1] + 3] = 1;
                },
                pulsar: () => {
                    const pos = [15, 12];
                    const pattern = [
                        [0, 2], [0, 3], [0, 4], [0, 8], [0, 9], [0, 10],
                        [2, 0], [3, 0], [4, 0], [8, 0], [9, 0], [10, 0],
                        [2, 5], [3, 5], [4, 5], [8, 5], [9, 5], [10, 5],
                        [2, 7], [3, 7], [4, 7], [8, 7], [9, 7], [10, 7],
                        [5, 2], [5, 3], [5, 4], [5, 8], [5, 9], [5, 10],
                        [7, 2], [7, 3], [7, 4], [7, 8], [7, 9], [7, 10]
                    ];
                    pattern.forEach(([y, x]) => {
                        grid[pos[0] + y] && (grid[pos[0] + y][pos[1] + x] = 1);
                    });
                },
                glidergun: () => {
                    const pattern = [
                        [0, 24], [1, 22], [1, 24], [2, 12], [2, 13], [2, 20], [2, 21], [2, 34], [2, 35],
                        [3, 11], [3, 15], [3, 20], [3, 21], [3, 34], [3, 35],
                        [4, 0], [4, 1], [4, 11], [4, 16], [4, 20], [4, 21],
                        [5, 0], [5, 1], [5, 11], [5, 15], [5, 22], [5, 24],
                        [6, 11], [6, 13], [6, 16], [6, 22], [6, 24],
                        [7, 12], [7, 13], [7, 14], [7, 15], [7, 22], [7, 24]
                    ];
                    pattern.forEach(([y, x]) => {
                        if (y < GRID_SIZE && x < GRID_SIZE) grid[y][x] = 1;
                    });
                }
            };

            if (patterns[preset]) patterns[preset]();
            draw();
        }

        function countNeighbors(x, y) {
            let count = 0;
            for (let dx = -1; dx <= 1; dx++) {
                for (let dy = -1; dy <= 1; dy++) {
                    if (dx === 0 && dy === 0) continue;
                    const nx = (x + dx + GRID_SIZE) % GRID_SIZE;
                    const ny = (y + dy + GRID_SIZE) % GRID_SIZE;
                    count += grid[ny][nx];
                }
            }
            return count;
        }

        function evolve() {
            lastGen = grid.map(row => [...row]);
            nextGrid = grid.map(row => [...row]);

            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const neighbors = countNeighbors(x, y);
                    const alive = grid[y][x];

                    if (alive && (neighbors === 2 || neighbors === 3)) {
                        nextGrid[y][x] = 1; // Survives
                    } else if (!alive && neighbors === 3) {
                        nextGrid[y][x] = 1; // Birth
                    } else {
                        nextGrid[y][x] = 0; // Dies or stays dead
                    }
                }
            }

            grid = nextGrid.map(row => [...row]);
            generation++;
            updateStats();
            draw();
        }

        function updateStats() {
            const liveCells = grid.flat().reduce((a, b) => a + b, 0);
            const density = ((liveCells / (GRID_SIZE * GRID_SIZE)) * 100).toFixed(1);

            let status = 'Still';
            if (generation > 0) {
                const changed = grid.flat().reduce((sum, cell, i) => sum + (cell !== lastGen.flat()[i] ? 1 : 0), 0);
                if (changed === 0) status = 'Still';
                else if (changed <= 2) status = 'Stable';
                else status = 'Growing';
            }

            document.getElementById('genValue').textContent = generation;
            document.getElementById('cellValue').textContent = liveCells;
            document.getElementById('densityValue').textContent = density + '%';
            document.getElementById('statusValue').textContent = status;
        }

        function draw() {
            ctx.fillStyle = '#0a1428';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    if (grid[y][x]) {
                        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE - 1, CELL_SIZE - 1);
                    }
                }
            }

            // Grid lines (subtle)
            ctx.strokeStyle = '#1f4d7f';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }
        }

        let lastTime = 0;
        let generationTimer = 0;

        function animate(currentTime) {
            if (!lastTime) lastTime = currentTime;
            const elapsed = currentTime - lastTime;
            lastTime = currentTime;

            generationTimer += elapsed;
            const timePerGen = 1000 / speed;

            if (isPlaying && generationTimer >= timePerGen) {
                evolve();
                generationTimer = 0;
            }

            animationId = requestAnimationFrame(animate);
        }

        draw();
        updateStats();
        animationId = requestAnimationFrame(animate);
    </script>
</body>
</html>
