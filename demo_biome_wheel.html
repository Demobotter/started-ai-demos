<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biome Wheel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #1a472a 0%, #0f2818 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #e8f5e9;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: rgba(10, 20, 10, 0.8);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            margin-bottom: 8px;
            color: #81c784;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #a5d6a7;
            margin-bottom: 30px;
        }
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }
        canvas {
            background: #0a1a0a;
            border-radius: 8px;
            border: 1px solid #2e7d32;
            width: 100%;
            height: 500px;
            display: block;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .control-group {
            background: rgba(46, 125, 50, 0.1);
            padding: 16px;
            border-radius: 8px;
            border-left: 3px solid #66bb6a;
        }
        .control-label {
            font-size: 12px;
            color: #a5d6a7;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: block;
        }
        button {
            background: #2e7d32;
            color: #e8f5e9;
            border: 1px solid #43a047;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 4px;
            text-align: left;
        }
        button:hover {
            background: #43a047;
            box-shadow: 0 0 12px rgba(66, 160, 71, 0.4);
        }
        button.active {
            background: #81c784;
            color: #0a1a0a;
            font-weight: 700;
        }
        .stat-box {
            background: rgba(129, 199, 132, 0.1);
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #66bb6a;
            margin-bottom: 8px;
        }
        .stat-label {
            font-size: 11px;
            color: #a5d6a7;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-value {
            font-size: 18px;
            color: #81c784;
            font-weight: 700;
            margin-top: 4px;
            font-family: 'Playfair Display', serif;
        }
        .biome-info {
            background: rgba(67, 160, 71, 0.15);
            padding: 14px;
            border-radius: 6px;
            border-left: 3px solid #81c784;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .biome-name {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: #81c784;
            margin-bottom: 8px;
        }
        .biome-detail {
            font-size: 12px;
            color: #c8e6c9;
            line-height: 1.6;
        }
        .fauna-icons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }
        .fauna-icon {
            font-size: 20px;
            display: inline-block;
        }
        #toggleExamples {
            width: 100%;
            padding: 12px;
        }
        @media (max-width: 900px) {
            .content {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Biome Wheel</h1>
        <p class="subtitle">Click any biome to see its temperature, rainfall, and animals.</p>
        
        <div class="content">
            <div style="display: flex; flex-direction: column; gap: 16px;">
                <canvas id="biomeCanvas"></canvas>
                <button id="toggleExamples">Show Real-World Examples</button>
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <span class="control-label">Select Biome</span>
                    <button id="btn-tropical">Tropical Rainforest</button>
                    <button id="btn-savanna">Savanna</button>
                    <button id="btn-desert">Desert</button>
                    <button id="btn-temperate">Temperate Forest</button>
                    <button id="btn-taiga">Taiga</button>
                    <button id="btn-tundra">Tundra</button>
                    <button id="btn-alpine">Alpine</button>
                    <button id="btn-aquatic">Aquatic</button>
                </div>
                
                <div class="biome-info">
                    <div class="biome-name" id="biomeName">Click a biome</div>
                    <div class="biome-detail" id="biomeDetail">
                        <div>Temperature & rainfall data will appear here.</div>
                    </div>
                    <div class="fauna-icons" id="faunaIcons"></div>
                </div>
                
                <div id="examplesBox" style="display: none;">
                    <div class="stat-box">
                        <div class="stat-label">Real-World Examples</div>
                        <div class="stat-value" id="examples" style="font-size: 14px; margin-top: 8px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('biomeCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas resolution
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Biome data (Köppen climate zones + real data)
        const biomes = {
            tropical: {
                name: 'Tropical Rainforest',
                temp: '24–28 °C',
                precip: '2000–10000 mm/yr',
                altitude: '0–500 m',
                latitude: '0–30°N/S',
                fauna: ['🦋', '🦜', '🐆', '🐍', '🦗', '🦁'],
                examples: 'Amazon (Brazil), Congo Basin (Africa), Southeast Asia',
                color: '#2e7d32',
                angle: 0
            },
            savanna: {
                name: 'Savanna',
                temp: '20–25 °C',
                precip: '500–1500 mm/yr',
                altitude: '0–1000 m',
                latitude: '15–30°N/S',
                fauna: ['🦓', '🦁', '🦒', '🦏', '🐘', '🦅'],
                examples: 'Serengeti (Tanzania), Cerrado (Brazil), African Sahel',
                color: '#f57c00',
                angle: 45
            },
            desert: {
                name: 'Desert',
                temp: '10–30 °C',
                precip: '0–250 mm/yr',
                altitude: '0–2000 m',
                latitude: '15–35°N/S',
                fauna: ['🐫', '🦎', '🦂', '🐍', '🌵', '🦅'],
                examples: 'Sahara (Africa), Arabian (Middle East), Atacama (Chile)',
                color: '#fdd835',
                angle: 90
            },
            temperate: {
                name: 'Temperate Forest',
                temp: '5–15 °C',
                precip: '750–1500 mm/yr',
                altitude: '0–1500 m',
                latitude: '35–50°N/S',
                fauna: ['🦌', '🦊', '🐻', '🦅', '🐿️', '🦡'],
                examples: 'Eastern North America, Europe, Japan',
                color: '#558b2f',
                angle: 135
            },
            taiga: {
                name: 'Taiga',
                temp: '−15–5 °C',
                precip: '300–900 mm/yr',
                altitude: '0–1000 m',
                latitude: '50–70°N',
                fauna: ['🦌', '🐻', '🐺', '🦫', '🦅', '🦌'],
                examples: 'Canada, Russia, Scandinavia',
                color: '#6d4c41',
                angle: 180
            },
            tundra: {
                name: 'Tundra',
                temp: '−20–0 °C',
                precip: '100–600 mm/yr',
                altitude: '0–500 m',
                latitude: '70–90°N/S',
                fauna: ['🦌', '🐻‍❄️', '🐺', '🦦', '🦢', '🦙'],
                examples: 'Arctic (Russia, Canada, Greenland), Antarctic fringe',
                color: '#90a4ae',
                angle: 225
            },
            alpine: {
                name: 'Alpine',
                temp: '−10–2 °C',
                precip: '500–2000 mm/yr',
                altitude: '2000–4000 m',
                latitude: '0–60°N/S',
                fauna: ['🦙', '🦅', '🪨', '🐐', '🦌', '🦊'],
                examples: 'Rocky Mountains (USA), Alps (Europe), Himalayas (Asia)',
                color: '#7e57c2',
                angle: 270
            },
            aquatic: {
                name: 'Aquatic',
                temp: '0–20 °C',
                precip: 'N/A (water)',
                altitude: '−11000–0 m',
                latitude: 'Global',
                fauna: ['🐋', '🦈', '🐠', '🦀', '🦑', '🦭'],
                examples: 'Ocean (global), Great Lakes, Amazon River',
                color: '#0277bd',
                angle: 315
            }
        };

        let selectedBiome = null;
        let showExamples = false;

        function drawBiomeWheel() {
            const centerX = canvas.width / (2 * window.devicePixelRatio);
            const centerY = canvas.height / (2 * window.devicePixelRatio);
            const innerRadius = 60;
            const middleRadius = 110;
            const outerRadius = 160;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw concentric circles
            ctx.strokeStyle = '#2e7d32';
            ctx.lineWidth = 1;
            for (let r = innerRadius; r <= outerRadius; r += 30) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Draw radial lines for each biome
            ctx.strokeStyle = '#1b5e20';
            ctx.lineWidth = 1;
            for (let i = 0; i < 8; i++) {
                const angle = (i * Math.PI / 4);
                const x = centerX + Math.cos(angle) * outerRadius;
                const y = centerY + Math.sin(angle) * outerRadius;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(x, y);
                ctx.stroke();
            }

            // Draw biome segments
            Object.values(biomes).forEach((biome, idx) => {
                const startAngle = (idx * Math.PI / 4) - Math.PI / 8;
                const endAngle = startAngle + Math.PI / 4;

                // Segment fill
                ctx.fillStyle = biome.color;
                ctx.globalAlpha = selectedBiome === biome.name ? 0.6 : 0.3;
                ctx.beginPath();
                ctx.arc(centerX, centerY, outerRadius, startAngle, endAngle);
                ctx.lineTo(centerX, centerY);
                ctx.fill();
                ctx.globalAlpha = 1;

                // Biome label
                const labelAngle = (startAngle + endAngle) / 2;
                const labelRadius = middleRadius;
                const labelX = centerX + Math.cos(labelAngle) * labelRadius;
                const labelY = centerY + Math.sin(labelAngle) * labelRadius;

                ctx.fillStyle = '#e8f5e9';
                ctx.font = 'bold 12px Space Mono';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Rotate text to follow wheel
                ctx.save();
                ctx.translate(labelX, labelY);
                ctx.rotate(labelAngle + Math.PI / 2);
                ctx.fillText(biome.name.split(' ')[0], 0, 0);
                ctx.restore();
            });

            // Center circle
            ctx.fillStyle = '#0a1a0a';
            ctx.beginPath();
            ctx.arc(centerX, centerY, innerRadius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#81c784';
            ctx.font = 'bold 14px Playfair Display';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('EARTH', centerX, centerY - 8);
            ctx.font = '11px Space Mono';
            ctx.fillText('Köppen Zones', centerX, centerY + 10);
        }

        function showBiomeDetails(biomeName) {
            selectedBiome = biomeName;
            const biome = biomes[Object.keys(biomes).find(k => biomes[k].name === biomeName)];
            
            if (biome) {
                document.getElementById('biomeName').textContent = biome.name;
                document.getElementById('biomeDetail').innerHTML = `
                    <strong>Temperature:</strong> ${biome.temp}<br>
                    <strong>Rainfall:</strong> ${biome.precip}<br>
                    <strong>Altitude:</strong> ${biome.altitude}<br>
                    <strong>Latitude:</strong> ${biome.latitude}
                `;
                document.getElementById('faunaIcons').innerHTML = biome.fauna.map(f => `<span class="fauna-icon">${f}</span>`).join('');
                
                if (showExamples) {
                    document.getElementById('examples').textContent = biome.examples;
                }
            }
            drawBiomeWheel();
        }

        // Event listeners for biome buttons
        Object.keys(biomes).forEach(key => {
            document.getElementById(`btn-${key}`).addEventListener('click', () => {
                showBiomeDetails(biomes[key].name);
                document.querySelectorAll('.control-group button').forEach(btn => {
                    btn.classList.remove('active');
                });
                event.target.classList.add('active');
            });
        });

        // Toggle examples
        document.getElementById('toggleExamples').addEventListener('click', () => {
            showExamples = !showExamples;
            const exBox = document.getElementById('examplesBox');
            if (showExamples) {
                exBox.style.display = 'block';
                document.getElementById('toggleExamples').classList.add('active');
                if (selectedBiome) {
                    const biome = biomes[Object.keys(biomes).find(k => biomes[k].name === selectedBiome)];
                    document.getElementById('examples').textContent = biome.examples;
                }
            } else {
                exBox.style.display = 'none';
                document.getElementById('toggleExamples').classList.remove('active');
            }
        });

        // Initial draw
        drawBiomeWheel();
    </script>
</body>
</html>
