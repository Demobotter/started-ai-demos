<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diatonic Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1a1625 0%, #2d1b3d 100%);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: rgba(20, 10, 25, 0.9);
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.2rem;
      margin-bottom: 8px;
      color: #d4a5ff;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #a0a0a0;
      margin-bottom: 30px;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      font-weight: 600;
      font-size: 0.85rem;
      color: #b0b0ff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select, button {
      background: rgba(100, 60, 140, 0.3);
      border: 1px solid #6644aa;
      color: #e0e0e0;
      padding: 10px 12px;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    select:hover, button:hover {
      background: rgba(100, 60, 140, 0.5);
      border-color: #8866cc;
    }
    select:focus, button:focus {
      outline: none;
      border-color: #aa88ff;
      box-shadow: 0 0 8px rgba(170, 136, 255, 0.4);
    }
    button {
      background: rgba(80, 200, 200, 0.2);
      border-color: #50c8c8;
      font-weight: 600;
    }
    button:hover {
      background: rgba(80, 200, 200, 0.35);
      border-color: #70e8e8;
    }
    button:active {
      transform: scale(0.98);
    }
    .piano-section {
      margin-bottom: 30px;
    }
    .piano-label {
      font-weight: 600;
      font-size: 0.85rem;
      color: #b0b0ff;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: block;
    }
    .piano-keys {
      display: flex;
      gap: 0;
      margin-bottom: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .key {
      width: 50px;
      height: 140px;
      background: #f5f5f5;
      border: 2px solid #333;
      border-radius: 0 0 6px 6px;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: #333;
      transition: all 0.1s;
      position: relative;
    }
    .key:hover {
      background: #fff;
      transform: translateY(-2px);
    }
    .key.active {
      background: #70e8e8;
      border-color: #00ffff;
      color: #0a0a0a;
      box-shadow: 0 0 12px rgba(112, 232, 232, 0.6);
    }
    .key.in-chord {
      background: #d4a5ff;
      border-color: #b88fff;
      color: #2a1a3a;
    }
    .key.root {
      background: #ff9999;
      border-color: #ff6666;
      color: #1a0a0a;
      font-weight: 700;
    }
    .key.root.active {
      background: #ff5555;
      box-shadow: 0 0 12px rgba(255, 85, 85, 0.6);
    }
    .chord-display {
      background: rgba(70, 30, 100, 0.3);
      border: 1px solid #7744bb;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }
    .chord-name {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      color: #d4a5ff;
      margin-bottom: 8px;
    }
    .chord-notes {
      font-size: 0.9rem;
      color: #b0b0ff;
      letter-spacing: 1px;
    }
    .chord-type {
      font-size: 0.8rem;
      color: #8888bb;
      margin-top: 6px;
    }
    .info-panel {
      background: rgba(50, 100, 120, 0.2);
      border: 1px solid #4da6cc;
      border-radius: 8px;
      padding: 16px;
      font-size: 0.85rem;
      color: #a0d0e0;
      line-height: 1.6;
    }
    .info-label {
      font-weight: 600;
      color: #70e8e8;
      display: block;
      margin-bottom: 4px;
    }
    @media (max-width: 700px) {
      .controls {
        grid-template-columns: 1fr;
      }
      .key {
        width: 45px;
        height: 120px;
        font-size: 0.7rem;
      }
      h1 {
        font-size: 1.8rem;
      }
      .chord-name {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎹 Diatonic Explorer</h1>
    <div class="subtitle">Pick a key and mode, drag the keyboard to explore chord harmony</div>
    
    <div class="controls">
      <div class="control-group">
        <label for="keySelect">Root Key</label>
        <select id="keySelect">
          <option>C</option>
          <option>D</option>
          <option>E</option>
          <option>F</option>
          <option>G</option>
          <option>A</option>
          <option>B</option>
        </select>
      </div>
      <div class="control-group">
        <label for="modeSelect">Mode</label>
        <select id="modeSelect">
          <option>Major</option>
          <option>Minor (Natural)</option>
          <option>Dorian</option>
          <option>Phrygian</option>
          <option>Lydian</option>
          <option>Mixolydian</option>
        </select>
      </div>
    </div>

    <div class="chord-display">
      <div class="chord-name" id="chordName">C Major</div>
      <div class="chord-notes" id="chordNotes">C · E · G</div>
      <div class="chord-type" id="chordType">I (Tonic)</div>
    </div>

    <div class="piano-section">
      <span class="piano-label">Drag or click a key to hear the chord</span>
      <div class="piano-keys" id="pianoKeys"></div>
    </div>

    <div class="info-panel">
      <span class="info-label">Diatonic Chords</span>
      <span id="diatonicInfo">Select a root key and mode to see the 7 chords built from that scale.</span>
    </div>
  </div>

  <script>
    // Note frequencies (A4 = 440 Hz)
    const noteFreqs = {
      'C': 261.63, 'C#': 277.18, 'D': 293.66, 'D#': 311.13,
      'E': 329.63, 'F': 349.23, 'F#': 369.99, 'G': 392.00,
      'G#': 415.30, 'A': 440.00, 'A#': 466.16, 'B': 493.88
    };

    const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

    // Scale intervals (semitones from root)
    const scales = {
      'Major': [0, 2, 4, 5, 7, 9, 11],
      'Minor (Natural)': [0, 2, 3, 5, 7, 8, 10],
      'Dorian': [0, 2, 3, 5, 7, 9, 10],
      'Phrygian': [0, 1, 3, 5, 7, 8, 10],
      'Lydian': [0, 2, 4, 6, 7, 9, 11],
      'Mixolydian': [0, 2, 4, 5, 7, 9, 10]
    };

    const chordTypes = ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'];
    const majorChordIntervals = [0, 4, 7];
    const minorChordIntervals = [0, 3, 7];
    const dimChordIntervals = [0, 3, 6];

    let audioContext;
    let currentChord = [];
    let diatonicChords = [];
    let selectedScaleDegree = 0;

    function initAudio() {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    function getScaleDegreeNote(root, degree, scale) {
      const rootIdx = notes.indexOf(root);
      const interval = scale[degree % 7];
      return notes[(rootIdx + interval) % 12];
    }

    function buildDiatonicChords(root, scale) {
      const chords = [];
      for (let i = 0; i < 7; i++) {
        const chordRoot = getScaleDegreeNote(root, i, scale);
        const third = getScaleDegreeNote(root, i + 2, scale);
        const fifth = getScaleDegreeNote(root, i + 4, scale);
        chords.push([chordRoot, third, fifth]);
      }
      return chords;
    }

    function playChord(noteNames) {
      initAudio();
      if (audioContext.state === 'suspended') audioContext.resume();

      const now = audioContext.currentTime;
      const gain = audioContext.createGain();
      gain.connect(audioContext.destination);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);

      noteNames.forEach((note, idx) => {
        const osc = audioContext.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = noteFreqs[note];
        osc.connect(gain);
        osc.start(now);
        osc.stop(now + 1.5);
      });
    }

    function renderPiano() {
      const pianoDiv = document.getElementById('pianoKeys');
      pianoDiv.innerHTML = '';
      const displayed = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
      displayed.forEach((note, idx) => {
        const key = document.createElement('div');
        key.className = 'key';
        key.textContent = note;
        key.addEventListener('click', () => selectScaleDegree(idx));
        pianoDiv.appendChild(key);
      });
      updatePianoHighlight();
    }

    function selectScaleDegree(degree) {
      selectedScaleDegree = degree;
      updateChordDisplay();
      updatePianoHighlight();
      playChord(diatonicChords[degree]);
    }

    function updateChordDisplay() {
      const root = document.getElementById('keySelect').value;
      const mode = document.getElementById('modeSelect').value;
      const scale = scales[mode];

      if (selectedScaleDegree >= 0 && selectedScaleDegree < diatonicChords.length) {
        currentChord = diatonicChords[selectedScaleDegree];
        const chordRoot = currentChord[0];
        const chordType = chordTypes[selectedScaleDegree];
        const chordTypeStr = selectedScaleDegree <= 2 || selectedScaleDegree === 4 || selectedScaleDegree === 5 
          ? (selectedScaleDegree === 6 ? 'Diminished' : 'Major/Minor')
          : 'varies';

        document.getElementById('chordName').textContent = `${chordRoot} ${selectedScaleDegree === 6 ? 'Dim' : ''}`;
        document.getElementById('chordNotes').textContent = currentChord.join(' · ');
        document.getElementById('chordType').textContent = `${chordType} in ${root} ${mode}`;
      }
    }

    function updatePianoHighlight() {
      const keys = document.querySelectorAll('.key');
      const displayed = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
      keys.forEach((key, idx) => {
        key.classList.remove('active', 'in-chord', 'root');
        if (idx === selectedScaleDegree) {
          key.classList.add('active', 'root');
        } else if (currentChord.includes(displayed[idx])) {
          key.classList.add('in-chord');
        }
      });
    }

    document.getElementById('keySelect').addEventListener('change', () => {
      const root = document.getElementById('keySelect').value;
      const mode = document.getElementById('modeSelect').value;
      const scale = scales[mode];
      diatonicChords = buildDiatonicChords(root, scale);
      selectedScaleDegree = 0;
      updateChordDisplay();
      updatePianoHighlight();
      updateDiatonicInfo();
    });

    document.getElementById('modeSelect').addEventListener('change', () => {
      const root = document.getElementById('keySelect').value;
      const mode = document.getElementById('modeSelect').value;
      const scale = scales[mode];
      diatonicChords = buildDiatonicChords(root, scale);
      selectedScaleDegree = 0;
      updateChordDisplay();
      updatePianoHighlight();
      updateDiatonicInfo();
    });

    function updateDiatonicInfo() {
      const root = document.getElementById('keySelect').value;
      const mode = document.getElementById('modeSelect').value;
      const info = `${root} ${mode} scale chords: ${diatonicChords.map((c, i) => `${chordTypes[i]} = ${c.join('-')}`).join(', ')}`;
      document.getElementById('diatonicInfo').textContent = info;
    }

    // Init
    renderPiano();
    const root = document.getElementById('keySelect').value;
    const mode = document.getElementById('modeSelect').value;
    const scale = scales[mode];
    diatonicChords = buildDiatonicChords(root, scale);
    updateChordDisplay();
    updateDiatonicInfo();
  </script>
</body>
</html>
