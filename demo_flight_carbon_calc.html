<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Carbon Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Playfair Display', 'Segoe UI', serif;
            background: linear-gradient(135deg, #0a1428 0%, #1a3a52 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #ffffff;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(15, 25, 50, 0.95);
            border: 2px solid #4da8da;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(77, 168, 218, 0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
            color: #4da8da;
        }
        .header p {
            font-size: 1em;
            color: #a0c4dd;
            font-style: italic;
        }
        .inputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        @media (max-width: 600px) {
            .inputs-grid {
                grid-template-columns: 1fr;
            }
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        .input-group label {
            font-size: 0.9em;
            color: #4da8da;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .input-group input,
        .input-group select {
            padding: 12px;
            border: 1px solid #4da8da;
            background: rgba(15, 35, 70, 0.8);
            color: #ffffff;
            border-radius: 6px;
            font-size: 1em;
            font-family: 'Space Mono', monospace;
        }
        .input-group input::placeholder {
            color: #5a8cab;
        }
        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: #7dd3fc;
            box-shadow: 0 0 8px rgba(125, 211, 252, 0.3);
        }
        .examples {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            margin-top: -10px;
        }
        .example-btn {
            padding: 8px 14px;
            background: rgba(77, 168, 218, 0.2);
            border: 1px solid #4da8da;
            color: #4da8da;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s ease;
        }
        .example-btn:hover {
            background: rgba(77, 168, 218, 0.4);
            border-color: #7dd3fc;
            color: #7dd3fc;
        }
        .calculate-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #4da8da 0%, #7dd3fc 100%);
            border: none;
            color: #0a1428;
            font-size: 1.1em;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }
        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(77, 168, 218, 0.4);
        }
        .calculate-btn:active {
            transform: translateY(0);
        }
        .results {
            display: none;
            background: rgba(10, 20, 40, 0.8);
            border: 1px solid #4da8da;
            border-radius: 10px;
            padding: 30px;
        }
        .results.show {
            display: block;
        }
        .results-title {
            font-size: 1.3em;
            color: #4da8da;
            margin-bottom: 20px;
            text-align: center;
        }
        .co2-badge {
            background: linear-gradient(135deg, rgba(77, 168, 218, 0.3) 0%, rgba(0, 100, 150, 0.2) 100%);
            border: 2px solid #4da8da;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            margin-bottom: 25px;
        }
        .co2-value {
            font-size: 2.5em;
            color: #7dd3fc;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
        }
        .co2-label {
            font-size: 0.9em;
            color: #a0c4dd;
            margin-top: 8px;
        }
        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        @media (max-width: 600px) {
            .results-grid {
                grid-template-columns: 1fr;
            }
        }
        .stat-card {
            background: rgba(15, 35, 70, 0.8);
            border-left: 3px solid #4da8da;
            padding: 15px;
            border-radius: 6px;
        }
        .stat-label {
            font-size: 0.8em;
            color: #5a8cab;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .stat-value {
            font-size: 1.5em;
            color: #7dd3fc;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
        }
        .offset-section {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid rgba(77, 168, 218, 0.3);
        }
        .offset-title {
            font-size: 1.1em;
            color: #4da8da;
            margin-bottom: 15px;
        }
        .offset-items {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 600px) {
            .offset-items {
                grid-template-columns: 1fr;
            }
        }
        .offset-item {
            background: rgba(77, 168, 218, 0.1);
            border: 1px solid rgba(77, 168, 218, 0.3);
            padding: 12px;
            border-radius: 6px;
        }
        .offset-item-title {
            font-size: 0.9em;
            color: #4da8da;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .offset-item-value {
            font-size: 1.3em;
            color: #7dd3fc;
            font-family: 'Space Mono', monospace;
        }
        .comparison {
            background: rgba(77, 168, 218, 0.1);
            border: 1px solid rgba(77, 168, 218, 0.3);
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            font-size: 0.95em;
            color: #a0c4dd;
        }
        .error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid #dc3545;
            color: #ff6b7a;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }
        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✈️ Flight Carbon</h1>
            <p>Calculate real CO₂ for any flight and find offset strategies</p>
        </div>

        <div class="error" id="error"></div>

        <div class="inputs-grid">
            <div class="input-group">
                <label for="departure">Departure Airport</label>
                <input type="text" id="departure" placeholder="e.g., LAX, LHR, SYD" autocomplete="off">
            </div>
            <div class="input-group">
                <label for="arrival">Arrival Airport</label>
                <input type="text" id="arrival" placeholder="e.g., NYC, JFK, MEL" autocomplete="off">
            </div>
            <div class="input-group">
                <label for="cabin">Cabin Class</label>
                <select id="cabin">
                    <option value="economy">Economy (1x)</option>
                    <option value="premium">Premium Economy (2.3x)</option>
                    <option value="business">Business (4x)</option>
                    <option value="first">First Class (8x)</option>
                </select>
            </div>
            <div class="input-group">
                <label for="passengers">Number of Passengers</label>
                <input type="number" id="passengers" value="1" min="1" max="100">
            </div>
        </div>

        <div class="examples">
            <button class="example-btn" onclick="loadExample('LAX', 'NYC')">LAX → NYC</button>
            <button class="example-btn" onclick="loadExample('LHR', 'JFK')">LHR → JFK</button>
            <button class="example-btn" onclick="loadExample('SYD', 'LAX')">SYD → LAX</button>
            <button class="example-btn" onclick="loadExample('CDG', 'DXB')">CDG → DXB</button>
            <button class="example-btn" onclick="loadExample('NRT', 'SFO')">NRT → SFO</button>
        </div>

        <button class="calculate-btn" onclick="calculate()">Calculate Carbon Emissions</button>

        <div class="results" id="results">
            <div class="results-title">Your Flight Impact</div>

            <div class="co2-badge">
                <div class="co2-value" id="totalCo2">—</div>
                <div class="co2-label">Total CO₂ for all passengers</div>
            </div>

            <div class="results-grid">
                <div class="stat-card">
                    <div class="stat-label">CO₂ per Passenger</div>
                    <div class="stat-value" id="perPassenger">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Distance (Great Circle)</div>
                    <div class="stat-value" id="distance">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Fuel Burned (approx)</div>
                    <div class="stat-value" id="fuel">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Carbon Cost ($)</div>
                    <div class="stat-value" id="carbonCost">—</div>
                </div>
            </div>

            <div class="offset-section">
                <div class="offset-title">Offset Strategies</div>
                <div class="offset-items">
                    <div class="offset-item">
                        <div class="offset-item-title">🌱 Trees to Plant</div>
                        <div class="offset-item-value" id="trees">—</div>
                    </div>
                    <div class="offset-item">
                        <div class="offset-item-title">⚡ Renewable Energy Cost</div>
                        <div class="offset-item-value" id="renewable">—</div>
                    </div>
                </div>
            </div>

            <div class="comparison" id="comparison">—</div>
        </div>
    </div>

    <script>
        // Airport database: code -> [lat, lon, name]
        const airports = {
            'LAX': [33.9425, -118.4081, 'Los Angeles'],
            'NYC': [40.6895, -74.0192, 'New York (JFK)'],
            'JFK': [40.6413, -73.7781, 'New York (JFK)'],
            'LHR': [51.4700, -0.4543, 'London Heathrow'],
            'CDG': [49.0097, 2.5479, 'Paris Charles de Gaulle'],
            'DXB': [25.2528, 55.3644, 'Dubai'],
            'SYD': [-33.9461, 151.1772, 'Sydney'],
            'MEL': [-37.6733, 144.8410, 'Melbourne'],
            'NRT': [35.7653, 140.3931, 'Tokyo Narita'],
            'SFO': [37.6213, -122.3790, 'San Francisco'],
            'ORD': [41.9742, -87.9073, 'Chicago O\'Hare'],
            'LAS': [36.0840, -115.1537, 'Las Vegas'],
            'MIA': [25.7959, -80.2870, 'Miami'],
            'ATL': [33.6407, -84.4277, 'Atlanta'],
            'DEN': [39.8561, -104.6737, 'Denver'],
            'SEA': [47.4502, -122.3088, 'Seattle'],
            'BOS': [42.3656, -71.0096, 'Boston'],
            'YVR': [49.1900, -123.1794, 'Vancouver'],
            'YYZ': [43.6777, -79.6104, 'Toronto'],
            'MEX': [25.6443, -100.3161, 'Mexico City'],
            'GRU': [-23.4356, -46.4731, 'São Paulo'],
            'AKL': [-37.2140, 174.8859, 'Auckland'],
            'SIN': [1.3521, 103.8198, 'Singapore'],
            'HKG': [22.3193, 113.9150, 'Hong Kong'],
            'BKK': [13.9075, 100.7575, 'Bangkok'],
            'DEL': [28.5562, 77.1000, 'Delhi'],
            'FCO': [41.8002, 12.2389, 'Rome Fiumicino'],
            'AMS': [52.3086, 4.7639, 'Amsterdam'],
            'FRA': [50.0379, 8.5622, 'Frankfurt'],
            'MUC': [48.3538, 11.7861, 'Munich'],
            'ZRH': [47.4647, 8.5492, 'Zurich'],
            'AUS': [30.2245, -97.8365, 'Austin'],
            'PHX': [33.7298, -112.4580, 'Phoenix'],
            'DAL': [32.8975, -97.0382, 'Dallas'],
            'HOU': [29.6452, -95.2113, 'Houston']
        };

        const cabinMultipliers = {
            'economy': 1.0,
            'premium': 2.3,
            'business': 4.0,
            'first': 8.0
        };

        // Haversine distance (km)
        function haversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth radius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // ICAO carbon calculation
        function calculateCarbon(departure, arrival, cabin, passengers) {
            const depCode = departure.toUpperCase().trim();
            const arrCode = arrival.toUpperCase().trim();

            if (!airports[depCode] || !airports[arrCode]) {
                throw new Error(`Airport not found. Try: LAX, NYC, LHR, JFK, SYD, MEL, etc.`);
            }

            const [lat1, lon1] = airports[depCode];
            const [lat2, lon2] = airports[arrCode];

            // Great-circle distance
            const distance = haversineDistance(lat1, lon1, lat2, lon2);

            // Fuel burn: vary by distance
            let fuelBurnRate;
            if (distance < 500) {
                fuelBurnRate = 2.0;
            } else if (distance < 2000) {
                fuelBurnRate = 1.9;
            } else {
                fuelBurnRate = 2.5;
            }

            const totalFuel = distance * fuelBurnRate;

            // CO₂ emissions: fuel (kg) × 3.16 × cabin multiplier × RFI
            const cabinMult = cabinMultipliers[cabin] || 1.0;
            const RFI = 2.7;

            const totalCO2kg = totalFuel * 3.16 * cabinMult * RFI;
            const co2PerPassenger = totalCO2kg / passengers;

            // Offset calculations
            const co2PerPassengerTons = co2PerPassenger / 1000;
            const treesNeeded = Math.ceil(co2PerPassenger / (21 * 10));
            const carbonPrice = 20;
            const offsetCost = (totalCO2kg / 1000) * carbonPrice;
            const offsetCostPerPax = offsetCost / passengers;

            return {
                distance: Math.round(distance),
                totalFuel: Math.round(totalFuel),
                totalCO2kg: Math.round(totalCO2kg),
                co2PerPassenger: Math.round(co2PerPassenger),
                co2PerPassengerTons: co2PerPassengerTons.toFixed(3),
                offsetCost: offsetCost.toFixed(2),
                offsetCostPerPax: offsetCostPerPax.toFixed(2),
                trees: treesNeeded,
                departure: depCode,
                arrival: arrCode
            };
        }

        function formatNumber(num) {
            return num.toLocaleString();
        }

        function calculate() {
            const dep = document.getElementById('departure').value;
            const arr = document.getElementById('arrival').value;
            const cabin = document.getElementById('cabin').value;
            const pax = parseInt(document.getElementById('passengers').value) || 1;

            const errorDiv = document.getElementById('error');
            errorDiv.classList.remove('show');

            try {
                const result = calculateCarbon(dep, arr, cabin, pax);

                // Update results
                document.getElementById('totalCo2').textContent = formatNumber(result.totalCO2kg) + ' kg';
                document.getElementById('perPassenger').textContent = formatNumber(result.co2PerPassenger) + ' kg';
                document.getElementById('distance').textContent = formatNumber(result.distance) + ' km';
                document.getElementById('fuel').textContent = formatNumber(result.totalFuel) + ' kg';
                document.getElementById('carbonCost').textContent = '$' + result.offsetCost;
                document.getElementById('trees').textContent = formatNumber(result.trees) + ' trees';
                document.getElementById('renewable').textContent = '$' + result.offsetCostPerPax + '/pax';

                // Comparison
                const paxTons = parseFloat(result.co2PerPassengerTons);
                const carAnnual = 5;
                const carMonths = (paxTons / carAnnual * 12).toFixed(1);
                const annual = (paxTons * 52).toFixed(2);
                const comp = `This 1 flight = ${carMonths} months of driving a typical car (${paxTons.toFixed(2)} tons CO₂ per person). If you fly this route weekly, that's ~${annual} tons/year per passenger.`;
                document.getElementById('comparison').textContent = comp;

                document.getElementById('results').classList.add('show');
            } catch (e) {
                errorDiv.textContent = '❌ ' + e.message;
                errorDiv.classList.add('show');
                document.getElementById('results').classList.remove('show');
            }
        }

        function loadExample(dep, arr) {
            document.getElementById('departure').value = dep;
            document.getElementById('arrival').value = arr;
            document.getElementById('cabin').value = 'economy';
            document.getElementById('passengers').value = '1';
            calculate();
        }

        // Enter key to calculate
        document.getElementById('departure').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') calculate();
        });
        document.getElementById('arrival').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') calculate();
        });
    </script>
</body>
</html>
