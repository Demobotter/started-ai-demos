<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Depth Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: #050a13;
            color: #4da8da;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: #0a1428;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 40px rgba(13, 79, 95, 0.3);
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            margin-bottom: 10px;
            color: #1e90ff;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            font-size: 12px;
            color: #7dd3fc;
            margin-bottom: 20px;
        }
        .main {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 20px;
            align-items: start;
        }
        .sidebar {
            background: #0d2438;
            border-left: 4px solid #2d9d5f;
            padding: 15px;
            border-radius: 6px;
        }
        .stat-box {
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(77, 168, 218, 0.05);
            border-radius: 4px;
            border-left: 3px solid #2d9d5f;
        }
        .stat-label {
            font-size: 11px;
            color: #7dd3fc;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 16px;
            color: #4da8da;
            font-weight: 700;
        }
        .zone-name {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: #1e90ff;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .control-group {
            margin-top: 20px;
        }
        .slider-label {
            font-size: 11px;
            color: #7dd3fc;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #0a2f51;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #4da8da;
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #4da8da;
            cursor: pointer;
            border: none;
        }
        .toggles {
            margin-top: 15px;
        }
        .toggle-btn {
            display: block;
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            background: #0a2f51;
            color: #4da8da;
            border: 1px solid #2d9d5f;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .toggle-btn:hover {
            background: #0d4f5f;
            border-color: #4da8da;
        }
        .toggle-btn.active {
            background: #2d9d5f;
            color: #050a13;
            border-color: #4da8da;
        }
        canvas {
            width: 100%;
            height: auto;
            border-radius: 6px;
            background: #050a13;
            display: block;
        }
        .depth-meter {
            text-align: center;
            font-size: 12px;
            color: #7dd3fc;
            margin-top: 10px;
        }
        @media (max-width: 768px) {
            .main {
                grid-template-columns: 1fr;
            }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌊 Ocean Depth</h1>
        <div class="subtitle">Explore life's adaptation to extreme pressure, cold, and darkness</div>
        
        <div class="main">
            <div class="sidebar">
                <div class="zone-name" id="zoneName">Sunlit</div>
                
                <div class="stat-box">
                    <div class="stat-label">Depth</div>
                    <div class="stat-value"><span id="depthValue">0</span> m</div>
                </div>
                
                <div class="stat-box">
                    <div class="stat-label">Temperature</div>
                    <div class="stat-value"><span id="tempValue">20</span>°C</div>
                </div>
                
                <div class="stat-box">
                    <div class="stat-label">Pressure</div>
                    <div class="stat-value"><span id="pressureValue">1</span> atm</div>
                </div>
                
                <div class="stat-box">
                    <div class="stat-label">Light Level</div>
                    <div class="stat-value"><span id="lightValue">100</span>%</div>
                </div>
                
                <div class="control-group">
                    <div class="slider-label">Depth (meters)</div>
                    <input type="range" id="depthSlider" min="0" max="11000" value="0" step="100">
                    <div class="depth-meter">0 ↔ 11,000</div>
                </div>
                
                <div class="toggles">
                    <button class="toggle-btn active" id="bioToggle">Bioluminescence: ON</button>
                    <button class="toggle-btn" id="pressureToggle">Pressure Gauge: OFF</button>
                    <button class="toggle-btn" id="gridToggle">Grid Lines: OFF</button>
                </div>
            </div>
            
            <div>
                <canvas id="oceanCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('oceanCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = 600;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // State
        const state = {
            depth: 0,
            showBioluminescence: true,
            showPressureGauge: true,
            showGrid: false
        };
        
        // Ocean zones
        const zones = [
            { name: 'Sunlit (Epipelagic)', min: 0, max: 200, color: '#1e90ff' },
            { name: 'Twilight (Mesopelagic)', min: 200, max: 1000, color: '#0d4f5f' },
            { name: 'Midnight (Bathypelagic)', min: 1000, max: 4000, color: '#050a13' },
            { name: 'Abyssal (Abyssopelagic)', min: 4000, max: 6000, color: '#000000' },
            { name: 'Hadal (Hadopelagic)', min: 6000, max: 11000, color: '#0a0a1a' }
        ];
        
        // Creatures with depth ranges and bioluminescence
        const creatures = [
            { name: 'Sunfish', minDepth: 0, maxDepth: 300, emoji: '🐟', bioluminescent: false },
            { name: 'Tuna', minDepth: 0, maxDepth: 500, emoji: '🐠', bioluminescent: false },
            { name: 'Lanternfish', minDepth: 200, maxDepth: 1000, emoji: '✨', bioluminescent: true },
            { name: 'Gulper Eel', minDepth: 500, maxDepth: 2000, emoji: '🐍', bioluminescent: true },
            { name: 'Giant Squid', minDepth: 1000, maxDepth: 2000, emoji: '🦑', bioluminescent: false },
            { name: 'Dumbo Octopus', minDepth: 2000, maxDepth: 5000, emoji: '🐙', bioluminescent: false },
            { name: 'Anglerfish', minDepth: 1000, maxDepth: 4000, emoji: '🪶', bioluminescent: true },
            { name: 'Sperm Whale', minDepth: 0, maxDepth: 3000, emoji: '🐋', bioluminescent: false },
            { name: 'Tripod Fish', minDepth: 4000, maxDepth: 6000, emoji: '🪡', bioluminescent: false },
            { name: 'Barreleye Fish', minDepth: 600, maxDepth: 1200, emoji: '👁️', bioluminescent: true },
            { name: 'Vampire Squid', minDepth: 600, maxDepth: 1200, emoji: '🦇', bioluminescent: true },
            { name: 'Yeti Crab', minDepth: 2400, maxDepth: 2400, emoji: '🦀', bioluminescent: false },
            { name: 'Snailfish', minDepth: 7000, maxDepth: 11000, emoji: '🐚', bioluminescent: false }
        ];
        
        // Calculate values at a given depth
        function getZoneAtDepth(depth) {
            return zones.find(z => depth >= z.min && depth < z.max) || zones[zones.length - 1];
        }
        
        function getTemperature(depth) {
            if (depth < 200) return 20 - (depth / 200) * 15; // 20°C → 5°C
            if (depth < 1000) return 5 - ((depth - 200) / 800) * 2; // 5°C → 3°C
            return 2 + Math.random() * 1; // ~2-3°C below 1000m
        }
        
        function getPressure(depth) {
            return 1 + (depth / 10.33); // 1 atm per 10.33m of seawater
        }
        
        function getLight(depth) {
            if (depth <= 50) return 100;
            if (depth <= 200) return 100 - ((depth - 50) / 150) * 50;
            if (depth <= 500) return 50 - ((depth - 200) / 300) * 40;
            if (depth <= 1000) return 10 - ((depth - 500) / 500) * 9;
            return Math.max(0, 1 - ((depth - 1000) / 3000) * 1);
        }
        
        function getCreaturesAtDepth(depth) {
            return creatures.filter(c => depth >= c.minDepth && depth <= c.maxDepth);
        }
        
        // Draw ocean
        function draw() {
            const zone = getZoneAtDepth(state.depth);
            const temp = getTemperature(state.depth);
            const pressure = getPressure(state.depth);
            const light = getLight(state.depth);
            
            // Update sidebar
            document.getElementById('zoneName').textContent = zone.name;
            document.getElementById('depthValue').textContent = Math.round(state.depth);
            document.getElementById('tempValue').textContent = temp.toFixed(1);
            document.getElementById('pressureValue').textContent = pressure.toFixed(1);
            document.getElementById('lightValue').textContent = Math.max(0, light.toFixed(1));
            
            // Background gradient based on depth and zone
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, zone.color);
            gradient.addColorStop(1, '#000000');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid if enabled
            if (state.showGrid) {
                ctx.strokeStyle = 'rgba(77, 168, 218, 0.1)';
                ctx.lineWidth = 1;
                for (let d = 0; d <= 11000; d += 500) {
                    const y = (d / 11000) * canvas.height;
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
            }
            
            // Get creatures visible at this depth
            const visibleCreatures = getCreaturesAtDepth(state.depth);
            
            // Draw creatures
            visibleCreatures.forEach((creature, index) => {
                const x = (index % 4) * (canvas.width / 4) + (canvas.width / 8);
                const yRatio = (creature.maxDepth / 11000) * 0.8 + 0.1;
                const y = yRatio * canvas.height;
                
                // Creature emoji
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Bioluminescence glow
                if (state.showBioluminescence && creature.bioluminescent && light < 50) {
                    ctx.shadowColor = '#ffff00';
                    ctx.shadowBlur = 20;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 0;
                } else {
                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                }
                
                ctx.fillText(creature.emoji, x, y);
                
                // Name and depth range
                ctx.font = '10px Space Mono';
                ctx.fillStyle = '#4da8da';
                ctx.textAlign = 'center';
                ctx.fillText(creature.name, x, y + 30);
                ctx.fillStyle = '#7dd3fc';
                ctx.font = '9px Space Mono';
                ctx.fillText(`${creature.minDepth}–${creature.maxDepth}m`, x, y + 43);
                
                // Bioluminescence indicator
                if (creature.bioluminescent) {
                    ctx.fillStyle = '#ffff00';
                    ctx.font = 'bold 8px Space Mono';
                    ctx.fillText('⚡', x + 25, y - 25);
                }
            });
            
            // Draw pressure gauge
            if (state.showPressureGauge) {
                drawPressureGauge(pressure);
            }
            
            // Information overlay
            ctx.fillStyle = 'rgba(5, 10, 19, 0.8)';
            ctx.fillRect(10, canvas.height - 60, 200, 50);
            ctx.strokeStyle = '#2d9d5f';
            ctx.lineWidth = 1;
            ctx.strokeRect(10, canvas.height - 60, 200, 50);
            
            ctx.fillStyle = '#7dd3fc';
            ctx.font = '9px Space Mono';
            ctx.textAlign = 'left';
            ctx.fillText(`Creatures at depth: ${visibleCreatures.length}`, 15, canvas.height - 45);
            ctx.fillText(`Visibility: ${Math.max(0, light.toFixed(0))}%`, 15, canvas.height - 30);
            ctx.fillText(`Darkness factor: ${(100 - Math.max(0, light)).toFixed(0)}%`, 15, canvas.height - 15);
        }
        
        function drawPressureGauge(pressure) {
            const x = canvas.width - 120;
            const y = 30;
            const radius = 40;
            
            // Gauge circle
            ctx.strokeStyle = '#daa520';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.stroke();
            
            // Gauge needle
            const maxPressure = 1000;
            const angle = (Math.PI / 2) + ((pressure / maxPressure) * Math.PI);
            ctx.strokeStyle = '#ff6666';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + Math.cos(angle) * (radius - 10), y + Math.sin(angle) * (radius - 10));
            ctx.stroke();
            
            // Center dot
            ctx.fillStyle = '#daa520';
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, Math.PI * 2);
            ctx.fill();
            
            // Label
            ctx.fillStyle = '#4da8da';
            ctx.font = '9px Space Mono';
            ctx.textAlign = 'center';
            ctx.fillText(`${pressure.toFixed(0)} atm`, x, y + radius + 20);
        }
        
        // Event listeners
        document.getElementById('depthSlider').addEventListener('input', (e) => {
            state.depth = parseInt(e.target.value);
            draw();
        });
        
        document.getElementById('bioToggle').addEventListener('click', function() {
            state.showBioluminescence = !state.showBioluminescence;
            this.classList.toggle('active');
            this.textContent = `Bioluminescence: ${state.showBioluminescence ? 'ON' : 'OFF'}`;
            draw();
        });
        
        document.getElementById('pressureToggle').addEventListener('click', function() {
            state.showPressureGauge = !state.showPressureGauge;
            this.classList.toggle('active');
            this.textContent = `Pressure Gauge: ${state.showPressureGauge ? 'ON' : 'OFF'}`;
            draw();
        });
        
        document.getElementById('gridToggle').addEventListener('click', function() {
            state.showGrid = !state.showGrid;
            this.classList.toggle('active');
            this.textContent = `Grid Lines: ${state.showGrid ? 'ON' : 'OFF'}`;
            draw();
        });
        
        // Initial draw
        draw();
    </script>
</body>
</html>
