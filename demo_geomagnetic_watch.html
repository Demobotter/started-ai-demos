<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geomagnetic Watch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f1c2e 0%, #1a2f4a 100%);
      color: #e0e7ff;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-family: 'Poppins', sans-serif;
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 8px;
      color: #fff;
    }

    .subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #a5b4fc;
      margin-bottom: 32px;
    }

    .panel {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .status-label {
      font-size: 0.95rem;
      color: #cbd5e1;
      font-weight: 500;
    }

    .status-value {
      font-family: 'Poppins', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #60a5fa;
    }

    .gauge-container {
      margin: 24px 0;
    }

    .gauge-label {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .gauge-bar {
      width: 100%;
      height: 28px;
      background: rgba(71, 85, 105, 0.5);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .gauge-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #3b82f6, #f59e0b, #ef4444);
      transition: width 0.6s ease-out;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      font-weight: 600;
      font-size: 0.75rem;
      color: white;
    }

    .gauge-scale {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #64748b;
      margin-top: 4px;
    }

    .activity-level {
      font-family: 'Poppins', sans-serif;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 24px 0;
    }

    .stat-box {
      background: rgba(51, 65, 85, 0.5);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.1);
    }

    .stat-label {
      font-size: 0.8rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .stat-value {
      font-family: 'Poppins', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #a5f3fc;
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .forecast-day {
      background: rgba(51, 65, 85, 0.5);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.1);
      text-align: center;
    }

    .forecast-day-label {
      font-size: 0.7rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }

    .forecast-day-value {
      font-family: 'Poppins', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: #fbbf24;
    }

    .data-source {
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px solid rgba(148, 163, 184, 0.1);
    }

    .error {
      color: #fca5a5;
    }

    .loading {
      text-align: center;
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .aurora-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }

    .aurora-good {
      background: #10b981;
    }

    .aurora-possible {
      background: #3b82f6;
    }

    .aurora-likely {
      background: #f59e0b;
    }

    .aurora-strong {
      background: #ef4444;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 2rem;
      }
      .grid-2 {
        grid-template-columns: 1fr;
      }
      .forecast-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌌 Geomagnetic Watch</h1>
    <p class="subtitle">Live NOAA storm activity tracker</p>

    <div class="panel">
      <div class="status-row">
        <span class="status-label">Current K-Index</span>
        <span class="status-value" id="kIndex">—</span>
      </div>

      <div class="gauge-container">
        <div class="gauge-label">K-Index Gauge (0–9)</div>
        <div class="gauge-bar">
          <div class="gauge-fill" id="kGaugeFill" style="width: 0%">
            <span id="kGaugeLabel"></span>
          </div>
        </div>
        <div class="gauge-scale">
          <span>0 (Quiet)</span>
          <span>9 (Extreme)</span>
        </div>
      </div>

      <div class="activity-level" id="activityLevel">
        <span class="aurora-indicator" id="auroraIndicator"></span>
        <span id="activityText">Loading…</span>
      </div>

      <div class="grid-2">
        <div class="stat-box">
          <div class="stat-label">Ap-Index (24h)</div>
          <div class="stat-value" id="apIndex">—</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Aurora Probability</div>
          <div class="stat-value" id="auroraProb">—</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="gauge-label">3-Day K-Index Forecast</div>
      <div class="forecast-grid">
        <div class="forecast-day">
          <div class="forecast-day-label">Today</div>
          <div class="forecast-day-value" id="forecastDay0">—</div>
        </div>
        <div class="forecast-day">
          <div class="forecast-day-label">+1 Day</div>
          <div class="forecast-day-value" id="forecastDay1">—</div>
        </div>
        <div class="forecast-day">
          <div class="forecast-day-label">+2 Days</div>
          <div class="forecast-day-value" id="forecastDay2">—</div>
        </div>
      </div>
    </div>

    <div class="data-source">
      Live data from NOAA Space Weather Prediction Center (SWPC)
      <br>
      <span id="lastUpdate" style="color: #475569; margin-top: 4px; display: block;">Updating…</span>
    </div>
  </div>

  <script>
    async function fetchGeomagnetic() {
      try {
        // NOAA SWPC endpoints (publicly available, no key required)
        const [kIndexRes, forecastRes] = await Promise.all([
          fetch('https://services.swpc.noaa.gov/json/goes/magnetometer/last_5_days.json'),
          fetch('https://services.swpc.noaa.gov/json/forecast/3day_forecast.json')
        ]);

        if (!kIndexRes.ok || !forecastRes.ok) throw new Error('NOAA API error');

        const kData = await kIndexRes.json();
        const forecastData = await forecastRes.json();

        // Get latest K-index (most recent valid entry)
        const latestKindex = kData
          .filter(d => d.kp !== null)
          .sort((a, b) => new Date(b.time) - new Date(a.time))[0];

        if (!latestKindex) throw new Error('No K-index data available');

        const kVal = parseFloat(latestKindex.kp);
        const apVal = Math.round(kVal * 8); // Approximate Ap from K

        // Determine activity level
        let activity, indicator;
        if (kVal < 2) {
          activity = 'Quiet';
          indicator = 'aurora-good';
        } else if (kVal < 4) {
          activity = 'Unsettled';
          indicator = 'aurora-good';
        } else if (kVal < 6) {
          activity = 'Active';
          indicator = 'aurora-possible';
        } else if (kVal < 8) {
          activity = 'Minor Storm';
          indicator = 'aurora-likely';
        } else if (kVal < 9) {
          activity = 'Major Storm';
          indicator = 'aurora-strong';
        } else {
          activity = 'Severe Storm';
          indicator = 'aurora-strong';
        }

        // Aurora probability (rough estimate from K)
        const auroraProb = Math.min(100, Math.round(kVal * 12));

        // Update UI
        document.getElementById('kIndex').textContent = kVal.toFixed(1);
        document.getElementById('kGaugeFill').style.width = (kVal / 9 * 100) + '%';
        document.getElementById('kGaugeLabel').textContent = kVal.toFixed(1);
        document.getElementById('apIndex').textContent = apVal;
        document.getElementById('auroraProb').textContent = auroraProb + '%';
        document.getElementById('activityText').textContent = activity;
        document.getElementById('auroraIndicator').className = 'aurora-indicator ' + indicator;

        // 3-day forecast K-values
        const forecast = forecastData.forecast || [];
        for (let i = 0; i < 3; i++) {
          const forecastVal = forecast[i]?.kp || '—';
          document.getElementById('forecastDay' + i).textContent = 
            typeof forecastVal === 'number' ? forecastVal.toFixed(1) : forecastVal;
        }

        // Last update time
        const updateTime = new Date(latestKindex.time);
        const timeStr = updateTime.toLocaleTimeString('en-US', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          timeZone: 'UTC'
        });
        document.getElementById('lastUpdate').textContent = `Last update: ${timeStr} UTC`;

      } catch (err) {
        console.error('Fetch error:', err);
        document.getElementById('activityLevel').innerHTML = 
          '<span class="error">Data unavailable</span>';
        document.getElementById('lastUpdate').textContent = 'Error loading data';
      }
    }

    // Load immediately and refresh every 5 minutes
    fetchGeomagnetic();
    setInterval(fetchGeomagnetic, 5 * 60 * 1000);
  </script>
</body>
</html>
