<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frequency Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a14 0%, #1a1428 100%);
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(20, 20, 35, 0.9);
            border: 1px solid rgba(100, 150, 255, 0.2);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00ff88, #00ddff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            font-size: 0.9em;
            color: #888;
        }
        .mic-status {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 600;
            background: rgba(100, 100, 120, 0.5);
            color: #aaa;
        }
        .mic-status.ready {
            background: rgba(0, 255, 100, 0.2);
            color: #00ff88;
        }
        .mic-status.listening {
            background: rgba(0, 221, 255, 0.2);
            color: #00ddff;
        }
        .mic-status.error {
            background: rgba(255, 0, 100, 0.2);
            color: #ff3366;
        }
        
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9em;
        }
        .btn-primary {
            background: linear-gradient(90deg, #00ff88, #00ddff);
            color: #000;
            flex: 1;
            min-width: 120px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.3);
        }
        .btn-primary:active {
            background: linear-gradient(90deg, #00dd66, #00aadd);
        }
        .btn-secondary {
            background: rgba(100, 150, 255, 0.2);
            color: #00ddff;
            border: 1px solid rgba(0, 221, 255, 0.4);
            flex: 1;
            min-width: 120px;
        }
        .btn-secondary:hover {
            background: rgba(100, 150, 255, 0.3);
            border-color: rgba(0, 221, 255, 0.6);
        }
        
        .slider-group {
            margin-bottom: 20px;
        }
        .slider-label {
            font-size: 0.85em;
            color: #aaa;
            margin-bottom: 8px;
            display: block;
            font-weight: 600;
        }
        .slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(100, 100, 120, 0.3);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(90deg, #00ff88, #00ddff);
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.5);
        }
        .slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(90deg, #00ff88, #00ddff);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.5);
        }
        
        .spectrum-bands {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
            gap: 10px;
            margin-bottom: 25px;
        }
        .band {
            text-align: center;
        }
        .band-label {
            font-size: 0.7em;
            color: #888;
            margin-bottom: 6px;
            display: block;
        }
        .band-meter {
            width: 100%;
            height: 120px;
            background: rgba(50, 50, 80, 0.8);
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }
        .band-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, #00ff88, #00ddff);
            height: 0%;
            transition: height 0.05s linear;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
        }
        
        .waveform-container {
            margin-bottom: 25px;
            background: rgba(30, 30, 50, 0.8);
            border: 1px solid rgba(100, 150, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            overflow-x: auto;
        }
        .waveform-label {
            font-size: 0.85em;
            color: #aaa;
            margin-bottom: 10px;
            display: block;
            font-weight: 600;
        }
        #waveformCanvas {
            width: 100%;
            height: 150px;
            display: block;
            background: rgba(10, 10, 20, 0.6);
            border-radius: 4px;
        }
        
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(50, 50, 80, 0.5);
            border: 1px solid rgba(100, 150, 255, 0.2);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .stat-label {
            font-size: 0.75em;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-value {
            font-size: 1.3em;
            font-weight: 700;
            background: linear-gradient(90deg, #00ff88, #00ddff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-unit {
            font-size: 0.75em;
            color: #666;
            margin-top: 2px;
        }
        
        .frequency-display {
            background: rgba(30, 30, 50, 0.8);
            border: 2px solid rgba(0, 255, 136, 0.3);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
        }
        .freq-label {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .freq-value {
            font-size: 2.5em;
            font-weight: 700;
            font-family: 'Syne', sans-serif;
            background: linear-gradient(90deg, #00ff88, #00ddff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .freq-note {
            font-size: 1.5em;
            font-weight: 600;
            color: #00ddff;
        }
        
        .note-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 4px;
            margin-top: 15px;
        }
        .note-key {
            padding: 8px 4px;
            background: rgba(50, 50, 80, 0.5);
            border: 1px solid rgba(100, 150, 255, 0.2);
            border-radius: 4px;
            font-size: 0.7em;
            text-align: center;
            cursor: default;
            font-weight: 600;
            color: #888;
            transition: all 0.1s;
        }
        .note-key.active {
            background: linear-gradient(90deg, #00ff88, #00ddff);
            color: #000;
            border-color: rgba(0, 255, 136, 0.6);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            .header h1 {
                font-size: 1.8em;
            }
            .spectrum-bands {
                grid-template-columns: repeat(5, 1fr);
            }
            .band-meter {
                height: 80px;
            }
            #waveformCanvas {
                height: 100px;
            }
            .freq-value {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎚️ Frequency Analyzer</h1>
            <p>Real-time audio spectrum visualization</p>
            <div class="mic-status" id="micStatus">Ready for audio</div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="startBtn">Start Listening</button>
            <button class="btn btn-secondary" id="stopBtn" disabled>Stop</button>
            <button class="btn btn-secondary" id="clearBtn" disabled>Clear</button>
        </div>
        
        <div class="slider-group">
            <label class="slider-label">Sensitivity <span id="sensitivityValue">50</span>%</label>
            <input type="range" class="slider" id="sensitivitySlider" min="0" max="100" value="50">
        </div>
        
        <div class="stats-panel">
            <div class="stat-card">
                <div class="stat-label">RMS Level</div>
                <div class="stat-value" id="rmsValue">0.00</div>
                <div class="stat-unit">dB</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Peak Frequency</div>
                <div class="stat-value" id="peakFreqValue">0</div>
                <div class="stat-unit">Hz</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Loudness</div>
                <div class="stat-value" id="loudnessValue">Silent</div>
                <div class="stat-unit"></div>
            </div>
        </div>
        
        <div class="spectrum-bands" id="spectrumBands"></div>
        
        <div class="waveform-container">
            <label class="waveform-label">Frequency Spectrum (0–20 kHz)</label>
            <canvas id="waveformCanvas"></canvas>
        </div>
        
        <div class="frequency-display">
            <div class="freq-label">Detected Note</div>
            <div class="freq-value" id="noteDisplay">—</div>
            <div class="freq-note" id="noteFreqDisplay">—</div>
            <div class="note-grid" id="noteGrid"></div>
        </div>
    </div>
    
    <script>
        // Audio context
        let audioContext = null;
        let analyser = null;
        let microphone = null;
        let isListening = false;
        let animationId = null;
        
        // Canvas
        const canvas = document.getElementById('waveformCanvas');
        const canvasCtx = canvas.getContext('2d');
        
        // Elements
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearBtn = document.getElementById('clearBtn');
        const micStatus = document.getElementById('micStatus');
        const sensitivitySlider = document.getElementById('sensitivitySlider');
        const rmsValue = document.getElementById('rmsValue');
        const peakFreqValue = document.getElementById('peakFreqValue');
        const loudnessValue = document.getElementById('loudnessValue');
        const noteDisplay = document.getElementById('noteDisplay');
        const noteFreqDisplay = document.getElementById('noteFreqDisplay');
        const spectrumBands = document.getElementById('spectrumBands');
        const noteGrid = document.getElementById('noteGrid');
        
        // Frequency bands
        const bands = [
            { label: 'Bass\n20–200Hz', min: 20, max: 200 },
            { label: 'Low-Mid\n200–500Hz', min: 200, max: 500 },
            { label: 'Mid\n500–2k', min: 500, max: 2000 },
            { label: 'Presence\n2–5k', min: 2000, max: 5000 },
            { label: 'High\n5–20k', min: 5000, max: 20000 }
        ];
        
        // Musical notes (A0 to C8)
        const notes = [
            'C0', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'
        ];
        
        function noteFrequency(noteIndex) {
            return 16.35 * Math.pow(2, noteIndex / 12);
        }
        
        function frequencyToNote(freq) {
            if (freq < 16) return null;
            const semitones = 12 * Math.log2(freq / 16.35);
            const noteName = notes[Math.round(semitones) % 12];
            const octave = Math.floor(Math.round(semitones) / 12);
            return noteName + octave;
        }
        
        // Render note grid
        function renderNoteGrid() {
            noteGrid.innerHTML = '';
            for (let i = 0; i < 12; i++) {
                const key = document.createElement('div');
                key.className = 'note-key';
                key.textContent = notes[i];
                noteGrid.appendChild(key);
            }
        }
        
        // Render spectrum bands
        function renderSpectrumBands() {
            spectrumBands.innerHTML = '';
            for (let band of bands) {
                const bandEl = document.createElement('div');
                bandEl.className = 'band';
                bandEl.innerHTML = `
                    <span class="band-label">${band.label}</span>
                    <div class="band-meter">
                        <div class="band-fill" data-band="${band.min}"></div>
                    </div>
                `;
                spectrumBands.appendChild(bandEl);
            }
        }
        
        // Init canvas
        function initCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        
        // Start listening
        startBtn.addEventListener('click', async () => {
            if (isListening) return;
            
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 4096;
                }
                
                if (!microphone) {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    microphone = audioContext.createMediaStreamSource(stream);
                    microphone.connect(analyser);
                }
                
                isListening = true;
                micStatus.textContent = 'Listening...';
                micStatus.className = 'mic-status listening';
                startBtn.disabled = true;
                stopBtn.disabled = false;
                clearBtn.disabled = false;
                initCanvas();
                animate();
            } catch (err) {
                micStatus.textContent = 'Microphone error';
                micStatus.className = 'mic-status error';
                console.error('Microphone error:', err);
            }
        });
        
        // Stop listening
        stopBtn.addEventListener('click', () => {
            isListening = false;
            micStatus.textContent = 'Stopped';
            micStatus.className = 'mic-status';
            startBtn.disabled = false;
            stopBtn.disabled = true;
            if (animationId) cancelAnimationFrame(animationId);
            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
        });
        
        // Clear spectrum
        clearBtn.addEventListener('click', () => {
            rmsValue.textContent = '0.00';
            peakFreqValue.textContent = '0';
            loudnessValue.textContent = 'Silent';
            noteDisplay.textContent = '—';
            noteFreqDisplay.textContent = '—';
            document.querySelectorAll('.band-fill').forEach(el => el.style.height = '0%');
            document.querySelectorAll('.note-key').forEach(el => el.classList.remove('active'));
        });
        
        // Update sensitivity
        sensitivitySlider.addEventListener('input', (e) => {
            const val = e.target.value;
            document.getElementById('sensitivityValue').textContent = val;
            if (analyser) {
                const fftSize = Math.max(512, Math.min(4096, 512 + (val * 35)));
                analyser.fftSize = Math.round(fftSize / 512) * 512;
                analyser.smoothingTimeConstant = 0.6 + (val * 0.004);
            }
        });
        
        // Animation loop
        function animate() {
            if (!isListening) return;
            animationId = requestAnimationFrame(animate);
            
            const bufferLength = analyser.frequencyBinCount;
            const freqData = new Uint8Array(bufferLength);
            const timeData = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(freqData);
            analyser.getByteTimeDomainData(timeData);
            
            // Update RMS
            let sumSquares = 0;
            for (let i = 0; i < timeData.length; i++) {
                const norm = (timeData[i] - 128) / 128;
                sumSquares += norm * norm;
            }
            const rms = Math.sqrt(sumSquares / timeData.length);
            const rmsDb = 20 * Math.log10(Math.max(rms, 0.001));
            rmsValue.textContent = rmsDb.toFixed(2);
            
            // Update loudness indicator
            if (rms < 0.05) {
                loudnessValue.textContent = 'Silent';
            } else if (rms < 0.15) {
                loudnessValue.textContent = 'Quiet';
            } else if (rms < 0.4) {
                loudnessValue.textContent = 'Medium';
            } else {
                loudnessValue.textContent = 'Loud';
            }
            
            // Nyquist = sample rate / 2
            const nyquist = audioContext.sampleRate / 2;
            
            // Find peak frequency
            let maxVal = 0, maxIdx = 0;
            for (let i = 0; i < freqData.length; i++) {
                if (freqData[i] > maxVal) {
                    maxVal = freqData[i];
                    maxIdx = i;
                }
            }
            const peakFreq = (maxIdx / bufferLength) * nyquist;
            peakFreqValue.textContent = Math.round(peakFreq);
            
            // Update note display
            const note = frequencyToNote(peakFreq);
            noteDisplay.textContent = note || '—';
            noteFreqDisplay.textContent = note ? `${peakFreq.toFixed(1)} Hz` : '—';
            
            // Highlight active note keys
            document.querySelectorAll('.note-key').forEach((key, idx) => {
                key.classList.remove('active');
                if (note && notes[idx] === note.substring(0, note.length - 1)) {
                    key.classList.add('active');
                }
            });
            
            // Update band meters
            bands.forEach((band, idx) => {
                const minBin = Math.floor((band.min / nyquist) * bufferLength);
                const maxBin = Math.floor((band.max / nyquist) * bufferLength);
                let sum = 0;
                for (let i = minBin; i < maxBin; i++) {
                    sum += freqData[i];
                }
                const avg = sum / (maxBin - minBin);
                const pct = Math.min(100, (avg / 255) * 120);
                const bandFill = document.querySelector(`[data-band="${band.min}"]`);
                if (bandFill) bandFill.style.height = pct + '%';
            });
            
            // Draw waveform
            canvasCtx.fillStyle = 'rgba(10, 10, 20, 0.8)';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            
            canvasCtx.strokeStyle = 'rgba(0, 255, 136, 0.8)';
            canvasCtx.lineWidth = 2;
            canvasCtx.beginPath();
            
            const sliceWidth = (canvas.width / freqData.length) * 4;
            let x = 0;
            for (let i = 0; i < freqData.length; i++) {
                const v = freqData[i] / 128.0;
                const y = (v * canvas.height) / 2;
                if (i === 0) {
                    canvasCtx.moveTo(x, y);
                } else {
                    canvasCtx.lineTo(x, y);
                }
                x += sliceWidth;
                if (x > canvas.width) break;
            }
            canvasCtx.stroke();
            
            // Frequency ruler
            canvasCtx.fillStyle = 'rgba(100, 150, 255, 0.4)';
            canvasCtx.font = '11px Inter';
            canvasCtx.textAlign = 'center';
            canvasCtx.textBaseline = 'bottom';
            const freqs = [100, 1000, 10000];
            freqs.forEach(f => {
                const xPos = (f / nyquist) * canvas.width;
                if (xPos > 0 && xPos < canvas.width) {
                    canvasCtx.fillText(f + 'Hz', xPos, canvas.height - 2);
                }
            });
        }
        
        // Init
        renderSpectrumBands();
        renderNoteGrid();
        initCanvas();
    </script>
</body>
</html>
