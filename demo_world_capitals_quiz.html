<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Capitals Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Lato", sans-serif;
      background: linear-gradient(135deg, #8B7355 0%, #6B5344 50%, #5A4A38 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.2);
      padding: 40px;
      max-width: 700px;
      width: 100%;
    }
    h1 {
      font-family: "Merriweather", serif;
      color: #8B7355;
      text-align: center;
      margin-bottom: 10px;
      font-size: 2.2rem;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }
    .score-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(90deg, #D4A574 0%, #E5B8A0 100%);
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      font-weight: 700;
      color: white;
    }
    .score-text { font-size: 1.1rem; }
    .region-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 30px;
    }
    .region-btn {
      padding: 14px 20px;
      border: 2px solid #D4A574;
      background: white;
      color: #8B7355;
      font-family: "Lato", sans-serif;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.95rem;
    }
    .region-btn:hover {
      background: #F5EBE0;
      transform: translateY(-2px);
    }
    .region-btn.active {
      background: #D4A574;
      color: white;
      box-shadow: 0 6px 16px rgba(212, 165, 116, 0.3);
    }
    .quiz-card {
      background: #F9F6F1;
      border: 2px solid #E5B8A0;
      border-radius: 14px;
      padding: 28px;
      text-align: center;
      margin-bottom: 20px;
      display: none;
    }
    .quiz-card.active { display: block; }
    .capital-city {
      font-family: "Merriweather", serif;
      font-size: 2rem;
      color: #5A4A38;
      margin-bottom: 20px;
      font-weight: 700;
    }
    .guess-label {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .guess-input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #D4A574;
      border-radius: 8px;
      font-family: "Lato", sans-serif;
      font-size: 1rem;
      margin-bottom: 16px;
      transition: border-color 0.3s;
    }
    .guess-input:focus {
      outline: none;
      border-color: #8B7355;
    }
    .button-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .reveal-btn, .next-btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-family: "Lato", sans-serif;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.95rem;
    }
    .reveal-btn {
      background: #D4A574;
      color: white;
      flex: 1;
    }
    .reveal-btn:hover { background: #C89560; }
    .next-btn {
      background: #8B7355;
      color: white;
      flex: 1;
    }
    .next-btn:hover { background: #745D48; }
    .result-box {
      background: white;
      border: 2px solid #D4A574;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
      display: none;
      text-align: center;
    }
    .result-box.show { display: block; }
    .correct-answer {
      font-family: "Merriweather", serif;
      font-size: 1.6rem;
      color: #2ecc71;
      margin: 10px 0;
      font-weight: 700;
    }
    .flag { font-size: 3rem; margin: 10px 0; }
    .detail-text {
      color: #666;
      font-size: 0.9rem;
      margin-top: 12px;
      font-style: italic;
    }
    .feedback {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .feedback.correct {
      background: #e8f8f5;
      color: #2ecc71;
    }
    .feedback.incorrect {
      background: #fadbd8;
      color: #e74c3c;
    }
    @media (max-width: 600px) {
      .container { padding: 24px; }
      h1 { font-size: 1.8rem; }
      .region-buttons { grid-template-columns: repeat(2, 1fr); }
      .capital-city { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌍 World Capitals</h1>
    <p class="subtitle">Pick a region and guess the country</p>
    
    <div class="score-bar">
      <span class="score-text">Score: <strong id="score">0</strong> / <strong id="total">0</strong></span>
      <span id="streak" style="display:none;">🔥 <strong id="streak-count">0</strong> correct</span>
    </div>

    <div class="region-buttons" id="regions"></div>

    <div class="quiz-card active" id="quizCard">
      <div class="capital-city" id="capitalCity">Select a region</div>
      <div class="guess-label">Which country is this the capital of?</div>
      <input type="text" id="guessInput" class="guess-input" placeholder="Enter country name..." />
      <div class="button-group">
        <button class="reveal-btn" onclick="revealAnswer()">Reveal</button>
        <button class="next-btn" onclick="nextQuiz()" style="display:none;" id="nextBtn">Next</button>
      </div>
      <div class="result-box" id="resultBox">
        <div class="flag" id="flag"></div>
        <div class="correct-answer" id="correctAnswer"></div>
        <div class="detail-text" id="detailText"></div>
        <div class="feedback" id="feedbackText"></div>
      </div>
    </div>
  </div>

        { city: 'Pretoria', country: 'South Africa', flag: '🇿🇦', detail: 'Pop. 2.4M | Admin capital' },

        { city: 'Kinshasa', country: 'Democratic Republic of Congo', flag: '🇨🇩', detail: 'Pop. 16M | Est. 1881' },
        { city: 'Antananarivo', country: 'Madagascar', flag: '🇲🇬', detail: 'Pop. 1.3M | Founded 1610' },
        { city: 'Algiers', country: 'Algeria', flag: '🇩🇿', detail: 'Pop. 3.2M | Est. 944' },
      ],
      'Oceania': [
        { city: 'Canberra', country: 'Australia', flag: '🇦🇺', detail: 'Pop. 475K | Built 1927' },
        { city: 'Wellington', country: 'New Zealand', flag: '🇳🇿', detail: 'Pop. 418K | Capital since 1865' },
        { city: 'Suva', country: 'Fiji', flag: '🇫🇯', detail: 'Pop. 330K | Est. 1849' },
        { city: 'Port Moresby', country: 'Papua New Guinea', flag: '🇵🇬', detail: 'Pop. 614K | Est. 1873' },
        { city: 'Apia', country: 'Samoa', flag: '🇼🇸', detail: 'Pop. 38K | Established 1768' },
        { city: 'Nadi', country: 'Fiji', flag: '🇫🇯', detail: 'Pop. 75K | Gateway city' },
      ],
    };

    let currentRegion = null;
    let currentCapital = null;
    let score = 0;
    let total = 0;
    let streak = 0;
    let revealed = false;

    // Initialize region buttons
    function initializeRegions() {
      const regionsDiv = document.getElementById('regions');
      for (const region in CAPITALS) {
        const btn = document.createElement('button');
        btn.className = 'region-btn';
        btn.textContent = region;
        btn.onclick = () => selectRegion(region, btn);
        regionsDiv.appendChild(btn);
      }
    }

    function selectRegion(region, btn) {
      document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRegion = region;
      nextQuiz();
    }

    function nextQuiz() {
      if (!currentRegion) return;
      const capitals = CAPITALS[currentRegion];
      currentCapital = capitals[Math.floor(Math.random() * capitals.length)];
      
      document.getElementById('capitalCity').textContent = currentCapital.city;
      document.getElementById('guessInput').value = '';
      document.getElementById('resultBox').classList.remove('show');
      document.querySelector('.reveal-btn').style.display = 'inline-block';
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('streak').style.display = streak > 0 ? 'inline' : 'none';
      revealed = false;
    }

    function revealAnswer() {
      const guess = document.getElementById('guessInput').value.trim().toLowerCase();
      const correct = currentCapital.country.toLowerCase();
      const isCorrect = guess === correct;

      if (isCorrect) {
        score++;
        streak++;
      } else {
        streak = 0;
      }
      total++;

      document.getElementById('score').textContent = score;
      document.getElementById('total').textContent = total;
      document.getElementById('streak-count').textContent = streak;

      document.getElementById('flag').textContent = currentCapital.flag;
      document.getElementById('correctAnswer').textContent = currentCapital.country;
      document.getElementById('detailText').textContent = currentCapital.detail;
      
      const feedbackEl = document.getElementById('feedbackText');
      if (isCorrect) {
        feedbackEl.className = 'feedback correct';
        feedbackEl.textContent = '✓ Correct!';
      } else {
        feedbackEl.className = 'feedback incorrect';
        feedbackEl.textContent = guess ? `✗ Incorrect. You guessed: ${document.getElementById('guessInput').value}` : '✗ No guess entered.';
      }

      document.getElementById('resultBox').classList.add('show');
      document.querySelector('.reveal-btn').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'inline-block';
      revealed = true;
    }

    // Allow Enter key to reveal or next
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('guessInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          if (!revealed) revealAnswer();
          else nextQuiz();
        }
      });
    });

    // Initialize on load
    initializeRegions();
  </script>
</body>
</html>
