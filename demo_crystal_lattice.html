<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Lattice Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #0a1428 0%, #1a3a5a 100%);
            color: #e0f6ff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 320px;
            padding: 20px;
            background: rgba(10, 20, 40, 0.9);
            overflow-y: auto;
            border-right: 1px solid #333;
        }
        .sidebar h2 {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            margin-bottom: 15px;
            color: #4da8da;
        }
        .sidebar h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: #7dd3fc;
            margin-top: 15px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }
        .btn {
            padding: 10px;
            border: 1px solid #333;
            background: #0f1a2e;
            color: #4da8da;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .btn:hover { background: #1a2f4d; border-color: #4da8da; }
        .btn.active { background: #4da8da; color: #0a1428; border-color: #4da8da; font-weight: 700; }
        .mineral-btn {
            width: 100%;
            padding: 8px;
            margin-bottom: 6px;
            font-size: 11px;
        }
        .slider-group {
            margin-bottom: 15px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 5px;
            color: #7dd3fc;
        }
        input[type="range"] {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #333;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4da8da;
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4da8da;
            cursor: pointer;
            border: none;
        }
        .toggle-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .toggle-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid #333;
            background: #0f1a2e;
            color: #4da8da;
            font-size: 10px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .toggle-btn.active { background: #52c41a; color: #0a1428; border-color: #52c41a; }
        .stats-box {
            background: rgba(10, 20, 40, 0.6);
            border-left: 3px solid #667eea;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 11px;
            border-radius: 4px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .stat-label { color: #7dd3fc; }
        .stat-value { color: #52c41a; font-weight: 700; }
        .canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
            border: 1px solid #333;
            border-radius: 8px;
            background: #0a0e27;
        }
        .legend {
            background: rgba(10, 20, 40, 0.6);
            padding: 10px;
            border-radius: 4px;
            font-size: 10px;
            margin-bottom: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        .legend-color {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; max-height: 30vh; border-right: none; border-bottom: 1px solid #333; }
            .canvas-container { height: 70vh; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>💎 Crystal Lattice</h2>
        
        <h3>Crystal System</h3>
        <div class="btn-group">
            <button class="btn active" onclick="selectSystem('cubic')">Cubic</button>
            <button class="btn" onclick="selectSystem('hexagonal')">Hexagonal</button>
            <button class="btn" onclick="selectSystem('tetragonal')">Tetragonal</button>
            <button class="btn" onclick="selectSystem('orthorhombic')">Orthorhombic</button>
            <button class="btn" onclick="selectSystem('monoclinic')">Monoclinic</button>
            <button class="btn" onclick="selectSystem('triclinic')">Triclinic</button>
        </div>

        <h3>Lattice Parameters (Å)</h3>
        <div class="slider-group">
            <div class="slider-label">
                <span>a (parameter)</span>
                <span id="aVal">2.8</span>
            </div>
            <input type="range" min="1" max="4" step="0.1" value="2.8" onchange="updateA(this.value)" oninput="updateA(this.value)">
        </div>
        <div class="slider-group">
            <div class="slider-label">
                <span>c/a ratio</span>
                <span id="caVal">1.0</span>
            </div>
            <input type="range" min="0.5" max="2" step="0.1" value="1.0" onchange="updateCA(this.value)" oninput="updateCA(this.value)">
        </div>

        <h3>View Control</h3>
        <div class="slider-group">
            <div class="slider-label">
                <span>Rotation (°)</span>
                <span id="rotVal">0</span>
            </div>
            <input type="range" min="0" max="360" step="5" value="0" onchange="updateRot(this.value)" oninput="updateRot(this.value)">
        </div>
        <div class="slider-group">
            <div class="slider-label">
                <span>Zoom</span>
                <span id="zoomVal">1.0x</span>
            </div>
            <input type="range" min="0.5" max="3" step="0.1" value="1" onchange="updateZoom(this.value)" oninput="updateZoom(this.value)">
        </div>

        <h3>Display Options</h3>
        <div class="toggle-group">
            <button class="toggle-btn active" onclick="toggleUnitCell()" id="unitCellBtn">Unit Cell</button>
            <button class="toggle-btn" onclick="toggleBonding()" id="bondingBtn">Bonding</button>
        </div>

        <h3>Mineral Examples</h3>
        <button class="btn mineral-btn" onclick="loadMineral('nacl')">NaCl (Rock Salt)</button>
        <button class="btn mineral-btn" onclick="loadMineral('diamond')">Diamond</button>
        <button class="btn mineral-btn" onclick="loadMineral('ice')">Ice (H₂O)</button>
        <button class="btn mineral-btn" onclick="loadMineral('graphite')">Graphite</button>
        <button class="btn mineral-btn" onclick="loadMineral('rutile')">Rutile (TiO₂)</button>
        <button class="btn mineral-btn" onclick="loadMineral('olivine')">Olivine</button>
        <button class="btn mineral-btn" onclick="loadMineral('gypsum')">Gypsum</button>
        <button class="btn mineral-btn" onclick="loadMineral('kyanite')">Kyanite</button>

        <div id="statsBox"></div>
        <div class="legend" id="legend"></div>
    </div>

    <div class="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const atomColors = {
            'Na': '#ffffff', 'Cl': '#52c41a', 'C': '#888888', 'O': '#ff6b6b',
            'H': '#4da8da', 'Ti': '#ffd700', 'Fe': '#ff9933', 'Si': '#cccccc',
            'Al': '#d0d0d0', 'Mg': '#e0e0e0', 'Ca': '#b0c4de'
        };

        const mineralData = {
            nacl: { name: 'NaCl (Rock Salt)', system: 'cubic', a: 5.64, ca: 1, atoms: generateNaCl() },
            diamond: { name: 'Diamond', system: 'cubic', a: 3.57, ca: 1, atoms: generateDiamond() },
            ice: { name: 'Ice (H₂O)', system: 'hexagonal', a: 4.52, ca: 1.63, atoms: generateIce() },
            graphite: { name: 'Graphite', system: 'hexagonal', a: 2.42, ca: 2.7, atoms: generateGraphite() },
            rutile: { name: 'Rutile (TiO₂)', system: 'tetragonal', a: 4.59, ca: 0.64, atoms: generateRutile() },
            olivine: { name: 'Olivine', system: 'orthorhombic', a: 4.76, ca: 1, atoms: generateOlivine() },
            gypsum: { name: 'Gypsum (CaSO₄)', system: 'monoclinic', a: 5.68, ca: 0.7, atoms: generateGypsum() },
            kyanite: { name: 'Kyanite', system: 'triclinic', a: 7.09, ca: 0.95, atoms: generateKyanite() }
        };

        function generateNaCl() {
            const atoms = [];
            for (let x = 0; x < 2; x++) for (let y = 0; y < 2; y++) for (let z = 0; z < 2; z++) {
                if ((x + y + z) % 2 === 0) atoms.push({x, y, z, element: 'Na'});
                else atoms.push({x, y, z, element: 'Cl'});
            }
            return atoms;
        }

        function generateDiamond() {
            const atoms = [];
            for (let x = 0; x < 2; x++) for (let y = 0; y < 2; y++) for (let z = 0; z < 2; z++) {
                atoms.push({x, y, z, element: 'C'});
                if (x < 1.5 && y < 1.5 && z < 1.5) atoms.push({x: x + 0.25, y: y + 0.25, z: z + 0.25, element: 'C'});
            }
            return atoms;
        }

        function generateIce() {
            const atoms = [];
            for (let x = 0; x < 2; x++) for (let y = 0; y < 2; y++) for (let z = 0; z < 2; z++) {
                atoms.push({x, y, z, element: 'O'});
                atoms.push({x: x + 0.33, y: y + 0.33, z: z + 0.2, element: 'H'});
                atoms.push({x: x + 0.33, y: y + 0.67, z: z + 0.2, element: 'H'});
            }
            return atoms;
        }

        function generateGraphite() {
            const atoms = [];
            for (let x = 0; x < 2; x++) for (let y = 0; y < 2; y++) for (let z = 0; z < 3; z++) {
                atoms.push({x, y, z: z * 0.33, element: 'C'});
            }
            return atoms;
        }

        function generateRutile() {
            const atoms = [];
            for (let x = 0; x < 2; x++) for (let y = 0; y < 2; y++) for (let z = 0; z < 2; z++) {
                atoms.push({x, y, z, element: 'Ti'});
                atoms.push({x: x + 0.3, y: y + 0.3, z: z + 0.1, element: 'O'});
                atoms.push({x: x + 0.7, y: y + 0.7, z: z + 0.1, element: 'O'});
            }
            return atoms;
        }

        function generateOlivine() {
            const atoms = [];
            for (let x = 0; x < 2; x++) for (let y = 0; y < 2; y++) for (let z = 0; z < 2; z++) {
                atoms.push({x, y, z, element: 'Mg'});
                atoms.push({x: x + 0.25, y: y + 0.25, z: z + 0.25, element: 'Si'});
                atoms.push({x: x + 0.5, y: y + 0.5, z: z, element: 'O'});
            }
            return atoms;
        }

        function generateGypsum() {
            const atoms = [];
            for (let x = 0; x < 2; x++) for (let y = 0; y < 2; y++) {
                atoms.push({x, y, z: 0.2, element: 'Ca'});
                atoms.push({x: x + 0.3, y: y + 0.3, z: 0.5, element: 'Si'});
                atoms.push({x: x + 0.6, y: y + 0.6, z: 0.3, element: 'O'});
            }
            return atoms;
        }

        function generateKyanite() {
            const atoms = [];
            for (let x = 0; x < 2; x++) for (let y = 0; y < 2; y++) for (let z = 0; z < 2; z++) {
                atoms.push({x, y, z, element: 'Al'});
                atoms.push({x: x + 0.25, y: y + 0.25, z: z + 0.25, element: 'Si'});
                atoms.push({x: x + 0.5, y: y + 0.5, z: z + 0.5, element: 'O'});
            }
            return atoms;
        }

        let state = {
            system: 'cubic',
            a: 2.8, ca: 1, rot: 0, zoom: 1,
            showUnitCell: true, showBonding: false,
            atoms: generateNaCl()
        };

        const systemAngles = {
            cubic: [90, 90, 90],
            hexagonal: [90, 90, 120],
            tetragonal: [90, 90, 90],
            orthorhombic: [90, 90, 90],
            monoclinic: [90, 110, 90],
            triclinic: [85, 95, 105]
        };

        function selectSystem(sys) {
            state.system = sys;
            document.querySelectorAll('.btn-group .btn').forEach((b, i) => {
                b.classList.toggle('active', ['cubic', 'hexagonal', 'tetragonal', 'orthorhombic', 'monoclinic', 'triclinic'][i] === sys);
            });
            render();
        }

        function updateA(val) { state.a = parseFloat(val); document.getElementById('aVal').textContent = val; render(); }
        function updateCA(val) { state.ca = parseFloat(val); document.getElementById('caVal').textContent = val; render(); }
        function updateRot(val) { state.rot = parseFloat(val); document.getElementById('rotVal').textContent = val; render(); }
        function updateZoom(val) { state.zoom = parseFloat(val); document.getElementById('zoomVal').textContent = (Math.round(val * 10) / 10) + 'x'; render(); }
        function toggleUnitCell() { state.showUnitCell = !state.showUnitCell; document.getElementById('unitCellBtn').classList.toggle('active'); render(); }
        function toggleBonding() { state.showBonding = !state.showBonding; document.getElementById('bondingBtn').classList.toggle('active'); render(); }

        function loadMineral(key) {
            const m = mineralData[key];
            state.system = m.system;
            state.a = m.a / 100;
            state.ca = m.ca;
            state.atoms = m.atoms;
            updateStats(m.name);
            render();
        }

        function updateStats(mineral) {
            const angles = systemAngles[state.system];
            const html = `
                <div class="stats-box">
                    <div class="stat-row"><span class="stat-label">Mineral:</span><span class="stat-value">${mineral || 'Custom'}</span></div>
                    <div class="stat-row"><span class="stat-label">System:</span><span class="stat-value">${state.system}</span></div>
                    <div class="stat-row"><span class="stat-label">a (Å):</span><span class="stat-value">${(state.a * 100).toFixed(2)}</span></div>
                    <div class="stat-row"><span class="stat-label">c (Å):</span><span class="stat-value">${(state.a * state.ca * 100).toFixed(2)}</span></div>
                    <div class="stat-row"><span class="stat-label">α, β, γ:</span><span class="stat-value">${angles.join(', ')}°</span></div>
                    <div class="stat-row"><span class="stat-label">Atoms:</span><span class="stat-value">${state.atoms.length}</span></div>
                </div>
            `;
            const elements = {};
            state.atoms.forEach(a => { elements[a.element] = (elements[a.element] || 0) + 1; });
            let legend = '<div style="margin-bottom: 6px; font-weight: 700; color: #7dd3fc;">Elements:</div>';
            Object.entries(elements).forEach(([el, cnt]) => {
                legend += `<div class="legend-item"><div class="legend-color" style="background: ${atomColors[el]}"></div>${el} (${cnt})</div>`;
            });
            document.getElementById('statsBox').innerHTML = html;
            document.getElementById('legend').innerHTML = legend;
        }

        function render() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            ctx.fillStyle = '#0a0e27';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2, cy = canvas.height / 2;
            const scale = 40 * state.zoom;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate((state.rot * Math.PI) / 180);

            if (state.showUnitCell) {
                ctx.strokeStyle = '#ffeb3b';
                ctx.lineWidth = 1;
                const b = state.a * scale;
                ctx.strokeRect(-b / 2, -b / 2, b, b);
            }

            const sortedAtoms = state.atoms.sort((a, b) => (b.z - a.z) || (b.y - a.y));
            sortedAtoms.forEach(atom => {
                const x = (atom.x - 0.5) * state.a * scale;
                const y = (atom.y - 0.5) * state.a * scale;
                const z = (atom.z - 0.5) * state.a * state.ca * scale;

                ctx.fillStyle = atomColors[atom.element] || '#999';
                ctx.beginPath();
                ctx.arc(x + z * 0.3, y + z * 0.3, 6 * state.zoom, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = atomColors[atom.element];
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.shadowColor = atomColors[atom.element];
                ctx.shadowBlur = 10;
                ctx.strokeStyle = 'rgba(77, 168, 218, 0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(x + z * 0.3, y + z * 0.3, 12 * state.zoom, 0, Math.PI * 2);
                ctx.stroke();
            });

            ctx.restore();
            updateStats();
        }

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            render();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        render();
    </script>
</body>
</html>
