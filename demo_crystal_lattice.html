<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crystal Lattice Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Space Mono", monospace;
      background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
      color: #e0e6f0;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }
    @media (max-width: 1024px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
    .section {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(114,9,183,0.3);
      border-radius: 12px;
      padding: 24px;
    }
    h1 {
      font-family: "Playfair Display", serif;
      font-size: 2em;
      margin-bottom: 24px;
      color: #b8a0ff;
      text-align: center;
      grid-column: 1 / -1;
    }
    .control-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 0.9em;
      color: #7209b7;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .radio-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 8px;
      margin-bottom: 16px;
    }
    input[type="radio"] {
      display: none;
    }
    .radio-label {
      padding: 10px 12px;
      background: rgba(114,9,183,0.15);
      border: 2px solid rgba(114,9,183,0.3);
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      font-size: 0.85em;
      transition: all 0.3s;
    }
    input[type="radio"]:checked + .radio-label {
      background: rgba(114,9,183,0.5);
      border-color: #7209b7;
      color: #fff;
    }
    .slider-container {
      margin-bottom: 16px;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(90deg, #7209b7, #ff006e);
      outline: none;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(114,9,183,0.6);
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 8px rgba(114,9,183,0.6);
    }
    .slider-value {
      font-size: 0.85em;
      color: #b8a0ff;
      margin-top: 4px;
    }
    button {
      background: rgba(114,9,183,0.4);
      border: 2px solid #7209b7;
      color: #b8a0ff;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: "Space Mono", monospace;
      font-size: 0.85em;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s;
    }
    button:hover {
      background: rgba(114,9,183,0.7);
      color: #fff;
    }
    .button-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    canvas {
      width: 100%;
      height: 500px;
      background: rgba(255,255,255,0.02);
      border-radius: 8px;
      border: 1px solid rgba(114,9,183,0.3);
      display: block;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }
    .stat-box {
      background: rgba(114,9,183,0.1);
      border-left: 3px solid #7209b7;
      padding: 12px;
      border-radius: 6px;
    }
    .stat-label {
      font-size: 0.75em;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 1.2em;
      font-weight: 700;
      color: #b8a0ff;
      font-family: "Space Mono", monospace;
    }
    .toggle-group {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    input[type="checkbox"] {
      margin-right: 8px;
      cursor: pointer;
    }
    .info-box {
      background: rgba(255, 193, 7, 0.1);
      border-left: 3px solid #ffc107;
      padding: 12px;
      border-radius: 6px;
      margin-top: 16px;
      font-size: 0.85em;
      color: #ffd54f;
    }
  </style>
</head>
<body>
  <h1>💎 Crystal Lattice Builder</h1>
  
  <div class="container">
    <!-- Left Panel: Controls -->
    <div class="section">
      <div class="control-group">
        <label>Crystal System</label>
        <div class="radio-group">
          <input type="radio" id="cubic" name="system" value="cubic" checked>
          <label for="cubic" class="radio-label">Cubic</label>
          
          <input type="radio" id="hexagonal" name="system" value="hexagonal">
          <label for="hexagonal" class="radio-label">Hexagonal</label>
          
          <input type="radio" id="tetragonal" name="system" value="tetragonal">
          <label for="tetragonal" class="radio-label">Tetragonal</label>
          
          <input type="radio" id="orthorhombic" name="system" value="orthorhombic">
          <label for="orthorhombic" class="radio-label">Orthorhombic</label>
        </div>
      </div>

      <div class="control-group" id="paramControls">
        <div class="slider-container">
          <label>Lattice Constant a (Å)</label>
          <input type="range" id="sliderA" min="2" max="5" step="0.1" value="2.87">
          <div class="slider-value">a = <span id="valA">2.87</span> Å</div>
        </div>
      </div>

      <div class="control-group">
        <label>Element</label>
        <div class="radio-group">
          <input type="radio" id="elemFe" name="element" value="Fe" checked>
          <label for="elemFe" class="radio-label">Fe</label>
          
          <input type="radio" id="elemCu" name="element" value="Cu">
          <label for="elemCu" class="radio-label">Cu</label>
          
          <input type="radio" id="elemC" name="element" value="C">
          <label for="elemC" class="radio-label">C</label>
          
          <input type="radio" id="elemAl" name="element" value="Al">
          <label for="elemAl" class="radio-label">Al</label>
        </div>
      </div>

      <div class="toggle-group">
        <input type="checkbox" id="toggleSupercell">
        <label for="toggleSupercell">Show 2×2×2 Supercell</label>
      </div>

      <div class="control-group">
        <label>Presets</label>
        <div class="button-group">
          <button onclick="loadPreset('iron')">Iron (BCC)</button>
          <button onclick="loadPreset('copper')">Copper (FCC)</button>
          <button onclick="loadPreset('diamond')">Diamond</button>
          <button onclick="loadPreset('nacl')">NaCl</button>
        </div>
      </div>

      <div class="info-box">
        <strong>Tip:</strong> Drag to rotate, scroll to zoom. Each system shows authentic lattice geometry and packing density.
      </div>
    </div>

    <!-- Right Panel: Visualization + Stats -->
    <div class="section">
      <canvas id="canvas"></canvas>
      
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Lattice System</div>
          <div class="stat-value" id="statSystem">Cubic</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Atoms/Cell</div>
          <div class="stat-value" id="statAtomsPerCell">2</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Packing %</div>
          <div class="stat-value" id="statPacking">68%</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Coord #</div>
          <div class="stat-value" id="statCoord">8</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">a (Å)</div>
          <div class="stat-value" id="statParamA">2.87</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Angles</div>
          <div class="stat-value" id="statAngles">90°</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let animationId;
    
    // State
    let state = {
      system: 'cubic',
      element: 'Fe',
      a: 2.87,
      b: 2.87,
      c: 2.87,
      alpha: 90,
      beta: 90,
      gamma: 90,
      showSupercell: false,
      rotX: 0.5,
      rotY: 0.8,
      zoom: 1.2,
      isDragging: false,
      lastX: 0,
      lastY: 0
    };

    // Atomic radii (Å) and colors
    const atoms = {
      Fe: { radius: 1.26, color: '#ff4444' },
      Cu: { radius: 1.28, color: '#ff9944' },
      C: { radius: 0.70, color: '#1a1a1a' },
      Al: { radius: 1.43, color: '#aabbff' }
    };

    // Crystal systems and their properties
    const systems = {
      cubic: {
        name: 'Cubic (BCC)',
        a: (v) => v, b: (v) => v, c: (v) => v,
        alpha: 90, beta: 90, gamma: 90,
        atomsPerCell: 2,
        packingPercent: 68,
        coordinationNumber: 8,
        positions: [
          [0, 0, 0],
          [0.5, 0.5, 0.5]
        ]
      },
      hexagonal: {
        name: 'Hexagonal (HCP)',
        a: (v) => v, b: (v) => v, c: (v) => v * 1.633,
        alpha: 90, beta: 90, gamma: 120,
        atomsPerCell: 2,
        packingPercent: 74,
        coordinationNumber: 12,
        positions: [
          [0, 0, 0],
          [0.333, 0.667, 0.5]
        ]
      },
      tetragonal: {
        name: 'Tetragonal',
        a: (v) => v, b: (v) => v, c: (v) => v * 1.2,
        alpha: 90, beta: 90, gamma: 90,
        atomsPerCell: 2,
        packingPercent: 65,
        coordinationNumber: 8,
        positions: [
          [0, 0, 0],
          [0.5, 0.5, 0.5]
        ]
      },
      orthorhombic: {
        name: 'Orthorhombic',
        a: (v) => v, b: (v) => v * 0.95, c: (v) => v * 1.1,
        alpha: 90, beta: 90, gamma: 90,
        atomsPerCell: 1,
        packingPercent: 60,
        coordinationNumber: 6,
        positions: [
          [0, 0, 0]
        ]
      }
    };

    // Presets
    const presets = {
      iron: {
        system: 'cubic',
        element: 'Fe',
        a: 2.87,
        description: 'Iron (BCC): Body-centered cubic, 68% packing'
      },
      copper: {
        system: 'cubic',
        element: 'Cu',
        a: 3.61,
        description: 'Copper (FCC-like): Face-centered cubic, 74% packing',
        packingPercent: 74,
        atomsPerCell: 4,
        coordinationNumber: 12
      },
      diamond: {
        system: 'cubic',
        element: 'C',
        a: 3.57,
        description: 'Diamond: Carbon tetrahedral bonding, 34% packing',
        packingPercent: 34,
        atomsPerCell: 8,
        coordinationNumber: 4
      },
      nacl: {
        system: 'cubic',
        element: 'Fe',
        a: 5.64,
        description: 'NaCl (Rock Salt): Two interpenetrating FCC lattices'
      }
    };

    // Resize canvas
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Mouse controls
    canvas.addEventListener('mousedown', (e) => {
      state.isDragging = true;
      state.lastX = e.clientX;
      state.lastY = e.clientY;
    });
    canvas.addEventListener('mousemove', (e) => {
      if (state.isDragging) {
        const dx = (e.clientX - state.lastX) * 0.01;
        const dy = (e.clientY - state.lastY) * 0.01;
        state.rotY += dx;
        state.rotX += dy;
        state.lastX = e.clientX;
        state.lastY = e.clientY;
      }
    });
    canvas.addEventListener('mouseup', () => {
      state.isDragging = false;
    });
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      state.zoom *= (1 - e.deltaY * 0.001);
      state.zoom = Math.max(0.5, Math.min(3, state.zoom));
    });

    // 3D point rotation
    function rotatePoint(p, rotX, rotY) {
      let [x, y, z] = p;
      // Rotate around X
      let y1 = y * Math.cos(rotX) - z * Math.sin(rotX);
      let z1 = y * Math.sin(rotX) + z * Math.cos(rotX);
      // Rotate around Y
      let x2 = x * Math.cos(rotY) + z1 * Math.sin(rotY);
      let z2 = -x * Math.sin(rotY) + z1 * Math.cos(rotY);
      return [x2, y1, z2];
    }

    function drawAtoms() {
      const w = canvas.width / window.devicePixelRatio;
      const h = canvas.height / window.devicePixelRatio;
      const centerX = w / 2;
      const centerY = h / 2;

      ctx.clearRect(0, 0, w, h);

      const sys = systems[state.system];
      const atomData = atoms[state.element];
      const latticeA = sys.a(state.a);
      const latticeB = sys.b(state.a);
      const latticeC = sys.c(state.a);
      const supercellSize = state.showSupercell ? 2 : 1;

      // Compute cell corners for unit cell edges
      const corners = [
        [0, 0, 0], [latticeA, 0, 0], [latticeA, latticeB, 0], [0, latticeB, 0],
        [0, 0, latticeC], [latticeA, 0, latticeC], [latticeA, latticeB, latticeC], [0, latticeB, latticeC]
      ];

      const edges = [
        [0,1], [1,2], [2,3], [3,0],
        [4,5], [5,6], [6,7], [7,4],
        [0,4], [1,5], [2,6], [3,7]
      ];

      // Draw unit cell edges
      ctx.strokeStyle = 'rgba(200, 150, 255, 0.4)';
      ctx.lineWidth = 2;
      for (let edge of edges) {
        const p0 = corners[edge[0]];
        const p1 = corners[edge[1]];
        const r0 = rotatePoint([(p0[0] - latticeA/2) / latticeA, (p0[1] - latticeB/2) / latticeB, (p0[2] - latticeC/2) / latticeC], state.rotX, state.rotY);
        const r1 = rotatePoint([(p1[0] - latticeA/2) / latticeA, (p1[1] - latticeB/2) / latticeB, (p1[2] - latticeC/2) / latticeC], state.rotX, state.rotY);
        ctx.beginPath();
        ctx.moveTo(centerX + r0[0] * 150 * state.zoom, centerY + r0[1] * 150 * state.zoom);
        ctx.lineTo(centerX + r1[0] * 150 * state.zoom, centerY + r1[1] * 150 * state.zoom);
        ctx.stroke();
      }

      // Draw atoms
      let atomsToDraw = [];
      for (let sx = 0; sx < supercellSize; sx++) {
        for (let sy = 0; sy < supercellSize; sy++) {
          for (let sz = 0; sz < supercellSize; sz++) {
            for (let pos of sys.positions) {
              const x = (pos[0] + sx) * latticeA - supercellSize * latticeA / 2;
              const y = (pos[1] + sy) * latticeB - supercellSize * latticeB / 2;
              const z = (pos[2] + sz) * latticeC - supercellSize * latticeC / 2;
              const rot = rotatePoint([x / latticeA, y / latticeB, z / latticeC], state.rotX, state.rotY);
              atomsToDraw.push({
                rot,
                size: Math.max(2, atomData.radius * 30 * state.zoom),
                color: atomData.color,
                z: rot[2]
              });
            }
          }
        }
      }

      // Sort by depth and draw
      atomsToDraw.sort((a, b) => a.z - b.z);
      for (let atom of atomsToDraw) {
        ctx.fillStyle = atom.color;
        ctx.beginPath();
        ctx.arc(centerX + atom.rot[0] * 150 * state.zoom, centerY + atom.rot[1] * 150 * state.zoom, atom.size, 0, 2 * Math.PI);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    function updateStats() {
      const sys = systems[state.system];
      document.getElementById('statSystem').textContent = sys.name;
      document.getElementById('statAtomsPerCell').textContent = sys.atomsPerCell;
      document.getElementById('statPacking').textContent = sys.packingPercent + '%';
      document.getElementById('statCoord').textContent = sys.coordinationNumber;
      document.getElementById('statParamA').textContent = state.a.toFixed(2);
      document.getElementById('statAngles').textContent = sys.alpha + '°';
    }

    function updateControls() {
      const sys = systems[state.system];
      const paramContainer = document.getElementById('paramControls');
      paramContainer.innerHTML = '';

      const div_a = document.createElement('div');
      div_a.className = 'slider-container';
      div_a.innerHTML = `
        <label>Lattice Constant a (Å)</label>
        <input type="range" id="sliderA" min="2" max="5" step="0.1" value="${state.a}">
        <div class="slider-value">a = <span id="valA">${state.a.toFixed(2)}</span> Å</div>
      `;
      paramContainer.appendChild(div_a);
      document.getElementById('sliderA').addEventListener('input', (e) => {
        state.a = parseFloat(e.target.value);
        document.getElementById('valA').textContent = state.a.toFixed(2);
        updateStats();
        drawAtoms();
      });

      updateStats();
      drawAtoms();
    }

    // Event listeners
    document.querySelectorAll('input[name="system"]').forEach(input => {
      input.addEventListener('change', (e) => {
        state.system = e.target.value;
        const sys = systems[state.system];
        state.alpha = sys.alpha;
        state.beta = sys.beta;
        state.gamma = sys.gamma;
        updateControls();
      });
    });

    document.querySelectorAll('input[name="element"]').forEach(input => {
      input.addEventListener('change', (e) => {
        state.element = e.target.value;
        drawAtoms();
      });
    });

    document.getElementById('toggleSupercell').addEventListener('change', (e) => {
      state.showSupercell = e.checked;
      drawAtoms();
    });

    function loadPreset(name) {
      const preset = presets[name];
      state.system = preset.system;
      state.element = preset.element;
      state.a = preset.a;

      document.querySelector(`input[value="${preset.system}"]`).checked = true;
      document.querySelector(`input[value="${preset.element}"]`).checked = true;
      document.getElementById('toggleSupercell').checked = false;
      state.showSupercell = false;

      updateControls();
    }

    // Initial draw
    updateControls();

    // Animation loop
    function animate() {
      drawAtoms();
      animationId = requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
