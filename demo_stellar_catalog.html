<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Catalog</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a14;
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.8em;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            font-size: 0.95em;
            opacity: 0.7;
            margin-bottom: 5px;
        }
        
        .sky {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .constellation-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .constellation-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 215, 0, 0.6);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2);
        }
        
        .constellation-card.active {
            background: rgba(255, 215, 0, 0.15);
            border-color: #ffd700;
        }
        
        .const-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .const-name {
            font-family: 'Syne', sans-serif;
            font-size: 1.4em;
            font-weight: 700;
            color: #ffd700;
        }
        
        .const-symbol {
            font-size: 2em;
        }
        
        .const-info {
            font-size: 0.8em;
            opacity: 0.6;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        
        .stars {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .star-tag {
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 0.75em;
            font-weight: 500;
            color: #ffed4e;
            transition: all 0.2s;
        }
        
        .star-tag:hover {
            background: rgba(255, 215, 0, 0.35);
            border-color: rgba(255, 215, 0, 0.7);
        }
        
        .detail-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }
        
        .detail-section h2 {
            font-family: 'Syne', sans-serif;
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .star-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        
        .star-item {
            background: rgba(0, 0, 0, 0.3);
            border-left: 3px solid #ffd700;
            border-radius: 6px;
            padding: 12px;
            font-size: 0.85em;
            line-height: 1.6;
        }
        
        .star-name {
            font-weight: 600;
            color: #ffed4e;
            margin-bottom: 6px;
        }
        
        .star-stat {
            display: flex;
            justify-content: space-between;
            opacity: 0.7;
            font-size: 0.8em;
        }
        
        .magnitude-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }
        
        .magnitude-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd700 0%, #ffed4e 100%);
        }
        
        .empty {
            text-align: center;
            padding: 40px 20px;
            opacity: 0.5;
        }
        
        @media (max-width: 768px) {
            .sky {
                grid-template-columns: 1fr;
            }
            
            .star-list {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⭐ Star Catalog</h1>
            <div class="subtitle">Brightest stars in major constellations</div>
        </header>
        
        <div class="sky" id="constellations"></div>
        
        <div class="detail-section" id="detail">
            <div class="empty">Select a constellation to view its brightest stars</div>
        </div>
    </div>
    
    <script>
        // Real star data: brightest stars in major constellations
        const CONSTELLATIONS = {
            'Orion': {
                symbol: '⚔️',
                latin: 'Ori',
                season: 'Winter',
                location: 'Celestial Equator',
                stars: [
                    { name: 'Rigel', mag: 0.13, type: 'Blue Supergiant', ra: '05h 14m', dec: '-08°12\'' },
                    { name: 'Betelgeuse', mag: 0.50, type: 'Red Supergiant', ra: '05h 56m', dec: '+07°24\'' },
                    { name: 'Bellatrix', mag: 1.64, type: 'Blue Giant', ra: '05h 25m', dec: '+06°21\'' },
                    { name: 'Mintaka', mag: 2.23, type: 'Blue Supergiant', ra: '05h 32m', dec: '-00°18\'' }
                ]
            },
            'Ursa Major': {
                symbol: '🐻',
                latin: 'UMa',
                season: 'Spring',
                location: 'Northern Sky',
                stars: [
                    { name: 'Alkaid', mag: 1.86, type: 'Blue Giant', ra: '13h 48m', dec: '+49°19\'' },
                    { name: 'Mizar', mag: 2.06, type: 'White Dwarf', ra: '13h 24m', dec: '+54°56\'' },
                    { name: 'Alioth', mag: 1.76, type: 'White Dwarf', ra: '12h 54m', dec: '+55°57\'' },
                    { name: 'Megrez', mag: 3.31, type: 'White Dwarf', ra: '12h 35m', dec: '+57°02\'' }
                ]
            },
            'Sirius': {
                symbol: '💫',
                latin: 'CMa',
                season: 'Winter',
                location: 'Southern Hemisphere',
                stars: [
                    { name: 'Sirius', mag: -1.46, type: 'White Star', ra: '06h 45m', dec: '-16°43\'' },
                    { name: 'Adhara', mag: 1.50, type: 'Blue Supergiant', ra: '06h 59m', dec: '-28°59\'' },
                    { name: 'Wezen', mag: 1.84, type: 'Yellow Supergiant', ra: '07h 08m', dec: '-26°23\'' },
                    { name: 'Mirzam', mag: 1.98, type: 'Blue Supergiant', ra: '07h 24m', dec: '-17°57\'' }
                ]
            },
            'Aquila': {
                symbol: '🦅',
                latin: 'Aql',
                season: 'Summer',
                location: 'Summer Triangle',
                stars: [
                    { name: 'Altair', mag: 0.77, type: 'White Star', ra: '19h 51m', dec: '+08°52\'' },
                    { name: 'Alshain', mag: 3.71, type: 'Yellow Star', ra: '19h 46m', dec: '+01°05\'' },
                    { name: 'Tarazed', mag: 2.72, type: 'Yellow Supergiant', ra: '19h 47m', dec: '+10°36\'' }
                ]
            },
            'Lyra': {
                symbol: '🎸',
                latin: 'Lyr',
                season: 'Summer',
                location: 'Summer Triangle',
                stars: [
                    { name: 'Vega', mag: 0.03, type: 'White Star', ra: '18h 37m', dec: '+38°47\'' },
                    { name: 'Sheliak', mag: 3.25, type: 'Blue Supergiant', ra: '18h 50m', dec: '+33°22\'' },
                    { name: 'Sulafat', mag: 3.25, type: 'White Giant', ra: '18h 59m', dec: '+32°41\'' }
                ]
            },
            'Leo': {
                symbol: '🦁',
                latin: 'Leo',
                season: 'Spring',
                location: 'Zodiac',
                stars: [
                    { name: 'Regulus', mag: 1.35, type: 'Blue Supergiant', ra: '10h 08m', dec: '+11°58\'' },
                    { name: 'Denebola', mag: 2.14, type: 'White Star', ra: '11h 49m', dec: '+14°34\'' },
                    { name: 'Algieba', mag: 1.98, type: 'Yellow Giant', ra: '10h 20m', dec: '+19°50\'' }
                ]
            },
            'Pegasus': {
                symbol: '🐎',
                latin: 'Peg',
                season: 'Autumn',
                location: 'Northern Sky',
                stars: [
                    { name: 'Alpheratz', mag: 2.07, type: 'Blue Giant', ra: '00h 08m', dec: '+29°05\'' },
                    { name: 'Scheat', mag: 2.44, type: 'Red Giant', ra: '23h 04m', dec: '+28°05\'' },
                    { name: 'Markab', mag: 2.49, type: 'White Star', ra: '23h 05m', dec: '+15°08\'' }
                ]
            },
            'Perseus': {
                symbol: '⚔️',
                latin: 'Per',
                season: 'Autumn',
                location: 'Northern Sky',
                stars: [
                    { name: 'Mirfak', mag: 1.79, type: 'Yellow Supergiant', ra: '03h 24m', dec: '+49°52\'' },
                    { name: 'Algol', mag: 2.12, type: 'Blue Subgiant', ra: '03h 08m', dec: '+40°57\'' },
                    { name: 'Atik', mag: 3.76, type: 'Blue Supergiant', ra: '03h 55m', dec: '+31°53\'' }
                ]
            }
        };
        
        let activeConstellation = null;
        
        // Render constellation cards
        function renderConstellations() {
            const container = document.getElementById('constellations');
            container.innerHTML = Object.entries(CONSTELLATIONS).map(([name, data]) => `
                <div class="constellation-card" onclick="selectConstellation('${name}')">
                    <div class="const-header">
                        <span class="const-name">${name}</span>
                        <span class="const-symbol">${data.symbol}</span>
                    </div>
                    <div class="const-info">
                        <strong>${data.latin}</strong> • ${data.season} • ${data.location}
                    </div>
                    <div class="stars">
                        ${data.stars.map(s => `<span class="star-tag">${s.name}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }
        
        function selectConstellation(name) {
            activeConstellation = name;
            
            // Update active state
            document.querySelectorAll('.constellation-card').forEach(card => {
                card.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            
            // Render detail
            const data = CONSTELLATIONS[name];
            const detail = document.getElementById('detail');
            
            detail.innerHTML = `
                <h2>${name} (${data.latin})</h2>
                <p style="margin-bottom: 15px; opacity: 0.7; font-size: 0.9em;">
                    <strong>Season:</strong> ${data.season} | <strong>Location:</strong> ${data.location}
                </p>
                <div class="star-list">
                    ${data.stars.map(star => {
                        const brightness = Math.max(10, Math.min(100, (3 - star.mag) * 15));
                        return `
                            <div class="star-item">
                                <div class="star-name">${star.name}</div>
                                <div class="star-stat">
                                    <span><strong>Type:</strong> ${star.type}</span>
                                </div>
                                <div class="star-stat">
                                    <span><strong>Magnitude:</strong> ${star.mag}</span>
                                    <span><strong>RA:</strong> ${star.ra}</span>
                                </div>
                                <div class="star-stat">
                                    <span><strong>Declination:</strong> ${star.dec}</span>
                                </div>
                                <div class="magnitude-bar">
                                    <div class="magnitude-fill" style="width: ${brightness}%"></div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }
        
        // Initialize
        renderConstellations();
        selectConstellation('Orion');
    </script>
</body>
</html>
