<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petri Cultivator</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Mono', monospace;
      background: #1a1a2e;
      color: #e0e0ff;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      max-width: 1100px;
      width: 100%;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 30px;
      background: #16213e;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: #00d4ff;
      grid-column: 1 / -1;
      margin-bottom: 20px;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .control-group {
      background: #0f3460;
      border-radius: 8px;
      padding: 15px;
      border-left: 4px solid #4da8da;
    }
    .control-group label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: #4da8da;
      font-weight: 700;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #1a1a2e;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #00d4ff;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0,212,255,0.6);
    }
    input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #00d4ff;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 8px rgba(0,212,255,0.6);
    }
    .value-display {
      font-size: 12px;
      color: #e0e0ff;
      margin-top: 5px;
      font-weight: 700;
    }
    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    button {
      background: #0f3460;
      color: #e0e0ff;
      border: 2px solid #4da8da;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }
    button:hover {
      background: #1a3a5a;
      box-shadow: 0 0 10px rgba(77,168,218,0.5);
    }
    button.active {
      background: #4da8da;
      color: #0f3460;
      box-shadow: 0 0 12px rgba(0,212,255,0.8);
    }
    .stats-box {
      background: #0a0f15;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px;
      font-size: 11px;
      line-height: 1.7;
    }
    .stat-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
    }
    .label { color: #4da8da; font-weight: 700; }
    .value { color: #00d4ff; font-weight: 700; }
    canvas {
      background: #0a0f15;
      border: 1px solid #333;
      border-radius: 8px;
      display: block;
      width: 100%;
      height: auto;
    }
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 12px;
      color: #e0e0ff;
      margin-bottom: 0;
    }
    input[type="checkbox"] {
      width: 14px;
      height: 14px;
      cursor: pointer;
      accent-color: #00d4ff;
    }
    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
      h1 { grid-column: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔬 Petri Cultivator</h1>

    <div class="sidebar">
      <div class="control-group">
        <label for="nutrient">Nutrient Level</label>
        <input type="range" id="nutrient" min="0.1" max="1" value="0.7" step="0.1">
        <div class="value-display"><span id="nutrientDisplay">70</span>%</div>
      </div>

      <div class="control-group">
        <label for="temp">Temperature</label>
        <input type="range" id="temp" min="5" max="45" value="37" step="1">
        <div class="value-display"><span id="tempDisplay">37</span>°C</div>
      </div>

      <div class="control-group">
        <label for="ph">pH Level</label>
        <input type="range" id="ph" min="3" max="11" value="7" step="0.5">
        <div class="value-display"><span id="phDisplay">7.0</span></div>
      </div>

      <div class="control-group">
        <label>Species</label>
        <div class="button-group">
          <button id="speciesE" class="active">E. coli</button>
          <button id="speciesY">Yeast</button>
          <button id="speciesB">Bacillus</button>
        </div>
      </div>

      <div class="control-group">
        <label>Actions</label>
        <button id="resetBtn" style="width: 100%; margin-bottom: 6px;">Reset Plate</button>
        <button id="inoculateBtn" style="width: 100%;">Inoculate</button>
      </div>

      <div class="control-group">
        <div class="checkbox-group">
          <label>
            <input type="checkbox" id="showGrowthRate">
            Show Growth Rate
          </label>
          <label>
            <input type="checkbox" id="showPhaseLabel">
            Show Phases
          </label>
        </div>
      </div>

      <div class="stats-box">
        <div class="stat-line">
          <span class="label">Colony Count:</span>
          <span class="value"><span id="statCount">0</span></span>
        </div>
        <div class="stat-line">
          <span class="label">Biomass:</span>
          <span class="value"><span id="statBiomass">0</span>%</span>
        </div>
        <div class="stat-line">
          <span class="label">Growth Phase:</span>
          <span class="value"><span id="statPhase">Lag</span></span>
        </div>
        <div class="stat-line">
          <span class="label">Species:</span>
          <span class="value"><span id="statSpecies">E. coli</span></span>
        </div>
        <div class="stat-line">
          <span class="label">Viability:</span>
          <span class="value"><span id="statViability">100</span>%</span>
        </div>
      </div>
    </div>

    <canvas id="petriCanvas" width="700" height="500"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('petriCanvas');
    const ctx = canvas.getContext('2d');

    let state = {
      nutrient: 0.7,
      temperature: 37,
      ph: 7,
      species: 'E. coli',
      time: 0,
      colonies: [],
      showGrowthRate: false,
      showPhases: false,
      inoculated: false,
      biomass: 0
    };

    const speciesData = {
      'E. coli': { color: '#ff6b9d', optimalTemp: 37, optimalPH: 7, growthRate: 0.15 },
      'Yeast': { color: '#f4d03f', optimalTemp: 25, optimalPH: 6, growthRate: 0.08 },
      'Bacillus': { color: '#52c41a', optimalTemp: 40, optimalPH: 7.2, growthRate: 0.12 }
    };

    // UI Controls
    document.getElementById('nutrient').addEventListener('input', (e) => {
      state.nutrient = parseFloat(e.target.value);
      document.getElementById('nutrientDisplay').textContent = Math.round(state.nutrient * 100);
    });

    document.getElementById('temp').addEventListener('input', (e) => {
      state.temperature = parseInt(e.target.value);
      document.getElementById('tempDisplay').textContent = state.temperature;
    });

    document.getElementById('ph').addEventListener('input', (e) => {
      state.ph = parseFloat(e.target.value);
      document.getElementById('phDisplay').textContent = state.ph.toFixed(1);
    });

    ['E. coli', 'Yeast', 'Bacillus'].forEach(sp => {
      const btnId = `species${sp.split(' ')[0][0]}`;
      document.getElementById(btnId).addEventListener('click', () => {
        state.species = sp;
        document.querySelectorAll('.control-group button[id^="species"]').forEach(b => b.classList.remove('active'));
        document.getElementById(btnId).classList.add('active');
        updateStats();
      });
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      state.colonies = [];
      state.time = 0;
      state.biomass = 0;
      state.inoculated = false;
      updateStats();
    });

    document.getElementById('inoculateBtn').addEventListener('click', () => {
      state.inoculated = true;
      state.time = 0;
      state.colonies = [];
      for (let i = 0; i < 8; i++) {
        state.colonies.push({
          x: Math.random() * (canvas.width - 200) + 100,
          y: Math.random() * (canvas.height - 200) + 100,
          radius: 3,
          maxRadius: 20 + Math.random() * 40
        });
      }
    });

    document.getElementById('showGrowthRate').addEventListener('change', (e) => {
      state.showGrowthRate = e.target.checked;
    });

    document.getElementById('showPhaseLabel').addEventListener('change', (e) => {
      state.showPhases = e.target.checked;
    });

    function getGrowthPhase() {
      if (!state.inoculated) return 'Lag';
      if (state.time < 30) return 'Lag';
      if (state.time < 150) return 'Exponential';
      if (state.time < 300) return 'Stationary';
      return 'Decline';
    }

    function updateStats() {
      const phase = getGrowthPhase();
      const colonyCount = state.colonies.length;

      document.getElementById('statCount').textContent = colonyCount;
      document.getElementById('statBiomass').textContent = Math.round(state.biomass);
      document.getElementById('statPhase').textContent = phase;
      document.getElementById('statSpecies').textContent = state.species;

      const tempDev = Math.abs(state.temperature - speciesData[state.species].optimalTemp);
      const phDev = Math.abs(state.ph - speciesData[state.species].optimalPH);
      const viability = Math.max(20, Math.round(100 - (tempDev * 2 + phDev * 5)));
      document.getElementById('statViability').textContent = viability;
    }

    function drawPetriDish() {
      ctx.fillStyle = '#0a0f15';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Petri dish circle
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = 150;

      ctx.strokeStyle = '#4da8da';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.stroke();

      // Agar background
      ctx.fillStyle = 'rgba(200, 180, 140, 0.1)';
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius - 2, 0, Math.PI * 2);
      ctx.fill();

      // Draw colonies
      if (state.inoculated) {
        const data = speciesData[state.species];
        const tempFit = 1 - (Math.abs(state.temperature - data.optimalTemp) / 30);
        const phFit = 1 - (Math.abs(state.ph - data.optimalPH) / 4);
        const nutrientFit = state.nutrient;
        const environmentFit = tempFit * phFit * nutrientFit * 0.8;

        const phase = getGrowthPhase();
        let growthMultiplier = 0;
        if (phase === 'Exponential') growthMultiplier = 1.5;
        else if (phase === 'Stationary') growthMultiplier = 0.2;
        else if (phase === 'Decline') growthMultiplier = -0.5;

        for (let colony of state.colonies) {
          colony.radius += (data.growthRate * environmentFit + growthMultiplier * 0.05);
          colony.radius = Math.min(colony.radius, colony.maxRadius);

          const dist = Math.hypot(colony.x - centerX, colony.y - centerY);
          if (dist + colony.radius < radius) {
            ctx.fillStyle = data.color;
            ctx.globalAlpha = 0.8;
            ctx.beginPath();
            ctx.arc(colony.x, colony.y, colony.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
          }
        }

        state.biomass = Math.round(
          state.colonies.reduce((s, c) => s + Math.pow(c.radius / 5, 2), 0) * 2
        );
      }

      // Growth rate indicator
      if (state.showGrowthRate && state.inoculated) {
        const data = speciesData[state.species];
        const tempFit = 1 - (Math.abs(state.temperature - data.optimalTemp) / 30);
        const phFit = 1 - (Math.abs(state.ph - data.optimalPH) / 4);
        const growthRate = (tempFit * phFit * state.nutrient * 100).toFixed(1);

        ctx.fillStyle = '#4da8da';
        ctx.font = '13px "Space Mono"';
        ctx.fillText(`Growth Rate: ${growthRate}%`, 20, 30);
      }

      // Phase label
      if (state.showPhases && state.inoculated) {
        const phase = getGrowthPhase();
        ctx.fillStyle = '#00d4ff';
        ctx.font = 'bold 14px "Space Mono"';
        ctx.textAlign = 'center';
        ctx.fillText(phase, canvas.width / 2, canvas.height - 30);
        ctx.textAlign = 'left';
      }
    }

    function animate() {
      if (state.inoculated) {
        state.time += 0.5;
      }

      drawPetriDish();
      updateStats();

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
