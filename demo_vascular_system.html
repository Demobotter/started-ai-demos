<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vascular System — Plant Transport</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #f5f1e8;
        }
        .container {
            display: flex;
            gap: 30px;
            max-width: 1400px;
            width: 100%;
            background: rgba(27, 94, 32, 0.95);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .sidebar {
            width: 300px;
            flex-shrink: 0;
        }
        .canvas-wrapper {
            flex: 1;
            min-height: 600px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5em;
            margin-bottom: 30px;
            color: #66bb6a;
            text-align: center;
            width: 100%;
            grid-column: 1 / -1;
        }
        .plant-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
        }
        .plant-btn {
            padding: 12px 16px;
            background: rgba(102, 187, 106, 0.2);
            border: 2px solid #66bb6a;
            color: #f5f1e8;
            font-family: 'Space Mono', monospace;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .plant-btn:hover {
            background: rgba(102, 187, 106, 0.4);
            transform: translateX(5px);
        }
        .plant-btn.active {
            background: #66bb6a;
            color: #1b5e20;
        }
        .tab-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(102, 187, 106, 0.3);
            padding-bottom: 10px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: rgba(245, 241, 232, 0.7);
            font-family: 'Space Mono', monospace;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        .tab-btn.active {
            color: #66bb6a;
            border-bottom-color: #66bb6a;
        }
        .tab-btn:hover {
            color: #a1c584;
        }
        .control-group {
            margin-bottom: 25px;
        }
        .control-group label {
            display: block;
            font-size: 0.95em;
            font-weight: bold;
            margin-bottom: 8px;
            color: #a1c584;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .slider-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: rgba(102, 187, 106, 0.2);
            outline: none;
            -webkit-appearance: none;
            accent-color: #66bb6a;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #66bb6a;
            cursor: pointer;
            transition: all 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            background: #a1c584;
            transform: scale(1.2);
        }
        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #66bb6a;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .slider-value {
            font-family: 'Space Mono', monospace;
            font-weight: bold;
            min-width: 50px;
            text-align: right;
            color: #66bb6a;
        }
        .toggle-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .toggle-btn {
            flex: 1;
            padding: 10px;
            background: rgba(102, 187, 106, 0.2);
            border: 2px solid rgba(102, 187, 106, 0.4);
            color: #f5f1e8;
            font-family: 'Space Mono', monospace;
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: bold;
            transition: all 0.3s;
        }
        .toggle-btn.active {
            background: rgba(102, 187, 106, 0.6);
            border-color: #66bb6a;
        }
        .toggle-btn:hover {
            border-color: #66bb6a;
        }
        .stats-box {
            background: rgba(102, 187, 106, 0.1);
            border-left: 4px solid #66bb6a;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
        .stats-box .label {
            font-weight: bold;
            color: #a1c584;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stats-box .value {
            font-family: 'Space Mono', monospace;
            font-size: 1.3em;
            color: #66bb6a;
            margin-top: 5px;
        }
        canvas {
            display: block;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 100%;
        }
        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
                gap: 20px;
            }
            .sidebar {
                width: 100%;
            }
            .canvas-wrapper {
                min-height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌱 Vascular System</h1>
        <div class="sidebar">
            <div class="plant-buttons">
                <button class="plant-btn active" data-plant="monocot">🌽 Corn (Monocot)</button>
                <button class="plant-btn" data-plant="dicot">🍅 Tomato (Dicot)</button>
                <button class="plant-btn" data-plant="woody">🌳 Oak (Woody)</button>
            </div>

            <div class="tab-group">
                <button class="tab-btn active" data-tab="xylem">Water</button>
                <button class="tab-btn" data-tab="phloem">Sugar</button>
            </div>

            <div class="control-group">
                <label>Plant Height</label>
                <div class="slider-container">
                    <input type="range" id="heightSlider" min="0.5" max="2" step="0.1" value="1" />
                    <span class="slider-value" id="heightValue">1.0 m</span>
                </div>
            </div>

            <div class="control-group">
                <label>Environmental Stress</label>
                <div class="toggle-group">
                    <button class="toggle-btn" id="droughtBtn">Drought</button>
                    <button class="toggle-btn active" id="lightBtn">Light</button>
                </div>
            </div>

            <div class="stats-box">
                <div class="label">Xylem Flow Speed</div>
                <div class="value" id="stat-xylem">0.33 cm/min</div>
            </div>
            <div class="stats-box">
                <div class="label">Phloem Flow Speed</div>
                <div class="value" id="stat-phloem">45 cm/h</div>
            </div>
            <div class="stats-box">
                <div class="label">Transport Efficiency</div>
                <div class="value" id="stat-efficiency">95%</div>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="demoCanvas"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('demoCanvas');
        const ctx = canvas.getContext('2d');

        let state = {
            plant: 'monocot',
            tab: 'xylem',
            height: 1.0,
            drought: false,
            light: true,
            time: 0
        };

        function resizeCanvas() {
            const wrapper = canvas.parentElement;
            canvas.width = wrapper.clientWidth;
            canvas.height = Math.max(600, wrapper.clientHeight);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Plant cross-section data
        const plants = {
            monocot: {
                name: 'Corn (Monocot)',
                bundles: [
                    { x: 0.2, y: 0.3 }, { x: 0.5, y: 0.2 }, { x: 0.8, y: 0.35 },
                    { x: 0.3, y: 0.6 }, { x: 0.65, y: 0.65 }, { x: 0.4, y: 0.8 }
                ],
                description: 'Scattered vascular bundles (parallel arrangement)'
            },
            dicot: {
                name: 'Tomato (Dicot)',
                bundles: [
                    { x: 0.2, y: 0.5 }, { x: 0.5, y: 0.2 }, { x: 0.8, y: 0.5 },
                    { x: 0.5, y: 0.8 }, { x: 0.35, y: 0.35 }, { x: 0.65, y: 0.65 }
                ],
                description: 'Ring of vascular bundles with cambium (secondary growth)',
                hasRing: true
            },
            woody: {
                name: 'Oak (Woody)',
                rings: 8,
                description: 'Annual rings, bark, distinct xylem/phloem tissues'
            }
        };

        function drawCrossSection() {
            const w = canvas.width;
            const h = canvas.height;
            const cx = w * 0.35;
            const cy = h / 2;
            const radius = 120;

            // Clear canvas
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, w, h);

            // Title
            ctx.fillStyle = '#f5f1e8';
            ctx.font = 'bold 18px Space Mono';
            ctx.textAlign = 'left';
            ctx.fillText(`${plants[state.plant].name}`, cx - radius - 50, cy - radius - 80);
            ctx.font = '14px Space Mono';
            ctx.fillStyle = '#a1c584';
            ctx.fillText(plants[state.plant].description, cx - radius - 50, cy - radius - 50);

            if (state.plant === 'woody') {
                drawWoodySection(cx, cy, radius);
            } else {
                drawHerbaceousSection(cx, cy, radius);
            }

            drawTransportViz(w, h, cx, cy, radius);
        }

        function drawHerbaceousSection(cx, cy, radius) {
            // Epidermis
            ctx.fillStyle = '#a1887f';
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fill();

            // Cortex
            ctx.fillStyle = '#9ccc65';
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.85, 0, Math.PI * 2);
            ctx.fill();

            // Endodermis (gold border)
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.70, 0, Math.PI * 2);
            ctx.stroke();

            // Vascular bundles
            const plant = plants[state.plant];
            plant.bundles.forEach(bundle => {
                const bx = cx - radius * 0.5 + bundle.x * radius;
                const by = cy - radius * 0.5 + bundle.y * radius;
                const bsize = 18;

                // Xylem (blue)
                ctx.fillStyle = state.tab === 'xylem' ? '#0288d1' : 'rgba(2, 136, 209, 0.5)';
                ctx.fillRect(bx - bsize / 2, by - bsize / 2, bsize, bsize);

                // Phloem (green)
                ctx.fillStyle = state.tab === 'phloem' ? '#66bb6a' : 'rgba(102, 187, 106, 0.5)';
                ctx.fillRect(bx - bsize / 2 + 8, by - bsize / 2 + 8, bsize - 8, bsize - 8);
            });

            // Center pith
            ctx.fillStyle = '#c5e1a5';
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.25, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawWoodySection(cx, cy, radius) {
            // Bark
            ctx.fillStyle = '#5d4037';
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fill();

            // Growth rings (annual rings)
            const rings = plants.woody.rings;
            for (let i = rings; i > 0; i--) {
                const r = radius * (i / rings);
                if (i % 2 === 0) {
                    ctx.fillStyle = '#8d6e63'; // Lighter ring
                } else {
                    ctx.fillStyle = '#6d4c41'; // Darker ring
                }
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // Cambium (gold ring)
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.5, 0, Math.PI * 2);
            ctx.stroke();

            // Phloem (outside cambium)
            ctx.fillStyle = state.tab === 'phloem' ? 'rgba(102, 187, 106, 0.4)' : 'rgba(102, 187, 106, 0.2)';
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.52, 0, Math.PI * 2);
            ctx.fill();

            // Xylem (inside - heartwood/sapwood)
            ctx.fillStyle = state.tab === 'xylem' ? 'rgba(2, 136, 209, 0.4)' : 'rgba(2, 136, 209, 0.2)';
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.48, 0, Math.PI * 2);
            ctx.fill();

            // Center pith
            ctx.fillStyle = '#ffebee';
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.15, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawTransportViz(w, h, cx, cy, radius) {
            const x = cx + radius + 100;
            const y = cy;
            const vHeight = 180;

            // Title
            ctx.fillStyle = '#f5f1e8';
            ctx.font = 'bold 14px Space Mono';
            ctx.textAlign = 'center';
            ctx.fillText(state.tab === 'xylem' ? 'Water Transport (Xylem)' : 'Sugar Transport (Phloem)', x, cy - vHeight - 60);

            // Vessel outline
            ctx.strokeStyle = '#a1c584';
            ctx.lineWidth = 2;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(x - 40, y - vHeight, 80, vHeight * 2);
            ctx.strokeRect(x - 40, y - vHeight, 80, vHeight * 2);

            // Particle animation
            const particleCount = 6;
            const flowSpeed = state.drought ? 0.3 : 0.7;
            const offset = (state.time * flowSpeed) % (vHeight * 2);

            if (state.tab === 'xylem') {
                // Water particles (blue, upward)
                ctx.fillStyle = '#0288d1';
                for (let i = 0; i < particleCount; i++) {
                    const py = y - vHeight + offset + (i * (vHeight * 2) / particleCount);
                    ctx.beginPath();
                    ctx.arc(x, py, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.font = '12px Space Mono';
                ctx.fillStyle = '#0288d1';
                ctx.textAlign = 'right';
                ctx.fillText('H₂O', x + 50, y - vHeight - 20);
            } else {
                // Sugar particles (green, bidirectional)
                ctx.fillStyle = '#66bb6a';
                for (let i = 0; i < particleCount; i++) {
                    const py = y - vHeight + offset + (i * (vHeight * 2) / particleCount);
                    ctx.beginPath();
                    ctx.arc(x, py, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.font = '12px Space Mono';
                ctx.fillStyle = '#66bb6a';
                ctx.textAlign = 'right';
                ctx.fillText('C₁₂H₂₂O₁₁', x + 50, y - vHeight - 20);
            }

            // Direction arrows
            ctx.strokeStyle = '#a1c584';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(x + 60, cy - 80);
            ctx.lineTo(x + 60, cy + 80);
            ctx.stroke();
            ctx.setLineDash([]);

            if (state.tab === 'xylem') {
                // Up arrow for xylem
                ctx.fillStyle = '#0288d1';
                ctx.beginPath();
                ctx.moveTo(x + 60, cy - 100);
                ctx.lineTo(x + 55, cy - 85);
                ctx.lineTo(x + 65, cy - 85);
                ctx.fill();
            } else {
                // Bidirectional arrows for phloem
                ctx.fillStyle = '#66bb6a';
                ctx.beginPath();
                ctx.moveTo(x + 60, cy - 100);
                ctx.lineTo(x + 55, cy - 85);
                ctx.lineTo(x + 65, cy - 85);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(x + 60, cy + 100);
                ctx.lineTo(x + 55, cy + 85);
                ctx.lineTo(x + 65, cy + 85);
                ctx.fill();
            }
        }

        function updateStats() {
            const droughtFactor = state.drought ? 0.5 : 1.0;
            const heightFactor = state.height / 1.0;

            if (state.tab === 'xylem') {
                const xylemSpeed = (0.33 * droughtFactor).toFixed(2);
                document.getElementById('stat-xylem').textContent = xylemSpeed + ' cm/min';
                document.getElementById('stat-phloem').textContent = (45 * droughtFactor).toFixed(0) + ' cm/h';
            } else {
                document.getElementById('stat-xylem').textContent = (20 * droughtFactor).toFixed(1) + ' cm/h';
                document.getElementById('stat-phloem').textContent = (45 * droughtFactor).toFixed(0) + ' cm/h';
            }

            const efficiency = Math.round(95 - (state.drought ? 30 : 0));
            document.getElementById('stat-efficiency').textContent = efficiency + '%';
        }

        function animate() {
            state.time++;
            drawCrossSection();
            requestAnimationFrame(animate);
        }

        // Event listeners
        document.querySelectorAll('.plant-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.plant-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                state.plant = e.target.dataset.plant;
            });
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                state.tab = e.target.dataset.tab;
            });
        });

        document.getElementById('heightSlider').addEventListener('input', (e) => {
            state.height = parseFloat(e.target.value);
            document.getElementById('heightValue').textContent = state.height.toFixed(1) + ' m';
        });

        document.getElementById('droughtBtn').addEventListener('click', (e) => {
            state.drought = !state.drought;
            e.target.classList.toggle('active');
            updateStats();
        });

        document.getElementById('lightBtn').addEventListener('click', (e) => {
            state.light = !state.light;
            e.target.classList.toggle('active');
            updateStats();
        });

        updateStats();
        animate();
    </script>
</body>
</html>
