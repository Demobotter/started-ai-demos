<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creature Card Creator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #2a1a4f 0%, #1a3a5f 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(15, 10, 35, 0.95);
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-family: 'Merriweather', serif;
            font-size: 2.2em;
            color: #ffd93d;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: -0.5px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        .panel {
            background: rgba(42, 26, 79, 0.6);
            border: 1px solid rgba(127, 179, 255, 0.3);
            border-radius: 8px;
            padding: 20px;
        }
        .panel h2 {
            font-family: 'Merriweather', serif;
            font-size: 1.1em;
            color: #7fb3ff;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85em;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 0.9em;
            color: #d4d4d4;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        select, button {
            width: 100%;
            padding: 8px 12px;
            background: rgba(31, 20, 50, 0.8);
            border: 1px solid rgba(127, 179, 255, 0.4);
            border-radius: 6px;
            color: #d4d4d4;
            font-family: 'Inter', sans-serif;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.2s;
        }
        select:hover, select:focus {
            border-color: rgba(127, 179, 255, 0.8);
            background: rgba(31, 20, 50, 1);
            outline: none;
        }
        .trait-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 8px;
        }
        .trait-btn {
            width: 100%;
            padding: 6px;
            background: rgba(31, 20, 50, 0.6);
            border: 1px solid rgba(127, 179, 255, 0.3);
            border-radius: 4px;
            color: #7fb3ff;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.2s;
        }
        .trait-btn.selected {
            background: rgba(127, 179, 255, 0.4);
            border-color: #7fb3ff;
            color: #fff;
            font-weight: 600;
        }
        .trait-btn:hover {
            border-color: #7fb3ff;
        }
        .card-display {
            background: rgba(31, 20, 50, 0.8);
            border: 2px solid #ffd93d;
            border-radius: 8px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.75em;
            line-height: 1.4;
            color: #7fb3ff;
            white-space: pre;
            overflow-x: auto;
            min-height: 220px;
            margin-bottom: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .stat {
            background: rgba(42, 26, 79, 0.4);
            border: 1px solid rgba(127, 179, 255, 0.2);
            border-radius: 4px;
            padding: 8px;
            font-size: 0.85em;
        }
        .stat-label {
            color: #7fb3ff;
            text-transform: uppercase;
            font-size: 0.75em;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .stat-value {
            font-family: 'Merriweather', serif;
            color: #ffd93d;
            font-size: 1.3em;
            font-weight: 700;
        }
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn {
            padding: 10px;
            background: rgba(127, 179, 255, 0.2);
            border: 1px solid #7fb3ff;
            border-radius: 6px;
            color: #7fb3ff;
            font-family: 'Inter', sans-serif;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn:hover {
            background: rgba(127, 179, 255, 0.4);
            border-color: #fff;
            color: #fff;
        }
        .btn-primary {
            background: rgba(255, 217, 61, 0.2);
            border-color: #ffd93d;
            color: #ffd93d;
        }
        .btn-primary:hover {
            background: rgba(255, 217, 61, 0.4);
            color: #fff;
        }
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .container { padding: 20px; }
            h1 { font-size: 1.6em; }
            .trait-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐉 Creature Card Creator</h1>
        
        <div class="grid">
            <!-- Builder Panel -->
            <div class="panel">
                <h2>Builder</h2>
                
                <div class="control-group">
                    <label>Body Type</label>
                    <select id="bodyType">
                        <option value="quadruped">Quadruped</option>
                        <option value="biped">Biped</option>
                        <option value="avian">Avian</option>
                        <option value="aquatic">Aquatic</option>
                        <option value="insectoid">Insectoid</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Size</label>
                    <div class="trait-grid">
                        <button class="trait-btn" data-trait="size" data-value="tiny">Tiny</button>
                        <button class="trait-btn" data-trait="size" data-value="small">Small</button>
                        <button class="trait-btn" data-trait="size" data-value="medium">Medium</button>
                        <button class="trait-btn" data-trait="size" data-value="large">Large</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>Movement</label>
                    <div class="trait-grid">
                        <button class="trait-btn" data-trait="movement" data-value="slow">Slow</button>
                        <button class="trait-btn" data-trait="movement" data-value="fast">Fast</button>
                        <button class="trait-btn" data-trait="movement" data-value="flying">Flying</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>Diet</label>
                    <div class="trait-grid">
                        <button class="trait-btn" data-trait="diet" data-value="herbivore">Herbivore</button>
                        <button class="trait-btn" data-trait="diet" data-value="carnivore">Carnivore</button>
                        <button class="trait-btn" data-trait="diet" data-value="omnivore">Omnivore</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>Temperament</label>
                    <div class="trait-grid">
                        <button class="trait-btn" data-trait="temperament" data-value="aggressive">Aggressive</button>
                        <button class="trait-btn" data-trait="temperament" data-value="friendly">Friendly</button>
                        <button class="trait-btn" data-trait="temperament" data-value="neutral">Neutral</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>Defense</label>
                    <div class="trait-grid">
                        <button class="trait-btn" data-trait="defense" data-value="armor">Armor</button>
                        <button class="trait-btn" data-trait="defense" data-value="camouflage">Camouflage</button>
                        <button class="trait-btn" data-trait="defense" data-value="speed">Speed</button>
                        <button class="trait-btn" data-trait="defense" data-value="poison">Poison</button>
                    </div>
                </div>
            </div>

            <!-- Card Display Panel -->
            <div class="panel">
                <h2>Card</h2>
                <div class="card-display" id="cardDisplay"></div>
                <div class="stats-grid">
                    <div class="stat">
                        <div class="stat-label">Strength</div>
                        <div class="stat-value" id="statStr">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Speed</div>
                        <div class="stat-value" id="statSpd">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Intelligence</div>
                        <div class="stat-value" id="statInt">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Charisma</div>
                        <div class="stat-value" id="statCha">0</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-primary" id="generateBtn">Generate Random</button>
            <button class="btn" id="exportBtn">Export as JSON</button>
        </div>
    </div>

    <script>
        const state = {
            bodyType: 'quadruped',
            traits: {
                size: 'medium',
                movement: 'fast',
                diet: 'omnivore',
                temperament: 'neutral',
                defense: 'speed'
            }
        };

        const creatures = {
            quadruped: ['Drake', 'Lupine', 'Stalker', 'Prowler', 'Grazer', 'Stomper', 'Beast'],
            biped: ['Ursan', 'Humanoid', 'Sapient', 'Sentinel', 'Warden', 'Titan', 'Golem'],
            avian: ['Raptor', 'Strix', 'Skyborn', 'Roc', 'Corvine', 'Plumage', 'Aero'],
            aquatic: ['Leviathan', 'Swimmer', 'Nautilus', 'Siren', 'Kelp', 'Abyssal', 'Tide'],
            insectoid: ['Chitinid', 'Hexapod', 'Carapace', 'Swarm', 'Mandible', 'Compound', 'Hive']
        };

        const qualifiers = {
            tiny: 'Wee ',
            small: 'Lesser ',
            medium: '',
            large: 'Greater ',
            massive: 'Primordial '
        };

        function hashString(str, seed = 0) {
            let h1 = 0xdeadbeef ^ seed;
            for (let i = 0; i < str.length; i++) {
                h1 = ((h1 << 5) - h1) ^ str.charCodeAt(i);
                h1 = h1 & h1;
            }
            return Math.abs(h1) % 100;
        }

        function getTraitHash(traitName, value) {
            return hashString(`${traitName}:${value}`, 42);
        }

        function calculateStats() {
            let str = 5, spd = 5, intel = 5, cha = 5;

            // Size modifier
            const sizeMap = { tiny: -2, small: -1, medium: 0, large: 1, massive: 2 };
            const sizeMod = sizeMap[state.traits.size] || 0;
            str += sizeMod;

            // Movement modifier
            const movMap = { slow: -1, fast: 1, flying: 1 };
            const movMod = movMap[state.traits.movement] || 0;
            spd += movMod;

            // Diet modifier
            if (state.traits.diet === 'carnivore') { str += 1; intel += 1; }
            if (state.traits.diet === 'herbivore') { spd += 1; }

            // Temperament modifier
            if (state.traits.temperament === 'aggressive') { str += 1; cha -= 1; }
            if (state.traits.temperament === 'friendly') { cha += 2; intel += 1; }

            // Defense modifier
            const defMap = { armor: 1, camouflage: 0, speed: 1, poison: 0 };
            intel += defMap[state.traits.defense] || 0;

            // Body type modifier
            const bodyMap = {
                quadruped: { str: 0, spd: 0 },
                biped: { str: 1, spd: 0 },
                avian: { spd: 2, str: -1 },
                aquatic: { spd: 1, intel: 1 },
                insectoid: { spd: 1, intel: 0 }
            };
            const bodyMod = bodyMap[state.bodyType] || {};
            str += bodyMod.str || 0;
            spd += bodyMod.spd || 0;
            intel += bodyMod.intel || 0;

            return {
                strength: Math.max(1, Math.min(10, str)),
                speed: Math.max(1, Math.min(10, spd)),
                intelligence: Math.max(1, Math.min(10, intel)),
                charisma: Math.max(1, Math.min(10, cha))
            };
        }

        function generateCreatureName() {
            const list = creatures[state.bodyType];
            const hashVal = getTraitHash('name', `${state.bodyType}:${JSON.stringify(state.traits)}`);
            const base = list[hashVal % list.length];
            const qualifier = qualifiers[state.traits.size] || '';
            return qualifier + base;
        }

        function generateLore() {
            const templates = [
                `A ${state.traits.size} ${state.traits.diet} with a ${state.traits.temperament} disposition.`,
                `Known for its ${state.traits.movement} movement and ${state.traits.defense} defense mechanism.`,
                `${state.traits.diet === 'carnivore' ? 'Apex predator' : 'Prey species'} with ${state.traits.movement} reflexes.`,
                `Often seen prowling in ${state.traits.movement === 'flying' ? 'skies' : 'terrain'} with ${state.traits.temperament} attitude.`
            ];
            const hashVal = getTraitHash('lore', JSON.stringify(state.traits));
            return templates[hashVal % templates.length];
        }

        function renderCard() {
            const stats = calculateStats();
            const name = generateCreatureName();
            const lore = generateLore();

            const card = `
┌─────────────────────────────────────┐
│ ${name.padEnd(35)} │
├─────────────────────────────────────┤
│ Type: ${(state.bodyType + ' / ' + state.traits.size).padEnd(31)} │
│ Diet: ${state.traits.diet.padEnd(32)} │
│ Temperament: ${state.traits.temperament.padEnd(23)} │
├─────────────────────────────────────┤
│ STR: [${'█'.repeat(stats.strength)}${'░'.repeat(10-stats.strength)}] ${stats.strength}   │
│ SPD: [${'█'.repeat(stats.speed)}${'░'.repeat(10-stats.speed)}] ${stats.speed}   │
│ INT: [${'█'.repeat(stats.intelligence)}${'░'.repeat(10-stats.intelligence)}] ${stats.intelligence}   │
│ CHA: [${'█'.repeat(stats.charisma)}${'░'.repeat(10-stats.charisma)}] ${stats.charisma}   │
├─────────────────────────────────────┤
│ ${lore.substring(0, 35).padEnd(35)} │
└─────────────────────────────────────┘
            `.trim();

            document.getElementById('cardDisplay').textContent = card;
            document.getElementById('statStr').textContent = stats.strength;
            document.getElementById('statSpd').textContent = stats.speed;
            document.getElementById('statInt').textContent = stats.intelligence;
            document.getElementById('statCha').textContent = stats.charisma;
        }

        function initializeUI() {
            renderCard();
            
            // Set initial trait buttons
            document.querySelectorAll('.trait-btn').forEach(btn => {
                const trait = btn.dataset.trait;
                const value = btn.dataset.value;
                if (state.traits[trait] === value) {
                    btn.classList.add('selected');
                }
            });
        }

        // Event Listeners
        document.getElementById('bodyType').addEventListener('change', (e) => {
            state.bodyType = e.target.value;
            renderCard();
        });

        document.querySelectorAll('.trait-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const trait = btn.dataset.trait;
                const value = btn.dataset.value;

                document.querySelectorAll(`.trait-btn[data-trait="${trait}"]`).forEach(b => {
                    b.classList.remove('selected');
                });

                btn.classList.add('selected');
                state.traits[trait] = value;
                renderCard();
            });
        });

        document.getElementById('generateBtn').addEventListener('click', () => {
            const bodyTypes = ['quadruped', 'biped', 'avian', 'aquatic', 'insectoid'];
            const sizes = ['tiny', 'small', 'medium', 'large', 'massive'];
            const movements = ['slow', 'fast', 'flying'];
            const diets = ['herbivore', 'carnivore', 'omnivore'];
            const temperaments = ['aggressive', 'friendly', 'neutral'];
            const defenses = ['armor', 'camouflage', 'speed', 'poison'];

            state.bodyType = bodyTypes[Math.floor(Math.random() * bodyTypes.length)];
            state.traits.size = sizes[Math.floor(Math.random() * sizes.length)];
            state.traits.movement = movements[Math.floor(Math.random() * movements.length)];
            state.traits.diet = diets[Math.floor(Math.random() * diets.length)];
            state.traits.temperament = temperaments[Math.floor(Math.random() * temperaments.length)];
            state.traits.defense = defenses[Math.floor(Math.random() * defenses.length)];

            document.getElementById('bodyType').value = state.bodyType;
            
            document.querySelectorAll('.trait-btn').forEach(btn => {
                const trait = btn.dataset.trait;
                if (state.traits[trait] === btn.dataset.value) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });

            renderCard();
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            const stats = calculateStats();
            const name = generateCreatureName();
            const exportData = {
                name,
                bodyType: state.bodyType,
                traits: state.traits,
                stats,
                lore: generateLore(),
                exported: new Date().toISOString()
            };
            const json = JSON.stringify(exportData, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${name.replace(/\s+/g, '_').toLowerCase()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        });

        initializeUI();
    </script>
</body>
</html>
