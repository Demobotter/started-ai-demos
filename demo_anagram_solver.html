<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anagram Solver</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a1428;
            color: #e9ecef;
            font-family: 'Space Mono', monospace;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #ffd700;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #adb5bd;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .input-section {
            background: #1a2540;
            border: 2px solid #495057;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
            text-align: center;
        }
        .input-label {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            color: #60a5fa;
            margin-bottom: 12px;
            display: block;
        }
        .input-box {
            background: #0a1428;
            border: 2px solid #495057;
            border-radius: 8px;
            padding: 16px;
            color: #ffd700;
            font-family: 'Space Mono', monospace;
            font-size: 1.3rem;
            letter-spacing: 2px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 20px;
            text-align: center;
            text-transform: uppercase;
        }
        .input-box:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 8px rgba(96, 165, 250, 0.3);
        }
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            background: #0f4c81;
            border: 1px solid #60a5fa;
            color: #60a5fa;
            border-radius: 6px;
            padding: 10px 20px;
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background: #1a5fa0;
            border-color: #93c5fd;
            color: #93c5fd;
        }
        button.secondary {
            background: #1a2540;
            border-color: #495057;
            color: #adb5bd;
        }
        button.secondary:hover {
            background: #2a3a50;
            border-color: #6c757d;
            color: #e9ecef;
        }
        .results-section {
            background: #1a2540;
            border: 2px solid #495057;
            border-radius: 8px;
            padding: 25px;
        }
        .results-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: #60a5fa;
            margin-bottom: 20px;
            border-bottom: 2px solid #495057;
            padding-bottom: 12px;
        }
        .filter-bar {
            background: #0a1428;
            border: 1px solid #495057;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-label {
            font-size: 0.85rem;
            color: #adb5bd;
            font-weight: 700;
        }
        .filter-input {
            background: #1a2540;
            border: 1px solid #495057;
            border-radius: 4px;
            padding: 6px 10px;
            color: #e9ecef;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
        }
        .sort-btn {
            background: #1a2540;
            border: 1px solid #495057;
            color: #adb5bd;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 400;
        }
        .sort-btn.active {
            background: #0f4c81;
            border-color: #60a5fa;
            color: #60a5fa;
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }
        .result-card {
            background: #0a1428;
            border: 1px solid #495057;
            border-radius: 6px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .result-card:hover {
            background: #1a3a4a;
            border-color: #60a5fa;
        }
        .result-word {
            font-size: 1.1rem;
            font-weight: 700;
            color: #10b981;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .result-length {
            font-size: 0.75rem;
            color: #6c757d;
            margin-bottom: 4px;
        }
        .result-freq {
            font-size: 0.75rem;
            color: #adb5bd;
        }
        .no-results {
            background: #0a1428;
            border: 1px solid #495057;
            border-radius: 6px;
            padding: 20px;
            text-align: center;
            color: #6c757d;
        }
        .stats {
            background: #0a1428;
            border: 1px solid #495057;
            border-radius: 6px;
            padding: 12px;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #adb5bd;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .stat-row:last-child {
            margin-bottom: 0;
        }
        .stat-label {
            color: #6c757d;
        }
        .stat-value {
            color: #60a5fa;
            font-weight: 700;
        }
        @media (max-width: 600px) {
            .results-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔤 Anagram Solver</h1>
        <div class="subtitle">Unscramble letters to find hidden English words</div>

        <div class="input-section">
            <label class="input-label">Enter Letters</label>
            <input class="input-box" id="letterInput" placeholder="e.g., ENARTH" maxlength="12">
            <div class="button-group">
                <button onclick="solve()">Solve</button>
                <button class="secondary" onclick="clear()">Clear</button>
                <button class="secondary" onclick="loadExample()">Example</button>
            </div>
        </div>

        <div class="results-section">
            <div class="results-title">Results</div>

            <div class="filter-bar">
                <span class="filter-label">Filter by length:</span>
                <input class="filter-input" type="number" id="minLength" value="3" min="1" max="12" style="width: 60px;">
                <span style="color: #6c757d;">-</span>
                <input class="filter-input" type="number" id="maxLength" value="12" min="1" max="12" style="width: 60px;">
                <span class="filter-label" style="margin-left: 20px;">Sort by:</span>
                <button class="sort-btn active" onclick="setSort('length')" data-sort="length">Length</button>
                <button class="sort-btn" onclick="setSort('freq')" data-sort="freq">Frequency</button>
            </div>

            <div id="resultsContainer"></div>
            <div class="stats" id="stats" style="display: none;"></div>
        </div>
    </div>

    <script>
        // Common English words (sorted by frequency)
        const ENGLISH_WORDS = [
            'the', 'a', 'and', 'to', 'of', 'i', 'in', 'is', 'that', 'it',
            'for', 'you', 'with', 'he', 'this', 'but', 'his', 'by', 'from', 'they',
            'have', 'or', 'had', 'not', 'be', 'as', 'were', 'been', 'one', 'all',
            'we', 'her', 'can', 'their', 'said', 'was', 'would', 'your', 'which', 'them',
            'about', 'my', 'me', 'if', 'no', 'do', 'did', 'out', 'will', 'an',
            'so', 'on', 'up', 'get', 'go', 'got', 'has', 'how', 'into', 'now',
            'than', 'who', 'what', 'when', 'where', 'why', 'there', 'could', 'see', 'time',
            'may', 'make', 'made', 'then', 'some', 'more', 'such', 'know', 'take', 'come',
            'its', 'just', 'our', 'over', 'way', 'think', 'because', 'back', 'after', 'use',
            'work', 'first', 'well', 'even', 'new', 'want', 'any', 'these', 'give', 'day',
            'most', 'us', 'is', 'are', 'other', 'also', 'two', 'only', 'each', 'very',
            'good', 'much', 'same', 'here', 'show', 'find', 'tell', 'ask', 'right', 'help',
            'through', 'water', 'love', 'great', 'people', 'world', 'still', 'life', 'hand', 'year',
            'best', 'long', 'being', 'look', 'down', 'both', 'own', 'open', 'part', 'place',
            'little', 'should', 'every', 'under', 'never', 'always', 'thing', 'really', 'seems', 'feel',
            'leave', 'left', 'turn', 'away', 'tell', 'need', 'let', 'keep', 'mean', 'said',
            'seem', 'come', 'call', 'hear', 'say', 'read', 'write', 'give', 'watch', 'move',
            'earth', 'night', 'light', 'right', 'thought', 'found', 'knew', 'word', 'name', 'case',
            'young', 'old', 'high', 'low', 'big', 'small', 'last', 'next', 'early', 'late',
            'enter', 'heat', 'hate', 'rate', 'late', 'date', 'fate', 'gate', 'mate', 'note',
            'tune', 'dune', 'rune', 'tone', 'bone', 'zone', 'home', 'some', 'come', 'done',
            'gone', 'alone', 'stone', 'phone', 'clean', 'mean', 'bean', 'lean', 'wean', 'queen',
            'green', 'scene', 'teen', 'seen', 'hear', 'near', 'dear', 'fear', 'bear', 'wear',
            'year', 'clear', 'great', 'treat', 'eat', 'meat', 'beat', 'heat', 'seat', 'feet',
            'meet', 'sweet', 'sheet', 'sleep', 'keep', 'deep', 'weep', 'seep', 'steep', 'creep',
            'heart', 'smart', 'start', 'cart', 'part', 'dark', 'mark', 'park', 'bark', 'shark',
            'warm', 'harm', 'farm', 'form', 'born', 'corn', 'horn', 'worn', 'torn', 'turn',
            'burn', 'learn', 'earn', 'storm', 'warm', 'arm', 'charm', 'alarm', 'march', 'reach',
            'teach', 'beach', 'peach', 'each', 'coach', 'roach', 'search', 'church', 'month', 'worth',
            'north', 'forth', 'birth', 'earth', 'death', 'breath', 'thank', 'think', 'drink', 'wink',
            'link', 'sink', 'pink', 'ring', 'sing', 'wing', 'thing', 'bring', 'spring', 'string',
            'strong', 'wrong', 'long', 'song', 'young', 'hang', 'bang', 'gang', 'hand', 'land',
            'stand', 'sand', 'band', 'man', 'can', 'fan', 'van', 'plan', 'than', 'ran',
            'pan', 'span', 'walk', 'talk', 'ball', 'call', 'fall', 'hall', 'mall', 'wall',
            'small', 'all', 'tell', 'sell', 'bell', 'cell', 'well', 'dwell', 'spell', 'smell',
            'shell', 'skill', 'hill', 'fill', 'mill', 'will', 'kill', 'bill', 'pill', 'still',
            'pull', 'full', 'bull', 'dull', 'gull', 'hull', 'doll', 'poll', 'roll', 'toll',
            'soul', 'coal', 'goal', 'real', 'deal', 'heal', 'meal', 'seal', 'steal', 'steel',
            'heel', 'peel', 'wheel', 'field', 'shield', 'yield', 'wild', 'mild', 'child', 'build',
            'guild', 'fold', 'hold', 'cold', 'bold', 'gold', 'mold', 'old', 'sold', 'told',
            'pool', 'cool', 'fool', 'tool', 'school', 'moon', 'soon', 'noon', 'boon', 'spoon',
            'choose', 'goose', 'loose', 'moose', 'noose', 'house', 'mouse', 'louse', 'spouse', 'blouse',
            'cause', 'pause', 'clause', 'mouse', 'rose', 'nose', 'hose', 'lose', 'pose', 'close',
            'chose', 'those', 'whose', 'use', 'fuse', 'muse', 'ruse', 'abuse', 'accuse', 'amuse',
            'refuse', 'excuse', 'produce', 'reduce', 'deduce', 'induce', 'seduce', 'introduce', 'celebrate', 'educate',
            'animate', 'navigate', 'create', 'donate', 'rotate', 'locate', 'migrate', 'demonstrate', 'frustrate', 'illustrate'
        ];

        // Store results
        let allResults = [];
        let currentSort = 'length';
        let currentLetters = '';

        // Frequency map for common English words (approximate)
        const FREQ_MAP = {};
        ENGLISH_WORDS.forEach((word, i) => {
            FREQ_MAP[word] = ENGLISH_WORDS.length - i; // Higher index = more frequent
        });

        function sanitize(text) {
            return text.toUpperCase().replace(/[^A-Z]/g, '');
        }

        function canMakeWord(letters, word) {
            const letterCount = {};
            for (let char of letters) {
                letterCount[char] = (letterCount[char] || 0) + 1;
            }
            for (let char of word.toUpperCase()) {
                if (!letterCount[char]) return false;
                letterCount[char]--;
            }
            return true;
        }

        function solve() {
            const input = document.getElementById('letterInput').value;
            currentLetters = sanitize(input);

            if (currentLetters.length === 0) {
                alert('Please enter at least one letter.');
                return;
            }

            allResults = [];
            for (let word of ENGLISH_WORDS) {
                if (canMakeWord(currentLetters, word)) {
                    allResults.push({
                        word: word.toUpperCase(),
                        length: word.length,
                        freq: FREQ_MAP[word] || 0
                    });
                }
            }

            displayResults();
        }

        function displayResults() {
            const minLen = parseInt(document.getElementById('minLength').value) || 1;
            const maxLen = parseInt(document.getElementById('maxLength').value) || 12;

            let filtered = allResults.filter(r => r.length >= minLen && r.length <= maxLen);

            // Sort
            if (currentSort === 'length') {
                filtered.sort((a, b) => b.length - a.length);
            } else if (currentSort === 'freq') {
                filtered.sort((a, b) => b.freq - a.freq);
            }

            const container = document.getElementById('resultsContainer');
            const stats = document.getElementById('stats');

            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-results">No words found. Try different letters or adjust filters.</div>';
                stats.style.display = 'none';
                return;
            }

            let html = '<div class="results-grid">';
            for (let result of filtered) {
                html += `
                    <div class="result-card" onclick="copyWord('${result.word}')">
                        <div class="result-word">${result.word}</div>
                        <div class="result-length">${result.length} letters</div>
                        <div class="result-freq">click to copy</div>
                    </div>
                `;
            }
            html += '</div>';
            container.innerHTML = html;

            // Stats
            const byLength = {};
            filtered.forEach(r => {
                byLength[r.length] = (byLength[r.length] || 0) + 1;
            });
            const longest = Math.max(...filtered.map(r => r.length));

            stats.innerHTML = `
                <div class="stat-row">
                    <span class="stat-label">Input Letters:</span>
                    <span class="stat-value">${currentLetters}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Total Words Found:</span>
                    <span class="stat-value">${filtered.length}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Longest Word:</span>
                    <span class="stat-value">${longest} letters</span>
                </div>
            `;
            stats.style.display = 'block';
        }

        function setSort(type) {
            currentSort = type;
            document.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            displayResults();
        }

        function copyWord(word) {
            navigator.clipboard.writeText(word).then(() => {
                alert(`Copied: ${word}`);
            });
        }

        function clear() {
            document.getElementById('letterInput').value = '';
            document.getElementById('resultsContainer').innerHTML = '';
            document.getElementById('stats').style.display = 'none';
            allResults = [];
        }

        function loadExample() {
            document.getElementById('letterInput').value = 'ENARTH';
            setTimeout(solve, 100);
        }

        // Allow Enter key to solve
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.target.id === 'letterInput') {
                solve();
            }
        });
    </script>
</body>
</html>
