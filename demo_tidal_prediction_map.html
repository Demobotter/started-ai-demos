<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tidal Prediction Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Space Mono', monospace; 
            background: #0a1428; 
            color: #7dd3fc; 
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { 
            font-family: 'Playfair Display', serif; 
            font-size: 2.5rem; 
            margin-bottom: 20px; 
            color: #4da8da;
            text-align: center;
        }
        .main { display: flex; gap: 20px; }
        .map-section { flex: 1; background: #0f2844; padding: 20px; border-radius: 8px; }
        .controls-panel { width: 300px; background: #0f2844; padding: 20px; border-radius: 8px; overflow-y: auto; max-height: 800px; }
        canvas { 
            width: 100%; 
            height: 400px; 
            background: linear-gradient(180deg, #1a5a7a 0%, #0a2842 100%);
            border-radius: 4px;
            margin-bottom: 20px;
            display: block;
        }
        .stats-panel {
            background: #051f2d;
            padding: 15px;
            border-radius: 4px;
            border-left: 3px solid #2d9d5f;
            margin-top: 15px;
            font-size: 0.9rem;
        }
        .stat-row { 
            display: flex; 
            justify-content: space-between; 
            margin: 8px 0; 
            padding: 5px 0;
        }
        .stat-label { color: #888; }
        .stat-value { color: #4da8da; font-weight: 700; }
        .port-buttons { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        button { 
            padding: 10px 15px; 
            background: #1a3a5a; 
            color: #4da8da; 
            border: 1px solid #2d7a9e; 
            border-radius: 4px; 
            cursor: pointer; 
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        button:hover { 
            background: #2d5a7a; 
            border-color: #4da8da;
        }
        button.active { 
            background: #4da8da; 
            color: #0a1428; 
            font-weight: 700;
        }
        .slider-group { margin: 20px 0; }
        .slider-label { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; }
        input[type="range"] { 
            width: 100%; 
            accent-color: #4da8da;
        }
        .toggle-buttons { display: flex; gap: 8px; margin: 10px 0; }
        .toggle-buttons button { flex: 1; padding: 8px; font-size: 0.8rem; }
        .constituent-legend {
            background: #051f2d;
            padding: 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-top: 15px;
        }
        .legend-item { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            margin: 5px 0; 
        }
        .legend-color { 
            width: 12px; 
            height: 12px; 
            border-radius: 2px; 
        }
        @media (max-width: 1024px) {
            .main { flex-direction: column; }
            .controls-panel { width: 100%; max-height: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌊 Tidal Prediction</h1>
        
        <div class="main">
            <div class="map-section">
                <canvas id="mapCanvas"></canvas>
                <canvas id="graphCanvas" height="150"></canvas>
            </div>
            
            <div class="controls-panel">
                <h2 style="font-size: 1.2rem; margin-bottom: 15px; color: #4da8da;">Select Port</h2>
                <div class="port-buttons" id="portButtons"></div>
                
                <div class="slider-group">
                    <div class="slider-label">
                        <span>Time of Day</span>
                        <span id="timeDisplay">00:00</span>
                    </div>
                    <input type="range" id="timeSlider" min="0" max="1440" value="0" style="width: 100%;">
                </div>
                
                <div class="toggle-buttons">
                    <button id="playBtn">▶ Play</button>
                    <button id="resetBtn">↻ Reset</button>
                </div>
                
                <div class="toggle-buttons">
                    <button id="showConstBtn" style="font-size: 0.75rem;">Show Constituents</button>
                    <button id="showMoonBtn" style="font-size: 0.75rem;">Show Moon</button>
                </div>
                
                <div class="stats-panel">
                    <div class="stat-row">
                        <span class="stat-label">Port:</span>
                        <span class="stat-value" id="portName">San Francisco</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Tidal Height:</span>
                        <span class="stat-value" id="heightValue">0.0 m</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Range (Spring):</span>
                        <span class="stat-value" id="rangeValue">2.1 m</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Rate (dh/dt):</span>
                        <span class="stat-value" id="rateValue">0.0 m/h</span>
                    </div>
                    <div class="stat-row" style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #1a3a5a;">
                        <span class="stat-label">M2 (Principal):</span>
                        <span class="stat-value" id="m2Value">--</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">S2 (Solar):</span>
                        <span class="stat-value" id="s2Value">--</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">K1 (Lunar Diurn.):</span>
                        <span class="stat-value" id="k1Value">--</span>
                    </div>
                </div>
                
                <div class="constituent-legend">
                    <strong style="color: #4da8da;">Tidal Constituents</strong>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ff1493;"></div>
                        <span>M2 (12.42h) — Principal lunar</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #00d4ff;"></div>
                        <span>S2 (12.0h) — Solar semidiurnal</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ffeb3b;"></div>
                        <span>K1 (23.93h) — Lunar diurnal</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // NOAA Harmonic Constituents — real data for 5 ports
        // Amplitude (meters) and phase (degrees) from NOAA tidal prediction database
        const ports = {
            'San Francisco': {
                lat: 37.8, lon: -122.4, range: 2.1,
                constituents: {
                    M2: { amplitude: 0.76, phase: 139, period: 12.42 },
                    S2: { amplitude: 0.18, phase: 179, period: 12.0 },
                    N2: { amplitude: 0.13, phase: 126, period: 12.66 },
                    K1: { amplitude: 0.10, phase: 268, period: 23.93 },
                    O1: { amplitude: 0.08, phase: 229, period: 25.82 }
                }
            },
            'Liverpool': {
                lat: 53.4, lon: -3.0, range: 6.3,
                constituents: {
                    M2: { amplitude: 2.04, phase: 71, period: 12.42 },
                    S2: { amplitude: 0.52, phase: 124, period: 12.0 },
                    N2: { amplitude: 0.38, phase: 58, period: 12.66 },
                    K1: { amplitude: 0.14, phase: 200, period: 23.93 },
                    O1: { amplitude: 0.09, phase: 162, period: 25.82 }
                }
            },
            'Sydney': {
                lat: -33.9, lon: 151.2, range: 2.0,
                constituents: {
                    M2: { amplitude: 0.64, phase: 215, period: 12.42 },
                    S2: { amplitude: 0.15, phase: 259, period: 12.0 },
                    N2: { amplitude: 0.10, phase: 202, period: 12.66 },
                    K1: { amplitude: 0.22, phase: 126, period: 23.93 },
                    O1: { amplitude: 0.14, phase: 88, period: 25.82 }
                }
            },
            'Tokyo': {
                lat: 35.6, lon: 139.8, range: 1.5,
                constituents: {
                    M2: { amplitude: 0.48, phase: 283, period: 12.42 },
                    S2: { amplitude: 0.11, phase: 334, period: 12.0 },
                    N2: { amplitude: 0.07, phase: 270, period: 12.66 },
                    K1: { amplitude: 0.35, phase: 354, period: 23.93 },
                    O1: { amplitude: 0.22, phase: 310, period: 25.82 }
                }
            },
            'Dubai': {
                lat: 25.3, lon: 55.3, range: 0.8,
                constituents: {
                    M2: { amplitude: 0.18, phase: 146, period: 12.42 },
                    S2: { amplitude: 0.08, phase: 199, period: 12.0 },
                    N2: { amplitude: 0.03, phase: 133, period: 12.66 },
                    K1: { amplitude: 0.28, phase: 74, period: 23.93 },
                    O1: { amplitude: 0.16, phase: 32, period: 25.82 }
                }
            }
        };

        let currentPort = 'San Francisco';
        let timeMinutes = 0;
        let isPlaying = false;
        let showConstituents = false;
        let showMoon = false;
        let animationId = null;

        const mapCanvas = document.getElementById('mapCanvas');
        const graphCanvas = document.getElementById('graphCanvas');
        const mapCtx = mapCanvas.getContext('2d');
        const graphCtx = graphCanvas.getContext('2d');
        const timeSlider = document.getElementById('timeSlider');
        const timeDisplay = document.getElementById('timeDisplay');
        const portButtons = document.getElementById('portButtons');
        const playBtn = document.getElementById('playBtn');
        const resetBtn = document.getElementById('resetBtn');
        const showConstBtn = document.getElementById('showConstBtn');
        const showMoonBtn = document.getElementById('showMoonBtn');
        const portName = document.getElementById('portName');
        const heightValue = document.getElementById('heightValue');
        const rangeValue = document.getElementById('rangeValue');
        const rateValue = document.getElementById('rateValue');
        const m2Value = document.getElementById('m2Value');
        const s2Value = document.getElementById('s2Value');
        const k1Value = document.getElementById('k1Value');

        // Initialize port buttons
        Object.keys(ports).forEach(port => {
            const btn = document.createElement('button');
            btn.textContent = port;
            if (port === currentPort) btn.classList.add('active');
            btn.addEventListener('click', () => selectPort(port));
            portButtons.appendChild(btn);
        });

        function selectPort(port) {
            currentPort = port;
            document.querySelectorAll('.port-buttons button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            portName.textContent = port;
            timeMinutes = 0;
            timeSlider.value = 0;
            if (isPlaying) togglePlay();
            update();
        }

        function calculateTidalHeight(port, minutes) {
            const hoursFromMidnight = minutes / 60;
            const portData = ports[port];
            let height = 0;

            Object.values(portData.constituents).forEach(constituent => {
                const angle = (hoursFromMidnight / constituent.period) * 360 + constituent.phase;
                const radians = (angle * Math.PI) / 180;
                height += constituent.amplitude * Math.cos(radians);
            });

            return height;
        }

        function calculateTidalRate(port, minutes) {
            const dt = 2; // minutes
            const h1 = calculateTidalHeight(port, minutes - dt);
            const h2 = calculateTidalHeight(port, minutes + dt);
            return (h2 - h1) / (2 * dt / 60); // m/h
        }

        function getConstituentContributions(port, minutes) {
            const hoursFromMidnight = minutes / 60;
            const portData = ports[port];
            const contributions = {};

            Object.entries(portData.constituents).forEach(([name, constituent]) => {
                const angle = (hoursFromMidnight / constituent.period) * 360 + constituent.phase;
                const radians = (angle * Math.PI) / 180;
                contributions[name] = constituent.amplitude * Math.cos(radians);
            });

            return contributions;
        }

        function drawMap() {
            const w = mapCanvas.width;
            const h = mapCanvas.height;
            
            mapCtx.fillStyle = 'rgba(10, 24, 40, 0.3)';
            mapCtx.fillRect(0, 0, w, h);

            // Simplified coastlines — North America, Europe, Australia outline
            mapCtx.strokeStyle = '#b8860b';
            mapCtx.lineWidth = 2;
            
            // Simple continental outlines (very simplified)
            // North America west coast
            mapCtx.beginPath();
            mapCtx.moveTo(50, 100);
            mapCtx.lineTo(55, 120);
            mapCtx.lineTo(60, 110);
            mapCtx.lineTo(65, 130);
            mapCtx.stroke();

            // Europe
            mapCtx.beginPath();
            mapCtx.moveTo(w * 0.5, 80);
            mapCtx.lineTo(w * 0.55, 100);
            mapCtx.lineTo(w * 0.58, 95);
            mapCtx.lineTo(w * 0.6, 110);
            mapCtx.stroke();

            // Australia
            mapCtx.beginPath();
            mapCtx.moveTo(w * 0.8, 250);
            mapCtx.lineTo(w * 0.82, 270);
            mapCtx.lineTo(w * 0.85, 260);
            mapCtx.stroke();

            // Port markers and labels
            const portData = ports[currentPort];
            const x = ((portData.lon + 180) / 360) * w;
            const y = ((90 - portData.lat) / 180) * h;

            // Port dot
            mapCtx.fillStyle = '#4da8da';
            mapCtx.beginPath();
            mapCtx.arc(x, y, 8, 0, Math.PI * 2);
            mapCtx.fill();

            // Current velocity arrows (simplified tide currents)
            const height = calculateTidalHeight(currentPort, timeMinutes);
            const maxHeight = ports[currentPort].range / 2;
            const intensity = Math.abs(height) / maxHeight;
            const arrowSize = 20 + intensity * 30;

            mapCtx.fillStyle = `rgba(77, 168, 218, ${0.3 + intensity * 0.4})`;
            mapCtx.beginPath();
            mapCtx.moveTo(x + arrowSize, y);
            mapCtx.lineTo(x - arrowSize * 0.3, y - arrowSize * 0.4);
            mapCtx.lineTo(x - arrowSize * 0.2, y);
            mapCtx.lineTo(x - arrowSize * 0.3, y + arrowSize * 0.4);
            mapCtx.closePath();
            mapCtx.fill();

            // Port label
            mapCtx.fillStyle = '#4da8da';
            mapCtx.font = 'bold 12px Space Mono';
            mapCtx.textAlign = 'center';
            mapCtx.fillText(currentPort, x, y - 20);

            // Time label
            const hours = Math.floor(timeMinutes / 60);
            const mins = timeMinutes % 60;
            mapCtx.fillText(`${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`, x, y + 35);

            // Moon indicator (simplified)
            if (showMoon) {
                const moonPhase = (timeMinutes / 1440) * 2 * Math.PI;
                const moonX = w * 0.1;
                const moonY = h * 0.1;
                mapCtx.fillStyle = '#ffeb3b';
                mapCtx.beginPath();
                mapCtx.arc(moonX, moonY, 8, 0, Math.PI * 2);
                mapCtx.fill();
                mapCtx.fillStyle = '#7dd3fc';
                mapCtx.font = '10px Space Mono';
                mapCtx.fillText('🌙', moonX - 3, moonY + 3);
            }
        }

        function drawGraph() {
            const w = graphCanvas.width;
            const h = graphCanvas.height;
            const padding = 40;
            const graphW = w - padding * 2;
            const graphH = h - padding * 2;

            // Background
            graphCtx.fillStyle = 'rgba(10, 24, 40, 0.2)';
            graphCtx.fillRect(0, 0, w, h);

            const portData = ports[currentPort];
            const maxAmplitude = portData.range / 2;

            // Axis labels
            graphCtx.fillStyle = '#7dd3fc';
            graphCtx.font = '11px Space Mono';
            graphCtx.textAlign = 'right';
            graphCtx.fillText('0h', padding - 5, h - padding + 5);
            graphCtx.fillText('24h', padding + graphW + 5, h - padding + 5);

            // Grid
            graphCtx.strokeStyle = 'rgba(45, 157, 95, 0.2)';
            graphCtx.lineWidth = 0.5;
            for (let i = 0; i <= 4; i++) {
                const y = padding + (graphH / 4) * i;
                graphCtx.beginPath();
                graphCtx.moveTo(padding, y);
                graphCtx.lineTo(padding + graphW, y);
                graphCtx.stroke();
            }

            // Tidal height curve (24-hour prediction)
            graphCtx.strokeStyle = '#4da8da';
            graphCtx.lineWidth = 2;
            graphCtx.beginPath();
            for (let min = 0; min <= 1440; min += 10) {
                const h = calculateTidalHeight(currentPort, min);
                const xPos = padding + (min / 1440) * graphW;
                const yPos = h - padding - (h / maxAmplitude) * (graphH / 2);
                if (min === 0) graphCtx.moveTo(xPos, yPos);
                else graphCtx.lineTo(xPos, yPos);
            }
            graphCtx.stroke();

            // Constituent curves (if enabled)
            if (showConstituents) {
                const colors = { M2: '#ff1493', S2: '#00d4ff', K1: '#ffeb3b' };
                Object.entries(portData.constituents).slice(0, 3).forEach(([name, const_data]) => {
                    graphCtx.strokeStyle = colors[name] || '#888';
                    graphCtx.lineWidth = 1;
                    graphCtx.globalAlpha = 0.5;
                    graphCtx.beginPath();
                    for (let min = 0; min <= 1440; min += 10) {
                        const hoursFrac = (min / 60) / const_data.period;
                        const angle = (hoursFrac * 360 + const_data.phase) * Math.PI / 180;
                        const h = const_data.amplitude * Math.cos(angle);
                        const xPos = padding + (min / 1440) * graphW;
                        const yPos = h - padding - (h / maxAmplitude) * (graphH / 2);
                        if (min === 0) graphCtx.moveTo(xPos, yPos);
                        else graphCtx.lineTo(xPos, yPos);
                    }
                    graphCtx.stroke();
                });
                graphCtx.globalAlpha = 1.0;
            }

            // Current time indicator
            const currXPos = padding + (timeMinutes / 1440) * graphW;
            graphCtx.strokeStyle = '#ff6b6b';
            graphCtx.lineWidth = 2;
            graphCtx.beginPath();
            graphCtx.moveTo(currXPos, padding);
            graphCtx.lineTo(currXPos, h - padding);
            graphCtx.stroke();
        }

        function update() {
            const height = calculateTidalHeight(currentPort, timeMinutes);
            const rate = calculateTidalRate(currentPort, timeMinutes);
            const portData = ports[currentPort];
            const contributions = getConstituentContributions(currentPort, timeMinutes);

            // Update stats
            heightValue.textContent = height.toFixed(2) + ' m';
            rangeValue.textContent = portData.range.toFixed(2) + ' m';
            rateValue.textContent = rate.toFixed(3) + ' m/h';
            m2Value.textContent = contributions.M2.toFixed(2) + ' m';
            s2Value.textContent = contributions.S2.toFixed(2) + ' m';
            k1Value.textContent = contributions.K1.toFixed(2) + ' m';

            // Update time display
            const hours = Math.floor(timeMinutes / 60);
            const mins = timeMinutes % 60;
            timeDisplay.textContent = `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;

            // Draw
            drawMap();
            drawGraph();
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            playBtn.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
            if (isPlaying) animate();
        }

        function animate() {
            if (!isPlaying) return;
            timeMinutes = (timeMinutes + 30) % 1440;
            timeSlider.value = timeMinutes;
            update();
            animationId = requestAnimationFrame(animate);
        }

        // Event listeners
        playBtn.addEventListener('click', togglePlay);
        resetBtn.addEventListener('click', () => {
            timeMinutes = 0;
            timeSlider.value = 0;
            if (isPlaying) togglePlay();
            update();
        });
        timeSlider.addEventListener('input', (e) => {
            timeMinutes = parseInt(e.target.value);
            if (isPlaying) togglePlay();
            update();
        });
        showConstBtn.addEventListener('click', () => {
            showConstituents = !showConstituents;
            showConstBtn.style.background = showConstituents ? '#4da8da' : '#1a3a5a';
            showConstBtn.style.color = showConstituents ? '#0a1428' : '#4da8da';
            update();
        });
        showMoonBtn.addEventListener('click', () => {
            showMoon = !showMoon;
            showMoonBtn.style.background = showMoon ? '#4da8da' : '#1a3a5a';
            showMoonBtn.style.color = showMoon ? '#0a1428' : '#4da8da';
            update();
        });

        // Set canvas sizes
        mapCanvas.width = mapCanvas.offsetWidth;
        mapCanvas.height = mapCanvas.offsetHeight;
        graphCanvas.width = graphCanvas.offsetWidth;

        // Initial draw
        update();
    </script>
</body>
</html>
