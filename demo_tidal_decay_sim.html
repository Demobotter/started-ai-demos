<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tidal Decay Sim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #0d1b3a 100%);
      color: #e0e7ff;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 12px;
      padding: 24px;
      border: 1px solid rgba(0, 128, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      margin-bottom: 8px;
      color: #00d9ff;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #020812;
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 255, 0.15);
      margin-bottom: 24px;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      font-size: 12px;
      font-weight: 500;
      color: #aae6ff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="range"] {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(0, 128, 255, 0.2);
      outline: none;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #00d9ff;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0, 217, 255, 0.6);
    }
    input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #00d9ff;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 8px rgba(0, 217, 255, 0.6);
    }
    .value-display {
      font-size: 11px;
      color: #ffb700;
      font-family: 'Courier New', monospace;
    }
    .buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-family: 'Syne', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .play-btn {
      background: linear-gradient(135deg, #00d9ff 0%, #0080ff 100%);
      color: #000;
      flex: 1;
    }
    .play-btn:hover {
      box-shadow: 0 0 16px rgba(0, 217, 255, 0.5);
      transform: translateY(-2px);
    }
    .reset-btn {
      background: rgba(255, 107, 0, 0.2);
      color: #ffb700;
      border: 1px solid rgba(255, 107, 0, 0.4);
      flex: 1;
    }
    .reset-btn:hover {
      background: rgba(255, 107, 0, 0.3);
      border-color: rgba(255, 107, 0, 0.6);
    }
    .info-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .info-box {
      background: rgba(0, 128, 255, 0.1);
      border: 1px solid rgba(0, 128, 255, 0.3);
      border-radius: 6px;
      padding: 12px;
    }
    .info-label {
      font-size: 10px;
      text-transform: uppercase;
      color: #666;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .info-value {
      font-size: 14px;
      font-family: 'Courier New', monospace;
      font-weight: 600;
      color: #00ffaa;
    }
    .warning {
      background: rgba(255, 107, 0, 0.1);
      border-left: 3px solid #ff6b00;
      padding: 12px;
      border-radius: 4px;
      font-size: 12px;
      color: #ffb700;
      margin-bottom: 12px;
    }
    .preset-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .preset-btn {
      padding: 8px;
      background: rgba(255, 107, 0, 0.15);
      border: 1px solid rgba(255, 107, 0, 0.3);
      color: #ffb700;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .preset-btn:hover {
      background: rgba(255, 107, 0, 0.3);
      border-color: rgba(255, 107, 0, 0.6);
    }
    @media (max-width: 600px) {
      .container { padding: 16px; }
      h1 { font-size: 22px; }
      .controls { grid-template-columns: 1fr; }
      .preset-buttons { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛰️ Tidal Decay</h1>
    <p class="subtitle">Two-body orbital decay with Roche limit</p>

    <div class="canvas-wrapper">
      <canvas id="canvas"></canvas>
    </div>

    <div class="warning" id="warningBox" style="display: none;">
      ⚠️ Secondary approaching Roche limit — tidal forces exceed self-gravity
    </div>

    <div class="controls">
      <div class="control-group">
        <label>Mass Ratio (m₂/m₁)</label>
        <input type="range" id="massRatio" min="0.05" max="0.5" step="0.05" value="0.1">
        <span class="value-display" id="massRatioVal">0.10</span>
      </div>
      <div class="control-group">
        <label>Initial Eccentricity</label>
        <input type="range" id="eccentricity" min="0" max="0.8" step="0.05" value="0.1">
        <span class="value-display" id="eccentricityVal">0.10</span>
      </div>
      <div class="control-group">
        <label>Orbital Separation (a/a₀)</label>
        <input type="range" id="separation" min="1.5" max="3.0" step="0.1" value="2.0">
        <span class="value-display" id="separationVal">2.00</span>
      </div>
      <div class="control-group">
        <label>Simulation Speed</label>
        <input type="range" id="simSpeed" min="0.5" max="2.0" step="0.1" value="1.0">
        <span class="value-display" id="simSpeedVal">1.0x</span>
      </div>
    </div>

    <div class="preset-buttons">
      <button class="preset-btn" onclick="loadPreset('stable')">Stable Orbit</button>
      <button class="preset-btn" onclick="loadPreset('near')">Near Roche</button>
      <button class="preset-btn" onclick="loadPreset('decay')">Rapid Decay</button>
    </div>

    <div class="buttons">
      <button class="play-btn" id="playBtn" onclick="toggleSimulation()">▶ Start</button>
      <button class="reset-btn" onclick="resetSimulation()">⟲ Reset</button>
    </div>

    <div class="info-panel">
      <div class="info-box">
        <div class="info-label">Separation</div>
        <div class="info-value" id="infoDist">0.00 a₀</div>
      </div>
      <div class="info-box">
        <div class="info-label">Orbital Period</div>
        <div class="info-value" id="infoPeriod">0.00 years</div>
      </div>
      <div class="info-box">
        <div class="info-label">Energy (E/E₀)</div>
        <div class="info-value" id="infoEnergy">0.000</div>
      </div>
      <div class="info-box">
        <div class="info-label">Roche Limit</div>
        <div class="info-value" id="infoRoche">0.00 a₀</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const playBtn = document.getElementById('playBtn');
    const warningBox = document.getElementById('warningBox');

    // Constants
    const G = 1.0; // Normalized gravitational constant
    const AU = 100; // Pixels per AU (display scale)

    class TidalDecaySimulation {
      constructor() {
        this.reset();
      }

      reset() {
        this.time = 0;
        this.isRunning = false;

        // Get parameters
        const massRatio = parseFloat(document.getElementById('massRatio').value);
        const ecc = parseFloat(document.getElementById('eccentricity').value);
        const sep = parseFloat(document.getElementById('separation').value);

        // Primary body (star)
        this.m1 = 1.0;
        // Secondary body (moon)
        this.m2 = massRatio * this.m1;

        // Orbital parameters
        this.a0 = sep; // Semi-major axis (normalized)
        this.e = ecc; // Eccentricity

        // Roche limit for rigid body: a_roche ≈ 2.46 * (ρ1/ρ2)^(1/3) * R1
        // Simplified: a_roche ≈ 2.46 * (1.0 / 0.5)^(1/3) * 0.1 ≈ 0.35
        this.a_roche = 2.46 * Math.pow(1.0 / 0.5, 1/3) * 0.1;

        // Initial conditions (circular orbit approximation)
        this.r1 = { x: 0, y: 0 }; // Primary at origin
        this.v1 = { x: 0, y: 0 };

        // Secondary on circular orbit (will add eccentricity)
        const r2_dist = this.a0 * (1 - this.e);
        this.r2 = { x: r2_dist, y: 0 };
        // Orbital velocity (vis-viva for ellipse at perihelion)
        const v_orb = Math.sqrt(G * (this.m1 + this.m2) / this.a0 * (1 + this.e) / (1 - this.e));
        this.v2 = { x: 0, y: v_orb };

        // Separation history
        this.history = [];
        this.energyHistory = [];
        this.computeEnergy();
      }

      computeEnergy() {
        const dx = this.r2.x - this.r1.x;
        const dy = this.r2.y - this.r1.y;
        const r = Math.sqrt(dx * dx + dy * dy);

        const ke1 = 0.5 * this.m1 * (this.v1.x ** 2 + this.v1.y ** 2);
        const ke2 = 0.5 * this.m2 * (this.v2.x ** 2 + this.v2.y ** 2);
        const pe = -G * this.m1 * this.m2 / r;

        this.totalEnergy = ke1 + ke2 + pe;
        this.initialEnergy = this.totalEnergy;
        this.separation = r;
      }

      step(dt) {
        // Velocity Verlet integration with tidal dissipation
        const dx = this.r2.x - this.r1.x;
        const dy = this.r2.y - this.r1.y;
        const r = Math.sqrt(dx * dx + dy * dy);
        const r3 = r * r * r;

        // Gravitational force
        const fx = -G * this.m1 * this.m2 * dx / r3;
        const fy = -G * this.m1 * this.m2 * dy / r3;

        const a1x = fx / this.m1;
        const a1y = fy / this.m1;
        const a2x = -fx / this.m2;
        const a2y = -fy / this.m2;

        // Tidal dissipation: reduce orbital energy slightly
        const dissipationFactor = 0.99995;

        // Update velocities and positions
        this.v1.x = (this.v1.x + a1x * dt) * dissipationFactor;
        this.v1.y = (this.v1.y + a1y * dt) * dissipationFactor;
        this.r1.x += this.v1.x * dt;
        this.r1.y += this.v1.y * dt;

        this.v2.x = (this.v2.x + a2x * dt) * dissipationFactor;
        this.v2.y = (this.v2.y + a2y * dt) * dissipationFactor;
        this.r2.x += this.v2.x * dt;
        this.r2.y += this.v2.y * dt;

        // Update energy
        this.computeEnergy();

        // Record history
        if (this.history.length === 0 || this.history[this.history.length - 1].separation !== this.separation) {
          this.history.push({ time: this.time, separation: this.separation });
          this.energyHistory.push({ time: this.time, energy: this.totalEnergy });
        }

        // Cap history
        if (this.history.length > 300) {
          this.history.shift();
          this.energyHistory.shift();
        }

        this.time += dt;

        // Stop if collision
        if (this.separation < 0.15) {
          this.isRunning = false;
          return true;
        }

        return false;
      }

      draw(ctx, width, height) {
        const centerX = width / 2;
        const centerY = height / 2;

        // Draw grid
        ctx.strokeStyle = 'rgba(0, 128, 255, 0.1)';
        ctx.lineWidth = 1;
        for (let i = 0; i <= 5; i++) {
          const x = centerX + (i - 2.5) * 50;
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();

          const y = centerY + (i - 2.5) * 50;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }

        // Draw Roche limit as dashed circle
        ctx.strokeStyle = 'rgba(255, 107, 0, 0.5)';
        ctx.setLineDash([5, 5]);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(centerX, centerY, this.a_roche * AU, 0, 2 * Math.PI);
        ctx.stroke();
        ctx.setLineDash([]);

        // Draw primary body
        ctx.fillStyle = '#ffff00';
        ctx.beginPath();
        ctx.arc(centerX + this.r1.x * AU, centerY + this.r1.y * AU, 8, 0, 2 * Math.PI);
        ctx.fill();
        ctx.strokeStyle = '#ffb700';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Draw secondary body
        const secondaryDist = Math.sqrt((this.r2.x - this.r1.x) ** 2 + (this.r2.y - this.r1.y) ** 2);
        const tidalHeating = Math.min(10, Math.max(3, 12 - secondaryDist * 2));
        ctx.fillStyle = `hsl(180, 100%, ${Math.max(30, 60 - secondaryDist * 10)}%)`;
        ctx.beginPath();
        ctx.arc(centerX + this.r2.x * AU, centerY + this.r2.y * AU, tidalHeating, 0, 2 * Math.PI);
        ctx.fill();
        ctx.strokeStyle = '#00ffaa';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Draw tidal bulge indicator
        if (secondaryDist < 1.5) {
          const bulgeAngle = Math.atan2(this.r2.y - this.r1.y, this.r2.x - this.r1.x);
          const bulgeRadius = 5 + secondaryDist * 3;
          ctx.fillStyle = 'rgba(255, 107, 0, 0.4)';
          ctx.beginPath();
          ctx.arc(centerX + this.r1.x * AU + Math.cos(bulgeAngle) * bulgeRadius, 
                  centerY + this.r1.y * AU + Math.sin(bulgeAngle) * bulgeRadius, 
                  5, 0, 2 * Math.PI);
          ctx.fill();
        }

        // Draw separation line
        ctx.strokeStyle = 'rgba(0, 217, 255, 0.3)';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(centerX + this.r1.x * AU, centerY + this.r1.y * AU);
        ctx.lineTo(centerX + this.r2.x * AU, centerY + this.r2.y * AU);
        ctx.stroke();
        ctx.setLineDash([]);

        // Draw orbit trail (last 100 steps)
        if (this.history.length > 1) {
          ctx.strokeStyle = 'rgba(0, 217, 255, 0.2)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          const startIdx = Math.max(0, this.history.length - 100);
          for (let i = startIdx; i < this.history.length; i++) {
            const sep = this.history[i].separation;
            const angle = (i / this.history.length) * Math.PI * 2;
            if (i === startIdx) {
              ctx.moveTo(centerX + Math.cos(angle) * sep * AU, centerY + Math.sin(angle) * sep * AU);
            } else {
              ctx.lineTo(centerX + Math.cos(angle) * sep * AU, centerY + Math.sin(angle) * sep * AU);
            }
          }
          ctx.stroke();
        }

        // Draw status text
        ctx.fillStyle = '#aae6ff';
        ctx.font = '11px Inter';
        ctx.textAlign = 'left';
        ctx.fillText(`Time: ${(this.time * 10).toFixed(1)} years`, 10, height - 10);
        ctx.fillText(`Sep: ${(this.separation).toFixed(3)} a₀`, 10, height - 25);
      }

      getOrbitalPeriod() {
        // Kepler's 3rd law: P² ∝ a³
        return 2 * Math.PI * Math.sqrt(this.a0 ** 3 / (G * (this.m1 + this.m2)));
      }
    }

    let sim = new TidalDecaySimulation();
    let animationId = null;

    function resizeCanvas() {
      const wrapper = document.querySelector('.canvas-wrapper');
      canvas.width = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;
    }

    function toggleSimulation() {
      sim.isRunning = !sim.isRunning;
      playBtn.textContent = sim.isRunning ? '⏸ Pause' : '▶ Start';
      if (sim.isRunning) animate();
    }

    function resetSimulation() {
      sim = new TidalDecaySimulation();
      playBtn.textContent = '▶ Start';
      sim.isRunning = false;
      warningBox.style.display = 'none';
      draw();
    }

    function loadPreset(preset) {
      document.getElementById('massRatio').value = preset === 'stable' ? 0.1 : preset === 'near' ? 0.15 : 0.2;
      document.getElementById('eccentricity').value = preset === 'stable' ? 0.05 : preset === 'near' ? 0.2 : 0.4;
      document.getElementById('separation').value = preset === 'stable' ? 2.5 : preset === 'near' ? 1.7 : 1.5;
      
      document.getElementById('massRatioVal').textContent = document.getElementById('massRatio').value;
      document.getElementById('eccentricityVal').textContent = document.getElementById('eccentricity').value;
      document.getElementById('separationVal').textContent = document.getElementById('separation').value;
      
      resetSimulation();
    }

    function updateControls() {
      const mr = document.getElementById('massRatio').value;
      const ec = document.getElementById('eccentricity').value;
      const sep = document.getElementById('separation').value;
      const speed = document.getElementById('simSpeed').value;

      document.getElementById('massRatioVal').textContent = parseFloat(mr).toFixed(2);
      document.getElementById('eccentricityVal').textContent = parseFloat(ec).toFixed(2);
      document.getElementById('separationVal').textContent = parseFloat(sep).toFixed(2);
      document.getElementById('simSpeedVal').textContent = parseFloat(speed).toFixed(1) + 'x';

      if (!sim.isRunning) {
        sim = new TidalDecaySimulation();
        draw();
      }
    }

    function updateInfoPanel() {
      const period = sim.getOrbitalPeriod();
      const energyRatio = sim.totalEnergy / sim.initialEnergy;

      document.getElementById('infoDist').textContent = sim.separation.toFixed(3) + ' a₀';
      document.getElementById('infoPeriod').textContent = period.toFixed(2) + ' years';
      document.getElementById('infoEnergy').textContent = energyRatio.toFixed(3);
      document.getElementById('infoRoche').textContent = sim.a_roche.toFixed(3) + ' a₀';

      const approachingRoche = sim.separation < sim.a_roche * 1.2;
      warningBox.style.display = approachingRoche ? 'block' : 'none';
    }

    function draw() {
      ctx.fillStyle = '#020812';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      sim.draw(ctx, canvas.width, canvas.height);
      updateInfoPanel();
    }

    function animate() {
      if (sim.isRunning) {
        const dt = 0.01 * parseFloat(document.getElementById('simSpeed').value);
        const collided = sim.step(dt);
        
        if (collided) {
          playBtn.textContent = '▶ Start';
        }
      }

      draw();

      if (sim.isRunning) {
        animationId = requestAnimationFrame(animate);
      }
    }

    // Event listeners
    document.getElementById('massRatio').addEventListener('input', updateControls);
    document.getElementById('eccentricity').addEventListener('input', updateControls);
    document.getElementById('separation').addEventListener('input', updateControls);
    document.getElementById('simSpeed').addEventListener('input', updateControls);

    window.addEventListener('resize', resizeCanvas);

    // Initialize
    resizeCanvas();
    draw();
  </script>
</body>
</html>
