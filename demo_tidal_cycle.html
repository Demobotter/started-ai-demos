<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tidal Cycle</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #0d1b3d 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(13, 27, 61, 0.6);
            border: 1px solid #00d9ff;
            border-radius: 12px;
            padding: 40px;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.2em;
            margin-bottom: 10px;
            color: #00d9ff;
        }
        .subtitle {
            font-size: 0.85em;
            color: #00d9ff;
            margin-bottom: 30px;
            opacity: 0.8;
        }
        .input-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            font-size: 0.9em;
            font-weight: 600;
            color: #00d9ff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="date"], input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #1e90ff;
            border-radius: 6px;
            background: rgba(10, 14, 39, 0.8);
            color: #fff;
            font-size: 1em;
            font-family: 'Inter', sans-serif;
        }
        input[type="date"]:focus, input[type="text"]:focus {
            outline: none;
            border-color: #00d9ff;
            box-shadow: 0 0 8px rgba(0, 217, 255, 0.4);
        }
        .timezone-select {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 25px;
        }
        button {
            padding: 10px 15px;
            border: 1px solid #1e90ff;
            border-radius: 6px;
            background: rgba(30, 144, 255, 0.3);
            color: #00d9ff;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button:hover {
            background: rgba(0, 217, 255, 0.3);
            border-color: #00d9ff;
        }
        button.active {
            background: rgba(0, 217, 255, 0.6);
            border-color: #00d9ff;
        }
        .output-section {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid rgba(0, 217, 255, 0.3);
        }
        .lunar-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-box {
            background: rgba(30, 144, 255, 0.15);
            border: 1px solid #1e90ff;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .stat-label {
            font-size: 0.8em;
            color: #00d9ff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            opacity: 0.9;
        }
        .stat-value {
            font-family: 'Syne', sans-serif;
            font-size: 1.6em;
            color: #00ffff;
            font-weight: 700;
        }
        .emoji-large {
            font-size: 2.5em;
            margin: 10px 0;
        }
        .tide-type {
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            margin-bottom: 20px;
            font-size: 0.95em;
        }
        .tide-type.spring {
            background: rgba(0, 255, 153, 0.2);
            border: 1px solid #00ff99;
            color: #00ff99;
        }
        .tide-type.neap {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
        }
        .tide-curve {
            margin: 25px 0;
            text-align: center;
        }
        canvas {
            width: 100%;
            max-width: 600px;
            height: auto;
            border: 1px solid #1e90ff;
            border-radius: 8px;
            background: rgba(10, 14, 39, 0.8);
        }
        .tide-times {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .tide-event {
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid #00d9ff;
            border-radius: 6px;
            padding: 12px;
        }
        .tide-event-type {
            font-size: 0.75em;
            color: #00d9ff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
            opacity: 0.8;
        }
        .tide-event-time {
            font-family: 'Syne', sans-serif;
            font-size: 1.1em;
            color: #00ffff;
            margin-bottom: 4px;
        }
        .tide-event-height {
            font-size: 0.85em;
            color: #fff;
            opacity: 0.8;
        }
        .error {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            border-radius: 6px;
            padding: 12px;
            color: #ff9999;
            margin-top: 15px;
        }
        @media (max-width: 600px) {
            .container { padding: 25px; }
            h1 { font-size: 1.8em; }
            .timezone-select { grid-template-columns: 1fr; }
            .lunar-info { grid-template-columns: 1fr; }
            .tide-times { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌊 Tidal Cycle</h1>
        <p class="subtitle">Real lunar phase & 24-hour tide predictions</p>

        <div class="input-group">
            <label>Date</label>
            <input type="date" id="dateInput">
        </div>

        <div>
            <label style="margin-bottom: 12px;">Timezone</label>
            <div class="timezone-select" id="tzButtons"></div>
        </div>

        <button id="calcBtn" style="width: 100%; margin-top: 20px; padding: 14px;">Calculate</button>

        <div id="output" class="output-section" style="display: none;">
            <div class="lunar-info">
                <div class="stat-box">
                    <div class="stat-label">Illumination</div>
                    <div class="stat-value" id="illumination">—</div>
                    <div class="emoji-large" id="moonEmoji">🌙</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Moon Age</div>
                    <div class="stat-value" id="moonAge">—</div>
                    <div style="font-size: 0.85em; color: #00d9ff; margin-top: 5px; opacity: 0.8;" id="lunaryDay">days</div>
                </div>
            </div>

            <div id="tideTypeBox" class="tide-type" style="display: none;"></div>

            <div class="tide-curve">
                <label style="display: block; margin-bottom: 12px;">24-Hour Tide Curve</label>
                <canvas id="tideCanvas" width="600" height="300"></canvas>
            </div>

            <div class="tide-times" id="tideTimesBox"></div>
        </div>

        <div id="error" style="display: none;"></div>
    </div>

    <script>
        // Lunar phase & tide calculation
        const tzOptions = [
            { name: 'UTC', offset: 0 },
            { name: 'AEST', offset: 10 },
            { name: 'AWST', offset: 8 },
            { name: 'PST', offset: -8 },
            { name: 'EST', offset: -5 },
            { name: 'GMT', offset: 0 }
        ];

        let selectedTz = { name: 'UTC', offset: 0 };

        function initTzButtons() {
            const container = document.getElementById('tzButtons');
            tzOptions.forEach(tz => {
                const btn = document.createElement('button');
                btn.textContent = tz.name;
                btn.onclick = () => {
                    selectedTz = tz;
                    document.querySelectorAll('#tzButtons button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
                if (tz.name === 'UTC') btn.classList.add('active');
                container.appendChild(btn);
            });
        }

        // Real lunar phase calculation (Meeus' algorithm simplified)
        function lunarPhase(date) {
            const yr = date.getFullYear();
            const mo = date.getMonth() + 1;
            const day = date.getDate();

            const k = (yr + (mo - 0.5) / 12 - 2000) * 12.3685;
            const T = k / 1236.85;

            let JDE = 2451550.09766 + 29.530588861 * k
                + 0.00015437 * T * T
                - 0.000000150 * T * T * T
                + 0.00000011 * T * T * T * T;

            const JD = date.getTime() / 86400000 + 2440587.5;
            const age = (JD - 2451550.1) % 29.530588861;
            const illumination = (1 - Math.cos(2 * Math.PI * age / 29.530588861)) / 2;

            return {
                age: age % 29.531,
                illumination: Math.max(0, Math.min(1, illumination)),
                phase: Math.floor((age % 29.531) / 1.84) // 16 phases
            };
        }

        function getMoonEmoji(phase) {
            const phases = ['🌑', '🌒', '🌓', '🌔', '🌕', '🌖', '🌗', '🌘'];
            return phases[phase % 8];
        }

        // Harmonic tide model (M2 & K1)
        function calculateTide(hours, illumination) {
            // M2 (semi-diurnal, ~12.42h)
            const M2 = 1.2 * Math.sin((hours / 12.42) * 2 * Math.PI);
            // K1 (diurnal, ~23.93h)
            const K1 = 0.4 * Math.sin((hours / 23.93) * 2 * Math.PI);
            // Spring/neap modulation
            const springNeapFactor = 0.5 + 0.5 * Math.cos(2 * Math.PI * illumination);
            return (M2 * springNeapFactor + K1) * (1.5 + illumination);
        }

        function drawTideCurve(illumination) {
            const canvas = document.getElementById('tideCanvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(10, 14, 39, 0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const width = canvas.width;
            const height = canvas.height;
            const centerY = height / 2;
            const padding = 40;
            const graphWidth = width - 2 * padding;
            const graphHeight = height - 2 * padding;

            // Grid
            ctx.strokeStyle = 'rgba(30, 144, 255, 0.2)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                const y = padding + (graphHeight / 4) * i;
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(width - padding, y);
                ctx.stroke();
            }

            // Curve
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            for (let i = 0; i <= 96; i++) {
                const h = (i / 96) * 24;
                const tide = calculateTide(h, illumination);
                const x = padding + (i / 96) * graphWidth;
                const y = centerY - (tide / 3) * (graphHeight / 2);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // Axes
            ctx.strokeStyle = '#1e90ff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(padding, centerY);
            ctx.lineTo(width - padding, centerY);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(padding, padding);
            ctx.lineTo(padding, height - padding);
            ctx.stroke();

            // Labels
            ctx.fillStyle = '#00d9ff';
            ctx.font = '12px Inter';
            ctx.textAlign = 'center';
            ctx.fillText('0h', padding, height - 20);
            ctx.fillText('24h', width - padding, height - 20);
            ctx.fillText('High', padding - 25, padding + 5);
            ctx.fillText('Low', padding - 25, height - padding + 5);
        }

        function findTideExtrema(illumination) {
            const times = [];
            let lastTide = calculateTide(0, illumination);
            for (let h = 0.1; h <= 24; h += 0.1) {
                const tide = calculateTide(h, illumination);
                if ((lastTide < tide && tide > calculateTide(h + 0.1, illumination)) ||
                    (lastTide > tide && tide < calculateTide(h + 0.1, illumination))) {
                    const type = tide > lastTide ? 'High' : 'Low';
                    const height = Math.abs(tide) * 3;
                    const hours = Math.floor(h);
                    const mins = Math.floor((h % 1) * 60);
                    times.push({
                        type,
                        time: `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`,
                        height: height.toFixed(1)
                    });
                }
                lastTide = tide;
            }
            return times.slice(0, 4);
        }

        document.getElementById('calcBtn').addEventListener('click', () => {
            const date = new Date(document.getElementById('dateInput').value);
            if (!date.getTime()) {
                showError('Please select a date.');
                return;
            }

            const lunar = lunarPhase(date);
            const illuminationPct = Math.round(lunar.illumination * 100);
            const springNeap = lunar.illumination > 0.75 || lunar.illumination < 0.25 ? 'Spring' : 'Neap';

            document.getElementById('illumination').textContent = illuminationPct + '%';
            document.getElementById('moonAge').textContent = lunar.age.toFixed(1);
            document.getElementById('moonEmoji').textContent = getMoonEmoji(lunar.phase);

            const tideTypeBox = document.getElementById('tideTypeBox');
            tideTypeBox.textContent = `${springNeap} Tide`;
            tideTypeBox.className = `tide-type ${springNeap.toLowerCase()}`;
            tideTypeBox.style.display = 'block';

            drawTideCurve(lunar.illumination);

            const extrema = findTideExtrema(lunar.illumination);
            const timesHtml = extrema.map(e =>
                `<div class="tide-event">
                    <div class="tide-event-type">${e.type} Tide</div>
                    <div class="tide-event-time">${e.time}</div>
                    <div class="tide-event-height">${e.height} ft</div>
                </div>`
            ).join('');
            document.getElementById('tideTimesBox').innerHTML = timesHtml;

            document.getElementById('output').style.display = 'block';
            document.getElementById('error').style.display = 'none';
        });

        function showError(msg) {
            const errBox = document.getElementById('error');
            errBox.textContent = msg;
            errBox.style.display = 'block';
            errBox.classList.add('error');
            document.getElementById('output').style.display = 'none';
        }

        // Initialize
        initTzButtons();
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('dateInput').value = today;
    </script>
</body>
</html>
