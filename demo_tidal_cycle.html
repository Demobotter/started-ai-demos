<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tidal Cycle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a2447 100%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .container {
      max-width: 900px;
      background: rgba(10, 14, 39, 0.95);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.2rem;
      margin-bottom: 8px;
      color: #00ffff;
      font-weight: 700;
    }
    .subtitle {
      color: #0080ff;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      margin-bottom: 32px;
    }
    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
      h1 { font-size: 1.8rem; }
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }
    label {
      font-size: 0.9rem;
      color: #00d9ff;
      font-weight: 500;
    }
    input[type="date"], input[type="time"], select {
      padding: 10px 12px;
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 6px;
      background: rgba(0, 20, 40, 0.6);
      color: #e0e0e0;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
    }
    input[type="date"]:focus, input[type="time"]:focus, select:focus {
      outline: none;
      border-color: #00ffff;
      box-shadow: 0 0 8px rgba(0, 255, 255, 0.3);
    }
    .lunar-display {
      background: rgba(0, 80, 160, 0.2);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    .lunar-emoji {
      font-size: 3rem;
      margin-bottom: 8px;
    }
    .lunar-text {
      color: #00d9ff;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }
    .lunar-age {
      color: #ffb700;
      font-size: 0.85rem;
    }
    .tide-curve {
      background: rgba(0, 20, 40, 0.8);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
      background: rgba(10, 14, 39, 0.6);
      border-radius: 6px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }
    .stat-card {
      background: rgba(0, 80, 160, 0.15);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 8px;
      padding: 14px;
      text-align: center;
    }
    .stat-label {
      color: #0080ff;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .stat-value {
      color: #00ffff;
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
    }
    .status {
      color: #ffb700;
      font-size: 0.75rem;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌊 Tidal Cycle</h1>
    <p class="subtitle">Real lunar phase & harmonic tide prediction</p>

    <div class="grid">
      <div>
        <div class="control-group">
          <label for="dateInput">Date</label>
          <input type="date" id="dateInput">
        </div>
        <div class="control-group">
          <label for="tzSelect">Timezone</label>
          <select id="tzSelect">
            <option value="Australia/Melbourne">Australia/Melbourne (AEDT/AEST)</option>
            <option value="Australia/Sydney">Australia/Sydney</option>
            <option value="Australia/Brisbane">Australia/Brisbane</option>
            <option value="Australia/Perth">Australia/Perth</option>
            <option value="Pacific/Auckland">Pacific/Auckland</option>
            <option value="UTC">UTC</option>
            <option value="US/Eastern">US/Eastern</option>
            <option value="US/Pacific">US/Pacific</option>
            <option value="Europe/London">Europe/London</option>
          </select>
        </div>
      </div>
      <div class="lunar-display">
        <div class="lunar-emoji" id="lunarEmoji">🌕</div>
        <div class="lunar-text" id="lunarName">Full Moon</div>
        <div class="lunar-age" id="lunarAge">Age: 14 days | Illumination: 99%</div>
        <div class="lunar-text" id="tideType" style="margin-top: 8px; color: #ff6b35;">Type: Spring Tide</div>
      </div>
    </div>

    <div class="tide-curve">
      <canvas id="tideCanvas" width="800" height="300"></canvas>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">High Tide 1</div>
        <div class="stat-value" id="high1Time">–:–</div>
        <div class="status" id="high1Depth">–</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Low Tide 1</div>
        <div class="stat-value" id="low1Time">–:–</div>
        <div class="status" id="low1Depth">–</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">High Tide 2</div>
        <div class="stat-value" id="high2Time">–:–</div>
        <div class="status" id="high2Depth">–</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Low Tide 2</div>
        <div class="stat-value" id="low2Time">–:–</div>
        <div class="status" id="low2Depth">–</div>
      </div>
    </div>
  </div>

  <script>
    // Set today's date as default
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    document.getElementById('dateInput').value = `${year}-${month}-${day}`;

    // Lunar phase calculation (Meeus/Jones/Chaffee algorithm)
    function getLunarPhase(date) {
      const JD = getJulianDay(date);
      const T = (JD - 2451545.0) / 36525.0;
      const D = 297.8501921 + 445267.1142426 * T - 0.0051694 * T * T + T * T * T / 38880;
      const M = 357.5291092 + 35999.0502909 * T - 0.0001536 * T * T + T * T * T / 24490;
      const Mprime = 134.9633964 + 477198.8675055 * T + 0.0087414 * T * T + T * T * T / 69699;
      const phase = (Mprime + 6.289 * Math.sin(rad(Mprime)) + 2.1 * Math.sin(rad(M))) % 360;
      const age = (phase / 360) * 29.53;
      const illum = (1 - Math.cos(rad(phase))) / 2;
      return { phase, age, illum };
    }

    function getJulianDay(date) {
      const Y = date.getUTCFullYear(), M = date.getUTCMonth() + 1, D = date.getUTCDate();
      const h = date.getUTCHours() / 24, m = date.getUTCMinutes() / 1440;
      const a = Math.floor((14 - M) / 12);
      const y = Y + 4800 - a;
      const m2 = M + 12 * a - 3;
      return D + Math.floor((153 * m2 + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045 + h + m;
    }

    function rad(deg) { return deg * Math.PI / 180; }

    function getLunarEmoji(phase) {
      const p = (phase % 360 + 360) % 360;
      if (p < 22.5 || p >= 337.5) return '🌕';
      if (p < 67.5) return '🌖';
      if (p < 112.5) return '🌗';
      if (p < 157.5) return '🌘';
      if (p < 202.5) return '🌑';
      if (p < 247.5) return '🌒';
      if (p < 292.5) return '🌓';
      return '🌔';
    }

    function getLunarPhaseName(phase) {
      const p = (phase % 360 + 360) % 360;
      if (p < 22.5 || p >= 337.5) return 'Full Moon';
      if (p < 67.5) return 'Waning Gibbous';
      if (p < 112.5) return 'Last Quarter';
      if (p < 157.5) return 'Waning Crescent';
      if (p < 202.5) return 'New Moon';
      if (p < 247.5) return 'Waxing Crescent';
      if (p < 292.5) return 'First Quarter';
      return 'Waxing Gibbous';
    }

    // Harmonic tide calculation
    function calculateTideForTime(hours, moonAge) {
      // Simplified M2 (semidiurnal) + K1 (diurnal) + moon phase modulation
      const M2_amp = 1.2; // meters
      const K1_amp = 0.4;
      const springNeapFactor = 0.7 + 0.3 * Math.cos(rad(moonAge * 12.2)); // varies with lunar phase
      const M2 = M2_amp * springNeapFactor * Math.sin(rad((hours / 12.42) * 360));
      const K1 = K1_amp * Math.sin(rad((hours / 23.93) * 360 + moonAge * 5));
      return 2.0 + M2 + K1; // 2m base + harmonics
    }

    function getTidesForDay(date, moonAge) {
      const tides = [];
      for (let h = 0; h < 24; h++) {
        const height = calculateTideForTime(h, moonAge);
        tides.push({ hour: h, height });
      }
      // Find extremes (simple peak detection)
      const extremes = [];
      for (let i = 1; i < tides.length - 1; i++) {
        if (tides[i].height > tides[i - 1].height && tides[i].height > tides[i + 1].height) {
          extremes.push({ time: tides[i].hour, height: tides[i].height, type: 'high' });
        }
        if (tides[i].height < tides[i - 1].height && tides[i].height < tides[i + 1].height) {
          extremes.push({ time: tides[i].hour, height: tides[i].height, type: 'low' });
        }
      }
      return { tides, extremes };
    }

    function drawTideCurve(canvas, tides) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      const minH = 0.5, maxH = 3.5;
      const padding = 40;

      // Background grid
      ctx.fillStyle = 'rgba(0, 80, 160, 0.1)';
      ctx.fillRect(padding, padding, w - 2 * padding, h - 2 * padding);

      // Grid lines (hourly)
      ctx.strokeStyle = 'rgba(0, 212, 255, 0.15)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 24; i++) {
        const x = padding + (i / 24) * (w - 2 * padding);
        ctx.beginPath();
        ctx.moveTo(x, padding);
        ctx.lineTo(x, h - padding);
        ctx.stroke();
      }

      // Tide curve
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      tides.forEach((t, idx) => {
        const x = padding + (t.hour / 24) * (w - 2 * padding);
        const y = h - padding - ((t.height - minH) / (maxH - minH)) * (h - 2 * padding);
        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // Axes
      ctx.strokeStyle = 'rgba(0, 212, 255, 0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(padding, padding);
      ctx.lineTo(padding, h - padding);
      ctx.lineTo(w - padding, h - padding);
      ctx.stroke();

      // Labels
      ctx.fillStyle = '#0080ff';
      ctx.font = 'bold 12px Inter, sans-serif';
      for (let i = 0; i <= 24; i += 6) {
        const x = padding + (i / 24) * (w - 2 * padding);
        ctx.textAlign = 'center';
        ctx.fillText(i + ':00', x, h - padding + 20);
      }
      ctx.textAlign = 'right';
      for (let h = 0.5; h <= 3.5; h += 0.5) {
        const y = h - padding - ((h - minH) / (maxH - minH)) * (h - 2 * padding);
        ctx.fillText(h.toFixed(1) + 'm', padding - 10, y + 4);
      }
    }

    function updateDisplay() {
      const dateStr = document.getElementById('dateInput').value;
      const tz = document.getElementById('tzSelect').value;
      const [y, m, d] = dateStr.split('-');
      const date = new Date(`${y}-${m}-${d}T00:00:00Z`);

      const lunar = getLunarPhase(date);
      const phases = getTidesForDay(date, lunar.age);

      // Update lunar display
      document.getElementById('lunarEmoji').textContent = getLunarEmoji(lunar.phase);
      document.getElementById('lunarName').textContent = getLunarPhaseName(lunar.phase);
      document.getElementById('lunarAge').textContent = `Age: ${Math.round(lunar.age)} days | Illumination: ${Math.round(lunar.illum * 100)}%`;
      const springNeapFactor = 0.7 + 0.3 * Math.cos(rad(lunar.age * 12.2));
      document.getElementById('tideType').textContent = springNeapFactor > 0.85 ? 'Type: Spring Tide 🌊' : 'Type: Neap Tide 🌊';

      // Draw tide curve
      const canvas = document.getElementById('tideCanvas');
      drawTideCurve(canvas, phases.tides);

      // Update tide times
      const highs = phases.extremes.filter(e => e.type === 'high').sort((a, b) => a.time - b.time);
      const lows = phases.extremes.filter(e => e.type === 'low').sort((a, b) => a.time - b.time);

      ['high1', 'low1', 'high2', 'low2'].forEach((id, idx) => {
        const isHigh = id.startsWith('high');
        const arr = isHigh ? highs : lows;
        const tidNum = parseInt(id[id.length - 1]) - 1;
        if (arr[tidNum]) {
          const h = Math.floor(arr[tidNum].time);
          const m = Math.round((arr[tidNum].time % 1) * 60);
          document.getElementById(id + 'Time').textContent = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
          document.getElementById(id + 'Depth').textContent = arr[tidNum].height.toFixed(2) + ' m';
        } else {
          document.getElementById(id + 'Time').textContent = '–:–';
          document.getElementById(id + 'Depth').textContent = '–';
        }
      });
    }

    document.getElementById('dateInput').addEventListener('change', updateDisplay);
    document.getElementById('tzSelect').addEventListener('change', updateDisplay);
    updateDisplay();
  </script>
</body>
</html>
