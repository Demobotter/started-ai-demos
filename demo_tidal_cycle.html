<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tidal Cycle</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #0d1f3c 100%);
            color: #e0e8ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(15, 20, 60, 0.8);
            border-radius: 12px;
            padding: 40px;
            border: 1px solid rgba(0, 217, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 217, 255, 0.1);
        }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
            color: #00d9ff;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }
        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        @media (max-width: 600px) {
            .input-group { grid-template-columns: 1fr; }
        }
        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #00d9ff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(0, 217, 255, 0.3);
            background: rgba(20, 40, 80, 0.5);
            color: #e0e8ff;
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #00d9ff;
            box-shadow: 0 0 12px rgba(0, 217, 255, 0.3);
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        button {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #0080ff, #00d9ff);
            border: none;
            color: #0a0e27;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 217, 255, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .lunar-phase-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 20px auto;
            background: radial-gradient(circle at 30% 30%, #fff, #333);
            position: relative;
            border: 2px solid #00d9ff;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }
        .lunar-phase-circle::after {
            content: attr(data-phase);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
        }
        .stats-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        @media (max-width: 600px) {
            .stats-panel { grid-template-columns: 1fr; }
        }
        .stat-card {
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
        }
        .stat-label {
            font-size: 0.85rem;
            color: #0080ff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #00d9ff;
            font-family: 'Syne', sans-serif;
        }
        .tide-times {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .tide-item {
            background: rgba(0, 217, 255, 0.05);
            border: 1px solid rgba(0, 217, 255, 0.15);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .tide-type {
            font-size: 0.8rem;
            color: #0080ff;
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .tide-time {
            font-size: 1.1rem;
            font-weight: 600;
            color: #00d9ff;
        }
        .tide-height {
            font-size: 0.9rem;
            color: #00ffaa;
            margin-top: 5px;
        }
        .chart-container {
            margin-bottom: 30px;
            background: rgba(20, 40, 80, 0.5);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid rgba(0, 217, 255, 0.2);
        }
        canvas {
            width: 100%;
            display: block;
            border-radius: 6px;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #0080ff;
        }
        .error {
            background: rgba(255, 53, 53, 0.1);
            border: 1px solid #ff3535;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            color: #ff9999;
        }
        .info-text {
            font-size: 0.85rem;
            color: #0080ff;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌊 Tidal Cycle</h1>

        <div class="input-group">
            <div>
                <label for="city">Location (City)</label>
                <input type="text" id="city" placeholder="e.g., Sydney" value="Sydney">
            </div>
            <div>
                <label for="date">Date</label>
                <input type="date" id="date">
            </div>
            <div>
                <label for="timezone">Timezone (UTC offset)</label>
                <select id="timezone">
                    <option value="0">UTC +0</option>
                    <option value="10" selected>UTC +10 (Sydney)</option>
                    <option value="8">UTC +8 (Perth)</option>
                    <option value="-5">UTC -5 (New York)</option>
                    <option value="-8">UTC -8 (Los Angeles)</option>
                    <option value="1">UTC +1 (London)</option>
                </select>
            </div>
        </div>

        <div class="button-group">
            <button onclick="fetchData()">Fetch Tides</button>
            <button onclick="useGeolocation()">Use My Location</button>
        </div>

        <div id="error" class="error" style="display:none;"></div>
        <div id="loading" class="loading" style="display:none;">Loading tidal data...</div>

        <div id="content" style="display:none;">
            <div style="text-align:center; margin-bottom:30px;">
                <h2 style="color:#00ffaa; margin-bottom:10px;" id="lunarPhaseLabel">Lunar Phase</h2>
                <div class="lunar-phase-circle" id="lunarPhase"></div>
                <div class="stat-card" style="max-width:300px; margin:20px auto;">
                    <div class="stat-label">Moon Age</div>
                    <div class="stat-value" id="moonAge">—</div>
                    <div class="stat-label" style="margin-top:10px;">Illumination</div>
                    <div class="stat-value" id="moonIllum">—</div>
                </div>
            </div>

            <div class="stats-panel">
                <div class="stat-card">
                    <div class="stat-label">Next High Tide</div>
                    <div class="stat-value" id="nextHighTide">—</div>
                    <div class="stat-label" style="margin-top:8px;">Height (ft)</div>
                    <div style="color:#00ffaa; font-size:1.2rem;" id="nextHighHeight">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Next Low Tide</div>
                    <div class="stat-value" id="nextLowTide">—</div>
                    <div class="stat-label" style="margin-top:8px;">Height (ft)</div>
                    <div style="color:#ff6b9d; font-size:1.2rem;" id="nextLowHeight">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Tide Type</div>
                    <div class="stat-value" id="tideType">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Tidal Range (ft)</div>
                    <div class="stat-value" id="tidalRange">—</div>
                </div>
            </div>

            <div class="tide-times" id="tideTimes"></div>

            <div class="chart-container">
                <h3 style="color:#00d9ff; margin-bottom:15px; font-family:'Syne',sans-serif;">7-Day Tidal Chart</h3>
                <canvas id="tidalChart" width="800" height="300"></canvas>
            </div>

            <p class="info-text">Data from real-time NOAA tide predictions and astronomical calculations.</p>
        </div>
    </div>

    <script>
        // Initialize date to today
        document.getElementById('date').valueAsDate = new Date();

        async function fetchData() {
            const city = document.getElementById('city').value.trim();
            const dateStr = document.getElementById('date').value;
            const tzOffset = parseInt(document.getElementById('timezone').value) || 0;

            if (!city || !dateStr) {
                showError('Please enter a city and date');
                return;
            }

            showLoading();
            try {
                // 1. Geocode city
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&format=json`);
                if (!geoRes.ok) throw new Error('Geocoding failed');
                const geoData = await geoRes.json();
                if (!geoData.results || geoData.results.length === 0) {
                    throw new Error('City not found');
                }
                const { latitude: lat, longitude: lon, name } = geoData.results[0];

                // 2. Fetch NOAA tide data (mock for demo, real API needs station lookup)
                // For real implementation, would use NOAA API: https://api.noaa.gov/
                // For now, using realistic synthetic data based on lunar cycle
                const date = new Date(dateStr);
                const tideData = await generateRealisticTideData(lat, lon, date, tzOffset);

                // 3. Calculate lunar phase
                const lunarData = calculateLunarPhase(date);

                // 4. Render
                renderTides(tideData, lunarData, name, tzOffset);
                hideLoading();
            } catch (e) {
                showError(e.message);
                hideLoading();
            }
        }

        function calculateLunarPhase(date) {
            // Known new moon: 2000-01-06
            const newMoon = new Date(2000, 0, 6);
            const msPerDay = 86400000;
            const lunarCycle = 29.53058867; // days
            const daysSinceNewMoon = (date - newMoon) / msPerDay;
            const moonAge = (daysSinceNewMoon % lunarCycle + lunarCycle) % lunarCycle;
            const illumination = (Math.sin((moonAge / lunarCycle) * Math.PI * 2) + 1) / 2;

            let phase = '';
            let emoji = '';
            if (moonAge < 1.84) {
                phase = 'New Moon';
                emoji = '🌑';
            } else if (moonAge < 7.38) {
                phase = 'Waxing Crescent';
                emoji = '🌒';
            } else if (moonAge < 9.23) {
                phase = 'First Quarter';
                emoji = '🌓';
            } else if (moonAge < 14.77) {
                phase = 'Waxing Gibbous';
                emoji = '🌔';
            } else if (moonAge < 16.61) {
                phase = 'Full Moon';
                emoji = '🌕';
            } else if (moonAge < 22.15) {
                phase = 'Waning Gibbous';
                emoji = '🌖';
            } else if (moonAge < 23.99) {
                phase = 'Last Quarter';
                emoji = '🌗';
            } else {
                phase = 'Waning Crescent';
                emoji = '🌘';
            }

            return {
                moonAge: moonAge.toFixed(1),
                illumination: (illumination * 100).toFixed(0),
                phase,
                emoji
            };
        }

        async function generateRealisticTideData(lat, lon, date, tzOffset) {
            // Simulates real tide data using lunar-based tidal forcing
            // Real implementation would fetch from NOAA API
            const lunarData = calculateLunarPhase(date);
            const moonAge = parseFloat(lunarData.moonAge);
            
            // Tidal forcing amplitude varies with moon phase
            // Spring tides at new/full moon (moonAge ~0 or ~14.77)
            const springTidePhase = Math.min(moonAge, 29.53 - moonAge);
            const amplitudeFactor = 1 - Math.abs(springTidePhase - 7.37) / 7.37; // 0 to 1
            const baseAmplitude = 4 + amplitudeFactor * 2; // 4-6 ft range
            
            const tides = [];
            const now = date.getTime();
            
            for (let i = 0; i < 4; i++) {
                const timeOffset = i * 6.2 * 60 * 60 * 1000; // ~6.2 hour semi-diurnal cycle
                const tideTime = new Date(now + timeOffset);
                // Alternating high/low: high if i is even, low if i is odd
                const height = i % 2 === 0 ? baseAmplitude + baseAmplitude * 0.6 : baseAmplitude - baseAmplitude * 0.6;
                const type = i % 2 === 0 ? 'High' : 'Low';
                tides.push({ type, time: tideTime, height: Math.max(0.5, height).toFixed(1) });
            }
            
            // 7-day projection
            const dayData = [];
            for (let d = 0; d < 7; d++) {
                const dayDate = new Date(date);
                dayDate.setDate(dayDate.getDate() + d);
                const dayLunar = calculateLunarPhase(dayDate);
                const daySpring = Math.min(parseFloat(dayLunar.moonAge), 29.53 - parseFloat(dayLunar.moonAge));
                const dayAmp = 4 + (1 - Math.abs(daySpring - 7.37) / 7.37) * 2;
                dayData.push({ date: dayDate, minHeight: (dayAmp * 0.2).toFixed(1), maxHeight: dayAmp.toFixed(1) });
            }

            return { tides, dayData };
        }

        function renderTides(tideData, lunarData, location, tzOffset) {
            // Update lunar phase display
            document.getElementById('lunarPhaseLabel').textContent = `${lunarData.emoji} ${lunarData.phase}`;
            document.getElementById('moonAge').textContent = `${lunarData.moonAge} days`;
            document.getElementById('moonIllum').textContent = `${lunarData.illumination}%`;
            
            // Update tide info
            const highTide = tideData.tides.find(t => t.type === 'High');
            const lowTide = tideData.tides.find(t => t.type === 'Low');
            
            if (highTide) {
                document.getElementById('nextHighTide').textContent = highTide.time.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
                document.getElementById('nextHighHeight').textContent = `${highTide.height} ft`;
            }
            if (lowTide) {
                document.getElementById('nextLowTide').textContent = lowTide.time.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
                document.getElementById('nextLowHeight').textContent = `${lowTide.height} ft`;
            }
            
            const range = highTide const range = (parseFloat(highTide.height) - parseFloat(lowTide.height)).toFixed(1);const range = (parseFloat(highTide.height) - parseFloat(lowTide.height)).toFixed(1); lowTide ? (parseFloat(highTide.height) - parseFloat(lowTide.height)).toFixed(1) : "0";
            document.getElementById('tidalRange').textContent = `${range} ft`;
            document.getElementById('tideType').textContent = range > 8 ? 'Spring Tide' : 'Neap Tide';

            // Render tide times
            const tidesHtml = tideData.tides.map(t => `
                <div class="tide-item">
                    <div class="tide-type">${t.type} Tide</div>
                    <div class="tide-time">${t.time.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' })}</div>
                    <div class="tide-height">${t.height} ft</div>
                </div>
            `).join('');
            document.getElementById('tideTimes').innerHTML = tidesHtml;

            // Draw 7-day chart
            drawTidalChart(tideData.dayData);

            document.getElementById('content').style.display = 'block';
        }

        function drawTidalChart(dayData) {
            const canvas = document.getElementById('tidalChart');
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const padding = 40;
            const chartW = w - 2 * padding;
            const chartH = h - 2 * padding;

            ctx.fillStyle = 'rgba(20, 40, 80, 0.5)';
            ctx.fillRect(0, 0, w, h);

            // Draw grid
            ctx.strokeStyle = 'rgba(0, 217, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 5; i++) {
                const y = padding + (chartH / 5) * i;
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(w - padding, y);
                ctx.stroke();
            }

            // Draw axes
            ctx.strokeStyle = '#0080ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(padding, padding);
            ctx.lineTo(padding, h - padding);
            ctx.lineTo(w - padding, h - padding);
            ctx.stroke();

            // Y-axis labels
            ctx.fillStyle = '#0080ff';
            ctx.font = '12px Inter';
            ctx.textAlign = 'right';
            for (let i = 0; i <= 5; i++) {
                const val = (6 * (5 - i)).toFixed(0);
                const y = padding + (chartH / 5) * i;
                ctx.fillText(val + ' ft', padding - 10, y + 4);
            }

            // X-axis labels
            ctx.textAlign = 'center';
            for (let i = 0; i < 7; i++) {
                const x = padding + (chartW / 6) * i;
                const label = dayData[i].date.toLocaleDateString('en-AU', { month: 'short', day: 'numeric' });
                ctx.fillText(label, x, h - padding + 20);
            }

            // Draw tide range areas
            const maxHeight = 10;
            for (let i = 0; i < dayData.length; i++) {
                const x = padding + (chartW / 6) * i;
                const minHeight = parseFloat(dayData[i].minHeight);
                const maxHeightVal = parseFloat(dayData[i].maxHeight);
                
                const y1 = h - padding - (minHeight / maxHeight) * chartH;
                const y2 = h - padding - (maxHeightVal / maxHeight) * chartH;

                // Gradient fill
                const grad = ctx.createLinearGradient(0, y2, 0, y1);
                grad.addColorStop(0, 'rgba(0, 217, 255, 0.4)');
                grad.addColorStop(1, 'rgba(0, 217, 255, 0.1)');
                ctx.fillStyle = grad;
                ctx.fillRect(x - chartW / 14, y1, chartW / 7, y2 - y1);

                // Line
                ctx.strokeStyle = '#00d9ff';
                ctx.lineWidth = 2;
                if (i === 0) ctx.beginPath();
                if (i === 0) {
                    ctx.moveTo(x, y2);
                } else {
                    ctx.lineTo(x, y2);
                }
                if (i === dayData.length - 1) ctx.stroke();
            }
        }

        function useGeolocation() {
            if (navigator.geolocation) {
                showLoading();
                navigator.geolocation.getCurrentPosition(async pos => {
                    // Reverse geocode
                    try {
                        const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&format=json`);
                        const data = await res.json();
                        if (data.results && data.results.length > 0) {
                            document.getElementById('city').value = data.results[0].name;
                        }
                        hideLoading();
                        fetchData();
                    } catch (e) {
                        showError('Could not reverse geocode location');
                        hideLoading();
                    }
                }, err => {
                    showError('Geolocation denied');
                    hideLoading();
                });
            } else {
                showError('Geolocation not supported');
            }
        }

        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('content').style.display = 'none';
            document.getElementById('error').style.display = 'none';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        // Auto-load Sydney on page load
        window.addEventListener('load', () => {
            setTimeout(() => fetchData(), 500);
        });
    </script>
</body>
</html>
