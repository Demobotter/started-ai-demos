<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipher Cracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a1428;
            color: #e9ecef;
            font-family: 'Space Mono', monospace;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #ffd700;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #adb5bd;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }
        .panel {
            background: #1a2540;
            border: 2px solid #495057;
            border-radius: 8px;
            padding: 20px;
        }
        .panel h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #60a5fa;
            border-bottom: 2px solid #495057;
            padding-bottom: 10px;
        }
        .textarea-box {
            background: #0a1428;
            border: 1px solid #495057;
            border-radius: 6px;
            padding: 12px;
            color: #e9ecef;
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 12px;
            resize: vertical;
            min-height: 100px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        .control-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #adb5bd;
            font-weight: 700;
        }
        select, button {
            background: #1a2540;
            color: #e9ecef;
            border: 1px solid #495057;
            border-radius: 6px;
            padding: 8px 12px;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        button {
            background: #0f4c81;
            border-color: #60a5fa;
            color: #60a5fa;
            font-weight: 700;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        button:hover {
            background: #1a5fa0;
            border-color: #93c5fd;
            color: #93c5fd;
        }
        button.secondary {
            background: #1a2540;
            border-color: #495057;
            color: #adb5bd;
        }
        button.secondary:hover {
            background: #2a3a50;
            border-color: #6c757d;
            color: #e9ecef;
        }
        button.success {
            background: #059669;
            border-color: #10b981;
            color: #10b981;
        }
        button.success:hover {
            background: #0d7a5c;
            border-color: #34d399;
            color: #34d399;
        }
        .freq-chart {
            background: #0a1428;
            border: 1px solid #495057;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
            height: 150px;
            position: relative;
            overflow: hidden;
        }
        .freq-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 100%;
            justify-content: space-around;
        }
        .freq-bar {
            flex: 1;
            background: #60a5fa;
            border-radius: 2px 2px 0 0;
            min-height: 2px;
            position: relative;
            cursor: help;
        }
        .freq-bar.english {
            opacity: 0.5;
        }
        .freq-bar-label {
            position: absolute;
            bottom: -18px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.7rem;
            color: #adb5bd;
            white-space: nowrap;
        }
        .mapping-table {
            background: #0a1428;
            border: 1px solid #495057;
            border-radius: 6px;
            padding: 12px;
            font-size: 0.8rem;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 12px;
        }
        .mapping-row {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            padding: 6px;
            background: #1a2540;
            border-radius: 4px;
        }
        .mapping-key {
            font-weight: 700;
            color: #ffd700;
            min-width: 30px;
            text-align: center;
        }
        .mapping-arrow {
            color: #60a5fa;
            margin: 0 8px;
            font-weight: 700;
        }
        .mapping-val {
            flex: 1;
            color: #10b981;
            text-align: center;
        }
        .mapping-del {
            background: #8b0000;
            color: #ff6b6b;
            border: none;
            border-radius: 3px;
            padding: 3px 8px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-left: 8px;
        }
        .mapping-del:hover {
            background: #a00000;
        }
        .score-box {
            background: #0a1428;
            border: 1px solid #495057;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .score-label {
            font-size: 0.75rem;
            color: #adb5bd;
            margin-bottom: 4px;
        }
        .score-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #10b981;
        }
        .mapping-input {
            background: #0a1428;
            border: 1px solid #495057;
            border-radius: 6px;
            padding: 8px 12px;
            color: #e9ecef;
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            margin-bottom: 12px;
            width: 100%;
        }
        .mapping-input::placeholder {
            color: #495057;
        }
        .hint-msg {
            background: #1a3a4a;
            border-left: 3px solid #60a5fa;
            padding: 10px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            border-radius: 4px;
        }
        .quick-examples {
            margin-bottom: 12px;
        }
        .example-btn {
            display: inline-block;
            background: #1a2540;
            border: 1px solid #495057;
            border-radius: 4px;
            padding: 6px 10px;
            margin-right: 6px;
            margin-bottom: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .example-btn:hover {
            background: #2a3a50;
            border-color: #6c757d;
        }
        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔓 Cipher Cracker</h1>
        <div class="subtitle">Break substitution ciphers using frequency analysis</div>

        <div class="main-grid">
            <!-- LEFT: Input & Frequency Analysis -->
            <div class="panel">
                <h2>Ciphertext</h2>
                
                <div class="quick-examples">
                    <label style="margin-bottom: 8px; display: block; font-size: 0.8rem; color: #adb5bd;">Quick Examples:</label>
                    <button class="example-btn" onclick="loadExample('caesar')">Caesar (+3)</button>
                    <button class="example-btn" onclick="loadExample('poe')">Poe Excerpt</button>
                    <button class="example-btn" onclick="loadExample('random')">Random Cipher</button>
                </div>

                <textarea class="textarea-box" id="ciphertext" placeholder="Paste ciphertext here...">KHOOR ZRUOG</textarea>
                
                <button onclick="analyzeCipher()" class="success">Analyze</button>
                <button class="secondary" onclick="document.getElementById('ciphertext').value = ''">Clear</button>

                <div style="margin-top: 20px;">
                    <label style="display: block; margin-bottom: 10px; font-size: 0.85rem; color: #adb5bd; font-weight: 700;">Letter Frequency (Cipher)</label>
                    <div class="freq-chart">
                        <div class="freq-bars" id="cipherFreqBars"></div>
                    </div>
                    <small style="color: #6c757d;">Cyan = cipher frequency, Gray = English baseline</small>
                </div>

                <div style="margin-top: 15px;">
                    <button onclick="getFrequencyHint()" class="secondary" style="width: 100%;">💡 Frequency Hint</button>
                </div>
            </div>

            <!-- RIGHT: Mapping & Plaintext -->
            <div class="panel">
                <h2>Decryption Mapping</h2>

                <div class="hint-msg" id="hintMsg" style="display: none;"></div>

                <label style="display: block; margin-bottom: 8px; font-size: 0.85rem; color: #adb5bd; font-weight: 700;">Map Letter (Cipher → Plain)</label>
                <input class="mapping-input" id="mapInput" placeholder="Example: A→E (cipher letter → plain letter)" style="margin-bottom: 12px;">
                <button onclick="applyMapping()" class="success">Apply Mapping</button>
                <button onclick="autoSolve()" class="secondary">🤖 Auto-Solve</button>
                <button class="secondary" onclick="clearMapping()">Reset</button>

                <div style="margin-top: 15px;">
                    <div class="mapping-table" id="mappingTable"></div>
                </div>

                <div style="margin-top: 15px;">
                    <label style="display: block; margin-bottom: 10px; font-size: 0.85rem; color: #adb5bd; font-weight: 700;">Plaintext Preview</label>
                    <textarea class="textarea-box" id="plaintext" placeholder="Decrypted text will appear here..." readonly style="background: #0f2438; color: #10b981;"></textarea>
                </div>

                <div style="margin-top: 15px;">
                    <div class="score-label">Coherence Score</div>
                    <div class="score-value" id="coherenceScore">0%</div>
                    <small style="color: #6c757d;">Based on English word matches</small>
                </div>
            </div>
        </div>
    </div>

    <script>
        // English letter frequency distribution (%)
        const ENGLISH_FREQ = {
            'E': 12.70, 'T': 9.06, 'A': 8.17, 'O': 7.51, 'I': 6.97,
            'N': 6.75, 'S': 6.33, 'H': 6.09, 'R': 5.99, 'D': 4.25,
            'L': 4.03, 'C': 2.78, 'U': 2.76, 'M': 2.41, 'W': 2.36,
            'F': 2.23, 'G': 2.02, 'Y': 1.97, 'P': 1.93, 'B': 1.29,
            'V': 0.98, 'K': 0.77, 'J': 0.15, 'X': 0.15, 'Q': 0.10, 'Z': 0.07
        };

        // Common English words for coherence scoring
        const ENGLISH_WORDS = new Set([
            'the', 'be', 'to', 'of', 'and', 'a', 'in', 'that', 'have', 'i',
            'it', 'for', 'not', 'on', 'with', 'he', 'as', 'you', 'do', 'at',
            'this', 'but', 'his', 'by', 'from', 'they', 'we', 'say', 'her', 'she',
            'or', 'an', 'will', 'my', 'one', 'all', 'would', 'there', 'their', 'what',
            'so', 'up', 'out', 'if', 'about', 'who', 'get', 'which', 'go', 'me',
            'when', 'make', 'can', 'like', 'time', 'no', 'just', 'him', 'know', 'take',
            'people', 'into', 'year', 'your', 'good', 'some', 'could', 'them', 'see', 'other',
            'than', 'then', 'now', 'look', 'only', 'come', 'its', 'over', 'think', 'also',
            'back', 'after', 'use', 'two', 'how', 'our', 'work', 'first', 'well', 'way',
            'even', 'new', 'want', 'because', 'any', 'these', 'give', 'day', 'most', 'us',
            'is', 'are', 'was', 'were', 'been', 'am', 'being', 'has', 'had', 'having',
            'does', 'did', 'doing', 'should', 'may', 'might', 'must', 'can', 'shall', 'ought'
        ]);

        let ciphertext = '';
        let mapping = {}; // cipher letter → plain letter
        let cipherFreq = {};

        function sanitize(text) {
            return text.toUpperCase().replace(/[^A-Z]/g, '');
        }

        function analyzeCipher() {
            const rawText = document.getElementById('ciphertext').value;
            ciphertext = sanitize(rawText);

            if (ciphertext.length === 0) {
                alert('Please enter ciphertext.');
                return;
            }

            // Calculate frequency
            cipherFreq = {};
            for (let letter of ciphertext) {
                cipherFreq[letter] = (cipherFreq[letter] || 0) + 1;
            }
            for (let letter in cipherFreq) {
                cipherFreq[letter] = (cipherFreq[letter] / ciphertext.length) * 100;
            }

            renderFrequencyChart();
            updatePlaintext();
        }

        function renderFrequencyChart() {
            const container = document.getElementById('cipherFreqBars');
            container.innerHTML = '';
            const allLetters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

            for (let letter of allLetters) {
                const freq = cipherFreq[letter] || 0;
                const englishFreq = ENGLISH_FREQ[letter] || 0;
                const bar = document.createElement('div');
                bar.style.position = 'relative';
                bar.style.flex = '1';

                // English baseline (gray, shorter)
                const enBar = document.createElement('div');
                enBar.style.background = '#495057';
                enBar.style.height = Math.max((englishFreq / 15) * 100, 3) + '%';
                enBar.style.borderRadius = '2px 2px 0 0';

                // Cipher freq (cyan, taller, on top)
                const ciBar = document.createElement('div');
                ciBar.style.background = '#60a5fa';
                ciBar.style.height = Math.max((freq / 15) * 100, 3) + '%';
                ciBar.style.borderRadius = '2px 2px 0 0';
                ciBar.style.position = 'relative';
                ciBar.style.zIndex = '10';

                const label = document.createElement('div');
                label.textContent = letter;
                label.style.position = 'absolute';
                label.style.bottom = '-18px';
                label.style.left = '0';
                label.style.right = '0';
                label.style.textAlign = 'center';
                label.style.fontSize = '0.7rem';
                label.style.color = '#adb5bd';

                bar.appendChild(enBar);
                bar.appendChild(ciBar);
                bar.appendChild(label);
                container.appendChild(bar);
            }
        }

        function getFrequencyHint() {
            const sorted = Object.entries(cipherFreq)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);

            const englishSorted = Object.entries(ENGLISH_FREQ)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);

            let hint = 'Top 5 cipher letters (most frequent):\n';
            sorted.forEach((e, i) => {
                hint += `${e[0]} (${e[1].toFixed(1)}%) likely = ${englishSorted[i][0]}\n`;
            });

            const msg = document.getElementById('hintMsg');
            msg.textContent = hint;
            msg.style.display = 'block';
        }

        function applyMapping() {
            const input = document.getElementById('mapInput').value.trim();
            if (!input) return;

            // Parse "A→E" or "A=E" or "A E"
            const match = input.match(/([A-Z])\s*[→=]\s*([A-Z])/i);
            if (!match) {
                alert('Format: A→E (cipher letter → plain letter)');
                return;
            }

            const cipher = match[1].toUpperCase();
            const plain = match[2].toUpperCase();

            // Check for conflict
            for (let k in mapping) {
                if (mapping[k] === plain && k !== cipher) {
                    alert(`${plain} is already mapped from ${k}. Delete that first.`);
                    return;
                }
            }

            mapping[cipher] = plain;
            document.getElementById('mapInput').value = '';
            renderMappingTable();
            updatePlaintext();
        }

        function clearMapping() {
            mapping = {};
            document.getElementById('mapInput').value = '';
            renderMappingTable();
            updatePlaintext();
            document.getElementById('hintMsg').style.display = 'none';
        }

        function deleteMapping(cipher) {
            delete mapping[cipher];
            renderMappingTable();
            updatePlaintext();
        }

        function renderMappingTable() {
            const table = document.getElementById('mappingTable');
            table.innerHTML = '';

            const keys = Object.keys(mapping).sort();
            if (keys.length === 0) {
                table.innerHTML = '<div style="color: #6c757d; padding: 10px; text-align: center;">No mappings yet</div>';
                return;
            }

            keys.forEach(cipher => {
                const plain = mapping[cipher];
                const row = document.createElement('div');
                row.className = 'mapping-row';
                row.innerHTML = `
                    <div class="mapping-key">${cipher}</div>
                    <div class="mapping-arrow">→</div>
                    <div class="mapping-val">${plain}</div>
                    <button class="mapping-del" onclick="deleteMapping('${cipher}')">Delete</button>
                `;
                table.appendChild(row);
            });
        }

        function updatePlaintext() {
            const plaintext = Array.from(ciphertext).map(letter => {
                return mapping[letter] || letter;
            }).join('');

            document.getElementById('plaintext').value = plaintext;
            updateCoherence(plaintext);
        }

        function updateCoherence(plaintext) {
            const words = plaintext.toLowerCase().split(/[^a-z]+/).filter(w => w.length > 0);
            if (words.length === 0) {
                document.getElementById('coherenceScore').textContent = '0%';
                return;
            }

            const matched = words.filter(w => ENGLISH_WORDS.has(w)).length;
            const score = Math.round((matched / words.length) * 100);
            document.getElementById('coherenceScore').textContent = score + '%';
        }

        function autoSolve() {
            if (ciphertext.length === 0) {
                alert('Analyze ciphertext first.');
                return;
            }

            // Simulated annealing: start random, refine by swapping
            let best = { ...mapping };
            let bestScore = scoreMapping(best);

            let current = { ...mapping };
            let currentScore = bestScore;
            let temp = 100;

            for (let iter = 0; iter < 300; iter++) {
                temp *= 0.97; // cool down

                // Random swap
                const cipherLetters = Object.keys(current);
                if (cipherLetters.length === 0) {
                    // Start with frequency hint
                    const sorted = Object.entries(cipherFreq).sort((a, b) => b[1] - a[1]);
                    const englishSorted = Object.entries(ENGLISH_FREQ).sort((a, b) => b[1] - a[1]);
                    for (let i = 0; i < Math.min(8, sorted.length); i++) {
                        current[sorted[i][0]] = englishSorted[i][0];
                    }
                } else {
                    // Random swap in current mapping
                    if (Math.random() < 0.5 && cipherLetters.length > 1) {
                        const i = Math.floor(Math.random() * cipherLetters.length);
                        const j = Math.floor(Math.random() * cipherLetters.length);
                        [current[cipherLetters[i]], current[cipherLetters[j]]] = 
                        [current[cipherLetters[j]], current[cipherLetters[i]]];
                    } else {
                        // Add a new mapping
                        const unused = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').find(
                            l => !Object.values(current).includes(l)
                        );
                        if (unused) {
                            const randCipher = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.floor(Math.random() * 26)];
                            current[randCipher] = unused;
                        }
                    }
                }

                currentScore = scoreMapping(current);
                const delta = currentScore - bestScore;

                if (delta > 0 || Math.random() < Math.exp(delta / temp)) {
                    if (currentScore > bestScore) {
                        bestScore = currentScore;
                        best = { ...current };
                    }
                }
            }

            mapping = best;
            renderMappingTable();
            updatePlaintext();
        }

        function scoreMapping(m) {
            const plaintext = Array.from(ciphertext).map(l => m[l] || '_').join('');
            const words = plaintext.toLowerCase().split(/[^a-z]+/).filter(w => w.length > 0 && !w.includes('_'));
            if (words.length === 0) return 0;

            const matched = words.filter(w => ENGLISH_WORDS.has(w)).length;
            return matched;
        }

        function loadExample(type) {
            let text = '';
            if (type === 'caesar') {
                text = 'KHOOR ZRUOG'; // "HELLO WORLD" shifted by 3
            } else if (type === 'poe') {
                text = 'GSEO LD D ETASG OE D PIHVS VHPG GDVE PGHDGSY EDVS'; // poe example
            } else if (type === 'random') {
                // Random substitution of "THE QUICK BROWN FOX JUMPS OVER THE LAZY DOG"
                text = 'NVA MZQUD RWTLN OTM GZEBH TIAD NVA CHKC STD';
            }
            document.getElementById('ciphertext').value = text;
            analyzeCipher();
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            renderMappingTable();
        });
    </script>
</body>
</html>
