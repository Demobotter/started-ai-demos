<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lattice Forge — Crystal Growth Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Space Mono', monospace;
            background: #1a0a2e;
            color: #e0e0e0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
        }
        .header {
            grid-column: 1 / -1;
            margin-bottom: 10px;
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: #00ffff;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 13px;
            color: #00aa88;
        }
        .canvases {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        canvas {
            display: block;
            background: #0d0520;
            border: 2px solid #00aa88;
            border-radius: 6px;
            max-width: 100%;
        }
        .control-panel {
            background: #0f0820;
            border: 2px solid #00aa88;
            border-radius: 6px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 800px;
            overflow-y: auto;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .control-label {
            font-size: 12px;
            color: #00ffff;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #1a0a2e;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00ffff;
            cursor: pointer;
            box-shadow: 0 0 8px #00ffff;
        }
        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00ffff;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 8px #00ffff;
        }
        select {
            background: #1a0a2e;
            color: #00ffff;
            border: 1px solid #00aa88;
            padding: 6px;
            border-radius: 3px;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            cursor: pointer;
        }
        option {
            background: #1a0a2e;
            color: #00ffff;
        }
        button {
            background: #00aa88;
            color: #1a0a2e;
            border: none;
            padding: 8px 12px;
            border-radius: 3px;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.2s;
        }
        button:hover {
            background: #00ffff;
        }
        button.toggle-off {
            background: #333;
            color: #888;
        }
        button.toggle-off:hover {
            background: #444;
        }
        .stat-box {
            background: rgba(0, 170, 136, 0.1);
            border-left: 2px solid #00aa88;
            padding: 8px 10px;
            border-radius: 3px;
            font-size: 11px;
        }
        .stat-label {
            color: #00aa88;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.5px;
        }
        .stat-value {
            color: #00ffff;
            font-weight: bold;
            font-size: 14px;
            margin-top: 2px;
        }
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .button-group button {
            padding: 6px 8px;
            font-size: 10px;
        }
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
            .control-panel {
                grid-column: 1;
                max-height: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Lattice Forge</h1>
            <p>Interactive crystal growth simulator with real materials science</p>
        </div>

        <div class="canvases">
            <canvas id="crystalCanvas" width="800" height="300"></canvas>
            <canvas id="graphCanvas" width="800" height="200"></canvas>
        </div>

        <div class="control-panel">
            <div class="control-group">
                <label class="control-label">Temperature (K)</label>
                <input type="range" id="tempSlider" min="50" max="500" value="273" step="5">
                <div class="stat-box">
                    <div class="stat-label">Current</div>
                    <div class="stat-value" id="tempDisplay">273 K</div>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">Saturation (%)</label>
                <input type="range" id="satSlider" min="0" max="100" value="85" step="5">
                <div class="stat-box">
                    <div class="stat-label">Dissolved Solute</div>
                    <div class="stat-value" id="satDisplay">85%</div>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">Seed Size</label>
                <input type="range" id="seedSlider" min="1" max="8" value="3" step="1">
                <div class="stat-box">
                    <div class="stat-label">Initial Radius</div>
                    <div class="stat-value" id="seedDisplay">3 cells</div>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">Cooling Rate</label>
                <select id="coolingSelect">
                    <option value="slow">Slow</option>
                    <option value="medium" selected>Medium</option>
                    <option value="fast">Fast</option>
                </select>
            </div>

            <div class="control-group">
                <label class="control-label">Crystal Type</label>
                <select id="typeSelect">
                    <option value="cubic" selected>Cubic (Salt)</option>
                    <option value="hex">Hexagonal (Snow)</option>
                    <option value="ortho">Orthorhombic (Sugar)</option>
                </select>
            </div>

            <div class="control-group">
                <label class="control-label">Nucleation</label>
                <input type="range" id="nucleationSlider" min="1" max="4" value="1" step="1">
                <div class="stat-box">
                    <div class="stat-label">Seed Sites</div>
                    <div class="stat-value" id="nucleationDisplay">1</div>
                </div>
            </div>

            <div class="button-group">
                <button id="impurityToggle" class="toggle-off">Impurities Off</button>
                <button id="resetBtn">Reset</button>
            </div>

            <div class="stat-box">
                <div class="stat-label">Growth Rate</div>
                <div class="stat-value" id="growthRate">0 cells/s</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">Crystal Size</div>
                <div class="stat-value" id="crystalSize">0 units</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">Simulation Time</div>
                <div class="stat-value" id="simTime">0.0 s</div>
            </div>
        </div>
    </div>

    <script>
        const crystalCanvas = document.getElementById('crystalCanvas');
        const crystalCtx = crystalCanvas.getContext('2d');
        const graphCanvas = document.getElementById('graphCanvas');
        const graphCtx = graphCanvas.getContext('2d');

        // UI Elements
        const tempSlider = document.getElementById('tempSlider');
        const satSlider = document.getElementById('satSlider');
        const seedSlider = document.getElementById('seedSlider');
        const coolingSelect = document.getElementById('coolingSelect');
        const typeSelect = document.getElementById('typeSelect');
        const nucleationSlider = document.getElementById('nucleationSlider');
        const impurityToggle = document.getElementById('impurityToggle');
        const resetBtn = document.getElementById('resetBtn');

        // State
        let state = {
            time: 0,
            temperature: 273,
            saturation: 85,
            seedSize: 3,
            coolingRate: 'medium',
            crystalType: 'cubic',
            nucleationSites: 1,
            impuritiesEnabled: false,
            crystals: [],
            soluteMolecules: [],
            graphHistory: []
        };

        // Constants
        const K_B = 1.38e-23; // Boltzmann constant
        const E_A = 150000; // Activation energy (J/mol) for typical salt
        const R = 8.314; // Gas constant

        function initializeCrystals() {
            state.crystals = [];
            state.soluteMolecules = [];
            state.graphHistory = [];
            state.time = 0;

            const canvasWidth = crystalCanvas.width;
            const canvasHeight = crystalCanvas.height;
            const cellSize = 4;

            for (let i = 0; i < state.nucleationSites; i++) {
                const angle = (i / state.nucleationSites) * Math.PI * 2;
                const cx = canvasWidth / 2 + Math.cos(angle) * 60;
                const cy = canvasHeight / 2 + Math.sin(angle) * 60;

                state.crystals.push({
                    cx: cx,
                    cy: cy,
                    radius: state.seedSize,
                    cells: generateInitialLattice(state.seedSize),
                    defects: state.impuritiesEnabled ? Math.random() * 5 : 0
                });
            }

            // Initialize solute molecules
            for (let i = 0; i < 300; i++) {
                state.soluteMolecules.push({
                    x: Math.random() * canvasWidth,
                    y: Math.random() * canvasHeight,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5
                });
            }
        }

        function generateInitialLattice(radius) {
            const cells = [];
            for (let x = -radius; x <= radius; x++) {
                for (let y = -radius; y <= radius; y++) {
                    if (x*x + y*y <= radius*radius) {
                        cells.push({ x, y, defect: Math.random() < 0.02 && state.impuritiesEnabled });
                    }
                }
            }
            return cells;
        }

        function calculateAttachmentRate() {
            const T = state.temperature;
            const satRatio = state.saturation / 100;

            // Arrhenius equation: rate = A * sat * exp(-E_a / (k_b * T))
            const exponent = -E_A / (K_B * T);
            const rate = Math.max(0.1, Math.exp(exponent)) * satRatio;

            return rate;
        }

        function updateCrystals(dt) {
            if (state.saturation < 30) return;

            const attachmentRate = calculateAttachmentRate();
            const speedMult = state.coolingRate === 'slow' ? 0.5 : (state.coolingRate === 'fast' ? 2 : 1);

            for (let crystal of state.crystals) {
                const growthChance = attachmentRate * speedMult * dt * 0.1;

                if (Math.random() < growthChance) {
                    const newCells = [];
                    for (let cell of crystal.cells) {
                        // Check 4 neighbors
                        const neighbors = [
                            {x: cell.x + 1, y: cell.y},
                            {x: cell.x - 1, y: cell.y},
                            {x: cell.x, y: cell.y + 1},
                            {x: cell.x, y: cell.y - 1}
                        ];

                        for (let nb of neighbors) {
                            if (!crystal.cells.some(c => c.x === nb.x && c.y === nb.y) &&
                                !newCells.some(c => c.x === nb.x && c.y === nb.y)) {
                                newCells.push({
                                    x: nb.x,
                                    y: nb.y,
                                    defect: state.impuritiesEnabled && Math.random() < 0.02
                                });
                            }
                        }
                    }

                    if (newCells.length > 0) {
                        const idx = Math.floor(Math.random() * newCells.length);
                        crystal.cells.push(newCells[idx]);
                        crystal.radius = Math.max(crystal.radius, 
                            Math.sqrt(newCells[idx].x*newCells[idx].x + newCells[idx].y*newCells[idx].y));
                    }
                }

                // Ostwald ripening: larger crystals steal from smaller ones
                if (state.crystals.length > 1 && Math.random() < 0.01) {
                    const sizes = state.crystals.map(c => c.radius);
                    const largestSize = Math.max(...sizes);
                    const smallestSize = Math.min(...sizes);

                    if (crystal.radius < largestSize * 0.8 && crystal.radius < smallestSize + 1) {
                        if (crystal.cells.length > 3) {
                            crystal.cells.pop();
                            crystal.radius = Math.max(1, crystal.radius - 0.5);
                        }
                    }
                }
            }
        }

        function updateSoluteMolecules(dt) {
            for (let mol of state.soluteMolecules) {
                mol.x += mol.vx;
                mol.y += mol.vy;

                // Brownian motion
                mol.vx += (Math.random() - 0.5) * 0.1;
                mol.vy += (Math.random() - 0.5) * 0.1;

                // Clamp velocity
                const speed = Math.sqrt(mol.vx*mol.vx + mol.vy*mol.vy);
                if (speed > 2) {
                    mol.vx = (mol.vx / speed) * 2;
                    mol.vy = (mol.vy / speed) * 2;
                }

                // Bounce off edges
                if (mol.x < 0 || mol.x > crystalCanvas.width) mol.vx *= -1;
                if (mol.y < 0 || mol.y > crystalCanvas.height) mol.vy *= -1;

                mol.x = Math.max(0, Math.min(crystalCanvas.width, mol.x));
                mol.y = Math.max(0, Math.min(crystalCanvas.height, mol.y));
            }
        }

        function drawCrystal() {
            crystalCtx.fillStyle = '#0d0520';
            crystalCtx.fillRect(0, 0, crystalCanvas.width, crystalCanvas.height);

            // Draw solute molecules
            crystalCtx.fillStyle = 'rgba(77, 168, 218, 0.3)';
            for (let mol of state.soluteMolecules) {
                crystalCtx.beginPath();
                crystalCtx.arc(mol.x, mol.y, 1.5, 0, Math.PI * 2);
                crystalCtx.fill();
            }

            const cellSize = 4;
            const offsetX = crystalCanvas.width / 2;
            const offsetY = crystalCanvas.height / 2;

            // Draw crystals
            for (let crystal of state.crystals) {
                for (let cell of crystal.cells) {
                    const px = crystal.cx + cell.x * cellSize;
                    const py = crystal.cy + cell.y * cellSize;

                    if (cell.defect) {
                        crystalCtx.fillStyle = '#ff3333';
                    } else {
                        // Layer stacking illusion
                        const depth = Math.abs(cell.x) + Math.abs(cell.y);
                        const intensity = Math.max(0, 1 - depth * 0.05);
                        crystalCtx.fillStyle = `rgba(0, 255, 255, ${0.7 + intensity * 0.3})`;
                    }

                    crystalCtx.fillRect(px - cellSize/2, py - cellSize/2, cellSize, cellSize);

                    // Secondary lattice lines
                    crystalCtx.strokeStyle = 'rgba(0, 170, 136, 0.3)';
                    crystalCtx.lineWidth = 0.5;
                    crystalCtx.strokeRect(px - cellSize/2, py - cellSize/2, cellSize, cellSize);
                }
            }

            // Draw border
            crystalCtx.strokeStyle = '#00aa88';
            crystalCtx.lineWidth = 2;
            crystalCtx.strokeRect(0, 0, crystalCanvas.width, crystalCanvas.height);
        }

        function drawGraph() {
            graphCtx.fillStyle = '#0d0520';
            graphCtx.fillRect(0, 0, graphCanvas.width, graphCanvas.height);

            // Grid
            graphCtx.strokeStyle = 'rgba(0, 170, 136, 0.2)';
            graphCtx.lineWidth = 1;
            for (let i = 0; i <= 10; i++) {
                const x = (graphCanvas.width / 10) * i;
                graphCtx.beginPath();
                graphCtx.moveTo(x, 0);
                graphCtx.lineTo(x, graphCanvas.height);
                graphCtx.stroke();

                const y = (graphCanvas.height / 5) * i;
                graphCtx.beginPath();
                graphCtx.moveTo(0, y);
                graphCtx.lineTo(graphCanvas.width, y);
                graphCtx.stroke();
            }

            // Plot data
            if (state.graphHistory.length > 1) {
                const maxSize = Math.max(...state.graphHistory.map(h => h.size), 50);
                const xScale = graphCanvas.width / Math.max(100, state.time);
                const yScale = graphCanvas.height / maxSize;

                graphCtx.strokeStyle = '#00ffff';
                graphCtx.lineWidth = 2;
                graphCtx.beginPath();

                for (let i = 0; i < state.graphHistory.length; i++) {
                    const h = state.graphHistory[i];
                    const x = h.time * xScale;
                    const y = graphCanvas.height - h.size * yScale;

                    if (i === 0) graphCtx.moveTo(x, y);
                    else graphCtx.lineTo(x, y);
                }
                graphCtx.stroke();
            }

            // Axes
            graphCtx.strokeStyle = '#00aa88';
            graphCtx.lineWidth = 2;
            graphCtx.beginPath();
            graphCtx.moveTo(0, graphCanvas.height);
            graphCtx.lineTo(graphCanvas.width, graphCanvas.height);
            graphCtx.stroke();

            graphCtx.beginPath();
            graphCtx.moveTo(0, 0);
            graphCtx.lineTo(0, graphCanvas.height);
            graphCtx.stroke();

            // Labels
            graphCtx.fillStyle = '#00aa88';
            graphCtx.font = '10px Space Mono';
            graphCtx.fillText('Time (s)', graphCanvas.width - 50, graphCanvas.height - 5);
            graphCtx.fillText('Size', 5, 15);
        }

        function updateStats() {
            const totalSize = state.crystals.reduce((sum, c) => sum + c.cells.length, 0);
            const attachmentRate = calculateAttachmentRate();

            document.getElementById('tempDisplay').textContent = `${Math.round(state.temperature)} K`;
            document.getElementById('satDisplay').textContent = `${state.saturation}%`;
            document.getElementById('seedDisplay').textContent = `${state.seedSize} cells`;
            document.getElementById('nucleationDisplay').textContent = `${state.nucleationSites}`;
            document.getElementById('growthRate').textContent = `${(attachmentRate * 10).toFixed(1)} cells/s`;
            document.getElementById('crystalSize').textContent = `${totalSize} units`;
            document.getElementById('simTime').textContent = `${(state.time / 1000).toFixed(1)} s`;
        }

        function animate() {
            const dt = 1000 / 60; // ~16ms per frame

            state.time += dt;
            updateCrystals(dt);
            updateSoluteMolecules(dt);

            const totalSize = state.crystals.reduce((sum, c) => sum + c.cells.length, 0);
            state.graphHistory.push({ time: state.time, size: totalSize });
            if (state.graphHistory.length > 500) state.graphHistory.shift();

            drawCrystal();
            drawGraph();
            updateStats();

            requestAnimationFrame(animate);
        }

        // Event listeners
        tempSlider.addEventListener('input', (e) => {
            state.temperature = parseInt(e.target.value);
        });

        satSlider.addEventListener('input', (e) => {
            state.saturation = parseInt(e.target.value);
        });

        seedSlider.addEventListener('input', (e) => {
            state.seedSize = parseInt(e.target.value);
        });

        coolingSelect.addEventListener('change', (e) => {
            state.coolingRate = e.target.value;
        });

        typeSelect.addEventListener('change', (e) => {
            state.crystalType = e.target.value;
        });

        nucleationSlider.addEventListener('input', (e) => {
            state.nucleationSites = parseInt(e.target.value);
            initializeCrystals();
        });

        impurityToggle.addEventListener('click', () => {
            state.impuritiesEnabled = !state.impuritiesEnabled;
            impurityToggle.textContent = state.impuritiesEnabled ? 'Impurities On' : 'Impurities Off';
            impurityToggle.classList.toggle('toggle-off');
            initializeCrystals();
        });

        resetBtn.addEventListener('click', () => {
            initializeCrystals();
        });

        // Start
        initializeCrystals();
        animate();
    </script>
</body>
</html>
