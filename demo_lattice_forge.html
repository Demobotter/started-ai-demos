<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lattice Forge — Crystal Structure Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Lato:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Lato', sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #2a2a3a 100%);
      color: #f9f9f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      background: rgba(20, 20, 30, 0.9);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 217, 255, 0.1);
    }
    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 32px;
      margin-bottom: 30px;
      grid-column: 1 / -1;
      text-align: center;
      background: linear-gradient(90deg, #00d9ff, #c9a961);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .panel {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .control-label {
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #00d9ff;
    }
    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button {
      padding: 12px 16px;
      background: #2a4f5f;
      border: 2px solid #00d9ff;
      color: #00d9ff;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 13px;
    }
    button:hover {
      background: #00d9ff;
      color: #1a1a1a;
      transform: translateY(-2px);
    }
    button.active {
      background: #00d9ff;
      color: #1a1a1a;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    input[type="range"] {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: #3a4f5f;
      outline: none;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #00d9ff;
      cursor: pointer;
      transition: all 0.2s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      box-shadow: 0 0 12px #00d9ff;
      transform: scale(1.2);
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #00d9ff;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    input[type="range"]::-moz-range-thumb:hover {
      box-shadow: 0 0 12px #00d9ff;
      transform: scale(1.2);
    }
    .value-display {
      min-width: 60px;
      text-align: right;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      color: #ffd700;
      font-size: 14px;
    }
    .stats-panel {
      background: rgba(10, 50, 60, 0.6);
      padding: 16px;
      border-radius: 8px;
      border-left: 3px solid #c9a961;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 13px;
    }
    .stat-label {
      color: #888;
    }
    .stat-value {
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      color: #00d9ff;
    }
    canvas {
      width: 100%;
      height: 500px;
      background: rgba(10, 20, 30, 0.8);
      border-radius: 8px;
      border: 2px solid #2d5f5f;
    }
    .start-button {
      grid-column: 1 / -1;
      padding: 14px;
      background: linear-gradient(90deg, #c9a961, #ffd700);
      color: #1a1a1a;
      font-size: 16px;
      font-weight: 700;
      border: none;
    }
    .start-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(201, 169, 97, 0.4);
    }
    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 20px;
      }
      h1 {
        font-size: 24px;
      }
      canvas {
        height: 400px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚛️ Lattice Forge</h1>

    <div class="panel">
      <!-- Crystal System Selection -->
      <div class="control-group">
        <label class="control-label">Crystal System</label>
        <div class="button-group">
          <button id="btn-quartz" class="crystal-btn active">Quartz (Hex)</button>
          <button id="btn-diamond" class="crystal-btn">Diamond (Cubic)</button>
          <button id="btn-calcite" class="crystal-btn">Calcite (Trig)</button>
          <button id="btn-feldspar" class="crystal-btn">Feldspar (Tric)</button>
        </div>
      </div>

      <!-- Rotation Controls -->
      <div class="control-group">
        <label class="control-label">Rotation (°)</label>
        <div class="slider-row">
          <span style="font-size: 12px; color: #888; min-width: 20px;">X</span>
          <input type="range" id="rotX" min="0" max="360" value="45" />
          <span id="valX" class="value-display">45°</span>
        </div>
        <div class="slider-row">
          <span style="font-size: 12px; color: #888; min-width: 20px;">Y</span>
          <input type="range" id="rotY" min="0" max="360" value="30" />
          <span id="valY" class="value-display">30°</span>
        </div>
        <div class="slider-row">
          <span style="font-size: 12px; color: #888; min-width: 20px;">Z</span>
          <input type="range" id="rotZ" min="0" max="360" value="20" />
          <span id="valZ" class="value-display">20°</span>
        </div>
      </div>

      <!-- Zoom Control -->
      <div class="control-group">
        <label class="control-label">Zoom</label>
        <div class="slider-row">
          <input type="range" id="zoom" min="0.5" max="3" step="0.1" value="1.5" />
          <span id="valZoom" class="value-display">1.5×</span>
        </div>
      </div>

      <!-- Growth Mode -->
      <div class="control-group">
        <label class="control-label">Growth Mode</label>
        <div class="button-group">
          <button id="btn-cool" class="growth-btn active">Cool Growth</button>
          <button id="btn-quench" class="growth-btn">Fast Quench</button>
        </div>
      </div>

      <!-- Growth Speed -->
      <div class="control-group">
        <label class="control-label">Growth Speed</label>
        <div class="slider-row">
          <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1" />
          <span id="valSpeed" class="value-display">1.0×</span>
        </div>
      </div>

      <!-- Start Button -->
      <button class="start-button" id="startBtn">▶ Start Growth Animation</button>

      <!-- Stats Panel -->
      <div class="stats-panel">
        <div class="stat-row">
          <span class="stat-label">Crystal System:</span>
          <span class="stat-value" id="stat-system">Quartz (Hex)</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Lattice a:</span>
          <span class="stat-value" id="stat-a">4.91 Å</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Lattice c:</span>
          <span class="stat-value" id="stat-c">5.40 Å</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Unit Cell Vol:</span>
          <span class="stat-value" id="stat-vol">113.9 Ų</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Atoms/Cell:</span>
          <span class="stat-value" id="stat-atoms">3</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Density Est.:</span>
          <span class="stat-value" id="stat-density">2.65 g/cm³</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Mohs Hardness:</span>
          <span class="stat-value" id="stat-hardness">7</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Animation:</span>
          <span class="stat-value" id="stat-anim">Ready</span>
        </div>
      </div>
    </div>

    <!-- Canvas -->
    <div>
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <script>
    // Crystal data: lattice parameters (Ångströms), atomic masses (amu), density (g/cm³), hardness
    const crystalData = {
      quartz: {
        name: 'Quartz (Hexagonal)',
        a: 4.91,
        c: 5.40,
        atoms: 3,
        mass: 60.08, // SiO₂ formula unit
        density: 2.65,
        hardness: 7,
        color: '#c9a961',
        description: 'SiO₂ hexagonal'
      },
      diamond: {
        name: 'Diamond (Cubic)',
        a: 3.57,
        c: 3.57,
        atoms: 8,
        mass: 12.01,
        density: 3.52,
        hardness: 10,
        color: '#888888',
        description: 'C cubic'
      },
      calcite: {
        name: 'Calcite (Trigonal)',
        a: 4.99,
        c: 17.06,
        atoms: 10,
        mass: 100.09, // CaCO₃
        density: 2.71,
        hardness: 3,
        color: '#ff9800',
        description: 'CaCO₃ trigonal'
      },
      feldspar: {
        name: 'Feldspar (Triclinic)',
        a: 8.56,
        c: 5.29,
        atoms: 4,
        mass: 268.13, // KAlSi₃O₈
        density: 2.56,
        hardness: 6,
        color: '#ff6b6b',
        description: 'KAlSi₃O₈ triclinic'
      }
    };

    let currentCrystal = 'quartz';
    let rotationX = 45, rotationY = 30, rotationZ = 20;
    let zoom = 1.5;
    let growthMode = 'cool';
    let growthSpeed = 1.0;
    let isAnimating = false;
    let animationFrame = 0;
    let maxFrames = 300;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Set canvas size
    function resizeCanvas() {
      canvas.width = canvas.offsetWidth * window.devicePixelRatio;
      canvas.height = canvas.offsetHeight * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // UI Elements
    document.querySelectorAll('.crystal-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.crystal-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentCrystal = e.target.id.replace('btn-', '');
        updateStats();
      });
    });

    document.querySelectorAll('.growth-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.growth-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        growthMode = e.target.id.replace('btn-', '');
      });
    });

    document.getElementById('rotX').addEventListener('input', (e) => {
      rotationX = parseFloat(e.target.value);
      document.getElementById('valX').textContent = rotationX + '°';
    });

    document.getElementById('rotY').addEventListener('input', (e) => {
      rotationY = parseFloat(e.target.value);
      document.getElementById('valY').textContent = rotationY + '°';
    });

    document.getElementById('rotZ').addEventListener('input', (e) => {
      rotationZ = parseFloat(e.target.value);
      document.getElementById('valZ').textContent = rotationZ + '°';
    });

    document.getElementById('zoom').addEventListener('input', (e) => {
      zoom = parseFloat(e.target.value);
      document.getElementById('valZoom').textContent = zoom.toFixed(1) + '×';
    });

    document.getElementById('speed').addEventListener('input', (e) => {
      growthSpeed = parseFloat(e.target.value);
      document.getElementById('valSpeed').textContent = growthSpeed.toFixed(1) + '×';
    });

    document.getElementById('startBtn').addEventListener('click', () => {
      isAnimating = true;
      animationFrame = 0;
      document.getElementById('stat-anim').textContent = 'Growing...';
    });

    function updateStats() {
      const crystal = crystalData[currentCrystal];
      document.getElementById('stat-system').textContent = crystal.name;
      document.getElementById('stat-a').textContent = crystal.a.toFixed(2) + ' Å';
      document.getElementById('stat-c').textContent = crystal.c.toFixed(2) + ' Å';
      const vol = crystal.a * crystal.a * crystal.c * 0.866; // hexagonal volume approximation
      document.getElementById('stat-vol').textContent = vol.toFixed(1) + ' Ų';
      document.getElementById('stat-atoms').textContent = crystal.atoms;
      document.getElementById('stat-density').textContent = crystal.density.toFixed(2) + ' g/cm³';
      document.getElementById('stat-hardness').textContent = crystal.hardness;
    }

    // 3D projection function
    function project3D(x, y, z) {
      const rad = Math.PI / 180;
      const rx = rotationX * rad, ry = rotationY * rad, rz = rotationZ * rad;

      // Rotation matrices
      let x1 = x, y1 = y * Math.cos(rx) - z * Math.sin(rx), z1 = y * Math.sin(rx) + z * Math.cos(rx);
      let x2 = x1 * Math.cos(ry) + z1 * Math.sin(ry), y2 = y1, z2 = -x1 * Math.sin(ry) + z1 * Math.cos(ry);
      let x3 = x2 * Math.cos(rz) - y2 * Math.sin(rz), y3 = x2 * Math.sin(rz) + y2 * Math.cos(rz);

      // Isometric projection
      const scale = zoom * 40;
      const screenX = (x3 - y3) * scale + canvas.width / 2 / window.devicePixelRatio;
      const screenY = (x3 + y3) * 0.5 * scale + canvas.height / 2 / window.devicePixelRatio - 50;

      return { x: screenX, y: screenY, z: z2 };
    }

    // Generate lattice atoms
    function generateLattice() {
      const crystal = crystalData[currentCrystal];
      const atoms = [];
      const scale = currentCrystal === 'diamond' ? 1 : 1.5;

      // Generate unit cells (3×3×2 super cell)
      for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
          for (let k = 0; k < 2; k++) {
            const baseX = i * crystal.a / 10;
            const baseY = j * crystal.a / 10;
            const baseZ = k * crystal.c / 10;

            if (currentCrystal === 'quartz') {
              atoms.push({ x: baseX, y: baseY, z: baseZ, type: 'Si' });
              atoms.push({ x: baseX + 0.3, y: baseY + 0.3, z: baseZ + 0.2, type: 'O' });
              atoms.push({ x: baseX - 0.3, y: baseY - 0.3, z: baseZ - 0.2, type: 'O' });
            } else if (currentCrystal === 'diamond') {
              atoms.push({ x: baseX, y: baseY, z: baseZ, type: 'C' });
              atoms.push({ x: baseX + 0.18, y: baseY + 0.18, z: baseZ + 0.18, type: 'C' });
            } else if (currentCrystal === 'calcite') {
              atoms.push({ x: baseX, y: baseY, z: baseZ, type: 'Ca' });
              atoms.push({ x: baseX + 0.3, y: baseY, z: baseZ, type: 'C' });
              atoms.push({ x: baseX + 0.2, y: baseY + 0.2, z: baseZ - 0.25, type: 'O' });
            } else if (currentCrystal === 'feldspar') {
              atoms.push({ x: baseX, y: baseY, z: baseZ, type: 'K' });
              atoms.push({ x: baseX + 0.4, y: baseY, z: baseZ, type: 'Al' });
              atoms.push({ x: baseX, y: baseY + 0.4, z: baseZ + 0.3, type: 'Si' });
            }
          }
        }
      }

      return atoms;
    }

    // Atom colors
    function getAtomColor(type) {
      const colors = {
        Si: '#c9a961',
        O: '#d64545',
        C: '#888888',
        Ca: '#ff9800',
        Al: '#ff6b6b',
        K: '#4db8ff'
      };
      return colors[type] || '#888888';
    }

    // Draw frame
    function draw() {
      ctx.clearRect(0, 0, canvas.width / window.devicePixelRatio, canvas.height / window.devicePixelRatio);
      ctx.fillStyle = 'rgba(10, 20, 30, 0.3)';
      ctx.fillRect(0, 0, canvas.width / window.devicePixelRatio, canvas.height / window.devicePixelRatio);

      const atoms = generateLattice();

      // Sort atoms by Z (painter's algorithm)
      atoms.sort((a, b) => a.z - b.z);

      // Draw bonds first (thin lines)
      ctx.strokeStyle = 'rgba(0, 217, 255, 0.2)';
      ctx.lineWidth = 1;
      for (let i = 0; i < atoms.length; i++) {
        for (let j = i + 1; j < atoms.length; j++) {
          const dx = atoms[i].x - atoms[j].x;
          const dy = atoms[i].y - atoms[j].y;
          const dz = atoms[i].z - atoms[j].z;
          const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
          if (dist < 0.5 && dist > 0.01) { // van-der-Waals cutoff
            const p1 = project3D(atoms[i].x, atoms[i].y, atoms[i].z);
            const p2 = project3D(atoms[j].x, atoms[j].y, atoms[j].z);
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }
        }
      }

      // Draw atoms (spheres)
      atoms.forEach((atom, idx) => {
        const progress = isAnimating ? Math.min(animationFrame / maxFrames, 1) : 1;
        const alpha = Math.min(1, progress + 0.3);

        const p = project3D(atom.x, atom.y, atom.z);
        const radius = currentCrystal === 'diamond' ? 3 : 4;

        // Glow effect
        const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, radius * 2);
        gradient.addColorStop(0, getAtomColor(atom.type) + '60');
        gradient.addColorStop(1, getAtomColor(atom.type) + '00');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius * 2, 0, Math.PI * 2);
        ctx.fill();

        // Solid atom
        ctx.fillStyle = getAtomColor(atom.type);
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fill();

        // Highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.beginPath();
        ctx.arc(p.x - radius / 3, p.y - radius / 3, radius / 3, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw info text
      ctx.fillStyle = '#00d9ff';
      ctx.font = 'bold 14px Poppins';
      ctx.fillText(crystalData[currentCrystal].name, 20, 30);

      if (isAnimating) {
        animationFrame += growthSpeed;
        if (animationFrame >= maxFrames) {
          isAnimating = false;
          document.getElementById('stat-anim').textContent = 'Complete';
        }
      }

      requestAnimationFrame(draw);
    }

    updateStats();
    draw();
  </script>
</body>
</html>
