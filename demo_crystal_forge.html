<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Forge</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #0a1a2e 0%, #0f2a3d 100%);
            color: #a8e6c1;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }
        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: #64c84f;
            margin-bottom: 10px;
            grid-column: 1 / -1;
        }
        .canvas-section {
            background: rgba(26, 39, 55, 0.6);
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid #4da8da;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        canvas {
            border: 1px solid #1f4d7f;
            border-radius: 8px;
            background: #0a1428;
            display: block;
            width: 100%;
            height: auto;
        }
        .controls-section {
            background: rgba(26, 39, 55, 0.6);
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid #4da8da;
            overflow-y: auto;
            max-height: 600px;
        }
        .control-group {
            margin-bottom: 20px;
        }
        .control-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #64c84f;
            font-weight: 700;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #1f4d7f;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #4da8da;
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #4da8da;
            cursor: pointer;
            border: none;
        }
        select {
            width: 100%;
            padding: 8px;
            background: #0a1a2e;
            color: #a8e6c1;
            border: 1px solid #1f4d7f;
            border-radius: 4px;
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
        }
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 15px;
        }
        button {
            padding: 10px;
            background: #0a1a2e;
            color: #a8e6c1;
            border: 1px solid #1f4d7f;
            border-radius: 4px;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background: #1f4d7f;
            border-color: #4da8da;
        }
        button.active {
            background: #4da8da;
            color: #0a1a2e;
            border-color: #4da8da;
        }
        .stat-box {
            background: rgba(13, 27, 42, 0.8);
            border-left: 4px solid #4da8da;
            padding: 12px;
            border-radius: 6px;
            margin-top: 12px;
            font-size: 0.85rem;
        }
        .stat-label {
            color: #64c84f;
            font-weight: 700;
        }
        .stat-value {
            color: #a8e6c1;
        }
        input[type="color"] {
            width: 100%;
            height: 40px;
            border: 1px solid #1f4d7f;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💎 Crystal Forge</h1>
        
        <div class="canvas-section">
            <canvas id="crystalCanvas" width="500" height="500"></canvas>
        </div>
        
        <div class="controls-section">
            <div class="control-group">
                <label for="crystalType">Crystal System</label>
                <select id="crystalType">
                    <option value="cubic">Cubic</option>
                    <option value="hexagonal">Hexagonal</option>
                    <option value="tetragonal">Tetragonal</option>
                    <option value="orthorhombic">Orthorhombic</option>
                    <option value="monoclinic">Monoclinic</option>
                    <option value="triclinic">Triclinic</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="growthSpeed">Growth Speed: <span id="speedValue">1x</span></label>
                <input type="range" id="growthSpeed" min="1" max="10" value="3">
            </div>
            
            <div class="control-group">
                <label for="temperature">Temperature: <span id="tempValue">500K</span></label>
                <input type="range" id="temperature" min="100" max="1000" value="500">
            </div>
            
            <div class="control-group">
                <label for="saturation">Saturation: <span id="satValue">75%</span></label>
                <input type="range" id="saturation" min="0" max="100" value="75">
            </div>
            
            <div class="control-group">
                <label for="element1Color">Element A Color</label>
                <input type="color" id="element1Color" value="#4da8da">
            </div>
            
            <div class="control-group">
                <label for="element2Color">Element B Color</label>
                <input type="color" id="element2Color" value="#ff7f50">
            </div>
            
            <div class="control-group">
                <label for="stoichRatio">Stoichiometry (A:B)</label>
                <input type="range" id="stoichRatio" min="0.5" max="3" step="0.5" value="1.5">
                <div class="stat-box" style="margin-top: 8px;">
                    <span class="stat-label">Ratio:</span> <span class="stat-value" id="ratioValue">A₁.₅B₁</span>
                </div>
            </div>
            
            <div class="button-group">
                <button id="bondsBtn">Show Bonds</button>
                <button id="symmetryBtn">Show Symmetry</button>
                <button id="unitCellBtn">Unit Cell</button>
                <button id="resetBtn">Reset</button>
            </div>
            
            <div class="stat-box">
                <div><span class="stat-label">Lattice:</span> <span class="stat-value" id="latticeValue">3.2 Å</span></div>
                <div><span class="stat-label">Atoms:</span> <span class="stat-value" id="atomCount">0</span></div>
                <div><span class="stat-label">Growth Rate:</span> <span class="stat-value" id="growthRate">+5 atoms/frame</span></div>
                <div><span class="stat-label">Density:</span> <span class="stat-value" id="densityValue">2.8 g/cm³</span></div>
                <div><span class="stat-label">Crystal Habit:</span> <span class="stat-value" id="habitValue">Cubic</span></div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('crystalCanvas');
        const ctx = canvas.getContext('2d');
        
        let crystalState = {
            type: 'cubic',
            atoms: [],
            showBonds: false,
            showSymmetry: false,
            showUnitCell: false,
            growthSpeed: 3,
            temperature: 500,
            saturation: 75,
            element1Color: '#4da8da',
            element2Color: '#ff7f50',
            stoichRatio: 1.5,
            atomCount: 0,
            latticeConstant: 3.2,
            disorder: 0.2
        };

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function generateCrystal() {
            crystalState.atoms = [];
            crystalState.atomCount = 0;
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const scale = 2;
            
            // Generate lattice points based on crystal type
            const latticePoints = [];
            const maxDist = 120;
            
            if (crystalState.type === 'cubic') {
                for (let x = -6; x <= 6; x++) {
                    for (let y = -6; y <= 6; y++) {
                        const dist = Math.sqrt(x*x + y*y);
                        if (dist < 8) {
                            latticePoints.push({x, y, element: (x + y) % 2 === 0 ? 'A' : 'B'});
                        }
                    }
                }
            } else if (crystalState.type === 'hexagonal') {
                for (let x = -6; x <= 6; x++) {
                    for (let y = -6; y <= 6; y++) {
                        const px = x + y * 0.5;
                        const py = y * 0.866;
                        const dist = Math.sqrt(px*px + py*py);
                        if (dist < 8) {
                            latticePoints.push({x: px, y: py, element: Math.abs(x + y) % 3 === 0 ? 'A' : 'B'});
                        }
                    }
                }
            } else if (crystalState.type === 'tetragonal') {
                for (let x = -6; x <= 6; x++) {
                    for (let y = -7; y <= 4; y++) {
                        const dist = Math.sqrt(x*x + y*y*1.4);
                        if (dist < 8) {
                            latticePoints.push({x, y: y * 1.2, element: (x * y) % 2 === 0 ? 'A' : 'B'});
                        }
                    }
                }
            } else if (crystalState.type === 'orthorhombic') {
                for (let x = -7; x <= 5; x++) {
                    for (let y = -6; y <= 6; y++) {
                        const dist = Math.sqrt(x*x*1.5 + y*y);
                        if (dist < 8) {
                            latticePoints.push({x: x * 1.2, y, element: (x + y) % 2 === 0 ? 'A' : 'B'});
                        }
                    }
                }
            } else {
                // monoclinic, triclinic: variations on cubic
                for (let x = -6; x <= 6; x++) {
                    for (let y = -6; y <= 6; y++) {
                        const shear = x * 0.3;
                        const dist = Math.sqrt((x + shear)*(x + shear) + y*y);
                        if (dist < 8) {
                            latticePoints.push({x: x + shear, y, element: (x + y) % 2 === 0 ? 'A' : 'B'});
                        }
                    }
                }
            }
            
            crystalState.atoms = latticePoints.map(pt => ({
                x: centerX + pt.x * scale * 8,
                y: centerY + pt.y * scale * 8,
                element: pt.element,
                r: 5 + (Math.random() - 0.5) * crystalState.disorder
            }));
            
            crystalState.atomCount = crystalState.atoms.length;
        }

        function drawCrystal() {
            ctx.fillStyle = '#0a1428';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw bonds if enabled
            if (crystalState.showBonds) {
                ctx.strokeStyle = 'rgba(77, 168, 218, 0.3)';
                ctx.lineWidth = 1;
                for (let i = 0; i < crystalState.atoms.length; i++) {
                    for (let j = i + 1; j < crystalState.atoms.length; j++) {
                        const a1 = crystalState.atoms[i];
                        const a2 = crystalState.atoms[j];
                        const dist = Math.sqrt((a1.x - a2.x)**2 + (a1.y - a2.y)**2);
                        if (dist < 20) {
                            ctx.beginPath();
                            ctx.moveTo(a1.x, a1.y);
                            ctx.lineTo(a2.x, a2.y);
                            ctx.stroke();
                        }
                    }
                }
            }
            
            // Draw atoms
            for (const atom of crystalState.atoms) {
                const color = atom.element === 'A' ? crystalState.element1Color : crystalState.element2Color;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(atom.x, atom.y, atom.r, 0, Math.PI * 2);
                ctx.fill();
                
                // Atom outline
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }
            
            // Draw symmetry axes if enabled
            if (crystalState.showSymmetry) {
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const axisLen = 100;
                
                const axes = {
                    'cubic': [0, 90, 45],
                    'hexagonal': [0, 60, 120],
                    'tetragonal': [0, 90, 45],
                    'orthorhombic': [0, 90],
                    'monoclinic': [0, 45],
                    'triclinic': [0, 30]
                };
                
                const colors = ['#ffff00', '#00d4ff', '#ff00ff', '#00ff88'];
                const symmAxes = axes[crystalState.type] || [0, 90];
                
                for (let i = 0; i < symmAxes.length; i++) {
                    const angle = symmAxes[i] * Math.PI / 180;
                    ctx.strokeStyle = colors[i % colors.length];
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.lineTo(cx + Math.cos(angle) * axisLen, cy + Math.sin(angle) * axisLen);
                    ctx.stroke();
                }
            }
            
            // Draw unit cell if enabled
            if (crystalState.showUnitCell) {
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const cellSize = 50;
                
                ctx.strokeStyle = 'rgba(224, 224, 224, 0.5)';
                ctx.lineWidth = 1;
                ctx.strokeRect(cx - cellSize/2, cy - cellSize/2, cellSize, cellSize);
            }
        }

        function updateStats() {
            document.getElementById('atomCount').textContent = crystalState.atomCount;
            document.getElementById('latticeValue').textContent = (crystalState.latticeConstant + (Math.random() - 0.5) * 0.2).toFixed(2) + ' Å';
            
            const growthRate = Math.floor(crystalState.growthSpeed * 2);
            document.getElementById('growthRate').textContent = `+${growthRate} atoms/frame`;
            
            const density = (2.5 + crystalState.saturation / 100 * 2).toFixed(2);
            document.getElementById('densityValue').textContent = density + ' g/cm³';
            
            const habits = {
                'cubic': 'Cubic',
                'hexagonal': 'Pyramidal',
                'tetragonal': 'Prismatic',
                'orthorhombic': 'Tabular',
                'monoclinic': 'Needlelike',
                'triclinic': 'Complex'
            };
            document.getElementById('habitValue').textContent = habits[crystalState.type];
        }

        function animate() {
            drawCrystal();
            updateStats();
            requestAnimationFrame(animate);
        }

        // Event listeners
        document.getElementById('crystalType').addEventListener('change', (e) => {
            crystalState.type = e.target.value;
            generateCrystal();
        });

        document.getElementById('growthSpeed').addEventListener('input', (e) => {
            crystalState.growthSpeed = parseInt(e.target.value);
            document.getElementById('speedValue').textContent = crystalState.growthSpeed + 'x';
        });

        document.getElementById('temperature').addEventListener('input', (e) => {
            crystalState.temperature = parseInt(e.target.value);
            crystalState.disorder = 0.1 + (crystalState.temperature - 100) / 1800;
            document.getElementById('tempValue').textContent = e.target.value + 'K';
        });

        document.getElementById('saturation').addEventListener('input', (e) => {
            crystalState.saturation = parseInt(e.target.value);
            document.getElementById('satValue').textContent = e.target.value + '%';
        });

        document.getElementById('element1Color').addEventListener('input', (e) => {
            crystalState.element1Color = e.target.value;
        });

        document.getElementById('element2Color').addEventListener('input', (e) => {
            crystalState.element2Color = e.target.value;
        });

        document.getElementById('stoichRatio').addEventListener('input', (e) => {
            crystalState.stoichRatio = parseFloat(e.target.value);
            const ratio = crystalState.stoichRatio.toFixed(1);
            document.getElementById('ratioValue').textContent = `A${ratio}B₁`;
        });

        document.getElementById('bondsBtn').addEventListener('click', function() {
            crystalState.showBonds = !crystalState.showBonds;
            this.classList.toggle('active');
        });

        document.getElementById('symmetryBtn').addEventListener('click', function() {
            crystalState.showSymmetry = !crystalState.showSymmetry;
            this.classList.toggle('active');
        });

        document.getElementById('unitCellBtn').addEventListener('click', function() {
            crystalState.showUnitCell = !crystalState.showUnitCell;
            this.classList.toggle('active');
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            crystalState = {
                type: 'cubic',
                atoms: [],
                showBonds: false,
                showSymmetry: false,
                showUnitCell: false,
                growthSpeed: 3,
                temperature: 500,
                saturation: 75,
                element1Color: '#4da8da',
                element2Color: '#ff7f50',
                stoichRatio: 1.5,
                atomCount: 0,
                latticeConstant: 3.2,
                disorder: 0.2
            };
            document.getElementById('crystalType').value = 'cubic';
            document.getElementById('growthSpeed').value = 3;
            document.getElementById('temperature').value = 500;
            document.getElementById('saturation').value = 75;
            document.getElementById('speedValue').textContent = '3x';
            document.getElementById('tempValue').textContent = '500K';
            document.getElementById('satValue').textContent = '75%';
            document.getElementById('bondsBtn').classList.remove('active');
            document.getElementById('symmetryBtn').classList.remove('active');
            document.getElementById('unitCellBtn').classList.remove('active');
            generateCrystal();
        });

        // Initialize
        generateCrystal();
        animate();
    </script>
</body>
</html>
