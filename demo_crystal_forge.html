<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crystal Forge</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Space Mono', monospace;
      background: linear-gradient(135deg, #0a1a2e 0%, #1a3a4a 100%);
      color: #e8e8e8;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
    }
    h1 {
      grid-column: 1 / -1;
      font-family: 'Playfair Display', serif;
      font-size: 2.2em;
      text-align: center;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #64c84f, #4da8da);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .canvas-wrapper {
      background: #0f2035;
      border: 1px solid #1f4d7f;
      border-radius: 8px;
      padding: 15px;
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: 600px;
      border-radius: 4px;
      background: #0a1428;
    }
    .controls {
      background: #0f2035;
      border: 1px solid #1f4d7f;
      border-radius: 8px;
      padding: 15px;
      max-height: 700px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 0.85em;
      color: #a8e6c1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }
    select, input[type="range"], input[type="number"] {
      padding: 6px 8px;
      background: #0a1428;
      color: #e8e8e8;
      border: 1px solid #1f4d7f;
      border-radius: 4px;
      font-family: 'Space Mono', monospace;
      font-size: 0.9em;
    }
    input[type="range"] {
      cursor: pointer;
      padding: 0;
      height: 6px;
    }
    .slider-value {
      font-size: 0.8em;
      color: #4da8da;
    }
    button {
      padding: 8px 12px;
      background: #1f4d7f;
      color: #4da8da;
      border: 1px solid #4da8da;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 0.85em;
      transition: all 0.2s;
    }
    button:hover {
      background: #4da8da;
      color: #0a1428;
    }
    button.active {
      background: #4da8da;
      color: #0a1428;
    }
    .button-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .stats-panel {
      background: #0a1428;
      border-left: 3px solid #4da8da;
      padding: 10px 12px;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 0.8em;
      line-height: 1.6;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .stat-label {
      color: #a8e6c1;
    }
    .stat-value {
      color: #4da8da;
      font-weight: bold;
    }
    @media (max-width: 1000px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💎 Crystal Forge</h1>
    
    <div class="canvas-wrapper">
      <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="system">Crystal System</label>
        <select id="system">
          <option value="cubic">Cubic</option>
          <option value="hexagonal">Hexagonal</option>
          <option value="tetragonal">Tetragonal</option>
          <option value="orthorhombic">Orthorhombic</option>
          <option value="monoclinic">Monoclinic</option>
          <option value="triclinic">Triclinic</option>
        </select>
      </div>

      <div class="control-group">
        <label for="speed">Growth Speed: <span class="slider-value" id="speedVal">5.0x</span></label>
        <input type="range" id="speed" min="1" max="10" step="0.5" value="5">
      </div>

      <div class="control-group">
        <label for="temp">Temperature: <span class="slider-value" id="tempVal">500K</span></label>
        <input type="range" id="temp" min="100" max="1000" step="50" value="500">
      </div>

      <div class="control-group">
        <label for="sat">Saturation: <span class="slider-value" id="satVal">60%</span></label>
        <input type="range" id="sat" min="0" max="100" step="5" value="60">
      </div>

      <div class="control-group">
        <label for="element">Primary Element</label>
        <select id="element">
          <option value="C">Carbon (C)</option>
          <option value="Na">Sodium (Na)</option>
          <option value="Si">Silicon (Si)</option>
          <option value="Fe">Iron (Fe)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="dopant">Add Secondary:</label>
        <select id="dopant">
          <option value="none">None</option>
          <option value="Cl">Chlorine (Cl)</option>
          <option value="O">Oxygen (O)</option>
          <option value="S">Sulfur (S)</option>
        </select>
      </div>

      <div class="button-group">
        <button id="bondToggle">Show Bonds</button>
        <button id="symToggle">Symmetry</button>
        <button id="unitToggle">Unit Cell</button>
      </div>

      <button id="resetBtn" style="background: #8b3a3a; color: #ff7f7f; border-color: #ff7f7f; width: 100%; margin-top: 10px;">Reset</button>

      <div class="stats-panel">
        <div class="stat-row">
          <span class="stat-label">Atoms:</span>
          <span class="stat-value" id="atomCount">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Lattice (Å):</span>
          <span class="stat-value" id="lattice">3.50</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Growth Rate:</span>
          <span class="stat-value" id="growthRate">0/s</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">System:</span>
          <span class="stat-value" id="systemLabel">Cubic</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Disorder:</span>
          <span class="stat-value" id="disorder">Low</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let animationId;
    let running = true;

    // DPI scaling
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.offsetWidth * dpr;
    canvas.height = canvas.offsetHeight * dpr;
    ctx.scale(dpr, dpr);

    // State
    const state = {
      atoms: [],
      system: 'cubic',
      speed: 5,
      temp: 500,
      saturation: 60,
      element: 'C',
      dopant: 'none',
      showBonds: false,
      showSym: false,
      showUnit: false,
      frameCount: 0,
      latticeParam: 3.5
    };

    const colors = {
      C: '#808080',
      Na: '#4da8da',
      Cl: '#ff7f50',
      Si: '#9370db',
      Fe: '#ff6b6b',
      O: '#ffff00',
      S: '#ffaa00'
    };

    const latticeParams = {
      cubic: 3.5,
      hexagonal: 3.2,
      tetragonal: 3.8,
      orthorhombic: 3.6,
      monoclinic: 3.5,
      triclinic: 3.4
    };

    function getSystemInfo(system) {
      const info = {
        cubic: { angles: [90, 90, 90], axes: 4 },
        hexagonal: { angles: [90, 90, 120], axes: 6 },
        tetragonal: { angles: [90, 90, 90], axes: 4 },
        orthorhombic: { angles: [90, 90, 90], axes: 2 },
        monoclinic: { angles: [90, 90.5, 90], axes: 2 },
        triclinic: { angles: [90, 90, 90], axes: 1 }
      };
      return info[system] || info.cubic;
    }

    function addAtom() {
      const disorderFactor = (state.temp - 100) / 900;
      const growthProb = state.saturation / 100 * (1 - disorderFactor * 0.5);

      if (Math.random() > growthProb) return;

      const lattice = latticeParams[state.system];
      const baseRadius = 60 + state.atoms.length * 0.5;
      const angle = Math.random() * Math.PI * 2;
      const distance = baseRadius * (1 + (Math.random() - 0.5) * disorderFactor * 0.3);

      const x = canvas.offsetWidth / (2 * dpr) + Math.cos(angle) * distance;
      const y = canvas.offsetHeight / (2 * dpr) + Math.sin(angle) * distance;

      const element = Math.random() < (state.dopant === 'none' ? 1 : 0.7) ? state.element : state.dopant;

      state.atoms.push({
        x,
        y,
        element,
        vx: (Math.random() - 0.5) * 2,
        vy: (Math.random() - 0.5) * 2,
        age: 0
      });
    }

    function drawAtoms() {
      state.atoms.forEach(atom => {
        const radius = 4;
        ctx.fillStyle = colors[atom.element] || '#ffffff';
        ctx.beginPath();
        ctx.arc(atom.x, atom.y, radius, 0, Math.PI * 2);
        ctx.fill();

        // Label on hover-nearby atoms
        if (state.atoms.length < 200) {
          ctx.fillStyle = colors[atom.element];
          ctx.font = '9px Space Mono';
          ctx.fillText(atom.element, atom.x - 6, atom.y - 6);
        }
      });
    }

    function drawBonds() {
      if (!state.showBonds) return;
      ctx.strokeStyle = 'rgba(77, 168, 218, 0.3)';
      ctx.lineWidth = 1;

      for (let i = 0; i < state.atoms.length; i++) {
        for (let j = i + 1; j < state.atoms.length; j++) {
          const dx = state.atoms[j].x - state.atoms[i].x;
          const dy = state.atoms[j].y - state.atoms[i].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 20 && dist > 1) {
            ctx.beginPath();
            ctx.moveTo(state.atoms[i].x, state.atoms[i].y);
            ctx.lineTo(state.atoms[j].x, state.atoms[j].y);
            ctx.stroke();
          }
        }
      }
    }

    function drawSymmetry() {
      if (!state.showSym) return;
      const cx = canvas.offsetWidth / (2 * dpr);
      const cy = canvas.offsetHeight / (2 * dpr);
      const info = getSystemInfo(state.system);
      const numAxes = info.axes;

      const colors_sym = ['#ffff00', '#00d4ff', '#ff00ff', '#00ff88'];

      for (let i = 0; i < numAxes; i++) {
        const angle = (i / numAxes) * Math.PI;
        const length = 120;
        ctx.strokeStyle = colors_sym[i % colors_sym.length];
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(angle) * length, cy + Math.sin(angle) * length);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    function drawUnitCell() {
      if (!state.showUnit) return;
      const cx = canvas.offsetWidth / (2 * dpr);
      const cy = canvas.offsetHeight / (2 * dpr);
      const size = 60;

      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);

      const info = getSystemInfo(state.system);
      const angle = (info.angles[2] - 90) * Math.PI / 180;

      ctx.beginPath();
      ctx.moveTo(cx - size / 2, cy - size / 2);
      ctx.lineTo(cx + size / 2, cy - size / 2);
      ctx.lineTo(cx + size / 2 + Math.cos(angle) * size, cy + size / 2 + Math.sin(angle) * size);
      ctx.lineTo(cx - size / 2 + Math.cos(angle) * size, cy + size / 2 + Math.sin(angle) * size);
      ctx.closePath();
      ctx.stroke();

      ctx.setLineDash([]);
    }

    function animate() {
      ctx.fillStyle = '#0a1428';
      ctx.fillRect(0, 0, canvas.offsetWidth / dpr, canvas.offsetHeight / dpr);

      // Add atoms based on growth speed and saturation
      for (let i = 0; i < Math.ceil(state.speed / 2); i++) {
        addAtom();
      }

      drawUnitCell();
      drawSymmetry();
      drawBonds();
      drawAtoms();

      // Update stats
      document.getElementById('atomCount').textContent = state.atoms.length;
      document.getElementById('systemLabel').textContent = state.system.charAt(0).toUpperCase() + state.system.slice(1);

      const disorder = state.temp > 700 ? 'High' : state.temp > 400 ? 'Medium' : 'Low';
      document.getElementById('disorder').textContent = disorder;

      const growthPerSec = Math.ceil((state.speed / 2) * (state.saturation / 100));
      document.getElementById('growthRate').textContent = growthPerSec + '/s';

      state.frameCount++;
      if (running) {
        animationId = requestAnimationFrame(animate);
      }
    }

    // Event listeners
    document.getElementById('system').addEventListener('change', (e) => {
      state.system = e.target.value;
      state.latticeParam = latticeParams[state.system];
      document.getElementById('lattice').textContent = state.latticeParam.toFixed(2);
    });

    document.getElementById('speed').addEventListener('input', (e) => {
      state.speed = parseFloat(e.target.value);
      document.getElementById('speedVal').textContent = state.speed.toFixed(1) + 'x';
    });

    document.getElementById('temp').addEventListener('input', (e) => {
      state.temp = parseFloat(e.target.value);
      document.getElementById('tempVal').textContent = e.target.value + 'K';
    });

    document.getElementById('sat').addEventListener('input', (e) => {
      state.saturation = parseFloat(e.target.value);
      document.getElementById('satVal').textContent = e.target.value + '%';
    });

    document.getElementById('element').addEventListener('change', (e) => {
      state.element = e.target.value;
    });

    document.getElementById('dopant').addEventListener('change', (e) => {
      state.dopant = e.target.value;
    });

    document.getElementById('bondToggle').addEventListener('click', (e) => {
      state.showBonds = !state.showBonds;
      e.target.classList.toggle('active');
    });

    document.getElementById('symToggle').addEventListener('click', (e) => {
      state.showSym = !state.showSym;
      e.target.classList.toggle('active');
    });

    document.getElementById('unitToggle').addEventListener('click', (e) => {
      state.showUnit = !state.showUnit;
      e.target.classList.toggle('active');
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      state.atoms = [];
      state.frameCount = 0;
    });

    window.addEventListener('beforeunload', () => {
      running = false;
      cancelAnimationFrame(animationId);
    });

    animate();
  </script>
</body>
</html>
