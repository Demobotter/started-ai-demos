<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optical Diffraction — Single & Double Slit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e6ff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(20, 25, 45, 0.8);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 128, 255, 0.2);
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            margin-bottom: 8px;
            color: #00d9ff;
        }

        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 24px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .section {
            background: rgba(0, 128, 255, 0.05);
            border: 1px solid rgba(0, 128, 255, 0.15);
            border-radius: 12px;
            padding: 16px;
        }

        .section-title {
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #00ffff;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            color: #a0a6c0;
            margin-bottom: 6px;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            background: rgba(0, 128, 255, 0.2);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: #00ffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
        }

        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: #00ffff;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
        }

        .value-display {
            font-size: 11px;
            color: #00d9ff;
            margin-top: 4px;
            font-family: 'Courier New', monospace;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        button {
            flex: 1;
            padding: 8px 12px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 6px;
            color: #00ff88;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: rgba(0, 255, 136, 0.2);
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.2);
        }

        .canvas-container {
            grid-column: 1 / -1;
            background: rgba(0, 50, 80, 0.3);
            border: 1px solid rgba(0, 128, 255, 0.2);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        canvas {
            display: block;
            background: #0a0e27;
            border-radius: 8px;
            width: 100%;
            height: auto;
            border: 1px solid rgba(0, 128, 255, 0.1);
        }

        .info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
        }

        .info-box {
            background: rgba(0, 128, 255, 0.08);
            border: 1px solid rgba(0, 128, 255, 0.15);
            border-radius: 8px;
            padding: 12px;
        }

        .info-label {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 13px;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌊 Optical Diffraction</h1>
        <p class="subtitle">Single & double slit patterns from real Fraunhofer math</p>

        <div class="grid">
            <div class="section">
                <div class="section-title">Geometry</div>
                <div class="control-group">
                    <label for="wavelength">Wavelength (nm)</label>
                    <input type="range" id="wavelength" min="400" max="700" value="550" step="10">
                    <div class="value-display" id="waveDisplay">550 nm (green)</div>
                </div>
                <div class="control-group">
                    <label for="slitWidth">Slit Width (μm)</label>
                    <input type="range" id="slitWidth" min="0.1" max="5" value="1" step="0.1">
                    <div class="value-display" id="slitWidthDisplay">1.0 μm</div>
                </div>
                <div class="control-group">
                    <label for="slitSep">Slit Separation (μm)</label>
                    <input type="range" id="slitSep" min="0.5" max="10" value="5" step="0.5">
                    <div class="value-display" id="slitSepDisplay">5.0 μm</div>
                </div>
                <div class="control-group">
                    <label for="distance">Screen Distance (m)</label>
                    <input type="range" id="distance" min="0.1" max="10" value="1" step="0.5">
                    <div class="value-display" id="distDisplay">1.0 m</div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Mode</div>
                <div class="control-group">
                    <label for="mode">Slit Configuration</label>
                    <select id="mode" style="width: 100%; padding: 8px; background: rgba(0,128,255,0.1); border: 1px solid rgba(0,128,255,0.2); color: #00ffff; border-radius: 6px; font-family: 'Inter', sans-serif; cursor: pointer;">
                        <option value="single">Single Slit</option>
                        <option value="double" selected>Double Slit</option>
                    </select>
                </div>
                <div class="button-group">
                    <button onclick="resetParams()">Reset</button>
                </div>
            </div>

            <div class="canvas-container">
                <canvas id="diffCanvas"></canvas>
                <div class="info">
                    <div class="info-box">
                        <div class="info-label">Peak Order</div>
                        <div class="info-value" id="peakOrder">±1, ±2</div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">1st Min. (rad)</div>
                        <div class="info-value" id="firstMin">0.0055</div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">Angular Width</div>
                        <div class="info-value" id="angularWidth">0.022°</div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">1st Min. (mm)</div>
                        <div class="info-value" id="firstMinMm">5.5 mm</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('diffCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas resolution for HiDPI
        const dpr = window.devicePixelRatio || 1;
        canvas.width = 800 * dpr;
        canvas.height = 400 * dpr;
        ctx.scale(dpr, dpr);

        function getParams() {
            return {
                wavelength: parseFloat(document.getElementById('wavelength').value) * 1e-9, // meters
                slitWidth: parseFloat(document.getElementById('slitWidth').value) * 1e-6,
                slitSep: parseFloat(document.getElementById('slitSep').value) * 1e-6,
                distance: parseFloat(document.getElementById('distance').value),
                mode: document.getElementById('mode').value
            };
        }

        function updateDisplays() {
            const p = getParams();
            
            // Wavelength name
            const wl = p.wavelength * 1e9;
            let color = 'red';
            if (wl < 450) color = 'violet';
            else if (wl < 495) color = 'blue';
            else if (wl < 570) color = 'green';
            else if (wl < 590) color = 'yellow';
            else if (wl < 620) color = 'orange';
            
            document.getElementById('waveDisplay').textContent = `${wl.toFixed(0)} nm (${color})`;
            document.getElementById('slitWidthDisplay').textContent = `${p.slitWidth * 1e6} μm`;
            document.getElementById('slitSepDisplay').textContent = `${p.slitSep * 1e6} μm`;
            document.getElementById('distDisplay').textContent = `${p.distance} m`;

            // First minimum (sinc function: first zero at θ = λ/a)
            const firstMin = p.wavelength / p.slitWidth;
            document.getElementById('firstMin').textContent = `${(firstMin * 1000).toFixed(3)} mrad`;
            document.getElementById('angularWidth').textContent = `${(firstMin * 180 / Math.PI).toFixed(4)}°`;
            document.getElementById('firstMinMm').textContent = `${(firstMin * p.distance * 1e3).toFixed(2)} mm`;

            if (p.mode === 'double') {
                const doubleMin = 2 * p.wavelength / p.slitSep;
                document.getElementById('peakOrder').textContent = `±1, ±2, ±3…`;
            } else {
                document.getElementById('peakOrder').textContent = `Central only`;
            }
        }

        function computeIntensity(theta, params) {
            const { wavelength, slitWidth, slitSep, mode } = params;
            
            if (Math.abs(theta) < 1e-8) return 1.0;

            // Single slit envelope: sinc function
            const singleArg = Math.PI * slitWidth * theta / wavelength;
            const singleEnvelope = Math.abs(singleArg) < 1e-6 ? 1.0 : (Math.sin(singleArg) / singleArg) ** 2;

            if (mode === 'single') {
                return singleEnvelope;
            } else {
                // Double slit: envelope × interference pattern
                const doubleArg = Math.PI * slitSep * theta / wavelength;
                const interference = Math.cos(doubleArg) ** 2;
                return singleEnvelope * interference;
            }
        }

        function render() {
            const p = getParams();
            const width = 800;
            const height = 400;
            const centerX = width / 2;
            const centerY = height / 2;

            ctx.fillStyle = '#0a0e27';
            ctx.fillRect(0, 0, width, height);

            // Draw intensity pattern
            const pixelsPerUnit = (width / 2) / (4 * p.wavelength / p.slitWidth / p.distance);
            const maxTheta = (4 * p.wavelength / p.slitWidth / p.distance);

            for (let x = 0; x < width; x++) {
                const theta = (x - centerX) / pixelsPerUnit;
                const intensity = computeIntensity(theta, p);

                // Color gradient: blue → cyan → green → yellow → red
                let hue;
                if (intensity < 0.1) hue = 240;
                else if (intensity < 0.3) hue = 180;
                else if (intensity < 0.5) hue = 120;
                else if (intensity < 0.8) hue = 60;
                else hue = 0;

                const saturation = Math.min(100, 50 + intensity * 50);
                const lightness = Math.max(20, 30 + intensity * 40);

                ctx.fillStyle = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
                ctx.fillRect(x, 0, 1, height);
            }

            // Draw center line
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(centerX, 0);
            ctx.lineTo(centerX, height);
            ctx.stroke();

            // Draw grid lines
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
            ctx.lineWidth = 0.5;
            for (let i = 1; i < 8; i++) {
                const x = centerX + (width / 8) * i;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let i = -3; i <= 3; i++) {
                if (i !== 0) {
                    const x = centerX + (width / 8) * i;
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, height);
                    ctx.stroke();
                }
            }

            updateDisplays();
        }

        function resetParams() {
            document.getElementById('wavelength').value = 550;
            document.getElementById('slitWidth').value = 1;
            document.getElementById('slitSep').value = 5;
            document.getElementById('distance').value = 1;
            document.getElementById('mode').value = 'double';
            render();
        }

        // Event listeners
        document.getElementById('wavelength').addEventListener('input', render);
        document.getElementById('slitWidth').addEventListener('input', render);
        document.getElementById('slitSep').addEventListener('input', render);
        document.getElementById('distance').addEventListener('input', render);
        document.getElementById('mode').addEventListener('change', render);

        // Initial render
        render();
    </script>
</body>
</html>
