<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wine Pairing Scout</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #2d1b3d 0%, #1a0f2e 50%, #0f1419 100%);
      color: #e8e8e8;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: rgba(15, 20, 25, 0.8);
      border: 1px solid #4db8ff;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(77, 184, 255, 0.1);
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      margin-bottom: 8px;
      color: #d4a5ff;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #a0a0a0;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: 600;
      margin-bottom: 8px;
      color: #7fb3ff;
      font-size: 0.95rem;
    }
    select {
      padding: 10px 12px;
      background: #1a2332;
      color: #e8e8e8;
      border: 1px solid #4db8ff;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    select:focus {
      outline: none;
      border-color: #d4a5ff;
      box-shadow: 0 0 8px rgba(212, 165, 255, 0.2);
    }
    .wine-card {
      background: linear-gradient(135deg, #1a2332 0%, #2d1b3d 100%);
      border: 1px solid #7fb3ff;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
    }
    .wine-name {
      font-weight: 600;
      font-size: 1.2rem;
      color: #d4a5ff;
      margin-bottom: 8px;
    }
    .wine-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }
    .wine-detail {
      display: flex;
      justify-content: space-between;
      padding: 8px;
      background: rgba(77, 184, 255, 0.05);
      border-radius: 4px;
    }
    .detail-label { color: #a0a0a0; }
    .detail-value { color: #4db8ff; font-weight: 500; }
    .compatibility {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(77, 184, 255, 0.1);
      border-radius: 6px;
    }
    .compat-score {
      font-size: 1.4rem;
      font-weight: 700;
      color: #4db8ff;
      min-width: 50px;
    }
    .compat-text {
      font-size: 0.9rem;
      color: #e8e8e8;
    }
    .food-pairings {
      margin-top: 12px;
      padding: 12px;
      background: rgba(100, 200, 150, 0.05);
      border-radius: 6px;
      border-left: 3px solid #64c896;
    }
    .food-label {
      color: #7fb3ff;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .food-items {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .food-tag {
      background: rgba(100, 200, 150, 0.2);
      color: #64c896;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.85rem;
      border: 1px solid #64c896;
    }
    .results {
      margin-top: 30px;
    }
    .results-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: #d4a5ff;
      margin-bottom: 15px;
      text-align: center;
    }
    .science-box {
      background: rgba(212, 165, 255, 0.05);
      border: 1px solid #d4a5ff;
      border-radius: 6px;
      padding: 16px;
      margin-top: 20px;
      font-size: 0.9rem;
      color: #c0a8ff;
      line-height: 1.5;
    }
    .science-title {
      color: #d4a5ff;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .empty-state {
      text-align: center;
      color: #707070;
      padding: 20px;
      font-style: italic;
    }
    @media (max-width: 600px) {
      .controls { grid-template-columns: 1fr; }
      .wine-details { grid-template-columns: 1fr; }
      h1 { font-size: 1.8rem; }
      .container { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍷 Wine Pairing Scout</h1>
    <div class="subtitle">Pick a wine and flavor profile, discover real pairings</div>

    <div class="controls">
      <div class="control-group">
        <label for="wine-select">Wine Type</label>
        <select id="wine-select">
          <option value="">Select a wine…</option>
          <option value="cabernet">Cabernet Sauvignon</option>
          <option value="merlot">Merlot</option>
          <option value="pinot">Pinot Noir</option>
          <option value="chardonnay">Chardonnay</option>
          <option value="sauvignon">Sauvignon Blanc</option>
          <option value="riesling">Riesling</option>
          <option value="rosé">Rosé</option>
          <option value="prosecco">Prosecco</option>
        </select>
      </div>
      <div class="control-group">
        <label for="flavor-select">Dominant Flavor</label>
        <select id="flavor-select">
          <option value="">Select a flavor…</option>
          <option value="umami">Umami (savory, meaty)</option>
          <option value="spicy">Spicy (heat, peppery)</option>
          <option value="sweet">Sweet (desserts, fruit)</option>
          <option value="acidic">Acidic (citrus, tomato)</option>
          <option value="rich">Rich (butter, cream)</option>
          <option value="mineral">Mineral (herbs, earth)</option>
        </select>
      </div>
    </div>

    <div class="results">
      <div id="results-container"></div>
    </div>
  </div>

  <script>
    const wineDatabase = {
      cabernet: {
        name: 'Cabernet Sauvignon',
        tannins: 8.5,
        acidity: 5.2,
        alcohol: 13.8,
        body: 'full',
        flavors: ['blackcurrant', 'plum', 'dark cherry', 'tobacco', 'leather'],
        pairings: {
          umami: { score: 95, foods: ['beef steak', 'lamb chops', 'mushroom risotto', 'aged cheddar'] },
          spicy: { score: 75, foods: ['BBQ ribs', 'peppercorn-crusted meat', 'jerk chicken'] },
          sweet: { score: 40, foods: ['dark chocolate'] },
          acidic: { score: 55, foods: ['tomato-based pasta'] },
          rich: { score: 88, foods: ['filet mignon', 'prime rib', 'butter sauce'] },
          mineral: { score: 70, foods: ['truffle pasta', 'herbed lamb'] }
        }
      },
      merlot: {
        name: 'Merlot',
        tannins: 6.5,
        acidity: 5.5,
        alcohol: 13.5,
        body: 'medium-full',
        flavors: ['plum', 'cherry', 'cocoa', 'prune'],
        pairings: {
          umami: { score: 90, foods: ['duck breast', 'beef stew', 'portobello mushroom'] },
          spicy: { score: 68, foods: ['chili con carne', 'spiced sausage'] },
          sweet: { score: 50, foods: ['chocolate mousse'] },
          acidic: { score: 60, foods: ['spaghetti bolognese'] },
          rich: { score: 85, foods: ['braised short ribs', 'cream sauce'] },
          mineral: { score: 65, foods: ['herb-roasted chicken'] }
        }
      },
      pinot: {
        name: 'Pinot Noir',
        tannins: 4.2,
        acidity: 6.8,
        alcohol: 13.0,
        body: 'light-medium',
        flavors: ['red cherry', 'strawberry', 'raspberry', 'earthy'],
        pairings: {
          umami: { score: 85, foods: ['salmon', 'mushrooms', 'truffle', 'soy-glazed pork'] },
          spicy: { score: 72, foods: ['Thai curry', 'chili-spiced fish'] },
          sweet: { score: 55, foods: ['berry desserts'] },
          acidic: { score: 88, foods: ['ceviche', 'lemon chicken'] },
          rich: { score: 78, foods: ['creamy pasta', 'butter-roasted chicken'] },
          mineral: { score: 75, foods: ['herb-crusted fish'] }
        }
      },
      chardonnay: {
        name: 'Chardonnay',
        tannins: 0.5,
        acidity: 6.5,
        alcohol: 13.2,
        body: 'full',
        flavors: ['apple', 'pear', 'butter', 'hazelnut', 'vanilla'],
        pairings: {
          umami: { score: 82, foods: ['lobster', 'crab', 'scallops', 'parmesan risotto'] },
          spicy: { score: 50, foods: ['mild curry'] },
          sweet: { score: 45, foods: [] },
          acidic: { score: 70, foods: ['oysters with lemon'] },
          rich: { score: 92, foods: ['butter sauce', 'creamy seafood pasta', 'foie gras'] },
          mineral: { score: 60, foods: ['steamed vegetables'] }
        }
      },
      sauvignon: {
        name: 'Sauvignon Blanc',
        tannins: 0.2,
        acidity: 7.8,
        alcohol: 12.5,
        body: 'light',
        flavors: ['grapefruit', 'green apple', 'grass', 'herbaceous'],
        pairings: {
          umami: { score: 65, foods: ['goat cheese', 'salty fish'] },
          spicy: { score: 68, foods: ['wasabi', 'Thai herbs'] },
          sweet: { score: 30, foods: [] },
          acidic: { score: 95, foods: ['ceviche', 'poke', 'salads', 'citrus fish'] },
          rich: { score: 50, foods: [] },
          mineral: { score: 80, foods: ['fresh mozzarella', 'salads'] }
        }
      },
      riesling: {
        name: 'Riesling',
        tannins: 0.3,
        acidity: 7.2,
        alcohol: 11.5,
        body: 'light-medium',
        flavors: ['peach', 'apricot', 'stone fruit', 'floral'],
        pairings: {
          umami: { score: 70, foods: ['Asian cuisine', 'soy sauce', 'miso'] },
          spicy: { score: 88, foods: ['Thai food', 'Indian curry', 'sriracha'] },
          sweet: { score: 75, foods: ['desserts', 'fruit tart'] },
          acidic: { score: 85, foods: ['fish tacos', 'lemon chicken'] },
          rich: { score: 55, foods: [] },
          mineral: { score: 70, foods: ['herbs'] }
        }
      },
      rosé: {
        name: 'Rosé',
        tannins: 1.5,
        acidity: 6.5,
        alcohol: 12.5,
        body: 'light-medium',
        flavors: ['strawberry', 'watermelon', 'citrus', 'dry'],
        pairings: {
          umami: { score: 72, foods: ['grilled salmon', 'shrimp'] },
          spicy: { score: 78, foods: ['spicy Asian', 'cayenne pepper'] },
          sweet: { score: 60, foods: ['fruit salad'] },
          acidic: { score: 90, foods: ['fresh salads', 'seafood ceviche'] },
          rich: { score: 60, foods: ['light cream sauce'] },
          mineral: { score: 75, foods: ['herb-grilled vegetables'] }
        }
      },
      prosecco: {
        name: 'Prosecco',
        tannins: 0.1,
        acidity: 6.8,
        alcohol: 11.5,
        body: 'light',
        flavors: ['pear', 'green apple', 'almond', 'floral'],
        pairings: {
          umami: { score: 65, foods: ['oysters', 'prosciutto'] },
          spicy: { score: 55, foods: ['light spiced appetizers'] },
          sweet: { score: 70, foods: ['desserts', 'fruit'] },
          acidic: { score: 88, foods: ['cured ham', 'salty snacks'] },
          rich: { score: 50, foods: [] },
          mineral: { score: 68, foods: ['seafood antipasti'] }
        }
      }
    };

    const scienceExplainers = {
      umami: 'Umami (savory/meaty) pairs with high-tannin wines: tannins bind to proteins, softening both.',
      spicy: 'Acidity + sweetness cool heat. Low-tannin wines work best; tannins amplify spice.',
      sweet: 'Match sweetness: wine must equal or exceed food sweetness to avoid tasting bitter.',
      acidic: 'Acid + acid brightens. High-acid wines cut through citrus and vinegar, refreshing the palate.',
      rich: 'Rich foods pair with high-alcohol, full-bodied wines. Fat + alcohol satiate together.',
      mineral: 'Mineral flavors (earth, herbs) pair with wines that share those herbaceous notes.'
    };

    const wineSelect = document.getElementById('wine-select');
    const flavorSelect = document.getElementById('flavor-select');
    const resultsContainer = document.getElementById('results-container');

    function render() {
      const selectedWine = wineSelect.value;
      const selectedFlavor = flavorSelect.value;

      if (!selectedWine || !selectedFlavor) {
        resultsContainer.innerHTML = '<div class="empty-state">Select a wine and flavor profile to see pairings</div>';
        return;
      }

      const wine = wineDatabase[selectedWine];
      const pairing = wine.pairings[selectedFlavor];

      let html = `
        <div class="results-title">Perfect Pairings</div>
        <div class="wine-card">
          <div class="wine-name">${wine.name}</div>
          <div class="wine-details">
            <div class="wine-detail">
              <span class="detail-label">Tannins</span>
              <span class="detail-value">${wine.tannins}/10</span>
            </div>
            <div class="wine-detail">
              <span class="detail-label">Acidity</span>
              <span class="detail-value">${wine.acidity}/10</span>
            </div>
            <div class="wine-detail">
              <span class="detail-label">Alcohol</span>
              <span class="detail-value">${wine.alcohol}%</span>
            </div>
            <div class="wine-detail">
              <span class="detail-label">Body</span>
              <span class="detail-value">${wine.body}</span>
            </div>
          </div>
          <div class="compatibility">
            <div class="compat-score">${pairing.score}</div>
            <div class="compat-text">
              <strong>Compatibility Score</strong><br/>
              ${pairing.score >= 85 ? 'Excellent match' : pairing.score >= 70 ? 'Great pairing' : 'Good option'}
            </div>
          </div>
          <div class="food-pairings">
            <div class="food-label">Try These Foods</div>
            <div class="food-items">
              ${pairing.foods.map(food => `<div class="food-tag">${food}</div>`).join('')}
            </div>
          </div>
        </div>
        <div class="science-box">
          <div class="science-title">🧪 Why This Works</div>
          <p>${scienceExplainers[selectedFlavor]}</p>
        </div>
      `;

      resultsContainer.innerHTML = html;
    }

    wineSelect.addEventListener('change', render);
    flavorSelect.addEventListener('change', render);

    render();
  </script>
</body>
</html>
