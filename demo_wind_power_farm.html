<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wind Power Farm</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: rgba(20, 28, 50, 0.8);
      border: 1px solid rgba(0, 255, 153, 0.2);
      border-radius: 16px;
      padding: 40px;
      backdrop-filter: blur(10px);
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #00ff99;
      letter-spacing: -0.5px;
    }
    .subtitle {
      color: #00d9ff;
      font-size: 14px;
      margin-bottom: 32px;
      font-weight: 500;
    }
    .location-picker {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    input[type="text"], input[type="number"] {
      flex: 1;
      min-width: 140px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 153, 0.3);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
    }
    input[type="text"]::placeholder, input[type="number"]::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }
    button {
      padding: 10px 20px;
      background: linear-gradient(135deg, #00ff99 0%, #00d9ff 100%);
      color: #0a0e27;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 255, 153, 0.3);
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 32px;
    }
    @media (max-width: 600px) {
      .controls { grid-template-columns: 1fr; }
      .location-picker { flex-direction: column; }
      input[type="text"], input[type="number"] { min-width: auto; }
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .control-label {
      font-weight: 600;
      font-size: 13px;
      color: #00d9ff;
      display: flex;
      justify-content: space-between;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(0, 255, 153, 0.2);
      outline: none;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00ff99 0%, #00d9ff 100%);
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0, 255, 153, 0.5);
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00ff99 0%, #00d9ff 100%);
      cursor: pointer;
      border: none;
      box-shadow: 0 0 8px rgba(0, 255, 153, 0.5);
    }
    .wind-info {
      background: rgba(0, 213, 255, 0.1);
      border: 1px solid rgba(0, 213, 255, 0.3);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 13px;
      line-height: 1.6;
    }
    .wind-detail {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .wind-detail:last-child { margin-bottom: 0; }
    .wind-label { color: #00d9ff; font-weight: 500; }
    .wind-value { color: #00ff99; font-weight: 600; }
    canvas {
      width: 100%;
      max-width: 100%;
      height: auto;
      background: rgba(10, 14, 39, 0.5);
      border: 1px solid rgba(0, 255, 153, 0.2);
      border-radius: 12px;
      margin-bottom: 24px;
      display: block;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: 1fr; }
    }
    .stat-card {
      background: rgba(0, 255, 153, 0.08);
      border: 1px solid rgba(0, 255, 153, 0.2);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .stat-card-label {
      font-size: 12px;
      color: #00d9ff;
      font-weight: 500;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-card-value {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #00ff99;
    }
    .loading {
      text-align: center;
      color: #00d9ff;
      font-size: 14px;
    }
    .error {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.3);
      border-radius: 8px;
      padding: 12px;
      color: #ff6b6b;
      font-size: 13px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌬️ Wind Power Farm</h1>
    <p class="subtitle">Pick a location, optimize your turbine array with real wind data.</p>

    <div class="location-picker">
      <input type="text" id="cityInput" placeholder="e.g., Sydney, Austin, Copenhagen" value="Sydney">
      <button onclick="fetchLocation()">Load Winds</button>
    </div>

    <div id="errorBox"></div>

    <div class="controls">
      <div class="control-group">
        <label class="control-label">
          <span>Turbines</span>
          <span id="turbineCount">8</span>
        </label>
        <input type="range" id="turbineSlider" min="3" max="20" value="8" oninput="updateTurbines()">
      </div>
      <div class="control-group">
        <label class="control-label">
          <span>Rotor Diameter (m)</span>
          <span id="diameterValue">80</span>
        </label>
        <input type="range" id="diameterSlider" min="40" max="160" value="80" step="10" oninput="updateDiameter()">
      </div>
    </div>

    <div class="wind-info" id="windInfo">
      <div class="loading">Fetching wind data...</div>
    </div>

    <canvas id="farmCanvas" width="800" height="400"></canvas>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-card-label">Total Power Output</div>
        <div class="stat-card-value" id="powerOutput">0 MW</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Wind Speed</div>
        <div class="stat-card-value" id="windSpeed">0 m/s</div>
      </div>
    </div>
  </div>

  <script>
    let windData = null;
    let turbineCount = 8;
    let rotorDiameter = 80;
    const AIR_DENSITY = 1.225; // kg/m³
    const BETZ_COEFFICIENT = 0.59; // Betz limit

    async function fetchLocation() {
      const city = document.getElementById('cityInput').value.trim();
      const errorBox = document.getElementById('errorBox');
      errorBox.innerHTML = '';

      if (!city) {
        errorBox.innerHTML = '<div class="error">Please enter a city name.</div>';
        return;
      }

      document.getElementById('windInfo').innerHTML = '<div class="loading">Fetching wind data...</div>';

      try {
        // Geocode city to lat/lon using Open-Meteo
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
          throw new Error(`City "${city}" not found.`);
        }

        const result = geoData.results[0];
        const { latitude, longitude, name, country } = result;

        // Fetch wind data from Open-Meteo
        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=wind_speed_10m,wind_direction_10m&hourly=wind_speed_10m,wind_direction_10m&timezone=auto`);
        const weatherData = await weatherRes.json();

        windData = {
          city: `${name}, ${country || ''}`,
          latitude,
          longitude,
          current: weatherData.current,
          hourly: weatherData.hourly
        };

        renderWind();
        updateFarm();
      } catch (err) {
        errorBox.innerHTML = `<div class="error">Error: ${err.message}</div>`;
        document.getElementById('windInfo').innerHTML = '<div class="loading">Failed to load wind data.</div>';
      }
    }

    function renderWind() {
      const speed = windData.current.wind_speed_10m;
      const direction = windData.current.wind_direction_10m;
      const dirName = getWindDirection(direction);

      let html = `
        <div class="wind-detail">
          <span class="wind-label">Location</span>
          <span class="wind-value">${windData.city}</span>
        </div>
        <div class="wind-detail">
          <span class="wind-label">Current Wind Speed</span>
          <span class="wind-value">${speed.toFixed(1)} m/s</span>
        </div>
        <div class="wind-detail">
          <span class="wind-label">Wind Direction</span>
          <span class="wind-value">${dirName} (${direction.toFixed(0)}°)</span>
        </div>
      `;
      document.getElementById('windInfo').innerHTML = html;
      document.getElementById('windSpeed').textContent = `${speed.toFixed(1)} m/s`;
    }

    function getWindDirection(deg) {
      const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
      return dirs[Math.round(deg / 22.5) % 16];
    }

    function updateTurbines() {
      turbineCount = parseInt(document.getElementById('turbineSlider').value);
      document.getElementById('turbineCount').textContent = turbineCount;
      updateFarm();
    }

    function updateDiameter() {
      rotorDiameter = parseInt(document.getElementById('diameterSlider').value);
      document.getElementById('diameterValue').textContent = rotorDiameter;
      updateFarm();
    }

    function calculatePower(windSpeed) {
      // P = 0.5 * ρ * A * v³ * Cp
      const radius = rotorDiameter / 2;
      const area = Math.PI * radius * radius;
      const power = 0.5 * AIR_DENSITY * area * Math.pow(windSpeed, 3) * BETZ_COEFFICIENT;
      return power / 1e6; // Convert to MW
    }

    function updateFarm() {
      if (!windData) return;

      const windSpeed = windData.current.wind_speed_10m;
      const windDir = windData.current.wind_direction_10m;
      const powerPerTurbine = calculatePower(windSpeed);
      const totalPower = powerPerTurbine * turbineCount;

      document.getElementById('powerOutput').textContent = `${totalPower.toFixed(1)} MW`;

      drawFarm(windSpeed, windDir);
    }

    function drawFarm(windSpeed, windDir) {
      const canvas = document.getElementById('farmCanvas');
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const w = rect.width;
      const h = rect.height;

      // Background
      ctx.fillStyle = 'rgba(10, 14, 39, 0.5)';
      ctx.fillRect(0, 0, w, h);

      // Wind vector
      const windAngle = (windDir * Math.PI) / 180;
      const windArrowLen = Math.min(w, h) * 0.15;
      ctx.strokeStyle = 'rgba(0, 213, 255, 0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(w * 0.1, h * 0.1);
      ctx.lineTo(w * 0.1 + Math.cos(windAngle) * windArrowLen, h * 0.1 + Math.sin(windAngle) * windArrowLen);
      ctx.stroke();
      ctx.fillStyle = 'rgba(0, 213, 255, 0.5)';
      ctx.font = '12px Inter';
      ctx.fillText(`${windSpeed.toFixed(1)} m/s`, w * 0.1 + Math.cos(windAngle) * windArrowLen + 8, h * 0.1 - 5);

      // Turbine layout (grid)
      const cols = Math.ceil(Math.sqrt(turbineCount));
      const rows = Math.ceil(turbineCount / cols);
      const cellW = (w * 0.8) / cols;
      const cellH = (h * 0.7) / rows;
      const startX = w * 0.1;
      const startY = h * 0.2;

      let idx = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (idx >= turbineCount) break;

          const tx = startX + c * cellW + cellW * 0.5;
          const ty = startY + r * cellH + cellH * 0.5;

          // Turbine base
          ctx.fillStyle = 'rgba(0, 255, 153, 0.3)';
          ctx.beginPath();
          ctx.arc(tx, ty, 8, 0, Math.PI * 2);
          ctx.fill();

          // Turbine rotor
          ctx.strokeStyle = 'rgba(0, 255, 153, 0.8)';
          ctx.lineWidth = 2;
          const bladeLen = 12;
          for (let b = 0; b < 3; b++) {
            const bladeAngle = (b * Math.PI * 2) / 3 + (Date.now() * 0.005 * windSpeed);
            ctx.beginPath();
            ctx.moveTo(tx, ty);
            ctx.lineTo(tx + Math.cos(bladeAngle) * bladeLen, ty + Math.sin(bladeAngle) * bladeLen);
            ctx.stroke();
          }

          // Efficiency glow (brighter if facing wind)
          const facingWind = Math.abs(((windDir % 360) - ((Math.atan2(ty - h * 0.5, tx - w * 0.5) * 180) / Math.PI)) % 360) < 90;
          if (facingWind) {
            ctx.fillStyle = 'rgba(0, 255, 153, 0.2)';
            ctx.beginPath();
            ctx.arc(tx, ty, 16, 0, Math.PI * 2);
            ctx.fill();
          }

          idx++;
        }
      }

      // Legend
      ctx.fillStyle = 'rgba(0, 255, 153, 0.7)';
      ctx.font = '12px Inter';
      ctx.fillText('Green halo = optimal wind angle', w * 0.1, h * 0.95);
    }

    // Initial load
    fetchLocation();
  </script>
</body>
</html>
