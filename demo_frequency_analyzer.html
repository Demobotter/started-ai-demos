<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frequency Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a2540 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(15, 14, 39, 0.9);
            border: 1px solid rgba(77, 184, 255, 0.2);
            border-radius: 12px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            margin-bottom: 10px;
            color: #4db8ff;
        }
        .subtitle {
            color: #888;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }
        button {
            background: linear-gradient(135deg, #4db8ff, #00d9ff);
            color: #0a0e27;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 14px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(77, 184, 255, 0.3); }
        button:active { transform: translateY(0); }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status {
            flex: 1;
            min-width: 150px;
            padding: 8px 12px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            border-radius: 6px;
            font-size: 13px;
            color: #00ff88;
        }
        .status.off {
            background: rgba(255, 107, 107, 0.1);
            border-color: #ff6b6b;
            color: #ff6b6b;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .panel {
            background: rgba(26, 37, 64, 0.6);
            border: 1px solid rgba(77, 184, 255, 0.15);
            border-radius: 8px;
            padding: 15px;
        }
        .panel h2 {
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            color: #4db8ff;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
            background: rgba(10, 14, 39, 0.5);
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stat-card {
            background: rgba(0, 255, 136, 0.08);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 6px;
            padding: 10px;
            text-align: center;
        }
        .stat-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 16px;
            font-weight: 600;
            color: #00ff88;
            font-family: 'Syne', sans-serif;
        }
        .peak-indicator {
            color: #ffd700;
        }
        .error-box {
            background: rgba(255, 107, 107, 0.15);
            border: 1px solid #ff6b6b;
            border-radius: 6px;
            padding: 12px;
            color: #ff6b6b;
            font-size: 13px;
            margin-bottom: 20px;
        }
        @media (max-width: 700px) {
            .grid { grid-template-columns: 1fr; }
            .container { padding: 20px; }
            h1 { font-size: 22px; }
            .controls { gap: 10px; }
            button { padding: 8px 16px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Frequency Analyzer</h1>
        <p class="subtitle">Real-time audio spectrum with FFT</p>

        <div class="controls">
            <button id="startBtn">Start Listening</button>
            <button id="stopBtn" disabled>Stop Listening</button>
            <div class="status" id="status">Ready to listen</div>
        </div>

        <div id="errorBox"></div>

        <div class="grid">
            <div class="panel">
                <h2>Spectrum (0–20kHz)</h2>
                <canvas id="spectrumCanvas" width="400" height="200"></canvas>
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-label">Peak Frequency</div>
                        <div class="stat-value peak-indicator" id="peakFreq">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Peak Magnitude</div>
                        <div class="stat-value peak-indicator" id="peakMag">—</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h2>Waveform</h2>
                <canvas id="waveCanvas" width="400" height="200"></canvas>
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-label">RMS Energy</div>
                        <div class="stat-value" id="rmsValue">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Loudness (dB)</div>
                        <div class="stat-value" id="loudnessValue">—</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel">
            <h2>Detected Note</h2>
            <div class="stats">
                <div class="stat-card" style="grid-column: 1 / -1;">
                    <div class="stat-label">Musical Note (A440)</div>
                    <div class="stat-value" id="noteDisplay">—</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const status = document.getElementById('status');
        const spectrumCanvas = document.getElementById('spectrumCanvas');
        const waveCanvas = document.getElementById('waveCanvas');
        const peakFreqEl = document.getElementById('peakFreq');
        const peakMagEl = document.getElementById('peakMag');
        const rmsEl = document.getElementById('rmsValue');
        const loudnessEl = document.getElementById('loudnessValue');
        const noteEl = document.getElementById('noteDisplay');
        const errorBox = document.getElementById('errorBox');

        let audioContext;
        let analyser;
        let microphone;
        let animationId;
        let isListening = false;

        const FFT_SIZE = 4096;
        const NYQUIST_FREQ = 22050; // Hz
        const A4_FREQ = 440; // Hz
        const SEMITONES = 12;

        // Note names: C0 to C8
        const NOTE_NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];

        function showError(msg) {
            errorBox.innerHTML = `<strong>⚠️ Error:</strong> ${msg}`;
            errorBox.style.display = 'block';
        }

        function clearError() {
            errorBox.innerHTML = '';
            errorBox.style.display = 'none';
        }

        function frequencyToNote(freq) {
            if (!freq || freq <= 0) return '—';
            // Calculate semitones from A4
            const semitones = 12 * Math.log2(freq / A4_FREQ);
            const noteIndex = Math.round(semitones + 9) % 12; // A4 is index 9 in NOTE_NAMES
            const octave = Math.floor((semitones + 9 + 48) / 12); // Start from C0
            return NOTE_NAMES[(noteIndex + 12) % 12] + octave;
        }

        function getFrequencyFromBin(binIndex, sampleRate) {
            return (binIndex * sampleRate) / FFT_SIZE;
        }

        async function startListening() {
            try {
                clearError();
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = FFT_SIZE;

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                microphone = audioContext.createMediaStreamAudioSource(stream);
                microphone.connect(analyser);

                isListening = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                status.textContent = '🎤 Listening…';
                status.className = 'status';

                draw();
            } catch (err) {
                showError('Microphone access denied. Please allow microphone permissions.');
                startBtn.disabled = false;
                stopBtn.disabled = true;
                status.textContent = 'Permission denied';
                status.className = 'status off';
            }
        }

        function stopListening() {
            isListening = false;
            if (animationId) cancelAnimationFrame(animationId);
            if (microphone) microphone.disconnect();
            if (audioContext) audioContext.close();

            startBtn.disabled = false;
            stopBtn.disabled = true;
            status.textContent = 'Stopped';
            status.className = 'status off';

            // Clear displays
            peakFreqEl.textContent = '—';
            peakMagEl.textContent = '—';
            rmsEl.textContent = '—';
            loudnessEl.textContent = '—';
            noteEl.textContent = '—';

            const specCtx = spectrumCanvas.getContext('2d');
            specCtx.fillStyle = 'rgba(10, 14, 39, 0.5)';
            specCtx.fillRect(0, 0, spectrumCanvas.width, spectrumCanvas.height);

            const waveCtx = waveCanvas.getContext('2d');
            waveCtx.fillStyle = 'rgba(10, 14, 39, 0.5)';
            waveCtx.fillRect(0, 0, waveCanvas.width, waveCanvas.height);
        }

        function draw() {
            if (!isListening) return;

            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);

            const waveArray = new Uint8Array(analyser.fftSize);
            analyser.getByteTimeDomainData(waveArray);

            // Draw spectrum
            drawSpectrum(dataArray);

            // Draw waveform
            drawWaveform(waveArray);

            // Calculate stats
            updateStats(dataArray, waveArray);

            animationId = requestAnimationFrame(draw);
        }

        function drawSpectrum(dataArray) {
            const ctx = spectrumCanvas.getContext('2d');
            const width = spectrumCanvas.width;
            const height = spectrumCanvas.height;

            // Clear
            ctx.fillStyle = 'rgba(10, 14, 39, 0.5)';
            ctx.fillRect(0, 0, width, height);

            // Draw bands with gradient colors
            const barWidth = width / dataArray.length;
            for (let i = 0; i < dataArray.length; i++) {
                const barHeight = (dataArray[i] / 255) * height;
                const freq = getFrequencyFromBin(i, audioContext.sampleRate);

                // Color coding by frequency band
                let hue;
                if (freq < 250) hue = 0; // Red - bass
                else if (freq < 2000) hue = 30; // Orange - mids
                else if (freq < 8000) hue = 60; // Yellow - high-mids
                else hue = 120; // Green - treble

                ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
                ctx.fillRect(i * barWidth, height - barHeight, barWidth - 1, barHeight);
            }

            // Draw grid lines
            ctx.strokeStyle = 'rgba(77, 184, 255, 0.1)';
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(width * 0.25, 0);
            ctx.lineTo(width * 0.25, height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(width * 0.5, 0);
            ctx.lineTo(width * 0.5, height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(width * 0.75, 0);
            ctx.lineTo(width * 0.75, height);
            ctx.stroke();
        }

        function drawWaveform(waveArray) {
            const ctx = waveCanvas.getContext('2d');
            const width = waveCanvas.width;
            const height = waveCanvas.height;

            // Clear
            ctx.fillStyle = 'rgba(10, 14, 39, 0.5)';
            ctx.fillRect(0, 0, width, height);

            // Draw waveform line
            ctx.strokeStyle = '#4db8ff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();

            const samples = Math.min(waveArray.length, width);
            for (let i = 0; i < samples; i++) {
                const x = (i / samples) * width;
                const y = ((waveArray[i] / 255) * height);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // Center line
            ctx.strokeStyle = 'rgba(77, 184, 255, 0.2)';
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(0, height / 2);
            ctx.lineTo(width, height / 2);
            ctx.stroke();
        }

        function updateStats(freqData, timeData) {
            // Find peak frequency
            let maxIdx = 0;
            let maxVal = 0;
            for (let i = 0; i < freqData.length; i++) {
                if (freqData[i] > maxVal) {
                    maxVal = freqData[i];
                    maxIdx = i;
                }
            }

            const peakFreq = getFrequencyFromBin(maxIdx, audioContext.sampleRate);
            const peakMag = Math.round(maxVal);
            peakFreqEl.textContent = peakFreq > 0 ? peakFreq.toFixed(0) + ' Hz' : '—';
            peakMagEl.textContent = peakMag > 0 ? peakMag : '—';

            // Detected note
            noteEl.textContent = frequencyToNote(peakFreq);

            // Calculate RMS and loudness
            let sum = 0;
            for (let i = 0; i < timeData.length; i++) {
                const normalized = (timeData[i] - 128) / 128;
                sum += normalized * normalized;
            }
            const rms = Math.sqrt(sum / timeData.length);
            const loudness = 20 * Math.log10(Math.max(rms, 0.0001)); // dB

            rmsEl.textContent = rms.toFixed(4);
            loudnessEl.textContent = loudness.toFixed(1) + ' dB';
        }

        startBtn.addEventListener('click', startListening);
        stopBtn.addEventListener('click', stopListening);

        // Check for browser support
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showError('Web Audio API or getUserMedia not supported in this browser.');
            startBtn.disabled = true;
        }
    </script>
</body>
</html>
