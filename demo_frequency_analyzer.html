<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frequency Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Lato:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e8e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
        }
        
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
        
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .section {
            background: rgba(42, 51, 80, 0.5);
            border: 1px solid rgba(77, 184, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
        }
        
        .section h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #4db8ff;
            margin-bottom: 15px;
            display: block;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            flex: 1;
            min-width: 140px;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-family: 'Lato', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-primary {
            background: #00d9ff;
            color: #0a0e27;
        }
        
        .btn-primary:hover {
            background: #00f0ff;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
        }
        
        .btn-primary:disabled {
            background: #555;
            color: #999;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .btn-secondary {
            background: rgba(77, 184, 255, 0.2);
            color: #4db8ff;
            border: 1px solid #4db8ff;
        }
        
        .btn-secondary:hover:not(.active) {
            background: rgba(77, 184, 255, 0.4);
        }
        
        .btn-secondary.active {
            background: #4db8ff;
            color: #0a0e27;
        }
        
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #b0b0c0;
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(77, 184, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #00d9ff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #00d9ff;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .stat-box {
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        
        .stat-label {
            font-size: 11px;
            color: #8890a0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        
        .stat-value {
            font-family: 'Poppins', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: #00d9ff;
        }
        
        .stat-value.peak-freq {
            color: #ff9800;
        }
        
        .stat-value.amplitude {
            color: #00ffff;
        }
        
        .stat-value.note {
            color: #ffd700;
        }
        
        .stat-value.volume {
            color: #ff4444;
        }
        
        .canvas-wrapper {
            background: rgba(10, 14, 36, 0.8);
            border: 1px solid rgba(77, 184, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            justify-content: center;
            min-height: 500px;
        }
        
        canvas {
            width: 100%;
            height: 400px;
            background: rgba(26, 31, 58, 0.8);
            border-radius: 8px;
        }
        
        .status-text {
            font-size: 13px;
            color: #8890a0;
            text-align: center;
        }
        
        .toggle-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .toggle-group button {
            min-width: 80px;
            padding: 8px 12px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Panel -->
        <div class="control-panel">
            <!-- Start/Stop -->
            <div class="section">
                <h3>Stream Control</h3>
                <div class="button-group">
                    <button class="btn-primary" id="startBtn">Start Listening</button>
                    <button class="btn-primary" id="stopBtn" disabled>Stop</button>
                </div>
                <p class="status-text" id="status" style="margin-top: 12px;">Ready to analyze audio</p>
            </div>
            
            <!-- Frequency Range Filter -->
            <div class="section">
                <h3>Frequency Range</h3>
                <div class="toggle-group">
                    <button class="btn-secondary active" data-range="full">Full (50Hz–20kHz)</button>
                    <button class="btn-secondary" data-range="bass">Bass (20–500Hz)</button>
                    <button class="btn-secondary" data-range="mid">Mids (500Hz–5kHz)</button>
                    <button class="btn-secondary" data-range="treble">Treble (5–20kHz)</button>
                </div>
            </div>
            
            <!-- Sliders -->
            <div class="section">
                <div class="slider-group">
                    <div>
                        <div class="slider-label">
                            <span>Smoothing</span>
                            <span id="smoothValue">5</span>
                        </div>
                        <input type="range" id="smoothSlider" min="1" max="10" value="5">
                    </div>
                </div>
            </div>
            
            <div class="section">
                <div class="slider-group">
                    <div>
                        <div class="slider-label">
                            <span>Sensitivity</span>
                            <span id="sensitivityValue">100</span>
                        </div>
                        <input type="range" id="sensitivitySlider" min="10" max="200" value="100">
                    </div>
                </div>
            </div>
            
            <!-- Peak Frequency -->
            <div class="section">
                <h3>Peak Detection</h3>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-label">Peak Freq</div>
                        <div class="stat-value peak-freq" id="peakFreq">— Hz</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Amplitude</div>
                        <div class="stat-value amplitude" id="amplitude">— dB</div>
                    </div>
                </div>
            </div>
            
            <!-- Note & Volume -->
            <div class="section">
                <h3>Analysis</h3>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-label">Detected Note</div>
                        <div class="stat-value note" id="note">— </div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">RMS Volume</div>
                        <div class="stat-value volume" id="rmsVolume">— %</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Spectrum Canvas -->
        <div class="canvas-wrapper">
            <canvas id="spectrumCanvas"></canvas>
        </div>
    </div>
    
    <script>
        // Frequency Analyzer App
        class FrequencyAnalyzer {
            constructor() {
                this.audioContext = null;
                this.analyser = null;
                this.microphone = null;
                this.isRunning = false;
                this.dataArray = null;
                this.bufferLength = 256;
                
                // UI state
                this.smoothing = 5;
                this.sensitivity = 100;
                this.frequencyRange = 'full';
                this.smoothedData = null;
                
                // Canvas
                this.canvas = document.getElementById('spectrumCanvas');
                this.canvasCtx = this.canvas.getContext('2d');
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
                
                this.setupEventListeners();
                this.animationId = null;
            }
            
            resizeCanvas() {
                const rect = this.canvas.getBoundingClientRect();
                this.canvas.width = rect.width * window.devicePixelRatio;
                this.canvas.height = rect.height * window.devicePixelRatio;
                this.canvasCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
            }
            
            setupEventListeners() {
                document.getElementById('startBtn').addEventListener('click', () => this.start());
                document.getElementById('stopBtn').addEventListener('click', () => this.stop());
                
                document.getElementById('smoothSlider').addEventListener('input', (e) => {
                    this.smoothing = parseInt(e.target.value);
                    document.getElementById('smoothValue').textContent = this.smoothing;
                });
                
                document.getElementById('sensitivitySlider').addEventListener('input', (e) => {
                    this.sensitivity = parseInt(e.target.value);
                    document.getElementById('sensitivityValue').textContent = this.sensitivity;
                });
                
                document.querySelectorAll('[data-range]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('[data-range]').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.frequencyRange = e.target.dataset.range;
                    });
                });
            }
            
            async start() {
                if (this.isRunning) return;
                
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.analyser = this.audioContext.createAnalyser();
                    this.analyser.fftSize = 512;
                    this.bufferLength = this.analyser.frequencyBinCount;
                    this.dataArray = new Uint8Array(this.bufferLength);
                    this.smoothedData = new Uint8Array(this.bufferLength);
                    
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    this.microphone = this.audioContext.createMediaStreamSource(stream);
                    this.microphone.connect(this.analyser);
                    
                    this.isRunning = true;
                    document.getElementById('startBtn').disabled = true;
                    document.getElementById('stopBtn').disabled = false;
                    document.getElementById('status').textContent = 'Listening...';
                    
                    this.animate();
                } catch (err) {
                    document.getElementById('status').textContent = 'Microphone access denied';
                    console.error(err);
                }
            }
            
            stop() {
                if (!this.isRunning) return;
                
                this.microphone.disconnect();
                this.microphone.mediaStream.getTracks().forEach(track => track.stop());
                this.audioContext.close();
                this.isRunning = false;
                
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
                document.getElementById('status').textContent = 'Stopped';
                
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
            }
            
            animate() {
                if (!this.isRunning) return;
                
                this.analyser.getByteFrequencyData(this.dataArray);
                
                // Apply smoothing
                const alpha = Math.max(0.1, 1 - this.smoothing / 10);
                for (let i = 0; i < this.bufferLength; i++) {
                    this.smoothedData[i] = Math.round(this.smoothedData[i] * (1 - alpha) + this.dataArray[i] * alpha);
                }
                
                // Find peak
                let maxValue = 0;
                let maxIndex = 0;
                
                const range = this.getFrequencyRange();
                for (let i = range.start; i < range.end; i++) {
                    if (this.smoothedData[i] > maxValue) {
                        maxValue = this.smoothedData[i];
                        maxIndex = i;
                    }
                }
                
                // Calculate frequency and RMS
                const nyquist = this.audioContext.sampleRate / 2;
                const freqPerBin = nyquist / this.bufferLength;
                const peakFreq = Math.round(maxIndex * freqPerBin);
                
                let rms = 0;
                for (let i = 0; i < this.bufferLength; i++) {
                    rms += (this.smoothedData[i] / 255) ** 2;
                }
                rms = Math.sqrt(rms / this.bufferLength) * 100;
                
                // Update UI
                const amplitude = Math.round(maxValue);
                const note = this.frequencyToNote(peakFreq);
                
                document.getElementById('peakFreq').textContent = peakFreq + ' Hz';
                document.getElementById('amplitude').textContent = amplitude + ' dB';
                document.getElementById('note').textContent = note;
                document.getElementById('rmsVolume').textContent = Math.round(rms) + '%';
                
                // Draw spectrum
                this.drawSpectrum();
                
                this.animationId = requestAnimationFrame(() => this.animate());
            }
            
            getFrequencyRange() {
                const start = 0;
                const end = this.bufferLength;
                
                const ranges = {
                    full: { start: 0, end: this.bufferLength },
                    bass: { start: 0, end: Math.floor(this.bufferLength * 0.1) },
                    mid: { start: Math.floor(this.bufferLength * 0.1), end: Math.floor(this.bufferLength * 0.4) },
                    treble: { start: Math.floor(this.bufferLength * 0.4), end: this.bufferLength }
                };
                
                return ranges[this.frequencyRange] || ranges.full;
            }
            
            drawSpectrum() {
                const w = this.canvas.width / window.devicePixelRatio;
                const h = this.canvas.height / window.devicePixelRatio;
                
                // Clear
                this.canvasCtx.fillStyle = 'rgba(26, 31, 58, 0.9)';
                this.canvasCtx.fillRect(0, 0, w, h);
                
                // Grid lines
                this.canvasCtx.strokeStyle = 'rgba(77, 184, 255, 0.1)';
                this.canvasCtx.lineWidth = 1;
                for (let i = 0; i <= 4; i++) {
                    const y = (h / 4) * i;
                    this.canvasCtx.beginPath();
                    this.canvasCtx.moveTo(0, y);
                    this.canvasCtx.lineTo(w, y);
                    this.canvasCtx.stroke();
                }
                
                // Draw bars
                const range = this.getFrequencyRange();
                const barWidth = w / (range.end - range.start);
                
                for (let i = range.start; i < range.end; i++) {
                    const value = this.smoothedData[i] / 255;
                    const barHeight = value * h;
                    const x = (i - range.start) * barWidth;
                    
                    // Color based on frequency
                    const hue = (i / this.bufferLength) * 360;
                    if (hue < 120) {
                        this.canvasCtx.fillStyle = `hsl(0, 100%, 50%)`; // Bass red
                    } else if (hue < 240) {
                        this.canvasCtx.fillStyle = `hsl(180, 100%, 50%)`; // Mids cyan
                    } else {
                        this.canvasCtx.fillStyle = `hsl(45, 100%, 50%)`; // Treble gold
                    }
                    
                    this.canvasCtx.fillRect(x, h - barHeight, barWidth - 1, barHeight);
                }
            }
            
            frequencyToNote(freq) {
                if (freq === 0 || freq < 20) return '—';
                
                const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
                const a4 = 440;
                const c0 = a4 * Math.pow(2, -4.75);
                
                const semitones = Math.round(12 * Math.log2(freq / c0));
                const octave = Math.floor(semitones / 12);
                const note = notes[semitones % 12];
                
                return note + octave;
            }
        }
        
        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            new FrequencyAnalyzer();
        });
    </script>
</body>
</html>
