<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Cycle Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Lato:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Lato', sans-serif;
      background: linear-gradient(135deg, #0066cc 0%, #003d7a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: #f8fbff;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      max-width: 1100px;
      width: 100%;
      padding: 32px;
    }

    h1 {
      font-family: 'Poppins', sans-serif;
      color: #003d7a;
      font-size: 28px;
      margin-bottom: 24px;
      text-align: center;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 32px;
    }

    .control-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .control-group {
      background: #f0f4f8;
      padding: 16px;
      border-radius: 8px;
      border-left: 4px solid #0066cc;
    }

    .control-group label {
      display: block;
      font-weight: 600;
      color: #003d7a;
      margin-bottom: 8px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .control-group input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #d0e4f7;
      outline: none;
      -webkit-appearance: none;
    }

    .control-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #0066cc;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 102, 204, 0.4);
    }

    .control-group input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #0066cc;
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 6px rgba(0, 102, 204, 0.4);
    }

    .value-display {
      font-weight: 600;
      color: #0066cc;
      font-size: 16px;
      margin-top: 6px;
      font-family: 'Poppins', sans-serif;
    }

    .stats-panel {
      background: #f9f9f9;
      border-radius: 8px;
      padding: 16px;
      border: 1px solid #e0e8f0;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #e0e8f0;
      font-size: 13px;
    }

    .stat-row:last-child {
      border-bottom: none;
    }

    .stat-label {
      color: #666;
      font-weight: 500;
    }

    .stat-value {
      color: #003d7a;
      font-weight: 700;
      font-family: 'Poppins', sans-serif;
    }

    canvas {
      border: 1px solid #d0e4f7;
      border-radius: 8px;
      background: linear-gradient(135deg, #87ceeb 0%, #e0f2ff 100%);
      width: 100%;
      height: 500px;
      display: block;
    }

    .phase-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 8px;
      font-family: 'Poppins', sans-serif;
    }

    .phase-liquid {
      background: #e0f2ff;
      color: #0066cc;
      border: 2px solid #0066cc;
    }

    .phase-vapor {
      background: #d0f0ff;
      color: #0099ff;
      border: 2px solid #0099ff;
    }

    .phase-solid {
      background: #e8f4f8;
      color: #0066cc;
      border: 2px solid #0066cc;
    }

    .phase-mixed {
      background: #fff3cd;
      color: #856404;
      border: 2px solid #ffc107;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      canvas {
        height: 400px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💧 Water Cycle Explorer</h1>

    <div class="layout">
      <div class="control-panel">
        <div class="control-group">
          <label>Altitude (m)</label>
          <input type="range" id="altitudeSlider" min="0" max="10000" value="5000" step="100">
          <div class="value-display" id="altitudeValue">5000 m</div>
        </div>

        <div class="control-group">
          <label>Temperature (°C)</label>
          <input type="range" id="temperatureSlider" min="-50" max="50" value="15" step="1">
          <div class="value-display" id="temperatureValue">15°C</div>
        </div>

        <div class="control-group">
          <label>Relative Humidity (%)</label>
          <input type="range" id="humiditySlider" min="0" max="100" value="65" step="1">
          <div class="value-display" id="humidityValue">65%</div>
        </div>

        <div class="stats-panel">
          <div class="stat-row">
            <span class="stat-label">Pressure</span>
            <span class="stat-value" id="pressureValue">85.4 kPa</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Dew Point</span>
            <span class="stat-value" id="dewPointValue">7.5°C</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Vapor Pressure</span>
            <span class="stat-value" id="vaporPressureValue">1.7 kPa</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Saturation</span>
            <span class="stat-value" id="saturationValue">65%</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Water Density</span>
            <span class="stat-value" id="densityValue">999 kg/m³</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Atm. Density</span>
            <span class="stat-value" id="atmDensityValue">1.225 kg/m³</span>
          </div>
          <div style="margin-top: 12px;">
            <span class="phase-badge" id="phaseBadge">Liquid</span>
          </div>
        </div>
      </div>

      <div>
        <canvas id="canvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Setup canvas
    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Get control elements
    const altitudeSlider = document.getElementById('altitudeSlider');
    const temperatureSlider = document.getElementById('temperatureSlider');
    const humiditySlider = document.getElementById('humiditySlider');

    // Real atmospheric physics equations
    const P0 = 101325; // Sea level pressure (Pa)
    const T0 = 288.15; // Sea level temp (K)
    const L = 0.0065; // Temp lapse rate (K/m)
    const g = 9.81; // Gravity
    const M = 0.029; // Molar mass of air (kg/mol)
    const R = 8.314; // Gas constant

    function calculatePressure(altitude) {
      // Barometric formula: P = P₀ × (1 - L×h/T₀)^(g×M/R×L)
      const exponent = (g * M) / (R * L);
      const base = 1 - (L * altitude) / T0;
      return P0 * Math.pow(Math.max(0.001, base), exponent);
    }

    function calculateDewPoint(T, RH) {
      // Magnus approximation for dew point
      const a = 17.27;
      const b = 237.7;
      const alpha = ((a * T) / (b + T)) + Math.log(RH / 100);
      return (b * alpha) / (a - alpha);
    }

    function calculateVaporPressure(T) {
      // Clausius-Clapeyron: es = 6.112 × exp((17.67 × T) / (T + 243.5))
      return 6.112 * Math.exp((17.67 * T) / (T + 243.5)) * 100; // Convert to Pa
    }

    function calculateWaterDensity(T) {
      // Water density varies with temperature (simplified formula)
      return 1000 - (T - 4) * 0.2; // Max density at 4°C
    }

    function calculateAtmosphericDensity(P, T) {
      // Ideal gas law: ρ = PM/RT, where T is in Kelvin
      const TK = T + 273.15;
      return (P * M) / (R * TK);
    }

    function getPhase(T, saturation) {
      if (T < 0) return 'Solid';
      if (saturation > 90) return 'Mixed';
      if (saturation > 50) return 'Vapor';
      return 'Liquid';
    }

    function drawWaterCycle(altitude, temperature, humidity) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const width = canvas.width;
      const height = canvas.height;
      const altPercent = altitude / 10000;

      // Draw altitude zones
      const groundY = height * 0.85;
      const waterLevel = height * 0.8;

      // Ground
      ctx.fillStyle = '#8b6f47';
      ctx.fillRect(0, groundY, width, height - groundY);

      // Ocean/water
      ctx.fillStyle = '#0066cc';
      ctx.fillRect(0, waterLevel, width, groundY - waterLevel);

      // Sky gradient
      const skyGradient = ctx.createLinearGradient(0, 0, 0, height * 0.8);
      skyGradient.addColorStop(0, '#87ceeb');
      skyGradient.addColorStop(1, '#e0f2ff');
      ctx.fillStyle = skyGradient;
      ctx.fillRect(0, 0, width, height * 0.8);

      // Altitude zones
      ctx.font = '11px Lato';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
      ctx.textAlign = 'right';
      ctx.fillText('Sunlit (0-200m)', width - 10, height * 0.05);
      ctx.fillText('Twilight (200-1000m)', width - 10, height * 0.2);
      ctx.fillText('Midnight (1000-4000m)', width - 10, height * 0.4);
      ctx.fillText('Hadal (4000m+)', width - 10, height * 0.6);

      // Draw water droplets/vapor
      const dropletCount = Math.max(3, Math.floor(humidity / 10));
      for (let i = 0; i < dropletCount; i++) {
        const x = (width / (dropletCount + 1)) * (i + 1);
        const y = height * (0.3 + altPercent * 0.4) + Math.sin(Date.now() * 0.001 + i) * 20;

        if (temperature < 0) {
          // Ice crystals
          ctx.fillStyle = '#e8f4f8';
          ctx.beginPath();
          ctx.arc(x, y, 6, 0, Math.PI * 2);
          ctx.fill();
        } else if (humidity > 70) {
          // Water droplet
          ctx.fillStyle = '#0066cc';
          ctx.beginPath();
          ctx.arc(x, y, 5, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Vapor
          ctx.strokeStyle = '#00ccff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      // Draw sun
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(width * 0.9, height * (0.1 - altPercent * 0.05), 30, 0, Math.PI * 2);
      ctx.fill();

      // Draw evaporation arrows
      ctx.strokeStyle = 'rgba(0, 200, 255, 0.4)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const x = (width / 4) * (i + 1);
        const arrowY = waterLevel - 20 - Math.sin(Date.now() * 0.002 + i) * 10;
        ctx.beginPath();
        ctx.moveTo(x, waterLevel);
        ctx.lineTo(x, arrowY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x - 4, arrowY + 6);
        ctx.lineTo(x, arrowY);
        ctx.lineTo(x + 4, arrowY + 6);
        ctx.stroke();
      }

      // Draw cloud at high humidity
      if (humidity > 80) {
        ctx.fillStyle = 'rgba(200, 220, 240, 0.7)';
        const cloudY = height * (0.25 + altPercent * 0.3);
        ctx.beginPath();
        ctx.arc(width * 0.3, cloudY, 40, 0, Math.PI * 2);
        ctx.arc(width * 0.5, cloudY - 20, 50, 0, Math.PI * 2);
        ctx.arc(width * 0.7, cloudY, 40, 0, Math.PI * 2);
        ctx.fill();
      }

      // Info text
      ctx.fillStyle = '#003d7a';
      ctx.font = 'bold 13px Poppins';
      ctx.textAlign = 'center';
      ctx.fillText(`Altitude: ${altitude.toFixed(0)}m`, width / 2, height * 0.95);
    }

    function updateStats() {
      const altitude = parseFloat(altitudeSlider.value);
      const temperature = parseFloat(temperatureSlider.value);
      const humidity = parseFloat(humiditySlider.value);

      // Update sliders
      document.getElementById('altitudeValue').textContent = `${altitude.toFixed(0)} m`;
      document.getElementById('temperatureValue').textContent = `${temperature.toFixed(1)}°C`;
      document.getElementById('humidityValue').textContent = `${humidity.toFixed(0)}%`;

      // Calculate physics
      const pressure = calculatePressure(altitude);
      const dewPoint = calculateDewPoint(temperature, humidity);
      const vaporPressure = calculateVaporPressure(temperature);
      const waterDensity = calculateWaterDensity(temperature);
      const atmDensity = calculateAtmosphericDensity(pressure, temperature);

      // Update display
      document.getElementById('pressureValue').textContent = `${(pressure / 1000).toFixed(1)} kPa`;
      document.getElementById('dewPointValue').textContent = `${dewPoint.toFixed(1)}°C`;
      document.getElementById('vaporPressureValue').textContent = `${(vaporPressure / 100).toFixed(2)} kPa`;
      document.getElementById('saturationValue').textContent = `${humidity.toFixed(0)}%`;
      document.getElementById('densityValue').textContent = `${waterDensity.toFixed(0)} kg/m³`;
      document.getElementById('atmDensityValue').textContent = `${atmDensity.toFixed(3)} kg/m³`;

      // Phase badge
      const phase = humidity > 50 ? (temperature < 0 ? 'Solid' : 'Vapor') : 'Liquid';
      const phaseBadge = document.getElementById('phaseBadge');
      phaseBadge.textContent = phase;
      phaseBadge.className = `phase-badge phase-${phase.toLowerCase()}`;

      // Draw
      drawWaterCycle(altitude, temperature, humidity);
    }

    altitudeSlider.addEventListener('input', updateStats);
    temperatureSlider.addEventListener('input', updateStats);
    humiditySlider.addEventListener('input', updateStats);

    updateStats();
  </script>
</body>
</html>
