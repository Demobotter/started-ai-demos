<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slug Factory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f1f5f9;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3em;
            margin-bottom: 8px;
            color: #60a5fa;
        }

        .subtitle {
            font-size: 0.95em;
            color: #cbd5e1;
            font-style: italic;
        }

        .input-section {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 40px;
        }

        .input-section label {
            display: block;
            font-weight: 600;
            margin-bottom: 12px;
            color: #60a5fa;
        }

        textarea {
            width: 100%;
            min-height: 80px;
            padding: 14px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #f1f5f9;
            font-family: 'Space Mono', monospace;
            font-size: 0.95em;
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
        }

        textarea::placeholder {
            color: #64748b;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #0ea5e9;
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            background: #06b6d4;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(6, 182, 212, 0.3);
        }

        .btn-secondary {
            background: #334155;
            color: #f1f5f9;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .slugs-section {
            display: none;
        }

        .slugs-section.active {
            display: block;
        }

        .slugs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .slug-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }

        .slug-card:hover {
            border-color: #60a5fa;
            box-shadow: 0 8px 24px rgba(96, 165, 250, 0.15);
            transform: translateY(-4px);
        }

        .slug-label {
            font-weight: 600;
            color: #60a5fa;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .slug-content {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slug-text {
            font-family: 'Space Mono', monospace;
            background: #0f172a;
            padding: 12px 14px;
            border-radius: 6px;
            border: 1px solid #475569;
            color: #a1d8ff;
            flex: 1;
            word-break: break-all;
            user-select: all;
            font-size: 0.9em;
        }

        .copy-btn {
            padding: 10px 12px;
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: #06b6d4;
        }

        .copy-btn.copied {
            background: #10b981;
        }

        .download-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .btn-download {
            background: #8b5cf6;
            color: white;
            padding: 14px 32px;
            font-size: 1em;
        }

        .btn-download:hover {
            background: #7c3aed;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(139, 92, 246, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
        }

        .empty-state p {
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 2em;
            }

            .input-section {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            .slugs-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔗 Slug Factory</h1>
            <p class="subtitle">Generate 8 SEO-friendly URL slug variants from any title</p>
        </header>

        <div class="input-section">
            <label for="titleInput">Paste your title or phrase:</label>
            <textarea id="titleInput" placeholder="e.g., How to Build a Successful Side Hustle in 2026"></textarea>
            <div class="button-group">
                <button class="btn-primary" onclick="generateSlugs()">Generate Slugs</button>
                <button class="btn-secondary" onclick="clearForm()">Clear</button>
            </div>
        </div>

        <div class="slugs-section" id="slugsSection">
            <div class="download-section">
                <button class="btn-download" onclick="downloadAllSlugs()">📥 Download All (.txt)</button>
            </div>
            <div class="slugs-grid" id="slugsGrid"></div>
        </div>

        <div class="empty-state" id="emptyState">
            <p>✏️ Enter a title above and click Generate to see your slug options.</p>
        </div>
    </div>

    <script>
        // Stop words to filter out
        const stopWords = new Set([
            'the', 'a', 'an', 'is', 'are', 'am', 'be', 'been', 'being',
            'to', 'of', 'in', 'on', 'at', 'by', 'for', 'and', 'or', 'but',
            'not', 'as', 'if', 'with', 'from', 'into', 'up', 'out', 'than',
            'was', 'were', 'has', 'have', 'had', 'do', 'does', 'did', 'will',
            'would', 'could', 'should', 'can', 'may', 'might', 'must', 'shall',
            'this', 'that', 'these', 'those', 'i', 'you', 'he', 'she', 'it',
            'we', 'they', 'what', 'which', 'who', 'when', 'where', 'why', 'how'
        ]);

        // Common verbs and nouns that score higher
        const highValueWords = new Set([
            'build', 'make', 'create', 'develop', 'generate', 'design', 'learn',
            'guide', 'how', 'tips', 'trick', 'hack', 'secret', 'best', 'ultimate',
            'complete', 'mastery', 'strategy', 'system', 'framework', 'blueprint'
        ]);

        function tokenizeAndClean(text) {
            // Split on whitespace and punctuation
            const tokens = text
                .toLowerCase()
                .replace(/[^\w\s\d-]/g, ' ')
                .split(/\s+/)
                .filter(w => w.length > 0);

            // Filter out stop words and keep the rest
            return tokens.filter(w => !stopWords.has(w) && w.length > 1);
        }

        function scoreWord(word) {
            let score = 1;
            // Longer words score higher
            if (word.length > 4) score += 2;
            // High-value words get boost
            if (highValueWords.has(word)) score += 2;
            // Numbers always valuable
            if (/\d/.test(word)) score += 3;
            return score;
        }

        function kebabCase(tokens) {
            let slug = tokens.join('-');
            // Enforce max 50 chars
            if (slug.length > 50) {
                slug = slug.substring(0, 50);
                // Trim to last complete word
                const lastHyphen = slug.lastIndexOf('-');
                if (lastHyphen > 10) {
                    slug = slug.substring(0, lastHyphen);
                }
            }
            return slug;
        }

        function camelCase(tokens) {
            if (tokens.length === 0) return '';
            const [first, ...rest] = tokens;
            return first + rest.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('');
        }

        function acronym(tokens) {
            return tokens.map(w => w.charAt(0)).join('').toLowerCase();
        }

        function phoneticCompress(tokens) {
            const compressed = tokens.map(word => {
                // Keep first letter and numbers
                const firstLetter = word.charAt(0);
                const rest = word.slice(1)
                    .replace(/[aeiou]/g, '') // Remove vowels
                    .replace(/(.)\1+/g, '$1'); // Remove duplicates
                return firstLetter + rest;
            }).join('');
            return compressed || 'slug';
        }

        function hashVariant(kebab) {
            // Deterministic hash based on char codes
            let hash = 0;
            for (let i = 0; i < kebab.length; i++) {
                hash += kebab.charCodeAt(i);
            }
            const hashCode = Math.abs(hash) % 10000;
            return kebab + '-' + hashCode.toString().padStart(4, '0');
        }

        function wordCountOptimized(tokens) {
            // Score and rank
            const scored = tokens.map(w => ({ word: w, score: scoreWord(w) }));
            scored.sort((a, b) => b.score - a.score);
            // Take top 3-5
            const topCount = Math.min(4, Math.ceil(tokens.length / 2));
            const top = scored.slice(0, topCount).map(s => s.word);
            // Preserve original order
            const result = tokens.filter(w => top.includes(w));
            return result.join('-');
        }

        function snakeCase(tokens) {
            return tokens.join('_');
        }

        function pascalCase(tokens) {
            if (tokens.length === 0) return '';
            return tokens.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('');
        }

        function generateSlugs() {
            const input = document.getElementById('titleInput').value.trim();
            
            if (!input) {
                alert('Please enter a title or phrase');
                return;
            }

            const tokens = tokenizeAndClean(input);
            
            if (tokens.length === 0) {
                alert('No valid words found. Please enter a meaningful title.');
                return;
            }

            const slugs = [
                { label: 'Kebab Case', value: kebabCase(tokens) },
                { label: 'CamelCase', value: camelCase(tokens) },
                { label: 'PascalCase', value: pascalCase(tokens) },
                { label: 'Snake_case', value: snakeCase(tokens) },
                { label: 'Word-Optimized', value: wordCountOptimized(tokens) },
                { label: 'Acronym', value: acronym(tokens) },
                { label: 'Phonetic', value: phoneticCompress(tokens) },
                { label: 'Kebab + Hash', value: hashVariant(kebabCase(tokens)) }
            ];

            renderSlugs(slugs);
        }

        function renderSlugs(slugs) {
            const grid = document.getElementById('slugsGrid');
            const section = document.getElementById('slugsSection');
            const empty = document.getElementById('emptyState');

            grid.innerHTML = '';

            slugs.forEach((slug, idx) => {
                const card = document.createElement('div');
                card.className = 'slug-card';
                card.innerHTML = `
                    <div class="slug-label">${slug.label}</div>
                    <div class="slug-content">
                        <div class="slug-text" id="slug-${idx}">${slug.value}</div>
                        <button class="copy-btn" onclick="copySslug(${idx}, '${slug.value}')">Copy</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            section.classList.add('active');
            empty.style.display = 'none';
        }

        function copySslug(idx, text) {
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const original = btn.textContent;
                btn.textContent = '✅ Copied';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = original;
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        }

        function downloadAllSlugs() {
            const grid = document.getElementById('slugsGrid');
            const cards = grid.querySelectorAll('.slug-card');
            
            if (cards.length === 0) return;

            let content = '';
            cards.forEach(card => {
                const label = card.querySelector('.slug-label').textContent;
                const slug = card.querySelector('.slug-text').textContent;
                content += `${label}: ${slug}\n`;
            });

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'slugs.txt';
            a.click();
            URL.revokeObjectURL(url);
        }

        function clearForm() {
            document.getElementById('titleInput').value = '';
            document.getElementById('slugsSection').classList.remove('active');
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('slugsGrid').innerHTML = '';
            document.getElementById('titleInput').focus();
        }

        // Allow Enter key to generate
        document.getElementById('titleInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                generateSlugs();
            }
        });
    </script>
</body>
</html>
