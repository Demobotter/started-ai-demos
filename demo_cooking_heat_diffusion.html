<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meat Thermometer</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1f3a 0%, #0f0e27 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(20, 25, 45, 0.8);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(255, 107, 157, 0.1);
            border: 1px solid rgba(255, 107, 157, 0.2);
        }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            color: #ff6b9d;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .subtitle {
            color: #a0a0b0;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 20px;
        }
        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
        .control-section {
            background: rgba(50, 55, 85, 0.6);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(77, 184, 255, 0.15);
        }
        .control-group {
            margin-bottom: 20px;
        }
        .control-group:last-child {
            margin-bottom: 0;
        }
        label {
            display: block;
            font-size: 12px;
            color: #ffd93d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        select, input[type="range"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(77, 184, 255, 0.3);
            border-radius: 6px;
            background: rgba(30, 40, 70, 0.8);
            color: #ffffff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #4db8ff;
            box-shadow: 0 0 8px rgba(77, 184, 255, 0.2);
        }
        input[type="range"] {
            padding: 0;
            height: 6px;
            cursor: pointer;
        }
        .range-value {
            display: inline-block;
            color: #4db8ff;
            font-weight: 600;
            margin-left: 8px;
            font-size: 13px;
        }
        .button-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        @media (max-width: 768px) {
            .button-group {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .preset-btn {
            padding: 10px;
            border: 1px solid rgba(255, 107, 157, 0.4);
            border-radius: 6px;
            background: rgba(40, 35, 55, 0.8);
            color: #ff6b9d;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .preset-btn:hover, .preset-btn.active {
            background: rgba(255, 107, 157, 0.2);
            border-color: #ff6b9d;
            color: #ffb3d9;
        }
        .heatmap-section {
            background: rgba(50, 55, 85, 0.6);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(77, 184, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #canvas {
            width: 100%;
            max-width: 300px;
            height: 250px;
            border-radius: 8px;
            display: block;
            margin-bottom: 15px;
        }
        .stats-panel {
            width: 100%;
            background: rgba(30, 40, 70, 0.8);
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #ff6b9d;
            text-align: center;
        }
        .stat-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 10px;
        }
        .stat-row:last-child {
            margin-bottom: 0;
        }
        .stat {
            font-size: 12px;
            color: #a0a0b0;
        }
        .stat-value {
            font-size: 16px;
            font-weight: 700;
            color: #4db8ff;
            margin-top: 4px;
        }
        .stat.temp .stat-value {
            color: #ff6b9d;
        }
        .doneness-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
            text-transform: uppercase;
        }
        .doneness-badge.rare {
            background: rgba(220, 100, 100, 0.3);
            color: #ff8080;
        }
        .doneness-badge.mediumrare {
            background: rgba(255, 140, 100, 0.3);
            color: #ffb380;
        }
        .doneness-badge.medium {
            background: rgba(255, 180, 100, 0.3);
            color: #ffc880;
        }
        .doneness-badge.mediumwell {
            background: rgba(200, 200, 100, 0.3);
            color: #ffff80;
        }
        .doneness-badge.welldone {
            background: rgba(150, 150, 150, 0.3);
            color: #c0c0c0;
        }
        .doneness-badge.safe {
            background: rgba(100, 200, 100, 0.3);
            color: #80ff80;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍳 Meat Thermometer</h1>
        <p class="subtitle">Real heat diffusion through your meat — Fourier physics in action</p>
        
        <div class="grid-2">
            <!-- Controls -->
            <div class="control-section">
                <div class="control-group">
                    <label for="foodType">Food Type</label>
                    <select id="foodType">
                        <option value="beef">Beef</option>
                        <option value="chicken">Chicken</option>
                        <option value="pork">Pork</option>
                        <option value="fish">Fish</option>
                        <option value="vegetable">Vegetable</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Doneness Preset (Beef only)</label>
                    <div class="button-group">
                        <button class="preset-btn" data-preset="rare">Rare</button>
                        <button class="preset-btn" data-preset="mediumrare">M.Rare</button>
                        <button class="preset-btn" data-preset="medium">Medium</button>
                        <button class="preset-btn" data-preset="welldone">Well</button>
                    </div>
                </div>

                <div class="control-group">
                    <label for="thickness">Thickness: <span class="range-value" id="thicknessValue">3.0</span> cm</label>
                    <input type="range" id="thickness" min="0.5" max="7" step="0.1" value="3">
                </div>

                <div class="control-group">
                    <label for="cookTime">Cook Time: <span class="range-value" id="cookTimeValue">20</span> min</label>
                    <input type="range" id="cookTime" min="1" max="120" step="1" value="20">
                </div>

                <div class="control-group">
                    <label for="surfaceTemp">Surface Temp: <span class="range-value" id="surfaceTempValue">200</span> °C</label>
                    <input type="range" id="surfaceTemp" min="50" max="300" step="5" value="200">
                </div>
            </div>

            <!-- Heatmap & Stats -->
            <div class="heatmap-section">
                <canvas id="canvas"></canvas>
                <div class="stats-panel">
                    <div class="stat-row">
                        <div>
                            <div class="stat">Center Temp</div>
                            <div class="stat temp"><span id="centerTemp">0</span>°C</div>
                        </div>
                        <div>
                            <div class="stat">Surface Temp</div>
                            <div class="stat stat-value"><span id="displaySurfaceTemp">0</span>°C</div>
                        </div>
                    </div>
                    <div id="donenessDisplay"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Constants for real thermal diffusivity (cm²/min)
        const THERMAL_DIFFUSIVITY = {
            beef: 0.008,
            chicken: 0.007,
            pork: 0.0075,
            fish: 0.009,
            vegetable: 0.01
        };

        // USDA safe temps (°C)
        const SAFE_TEMPS = {
            beef: 63,        // 145°F
            chicken: 74,     // 165°F
            pork: 63,        // 145°F
            fish: 63,        // 145°F
            vegetable: 70
        };

        // Beef doneness targets (°C)
        const DONENESS = {
            rare: { min: 49, max: 51, label: 'Rare', class: 'rare' },
            mediumrare: { min: 55, max: 57, label: 'Medium-Rare', class: 'mediumrare' },
            medium: { min: 63, max: 65, label: 'Medium', class: 'medium' },
            mediumwell: { min: 68, max: 71, label: 'Medium-Well', class: 'mediumwell' },
            welldone: { min: 74, max: 82, label: 'Well-Done', class: 'welldone' }
        };

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const foodTypeEl = document.getElementById('foodType');
        const thicknessEl = document.getElementById('thickness');
        const cookTimeEl = document.getElementById('cookTime');
        const surfaceTempEl = document.getElementById('surfaceTemp');
        const centerTempEl = document.getElementById('centerTemp');
        const displaySurfaceTempEl = document.getElementById('displaySurfaceTemp');
        const donenessDisplayEl = document.getElementById('donenessDisplay');

        // Update display values
        thicknessEl.addEventListener('input', () => {
            document.getElementById('thicknessValue').textContent = parseFloat(thicknessEl.value).toFixed(1);
            update();
        });
        cookTimeEl.addEventListener('input', () => {
            document.getElementById('cookTimeValue').textContent = cookTimeEl.value;
            update();
        });
        surfaceTempEl.addEventListener('input', () => {
            document.getElementById('surfaceTempValue').textContent = surfaceTempEl.value;
            displaySurfaceTempEl.textContent = surfaceTempEl.value;
            update();
        });
        foodTypeEl.addEventListener('change', update);

        // Preset buttons
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const preset = btn.dataset.preset;
                if (foodTypeEl.value === 'beef') {
                    const target = DONENESS[preset];
                    const avgTemp = (target.min + target.max) / 2;
                    // Solve: avgTemp = 37 + (surfaceTemp - 37) * erf(x/(2*sqrt(alpha*t)))
                    // Estimate cook time needed for this center temp
                    const thickness = parseFloat(thicknessEl.value);
                    const alpha = THERMAL_DIFFUSIVITY.beef;
                    const surfTemp = parseFloat(surfaceTempEl.value);
                    if (surfTemp > avgTemp) {
                        const erfVal = (avgTemp - 37) / (surfTemp - 37);
                        const x = thickness / 2;
                        const u = erfInverse(erfVal);
                        if (!isNaN(u) && u > 0) {
                            const t = (u * u * x * x) / (alpha * 60); // convert to minutes
                            cookTimeEl.value = Math.max(1, Math.round(t));
                            document.getElementById('cookTimeValue').textContent = cookTimeEl.value;
                        }
                    }
                    update();
                }
                document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        // Erf inverse approximation (good enough for this use)
        function erfInverse(x) {
            if (x === 0) return 0;
            if (x === 1) return Infinity;
            if (x > 0.7) {
                const ln1 = Math.log(1 - x * x);
                const a = 0.140012;
                const den = Math.PI * a + ln1 / 2;
                return Math.sqrt(Math.sqrt(den * den - ln1 / a) - den);
            }
            const a = 0.147;
            const num = Math.log(1 - x * x);
            const den = 2 * Math.PI * a + (num / 2);
            return Math.sqrt(Math.sqrt(den * den - num / a) - den);
        }

        // Error function approximation
        function erf(x) {
            const a1 = 0.254829592;
            const a2 = -0.284496736;
            const a3 = 1.421413741;
            const a4 = -1.453152027;
            const a5 = 1.061405429;
            const p = 0.3275911;
            const sign = x < 0 ? -1 : 1;
            x = Math.abs(x);
            const t = 1.0 / (1.0 + p * x);
            return sign * (1.0 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-x * x));
        }

        // Calculate center temp using 1D Fourier heat equation
        function calculateCenterTemp() {
            const foodType = foodTypeEl.value;
            const thickness = parseFloat(thicknessEl.value);
            const cookTime = parseFloat(cookTimeEl.value);
            const surfaceTemp = parseFloat(surfaceTempEl.value);
            const alpha = THERMAL_DIFFUSIVITY[foodType];

            const ambientTemp = 37; // assume initial meat temp is body temp
            const x = thickness / 2; // distance to center (cm)
            const t = cookTime * 60; // convert minutes to seconds
            
            if (alpha * t === 0) return ambientTemp;

            const fourier = x / (2 * Math.sqrt(alpha * t));
            const erfVal = erf(fourier);
            const centerTemp = surfaceTemp + (ambientTemp - surfaceTemp) * erfVal;
            return Math.max(ambientTemp, Math.min(surfaceTemp, centerTemp));
        }

        // Draw heatmap
        function drawHeatmap() {
            const w = canvas.width;
            const h = canvas.height;
            const thickness = parseFloat(thicknessEl.value);
            const centerTemp = calculateCenterTemp();
            const surfaceTemp = parseFloat(surfaceTempEl.value);
            const foodType = foodTypeEl.value;
            const alpha = THERMAL_DIFFUSIVITY[foodType];
            const cookTime = parseFloat(cookTimeEl.value);

            const imgData = ctx.createImageData(w, h);
            const data = imgData.data;

            for (let py = 0; py < h; py++) {
                // y=0 is surface, y=h is center
                const distanceFromSurface = (py / h) * thickness;
                const x = distanceFromSurface;
                const t = cookTime * 60;

                let temp = 37;
                if (alpha * t > 0) {
                    const fourier = x / (2 * Math.sqrt(alpha * t));
                    const erfVal = erf(fourier);
                    temp = surfaceTemp + (37 - surfaceTemp) * erfVal;
                }

                temp = Math.max(37, Math.min(surfaceTemp, temp));
                const ratio = (temp - 37) / (surfaceTemp - 37);

                for (let px = 0; px < w; px++) {
                    const idx = (py * w + px) * 4;
                    const [r, g, b] = heatColor(ratio);
                    data[idx] = r;
                    data[idx + 1] = g;
                    data[idx + 2] = b;
                    data[idx + 3] = 255;
                }
            }

            ctx.putImageData(imgData, 0, 0);

            // Draw center temp marker
            ctx.fillStyle = '#ffd93d';
            ctx.beginPath();
            ctx.arc(w / 2, h - 5, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        function heatColor(ratio) {
            // Blue (cool) -> Red (hot)
            if (ratio < 0.5) {
                const t = ratio * 2;
                return [
                    Math.round(0 + t * 100),
                    Math.round(100 + t * 100),
                    Math.round(200 - t * 150)
                ];
            } else {
                const t = (ratio - 0.5) * 2;
                return [
                    Math.round(100 + t * 155),
                    Math.round(200 - t * 100),
                    Math.round(50 - t * 50)
                ];
            }
        }

        // Update doneness display
        function updateDoneness() {
            const centerTemp = calculateCenterTemp();
            const foodType = foodTypeEl.value;
            const safeTemp = SAFE_TEMPS[foodType];
            let html = '';

            if (foodType === 'beef') {
                let level = 'Raw';
                let className = 'rare';
                if (centerTemp >= DONENESS.welldone.min) {
                    level = 'Well-Done';
                    className = 'welldone';
                } else if (centerTemp >= DONENESS.mediumwell.min) {
                    level = 'Medium-Well';
                    className = 'mediumwell';
                } else if (centerTemp >= DONENESS.medium.min) {
                    level = 'Medium';
                    className = 'medium';
                } else if (centerTemp >= DONENESS.mediumrare.min) {
                    level = 'Medium-Rare';
                    className = 'mediumrare';
                } else if (centerTemp >= DONENESS.rare.min) {
                    level = 'Rare';
                    className = 'rare';
                }
                html = `<div class="doneness-badge ${className}">${level}</div>`;
            } else if (centerTemp >= safeTemp) {
                html = `<div class="doneness-badge safe">✓ Safe (${safeTemp}°C)</div>`;
            } else {
                html = `<div class="doneness-badge rare">⚠ Not Safe Yet</div>`;
            }

            donenessDisplayEl.innerHTML = html;
        }

        function update() {
            canvas.width = 300;
            canvas.height = 250;
            drawHeatmap();
            const centerTemp = calculateCenterTemp();
            centerTempEl.textContent = centerTemp.toFixed(1);
            displaySurfaceTempEl.textContent = surfaceTempEl.value;
            updateDoneness();
        }

        // Initial render
        update();
    </script>
</body>
</html>
