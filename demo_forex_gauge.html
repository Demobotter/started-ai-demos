<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strength Meter</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      width: 100%;
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .header p {
      color: #aaa;
      font-size: 0.95rem;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .pair-btn {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid #d4af37;
      color: #d4af37;
      padding: 8px 14px;
      border-radius: 6px;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .pair-btn:hover, .pair-btn.active {
      background: #d4af37;
      color: #1a1a1a;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
    }
    .card-label {
      font-family: 'Syne', sans-serif;
      font-size: 0.85rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .rate-display {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .rate {
      font-family: 'Syne', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
    }
    .change-badge {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(76, 175, 80, 0.2);
      color: #4caf50;
    }
    .change-badge.down {
      background: rgba(244, 67, 54, 0.2);
      color: #f44336;
    }
    .change-badge.flat {
      background: rgba(158, 158, 158, 0.2);
      color: #aaa;
    }
    .sparkline {
      width: 100%;
      height: 40px;
      margin-top: 12px;
    }
    .strength-section {
      margin-top: 20px;
    }
    .strength-label {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .strength-bar {
      background: rgba(212, 175, 55, 0.2);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .strength-fill {
      background: linear-gradient(90deg, #d4af37, #f0c860);
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
    }
    .stat-item {
      background: rgba(255, 255, 255, 0.04);
      padding: 12px;
      border-radius: 6px;
      text-align: center;
    }
    .stat-label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .stat-value {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 1.2rem;
    }
    .loading {
      text-align: center;
      color: #aaa;
      padding: 20px;
    }
    .error {
      background: rgba(244, 67, 54, 0.15);
      border: 1px solid #f44336;
      color: #ff9999;
      padding: 12px;
      border-radius: 6px;
      margin-top: 16px;
    }
    .refresh-indicator {
      font-size: 0.8rem;
      color: #666;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>💱 Strength Meter</h1>
      <p>Real-time crypto momentum tracker (CoinGecko)</p>
    </div>

    <div class="controls">
      <button class="pair-btn active" data-pair="bitcoin">Bitcoin</button>
      <button class="pair-btn" data-pair="ethereum">Ethereum</button>
      <button class="pair-btn" data-pair="solana">Solana</button>
      <button class="pair-btn" data-pair="ripple">Ripple</button>
      <button class="pair-btn" data-pair="cardano">Cardano</button>
    </div>

    <div id="content">
      <div class="loading">Loading real-time data from CoinGecko...</div>
    </div>

    <div class="refresh-indicator">
      Last refresh: <span id="refresh-time">--:--:--</span> • Auto-refresh every 60s
    </div>
  </div>

  <script>
    const cryptoIds = {
      bitcoin: 'bitcoin',
      ethereum: 'ethereum',
      solana: 'solana',
      ripple: 'ripple',
      cardano: 'cardano'
    };

    const cryptoNames = {
      bitcoin: 'Bitcoin',
      ethereum: 'Ethereum',
      solana: 'Solana',
      ripple: 'Ripple (XRP)',
      cardano: 'Cardano'
    };

    let currentCrypto = 'bitcoin';
    let refreshInterval;

    document.querySelectorAll('.pair-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.pair-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCrypto = btn.dataset.pair;
        updateDisplay();
      });
    });

    function updateTime() {
      const now = new Date();
      document.getElementById('refresh-time').textContent = now.toLocaleTimeString();
    }

    async function fetchCryptoData() {
      try {
        const id = cryptoIds[currentCrypto];
        // Fetch current data + 7-day market chart
        const [currentResp, chartResp] = await Promise.all([
          fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${id}&vs_currencies=usd&include_market_cap=true&include_24hr_vol=true&include_24hr_change=true`),
          fetch(`https://api.coingecko.com/api/v3/coins/${id}/market_chart?vs_currency=usd&days=7&interval=daily`)
        ]);

        if (!currentResp.ok || !chartResp.ok) {
          throw new Error(`API error: ${currentResp.status} / ${chartResp.status}`);
        }

        const current = await currentResp.json();
        const chart = await chartResp.json();

        return {
          current: current[id],
          prices: chart.prices.map(p => p[1])
        };
      } catch (error) {
        console.error('Fetch error:', error);
        return null;
      }
    }

    function calculateStrength(prices, currentPrice) {
      if (prices.length < 2) return 0;
      const mean = prices.reduce((a, b) => a + b, 0) / prices.length;
      const variance = prices.reduce((sum, v) => sum + Math.pow(v - mean, 2), 0) / prices.length;
      const volatility = Math.sqrt(variance);
      const trend = currentPrice > mean ? 1 : -1;
      const trendMagnitude = Math.abs(currentPrice - mean) / mean * 100;
      const volPct = Math.min(volatility / mean * 100 * 10, 5);
      const trendScore = Math.min(trendMagnitude / 2, 5);
      return Math.min((volPct + trendScore) / 10, 1);
    }

    function calculateOHLC(prices) {
      const sorted = [...prices].sort((a, b) => a - b);
      return {
        open: prices[0],
        high: Math.max(...prices),
        low: Math.min(...prices),
        close: prices[prices.length - 1]
      };
    }

    async function updateDisplay() {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading">Loading real-time data...</div>';
      updateTime();

      const data = await fetchCryptoData();
      if (!data || !data.current) {
        content.innerHTML = '<div class="error">Failed to fetch data. Please try again.</div>';
        return;
      }

      const current = data.current.usd;
      const change24h = data.current.usd_24h_change || 0;
      const prices = data.prices;
      const ohlc = calculateOHLC(prices);
      const strength = calculateStrength(prices, current);

      let changeBadgeClass = 'flat';
      let changeSymbol = '→';
      if (change24h > 0.01) {
        changeBadgeClass = 'up';
        changeSymbol = '↑';
      } else if (change24h < -0.01) {
        changeBadgeClass = 'down';
        changeSymbol = '↓';
      }

      // SVG sparkline
      const minPrice = Math.min(...prices);
      const maxPrice = Math.max(...prices);
      const range = maxPrice - minPrice || 1;
      const svgWidth = 100;
      const svgHeight = 40;
      const points = [];
      for (let i = 0; i < prices.length; i++) {
        const x = (i / (prices.length - 1)) * svgWidth;
        const y = svgHeight - ((prices[i] - minPrice) / range) * svgHeight;
        points.push(`${x},${y}`);
      }
      const sparklineSVG = `<svg class="sparkline" viewBox="0 0 ${svgWidth} ${svgHeight}" preserveAspectRatio="none">
        <polyline points="${points.join(' ')}" fill="none" stroke="#d4af37" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
      </svg>`;

      const cryptoName = cryptoNames[currentCrypto];
      content.innerHTML = `
        <div class="card">
          <div class="card-label">Live Price</div>
          <div class="rate-display">
            <div class="rate">$${current.toLocaleString('en-US', { maximumFractionDigits: 2, minimumFractionDigits: 2 })}</div>
            <div class="change-badge ${changeBadgeClass}">${changeSymbol} ${Math.abs(change24h).toFixed(2)}%</div>
          </div>
          ${sparklineSVG}
          <div class="strength-section">
            <div class="strength-label">
              <span>Momentum Strength</span>
              <span>${(strength * 10).toFixed(1)}/10</span>
            </div>
            <div class="strength-bar">
              <div class="strength-fill" style="width: ${strength * 100}%"></div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-label">7-Day OHLC</div>
          <div class="stats-grid">
            <div class="stat-item">
              <div class="stat-label">Open</div>
              <div class="stat-value">$${ohlc.open.toLocaleString('en-US', { maximumFractionDigits: 2 })}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">High</div>
              <div class="stat-value">$${ohlc.high.toLocaleString('en-US', { maximumFractionDigits: 2 })}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">Low</div>
              <div class="stat-value">$${ohlc.low.toLocaleString('en-US', { maximumFractionDigits: 2 })}</div>
            </div>
          </div>
          <div class="stats-grid" style="margin-top: 12px;">
            <div class="stat-item">
              <div class="stat-label">Close (Now)</div>
              <div class="stat-value">$${ohlc.close.toLocaleString('en-US', { maximumFractionDigits: 2 })}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">Range</div>
              <div class="stat-value">$${(ohlc.high - ohlc.low).toLocaleString('en-US', { maximumFractionDigits: 2 })}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">% Move</div>
              <div class="stat-value">${((ohlc.close - ohlc.open) / ohlc.open * 100).toFixed(2)}%</div>
            </div>
          </div>
        </div>
      `;
    }

    function startAutoRefresh() {
      if (refreshInterval) clearInterval(refreshInterval);
      refreshInterval = setInterval(() => {
        updateDisplay();
      }, 60000);
    }

    updateDisplay();
    startAutoRefresh();

    window.addEventListener('beforeunload', () => {
      if (refreshInterval) clearInterval(refreshInterval);
    });
  </script>
</body>
</html>
