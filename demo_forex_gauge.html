<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strength Meter — Live Forex</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
      color: #fff;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }
    .pair-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .pair-btn {
      padding: 10px 18px;
      border: 2px solid #444;
      background: #252525;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s;
      font-size: 0.9rem;
    }
    .pair-btn:hover {
      border-color: #d4af37;
      background: #2a2a2a;
    }
    .pair-btn.active {
      border-color: #d4af37;
      background: rgba(212, 175, 55, 0.2);
      color: #d4af37;
    }
    .main-card {
      background: #252525;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 25px;
      margin-bottom: 25px;
    }
    .rate-display {
      text-align: center;
      margin-bottom: 25px;
    }
    .rate-value {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .rate-change {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .rate-change.up {
      background: rgba(76, 175, 80, 0.2);
      color: #4caf50;
    }
    .rate-change.down {
      background: rgba(244, 67, 54, 0.2);
      color: #f44336;
    }
    .rate-change.flat {
      background: rgba(158, 158, 158, 0.2);
      color: #9e9e9e;
    }
    .strength-section {
      margin-bottom: 30px;
    }
    .strength-label {
      font-weight: 600;
      margin-bottom: 12px;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #aaa;
    }
    .strength-meter {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .strength-bar {
      flex: 1;
      height: 24px;
      background: #1a1a1a;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #444;
    }
    .strength-fill {
      height: 100%;
      background: linear-gradient(90deg, #d4af37, #e6c755);
      width: 50%;
      transition: width 0.6s ease;
    }
    .strength-value {
      font-weight: 700;
      color: #d4af37;
      min-width: 35px;
      text-align: right;
      font-size: 0.95rem;
    }
    .chart-container {
      margin-top: 25px;
      background: #1a1a1a;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #444;
    }
    canvas {
      width: 100% !important;
      height: auto !important;
      display: block;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 25px;
    }
    .stat-box {
      background: #1a1a1a;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #444;
      text-align: center;
    }
    .stat-label {
      color: #aaa;
      font-size: 0.8rem;
      text-transform: uppercase;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }
    .stat-value {
      font-size: 1.3rem;
      font-weight: 700;
      color: #d4af37;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #aaa;
    }
    .error {
      background: rgba(244, 67, 54, 0.1);
      border: 1px solid rgba(244, 67, 54, 0.3);
      color: #f44336;
      padding: 15px;
      border-radius: 6px;
      margin-top: 15px;
    }
    .refresh-timer {
      text-align: center;
      color: #666;
      font-size: 0.8rem;
      margin-top: 15px;
    }
    @media (max-width: 600px) {
      h1 { font-size: 1.8rem; }
      .rate-value { font-size: 2rem; }
      .pair-selector { gap: 6px; }
      .pair-btn { padding: 8px 12px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💱 Strength Meter</h1>
    <div class="subtitle">Live forex momentum · Updated every 60 seconds</div>

    <div class="pair-selector">
      <button class="pair-btn active" data-pair="EURUSD">EUR/USD</button>
      <button class="pair-btn" data-pair="GBPUSD">GBP/USD</button>
      <button class="pair-btn" data-pair="USDJPY">USD/JPY</button>
      <button class="pair-btn" data-pair="AUDUSD">AUD/USD</button>
      <button class="pair-btn" data-pair="NZDUSD">NZD/USD</button>
      <button class="pair-btn" data-pair="USDCAD">USD/CAD</button>
    </div>

    <div id="content">
      <div class="loading">Loading live rates...</div>
    </div>
  </div>

  <script>
    const PAIRS = {
      'EURUSD': { from: 'EUR', to: 'USD', label: 'EUR/USD' },
      'GBPUSD': { from: 'GBP', to: 'USD', label: 'GBP/USD' },
      'USDJPY': { from: 'USD', to: 'JPY', label: 'USD/JPY' },
      'AUDUSD': { from: 'AUD', to: 'USD', label: 'AUD/USD' },
      'NZDUSD': { from: 'NZD', to: 'USD', label: 'NZD/USD' },
      'USDCAD': { from: 'USD', to: 'CAD', label: 'USD/CAD' }
    };

    let currentPair = 'EURUSD';
    let refreshInterval = null;
    let lastUpdateTime = null;

    function formatNumber(n, decimals = 4) {
      return parseFloat(n).toFixed(decimals);
    }

    function calculateStrength(rates) {
      if (rates.length < 2) return 5;
      const current = rates[rates.length - 1];
      const week_ago = rates[0];
      const change = ((current - week_ago) / week_ago) * 100;
      
      // Calculate volatility (standard deviation of returns)
      const returns = [];
      for (let i = 1; i < rates.length; i++) {
        returns.push(((rates[i] - rates[i-1]) / rates[i-1]) * 100);
      }
      const avg = returns.reduce((a, b) => a + b, 0) / returns.length;
      const variance = returns.reduce((sum, r) => sum + Math.pow(r - avg, 2), 0) / returns.length;
      const volatility = Math.sqrt(variance);
      
      // Strength = trend direction (normalized) + volatility (normalized)
      // Trend contribution (±5 points)
      const trendScore = Math.min(5, Math.max(-5, change * 2));
      // Volatility contribution (0-5 points, higher vol = more dynamic)
      const volScore = Math.min(5, volatility * 2);
      
      const strength = 5 + trendScore + volScore * 0.5;
      return Math.max(0, Math.min(10, strength));
    }

    async function fetchData(pair) {
      const { from, to } = PAIRS[pair];
      try {
        const resp = await fetch(`https://api.frankfurter.app/latest?from=${from}&to=${to}`);
        if (!resp.ok) throw new Error('API error');
        const data = await resp.json();
        
        // Also fetch 7-day history for candlestick and trend
        const histResp = await fetch(`https://api.frankfurter.app/${getDateString(-7)}..?from=${from}&to=${to}`);
        if (!histResp.ok) throw new Error('History API error');
        const histData = await histResp.json();
        
        return { current: data, history: histData };
      } catch (e) {
        console.error('Fetch error:', e);
        return null;
      }
    }

    function getDateString(daysAgo) {
      const d = new Date();
      d.setDate(d.getDate() + daysAgo);
      return d.toISOString().split('T')[0];
    }

    function extractOHLC(histData, to) {
      const rates = [];
      const dates = [];
      const entries = Object.entries(histData.rates).sort();
      for (const [date, ratesObj] of entries) {
        if (ratesObj[to]) {
          rates.push(ratesObj[to]);
          dates.push(date);
        }
      }
      if (rates.length === 0) return null;
      
      const open = rates[0];
      const close = rates[rates.length - 1];
      const high = Math.max(...rates);
      const low = Math.min(...rates);
      
      return { open, high, low, close, rates, dates };
    }

    function drawCandlestick(canvas, ohlc) {
      if (!ohlc) return;
      const ctx = canvas.getContext('2d');
      const { width, height } = canvas;
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(0, 0, width, height);

      const { open, high, low, close, rates } = ohlc;
      const range = high - low;
      const padding = 40;
      const chartW = width - padding * 2;
      const chartH = height - padding * 2;

      // Draw candlesticks (simplified: use closing prices)
      const numCandles = Math.min(20, rates.length);
      const candleW = chartW / numCandles;
      for (let i = rates.length - numCandles; i < rates.length; i++) {
        const idx = i - (rates.length - numCandles);
        const rate = rates[i];
        const nextRate = i < rates.length - 1 ? rates[i + 1] : rate;
        
        const isUp = nextRate >= rate;
        const y = padding + chartH - ((rate - low) / range) * chartH;
        const w = candleW * 0.8;
        const x = padding + idx * candleW + candleW * 0.1;
        
        // Wick
        ctx.strokeStyle = isUp ? '#4caf50' : '#f44336';
        ctx.lineWidth = 1;
        ctx.beginPath();
        const wickHigh = padding + chartH - ((Math.max(rate, nextRate) - low) / range) * chartH;
        const wickLow = padding + chartH - ((Math.min(rate, nextRate) - low) / range) * chartH;
        ctx.moveTo(x + w / 2, wickHigh);
        ctx.lineTo(x + w / 2, wickLow);
        ctx.stroke();
        
        // Body
        ctx.fillStyle = isUp ? '#4caf50' : '#f44336';
        ctx.fillRect(x, Math.min(y, padding + chartH - ((nextRate - low) / range) * chartH), w, Math.abs((nextRate - rate) / range * chartH) || 2);
      }

      // Axes
      ctx.strokeStyle = '#444';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(padding, padding);
      ctx.lineTo(padding, height - padding);
      ctx.lineTo(width - padding, height - padding);
      ctx.stroke();

      // Labels
      ctx.fillStyle = '#aaa';
      ctx.font = '12px Inter';
      ctx.textAlign = 'center';
      ctx.fillText(`High: ${formatNumber(high)}`, width / 2, padding - 5);
      ctx.textAlign = 'right';
      ctx.fillText(formatNumber(low), padding - 5, height - padding + 20);
    }

    async function render(pair) {
      const data = await fetchData(pair);
      if (!data) {
        document.getElementById('content').innerHTML = '<div class="error">Failed to fetch data. Retrying...</div>';
        return;
      }

      const rate = data.current.rates[PAIRS[pair].to];
      const ohlc = extractOHLC(data.history, PAIRS[pair].to);
      const strength = calculateStrength(ohlc.rates);

      // Determine change direction
      const open = ohlc.open;
      const close = ohlc.close;
      const changePct = ((close - open) / open) * 100;
      const changeDir = changePct > 0.01 ? 'up' : changePct < -0.01 ? 'down' : 'flat';
      const changeArrow = changeDir === 'up' ? '↑' : changeDir === 'down' ? '↓' : '→';

      const high7d = Math.max(...ohlc.rates);
      const low7d = Math.min(...ohlc.rates);
      const volatility = ((high7d - low7d) / low7d * 100).toFixed(2);

      lastUpdateTime = new Date();
      const timestamp = lastUpdateTime.toLocaleTimeString();

      document.getElementById('content').innerHTML = `
        <div class="main-card">
          <div class="rate-display">
            <div class="rate-value">${formatNumber(rate, 4)}</div>
            <div class="rate-change ${changeDir}">
              ${changeArrow} ${Math.abs(changePct).toFixed(2)}% (${formatNumber(close - open, 6)})
            </div>
          </div>

          <div class="strength-section">
            <div class="strength-label">Pair Strength (7-day momentum)</div>
            <div class="strength-meter">
              <div class="strength-bar">
                <div class="strength-fill" style="width: ${(strength / 10) * 100}%"></div>
              </div>
              <div class="strength-value">${strength.toFixed(1)}/10</div>
            </div>
          </div>

          <div class="chart-container">
            <canvas id="chart" width="700" height="300"></canvas>
          </div>

          <div class="stats-grid">
            <div class="stat-box">
              <div class="stat-label">7-Day High</div>
              <div class="stat-value">${formatNumber(high7d, 4)}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">7-Day Low</div>
              <div class="stat-value">${formatNumber(low7d, 4)}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Volatility</div>
              <div class="stat-value">${volatility}%</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Open (7d)</div>
              <div class="stat-value">${formatNumber(open, 4)}</div>
            </div>
          </div>

          <div class="refresh-timer">
            Updated: ${timestamp} · Next refresh in <span id="countdown">60s</span>
          </div>
        </div>
      `;

      drawCandlestick(document.getElementById('chart'), ohlc);
      startCountdown();
    }

    function startCountdown() {
      let seconds = 60;
      const timerEl = document.getElementById('countdown');
      const interval = setInterval(() => {
        seconds--;
        if (timerEl) timerEl.textContent = seconds + 's';
        if (seconds <= 0) clearInterval(interval);
      }, 1000);
    }

    function setPair(pair) {
      currentPair = pair;
      document.querySelectorAll('.pair-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-pair="${pair}"]`).classList.add('active');
      render(pair);
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.pair-btn').forEach(btn => {
        btn.addEventListener('click', () => setPair(btn.dataset.pair));
      });
      render(currentPair);
      refreshInterval = setInterval(() => render(currentPair), 60000);
    });

    window.addEventListener('beforeunload', () => {
      if (refreshInterval) clearInterval(refreshInterval);
    });
  </script>
</body>
</html>
