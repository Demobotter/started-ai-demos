<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pair Momentum</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      color: #e0e0e0;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 30px;
      text-align: center;
      letter-spacing: -1px;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .pair-btn {
      padding: 10px 16px;
      background: #333;
      border: 1px solid #444;
      border-radius: 8px;
      color: #e0e0e0;
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .pair-btn:hover {
      background: #444;
      border-color: #d4af37;
    }
    .pair-btn.active {
      background: #d4af37;
      color: #1a1a1a;
      border-color: #d4af37;
    }
    .main-card {
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 24px;
    }
    .rate-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
      align-items: center;
    }
    .rate-pair {
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .rate-value {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -1px;
    }
    .rate-change {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.1rem;
      font-weight: 600;
    }
    .change-positive {
      color: #4ade80;
    }
    .change-negative {
      color: #ff6b6b;
    }
    .change-flat {
      color: #999;
    }
    .sparkline-container {
      height: 40px;
      margin: 20px 0;
    }
    .strength-section {
      margin-top: 28px;
      padding-top: 28px;
      border-top: 1px solid #3a3a3a;
    }
    .strength-label {
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #bbb;
      margin-bottom: 12px;
    }
    .strength-bar-container {
      height: 28px;
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #3a3a3a;
    }
    .strength-bar {
      height: 100%;
      background: linear-gradient(90deg, #333 0%, #d4af37 50%, #d4af37 100%);
      transition: width 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1a1a1a;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 24px;
    }
    .chart-card {
      background: #333;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      padding: 16px;
    }
    .chart-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #bbb;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
    }
    .error {
      background: #3a1a1a;
      border: 1px solid #6b2a2a;
      color: #ff6b6b;
      padding: 12px;
      border-radius: 8px;
      margin-top: 16px;
    }
    .timestamp {
      font-size: 0.85rem;
      color: #666;
      margin-top: 12px;
      text-align: center;
    }
    @media (max-width: 768px) {
      .rate-row {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .charts-grid {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 2rem;
      }
      .rate-value {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💱 Pair Momentum</h1>
    
    <div class="controls" id="controls"></div>
    
    <div class="main-card" id="mainCard">
      <div class="rate-row">
        <div>
          <div class="strength-label">Pair</div>
          <div class="rate-pair" id="pairName">USD/EUR</div>
        </div>
        <div>
          <div class="strength-label">Rate</div>
          <div class="rate-value" id="rateValue">—</div>
        </div>
        <div>
          <div class="strength-label">24h Change</div>
          <div class="rate-change" id="changeDisplay">—</div>
        </div>
      </div>
      
      <div class="sparkline-container">
        <canvas id="sparklineCanvas"></canvas>
      </div>
      
      <div class="strength-section">
        <div class="strength-label">Volatility Strength</div>
        <div class="strength-bar-container">
          <div class="strength-bar" id="strengthBar" style="width: 0%;">
            <span id="strengthValue">0/10</span>
          </div>
        </div>
      </div>
      
      <div class="charts-grid">
        <div class="chart-card">
          <div class="chart-title">24h OHLC</div>
          <canvas id="candleCanvas"></canvas>
        </div>
        <div class="chart-card">
          <div class="chart-title">7-Day Trend</div>
          <canvas id="trendCanvas"></canvas>
        </div>
      </div>
      
      <div id="error"></div>
      <div class="timestamp" id="timestamp"></div>
    </div>
  </div>

  <script>
    const PAIRS = ['EURUSD', 'GBPUSD', 'USDJPY', 'AUDUSD', 'NZDUSD', 'USDCAD', 'USDCHF'];
    let currentPair = 'EURUSD';
    let currentData = null;

    // Build controls
    const controlsDiv = document.getElementById('controls');
    PAIRS.forEach(pair => {
      const btn = document.createElement('button');
      btn.className = `pair-btn ${pair === currentPair ? 'active' : ''}`;
      btn.textContent = pair;
      btn.onclick = () => selectPair(pair);
      controlsDiv.appendChild(btn);
    });

    async function selectPair(pair) {
      currentPair = pair;
      document.querySelectorAll('.pair-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent === pair);
      });
      await loadData();
    }

    async function loadData() {
      try {
        document.getElementById('error').textContent = '';
        const from = currentPair.slice(0, 3);
        const to = currentPair.slice(3, 6);
        
        // Fetch 7-day history
        const resp = await fetch(`https://api.frankfurter.app/2024-01-01..?from=${from}&to=${to}`);
        if (!resp.ok) throw new Error('API fetch failed');
        
        const history = await resp.json();
        
        // Fetch latest
        const latestResp = await fetch(`https://api.frankfurter.app/latest?from=${from}&to=${to}`);
        if (!latestResp.ok) throw new Error('Latest rate fetch failed');
        
        const latest = await latestResp.json();
        
        currentData = {
          from,
          to,
          history: history.rates || {},
          latest: latest.rates[to],
          time: new Date(),
        };
        
        render();
      } catch (err) {
        document.getElementById('error').innerHTML = `<strong>Error:</strong> ${err.message}`;
      }
    }

    function render() {
      if (!currentData) return;
      
      const { from, to, history, latest, time } = currentData;
      const historicalValues = Object.values(history).map(r => r[to]).filter(v => v);
      
      // Rate display
      document.getElementById('pairName').textContent = `${from}/${to}`;
      document.getElementById('rateValue').textContent = latest.toFixed(4);
      
      // 24h change (fake 24h by using first historical entry)
      const firstRate = historicalValues[0];
      const change = latest - firstRate;
      const changePercent = ((change / firstRate) * 100).toFixed(2);
      const changeDiv = document.getElementById('changeDisplay');
      const changeClass = change > 0 ? 'change-positive' : change < 0 ? 'change-negative' : 'change-flat';
      changeDiv.className = `rate-change ${changeClass}`;
      changeDiv.textContent = `${change > 0 ? '↑' : change < 0 ? '↓' : '→'} ${Math.abs(changePercent)}%`;
      
      // Strength (volatility-based, 1-10 scale)
      const volatility = calculateVolatility(historicalValues);
      const strength = Math.min(10, Math.max(1, 1 + volatility * 15));
      document.getElementById('strengthBar').style.width = (strength / 10) * 100 + '%';
      document.getElementById('strengthValue').textContent = strength.toFixed(1) + '/10';
      
      // Sparkline (7-day mini line)
      drawSparkline(historicalValues);
      
      // OHLC Candle (fake from high/low of first 24 hours)
      drawOHLC(historicalValues);
      
      // 7-day trend line
      drawTrend(historicalValues);
      
      // Timestamp
      document.getElementById('timestamp').textContent = `Updated: ${time.toLocaleTimeString()}`;
    }

    function calculateVolatility(values) {
      if (values.length < 2) return 0;
      const mean = values.reduce((a, b) => a + b, 0) / values.length;
      const variance = values.reduce((sum, v) => sum + Math.pow(v - mean, 2), 0) / values.length;
      const stdDev = Math.sqrt(variance);
      return stdDev / mean; // coefficient of variation
    }

    function drawSparkline(values) {
      const canvas = document.getElementById('sparklineCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = 40;
      
      if (values.length < 2) return;
      
      const minVal = Math.min(...values);
      const maxVal = Math.max(...values);
      const range = maxVal - minVal || 1;
      
      const padding = 4;
      const width = canvas.width - 2 * padding;
      const height = canvas.height - 2 * padding;
      
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 2;
      ctx.beginPath();
      
      values.forEach((val, i) => {
        const x = padding + (i / (values.length - 1)) * width;
        const y = padding + height - ((val - minVal) / range) * height;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      
      ctx.stroke();
      
      // Dot for current (last) value
      const lastX = padding + width;
      const lastY = padding + height - ((values[values.length - 1] - minVal) / range) * height;
      ctx.fillStyle = '#d4af37';
      ctx.beginPath();
      ctx.arc(lastX, lastY, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawOHLC(values) {
      const canvas = document.getElementById('candleCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = 120;
      
      if (values.length < 2) return;
      
      // Fake OHLC from first segment
      const open = values[0];
      const close = values[Math.floor(values.length / 2)];
      const high = Math.max(...values.slice(0, Math.floor(values.length / 2)));
      const low = Math.min(...values.slice(0, Math.floor(values.length / 2)));
      
      const minVal = low - 0.01;
      const maxVal = high + 0.01;
      const range = maxVal - minVal || 1;
      
      const padding = 20;
      const width = canvas.width - 2 * padding;
      const height = canvas.height - 2 * padding;
      const candleX = padding + width / 2;
      
      // Wick
      const highY = padding + height - ((high - minVal) / range) * height;
      const lowY = padding + height - ((low - minVal) / range) * height;
      ctx.strokeStyle = close > open ? '#4ade80' : '#ff6b6b';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(candleX, highY);
      ctx.lineTo(candleX, lowY);
      ctx.stroke();
      
      // Body
      const openY = padding + height - ((open - minVal) / range) * height;
      const closeY = padding + height - ((close - minVal) / range) * height;
      const bodyHeight = Math.abs(closeY - openY) || 2;
      const candleWidth = 30;
      
      ctx.fillStyle = close > open ? '#4ade80' : '#ff6b6b';
      ctx.fillRect(candleX - candleWidth / 2, Math.min(openY, closeY), candleWidth, bodyHeight);
      
      // Labels
      ctx.fillStyle = '#999';
      ctx.font = '11px Inter';
      ctx.textAlign = 'center';
      ctx.fillText(`O: ${open.toFixed(4)}`, candleX, canvas.height - 2);
      ctx.fillText(`H: ${high.toFixed(4)}`, candleX - 40, canvas.height - 2);
      ctx.fillText(`L: ${low.toFixed(4)}`, candleX + 40, canvas.height - 2);
    }

    function drawTrend(values) {
      const canvas = document.getElementById('trendCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = 120;
      
      if (values.length < 2) return;
      
      const minVal = Math.min(...values);
      const maxVal = Math.max(...values);
      const range = maxVal - minVal || 1;
      
      const padding = 20;
      const width = canvas.width - 2 * padding;
      const height = canvas.height - 2 * padding;
      
      // Line
      ctx.strokeStyle = '#4ade80';
      ctx.lineWidth = 2;
      ctx.beginPath();
      
      values.forEach((val, i) => {
        const x = padding + (i / (values.length - 1)) * width;
        const y = padding + height - ((val - minVal) / range) * height;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      
      ctx.stroke();
      
      // Area under curve
      ctx.fillStyle = 'rgba(74, 222, 128, 0.1)';
      ctx.lineTo(padding + width, padding + height);
      ctx.lineTo(padding, padding + height);
      ctx.closePath();
      ctx.fill();
    }

    // Initial load and refresh every 60s
    loadData();
    setInterval(loadData, 60000);
  </script>
</body>
</html>
