<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strength Meter</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      width: 100%;
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .header p {
      color: #aaa;
      font-size: 0.95rem;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .pair-btn {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid #d4af37;
      color: #d4af37;
      padding: 8px 14px;
      border-radius: 6px;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .pair-btn:hover, .pair-btn.active {
      background: #d4af37;
      color: #1a1a1a;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
    }
    .card-label {
      font-family: 'Syne', sans-serif;
      font-size: 0.85rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .rate-display {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 16px;
    }
    .rate {
      font-family: 'Syne', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
    }
    .change-badge {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(76, 175, 80, 0.2);
      color: #4caf50;
    }
    .change-badge.down {
      background: rgba(244, 67, 54, 0.2);
      color: #f44336;
    }
    .change-badge.flat {
      background: rgba(158, 158, 158, 0.2);
      color: #aaa;
    }
    .sparkline {
      width: 100%;
      height: 40px;
      margin-top: 12px;
    }
    .strength-section {
      margin-top: 20px;
    }
    .strength-label {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .strength-bar {
      background: rgba(212, 175, 55, 0.2);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .strength-fill {
      background: linear-gradient(90deg, #d4af37, #f0c860);
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .ohlc {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 16px;
    }
    .ohlc-item {
      background: rgba(255, 255, 255, 0.04);
      padding: 10px;
      border-radius: 6px;
      text-align: center;
    }
    .ohlc-label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .ohlc-value {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 1.1rem;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
    }
    .stat-item {
      background: rgba(255, 255, 255, 0.04);
      padding: 12px;
      border-radius: 6px;
      text-align: center;
    }
    .stat-label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .stat-value {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 1.2rem;
    }
    .loading {
      text-align: center;
      color: #aaa;
      padding: 20px;
    }
    .error {
      background: rgba(244, 67, 54, 0.15);
      border: 1px solid #f44336;
      color: #ff9999;
      padding: 12px;
      border-radius: 6px;
      margin-top: 16px;
    }
    .refresh-indicator {
      font-size: 0.8rem;
      color: #666;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>💱 Strength Meter</h1>
      <p>Real-time forex momentum tracker</p>
    </div>

    <div class="controls">
      <button class="pair-btn active" data-pair="EURUSD">EUR/USD</button>
      <button class="pair-btn" data-pair="GBPUSD">GBP/USD</button>
      <button class="pair-btn" data-pair="USDJPY">USD/JPY</button>
      <button class="pair-btn" data-pair="AUDUSD">AUD/USD</button>
      <button class="pair-btn" data-pair="NZDUSD">NZD/USD</button>
    </div>

    <div id="content">
      <div class="loading">Loading real-time data from frankfurter.app...</div>
    </div>

    <div class="refresh-indicator">
      Last refresh: <span id="refresh-time">--:--:--</span> • Auto-refresh every 60s
    </div>
  </div>

  <script>
    const pairMapping = {
      EURUSD: { from: 'EUR', to: 'USD' },
      GBPUSD: { from: 'GBP', to: 'USD' },
      USDJPY: { from: 'USD', to: 'JPY' },
      AUDUSD: { from: 'AUD', to: 'USD' },
      NZDUSD: { from: 'NZD', to: 'USD' }
    };

    let currentPair = 'EURUSD';
    let historicalData = {};
    let refreshInterval;

    document.querySelectorAll('.pair-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.pair-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentPair = btn.dataset.pair;
        updateDisplay();
      });
    });

    function updateTime() {
      const now = new Date();
      document.getElementById('refresh-time').textContent = now.toLocaleTimeString();
    }

    async function fetchHistoricalRates() {
      try {
        const mapping = pairMapping[currentPair];
        const url = `https://api.frankfurter.app/timeseries?from=${mapping.from}&to=${mapping.to}&precision=4`;
        const response = await fetch(url);
        if (!response.ok) throw new Error(`API error: ${response.status}`);
        const data = await response.json();
        return data.rates || {};
      } catch (error) {
        console.error('Fetch error:', error);
        return {};
      }
    }

    async function fetchLatestRate() {
      try {
        const mapping = pairMapping[currentPair];
        const url = `https://api.frankfurter.app/latest?from=${mapping.from}&to=${mapping.to}`;
        const response = await fetch(url);
        if (!response.ok) throw new Error(`API error: ${response.status}`);
        const data = await response.json();
        return data.rates ? data.rates[mapping.to] : null;
      } catch (error) {
        console.error('Fetch error:', error);
        return null;
      }
    }

    function calculateOHLC(rates) {
      const values = Object.values(rates).filter(v => typeof v === 'number');
      if (values.length === 0) return { open: 0, high: 0, low: 0, close: 0 };
      const sorted = [...values].sort((a, b) => a - b);
      return {
        open: values[0],
        high: Math.max(...values),
        low: Math.min(...values),
        close: values[values.length - 1]
      };
    }

    function calculateStrength(rates, latestRate) {
      const values = Object.values(rates).filter(v => typeof v === 'number');
      if (values.length < 2) return 0;
      const mean = values.reduce((a, b) => a + b, 0) / values.length;
      const variance = values.reduce((sum, v) => sum + Math.pow(v - mean, 2), 0) / values.length;
      const volatility = Math.sqrt(variance);
      const trend = latestRate > mean ? 1 : -1;
      const trendMagnitude = Math.abs(latestRate - mean) / mean * 100;
      const volPct = Math.min(volatility / mean * 100 * 10, 5);
      const trendScore = Math.min(trendMagnitude / 2, 5);
      return Math.min((volPct + trendScore) / 10, 1);
    }

    async function updateDisplay() {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading">Loading real-time data...</div>';
      updateTime();

      const latestRate = await fetchLatestRate();
      const rates = await fetchHistoricalRates();
      historicalData[currentPair] = rates;

      if (!latestRate) {
        content.innerHTML = '<div class="error">Failed to fetch rates. Please try again.</div>';
        return;
      }

      const ohlc = calculateOHLC(rates);
      const strength = calculateStrength(rates, latestRate);
      
      const values = Object.values(rates).filter(v => typeof v === 'number');
      const prevRate = values[values.length - 2] || latestRate;
      const change = latestRate - prevRate;
      const changePct = (change / prevRate * 100).toFixed(4);
      const pips = (change * 10000).toFixed(1);

      let changeBadgeClass = 'flat';
      let changeSymbol = '→';
      if (change > 0.00001) {
        changeBadgeClass = 'up';
        changeSymbol = '↑';
      } else if (change < -0.00001) {
        changeBadgeClass = 'down';
        changeSymbol = '↓';
      }

      const pair = currentPair;
      const mapping = pairMapping[pair];

      // SVG sparkline
      const minRate = Math.min(...values);
      const maxRate = Math.max(...values);
      const range = maxRate - minRate || 1;
      const svgWidth = 100;
      const svgHeight = 40;
      const pointCount = Math.min(values.length, 50);
      const step = Math.floor(values.length / pointCount);
      const points = [];
      for (let i = 0; i < values.length; i += Math.max(1, step)) {
        const x = (i / values.length) * svgWidth;
        const y = svgHeight - ((values[i] - minRate) / range) * svgHeight;
        points.push(`${x},${y}`);
      }
      const sparklineSVG = `<svg class="sparkline" viewBox="0 0 ${svgWidth} ${svgHeight}" preserveAspectRatio="none">
        <polyline points="${points.join(' ')}" fill="none" stroke="#d4af37" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
      </svg>`;

      content.innerHTML = `
        <div class="card">
          <div class="card-label">Live Rate</div>
          <div class="rate-display">
            <div class="rate">${latestRate.toFixed(5)}</div>
            <div class="change-badge ${changeBadgeClass}">${changeSymbol} ${Math.abs(changePct)}% (${pips} pips)</div>
          </div>
          ${sparklineSVG}
          <div class="strength-section">
            <div class="strength-label">
              <span>Momentum Strength</span>
              <span>${(strength * 10).toFixed(1)}/10</span>
            </div>
            <div class="strength-bar">
              <div class="strength-fill" style="width: ${strength * 100}%"></div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-label">24-Hour OHLC</div>
          <div class="ohlc">
            <div class="ohlc-item">
              <div class="ohlc-label">Open</div>
              <div class="ohlc-value">${ohlc.open.toFixed(5)}</div>
            </div>
            <div class="ohlc-item">
              <div class="ohlc-label">High</div>
              <div class="ohlc-value">${ohlc.high.toFixed(5)}</div>
            </div>
            <div class="ohlc-item">
              <div class="ohlc-label">Low</div>
              <div class="ohlc-value">${ohlc.low.toFixed(5)}</div>
            </div>
            <div class="ohlc-item">
              <div class="ohlc-label">Close</div>
              <div class="ohlc-value">${ohlc.close.toFixed(5)}</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-label">Statistics</div>
          <div class="stats-grid">
            <div class="stat-item">
              <div class="stat-label">Range</div>
              <div class="stat-value">${(ohlc.high - ohlc.low).toFixed(5)}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">Volatility</div>
              <div class="stat-value">${(Math.sqrt(Object.values(rates).reduce((s, v) => s + Math.pow(v - Object.values(rates).reduce((a, b) => a + b, 0) / Object.values(rates).length, 2), 0) / Object.values(rates).length) / Object.values(rates).reduce((a, b) => a + b, 0) * Object.values(rates).length * 100).toFixed(2)}%</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">Data Points</div>
              <div class="stat-value">${Object.keys(rates).length}</div>
            </div>
          </div>
        </div>
      `;
    }

    function startAutoRefresh() {
      if (refreshInterval) clearInterval(refreshInterval);
      refreshInterval = setInterval(() => {
        updateDisplay();
      }, 60000);
    }

    updateDisplay();
    startAutoRefresh();

    window.addEventListener('beforeunload', () => {
      if (refreshInterval) clearInterval(refreshInterval);
    });
  </script>
</body>
</html>
