<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breath Check</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            font-size: 13px;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 24px;
        }
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }
        input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099ff 100%);
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 212, 255, 0.3);
        }
        button:active {
            transform: translateY(0);
        }
        .loading {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            display: none;
        }
        .error {
            background: rgba(255, 59, 48, 0.15);
            border: 1px solid rgba(255, 59, 48, 0.3);
            color: #ff6b6b;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .results {
            display: none;
        }
        .aqi-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .aqi-value {
            font-family: 'Poppins', sans-serif;
            font-size: 48px;
            font-weight: 700;
            margin: 8px 0;
        }
        .aqi-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
        }
        .city-name {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 16px;
            text-align: center;
        }
        .pollutant-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            align-items: center;
        }
        .pollutant-name {
            width: 50px;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
        }
        .pollutant-bar-container {
            flex: 1;
            height: 24px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .pollutant-bar {
            height: 100%;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
            font-size: 11px;
            font-weight: 500;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            transition: width 0.4s ease;
        }
        .severity-green { background: linear-gradient(90deg, #10b981, #34d399); }
        .severity-yellow { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .severity-orange { background: linear-gradient(90deg, #f97316, #fb923c); }
        .severity-red { background: linear-gradient(90deg, #ef4444, #f87171); }
        .severity-purple { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }
        .timestamp {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Breath Check</h1>
        <p class="subtitle">Real-time air quality for any city</p>
        
        <div class="input-group">
            <input type="text" id="cityInput" placeholder="Enter city name...">
            <button onclick="fetchAQI()">Check</button>
        </div>
        
        <div class="error" id="error"></div>
        <div class="loading" id="loading">Fetching air quality data...</div>
        
        <div class="results" id="results">
            <div class="aqi-header">
                <div class="aqi-label">Air Quality Index</div>
                <div class="aqi-value" id="aqiValue">—</div>
                <div class="city-name" id="cityName"></div>
            </div>
            
            <div id="pollutants"></div>
            <div class="timestamp" id="timestamp"></div>
        </div>
    </div>

    <script>
        async function fetchAQI() {
            const cityInput = document.getElementById('cityInput').value.trim();
            if (!cityInput) return;

            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const results = document.getElementById('results');

            loading.style.display = 'block';
            error.style.display = 'none';
            results.style.display = 'none';

            try {
                // Geocode city to lat/lon
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?city=${encodeURIComponent(cityInput)}&format=json&limit=1`);
                const geoData = await geoRes.json();

                if (!geoData.length) {
                    throw new Error('City not found');
                }

                const lat = parseFloat(geoData[0].lat);
                const lon = parseFloat(geoData[0].lon);
                const displayName = geoData[0].display_name.split(',')[0];

                // Fetch air quality
                const aqRes = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi,pm10,pm2_5,ozone,nitrogen_dioxide,sulphur_dioxide,carbon_monoxide&timezone=auto`);
                const aqData = await aqRes.json();
                const current = aqData.current;

                // Map data
                const pollutants = [
                    { name: 'PM2.5', value: current.pm2_5, unit: 'µg/m³', max: 100 },
                    { name: 'PM10', value: current.pm10, unit: 'µg/m³', max: 150 },
                    { name: 'O3', value: current.ozone, unit: 'ppb', max: 100 },
                    { name: 'NO2', value: current.nitrogen_dioxide, unit: 'ppb', max: 100 },
                    { name: 'SO2', value: current.sulphur_dioxide, unit: 'ppb', max: 50 },
                    { name: 'CO', value: current.carbon_monoxide, unit: 'ppb', max: 1000 }
                ];

                // Determine AQI category
                const usAqi = current.us_aqi;
                let aqiLabel = '';
                if (usAqi <= 50) aqiLabel = 'Good';
                else if (usAqi <= 100) aqiLabel = 'Moderate';
                else if (usAqi <= 150) aqiLabel = 'Unhealthy for Sensitive Groups';
                else if (usAqi <= 200) aqiLabel = 'Unhealthy';
                else if (usAqi <= 300) aqiLabel = 'Very Unhealthy';
                else aqiLabel = 'Hazardous';

                // Render
                document.getElementById('aqiValue').textContent = Math.round(usAqi);
                document.getElementById('cityName').textContent = displayName;

                const pollutantsHtml = pollutants.map(p => {
                    const value = p.value !== null ? p.value : 0;
                    const pct = Math.min(100, (value / p.max) * 100);
                    let severity = 'green';
                    if (pct > 80) severity = 'red';
                    else if (pct > 60) severity = 'orange';
                    else if (pct > 40) severity = 'yellow';
                    else if (pct > 20) severity = 'purple';

                    return `
                        <div class="pollutant-row">
                            <div class="pollutant-name">${p.name}</div>
                            <div class="pollutant-bar-container">
                                <div class="pollutant-bar severity-${severity}" style="width: ${pct}%">
                                    ${value !== null ? value.toFixed(1) : '—'} ${p.unit}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                document.getElementById('pollutants').innerHTML = pollutantsHtml;
                document.getElementById('timestamp').textContent = `Updated: ${new Date().toLocaleTimeString()}`;

                loading.style.display = 'none';
                results.style.display = 'block';
            } catch (err) {
                loading.style.display = 'none';
                error.textContent = err.message || 'Failed to fetch data';
                error.style.display = 'block';
            }
        }

        // Allow Enter key
        document.getElementById('cityInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchAQI();
        });

        // Try initial city on load
        window.addEventListener('load', () => {
            document.getElementById('cityInput').value = 'Melbourne';
            fetchAQI();
        });
    </script>
</body>
</html>
