<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petri Dish Cultivator</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Mono', monospace;
      background: linear-gradient(135deg, #0a1428 0%, #1a1a2e 100%);
      color: #f5ead6;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 30px;
    }
    .header {
      grid-column: 1 / -1;
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5em;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }
    .header p {
      font-size: 0.95em;
      opacity: 0.85;
      color: #a0a0a0;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .panel {
      background: rgba(32, 32, 48, 0.8);
      border: 1px solid #2d5a6d;
      border-radius: 8px;
      padding: 16px;
    }
    .panel h3 {
      font-size: 0.9em;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      color: #7dd3fc;
      font-weight: bold;
    }
    .button-group {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    button {
      padding: 10px 12px;
      background: #1a3a4a;
      border: 1px solid #2d7a9d;
      color: #f5ead6;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 0.85em;
      transition: all 0.2s;
      text-align: left;
    }
    button:hover {
      background: #2d5a7d;
      border-color: #4da8da;
    }
    button.active {
      background: #4da8da;
      border-color: #7dd3fc;
      color: #0a1428;
      font-weight: bold;
    }
    .slider-group {
      margin-bottom: 14px;
    }
    .slider-label {
      font-size: 0.8em;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #1a3a4a;
      outline: none;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #4da8da;
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #4da8da;
      cursor: pointer;
      border: none;
    }
    .stats-box {
      background: rgba(16, 64, 80, 0.6);
      border-left: 3px solid #2d9d5f;
      padding: 12px;
      border-radius: 4px;
      font-size: 0.8em;
      margin-bottom: 10px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .stat-row:last-child {
      margin-bottom: 0;
    }
    .stat-label {
      opacity: 0.75;
    }
    .stat-value {
      font-weight: bold;
      color: #7dd3fc;
    }
    .main {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .canvas-wrapper {
      background: rgba(32, 32, 48, 0.8);
      border: 1px solid #2d5a6d;
      border-radius: 8px;
      padding: 16px;
    }
    #dishCanvas {
      width: 100%;
      height: 400px;
      background: #f5ead6;
      border-radius: 6px;
      display: block;
      border: 2px solid #2d9d5f;
    }
    .graph-wrapper {
      background: rgba(32, 32, 48, 0.8);
      border: 1px solid #2d5a6d;
      border-radius: 8px;
      padding: 16px;
    }
    #graphCanvas {
      width: 100%;
      height: 250px;
      background: #0f1419;
      border-radius: 6px;
      display: block;
      border: 1px solid #2d5a6d;
    }
    .nutrient-bar {
      background: rgba(32, 32, 48, 0.8);
      border: 1px solid #2d5a6d;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .nutrient-label {
      font-size: 0.75em;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .nutrient-fill {
      width: 100%;
      height: 12px;
      background: #1a3a4a;
      border-radius: 3px;
      overflow: hidden;
    }
    .nutrient-inner {
      height: 100%;
      background: linear-gradient(90deg, #00d4ff, #ff6b6b);
      width: 100%;
      border-radius: 3px;
      transition: width 0.3s;
    }
    .toggle-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .toggle-btn {
      flex: 1;
      padding: 8px;
      font-size: 0.75em;
    }
    .toggle-btn.inactive {
      opacity: 0.5;
    }
    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
      .header {
        grid-column: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🧬 Petri Dish Cultivator</h1>
      <p>Watch bacteria divide, consume nutrients, and compete for resources</p>
    </div>

    <div class="sidebar">
      <div class="panel">
        <h3>Bacterium</h3>
        <div class="button-group">
          <button class="bacteria-btn active" data-species="ecoli">E. coli (fast)</button>
          <button class="bacteria-btn" data-species="subtilis">B. subtilis (fila)</button>
          <button class="bacteria-btn" data-species="aeruginosa">P. aeruginosa (slow)</button>
          <button class="bacteria-btn" data-species="streptococcus">Streptococcus (clusters)</button>
          <button class="bacteria-btn" data-species="bacillus">Bacillus (spores)</button>
          <button class="bacteria-btn" data-species="vibrio">Vibrio (curved)</button>
        </div>
      </div>

      <div class="panel">
        <h3>Growth Medium</h3>
        <div class="button-group">
          <button class="medium-btn active" data-medium="rich">Rich (fast)</button>
          <button class="medium-btn" data-medium="minimal">Minimal (slow)</button>
          <button class="medium-btn" data-medium="selective">Selective (inhibits)</button>
          <button class="medium-btn" data-medium="anaerobic">Anaerobic (alt)</button>
        </div>
      </div>

      <div class="panel">
        <h3>Presets</h3>
        <div class="button-group">
          <button class="preset-btn" data-preset="optimal">Optimal 37°C</button>
          <button class="preset-btn" data-preset="biofilm">Biofilm Form.</button>
          <button class="preset-btn" data-preset="stress">Stress Cond.</button>
          <button class="preset-btn" data-preset="antibiotic">Antibiotic</button>
        </div>
      </div>

      <div class="nutrient-bar">
        <div class="nutrient-label">
          <span>Nutrients</span>
          <span id="nutrientPct">100%</span>
        </div>
        <div class="nutrient-fill">
          <div class="nutrient-inner" id="nutrientInner"></div>
        </div>
      </div>

      <div class="slider-group">
        <div class="slider-label">
          <span>Time (hours)</span>
          <span id="timeVal">0</span>
        </div>
        <input type="range" id="timeSlider" min="0" max="48" value="0" step="0.1">
      </div>

      <div class="stats-box">
        <div class="stat-row">
          <span class="stat-label">Generation</span>
          <span class="stat-value" id="generationStat">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Population</span>
          <span class="stat-value" id="populationStat">1</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Doubling (min)</span>
          <span class="stat-value" id="doublingTimeStat">20</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Phase</span>
          <span class="stat-value" id="phaseStat">Lag</span>
        </div>
      </div>

      <div class="stats-box">
        <div class="stat-row">
          <span class="stat-label">Max Density</span>
          <span class="stat-value" id="maxDensityStat">Low</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Waste Accum.</span>
          <span class="stat-value" id="wasteAccumStat">0%</span>
        </div>
      </div>

      <div class="toggle-group">
        <button class="toggle-btn" id="toggleWaste">Show Waste</button>
        <button class="toggle-btn" id="toggleStart" style="background: #2d9d5f; border-color: #4da8da;">Start</button>
      </div>
    </div>

    <div class="main">
      <div class="canvas-wrapper">
        <canvas id="dishCanvas"></canvas>
      </div>
      <div class="graph-wrapper">
        <canvas id="graphCanvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    const dishCanvas = document.getElementById('dishCanvas');
    const dishCtx = dishCanvas.getContext('2d');
    const graphCanvas = document.getElementById('graphCanvas');
    const graphCtx = graphCanvas.getContext('2d');

    // Set canvas size
    function resizeCanvases() {
      const dishRect = dishCanvas.parentElement.getBoundingClientRect();
      dishCanvas.width = dishRect.width - 32;
      dishCanvas.height = 400;
      const graphRect = graphCanvas.parentElement.getBoundingClientRect();
      graphCanvas.width = graphRect.width - 32;
      graphCanvas.height = 250;
    }
    resizeCanvases();
    window.addEventListener('resize', resizeCanvases);

    // Species parameters (doubling time in minutes)
    const speciesParams = {
      ecoli: { doublingTime: 20, color: [255, 100, 120], maxDensity: 1000 },
      subtilis: { doublingTime: 30, color: [180, 120, 90], maxDensity: 900 },
      aeruginosa: { doublingTime: 40, color: [200, 80, 100], maxDensity: 800 },
      streptococcus: { doublingTime: 35, color: [220, 100, 140], maxDensity: 850 },
      bacillus: { doublingTime: 25, color: [150, 100, 180], maxDensity: 920 },
      vibrio: { doublingTime: 22, color: [100, 150, 200], maxDensity: 950 }
    };

    // Medium parameters (nutrient depletion rate, growth inhibition)
    const mediumParams = {
      rich: { depletionRate: 0.015, inhibition: 0 },
      minimal: { depletionRate: 0.008, inhibition: 0 },
      selective: { depletionRate: 0.012, inhibition: 0.4 },
      anaerobic: { depletionRate: 0.018, inhibition: 0.2 }
    };

    let state = {
      species: 'ecoli',
      medium: 'rich',
      time: 0,
      isPlaying: false,
      showWaste: false,
      startTime: Date.now(),
      nutrientLevel: 1.0,
      bacteria: [],
      wasteLevel: 0
    };

    // Initialize simulation
    function initSimulation() {
      state.bacteria = [{ x: 0.5, y: 0.5, age: 0 }];
      state.wasteLevel = 0;
      state.nutrientLevel = 1.0;
      state.time = 0;
      document.getElementById('timeSlider').value = 0;
      updateStats();
      render();
    }

    // Calculate population at given time (logistic growth with nutrient constraint)
    function getPopulationAt(hours) {
      const species = speciesParams[state.species];
      const medium = mediumParams[state.medium];
      const doublingTimeHours = species.doublingTime / 60;
      
      // Inhibition factor from selective medium
      const inhibitionFactor = Math.max(0, 1 - medium.inhibition);
      
      // Exponential growth rate
      const rate = Math.log(2) / doublingTimeHours * inhibitionFactor;
      
      // Logistic curve: population grows exponentially then plateaus as nutrients deplete
      const timeToMaxNutrients = 8; // hours until nutrients significantly depleted
      const nutrientConstraint = 1 - (Math.min(hours, timeToMaxNutrients) / timeToMaxNutrients) * (1 - (1 - medium.depletionRate * 100));
      
      const expGrowth = Math.exp(rate * hours);
      const logistic = expGrowth / (1 + (expGrowth - 1) / species.maxDensity);
      
      return Math.max(1, logistic * nutrientConstraint);
    }

    function getNutrientLevelAt(hours) {
      const medium = mediumParams[state.medium];
      return Math.max(0.1, 1 - (hours / 48) * medium.depletionRate * 100);
    }

    function getWasteLevelAt(hours) {
      const popAt = getPopulationAt(hours);
      return Math.min(1, (popAt / 1000) * 0.5); // waste accumulates with population
    }

    function getGrowthPhase(hours, population) {
      if (hours < 2) return 'Lag';
      if (hours < 12) return 'Log';
      if (hours < 36) return 'Stationary';
      return 'Death';
    }

    function updateStats() {
      const species = speciesParams[state.species];
      const hours = state.time;
      const pop = getPopulationAt(hours);
      const nutrient = getNutrientLevelAt(hours);
      const waste = getWasteLevelAt(hours);
      
      const generation = Math.floor(Math.log2(pop));
      const phase = getGrowthPhase(hours, pop);
      
      document.getElementById('generationStat').textContent = generation;
      document.getElementById('populationStat').textContent = Math.round(pop);
      document.getElementById('doublingTimeStat').textContent = species.doublingTime;
      document.getElementById('phaseStat').textContent = phase;
      document.getElementById('nutrientPct').textContent = Math.round(nutrient * 100) + '%';
      document.getElementById('nutrientInner').style.width = (nutrient * 100) + '%';
      document.getElementById('wasteAccumStat').textContent = Math.round(waste * 100) + '%';
      
      const densityLevel = pop < 100 ? 'Low' : pop < 500 ? 'Med' : 'High';
      document.getElementById('maxDensityStat').textContent = densityLevel;
      
      state.nutrientLevel = nutrient;
      state.wasteLevel = waste;
    }

    function render() {
      const species = speciesParams[state.species];
      const pop = getPopulationAt(state.time);
      const waste = state.showWaste ? getWasteLevelAt(state.time) : 0;
      
      // Clear petri dish
      dishCtx.fillStyle = '#f5ead6';
      dishCtx.fillRect(0, 0, dishCanvas.width, dishCanvas.height);
      
      // Draw petri dish circle border
      const centerX = dishCanvas.width / 2;
      const centerY = dishCanvas.height / 2;
      const radius = Math.min(centerX, centerY) * 0.9;
      
      dishCtx.strokeStyle = '#2c3e50';
      dishCtx.lineWidth = 2;
      dishCtx.beginPath();
      dishCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      dishCtx.stroke();
      
      // Draw waste accumulation (yellow haze)
      if (waste > 0) {
        const wasteRadius = radius * (0.3 + waste * 0.4);
        const grad = dishCtx.createRadialGradient(centerX, centerY, 0, centerX, centerY, wasteRadius);
        grad.addColorStop(0, `rgba(255, 235, 59, ${waste * 0.4})`);
        grad.addColorStop(1, `rgba(255, 235, 59, ${waste * 0.05})`);
        dishCtx.fillStyle = grad;
        dishCtx.beginPath();
        dishCtx.arc(centerX, centerY, wasteRadius, 0, Math.PI * 2);
        dishCtx.fill();
      }
      
      // Render bacterial colony (as gradient density visualization)
      const colonyRadius = radius * Math.min(0.95, 0.1 + Math.log2(pop) * 0.15);
      const densityNormalized = Math.min(1, pop / 1000);
      
      // Create gradient from center (dense) to edge (sparse)
      const gradBacteria = dishCtx.createRadialGradient(centerX, centerY, 0, centerX, centerY, colonyRadius);
      const color = species.color;
      gradBacteria.addColorStop(0, `rgb(${color[0]}, ${color[1]}, ${color[2]})`);
      gradBacteria.addColorStop(0.5, `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${densityNormalized * 0.6})`);
      gradBacteria.addColorStop(1, `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${densityNormalized * 0.1})`);
      
      dishCtx.fillStyle = gradBacteria;
      dishCtx.beginPath();
      dishCtx.arc(centerX, centerY, colonyRadius, 0, Math.PI * 2);
      dishCtx.fill();
      
      // Add some individual cell-like dots for visual interest
      const numCells = Math.min(200, Math.floor(pop / 5));
      dishCtx.fillStyle = `rgba(${color[0]}, ${color[1]}, ${color[2]}, 0.8)`;
      for (let i = 0; i < numCells; i++) {
        const angle = (i / numCells) * Math.PI * 2 + state.time * 0.01;
        const r = Math.random() * colonyRadius * 0.9;
        const x = centerX + Math.cos(angle) * r;
        const y = centerY + Math.sin(angle) * r;
        const cellSize = 1 + Math.random() * 1.5;
        dishCtx.beginPath();
        dishCtx.arc(x, y, cellSize, 0, Math.PI * 2);
        dishCtx.fill();
      }
      
      // Render population growth graph
      renderGraph();
    }

    function renderGraph() {
      graphCtx.fillStyle = '#0f1419';
      graphCtx.fillRect(0, 0, graphCanvas.width, graphCanvas.height);
      
      // Draw axes
      graphCtx.strokeStyle = '#444';
      graphCtx.lineWidth = 1;
      graphCtx.beginPath();
      graphCtx.moveTo(40, graphCanvas.height - 40);
      graphCtx.lineTo(graphCanvas.width - 20, graphCanvas.height - 40);
      graphCtx.stroke();
      
      graphCtx.beginPath();
      graphCtx.moveTo(40, 20);
      graphCtx.lineTo(40, graphCanvas.height - 40);
      graphCtx.stroke();
      
      // Labels
      graphCtx.fillStyle = '#999';
      graphCtx.font = '11px "Space Mono"';
      graphCtx.textAlign = 'center';
      graphCtx.fillText('Time (hours)', graphCanvas.width / 2, graphCanvas.height - 10);
      graphCtx.save();
      graphCtx.translate(15, graphCanvas.height / 2);
      graphCtx.rotate(-Math.PI / 2);
      graphCtx.fillText('Population', 0, 0);
      graphCtx.restore();
      
      // Draw grid
      graphCtx.strokeStyle = 'rgba(68, 68, 68, 0.3)';
      graphCtx.lineWidth = 1;
      for (let i = 0; i <= 48; i += 8) {
        const x = 40 + (i / 48) * (graphCanvas.width - 60);
        graphCtx.beginPath();
        graphCtx.moveTo(x, graphCanvas.height - 40);
        graphCtx.lineTo(x, 20);
        graphCtx.stroke();
        graphCtx.fillStyle = '#666';
        graphCtx.textAlign = 'center';
        graphCtx.fillText(i, x, graphCanvas.height - 25);
      }
      
      // Draw population curve
      graphCtx.strokeStyle = '#4da8da';
      graphCtx.lineWidth = 2;
      graphCtx.beginPath();
      
      const plotWidth = graphCanvas.width - 60;
      const plotHeight = graphCanvas.height - 60;
      
      let firstPoint = true;
      for (let h = 0; h <= 48; h += 0.5) {
        const pop = getPopulationAt(h);
        const x = 40 + (h / 48) * plotWidth;
        const y = graphCanvas.height - 40 - Math.log(pop + 1) / Math.log(1000 + 1) * plotHeight;
        
        if (firstPoint) {
          graphCtx.moveTo(x, y);
          firstPoint = false;
        } else {
          graphCtx.lineTo(x, y);
        }
      }
      graphCtx.stroke();
      
      // Mark current time
      const currentX = 40 + (state.time / 48) * plotWidth;
      graphCtx.fillStyle = '#ff6b6b';
      graphCtx.beginPath();
      graphCtx.arc(currentX, graphCanvas.height - 40 - Math.log(getPopulationAt(state.time) + 1) / Math.log(1001) * plotHeight, 4, 0, Math.PI * 2);
      graphCtx.fill();
      
      // Add phase labels
      graphCtx.font = '10px "Space Mono"';
      graphCtx.fillStyle = 'rgba(125, 211, 252, 0.5)';
      graphCtx.textAlign = 'center';
      graphCtx.fillText('Lag', 40 + (1 / 48) * plotWidth, 30);
      graphCtx.fillText('Log', 40 + (7 / 48) * plotWidth, 30);
      graphCtx.fillText('Stationary', 40 + (24 / 48) * plotWidth, 30);
    }

    function animate() {
      if (state.isPlaying) {
        const elapsed = (Date.now() - state.startTime) / 1000 / 60; // Convert to minutes
        state.time = Math.min(48, elapsed);
        document.getElementById('timeSlider').value = state.time;
        document.getElementById('timeVal').textContent = state.time.toFixed(1);
      }
      
      updateStats();
      render();
      requestAnimationFrame(animate);
    }

    // Event listeners
    document.querySelectorAll('.bacteria-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        document.querySelectorAll('.bacteria-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        state.species = e.target.dataset.species;
        initSimulation();
      });
    });

    document.querySelectorAll('.medium-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        document.querySelectorAll('.medium-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        state.medium = e.target.dataset.medium;
        initSimulation();
      });
    });

    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        const preset = e.target.dataset.preset;
        if (preset === 'optimal') {
          state.species = 'ecoli';
          state.medium = 'rich';
        } else if (preset === 'biofilm') {
          state.species = 'aeruginosa';
          state.medium = 'rich';
        } else if (preset === 'stress') {
          state.species = 'bacillus';
          state.medium = 'selective';
        } else if (preset === 'antibiotic') {
          state.species = 'ecoli';
          state.medium = 'selective';
        }
        
        document.querySelectorAll('.bacteria-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.species === state.species);
        });
        document.querySelectorAll('.medium-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.medium === state.medium);
        });
        
        initSimulation();
      });
    });

    document.getElementById('timeSlider').addEventListener('input', e => {
      state.time = parseFloat(e.target.value);
      state.isPlaying = false;
      document.getElementById('toggleStart').textContent = 'Start';
      document.getElementById('timeVal').textContent = state.time.toFixed(1);
      updateStats();
      render();
    });

    document.getElementById('toggleWaste').addEventListener('click', e => {
      state.showWaste = !state.showWaste;
      e.target.classList.toggle('inactive', !state.showWaste);
      render();
    });

    document.getElementById('toggleStart').addEventListener('click', e => {
      state.isPlaying = !state.isPlaying;
      if (state.isPlaying) {
        state.startTime = Date.now() - (state.time * 60 * 1000); // Adjust start time for current slider position
        e.target.textContent = 'Pause';
      } else {
        e.target.textContent = 'Start';
      }
    });

    // Initialize
    initSimulation();
    animate();
  </script>
</body>
</html>
