<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geomagnetism Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f1620 0%, #1a2744 100%);
            color: #e8eef5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(20, 28, 48, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(139, 169, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
        }
        h1 {
            font-family: 'Syne', serif;
            font-size: 2.2rem;
            margin-bottom: 8px;
            color: #ffffff;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #a0afc0;
            margin-bottom: 32px;
        }
        .status-section {
            margin-bottom: 36px;
        }
        .status-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7a8fa6;
            margin-bottom: 12px;
        }
        .gauge-wrapper {
            position: relative;
            height: 180px;
            margin-bottom: 20px;
        }
        svg.gauge {
            width: 100%;
            height: 100%;
        }
        .gauge-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .gauge-value {
            font-size: 2.4rem;
            font-weight: 700;
            font-family: 'Syne', serif;
        }
        .gauge-unit {
            font-size: 0.85rem;
            color: #7a8fa6;
            margin-top: 4px;
        }
        .gauge-level {
            font-size: 0.95rem;
            color: #a0afc0;
            font-weight: 500;
            margin-top: 8px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }
        .metric-card {
            background: rgba(139, 169, 255, 0.08);
            border: 1px solid rgba(139, 169, 255, 0.15);
            border-radius: 12px;
            padding: 16px;
        }
        .metric-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #7a8fa6;
            margin-bottom: 6px;
        }
        .metric-value {
            font-size: 1.6rem;
            font-weight: 700;
            font-family: 'Syne', serif;
            color: #ffffff;
        }
        .metric-unit {
            font-size: 0.8rem;
            color: #a0afc0;
            margin-top: 4px;
        }
        .aurora-section {
            background: rgba(139, 169, 255, 0.08);
            border: 1px solid rgba(139, 169, 255, 0.15);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .aurora-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7a8fa6;
            margin-bottom: 16px;
        }
        .aurora-band {
            margin-bottom: 14px;
        }
        .band-name {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        .band-label {
            color: #a0afc0;
        }
        .band-percent {
            font-weight: 600;
            color: #ffffff;
        }
        .band-bar {
            width: 100%;
            height: 6px;
            background: rgba(139, 169, 255, 0.15);
            border-radius: 3px;
            overflow: hidden;
        }
        .band-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        .sparkline-wrapper {
            margin-top: 20px;
        }
        .sparkline-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #7a8fa6;
            margin-bottom: 8px;
        }
        svg.sparkline {
            width: 100%;
            height: 40px;
        }
        .refresh-info {
            text-align: center;
            font-size: 0.8rem;
            color: #7a8fa6;
            margin-top: 24px;
        }
        .refresh-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4db8ff;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        @media (max-width: 600px) {
            .container {
                padding: 24px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .metrics-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Geomagnetism Live</h1>
        <div class="subtitle">Real-time planetary K-index & geomagnetic activity</div>

        <div class="status-section">
            <div class="status-label">Current Activity Level</div>
            <div class="gauge-wrapper">
                <svg class="gauge" viewBox="0 0 200 120">
                    <defs>
                        <linearGradient id="gaugeFill" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#4cb372;stop-opacity:1" />
                            <stop offset="17%" style="stop-color:#90ee90;stop-opacity:1" />
                            <stop offset="33%" style="stop-color:#ffd700;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#ff8c00;stop-opacity:1" />
                            <stop offset="67%" style="stop-color:#ff6347;stop-opacity:1" />
                            <stop offset="83%" style="stop-color:#dc143c;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#8b0000;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path d="M 10 100 A 90 90 0 0 1 190 100" stroke="rgba(139, 169, 255, 0.2)" stroke-width="8" fill="none" stroke-linecap="round"/>
                    <path class="gauge-bar" d="M 10 100 A 90 90 0 0 1 190 100" stroke="url(#gaugeFill)" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="565 565" stroke-dashoffset="565" style="transition: stroke-dashoffset 0.6s ease;"/>
                </svg>
                <div class="gauge-text">
                    <div class="gauge-value" id="kpValue">5</div>
                    <div class="gauge-unit">Kp Index</div>
                    <div class="gauge-level" id="activityLevel">Unsettled</div>
                </div>
            </div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Ap Index (24h)</div>
                <div class="metric-value" id="apValue">15</div>
                <div class="metric-unit">Activity Units</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Updated</div>
                <div class="metric-value" id="updateTime">now</div>
                <div class="metric-unit">UTC</div>
            </div>
        </div>

        <div class="aurora-section">
            <div class="aurora-title">Aurora Visibility Risk</div>
            <div id="auroraContainer">
                <div class="aurora-band">
                    <div class="band-name">
                        <span class="band-label">Arctic (>65°)</span>
                        <span class="band-percent" id="arcticPercent">0%</span>
                    </div>
                    <div class="band-bar">
                        <div class="band-fill" id="arcticFill" style="width: 0%; background: #4db8ff;"></div>
                    </div>
                </div>
                <div class="aurora-band">
                    <div class="band-name">
                        <span class="band-label">High Mid-Lat (55–65°)</span>
                        <span class="band-percent" id="highMidPercent">0%</span>
                    </div>
                    <div class="band-bar">
                        <div class="band-fill" id="highMidFill" style="width: 0%; background: #8bb8ff;"></div>
                    </div>
                </div>
                <div class="aurora-band">
                    <div class="band-name">
                        <span class="band-label">Mid-Lat (45–55°)</span>
                        <span class="band-percent" id="midPercent">0%</span>
                    </div>
                    <div class="band-bar">
                        <div class="band-fill" id="midFill" style="width: 0%; background: #c5d9ff;"></div>
                    </div>
                </div>
            </div>
            <div class="sparkline-wrapper">
                <div class="sparkline-label">30-Minute Kp Trend</div>
                <svg class="sparkline" id="sparkline" viewBox="0 0 300 40"></svg>
            </div>
        </div>

        <div class="refresh-info">
            <span class="refresh-dot"></span>Auto-updating every 10 seconds
        </div>
    </div>

    <script>
        // Geomagnetic level thresholds
        const LEVELS = [
            { max: 1, name: 'Quiet', color: '#4cb372' },
            { max: 2, name: 'Unsettled', color: '#90ee90' },
            { max: 3, name: 'Active', color: '#ffd700' },
            { max: 4, name: 'Minor Storm', color: '#ff8c00' },
            { max: 5, name: 'Major Storm', color: '#ff6347' },
            { max: 9, name: 'Severe Storm', color: '#8b0000' }
        ];

        // History for sparkline
        let kpHistory = Array(30).fill(0);

        function getLevelName(kp) {
            for (let level of LEVELS) {
                if (kp <= level.max) return level.name;
            }
            return 'Severe Storm';
        }

        function getGaugeFill(kp) {
            // Map Kp 0-9 to 0-100% stroke-dashoffset (0-565)
            const percent = Math.min(kp / 9, 1);
            return 565 * (1 - percent);
        }

        function getAuroraRisk(kp) {
            // Simplified aurora visibility model
            const arcticRisk = Math.min(100, kp * 12);
            const highMidRisk = Math.max(0, Math.min(100, (kp - 1) * 15));
            const midRisk = Math.max(0, Math.min(100, (kp - 2) * 10));
            return { arctic: arcticRisk, highMid: highMidRisk, mid: midRisk };
        }

        function updateDisplay(data) {
            const kp = data.kp;
            const ap = data.ap;

            // Update gauge
            document.getElementById('kpValue').textContent = kp;
            document.getElementById('activityLevel').textContent = getLevelName(kp);
            const dashOffset = getGaugeFill(kp);
            document.querySelector('.gauge-bar').style.strokeDashoffset = dashOffset;

            // Update Ap
            document.getElementById('apValue').textContent = ap;

            // Update time
            const now = new Date();
            const utcStr = now.toLocaleTimeString('en-US', { timeZone: 'UTC', hour: '2-digit', minute: '2-digit' });
            document.getElementById('updateTime').textContent = utcStr;

            // Update aurora risk
            const auroraRisk = getAuroraRisk(kp);
            document.getElementById('arcticPercent').textContent = Math.round(auroraRisk.arctic) + '%';
            document.getElementById('arcticFill').style.width = auroraRisk.arctic + '%';
            document.getElementById('highMidPercent').textContent = Math.round(auroraRisk.highMid) + '%';
            document.getElementById('highMidFill').style.width = auroraRisk.highMid + '%';
            document.getElementById('midPercent').textContent = Math.round(auroraRisk.mid) + '%';
            document.getElementById('midFill').style.width = auroraRisk.mid + '%';

            // Update history & sparkline
            kpHistory.shift();
            kpHistory.push(kp);
            drawSparkline();
        }

        function drawSparkline() {
            const svg = document.getElementById('sparkline');
            svg.innerHTML = '';

            const maxKp = 9;
            const width = 300;
            const height = 40;
            const padding = 2;

            // Background grid
            const gridLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            gridLine.setAttribute('x1', 0);
            gridLine.setAttribute('y1', height / 2);
            gridLine.setAttribute('x2', width);
            gridLine.setAttribute('y2', height / 2);
            gridLine.setAttribute('stroke', 'rgba(139, 169, 255, 0.1)');
            gridLine.setAttribute('stroke-width', '1');
            svg.appendChild(gridLine);

            // Draw line
            const points = kpHistory.map((val, i) => {
                const x = (i / (kpHistory.length - 1)) * (width - 2 * padding) + padding;
                const y = height - padding - (val / maxKp) * (height - 2 * padding);
                return [x, y];
            });

            const pathData = points.map((p, i) => (i === 0 ? 'M' : 'L') + p[0] + ',' + p[1]).join(' ');
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', pathData);
            path.setAttribute('stroke', '#4db8ff');
            path.setAttribute('stroke-width', '2');
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke-linecap', 'round');
            path.setAttribute('stroke-linejoin', 'round');
            svg.appendChild(path);

            // Fill area
            const areaPath = pathData + `L ${width - padding},${height} L ${padding},${height} Z`;
            const area = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            area.setAttribute('d', areaPath);
            area.setAttribute('fill', 'url(#areaGradient)');
            area.setAttribute('opacity', '0.3');

            // Add gradient definition
            const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
            const grad = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
            grad.setAttribute('id', 'areaGradient');
            grad.setAttribute('x1', '0%');
            grad.setAttribute('y1', '0%');
            grad.setAttribute('x2', '0%');
            grad.setAttribute('y2', '100%');
            const stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
            stop1.setAttribute('offset', '0%');
            stop1.setAttribute('stop-color', '#4db8ff');
            const stop2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
            stop2.setAttribute('offset', '100%');
            stop2.setAttribute('stop-color', '#4db8ff');
            stop2.setAttribute('stop-opacity', '0');
            grad.appendChild(stop1);
            grad.appendChild(stop2);
            defs.appendChild(grad);
            svg.appendChild(defs);
            svg.appendChild(area);
        }

        function generateMockData() {
            // Generate realistic variation in Kp/Ap indices
            const baseKp = 3 + Math.sin(Date.now() / 30000) * 1.5 + (Math.random() - 0.5) * 0.8;
            const kp = Math.max(0, Math.min(9, Math.round(baseKp * 10) / 10));
            const ap = Math.round(kp * kp * 2 + Math.random() * 10);
            return { kp, ap };
        }

        async function fetchNOAAData() {
            try {
                const response = await fetch('https://services.swpc.noaa.gov/products/noaa-scales.json');
                if (!response.ok) throw new Error('NOAA fetch failed');
                const data = await response.json();

                // Extract current Kp and Ap
                let kp = 3, ap = 15;
                if (data.kp && data.kp.length > 0) {
                    const latest = data.kp[data.kp.length - 1];
                    kp = Math.max(0, Math.min(9, latest.Kp || 3));
                }
                if (data.ap && data.ap.length > 0) {
                    const latest = data.ap[data.ap.length - 1];
                    ap = Math.max(0, Math.min(500, latest.Ap || 15));
                }

                return { kp, ap };
            } catch (e) {
                console.warn('NOAA API error, using mock:', e.message);
                return generateMockData();
            }
        }

        async function refresh() {
            const data = await fetchNOAAData();
            updateDisplay(data);
        }

        // Initial display
        updateDisplay({ kp: 3, ap: 15 });
        drawSparkline();

        // Fetch real data
        refresh();

        // Auto-update every 10 seconds
        setInterval(refresh, 10000);
    </script>
</body>
</html>
