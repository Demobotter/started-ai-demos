<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protein Fold Simulator</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Space Mono', monospace;
      background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      display: flex;
      width: 100%;
      max-width: 1400px;
      gap: 20px;
      background: rgba(30, 35, 50, 0.9);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .sidebar {
      width: 280px;
      background: rgba(20, 25, 40, 0.95);
      padding: 25px;
      overflow-y: auto;
      border-right: 1px solid rgba(77, 168, 218, 0.2);
    }
    .canvas-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    canvas {
      flex: 1;
      display: block;
      background: radial-gradient(circle at 50% 50%, rgba(77, 168, 218, 0.05) 0%, rgba(15, 20, 25, 0.9) 100%);
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      margin-bottom: 20px;
      color: #4da8da;
      text-align: center;
    }
    h2 {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      margin-top: 20px;
      margin-bottom: 10px;
      color: #7dd3fc;
      border-bottom: 2px solid rgba(77, 168, 218, 0.3);
      padding-bottom: 8px;
    }
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 12px 0;
    }
    button {
      padding: 10px 12px;
      background: rgba(77, 168, 218, 0.2);
      border: 1px solid rgba(77, 168, 218, 0.4);
      color: #7dd3fc;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: bold;
      transition: all 0.2s;
    }
    button:hover {
      background: rgba(77, 168, 218, 0.4);
      border-color: rgba(77, 168, 218, 0.8);
      color: #fff;
    }
    button.active {
      background: rgba(77, 168, 218, 0.6);
      color: #fff;
      border-color: #4da8da;
    }
    .slider-group {
      margin: 15px 0;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      color: #4da8da;
      margin-bottom: 6px;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(77, 168, 218, 0.2);
      outline: none;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #4da8da;
      cursor: pointer;
      border: 2px solid rgba(77, 168, 218, 0.8);
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #4da8da;
      cursor: pointer;
      border: 2px solid rgba(77, 168, 218, 0.8);
    }
    .stat-box {
      background: rgba(77, 168, 218, 0.1);
      border-left: 3px solid #2d9d5f;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      font-size: 11px;
    }
    .stat-box .label {
      color: #4da8da;
      font-weight: bold;
    }
    .stat-box .value {
      color: #7dd3fc;
      font-family: 'Space Mono', monospace;
      margin-top: 4px;
    }
    .control-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin: 12px 0;
    }
    @media (max-width: 1024px) {
      .container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid rgba(77, 168, 218, 0.2);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h1>🧬 Fold</h1>
      
      <h2>Protein</h2>
      <div class="btn-group">
        <button class="preset active" data-seq="MVLSEGEWQLVLHVWAKVEADVAGHGQDILIRLFKSHPETLEKFDRFKHLKTEAEMKASEDLKKHGVTVLTALGAILKKKGHHEAELKPLAQSHATKHKIPIKYLEFISEAIIHVLHSRHPGDFGADAQGAMNKALELFRKDMAGNYKELG">Myoglobin</button>
        <button class="preset" data-seq="MVLSPADKTNVKAAWGKVGAHAGEYGAEALERMFLSFPTTKTYFPHFDLSHGSAQVKGHG">Hemoglobin α</button>
        <button class="preset" data-seq="MVHLTPEEKS AVTALWGKVNV DEVGGEALGRLLVVYPWTQRFFESFGDLSTPDAVMGNPKVKAHGKKVLGAFSDGLA">Lysozyme</button>
        <button class="preset" data-seq="GIVEQCCTSICSLYQLENYCN">Insulin</button>
        <button class="preset" data-seq="MSKGEELFTGVVPILVELDGDVNGHKFSVSGEGEGDATYGKLTLKFICTTGKLPVQWPTLVTTFSYGVQCFSRYPDHMKQHDFFKSAMPEGYVQERTIFFKDDGNYKTRAEVKFEGDTLVNRIELKGIDFKEDGNILGHKLEYNYNSHNVYIMADKQKNGIKVNFKIRHNIEDGSVQLADHYQQNTPIGDGPVLLPDNHYLSTQSALSKDPNEKRDHMVLLEFVTAAGITHGMDELYK">GFP</button>
      </div>

      <h2>Sequence</h2>
      <textarea id="seqInput" style="width:100%;height:80px;background:#1a2332;border:1px solid #4da8da;color:#7dd3fc;border-radius:4px;padding:8px;font-size:10px;font-family:'Space Mono';resize:none;" placeholder="Paste amino acid sequence..."></textarea>

      <h2>Temperature</h2>
      <div class="slider-group">
        <label>°C: <span id="tempVal">25</span></label>
        <input type="range" id="tempSlider" min="5" max="45" value="25">
      </div>

      <h2>pH</h2>
      <div class="slider-group">
        <label>pH: <span id="phVal">7</span></label>
        <input type="range" id="phSlider" min="3" max="11" value="7" step="0.1">
      </div>

      <h2>Hydrophobic</h2>
      <div class="slider-group">
        <label>Balance: <span id="hydroVal">50</span>%</label>
        <input type="range" id="hydroSlider" min="0" max="100" value="50">
      </div>

      <h2>View</h2>
      <div class="control-buttons">
        <button id="spinBtn">Spin</button>
        <button id="tiltBtn">Tilt</button>
        <button id="resetBtn">Reset</button>
      </div>

      <h2>Structure</h2>
      <div class="stat-box">
        <div class="label">Helix</div>
        <div class="value"><span id="helixPct">0</span>%</div>
      </div>
      <div class="stat-box">
        <div class="label">Sheet</div>
        <div class="value"><span id="sheetPct">0</span>%</div>
      </div>
      <div class="stat-box">
        <div class="label">Coil</div>
        <div class="value"><span id="coilPct">0</span>%</div>
      </div>

      <div class="stat-box" style="margin-top:20px;border-left-color:#4da8da;">
        <div class="label">Residues</div>
        <div class="value"><span id="residueCount">0</span></div>
      </div>
    </div>

    <div class="canvas-area">
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <script>
    // Chou-Fasman propensity scores (normalized from original 1974 paper)
    const CHOU_FASMAN = {
      'A': { helix: 1.42, sheet: 0.83, coil: 0.66 },
      'R': { helix: 0.98, sheet: 0.93, coil: 0.95 },
      'N': { helix: 0.67, sheet: 0.89, coil: 1.56 },
      'D': { helix: 1.01, sheet: 0.54, coil: 1.30 },
      'C': { helix: 0.70, sheet: 1.19, coil: 1.05 },
      'Q': { helix: 1.11, sheet: 1.10, coil: 0.98 },
      'E': { helix: 1.51, sheet: 0.37, coil: 1.02 },
      'G': { helix: 0.57, sheet: 0.75, coil: 1.52 },
      'H': { helix: 1.00, sheet: 0.87, coil: 0.95 },
      'I': { helix: 1.08, sheet: 1.60, coil: 0.47 },
      'L': { helix: 1.21, sheet: 1.30, coil: 0.98 },
      'K': { helix: 1.16, sheet: 0.74, coil: 1.01 },
      'M': { helix: 1.45, sheet: 1.05, coil: 0.80 },
      'F': { helix: 1.13, sheet: 1.38, coil: 0.60 },
      'P': { helix: 0.57, sheet: 0.55, coil: 1.52 },
      'S': { helix: 0.77, sheet: 0.75, coil: 1.43 },
      'T': { helix: 0.83, sheet: 1.19, coil: 0.96 },
      'W': { helix: 1.08, sheet: 1.37, coil: 0.74 },
      'Y': { helix: 0.69, sheet: 1.47, coil: 0.78 },
      'V': { helix: 1.06, sheet: 1.70, coil: 0.60 }
    };

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let animationId;
    let rotationX = 0, rotationY = 0;
    let spinning = false, tilting = false;

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function predictSecondaryStructure(seq) {
      seq = seq.toUpperCase().replace(/\s/g, '');
      if (!seq) return { helix: [], sheet: [], coil: [] };

      const window_size = 6;
      const helix = [], sheet = [], coil = [];

      for (let i = 0; i < seq.length; i++) {
        let h_sum = 0, s_sum = 0, c_sum = 0;
        let count = 0;

        for (let j = Math.max(0, i - window_size); j <= Math.min(seq.length - 1, i + window_size); j++) {
          const aa = seq[j];
          if (CHOU_FASMAN[aa]) {
            h_sum += CHOU_FASMAN[aa].helix;
            s_sum += CHOU_FASMAN[aa].sheet;
            c_sum += CHOU_FASMAN[aa].coil;
            count++;
          }
        }

        if (count > 0) {
          const total = h_sum + s_sum + c_sum;
          helix[i] = h_sum / total;
          sheet[i] = s_sum / total;
          coil[i] = c_sum / total;
        }
      }

      return { helix, sheet, coil };
    }

    function generateBackbone(seq, helix_pred, sheet_pred, coil_pred) {
      const backbone = [];
      const numRes = seq.length;

      for (let i = 0; i < numRes; i++) {
        const t = i / (numRes - 1 || 1);
        let x, y, z, type;

        if (helix_pred[i] > 0.5) {
          const turn = (i / 3.6) * Math.PI * 2;
          x = Math.cos(turn) * 30;
          z = Math.sin(turn) * 30;
          y = (t - 0.5) * 200;
          type = 'helix';
        } else if (sheet_pred[i] > 0.5) {
          const zigzag = Math.sin((i / 2) * Math.PI) * 25;
          x = zigzag;
          z = (i / numRes) * 60;
          y = (t - 0.5) * 200;
          type = 'sheet';
        } else {
          x = (Math.sin(i * 0.5) * 20) + (Math.random() - 0.5) * 10;
          z = (Math.cos(i * 0.7) * 20) + (Math.random() - 0.5) * 10;
          y = (t - 0.5) * 200;
          type = 'coil';
        }

        backbone.push({ x, y, z, type, aa: seq[i] });
      }

      return backbone;
    }

    function rotatePoint(p, rx, ry) {
      let x = p.x, y = p.y, z = p.z;
      let y2 = y * Math.cos(rx) - z * Math.sin(rx);
      let z2 = y * Math.sin(rx) + z * Math.cos(rx);
      y = y2; z = z2;
      let x2 = x * Math.cos(ry) + z * Math.sin(ry);
      z2 = -x * Math.sin(ry) + z * Math.cos(ry);
      x = x2; z = z2;
      return { x, y, z };
    }

    function project(p) {
      const scale = 300 / (8 + p.z);
      return {
        x: canvas.width / 2 + p.x * scale,
        y: canvas.height / 2 + p.y * scale,
        z: p.z,
        scale
      };
    }

    function drawFrame() {
      ctx.fillStyle = 'rgba(15, 20, 25, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const seq = document.getElementById('seqInput').value || 'MVLSEGEWQLVLHVWAKVEADVAGHGQDILIRLFKSHPETLEKFDRFKHLKTEAEMKASEDLKKHGVTVLTALGAILKKKGHHEAELKPLAQSHATKHKIPIKYLEFISEAIIHVLHSRHPGDFGADAQGAMNKALELFRKDMAGNYKELG';
      const temp = parseFloat(document.getElementById('tempSlider').value);
      const pred = predictSecondaryStructure(seq);

      let backbone = generateBackbone(seq, pred.helix, pred.sheet, pred.coil);

      const thermal = (temp - 5) / 40 * 0.3;
      backbone = backbone.map(p => ({
        ...p,
        x: p.x + (Math.random() - 0.5) * thermal * 10,
        y: p.y + (Math.random() - 0.5) * thermal * 10,
        z: p.z + (Math.random() - 0.5) * thermal * 10
      }));

      backbone = backbone.map(p => rotatePoint(p, rotationX, rotationY));
      const projected = backbone.map(p => ({...project(p), type: p.type}));

      ctx.lineWidth = 3;
      for (let i = 0; i < projected.length - 1; i++) {
        const p1 = projected[i];
        const p2 = projected[i + 1];

        if (backbone[i].type === 'helix') {
          ctx.strokeStyle = '#E74C3C';
        } else if (backbone[i].type === 'sheet') {
          ctx.strokeStyle = '#F1C40F';
        } else {
          ctx.strokeStyle = '#3498DB';
        }

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }

      projected.forEach((p, i) => {
        ctx.fillStyle = backbone[i].type === 'helix' ? '#E74C3C' : 
                       backbone[i].type === 'sheet' ? '#F1C40F' : '#3498DB';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
      });

      const hCnt = pred.helix.filter(v => v > 0.5).length;
      const sCnt = pred.sheet.filter(v => v > 0.5).length;
      const cCnt = pred.coil.filter(v => v > 0.5).length;
      const total = hCnt + sCnt + cCnt;
      document.getElementById('helixPct').textContent = total > 0 ? Math.round(hCnt * 100 / total) : 0;
      document.getElementById('sheetPct').textContent = total > 0 ? Math.round(sCnt * 100 / total) : 0;
      document.getElementById('coilPct').textContent = total > 0 ? Math.round(cCnt * 100 / total) : 0;
      document.getElementById('residueCount').textContent = seq.length;

      if (spinning) rotationY += 0.02;
      if (tilting) rotationX += 0.01;

      animationId = requestAnimationFrame(drawFrame);
    }

    document.querySelectorAll('.preset').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.preset').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        document.getElementById('seqInput').value = e.target.dataset.seq;
      });
    });

    document.getElementById('tempSlider').addEventListener('input', (e) => {
      document.getElementById('tempVal').textContent = e.target.value;
    });

    document.getElementById('phSlider').addEventListener('input', (e) => {
      document.getElementById('phVal').textContent = Math.round(e.target.value * 10) / 10;
    });

    document.getElementById('hydroSlider').addEventListener('input', (e) => {
      document.getElementById('hydroVal').textContent = e.target.value;
    });

    document.getElementById('spinBtn').addEventListener('click', () => {
      spinning = !spinning;
      document.getElementById('spinBtn').classList.toggle('active', spinning);
    });

    document.getElementById('tiltBtn').addEventListener('click', () => {
      tilting = !tilting;
      document.getElementById('tiltBtn').classList.toggle('active', tilting);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      rotationX = 0;
      rotationY = 0;
      spinning = false;
      tilting = false;
      document.getElementById('spinBtn').classList.remove('active');
      document.getElementById('tiltBtn').classList.remove('active');
    });

    drawFrame();
  </script>
</body>
</html>
