<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloom Watch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5f0e8 0%, #faf8f3 100%);
      min-height: 100vh;
      color: #2c2c2c;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: #6BA876;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #666;
    }
    .controls {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .region-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    button {
      padding: 10px 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      background: white;
      color: #333;
      font-weight: 500;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    button:hover {
      border-color: #6BA876;
      color: #6BA876;
    }
    button.active {
      background: #6BA876;
      color: white;
      border-color: #6BA876;
    }
    .location-input {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    input {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
    }
    input:focus {
      outline: none;
      border-color: #6BA876;
    }
    .search-btn {
      padding: 10px 20px;
      background: #6BA876;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
    }
    .search-btn:hover {
      background: #5a9165;
    }
    .content {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: #6BA876;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .health-score {
      font-size: 3rem;
      font-weight: 700;
      color: #6BA876;
      margin-bottom: 8px;
    }
    .score-label {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 12px;
    }
    .gauge {
      width: 100%;
      height: 8px;
      background: #f0f0f0;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 15px;
    }
    .gauge-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s;
    }
    .stats {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.9rem;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .stat-label {
      color: #888;
    }
    .stat-value {
      font-weight: 600;
      color: #2c2c2c;
    }
    .bloom-timeline {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #f0f0f0;
    }
    .months {
      display: flex;
      gap: 4px;
      font-size: 0.75rem;
    }
    .month {
      flex: 1;
      padding: 6px 4px;
      background: #f5f5f5;
      border-radius: 4px;
      text-align: center;
      color: #888;
      font-weight: 500;
    }
    .month.current {
      background: #D4A574;
      color: white;
    }
    .trend-sparkline {
      margin-top: 12px;
      height: 40px;
      background: #f9f9f9;
      border-radius: 6px;
    }
    .loading {
      text-align: center;
      color: #888;
      padding: 20px;
    }
    .pollen-badge {
      display: inline-block;
      padding: 4px 10px;
      background: #E8B4D0;
      color: #8b4a6d;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-right: 5px;
      margin-top: 8px;
    }
    .error {
      background: #ffe8e8;
      color: #c00;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    @media (max-width: 768px) {
      h1 { font-size: 2rem; }
      .region-buttons { gap: 8px; }
      button { padding: 8px 12px; font-size: 0.9rem; }
      .content { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🐝 Bloom Watch</h1>
      <p class="subtitle">Real-time pollinator health & bloom conditions</p>
    </header>
    <div class="controls">
      <div class="region-buttons">
        <button data-region="north-america">North America</button>
        <button data-region="europe">Europe</button>
        <button data-region="asia">Asia</button>
        <button data-region="south-america">South America</button>
        <button data-region="africa">Africa</button>
      </div>
      <div class="location-input">
        <input type="text" id="cityInput" placeholder="Or enter any city...">
        <button class="search-btn" id="searchBtn">Search</button>
      </div>
    </div>
    <div class="content" id="content">
      <div class="loading">Loading pollinator data...</div>
    </div>
  </div>

  <script>
    // Region center coordinates and names
    const regions = {
      'north-america': { lat: 40, lon: -100, name: 'San Francisco', zoom: 'USA' },
      'europe': { lat: 52, lon: 10, name: 'Berlin', zoom: 'Germany' },
      'asia': { lat: 35, lon: 100, name: 'Shanghai', zoom: 'China' },
      'south-america': { lat: -15, lon: -60, name: 'São Paulo', zoom: 'Brazil' },
      'africa': { lat: 0, lon: 20, name: 'Nairobi', zoom: 'Kenya' }
    };

    const regionNames = {
      'north-america': 'North America',
      'europe': 'Europe',
      'asia': 'Asia',
      'south-america': 'South America',
      'africa': 'Africa'
    };

    let currentRegion = 'north-america';

    // Bloom calendar by month (realistic phenology)
    const bloomCalendar = {
      'north-america': ['Rest', 'Catkins', 'Fruit Trees', 'Dandelions', 'Wildflowers', 'Grasses', 'Late Blooms', 'Asters', 'Goldenrod', 'Mums', 'Lateblooms', 'Rest'],
      'europe': ['Hazel', 'Alder', 'Birch', 'Grasses', 'Clover', 'Lavender', 'Sunflowers', 'Thistles', 'Ragweed', 'Ivy', 'Nettle', 'Rest'],
      'asia': ['Rest', 'Plum Blossoms', 'Cherry', 'Peach', 'Rice Flowers', 'Grasses', 'Sunflowers', 'Sesame', 'Rice Pollen', 'Ragweed', 'Chrysanthemum', 'Rest'],
      'south-america': ['Jacaranda', 'Mango Blossoms', 'Eucalyptus', 'Wildflowers', 'Grasses', 'Rest', 'Rest', 'Grasses', 'Wildflowers', 'Eucalyptus', 'Ipê', 'Mango'],
      'africa': ['Acacia', 'Baobab', 'Wildflowers', 'Grasses', 'Mango', 'Coconut', 'Rest', 'Rest', 'Grasses', 'Rest', 'Wildflowers', 'Acacia']
    };

    // Calculate synthetic pollen index based on month and temperature
    function calcPollenIndex(monthIdx, temp) {
      // Base pollen counts by month (0-100 scale)
      const baseByMonth = [20, 35, 60, 75, 80, 70, 65, 55, 40, 30, 25, 15];
      let pollen = baseByMonth[monthIdx] || 30;
      
      // Adjust for temperature (optimal 15-25°C)
      if (temp < 12) pollen *= 0.5;
      else if (temp < 15) pollen *= 0.75;
      else if (temp > 30) pollen *= 0.8;
      
      return Math.round(Math.max(5, pollen));
    }

    // Realistic pollinator score based on weather
    function calcPollinatorScore(temp, humidity, precip, pollenLevel) {
      let score = 70;
      
      // Temperature: bees prefer 18-28°C
      if (temp < 12 || temp > 35) score -= 20;
      else if (temp < 18 || temp > 28) score -= 10;
      
      // Humidity: 40-70% is ideal
      if (humidity < 30 || humidity > 80) score -= 15;
      else if (humidity < 40 || humidity > 70) score -= 5;
      
      // Precipitation: rain reduces foraging
      if (precip > 2) score -= 20;
      else if (precip > 0.5) score -= 10;
      
      // Pollen: more pollen = more foraging opportunity
      if (pollenLevel > 50) score += Math.min(15, pollenLevel / 5);
      else if (pollenLevel > 10) score += 8;
      
      return Math.max(0, Math.min(100, Math.round(score)));
    }

    function getScoreColor(score) {
      if (score >= 80) return '#6BA876';
      if (score >= 60) return '#D4A574';
      if (score >= 40) return '#E8B4D0';
      return '#c00';
    }

    async function fetchData(region) {
      const regionData = regions[region];
      const regionLabel = regionNames[region];
      
      try {
        // Fetch real weather data from Open-Meteo
        const weatherResp = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${regionData.lat}&longitude=${regionData.lon}&current=temperature_2m,relative_humidity_2m,precipitation&timezone=auto`
        );
        
        if (!weatherResp.ok) throw new Error(`Weather API: ${weatherResp.status}`);
        const weatherData = await weatherResp.json();
        const current = weatherData.current;
        const temp = current.temperature_2m;
        const humidity = current.relative_humidity_2m;
        const precip = current.precipitation || 0;
        
        // Calculate synthetic but realistic pollen index
        const monthIdx = new Date().getMonth();
        const pollenLevel = calcPollenIndex(monthIdx, temp);
        
        // Calculate pollinator health score
        const healthScore = calcPollinatorScore(temp, humidity, precip, pollenLevel);
        
        // Current month
        const currentBloom = bloomCalendar[region][monthIdx];
        
        // Generate 30-day trend
        const trend = [];
        for (let i = 30; i >= 0; i--) {
          const variation = Math.sin(i / 5) * 10;
          trend.push(healthScore + variation + (Math.random() - 0.5) * 5);
        }
        
        return {
          region: regionLabel,
          city: regionData.name,
          healthScore,
          temperature: temp,
          humidity,
          precipitation: precip,
          pollenLevel,
          currentBloom,
          trend,
          success: true
        };
      } catch (err) {
        console.error('Data fetch error:', err);
        return {
          region: regionLabel,
          success: false,
          error: err.message
        };
      }
    }

    function renderCards(data) {
      const content = document.getElementById('content');
      
      if (!data.success) {
        content.innerHTML = `<div class="error">Failed to load data: ${data.error}</div>`;
        return;
      }
      
      const scoreColor = getScoreColor(data.healthScore);
      const gaugeFill = Math.min(100, data.healthScore);
      
      // Generate sparkline SVG
      const minTrend = Math.min(...data.trend);
      const maxTrend = Math.max(...data.trend);
      const range = maxTrend - minTrend || 1;
      
      let sparklinePath = 'M';
      data.trend.forEach((val, i) => {
        const x = (i / (data.trend.length - 1)) * 100;
        const y = 40 - ((val - minTrend) / range) * 30;
        sparklinePath += `${x},${y} `;
      });
      
      content.innerHTML = `
        <div class="card">
          <div class="card-title">Health Score</div>
          <div class="health-score" style="color: ${scoreColor}">${data.healthScore}</div>
          <div class="score-label">${data.region}</div>
          <div class="gauge">
            <div class="gauge-fill" style="width: ${gaugeFill}%; background: ${scoreColor}"></div>
          </div>
          <div class="stats">
            <div class="stat-row">
              <span class="stat-label">Status</span>
              <span class="stat-value" style="color: ${scoreColor}">
                ${data.healthScore >= 80 ? 'Excellent' : data.healthScore >= 60 ? 'Good' : data.healthScore >= 40 ? 'Fair' : 'Poor'}
              </span>
            </div>
          </div>
        </div>
        
        <div class="card">
          <div class="card-title">Weather Conditions</div>
          <div class="stats">
            <div class="stat-row">
              <span class="stat-label">Temperature</span>
              <span class="stat-value" style="color: ${data.temperature > 25 ? '#D4A574' : data.temperature > 18 ? '#6BA876' : '#6BA876'}">
                ${Math.round(data.temperature)}°C
              </span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Humidity</span>
              <span class="stat-value">${data.humidity}%</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Precipitation</span>
              <span class="stat-value">${data.precipitation.toFixed(1)}mm</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Pollen Index</span>
              <span class="stat-value">${data.pollenLevel}</span>
            </div>
          </div>
        </div>
        
        <div class="card">
          <div class="card-title">Current Blooms</div>
          <div style="margin-top: 10px;">
            <span class="pollen-badge">${data.currentBloom}</span>
          </div>
          <div class="bloom-timeline">
            <div style="font-size: 0.85rem; color: #666; margin-bottom: 8px;">Monthly Bloom Calendar</div>
            <div class="months">
              ${['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'].map((m, i) => 
                `<div class="month ${i === new Date().getMonth() ? 'current' : ''}">${m}</div>`
              ).join('')}
            </div>
          </div>
        </div>
        
        <div class="card">
          <div class="card-title">30-Day Trend</div>
          <svg width="100%" height="60" viewBox="0 100 100 40" style="margin-top: 10px;">
            <polyline points="${sparklinePath}" fill="none" stroke="${scoreColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="100" cy="${40 - ((data.trend[data.trend.length - 1] - minTrend) / range) * 30}" r="2" fill="${scoreColor}"/>
          </svg>
          <div style="font-size: 0.85rem; color: #666; margin-top: 10px; text-align: center;">Latest reading today</div>
        </div>
      `;
    }

    // Region button listeners
    document.querySelectorAll('[data-region]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const region = e.target.dataset.region;
        currentRegion = region;
        document.querySelectorAll('[data-region]').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        document.getElementById('content').innerHTML = '<div class="loading">Loading...</div>';
        const data = await fetchData(region);
        renderCards(data);
      });
    });

    // Search button
    document.getElementById('searchBtn').addEventListener('click', async () => {
      const city = document.getElementById('cityInput').value.trim();
      if (!city) return;
      
      try {
        // Geocode city using Open-Meteo
        const geoResp = await fetch(
          `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&format=json`
        );
        
        if (!geoResp.ok) throw new Error('Geocoding failed');
        const geoData = await geoResp.json();
        
        if (!geoData.results || geoData.results.length === 0) {
          document.getElementById('content').innerHTML = '<div class="error">City not found. Try another search.</div>';
          return;
        }
        
        const result = geoData.results[0];
        const searchRegion = {
          lat: result.latitude,
          lon: result.longitude,
          name: result.name + (result.admin1 ? ', ' + result.admin1 : '')
        };
        
        document.getElementById('content').innerHTML = '<div class="loading">Loading...</div>';
        
        // Fetch weather for this location
        const weatherResp = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${searchRegion.lat}&longitude=${searchRegion.lon}&current=temperature_2m,relative_humidity_2m,precipitation&timezone=auto`
        );
        
        if (!weatherResp.ok) throw new Error('Weather fetch failed');
        const weatherData = await weatherResp.json();
        const current = weatherData.current;
        
        const temp = current.temperature_2m;
        const humidity = current.relative_humidity_2m;
        const precip = current.precipitation || 0;
        
        const monthIdx = new Date().getMonth();
        const pollenLevel = calcPollenIndex(monthIdx, temp);
        const healthScore = calcPollinatorScore(temp, humidity, precip, pollenLevel);
        
        // Guess region from lat/lon
        let regionKey = 'north-america';
        if (searchRegion.lat > 35 && searchRegion.lon > -20) regionKey = 'europe';
        else if (searchRegion.lat > 0 && searchRegion.lon > 50) regionKey = 'asia';
        else if (searchRegion.lat < 0 && searchRegion.lon < -30) regionKey = 'south-america';
        else if (searchRegion.lat < 20 && searchRegion.lon > -20) regionKey = 'africa';
        
        const currentBloom = bloomCalendar[regionKey][monthIdx];
        
        const trend = [];
        for (let i = 30; i >= 0; i--) {
          const variation = Math.sin(i / 5) * 10;
          trend.push(healthScore + variation + (Math.random() - 0.5) * 5);
        }
        
        const data = {
          region: result.name,
          city: searchRegion.name,
          healthScore,
          temperature: temp,
          humidity,
          precipitation: precip,
          pollenLevel,
          currentBloom,
          trend,
          success: true
        };
        
        renderCards(data);
      } catch (err) {
        document.getElementById('content').innerHTML = `<div class="error">Error: ${err.message}</div>`;
      }
    });

    // Load initial region
    document.querySelector('[data-region="north-america"]').classList.add('active');
    fetchData('north-america').then(data => renderCards(data));

    // Auto-refresh every 10 minutes
    setInterval(() => {
      fetchData(currentRegion).then(data => renderCards(data));
    }, 600000);
  </script>
</body>
</html>
