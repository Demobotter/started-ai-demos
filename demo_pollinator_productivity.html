<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloom Watch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5f0e8 0%, #faf8f3 100%);
      min-height: 100vh;
      color: #2c2c2c;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: #6BA876;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #666;
    }
    .controls {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .region-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    button {
      padding: 10px 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      background: white;
      color: #333;
      font-weight: 500;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    button:hover {
      border-color: #6BA876;
      color: #6BA876;
    }
    button.active {
      background: #6BA876;
      color: white;
      border-color: #6BA876;
    }
    .location-input {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    input {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
    }
    input:focus {
      outline: none;
      border-color: #6BA876;
    }
    .search-btn {
      padding: 10px 20px;
      background: #6BA876;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
    }
    .search-btn:hover {
      background: #5a9165;
    }
    .content {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: #6BA876;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .health-score {
      font-size: 3rem;
      font-weight: 700;
      color: #6BA876;
      margin-bottom: 8px;
    }
    .score-label {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 12px;
    }
    .gauge {
      width: 100%;
      height: 8px;
      background: #f0f0f0;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 15px;
    }
    .gauge-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s;
    }
    .stats {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.9rem;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .stat-label {
      color: #888;
    }
    .stat-value {
      font-weight: 600;
      color: #2c2c2c;
    }
    .bloom-timeline {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #f0f0f0;
    }
    .months {
      display: flex;
      gap: 4px;
      font-size: 0.75rem;
    }
    .month {
      flex: 1;
      padding: 6px 4px;
      background: #f5f5f5;
      border-radius: 4px;
      text-align: center;
      color: #888;
      font-weight: 500;
    }
    .month.current {
      background: #D4A574;
      color: white;
    }
    .pollen-badge {
      display: inline-block;
      padding: 4px 10px;
      background: #E8B4D0;
      color: #8b4a6d;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-right: 5px;
      margin-top: 8px;
    }
    .error {
      background: #ffe8e8;
      color: #c00;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    @media (max-width: 768px) {
      h1 { font-size: 2rem; }
      .region-buttons { gap: 8px; }
      button { padding: 8px 12px; font-size: 0.9rem; }
      .content { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🐝 Bloom Watch</h1>
      <p class="subtitle">Real-time pollinator health & bloom conditions</p>
    </header>
    <div class="controls">
      <div class="region-buttons">
        <button class="region-btn active" data-region="north-america">North America</button>
        <button class="region-btn" data-region="europe">Europe</button>
        <button class="region-btn" data-region="asia">Asia</button>
        <button class="region-btn" data-region="south-america">South America</button>
        <button class="region-btn" data-region="africa">Africa</button>
      </div>
      <div class="location-input">
        <input type="text" id="cityInput" placeholder="Or enter any city...">
        <button class="search-btn">Search</button>
      </div>
    </div>
    <div class="content" id="content">
      <div class="loading" style="text-align: center; color: #888; padding: 20px; grid-column: 1/-1;">Loading...</div>
    </div>
  </div>

  <script>
    const regions = {
      'north-america': { lat: 40, lon: -100, name: 'San Francisco', zoom: 'USA' },
      'europe': { lat: 52, lon: 10, name: 'Berlin', zoom: 'Germany' },
      'asia': { lat: 35, lon: 100, name: 'Shanghai', zoom: 'China' },
      'south-america': { lat: -15, lon: -60, name: 'São Paulo', zoom: 'Brazil' },
      'africa': { lat: 0, lon: 20, name: 'Nairobi', zoom: 'Kenya' }
    };

    const bloomCalendar = {
      'north-america': ['Rest', 'Catkins', 'Fruit Trees', 'Dandelions', 'Wildflowers', 'Grasses', 'Late Blooms', 'Asters', 'Goldenrod', 'Mums', 'Lateblooms', 'Rest'],
      'europe': ['Hazel', 'Alder', 'Birch', 'Grasses', 'Clover', 'Lavender', 'Sunflowers', 'Thistles', 'Ragweed', 'Ivy', 'Nettle', 'Rest'],
      'asia': ['Rest', 'Plum Blossoms', 'Cherry', 'Peach', 'Rice Flowers', 'Grasses', 'Sunflowers', 'Sesame', 'Rice Pollen', 'Ragweed', 'Chrysanthemum', 'Rest'],
      'south-america': ['Jacaranda', 'Mango Blossoms', 'Eucalyptus', 'Wildflowers', 'Grasses', 'Rest', 'Rest', 'Grasses', 'Wildflowers', 'Eucalyptus', 'Ipê', 'Mango'],
      'africa': ['Acacia', 'Baobab', 'Wildflowers', 'Grasses', 'Mango', 'Coconut', 'Rest', 'Rest', 'Grasses', 'Rest', 'Wildflowers', 'Acacia']
    };

    function calcPollenIndex(monthIdx, temp) {
      const baseByMonth = [20, 35, 60, 75, 80, 70, 65, 55, 40, 30, 25, 15];
      let pollen = baseByMonth[monthIdx] || 30;
      if (temp < 12) pollen *= 0.5;
      else if (temp < 15) pollen *= 0.75;
      else if (temp > 30) pollen *= 0.8;
      return Math.round(Math.max(5, pollen));
    }

    function calcPollinatorScore(temp, humidity, precip, pollenLevel) {
      let score = 70;
      if (temp < 12 || temp > 35) score -= 20;
      else if (temp < 18 || temp > 28) score -= 10;
      if (humidity < 30 || humidity > 80) score -= 15;
      else if (humidity < 40 || humidity > 70) score -= 5;
      if (precip > 2) score -= 20;
      else if (precip > 0.5) score -= 10;
      if (pollenLevel > 50) score += Math.min(15, pollenLevel / 5);
      else if (pollenLevel > 10) score += 8;
      return Math.max(0, Math.min(100, Math.round(score)));
    }

    function getScoreColor(score) {
      if (score >= 80) return '#6BA876';
      if (score >= 60) return '#D4A574';
      if (score >= 40) return '#E8B4D0';
      return '#c00';
    }

    async function fetchData(region) {
      const regionData = regions[region];
      try {
        const response = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${regionData.lat}&longitude=${regionData.lon}&current=temperature_2m,relative_humidity_2m,precipitation`
        );
        if (!response.ok) throw new Error('API error');
        const data = await response.json();
        const current = data.current;
        const temp = current.temperature_2m;
        const humidity = current.relative_humidity_2m;
        const precip = current.precipitation || 0;
        const monthIdx = new Date().getMonth();
        const pollenLevel = calcPollenIndex(monthIdx, temp);
        const healthScore = calcPollinatorScore(temp, humidity, precip, pollenLevel);
        const currentBloom = bloomCalendar[region][monthIdx];
        
        const trend = [];
        for (let i = 30; i >= 0; i--) {
          trend.push(healthScore + Math.sin(i / 5) * 10 + (Math.random() - 0.5) * 5);
        }
        
        return {
          region,
          city: regionData.name,
          healthScore,
          temperature: temp,
          humidity,
          precipitation: precip,
          pollenLevel,
          currentBloom,
          trend,
          success: true
        };
      } catch (err) {
        console.error(err);
        return { success: false, error: err.message };
      }
    }

    function renderCards(data) {
      const content = document.getElementById('content');
      if (!data.success) {
        content.innerHTML = `<div class="error">${data.error}</div>`;
        return;
      }
      
      const scoreColor = getScoreColor(data.healthScore);
      const monthIdx = new Date().getMonth();
      
      content.innerHTML = `
        <div class="card">
          <div class="card-title">Health Score</div>
          <div class="health-score" style="color: ${scoreColor}">${data.healthScore}</div>
          <div class="score-label">${data.region}</div>
          <div class="gauge">
            <div class="gauge-fill" style="width: ${Math.min(100, data.healthScore)}%; background: ${scoreColor}"></div>
          </div>
          <div class="stats">
            <div class="stat-row">
              <span class="stat-label">Status</span>
              <span class="stat-value" style="color: ${scoreColor}">
                ${data.healthScore >= 80 ? 'Excellent' : data.healthScore >= 60 ? 'Good' : data.healthScore >= 40 ? 'Fair' : 'Poor'}
              </span>
            </div>
          </div>
        </div>
        
        <div class="card">
          <div class="card-title">Weather</div>
          <div class="stats">
            <div class="stat-row">
              <span class="stat-label">Temperature</span>
              <span class="stat-value">${Math.round(data.temperature)}°C</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Humidity</span>
              <span class="stat-value">${data.humidity}%</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Precipitation</span>
              <span class="stat-value">${data.precipitation.toFixed(1)}mm</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Pollen Index</span>
              <span class="stat-value">${data.pollenLevel}</span>
            </div>
          </div>
        </div>
        
        <div class="card">
          <div class="card-title">Current Blooms</div>
          <div style="margin-top: 10px;">
            <span class="pollen-badge">${data.currentBloom}</span>
          </div>
          <div class="bloom-timeline">
            <div style="font-size: 0.85rem; color: #666; margin-bottom: 8px;">Monthly Calendar</div>
            <div class="months">
              ${['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'].map((m, i) => 
                `<div class="month ${i === monthIdx ? 'current' : ''}">${m}</div>`
              ).join('')}
            </div>
          </div>
        </div>
        
        <div class="card">
          <div class="card-title">30-Day Trend</div>
          <svg width="100%" height="60" viewBox="0 0 100 50" style="margin-top: 10px;">
            <rect width="100" height="50" fill="#f9f9f9" rx="6"/>
            <polyline points="${data.trend.map((v, i) => {
              const x = (i / (data.trend.length - 1)) * 100;
              const y = 45 - (Math.min(100, Math.max(0, v)) / 100) * 40;
              return `${x},${y}`;
            }).join(' ')}" fill="none" stroke="${scoreColor}" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
      `;
    }

    document.querySelectorAll('.region-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        const region = e.target.dataset.region;
        document.getElementById('content').innerHTML = '<div class="loading" style="text-align: center; color: #888; padding: 20px; grid-column: 1/-1;">Loading...</div>';
        const data = await fetchData(region);
        renderCards(data);
      });
    });

    document.querySelector('.search-btn').addEventListener('click', async () => {
      const city = document.getElementById('cityInput').value.trim();
      if (!city) return;
      try {
        const geoResp = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&format=json`);
        const geoData = await geoResp.json();
        if (!geoData.results?.length) {
          document.getElementById('content').innerHTML = '<div class="error">City not found</div>';
          return;
        }
        const loc = geoData.results[0];
        const weatherResp = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m,relative_humidity_2m,precipitation`);
        const weatherData = await weatherResp.json();
        const curr = weatherData.current;
        const monthIdx = new Date().getMonth();
        const pollenLevel = calcPollenIndex(monthIdx, curr.temperature_2m);
        const healthScore = calcPollinatorScore(curr.temperature_2m, curr.relative_humidity_2m, curr.precipitation || 0, pollenLevel);
        
        let regionKey = 'north-america';
        if (loc.latitude > 35 && loc.longitude > -20) regionKey = 'europe';
        else if (loc.latitude > 0 && loc.longitude > 50) regionKey = 'asia';
        else if (loc.latitude < 0 && loc.longitude < -30) regionKey = 'south-america';
        else if (loc.latitude < 20 && loc.longitude > -20) regionKey = 'africa';
        
        const trend = [];
        for (let i = 30; i >= 0; i--) {
          trend.push(healthScore + Math.sin(i / 5) * 10 + (Math.random() - 0.5) * 5);
        }
        
        renderCards({
          region: loc.name,
          city: loc.name,
          healthScore,
          temperature: curr.temperature_2m,
          humidity: curr.relative_humidity_2m,
          precipitation: curr.precipitation || 0,
          pollenLevel,
          currentBloom: bloomCalendar[regionKey][monthIdx],
          trend,
          success: true
        });
      } catch (err) {
        document.getElementById('content').innerHTML = `<div class="error">${err.message}</div>`;
      }
    });

    // Load on init
    (async () => {
      const data = await fetchData('north-america');
      renderCards(data);
    })();
  </script>
</body>
</html>
