<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wind Farm Optimizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #e0e6ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: rgba(20, 25, 50, 0.8);
      border-radius: 16px;
      padding: 40px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 255, 153, 0.1);
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.4em;
      margin-bottom: 8px;
      color: #00ff99;
      font-weight: 700;
    }
    .subtitle {
      color: #00d9ff;
      margin-bottom: 32px;
      font-size: 0.95em;
    }
    .controls {
      background: rgba(0, 255, 153, 0.05);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 28px;
      border: 1px solid rgba(0, 255, 153, 0.15);
    }
    .control-group {
      margin-bottom: 20px;
    }
    .control-group:last-child {
      margin-bottom: 0;
    }
    .control-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.95em;
      color: #00d9ff;
      font-weight: 500;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(0, 217, 255, 0.2);
      outline: none;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #00ff99;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0, 255, 153, 0.6);
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #00ff99;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 8px rgba(0, 255, 153, 0.6);
    }
    .canvas-wrapper {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 28px;
      display: flex;
      justify-content: center;
      border: 1px solid rgba(0, 255, 153, 0.15);
    }
    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }
    .stat-box {
      background: rgba(0, 255, 153, 0.08);
      border: 1px solid rgba(0, 255, 153, 0.2);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }
    .stat-label {
      color: #00d9ff;
      font-size: 0.85em;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-value {
      color: #00ff99;
      font-family: 'Syne', sans-serif;
      font-size: 1.6em;
      font-weight: 700;
    }
    .wind-info {
      background: rgba(32, 178, 170, 0.1);
      border-left: 4px solid #20b2aa;
      border-radius: 8px;
      padding: 16px;
      margin-top: 20px;
      font-size: 0.9em;
      color: #e0e6ff;
    }
    .loading {
      color: #ffb700;
      font-style: italic;
    }
    .error {
      color: #ff6464;
    }
    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }
      h1 {
        font-size: 1.8em;
      }
      .controls {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💨 Turbine Optimizer</h1>
    <p class="subtitle">Pick a city, adjust your farm, watch real wind power in real-time</p>
    
    <div class="controls">
      <div class="control-group">
        <div class="control-label">
          <span>City</span>
          <span id="cityDisplay">Melbourne, Australia</span>
        </div>
        <input type="text" id="cityInput" placeholder="Enter city name..." value="Melbourne, Australia" 
               style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(0, 255, 153, 0.3); background: rgba(0, 0, 0, 0.3); color: #e0e6ff; font-family: 'Inter', sans-serif;">
        <button id="updateCityBtn" style="margin-top: 10px; padding: 8px 16px; border: none; background: #00ff99; color: #0a0e27; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; font-family: 'Inter', sans-serif;">Fetch Wind Data</button>
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Turbine Count</span>
          <span id="turbineCount">8</span>
        </div>
        <input type="range" id="turbineSlider" min="3" max="20" value="8">
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Rotor Diameter (m)</span>
          <span id="diameterDisplay">100 m</span>
        </div>
        <input type="range" id="diameterSlider" min="40" max="160" value="100" step="5">
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="farmCanvas" width="500" height="400"></canvas>
    </div>

    <div class="stats">
      <div class="stat-box">
        <div class="stat-label">Wind Speed</div>
        <div class="stat-value" id="windSpeedDisplay">— m/s</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Wind Direction</div>
        <div class="stat-value" id="windDirDisplay">—°</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Total Output</div>
        <div class="stat-value" id="totalPowerDisplay">— MW</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Avg Per Turbine</div>
        <div class="stat-value" id="avgPowerDisplay">— MW</div>
      </div>
    </div>

    <div class="wind-info" id="windInfo">
      <span class="loading">Fetching real wind data...</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('farmCanvas');
    const ctx = canvas.getContext('2d');
    
    let turbineCount = 8;
    let rotor = 100;
    let windSpeed = 0;
    let windDirection = 0;
    let rho = 1.225; // Air density at sea level (kg/m³)
    
    const turbineSlider = document.getElementById('turbineSlider');
    const diameterSlider = document.getElementById('diameterSlider');
    const cityInput = document.getElementById('cityInput');
    const updateCityBtn = document.getElementById('updateCityBtn');
    
    turbineSlider.addEventListener('input', (e) => {
      turbineCount = parseInt(e.target.value);
      document.getElementById('turbineCount').textContent = turbineCount;
      drawFarm();
      updateStats();
    });
    
    diameterSlider.addEventListener('input', (e) => {
      rotor = parseInt(e.target.value);
      document.getElementById('diameterDisplay').textContent = rotor + ' m';
      drawFarm();
      updateStats();
    });
    
    updateCityBtn.addEventListener('click', fetchWindData);
    cityInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') fetchWindData();
    });
    
    async function geocodeCity(city) {
      try {
        const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Geocode failed');
        const data = await res.json();
        if (!data.results || data.results.length === 0) {
          throw new Error('City not found');
        }
        const loc = data.results[0];
        return { lat: loc.latitude, lon: loc.longitude, name: `${loc.name}${loc.admin1 ? ', ' + loc.admin1 : ''}${loc.country ? ', ' + loc.country : ''}` };
      } catch (e) {
        console.error('Geocode error:', e);
        throw e;
      }
    }
    
    async function fetchWindData() {
      const city = cityInput.value.trim();
      if (!city) {
        document.getElementById('windInfo').innerHTML = '<span class="error">Please enter a city name</span>';
        return;
      }
      
      document.getElementById('windInfo').innerHTML = '<span class="loading">Fetching...</span>';
      
      try {
        const geo = await geocodeCity(city);
        document.getElementById('cityDisplay').textContent = geo.name;
        
        const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${geo.lat}&longitude=${geo.lon}&current=wind_speed_10m,wind_direction_10m&wind_speed_unit=ms`;
        const weatherRes = await fetch(weatherUrl);
        if (!weatherRes.ok) throw new Error('Weather fetch failed');
        const weatherData = await weatherRes.json();
        
        windSpeed = weatherData.current.wind_speed_10m;
        windDirection = weatherData.current.wind_direction_10m;
        
        document.getElementById('windInfo').innerHTML = `
          <strong>📍 ${geo.name}</strong><br>
          Wind Speed: <strong>${windSpeed.toFixed(1)} m/s</strong> | Direction: <strong>${windDirection.toFixed(0)}°</strong><br>
          Real-time data from Open-Meteo
        `;
        
        drawFarm();
        updateStats();
      } catch (e) {
        document.getElementById('windInfo').innerHTML = `<span class="error">❌ ${e.message}</span>`;
      }
    }
    
    function calculatePower(windSpd, diameter) {
      // Betz limit (59.3%) + realistic efficiency (~0.85 for typical turbine)
      const area = Math.PI * Math.pow(diameter / 2, 2);
      const power = 0.5 * rho * area * Math.pow(windSpd, 3) * 0.593 * 0.85; // Watts
      return power / 1e6; // Convert to MW
    }
    
    function drawFarm() {
      ctx.fillStyle = '#0a0e27';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Background grid
      ctx.strokeStyle = 'rgba(0, 217, 255, 0.1)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 10; i++) {
        const x = (canvas.width / 10) * i;
        const y = (canvas.height / 10) * i;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
      
      // Wind direction indicator
      const arrowStartX = canvas.width - 50;
      const arrowStartY = 30;
      ctx.save();
      ctx.translate(arrowStartX, arrowStartY);
      ctx.rotate((windDirection * Math.PI) / 180);
      ctx.strokeStyle = '#00ff99';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.lineTo(0, 20);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.lineTo(-5, -10);
      ctx.lineTo(0, -12);
      ctx.lineTo(5, -10);
      ctx.closePath();
      ctx.fillStyle = '#00ff99';
      ctx.fill();
      ctx.restore();
      
      ctx.fillStyle = '#00d9ff';
      ctx.font = '12px Inter';
      ctx.textAlign = 'center';
      ctx.fillText('Wind →', arrowStartX, arrowStartY + 35);
      
      // Layout turbines in grid
      const cols = Math.ceil(Math.sqrt(turbineCount));
      const rows = Math.ceil(turbineCount / cols);
      const cellW = canvas.width / (cols + 1);
      const cellH = canvas.height / (rows + 1);
      
      const turbineRadius = Math.min(cellW, cellH) / 3;
      
      for (let i = 0; i < turbineCount; i++) {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const x = cellW * (col + 1);
        const y = cellH * (row + 1);
        
        // Turbine base
        ctx.fillStyle = 'rgba(0, 255, 153, 0.3)';
        ctx.beginPath();
        ctx.arc(x, y, turbineRadius * 0.9, 0, Math.PI * 2);
        ctx.fill();
        
        // Glow if facing wind
        const angleToWind = Math.abs(windDirection - 180) < 45 ? 1 : 0.3;
        ctx.strokeStyle = `rgba(0, 255, 153, ${0.6 * angleToWind})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, y, turbineRadius * 0.95, 0, Math.PI * 2);
        ctx.stroke();
        
        // Rotor blades (animated)
        ctx.save();
        ctx.translate(x, y);
        const rotation = (Date.now() * 0.001 * windSpeed) % (Math.PI * 2);
        ctx.rotate(rotation);
        
        ctx.strokeStyle = '#00d9ff';
        ctx.lineWidth = 2;
        for (let j = 0; j < 3; j++) {
          ctx.beginPath();
          ctx.moveTo(0, 0);
          const bladeAngle = (j * Math.PI * 2) / 3;
          const bladeX = Math.cos(bladeAngle) * (turbineRadius * 0.6);
          const bladeY = Math.sin(bladeAngle) * (turbineRadius * 0.6);
          ctx.lineTo(bladeX, bladeY);
          ctx.stroke();
        }
        ctx.restore();
        
        // Hub
        ctx.fillStyle = '#00ff99';
        ctx.beginPath();
        ctx.arc(x, y, turbineRadius * 0.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    
    function updateStats() {
      const turbinePower = calculatePower(windSpeed, rotor);
      const totalPower = turbinePower * turbineCount;
      
      document.getElementById('windSpeedDisplay').textContent = windSpeed.toFixed(1) + ' m/s';
      document.getElementById('windDirDisplay').textContent = windDirection.toFixed(0) + '°';
      document.getElementById('totalPowerDisplay').textContent = totalPower.toFixed(2) + ' MW';
      document.getElementById('avgPowerDisplay').textContent = turbinePower.toFixed(3) + ' MW';
    }
    
    // Initial fetch
    fetchWindData();
    
    // Redraw animation loop
    function animate() {
      drawFarm();
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
