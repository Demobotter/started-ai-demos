<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tidal Force Dynamics</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Space Mono', monospace;
      background: linear-gradient(135deg, #0a1428 0%, #1a2d4d 100%);
      color: #e8f1f8;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: rgba(10, 20, 40, 0.8);
      border: 1px solid #1f4d7f;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5em;
      text-align: center;
      margin-bottom: 10px;
      color: #64b5f6;
    }
    .subtitle {
      text-align: center;
      color: #90caf9;
      margin-bottom: 30px;
      font-size: 0.95em;
    }
    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: start;
    }
    @media (max-width: 1200px) {
      .content {
        grid-template-columns: 1fr;
      }
    }
    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .canvas-wrapper {
      background: rgba(15, 30, 60, 0.6);
      border: 1px solid #1f4d7f;
      border-radius: 8px;
      padding: 15px;
      overflow: auto;
    }
    canvas {
      display: block;
      margin: 0 auto;
      background: #0a1428;
      border-radius: 4px;
    }
    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-height: 900px;
      overflow-y: auto;
      padding-right: 10px;
    }
    .right-panel::-webkit-scrollbar {
      width: 6px;
    }
    .right-panel::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
    }
    .right-panel::-webkit-scrollbar-thumb {
      background: rgba(77, 168, 218, 0.5);
      border-radius: 3px;
    }
    .control-group {
      background: rgba(20, 40, 80, 0.5);
      border-left: 3px solid #4da8da;
      border-radius: 4px;
      padding: 15px;
    }
    .control-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9em;
      color: #90caf9;
      font-weight: bold;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #1f4d7f;
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #4da8da;
      cursor: pointer;
      border: 2px solid #64b5f6;
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #4da8da;
      cursor: pointer;
      border: 2px solid #64b5f6;
    }
    select {
      width: 100%;
      padding: 8px 10px;
      background: #1f4d7f;
      color: #64b5f6;
      border: 1px solid #4da8da;
      border-radius: 4px;
      font-family: 'Space Mono', monospace;
      font-size: 0.9em;
      cursor: pointer;
    }
    select option {
      background: #0a1428;
      color: #64b5f6;
    }
    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      min-width: 120px;
      padding: 10px 15px;
      background: #4da8da;
      color: #0a1428;
      border: none;
      border-radius: 4px;
      font-family: 'Space Mono', monospace;
      font-size: 0.85em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: #64b5f6;
      transform: scale(1.05);
    }
    button.active {
      background: #00ff88;
      color: #0a1428;
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
    }
    .stat-box {
      background: rgba(20, 40, 80, 0.5);
      border-left: 3px solid #4da8da;
      border-radius: 4px;
      padding: 12px;
      font-size: 0.85em;
      line-height: 1.5;
    }
    .stat-label {
      color: #90caf9;
      font-weight: bold;
    }
    .stat-value {
      color: #00ff88;
      font-family: 'Playfair Display', serif;
      font-size: 1.2em;
      margin-top: 2px;
    }
    .value-display {
      display: inline-block;
      background: rgba(77, 168, 218, 0.2);
      padding: 2px 6px;
      border-radius: 3px;
      color: #64b5f6;
      margin-left: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌊 Tidal Force Dynamics</h1>
    <div class="subtitle">Explore how lunar gravity shapes Earth's tides</div>

    <div class="content">
      <!-- LEFT PANEL: VISUALIZATIONS -->
      <div class="left-panel">
        <div class="canvas-wrapper">
          <canvas id="globeCanvas" width="400" height="400"></canvas>
        </div>
        <div class="canvas-wrapper">
          <canvas id="tidalCurveCanvas" width="400" height="280"></canvas>
        </div>
      </div>

      <!-- RIGHT PANEL: CONTROLS & STATS -->
      <div class="right-panel">
        <!-- Moon Distance -->
        <div class="control-group">
          <label>Moon Distance (km)</label>
          <input type="range" id="moonDistance" min="356500" max="406700" value="384400" step="1000">
          <div class="value-display" id="moonDistDisplay">384,400 km</div>
        </div>

        <!-- Latitude -->
        <div class="control-group">
          <label>Latitude (0° = Equator, 90° = Pole)</label>
          <input type="range" id="latitude" min="0" max="90" value="0" step="5">
          <div class="value-display" id="latDisplay">0°</div>
        </div>

        <!-- Lunar Phase -->
        <div class="control-group">
          <label>Lunar Phase (0° = New, 180° = Full)</label>
          <input type="range" id="lunarPhase" min="0" max="360" value="0" step="10">
          <div class="value-display" id="phaseDisplay">New Moon (Spring Tide)</div>
        </div>

        <!-- Time Slider -->
        <div class="control-group">
          <label>Time in Lunar Month</label>
          <input type="range" id="timeSlider" min="0" max="29.5" value="0" step="0.2">
          <div class="value-display" id="timeDisplay">Day 0</div>
        </div>

        <!-- Tidal Constituent -->
        <div class="control-group">
          <label>Tidal Constituent</label>
          <select id="constituent">
            <option value="M2">M2 - Lunar Semidiurnal (12.4h)</option>
            <option value="S2">S2 - Solar Semidiurnal (12.0h)</option>
            <option value="K1">K1 - Lunar-Solar Diurnal (23.9h)</option>
            <option value="O1">O1 - Lunar Diurnal (25.8h)</option>
            <option value="combined">Combined (M2+S2)</option>
          </select>
        </div>

        <!-- Toggles -->
        <div class="control-group">
          <label>Display Options</label>
          <div class="button-group">
            <button id="toggleSunMoon" class="active">Sun+Moon</button>
            <button id="toggleLunarOnly">Lunar Only</button>
          </div>
        </div>

        <div class="control-group">
          <label></label>
          <div class="button-group">
            <button id="toggleAmphidromes">Show Amphidromes</button>
            <button id="resetButton">Reset</button>
          </div>
        </div>

        <!-- Statistics -->
        <div class="stat-box">
          <div class="stat-label">Tidal Range</div>
          <div class="stat-value" id="tidalRange">52 cm</div>
        </div>

        <div class="stat-box">
          <div class="stat-label">M2 Amplitude</div>
          <div class="stat-value" id="m2Amplitude">26 cm</div>
        </div>

        <div class="stat-box">
          <div class="stat-label">Spring/Neap</div>
          <div class="stat-value" id="springNeap">Spring Tide</div>
        </div>

        <div class="stat-box">
          <div class="stat-label">Tidal Current Velocity</div>
          <div class="stat-value" id="currentVelocity">45 cm/s</div>
        </div>

        <div class="stat-box">
          <div class="stat-label">Gravitational Tidal Force</div>
          <div class="stat-value" id="tidalForce">2.17×10⁻⁷ g</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const globeCanvas = document.getElementById('globeCanvas');
    const tidalCurveCanvas = document.getElementById('tidalCurveCanvas');
    const globeCtx = globeCanvas.getContext('2d');
    const curveCtx = tidalCurveCanvas.getContext('2d');

    // Constants
    const EARTH_RADIUS = 6371; // km
    const MOON_MASS = 7.342e22; // kg
    const SUN_MASS = 1.989e30; // kg
    const G = 6.674e-11; // gravitational constant
    const EARTH_ROTATION_RATE = 2 * Math.PI / 86400; // rad/s

    // Control references
    const moonDistanceSlider = document.getElementById('moonDistance');
    const latitudeSlider = document.getElementById('latitude');
    const lunarPhaseSlider = document.getElementById('lunarPhase');
    const timeSlider = document.getElementById('timeSlider');
    const constituentSelect = document.getElementById('constituent');
    const toggleSunMoon = document.getElementById('toggleSunMoon');
    const toggleLunarOnly = document.getElementById('toggleLunarOnly');
    const toggleAmphidromes = document.getElementById('toggleAmphidromes');
    const resetButton = document.getElementById('resetButton');

    // State
    let showSunMoon = true;
    let showAmphidromes = false;

    // Update display values
    function updateDisplays() {
      const moonDist = parseFloat(moonDistanceSlider.value);
      const latitude = parseFloat(latitudeSlider.value);
      const phase = parseFloat(lunarPhaseSlider.value);
      const time = parseFloat(timeSlider.value);

      document.getElementById('moonDistDisplay').textContent = `${moonDist.toLocaleString()} km`;
      document.getElementById('latDisplay').textContent = `${latitude}°`;
      document.getElementById('timeDisplay').textContent = `Day ${time.toFixed(1)}`;

      // Phase description
      let phaseDesc = '';
      if (phase < 45 || phase > 315) phaseDesc = 'New Moon (Spring Tide)';
      else if (phase < 135) phaseDesc = 'First Quarter (Neap Tide)';
      else if (phase < 225) phaseDesc = 'Full Moon (Spring Tide)';
      else phaseDesc = 'Last Quarter (Neap Tide)';
      document.getElementById('phaseDisplay').textContent = phaseDesc;

      // Calculate tidal parameters
      calculateTidalStats(moonDist, latitude, phase);
      
      // Render
      renderGlobe(moonDist, latitude, phase, time);
      renderTidalCurve(moonDist, latitude, phase, time);
    }

    function calculateTidalStats(moonDist, latitude, phase) {
      // Convert to meters
      const moonDistMeters = moonDist * 1000;
      const meanDist = 384400000; // meters
      
      // Tidal force magnitude (2GM/d³)
      const tidalForceMoon = (2 * G * MOON_MASS) / Math.pow(moonDistMeters, 3);
      const tidalForceSun = (2 * G * SUN_MASS) / Math.pow(149.6e9, 3); // 1 AU
      
      // Scale for display (relative to Earth's gravity)
      const gEarth = 9.81;
      const tidalForceDisplay = tidalForceMoon / gEarth;
      document.getElementById('tidalForce').textContent = `${tidalForceDisplay.toExponential(2)} g`;

      // M2 amplitude depends on distance (tidal potential ∝ 1/d³) and latitude (∝ cos²(lat))
      const baseM2 = 30; // cm at mean distance, equator
      const distanceFactor = Math.pow(meanDist / moonDistMeters, 3);
      const latFactor = Math.cos(latitude * Math.PI / 180);
      const m2Amplitude = baseM2 * distanceFactor * latFactor * latFactor;
      
      // S2 amplitude ~40% of M2
      const s2Amplitude = m2Amplitude * 0.4;
      
      // Spring/Neap based on phase
      const isSpring = (phase < 45 || phase > 315 || (phase > 135 && phase < 225));
      const range = isSpring ? 2 * (m2Amplitude + s2Amplitude) : 2 * Math.abs(m2Amplitude - s2Amplitude);
      
      document.getElementById('m2Amplitude').textContent = `${m2Amplitude.toFixed(1)} cm`;
      document.getElementById('tidalRange').textContent = `${range.toFixed(1)} cm`;
      document.getElementById('springNeap').textContent = isSpring ? 'Spring Tide' : 'Neap Tide';
      
      // Tidal current velocity (simplified: max ~0.3 m/s in open ocean, up to 2-3 m/s in straits)
      const currentVel = (range / 100) * 0.8; // cm/s → m/s conversion and basin factor
      document.getElementById('currentVelocity').textContent = `${(currentVel * 100).toFixed(0)} cm/s`;
    }

    function renderGlobe(moonDist, latitude, phase, time) {
      const w = globeCanvas.width;
      const h = globeCanvas.height;
      const centerX = w / 2;
      const centerY = h / 2;
      const globeRadius = 120;

      globeCtx.fillStyle = '#0a1428';
      globeCtx.fillRect(0, 0, w, h);

      // Draw Earth
      globeCtx.fillStyle = '#1a4d7f';
      globeCtx.beginPath();
      globeCtx.arc(centerX, centerY, globeRadius, 0, Math.PI * 2);
      globeCtx.fill();
      globeCtx.strokeStyle = '#4da8da';
      globeCtx.lineWidth = 2;
      globeCtx.stroke();

      // Calculate tidal bulges
      const meanDist = 384400;
      const distanceFactor = Math.pow(meanDist / moonDist, 3);
      const latFactor = Math.cos(latitude * Math.PI / 180);
      const bulgeHeight = 40 * distanceFactor * latFactor * latFactor;

      // Determine which side faces the moon based on phase and time
      const moonAngle = (phase * Math.PI / 180) + (time * Math.PI / 14.75); // Synodic month = 29.5 days

      // Draw tidal bulges (cyan)
      globeCtx.fillStyle = 'rgba(77, 168, 218, 0.4)';
      globeCtx.beginPath();
      globeCtx.ellipse(centerX + Math.cos(moonAngle) * 30, centerY + Math.sin(moonAngle) * 30, 
                       bulgeHeight / 2 + 20, globeRadius + bulgeHeight, moonAngle, 0, Math.PI * 2);
      globeCtx.fill();

      // Antipodal bulge
      globeCtx.beginPath();
      globeCtx.ellipse(centerX - Math.cos(moonAngle) * 30, centerY - Math.sin(moonAngle) * 30, 
                       bulgeHeight / 2 + 15, globeRadius + bulgeHeight * 0.6, moonAngle, 0, Math.PI * 2);
      globeCtx.fill();

      // Draw latitude line
      if (latitude > 0) {
        const latRadians = latitude * Math.PI / 180;
        globeCtx.strokeStyle = 'rgba(255, 200, 87, 0.3)';
        globeCtx.lineWidth = 1;
        globeCtx.beginPath();
        const latY = centerY - Math.sin(latRadians) * globeRadius;
        globeCtx.moveTo(centerX - Math.cos(latRadians) * globeRadius, latY);
        globeCtx.lineTo(centerX + Math.cos(latRadians) * globeRadius, latY);
        globeCtx.stroke();
      }

      // Draw Moon indicator
      const moonX = centerX + Math.cos(moonAngle) * (globeRadius + 80);
      const moonY = centerY + Math.sin(moonAngle) * (globeRadius + 80);
      globeCtx.fillStyle = '#fff8dc';
      globeCtx.beginPath();
      globeCtx.arc(moonX, moonY, 15, 0, Math.PI * 2);
      globeCtx.fill();
      globeCtx.strokeStyle = '#ffffaa';
      globeCtx.lineWidth = 2;
      globeCtx.stroke();

      // Labels
      globeCtx.fillStyle = '#90caf9';
      globeCtx.font = 'bold 12px Space Mono';
      globeCtx.textAlign = 'center';
      globeCtx.fillText('🌍', centerX, centerY);
      globeCtx.fillText('🌙', moonX, moonY + 20);
    }

    function renderTidalCurve(moonDist, latitude, phase, time) {
      const w = tidalCurveCanvas.width;
      const h = tidalCurveCanvas.height;
      const padding = 40;
      const graphWidth = w - padding * 2;
      const graphHeight = h - padding * 2;

      curveCtx.fillStyle = '#0a1428';
      curveCtx.fillRect(0, 0, w, h);

      // Grid
      curveCtx.strokeStyle = '#1f4d7f';
      curveCtx.lineWidth = 1;
      for (let i = 0; i <= 5; i++) {
        const y = padding + (graphHeight / 5) * i;
        curveCtx.beginPath();
        curveCtx.moveTo(padding, y);
        curveCtx.lineTo(w - padding, y);
        curveCtx.stroke();
      }

      // Axes
      curveCtx.strokeStyle = '#4da8da';
      curveCtx.lineWidth = 2;
      curveCtx.beginPath();
      curveCtx.moveTo(padding, padding);
      curveCtx.lineTo(padding, h - padding);
      curveCtx.lineTo(w - padding, h - padding);
      curveCtx.stroke();

      // Labels
      curveCtx.fillStyle = '#90caf9';
      curveCtx.font = '10px Space Mono';
      curveCtx.textAlign = 'center';
      curveCtx.fillText('24 hours', w / 2, h - 10);
      curveCtx.save();
      curveCtx.rotate(-Math.PI / 2);
      curveCtx.fillText('Water Level (cm)', -h / 2, 15);
      curveCtx.restore();

      // Calculate tidal curve
      const constituent = document.getElementById('constituent').value;
      const isLunarOnly = !showSunMoon;
      
      // M2 and S2 parameters
      const meanDist = 384400;
      const distanceFactor = Math.pow(meanDist / moonDist, 3);
      const latFactor = Math.cos(latitude * Math.PI / 180);
      const baseM2 = 30 * distanceFactor * latFactor * latFactor;
      const baseS2 = baseM2 * 0.4;
      
      // Phase offset for spring/neap
      const phaseRad = phase * Math.PI / 180;
      
      // Draw curve
      curveCtx.strokeStyle = '#4da8da';
      curveCtx.lineWidth = 2;
      curveCtx.beginPath();
      
      for (let x = 0; x <= graphWidth; x += 2) {
        const t = (x / graphWidth) * 24; // 24-hour period
        let waterLevel = 0;

        if (constituent === 'M2' || constituent === 'combined') {
          // M2: 12.4-hour period (2 cycles per day)
          const m2Period = 12.4 / 24;
          waterLevel += baseM2 * Math.sin(2 * Math.PI * t * m2Period / 12.4 + phaseRad);
        }

        if (!isLunarOnly && (constituent === 'S2' || constituent === 'combined')) {
          // S2: 12-hour period
          const s2Phase = phaseRad * 0.5; // Sun phase offset
          waterLevel += baseS2 * Math.sin(2 * Math.PI * t / 12 + s2Phase);
        }

        if (constituent === 'K1') {
          // K1: 23.93-hour diurnal
          waterLevel = baseM2 * 0.6 * Math.sin(2 * Math.PI * t / 23.93 + phaseRad);
        }

        if (constituent === 'O1') {
          // O1: 25.82-hour diurnal
          waterLevel = baseM2 * 0.5 * Math.sin(2 * Math.PI * t / 25.82 + phaseRad);
        }

        const pixelY = (h - padding) - ((waterLevel / (baseM2 * 1.5)) * (graphHeight / 2) + (graphHeight / 2));
        if (x === 0) {
          curveCtx.moveTo(padding + x, pixelY);
        } else {
          curveCtx.lineTo(padding + x, pixelY);
        }
      }
      curveCtx.stroke();

      // Center line
      curveCtx.strokeStyle = 'rgba(144, 202, 249, 0.3)';
      curveCtx.lineWidth = 1;
      curveCtx.setLineDash([5, 5]);
      curveCtx.beginPath();
      curveCtx.moveTo(padding, (h - padding) - graphHeight / 2);
      curveCtx.lineTo(w - padding, (h - padding) - graphHeight / 2);
      curveCtx.stroke();
      curveCtx.setLineDash([]);
    }

    // Event listeners
    moonDistanceSlider.addEventListener('input', updateDisplays);
    latitudeSlider.addEventListener('input', updateDisplays);
    lunarPhaseSlider.addEventListener('input', updateDisplays);
    timeSlider.addEventListener('input', updateDisplays);
    constituentSelect.addEventListener('change', updateDisplays);

    toggleSunMoon.addEventListener('click', () => {
      showSunMoon = true;
      toggleSunMoon.classList.add('active');
      toggleLunarOnly.classList.remove('active');
      updateDisplays();
    });

    toggleLunarOnly.addEventListener('click', () => {
      showSunMoon = false;
      toggleLunarOnly.classList.add('active');
      toggleSunMoon.classList.remove('active');
      updateDisplays();
    });

    toggleAmphidromes.addEventListener('click', () => {
      showAmphidromes = !showAmphidromes;
      toggleAmphidromes.classList.toggle('active');
      updateDisplays();
    });

    resetButton.addEventListener('click', () => {
      moonDistanceSlider.value = 384400;
      latitudeSlider.value = 0;
      lunarPhaseSlider.value = 0;
      timeSlider.value = 0;
      constituentSelect.value = 'M2';
      showSunMoon = true;
      showAmphidromes = false;
      toggleSunMoon.classList.add('active');
      toggleLunarOnly.classList.remove('active');
      toggleAmphidromes.classList.remove('active');
      updateDisplays();
    });

    // Initial render
    updateDisplays();
  </script>
</body>
</html>
