<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wine Pairing Guide</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Space Mono', monospace;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      display: flex;
      gap: 30px;
      max-width: 1400px;
      width: 100%;
      flex-wrap: wrap;
    }
    .sidebar {
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .canvas-wrapper {
      flex: 1;
      min-width: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: #d4a574;
      margin-bottom: 10px;
    }
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      color: #d4a574;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      border-bottom: 2px solid #4a2f3a;
      padding-bottom: 8px;
    }
    select, button {
      padding: 10px;
      background: #2a1a2e;
      border: 2px solid #4a2f3a;
      color: #e0e0e0;
      font-family: 'Space Mono', monospace;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }
    select:hover, button:hover {
      border-color: #d4a574;
      background: #3a2a3e;
    }
    select:focus, button:focus {
      outline: none;
      border-color: #d4a574;
    }
    .stat-box {
      background: #2a1a2e;
      border-left: 4px solid #d4a574;
      padding: 12px;
      border-radius: 4px;
      font-size: 12px;
    }
    .stat-label {
      color: #888;
      text-transform: uppercase;
      font-size: 10px;
      margin-bottom: 4px;
    }
    .stat-value {
      color: #d4a574;
      font-size: 14px;
      font-weight: bold;
    }
    canvas {
      border: 2px solid #4a2f3a;
      border-radius: 4px;
      background: linear-gradient(135deg, #1a1a2e 0%, #2a1a3e 100%);
      display: block;
      margin-bottom: 20px;
    }
    .pairing-score {
      text-align: center;
      font-size: 24px;
      color: #d4a574;
      margin-bottom: 10px;
    }
    .stars {
      color: #d4a574;
      font-size: 18px;
      text-align: center;
      margin-bottom: 15px;
    }
    .explanation {
      background: #2a1a2e;
      border-left: 4px solid #2d9d5f;
      padding: 12px;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.6;
      color: #b0b0b0;
      text-align: center;
    }
    @media (max-width: 900px) {
      .container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
      }
      .canvas-wrapper {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h1>🍷 Wine Pairing</h1>
      
      <div>
        <div class="section-title">Wine Region</div>
        <select id="wineSelect">
          <option value="bordeaux">Bordeaux Cabernet</option>
          <option value="burgundy">Burgundy Pinot Noir</option>
          <option value="tuscany">Tuscany Chianti</option>
          <option value="napa">Napa Cabernet</option>
          <option value="rhone">Rhône Syrah</option>
          <option value="australia">Australian Shiraz</option>
        </select>
      </div>

      <div>
        <div class="section-title">Food Item</div>
        <select id="foodSelect">
          <option value="salmon">Salmon</option>
          <option value="beef">Beef Steak</option>
          <option value="chicken">Chicken Breast</option>
          <option value="cheese">Aged Cheese</option>
          <option value="chocolate">Dark Chocolate</option>
          <option value="truffle">Truffle</option>
          <option value="mushroom">Mushroom</option>
          <option value="curry">Spicy Curry</option>
        </select>
      </div>

      <div class="stat-box">
        <div class="stat-label">Wine Profile</div>
        <div class="stat-value" id="wineProfile">Cabernet</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">Tasting Notes</div>
        <div class="stat-value" id="wineNotes" style="font-size: 11px; color: #b0b0b0;">Blackberry, oak, tannin</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">Food Profile</div>
        <div class="stat-value" id="foodProfile">Umami, fat, char</div>
      </div>

      <button onclick="randomizePairing()">Random Pairing</button>
    </div>

    <div class="canvas-wrapper">
      <canvas id="canvas" width="600" height="600"></canvas>
      <div class="pairing-score">Score: <span id="score">95</span>%</div>
      <div class="stars" id="stars">★★★★★</div>
      <div class="explanation" id="explanation">
        Cabernet's bold tannins cut through beef's richness; oak complements char; mineral notes elevate umami.
      </div>
    </div>
  </div>

  <script>
    const wines = {
      bordeaux: {
        name: 'Bordeaux Cabernet',
        notes: 'Blackberry, oak, tannin, vanilla',
        x: 0.85,
        y: 0.25,
        color: '#8b0000',
        body: 'Bold',
        tannin: 'High',
        acidity: 'Medium'
      },
      burgundy: {
        name: 'Burgundy Pinot Noir',
        notes: 'Cherry, earth, spice',
        x: 0.55,
        y: 0.40,
        color: '#c41e3a',
        body: 'Medium',
        tannin: 'Medium',
        acidity: 'Medium'
      },
      tuscany: {
        name: 'Tuscany Chianti',
        notes: 'Cherry, leather, herb',
        x: 0.45,
        y: 0.60,
        color: '#a72021',
        body: 'Medium',
        tannin: 'Medium',
        acidity: 'High'
      },
      napa: {
        name: 'Napa Cabernet',
        notes: 'Plum, oak, bell pepper',
        x: 0.80,
        y: 0.30,
        color: '#7a1a1a',
        body: 'Bold',
        tannin: 'High',
        acidity: 'Medium'
      },
      rhone: {
        name: 'Rhône Syrah',
        notes: 'Pepper, plum, smoke',
        x: 0.75,
        y: 0.35,
        color: '#6b1a1a',
        body: 'Bold',
        tannin: 'High',
        acidity: 'Medium'
      },
      australia: {
        name: 'Australian Shiraz',
        notes: 'Blackberry, pepper, mint',
        x: 0.80,
        y: 0.25,
        color: '#8b1a1a',
        body: 'Bold',
        tannin: 'High',
        acidity: 'Medium'
      }
    };

    const foods = {
      salmon: { name: 'Salmon', profile: 'Delicate, fatty, slightly sweet', x: 0.40, y: 0.65, color: '#ff9999', pairings: { burgundy: 88, napa: 72, rhone: 65, australia: 60, bordeaux: 68, tuscany: 58 } },
      beef: { name: 'Beef Steak', profile: 'Umami, fat, char, smoke', x: 0.85, y: 0.20, color: '#8b4513', pairings: { bordeaux: 95, napa: 94, rhone: 92, australia: 93, burgundy: 78, tuscany: 65 } },
      chicken: { name: 'Chicken Breast', profile: 'Lean, subtle, versatile', x: 0.50, y: 0.50, color: '#f4a460', pairings: { burgundy: 92, tuscany: 88, australia: 75, bordeaux: 70, rhone: 68, napa: 72 } },
      cheese: { name: 'Aged Cheese', profile: 'Umami, saltiness, complex', x: 0.60, y: 0.45, color: '#daa520', pairings: { bordeaux: 87, napa: 85, burgundy: 84, tuscany: 85, rhone: 80, australia: 78 } },
      chocolate: { name: 'Dark Chocolate', profile: 'Bitter, rich, earthy', x: 0.65, y: 0.30, color: '#3d2817', pairings: { napa: 72, rhone: 75, bordeaux: 70, australia: 75, burgundy: 65, tuscany: 60 } },
      truffle: { name: 'Truffle', profile: 'Earthy, nutty, umami', x: 0.70, y: 0.55, color: '#654321', pairings: { burgundy: 90, tuscany: 88, bordeaux: 82, napa: 80, rhone: 78, australia: 76 } },
      mushroom: { name: 'Mushroom', profile: 'Earthy, umami, mild', x: 0.65, y: 0.60, color: '#8b7355', pairings: { burgundy: 88, rhone: 84, tuscany: 82, bordeaux: 78, australia: 84, napa: 75 } },
      curry: { name: 'Spicy Curry', profile: 'Spice, richness, heat', x: 0.75, y: 0.70, color: '#ff8c00', pairings: { rhone: 91, australia: 88, napa: 72, bordeaux: 68, burgundy: 60, tuscany: 55 } }
    };

    const explanations = {
      bordeaux_beef: "Cabernet's bold tannins cut through beef's richness; oak complements char; mineral notes elevate umami.",
      burgundy_salmon: "Pinot Noir's acidity balances salmon's fat; cherry and earth flavors enhance delicate fish.",
      tuscany_chicken: "Chianti's bright acidity and cherry notes complement lean chicken without overpowering.",
      napa_beef: "High-tannin Cabernet matches beef's richness; structured body stands up to bold char.",
      rhone_curry: "Syrah's pepper and spice notes mirror curry heat; tannins balance rich sauce.",
      australia_beef: "Shiraz's bold fruit and pepper complement beef's umami and smoke perfectly.",
      burgundy_truffle: "Pinot Noir's earthy notes echo truffle's complexity; medium body lets delicate flavors shine.",
      tuscany_cheese: "Chianti's acidity cuts through aged cheese's richness; herb notes complement sharp flavors.",
      default: "This pairing brings together complementary flavors for a harmonious dining experience."
    };

    let currentWine = 'bordeaux';
    let currentFood = 'beef';

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function drawTastingWheel() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = 200;

      // Clear canvas
      ctx.fillStyle = 'rgba(26, 26, 46, 0.8)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw wheel background
      ctx.fillStyle = 'rgba(74, 47, 58, 0.3)';
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.fill();

      // Draw axes labels
      ctx.font = 'bold 12px "Space Mono"';
      ctx.fillStyle = '#d4a574';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // X-axis labels
      ctx.fillText('Tannin/Acidity', centerX - radius - 20, centerY);
      ctx.fillText('Smooth/Fat', centerX + radius + 20, centerY);

      // Y-axis labels
      ctx.fillText('Light/Delicate', centerX, centerY - radius - 20);
      ctx.fillText('Bold/Rich', centerX, centerY + radius + 20);

      // Draw grid lines
      ctx.strokeStyle = 'rgba(212, 165, 116, 0.2)';
      ctx.lineWidth = 1;
      for (let i = 1; i < 4; i++) {
        const dist = (radius / 3) * i;
        ctx.beginPath();
        ctx.arc(centerX, centerY, dist, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Draw axis lines
      ctx.strokeStyle = 'rgba(212, 165, 116, 0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(centerX - radius, centerY);
      ctx.lineTo(centerX + radius, centerY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(centerX, centerY - radius);
      ctx.lineTo(centerX, centerY + radius);
      ctx.stroke();

      // Draw wine dot
      const wine = wines[currentWine];
      const wineScreenX = centerX + (wine.x - 0.5) * radius * 2;
      const wineScreenY = centerY + (wine.y - 0.5) * radius * 2;

      ctx.fillStyle = wine.color;
      ctx.beginPath();
      ctx.arc(wineScreenX, wineScreenY, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#d4a574';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Draw wine label
      ctx.font = 'bold 14px "Playfair Display"';
      ctx.fillStyle = wine.color;
      ctx.textAlign = 'left';
      ctx.fillText(wine.name, wineScreenX + 20, wineScreenY - 10);

      // Draw food dot
      const food = foods[currentFood];
      const foodScreenX = centerX + (food.x - 0.5) * radius * 2;
      const foodScreenY = centerY + (food.y - 0.5) * radius * 2;

      ctx.fillStyle = food.color;
      ctx.beginPath();
      ctx.arc(foodScreenX, foodScreenY, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#d4a574';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Draw food label
      ctx.fillStyle = food.color;
      ctx.textAlign = 'right';
      ctx.fillText(food.name, foodScreenX - 20, foodScreenY + 10);

      // Draw connection line based on pairing score
      const pairingScore = getPairingScore();
      const brightness = Math.max(0.3, pairingScore / 100);
      ctx.strokeStyle = `rgba(212, 165, 116, ${brightness})`;
      ctx.lineWidth = Math.max(1, brightness * 4);
      ctx.beginPath();
      ctx.moveTo(wineScreenX, wineScreenY);
      ctx.lineTo(foodScreenX, foodScreenY);
      ctx.stroke();
    }

    function getPairingScore() {
      const food = foods[currentFood];
      return food.pairings[currentWine] || 50;
    }

    function getStarRating(score) {
      const stars = Math.round((score / 100) * 5);
      return '★'.repeat(stars) + '☆'.repeat(5 - stars);
    }

    function getExplanation() {
      const key = `${currentWine}_${currentFood}`;
      return explanations[key] || explanations.default;
    }

    function updateDisplay() {
      const wine = wines[currentWine];
      const food = foods[currentFood];
      const score = getPairingScore();

      document.getElementById('wineProfile').textContent = wine.name;
      document.getElementById('wineNotes').textContent = wine.notes;
      document.getElementById('foodProfile').textContent = food.profile;
      document.getElementById('score').textContent = score;
      document.getElementById('stars').textContent = getStarRating(score);
      document.getElementById('explanation').textContent = getExplanation();

      drawTastingWheel();
    }

    function randomizePairing() {
      const wineKeys = Object.keys(wines);
      const foodKeys = Object.keys(foods);
      currentWine = wineKeys[Math.floor(Math.random() * wineKeys.length)];
      currentFood = foodKeys[Math.floor(Math.random() * foodKeys.length)];
      document.getElementById('wineSelect').value = currentWine;
      document.getElementById('foodSelect').value = currentFood;
      updateDisplay();
    }

    document.getElementById('wineSelect').addEventListener('change', (e) => {
      currentWine = e.target.value;
      updateDisplay();
    });

    document.getElementById('foodSelect').addEventListener('change', (e) => {
      currentFood = e.target.value;
      updateDisplay();
    });

    // Initial render
    updateDisplay();
    
    // Handle resize
    window.addEventListener('resize', () => {
      canvas.width = Math.min(600, window.innerWidth - 40);
      canvas.height = canvas.width;
      drawTastingWheel();
    });
  </script>
</body>
</html>
