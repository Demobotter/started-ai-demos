<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Spectrum Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #0a1428 0%, #1a2a4a 100%);
            color: #f5ead6;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            height: calc(100vh - 40px);
        }
        
        .sidebar {
            background: rgba(10, 20, 40, 0.6);
            border: 1px solid #4da8da;
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
        }
        
        .main-canvas {
            background: rgba(10, 20, 40, 0.8);
            border: 1px solid #4da8da;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            color: #4da8da;
        }
        
        .tabs {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .tab-btn {
            padding: 10px;
            background: rgba(77, 168, 218, 0.1);
            border: 1px solid #4da8da;
            color: #f5ead6;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .tab-btn.active {
            background: #4da8da;
            color: #0a1428;
            font-weight: bold;
        }
        
        .tab-btn:hover:not(.active) {
            background: rgba(77, 168, 218, 0.2);
        }
        
        .control-group {
            margin-bottom: 18px;
        }
        
        .label {
            font-size: 11px;
            font-weight: bold;
            color: #7dd3fc;
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
        }
        
        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        input[type="range"] {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #333;
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4da8da;
            cursor: pointer;
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4da8da;
            cursor: pointer;
            border: none;
        }
        
        .slider-value {
            font-size: 10px;
            color: #7dd3fc;
            text-align: right;
        }
        
        .button-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
        }
        
        .btn {
            padding: 8px 12px;
            background: rgba(77, 168, 218, 0.1);
            border: 1px solid #4da8da;
            color: #f5ead6;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            transition: all 0.2s;
        }
        
        .btn.active {
            background: #4da8da;
            color: #0a1428;
        }
        
        .btn:hover:not(.active) {
            background: rgba(77, 168, 218, 0.2);
        }
        
        .stat-box {
            background: rgba(45, 157, 95, 0.1);
            border-left: 3px solid #2d9d5f;
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
            font-size: 11px;
        }
        
        .stat-label {
            color: #7dd3fc;
            font-weight: bold;
        }
        
        .stat-value {
            color: #f5ead6;
            font-family: 'Space Mono', monospace;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }
        
        input[type="checkbox"] {
            width: 14px;
            height: 14px;
            cursor: pointer;
            accent-color: #4da8da;
        }
        
        canvas {
            flex: 1;
            background: #050a15;
            border-radius: 4px;
            border: 1px solid #333;
        }
        
        .canvas-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }
        
        .canvas-label {
            font-size: 12px;
            color: #7dd3fc;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }
            
            .sidebar {
                order: 2;
            }
            
            .main-canvas {
                order: 1;
                height: 600px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>🌈 Spectrum</h1>
            
            <div class="tabs">
                <button class="tab-btn active" data-tab="prism">Prism</button>
                <button class="tab-btn" data-tab="elements">Elements</button>
                <button class="tab-btn" data-tab="sources">Sources</button>
            </div>
            
            <!-- PRISM TAB -->
            <div class="tab-content active" id="prism">
                <div class="control-group">
                    <label class="label">Prism Angle</label>
                    <div class="slider-container">
                        <input type="range" id="prismAngle" min="30" max="60" value="45">
                        <div class="slider-value"><span id="angleVal">45</span>°</div>
                    </div>
                </div>
                
                <div class="control-group">
                    <label class="label">Intensity</label>
                    <div class="slider-container">
                        <input type="range" id="prismIntensity" min="0" max="100" value="80">
                        <div class="slider-value"><span id="intensityVal">80</span>%</div>
                    </div>
                </div>
                
                <div class="control-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="showWavelengths">
                        <label for="showWavelengths" style="font-size: 11px;">Show Wavelengths</label>
                    </div>
                </div>
                
                <div class="stat-box">
                    <div><span class="stat-label">Refractive Index:</span> <span class="stat-value">1.50</span></div>
                    <div><span class="stat-label">Dispersion:</span> <span class="stat-value"><span id="dispersionVal">15.2</span>°</span></div>
                    <div style="margin-top: 6px;"><span class="stat-label">Status:</span> <span class="stat-value">White Light</span></div>
                </div>
            </div>
            
            <!-- ELEMENTS TAB -->
            <div class="tab-content" id="elements" style="display:none;">
                <div class="control-group">
                    <label class="label">Select Element</label>
                    <div class="button-group" id="elementButtons">
                        <button class="btn active" data-element="hydrogen">Hydrogen</button>
                        <button class="btn" data-element="helium">Helium</button>
                        <button class="btn" data-element="neon">Neon</button>
                        <button class="btn" data-element="argon">Argon</button>
                        <button class="btn" data-element="mercury">Mercury</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="showEnergyLevels">
                        <label for="showEnergyLevels" style="font-size: 11px;">Energy Levels</label>
                    </div>
                </div>
                
                <div class="stat-box">
                    <div><span class="stat-label">Element:</span> <span class="stat-value" id="elementName">Hydrogen</span></div>
                    <div><span class="stat-label">Visible Lines:</span> <span class="stat-value" id="lineCount">4</span></div>
                    <div style="margin-top: 6px;"><span class="stat-label">Range:</span> <span class="stat-value">656–410 nm</span></div>
                </div>
            </div>
            
            <!-- SOURCES TAB -->
            <div class="tab-content" id="sources" style="display:none;">
                <div class="control-group">
                    <label class="label">Light Source</label>
                    <div class="button-group" id="sourceButtons">
                        <button class="btn active" data-source="incandescent">Incandescent</button>
                        <button class="btn" data-source="fluorescent">Fluorescent</button>
                        <button class="btn" data-source="led">LED White</button>
                        <button class="btn" data-source="sunlight">Sunlight</button>
                        <button class="btn" data-source="flame">Flame</button>
                    </div>
                </div>
                
                <div class="stat-box">
                    <div><span class="stat-label">Source:</span> <span class="stat-value" id="sourceName">Incandescent</span></div>
                    <div><span class="stat-label">Color Temp:</span> <span class="stat-value" id="colorTemp">2850 K</span></div>
                    <div style="margin-top: 6px;"><span class="stat-label">Dominant:</span> <span class="stat-value" id="dominant">620 nm</span></div>
                </div>
            </div>
        </div>
        
        <div class="main-canvas">
            <div class="canvas-label" id="canvasLabel">White Light Prism Refraction</div>
            <div class="canvas-container">
                <canvas id="spectrum"></canvas>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('spectrum');
        const ctx = canvas.getContext('2d');
        const prismAngleInput = document.getElementById('prismAngle');
        const prismIntensityInput = document.getElementById('prismIntensity');
        const showWavelengthsInput = document.getElementById('showWavelengths');
        const showEnergyLevelsInput = document.getElementById('showEnergyLevels');
        
        let currentTab = 'prism';
        let currentElement = 'hydrogen';
        let currentSource = 'incandescent';
        
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            draw();
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                currentTab = tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
                btn.classList.add('active');
                document.getElementById(tab).style.display = 'block';
                updateCanvasLabel();
                draw();
            });
        });
        
        // Element selection
        document.querySelectorAll('[data-element]').forEach(btn => {
            btn.addEventListener('click', () => {
                currentElement = btn.dataset.element;
                document.querySelectorAll('[data-element]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('elementName').textContent = btn.textContent;
                draw();
            });
        });
        
        // Source selection
        document.querySelectorAll('[data-source]').forEach(btn => {
            btn.addEventListener('click', () => {
                currentSource = btn.dataset.source;
                document.querySelectorAll('[data-source]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('sourceName').textContent = btn.textContent;
                updateSourceStats();
                draw();
            });
        });
        
        // Slider updates
        prismAngleInput.addEventListener('input', (e) => {
            document.getElementById('angleVal').textContent = e.target.value;
            document.getElementById('dispersionVal').textContent = (60 - e.target.value).toFixed(1);
            draw();
        });
        
        prismIntensityInput.addEventListener('input', (e) => {
            document.getElementById('intensityVal').textContent = e.target.value;
            draw();
        });
        
        showWavelengthsInput.addEventListener('change', draw);
        showEnergyLevelsInput.addEventListener('change', draw);
        
        function updateCanvasLabel() {
            const labels = {
                'prism': 'White Light Prism Refraction',
                'elements': 'Emission Spectra (Gas Discharge)',
                'sources': 'Real Light Source Spectra'
            };
            document.getElementById('canvasLabel').textContent = labels[currentTab];
        }
        
        function updateSourceStats() {
            const stats = {
                incandescent: { temp: '2850 K', dominant: '620 nm' },
                fluorescent: { temp: '4000 K', dominant: '555 nm' },
                led: { temp: '6500 K', dominant: '580 nm' },
                sunlight: { temp: '5778 K', dominant: '505 nm' },
                flame: { temp: '1700 K', dominant: '650 nm' }
            };
            const stat = stats[currentSource];
            document.getElementById('colorTemp').textContent = stat.temp;
            document.getElementById('dominant').textContent = stat.dominant;
        }
        
        // Wavelength to RGB conversion
        function wavelengthToRGB(wavelength) {
            let r, g, b;
            if (wavelength < 380) return [0, 0, 0];
            if (wavelength < 440) {
                r = -(wavelength - 440) / (440 - 380);
                g = 0;
                b = 1;
            } else if (wavelength < 490) {
                r = 0;
                g = (wavelength - 440) / (490 - 440);
                b = 1;
            } else if (wavelength < 510) {
                r = 0;
                g = 1;
                b = -(wavelength - 510) / (510 - 490);
            } else if (wavelength < 580) {
                r = (wavelength - 510) / (580 - 510);
                g = 1;
                b = 0;
            } else if (wavelength < 645) {
                r = 1;
                g = -(wavelength - 645) / (645 - 580);
                b = 0;
            } else {
                r = 1;
                g = 0;
                b = 0;
            }
            
            // Intensity correction
            if (wavelength < 380 || wavelength > 750) return [0, 0, 0];
            if (wavelength < 420) {
                const factor = 0.3 + 0.7 * (wavelength - 380) / (420 - 380);
                r *= factor;
                g *= factor;
                b *= factor;
            } else if (wavelength > 700) {
                const factor = 0.3 + 0.7 * (750 - wavelength) / (750 - 700);
                r *= factor;
                g *= factor;
                b *= factor;
            }
            
            return [Math.round(r * 255), Math.round(g * 255), Math.round(b * 255)];
        }
        
        function drawPrism() {
            const w = canvas.width;
            const h = canvas.height;
            const cx = w * 0.35;
            const cy = h * 0.5;
            const angle = parseFloat(prismAngleInput.value);
            const intensity = parseFloat(prismIntensityInput.value) / 100;
            
            // Clear
            ctx.fillStyle = '#050a15';
            ctx.fillRect(0, 0, w, h);
            
            // Incident ray
            ctx.strokeStyle = 'rgba(255, 255, 150, ' + (0.5 * intensity) + ')';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx - 80, cy);
            ctx.lineTo(cx, cy);
            ctx.stroke();
            
            // Prism
            const size = 60;
            ctx.fillStyle = 'rgba(200, 220, 255, 0.1)';
            ctx.strokeStyle = 'rgba(200, 220, 255, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(cx, cy - size/2);
            ctx.lineTo(cx + size, cy + size/2);
            ctx.lineTo(cx, cy + size/2);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Refracted rays (spectrum)
            const refAngle = (angle - 30) / 30 * 25; // Scales angle change to visual spread
            const colors = [
                { nm: 700, name: 'Red' },
                { nm: 630, name: 'Orange' },
                { nm: 590, name: 'Yellow' },
                { nm: 550, name: 'Green' },
                { nm: 495, name: 'Cyan' },
                { nm: 450, name: 'Blue' },
                { nm: 380, name: 'Violet' }
            ];
            
            colors.forEach((color, i) => {
                const spread = (i - 3) * 3.5 + refAngle * (i - 3) * 0.5;
                const rgb = wavelengthToRGB(color.nm);
                ctx.strokeStyle = `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${intensity})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(cx + size, cy + size/2);
                ctx.lineTo(cx + size + 100, cy + size/2 + spread);
                ctx.stroke();
                
                if (showWavelengthsInput.checked) {
                    ctx.fillStyle = `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 0.8)`;
                    ctx.font = '10px Space Mono';
                    ctx.fillText(color.nm + ' nm', cx + size + 105, cy + size/2 + spread + 10);
                }
            });
            
            // Labels
            ctx.fillStyle = '#7dd3fc';
            ctx.font = 'bold 12px Space Mono';
            ctx.fillText('White Light', cx - 75, cy - 15);
        }
        
        function drawElements() {
            const w = canvas.width;
            const h = canvas.height;
            
            // Clear
            ctx.fillStyle = '#050a15';
            ctx.fillRect(0, 0, w, h);
            
            // Grid
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 10; i++) {
                const x = (w / 10) * i;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
                ctx.stroke();
            }
            
            // Wavelength labels (400-700 nm)
            ctx.fillStyle = '#7dd3fc';
            ctx.font = '10px Space Mono';
            ctx.fillText('400 nm', 10, 20);
            ctx.fillText('700 nm', w - 60, 20);
            
            const elements = {
                hydrogen: [656, 486, 434, 410],
                helium: [706, 656, 587, 502, 471],
                neon: [703, 640, 633, 614, 594, 585, 534],
                argon: [811, 751, 696, 641, 606, 555],
                mercury: [579, 546, 436, 405]
            };
            
            const lines = elements[currentElement] || [];
            const startX = 30;
            const endX = w - 30;
            const lineY = h * 0.4;
            
            lines.forEach(nm => {
                const pos = startX + ((nm - 400) / 300) * (endX - startX);
                const rgb = wavelengthToRGB(nm);
                
                // Line
                ctx.strokeStyle = `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(pos, lineY - 40);
                ctx.lineTo(pos, lineY + 40);
                ctx.stroke();
                
                // Dot
                ctx.fillStyle = `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
                ctx.beginPath();
                ctx.arc(pos, lineY, 6, 0, Math.PI * 2);
                ctx.fill();
                
                // Label
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.font = '9px Space Mono';
                ctx.fillText(nm + ' nm', pos - 20, lineY + 55);
            });
            
            if (showEnergyLevelsInput.checked) {
                drawEnergyLevels();
            }
        }
        
        function drawEnergyLevels() {
            const w = canvas.width;
            const h = canvas.height;
            const boxX = w * 0.65;
            const boxY = h * 0.55;
            const boxW = 150;
            const boxH = 120;
            
            ctx.strokeStyle = '#4da8da';
            ctx.lineWidth = 1;
            ctx.strokeRect(boxX, boxY, boxW, boxH);
            
            ctx.fillStyle = '#4da8da';
            ctx.font = '10px Space Mono';
            ctx.fillText('Energy Levels', boxX + 5, boxY + 15);
            
            // Simplified energy diagram
            const levels = [5, 4, 3, 2, 1];
            const spacing = (boxH - 30) / 5;
            levels.forEach((level, i) => {
                const y = boxY + 25 + i * spacing;
                ctx.strokeStyle = '#7dd3fc';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(boxX + 10, y);
                ctx.lineTo(boxX + boxW - 10, y);
                ctx.stroke();
                ctx.fillStyle = '#7dd3fc';
                ctx.fillText('n=' + level, boxX + boxW + 5, y + 3);
            });
        }
        
        function drawSources() {
            const w = canvas.width;
            const h = canvas.height;
            
            // Clear
            ctx.fillStyle = '#050a15';
            ctx.fillRect(0, 0, w, h);
            
            // Grid background
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 10; i++) {
                const x = (w / 10) * i;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
                ctx.stroke();
            }
            
            const sources = {
                incandescent: { peaks: [620], shape: 'smooth', startIntensity: 0.3 },
                fluorescent: { peaks: [440, 550, 610], shape: 'spiky', startIntensity: 0.4 },
                led: { peaks: [450, 540, 600], shape: 'peaky', startIntensity: 0.5 },
                sunlight: { peaks: [550], shape: 'broad', startIntensity: 0.6 },
                flame: { peaks: [650], shape: 'smooth', startIntensity: 0.2 }
            };
            
            const source = sources[currentSource];
            const startX = 30;
            const endX = w - 30;
            const baselineY = h * 0.8;
            const graphHeight = h * 0.5;
            
            // Draw spectrum curve
            ctx.strokeStyle = '#4da8da';
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            for (let x = startX; x <= endX; x += 1) {
                const nm = 400 + ((x - startX) / (endX - startX)) * 300;
                let intensity = source.startIntensity;
                
                if (source.shape === 'smooth') {
                    intensity += 0.7 * Math.exp(-Math.pow((nm - source.peaks[0]) / 80, 2));
                } else if (source.shape === 'broad') {
                    intensity += 0.8 * Math.exp(-Math.pow((nm - source.peaks[0]) / 100, 2));
                } else if (source.shape === 'spiky' || source.shape === 'peaky') {
                    source.peaks.forEach(peak => {
                        const width = source.shape === 'spiky' ? 20 : 40;
                        intensity += 0.6 * Math.exp(-Math.pow((nm - peak) / width, 2));
                    });
                }
                
                const y = baselineY - intensity * graphHeight;
                if (x === startX) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            // Fill under curve
            ctx.lineTo(endX, baselineY);
            ctx.lineTo(startX, baselineY);
            ctx.closePath();
            ctx.fillStyle = 'rgba(77, 168, 218, 0.2)';
            ctx.fill();
            
            // X-axis labels
            ctx.fillStyle = '#7dd3fc';
            ctx.font = '10px Space Mono';
            ctx.fillText('400 nm', startX, h - 5);
            ctx.fillText('700 nm', endX - 40, h - 5);
            
            // Y-axis label
            ctx.fillText('Intensity', 5, baselineY - graphHeight);
        }
        
        function draw() {
            if (currentTab === 'prism') {
                drawPrism();
            } else if (currentTab === 'elements') {
                drawElements();
            } else if (currentTab === 'sources') {
                drawSources();
            }
        }
        
        draw();
    </script>
</body>
</html>
