<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA Helix Visualizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: #0a1428;
            color: #7dd3fc;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 280px;
            background: #0f1f35;
            border-right: 1px solid #1e3a5f;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .sidebar h1 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            color: #00d9ff;
            margin-bottom: 10px;
        }
        .mode-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        button {
            padding: 10px 14px;
            background: #1a3a5a;
            border: 1px solid #4da8da;
            color: #7dd3fc;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            transition: all 0.2s;
        }
        button:hover {
            background: #2d5f8f;
            color: #00d9ff;
        }
        button.active {
            background: #00d9ff;
            color: #0a1428;
            border-color: #00d9ff;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .control-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #4da8da;
            font-weight: 700;
        }
        input[type="range"] {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #1a3a5a;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00d9ff;
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00d9ff;
            cursor: pointer;
            border: none;
        }
        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            cursor: pointer;
        }
        .stat-box {
            background: #0a1428;
            border-left: 4px solid #2d9d5f;
            padding: 10px;
            border-radius: 2px;
            font-size: 11px;
            line-height: 1.6;
        }
        .stat-label { color: #4da8da; }
        .stat-value { color: #00d9ff; font-weight: 700; }
        .legend {
            background: #0a1428;
            border: 1px solid #1e3a5f;
            padding: 10px;
            border-radius: 2px;
            font-size: 10px;
        }
        .legend-item {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 4px 0;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
        .canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a1428;
            position: relative;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
        }
        .info-text {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(10, 20, 40, 0.8);
            border: 1px solid #1e3a5f;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 11px;
            color: #7dd3fc;
        }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; max-height: 200px; border-right: none; border-bottom: 1px solid #1e3a5f; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h1>🧬 DNA Helix</h1>
        
        <div class="mode-buttons">
            <button class="mode-btn active" data-mode="structure">Structure</button>
            <button class="mode-btn" data-mode="replication">Replication</button>
            <button class="mode-btn" data-mode="transcription">Transcription</button>
        </div>

        <div class="control-group">
            <label class="control-label">Rotation</label>
            <input type="range" id="rotationSlider" min="0" max="360" value="0">
            <div style="font-size: 11px; color: #4da8da;"><span id="rotationValue">0</span>°</div>
        </div>

        <div class="control-group">
            <label class="control-label">Separation (Replication)</label>
            <input type="range" id="separationSlider" min="0" max="100" value="0">
            <div style="font-size: 11px; color: #4da8da;"><span id="separationValue">0</span>%</div>
        </div>

        <div class="control-group">
            <label class="control-label">Zoom</label>
            <input type="range" id="zoomSlider" min="0.5" max="3" step="0.1" value="1">
            <div style="font-size: 11px; color: #4da8da;"><span id="zoomValue">1.0</span>x</div>
        </div>

        <div class="control-group">
            <label class="checkbox-label">
                <input type="checkbox" id="showPurinePyrimidine">
                Show Purine/Pyrimidine
            </label>
        </div>

        <div class="control-group">
            <label class="control-label">Base Pairs</label>
            <input type="range" id="baseCountSlider" min="10" max="100" value="50">
            <div style="font-size: 11px; color: #4da8da;"><span id="baseCountValue">50</span></div>
        </div>

        <div class="stat-box">
            <div class="stat-label">Total Base Pairs</div>
            <div class="stat-value" id="statBPCount">50</div>
            <div style="margin-top: 8px; border-top: 1px solid #1e3a5f; padding-top: 8px;">
                <div class="stat-label">GC Content</div>
                <div class="stat-value" id="statGCContent">48%</div>
            </div>
            <div style="margin-top: 8px; border-top: 1px solid #1e3a5f; padding-top: 8px;">
                <div class="stat-label">Melting Temp</div>
                <div class="stat-value" id="statTm">61°C</div>
            </div>
        </div>

        <div class="legend">
            <div style="color: #00d9ff; font-weight: 700; margin-bottom: 8px;">Legend</div>
            <div class="legend-item">
                <div class="legend-color" style="background: #2d7a4a;"></div>
                <span>Adenine (A)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #ff6b6b;"></div>
                <span>Thymine (T)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #ff8c42;"></div>
                <span>Guanine (G)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #9d4edd;"></div>
                <span>Cytosine (C)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #ffd700;"></div>
                <span>Polymerase</span>
            </div>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="dnaCanvas"></canvas>
        <div class="info-text" id="infoText">Rotate helix • drag sliders</div>
    </div>

    <script>
        const canvas = document.getElementById('dnaCanvas');
        const ctx = canvas.getContext('2d');
        
        // Resize canvas
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth * window.devicePixelRatio;
            canvas.height = canvas.offsetHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // State
        let state = {
            mode: 'structure',
            rotation: 0,
            separation: 0,
            zoom: 1,
            showPurinePyrimidine: false,
            basePairCount: 50,
            sequence: generateSequence(50)
        };

        // Color map
        const colorMap = {
            A: '#2d7a4a',  // Adenine - green
            T: '#ff6b6b',  // Thymine - red
            G: '#ff8c42',  // Guanine - orange
            C: '#9d4edd',  // Cytosine - purple
            U: '#ffed4e'   // Uracil - yellow (for RNA)
        };

        const purinePyrimidineMap = {
            A: '#4da8da',  // Purine - blue
            G: '#4da8da',  // Purine - blue
            T: '#ff8c42',  // Pyrimidine - orange
            C: '#ff8c42'   // Pyrimidine - orange
        };

        function generateSequence(count) {
            const bases = ['A', 'T', 'G', 'C'];
            const seq = [];
            for (let i = 0; i < count; i++) {
                seq.push(bases[Math.floor(Math.random() * bases.length)]);
            }
            return seq;
        }

        function getComplementaryBase(base) {
            const map = { A: 'T', T: 'A', G: 'C', C: 'G' };
            return map[base];
        }

        function calculateStats() {
            const gc = state.sequence.filter(b => b === 'G' || b === 'C').length;
            const gcContent = Math.round((gc / state.basePairCount) * 100);
            const tm = 4 * gc + 2 * (state.basePairCount - gc);
            return { gcContent, tm };
        }

        function drawHelix() {
            const w = canvas.width / window.devicePixelRatio;
            const h = canvas.height / window.devicePixelRatio;
            ctx.fillStyle = '#0a1428';
            ctx.fillRect(0, 0, w, h);

            const centerX = w / 2;
            const centerY = h / 2;
            const radius = 60 * state.zoom;
            const bpSpacing = 8 * state.zoom;
            const rotRad = state.rotation * Math.PI / 180;

            const strand1 = [];
            const strand2 = [];

            // Generate helix positions
            for (let i = 0; i < state.basePairCount; i++) {
                const angle = (i / 10) * Math.PI * 2 + rotRad;
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + i * bpSpacing - (state.basePairCount * bpSpacing) / 2;
                
                const offsetX = state.separation * 30;
                strand1.push({ x: x - offsetX / 2, y, angle, base: state.sequence[i], index: i });
                strand2.push({ x: x + offsetX / 2, y, angle: angle + Math.PI, base: getComplementaryBase(state.sequence[i]), index: i });
            }

            // Draw strand ribbons
            ctx.globalAlpha = 0.3;
            ctx.strokeStyle = '#4da8da';
            ctx.lineWidth = 8;
            ctx.beginPath();
            for (let i = 0; i < strand1.length; i++) {
                const p = strand1[i];
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();

            ctx.strokeStyle = '#00d9ff';
            ctx.beginPath();
            for (let i = 0; i < strand2.length; i++) {
                const p = strand2[i];
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();
            ctx.globalAlpha = 1;

            // Draw base pairs
            for (let i = 0; i < strand1.length; i++) {
                const p1 = strand1[i];
                const p2 = strand2[i];

                // Connection line
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();

                // Base circles
                const color = state.showPurinePyrimidine ? purinePyrimidineMap[p1.base] : colorMap[p1.base];
                
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(p1.x, p1.y, 4 * state.zoom, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = colorMap[getComplementaryBase(p1.base)];
                ctx.beginPath();
                ctx.arc(p2.x, p2.y, 4 * state.zoom, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw polymerase for replication/transcription modes
            if (state.mode === 'replication' || state.mode === 'transcription') {
                const polyPos = strand1[Math.floor(state.basePairCount / 4)];
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(polyPos.x - 20, polyPos.y, 12, 0, Math.PI * 2);
                ctx.fill();
                
                // Direction arrow
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(polyPos.x - 20, polyPos.y + 15);
                ctx.lineTo(polyPos.x - 20, polyPos.y + 25);
                ctx.lineTo(polyPos.x - 15, polyPos.y + 20);
                ctx.stroke();
            }
        }

        function updateStats() {
            const stats = calculateStats();
            document.getElementById('statBPCount').textContent = state.basePairCount;
            document.getElementById('statGCContent').textContent = stats.gcContent + '%';
            document.getElementById('statTm').textContent = stats.tm + '°C';
        }

        // Event listeners
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', e => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                state.mode = e.target.dataset.mode;
                drawHelix();
            });
        });

        document.getElementById('rotationSlider').addEventListener('input', e => {
            state.rotation = parseFloat(e.target.value);
            document.getElementById('rotationValue').textContent = state.rotation;
            drawHelix();
        });

        document.getElementById('separationSlider').addEventListener('input', e => {
            state.separation = parseFloat(e.target.value);
            document.getElementById('separationValue').textContent = state.separation;
            drawHelix();
        });

        document.getElementById('zoomSlider').addEventListener('input', e => {
            state.zoom = parseFloat(e.target.value);
            document.getElementById('zoomValue').textContent = state.zoom.toFixed(1);
            drawHelix();
        });

        document.getElementById('showPurinePyrimidine').addEventListener('change', e => {
            state.showPurinePyrimidine = e.target.checked;
            drawHelix();
        });

        document.getElementById('baseCountSlider').addEventListener('input', e => {
            state.basePairCount = parseInt(e.target.value);
            state.sequence = generateSequence(state.basePairCount);
            document.getElementById('baseCountValue').textContent = state.basePairCount;
            updateStats();
            drawHelix();
        });

        // Initial render
        updateStats();
        drawHelix();
    </script>
</body>
</html>
