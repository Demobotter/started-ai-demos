<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DNA Helix Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Mono', monospace;
      background: linear-gradient(135deg, #0a1428 0%, #1a2a3a 100%);
      color: #7dd3fc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      display: flex;
      gap: 30px;
      max-width: 1400px;
      width: 100%;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(125, 211, 252, 0.2);
      border-radius: 12px;
      padding: 30px;
    }
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .canvas-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: #7dd3fc;
      margin-bottom: 10px;
    }
    .mode-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      padding: 10px 12px;
      border: 1px solid #4da8da;
      background: rgba(77, 168, 218, 0.1);
      color: #7dd3fc;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }
    button:hover {
      background: rgba(77, 168, 218, 0.25);
      border-color: #7dd3fc;
    }
    button.active {
      background: rgba(45, 122, 74, 0.4);
      border-color: #2d9d5f;
      color: #2d9d5f;
    }
    .stat-box {
      background: rgba(10, 20, 40, 0.6);
      border-left: 3px solid #2d7a4a;
      padding: 12px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.5;
    }
    .stat-label {
      color: #7dd3fc;
      font-weight: 600;
    }
    .stat-value {
      color: #2d9d5f;
      font-weight: 700;
    }
    .control-group {
      background: rgba(10, 20, 40, 0.6);
      padding: 12px;
      border-radius: 6px;
      border: 1px solid rgba(77, 168, 218, 0.2);
    }
    .control-label {
      font-size: 12px;
      color: #7dd3fc;
      margin-bottom: 6px;
      font-weight: 600;
    }
    input[type="range"] {
      width: 100%;
      height: 4px;
      background: rgba(77, 168, 218, 0.2);
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      background: #4da8da;
      cursor: pointer;
      border-radius: 50%;
    }
    input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: #4da8da;
      cursor: pointer;
      border-radius: 50%;
      border: none;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    input[type="checkbox"] {
      width: 14px;
      height: 14px;
      cursor: pointer;
      accent-color: #4da8da;
    }
    canvas {
      display: block;
      background: #0a1428;
      border: 1px solid rgba(77, 168, 218, 0.2);
      border-radius: 8px;
      width: 100%;
      max-width: 600px;
    }
    .legend {
      background: rgba(10, 20, 40, 0.6);
      padding: 12px;
      border-radius: 6px;
      font-size: 11px;
      line-height: 1.6;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    @media (max-width: 900px) {
      .container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div>
        <h1>DNA Helix</h1>
      </div>

      <div class="mode-buttons">
        <button class="mode-btn active" data-mode="structure">Structure</button>
        <button class="mode-btn" data-mode="replication">Replication</button>
        <button class="mode-btn" data-mode="transcription">Transcription</button>
      </div>

      <div class="control-group">
        <div class="control-label">Zoom</div>
        <input type="range" id="zoomSlider" min="0.5" max="2" step="0.1" value="1">
        <div style="font-size: 11px; color: #2d9d5f; margin-top: 4px;" id="zoomValue">1.0×</div>
      </div>

      <div class="control-group">
        <div class="control-label">Rotation (Structure)</div>
        <input type="range" id="rotationSlider" min="0" max="360" step="1" value="0">
      </div>

      <div class="control-group" id="replicationControl" style="display: none;">
        <div class="control-label">Separation</div>
        <input type="range" id="separationSlider" min="0" max="1" step="0.02" value="0">
        <div style="font-size: 11px; color: #2d9d5f; margin-top: 4px;" id="separationValue">0%</div>
      </div>

      <div class="control-group">
        <div class="checkbox-group">
          <input type="checkbox" id="purineToggle">
          <label for="purineToggle" style="font-size: 12px;">Purine/Pyrimidine</label>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="sequenceToggle">
          <label for="sequenceToggle" style="font-size: 12px;">Show Sequence</label>
        </div>
      </div>

      <div class="stat-box">
        <div class="stat-label">Base Pairs</div>
        <div class="stat-value" id="bpCount">50</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">GC Content</div>
        <div class="stat-value" id="gcContent">48%</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">Melting Temp</div>
        <div class="stat-value" id="meltingTemp">83°C</div>
      </div>

      <div class="legend">
        <div style="font-weight: 600; color: #7dd3fc; margin-bottom: 8px;">Bases</div>
        <div class="legend-item">
          <div class="legend-color" style="background: #2d7a4a;"></div>
          <span>Adenine (A)</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #ff6b6b;"></div>
          <span>Thymine (T)</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #ff8c42;"></div>
          <span>Guanine (G)</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #9d4edd;"></div>
          <span>Cytosine (C)</span>
        </div>
      </div>
    </div>

    <div class="canvas-area">
      <canvas id="dnaCanvas" width="600" height="600"></canvas>
      <div id="sequenceDisplay" style="display: none; background: rgba(10, 20, 40, 0.6); padding: 12px; border-radius: 6px; font-size: 11px; word-break: break-all; color: #2d9d5f; max-height: 100px; overflow-y: auto; font-family: 'Space Mono', monospace;">
        <div style="color: #7dd3fc; font-weight: 600; margin-bottom: 6px;">5' → 3'</div>
        <div id="strand1Seq"></div>
        <div style="color: #7dd3fc; font-weight: 600; margin-top: 8px; margin-bottom: 6px;">3' → 5'</div>
        <div id="strand2Seq"></div>
      </div>
    </div>
  </div>

  <script>
    // DNA Sequence generation
    const bases = ['A', 'T', 'G', 'C'];
    const complement = { 'A': 'T', 'T': 'A', 'G': 'C', 'C': 'G' };
    const purines = { 'A': true, 'G': true, 'T': false, 'C': false };
    const baseColors = {
      'A': '#2d7a4a', // Green
      'T': '#ff6b6b', // Red
      'G': '#ff8c42', // Orange
      'C': '#9d4edd'  // Purple
    };

    function generateDNASequence(length) {
      let seq = '';
      for (let i = 0; i < length; i++) {
        seq += bases[Math.floor(Math.random() * 4)];
      }
      return seq;
    }

    let strand1 = generateDNASequence(50);
    let strand2 = strand1.split('').map(b => complement[b]).reverse().join('');
    let currentMode = 'structure';
    let animationTime = 0;
    let separation = 0;

    const canvas = document.getElementById('dnaCanvas');
    const ctx = canvas.getContext('2d');

    function calculateStats() {
      let gcCount = (strand1.match(/[GC]/g) || []).length;
      let gcPercent = Math.round((gcCount / strand1.length) * 100);
      let tm = 4 * gcCount + 2 * (strand1.length - gcCount);
      
      document.getElementById('bpCount').textContent = strand1.length;
      document.getElementById('gcContent').textContent = gcPercent + '%';
      document.getElementById('meltingTemp').textContent = tm + '°C';
    }

    function updateSequenceDisplay() {
      const seq1 = strand1.substring(0, 50);
      const seq2 = strand2.substring(0, 50).split('').reverse().join('');
      document.getElementById('strand1Seq').textContent = seq1;
      document.getElementById('strand2Seq').textContent = seq2;
    }

    function drawDNAHelix() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const zoom = parseFloat(document.getElementById('zoomSlider').value);
      const rotation = parseFloat(document.getElementById('rotationSlider').value) * Math.PI / 180;
      const purineMode = document.getElementById('purineToggle').checked;
      const showSequence = document.getElementById('sequenceToggle').checked;

      if (showSequence) {
        document.getElementById('sequenceDisplay').style.display = 'block';
        updateSequenceDisplay();
      } else {
        document.getElementById('sequenceDisplay').style.display = 'none';
      }

      // Helix parameters
      const radius = 60 * zoom;
      const helixPitch = 40 * zoom; // Vertical spacing per turn
      const bpPerTurn = 10;
      const totalBP = strand1.length;

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(rotation);

      // Draw backbone and base pairs
      for (let i = 0; i < totalBP; i++) {
        const angle = (i / bpPerTurn) * Math.PI * 2;
        const y = (i / totalBP) * canvas.height * 0.7 - canvas.height * 0.35;
        
        // Strand 1 point
        const x1 = Math.cos(angle) * radius;
        const y1 = y;

        // Strand 2 point (opposite side)
        const x2 = Math.cos(angle + Math.PI) * radius;
        const y2 = y;

        // Draw base pair connection
        const base1 = strand1[i];
        const base2 = complement[base1];
        
        const color1 = purineMode 
          ? (purines[base1] ? '#4da8da' : '#ff8c42')
          : baseColors[base1];
        const color2 = purineMode 
          ? (purines[base2] ? '#4da8da' : '#ff8c42')
          : baseColors[base2];

        ctx.strokeStyle = 'rgba(77, 168, 218, 0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        // Draw base circles
        ctx.fillStyle = color1;
        ctx.beginPath();
        ctx.arc(x1, y1, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = color2;
        ctx.beginPath();
        ctx.arc(x2, y2, 4, 0, Math.PI * 2);
        ctx.fill();

        // Draw strand backbone
        if (i > 0) {
          const prevAngle = ((i - 1) / bpPerTurn) * Math.PI * 2;
          const prevX1 = Math.cos(prevAngle) * radius;
          const prevY1 = ((i - 1) / totalBP) * canvas.height * 0.7 - canvas.height * 0.35;

          ctx.strokeStyle = '#4da8da';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(prevX1, prevY1);
          ctx.lineTo(x1, y1);
          ctx.stroke();

          ctx.strokeStyle = '#00d9ff';
          ctx.lineWidth = 2;
          const prevX2 = Math.cos(prevAngle + Math.PI) * radius;
          const prevY2 = prevY1;
          ctx.beginPath();
          ctx.moveTo(prevX2, prevY2);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    function drawReplication() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const zoom = parseFloat(document.getElementById('zoomSlider').value);
      const sep = separation;
      const purineMode = document.getElementById('purineToggle').checked;

      const radius = 40 * zoom;
      const bpPerTurn = 10;
      const totalBP = strand1.length;

      // Left template strand
      for (let i = 0; i < totalBP; i++) {
        const angle = (i / bpPerTurn) * Math.PI * 2;
        const y = (i / totalBP) * canvas.height * 0.7 - canvas.height * 0.35;
        
        const x1 = Math.cos(angle) * radius - sep * 80;
        const x2 = Math.cos(angle + Math.PI) * radius - sep * 80;

        const base1 = strand1[i];
        const color1 = purineMode 
          ? (purines[base1] ? '#4da8da' : '#ff8c42')
          : baseColors[base1];

        // Template strand
        ctx.fillStyle = color1;
        ctx.beginPath();
        ctx.arc(x1, y, 4, 0, Math.PI * 2);
        ctx.fill();

        // Newly synthesized strand
        const synColor = purineMode 
          ? (purines[complement[base1]] ? '#4da8da' : '#ff8c42')
          : baseColors[complement[base1]];
        ctx.fillStyle = synColor;
        ctx.globalAlpha = 0.6 + sep * 0.4;
        ctx.beginPath();
        ctx.arc(x2, y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      // Right template strand
      for (let i = 0; i < totalBP; i++) {
        const angle = (i / bpPerTurn) * Math.PI * 2;
        const y = (i / totalBP) * canvas.height * 0.7 - canvas.height * 0.35;
        
        const x2 = Math.cos(angle + Math.PI) * radius + sep * 80;
        const x1 = Math.cos(angle) * radius + sep * 80;

        const base1 = strand1[i];
        const base2 = complement[base1];
        
        const color2 = purineMode 
          ? (purines[base2] ? '#4da8da' : '#ff8c42')
          : baseColors[base2];

        // Template strand
        ctx.fillStyle = color2;
        ctx.beginPath();
        ctx.arc(x2, y, 4, 0, Math.PI * 2);
        ctx.fill();

        // Newly synthesized
        const synColor = purineMode 
          ? (purines[base1] ? '#4da8da' : '#ff8c42')
          : baseColors[base1];
        ctx.fillStyle = synColor;
        ctx.globalAlpha = 0.6 + sep * 0.4;
        ctx.beginPath();
        ctx.arc(x1, y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        // Draw polymerase indicator
        if (i === Math.floor(totalBP * sep)) {
          ctx.fillStyle = '#ffd700';
          ctx.beginPath();
          ctx.arc(x1, y - 20, 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#ffd700';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x1, y - 20);
          ctx.lineTo(x1, y - 12);
          ctx.stroke();
        }
      }
    }

    function drawTranscription() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const zoom = parseFloat(document.getElementById('zoomSlider').value);
      const purineMode = document.getElementById('purineToggle').checked;

      const radius = 40 * zoom;
      const bpPerTurn = 10;
      const totalBP = Math.min(strand1.length, 40);

      // Template DNA strand
      for (let i = 0; i < totalBP; i++) {
        const angle = (i / bpPerTurn) * Math.PI * 2;
        const y = (i / totalBP) * canvas.height * 0.7 - canvas.height * 0.35;
        
        const x1 = Math.cos(angle) * radius - 100;
        const base1 = strand1[i];
        const color1 = purineMode 
          ? (purines[base1] ? '#4da8da' : '#ff8c42')
          : baseColors[base1];

        ctx.fillStyle = color1;
        ctx.beginPath();
        ctx.arc(x1, y, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      // mRNA strand being synthesized (right side)
      const mRNALength = Math.floor((animationTime % 100) / 100 * totalBP);
      for (let i = 0; i < mRNALength; i++) {
        const angle = (i / bpPerTurn) * Math.PI * 2;
        const y = (i / totalBP) * canvas.height * 0.7 - canvas.height * 0.35;
        
        const x1 = Math.cos(angle) * radius + 100;
        const base1 = strand1[i];
        const mRNABase = complement[base1] === 'T' ? 'U' : complement[base1];
        
        let mRNAColor = baseColors[complement[base1]];
        if (mRNABase === 'U') mRNAColor = '#ffaa00';

        ctx.fillStyle = mRNAColor;
        ctx.beginPath();
        ctx.arc(x1, y, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      // RNA Polymerase
      const polyPos = mRNALength / totalBP;
      const polyY = polyPos * canvas.height * 0.7 - canvas.height * 0.35;
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(100, polyY, 10, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      calculateStats();

      if (currentMode === 'structure') {
        drawDNAHelix();
      } else if (currentMode === 'replication') {
        drawReplication();
      } else if (currentMode === 'transcription') {
        drawTranscription();
      }

      animationTime += 1;
    }

    // Event listeners
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentMode = e.target.dataset.mode;
        
        if (currentMode === 'replication') {
          document.getElementById('replicationControl').style.display = 'block';
        } else {
          document.getElementById('replicationControl').style.display = 'none';
        }

        separation = 0;
        document.getElementById('separationSlider').value = 0;
      });
    });

    document.getElementById('zoomSlider').addEventListener('input', (e) => {
      document.getElementById('zoomValue').textContent = e.target.value + '×';
    });

    document.getElementById('separationSlider').addEventListener('input', (e) => {
      separation = parseFloat(e.target.value);
      document.getElementById('separationValue').textContent = Math.round(separation * 100) + '%';
    });

    // Animation loop
    setInterval(draw, 30);
    draw();
  </script>
</body>
</html>
