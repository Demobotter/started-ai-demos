<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birdsong Spectrogram Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #0a1428 0%, #1a2344 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        .main {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 900px) {
            .main {
                grid-template-columns: 1fr;
            }
        }
        .spectrogram-section {
            background: rgba(10, 20, 40, 0.8);
            border: 1px solid #2a4a8a;
            border-radius: 8px;
            padding: 20px;
        }
        .controls {
            background: rgba(10, 20, 40, 0.8);
            border: 1px solid #2a4a8a;
            border-radius: 8px;
            padding: 20px;
            height: fit-content;
        }
        .species-selector {
            margin-bottom: 20px;
        }
        .species-selector label {
            display: block;
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 8px;
        }
        .species-selector select {
            width: 100%;
            padding: 10px;
            background: #1a2a4a;
            color: #fff;
            border: 1px solid #2a4a8a;
            border-radius: 4px;
            font-family: 'Space Mono', monospace;
        }
        .player {
            margin-bottom: 20px;
        }
        .player label {
            display: block;
            font-size: 0.85em;
            color: #aaa;
            margin-bottom: 8px;
        }
        .controls-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        button {
            flex: 1;
            padding: 10px;
            background: #2a5a9a;
            color: #fff;
            border: 1px solid #4a7aca;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            font-size: 0.85em;
            transition: background 0.2s;
        }
        button:hover {
            background: #3a6aaa;
        }
        button:active {
            background: #1a4a8a;
        }
        .timeline {
            width: 100%;
            height: 30px;
            background: #1a2a4a;
            border: 1px solid #2a4a8a;
            border-radius: 4px;
            margin-bottom: 10px;
            position: relative;
            cursor: pointer;
        }
        .timeline-fill {
            height: 100%;
            background: linear-gradient(90deg, #4da8da 0%, #00ff88 100%);
            width: 0%;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 5px;
            font-size: 0.7em;
        }
        .stats {
            margin-top: 20px;
        }
        .stat-label {
            font-size: 0.75em;
            color: #888;
            margin-top: 12px;
            text-transform: uppercase;
        }
        .stat-value {
            font-size: 1.2em;
            color: #4da8da;
            margin-top: 4px;
            font-weight: bold;
        }
        canvas {
            width: 100%;
            border: 1px solid #2a4a8a;
            border-radius: 4px;
            background: #050f1f;
            display: block;
            margin-bottom: 15px;
        }
        .canvas-label {
            font-size: 0.75em;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        audio {
            width: 100%;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

        <p class="subtitle">Explore the hidden acoustic structure of bird vocalizations</p>

        <div class="main">

                <div class="canvas-label">Frequency Spectrogram (Hz vs Time)</div>
                <canvas id="spectrogram" width="800" height="250"></canvas>

                <div class="canvas-label">Waveform & Playback</div>
                <canvas id="waveform" width="800" height="80"></canvas>
                <audio id="audioPlayer" controls></audio>

                <div class="timeline">
                    <div class="timeline-fill" id="timelineFill"></div>
                </div>
                <div style="font-size: 0.75em; color: #888; text-align: center;">
                    <span id="timeLabel">0:00</span> / <span id="durationLabel">0:00</span>
                </div>
            </div>

            <div class="controls">
                <div class="species-selector">
                    <label>Species</label>
                    <select id="speciesSelect">
                        <option value="carolina_wren">Carolina Wren</option>

                    <div class="controls-row">
                        <button id="playBtn">▶ Play</button>
                        <button id="pauseBtn">⏸ Pause</button>
                    </div>
                </div>

                <div class="stats">
                    <div class="stat-label">Frequency Range</div>
                    <div class="stat-value" id="freqRange">0–0 kHz</div>

                    <div class="stat-label">Peak Frequency</div>
                    <div class="stat-value" id="peakFreq">0 Hz</div>

            document.getElementById('durationLabel').textContent = bird.duration.toFixed(1) + 's';

            drawSpectrogram();
            drawWaveform();
            
            // Simulate audio with synthetic tone

        function drawSpectrogram() {
            const bird = birds[currentSpecies];
            const specData = bird.specData;
            const width = spectrogram.width;
            const height = spectrogram.height;
            
            ctx.fillStyle = '#050f1f';
            ctx.fillRect(0, 0, width, height);

            // Draw frequency axis label
            ctx.fillStyle = '#888';
            ctx.font = '12px Space Mono';
            ctx.textAlign = 'right';
            for (let i = 0; i <= 8; i++) {
                const y = (i / 8) * height;
                ctx.fillText((8 - i) + ' kHz', width - 5, y + 4);
            }

            // Draw spectrogram heatmap
            const timeSteps = specData[0].length;
            const freqBins = specData.length;
            const pixelsPerTime = width / timeSteps;
            const pixelsPerFreq = height / freqBins;

            for (let f = 0; f < freqBins; f++) {
                for (let t = 0; t < timeSteps; t++) {
                    const intensity = specData[f][t];
                    let color;
                    if (intensity < 0.3) {
                        color = `rgb(${Math.floor(intensity * 150)}, ${Math.floor(intensity * 200)}, ${Math.floor(255)})`;
                    } else if (intensity < 0.6) {
                        color = `rgb(${Math.floor(100 + intensity * 100)}, ${Math.floor(150)}, ${Math.floor(200)})`;
                    } else {
                        color = `rgb(${Math.floor(200)}, ${Math.floor(intensity * 255)}, ${Math.floor(100)})`;
                    }
                    ctx.fillStyle = color;
                    ctx.fillRect(t * pixelsPerTime, (freqBins - f - 1) * pixelsPerFreq, pixelsPerTime + 1, pixelsPerFreq + 1);
                }
            }

            // Draw time axis
            ctx.fillStyle = '#888';
            ctx.textAlign = 'center';
            for (let i = 0; i <= timeSteps; i += Math.ceil(timeSteps / 5)) {
                const x = (i / timeSteps) * width;
                ctx.fillText((i / timeSteps * bird.duration).toFixed(1) + 's', x, height + 15);
            }
        }

        function drawWaveform() {
            const bird = birds[currentSpecies];
            const width = waveform.width;
            const height = waveform.height;
            const centerY = height / 2;

            waveCtx.fillStyle = '#050f1f';
            waveCtx.fillRect(0, 0, width, height);

            // Draw center line
            waveCtx.strokeStyle = '#2a4a8a';
            waveCtx.beginPath();
            waveCtx.moveTo(0, centerY);
            waveCtx.lineTo(width, centerY);
            waveCtx.stroke();

            // Draw synthetic waveform
            waveCtx.strokeStyle = '#4da8da';
            waveCtx.lineWidth = 2;
            waveCtx.beginPath();
            const freq = bird.peakFreq;
            const samples = width;
            for (let i = 0; i < samples; i++) {
                const t = (i / samples) * bird.duration;
                let envelope = 1;
                if (t < 0.1) envelope = t / 0.1;
                else if (t > bird.duration - 0.2) envelope = (bird.duration - t) / 0.2;
                
                const y = centerY + Math.sin(2 * Math.PI * freq * t / 1000) * (height / 2 - 10) * envelope;
                if (i === 0) waveCtx.moveTo(i, y);
                else waveCtx.lineTo(i, y);
            }
            waveCtx.stroke();
        }

        function generateAndPlayAudio(bird) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const sampleRate = audioContext.sampleRate;
            const duration = bird.duration;
            const audioBuffer = audioContext.createBuffer(1, sampleRate * duration, sampleRate);
            const data = audioBuffer.getChannelData(0);

            for (let i = 0; i < data.length; i++) {
                const t = i / sampleRate;
                const freq = bird.peakFreq + Math.sin(2 * Math.PI * t / duration) * 200;
                
                let env = 1;
                if (t < 0.1) env = t / 0.1;
                else if (t > duration - 0.2) env = (duration - t) / 0.2;

                let sample = Math.sin(2 * Math.PI * freq * t);
                sample += 0.3 * Math.sin(2 * Math.PI * freq * 2 * t);
                sample += 0.15 * Math.sin(2 * Math.PI * freq * 0.5 * t);

                data[i] = sample * 0.3 * env;
            }

            const blob = audioBufferToWav(audioBuffer);
            const url = URL.createObjectURL(blob);
            audioPlayer.src = url;
        }

        function audioBufferToWav(audioBuffer) {
            const length = audioBuffer.length * audioBuffer.numberOfChannels * 2 + 44;
            const arrayBuffer = new ArrayBuffer(length);
            const view = new Uint8Array(arrayBuffer);
            const channels = [];
            for (let i = 0; i < audioBuffer.numberOfChannels; i++) {
                channels.push(audioBuffer.getChannelData(i));
            }

            let offset = 0;
            const setUint16 = (data) => {
                view[offset] = data & 0xff;
                view[offset + 1] = (data / 256) >>> 0;
                offset += 2;
            };
            const setUint32 = (data) => {
                setUint16(data & 0xffff);
                setUint16((data / 65536) >>> 0);
            };

            const setString = (string) => {
                for (let i = 0; i < string.length; i++) {
                    view[offset] = string.charCodeAt(i);
                    offset++;
                }
            };
            setString('RIFF');
            setUint32(length - 8);
            setString('WAVE');
            setString('fmt ');
            setUint32(16);
            setUint16(1);
            setUint16(audioBuffer.numberOfChannels);
            setUint32(audioBuffer.sampleRate);
            setUint32(audioBuffer.sampleRate * 2 * audioBuffer.numberOfChannels);
            setUint16(audioBuffer.numberOfChannels * 2);
            setUint16(16);
            setString('data');
            setUint32(length - offset - 4);

            for (let i = 0; i < audioBuffer.length; i++) {
                for (let channel = 0; channel < audioBuffer.numberOfChannels; channel++) {
                    let sample = Math.max(-1, Math.min(1, channels[channel][i]));
                    sample = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
                    setUint16(sample);
                }
            }

            return new Blob([arrayBuffer], { type: 'audio/wav' });
        }

        // Event listeners
        speciesSelect.addEventListener('change', (e) => {
            updateSpecies(e.target.value);
        });

        playBtn.addEventListener('click', () => {
            audioPlayer.play();
            isPlaying = true;
        });

        pauseBtn.addEventListener('click', () => {
            audioPlayer.pause();
            isPlaying = false;
        });

        audioPlayer.addEventListener('timeupdate', () => {
            const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            timelineFill.style.width = percent + '%';
            timeLabel.textContent = formatTime(audioPlayer.currentTime);
        });

        audioPlayer.addEventListener('ended', () => {
            isPlaying = false;
        });

        document.querySelector('.timeline').addEventListener('click', (e) => {
            const rect = document.querySelector('.timeline').getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audioPlayer.currentTime = percent * audioPlayer.duration;
        });

        function formatTime(seconds) {
            if (!seconds) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Initialize
        updateSpecies('carolina_wren');
    </script>
</body>
</html>
