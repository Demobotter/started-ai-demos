<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow Compass</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #f0f0f0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .container {
      max-width: 500px;
      width: 100%;
      background: #0f3460;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    
    h1 {
      font-family: 'Merriweather', serif;
      font-size: 28px;
      margin-bottom: 8px;
      text-align: center;
      color: #ffd700;
    }
    
    .subtitle {
      text-align: center;
      font-size: 12px;
      color: #a0a0a0;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .input-section {
      margin-bottom: 28px;
      display: flex;
      gap: 8px;
    }
    
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: #1a4d6d;
      color: #f0f0f0;
      font-size: 14px;
    }
    
    input[type="text"]::placeholder {
      color: #707070;
    }
    
    button {
      padding: 10px 20px;
      background: #ffd700;
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    
    button:hover {
      background: #ffed4e;
    }
    
    button:active {
      transform: scale(0.98);
    }
    
    .canvas-wrapper {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
      justify-content: center;
      align-items: flex-end;
    }
    
    canvas {
      border-radius: 8px;
      background: #1a4d6d;
    }
    
    .elevation-gauge {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    
    .gauge-track {
      width: 40px;
      height: 180px;
      background: #1a4d6d;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      border: 2px solid #3a7d9e;
    }
    
    .gauge-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, #ffd700, #ffaa00);
      height: 0%;
      transition: height 0.3s ease;
      border-radius: 20px;
    }
    
    .gauge-label {
      font-size: 11px;
      color: #a0a0a0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 8px;
    }
    
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    
    .info-card {
      background: #1a4d6d;
      padding: 12px;
      border-radius: 8px;
      border-left: 3px solid #ffd700;
    }
    
    .info-card-label {
      font-size: 11px;
      color: #a0a0a0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    
    .info-card-value {
      font-size: 18px;
      font-weight: 700;
      color: #ffd700;
      font-family: 'Merriweather', serif;
    }
    
    .next-event {
      background: #1a4d6d;
      padding: 12px;
      border-radius: 8px;
      border-left: 3px solid #ffaa00;
      font-size: 13px;
      color: #d0d0d0;
    }
    
    .next-event-label {
      font-size: 11px;
      color: #a0a0a0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    
    .next-event-time {
      font-weight: 600;
      color: #ffaa00;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
      color: #a0a0a0;
      font-size: 14px;
    }
    
    .error {
      background: #6d1a1a;
      color: #ffaaaa;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
      border-left: 3px solid #ff6666;
    }
    
    .direction-label {
      font-size: 11px;
      color: #a0a0a0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 8px;
      text-align: center;
    }
    
    .time-slider-section {
      margin-bottom: 20px;
    }
    
    .time-slider-label {
      font-size: 11px;
      color: #a0a0a0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: block;
    }
    
    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #1a4d6d;
      outline: none;
      -webkit-appearance: none;
    }
    
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffd700;
      cursor: pointer;
    }
    
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffd700;
      cursor: pointer;
      border: none;
    }
    
    .time-display {
      text-align: center;
      font-size: 12px;
      color: #ffd700;
      margin-top: 8px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>☀️ Shadow Compass</h1>
    <div class="subtitle">Real-Time Solar Direction</div>
    
    <div class="input-section">
      <input type="text" id="cityInput" placeholder="Enter city name..." value="Sydney">
      <button onclick="searchCity()">Search</button>
    </div>
    
    <div id="errorMsg"></div>
    
    <div id="loading" class="loading">Loading sun data...</div>
    
    <div id="content" style="display: none;">
      <div class="canvas-wrapper">
        <canvas id="compassCanvas" width="220" height="220"></canvas>
        <div class="elevation-gauge">
          <div class="gauge-track">
            <div id="gaugeFill" class="gauge-fill"></div>
          </div>
          <span id="elevationValue" style="font-weight: 700; color: #ffd700;">0°</span>
          <div class="gauge-label">Elevation</div>
        </div>
      </div>
      
      <div class="time-slider-section">
        <label class="time-slider-label">Advance Time (24h slider)</label>
        <input type="range" id="timeSlider" min="0" max="1440" value="0">
        <div class="time-display" id="timeDisplay">Now</div>
      </div>
      
      <div class="info-grid">
        <div class="info-card">
          <div class="info-card-label">Shadow Direction</div>
          <div class="info-card-value" id="azimuthValue">—</div>
        </div>
        <div class="info-card">
          <div class="info-card-label">Sun Elevation</div>
          <div class="info-card-value" id="elevationCard">—</div>
        </div>
      </div>
      
      <div class="next-event">
        <div class="next-event-label">Next Event</div>
        <div class="next-event-time" id="nextEvent">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    let currentCity = null;
    let currentLat = null;
    let currentLng = null;
    let solarData = null;
    
    // Geocode a city → lat/lng (free, uses Open-Meteo)
    async function geocodeCity(city) {
      try {
        const resp = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
        const data = await resp.json();
        if (!data.results || data.results.length === 0) {
          throw new Error('City not found');
        }
        const result = data.results[0];
        return { lat: result.latitude, lng: result.longitude, name: result.name, country: result.country };
      } catch (e) {
        throw new Error(`Geocoding failed: ${e.message}`);
      }
    }
    
    // Fetch solar data for a location + date (Open-Meteo Solar API, free, no key)
    async function fetchSolarData(lat, lng, date) {
      try {
        const dateStr = date.toISOString().split('T')[0];
        const resp = await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lng}&start_date=${dateStr}&end_date=${dateStr}&hourly=direct_normal_irradiance&daily=sunrise,sunset,sunshine_duration&timezone=auto`);
        const data = await resp.json();
        return data;
      } catch (e) {
        throw new Error(`Solar data fetch failed: ${e.message}`);
      }
    }
    
    // Calculate sun position (azimuth + elevation) using simplified solar position algorithm
    function calculateSunPosition(lat, lng, date) {
      const JD = getJulianDate(date);
      const T = (JD - 2451545.0) / 36525.0;
      
      // Mean solar time
      const B = 360 * (JD - Math.floor(JD + 0.5) - 0.0009) / 365.2425;
      const EOT = 229.18 * (0.000075 + 0.001868 * Math.cos(toRad(B)) - 0.032077 * Math.sin(toRad(B)) 
                             - 0.014615 * Math.cos(toRad(2 * B)) - 0.040849 * Math.sin(toRad(2 * B)));
      
      // Solar declination (simplified)
      const decl = 23.44 * Math.sin(toRad(360 * (JD - 81) / 365.25));
      
      // Hour angle
      const offset = lng / 15; // longitude in hours
      const lstHours = (date.getUTCHours() + date.getUTCMinutes()/60 + offset + 12);
      const lstRad = toRad((lstHours % 24) * 15);
      
      const latRad = toRad(lat);
      const declRad = toRad(decl);
      
      // Altitude (elevation)
      const altitudeRad = Math.asin(
        Math.sin(declRad) * Math.sin(latRad) + 
        Math.cos(declRad) * Math.cos(latRad) * Math.cos(lstRad)
      );
      const altitude = toDeg(altitudeRad);
      
      // Azimuth (from north, 0° = N, 90° = E, 180° = S, 270° = W)
      const numerator = -Math.sin(lstRad);
      const denominator = Math.tan(declRad) * Math.cos(latRad) - Math.sin(latRad) * Math.cos(lstRad);
      let azimuth = toDeg(Math.atan2(numerator, denominator));
      azimuth = (azimuth + 360) % 360;
      
      // Shadow direction is opposite sun direction
      let shadowAzimuth = (azimuth + 180) % 360;
      
      return { altitude, azimuth, shadowAzimuth };
    }
    
    function getJulianDate(date) {
      const y = date.getUTCFullYear();
      const m = date.getUTCMonth() + 1;
      const d = date.getUTCDate() + date.getUTCHours() / 24 + date.getUTCMinutes() / 1440;
      const A = Math.floor(y / 100);
      const B = 2 - A + Math.floor(A / 4);
      return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
    }
    
    function toRad(deg) { return deg * Math.PI / 180; }
    function toDeg(rad) { return rad * 180 / Math.PI; }
    
    // Draw compass
    function drawCompass(shadowAzimuth) {
      const canvas = document.getElementById('compassCanvas');
      const ctx = canvas.getContext('2d');
      const center = canvas.width / 2;
      const radius = 90;
      
      // Clear
      ctx.fillStyle = '#1a4d6d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Outer circle
      ctx.strokeStyle = '#3a7d9e';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(center, center, radius, 0, Math.PI * 2);
      ctx.stroke();
      
      // Degree markers
      ctx.strokeStyle = '#3a7d9e';
      ctx.fillStyle = '#a0a0a0';
      ctx.font = 'bold 11px Poppins';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      for (let deg = 0; deg < 360; deg += 30) {
        const angle = toRad(deg - 90);
        const x1 = center + (radius - 12) * Math.cos(angle);
        const y1 = center + (radius - 12) * Math.sin(angle);
        const x2 = center + radius * Math.cos(angle);
        const y2 = center + radius * Math.sin(angle);
        
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        
        const tx = center + (radius - 25) * Math.cos(angle);
        const ty = center + (radius - 25) * Math.sin(angle);
        const label = ['N', 'NW', 'W', 'SW', 'S', 'SE', 'E', 'NE'][Math.round(deg / 45) % 8];
        ctx.fillText(label, tx, ty);
      }
      
      // Cardinal direction highlights
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 14px Poppins';
      for (let [deg, label] of [[0, 'N'], [90, 'E'], [180, 'S'], [270, 'W']]) {
        const angle = toRad(deg - 90);
        const x = center + (radius - 20) * Math.cos(angle);
        const y = center + (radius - 20) * Math.sin(angle);
        ctx.fillText(label, x, y);
      }
      
      // Shadow direction needle
      const needleAngle = toRad(shadowAzimuth - 90);
      const needleLen = 65;
      const nX = center + needleLen * Math.cos(needleAngle);
      const nY = center + needleLen * Math.sin(needleAngle);
      
      ctx.strokeStyle = '#ffaa00';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(center, center);
      ctx.lineTo(nX, nY);
      ctx.stroke();
      
      // Center dot
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(center, center, 6, 0, Math.PI * 2);
      ctx.fill();
    }
    
    function updateDisplay() {
      const timeOffset = parseInt(document.getElementById('timeSlider').value);
      const displayDate = new Date();
      displayDate.setMinutes(displayDate.getMinutes() + timeOffset);
      
      const pos = calculateSunPosition(currentLat, currentLng, displayDate);
      
      // Draw compass
      drawCompass(pos.shadowAzimuth);
      
      // Update elevation gauge
      const elevPercent = Math.max(0, Math.min(100, (pos.altitude + 90) / 180 * 100));
      document.getElementById('gaugeFill').style.height = elevPercent + '%';
      document.getElementById('elevationValue').textContent = pos.altitude.toFixed(1) + '°';
      
      // Info cards
      document.getElementById('azimuthValue').textContent = pos.shadowAzimuth.toFixed(0) + '°';
      document.getElementById('elevationCard').textContent = pos.altitude.toFixed(1) + '°';
      
      // Time display
      const hours = Math.floor(timeOffset / 60);
      const minutes = timeOffset % 60;
      let timeStr = 'Now';
      if (timeOffset > 0) {
        timeStr = `+${hours}h ${minutes}m`;
      } else if (timeOffset < 0) {
        timeStr = `${hours}h ${minutes}m ago`;
      }
      document.getElementById('timeDisplay').textContent = timeStr;
      
      // Next event
      updateNextEvent(displayDate);
    }
    
    function updateNextEvent(displayDate) {
      const pos = calculateSunPosition(currentLat, currentLng, displayDate);
      
      let eventText = '';
      if (pos.altitude < -0.5) {
        // Sun below horizon, next is sunrise
        let sunrise = new Date(displayDate);
        sunrise.setDate(sunrise.getDate());
        let found = false;
        for (let h = 0; h < 24 && !found; h++) {
          sunrise.setHours(h);
          for (let m = 0; m < 60; m += 5) {
            sunrise.setMinutes(m);
            const p = calculateSunPosition(currentLat, currentLng, sunrise);
            if (p.altitude > 0) {
              found = true;
              break;
            }
          }
        }
        eventText = 'Sunrise at ' + sunrise.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      } else {
        // Sun above horizon, next is sunset
        let sunset = new Date(displayDate);
        let found = false;
        for (let h = displayDate.getHours(); h < 24 && !found; h++) {
          sunset.setHours(h);
          for (let m = 59; m >= 0; m -= 5) {
            sunset.setMinutes(m);
            const p = calculateSunPosition(currentLat, currentLng, sunset);
            if (p.altitude < 0) {
              found = true;
              break;
            }
          }
        }
        eventText = 'Sunset at ' + sunset.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      }
      
      document.getElementById('nextEvent').innerHTML = eventText;
    }
    
    async function searchCity() {
      const city = document.getElementById('cityInput').value.trim();
      if (!city) return;
      
      document.getElementById('errorMsg').innerHTML = '';
      document.getElementById('loading').style.display = 'block';
      document.getElementById('content').style.display = 'none';
      
      try {
        const geo = await geocodeCity(city);
        currentCity = geo.name;
        currentLat = geo.lat;
        currentLng = geo.lng;
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        
        document.getElementById('timeSlider').value = 0;
        updateDisplay();
      } catch (e) {
        document.getElementById('errorMsg').innerHTML = `<div class="error">${e.message}</div>`;
        document.getElementById('loading').style.display = 'none';
      }
    }
    
    document.getElementById('timeSlider').addEventListener('input', updateDisplay);
    document.getElementById('cityInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchCity();
    });
    
    // Load on init
    window.addEventListener('load', () => {
      searchCity();
    });
  </script>
</body>
</html>
