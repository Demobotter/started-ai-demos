<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soundscape Creator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #e0e0e0;
    }
    
    .container {
      max-width: 600px;
      width: 100%;
      background: rgba(20, 25, 45, 0.8);
      border-radius: 16px;
      padding: 40px;
      border: 1px solid rgba(100, 150, 255, 0.2);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    
    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 2.2em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #6f9fff 0%, #a0d0ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .subtitle {
      font-size: 0.9em;
      color: #888;
      margin-bottom: 30px;
    }
    
    .layer-group {
      margin-bottom: 32px;
    }
    
    .layer-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .layer-emoji {
      font-size: 1.8em;
    }
    
    .layer-name {
      font-weight: 600;
      font-size: 1.1em;
      color: #e0e0e0;
    }
    
    .controls {
      display: grid;
      gap: 12px;
    }
    
    .control-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .control-label {
      width: 70px;
      font-size: 0.85em;
      color: #999;
      font-weight: 500;
    }
    
    input[type="range"] {
      flex: 1;
      height: 5px;
      border-radius: 5px;
      background: linear-gradient(to right, rgba(100, 150, 255, 0.3), rgba(100, 150, 255, 0.6));
      outline: none;
      -webkit-appearance: none;
    }
    
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6f9fff, #a0d0ff);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(111, 159, 255, 0.4);
      transition: box-shadow 0.2s;
    }
    
    input[type="range"]::-webkit-slider-thumb:hover {
      box-shadow: 0 2px 12px rgba(111, 159, 255, 0.6);
    }
    
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6f9fff, #a0d0ff);
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 8px rgba(111, 159, 255, 0.4);
      transition: box-shadow 0.2s;
    }
    
    input[type="range"]::-moz-range-thumb:hover {
      box-shadow: 0 2px 12px rgba(111, 159, 255, 0.6);
    }
    
    .control-value {
      width: 40px;
      text-align: right;
      font-weight: 500;
      color: #a0d0ff;
      font-size: 0.9em;
    }
    
    .playback-controls {
      display: flex;
      gap: 12px;
      margin-top: 40px;
    }
    
    button {
      flex: 1;
      padding: 14px 24px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .btn-play {
      background: linear-gradient(135deg, #6f9fff, #5080ff);
      color: white;
      box-shadow: 0 4px 12px rgba(111, 159, 255, 0.4);
    }
    
    .btn-play:hover:not(:disabled) {
      box-shadow: 0 6px 16px rgba(111, 159, 255, 0.6);
      transform: translateY(-2px);
    }
    
    .btn-play:disabled {
      background: linear-gradient(135deg, #4a6088, #3a5078);
      cursor: not-allowed;
      opacity: 0.7;
    }
    
    .btn-stop {
      background: rgba(200, 100, 100, 0.3);
      color: #ff9999;
      border: 1px solid rgba(200, 100, 100, 0.5);
    }
    
    .btn-stop:hover:not(:disabled) {
      background: rgba(200, 100, 100, 0.5);
      box-shadow: 0 4px 12px rgba(200, 100, 100, 0.3);
    }
    
    .btn-stop:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .status {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9em;
      color: #888;
    }
    
    .status.playing {
      color: #6f9fff;
      font-weight: 600;
    }
    
    @media (max-width: 600px) {
      .container {
        padding: 24px;
      }
      
      h1 {
        font-size: 1.8em;
      }
      
      .control-row {
        flex-direction: column;
        gap: 8px;
      }
      
      .control-label {
        width: auto;
      }
      
      .control-value {
        width: auto;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎧 Soundscape</h1>
    <div class="subtitle">Mix layers of ambient sound</div>
    
    <!-- Rain Layer -->
    <div class="layer-group">
      <div class="layer-header">
        <span class="layer-emoji">🌧️</span>
        <span class="layer-name">Rain</span>
      </div>
      <div class="controls">
        <div class="control-row">
          <label class="control-label">Volume</label>
          <input type="range" id="rainVolume" min="0" max="100" value="40" class="layer-slider">
          <span class="control-value" id="rainVolumeValue">40%</span>
        </div>
        <div class="control-row">
          <label class="control-label">Pan</label>
          <input type="range" id="rainPan" min="-100" max="100" value="0" class="layer-slider">
          <span class="control-value" id="rainPanValue">C</span>
        </div>
        <div class="control-row">
          <label class="control-label">Rate</label>
          <input type="range" id="rainRate" min="0.5" max="2" value="1" step="0.1" class="layer-slider">
          <span class="control-value" id="rainRateValue">1.0x</span>
        </div>
      </div>
    </div>
    
    <!-- Wind Layer -->
    <div class="layer-group">
      <div class="layer-header">
        <span class="layer-emoji">💨</span>
        <span class="layer-name">Wind</span>
      </div>
      <div class="controls">
        <div class="control-row">
          <label class="control-label">Volume</label>
          <input type="range" id="windVolume" min="0" max="100" value="30" class="layer-slider">
          <span class="control-value" id="windVolumeValue">30%</span>
        </div>
        <div class="control-row">
          <label class="control-label">Pan</label>
          <input type="range" id="windPan" min="-100" max="100" value="0" class="layer-slider">
          <span class="control-value" id="windPanValue">C</span>
        </div>
        <div class="control-row">
          <label class="control-label">Rate</label>
          <input type="range" id="windRate" min="0.5" max="2" value="1" step="0.1" class="layer-slider">
          <span class="control-value" id="windRateValue">1.0x</span>
        </div>
      </div>
    </div>
    
    <!-- Forest Layer -->
    <div class="layer-group">
      <div class="layer-header">
        <span class="layer-emoji">🌲</span>
        <span class="layer-name">Forest</span>
      </div>
      <div class="controls">
        <div class="control-row">
          <label class="control-label">Volume</label>
          <input type="range" id="forestVolume" min="0" max="100" value="25" class="layer-slider">
          <span class="control-value" id="forestVolumeValue">25%</span>
        </div>
        <div class="control-row">
          <label class="control-label">Pan</label>
          <input type="range" id="forestPan" min="-100" max="100" value="0" class="layer-slider">
          <span class="control-value" id="forestPanValue">C</span>
        </div>
        <div class="control-row">
          <label class="control-label">Rate</label>
          <input type="range" id="forestRate" min="0.5" max="2" value="1" step="0.1" class="layer-slider">
          <span class="control-value" id="forestRateValue">1.0x</span>
        </div>
      </div>
    </div>
    
    <!-- Ocean Layer -->
    <div class="layer-group">
      <div class="layer-header">
        <span class="layer-emoji">🌊</span>
        <span class="layer-name">Ocean</span>
      </div>
      <div class="controls">
        <div class="control-row">
          <label class="control-label">Volume</label>
          <input type="range" id="oceanVolume" min="0" max="100" value="35" class="layer-slider">
          <span class="control-value" id="oceanVolumeValue">35%</span>
        </div>
        <div class="control-row">
          <label class="control-label">Pan</label>
          <input type="range" id="oceanPan" min="-100" max="100" value="0" class="layer-slider">
          <span class="control-value" id="oceanPanValue">C</span>
        </div>
        <div class="control-row">
          <label class="control-label">Rate</label>
          <input type="range" id="oceanRate" min="0.5" max="2" value="1" step="0.1" class="layer-slider">
          <span class="control-value" id="oceanRateValue">1.0x</span>
        </div>
      </div>
    </div>
    
    <!-- Fire Layer -->
    <div class="layer-group">
      <div class="layer-header">
        <span class="layer-emoji">🔥</span>
        <span class="layer-name">Fire</span>
      </div>
      <div class="controls">
        <div class="control-row">
          <label class="control-label">Volume</label>
          <input type="range" id="fireVolume" min="0" max="100" value="20" class="layer-slider">
          <span class="control-value" id="fireVolumeValue">20%</span>
        </div>
        <div class="control-row">
          <label class="control-label">Pan</label>
          <input type="range" id="firePan" min="-100" max="100" value="0" class="layer-slider">
          <span class="control-value" id="firePanValue">C</span>
        </div>
        <div class="control-row">
          <label class="control-label">Rate</label>
          <input type="range" id="fireRate" min="0.5" max="2" value="1" step="0.1" class="layer-slider">
          <span class="control-value" id="fireRateValue">1.0x</span>
        </div>
      </div>
    </div>
    
    <div class="playback-controls">
      <button class="btn-play" id="playBtn">Play</button>
      <button class="btn-stop" id="stopBtn" disabled>Stop</button>
    </div>
    
    <div class="status" id="status">Ready to mix</div>
  </div>

  <script>
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    let isPlaying = false;
    const layers = {};
    const oscillators = {};
    const gains = {};
    const panners = {};
    
    // Layer definitions
    const layerDefs = {
      rain: { emoji: '🌧️', baseFreq: 120, type: 'sawtooth', id: 'rain' },
      wind: { emoji: '💨', baseFreq: 85, type: 'sine', id: 'wind' },
      forest: { emoji: '🌲', baseFreq: 150, type: 'triangle', id: 'forest' },
      ocean: { emoji: '🌊', baseFreq: 55, type: 'sine', id: 'ocean' },
      fire: { emoji: '🔥', baseFreq: 200, type: 'sawtooth', id: 'fire' }
    };
    
    // Initialize all UI sliders
    document.querySelectorAll('.layer-slider').forEach(slider => {
      slider.addEventListener('input', updateDisplay);
    });
    
    function updateDisplay(e) {
      const id = e.target.id;
      const match = id.match(/^(\w+)(Volume|Pan|Rate)$/);
      if (!match) return;
      
      const [, layer, type] = match;
      const value = parseFloat(e.target.value);
      const valueSpan = document.getElementById(id + 'Value');
      
      if (type === 'Volume') {
        valueSpan.textContent = Math.round(value) + '%';
        if (isPlaying && gains[layer]) {
          gains[layer].gain.value = value / 100;
        }
      } else if (type === 'Pan') {
        const panValue = value < -5 ? 'L' + Math.abs(Math.round(value)) : value > 5 ? 'R' + Math.round(value) : 'C';
        valueSpan.textContent = panValue;
        if (isPlaying && panners[layer]) {
          panners[layer].pan.value = value / 100;
        }
      } else if (type === 'Rate') {
        valueSpan.textContent = value.toFixed(1) + 'x';
        if (isPlaying && oscillators[layer]) {
          const baseFreq = layerDefs[layer].baseFreq;
          oscillators[layer].frequency.value = baseFreq * value;
        }
      }
    }
    
    function startAudio() {
      if (isPlaying) return;
      isPlaying = true;
      
      const masterGain = audioContext.createGain();
      masterGain.gain.value = 0.3;
      masterGain.connect(audioContext.destination);
      
      // Create each layer
      Object.entries(layerDefs).forEach(([layerName, def]) => {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const panner = audioContext.createStereoPanner();
        
        osc.type = def.type;
        osc.frequency.value = def.baseFreq;
        
        // Read initial values from sliders
        const volume = parseFloat(document.getElementById(layerName + 'Volume').value) / 100;
        const pan = parseFloat(document.getElementById(layerName + 'Pan').value) / 100;
        const rate = parseFloat(document.getElementById(layerName + 'Rate').value);
        
        gain.gain.value = volume;
        panner.pan.value = pan;
        osc.frequency.value = def.baseFreq * rate;
        
        osc.connect(gain);
        gain.connect(panner);
        panner.connect(masterGain);
        osc.start();
        
        oscillators[layerName] = osc;
        gains[layerName] = gain;
        panners[layerName] = panner;
      });
      
      document.getElementById('playBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      document.getElementById('status').textContent = '🎵 Playing…';
      document.getElementById('status').classList.add('playing');
    }
    
    function stopAudio() {
      if (!isPlaying) return;
      isPlaying = false;
      
      Object.values(oscillators).forEach(osc => osc.stop());
      oscillators = {};
      gains = {};
      panners = {};
      
      document.getElementById('playBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      document.getElementById('status').textContent = 'Stopped';
      document.getElementById('status').classList.remove('playing');
    }
    
    document.getElementById('playBtn').addEventListener('click', startAudio);
    document.getElementById('stopBtn').addEventListener('click', stopAudio);
    
    // Safety: stop on page unload
    window.addEventListener('beforeunload', () => {
      if (isPlaying) stopAudio();
    });
  </script>
</body>
</html>
