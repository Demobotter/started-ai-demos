<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Race Pace Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a3d62 0%, #1a5276 50%, #154360 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #fff;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: rgba(10, 61, 98, 0.9);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 10px;
      color: #ff6b35;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #b0d4e8;
      margin-bottom: 30px;
    }
    .input-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
    }
    label {
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: #7fb3ff;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select, input {
      padding: 12px;
      border: 2px solid #4db8ff;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 8px;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #ff6b35;
      background: rgba(255, 107, 53, 0.1);
    }
    input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }
    button {
      flex: 1;
      padding: 14px 20px;
      background: linear-gradient(135deg, #ff6b35 0%, #ff5722 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 107, 53, 0.3);
    }
    button:active {
      transform: translateY(0);
    }
    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .result-card {
      background: rgba(77, 184, 255, 0.1);
      border: 2px solid #4db8ff;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    .result-card.highlight {
      border-color: #ff6b35;
      background: rgba(255, 107, 53, 0.15);
    }
    .result-label {
      font-family: 'Syne', sans-serif;
      font-size: 0.85rem;
      text-transform: uppercase;
      color: #7fb3ff;
      margin-bottom: 8px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .result-value {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: #ff6b35;
    }
    .result-detail {
      font-size: 0.9rem;
      color: #b0d4e8;
      margin-top: 8px;
    }
    .wide-card {
      grid-column: 1 / -1;
    }
    .zone-bar {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 12px;
    }
    .zone-label {
      width: 140px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #7fb3ff;
    }
    .zone-bar-fill {
      flex: 1;
      height: 24px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .zone-fill {
      height: 100%;
      background: linear-gradient(90deg, #4db8ff 0%, #7fb3ff 100%);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #fff;
    }
    .zone-fill.aerobic {
      background: linear-gradient(90deg, #90ee90 0%, #6ba876 100%);
    }
    .zone-fill.threshold {
      background: linear-gradient(90deg, #ffd700 0%, #ff9500 100%);
    }
    .zone-fill.anaerobic {
      background: linear-gradient(90deg, #ff6b35 0%, #ff4500 100%);
    }
    .splits-table {
      width: 100%;
      margin-top: 20px;
    }
    .splits-table th {
      background: rgba(77, 184, 255, 0.2);
      padding: 10px;
      text-align: left;
      font-size: 0.85rem;
      font-weight: 600;
      color: #7fb3ff;
    }
    .splits-table td {
      padding: 10px;
      border-bottom: 1px solid rgba(77, 184, 255, 0.1);
      font-size: 0.9rem;
      color: #b0d4e8;
    }
    .splits-table tr:hover {
      background: rgba(77, 184, 255, 0.05);
    }
    .error {
      color: #ff6b35;
      font-size: 0.9rem;
      margin-top: 5px;
      display: none;
    }
    @media (max-width: 700px) {
      .container {
        padding: 25px;
      }
      h1 {
        font-size: 1.8rem;
      }
      .input-section {
        grid-template-columns: 1fr;
      }
      .results-grid {
        grid-template-columns: 1fr;
      }
      .zone-label {
        width: 100px;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏃 Race Pace Converter</h1>
    <p class="subtitle">Calculate goal paces, splits, and training zones from your race data</p>

    <div class="input-section">
      <div class="input-group">
        <label for="distance">Target Distance</label>
        <select id="distance">
          <option value="5">5K</option>
          <option value="10">10K</option>
          <option value="21.0975">Half Marathon</option>
          <option value="42.195">Full Marathon</option>
          <option value="custom">Custom Miles</option>
        </select>
      </div>
      <div class="input-group">
        <label for="customDist">Custom Distance (if selected)</label>
        <input type="number" id="customDist" placeholder="e.g., 8.5" min="0.1" step="0.1">
      </div>
    </div>

    <div class="input-section">
      <div class="input-group">
        <label for="timeFormat">Known Time or Pace</label>
        <select id="timeFormat">
          <option value="finish">Finish Time (HH:MM:SS)</option>
          <option value="pace">Pace (MM:SS per mile)</option>
        </select>
      </div>
      <div class="input-group">
        <label for="timeInput">Enter Value</label>
        <input type="text" id="timeInput" placeholder="HH:MM:SS or MM:SS">
      </div>
    </div>

    <div class="button-group">
      <button onclick="calculate()">Calculate Pace & Splits</button>
      <button onclick="resetForm()">Clear</button>
    </div>

    <div id="errorMsg" class="error"></div>

    <div id="results" style="display: none;">
      <div class="results-grid">
        <div class="result-card highlight">
          <div class="result-label">Goal Pace</div>
          <div class="result-value" id="resultPace">--</div>
          <div class="result-detail">per mile</div>
        </div>
        <div class="result-card">
          <div class="result-label">Estimated Finish</div>
          <div class="result-value" id="resultFinish">--</div>
          <div class="result-detail">HH:MM:SS</div>
        </div>
        <div class="result-card">
          <div class="result-label">VO₂ Max Est.</div>
          <div class="result-value" id="resultVO2">--</div>
          <div class="result-detail">ml/kg/min</div>
        </div>
        <div class="result-card">
          <div class="result-label">vs World Record</div>
          <div class="result-value" id="resultWR">--</div>
          <div class="result-detail">% off pace</div>
        </div>
      </div>

      <div class="result-card wide-card">
        <div class="result-label">Training Heart Rate Zones</div>
        <div id="zonesBars"></div>
      </div>

      <div class="result-card wide-card">
        <div class="result-label">Mile-by-Mile Splits</div>
        <table class="splits-table">
          <thead>
            <tr>
              <th>Mile</th>
              <th>Pace</th>
              <th>Elapsed Time</th>
            </tr>
          </thead>
          <tbody id="splitsBody">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const WR_5K = 12.51 * 60 + 35; // 12:35 in seconds
    const WR_10K = 26.98 * 60 + 25; // 26:25
    const WR_HALF = 58.23 * 60 + 15; // 58:15
    const WR_FULL = 120.03 * 60 + 21; // 2:00:21

    function getWorldRecord(distanceMiles) {
      if (distanceMiles === 5) return WR_5K;
      if (distanceMiles === 10) return WR_10K;
      if (distanceMiles === 21.0975) return WR_HALF;
      if (distanceMiles === 42.195) return WR_FULL;
      // Interpolate for custom distances
      if (distanceMiles < 5) {
        const ratio = distanceMiles / 5;
        return WR_5K * ratio * 0.95;
      }
      return WR_FULL + (distanceMiles - 42.195) * 360;
    }

    function parseTime(str) {
      const parts = str.trim().split(':');
      if (parts.length === 2) {
        return parseInt(parts[0]) * 60 + parseInt(parts[1]);
      }
      if (parts.length === 3) {
        return parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseInt(parts[2]);
      }
      return null;
    }

    function formatTime(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function estimateVO2Max(pacePerMile) {
      // Simplified formula from sports science
      const speed = 26.82 / (pacePerMile / 60);
      return Math.min(80, 10.8 * 1 + 0.17 * speed * 26.82);
    }

    function estimateMaxHR(estVO2) {
      // Age-adjusted (assume ~30yo athlete)
      return 190;
    }

    function calculate() {
      const errorEl = document.getElementById('errorMsg');
      errorEl.style.display = 'none';
      errorEl.textContent = '';

      const distVal = document.getElementById('distance').value;
      let distance = parseFloat(distVal);
      if (distVal === 'custom') {
        distance = parseFloat(document.getElementById('customDist').value);
        if (!distance || distance <= 0) {
          errorEl.textContent = 'Please enter a valid custom distance';
          errorEl.style.display = 'block';
          return;
        }
      }

      const timeFormat = document.getElementById('timeFormat').value;
      const timeInput = document.getElementById('timeInput').value;
      const timeSeconds = parseTime(timeInput);
      if (!timeSeconds) {
        errorEl.textContent = 'Invalid time format. Use HH:MM:SS or MM:SS';
        errorEl.style.display = 'block';
        return;
      }

      let pacePerMile;
      let finishTime;
      if (timeFormat === 'finish') {
        finishTime = timeSeconds;
        pacePerMile = timeSeconds / distance;
      } else {
        pacePerMile = timeSeconds;
        finishTime = pacePerMile * distance;
      }

      // Calculate VO2 max estimate
      const vo2 = estimateVO2Max(pacePerMile);
      const maxHR = estimateMaxHR(vo2);

      // World record comparison
      const wrPace = getWorldRecord(distance) / distance;
      const percentOff = ((pacePerMile - wrPace) / wrPace) * 100;

      // Training zones (percentage of max HR)
      const aerobicZoneHR = maxHR * 0.70;
      const thresholdZoneHR = maxHR * 0.85;
      const anaerobicZoneHR = maxHR * 0.95;

      // Training zone paces (inverse relationship: higher HR = faster pace)
      const aerobicPace = (60 / (26.82 / (10 * vo2 / 42.8))) * 1.4;
      const thresholdPace = pacePerMile * 0.98;
      const anaerobicPace = pacePerMile * 0.85;

      // Generate splits
      const numMiles = Math.ceil(distance);
      const splitsHtml = Array.from({ length: numMiles }, (_, i) => {
        const mileNum = i + 1;
        if (mileNum > distance) return '';
        const elapsedSeconds = pacePerMile * mileNum;
        return `
          <tr>
            <td>${mileNum}</td>
            <td>${formatTime(pacePerMile)}</td>
            <td>${formatTime(elapsedSeconds)}</td>
          </tr>
        `;
      }).join('');

      // Display results
      document.getElementById('resultPace').textContent = formatTime(pacePerMile);
      document.getElementById('resultFinish').textContent = formatTime(finishTime);
      document.getElementById('resultVO2').textContent = vo2.toFixed(1);
      document.getElementById('resultWR').textContent = percentOff > 0 ? `+${percentOff.toFixed(1)}%` : percentOff.toFixed(1) + '%';

      const zonesHtml = `
        <div class="zone-bar">
          <div class="zone-label">Aerobic (70%)</div>
          <div class="zone-bar-fill">
            <div class="zone-fill aerobic" style="width: 70%">${aerobicZoneHR.toFixed(0)} bpm</div>
          </div>
        </div>
        <div class="zone-bar">
          <div class="zone-label">Threshold (85%)</div>
          <div class="zone-bar-fill">
            <div class="zone-fill threshold" style="width: 85%">${thresholdZoneHR.toFixed(0)} bpm</div>
          </div>
        </div>
        <div class="zone-bar">
          <div class="zone-label">Anaerobic (95%)</div>
          <div class="zone-bar-fill">
            <div class="zone-fill anaerobic" style="width: 95%">${anaerobicZoneHR.toFixed(0)} bpm</div>
          </div>
        </div>
      `;

      document.getElementById('zonesBars').innerHTML = zonesHtml;
      document.getElementById('splitsBody').innerHTML = splitsHtml;
      document.getElementById('results').style.display = 'block';
      window.scrollTo({ top: document.getElementById('results').offsetTop - 100, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('distance').value = '5';
      document.getElementById('customDist').value = '';
      document.getElementById('timeFormat').value = 'finish';
      document.getElementById('timeInput').value = '';
      document.getElementById('results').style.display = 'none';
      document.getElementById('errorMsg').style.display = 'none';
    }

    document.getElementById('distance').addEventListener('change', () => {
      document.getElementById('customDist').style.display = document.getElementById('distance').value === 'custom' ? 'block' : 'none';
    });

    document.getElementById('timeInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') calculate();
    });
  </script>
</body>
</html>
