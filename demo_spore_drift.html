<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spore Drift</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #0d3b0d 0%, #1a4d1a 100%);
            color: #e8f5e9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: rgba(13, 59, 13, 0.85);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        .header {
            text-align: center;
            padding: 30px 20px 20px;
            background: linear-gradient(180deg, #0d3b0d 0%, #0a2e0a 100%);
            border-bottom: 2px solid #2d9d5f;
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5em;
            margin-bottom: 8px;
            color: #81c784;
        }
        .header p {
            font-size: 0.95em;
            color: #a5d6a7;
        }
        .content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            padding: 30px;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .control-group {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #2d9d5f;
        }
        .control-group label {
            display: block;
            font-size: 0.85em;
            font-weight: 700;
            margin-bottom: 8px;
            color: #81c784;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        select, input[type="range"], button {
            width: 100%;
            padding: 10px;
            border: 1px solid #2d9d5f;
            border-radius: 6px;
            background: rgba(45, 157, 95, 0.2);
            color: #e8f5e9;
            font-family: 'Space Mono', monospace;
            font-size: 0.9em;
            cursor: pointer;
        }
        select:hover, input[type="range"]:hover, button:hover {
            background: rgba(45, 157, 95, 0.4);
            border-color: #81c784;
        }
        button {
            background: linear-gradient(135deg, #2d9d5f 0%, #1e6b3f 100%);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        button:active {
            transform: scale(0.98);
        }
        .stat-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #2d9d5f;
            font-size: 0.8em;
            line-height: 1.5;
        }
        .stat-label {
            color: #a5d6a7;
            font-size: 0.75em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .stat-value {
            color: #4da8da;
            font-weight: 700;
            font-size: 1.1em;
        }
        .toggle-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85em;
            cursor: pointer;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            border: 1px solid #2d9d5f;
            transition: all 0.2s;
        }
        .checkbox-label:hover {
            background: rgba(45, 157, 95, 0.3);
        }
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .canvas-container {
            position: relative;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            overflow: hidden;
            min-height: 500px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍄 Spore Drift</h1>
            <p>Watch how real fungi spread spores through air currents</p>
        </div>
        <div class="content">
            <div class="sidebar">
                <div class="control-group">
                    <label>Mushroom Species</label>
                    <select id="speciesSelect">
                        <option value="flyagaric">Fly Agaric</option>
                        <option value="puffball">Puffball</option>
                        <option value="inkcap">Ink Cap</option>
                        <option value="chanterelle">Chanterelle</option>
                        <option value="deathcap">Death Cap</option>
                        <option value="oyster">Oyster</option>
                        <option value="shiitake">Shiitake</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Wind Speed (m/s)</label>
                    <input type="range" id="windSlider" min="0" max="15" value="5" step="0.5">
                    <div class="stat-value" style="margin-top: 8px; text-align: center;" id="windDisplay">5.0 m/s</div>
                </div>

                <div class="control-group">
                    <button id="releaseBtn">Release Spores</button>
                </div>

                <div class="stat-box">
                    <div class="stat-label">Spore Size</div>
                    <div class="stat-value" id="sporeSizeDisplay">8 μm</div>
                </div>

                <div class="stat-box">
                    <div class="stat-label">Terminal Velocity</div>
                    <div class="stat-value" id="terminalVelDisplay">0.5 cm/s</div>
                </div>

                <div class="stat-box">
                    <div class="stat-label">Spore Production</div>
                    <div class="stat-value" id="productionDisplay">200M/hr</div>
                </div>

                <div class="control-group">
                    <div class="toggle-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="gridToggle" checked>
                            Grid
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="trailToggle" checked>
                            Trails
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="statsToggle" checked>
                            Stats
                        </label>
                    </div>
                </div>

                <div class="stat-box">
                    <div class="stat-label">Drift Distance</div>
                    <div class="stat-value" id="driftDistance">0 m</div>
                </div>

                <div class="stat-box">
                    <div class="stat-label">Max Height</div>
                    <div class="stat-value" id="maxHeight">0 m</div>
                </div>

                <div class="stat-box">
                    <div class="stat-label">Airborne Spores</div>
                    <div class="stat-value" id="airborneCount">0</div>
                </div>
            </div>

            <div class="canvas-container">
                <canvas id="canvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const speciesSelect = document.getElementById('speciesSelect');
        const windSlider = document.getElementById('windSlider');
        const releaseBtn = document.getElementById('releaseBtn');
        const windDisplay = document.getElementById('windDisplay');
        const sporeSizeDisplay = document.getElementById('sporeSizeDisplay');
        const terminalVelDisplay = document.getElementById('terminalVelDisplay');
        const productionDisplay = document.getElementById('productionDisplay');
        const gridToggle = document.getElementById('gridToggle');
        const trailToggle = document.getElementById('trailToggle');
        const statsToggle = document.getElementById('statsToggle');
        const driftDistanceDisplay = document.getElementById('driftDistance');
        const maxHeightDisplay = document.getElementById('maxHeight');
        const airborneCountDisplay = document.getElementById('airborneCount');

        // Mushroom species data (real mycology)
        const species = {
            flyagaric: {
                name: 'Fly Agaric (Amanita muscaria)',
                sporeSize: 8,           // μm
                terminalVel: 0.5,       // cm/s
                production: 200,        // millions/hour
                color: '#ff4444',
                gravity: 0.05,
                description: 'Red spores, slow dispersal, stay aloft hours'
            },
            puffball: {
                name: 'Puffball (Lycoperdon)',
                sporeSize: 3,
                terminalVel: 0.1,
                production: 7000,
                color: '#e8e8e8',
                gravity: 0.015,
                description: 'Tiny spores, ultra-light, travel 100+ km'
            },
            inkcap: {
                name: 'Ink Cap (Coprinellus)',
                sporeSize: 5,
                terminalVel: 0.2,
                production: 150,
                color: '#1a1a1a',
                gravity: 0.03,
                description: 'Black spores, morning dew dispersal'
            },
            chanterelle: {
                name: 'Chanterelle (Cantharellus)',
                sporeSize: 6,
                terminalVel: 0.3,
                production: 100,
                color: '#ffa500',
                gravity: 0.04,
                description: 'Golden spores, moderate dispersal'
            },
            deathcap: {
                name: 'Death Cap (Amanita phalloides)',
                sporeSize: 7,
                terminalVel: 0.4,
                production: 180,
                color: '#cccc00',
                gravity: 0.045,
                description: 'Pale spores, efficient dispersal'
            },
            oyster: {
                name: 'Oyster (Pleurotus)',
                sporeSize: 4,
                terminalVel: 0.15,
                production: 300,
                color: '#d4a574',
                gravity: 0.02,
                description: 'Brown spores, moderate travel'
            },
            shiitake: {
                name: 'Shiitake (Lentinula)',
                sporeSize: 5.5,
                terminalVel: 0.25,
                production: 120,
                color: '#8b6f47',
                gravity: 0.035,
                description: 'Dark brown, reliable dispersal'
            }
        };

        let spores = [];
        let stats = {
            driftDistance: 0,
            maxHeight: 0,
            activeSpores: 0
        };
        let animationRunning = true;
        let currentSpecies = 'flyagaric';

        // Resize canvas
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Update species info
        function updateSpeciesInfo() {
            const s = species[currentSpecies];
            sporeSizeDisplay.textContent = s.sporeSize + ' μm';
            terminalVelDisplay.textContent = s.terminalVel + ' cm/s';
            productionDisplay.textContent = (s.production > 1000 ? (s.production/1000).toFixed(1) + 'B' : s.production + 'M') + '/hr';
        }

        // Release spores
        function releaseSpores() {
            const s = species[currentSpecies];
            const count = 300 + Math.random() * 200;
            const startX = canvas.width / 2;
            const startY = canvas.height - 50;

            for (let i = 0; i < count; i++) {
                const angle = (Math.random() - 0.5) * Math.PI * 0.8; // burst upward
                const speed = 2 + Math.random() * 3;
                spores.push({
                    x: startX,
                    y: startY,
                    vx: Math.sin(angle) * speed,
                    vy: -Math.cos(angle) * speed,
                    size: s.sporeSize,
                    terminalVel: s.terminalVel,
                    color: s.color,
                    gravity: s.gravity,
                    trail: [],
                    maxY: startY
                });
            }
        }

        // Update wind display
        windSlider.addEventListener('input', (e) => {
            windDisplay.textContent = parseFloat(e.target.value).toFixed(1) + ' m/s';
        });

        // Update species
        speciesSelect.addEventListener('change', (e) => {
            currentSpecies = e.target.value;
            updateSpeciesInfo();
        });

        // Release button
        releaseBtn.addEventListener('click', releaseSpores);

        // Physics simulation
        function updateSpores() {
            const windSpeed = parseFloat(windSlider.value);
            const windForce = windSpeed * 0.1;
            let maxDrift = 0;
            let maxH = 0;

            spores = spores.filter(spore => {
                // Wind force (larger spores resist more)
                const sizeFactor = Math.max(0.3, 1 - (spore.size / 10));
                spore.vx += windForce * sizeFactor * 0.02;
                spore.vx *= 0.98; // air resistance

                // Gravity (terminal velocity applies)
                spore.vy += spore.gravity;
                if (Math.abs(spore.vy) > spore.terminalVel * 0.5) {
                    spore.vy = spore.vy > 0 ? spore.terminalVel * 0.5 : -spore.terminalVel * 0.5;
                }

                // Update position
                spore.x += spore.vx;
                spore.y += spore.vy;

                // Track trail
                if (trailToggle.checked) {
                    spore.trail.push({ x: spore.x, y: spore.y });
                    if (spore.trail.length > 30) spore.trail.shift();
                }

                // Track max height (above ground)
                const height = Math.max(0, (canvas.height - spore.y) / 100);
                if (height > spore.maxY) spore.maxY = height;
                maxH = Math.max(maxH, height);

                // Track drift (horizontal distance from center)
                maxDrift = Math.max(maxDrift, Math.abs(spore.x - canvas.width / 2) / 100);

                // Keep if in bounds or above
                return spore.y < canvas.height && spore.x > -50 && spore.x < canvas.width + 50;
            });

            stats.driftDistance = maxDrift.toFixed(1);
            stats.maxHeight = maxH.toFixed(1);
            stats.activeSpores = spores.length;
        }

        // Render
        function render() {
            ctx.fillStyle = 'rgba(13, 59, 13, 0.95)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid background
            if (gridToggle.checked) {
                ctx.strokeStyle = 'rgba(45, 157, 95, 0.15)';
                ctx.lineWidth = 1;
                const gridSize = 100; // 1m = 100px
                for (let x = 0; x < canvas.width; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                for (let y = 0; y < canvas.height; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
            }

            // Mushroom silhouette
            ctx.fillStyle = '#5a3a2a';
            const mushroomX = canvas.width / 2;
            const mushroomY = canvas.height - 30;
            ctx.beginPath();
            ctx.arc(mushroomX, mushroomY - 20, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(mushroomX - 8, mushroomY, 16, 30);

            // Draw spore trails
            if (trailToggle.checked) {
                spores.forEach(spore => {
                    if (spore.trail.length > 1) {
                        ctx.strokeStyle = spore.color + '22';
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(spore.trail[0].x, spore.trail[0].y);
                        for (let i = 1; i < spore.trail.length; i++) {
                            ctx.lineTo(spore.trail[i].x, spore.trail[i].y);
                        }
                        ctx.stroke();
                    }
                });
            }

            // Draw spores
            spores.forEach(spore => {
                ctx.fillStyle = spore.color;
                ctx.beginPath();
                ctx.arc(spore.x, spore.y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            });

            // Wind arrow
            const windSpeed = parseFloat(windSlider.value);
            if (windSpeed > 0) {
                const arrowY = 30;
                const arrowLen = Math.min(200, windSpeed * 15);
                ctx.strokeStyle = '#4da8da';
                ctx.fillStyle = '#4da8da';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(50, arrowY);
                ctx.lineTo(50 + arrowLen, arrowY);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(50 + arrowLen, arrowY);
                ctx.lineTo(50 + arrowLen - 8, arrowY - 5);
                ctx.lineTo(50 + arrowLen - 8, arrowY + 5);
                ctx.closePath();
                ctx.fill();
            }

            // Stats overlay
            if (statsToggle.checked) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(10, 10, 220, 100);
                ctx.fillStyle = '#4da8da';
                ctx.font = 'bold 12px "Space Mono"';
                ctx.textAlign = 'left';
                ctx.fillText('Drift: ' + stats.driftDistance + ' m', 20, 30);
                ctx.fillText('Height: ' + stats.maxHeight + ' m', 20, 50);
                ctx.fillText('Airborne: ' + stats.activeSpores, 20, 70);
                const s = species[currentSpecies];
                ctx.fillText('Species: ' + s.name.split('(')[0].trim(), 20, 90);
            }
        }

        // Animation loop
        function animate() {
            updateSpores();
            render();
            requestAnimationFrame(animate);
        }
        animate();

        // Update display stats in sidebar
        setInterval(() => {
            driftDistanceDisplay.textContent = stats.driftDistance + ' m';
            maxHeightDisplay.textContent = stats.maxHeight + ' m';
            airborneCountDisplay.textContent = stats.activeSpores;
        }, 100);

        // Initial update
        updateSpeciesInfo();
    </script>
</body>
</html>
