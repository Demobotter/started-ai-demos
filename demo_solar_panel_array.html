<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar Panel Array</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      font-family: 'Lato', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }
    .container {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: start;
    }
    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; gap: 20px; }
    }
    .panel {
      background: rgba(26, 31, 58, 0.8);
      border: 1px solid rgba(77, 184, 255, 0.3);
      border-radius: 12px;
      padding: 24px;
      backdrop-filter: blur(10px);
    }
    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 28px;
      margin-bottom: 24px;
      color: #ffd700;
      font-weight: 700;
    }
    .control-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      color: #4db8ff;
      font-weight: 500;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(77, 184, 255, 0.2);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffd700;
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffd700;
      cursor: pointer;
      border: none;
    }
    .value-display {
      display: inline-block;
      background: rgba(77, 184, 255, 0.2);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: #4db8ff;
      margin-left: 8px;
    }
    button {
      background: linear-gradient(135deg, #00d9ff 0%, #4db8ff 100%);
      color: #0a0e27;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      margin-top: 12px;
      transition: transform 0.2s, opacity 0.2s;
    }
    button:hover { transform: translateY(-2px); opacity: 0.9; }
    button:active { transform: translateY(0); }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }
    .stat-item {
      background: rgba(77, 184, 255, 0.1);
      padding: 12px;
      border-radius: 8px;
      border-left: 3px solid #ffd700;
    }
    .stat-label {
      font-size: 12px;
      color: #4db8ff;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: #ffd700;
    }
    canvas {
      width: 100%;
      height: 400px;
      background: rgba(10, 14, 39, 0.6);
      border-radius: 8px;
      border: 1px solid rgba(77, 184, 255, 0.2);
      display: block;
      margin-top: 12px;
    }
    .chart-container {
      margin-top: 20px;
    }
    .chart-title {
      font-size: 13px;
      color: #4db8ff;
      margin-bottom: 12px;
      font-weight: 600;
    }
    svg {
      width: 100%;
      height: auto;
      background: rgba(10, 14, 39, 0.4);
      border-radius: 8px;
      border: 1px solid rgba(77, 184, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Left Panel: Controls & Stats -->
    <div class="panel">
      <h1>☀️ Solar Array</h1>

      <div class="control-group">
        <label>Sun Angle (°)</label>
        <input type="range" id="sunAngleSlider" min="0" max="90" value="45" step="1">
        <span class="value-display" id="sunAngleValue">45°</span>
      </div>

      <div class="control-group">
        <label>Panel Efficiency (%)</label>
        <input type="range" id="efficiencySlider" min="5" max="25" value="15" step="1">
        <span class="value-display" id="efficiencyValue">15%</span>
      </div>

      <div class="control-group">
        <label>Panel Area (m²)</label>
        <input type="range" id="panelAreaSlider" min="1" max="10" value="2" step="0.5">
        <span class="value-display" id="panelAreaValue">2 m²</span>
      </div>

      <button id="addPanelBtn">Add Panel to Array</button>

      <div class="stats">
        <div class="stat-item">
          <div class="stat-label">Sun Angle</div>
          <div class="stat-value" id="statSunAngle">45°</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Irradiance</div>
          <div class="stat-value" id="statIrradiance">638 W/m²</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Panel Count</div>
          <div class="stat-value" id="statPanelCount">0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Efficiency</div>
          <div class="stat-value" id="statEfficiency">15%</div>
        </div>
        <div class="stat-item" style="grid-column: 1/3;">
          <div class="stat-label">Array Power Output</div>
          <div class="stat-value" id="statPowerOutput">0 W</div>
        </div>
        <div class="stat-item" style="grid-column: 1/3;">
          <div class="stat-label">Est. Annual Energy (4 peak h/day)</div>
          <div class="stat-value" id="statAnnualEnergy">0 kWh/year</div>
        </div>
      </div>

      <div class="chart-container">
        <div class="chart-title">Power vs Sun Angle</div>
        <canvas id="angleChart" width="100" height="150"></canvas>
      </div>
    </div>

    <!-- Right Panel: Canvas Visualization -->
    <div class="panel">
      <div class="chart-title">Panel Array Visualization</div>
      <canvas id="solarCanvas" width="400" height="400"></canvas>
    </div>
  </div>

  <script>
    const DIRECT_NORMAL_IRRADIANCE = 900; // W/m² at 0° angle (standard AM1.5)

    const state = {
      sunAngleDeg: 45,
      efficiency: 15,
      panelArea: 2,
      panels: []
    };

    const sunAngleSlider = document.getElementById('sunAngleSlider');
    const efficiencySlider = document.getElementById('efficiencySlider');
    const panelAreaSlider = document.getElementById('panelAreaSlider');
    const addPanelBtn = document.getElementById('addPanelBtn');
    const solarCanvas = document.getElementById('solarCanvas');
    const angleChart = document.getElementById('angleChart');
    const ctx = solarCanvas.getContext('2d');
    const chartCtx = angleChart.getContext('2d');

    // Event Listeners
    sunAngleSlider.addEventListener('input', (e) => {
      state.sunAngleDeg = parseFloat(e.target.value);
      document.getElementById('sunAngleValue').textContent = state.sunAngleDeg + '°';
      update();
    });

    efficiencySlider.addEventListener('input', (e) => {
      state.efficiency = parseFloat(e.target.value);
      document.getElementById('efficiencyValue').textContent = state.efficiency + '%';
      update();
    });

    panelAreaSlider.addEventListener('input', (e) => {
      state.panelArea = parseFloat(e.target.value);
      document.getElementById('panelAreaValue').textContent = state.panelArea + ' m²';
    });

    addPanelBtn.addEventListener('click', () => {
      // Add panel to array at random position
      const x = Math.random() * 80 + 10; // 10-90% across grid
      const y = Math.random() * 80 + 10;
      state.panels.push({ x, y, area: state.panelArea });
      update();
    });

    function calculateIrradiance(angleDeg) {
      // Lambert's cosine law: irradiance = DNI * cos(θ)
      const angleRad = (angleDeg * Math.PI) / 180;
      const cosTheta = Math.cos(angleRad);
      return DIRECT_NORMAL_IRRADIANCE * Math.max(0, cosTheta);
    }

    function calculatePower(irradiance, area, efficiency) {
      // Power = Irradiance × Area × Efficiency
      return (irradiance * area * efficiency) / 100;
    }

    function update() {
      const irradiance = calculateIrradiance(state.sunAngleDeg);
      
      // Calculate total power from all panels
      let totalPower = 0;
      state.panels.forEach(panel => {
        totalPower += calculatePower(irradiance, panel.area, state.efficiency);
      });

      // Calculate annual energy (4 peak sun hours per day = 1460 hours/year)
      const annualEnergy = totalPower * 1460 / 1000; // kWh/year

      // Update stats
      document.getElementById('statSunAngle').textContent = state.sunAngleDeg + '°';
      document.getElementById('statIrradiance').textContent = Math.round(irradiance) + ' W/m²';
      document.getElementById('statPanelCount').textContent = state.panels.length;
      document.getElementById('statEfficiency').textContent = state.efficiency + '%';
      document.getElementById('statPowerOutput').textContent = totalPower.toFixed(1) + ' W';
      document.getElementById('statAnnualEnergy').textContent = annualEnergy.toFixed(0) + ' kWh/year';

      // Draw canvas visualizations
      drawSolarCanvas(irradiance);
      drawAngleChart();
    }

    function drawSolarCanvas(irradiance) {
      const width = solarCanvas.width;
      const height = solarCanvas.height;

      // Clear canvas
      ctx.fillStyle = 'rgba(10, 14, 39, 0.6)';
      ctx.fillRect(0, 0, width, height);

      // Draw grid background
      ctx.strokeStyle = 'rgba(77, 184, 255, 0.1)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 10; i++) {
        const x = (i / 10) * width;
        const y = (i / 10) * height;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      // Draw sun (top position, angle determines height)
      const sunX = width / 2;
      const sunY = height * 0.15; // Fixed at top-center
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(sunX, sunY, 12, 0, Math.PI * 2);
      ctx.fill();

      // Draw sun rays
      ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        const x1 = sunX + Math.cos(angle) * 25;
        const y1 = sunY + Math.sin(angle) * 25;
        ctx.beginPath();
        ctx.moveTo(sunX, sunY);
        ctx.lineTo(x1, y1);
        ctx.stroke();
      }

      // Draw panels
      state.panels.forEach((panel, idx) => {
        const px = (panel.x / 100) * width;
        const py = (panel.y / 100) * height;
        const panelWidth = 30;
        const panelHeight = 20;

        // Calculate color based on irradiance
        const intensity = irradiance / DIRECT_NORMAL_IRRADIANCE;
        const heatHue = Math.round((1 - intensity) * 240); // Blue (240°) to Red (0°)
        ctx.fillStyle = `hsl(${heatHue}, 100%, 50%)`;
        ctx.fillRect(px - panelWidth / 2, py - panelHeight / 2, panelWidth, panelHeight);

        // Panel outline
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 2;
        ctx.strokeRect(px - panelWidth / 2, py - panelHeight / 2, panelWidth, panelHeight);

        // Panel label
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 10px Lato';
        ctx.textAlign = 'center';
        ctx.fillText('P' + (idx + 1), px, py + 5);
      });

      // Draw sun angle indicator
      ctx.strokeStyle = 'rgba(77, 184, 255, 0.4)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      const angleRad = (state.sunAngleDeg * Math.PI) / 180;
      const lineEndX = sunX + Math.cos(angleRad + Math.PI / 2) * 80;
      const lineEndY = sunY + Math.sin(angleRad + Math.PI / 2) * 80;
      ctx.beginPath();
      ctx.moveTo(sunX, sunY);
      ctx.lineTo(lineEndX, lineEndY);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw angle arc
      ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(sunX, sunY, 40, -Math.PI / 2, -Math.PI / 2 + angleRad, false);
      ctx.stroke();

      // Angle label
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 12px Poppins';
      ctx.textAlign = 'center';
      ctx.fillText(state.sunAngleDeg + '°', sunX - 50, sunY + 15);
    }

    function drawAngleChart() {
      const width = angleChart.width;
      const height = angleChart.height;
      const padding = 20;
      const graphWidth = width - 2 * padding;
      const graphHeight = height - 2 * padding;

      // Clear
      chartCtx.fillStyle = 'rgba(10, 14, 39, 0.4)';
      chartCtx.fillRect(0, 0, width, height);

      // Draw axes
      chartCtx.strokeStyle = '#4db8ff';
      chartCtx.lineWidth = 1;
      chartCtx.beginPath();
      chartCtx.moveTo(padding, height - padding);
      chartCtx.lineTo(width - padding, height - padding);
      chartCtx.lineTo(width - padding, padding);
      chartCtx.stroke();

      // Draw axis labels
      chartCtx.fillStyle = '#4db8ff';
      chartCtx.font = '10px Lato';
      chartCtx.textAlign = 'center';
      chartCtx.fillText('90°', width - padding, height - padding + 15);
      chartCtx.textAlign = 'right';
      chartCtx.fillText('100%', padding - 8, padding);

      // Draw curve: Power vs Angle (0° to 90°)
      chartCtx.strokeStyle = '#ffd700';
      chartCtx.lineWidth = 2;
      chartCtx.beginPath();

      for (let angle = 0; angle <= 90; angle += 5) {
        const irr = calculateIrradiance(angle);
        const powerPerM2 = (irr * state.efficiency) / 100;
        const normalizedPower = powerPerM2 / (DIRECT_NORMAL_IRRADIANCE * state.efficiency / 100); // 0-1

        const x = padding + (angle / 90) * graphWidth;
        const y = height - padding - normalizedPower * graphHeight;

        if (angle === 0) {
          chartCtx.moveTo(x, y);
        } else {
          chartCtx.lineTo(x, y);
        }
      }
      chartCtx.stroke();

      // Mark current angle
      const currentIrr = calculateIrradiance(state.sunAngleDeg);
      const currentPower = (currentIrr * state.efficiency) / 100;
      const normalizedCurrent = currentPower / (DIRECT_NORMAL_IRRADIANCE * state.efficiency / 100);
      const markX = padding + (state.sunAngleDeg / 90) * graphWidth;
      const markY = height - padding - normalizedCurrent * graphHeight;

      chartCtx.fillStyle = '#00ffff';
      chartCtx.beginPath();
      chartCtx.arc(markX, markY, 4, 0, Math.PI * 2);
      chartCtx.fill();
    }

    // Initial render
    update();
  </script>
</body>
</html>
