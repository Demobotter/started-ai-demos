<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonic Synthesizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f1419;
            color: #e0e0e0;
            font-family: 'Space Mono', monospace;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 30px;
            align-items: start;
        }
        h1 {
            grid-column: 1 / -1;
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            margin-bottom: 20px;
            color: #00d9ff;
            text-align: center;
        }
        .panel {
            background: #1a1f3a;
            border: 1px solid #2a3050;
            border-radius: 8px;
            padding: 20px;
        }
        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: #00d9ff;
            margin-top: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .section-title:first-child {
            margin-top: 0;
        }
        .slider-group {
            margin-bottom: 15px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 6px;
            color: #b0b0b0;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, #ff0000, #ffff00, #00d9ff);
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00d9ff;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 217, 255, 0.6);
        }
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00d9ff;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 8px rgba(0, 217, 255, 0.6);
        }
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 15px;
        }
        button {
            background: #7209b7;
            border: 1px solid #9d4edd;
            color: #fff;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        button:hover {
            background: #9d4edd;
            box-shadow: 0 0 12px rgba(157, 78, 221, 0.5);
        }
        button.active {
            background: #00d9ff;
            color: #0f1419;
        }
        .play-button {
            grid-column: 1 / -1;
            background: #00aa88;
        }
        .play-button:hover {
            background: #00dd99;
        }
        .stats-box {
            background: #1a1f3a;
            border-left: 3px solid #00d9ff;
            padding: 12px;
            margin-top: 10px;
            border-radius: 4px;
            font-size: 11px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            color: #b0b0b0;
        }
        .stat-row:last-child {
            margin-bottom: 0;
        }
        .stat-value {
            color: #00d9ff;
            font-weight: bold;
        }
        #oscilloscope {
            width: 100%;
            height: 300px;
            background: #0f1419;
            border: 1px solid #2a3050;
            border-radius: 8px;
            display: block;
        }
        .timbre-box {
            background: #1a1f3a;
            border: 1px solid #7209b7;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            text-align: center;
        }
        .timbre-label {
            font-size: 11px;
            color: #b0b0b0;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .timbre-value {
            font-size: 24px;
            font-family: 'Playfair Display', serif;
            color: #7209b7;
            font-weight: bold;
        }
        .harmonic-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }
        .harmonic-pair {
            display: contents;
        }
        .harmonic-slider {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .harmonic-label {
            font-size: 11px;
            color: #b0b0b0;
            display: flex;
            justify-content: space-between;
        }
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎼 Harmonic Synthesizer</h1>
        
        <div class="panel">
            <div class="section-title">Fundamental Frequency</div>
            <div class="slider-group">
                <div class="slider-label">
                    <span>Hz</span>
                    <span id="freqDisplay">440</span>
                </div>
                <input type="range" id="fundamentalFreq" min="100" max="1000" value="440" step="1">
                <div style="font-size: 10px; color: #888; margin-top: 4px;">
                    Note: <span id="noteDisplay">A4</span>
                </div>
            </div>

            <div class="section-title">Harmonic Amplitudes (%)</div>
            <div class="harmonic-grid" id="harmonicGrid"></div>

            <div class="section-title">Presets</div>
            <div class="button-group">
                <button onclick="loadPreset('sine')">Pure Sine</button>
                <button onclick="loadPreset('square')">Square</button>
                <button onclick="loadPreset('sawtooth')">Sawtooth</button>
                <button onclick="loadPreset('triangle')">Triangle</button>
            </div>

            <button class="play-button" id="playButton" onclick="togglePlay()">▶ Play</button>

            <div class="section-title">Analysis</div>
            <div class="stats-box">
                <div class="stat-row">
                    <span>Harmonic Content</span>
                    <span class="stat-value" id="harmonicContent">100%</span>
                </div>
                <div class="stat-row">
                    <span>RMS Amplitude</span>
                    <span class="stat-value" id="rmsAmp">0.71</span>
                </div>
                <div class="stat-row">
                    <span>Active Harmonics</span>
                    <span class="stat-value" id="activeCount">1</span>
                </div>
                <div class="stat-row">
                    <span>Peak Frequency</span>
                    <span class="stat-value" id="peakFreq">440 Hz</span>
                </div>
            </div>
        </div>

        <div class="panel">
            <canvas id="oscilloscope"></canvas>
            <div class="timbre-box">
                <div class="timbre-label">Timbre Classification</div>
                <div class="timbre-value" id="timbreClass">Pure</div>
            </div>
        </div>
    </div>

    <script>
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let oscillators = [];
        let gains = [];
        let isPlaying = false;

        const notes = {
            'C4': 262, 'D4': 294, 'E4': 330, 'F4': 349, 'G4': 392, 'A4': 440, 'B4': 494,
            'C5': 523, 'D5': 587, 'E5': 659, 'F5': 698, 'G5': 784, 'A5': 880, 'B5': 988
        };

        const noteNames = Object.entries(notes).sort((a, b) => a[1] - b[1]);

        // Initialize harmonic sliders
        function initHarmonics() {
            const grid = document.getElementById('harmonicGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= 8; i++) {
                const div = document.createElement('div');
                div.className = 'harmonic-slider';
                div.innerHTML = `
                    <div class="harmonic-label">
                        <span>H${i}</span>
                        <span id="amp${i}Val">0</span>
                    </div>
                    <input type="range" id="amp${i}" min="0" max="100" value="${i === 1 ? 100 : 0}" step="1" oninput="updateDisplay()">
                `;
                grid.appendChild(div);
            }
        }

        function freqToNote(freq) {
            let closest = noteNames[0];
            for (let note of noteNames) {
                if (Math.abs(note[1] - freq) < Math.abs(closest[1] - freq)) {
                    closest = note;
                }
            }
            return closest[0];
        }

        function getAmplitudes() {
            const amps = [];
            for (let i = 1; i <= 8; i++) {
                amps.push(parseFloat(document.getElementById(`amp${i}`).value) / 100);
            }
            return amps;
        }

        function updateDisplay() {
            const freq = parseFloat(document.getElementById('fundamentalFreq').value);
            document.getElementById('freqDisplay').textContent = Math.round(freq);
            document.getElementById('noteDisplay').textContent = freqToNote(freq);

            const amps = getAmplitudes();
            for (let i = 0; i < 8; i++) {
                document.getElementById(`amp${i}Val`).textContent = Math.round(amps[i] * 100);
            }

            // Harmonic content
            const sum = amps.reduce((a, b) => a + b, 0);
            document.getElementById('harmonicContent').textContent = Math.round((sum / 8) * 100) + '%';

            // RMS amplitude
            const rms = Math.sqrt(amps.reduce((a, b) => a + b * b, 0) / 8);
            document.getElementById('rmsAmp').textContent = rms.toFixed(2);

            // Active harmonics
            const active = amps.filter(a => a > 0.01).length;
            document.getElementById('activeCount').textContent = active;

            // Peak frequency
            let maxIdx = 0, maxVal = 0;
            for (let i = 0; i < 8; i++) {
                if (amps[i] > maxVal) { maxVal = amps[i]; maxIdx = i; }
            }
            const peakFreq = freq * (maxIdx + 1);
            document.getElementById('peakFreq').textContent = Math.round(peakFreq) + ' Hz';

            // Timbre classification
            classifyTimbre(amps);

            // Redraw oscilloscope
            drawOscilloscope();
        }

        function classifyTimbre(amps) {
            const fundamental = amps[0];
            const highHarmonics = amps.slice(4, 8).reduce((a, b) => a + b, 0);
            const oddHarmonics = amps[0] + amps[2] + amps[4] + amps[6];
            const evenHarmonics = amps[1] + amps[3] + amps[5] + amps[7];
            const sum = amps.reduce((a, b) => a + b, 0);

            let timbre = 'Pure';
            if (sum < 0.1) timbre = 'Silent';
            else if (highHarmonics / sum > 0.4) timbre = 'Bright';
            else if (Math.abs(oddHarmonics - evenHarmonics) > sum * 0.6) timbre = 'Hollow';
            else if (amps.every((a, i) => Math.abs(a - amps[0] / (i + 1)) < 0.1)) timbre = 'Buzzy';
            else if (amps.every((a, i) => i === 0 || a <= amps[i - 1] * 0.6)) timbre = 'Mellow';

            document.getElementById('timbreClass').textContent = timbre;
        }

        function drawOscilloscope() {
            const canvas = document.getElementById('oscilloscope');
            const ctx = canvas.getContext('2d');
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            canvas.width = w;
            canvas.height = h;

            ctx.fillStyle = '#0f1419';
            ctx.fillRect(0, 0, w, h);

            const freq = parseFloat(document.getElementById('fundamentalFreq').value);
            const amps = getAmplitudes();
            const samplesPerPeriod = 200;
            const periods = 3;
            const totalSamples = samplesPerPeriod * periods;

            ctx.strokeStyle = '#00d9ff';
            ctx.lineWidth = 2;
            ctx.shadowColor = 'rgba(0, 217, 255, 0.3)';
            ctx.shadowBlur = 8;

            ctx.beginPath();
            for (let x = 0; x < w; x++) {
                const t = (x / w) * (periods / freq);
                let y = 0;
                for (let n = 1; n <= 8; n++) {
                    y += amps[n - 1] * Math.sin(2 * Math.PI * n * freq * t);
                }
                const canvasY = h / 2 - (y * h * 0.35);
                if (x === 0) ctx.moveTo(x, canvasY);
                else ctx.lineTo(x, canvasY);
            }
            ctx.stroke();

            // Grid
            ctx.strokeStyle = 'rgba(42, 48, 80, 0.5)';
            ctx.lineWidth = 0.5;
            for (let i = 1; i < 6; i++) {
                const y = (h / 6) * i;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();
            }

            ctx.shadowColor = 'transparent';
        }

        function loadPreset(type) {
            const presets = {
                sine: [100, 0, 0, 0, 0, 0, 0, 0],
                square: [100, 0, 33, 0, 20, 0, 14, 0],
                sawtooth: [100, 50, 33, 25, 20, 17, 14, 13],
                triangle: [100, 0, 11, 0, 4, 0, 2, 0]
            };
            const vals = presets[type];
            for (let i = 1; i <= 8; i++) {
                document.getElementById(`amp${i}`).value = vals[i - 1];
            }
            updateDisplay();
        }

        function togglePlay() {
            if (isPlaying) {
                stopPlay();
            } else {
                playTone();
            }
        }

        function playTone() {
            if (isPlaying) return;
            isPlaying = true;
            document.getElementById('playButton').textContent = '⏹ Stop';

            const freq = parseFloat(document.getElementById('fundamentalFreq').value);
            const amps = getAmplitudes();
            const now = audioContext.currentTime;
            const duration = 2;

            for (let n = 1; n <= 8; n++) {
                if (amps[n - 1] < 0.01) continue;

                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.frequency.value = freq * n;
                osc.connect(gain);
                gain.connect(audioContext.destination);

                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(amps[n - 1], now + 0.1);
                gain.gain.setValueAtTime(amps[n - 1], now + 0.1 + 1.8);
                gain.gain.linearRampToValueAtTime(0, now + duration);

                osc.start(now);
                osc.stop(now + duration);
                oscillators.push(osc);
                gains.push(gain);
            }

            setTimeout(() => {
                isPlaying = false;
                document.getElementById('playButton').textContent = '▶ Play';
            }, duration * 1000);
        }

        function stopPlay() {
            oscillators.forEach(osc => osc.stop());
            oscillators = [];
            gains = [];
            isPlaying = false;
            document.getElementById('playButton').textContent = '▶ Play';
        }

        document.getElementById('fundamentalFreq').addEventListener('input', updateDisplay);

        initHarmonics();
        updateDisplay();
    </script>
</body>
</html>
