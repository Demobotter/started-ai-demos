<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light Spectrum — Interactive Rainbow Physics</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Mono', monospace;
      background: linear-gradient(to bottom, #1a3a5e 0%, #0f2a3f 100%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: rgba(10, 20, 46, 0.9);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    .title {
      font-family: 'Playfair Display', serif;
      font-size: 2.5em;
      margin-bottom: 10px;
      text-align: center;
      background: linear-gradient(135deg, #4da8da, #64c84f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      text-align: center;
      font-size: 0.9em;
      color: #a8d8e8;
      margin-bottom: 30px;
    }
    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 30px;
    }
    @media (max-width: 768px) {
      .content { grid-template-columns: 1fr; }
      .title { font-size: 1.8em; }
      .container { padding: 20px; }
    }
    canvas {
      background: linear-gradient(to bottom, #1a3a5e, #f0f0f0);
      border-radius: 8px;
      border: 2px solid #4da8da;
      width: 100%;
      height: auto;
      display: block;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .control-group {
      background: rgba(20, 40, 70, 0.6);
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #4da8da;
    }
    .control-label {
      font-size: 0.85em;
      font-weight: bold;
      color: #64c84f;
      margin-bottom: 8px;
      display: block;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #1f4d7f;
      outline: none;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #4da8da;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(77, 168, 218, 0.6);
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #4da8da;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 8px rgba(77, 168, 218, 0.6);
    }
    select {
      background: #1f4d7f;
      color: #e0e0e0;
      border: 1px solid #4da8da;
      padding: 8px;
      border-radius: 4px;
      font-family: 'Space Mono', monospace;
      cursor: pointer;
    }
    select option { background: #0a1428; color: #e0e0e0; }
    .stat-box {
      background: rgba(20, 40, 70, 0.6);
      padding: 12px;
      border-radius: 6px;
      border-left: 4px solid #4da8da;
      margin-bottom: 12px;
      font-size: 0.85em;
    }
    .stat-label { color: #a8d8e8; font-size: 0.8em; }
    .stat-value { color: #64c84f; font-weight: bold; font-size: 1.1em; margin-top: 2px; }
    .visibility-good { color: #64c84f; }
    .visibility-fair { color: #ffc956; }
    .visibility-poor { color: #ff6b6b; }
    .toggle-btn {
      background: #1f4d7f;
      color: #4da8da;
      border: 1px solid #4da8da;
      padding: 10px;
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.9em;
    }
    .toggle-btn:hover { background: #4da8da; color: #0a1428; }
    .toggle-btn.active { background: #4da8da; color: #0a1428; box-shadow: 0 0 12px rgba(77, 168, 218, 0.6); }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">🌈 Light Spectrum</h1>
    <p class="subtitle">Explore rainbow physics through interactive atmospheric optics</p>
    
    <div class="content">
      <div>
        <canvas id="rainbowCanvas" width="400" height="400"></canvas>
      </div>
      
      <div class="controls">
        <div class="control-group">
          <label class="control-label">Sun Angle: <span id="sunAngleValue">45</span>°</label>
          <input type="range" id="sunAngle" min="0" max="90" value="45" step="1">
        </div>
        
        <div class="control-group">
          <label class="control-label">Droplet Size: <span id="dropletSizeValue">2</span> mm</label>
          <input type="range" id="dropletSize" min="0.5" max="10" value="2" step="0.5">
        </div>
        
        <div class="control-group">
          <label class="control-label">Light Type</label>
          <select id="lightType">
            <option value="full">Full Spectrum</option>
            <option value="red">Red Only (650nm)</option>
            <option value="violet">Violet Only (400nm)</option>
          </select>
        </div>
        
        <div class="control-group">
          <label class="control-label">
            <button class="toggle-btn" id="rayTraceToggle">Ray Trace: OFF</button>
          </label>
        </div>
        
        <div class="stat-box">
          <div class="stat-label">Primary Rainbow Angle</div>
          <div class="stat-value"><span id="primaryAngle">42.0</span>°</div>
        </div>
        
        <div class="stat-box">
          <div class="stat-label">Secondary Rainbow Angle</div>
          <div class="stat-value"><span id="secondaryAngle">50.4</span>°</div>
        </div>
        
        <div class="stat-box">
          <div class="stat-label">Visibility</div>
          <div class="stat-value" id="visibilityStatus">Good</div>
        </div>
        
        <div class="stat-box">
          <div class="stat-label">Chromatic Dispersion</div>
          <div class="stat-value"><span id="dispersion">2.0</span> nm</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('rainbowCanvas');
    const ctx = canvas.getContext('2d');
    
    const state = {
      sunAngle: 45,
      dropletSize: 2,
      lightType: 'full',
      rayTrace: false,
      time: 0
    };

    // Wavelength to RGB (HSL-based color map)
    function wavelengthToColor(nm) {
      let hue;
      if (nm >= 650) hue = 0; // red
      else if (nm >= 590) hue = 60; // yellow
      else if (nm >= 530) hue = 120; // green
      else if (nm >= 470) hue = 240; // blue
      else hue = 270; // violet
      return `hsl(${hue}, 100%, 50%)`;
    }

    // Snell's Law refraction angle calculator
    // n1*sin(θ1) = n2*sin(θ2), where n_water=1.33, n_air=1.0
    function calculateRefractionAngle(incidentAngle, n1, n2) {
      const sinTheta1 = Math.sin(incidentAngle * Math.PI / 180);
      const sinTheta2 = (n1 / n2) * sinTheta1;
      if (sinTheta2 > 1) return null; // total internal reflection
      return Math.asin(sinTheta2) * 180 / Math.PI;
    }

    // Calculate primary rainbow angle for a wavelength
    function calculatePrimaryRainbowAngle(wavelength) {
      // Refractive index varies slightly with wavelength
      const n_water = wavelength >= 600 ? 1.331 : 1.343; // red vs violet
      const incidentAngle = 59.5; // optimal incident angle for water
      const refractedAngle1 = calculateRefractionAngle(incidentAngle, 1.0, n_water);
      if (!refractedAngle1) return 42;
      
      // One internal reflection: total deviation ≈ 42° for red
      const deviation = 180 - 2 * incidentAngle + 2 * refractedAngle1;
      return Math.abs(180 - deviation);
    }

    // Visibility based on sun angle
    function getVisibility(sunAngle) {
      if (sunAngle > 42) return { status: 'Poor', class: 'visibility-poor' };
      if (sunAngle > 20) return { status: 'Good', class: 'visibility-good' };
      return { status: 'Fair', class: 'visibility-fair' };
    }

    // Draw the scene
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Sky gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGrad.addColorStop(0, '#1a3a5e');
      skyGrad.addColorStop(1, '#f0f0f0');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2.5;

      // Draw sun
      const sunX = centerX + 150 * Math.cos((90 - state.sunAngle) * Math.PI / 180);
      const sunY = centerY - 150 * Math.sin((90 - state.sunAngle) * Math.PI / 180);
      ctx.fillStyle = '#ffff00';
      ctx.beginPath();
      ctx.arc(sunX, sunY, 15, 0, Math.PI * 2);
      ctx.fill();

      // Draw rain shower (droplets)
      const numDroplets = 60;
      for (let i = 0; i < numDroplets; i++) {
        const x = centerX - 100 + (i % 20) * 10;
        const y = centerY + 80 + Math.floor(i / 20) * 20;
        ctx.fillStyle = 'rgba(77, 168, 218, 0.3)';
        ctx.beginPath();
        ctx.arc(x, y, state.dropletSize / 2, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw primary rainbow
      if (state.lightType === 'full') {
        const wavelengths = [650, 590, 530, 470, 400];
        const colors = ['#ff0000', '#ffff00', '#00ff00', '#0000ff', '#8b00ff'];
        
        for (let i = 0; i < wavelengths.length; i++) {
          const angle = 42 - (i * 0.4); // slight chromatic spread
          const rad = angle * Math.PI / 180;
          
          ctx.strokeStyle = colors[i];
          ctx.lineWidth = 8;
          ctx.globalAlpha = 0.7;
          ctx.beginPath();
          ctx.arc(centerX, centerY + 80, 80 - i * 3, -rad, Math.PI * 2 - rad, false);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      } else if (state.lightType === 'red') {
        ctx.strokeStyle = '#ff0000';
        ctx.lineWidth = 12;
        ctx.globalAlpha = 0.8;
        ctx.beginPath();
        const rad = 42 * Math.PI / 180;
        ctx.arc(centerX, centerY + 80, 80, -rad, Math.PI * 2 - rad, false);
        ctx.stroke();
        ctx.globalAlpha = 1;
      } else if (state.lightType === 'violet') {
        ctx.strokeStyle = '#8b00ff';
        ctx.lineWidth = 12;
        ctx.globalAlpha = 0.8;
        ctx.beginPath();
        const rad = 40.4 * Math.PI / 180;
        ctx.arc(centerX, centerY + 80, 76, -rad, Math.PI * 2 - rad, false);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // Draw secondary rainbow (faint)
      if (state.lightType === 'full' && state.sunAngle < 40) {
        for (let i = 0; i < 5; i++) {
          const angle = 50.4 - (i * 0.5);
          const rad = angle * Math.PI / 180;
          ctx.strokeStyle = ['#ff0000', '#ffff00', '#00ff00', '#0000ff', '#8b00ff'][4 - i];
          ctx.lineWidth = 4;
          ctx.globalAlpha = 0.2;
          ctx.beginPath();
          ctx.arc(centerX, centerY + 80, 100 - i * 3, -rad, Math.PI * 2 - rad, false);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }

      // Draw ray trace if enabled
      if (state.rayTrace && state.sunAngle < 42) {
        // Sample light ray path
        const dropX = centerX - 50;
        const dropY = centerY + 80;
        
        // Incoming ray from sun
        ctx.strokeStyle = '#ffff00';
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.moveTo(sunX, sunY);
        ctx.lineTo(dropX, dropY);
        ctx.stroke();
        
        // Refracted ray exiting droplet
        ctx.strokeStyle = '#ffff00';
        ctx.beginPath();
        ctx.moveTo(dropX, dropY);
        const exitAngle = (90 - state.sunAngle) * Math.PI / 180;
        ctx.lineTo(dropX + 60 * Math.cos(exitAngle), dropY - 60 * Math.sin(exitAngle));
        ctx.stroke();
        
        ctx.globalAlpha = 1;
      }

      // Stats update
      updateStats();
    }

    function updateStats() {
      const primaryAngle = 42 - (state.lightType === 'violet' ? 1.6 : 0);
      const secondaryAngle = 50.4;
      const visibility = getVisibility(state.sunAngle);
      const dispersion = 2.0;
      
      document.getElementById('primaryAngle').textContent = primaryAngle.toFixed(1);
      document.getElementById('secondaryAngle').textContent = secondaryAngle.toFixed(1);
      document.getElementById('visibilityStatus').textContent = visibility.status;
      document.getElementById('visibilityStatus').className = 'stat-value ' + visibility.class;
      document.getElementById('dispersion').textContent = dispersion.toFixed(1);
    }

    // Event listeners
    document.getElementById('sunAngle').addEventListener('input', (e) => {
      state.sunAngle = parseFloat(e.target.value);
      document.getElementById('sunAngleValue').textContent = state.sunAngle;
      draw();
    });

    document.getElementById('dropletSize').addEventListener('input', (e) => {
      state.dropletSize = parseFloat(e.target.value);
      document.getElementById('dropletSizeValue').textContent = state.dropletSize.toFixed(1);
      draw();
    });

    document.getElementById('lightType').addEventListener('change', (e) => {
      state.lightType = e.target.value;
      draw();
    });

    document.getElementById('rayTraceToggle').addEventListener('click', () => {
      state.rayTrace = !state.rayTrace;
      const btn = document.getElementById('rayTraceToggle');
      btn.textContent = 'Ray Trace: ' + (state.rayTrace ? 'ON' : 'OFF');
      btn.classList.toggle('active', state.rayTrace);
      draw();
    });

    // Initial draw
    draw();
  </script>
</body>
</html>
