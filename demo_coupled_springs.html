<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonic Resonance</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: rgba(26, 31, 58, 0.8);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 16px;
            padding: 30px;
            max-width: 900px;
            width: 100%;
            backdrop-filter: blur(8px);
        }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            margin-bottom: 8px;
            color: #00d9ff;
        }
        .subtitle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 24px;
        }
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 20px;
        }
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
        .animation-box {
            background: rgba(0, 13, 40, 0.6);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            border: 1px solid rgba(0, 255, 153, 0.2);
            border-radius: 8px;
            background: rgba(10, 14, 39, 0.8);
            width: 100%;
            max-width: 400px;
            height: 300px;
            margin-bottom: 12px;
        }
        .controls {
            background: rgba(0, 13, 40, 0.6);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .control-label {
            font-size: 13px;
            font-weight: 600;
            color: #00ff99;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .control-value {
            font-size: 24px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            color: #00d9ff;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(0, 217, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d9ff, #00ff99);
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 217, 255, 0.6);
        }
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d9ff, #00ff99);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 12px rgba(0, 217, 255, 0.6);
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }
        .stat-item {
            background: rgba(0, 255, 153, 0.1);
            border: 1px solid rgba(0, 255, 153, 0.3);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .stat-label {
            font-size: 11px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 18px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            color: #00ff99;
        }
        .info-box {
            grid-column: 1 / -1;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 12px;
            padding: 16px;
            font-size: 13px;
            line-height: 1.6;
            color: #e0e0e0;
        }
        .info-label {
            color: #ff6b6b;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Harmonic Resonance</h1>
        <p class="subtitle">Real 2D coupled oscillator with spring physics</p>
        
        <div class="content">
            <div class="animation-box">
                <canvas id="canvas" width="400" height="300"></canvas>
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-label">Max Speed</div>
                        <div class="stat-value" id="maxSpeed">0.0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Avg Speed</div>
                        <div class="stat-value" id="avgSpeed">0.0</div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label class="control-label">Spring 1 (k₁)</label>
                    <div class="control-value" id="k1Val">0.15</div>
                    <input type="range" id="k1" min="0.05" max="0.5" step="0.05" value="0.15">
                </div>

                <div class="control-group">
                    <label class="control-label">Spring 2 (k₂)</label>
                    <div class="control-value" id="k2Val">0.15</div>
                    <input type="range" id="k2" min="0.05" max="0.5" step="0.05" value="0.15">
                </div>

                <div class="control-group">
                    <label class="control-label">Damping (c)</label>
                    <div class="control-value" id="cVal">0.02</div>
                    <input type="range" id="c" min="0" max="0.1" step="0.01" value="0.02">
                </div>

                <div class="control-group">
                    <label class="control-label">Excitation Freq</label>
                    <div class="control-value" id="fVal">1.0</div>
                    <input type="range" id="f" min="0.5" max="3.0" step="0.1" value="1.0">
                </div>

                <div class="info-box">
                    <span class="info-label">💡 Tip:</span> When excitation frequency matches natural frequency, resonance builds amplitude. Try adjusting k₁ vs k₂ to detune.
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Physics params
        let params = {
            k1: 0.15,
            k2: 0.15,
            c: 0.02,
            f: 1.0
        };
        
        // Particle states
        let p1 = { x: -60, vx: 0, ax: 0 };
        let p2 = { x: 60, vx: 0, ax: 0 };
        
        // History for speed stats
        let speedHistory = [];
        const maxHistoryLen = 120;
        
        // Time
        let t = 0;
        const dt = 0.016; // ~60fps
        
        // UI
        document.getElementById('k1').addEventListener('input', (e) => {
            params.k1 = parseFloat(e.target.value);
            document.getElementById('k1Val').textContent = params.k1.toFixed(2);
        });
        
        document.getElementById('k2').addEventListener('input', (e) => {
            params.k2 = parseFloat(e.target.value);
            document.getElementById('k2Val').textContent = params.k2.toFixed(2);
        });
        
        document.getElementById('c').addEventListener('input', (e) => {
            params.c = parseFloat(e.target.value);
            document.getElementById('cVal').textContent = params.c.toFixed(2);
        });
        
        document.getElementById('f').addEventListener('input', (e) => {
            params.f = parseFloat(e.target.value);
            document.getElementById('fVal').textContent = params.f.toFixed(2);
        });
        
        function rk4Step() {
            // RK4 integration for coupled oscillators
            // Spring 1: from center (0), Spring 2: connection between p1 and p2
            
            function derivs(st) {
                let ax1 = -params.k1 * st.x1 - params.k2 * (st.x1 - st.x2) - params.c * st.vx1 + 50 * Math.sin(2 * Math.PI * params.f * t);
                let ax2 = -params.k2 * (st.x2 - st.x1) - params.c * st.vx2;
                return { vx1: st.vx1, ax1: ax1, vx2: st.vx2, ax2: ax2 };
            }
            
            const state = { x1: p1.x, vx1: p1.vx, x2: p2.x, vx2: p2.vx };
            
            const k1 = derivs(state);
            const s2 = { x1: state.x1 + 0.5*dt*k1.vx1, vx1: state.vx1 + 0.5*dt*k1.ax1, 
                         x2: state.x2 + 0.5*dt*k1.vx2, vx2: state.vx2 + 0.5*dt*k1.ax2 };
            const k2 = derivs(s2);
            const s3 = { x1: state.x1 + 0.5*dt*k2.vx1, vx1: state.vx1 + 0.5*dt*k2.ax1,
                         x2: state.x2 + 0.5*dt*k2.vx2, vx2: state.vx2 + 0.5*dt*k2.ax2 };
            const k3 = derivs(s3);
            const s4 = { x1: state.x1 + dt*k3.vx1, vx1: state.vx1 + dt*k3.ax1,
                         x2: state.x2 + dt*k3.vx2, vx2: state.vx2 + dt*k3.ax2 };
            const k4 = derivs(s4);
            
            p1.x = state.x1 + (dt/6) * (k1.vx1 + 2*k2.vx1 + 2*k3.vx1 + k4.vx1);
            p1.vx = state.vx1 + (dt/6) * (k1.ax1 + 2*k2.ax1 + 2*k3.ax1 + k4.ax1);
            p2.x = state.x2 + (dt/6) * (k1.vx2 + 2*k2.vx2 + 2*k3.vx2 + k4.vx2);
            p2.vx = state.vx2 + (dt/6) * (k1.ax2 + 2*k2.ax2 + 2*k3.ax2 + k4.ax2);
            
            // Record speeds
            let speed = (Math.abs(p1.vx) + Math.abs(p2.vx)) / 2;
            speedHistory.push(speed);
            if (speedHistory.length > maxHistoryLen) speedHistory.shift();
            
            t += dt;
        }
        
        function draw() {
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const scale = 2;
            
            // Clear
            ctx.fillStyle = 'rgba(10, 14, 39, 0.95)';
            ctx.fillRect(0, 0, w, h);
            
            // Center anchor
            ctx.fillStyle = 'rgba(0, 217, 255, 0.4)';
            ctx.beginPath();
            ctx.arc(cx, cy, 6, 0, 2*Math.PI);
            ctx.fill();
            
            // Spring from center to p1
            ctx.strokeStyle = 'rgba(0, 255, 153, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + p1.x * scale, cy);
            ctx.stroke();
            
            // Spring from p1 to p2
            ctx.strokeStyle = 'rgba(255, 107, 107, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx + p1.x * scale, cy);
            ctx.lineTo(cx + p2.x * scale, cy);
            ctx.stroke();
            
            // Particle 1
            ctx.fillStyle = '#00ff99';
            ctx.beginPath();
            ctx.arc(cx + p1.x * scale, cy, 8, 0, 2*Math.PI);
            ctx.fill();
            
            // Particle 2
            ctx.fillStyle = '#00d9ff';
            ctx.beginPath();
            ctx.arc(cx + p2.x * scale, cy, 8, 0, 2*Math.PI);
            ctx.fill();
            
            // Velocity vectors
            ctx.strokeStyle = 'rgba(255, 107, 107, 0.6)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx + p1.x * scale, cy);
            ctx.lineTo(cx + p1.x * scale + p1.vx * 20, cy);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(cx + p2.x * scale, cy);
            ctx.lineTo(cx + p2.x * scale + p2.vx * 20, cy);
            ctx.stroke();
            
            // Update stats
            if (speedHistory.length > 0) {
                let maxSpeed = Math.max(...speedHistory);
                let avgSpeed = speedHistory.reduce((a, b) => a + b, 0) / speedHistory.length;
                document.getElementById('maxSpeed').textContent = maxSpeed.toFixed(2);
                document.getElementById('avgSpeed').textContent = avgSpeed.toFixed(2);
            }
        }
        
        function animate() {
            rk4Step();
            draw();
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
