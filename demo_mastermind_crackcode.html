<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastermind — Crack the Code</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1f36 0%, #2d2d4a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }
        .container {
            background: rgba(26, 31, 54, 0.95);
            border: 2px solid #4da8da;
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-family: 'Fraunces', serif;
            font-size: 32px;
            margin-bottom: 8px;
            text-align: center;
            color: #4da8da;
        }
        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .controls {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #3a4a6a;
        }
        .control-group {
            margin-bottom: 15px;
        }
        .control-label {
            font-size: 12px;
            text-transform: uppercase;
            color: #aaa;
            margin-bottom: 6px;
            display: block;
        }
        .difficulty-toggle {
            display: flex;
            gap: 8px;
        }
        button {
            font-family: 'Inter', sans-serif;
            padding: 8px 14px;
            border: 1px solid #4da8da;
            background: transparent;
            color: #4da8da;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }
        button:hover {
            background: #4da8da;
            color: #1a1f36;
        }
        button.active {
            background: #4da8da;
            color: #1a1f36;
        }
        .new-game-btn {
            width: 100%;
            padding: 10px;
            background: #4ade80;
            color: #000;
            border: none;
            font-weight: 600;
            margin-top: 5px;
        }
        .new-game-btn:hover {
            background: #22c55e;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
            font-size: 12px;
        }
        .stat-box {
            background: rgba(77, 168, 218, 0.1);
            border: 1px solid #4da8da;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #4da8da;
            margin-bottom: 3px;
        }
        .stat-label {
            color: #888;
            font-size: 11px;
        }
        .game-board {
            margin-bottom: 20px;
        }
        .guess-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }
        .guess-number {
            color: #666;
            font-size: 11px;
            width: 25px;
            text-align: right;
            font-weight: 600;
        }
        .guess-slots {
            display: flex;
            gap: 6px;
            flex: 1;
        }
        .color-slot {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.3);
        }
        .color-slot:hover {
            border-color: #aaa;
            transform: scale(1.05);
        }
        .color-slot.selected {
            border-color: #fff;
        }
        .slot-red { background: #ef4444; }
        .slot-blue { background: #3b82f6; }
        .slot-green { background: #22c55e; }
        .slot-yellow { background: #eab308; }
        .slot-orange { background: #f97316; }
        .slot-purple { background: #a855f7; }
        .slot-empty {
            background: rgba(100,100,100,0.3);
            border-color: #555;
        }
        .feedback {
            display: flex;
            gap: 4px;
            justify-content: center;
        }
        .peg {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid #333;
        }
        .peg-black { background: #000; }
        .peg-white { background: #fff; }
        .peg-blank { background: rgba(100,100,100,0.2); }
        .color-picker {
            display: none;
            position: fixed;
            background: #1a1f36;
            border: 2px solid #4da8da;
            border-radius: 12px;
            padding: 12px;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
        }
        .color-picker.show {
            display: grid;
        }
        .color-option {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .color-option:hover {
            border-color: #fff;
            transform: scale(1.1);
        }
        .action-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 15px;
        }
        .guess-btn {
            flex: 1;
            padding: 10px;
            background: #4da8da;
            color: #000;
            border: none;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .guess-btn:hover:not(:disabled) {
            background: #2d9ec9;
        }
        .guess-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .info-panel {
            background: rgba(77, 168, 218, 0.05);
            border: 1px solid #4da8da;
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            color: #ccc;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        .info-panel strong {
            color: #4da8da;
        }
        .banner {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1f36;
            border: 3px solid #4da8da;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            z-index: 2000;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8);
            max-width: 400px;
        }
        .banner.show {
            display: block;
        }
        .banner h2 {
            font-family: 'Fraunces', serif;
            font-size: 36px;
            margin-bottom: 15px;
        }
        .banner.win h2 { color: #4ade80; }
        .banner.loss h2 { color: #ff6b6b; }
        .banner p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .banner button {
            width: 100%;
            padding: 12px;
            background: #4da8da;
            color: #000;
            border: none;
            font-weight: 600;
            font-size: 14px;
        }
        .help-toggle {
            font-size: 12px;
            color: #4da8da;
            cursor: pointer;
            text-decoration: underline;
            display: block;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Mastermind</h1>
        <p class="subtitle">Crack the secret 4-color code</p>

        <div class="controls">
            <div class="control-group">
                <label class="control-label">Difficulty</label>
                <div class="difficulty-toggle">
                    <button class="difficulty-btn active" data-mode="easy">Easy (Random)</button>
                    <button class="difficulty-btn" data-mode="optimal">Optimal</button>
                </div>
            </div>
            <button class="new-game-btn">New Game</button>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-value" id="guessCount">0</div>
                <div class="stat-label">Guesses Used</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="remaining">10</div>
                <div class="stat-label">Remaining</div>
            </div>
        </div>

        <div class="info-panel">
            <strong>How to play:</strong> Click color slots to build your guess. <strong>Black pegs</strong> = right color, right position. <strong>White pegs</strong> = right color, wrong position.
        </div>

        <div class="game-board" id="gameBoard"></div>

        <div class="action-buttons">
            <button class="guess-btn" id="submitBtn" disabled>Submit Guess</button>
        </div>

        <div class="help-toggle" id="helpToggle">Show the math</div>
    </div>

    <div class="color-picker" id="colorPicker"></div>
    <div class="banner" id="banner"></div>

    <script>
        const COLORS = ['red', 'blue', 'green', 'yellow', 'orange', 'purple'];
        const COLOR_VALUES = {
            red: 0, blue: 1, green: 2, yellow: 3, orange: 4, purple: 5
        };
        const COLOR_NAMES = {
            0: 'Red', 1: 'Blue', 2: 'Green', 3: 'Yellow', 4: 'Orange', 5: 'Purple'
        };

        let gameState = {
            secret: [],
            guesses: [],
            feedback: [],
            gameOver: false,
            won: false,
            difficulty: 'easy',
            currentGuess: [null, null, null, null],
            selectedSlotIdx: null
        };

        function generateSecret(difficulty) {
            return Array.from({length: 4}, () => Math.floor(Math.random() * 6));
        }

        function calculateFeedback(secret, guess) {
            let black = 0, white = 0;
            const secretCopy = [...secret];
            const guessCopy = [...guess];

            for (let i = 0; i < 4; i++) {
                if (guessCopy[i] === secretCopy[i]) {
                    black++;
                    secretCopy[i] = -1;
                    guessCopy[i] = -1;
                }
            }

            for (let i = 0; i < 4; i++) {
                if (guessCopy[i] !== -1) {
                    if (secretCopy.includes(guessCopy[i])) {
                        white++;
                        secretCopy[secretCopy.indexOf(guessCopy[i])] = -1;
                    }
                }
            }

            return { black, white };
        }

        function newGame() {
            gameState = {
                secret: generateSecret(gameState.difficulty),
                guesses: [],
                feedback: [],
                gameOver: false,
                won: false,
                difficulty: gameState.difficulty,
                currentGuess: [null, null, null, null],
                selectedSlotIdx: null
            };
            render();
        }

        function submitGuess() {
            if (gameState.currentGuess.includes(null) || gameState.gameOver) return;

            const feedback = calculateFeedback(gameState.secret, gameState.currentGuess);
            gameState.guesses.push([...gameState.currentGuess]);
            gameState.feedback.push(feedback);

            if (feedback.black === 4) {
                gameState.won = true;
                gameState.gameOver = true;
                showBanner('win', `You Won! Guesses: ${gameState.guesses.length}`);
            } else if (gameState.guesses.length >= 10) {
                gameState.gameOver = true;
                showBanner('loss', `Game Over! Code was: ${gameState.secret.map(c => COLOR_NAMES[c]).join(', ')}`);
            }

            gameState.currentGuess = [null, null, null, null];
            render();
        }

        function showBanner(type, message) {
            const banner = document.getElementById('banner');
            const verb = type === 'win' ? 'Won!' : 'Lost!';
            banner.className = `banner show ${type}`;
            banner.innerHTML = `
                <h2>${verb}</h2>
                <p>${message}</p>
                <button onclick="location.reload()">Play Again</button>
            `;
        }

        function render() {
            document.getElementById('guessCount').textContent = gameState.guesses.length;
            document.getElementById('remaining').textContent = 10 - gameState.guesses.length;

            const board = document.getElementById('gameBoard');
            board.innerHTML = '';

            for (let i = 0; i < 10; i++) {
                const row = document.createElement('div');
                row.className = 'guess-row';

                const num = document.createElement('div');
                num.className = 'guess-number';
                num.textContent = i + 1;
                row.appendChild(num);

                const slots = document.createElement('div');
                slots.className = 'guess-slots';

                for (let j = 0; j < 4; j++) {
                    const slot = document.createElement('div');

                    if (i < gameState.guesses.length) {
                        const color = gameState.guesses[i][j];
                        slot.className = `color-slot slot-${COLORS[color]}`;
                    } else if (i === gameState.guesses.length) {
                        if (gameState.currentGuess[j] !== null) {
                            slot.className = `color-slot slot-${COLORS[gameState.currentGuess[j]]}`;
                            if (gameState.selectedSlotIdx === j) slot.classList.add('selected');
                        } else {
                            slot.className = 'color-slot slot-empty';
                        }
                        slot.onclick = () => openColorPicker(j);
                    } else {
                        slot.className = 'color-slot slot-empty';
                    }

                    slots.appendChild(slot);
                }

                row.appendChild(slots);

                const feedback = document.createElement('div');
                feedback.className = 'feedback';
                if (i < gameState.feedback.length) {
                    const fb = gameState.feedback[i];
                    for (let k = 0; k < fb.black; k++) {
                        const peg = document.createElement('div');
                        peg.className = 'peg peg-black';
                        feedback.appendChild(peg);
                    }
                    for (let k = 0; k < fb.white; k++) {
                        const peg = document.createElement('div');
                        peg.className = 'peg peg-white';
                        feedback.appendChild(peg);
                    }
                    for (let k = 0; k < 4 - fb.black - fb.white; k++) {
                        const peg = document.createElement('div');
                        peg.className = 'peg peg-blank';
                        feedback.appendChild(peg);
                    }
                }
                row.appendChild(feedback);

                board.appendChild(row);
            }

            const canSubmit = gameState.currentGuess.every(c => c !== null) && !gameState.gameOver;
            document.getElementById('submitBtn').disabled = !canSubmit;
        }

        function openColorPicker(slotIdx) {
            gameState.selectedSlotIdx = slotIdx;
            const picker = document.getElementById('colorPicker');
            picker.className = 'color-picker show';
            picker.innerHTML = '';

            COLORS.forEach((color, idx) => {
                const option = document.createElement('div');
                option.className = `color-option slot-${color}`;
                option.onclick = () => {
                    gameState.currentGuess[slotIdx] = idx;
                    picker.className = 'color-picker';
                    render();
                };
                picker.appendChild(option);
            });

            picker.style.left = '50%';
            picker.style.top = '50%';
            picker.style.transform = 'translate(-50%, -50%)';
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.color-picker') && !e.target.closest('.color-slot')) {
                document.getElementById('colorPicker').className = 'color-picker';
            }
        });

        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                gameState.difficulty = btn.dataset.mode;
                newGame();
            };
        });

        document.querySelector('.new-game-btn').onclick = newGame;
        document.getElementById('submitBtn').onclick = submitGuess;

        document.getElementById('helpToggle').onclick = () => {
            const panel = document.querySelector('.info-panel');
            if (panel.textContent.includes('How to play')) {
                panel.innerHTML = '<strong>The Math:</strong> Black peg = exact match (color + position correct). White peg = color correct but wrong position. If code is [Red, Blue, Green, Yellow] and you guess [Red, Blue, Yellow, Green], you get 2 black (Red, Blue exact) and 2 white (Green, Yellow in code but misplaced).';
            } else {
                panel.innerHTML = '<strong>How to play:</strong> Click color slots to build your guess. <strong>Black pegs</strong> = right color, right position. <strong>White pegs</strong> = right color, wrong position.';
            }
        };

        newGame();
    </script>
</body>
</html>
