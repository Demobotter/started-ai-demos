<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooking Heat Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1f3a 0%, #0f0e27 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(20, 20, 40, 0.8);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 150, 255, 0.2);
        }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff6b9d 0%, #ffd93d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            color: #a0a0c0;
            margin-bottom: 30px;
            font-size: 1rem;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #d0d0f0;
            font-size: 0.95rem;
        }
        input[type="number"], select {
            padding: 12px 16px;
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 8px;
            background: rgba(30, 30, 60, 0.8);
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: all 0.2s;
        }
        input[type="number"]:focus, select:focus {
            outline: none;
            border-color: #ff6b9d;
            box-shadow: 0 0 10px rgba(255, 107, 157, 0.3);
            background: rgba(40, 40, 80, 0.9);
        }
        .preset-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .preset-btn {
            padding: 8px 12px;
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 6px;
            background: rgba(100, 150, 255, 0.1);
            color: #a0d0ff;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .preset-btn:hover {
            background: rgba(100, 150, 255, 0.25);
            border-color: rgba(100, 150, 255, 0.6);
        }
        .preset-btn.active {
            background: rgba(255, 107, 157, 0.3);
            border-color: #ff6b9d;
            color: #ff6b9d;
        }
        .heat-viz {
            background: rgba(30, 30, 60, 0.5);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(100, 150, 255, 0.2);
        }
        canvas {
            width: 100%;
            height: auto;
            margin-bottom: 16px;
            border-radius: 8px;
            display: block;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }
        .stat-card {
            background: rgba(255, 107, 157, 0.1);
            border: 1px solid rgba(255, 107, 157, 0.3);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }
        .stat-label {
            font-size: 0.85rem;
            color: #a0a0c0;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ff6b9d;
            font-family: 'Syne', sans-serif;
        }
        .info-box {
            background: rgba(100, 200, 255, 0.1);
            border-left: 3px solid #64c8ff;
            border-radius: 6px;
            padding: 16px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #c0d8ff;
            line-height: 1.5;
        }
        .unit-toggle {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .unit-btn {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 6px;
            background: rgba(100, 150, 255, 0.1);
            color: #a0d0ff;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .unit-btn.active {
            background: rgba(100, 150, 255, 0.3);
            border-color: #64c8ff;
            color: #64c8ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍳 Cooking Heat</h1>
        <div class="subtitle">Visualize how temperature penetrates your food in real time.</div>

        <div class="grid">
            <div>
                <div class="input-group">
                    <label for="foodType">Food Type</label>
                    <select id="foodType">
                        <option value="beef">Beef Steak</option>
                        <option value="chicken">Chicken Breast</option>
                        <option value="pork">Pork Chop</option>
                        <option value="fish">Fish Fillet</option>
                        <option value="vegetable">Vegetable</option>
                    </select>
                </div>

                <div class="input-group" style="margin-top: 16px;">
                    <label for="targetTemp">Target Temperature</label>
                    <div class="unit-toggle">
                        <button class="unit-btn active" data-unit="F">°F</button>
                        <button class="unit-btn" data-unit="C">°C</button>
                    </div>
                    <input type="number" id="targetTemp" value="160" min="130" max="210">
                    <div class="preset-buttons" id="presets"></div>
                </div>

                <div class="input-group" style="margin-top: 16px;">
                    <label for="cookTime">Cook Time (minutes)</label>
                    <input type="number" id="cookTime" value="15" min="1" max="60">
                </div>

                <div class="input-group" style="margin-top: 16px;">
                    <label for="thickness">Thickness (cm)</label>
                    <input type="number" id="thickness" value="3" min="1" max="10" step="0.5">
                </div>
            </div>

            <div class="heat-viz">
                <canvas id="heatCanvas" width="300" height="300"></canvas>
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-label">Center Temp</div>
                        <div class="stat-value" id="centerTemp">62°</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Doneness</div>
                        <div class="stat-value" id="doneness">Rare</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="info-box" id="infoBox">
            Adjust thickness and cook time to see how heat penetrates. Real thermal diffusivity based on food type.
        </div>
    </div>

    <script>
        const FOOD_SPECS = {
            beef: {
                thermalDiffusivity: 1.5e-7,
                presets: [
                    { name: 'Rare', temp: 125 },
                    { name: 'Med-Rare', temp: 135 },
                    { name: 'Medium', temp: 145 },
                    { name: 'Med-Well', temp: 155 },
                    { name: 'Well-Done', temp: 160 }
                ]
            },
            chicken: {
                thermalDiffusivity: 1.4e-7,
                presets: [
                    { name: 'Safe', temp: 165 }
                ]
            },
            pork: {
                thermalDiffusivity: 1.45e-7,
                presets: [
                    { name: 'Safe', temp: 145 }
                ]
            },
            fish: {
                thermalDiffusivity: 1.55e-7,
                presets: [
                    { name: 'Cooked', temp: 145 }
                ]
            },
            vegetable: {
                thermalDiffusivity: 1.2e-7,
                presets: [
                    { name: 'Tender', temp: 85 },
                    { name: 'Soft', temp: 95 }
                ]
            }
        };

        let state = {
            foodType: 'beef',
            targetTemp: 160,
            cookTime: 15,
            thickness: 3,
            unitF: true
        };

        const canvas = document.getElementById('heatCanvas');
        const ctx = canvas.getContext('2d');
        const foodSelect = document.getElementById('foodType');
        const targetInput = document.getElementById('targetTemp');
        const cookTimeInput = document.getElementById('cookTime');
        const thicknessInput = document.getElementById('thickness');

        function updatePresets() {
            const specs = FOOD_SPECS[state.foodType];
            const container = document.getElementById('presets');
            container.innerHTML = specs.presets.map(p => 
                `<button class="preset-btn" onclick="setPreset(${p.temp})">${p.name}</button>`
            ).join('');
        }

        function setPreset(temp) {
            state.targetTemp = temp;
            targetInput.value = temp;
            update();
        }

        function convertTemp(celsius, toF) {
            return toF ? Math.round(celsius * 9/5 + 32) : Math.round(celsius);
        }

        function heatDiffusionAt(x, t, L, k) {
            // 1D heat equation solution for slab: T(x,t) = T_surface - (T_surface - T_initial) * erf(x / (2 * sqrt(k*t)))
            // Simplified: heat penetration increases with sqrt(k*t)
            const penetration = Math.sqrt(k * t);
            const distance = x; // from surface
            return Math.exp(-distance * distance / (4 * penetration + 1));
        }

        function renderHeat() {
            const specs = FOOD_SPECS[state.foodType];
            const L = state.thickness / 100; // convert cm to meters for math
            const t = state.cookTime * 60; // convert minutes to seconds
            const k = specs.thermalDiffusivity;

            const roomTemp = 20; // °C
            const targetC = state.unitF ? (state.targetTemp - 32) * 5/9 : state.targetTemp;
            const surfaceTemp = targetC;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const w = canvas.width;
            const h = canvas.height;
            const padding = 40;
            const innerW = w - 2 * padding;
            const innerH = h - 2 * padding;

            // Draw heat gradient (cross-section of meat)
            const gradient = ctx.createLinearGradient(padding, 0, padding + innerW, 0);
            const steps = 100;
            for (let i = 0; i <= steps; i++) {
                const ratio = i / steps;
                const depth = ratio * L;
                const heatFactor = heatDiffusionAt(depth, t, L, k);
                const tempAtDepth = roomTemp + (surfaceTemp - roomTemp) * heatFactor;
                const normalizedTemp = Math.max(0, Math.min(1, (tempAtDepth - roomTemp) / (surfaceTemp - roomTemp)));
                
                const hue = (1 - normalizedTemp) * 240; // blue to red
                const color = `hsl(${hue}, 80%, 50%)`;
                gradient.addColorStop(ratio, color);
            }
            ctx.fillStyle = gradient;
            ctx.fillRect(padding, padding, innerW, innerH * 0.6);

            // Draw center marker
            const centerX = padding + innerW / 2;
            const centerHeatFactor = heatDiffusionAt(L / 2, t, L, k);
            const centerTemp = roomTemp + (surfaceTemp - roomTemp) * centerHeatFactor;
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(centerX, padding + innerH * 0.3, 8, 0, Math.PI * 2);
            ctx.fill();

            // Labels
            ctx.fillStyle = '#a0a0c0';
            ctx.font = 'bold 12px Inter';
            ctx.textAlign = 'center';
            ctx.fillText('Surface (Hot)', padding + innerW / 4, padding + innerH * 0.7 + 20);
            ctx.fillText('Center (Cool)', padding + innerW * 3/4, padding + innerH * 0.7 + 20);

            // Update center temp display
            const displayTemp = state.unitF ? convertTemp(centerTemp, true) : Math.round(centerTemp);
            document.getElementById('centerTemp').textContent = displayTemp + '°';

            // Determine doneness
            let doneness = 'Raw';
            if (state.foodType === 'beef') {
                if (centerTemp >= 71) doneness = 'Well-Done';
                else if (centerTemp >= 68) doneness = 'Med-Well';
                else if (centerTemp >= 63) doneness = 'Medium';
                else if (centerTemp >= 59) doneness = 'Med-Rare';
                else if (centerTemp >= 54) doneness = 'Rare';
            } else if (state.foodType === 'chicken' || state.foodType === 'pork') {
                doneness = centerTemp >= 74 ? 'Safe' : 'Not Safe';
            } else if (state.foodType === 'fish') {
                doneness = centerTemp >= 63 ? 'Cooked' : 'Raw';
            } else if (state.foodType === 'vegetable') {
                doneness = centerTemp >= 35 ? 'Tender' : 'Raw';
            }
            document.getElementById('doneness').textContent = doneness;

            // Update info box
            const surfaceDisplay = state.unitF ? convertTemp(surfaceTemp, true) : Math.round(surfaceTemp);
            document.getElementById('infoBox').innerHTML = 
                `Food: <strong>${state.foodType}</strong> • Thickness: <strong>${state.thickness}cm</strong> • Cook time: <strong>${state.cookTime}min</strong> • Surface: <strong>${surfaceDisplay}°</strong> • Heat diffusion is real thermal physics.`;
        }

        function update() {
            renderHeat();
        }

        // Event listeners
        foodSelect.addEventListener('change', (e) => {
            state.foodType = e.target.value;
            updatePresets();
            update();
        });
        targetInput.addEventListener('input', (e) => {
            state.targetTemp = parseInt(e.target.value) || 160;
            update();
        });
        cookTimeInput.addEventListener('input', (e) => {
            state.cookTime = parseInt(e.target.value) || 15;
            update();
        });
        thicknessInput.addEventListener('input', (e) => {
            state.thickness = parseFloat(e.target.value) || 3;
            update();
        });

        document.querySelectorAll('.unit-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.unitF = btn.dataset.unit === 'F';
                update();
            });
        });

        // Init
        updatePresets();
        update();
    </script>
</body>
</html>
