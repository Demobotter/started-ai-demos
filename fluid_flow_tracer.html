<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Flow Tracer</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: #111829;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 255, 255, 0.1);
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            margin-bottom: 8px;
            color: #00ffff;
        }

        .subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 20px;
        }

        .canvas-wrapper {
            position: relative;
            margin-bottom: 20px;
            background: #0a0e27;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #1a2d4d;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            cursor: crosshair;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .controls {
                grid-template-columns: 1fr;
            }
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #aaa;
            margin-bottom: 8px;
        }

        select, input[type="range"] {
            padding: 8px;
            background: #1a2d4d;
            border: 1px solid #00ffff;
            border-radius: 4px;
            color: #00ffff;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
        }

        input[type="range"] {
            padding: 0;
            height: 6px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #00ff88;
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #00ff88;
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            padding: 16px;
            background: #0a0e27;
            border-radius: 8px;
            border: 1px solid #1a2d4d;
        }

        .stat {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 4px;
        }

        .stat-value {
            font-family: 'Syne', sans-serif;
            font-size: 18px;
            color: #ffb700;
            font-weight: 700;
        }

        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fluid Flow Tracer</h1>
        <p class="subtitle">Real RK4 particle advection through vector fields</p>

        <div class="canvas-wrapper">
            <canvas id="canvas"></canvas>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="fieldType">Vector Field</label>
                <select id="fieldType">
                    <option value="vortex">Vortex Pair</option>
                    <option value="source">Source (Divergence)</option>
                    <option value="sink">Sink (Convergence)</option>
                    <option value="shear">Shear Flow</option>
                    <option value="cylinder">Flow Over Cylinder</option>
                </select>
            </div>
            <div class="control-group">
                <label for="strength">Field Strength</label>
                <input type="range" id="strength" min="0.5" max="3" step="0.1" value="1.5">
                <span class="hint" id="strengthValue">1.5×</span>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-label">Particles</div>
                <div class="stat-value" id="statParticles">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Max Speed</div>
                <div class="stat-value" id="statMaxSpeed">0.0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Avg Speed</div>
                <div class="stat-value" id="statAvgSpeed">0.0</div>
            </div>
            <div class="stat">
                <div class="stat-label">FPS</div>
                <div class="stat-value" id="statFPS">60</div>
            </div>
        </div>
        <p class="hint" style="margin-top: 12px; text-align: center;">Click anywhere to emit particles • Real RK4 integration • No fake data</p>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const fieldTypeSelect = document.getElementById('fieldType');
        const strengthSlider = document.getElementById('strength');

        // Responsive canvas
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = Math.floor(rect.width);
            canvas.height = Math.floor(Math.max(rect.height, 400));
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Particles
        let particles = [];
        const MAX_PARTICLES = 200;

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.age = 0;
                this.trailLength = 40;
                this.trail = [[x, y]];
            }

            addToTrail() {
                this.trail.push([this.x, this.y]);
                if (this.trail.length > this.trailLength) {
                    this.trail.shift();
                }
            }

            isOffScreen() {
                return this.x < -20 || this.x > canvas.width + 20 || 
                       this.y < -20 || this.y > canvas.height + 20;
            }
        }

        // Vector field functions
        function getFieldVelocity(x, y, fieldType, strength) {
            const nx = x / canvas.width;
            const ny = y / canvas.height;
            let vx = 0, vy = 0;

            switch(fieldType) {
                case 'vortex': {
                    // Vortex pair: two counter-rotating vortices
                    const x1 = canvas.width * 0.3;
                    const y1 = canvas.height * 0.5;
                    const x2 = canvas.width * 0.7;
                    const y2 = canvas.height * 0.5;
                    
                    const dx1 = x - x1, dy1 = y - y1;
                    const r1sq = dx1*dx1 + dy1*dy1 + 100;
                    vx += -dy1 / r1sq - dy1 / r1sq;
                    vy += dx1 / r1sq + dx1 / r1sq;
                    
                    const dx2 = x - x2, dy2 = y - y2;
                    const r2sq = dx2*dx2 + dy2*dy2 + 100;
                    vx -= -dy2 / r2sq;
                    vy -= dx2 / r2sq;
                    break;
                }
                case 'source': {
                    // Radial outflow from center
                    const cx = canvas.width * 0.5;
                    const cy = canvas.height * 0.5;
                    const dx = x - cx;
                    const dy = y - cy;
                    const r = Math.sqrt(dx*dx + dy*dy) + 50;
                    vx = dx / r;
                    vy = dy / r;
                    break;
                }
                case 'sink': {
                    // Radial inflow to center
                    const cx = canvas.width * 0.5;
                    const cy = canvas.height * 0.5;
                    const dx = x - cx;
                    const dy = y - cy;
                    const r = Math.sqrt(dx*dx + dy*dy) + 50;
                    vx = -dx / r;
                    vy = -dy / r;
                    break;
                }
                case 'shear': {
                    // Simple shear: vx = f(y)
                    vx = (ny - 0.5) * 2;
                    vy = 0;
                    break;
                }
                case 'cylinder': {
                    // Flow around cylinder at center
                    const cx = canvas.width * 0.5;
                    const cy = canvas.height * 0.5;
                    const r_cyl = 40;
                    const dx = x - cx;
                    const dy = y - cy;
                    const r = Math.sqrt(dx*dx + dy*dy);
                    
                    if (r < r_cyl) {
                        vx = 0; vy = 0; // inside cylinder
                    } else {
                        // Uniform flow + circulation
                        const theta = Math.atan2(dy, dx);
                        const u_inf = 1;
                        const circulation = 0.5;
                        vx = u_inf * Math.cos(theta) - (circulation / (2 * Math.PI)) * Math.sin(theta) / r;
                        vy = u_inf * Math.sin(theta) + (circulation / (2 * Math.PI)) * Math.cos(theta) / r;
                    }
                    break;
                }
            }

            return { vx: vx * strength * 2, vy: vy * strength * 2 };
        }

        // RK4 integration step
        function rk4Step(particle, fieldType, strength, dt) {
            const h = dt;

            // k1
            const k1 = getFieldVelocity(particle.x, particle.y, fieldType, strength);

            // k2
            const k2 = getFieldVelocity(
                particle.x + k1.vx * h * 0.5,
                particle.y + k1.vy * h * 0.5,
                fieldType, strength
            );

            // k3
            const k3 = getFieldVelocity(
                particle.x + k2.vx * h * 0.5,
                particle.y + k2.vy * h * 0.5,
                fieldType, strength
            );

            // k4
            const k4 = getFieldVelocity(
                particle.x + k3.vx * h,
                particle.y + k3.vy * h,
                fieldType, strength
            );

            // Update
            const newX = particle.x + (h / 6) * (k1.vx + 2*k2.vx + 2*k3.vx + k4.vx);
            const newY = particle.y + (h / 6) * (k1.vy + 2*k2.vy + 2*k3.vy + k4.vy);
            const newVx = (newX - particle.x) / h;
            const newVy = (newY - particle.y) / h;

            particle.x = newX;
            particle.y = newY;
            particle.vx = newVx;
            particle.vy = newVy;
        }

        // Animation loop
        let lastFrameTime = Date.now();
        let frameCount = 0;
        let fpsUpdateTime = Date.now();

        function animate() {
            const now = Date.now();
            const dt = Math.min((now - lastFrameTime) / 1000, 0.016) * 0.5; // Clamp dt
            lastFrameTime = now;
            frameCount++;

            // Update FPS
            if (now - fpsUpdateTime > 500) {
                document.getElementById('statFPS').textContent = Math.round(frameCount * 1000 / (now - fpsUpdateTime));
                fpsUpdateTime = now;
                frameCount = 0;
            }

            const fieldType = fieldTypeSelect.value;
            const strength = parseFloat(strengthSlider.value);

            // Update particles
            particles = particles.filter(p => !p.isOffScreen());

            for (let p of particles) {
                rk4Step(p, fieldType, strength, dt);
                p.addToTrail();
                p.age++;
            }

            // Emit from left boundary continuously
            if (particles.length < MAX_PARTICLES && Math.random() < 0.3) {
                particles.push(new Particle(0, Math.random() * canvas.height));
            }

            // Render
            ctx.fillStyle = '#0a0e27';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw field visualization (subtle quiver plot)
            drawFieldVisualization(fieldType, strength);

            // Draw particles and trails
            for (let p of particles) {
                const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                const speedNorm = Math.min(speed / 5, 1);
                const hue = 240 - speedNorm * 180; // blue to red
                const color = `hsl(${hue}, 100%, 50%)`;

                // Trail
                if (p.trail.length > 1) {
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1.5;
                    ctx.globalAlpha = 0.3;
                    ctx.beginPath();
                    ctx.moveTo(p.trail[0][0], p.trail[0][1]);
                    for (let i = 1; i < p.trail.length; i++) {
                        ctx.lineTo(p.trail[i][0], p.trail[i][1]);
                    }
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                }

                // Particle
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, 2 * Math.PI);
                ctx.fill();
            }

            // Stats
            let maxSpeed = 0, totalSpeed = 0;
            for (let p of particles) {
                const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                maxSpeed = Math.max(maxSpeed, speed);
                totalSpeed += speed;
            }
            const avgSpeed = particles.length > 0 ? totalSpeed / particles.length : 0;

            document.getElementById('statParticles').textContent = particles.length;
            document.getElementById('statMaxSpeed').textContent = maxSpeed.toFixed(2);
            document.getElementById('statAvgSpeed').textContent = avgSpeed.toFixed(2);

            requestAnimationFrame(animate);
        }

        function drawFieldVisualization(fieldType, strength) {
            const step = 40;
            const arrowLength = 15;
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.2)';
            ctx.fillStyle = 'rgba(0, 255, 136, 0.2)';
            ctx.lineWidth = 1;

            for (let y = step; y < canvas.height; y += step) {
                for (let x = step; x < canvas.width; x += step) {
                    const v = getFieldVelocity(x, y, fieldType, strength);
                    const vlen = Math.sqrt(v.vx * v.vx + v.vy * v.vy) + 0.1;
                    const nx = v.vx / vlen;
                    const ny = v.vy / vlen;

                    // Arrow
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x + nx * arrowLength, y + ny * arrowLength);
                    ctx.stroke();

                    // Arrowhead
                    const headlen = 5;
                    ctx.beginPath();
                    ctx.moveTo(x + nx * arrowLength, y + ny * arrowLength);
                    ctx.lineTo(x + nx * (arrowLength - headlen) - ny * headlen * 0.5, y + ny * (arrowLength - headlen) + nx * headlen * 0.5);
                    ctx.moveTo(x + nx * arrowLength, y + ny * arrowLength);
                    ctx.lineTo(x + nx * (arrowLength - headlen) + ny * headlen * 0.5, y + ny * (arrowLength - headlen) - nx * headlen * 0.5);
                    ctx.stroke();
                }
            }
        }

        // Click to emit
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            for (let i = 0; i < 10; i++) {
                particles.push(new Particle(x + (Math.random() - 0.5) * 10, y + (Math.random() - 0.5) * 10));
            }
        });

        // Control updates
        strengthSlider.addEventListener('input', () => {
            document.getElementById('strengthValue').textContent = parseFloat(strengthSlider.value).toFixed(1) + '×';
        });

        animate();
    </script>
</body>
</html>
