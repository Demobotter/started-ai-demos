<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Factor Scout</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(135deg, #0a1d4a 0%, #0f2a5f 100%);
      font-family: 'Space Mono', monospace;
      color: #e0e7ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      background: rgba(10, 29, 74, 0.95);
      border: 2px solid #4ade80;
      border-radius: 12px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 0 40px rgba(74, 222, 128, 0.2);
    }
    
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.4em;
      color: #4ade80;
      margin-bottom: 10px;
      text-align: center;
    }
    
    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 30px;
      font-size: 0.95em;
    }
    
    .input-section {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }
    
    input[type="number"] {
      flex: 1;
      padding: 14px;
      font-family: 'Space Mono', monospace;
      font-size: 1em;
      background: #1f4d7f;
      border: 2px solid #4ade80;
      color: #4ade80;
      border-radius: 8px;
      transition: all 0.2s;
    }
    
    input[type="number"]:focus {
      outline: none;
      border-color: #7dd3fc;
      box-shadow: 0 0 10px rgba(125, 211, 252, 0.3);
    }
    
    input[type="number"]::placeholder {
      color: #4ade8088;
    }
    
    button {
      padding: 14px 28px;
      font-family: 'Space Mono', monospace;
      font-size: 1em;
      font-weight: 700;
      background: #4ade80;
      color: #0a1d4a;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    
    button:hover {
      background: #7dd3fc;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(125, 211, 252, 0.4);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    .result-section {
      display: none;
      margin-top: 30px;
      padding: 20px;
      background: rgba(31, 77, 127, 0.5);
      border-left: 4px solid #7dd3fc;
      border-radius: 8px;
    }
    
    .result-section.show {
      display: block;
      animation: slideIn 0.3s ease-out;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .number-display {
      font-size: 1.8em;
      color: #fbbf24;
      margin-bottom: 15px;
      text-align: center;
      font-weight: 700;
    }
    
    .factorization {
      font-size: 1.1em;
      color: #7dd3fc;
      margin-bottom: 10px;
      text-align: center;
      word-break: break-all;
      background: rgba(10, 29, 74, 0.8);
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #4ade80;
    }
    
    .factors-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 8px;
      margin-top: 15px;
    }
    
    .factor-badge {
      background: #1f4d7f;
      border: 2px solid #4ade80;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      color: #4ade80;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .factor-badge:hover {
      background: #2a5aa0;
      box-shadow: 0 0 10px rgba(74, 222, 128, 0.4);
    }
    
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }
    
    .stat {
      background: rgba(10, 29, 74, 0.8);
      padding: 10px;
      border-radius: 6px;
      border-left: 3px solid #fbbf24;
    }
    
    .stat-label {
      font-size: 0.85em;
      color: #9ca3af;
      margin-bottom: 5px;
    }
    
    .stat-value {
      font-size: 1.2em;
      color: #fbbf24;
      font-weight: 700;
    }
    
    .insight {
      margin-top: 15px;
      padding: 12px;
      background: rgba(74, 222, 128, 0.1);
      border-left: 3px solid #4ade80;
      border-radius: 6px;
      color: #d1fae5;
      font-size: 0.95em;
      line-height: 1.4;
    }
    
    .error {
      color: #ff6b6b;
      padding: 12px;
      background: rgba(255, 107, 107, 0.1);
      border-left: 3px solid #ff6b6b;
      border-radius: 6px;
      margin-top: 15px;
    }
    
    .history {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #4ade8044;
    }
    
    .history-title {
      font-size: 0.9em;
      color: #9ca3af;
      margin-bottom: 10px;
    }
    
    .history-items {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .history-item {
      padding: 6px 12px;
      background: #1f4d7f;
      border: 1px solid #7dd3fc;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9em;
      color: #7dd3fc;
      transition: all 0.2s;
    }
    
    .history-item:hover {
      background: #2a5aa0;
      box-shadow: 0 0 8px rgba(125, 211, 252, 0.3);
    }
    
    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }
      
      h1 {
        font-size: 2em;
      }
      
      .stats {
        grid-template-columns: 1fr;
      }
      
      .factors-list {
        grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Prime Factor Scout</h1>
    <div class="subtitle">Decode any number's hidden structure</div>
    
    <div class="input-section">
      <input 
        type="number" 
        id="numberInput" 
        placeholder="Enter a number (2-999999999)"
        min="2"
        max="999999999"
        value="84"
      >
      <button onclick="factorize()">Analyze</button>
    </div>
    
    <div class="result-section" id="resultSection">
      <div class="number-display" id="numberDisplay"></div>
      <div class="factorization" id="factorization"></div>
      
      <div class="factors-list" id="factorsList"></div>
      
      <div class="stats">
        <div class="stat">
          <div class="stat-label">Prime factors</div>
          <div class="stat-value" id="primeCount">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Unique factors</div>
          <div class="stat-value" id="uniqueCount">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Type</div>
          <div class="stat-value" id="typeLabel">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">Divisors</div>
          <div class="stat-value" id="divisorCount">0</div>
        </div>
      </div>
      
      <div class="insight" id="insight"></div>
    </div>
    
    <div id="errorContainer"></div>
    
    <div class="history" id="historyContainer" style="display: none;">
      <div class="history-title">Recent numbers:</div>
      <div class="history-items" id="historyItems"></div>
    </div>
  </div>
  
  <script>
    // Prime factorization using trial division
    function primeFactorize(n) {
      if (n < 2) return [];
      const factors = [];
      let divisor = 2;
      while (divisor * divisor <= n) {
        while (n % divisor === 0) {
          factors.push(divisor);
          n /= divisor;
        }
        divisor++;
      }
      if (n > 1) factors.push(n);
      return factors;
    }
    
    // Check if prime
    function isPrime(n) {
      if (n < 2) return false;
      if (n === 2) return true;
      if (n % 2 === 0) return false;
      for (let i = 3; i * i <= n; i += 2) {
        if (n % i === 0) return false;
      }
      return true;
    }
    
    // Count unique divisors from prime factorization
    function countDivisors(factors) {
      const freq = {};
      for (const f of factors) {
        freq[f] = (freq[f] || 0) + 1;
      }
      let count = 1;
      for (const exp of Object.values(freq)) {
        count *= (exp + 1);
      }
      return count;
    }
    
    // Format factorization as product
    function formatFactorization(factors) {
      if (factors.length === 0) return 'N/A';
      const freq = {};
      for (const f of factors) {
        freq[f] = (freq[f] || 0) + 1;
      }
      const parts = Object.keys(freq)
        .map(p => freq[p] === 1 ? p : `${p}²`)
        .sort((a, b) => parseInt(a) - parseInt(b));
      return parts.join(' × ');
    }
    
    // History management
    let history = JSON.parse(localStorage.getItem('primeHistory') || '[]');
    
    function addToHistory(num) {
      history = history.filter(x => x !== num);
      history.unshift(num);
      if (history.length > 8) history.pop();
      localStorage.setItem('primeHistory', JSON.stringify(history));
      updateHistory();
    }
    
    function updateHistory() {
      const container = document.getElementById('historyContainer');
      const items = document.getElementById('historyItems');
      if (history.length === 0) {
        container.style.display = 'none';
        return;
      }
      container.style.display = 'block';
      items.innerHTML = history.map(num => 
        `<div class="history-item" onclick="document.getElementById('numberInput').value = ${num}; factorize()">${num}</div>`
      ).join('');
    }
    
    function factorize() {
      const input = parseInt(document.getElementById('numberInput').value);
      const errorContainer = document.getElementById('errorContainer');
      errorContainer.innerHTML = '';
      
      if (isNaN(input) || input < 2) {
        errorContainer.innerHTML = '<div class="error">Please enter a number ≥ 2</div>';
        document.getElementById('resultSection').classList.remove('show');
        return;
      }
      
      if (input > 999999999) {
        errorContainer.innerHTML = '<div class="error">Number too large (max 999,999,999)</div>';
        document.getElementById('resultSection').classList.remove('show');
        return;
      }
      
      // Compute factorization
      const factors = primeFactorize(input);
      const unique = [...new Set(factors)];
      const divisors = countDivisors(factors);
      const prime = isPrime(input);
      
      // Display results
      document.getElementById('numberDisplay').textContent = input.toLocaleString();
      document.getElementById('factorization').textContent = prime ? 'Prime number' : formatFactorization(factors);
      document.getElementById('primeCount').textContent = factors.length;
      document.getElementById('uniqueCount').textContent = unique.length;
      document.getElementById('typeLabel').textContent = prime ? 'Prime' : 'Composite';
      document.getElementById('divisorCount').textContent = divisors;
      
      // Factor badges
      const factorsList = document.getElementById('factorsList');
      factorsList.innerHTML = unique
        .sort((a, b) => a - b)
        .map(f => {
          const count = factors.filter(x => x === f).length;
          return `<div class="factor-badge" title="Factor ${f} appears ${count}×">${f}${count > 1 ? `<sup>${count}</sup>` : ''}</div>`;
        })
        .join('');
      
      // Insight
      const insightEl = document.getElementById('insight');
      if (prime) {
        insightEl.textContent = `${input} cannot be broken into smaller factors—it's a prime number. Only divisible by 1 and itself.`;
      } else if (factors.length === 1) {
        insightEl.textContent = `${input} is a prime power (a prime multiplied by itself ${factors.length} time).`;
      } else if (unique.length === 1) {
        const base = unique[0];
        insightEl.textContent = `${input} = ${base}^${factors.length}. A pure power of ${base}.`;
      } else {
        insightEl.textContent = `${input} has ${unique.length} distinct prime factors. It can be divided by ${divisors} different numbers (including 1 and itself).`;
      }
      
      document.getElementById('resultSection').classList.add('show');
      addToHistory(input);
    }
    
    // Auto-factorize on load
    updateHistory();
    factorize();
    
    // Enter key support
    document.getElementById('numberInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') factorize();
    });
  </script>
</body>
</html>
