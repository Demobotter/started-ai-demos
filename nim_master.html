<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nim Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a1428 0%, #1a2847 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            background: #0f1f3a;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid #2a4a7f;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #4da8da 0%, #a8dadc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            font-size: 0.95rem;
            color: #9ca3af;
            margin-bottom: 25px;
        }
        .game-board {
            background: #1a2f4a;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid #2a4a7f;
        }
        .pile {
            margin-bottom: 18px;
            padding: 12px;
            background: rgba(45, 85, 130, 0.3);
            border-radius: 6px;
            border: 1px solid #2a5a9f;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pile:hover {
            background: rgba(77, 168, 218, 0.2);
            border-color: #4da8da;
        }
        .pile.selected {
            background: rgba(77, 168, 218, 0.4);
            border-color: #4da8da;
            box-shadow: 0 0 10px rgba(77, 168, 218, 0.3);
        }
        .pile-label {
            font-size: 0.85rem;
            color: #4da8da;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .objects {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .object {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #4da8da, #a8dadc);
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(77, 168, 218, 0.4);
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }
        .stat {
            background: rgba(45, 85, 130, 0.3);
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #4da8da;
        }
        .stat-label {
            color: #9ca3af;
            font-size: 0.8rem;
            margin-bottom: 4px;
        }
        .stat-value {
            font-weight: 600;
            color: #4da8da;
            font-size: 1.1rem;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            min-width: 90px;
            padding: 10px 15px;
            background: #2a5a9f;
            border: 1px solid #4da8da;
            color: #4da8da;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #4da8da;
            color: #0a1428;
            box-shadow: 0 4px 12px rgba(77, 168, 218, 0.3);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-danger {
            background: #8b3a3a;
            border-color: #d26a6a;
            color: #d26a6a;
        }
        .btn-danger:hover {
            background: #d26a6a;
            color: #0a1428;
        }
        .message {
            background: rgba(77, 168, 218, 0.1);
            border: 1px solid #4da8da;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .message.error {
            background: rgba(210, 106, 106, 0.1);
            border-color: #d26a6a;
            color: #e0a0a0;
        }
        .message.success {
            background: rgba(76, 175, 80, 0.1);
            border-color: #4caf50;
            color: #a8d5a8;
        }
        .turn-indicator {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            padding: 12px;
            background: rgba(45, 85, 130, 0.4);
            border-radius: 6px;
            border-left: 4px solid #4da8da;
        }
        .turn-indicator.ai {
            border-left-color: #d26a6a;
        }
        .difficulty-section {
            margin-bottom: 20px;
        }
        .difficulty-label {
            font-size: 0.85rem;
            color: #9ca3af;
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }
        .difficulty-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }
        .diff-btn {
            padding: 8px 12px;
            background: #2a5a9f;
            border: 1px solid #2a5a9f;
            color: #9ca3af;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .diff-btn.active {
            background: #4da8da;
            border-color: #4da8da;
            color: #0a1428;
        }
        .diff-btn:hover {
            border-color: #4da8da;
            color: #4da8da;
        }
        .removal-controls {
            background: rgba(45, 85, 130, 0.3);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #2a5a9f;
        }
        .removal-label {
            font-size: 0.9rem;
            color: #9ca3af;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .removal-input-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .removal-input {
            flex: 1;
            padding: 8px 12px;
            background: #0f1f3a;
            border: 1px solid #2a5a9f;
            color: #4da8da;
            border-radius: 4px;
            font-weight: 600;
        }
        .removal-input:focus {
            outline: none;
            border-color: #4da8da;
            box-shadow: 0 0 6px rgba(77, 168, 218, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Nim Master</h1>
        <p class="subtitle">Can you beat the AI at the ancient game of Nim?</p>

        <div class="difficulty-section">
            <label class="difficulty-label">AI Difficulty:</label>
            <div class="difficulty-buttons">
                <button class="diff-btn" onclick="setDifficulty('easy')">Easy</button>
                <button class="diff-btn active" onclick="setDifficulty('medium')">Medium</button>
                <button class="diff-btn" onclick="setDifficulty('hard')">Hard</button>
            </div>
        </div>

        <div id="message"></div>
        <div id="turn-indicator" class="turn-indicator">👤 Your turn</div>

        <div class="game-board">
            <div id="piles"></div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-label">Nim-Sum</div>
                <div class="stat-value" id="nimsum">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Objects Left</div>
                <div class="stat-value" id="total">15</div>
            </div>
            <div class="stat">
                <div class="stat-label">Your Wins</div>
                <div class="stat-value" id="wins">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">AI Wins</div>
                <div class="stat-value" id="losses">0</div>
            </div>
        </div>

        <div id="removal-section" class="removal-controls" style="display:none;">
            <div class="removal-label" id="removal-label"></div>
            <div class="removal-input-group">
                <input type="number" id="removal-count" class="removal-input" min="1" placeholder="How many?">
                <button class="btn" onclick="submitRemoval()">Take</button>
            </div>
        </div>

        <div class="controls">
            <button class="btn" onclick="resetGame()">New Game</button>
            <button class="btn btn-danger" onclick="resetStats()">Reset Stats</button>
        </div>
    </div>

    <script>
        let gameState = {
            piles: [3, 5, 7],
            selectedPile: null,
            isPlayerTurn: true,
            wins: 0,
            losses: 0,
            difficulty: 'medium',
            gameOver: false,
            aiMoving: false
        };

        function nimSum() {
            return gameState.piles.reduce((a, b) => a ^ b, 0);
        }

        function findWinningMove() {
            const currentNimSum = nimSum();
            if (currentNimSum === 0) return null;

            for (let i = 0; i < gameState.piles.length; i++) {
                const targetSize = gameState.piles[i] ^ currentNimSum;
                if (targetSize < gameState.piles[i]) {
                    return { pile: i, remove: gameState.piles[i] - targetSize };
                }
            }
            return null;
        }

        function getTotalObjects() {
            return gameState.piles.reduce((a, b) => a + b, 0);
        }

        function checkGameEnd() {
            const total = getTotalObjects();
            if (total === 0) {
                gameState.gameOver = true;
                if (!gameState.isPlayerTurn) {
                    // AI took the last object, player wins
                    gameState.wins++;
                    showMessage('✅ You win! AI was forced to take the last object.', 'success');
                } else {
                    // Player took the last object, AI wins
                    gameState.losses++;
                    showMessage('❌ AI wins! You took the last object.', 'error');
                }
                document.getElementById('removal-section').style.display = 'none';
                return true;
            }
            return false;
        }

        function aiMove() {
            if (gameState.isPlayerTurn || gameState.gameOver || gameState.aiMoving) return;

            gameState.aiMoving = true;
            gameState.isPlayerTurn = false;
            updateTurnIndicator();

            // Schedule AI move with a small delay for UX
            setTimeout(() => {
                if (gameState.gameOver) return;

                let move;
                const shouldPlay = gameState.difficulty === 'medium' || gameState.difficulty === 'hard' || Math.random() > 0.5;

                if (shouldPlay) {
                    move = findWinningMove();
                } else {
                    // Random move for Easy
                    const validPiles = gameState.piles.map((size, i) => size > 0 ? i : -1).filter(i => i >= 0);
                    if (validPiles.length > 0) {
                        const pileIdx = validPiles[Math.floor(Math.random() * validPiles.length)];
                        const removeCount = Math.floor(Math.random() * gameState.piles[pileIdx]) + 1;
                        move = { pile: pileIdx, remove: removeCount };
                    }
                }

                if (move && move.remove > 0 && move.remove <= gameState.piles[move.pile]) {
                    gameState.piles[move.pile] -= move.remove;
                    if (!checkGameEnd()) {
                        gameState.isPlayerTurn = true;
                    }
                }
                gameState.aiMoving = false;
                updateTurnIndicator();
                render();
            }, 600);
        }

        function selectPile(index) {
            if (!gameState.isPlayerTurn || gameState.gameOver || gameState.piles[index] === 0) return;
            gameState.selectedPile = index;
            document.getElementById('removal-label').textContent = `Pile ${index + 1} has ${gameState.piles[index]} objects. How many do you take?`;
            document.getElementById('removal-count').value = '1';
            document.getElementById('removal-count').max = gameState.piles[index];
            document.getElementById('removal-section').style.display = 'block';
            document.getElementById('removal-count').focus();
            render();
        }

        function submitRemoval() {
            if (gameState.selectedPile === null) return;
            const count = parseInt(document.getElementById('removal-count').value);
            if (isNaN(count) || count < 1 || count > gameState.piles[gameState.selectedPile]) {
                showMessage('⚠️ Invalid number. Please try again.', 'error');
                return;
            }

            gameState.piles[gameState.selectedPile] -= count;
            document.getElementById('removal-section').style.display = 'none';
            gameState.selectedPile = null;
            showMessage('');

            if (!checkGameEnd()) {
                gameState.isPlayerTurn = false;
                setTimeout(aiMove, 100);
            }
            render();
        }

        function setDifficulty(level) {
            gameState.difficulty = level;
            document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function resetGame() {
            gameState.piles = [3, 5, 7];
            gameState.selectedPile = null;
            gameState.isPlayerTurn = true;
            gameState.gameOver = false;
            gameState.aiMoving = false;
            document.getElementById('removal-section').style.display = 'none';
            showMessage('');
            render();
        }

        function resetStats() {
            gameState.wins = 0;
            gameState.losses = 0;
            resetGame();
        }

        function updateTurnIndicator() {
            const indicator = document.getElementById('turn-indicator');
            if (gameState.gameOver) {
                indicator.style.display = 'none';
            } else if (gameState.isPlayerTurn) {
                indicator.className = 'turn-indicator';
                indicator.textContent = '👤 Your turn';
            } else {
                indicator.className = 'turn-indicator ai';
                indicator.textContent = '🤖 AI is thinking...';
            }
        }

        function showMessage(text, type = 'info') {
            const msg = document.getElementById('message');
            if (!text) {
                msg.innerHTML = '';
                return;
            }
            msg.className = 'message ' + type;
            msg.textContent = text;
        }

        function render() {
            // Render piles
            const pilesDiv = document.getElementById('piles');
            pilesDiv.innerHTML = gameState.piles.map((size, i) => {
                const objects = Array(size).fill(0).map(() => '<div class="object"></div>').join('');
                const selected = gameState.selectedPile === i ? 'selected' : '';
                return `
                    <div class="pile ${selected}" onclick="selectPile(${i})">
                        <div class="pile-label">Pile ${i + 1}</div>
                        <div class="objects">${objects || '<span style="color:#6b7280;">Empty</span>'}</div>
                    </div>
                `;
            }).join('');

            // Update stats
            document.getElementById('nimsum').textContent = nimSum();
            document.getElementById('total').textContent = getTotalObjects();
            document.getElementById('wins').textContent = gameState.wins;
            document.getElementById('losses').textContent = gameState.losses;

            updateTurnIndicator();
        }

        // Initialize
        render();
    </script>
</body>
</html>
