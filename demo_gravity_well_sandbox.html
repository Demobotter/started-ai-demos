<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Well Sandbox</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #0f1419;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 255, 136, 0.1);
        }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            margin-bottom: 8px;
            color: #00ff88;
        }
        .subtitle {
            font-size: 14px;
            color: #8a8a9e;
            margin-bottom: 20px;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
            padding: 16px;
            background: rgba(0, 255, 136, 0.05);
            border-radius: 8px;
            border-left: 3px solid #00ff88;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .control-group label {
            font-size: 12px;
            font-weight: 600;
            color: #00ff88;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .control-group input[type="range"] {
            width: 100%;
            height: 5px;
            border-radius: 3px;
            background: #1a1f3a;
            outline: none;
            -webkit-appearance: none;
        }
        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00ff88;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.6);
        }
        .control-group input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00ff88;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.6);
        }
        .value-display {
            font-size: 12px;
            color: #ffb700;
            font-family: 'IBM Plex Mono', monospace;
        }
        #canvas {
            width: 100%;
            height: 600px;
            background: #000814;
            border: 1px solid #1a1f3a;
            border-radius: 8px;
            display: block;
            margin-bottom: 16px;
            cursor: crosshair;
        }
        .info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            padding: 12px;
            background: rgba(255, 183, 0, 0.08);
            border-radius: 6px;
            border-left: 3px solid #ffb700;
            font-size: 12px;
            color: #8a8a9e;
        }
        .info-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .info-item .label {
            color: #ffb700;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
        }
        .info-item .value {
            font-family: 'IBM Plex Mono', monospace;
            color: #e0e0e0;
            font-size: 13px;
        }
        .hint {
            margin-top: 12px;
            padding: 8px 12px;
            background: rgba(0, 255, 255, 0.05);
            border-radius: 6px;
            font-size: 12px;
            color: #4a90e2;
            border-left: 2px solid #4a90e2;
        }
        @media (max-width: 600px) {
            .controls {
                grid-template-columns: 1fr;
            }
            #canvas {
                height: 400px;
            }
            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛰️ Gravity Well Sandbox</h1>
        <p class="subtitle">Click to spawn masses, drag to set momentum. Real Newtonian physics.</p>
        
        <div class="controls">
            <div class="control-group">
                <label for="gravitySlider">Gravity Strength</label>
                <input type="range" id="gravitySlider" min="0.1" max="50" step="0.5" value="10">
                <span class="value-display" id="gravityValue">G: 10</span>
            </div>
            <div class="control-group">
                <label for="massSlider">Mass per Click</label>
                <input type="range" id="massSlider" min="0.5" max="10" step="0.5" value="3">
                <span class="value-display" id="massValue">m: 3</span>
            </div>
            <div class="control-group">
                <label for="dampingSlider">Damping</label>
                <input type="range" id="dampingSlider" min="0.9" max="1" step="0.01" value="0.98">
                <span class="value-display" id="dampingValue">d: 0.98</span>
            </div>
            <div class="control-group">
                <label for="clearBtn">Clear</label>
                <button id="clearBtn" style="padding: 8px; background: #ff3535; border: none; color: #fff; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px;">Reset All</button>
            </div>
        </div>

        <canvas id="canvas"></canvas>

        <div class="info">
            <div class="info-item">
                <span class="label">Masses</span>
                <span class="value" id="massCount">0</span>
            </div>
            <div class="info-item">
                <span class="label">Total Particles</span>
                <span class="value" id="particleCount">0</span>
            </div>
            <div class="info-item">
                <span class="label">Max Speed</span>
                <span class="value" id="maxSpeed">0.00</span>
            </div>
            <div class="info-item">
                <span class="label">Total KE</span>
                <span class="value" id="totalKE">0.00</span>
            </div>
        </div>

        <div class="hint">💡 Click to place a mass. Drag while clicking to give it initial momentum. Observe orbits and collisions.</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Resize canvas to fit container
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const canvasWidth = canvas.getBoundingClientRect().width;
        const canvasHeight = canvas.getBoundingClientRect().height;

        // UI controls
        const gravitySlider = document.getElementById('gravitySlider');
        const massSlider = document.getElementById('massSlider');
        const dampingSlider = document.getElementById('dampingSlider');
        const clearBtn = document.getElementById('clearBtn');
        const gravityValue = document.getElementById('gravityValue');
        const massValue = document.getElementById('massValue');
        const dampingValue = document.getElementById('dampingValue');

        gravitySlider.addEventListener('input', (e) => {
            gravityValue.textContent = `G: ${parseFloat(e.target.value).toFixed(1)}`;
        });
        massSlider.addEventListener('input', (e) => {
            massValue.textContent = `m: ${parseFloat(e.target.value).toFixed(1)}`;
        });
        dampingSlider.addEventListener('input', (e) => {
            dampingValue.textContent = `d: ${parseFloat(e.target.value).toFixed(2)}`;
        });

        let masses = []; // Array of {x, y, vx, vy, m, particles: [...]}
        let particles = [];
        let isDragging = false;
        let dragStart = {x: 0, y: 0};
        let dragEnd = {x: 0, y: 0};

        clearBtn.addEventListener('click', () => {
            masses = [];
            particles = [];
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            dragStart.x = e.clientX - rect.left;
            dragStart.y = e.clientY - rect.top;
            dragEnd.x = dragStart.x;
            dragEnd.y = dragStart.y;
            isDragging = true;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const rect = canvas.getBoundingClientRect();
                dragEnd.x = e.clientX - rect.left;
                dragEnd.y = e.clientY - rect.top;
            }
        });

        canvas.addEventListener('mouseup', () => {
            if (isDragging) {
                const m = parseFloat(massSlider.value);
                const vx = (dragEnd.x - dragStart.x) * 0.1;
                const vy = (dragEnd.y - dragStart.y) * 0.1;
                
                const mass = {
                    x: dragStart.x,
                    y: dragStart.y,
                    vx: vx,
                    vy: vy,
                    m: m,
                    particles: generateParticles(dragStart.x, dragStart.y, m)
                };
                masses.push(mass);
                particles = particles.concat(mass.particles);
                isDragging = false;
            }
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
        });

        function generateParticles(cx, cy, mass) {
            const count = Math.min(Math.floor(mass * 100), 300);
            const pts = [];
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * (10 + mass * 2);
                pts.push({
                    x: cx + Math.cos(angle) * radius,
                    y: cy + Math.sin(angle) * radius,
                    vx: 0,
                    vy: 0
                });
            }
            return pts;
        }

        function updatePhysics() {
            const G = parseFloat(gravitySlider.value);
            const damping = parseFloat(dampingSlider.value);

            // Apply gravity between all mass centers
            for (let i = 0; i < masses.length; i++) {
                for (let j = i + 1; j < masses.length; j++) {
                    const m1 = masses[i];
                    const m2 = masses[j];
                    const dx = m2.x - m1.x;
                    const dy = m2.y - m1.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 10) {
                        // Collision: merge
                        m1.m += m2.m;
                        m1.vx = (m1.vx * (m1.m - m2.m) + m2.vx * m2.m) / m1.m;
                        m1.vy = (m1.vy * (m1.m - m2.m) + m2.vy * m2.m) / m1.m;
                        m1.particles = m1.particles.concat(m2.particles);
                        masses.splice(j, 1);
                        j--;
                    } else if (dist > 1) {
                        // Newton's law: F = G * m1 * m2 / r^2
                        const force = G * m1.m * m2.m / (dist * dist);
                        const ax = (force / m1.m) * (dx / dist);
                        const ay = (force / m1.m) * (dy / dist);
                        m1.vx += ax * 0.016;
                        m1.vy += ay * 0.016;

                        const ax2 = -(force / m2.m) * (dx / dist);
                        const ay2 = -(force / m2.m) * (dy / dist);
                        m2.vx += ax2 * 0.016;
                        m2.vy += ay2 * 0.016;
                    }
                }
            }

            // Update mass positions and apply damping
            for (let i = 0; i < masses.length; i++) {
                masses[i].vx *= damping;
                masses[i].vy *= damping;
                masses[i].x += masses[i].vx;
                masses[i].y += masses[i].vy;

                // Bounds wrapping
                if (masses[i].x < 0) masses[i].x = canvasWidth;
                if (masses[i].x > canvasWidth) masses[i].x = 0;
                if (masses[i].y < 0) masses[i].y = canvasHeight;
                if (masses[i].y > canvasHeight) masses[i].y = 0;
            }

            // Update particle positions (follow their parent mass center)
            for (let i = 0; i < masses.length; i++) {
                const m = masses[i];
                for (let j = 0; j < m.particles.length; j++) {
                    const p = m.particles[j];
                    p.vx = p.vx * damping + m.vx * 0.1;
                    p.vy = p.vy * damping + m.vy * 0.1;
                    p.x += p.vx + m.vx * 0.016;
                    p.y += p.vy + m.vy * 0.016;
                }
            }
        }

        function render() {
            // Clear
            ctx.fillStyle = '#000814';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            // Draw grid
            ctx.strokeStyle = 'rgba(26, 31, 58, 0.5)';
            ctx.lineWidth = 0.5;
            for (let x = 0; x < canvasWidth; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvasHeight);
                ctx.stroke();
            }
            for (let y = 0; y < canvasHeight; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvasWidth, y);
                ctx.stroke();
            }

            // Draw particles
            for (let i = 0; i < masses.length; i++) {
                const m = masses[i];
                const hue = (i * 60) % 360;
                const particleColor = `hsl(${hue}, 100%, 50%)`;
                
                ctx.fillStyle = particleColor;
                for (let j = 0; j < m.particles.length; j++) {
                    const p = m.particles[j];
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Draw mass center (larger dot + glow)
                ctx.fillStyle = particleColor;
                ctx.shadowColor = particleColor;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(m.x, m.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Label mass
                ctx.fillStyle = particleColor;
                ctx.font = '11px Inter';
                ctx.fillText(`m${i + 1}`, m.x + 8, m.y - 8);
            }

            // Draw drag preview
            if (isDragging) {
                const dx = dragEnd.x - dragStart.x;
                const dy = dragEnd.y - dragStart.y;
                ctx.strokeStyle = 'rgba(0, 255, 136, 0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(dragStart.x, dragStart.y);
                ctx.lineTo(dragEnd.x, dragEnd.y);
                ctx.stroke();

                ctx.fillStyle = 'rgba(0, 255, 136, 0.2)';
                ctx.beginPath();
                ctx.arc(dragStart.x, dragStart.y, 6, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function updateStats() {
            let totalParticles = 0;
            let maxSpeed = 0;
            let totalKE = 0;

            for (let i = 0; i < masses.length; i++) {
                totalParticles += masses[i].particles.length;
                const speed = Math.sqrt(masses[i].vx ** 2 + masses[i].vy ** 2);
                maxSpeed = Math.max(maxSpeed, speed);
                totalKE += 0.5 * masses[i].m * (speed ** 2);
            }

            document.getElementById('massCount').textContent = masses.length;
            document.getElementById('particleCount').textContent = totalParticles;
            document.getElementById('maxSpeed').textContent = maxSpeed.toFixed(2);
            document.getElementById('totalKE').textContent = totalKE.toFixed(0);
        }

        function animate() {
            updatePhysics();
            render();
            updateStats();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
