<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volcanic Eruption Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            background: rgba(30, 30, 50, 0.95);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #ff6b35;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #b0b0c0;
            margin-bottom: 30px;
            font-size: 0.95em;
        }
        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }
        canvas {
            display: block;
            border: 2px solid #ff6b35;
            border-radius: 8px;
            background: #0a0a0f;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .control-group {
            background: rgba(50, 50, 70, 0.6);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ff6b35;
        }
        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9em;
            font-weight: bold;
            color: #ffb347;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #2a2a40;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff6b35;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.5);
        }
        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff6b35;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.5);
        }
        .value-display {
            display: inline-block;
            background: rgba(255, 107, 53, 0.2);
            padding: 4px 12px;
            border-radius: 4px;
            color: #ff6b35;
            font-weight: bold;
            margin-left: 8px;
        }
        select {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.4);
            color: #ffb347;
            border: 1px solid #ff6b35;
            border-radius: 4px;
            font-family: 'Space Mono', monospace;
            cursor: pointer;
            font-size: 0.9em;
        }
        button {
            padding: 12px 20px;
            background: #ff6b35;
            color: #1a1a2e;
            border: none;
            border-radius: 6px;
            font-family: 'Space Mono', monospace;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }
        button:hover {
            background: #ff8555;
            box-shadow: 0 0 15px rgba(255, 107, 53, 0.6);
        }
        button:active {
            transform: scale(0.95);
        }
        .stats {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #4da8da;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.85em;
        }
        .stat-item {
            padding: 8px;
            background: rgba(77, 168, 218, 0.1);
            border-radius: 4px;
            color: #4da8da;
        }
        .stat-label {
            color: #b0b0c0;
            font-size: 0.8em;
            margin-bottom: 2px;
        }
        .stat-value {
            font-weight: bold;
            color: #ffb347;
            font-size: 1.1em;
        }
        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }
            h1 { font-size: 1.8em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌋 Volcanic Eruption</h1>
        <p class="subtitle">Adjust intensity and watch magma flow down slopes, cool, and solidify in real time.</p>
        
        <div class="layout">
            <div>
                <canvas id="volcanoCanvas" width="400" height="600"></canvas>
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <label>Eruption Intensity <span class="value-display" id="intensityValue">50%</span></label>
                    <input type="range" id="intensity" min="0" max="100" value="50" step="5">
                </div>

                <div class="control-group">
                    <label>Slope Angle <span class="value-display" id="slopeValue">25°</span></label>
                    <input type="range" id="slope" min="10" max="60" value="25" step="5">
                </div>

                <div class="control-group">
                    <label>Eruption Style</label>
                    <select id="style">
                        <option value="hawaiian">Hawaiian (Smooth Flow)</option>
                        <option value="strombolian" selected>Strombolian (Explosive)</option>
                        <option value="plinian">Plinian (Catastrophic)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Magma Temperature <span class="value-display" id="tempValue">1050°C</span></label>
                    <input type="range" id="temperature" min="700" max="1200" value="1050" step="50">
                </div>

                <button onclick="resetSimulation()">Reset Simulation</button>

                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-label">Peak Ash Height</div>
                        <div class="stat-value" id="ashHeight">2.5 km</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Flow Distance</div>
                        <div class="stat-value" id="flowDistance">8.2 km</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Active Particles</div>
                        <div class="stat-value" id="particleCount">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Avg Velocity</div>
                        <div class="stat-value" id="avgVelocity">0 m/s</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Viscosity</div>
                        <div class="stat-value" id="viscosity">Mid</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Damage Zone</div>
                        <div class="stat-value" id="damageZone">5.1 km</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('volcanoCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        // Physics constants
        const GRAVITY = 0.3;
        const COOLING_RATE = 0.4;
        const FRICTION = 0.92;

        // Particle system
        let particles = [];
        let stats = {
            peakAshHeight: 0,
            maxFlowDist: 0,
            avgVel: 0,
            damageZone: 0
        };

        // Volcano geometry (cone shape)
        const craterX = width / 2;
        const craterY = height * 0.2;
        const baseX = width / 2;
        const baseY = height * 0.85;

        // Get UI values
        function getParams() {
            const intensity = parseInt(document.getElementById('intensity').value);
            const slope = parseInt(document.getElementById('slope').value);
            const style = document.getElementById('style').value;
            const temperature = parseInt(document.getElementById('temperature').value);
            return { intensity, slope, style, temperature };
        }

        // Calculate viscosity from temperature (Arrhenius-like)
        // Lower temp = higher viscosity, higher temp = lower viscosity
        function calcViscosity(temp) {
            // Normalized: 700°C → high viscosity, 1200°C → low viscosity
            return Math.pow(10, -0.006 * (temp - 700));
        }

        // Particle class
        class LavaParticle {
            constructor(x, y, vx, vy, temp, style) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.temp = temp;
                this.maxTemp = temp;
                this.age = 0;
                this.style = style;
                this.radius = style === 'hawaiian' ? 3 : style === 'strombolian' ? 4 : 5;
            }

            update() {
                // Gravity
                this.vy += GRAVITY;

                // Friction from air/ground
                this.vx *= FRICTION;
                this.vy *= FRICTION;

                // Update position
                this.x += this.vx;
                this.y += this.vy;

                // Cooling
                this.temp -= COOLING_RATE;
                this.age++;

                // Terrain collision (simple ground at baseY)
                if (this.y >= baseY - 10) {
                    this.vy = 0;
                    this.y = baseY - 10;
                    this.vx *= 0.7;
                }
            }

            isAlive() {
                return this.temp > 200 && this.age < 500;
            }

            getColor() {
                // Color mapping: hot (red) → cooling (orange) → solidifying (brown) → solid (gray)
                const normalizedTemp = Math.max(0, this.temp - 200) / (this.maxTemp - 200);
                
                if (normalizedTemp > 0.7) {
                    // Hot magma (red/orange)
                    return `hsl(${10 + normalizedTemp * 5}, 100%, ${30 + normalizedTemp * 20}%)`;
                } else if (normalizedTemp > 0.4) {
                    // Cooling (orange)
                    return `hsl(${25}, 100%, ${35 + (normalizedTemp - 0.4) * 30}%)`;
                } else {
                    // Solidifying (brown/gray)
                    return `hsl(${30}, 40%, ${20 + (normalizedTemp) * 50}%)`;
                }
            }
        }

        // Emit particles based on eruption style
        function eruptVolcano() {
            const { intensity, slope, style, temperature } = getParams();
            const particleCount = Math.floor(intensity * 0.5);
            const viscosity = calcViscosity(temperature);
            const slopeRad = (slope * Math.PI) / 180;

            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * 2 * Math.PI;
                const speed = intensity * 0.08 * (1 - viscosity * 0.5);
                const verticalBias = style === 'plinian' ? 0.8 : style === 'strombolian' ? 0.5 : 0.3;

                let vx = Math.cos(angle) * speed * (1 - verticalBias);
                let vy = -verticalBias * speed;

                // Add slope effect (downslope component)
                if (Math.random() > 0.3) {
                    vx += Math.sin(slopeRad) * speed * 0.3;
                    vy -= Math.cos(slopeRad) * speed * 0.2;
                }

                const particle = new LavaParticle(craterX, craterY, vx, vy, temperature, style);
                particles.push(particle);
            }

            // Track stats
            stats.peakAshHeight = Math.min(height * 0.8, intensity * 0.05 + 80);
            stats.damageZone = intensity * 0.08 + 30;
        }

        // Draw volcano cross-section
        function drawVolcano() {
            ctx.fillStyle = '#3a3a3a';
            ctx.beginPath();
            ctx.moveTo(craterX, craterY);
            ctx.lineTo(baseX - 150, baseY);
            ctx.lineTo(baseX + 150, baseY);
            ctx.closePath();
            ctx.fill();

            // Crater rim
            ctx.strokeStyle = '#5a5a5a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(craterX, craterY, 20, 0, 2 * Math.PI);
            ctx.stroke();

            // Magma chamber (underground)
            ctx.fillStyle = 'rgba(255, 107, 53, 0.1)';
            ctx.beginPath();
            ctx.arc(craterX, craterY + 120, 60, 0, 2 * Math.PI);
            ctx.fill();
        }

        // Draw damage zone
        function drawDamageZone() {
            const { intensity } = getParams();
            const damageRadius = intensity * 0.08 + 30;
            ctx.fillStyle = 'rgba(255, 50, 20, 0.05)';
            ctx.beginPath();
            ctx.arc(craterX, craterY, damageRadius, 0, 2 * Math.PI);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255, 50, 20, 0.3)';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // Draw ash column
        function drawAshColumn() {
            const { intensity } = getParams();
            const ashHeight = stats.peakAshHeight;
            ctx.fillStyle = `rgba(200, 200, 200, ${0.2 + intensity * 0.004})`;
            ctx.beginPath();
            ctx.ellipse(craterX, craterY - ashHeight * 0.5, 30 + intensity * 0.2, ashHeight, 0, 0, 2 * Math.PI);
            ctx.fill();
        }

        // Update and render
        function animate() {
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, width, height);

            // Draw volcano structure
            drawDamageZone();
            drawVolcano();
            drawAshColumn();

            // Erupt continuously (based on intensity)
            const { intensity } = getParams();
            if (Math.random() < intensity * 0.01) {
                eruptVolcano();
            }

            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();

                if (p.isAlive()) {
                    ctx.fillStyle = p.getColor();
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, 2 * Math.PI);
                    ctx.fill();
                } else {
                    particles.splice(i, 1);
                }
            }

            // Calculate stats
            updateStats();

            // Continue animation
            requestAnimationFrame(animate);
        }

        // Update displayed statistics
        function updateStats() {
            const { intensity, temperature } = getParams();
            const viscosity = calcViscosity(temperature);
            const avgVel = particles.reduce((sum, p) => sum + Math.hypot(p.vx, p.vy), 0) / (particles.length || 1);

            document.getElementById('particleCount').textContent = particles.length;
            document.getElementById('ashHeight').textContent = (stats.peakAshHeight / 100).toFixed(1) + ' km';
            document.getElementById('flowDistance').textContent = (intensity * 0.08 + 2).toFixed(1) + ' km';
            document.getElementById('avgVelocity').textContent = Math.floor(avgVel * 50) + ' m/s';
            document.getElementById('damageZone').textContent = (stats.damageZone / 100).toFixed(1) + ' km';
            
            // Viscosity label
            let viscLabel = 'High';
            if (viscosity < 0.3) viscLabel = 'Low';
            else if (viscosity < 0.6) viscLabel = 'Med-Low';
            else if (viscosity < 1.0) viscLabel = 'Med';
            else if (viscosity < 1.5) viscLabel = 'Med-High';
            document.getElementById('viscosity').textContent = viscLabel;
        }

        // Event listeners
        document.getElementById('intensity').addEventListener('input', (e) => {
            document.getElementById('intensityValue').textContent = e.target.value + '%';
        });
        document.getElementById('temperature').addEventListener('input', (e) => {
            document.getElementById('tempValue').textContent = e.target.value + '°C';
        });
        document.getElementById('slope').addEventListener('input', (e) => {
            document.getElementById('slopeValue').textContent = e.target.value + '°';
        });

        function resetSimulation() {
            particles = [];
        }

        // Start animation
        animate();
    </script>
</body>
</html>
