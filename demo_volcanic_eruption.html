<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volcanic Eruption</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Space Mono', monospace;
      background: #0a0e27;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 900px;
      width: 100%;
      background: #1a1f3a;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5em;
      margin-bottom: 8px;
      color: #ff6b35;
      text-align: center;
    }
    
    .subtitle {
      text-align: center;
      color: #b0b0b0;
      margin-bottom: 24px;
      font-size: 0.95em;
    }
    
    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }
    
    @media (max-width: 768px) {
      .content {
        grid-template-columns: 1fr;
      }
      
      h1 {
        font-size: 2em;
      }
    }
    
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #0f1420;
      border-radius: 8px;
      border: 1px solid #2d3561;
    }
    
    .controls {
      background: #242d4a;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #2d3561;
    }
    
    .control-group {
      margin-bottom: 18px;
    }
    
    .control-group:last-child {
      margin-bottom: 0;
    }
    
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9em;
      color: #ff6b35;
      font-weight: bold;
    }
    
    select, input[type="range"] {
      width: 100%;
      padding: 8px;
      background: #1a1f3a;
      color: #e0e0e0;
      border: 1px solid #2d3561;
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 0.9em;
    }
    
    input[type="range"] {
      padding: 0;
      height: 6px;
      cursor: pointer;
    }
    
    .value-display {
      display: inline-block;
      margin-left: 8px;
      color: #4da8da;
      font-weight: bold;
    }
    
    .stats {
      background: #242d4a;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #2d3561;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    
    .stat-box {
      background: #1a1f3a;
      padding: 12px;
      border-radius: 6px;
      border-left: 3px solid #ff6b35;
    }
    
    .stat-label {
      font-size: 0.8em;
      color: #b0b0b0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .stat-value {
      font-size: 1.2em;
      color: #ff6b35;
      font-weight: bold;
      margin-top: 4px;
      font-family: 'Playfair Display', serif;
    }
    
    button {
      width: 100%;
      padding: 10px;
      background: #ff6b35;
      color: #0a0e27;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-family: 'Space Mono', monospace;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s;
    }
    
    button:hover {
      background: #ff8555;
    }
    
    button:active {
      background: #ff5520;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌋 Volcanic Eruption</h1>
    <p class="subtitle">Adjust intensity and watch magma flow down slopes, cool, and solidify in real time</p>
    
    <div class="content">
      <div>
        <canvas id="volcanoCanvas" width="400" height="500"></canvas>
      </div>
      
      <div>
        <div class="controls">
          <div class="control-group">
            <label for="intensity">
              Eruption Intensity
              <span class="value-display" id="intensityValue">50%</span>
            </label>
            <input type="range" id="intensity" min="0" max="100" value="50">
          </div>
          
          <div class="control-group">
            <label for="eruption-style">
              Eruption Style
            </label>
            <select id="eruption-style">
              <option value="hawaiian">Hawaiian (smooth)</option>
              <option value="strombolian" selected>Strombolian (moderate)</option>
              <option value="plinian">Plinian (explosive)</option>
            </select>
          </div>
          
          <div class="control-group">
            <label for="slope">
              Slope Angle
              <span class="value-display" id="slopeValue">30°</span>
            </label>
            <input type="range" id="slope" min="5" max="60" value="30">
          </div>
          
          <button id="eruptBtn">ERUPT NOW</button>
        </div>
        
        <div class="stats">
          <div class="stat-box">
            <div class="stat-label">Temperature</div>
            <div class="stat-value" id="tempDisplay">800°C</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Flow Distance</div>
            <div class="stat-value" id="distanceDisplay">0m</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Viscosity</div>
            <div class="stat-value" id="viscosityDisplay">High</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Particles</div>
            <div class="stat-value" id="particleCount">0</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Canvas setup
    const canvas = document.getElementById('volcanoCanvas');
    const ctx = canvas.getContext('2d');
    
    // Control elements
    const intensitySlider = document.getElementById('intensity');
    const intensityValue = document.getElementById('intensityValue');
    const eruptionStyleSelect = document.getElementById('eruption-style');
    const slopeSlider = document.getElementById('slope');
    const slopeValue = document.getElementById('slopeValue');
    const eruptBtn = document.getElementById('eruptBtn');
    
    // Stat displays
    const tempDisplay = document.getElementById('tempDisplay');
    const distanceDisplay = document.getElementById('distanceDisplay');
    const viscosityDisplay = document.getElementById('viscosityDisplay');
    const particleCountDisplay = document.getElementById('particleCount');
    
    // Update display values
    intensitySlider.addEventListener('input', (e) => {
      intensityValue.textContent = e.target.value + '%';
    });
    
    slopeSlider.addEventListener('input', (e) => {
      slopeValue.textContent = e.target.value + '°';
    });
    
    // Volcano state
    let particles = [];
    let maxFlowDist = 0;
    let totalEmitted = 0;
    
    // Particle class
    class LavaParticle {
      constructor(x, y, vx, vy, temp, intensity) {
        this.x = x;
        this.y = y;
        this.vx = vx + (Math.random() - 0.5) * intensity * 0.02;
        this.vy = vy + (Math.random() - 0.5) * intensity * 0.02;
        this.temp = temp;
        this.initialTemp = temp;
        this.mass = Math.random() * 1 + 0.5;
        this.radius = Math.sqrt(this.mass) * 2;
        this.cooling = 0;
        this.solidified = false;
      }
      
      update(gravity, slope) {
        // Gravity
        this.vy += gravity;
        
        // Velocity from slope (accelerate downslope)
        const slopeRad = slope * Math.PI / 180;
        this.vx += Math.sin(slopeRad) * 0.15;
        this.vy += Math.cos(slopeRad) * 0.08;
        
        // Apply viscosity damping (higher temp = lower viscosity)
        const viscosityDamp = 1 - (this.temp - 700) / 500 * 0.05;
        this.vx *= viscosityDamp;
        this.vy *= viscosityDamp;
        
        // Cooling over time
        this.cooling += 0.3;
        this.temp = this.initialTemp - this.cooling;
        
        if (this.temp < 300) {
          this.solidified = true;
          this.vy = 0;
          this.vx *= 0.95;
        }
        
        // Update position
        this.x += this.vx;
        this.y += this.vy;
      }
      
      draw(ctx) {
        // Color based on temperature
        let r, g, b;
        if (this.temp > 1000) {
          // Bright orange-yellow
          r = 255;
          g = 200;
          b = 0;
        } else if (this.temp > 800) {
          // Orange
          r = 255;
          g = Math.floor((this.temp - 800) / 200 * 100 + 100);
          b = 0;
        } else if (this.temp > 500) {
          // Red-brown
          r = 255;
          g = Math.floor((this.temp - 500) / 300 * 50);
          b = 0;
        } else if (this.temp > 300) {
          // Dark brown
          r = 100 + Math.floor((this.temp - 300) / 200 * 100);
          g = 50;
          b = 0;
        } else {
          // Solidified gray
          r = 80;
          g = 80;
          b = 80;
        }
        
        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${this.solidified ? 0.8 : 0.9})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    
    function calcViscosity(temp) {
      // Arrhenius-like viscosity from temperature
      // Higher temp = lower viscosity (faster flow)
      const viscRef = 100; // Reference viscosity at 700°C
      const eTemp = Math.exp((1200 - temp) / 200); // Exponential scaling
      return Math.max(1, viscRef * eTemp);
    }
    
    function getEruptionStyle(intensity) {
      const style = eruptionStyleSelect.value;
      if (style === 'hawaiian') return { spreadWidth: intensity * 0.4, burstCount: intensity * 0.15, angle: 45 };
      if (style === 'strombolian') return { spreadWidth: intensity * 0.6, burstCount: intensity * 0.3, angle: 60 };
      if (style === 'plinian') return { spreadWidth: intensity * 0.8, burstCount: intensity * 0.5, angle: 75 };
      return { spreadWidth: intensity * 0.6, burstCount: intensity * 0.3, angle: 60 };
    }
    
    function erupt() {
      const intensity = parseFloat(intensitySlider.value);
      const slope = parseFloat(slopeSlider.value);
      const style = getEruptionStyle(intensity);
      
      // Base temperature (hotter = more intense eruption)
      const baseTemp = 700 + intensity * 5;
      totalEmitted += intensity * 10;
      
      // Volcano mouth at canvas center, bottom of crater
      const sourceX = canvas.width / 2;
      const sourceY = canvas.height * 0.35;
      
      // Erupt particles
      const particleCount = Math.floor(style.burstCount);
      for (let i = 0; i < particleCount; i++) {
        const angle = (Math.PI / 2 + (Math.random() - 0.5) * (style.spreadWidth * Math.PI / 180));
        const speed = (intensity / 100) * 3 + Math.random();
        const vx = Math.cos(angle) * speed;
        const vy = -Math.sin(angle) * speed;
        
        const temp = baseTemp + (Math.random() - 0.5) * 200;
        particles.push(new LavaParticle(sourceX, sourceY, vx, vy, temp, intensity));
      }
      
      // Add ash particles (smaller, lighter)
      for (let i = 0; i < particleCount * 0.3; i++) {
        const angle = (Math.PI / 2 + (Math.random() - 0.5) * 0.8);
        const speed = (intensity / 100) * 2.5;
        const vx = Math.cos(angle) * speed;
        const vy = -Math.sin(angle) * speed - 0.5;
        
        particles.push(new LavaParticle(sourceX - 30 + Math.random() * 60, sourceY - 20, vx, vy, 600, intensity * 0.7));
      }
    }
    
    eruptBtn.addEventListener('click', erupt);
    
    // Auto-erupt periodically
    setInterval(() => {
      const intensity = parseFloat(intensitySlider.value);
      if (intensity > 10) {
        erupt();
      }
    }, 300);
    
    function drawVolcano() {
      // Clear canvas
      ctx.fillStyle = '#0f1420';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Sky gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.3);
      skyGrad.addColorStop(0, '#1a2040');
      skyGrad.addColorStop(1, '#2a3050');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height * 0.3);
      
      // Volcano cone
      ctx.fillStyle = '#4a3a2a';
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, canvas.height * 0.35);
      ctx.lineTo(canvas.width * 0.2, canvas.height);
      ctx.lineTo(canvas.width * 0.8, canvas.height);
      ctx.closePath();
      ctx.fill();
      
      // Volcano outline
      ctx.strokeStyle = '#3a2a1a';
      ctx.lineWidth = 2;
      ctx.stroke();
      
      // Magma chamber visualization (underground)
      ctx.fillStyle = 'rgba(255, 100, 0, 0.2)';
      ctx.beginPath();
      ctx.ellipse(canvas.width / 2, canvas.height * 0.75, 80, 60, 0, 0, Math.PI * 2);
      ctx.fill();
      
      // Crater rim
      ctx.strokeStyle = '#5a4a3a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(canvas.width / 2, canvas.height * 0.35, 30, 15, 0, 0, Math.PI * 2);
      ctx.stroke();
      
      // Ground
      ctx.fillStyle = '#2a3a1a';
      ctx.fillRect(0, canvas.height * 0.95, canvas.width, canvas.height * 0.05);
    }
    
    function animate() {
      const intensity = parseFloat(intensitySlider.value);
      const slope = parseFloat(slopeSlider.value);
      const gravity = 0.15;
      
      // Draw volcano
      drawVolcano();
      
      // Update and draw particles
      let maxDist = 0;
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update(gravity, slope);
        p.draw(ctx);
        
        // Calculate distance from source
        const dist = Math.sqrt(Math.pow(p.x - canvas.width / 2, 2) + Math.pow(p.y - canvas.height * 0.35, 2));
        maxDist = Math.max(maxDist, dist);
        
        // Remove if off canvas or fully cooled
        if (p.y > canvas.height + 50 || p.temp < 100) {
          particles.splice(i, 1);
        }
      }
      
      maxFlowDist = Math.max(maxFlowDist, maxDist);
      
      // Update stats
      const avgTemp = particles.length > 0 
        ? Math.floor(particles.reduce((a, p) => a + p.temp, 0) / particles.length)
        : 700;
      const viscosity = calcViscosity(avgTemp);
      
      tempDisplay.textContent = avgTemp + '°C';
      distanceDisplay.textContent = Math.floor(maxFlowDist * 0.5) + 'm';
      viscosityDisplay.textContent = viscosity > 50 ? 'High' : viscosity > 20 ? 'Medium' : 'Low';
      particleCountDisplay.textContent = particles.length;
      
      requestAnimationFrame(animate);
    }
    
    // Start animation
    animate();
  </script>
</body>
</html>
