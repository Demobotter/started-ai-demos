<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harmonic Resonance Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Mono', monospace;
      background: #1a1a2e;
      color: #e0e0ff;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      max-width: 1200px;
      width: 100%;
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 30px;
      background: #16213e;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      margin-bottom: 20px;
      color: #00d4ff;
      grid-column: 1 / -1;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .control-group {
      background: #0f3460;
      border-radius: 8px;
      padding: 15px;
      border-left: 4px solid #4da8da;
    }
    .control-group label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: #4da8da;
      font-weight: 700;
    }
    .control-group input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #1a1a2e;
      outline: none;
      -webkit-appearance: none;
    }
    .control-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #00d4ff;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0,212,255,0.6);
    }
    .control-group input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #00d4ff;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 8px rgba(0,212,255,0.6);
    }
    .value-display {
      font-size: 14px;
      color: #e0e0ff;
      margin-top: 5px;
      font-weight: 700;
    }
    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    button {
      background: #0f3460;
      color: #e0e0ff;
      border: 2px solid #4da8da;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }
    button:hover {
      background: #1a3a5a;
      box-shadow: 0 0 12px rgba(77,168,218,0.5);
    }
    button.active {
      background: #4da8da;
      color: #0f3460;
      box-shadow: 0 0 16px rgba(0,212,255,0.8);
    }
    .mode-buttons {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .mode-buttons button {
      grid-column: auto;
      padding: 8px;
      font-size: 11px;
    }
    .stats-box {
      background: #0a0f15;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.8;
    }
    .stats-box .stat-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .stats-box .label {
      color: #4da8da;
      font-weight: 700;
    }
    .stats-box .value {
      color: #00d4ff;
      font-weight: 700;
    }
    .canvas-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    canvas {
      background: #0a0f15;
      border: 1px solid #333;
      border-radius: 8px;
      display: block;
      width: 100%;
      height: auto;
    }
    .checkbox-group {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }
    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
      color: #e0e0ff;
    }
    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #00d4ff;
    }
    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
      h1 {
        grid-column: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎵 Harmonic Resonance Lab</h1>
    
    <div class="sidebar">
      <div class="control-group">
        <label for="frequency">Fundamental Frequency</label>
        <input type="range" id="frequency" min="20" max="2000" value="220" step="10">
        <div class="value-display"><span id="freqDisplay">220</span> Hz</div>
      </div>

      <div class="control-group">
        <label for="length">String Length</label>
        <input type="range" id="length" min="30" max="200" value="100" step="5">
        <div class="value-display"><span id="lengthDisplay">100</span> cm</div>
      </div>

      <div class="control-group">
        <label>Material</label>
        <div class="button-group">
          <button id="materialSteel" class="active">Steel</button>
          <button id="materialNylon">Nylon</button>
          <button id="materialGut">Gut</button>
        </div>
      </div>

      <div class="control-group">
        <label>Harmonic Modes</label>
        <div class="mode-buttons">
          <button id="mode1" class="active">1st (Fundamental)</button>
          <button id="mode2">2nd Harmonic</button>
          <button id="mode3">3rd Harmonic</button>
          <button id="mode4">4th Harmonic</button>
          <button id="mode5">5th Harmonic</button>
        </div>
      </div>

      <div class="control-group">
        <label>Actions</label>
        <button id="pluckBtn" style="width: 100%;">Pluck String</button>
      </div>

      <div class="control-group">
        <div class="checkbox-group">
          <label>
            <input type="checkbox" id="showHarmonics">
            Add Harmonics
          </label>
        </div>
        <div class="checkbox-group">
          <label>
            <input type="checkbox" id="showNodes">
            Show Nodes
          </label>
        </div>
      </div>

      <div class="stats-box">
        <div class="stat-line">
          <span class="label">Fundamental:</span>
          <span class="value"><span id="statFreq">220</span> Hz</span>
        </div>
        <div class="stat-line">
          <span class="label">Wavelength:</span>
          <span class="value"><span id="statWave">155</span> cm</span>
        </div>
        <div class="stat-line">
          <span class="label">Period:</span>
          <span class="value"><span id="statPeriod">4.5</span> ms</span>
        </div>
        <div class="stat-line">
          <span class="label">Q Factor:</span>
          <span class="value"><span id="statQ">45</span></span>
        </div>
        <div class="stat-line">
          <span class="label">Material:</span>
          <span class="value"><span id="statMat">Steel</span></span>
        </div>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="stringCanvas" width="800" height="300"></canvas>
      <canvas id="freqCanvas" width="800" height="200"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('stringCanvas');
    const ctx = canvas.getContext('2d');
    const freqCanvas = document.getElementById('freqCanvas');
    const freqCtx = freqCanvas.getContext('2d');

    let state = {
      frequency: 220,
      length: 100,
      material: 'Steel',
      activeMode: 1,
      showHarmonics: false,
      showNodes: false,
      plucked: false,
      pluckTime: 0,
      time: 0
    };

    const materials = {
      Steel: { damping: 0.02, color: '#d4a574', qFactor: 45 },
      Nylon: { damping: 0.04, color: '#f5deb3', qFactor: 35 },
      Gut: { damping: 0.06, color: '#8b7355', qFactor: 25 }
    };

    // UI Controls
    document.getElementById('frequency').addEventListener('input', (e) => {
      state.frequency = parseInt(e.target.value);
      document.getElementById('freqDisplay').textContent = state.frequency;
      updateStats();
    });

    document.getElementById('length').addEventListener('input', (e) => {
      state.length = parseInt(e.target.value);
      document.getElementById('lengthDisplay').textContent = state.length;
      updateStats();
    });

    ['Steel', 'Nylon', 'Gut'].forEach(mat => {
      document.getElementById(`material${mat}`).addEventListener('click', () => {
        state.material = mat;
        document.querySelectorAll('.control-group button[id^="material"]').forEach(b => b.classList.remove('active'));
        document.getElementById(`material${mat}`).classList.add('active');
        updateStats();
      });
    });

    [1, 2, 3, 4, 5].forEach(i => {
      document.getElementById(`mode${i}`).addEventListener('click', () => {
        state.activeMode = i;
        document.querySelectorAll('.mode-buttons button').forEach(b => b.classList.remove('active'));
        document.getElementById(`mode${i}`).classList.add('active');
      });
    });

    document.getElementById('pluckBtn').addEventListener('click', () => {
      state.plucked = true;
      state.pluckTime = 0;
    });

    document.getElementById('showHarmonics').addEventListener('change', (e) => {
      state.showHarmonics = e.target.checked;
    });

    document.getElementById('showNodes').addEventListener('change', (e) => {
      state.showNodes = e.target.checked;
    });

    function updateStats() {
      const freq = state.frequency;
      const wavelength = 34300 / freq;
      const period = 1000 / freq;
      const mat = materials[state.material];
      const q = mat.qFactor;

      document.getElementById('statFreq').textContent = freq;
      document.getElementById('statWave').textContent = Math.round(wavelength);
      document.getElementById('statPeriod').textContent = Math.round(period * 10) / 10;
      document.getElementById('statQ').textContent = q;
      document.getElementById('statMat').textContent = state.material;
    }

    function drawString() {
      const padding = 40;
      const width = canvas.width - padding * 2;
      const centerY = canvas.height / 2;
      const amplitude = 60;

      ctx.fillStyle = '#0a0f15';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const x = padding + (width / 4) * i;
        ctx.beginPath();
        ctx.moveTo(x, centerY - amplitude - 10);
        ctx.lineTo(x, centerY + amplitude + 10);
        ctx.stroke();
      }

      const mat = materials[state.material];
      ctx.strokeStyle = mat.color;
      ctx.lineWidth = 2.5;

      const freq = state.frequency;
      const mode = state.activeMode;
      const damping = mat.damping;

      let maxAmplitude = amplitude;

      ctx.beginPath();
      for (let x = 0; x <= width; x += 2) {
        const t = state.time;
        const phase = (x / width) * Math.PI * mode;
        
        let y = 0;
        if (state.plucked) {
          const decay = Math.exp(-damping * state.pluckTime);
          y = Math.sin(2 * Math.PI * freq * t + phase) * decay * maxAmplitude;
        } else {
          y = Math.sin(2 * Math.PI * freq * t + phase) * maxAmplitude;
        }

        if (state.showHarmonics && state.plucked) {
          const decay = Math.exp(-damping * state.pluckTime);
          for (let h = 2; h <= 5; h++) {
            y += (Math.sin(2 * Math.PI * freq * h * t + phase * h) / (h * h)) * decay * maxAmplitude;
          }
        }

        const px = padding + x;
        const py = centerY - y;

        if (x === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();

      ctx.fillStyle = '#4da8da';
      ctx.beginPath();
      ctx.arc(padding, centerY, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(padding + width, centerY, 5, 0, Math.PI * 2);
      ctx.fill();

      if (state.showNodes) {
        ctx.fillStyle = '#ff00aa';
        const nodeCount = state.activeMode + 1;
        for (let i = 1; i < nodeCount; i++) {
          const x = padding + (width / nodeCount) * i;
          ctx.beginPath();
          ctx.arc(x, centerY, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawFrequencyDomain() {
      const padding = 40;
      const width = freqCanvas.width - padding * 2;
      const height = freqCanvas.height - padding * 2;
      const centerY = padding + height;

      freqCtx.fillStyle = '#0a0f15';
      freqCtx.fillRect(0, 0, freqCanvas.width, freqCanvas.height);

      freqCtx.strokeStyle = '#333';
      freqCtx.lineWidth = 1;
      freqCtx.beginPath();
      freqCtx.moveTo(padding, centerY);
      freqCtx.lineTo(freqCanvas.width - padding, centerY);
      freqCtx.stroke();

      const freq = state.frequency;
      const maxFreq = 2000;

      freqCtx.fillStyle = '#4da8da';
      for (let h = 1; h <= 5; h++) {
        const peakFreq = freq * h;
        const x = padding + (peakFreq / maxFreq) * width;
        const amplitude = Math.min(height * (1 / (h * h)), height * 0.8);

        freqCtx.fillRect(x - 8, centerY - amplitude, 16, amplitude);
      }

      freqCtx.fillStyle = '#4da8da';
      freqCtx.font = '12px "Space Mono", monospace';
      freqCtx.textAlign = 'center';
      freqCtx.fillText('f', padding - 20, centerY - 30);
      freqCtx.fillText('2f', padding + width * 0.2 - 20, centerY - 30);
      freqCtx.fillText('5f', padding + width - 20, centerY - 30);
    }

    function animate() {
      state.time += 0.01;
      if (state.plucked) {
        state.pluckTime += 0.01;
        if (state.pluckTime > 3) {
          state.plucked = false;
        }
      }

      drawString();
      drawFrequencyDomain();

      requestAnimationFrame(animate);
    }

    updateStats();
    animate();
  </script>
</body>
</html>
