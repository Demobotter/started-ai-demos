<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harmonic Resonance Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Space Mono', monospace;
      background: linear-gradient(135deg, #0a1428 0%, #0f1e3a 100%);
      color: #7dd3fc;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 10px;
      color: #e0f2fe;
    }
    .subtitle {
      text-align: center;
      color: #64b5f6;
      margin-bottom: 30px;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 20px;
      margin-bottom: 20px;
    }
    .canvas-section {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .waveform-canvas {
      background: #0a1428;
      border: 2px solid #4da8da;
      border-radius: 8px;
      width: 100%;
      height: 300px;
      cursor: crosshair;
    }
    .spectrum-canvas {
      background: #0a1428;
      border: 2px solid #4da8da;
      border-radius: 8px;
      width: 100%;
      height: 150px;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: rgba(10, 20, 40, 0.6);
      border: 2px solid #1f4d7f;
      border-radius: 8px;
      padding: 20px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .control-label {
      font-size: 0.85rem;
      color: #4da8da;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .slider {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #1f4d7f;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #4da8da;
      cursor: pointer;
      border: 2px solid #ffffff;
    }
    .slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #4da8da;
      cursor: pointer;
      border: 2px solid #ffffff;
      box-shadow: 0 0 8px rgba(77, 168, 218, 0.6);
    }
    .slider-value {
      font-size: 0.75rem;
      color: #7dd3fc;
      text-align: right;
    }
    .select {
      background: #0f1e3a;
      color: #7dd3fc;
      border: 2px solid #1f4d7f;
      border-radius: 4px;
      padding: 8px 10px;
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .select:focus {
      outline: none;
      border-color: #4da8da;
      box-shadow: 0 0 8px rgba(77, 168, 218, 0.3);
    }
    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .button {
      background: #1f4d7f;
      color: #4da8da;
      border: 2px solid #4da8da;
      border-radius: 4px;
      padding: 10px;
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }
    .button:hover {
      background: #4da8da;
      color: #0a1428;
      box-shadow: 0 0 12px rgba(77, 168, 218, 0.5);
    }
    .stat-box {
      background: rgba(15, 30, 58, 0.8);
      border-left: 3px solid #4da8da;
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 0.75rem;
    }
    .stat-label {
      color: #64b5f6;
      text-transform: uppercase;
      font-size: 0.65rem;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }
    .stat-value {
      color: #4da8da;
      font-weight: 700;
      font-size: 0.9rem;
    }
    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎼 Harmonic Resonance</h1>
    <div class="subtitle">INTERFERENCE PATTERNS & CONSONANCE</div>
    
    <div class="layout">
      <div class="canvas-section">
        <canvas id="waveformCanvas" class="waveform-canvas"></canvas>
        <canvas id="spectrumCanvas" class="spectrum-canvas"></canvas>
      </div>
      
      <div class="controls">
        <div class="control-group">
          <label class="control-label">Wave 1 Frequency (Hz)</label>
          <input type="range" id="freq1Slider" class="slider" min="20" max="2000" value="440" step="1">
          <div class="slider-value"><span id="freq1Value">440</span> Hz</div>
        </div>

        <div class="control-group">
          <label class="control-label">Wave 2 Frequency (Hz)</label>
          <input type="range" id="freq2Slider" class="slider" min="20" max="2000" value="550" step="1">
          <div class="slider-value"><span id="freq2Value">550</span> Hz</div>
        </div>

        <div class="control-group">
          <label class="control-label">Frequency Ratio Preset</label>
          <select id="ratioSelect" class="select">
            <option value="1.000">Unison 1:1</option>
            <option value="2.000">Octave 2:1</option>
            <option value="1.500">Perfect 5th 3:2</option>
            <option value="1.333">Perfect 4th 4:3</option>
            <option value="1.250">Major 3rd 5:4</option>
            <option value="1.200">Minor 3rd 6:5</option>
            <option value="1.667">Major 6th 5:3</option>
            <option value="1.600">Minor 6th 8:5</option>
          </select>
        </div>

        <div class="control-group">
          <label class="control-label">Waveform Type</label>
          <select id="waveformSelect" class="select">
            <option value="sine">Sine (Pure Tone)</option>
            <option value="square">Square (Buzzy)</option>
            <option value="sawtooth">Sawtooth (Bright)</option>
            <option value="triangle">Triangle (Mellow)</option>
          </select>
        </div>

        <div class="control-group">
          <label class="control-label">Phase Offset (°)</label>
          <input type="range" id="phaseSlider" class="slider" min="-180" max="180" value="0" step="1">
          <div class="slider-value"><span id="phaseValue">0</span>°</div>
        </div>

        <div class="control-group">
          <label class="control-label">Amplitude Wave 1</label>
          <input type="range" id="amp1Slider" class="slider" min="0" max="100" value="70" step="1">
          <div class="slider-value"><span id="amp1Value">70</span>%</div>
        </div>

        <div class="control-group">
          <label class="control-label">Amplitude Wave 2</label>
          <input type="range" id="amp2Slider" class="slider" min="0" max="100" value="70" step="1">
          <div class="slider-value"><span id="amp2Value">70</span>%</div>
        </div>

        <div class="button-group">
          <button class="button" id="resetButton">Reset</button>
          <button class="button" id="presetButton">Harmony 5:4</button>
        </div>

        <div class="stat-box">
          <div class="stat-label">Beat Frequency</div>
          <div class="stat-value"><span id="beatFrequency">110.0</span> Hz</div>
        </div>

        <div class="stat-box">
          <div class="stat-label">Frequency Ratio</div>
          <div class="stat-value"><span id="ratioDisplay">1.25</span></div>
        </div>

        <div class="stat-box">
          <div class="stat-label">Consonance Score</div>
          <div class="stat-value"><span id="consonanceScore">85</span>/100</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const waveformCanvas = document.getElementById('waveformCanvas');
    const spectrumCanvas = document.getElementById('spectrumCanvas');
    const waveCtx = waveformCanvas.getContext('2d');
    const specCtx = spectrumCanvas.getContext('2d');

    // UI Elements
    const freq1Slider = document.getElementById('freq1Slider');
    const freq2Slider = document.getElementById('freq2Slider');
    const phaseSlider = document.getElementById('phaseSlider');
    const amp1Slider = document.getElementById('amp1Slider');
    const amp2Slider = document.getElementById('amp2Slider');
    const waveformSelect = document.getElementById('waveformSelect');
    const ratioSelect = document.getElementById('ratioSelect');
    const resetButton = document.getElementById('resetButton');
    const presetButton = document.getElementById('presetButton');

    // Values
    let freq1 = 440;
    let freq2 = 550;
    let phase = 0; // degrees
    let amp1 = 0.7;
    let amp2 = 0.7;
    let waveformType = 'sine';
    let animationTime = 0;

    // Resize canvas to fit container
    function resizeCanvases() {
      const containerWidth = waveformCanvas.parentElement.offsetWidth;
      waveformCanvas.width = containerWidth;
      waveformCanvas.height = 300;
      spectrumCanvas.width = containerWidth;
      spectrumCanvas.height = 150;
    }
    resizeCanvases();
    window.addEventListener('resize', resizeCanvases);

    // Waveform generation
    function generateWave(frequency, amplitude, phaseOffset, type, sampleIndex) {
      const phaseRad = (phaseOffset * Math.PI) / 180;
      const angle = (2 * Math.PI * frequency * (sampleIndex / 44100)) + phaseRad;

      let sample = 0;
      if (type === 'sine') {
        sample = Math.sin(angle);
      } else if (type === 'square') {
        sample = Math.sin(angle) >= 0 ? 1 : -1;
        // Add harmonics for richer square wave
        for (let n = 3; n <= 9; n += 2) {
          sample += (4 / (n * Math.PI)) * Math.sin(n * angle);
        }
      } else if (type === 'sawtooth') {
        sample = 2 * (sampleIndex / 44100 * frequency - Math.floor(sampleIndex / 44100 * frequency + 0.5));
        // Add harmonics for sawtooth
        for (let n = 2; n <= 10; n++) {
          sample += (2 / (n * Math.PI)) * Math.sin(n * angle);
        }
      } else if (type === 'triangle') {
        const sawtooth = 2 * (sampleIndex / 44100 * frequency - Math.floor(sampleIndex / 44100 * frequency + 0.5));
        sample = Math.abs(sawtooth) - 0.5;
        sample = 4 * (Math.abs(sample) - 0.25);
      }

      return sample * amplitude;
    }

    // Calculate consonance score based on harmonic ratio simplicity
    function calculateConsonance(f1, f2) {
      const ratio = Math.min(f1, f2) / Math.max(f1, f2);
      
      // Check for simple ratios and their accuracy
      const ratios = [
        { value: 1/1, consonance: 100, name: 'unison' },
        { value: 2/2, consonance: 100, name: 'unison' },
        { value: 2/1, consonance: 98, name: 'octave' },
        { value: 3/2, consonance: 96, name: '5th' },
        { value: 4/3, consonance: 94, name: '4th' },
        { value: 5/4, consonance: 92, name: 'maj3' },
        { value: 6/5, consonance: 90, name: 'min3' },
        { value: 5/3, consonance: 88, name: 'maj6' },
        { value: 8/5, consonance: 86, name: 'min6' },
      ];

      // Find closest simple ratio
      let bestScore = 50; // base dissonance
      for (const r of ratios) {
        const diff = Math.abs(ratio - r.value);
        if (diff < 0.05) { // within 5% tolerance
          bestScore = Math.max(bestScore, r.consonance - diff * 500);
        }
      }

      return Math.max(0, Math.min(100, Math.round(bestScore)));
    }

    // Draw waveforms
    function drawWaveforms() {
      const width = waveformCanvas.width;
      const height = waveformCanvas.height;
      const centerY = height / 2;
      const scale = 0.7;

      // Clear canvas
      waveCtx.fillStyle = '#0a1428';
      waveCtx.fillRect(0, 0, width, height);

      // Draw grid
      waveCtx.strokeStyle = '#1f4d7f';
      waveCtx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = (height / 4) * i;
        waveCtx.beginPath();
        waveCtx.moveTo(0, y);
        waveCtx.lineTo(width, y);
        waveCtx.stroke();
      }

      // Sample points
      const samplesPerPixel = 5;
      const totalSamples = width * samplesPerPixel;
      const phasRad = (phase * Math.PI) / 180;

      // Draw wave 1 (cyan)
      waveCtx.strokeStyle = '#4da8da';
      waveCtx.lineWidth = 2;
      waveCtx.beginPath();
      for (let px = 0; px < width; px++) {
        const sampleIndex = px * samplesPerPixel + animationTime * 100;
        const angle = (2 * Math.PI * freq1 * (sampleIndex / 44100));
        let sample = Math.sin(angle) * amp1;
        if (waveformType === 'square') {
          sample = Math.sin(angle) >= 0 ? amp1 : -amp1;
        } else if (waveformType === 'sawtooth') {
          sample = (2 * ((sampleIndex / 44100 * freq1) % 1) - 1) * amp1;
        }
        const y = centerY - sample * (height * scale * 0.4);
        if (px === 0) waveCtx.moveTo(px, y);
        else waveCtx.lineTo(px, y);
      }
      waveCtx.stroke();

      // Draw wave 2 (magenta)
      waveCtx.strokeStyle = '#ff00ff';
      waveCtx.lineWidth = 2;
      waveCtx.beginPath();
      for (let px = 0; px < width; px++) {
        const sampleIndex = px * samplesPerPixel + animationTime * 100;
        const angle = (2 * Math.PI * freq2 * (sampleIndex / 44100)) + phasRad;
        let sample = Math.sin(angle) * amp2;
        if (waveformType === 'square') {
          sample = Math.sin(angle) >= 0 ? amp2 : -amp2;
        } else if (waveformType === 'sawtooth') {
          sample = (2 * ((sampleIndex / 44100 * freq2) % 1) - 1) * amp2;
        }
        const y = centerY - sample * (height * scale * 0.4);
        if (px === 0) waveCtx.moveTo(px, y);
        else waveCtx.lineTo(px, y);
      }
      waveCtx.stroke();

      // Draw interference pattern (white)
      waveCtx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
      waveCtx.lineWidth = 1;
      waveCtx.beginPath();
      for (let px = 0; px < width; px++) {
        const sampleIndex = px * samplesPerPixel + animationTime * 100;
        const angle1 = (2 * Math.PI * freq1 * (sampleIndex / 44100));
        const angle2 = (2 * Math.PI * freq2 * (sampleIndex / 44100)) + phasRad;
        let sample1 = Math.sin(angle1) * amp1;
        let sample2 = Math.sin(angle2) * amp2;
        if (waveformType === 'square') {
          sample1 = Math.sin(angle1) >= 0 ? amp1 : -amp1;
          sample2 = Math.sin(angle2) >= 0 ? amp2 : -amp2;
        } else if (waveformType === 'sawtooth') {
          sample1 = (2 * ((sampleIndex / 44100 * freq1) % 1) - 1) * amp1;
          sample2 = (2 * ((sampleIndex / 44100 * freq2) % 1) - 1) * amp2;
        }
        const combined = sample1 + sample2;
        const y = centerY - combined * (height * scale * 0.4);
        if (px === 0) waveCtx.moveTo(px, y);
        else waveCtx.lineTo(px, y);
      }
      waveCtx.stroke();
    }

    // Draw spectrum analyzer
    function drawSpectrum() {
      const width = spectrumCanvas.width;
      const height = spectrumCanvas.height;

      // Clear canvas
      specCtx.fillStyle = '#0a1428';
      specCtx.fillRect(0, 0, width, height);

      // Draw grid
      specCtx.strokeStyle = '#1f4d7f';
      specCtx.lineWidth = 1;
      specCtx.beginPath();
      specCtx.moveTo(0, height / 2);
      specCtx.lineTo(width, height / 2);
      specCtx.stroke();

      // Draw frequency labels
      specCtx.fillStyle = '#64b5f6';
      specCtx.font = '10px Space Mono';
      specCtx.textAlign = 'center';
      specCtx.fillText('0 Hz', 0, height - 5);
      specCtx.fillText('2000 Hz', width, height - 5);

      // Analyze harmonic spectrum
      const harmonicBins = [];
      
      // Add fundamental and harmonics for Wave 1
      for (let n = 1; n <= 5; n++) {
        const f = freq1 * n;
        if (f <= 2000) {
          harmonicBins.push({ freq: f, magnitude: amp1 / n, color: '#4da8da' });
        }
      }

      // Add fundamental and harmonics for Wave 2
      for (let n = 1; n <= 5; n++) {
        const f = freq2 * n;
        if (f <= 2000) {
          const existing = harmonicBins.find(b => Math.abs(b.freq - f) < 5);
          if (existing) {
            existing.magnitude += amp2 / n;
            existing.color = '#ff00ff';
          } else {
            harmonicBins.push({ freq: f, magnitude: amp2 / n, color: '#00ff88' });
          }
        }
      }

      // Draw spectrum bars
      harmonicBins.forEach(bin => {
        const x = (bin.freq / 2000) * width;
        const barHeight = Math.min(bin.magnitude * height * 0.9, height);
        
        specCtx.fillStyle = bin.color;
        specCtx.fillRect(x - 3, height - barHeight, 6, barHeight);

        // Draw label
        specCtx.fillStyle = '#7dd3fc';
        specCtx.font = '8px Space Mono';
        specCtx.textAlign = 'center';
        specCtx.fillText(Math.round(bin.freq) + 'Hz', x, height - barHeight - 2);
      });
    }

    // Update stats
    function updateStats() {
      const beatFreq = Math.abs(freq2 - freq1);
      document.getElementById('beatFrequency').textContent = beatFreq.toFixed(1);

      const ratio = freq2 / freq1;
      const simplified = ratio > 1 ? ratio.toFixed(3) : (1/ratio).toFixed(3);
      document.getElementById('ratioDisplay').textContent = simplified;

      const consonance = calculateConsonance(freq1, freq2);
      document.getElementById('consonanceScore').textContent = consonance;
    }

    // Animation loop
    function animate() {
      animationTime += 0.016; // ~60fps
      if (animationTime > 1) animationTime -= 1;
      
      drawWaveforms();
      drawSpectrum();
      updateStats();
      
      requestAnimationFrame(animate);
    }
    animate();

    // Event listeners
    freq1Slider.addEventListener('input', (e) => {
      freq1 = parseFloat(e.target.value);
      document.getElementById('freq1Value').textContent = Math.round(freq1);
    });

    freq2Slider.addEventListener('input', (e) => {
      freq2 = parseFloat(e.target.value);
      document.getElementById('freq2Value').textContent = Math.round(freq2);
    });

    phaseSlider.addEventListener('input', (e) => {
      phase = parseFloat(e.target.value);
      document.getElementById('phaseValue').textContent = Math.round(phase);
    });

    amp1Slider.addEventListener('input', (e) => {
      amp1 = parseFloat(e.target.value) / 100;
      document.getElementById('amp1Value').textContent = e.target.value;
    });

    amp2Slider.addEventListener('input', (e) => {
      amp2 = parseFloat(e.target.value) / 100;
      document.getElementById('amp2Value').textContent = e.target.value;
    });

    waveformSelect.addEventListener('change', (e) => {
      waveformType = e.target.value;
    });

    ratioSelect.addEventListener('change', (e) => {
      const ratio = parseFloat(e.target.value);
      freq2 = freq1 * ratio;
      if (freq2 > 2000) freq2 = 2000;
      freq2Slider.value = Math.round(freq2);
      document.getElementById('freq2Value').textContent = Math.round(freq2);
    });

    resetButton.addEventListener('click', () => {
      freq1 = 440;
      freq2 = 550;
      phase = 0;
      amp1 = 0.7;
      amp2 = 0.7;
      waveformType = 'sine';
      
      freq1Slider.value = 440;
      freq2Slider.value = 550;
      phaseSlider.value = 0;
      amp1Slider.value = 70;
      amp2Slider.value = 70;
      waveformSelect.value = 'sine';
      
      document.getElementById('freq1Value').textContent = '440';
      document.getElementById('freq2Value').textContent = '550';
      document.getElementById('phaseValue').textContent = '0';
      document.getElementById('amp1Value').textContent = '70';
      document.getElementById('amp2Value').textContent = '70';
    });

    presetButton.addEventListener('click', () => {
      freq1 = 440;
      freq2 = 550; // 5:4 major third
      phase = 0;
      
      freq1Slider.value = 440;
      freq2Slider.value = 550;
      phaseSlider.value = 0;
      
      document.getElementById('freq1Value').textContent = '440';
      document.getElementById('freq2Value').textContent = '550';
      document.getElementById('phaseValue').textContent = '0';
    });
  </script>
</body>
</html>
