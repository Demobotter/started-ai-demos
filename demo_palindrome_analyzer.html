<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a1428 0%, #0f1f3a 100%);
            color: #4da8da;
            font-family: 'Space Mono', monospace;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            grid-column: 1 / -1;
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #4da8da;
        }

        .subtitle {
            grid-column: 1 / -1;
            text-align: center;
            color: #7dd3fc;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .panel {
            background: #0f1f3a;
            border: 2px solid #4da8da;
            border-radius: 8px;
            padding: 25px;
        }

        .input-section {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #4da8da;
            font-weight: bold;
            font-size: 0.95em;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #0a1428;
            border: 1px solid #4da8da;
            border-radius: 4px;
            color: #4da8da;
            padding: 12px;
            font-family: 'Space Mono', monospace;
            font-size: 0.9em;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.3);
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            color: #4da8da;
        }

        input[type="radio"] {
            margin-right: 10px;
            cursor: pointer;
            accent-color: #00ff88;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #00ff88;
            color: #0a1428;
            border: none;
            border-radius: 4px;
            font-family: 'Space Mono', monospace;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        button:hover {
            background: #00dd6f;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .output-section {
            background: #0a1428;
            border: 2px solid #00ff88;
            border-radius: 8px;
            padding: 20px;
            max-height: 600px;
            overflow-y: auto;
        }

        .output-title {
            color: #00ff88;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 0.95em;
        }

        .stat-box {
            background: #0f1f3a;
            border-left: 3px solid #4da8da;
            padding: 10px 15px;
            margin-bottom: 12px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .stat-label {
            color: #7dd3fc;
            font-size: 0.85em;
        }

        .stat-value {
            color: #00ff88;
            font-weight: bold;
            margin-top: 3px;
        }

        .palindrome-item {
            background: #1a2a3a;
            border-left: 3px solid #ff00ff;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 0.85em;
        }

        .palindrome-text {
            color: #4da8da;
            font-weight: bold;
            word-break: break-all;
        }

        .palindrome-meta {
            color: #7dd3fc;
            font-size: 0.8em;
            margin-top: 4px;
        }

        .symmetry-gauge {
            margin: 20px 0;
            padding: 15px;
            background: #1a2a3a;
            border-radius: 4px;
        }

        svg {
            display: block;
            margin: 0 auto;
        }

        .gauge-label {
            text-align: center;
            color: #7dd3fc;
            font-size: 0.85em;
            margin-top: 8px;
        }

        .gauge-value {
            text-align: center;
            color: #00ff88;
            font-weight: bold;
            font-size: 1.2em;
            margin-top: 4px;
        }

        .vowel-pattern {
            background: #1a2a3a;
            padding: 10px 15px;
            border-radius: 4px;
            margin: 15px 0;
            font-size: 0.85em;
            border-left: 3px solid #ff00ff;
        }

        .vowel-sequence {
            color: #4da8da;
            font-weight: bold;
            margin-top: 5px;
            word-break: break-all;
        }

        .empty-state {
            color: #7dd3fc;
            text-align: center;
            padding: 30px 0;
            font-size: 0.9em;
        }

        .highlight {
            background: rgba(77, 168, 218, 0.3);
            padding: 2px 4px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Palindrome Analyzer</h1>
        <p class="subtitle">Decode hidden symmetry & mirror patterns in text</p>

        <div class="panel">
            <div class="input-section">
                <label for="textInput">Enter Text to Analyze</label>
                <textarea id="textInput" placeholder="Type or paste any text: words, sentences, names, anything..."></textarea>
            </div>

            <div class="input-section">
                <label>Analysis Type</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="analysisType" value="char" checked>
                        Character Palindromes
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="analysisType" value="near">
                        Near-Palindromes (edit distance ≤1)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="analysisType" value="symmetry">
                        Positional Symmetry
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="analysisType" value="vowel">
                        Vowel Patterns
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="analysisType" value="word">
                        Word Palindromes
                    </label>
                </div>
            </div>

            <button onclick="analyzeText()">Analyze</button>
        </div>

        <div class="output-section" id="output">
            <div class="empty-state">Results will appear here. Enter text and click Analyze.</div>
        </div>
    </div>

    <script>
        function isPalindrome(str) {
            return str === str.split('').reverse().join('');
        }

        function levenshteinDistance(a, b) {
            const m = a.length, n = b.length;
            const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));
            for (let i = 0; i <= m; i++) dp[i][0] = i;
            for (let j = 0; j <= n; j++) dp[0][j] = j;
            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    if (a[i - 1] === b[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1];
                    } else {
                        dp[i][j] = 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
                    }
                }
            }
            return dp[m][n];
        }

        function findCharPalindromes(text) {
            const palindromes = [];
            const lowerText = text.toLowerCase();
            for (let i = 0; i < text.length; i++) {
                for (let j = i + 3; j <= text.length; j++) {
                    const substr = lowerText.substring(i, j);
                    if (isPalindrome(substr)) {
                        palindromes.push({
                            text: text.substring(i, j),
                            position: i,
                            length: j - i
                        });
                    }
                }
            }
            return palindromes.sort((a, b) => b.length - a.length);
        }

        function findNearPalindromes(text) {
            const near = [];
            const lowerText = text.toLowerCase();
            for (let i = 0; i < text.length; i++) {
                for (let j = i + 3; j <= text.length; j++) {
                    const substr = lowerText.substring(i, j);
                    const reversed = substr.split('').reverse().join('');
                    const dist = levenshteinDistance(substr, reversed);
                    if (dist === 1) {
                        near.push({
                            text: text.substring(i, j),
                            position: i,
                            length: j - i,
                            distance: dist
                        });
                    }
                }
            }
            return near.sort((a, b) => b.length - a.length).slice(0, 20);
        }

        function calculateSymmetry(text) {
            const lowerText = text.toLowerCase();
            let matches = 0;
            const len = lowerText.length;
            for (let i = 0; i < Math.floor(len / 2); i++) {
                if (lowerText[i] === lowerText[len - 1 - i]) {
                    matches++;
                }
            }
            return Math.round((matches / Math.floor(len / 2)) * 100);
        }

        function getVowelPattern(text) {
            const vowels = { a: 1, e: 2, i: 3, o: 4, u: 5 };
            const lowerText = text.toLowerCase();
            const pattern = [];
            for (const char of lowerText) {
                if (char in vowels) {
                    pattern.push(vowels[char]);
                }
            }
            return pattern;
        }

        function findWordPalindromes(text) {
            const words = text.toLowerCase().split(/\s+/).filter(w => w.length > 0);
            const result = [];
            for (let i = 0; i < words.length; i++) {
                for (let j = i + 1; j <= words.length; j++) {
                    const subseq = words.slice(i, j);
                    const reversed = [...subseq].reverse();
                    if (JSON.stringify(subseq) === JSON.stringify(reversed)) {
                        result.push({
                            words: subseq,
                            position: i,
                            length: j - i
                        });
                    }
                }
            }
            return result.sort((a, b) => b.length - a.length);
        }

        function renderGauge(score) {
            const radius = 40;
            const cx = 60, cy = 60;
            const angle = (score / 100) * 180 - 90;
            const x = cx + radius * Math.cos(angle * Math.PI / 180);
            const y = cy + radius * Math.sin(angle * Math.PI / 180);
            
            return `<svg width="120" height="100" viewBox="0 0 120 100">
                <path d="M 20 60 A 40 40 0 0 1 100 60" fill="none" stroke="#4da8da" stroke-width="2"/>
                <line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#00ff88" stroke-width="3"/>
                <circle cx="${cx}" cy="${cy}" r="4" fill="#00ff88"/>
                <text x="20" y="85" font-size="10" fill="#7dd3fc">0%</text>
                <text x="90" y="85" font-size="10" fill="#7dd3fc">100%</text>
            </svg>`;
        }

        function analyzeText() {
            const text = document.getElementById('textInput').value.trim();
            const analysisType = document.querySelector('input[name="analysisType"]:checked').value;
            const output = document.getElementById('output');

            if (!text) {
                output.innerHTML = '<div class="empty-state">Please enter some text first.</div>';
                return;
            }

            let html = '';

            if (analysisType === 'char') {
                const palindromes = findCharPalindromes(text);
                html += `<div class="output-title">Character Palindromes Found: ${palindromes.length}</div>`;
                
                if (palindromes.length === 0) {
                    html += '<div class="empty-state">No exact palindromes of length ≥3 found.</div>';
                } else {
                    const unique = {};
                    palindromes.forEach(p => {
                        const key = p.text.toLowerCase();
                        if (!unique[key]) unique[key] = p;
                    });
                    Object.values(unique).slice(0, 10).forEach(p => {
                        html += `<div class="palindrome-item">
                            <div class="palindrome-text">"${p.text}"</div>
                            <div class="palindrome-meta">Length: ${p.length} | Position: ${p.position}</div>
                        </div>`;
                    });
                }

                const stats = palindromes.filter((p, i, arr) => arr.findIndex(a => a.text.toLowerCase() === p.text.toLowerCase()) === i);
                if (stats.length > 0) {
                    html += `<div class="stat-box">
                        <div class="stat-label">Unique Palindromes</div>
                        <div class="stat-value">${stats.length}</div>
                    </div>`;
                    html += `<div class="stat-box">
                        <div class="stat-label">Longest Palindrome</div>
                        <div class="stat-value">"${palindromes[0].text}" (${palindromes[0].length} chars)</div>
                    </div>`;
                }
            } else if (analysisType === 'near') {
                const near = findNearPalindromes(text);
                html += `<div class="output-title">Near-Palindromes (1 edit away): ${near.length}</div>`;
                
                if (near.length === 0) {
                    html += '<div class="empty-state">No near-palindromes found (edit distance ≤1).</div>';
                } else {
                    near.slice(0, 10).forEach(p => {
                        html += `<div class="palindrome-item">
                            <div class="palindrome-text">"${p.text}"</div>
                            <div class="palindrome-meta">Length: ${p.length} | ~1 char difference from palindrome</div>
                        </div>`;
                    });
                }
            } else if (analysisType === 'symmetry') {
                const score = calculateSymmetry(text);
                html += `<div class="output-title">Positional Symmetry Analysis</div>`;
                html += `<div class="symmetry-gauge">
                    ${renderGauge(score)}
                    <div class="gauge-label">Left-Right Mirror Balance</div>
                    <div class="gauge-value">${score}% Symmetric</div>
                </div>`;
                
                const stats = [];
                const len = text.length;
                let matches = 0;
                for (let i = 0; i < Math.floor(len / 2); i++) {
                    if (text.toLowerCase()[i] === text.toLowerCase()[len - 1 - i]) {
                        matches++;
                    }
                }
                html += `<div class="stat-box">
                    <div class="stat-label">Position Matches</div>
                    <div class="stat-value">${matches} of ${Math.floor(len / 2)} pairs</div>
                </div>`;
                html += `<div class="stat-box">
                    <div class="stat-label">Text Length</div>
                    <div class="stat-value">${len} characters</div>
                </div>`;
            } else if (analysisType === 'vowel') {
                const pattern = getVowelPattern(text);
                const vowelMap = { 1: 'A', 2: 'E', 3: 'I', 4: 'O', 5: 'U' };
                const patternStr = pattern.map(p => vowelMap[p]).join('');
                const isPalin = isPalindrome(patternStr);
                
                html += `<div class="output-title">Vowel Pattern Analysis</div>`;
                html += `<div class="vowel-pattern">
                    <div style="color: #7dd3fc; font-size: 0.85em;">Vowel Sequence (A=1, E=2, I=3, O=4, U=5)</div>
                    <div class="vowel-sequence">${pattern.join(' ')}</div>
                    <div style="color: #7dd3fc; margin-top: 8px; font-size: 0.85em;">Pattern: ${patternStr || '(none)'}</div>
                </div>`;
                
                if (pattern.length > 0) {
                    html += `<div class="stat-box">
                        <div class="stat-label">Vowel Count</div>
                        <div class="stat-value">${pattern.length}</div>
                    </div>`;
                    html += `<div class="stat-box">
                        <div class="stat-label">Pattern is Palindromic</div>
                        <div class="stat-value">${isPalin ? '✓ Yes' : '✗ No'}</div>
                    </div>`;
                }
            } else if (analysisType === 'word') {
                const wordPalindromes = findWordPalindromes(text);
                html += `<div class="output-title">Word Palindromes: ${wordPalindromes.length}</div>`;
                
                if (wordPalindromes.length === 0) {
                    html += '<div class="empty-state">No word-sequence palindromes found.</div>';
                } else {
                    wordPalindromes.slice(0, 10).forEach(wp => {
                        html += `<div class="palindrome-item">
                            <div class="palindrome-text">"${wp.words.join(' ')}"</div>
                            <div class="palindrome-meta">${wp.length} word${wp.length !== 1 ? 's' : ''} | Position: word ${wp.position}</div>
                        </div>`;
                    });
                }
            }

            output.innerHTML = html;
        }

        // Demo text on load
        document.getElementById('textInput').value = 'racecar noon level civic stats refer';
    </script>
</body>
</html>
