<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reef Guard</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a1e3a 0%, #0f2a4a 100%);
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    
    .container {
      max-width: 1200px;
      width: 100%;
      background: rgba(10, 30, 58, 0.9);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 8px 32px rgba(0, 217, 255, 0.15);
      border: 1px solid rgba(45, 157, 95, 0.3);
    }
    
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.5rem;
      color: #00d9ff;
      margin-bottom: 0.5rem;
    }
    
    .header p {
      color: #b0b0b0;
      font-size: 0.95rem;
    }
    
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 2rem;
      align-items: start;
    }
    
    .controls {
      background: rgba(15, 42, 74, 0.6);
      border: 1px solid rgba(45, 157, 95, 0.3);
      border-radius: 8px;
      padding: 1.5rem;
    }
    
    .control-group {
      margin-bottom: 1.5rem;
    }
    
    .control-group label {
      display: block;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      color: #00d9ff;
      font-size: 0.85rem;
      margin-bottom: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .control-group input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(to right, #0a1e3a, #00d9ff);
      outline: none;
      -webkit-appearance: none;
    }
    
    .control-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffd700;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
    }
    
    .control-group input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffd700;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
    }
    
    .value-display {
      color: #2d9d5f;
      font-size: 0.9rem;
      margin-top: 0.4rem;
      font-weight: 600;
    }
    
    .button-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    
    button {
      flex: 1;
      padding: 0.6rem;
      background: linear-gradient(135deg, #2d9d5f 0%, #1f6b42 100%);
      border: 1px solid #00d9ff;
      color: #f0f0f0;
      border-radius: 6px;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.3s ease;
    }
    
    button:hover {
      background: linear-gradient(135deg, #45c97e 0%, #2d9d5f 100%);
      box-shadow: 0 0 12px rgba(45, 157, 95, 0.6);
    }
    
    button:active {
      transform: scale(0.98);
    }
    
    .stats-panel {
      background: rgba(45, 157, 95, 0.2);
      border: 1px solid rgba(45, 157, 95, 0.4);
      border-radius: 6px;
      padding: 1rem;
      margin-top: 1.5rem;
    }
    
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.6rem;
      font-size: 0.85rem;
    }
    
    .stat-label {
      color: #b0b0b0;
    }
    
    .stat-value {
      color: #00ff88;
      font-weight: 600;
      font-family: 'Syne', sans-serif;
    }
    
    .canvas-container {
      background: radial-gradient(circle at 50% 30%, rgba(45, 157, 95, 0.1), rgba(10, 30, 58, 0.8));
      border: 1px solid rgba(45, 157, 95, 0.3);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(180deg, #0a1e3a 0%, #0f2540 100%);
    }
    
    .legend {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 0.8rem;
      margin-top: 1rem;
      font-size: 0.8rem;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    
    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(0, 217, 255, 0.4);
    }
    
    @media (max-width: 768px) {
      .layout {
        grid-template-columns: 1fr;
      }
      
      .header h1 {
        font-size: 1.8rem;
      }
      
      .controls {
        order: 2;
      }
      
      .canvas-container {
        order: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🪸 Reef Guard</h1>
      <p>Real coral ecosystem simulator with bleaching dynamics</p>
    </div>
    
    <div class="layout">
      <div class="controls">
        <div class="button-group">
          <button onclick="addCoral()">+ Coral</button>
          <button onclick="reset()">Reset</button>
        </div>
        
        <div class="control-group">
          <label>Temperature</label>
          <input type="range" id="tempSlider" min="20" max="32" step="0.1" value="26" oninput="updateEnv()">
          <div class="value-display"><span id="tempValue">26</span>°C</div>
        </div>
        
        <div class="control-group">
          <label>Sunlight</label>
          <input type="range" id="sunSlider" min="0" max="100" step="1" value="80" oninput="updateEnv()">
          <div class="value-display"><span id="sunValue">80</span>%</div>
        </div>
        
        <div class="control-group">
          <label>Nutrients</label>
          <input type="range" id="nutSlider" min="0" max="100" step="1" value="70" oninput="updateEnv()">
          <div class="value-display"><span id="nutValue">70</span>%</div>
        </div>
        
        <div class="stats-panel">
          <div class="stat-row">
            <span class="stat-label">Reef Health</span>
            <span class="stat-value" id="healthStat">85%</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Coral Count</span>
            <span class="stat-value" id="coralStat">8</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Bleached</span>
            <span class="stat-value" id="bleachStat">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">pH</span>
            <span class="stat-value" id="phStat">8.20</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Algae Density</span>
            <span class="stat-value" id="algaeStat">78%</span>
          </div>
        </div>
        
        <div class="legend" style="margin-top: 1.5rem;">
          <div class="legend-item">
            <div class="legend-color" style="background: #00ff88;"></div>
            <span>Healthy</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background: #ffd700;"></div>
            <span>Stressed</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background: #f0f0f0;"></div>
            <span>Bleached</span>
          </div>
        </div>
      </div>
      
      <div class="canvas-container">
        <canvas id="reefCanvas"></canvas>
      </div>
    </div>
  </div>
  
  <script>
    const canvas = document.getElementById('reefCanvas');
    const ctx = canvas.getContext('2d');
    let animationId;
    
    // Resize canvas
    function resizeCanvas() {
      canvas.width = canvas.offsetWidth * window.devicePixelRatio;
      canvas.height = 500 * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    // Ecosystem data
    let corals = [];
    let fishes = [];
    let environment = {
      temp: 26,
      sunlight: 80,
      nutrients: 70,
      time: 0
    };
    
    // Initialize with 8 corals
    function initializeReef() {
      corals = [];
      fishes = [];
      for (let i = 0; i < 8; i++) {
        addCoralInternal();
      }
    }
    
    function addCoral() {
      if (corals.length < 25) {
        addCoralInternal();
      }
    }
    
    function addCoralInternal() {
      corals.push({
        x: Math.random() * (canvas.width / window.devicePixelRatio - 40) + 20,
        y: Math.random() * (canvas.height / window.devicePixelRatio - 40) + 20,
        size: 15 + Math.random() * 10,
        health: 100,
        algaeDensity: 85 + Math.random() * 15,
        state: 'healthy'
      });
    }
    
    function updateEnv() {
      environment.temp = parseFloat(document.getElementById('tempSlider').value);
      environment.sunlight = parseFloat(document.getElementById('sunSlider').value);
      environment.nutrients = parseFloat(document.getElementById('nutSlider').value);
      
      document.getElementById('tempValue').textContent = environment.temp.toFixed(1);
      document.getElementById('sunValue').textContent = environment.sunlight;
      document.getElementById('nutValue').textContent = environment.nutrients;
      
      // Update pH based on temperature
      const ph = (8.3 - 0.002 * (32 - environment.temp)).toFixed(2);
      document.getElementById('phStat').textContent = ph;
    }
    
    function updateCoral(coral) {
      const bleachThreshold = 28;
      const stressThreshold = 26.5;
      
      // Environmental stress
      let stressValue = 0;
      if (environment.temp > bleachThreshold) stressValue += 40;
      else if (environment.temp > stressThreshold) stressValue += 20;
      
      if (environment.sunlight > 80) stressValue += 20;
      if (environment.nutrients < 20) stressValue += 30;
      
      // Health degrades under stress
      if (stressValue > 0) {
        coral.health = Math.max(0, coral.health - stressValue * 0.01);
      } else {
        coral.health = Math.min(100, coral.health + 0.5);
      }
      
      // Algae symbiosis affected by stress
      coral.algaeDensity = Math.max(10, coral.algaeDensity - stressValue * 0.02);
      
      // State transitions
      if (coral.health < 20) {
        coral.state = 'bleached';
      } else if (coral.health < 50) {
        coral.state = 'stressed';
      } else {
        coral.state = 'healthy';
      }
      
      // Recovery when conditions improve
      if (stressValue === 0 && coral.state !== 'bleached') {
        coral.algaeDensity = Math.min(95, coral.algaeDensity + 1);
      }
    }
    
    function drawCoral(coral) {
      const colors = {
        healthy: '#00ff88',
        stressed: '#ffd700',
        bleached: '#f0f0f0'
      };
      
      ctx.save();
      ctx.translate(coral.x, coral.y);
      
      // Glow effect
      const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, coral.size * 1.5);
      if (coral.state === 'healthy') {
        gradient.addColorStop(0, 'rgba(0, 255, 136, 0.4)');
        gradient.addColorStop(1, 'rgba(0, 255, 136, 0)');
      } else if (coral.state === 'stressed') {
        gradient.addColorStop(0, 'rgba(255, 215, 0, 0.3)');
        gradient.addColorStop(1, 'rgba(255, 215, 0, 0)');
      } else {
        gradient.addColorStop(0, 'rgba(240, 240, 240, 0.2)');
        gradient.addColorStop(1, 'rgba(240, 240, 240, 0)');
      }
      
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(0, 0, coral.size * 1.5, 0, Math.PI * 2);
      ctx.fill();
      
      // Coral body
      ctx.fillStyle = colors[coral.state];
      ctx.beginPath();
      ctx.arc(0, 0, coral.size, 0, Math.PI * 2);
      ctx.fill();
      
      // Branch details
      ctx.strokeStyle = colors[coral.state];
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.6;
      for (let i = 0; i < 4; i++) {
        const angle = (i / 4) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(
          Math.cos(angle) * coral.size * 0.8,
          Math.sin(angle) * coral.size * 0.8
        );
        ctx.stroke();
      }
      
      ctx.globalAlpha = 1;
      ctx.restore();
    }
    
    function updateStats() {
      if (corals.length === 0) {
        document.getElementById('healthStat').textContent = '0%';
        document.getElementById('coralStat').textContent = '0';
        document.getElementById('bleachStat').textContent = '0';
        document.getElementById('algaeStat').textContent = '0%';
        return;
      }
      
      let totalHealth = 0;
      let bleachedCount = 0;
      let totalAlgae = 0;
      
      corals.forEach(coral => {
        totalHealth += coral.health;
        if (coral.state === 'bleached') bleachedCount++;
        totalAlgae += coral.algaeDensity;
      });
      
      const avgHealth = Math.round(totalHealth / corals.length);
      const avgAlgae = Math.round(totalAlgae / corals.length);
      
      document.getElementById('healthStat').textContent = avgHealth + '%';
      document.getElementById('coralStat').textContent = corals.length;
      document.getElementById('bleachStat').textContent = bleachedCount;
      document.getElementById('algaeStat').textContent = avgAlgae + '%';
    }
    
    function animate() {
      // Clear canvas
      ctx.fillStyle = 'rgba(10, 30, 58, 0.1)';
      ctx.fillRect(0, 0, canvas.width / window.devicePixelRatio, canvas.height / window.devicePixelRatio);
      
      // Update and draw corals
      corals.forEach(coral => {
        updateCoral(coral);
        drawCoral(coral);
      });
      
      // Update stats
      updateStats();
      
      environment.time++;
      animationId = requestAnimationFrame(animate);
    }
    
    function reset() {
      corals = [];
      fishes = [];
      environment = { temp: 26, sunlight: 80, nutrients: 70, time: 0 };
      document.getElementById('tempSlider').value = 26;
      document.getElementById('sunSlider').value = 80;
      document.getElementById('nutSlider').value = 70;
      updateEnv();
      initializeReef();
    }
    
    // Start
    updateEnv();
    initializeReef();
    animate();
  </script>
</body>
</html>
