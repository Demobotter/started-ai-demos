<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etymology Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1a1625 0%, #2d1b3d 100%);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
      background: rgba(15, 10, 25, 0.7);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #70e8e8 0%, #d4a5ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #a0a0a0;
      margin-bottom: 2rem;
    }
    .search-box {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid #70e8e8;
      border-radius: 8px;
      background: rgba(30, 20, 45, 0.5);
      color: #e0e0e0;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
    }
    input::placeholder {
      color: #707080;
    }
    input:focus {
      outline: none;
      border-color: #d4a5ff;
      box-shadow: 0 0 12px rgba(212, 165, 255, 0.2);
    }
    button {
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, #70e8e8 0%, #d4a5ff 100%);
      border: none;
      border-radius: 8px;
      color: #1a1625;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(112, 232, 232, 0.3);
    }
    button:active {
      transform: translateY(0);
    }
    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(112, 232, 232, 0.3);
      border-top-color: #70e8e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button:disabled .spinner { display: inline-block; margin-right: 0.5rem; }

    .results {
      display: none;
      gap: 2rem;
    }
    .results.show { display: grid; grid-template-columns: 1fr 1fr; }
    @media (max-width: 768px) {
      .results.show { grid-template-columns: 1fr; }
    }

    .word-card {
      background: rgba(45, 27, 61, 0.6);
      border: 1px solid #70e8e8;
      border-radius: 8px;
      padding: 1.5rem;
    }
    .word-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: #70e8e8;
      margin-bottom: 0.5rem;
    }
    .word-card .label {
      font-size: 0.85rem;
      color: #d4a5ff;
      font-weight: 500;
      margin-bottom: 1rem;
    }
    .etymology-line {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #c0c0c0;
    }
    .language-tag {
      display: inline-block;
      background: rgba(112, 232, 232, 0.15);
      color: #70e8e8;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-size: 0.8rem;
      margin: 0 0.3rem 0.3rem 0;
      font-weight: 500;
    }

    .tree-container {
      background: rgba(45, 27, 61, 0.6);
      border: 1px solid #d4a5ff;
      border-radius: 8px;
      padding: 1.5rem;
      max-height: 500px;
      overflow-y: auto;
    }
    .tree-container h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      color: #d4a5ff;
      margin-bottom: 1rem;
    }
    .tree-item {
      margin: 0.75rem 0;
      padding-left: 1.5rem;
      border-left: 2px solid rgba(212, 165, 255, 0.3);
      font-size: 0.95rem;
    }
    .tree-item.root {
      border-left: 2px solid #70e8e8;
      padding-left: 0;
      margin-left: 0;
      font-weight: 600;
      color: #70e8e8;
      margin-bottom: 1rem;
    }
    .tree-depth-1 { border-left-color: rgba(212, 165, 255, 0.6); }
    .tree-depth-2 { border-left-color: rgba(112, 232, 232, 0.4); font-size: 0.9rem; color: #b0b0b0; }
    .cognate-badge {
      display: inline-block;
      background: rgba(212, 165, 255, 0.2);
      color: #d4a5ff;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      font-size: 0.75rem;
      margin-left: 0.5rem;
    }

    .error {
      display: none;
      background: rgba(255, 107, 107, 0.2);
      border: 1px solid #ff6b6b;
      color: #ff9999;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .error.show { display: block; }

    .meta {
      font-size: 0.8rem;
      color: #808080;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(112, 232, 232, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📖 Etymology Explorer</h1>
    <p class="subtitle">Type a word and trace its linguistic roots across centuries.</p>
    
    <div class="search-box">
      <input type="text" id="wordInput" placeholder="Enter a word (e.g., 'philosophy', 'breakfast', 'serendipity')..." autocomplete="off">
      <button id="searchBtn">
        <span class="spinner"></span>
        Trace
      </button>
    </div>

    <div class="error" id="error"></div>

    <div class="results" id="results">
      <div class="word-card">
        <h2 id="currentWord"></h2>
        <div class="label" id="posLabel"></div>
        <div class="etymology-line" id="etymologyText"></div>
        <div class="meta" id="meta"></div>
      </div>
      <div class="tree-container">
        <h3>Language Lineage</h3>
        <div id="treeView"></div>
      </div>
    </div>
  </div>

  <script>
    // Wiktionary API: https://en.wiktionary.org/w/api.php
    // Language mappings for display
    const langMap = {
      'Latin': '🇱🇹', 'Greek': '🇬🇷', 'Old English': '🏴󠁧󠁢󠁥󠁮󠁧󠁿', 'Germanic': '🇩🇪',
      'French': '🇫🇷', 'Sanskrit': '🇮🇳', 'Proto-Indo-European': '🌍', 'Middle English': '🏴󠁧󠁢󠁥󠁮󠁧󠁿',
      'Proto-Germanic': '🇩🇪', 'Arabic': '🇸🇦', 'Hebrew': '🇮🇱', 'Old Norse': '🇸🇪',
      'Italian': '🇮🇹', 'Spanish': '🇪🇸', 'German': '🇩🇪', 'Dutch': '🇳🇱'
    };

    async function fetchEtymology(word) {
      const btn = document.getElementById('searchBtn');
      const errorEl = document.getElementById('error');
      const resultsEl = document.getElementById('results');
      
      btn.disabled = true;
      errorEl.classList.remove('show');
      resultsEl.classList.remove('show');

      try {
        const resp = await fetch(
          `https://en.wiktionary.org/w/api.php?action=query&titles=${encodeURIComponent(word)}&prop=extracts&explaintext=true&format=json&origin=*`
        );
        if (!resp.ok) throw new Error('Failed to fetch Wiktionary');
        
        const data = await resp.json();
        const pages = data.query.pages;
        const pageId = Object.keys(pages)[0];
        const page = pages[pageId];
        
        if (!page.extract) throw new Error(`No etymology found for "${word}"`);
        
        const extract = page.extract;
        const etymMatch = extract.match(/Etymology[\s\S]*?(?=\n\n|$)/);
        if (!etymMatch) throw new Error(`No etymology data for "${word}"`);
        
        const etymText = etymMatch[0].replace(/Etymology\n/, '').split('\n')[0];
        
        // Parse languages mentioned (crude but effective)
        const langs = [];
        const langRx = new RegExp(Object.keys(langMap).join('|'), 'g');
        const matches = etymText.match(langRx);
        if (matches) {
          langs.push(...new Set(matches));
        }
        
        renderResult(word, etymText, langs);
      } catch (err) {
        errorEl.textContent = `⚠️ ${err.message}`;
        errorEl.classList.add('show');
      } finally {
        btn.disabled = false;
      }
    }

    function renderResult(word, etymText, langs) {
      const resultsEl = document.getElementById('results');
      const currentWord = document.getElementById('currentWord');
      const etymologyText = document.getElementById('etymologyText');
      const treeView = document.getElementById('treeView');
      const meta = document.getElementById('meta');
      
      currentWord.textContent = word;
      etymologyText.textContent = etymText;
      
      // Build language tree
      let treeHtml = `<div class="tree-item root">Modern English: ${word}</div>`;
      langs.forEach((lang, i) => {
        treeHtml += `
          <div class="tree-item tree-depth-${Math.min(i + 1, 2)}">
            ${langMap[lang] || ''} ${lang}
          </div>
        `;
      });
      treeView.innerHTML = treeHtml;
      
      meta.innerHTML = `<strong>Languages:</strong> ${langs.join(', ') || 'Unknown'}<br><strong>Source:</strong> Wiktionary API`;
      
      resultsEl.classList.add('show');
    }

    document.getElementById('searchBtn').addEventListener('click', () => {
      const word = document.getElementById('wordInput').value.trim();
      if (word) fetchEtymology(word);
    });

    document.getElementById('wordInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('searchBtn').click();
    });

    // Example on load
    window.addEventListener('load', () => {
      document.getElementById('wordInput').value = 'serendipity';
    });
  </script>
</body>
</html>
