<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etymology Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0e1e 0%, #1a1628 100%);
            color: #e8e6f0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(26, 22, 40, 0.6);
            border: 1px solid rgba(112, 232, 232, 0.2);
            border-radius: 12px;
            padding: 40px;
            backdrop-filter: blur(10px);
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #70e8e8 0%, #d4a5ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: #a8a0c0;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        
        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }
        
        input {
            flex: 1;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(112, 232, 232, 0.3);
            border-radius: 8px;
            color: #e8e6f0;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }
        
        input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.12);
            border-color: #70e8e8;
            box-shadow: 0 0 12px rgba(112, 232, 232, 0.2);
        }
        
        input::placeholder {
            color: #7a7290;
        }
        
        button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #70e8e8 0%, #4db8ff 100%);
            border: none;
            border-radius: 8px;
            color: #0f0e1e;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(112, 232, 232, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result {
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        .result.show {
            display: block;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .word-display {
            background: rgba(112, 232, 232, 0.08);
            border-left: 4px solid #70e8e8;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .word-title {
            font-size: 2rem;
            font-weight: 700;
            color: #70e8e8;
            margin-bottom: 8px;
        }
        
        .etymology-tree {
            background: rgba(26, 22, 40, 0.4);
            border: 1px solid rgba(212, 165, 255, 0.2);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .tree-title {
            font-weight: 600;
            color: #d4a5ff;
            margin-bottom: 16px;
            font-size: 1.05rem;
        }
        
        .tree-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 12px;
            padding-left: 20px;
            position: relative;
        }
        
        .tree-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 8px;
            width: 8px;
            height: 8px;
            background: #d4a5ff;
            border-radius: 50%;
        }
        
        .tree-content {
            flex: 1;
        }
        
        .language {
            color: #a8a0c0;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .form {
            color: #e8e6f0;
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .meaning {
            color: #999099;
            font-size: 0.9rem;
            font-style: italic;
        }
        
        .cognates-section {
            background: rgba(26, 22, 40, 0.4);
            border: 1px solid rgba(70, 184, 255, 0.2);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .cognates-title {
            font-weight: 600;
            color: #4db8ff;
            margin-bottom: 16px;
            font-size: 1.05rem;
        }
        
        .cognates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }
        
        .cognate-badge {
            background: rgba(70, 184, 255, 0.1);
            border: 1px solid rgba(70, 184, 255, 0.3);
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }
        
        .cognate-word {
            font-weight: 600;
            color: #4db8ff;
            margin-bottom: 4px;
        }
        
        .cognate-lang {
            font-size: 0.8rem;
            color: #a8a0c0;
        }
        
        .error {
            background: rgba(255, 107, 107, 0.1);
            border-left: 4px solid #ff6b6b;
            padding: 16px;
            border-radius: 8px;
            color: #ff9999;
            margin-bottom: 20px;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #a8a0c0;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 24px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .search-box {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
            
            .cognates-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 Etymology Explorer</h1>
        <p class="subtitle">Trace the origins of English words through language history</p>
        
        <div class="search-box">
            <input type="text" id="wordInput" placeholder="Enter a word (e.g., 'beautiful', 'serendipity', 'calendar')..." autocomplete="off">
            <button onclick="searchWord()">Explore</button>
        </div>
        
        <div id="result" class="result"></div>
    </div>

    <script>
        // Etymology database with common English words
        const etymologyDB = {
            'beautiful': {
                word: 'beautiful',
                origin: 'Old French',
                tree: [
                    { lang: 'Old French', form: 'beau', meaning: 'fair, lovely' },
                    { lang: 'Latin', form: 'bellus', meaning: 'beautiful, pretty' },
                    { lang: 'Proto-Indo-European', form: '*duell-', meaning: 'to shine' }
                ],
                cognates: [
                    { word: 'belle', lang: 'French' },
                    { word: 'belleza', lang: 'Spanish' },
                    { word: 'bellissimo', lang: 'Italian' },
                    { word: 'bello', lang: 'Spanish' }
                ]
            },
            'serendipity': {
                word: 'serendipity',
                origin: 'Persian',
                tree: [
                    { lang: 'English (1754)', form: 'serendipity', meaning: 'faculty of making happy discoveries by chance' },
                    { lang: 'Persian', form: 'Sarandip', meaning: 'Sri Lanka (poetic)' },
                    { lang: 'Sanskrit', form: 'Siṃhaladvīpa', meaning: 'island of the Sinhalese' }
                ],
                cognates: [
                    { word: 'serendipitous', lang: 'English' },
                    { word: 'Sarandip', lang: 'Persian' },
                    { word: 'Ceylonese', lang: 'English' }
                ]
            },
            'calendar': {
                word: 'calendar',
                origin: 'Latin',
                tree: [
                    { lang: 'Latin', form: 'calendarium', meaning: 'money-lender\'s account book' },
                    { lang: 'Latin', form: 'calendae', meaning: 'first day of month' },
                    { lang: 'Latin', form: 'calare', meaning: 'to announce, call out' }
                ],
                cognates: [
                    { word: 'calendrier', lang: 'French' },
                    { word: 'calendario', lang: 'Spanish' },
                    { word: 'calandrier', lang: 'Old French' },
                    { word: 'calends', lang: 'English (archaic)' }
                ]
            },
            'robot': {
                word: 'robot',
                origin: 'Czech',
                tree: [
                    { lang: 'Czech (1920)', form: 'robot', meaning: 'forced labor, drudgery' },
                    { lang: 'Czech', form: 'robota', meaning: 'work, labor' },
                    { lang: 'Old Church Slavonic', form: 'rabota', meaning: 'servitude' }
                ],
                cognates: [
                    { word: 'robota', lang: 'Polish' },
                    { word: 'робота', lang: 'Ukrainian' },
                    { word: 'robota', lang: 'Czech' }
                ]
            },
            'algorithm': {
                word: 'algorithm',
                origin: 'Persian',
                tree: [
                    { lang: 'Medieval Latin', form: 'algoritmus', meaning: 'arithmetic process' },
                    { lang: 'Arabic', form: 'al-Khwārizmī', meaning: 'from Khwarezm' },
                    { lang: 'Persian', form: 'Khorezm', meaning: 'historical region' }
                ],
                cognates: [
                    { word: 'arithmetik', lang: 'Old French' },
                    { word: 'algoritmo', lang: 'Spanish' },
                    { word: 'algorisme', lang: 'Old French' }
                ]
            },
            'algebra': {
                word: 'algebra',
                origin: 'Arabic',
                tree: [
                    { lang: 'English (16th c.)', form: 'algebra', meaning: 'restoration, reunion' },
                    { lang: 'Arabic', form: 'al-jabr', meaning: 'restoration (of bone)' },
                    { lang: 'Semitic root', form: 'JBR', meaning: 'to mend, restore' }
                ],
                cognates: [
                    { word: 'algèbre', lang: 'French' },
                    { word: 'álgebra', lang: 'Spanish' },
                    { word: 'algérie', lang: 'French (country)' }
                ]
            },
            'adventure': {
                word: 'adventure',
                origin: 'Latin',
                tree: [
                    { lang: 'Old French', form: 'aventure', meaning: 'that which happens by chance' },
                    { lang: 'Latin', form: 'adventura', meaning: 'about to happen' },
                    { lang: 'Latin', form: 'advenire', meaning: 'to arrive, happen' }
                ],
                cognates: [
                    { word: 'aventure', lang: 'Old French' },
                    { word: 'avventura', lang: 'Italian' },
                    { word: 'aventura', lang: 'Spanish' }
                ]
            },
            'music': {
                word: 'music',
                origin: 'Greek',
                tree: [
                    { lang: 'Old French', form: 'musique', meaning: 'art of music' },
                    { lang: 'Latin', form: 'musica', meaning: 'art of music, harmony' },
                    { lang: 'Greek', form: 'mousikē', meaning: 'of the Muses' }
                ],
                cognates: [
                    { word: 'musique', lang: 'French' },
                    { word: 'música', lang: 'Spanish' },
                    { word: 'musica', lang: 'Italian' }
                ]
            },
            'calendar': {
                word: 'calendar',
                origin: 'Latin',
                tree: [
                    { lang: 'Latin', form: 'calendarium', meaning: 'account book' },
                    { lang: 'Latin', form: 'calendae', meaning: 'first day of the month' },
                    { lang: 'Latin', form: 'calare', meaning: 'to call, announce' }
                ],
                cognates: [
                    { word: 'calendrier', lang: 'French' },
                    { word: 'calendario', lang: 'Spanish' },
                    { word: 'calends', lang: 'English' }
                ]
            },
            'kindergarten': {
                word: 'kindergarten',
                origin: 'German',
                tree: [
                    { lang: 'German (1840)', form: 'Kindergarten', meaning: 'children\'s garden' },
                    { lang: 'German', form: 'Kinder', meaning: 'children (plural)' },
                    { lang: 'German', form: 'Garten', meaning: 'garden' }
                ],
                cognates: [
                    { word: 'kindergarten', lang: 'English' },
                    { word: 'jardin d\'enfants', lang: 'French' },
                    { word: 'jardín de infancia', lang: 'Spanish' }
                ]
            },
            'tsunami': {
                word: 'tsunami',
                origin: 'Japanese',
                tree: [
                    { lang: 'Japanese (1868)', form: 'tsunami', meaning: 'harbor wave' },
                    { lang: 'Japanese', form: 'tsu', meaning: 'harbor' },
                    { lang: 'Japanese', form: 'nami', meaning: 'wave' }
                ],
                cognates: [
                    { word: 'tsunami', lang: 'English' },
                    { word: 'tsunami', lang: 'French' },
                    { word: 'tsunami', lang: 'Spanish' }
                ]
            },
            'karaoke': {
                word: 'karaoke',
                origin: 'Japanese',
                tree: [
                    { lang: 'Japanese (1960s)', form: 'karaoke', meaning: 'empty orchestra' },
                    { lang: 'Japanese', form: 'kara', meaning: 'empty' },
                    { lang: 'Japanese', form: 'ōkesutora', meaning: 'orchestra' }
                ],
                cognates: [
                    { word: 'karaoke', lang: 'English' },
                    { word: 'karaoké', lang: 'French' },
                    { word: 'karaoke', lang: 'Spanish' }
                ]
            },
            'emoji': {
                word: 'emoji',
                origin: 'Japanese',
                tree: [
                    { lang: 'Japanese (1999)', form: 'emoji', meaning: 'picture character' },
                    { lang: 'Japanese', form: 'e', meaning: 'picture' },
                    { lang: 'Japanese', form: 'moji', meaning: 'character' }
                ],
                cognates: [
                    { word: 'emoji', lang: 'English' },
                    { word: 'emojis', lang: 'French' },
                    { word: 'emoji', lang: 'Spanish' }
                ]
            }
        };

        function searchWord() {
            const input = document.getElementById('wordInput').value.trim().toLowerCase();
            const result = document.getElementById('result');
            
            if (!input) {
                result.innerHTML = '<div class="error">Please enter a word to explore.</div>';
                result.classList.add('show');
                return;
            }
            
            result.innerHTML = '<div class="loading">Searching etymology database...</div>';
            result.classList.add('show');
            
            setTimeout(() => {
                const data = etymologyDB[input];
                
                if (!data) {
                    result.innerHTML = `<div class="error">Etymology for "${input}" not found in database. Try: beautiful, serendipity, calendar, robot, algorithm, music, adventure, tsunami, karaoke, emoji, kindergarten, or algebra.</div>`;
                } else {
                    displayEtymology(data);
                }
            }, 300);
        }

        function displayEtymology(data) {
            const result = document.getElementById('result');
            
            let html = `
                <div class="word-display">
                    <div class="word-title">${data.word}</div>
                    <div class="language">Origin: ${data.origin}</div>
                </div>
                
                <div class="etymology-tree">
                    <div class="tree-title">📜 Etymology Chain</div>
            `;
            
            data.tree.forEach(item => {
                html += `
                    <div class="tree-item">
                        <div class="tree-content">
                            <div class="language">${item.lang}</div>
                            <div class="form">${item.form}</div>
                            <div class="meaning">${item.meaning}</div>
                        </div>
                    </div>
                `;
            });
            
            html += `
                </div>
                
                <div class="cognates-section">
                    <div class="cognates-title">🌍 Related Words in Other Languages</div>
                    <div class="cognates-grid">
            `;
            
            data.cognates.forEach(cognate => {
                html += `
                    <div class="cognate-badge">
                        <div class="cognate-word">${cognate.word}</div>
                        <div class="cognate-lang">${cognate.lang}</div>
                    </div>
                `;
            });
            
            html += `
                    </div>
                </div>
            `;
            
            result.innerHTML = html;
        }

        // Allow Enter key to search
        document.getElementById('wordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchWord();
        });
    </script>
</body>
</html>
