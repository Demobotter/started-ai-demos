<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etymology Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Lato:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Lato', sans-serif;
      background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      max-width: 700px;
      width: 100%;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      font-family: 'Merriweather', serif;
      font-size: 2.2rem;
      color: #7fb3ff;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #a0a0a0;
      font-style: italic;
    }
    .input-box {
      margin-bottom: 25px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      font-family: 'Lato', sans-serif;
      font-size: 1rem;
      border: 2px solid #7fb3ff;
      border-radius: 8px;
      background: #1a2332;
      color: #e0e0e0;
      transition: all 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #ff9ecb;
      box-shadow: 0 0 12px rgba(255, 158, 203, 0.3);
    }
    input::placeholder {
      color: #506080;
    }
    .status {
      margin-bottom: 20px;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      display: none;
    }
    .status.loading {
      background: rgba(127, 179, 255, 0.15);
      color: #7fb3ff;
      display: block;
    }
    .status.error {
      background: rgba(255, 107, 107, 0.15);
      color: #ff6b6b;
      display: block;
    }
    .status.success {
      background: rgba(76, 184, 152, 0.15);
      color: #4cb898;
      display: block;
    }
    .results {
      display: none;
    }
    .results.active {
      display: block;
    }
    .word-card {
      background: rgba(26, 35, 50, 0.6);
      border: 1px solid #7fb3ff;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .word-display {
      font-family: 'Merriweather', serif;
      font-size: 1.8rem;
      color: #7fb3ff;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .word-pos {
      font-size: 0.85rem;
      color: #9fb3cc;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .etymology-section {
      margin-bottom: 20px;
    }
    .etymology-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ff9ecb;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .etymology-text {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #d0d0d0;
      padding: 12px;
      background: rgba(127, 179, 255, 0.08);
      border-left: 3px solid #7fb3ff;
      border-radius: 4px;
    }
    .language-tree {
      margin-top: 20px;
    }
    .tree-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ff9ecb;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .tree-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }
    .tree-arrow {
      color: #7fb3ff;
      margin: 0 8px;
      font-weight: bold;
    }
    .tree-lang {
      background: rgba(127, 179, 255, 0.15);
      padding: 4px 10px;
      border-radius: 4px;
      color: #7fb3ff;
    }
    .no-data {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.3);
      border-radius: 6px;
      padding: 16px;
      color: #ff9999;
      font-size: 0.9rem;
    }
    @media (max-width: 600px) {
      h1 { font-size: 1.8rem; }
      .word-display { font-size: 1.4rem; }
      input { font-size: 16px; } /* iOS zoom fix */
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Etymology Explorer</h1>
      <p class="subtitle">Trace the linguistic roots of any English word</p>
    </header>
    
    <div class="input-box">
      <input
        type="text"
        id="wordInput"
        placeholder="Enter a word (e.g., 'tree', 'etymology', 'computer')"
        autocomplete="off"
      >
    </div>
    
    <div class="status" id="status"></div>
    
    <div class="results" id="results"></div>
  </div>

  <script>
    const input = document.getElementById('wordInput');
    const status = document.getElementById('status');
    const resultsContainer = document.getElementById('results');

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const word = input.value.trim().toLowerCase();
        if (word.length > 0) {
          fetchEtymology(word);
        }
      }
    });

    async function fetchEtymology(word) {
      showStatus('Searching for etymology…', 'loading');
      resultsContainer.classList.remove('active');

      try {
        // Fetch from Wiktionary API
        const resp = await fetch(
          `https://en.wiktionary.org/api/rest_v1/page/definition/${encodeURIComponent(word)}`,
          { headers: { 'User-Agent': 'EtymologyExplorer/1.0' } }
        );

        if (!resp.ok) {
          showStatus(`No entry found for "${word}". Try another word.`, 'error');
          return;
        }

        const data = await resp.json();
        const definitions = data.definitions || [];

        if (definitions.length === 0) {
          showStatus(`No etymology data available for "${word}".`, 'error');
          return;
        }

        // Look for etymology in definitions
        let etymologyFound = false;
        let html = `<div class="word-card">
          <div class="word-display">${word}</div>`;

        for (const def of definitions) {
          const partOfSpeech = def.partOfSpeech || 'Word';
          html += `<div class="word-pos">${partOfSpeech}</div>`;

          if (def.etymology && def.etymology.length > 0) {
            etymologyFound = true;
            html += `<div class="etymology-section">
              <div class="etymology-label">Etymology</div>
              <div class="etymology-text">${escapeHtml(def.etymology[0])}</div>
            </div>`;
          }

          if (def.definitions && def.definitions.length > 0) {
            html += `<div class="etymology-section">
              <div class="etymology-label">Definition</div>
              <div class="etymology-text">${escapeHtml(def.definitions[0].definition)}</div>
            </div>`;
          }
        }

        // Build simple language tree from etymology text
        const tree = extractLanguageTree(definitions[0].etymology ? definitions[0].etymology[0] : '');
        if (tree.length > 0) {
          html += `<div class="language-tree">
            <div class="tree-label">Language Lineage</div>`;
          tree.forEach((lang, idx) => {
            html += `<div class="tree-item">
              ${idx > 0 ? '<span class="tree-arrow">←</span>' : ''}
              <span class="tree-lang">${lang}</span>
            </div>`;
          });
          html += `</div>`;
        }

        html += `</div>`;

        if (etymologyFound) {
          showStatus(`Found etymology for "${word}"`, 'success');
        } else {
          showStatus(`Limited etymology data for "${word}", but definition is available.`, 'success');
        }

        resultsContainer.innerHTML = html;
        resultsContainer.classList.add('active');

      } catch (err) {
        showStatus(`Error fetching data: ${err.message}`, 'error');
      }
    }

    function extractLanguageTree(etymText) {
      if (!etymText) return [];
      const languages = [
        'English', 'Old English', 'Middle English',
        'Latin', 'Proto-Latin', 'Vulgar Latin',
        'Greek', 'Ancient Greek', 'Proto-Greek',
        'Germanic', 'Proto-Germanic', 'Old Norse', 'Old High German',
        'French', 'Old French', 'Norman',
        'Spanish', 'Catalan', 'Italian', 'Portuguese',
        'Arabic', 'Hebrew', 'Sanskrit', 'Proto-Indo-European',
        'Dutch', 'German', 'Yiddish',
        'Celtic', 'Irish', 'Welsh', 'Breton'
      ];

      const found = [];
      languages.forEach(lang => {
        if (etymText.toLowerCase().includes(lang.toLowerCase())) {
          found.push(lang);
        }
      });

      // Reorder with English first
      const reordered = ['English'];
      found.forEach(lang => {
        if (lang !== 'English' && !reordered.includes(lang)) {
          reordered.push(lang);
        }
      });

      return reordered.slice(0, 6); // Max 6 languages
    }

    function showStatus(msg, type) {
      status.textContent = msg;
      status.className = `status ${type}`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Auto-focus on load
    window.addEventListener('load', () => {
      input.focus();
    });
  </script>
</body>
</html>
