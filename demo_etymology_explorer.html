<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etymology Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Lato', sans-serif;
      background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
      color: #e0e6ed;
      min-height: 100vh;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .container {
      max-width: 900px;
      width: 100%;
    }
    h1 {
      font-family: 'Merriweather', serif;
      font-size: 2.2rem;
      text-align: center;
      margin-bottom: 0.5rem;
      color: #7fb3ff;
    }
    .subtitle {
      text-align: center;
      color: #a0aac0;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    .search-box {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    input {
      flex: 1;
      padding: 0.9rem 1.2rem;
      background: #1a2332;
      border: 1px solid #7fb3ff;
      border-radius: 6px;
      color: #e0e6ed;
      font-family: 'Lato', sans-serif;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #a8d4ff;
    }
    button {
      padding: 0.9rem 2rem;
      background: #7fb3ff;
      border: none;
      border-radius: 6px;
      color: #0f1419;
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #a8d4ff;
    }
    .result {
      background: linear-gradient(135deg, #1a2332 0%, #253548 100%);
      border: 1px solid #7fb3ff;
      border-radius: 8px;
      padding: 1.8rem;
      margin-bottom: 1.5rem;
    }
    .result.error {
      border-color: #ff6b6b;
      color: #ff9999;
    }
    .word-header {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 1.2rem;
      border-bottom: 2px solid #7fb3ff;
      padding-bottom: 0.8rem;
    }
    .word-header h2 {
      font-family: 'Merriweather', serif;
      font-size: 1.8rem;
      color: #7fb3ff;
    }
    .word-header .lang {
      color: #a0aac0;
      font-size: 0.9rem;
      font-style: italic;
    }
    .section {
      margin-bottom: 1.5rem;
    }
    .section-title {
      font-weight: 700;
      color: #7fb3ff;
      margin-bottom: 0.6rem;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .etymology-text {
      color: #d0d8e8;
      line-height: 1.6;
      margin-bottom: 0.8rem;
    }
    .lineage {
      background: #0f1419;
      border-left: 3px solid #7fb3ff;
      padding: 0.8rem 1rem;
      border-radius: 4px;
      margin-bottom: 0.8rem;
    }
    .lineage-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }
    .lineage-item:last-child { margin-bottom: 0; }
    .lineage-arrow {
      color: #7fb3ff;
      font-weight: bold;
    }
    .lang-tag {
      background: #1a2332;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      font-size: 0.8rem;
      color: #a8d4ff;
      font-family: monospace;
    }
    .related-words {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.8rem;
    }
    .related-item {
      background: #0f1419;
      padding: 0.7rem;
      border-radius: 4px;
      border-left: 2px solid #7fb3ff;
      font-size: 0.85rem;
      color: #d0d8e8;
    }
    .loading {
      text-align: center;
      color: #7fb3ff;
      padding: 2rem;
    }
    @media (max-width: 600px) {
      h1 { font-size: 1.6rem; }
      .search-box { flex-direction: column; }
      .word-header { flex-direction: column; gap: 0.5rem; }
      .word-header h2 { font-size: 1.4rem; }
      .related-words { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Etymology Explorer</h1>
    <p class="subtitle">Trace the linguistic roots of any English word</p>
    
    <div class="search-box">
      <input type="text" id="wordInput" placeholder="Enter a word (e.g., 'serendipity', 'breakfast', 'telephone')" spellcheck="false">
      <button onclick="searchWord()">Explore</button>
    </div>
    
    <div id="result"></div>
  </div>

  <script>
    const resultDiv = document.getElementById('result');
    const wordInput = document.getElementById('wordInput');

    async function searchWord() {
      const word = wordInput.value.trim().toLowerCase();
      if (!word) return;
      
      resultDiv.innerHTML = '<div class="loading">Fetching etymology...</div>';
      
      try {
        const resp = await fetch(`https://en.wiktionary.org/api/rest_v1/page/html/${word}`);
        if (!resp.ok) throw new Error('Word not found');
        
        const html = await resp.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        
        const etymSection = doc.querySelector('[id*="Etymology"]') || doc.querySelector('[id*="etymology"]');
        if (!etymSection) {
          resultDiv.innerHTML = `<div class="result error">No etymology found for "${word}". Try another word.</div>`;
          return;
        }
        
        let etymText = '';
        let elem = etymSection.nextElementSibling;
        while (elem && elem.tagName !== 'H2' && elem.tagName !== 'H3') {
          etymText += elem.innerText + ' ';
          elem = elem.nextElementSibling;
        }
        
        etymText = etymText.trim().substring(0, 500);
        if (!etymText) etymText = 'Etymology data is available but complex. Check Wiktionary directly for full details.';
        
        // Parse language lineage (basic)
        const lineage = inferLineage(word, etymText);
        const related = inferRelated(word);
        
        resultDiv.innerHTML = `
          <div class="result">
            <div class="word-header">
              <h2>${word}</h2>
            </div>
            
            <div class="section">
              <div class="section-title">Etymology</div>
              <div class="etymology-text">${etymText}</div>
            </div>
            
            ${lineage ? `
            <div class="section">
              <div class="section-title">Language Family</div>
              <div class="lineage">
                ${lineage.map((item, i) => `
                  <div class="lineage-item">
                    ${i > 0 ? '<span class="lineage-arrow">↓</span>' : ''}
                    <span class="lang-tag">${item.lang}</span>
                    <span>${item.text}</span>
                  </div>
                `).join('')}
              </div>
            </div>
            ` : ''}
            
            ${related.length > 0 ? `
            <div class="section">
              <div class="section-title">Related Words</div>
              <div class="related-words">
                ${related.map(r => `<div class="related-item">${r}</div>`).join('')}
              </div>
            </div>
            ` : ''}
          </div>
        `;
        
      } catch (e) {
        resultDiv.innerHTML = `<div class="result error">Error: ${e.message}. Please try another word.</div>`;
      }
    }

    function inferLineage(word, etymText) {
      const patterns = [
        { lang: 'Latin', regex: /from Latin|Latin/ },
        { lang: 'Proto-Indo-European', regex: /from PIE|Proto-Indo-European/ },
        { lang: 'Old English', regex: /Old English|from OE|OE/ },
        { lang: 'Germanic', regex: /Germanic|Proto-Germanic/ },
        { lang: 'Greek', regex: /from Greek|Greek|Gk\./ },
        { lang: 'French', regex: /from French|French|Fr\./ },
        { lang: 'Arabic', regex: /from Arabic|Arabic/ },
        { lang: 'Norse', regex: /Old Norse|Norse/ },
        { lang: 'Dutch', regex: /from Dutch|Dutch/ }
      ];
      
      const found = patterns
        .filter(p => p.regex.test(etymText))
        .map(p => ({ lang: p.lang, text: `(traced in ${etymText.substring(0, 60).toLowerCase()}...)` }));
      
      if (found.length === 0) {
        return [
          { lang: 'Modern English', text: 'Contemporary form' },
          { lang: 'Earlier Form', text: '(check Wiktionary for full lineage)' }
        ];
      }
      
      return [
        { lang: 'Modern English', text: 'Contemporary form' },
        ...found,
        { lang: 'Proto-Indo-European', text: 'Ancient root (reconstructed)' }
      ];
    }

    function inferRelated(word) {
      const commonRoots = {
        'phone': ['telephone', 'microphone', 'symphony', 'megaphone', 'cellphone'],
        'graph': ['photograph', 'biography', 'paragraph', 'geography', 'telegraph'],
        'bio': ['biology', 'biography', 'biotech', 'microbe', 'antibiotic'],
        'geo': ['geography', 'geology', 'geometry', 'geothermal', 'geodesic'],
        'aqua': ['aquarium', 'aquatic', 'aqueduct', 'aquamarine', 'subaquatic'],
        'script': ['manuscript', 'transcript', 'description', 'subscription', 'prescription'],
        'dict': ['dictionary', 'dictate', 'jurisdiction', 'predict', 'contradict'],
        'port': ['portable', 'transport', 'export', 'import', 'deport'],
        'form': ['formation', 'performance', 'deformation', 'transform', 'uniform'],
        'ject': ['project', 'reject', 'inject', 'eject', 'trajectory']
      };
      
      for (const [root, relatives] of Object.entries(commonRoots)) {
        if (word.includes(root)) {
          return relatives.filter(r => r !== word).slice(0, 5);
        }
      }
      
      return [];
    }

    // Auto-load on Enter
    wordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchWord();
    });

    // Initial demo word
    window.addEventListener('load', () => {
      wordInput.value = 'etymology';
      searchWord();
    });
  </script>
</body>
</html>
