<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etymology Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Lato', sans-serif;
      background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { max-width: 800px; width: 100%; }
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    h1 {
      font-family: 'Merriweather', serif;
      font-size: 2.5rem;
      color: #ffffff;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #a0a0a0;
      font-weight: 400;
    }
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 30px;
    }
    input {
      flex: 1;
      padding: 12px 14px;
      background: #1a2332;
      border: 1px solid #7fb3ff;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: 'Lato', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #5da3ff; }
    button {
      padding: 12px 24px;
      background: #7fb3ff;
      border: none;
      border-radius: 4px;
      color: #0f1419;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Lato', sans-serif;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    button:hover { background: #5da3ff; }
    button:active { transform: scale(0.98); }
    .loading {
      text-align: center;
      color: #7fb3ff;
      margin: 20px 0;
      font-size: 0.9rem;
    }
    .error {
      background: #3d1f1f;
      border: 1px solid #8b3a3a;
      border-radius: 4px;
      padding: 12px;
      margin-bottom: 20px;
      color: #ff6b6b;
      font-size: 0.9rem;
    }
    .result {
      animation: slideIn 0.3s ease-out;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .word-card {
      background: #141820;
      border: 1px solid #2a3f5f;
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .word-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .word-main {
      font-family: 'Merriweather', serif;
      font-size: 1.8rem;
      color: #7fb3ff;
      font-weight: 700;
    }
    .word-ipa {
      font-size: 0.85rem;
      color: #a0c0ff;
      font-style: italic;
    }
    .word-definition {
      color: #c0c0c0;
      font-size: 0.95rem;
      margin-bottom: 15px;
      line-height: 1.5;
    }
    .etymology-section {
      margin-top: 15px;
    }
    .etymology-label {
      font-family: 'Merriweather', serif;
      font-size: 0.9rem;
      color: #7fb3ff;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .tree {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tree-node {
      padding: 8px 12px;
      background: #1f2a3a;
      border-left: 3px solid #7fb3ff;
      border-radius: 2px;
      font-size: 0.85rem;
      line-height: 1.4;
    }
    .tree-node.period-old { border-left-color: #6b8cff; }
    .tree-node.period-middle { border-left-color: #b86bff; }
    .tree-node.period-modern { border-left-color: #ff6b9d; }
    
    .cognates {
      margin-top: 15px;
    }
    .cognates-label {
      font-family: 'Merriweather', serif;
      font-size: 0.9rem;
      color: #7fb3ff;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .cognate-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .cognate {
      padding: 6px 10px;
      background: #1f2a3a;
      border: 1px solid #4a6f9f;
      border-radius: 3px;
      font-size: 0.8rem;
      color: #a0c0ff;
    }
    .cognate-lang {
      font-weight: 700;
      color: #7fb3ff;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.8rem; }
      .word-main { font-size: 1.4rem; }
      .search-box { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Etymology Explorer</h1>
      <p class="subtitle">Trace word origins through language families</p>
    </header>
    
    <div class="search-box">
      <input type="text" id="wordInput" placeholder="Enter a word (e.g., 'serendipity', 'etymology')" spellcheck="false">
      <button onclick="searchWord()">Search</button>
    </div>
    
    <div id="loadingDiv" class="loading" style="display: none;">Fetching etymology data...</div>
    <div id="errorDiv" class="error" style="display: none;"></div>
    <div id="resultDiv"></div>
  </div>

  <script>
    const wordInput = document.getElementById('wordInput');
    const loadingDiv = document.getElementById('loadingDiv');
    const errorDiv = document.getElementById('errorDiv');
    const resultDiv = document.getElementById('resultDiv');

    // Simulated etymology data (real data would come from Wiktionary API)
    const etymologyDB = {
      'serendipity': {
        word: 'serendipity',
        definition: 'The faculty of making happy discoveries by chance',
        ipa: '/ˌserənˈdɪpɪti/',
        etymology: [
          { text: 'Modern English (1754)', period: 'modern', lang: 'English' },
          { text: 'Coined by Horace Walpole from Persian tale "Serendip"', period: 'middle', lang: 'Persian' },
          { text: 'Serendip: Arabic "Sarandīb" (Sri Lanka)', period: 'middle', lang: 'Arabic' },
          { text: 'Sanskrit "Siṃhaladvīpa" (island of the Sinhalese)', period: 'old', lang: 'Sanskrit' },
          { text: 'Indo-European root *dʰwer- (dwelling)', period: 'old', lang: 'Indo-European' }
        ],
        cognates: [
          { lang: 'Persian', word: 'Sarandīb' },
          { lang: 'Arabic', word: 'سرنديب' },
          { lang: 'Sanskrit', word: 'सिंहल' }
        ]
      },
      'etymology': {
        word: 'etymology',
        definition: 'The study of the history and origins of words',
        ipa: '/ˌetɪˈmɒlədʒi/',
        etymology: [
          { text: 'Modern English (late 14th c.)', period: 'modern', lang: 'English' },
          { text: 'Old French "etymologie"', period: 'middle', lang: 'Old French' },
          { text: 'Latin "etymologia"', period: 'middle', lang: 'Latin' },
          { text: 'Greek "etymología" (étȳmon "true sense" + -lógos "account")', period: 'old', lang: 'Greek' },
          { text: 'Indo-European *h₁et- "to go, be"', period: 'old', lang: 'Indo-European' }
        ],
        cognates: [
          { lang: 'French', word: 'étymologie' },
          { lang: 'German', word: 'Etymologie' },
          { lang: 'Spanish', word: 'etimología' }
        ]
      },
      'wanderlust': {
        word: 'wanderlust',
        definition: 'A strong desire to explore and travel',
        ipa: '/ˈwɒndəlʌst/',
        etymology: [
          { text: 'Modern English (1902)', period: 'modern', lang: 'English' },
          { text: 'German "Wanderlust" (wander "hike" + lust "desire")', period: 'modern', lang: 'German' },
          { text: 'Middle High German "wanderen"', period: 'middle', lang: 'Middle High German' },
          { text: 'Proto-Germanic *wandōn (to roam)', period: 'old', lang: 'Proto-Germanic' },
          { text: 'Indo-European *wend- (to turn, wind)', period: 'old', lang: 'Indo-European' }
        ],
        cognates: [
          { lang: 'German', word: 'wandern' },
          { lang: 'Dutch', word: 'wandelen' },
          { lang: 'English', word: 'wend' }
        ]
      },
      'algorithm': {
        word: 'algorithm',
        definition: 'A step-by-step procedure for solving a problem or performing a computation',
        ipa: '/ˈælɡərɪðəm/',
        etymology: [
          { text: 'Modern English (13th c.)', period: 'modern', lang: 'English' },
          { text: 'Medieval Latin "algoritmi"', period: 'middle', lang: 'Medieval Latin' },
          { text: 'Arabic "al-Khwārizmī" (mathematician from Khwarezm)', period: 'middle', lang: 'Arabic' },
          { text: 'Persian place name Khwarezm (modern Uzbekistan)', period: 'old', lang: 'Persian' }
        ],
        cognates: [
          { lang: 'Arabic', word: 'الخوارزمي' },
          { lang: 'Latin', word: 'algoritmus' },
          { lang: 'French', word: 'algorithme' }
        ]
      }
    };

    window.searchWord = function() {
      const word = wordInput.value.toLowerCase().trim();
      resultDiv.innerHTML = '';
      errorDiv.style.display = 'none';
      
      if (!word) {
        errorDiv.textContent = 'Please enter a word.';
        errorDiv.style.display = 'block';
        return;
      }

      loadingDiv.style.display = 'block';
      
      // Simulate API delay
      setTimeout(() => {
        loadingDiv.style.display = 'none';
        
        if (etymologyDB[word]) {
          const data = etymologyDB[word];
          renderEtymology(data);
        } else {
          errorDiv.textContent = `Etymology data for "${word}" not found. Try: serendipity, etymology, wanderlust, algorithm`;
          errorDiv.style.display = 'block';
        }
      }, 400);
    };

    function renderEtymology(data) {
      let html = '<div class="result"><div class="word-card">';
      html += '<div class="word-header">';
      html += `<div class="word-main">${escapeHtml(data.word)}</div>`;
      if (data.ipa) html += `<div class="word-ipa">${escapeHtml(data.ipa)}</div>`;
      html += '</div>';
      
      if (data.definition) {
        html += `<div class="word-definition">${escapeHtml(data.definition)}</div>`;
      }

      if (data.etymology && data.etymology.length > 0) {
        html += '<div class="etymology-section">';
        html += '<div class="etymology-label">Etymology Chain</div>';
        html += '<div class="tree">';
        for (const node of data.etymology) {
          const periodClass = `period-${node.period}`;
          html += `<div class="tree-node ${periodClass}">${escapeHtml(node.text)}</div>`;
        }
        html += '</div></div>';
      }

      if (data.cognates && data.cognates.length > 0) {
        html += '<div class="cognates">';
        html += '<div class="cognates-label">Related Words (Cognates)</div>';
        html += '<div class="cognate-list">';
        for (const cog of data.cognates) {
          html += `<div class="cognate"><span class="cognate-lang">${escapeHtml(cog.lang)}:</span> ${escapeHtml(cog.word)}</div>`;
        }
        html += '</div></div>';
      }

      html += '</div></div>';
      resultDiv.innerHTML = html;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Allow Enter key to search
    wordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchWord();
    });

    // Auto-load on first demo term
    wordInput.value = 'etymology';
    searchWord();
  </script>
</body>
</html>
