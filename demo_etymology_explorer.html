<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etymology Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a1428 0%, #1a2540 100%);
            color: #f5ead6;
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
            align-items: start;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            margin-bottom: 25px;
            grid-column: 1 / -1;
            text-align: center;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .search-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .search-box input {
            padding: 12px;
            border: 2px solid #4da8da;
            background: #0f1419;
            color: #f5ead6;
            border-radius: 4px;
            font-family: 'Space Mono', monospace;
            font-size: 14px;
        }
        .search-box input::placeholder {
            color: #888;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .button-group label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn {
            padding: 10px 12px;
            border: 1px solid #333;
            background: #0f1419;
            color: #f5ead6;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            text-align: left;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #1a2540;
            border-color: #4da8da;
            color: #7dd3fc;
        }
        .btn.active {
            background: #2d5a7b;
            border-color: #4da8da;
            color: #fff;
        }
        .toggle-label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #0f1419;
            border: 1px solid #333;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
        }
        .toggle-label input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .stats-box {
            background: #0f1419;
            border-left: 3px solid #4da8da;
            padding: 12px;
            border-radius: 4px;
            font-size: 12px;
        }
        .stats-box div {
            margin: 6px 0;
        }
        .stats-label {
            color: #aaa;
            text-transform: uppercase;
            font-size: 10px;
        }
        .stats-value {
            color: #7dd3fc;
            font-weight: bold;
            font-size: 14px;
        }
        .canvas-wrapper {
            background: #0f1419;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        canvas {
            border: 1px solid #222;
            background: #050a12;
            border-radius: 4px;
            width: 100%;
            height: auto;
            display: block;
        }
        .timeline-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #888;
            padding: 0 10px;
        }
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>📚 Etymology Explorer</h1>
    
    <div class="container">
        <div class="sidebar">
            <div class="search-box">
                <label style="color: #aaa; font-size: 12px; text-transform: uppercase;">Search Word</label>
                <input type="text" id="wordInput" placeholder="e.g., water, bread, technology" autocomplete="off">
            </div>

            <div class="button-group">
                <label>Common Words</label>
                <button class="btn" data-word="water">water</button>
                <button class="btn" data-word="bread">bread</button>
                <button class="btn" data-word="technology">technology</button>
                <button class="btn" data-word="amble">amble</button>
                <button class="btn" data-word="dog">dog</button>
                <button class="btn" data-word="journey">journey</button>
                <button class="btn" data-word="question">question</button>
            </div>

            <div class="button-group">
                <label>
                    <div class="toggle-label">
                        <input type="checkbox" id="soundToggle">
                        <span>Show Sound Changes</span>
                    </div>
                </label>
            </div>

            <div class="stats-box">
                <div>
                    <div class="stats-label">Ancestral Forms</div>
                    <div class="stats-value" id="ancestralCount">0</div>
                </div>
                <div>
                    <div class="stats-label">Language Families</div>
                    <div class="stats-value" id="familyCount">0</div>
                </div>
                <div>
                    <div class="stats-label">Time Span</div>
                    <div class="stats-value" id="timeSpan">—</div>
                </div>
                <div>
                    <div class="stats-label">Etymology Confidence</div>
                    <div class="stats-value" id="confidence">—</div>
                </div>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="etymologyCanvas" width="800" height="500"></canvas>
            <div class="timeline-label">
                <span>Modern English (~1500)</span>
                <span>Medieval (1150–1500)</span>
                <span>Old English (450–1150)</span>
                <span>Proto-Germanic (~500 BCE)</span>
                <span>Proto-Indo-European (4500 BCE)</span>
            </div>
        </div>
    </div>

    <script>
        const etymologyData = {
            water: {
                modern: "water",
                families: ["Germanic"],
                timeSpan: 1400,
                confidence: 95,
                chain: [
                    { form: "water", period: "Modern English", lang: "English", meaning: "colorless liquid", time: 1500 },
                    { form: "wæter", period: "Old English", lang: "Old English", meaning: "water", time: 900, soundChange: "æ → a" },
                    { form: "*watar", period: "Proto-Germanic", lang: "Proto-Germanic", meaning: "water", time: -500 },
                    { form: "*wódr̥", period: "Proto-Indo-European", lang: "Proto-Indo-European", meaning: "water", time: -4500 }
                ]
            },
            bread: {
                modern: "bread",
                families: ["Germanic"],
                timeSpan: 1300,
                confidence: 90,
                chain: [
                    { form: "bread", period: "Modern English", lang: "English", meaning: "baked loaf", time: 1500 },
                    { form: "bræd", period: "Old English", lang: "Old English", meaning: "piece, morsel", time: 900, soundChange: "æ → ea → e" },
                    { form: "*braidam", period: "Proto-Germanic", lang: "Proto-Germanic", meaning: "something broad", time: -500 },
                    { form: "*bhreutom", period: "Proto-Indo-European", lang: "Proto-Indo-European", meaning: "broken, piece", time: -4500 }
                ]
            },
            technology: {
                modern: "technology",
                families: ["Greek"],
                timeSpan: 2400,
                confidence: 98,
                chain: [
                    { form: "technology", period: "Modern English", lang: "English", meaning: "study of techniques/crafts", time: 1600 },
                    { form: "technologia", period: "Medieval Latin", lang: "Late Latin", meaning: "systematic treatment", time: 1200, soundChange: "ia → y" },
                    { form: "technē", period: "Ancient Greek", lang: "Ancient Greek", meaning: "craft, art, skill", time: -400 },
                    { form: "*tek-", period: "Proto-Indo-European", lang: "Proto-Indo-European", meaning: "to make, prepare", time: -4500 }
                ]
            },
            amble: {
                modern: "amble",
                families: ["Germanic", "Latin", "Romance"],
                timeSpan: 2000,
                confidence: 85,
                chain: [
                    { form: "amble", period: "Modern English", lang: "English", meaning: "walk slowly", time: 1500 },
                    { form: "amblen", period: "Middle English", lang: "Middle English", meaning: "move at easy pace", time: 1300, soundChange: "en → e" },
                    { form: "ambulare", period: "Medieval Latin", lang: "Latin", meaning: "to walk, move about", time: 500 },
                    { form: "*ambul-", period: "Proto-Indo-European", lang: "Proto-Indo-European", meaning: "around + go", time: -4500 }
                ]
            },
            dog: {
                modern: "dog",
                families: ["Germanic"],
                timeSpan: 1200,
                confidence: 60,
                chain: [
                    { form: "dog", period: "Modern English", lang: "English", meaning: "canine animal", time: 1500 },
                    { form: "dogge", period: "Middle English", lang: "Middle English", meaning: "powerful dog breed", time: 1200, soundChange: "gge → g" },
                    { form: "*doggan", period: "Proto-Germanic", lang: "Proto-Germanic", meaning: "dog of power", time: -500 }
                ]
            },
            journey: {
                modern: "journey",
                families: ["Romance", "Latin"],
                timeSpan: 2000,
                confidence: 92,
                chain: [
                    { form: "journey", period: "Modern English", lang: "English", meaning: "day's travel", time: 1500 },
                    { form: "journee", period: "Middle English", lang: "Middle English", meaning: "day's travel", time: 1200, soundChange: "ee → ey" },
                    { form: "journée", period: "Old French", lang: "Old French", meaning: "day's work/travel", time: 1000, soundChange: "Latin suffix" },
                    { form: "diurnata", period: "Medieval Latin", lang: "Late Latin", meaning: "day's work", time: 500 },
                    { form: "diurnus", period: "Classical Latin", lang: "Latin", meaning: "daily", time: 0 }
                ]
            },
            question: {
                modern: "question",
                families: ["Romance", "Latin"],
                timeSpan: 2000,
                confidence: 96,
                chain: [
                    { form: "question", period: "Modern English", lang: "English", meaning: "inquiry", time: 1500 },
                    { form: "question", period: "Middle English", lang: "Middle English", meaning: "inquiry", time: 1200, soundChange: "-tion preserved" },
                    { form: "quaestio", period: "Classical Latin", lang: "Latin", meaning: "inquiry, problem", time: 0 },
                    { form: "*kwesd-", period: "Proto-Indo-European", lang: "Proto-Indo-European", meaning: "to ask, seek", time: -4500 }
                ]
            }
        };

        let currentWord = null;
        let showSoundChanges = false;

        const wordInput = document.getElementById('wordInput');
        const soundToggle = document.getElementById('soundToggle');
        const canvas = document.getElementById('etymologyCanvas');
        const ctx = canvas.getContext('2d');

        function drawEtymologyTree(word) {
            if (!etymologyData[word.toLowerCase()]) {
                ctx.fillStyle = '#666';
                ctx.font = '14px Space Mono';
                ctx.textAlign = 'center';
                ctx.fillText('No etymology found for this word', canvas.width / 2, canvas.height / 2);
                return;
            }

            const data = etymologyData[word.toLowerCase()];
            const chain = data.chain;
            
            ctx.fillStyle = '#050a12';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw timeline markers
            ctx.strokeStyle = '#222';
            ctx.fillStyle = '#666';
            ctx.font = '11px Space Mono';
            ctx.textAlign = 'center';

            const timelineY = canvas.height - 30;
            const timePoints = [1500, 1150, 450, -500, -4500];
            const timeLabels = ['Modern', 'Medieval', 'Old E.', 'Proto-G.', 'PIE'];
            
            for (let i = 0; i < timePoints.length; i++) {
                const x = 80 + (i * 160);
                ctx.beginPath();
                ctx.moveTo(x, timelineY - 10);
                ctx.lineTo(x, timelineY + 10);
                ctx.stroke();
                ctx.fillText(timeLabels[i], x, timelineY + 25);
            }

            // Draw etymological chain
            const startX = 80;
            const endX = 80 + (4 * 160);
            const verticalSpacing = 80;
            const baseY = 100;

            for (let i = 0; i < chain.length; i++) {
                const progress = i / (chain.length - 1);
                const x = startX + (progress * (endX - startX));
                const y = baseY + (i * verticalSpacing);

                // Draw connection line
                if (i > 0) {
                    const prevX = startX + ((i - 1) / (chain.length - 1)) * (endX - startX);
                    const prevY = baseY + ((i - 1) * verticalSpacing);
                    
                    // Gradient line
                    const families = ['Germanic', 'Romance', 'Greek'];
                    let color = '#4da8da';
                    if (data.families.includes('Romance')) color = '#ff6b6b';
                    if (data.families.includes('Greek')) color = '#7dd3fc';
                    
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.globalAlpha = 0.4;
                    ctx.beginPath();
                    ctx.moveTo(prevX, prevY);
                    ctx.bezierCurveTo(prevX + 80, prevY + 20, x - 80, y - 20, x, y);
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                }

                // Draw node
                ctx.fillStyle = '#f5ead6';
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fill();

                // Draw form text
                ctx.fillStyle = '#f5ead6';
                ctx.font = 'bold 13px Space Mono';
                ctx.textAlign = 'center';
                ctx.fillText(chain[i].form, x, y - 25);

                // Draw period label
                ctx.fillStyle = '#aaa';
                ctx.font = '10px Space Mono';
                ctx.fillText(chain[i].period, x, y + 25);

                // Draw meaning
                ctx.fillStyle = '#7dd3fc';
                ctx.font = '11px Space Mono';
                ctx.textAlign = 'center';
                ctx.fillText(`"${chain[i].meaning}"`, x, y + 40);

                // Draw sound change if enabled
                if (showSoundChanges && chain[i].soundChange) {
                    ctx.fillStyle = '#ffd700';
                    ctx.font = '10px Space Mono';
                    ctx.fillText(chain[i].soundChange, x, y + 55);
                }
            }

            // Update stats
            updateStats(data);
        }

        function updateStats(data) {
            document.getElementById('ancestralCount').textContent = data.chain.length - 1;
            document.getElementById('familyCount').textContent = data.families.length;
            document.getElementById('timeSpan').textContent = `${data.timeSpan} yrs`;
            document.getElementById('confidence').textContent = `${data.confidence}%`;
        }

        function searchWord(word) {
            if (word.trim() === '') {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }
            currentWord = word;
            drawEtymologyTree(word);
        }

        wordInput.addEventListener('input', (e) => searchWord(e.target.value));
        
        soundToggle.addEventListener('change', (e) => {
            showSoundChanges = e.target.checked;
            if (currentWord) drawEtymologyTree(currentWord);
        });

        document.querySelectorAll('[data-word]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const word = e.target.dataset.word;
                wordInput.value = word;
                currentWord = word;
                document.querySelectorAll('[data-word]').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                drawEtymologyTree(word);
            });
        });

        // Load first word on page
        const firstWord = 'water';
        wordInput.value = firstWord;
        currentWord = firstWord;
        document.querySelector('[data-word="water"]').classList.add('active');
        drawEtymologyTree(firstWord);
    </script>
</body>
</html>
