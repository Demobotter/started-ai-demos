<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Etymology Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Lato:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Lato', sans-serif;
      background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
      color: #e0e6ed;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-family: 'Merriweather', serif;
      font-size: 3.2rem;
      font-weight: 700;
      color: #7fb3ff;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    .header p {
      color: #a0aab8;
      font-size: 0.95rem;
      margin-bottom: 30px;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .search-box input {
      padding: 12px 20px;
      font-size: 1rem;
      border: 1px solid #3d4a5c;
      background: #141a24;
      color: #e0e6ed;
      border-radius: 6px;
      width: 200px;
      font-family: 'Lato', sans-serif;
      transition: all 0.3s ease;
    }

    .search-box input:focus {
      outline: none;
      border-color: #7fb3ff;
      box-shadow: 0 0 10px rgba(127, 179, 255, 0.3);
      background: #1a2332;
    }

    .search-box button {
      padding: 12px 28px;
      background: #7fb3ff;
      color: #0f1419;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s ease;
      font-family: 'Lato', sans-serif;
    }

    .search-box button:hover {
      background: #9fc5ff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(127, 179, 255, 0.3);
    }

    .search-box button:active {
      transform: translateY(0);
    }

    .status {
      text-align: center;
      color: #a0aab8;
      font-size: 0.9rem;
      margin-bottom: 20px;
      min-height: 20px;
    }

    .error {
      color: #ff6b6b;
      background: rgba(255, 107, 107, 0.1);
      padding: 12px;
      border-radius: 6px;
      border-left: 3px solid #ff6b6b;
      margin-bottom: 20px;
    }

    .tree-container {
      background: rgba(20, 26, 36, 0.5);
      border: 1px solid #3d4a5c;
      border-radius: 8px;
      padding: 30px;
      margin-bottom: 20px;
      max-height: 600px;
      overflow-y: auto;
    }

    .tree-container::-webkit-scrollbar {
      width: 8px;
    }

    .tree-container::-webkit-scrollbar-track {
      background: rgba(61, 74, 92, 0.3);
      border-radius: 10px;
    }

    .tree-container::-webkit-scrollbar-thumb {
      background: rgba(127, 179, 255, 0.4);
      border-radius: 10px;
    }

    .tree-container::-webkit-scrollbar-thumb:hover {
      background: rgba(127, 179, 255, 0.6);
    }

    .root-word {
      font-family: 'Merriweather', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #7fb3ff;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #3d4a5c;
    }

    .etymology-entry {
      margin-bottom: 18px;
      padding-left: 30px;
      position: relative;
    }

    .etymology-entry::before {
      content: '';
      position: absolute;
      left: 10px;
      top: 8px;
      width: 6px;
      height: 6px;
      background: #7fb3ff;
      border-radius: 50%;
    }

    .etymology-entry::after {
      content: '';
      position: absolute;
      left: 12px;
      top: -10px;
      bottom: 100%;
      width: 1px;
      background: linear-gradient(180deg, transparent 0%, #3d4a5c 100%);
    }

    .etymology-entry:first-child::after {
      display: none;
    }

    .lang-label {
      color: #a8d5ff;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .etymology-text {
      color: #d4dce8;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .period {
      color: #7fb3ff;
      font-weight: 600;
      font-size: 0.85rem;
      margin-top: 6px;
    }

    .empty-state {
      text-align: center;
      color: #666;
      padding: 40px 20px;
      font-style: italic;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 2.2rem;
      }

      .search-box input {
        width: 100%;
        max-width: 250px;
      }

      .tree-container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📖 Etymology Explorer</h1>
      <p>Trace the linguistic roots of any word through time and language families</p>
    </div>

    <div class="search-box">
      <input
        type="text"
        id="wordInput"
        placeholder="Enter a word (e.g., 'language')"
        autocomplete="off"
      />
      <button id="searchBtn">Explore</button>
    </div>

    <div class="status" id="status"></div>
    <div id="error" class="error" style="display: none;"></div>
    <div class="tree-container" id="treeContainer">
      <div class="empty-state">Type a word and click Explore to see its etymology</div>
    </div>
  </div>

  <script>
    const wordInput = document.getElementById('wordInput');
    const searchBtn = document.getElementById('searchBtn');
    const treeContainer = document.getElementById('treeContainer');
    const statusDiv = document.getElementById('status');
    const errorDiv = document.getElementById('error');

    async function fetchEtymology(word) {
      statusDiv.textContent = 'Searching...';
      errorDiv.style.display = 'none';
      treeContainer.innerHTML = '<div class="empty-state">Loading etymology...</div>';

      try {
        // Fetch from Wiktionary API (CORS-enabled, public)
        const response = await fetch(
          `https://en.wiktionary.org/w/api.php?action=query&titles=${encodeURIComponent(word)}&prop=extracts&explaintext=true&format=json&origin=*`
        );

        if (!response.ok) throw new Error('Network error');

        const data = await response.json();
        const pages = data.query.pages;
        const pageId = Object.keys(pages)[0];
        const page = pages[pageId];

        if (!page.extract) {
          throw new Error(`No etymology data found for "${word}"`);
        }

        // Parse etymology from extract (simplified heuristic)
        const extract = page.extract;
        const etymologyMatch = extract.match(/Etymology[^\n]*\n([\s\S]*?)(?=\n\n|Pronunciation|Noun|Adjective|Verb|Adverb|$)/i);
        
        if (!etymologyMatch) {
          throw new Error(`No etymology section found for "${word}"`);
        }

        const etymologyText = etymologyMatch[1].trim();
        
        // Build a visual tree from the text
        renderEtymologyTree(word, etymologyText);
        statusDiv.textContent = `Found etymology for "${word}"`;
      } catch (error) {
        errorDiv.style.display = 'block';
        errorDiv.textContent = `Error: ${error.message}`;
        treeContainer.innerHTML = '<div class="empty-state">Try another word</div>';
        statusDiv.textContent = '';
      }
    }

    function renderEtymologyTree(word, etymologyText) {
      // Parse the etymology text into entries
      // Wiktionary format: language name followed by text, often with dates/sources
      
      const lines = etymologyText.split('\n').filter(l => l.trim());
      
      let html = `<div class="root-word">${word}</div>`;

      // Extract language tags and etymology lines
      const entries = [];
      let currentLang = '';
      let currentText = '';

      lines.forEach(line => {
        // Check if line is a language identifier (usually starts with capital, may have dates)
        if (/^[A-Z][a-z]+(\s+[A-Z])?/.test(line) && line.length < 100) {
          if (currentLang && currentText) {
            entries.push({ lang: currentLang, text: currentText });
          }
          currentLang = line;
          currentText = '';
        } else {
          currentText = (currentText ? currentText + ' ' : '') + line;
        }
      });

      if (currentLang && currentText) {
        entries.push({ lang: currentLang, text: currentText });
      }

      // If no structured data, just show the raw text
      if (entries.length === 0) {
        html += `<div class="etymology-entry">
          <div class="etymology-text">${etymologyText.substring(0, 500)}${etymologyText.length > 500 ? '...' : ''}</div>
        </div>`;
      } else {
        entries.forEach((entry, idx) => {
          html += `
            <div class="etymology-entry">
              <div class="lang-label">${entry.lang}</div>
              <div class="etymology-text">${entry.text.substring(0, 300)}${entry.text.length > 300 ? '...' : ''}</div>
            </div>
          `;
        });
      }

      treeContainer.innerHTML = html;
    }

    function handleSearch() {
      const word = wordInput.value.trim().toLowerCase();
      if (word) {
        fetchEtymology(word);
      }
    }

    searchBtn.addEventListener('click', handleSearch);
    wordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        handleSearch();
      }
    });

    // Example search on load
    window.addEventListener('load', () => {
      wordInput.value = 'etymology';
      fetchEtymology('etymology');
    });
  </script>
</body>
</html>
