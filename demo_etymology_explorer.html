<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etymology Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Lato:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Lato', sans-serif;
      background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
      color: #e0e6ed;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 700px;
      width: 100%;
      background: rgba(20, 28, 45, 0.8);
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(127, 179, 255, 0.15);
    }
    h1 {
      font-family: 'Merriweather', serif;
      font-size: 2.4em;
      margin-bottom: 10px;
      color: #ffffff;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #a0aab8;
      margin-bottom: 30px;
      font-size: 0.95em;
    }
    .input-group {
      margin-bottom: 30px;
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid rgba(127, 179, 255, 0.3);
      border-radius: 8px;
      background: rgba(30, 45, 70, 0.6);
      color: #e0e6ed;
      font-family: 'Lato', sans-serif;
      font-size: 1em;
      transition: all 0.2s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #7fb3ff;
      background: rgba(30, 45, 70, 0.9);
      box-shadow: 0 0 12px rgba(127, 179, 255, 0.2);
    }
    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #7fb3ff 0%, #5a8fd6 100%);
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-family: 'Lato', sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 1em;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(127, 179, 255, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
    .loading {
      text-align: center;
      color: #7fb3ff;
      font-style: italic;
      display: none;
      margin: 20px 0;
    }
    .error {
      text-align: center;
      color: #ff6b6b;
      font-style: italic;
      display: none;
      margin: 20px 0;
      padding: 15px;
      background: rgba(255, 107, 107, 0.1);
      border-radius: 8px;
      border-left: 3px solid #ff6b6b;
    }
    .etymology-tree {
      display: none;
      margin-top: 30px;
    }
    .tree-node {
      margin-bottom: 20px;
      padding-left: 20px;
      border-left: 2px solid rgba(127, 179, 255, 0.3);
      position: relative;
    }
    .tree-node::before {
      content: '';
      width: 12px;
      height: 12px;
      background: #7fb3ff;
      border-radius: 50%;
      position: absolute;
      left: -8px;
      top: 6px;
    }
    .tree-node-label {
      font-family: 'Merriweather', serif;
      font-size: 1.15em;
      color: #7fb3ff;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .tree-node-detail {
      font-size: 0.9em;
      color: #a0aab8;
      margin-bottom: 4px;
    }
    .no-data {
      text-align: center;
      color: #a0aab8;
      padding: 40px 20px;
      font-style: italic;
    }
    @media (max-width: 600px) {
      .container {
        padding: 25px;
      }
      h1 {
        font-size: 2em;
      }
      .input-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Etymology Explorer</h1>
    <p class="subtitle">Trace the origins of English words across languages and time</p>
    
    <div class="input-group">
      <input 
        type="text" 
        id="wordInput" 
        placeholder="Enter a word (e.g., hello, family, kitchen)"
        autocomplete="off"
      >
      <button id="searchBtn">Explore</button>
    </div>
    
    <div class="loading" id="loading">Fetching etymology...</div>
    <div class="error" id="error"></div>
    
    <div class="etymology-tree" id="etymologyTree"></div>
    <div class="no-data" id="noData">Enter a word and click Explore to begin</div>
  </div>

  <script>
    const wordInput = document.getElementById('wordInput');
    const searchBtn = document.getElementById('searchBtn');
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const treeEl = document.getElementById('etymologyTree');
    const noDataEl = document.getElementById('noData');

    async function fetchEtymology(word) {
      loadingEl.style.display = 'block';
      errorEl.style.display = 'none';
      treeEl.style.display = 'none';
      noDataEl.style.display = 'none';

      try {
        // Wiktionary API — CORS-safe, public, keyless
        const url = `https://en.wiktionary.org/api/rest_v1/page/html/${encodeURIComponent(word)}`;
        const response = await fetch(url);
        
        if (!response.ok) {
          throw new Error(`Word not found: "${word}"`);
        }

        const html = await response.text();
        const etymologyData = parseEtymology(html, word);

        loadingEl.style.display = 'none';

        if (etymologyData && etymologyData.length > 0) {
          renderEtymology(etymologyData, word);
          treeEl.style.display = 'block';
        } else {
          errorEl.textContent = `No etymology data found for "${word}". Try another word.`;
          errorEl.style.display = 'block';
          noDataEl.style.display = 'block';
        }
      } catch (err) {
        loadingEl.style.display = 'none';
        errorEl.textContent = err.message || 'Error fetching etymology. Check your word and try again.';
        errorEl.style.display = 'block';
        noDataEl.style.display = 'block';
      }
    }

    function parseEtymology(html, word) {
      // Parse Wiktionary HTML for etymology sections
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');

      // Look for etymology section headings
      const etymologyResults = [];
      const allText = doc.body.innerText || '';

      // Extract etymology block text between "Etymology" header and next section
      const etymologyMatch = allText.match(/Etymology[^]*?(?=\n\n[A-Z]|\n\nPhonetics|\n\nDefinitions|$)/i);
      
      if (etymologyMatch) {
        const etymologyText = etymologyMatch[0];
        
        // Simple language extraction: look for language names in parentheses
        const langMatches = etymologyText.match(/from\s+([A-Za-z\s]+?)\s+\(([^)]+)\)|([A-Z][a-z]+)\s+([a-z\s]+)\s+meaning/gi);
        
        if (langMatches && langMatches.length > 0) {
          langMatches.forEach(match => {
            etymologyResults.push({
              text: match.trim(),
              language: extractLanguage(match)
            });
          });
        } else {
          // Fallback: extract key fragments mentioning language origins
          const fragments = etymologyText.split(/[\.\n]+/).filter(f => f.length > 20);
          fragments.slice(0, 3).forEach(frag => {
            etymologyResults.push({
              text: frag.trim(),
              language: guessLanguage(frag)
            });
          });
        }
      }

      return etymologyResults.length > 0 ? etymologyResults : null;
    }

    function extractLanguage(text) {
      const langMap = {
        'Old English': 'Old English',
        'Middle English': 'Middle English',
        'Proto-Germanic': 'Proto-Germanic',
        'Proto-Indo-European': 'Proto-Indo-European',
        'Latin': 'Latin',
        'Greek': 'Ancient Greek',
        'French': 'Old French',
        'Germanic': 'Germanic',
        'English': 'English',
        'German': 'German',
        'Dutch': 'Dutch',
        'Scandinavian': 'Scandinavian',
        'Anglo-Saxon': 'Anglo-Saxon'
      };

      for (const [key, value] of Object.entries(langMap)) {
        if (text.toLowerCase().includes(key.toLowerCase())) {
          return value;
        }
      }
      return 'Unknown Origin';
    }

    function guessLanguage(text) {
      const keywords = ['Old English', 'Middle', 'Germanic', 'Proto', 'Latin', 'French', 'Anglo-Saxon'];
      for (const kw of keywords) {
        if (text.toLowerCase().includes(kw.toLowerCase())) {
          return kw;
        }
      }
      return 'Historical Origin';
    }

    function renderEtymology(data, word) {
      treeEl.innerHTML = `<div style="text-align: center; margin-bottom: 20px; padding: 15px; background: rgba(127, 179, 255, 0.1); border-radius: 8px; border-left: 3px solid #7fb3ff;">
        <div style="font-family: 'Merriweather', serif; font-size: 1.3em; color: #ffffff; margin-bottom: 5px;">"${word}"</div>
        <div style="color: #a0aab8; font-size: 0.9em;">Etymology origin chain</div>
      </div>`;

      data.forEach((item, idx) => {
        const node = document.createElement('div');
        node.className = 'tree-node';
        
        const label = document.createElement('div');
        label.className = 'tree-node-label';
        label.textContent = item.language;
        
        const detail = document.createElement('div');
        detail.className = 'tree-node-detail';
        detail.textContent = item.text.substring(0, 120) + (item.text.length > 120 ? '...' : '');
        
        node.appendChild(label);
        node.appendChild(detail);
        treeEl.appendChild(node);
      });
    }

    searchBtn.addEventListener('click', () => {
      const word = wordInput.value.trim();
      if (word) {
        fetchEtymology(word);
      }
    });

    wordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const word = wordInput.value.trim();
        if (word) {
          fetchEtymology(word);
        }
      }
    });

    // Auto-load etymology for "etymology" search (convenience)
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const autoWord = params.get('word') || '';
      if (autoWord) {
        wordInput.value = autoWord;
        fetchEtymology(autoWord);
      }
    });
  </script>
</body>
</html>
