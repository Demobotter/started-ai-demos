<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etymology Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Lato', sans-serif;
      background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .container {
      width: 100%;
      max-width: 700px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .header h1 {
      font-family: 'Merriweather', serif;
      font-size: 2.5em;
      margin-bottom: 8px;
      color: #7fb3ff;
    }
    
    .header p {
      font-size: 0.95em;
      color: #b0b0b0;
      font-weight: 300;
    }
    
    .search-box {
      margin-bottom: 30px;
    }
    
    .search-box input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1em;
      border: 1px solid #3a4d6d;
      border-radius: 8px;
      background: #1a2332;
      color: #e0e0e0;
      font-family: 'Lato', sans-serif;
      transition: border-color 0.3s;
    }
    
    .search-box input:focus {
      outline: none;
      border-color: #7fb3ff;
    }
    
    .search-box input::placeholder {
      color: #666;
    }
    
    .result {
      background: rgba(32, 47, 74, 0.6);
      border: 1px solid #3a4d6d;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
    }
    
    .result h2 {
      font-family: 'Merriweather', serif;
      font-size: 1.6em;
      color: #7fb3ff;
      margin-bottom: 12px;
    }
    
    .result-section {
      margin-bottom: 18px;
    }
    
    .result-section h3 {
      font-family: 'Merriweather', serif;
      font-size: 0.95em;
      color: #a8d5ff;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .result-section p {
      font-size: 0.95em;
      line-height: 1.6;
      color: #d0d0d0;
    }
    
    .tree {
      font-family: 'Courier New', monospace;
      font-size: 0.85em;
      color: #90c8ff;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
      background: rgba(15, 20, 25, 0.5);
      padding: 12px;
      border-radius: 6px;
      border-left: 3px solid #7fb3ff;
      overflow-x: auto;
    }
    
    .related-words {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .tag {
      display: inline-block;
      background: #2d4a73;
      color: #a8d5ff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85em;
      border: 1px solid #3a5a8d;
    }
    
    .error, .loading {
      background: rgba(32, 47, 74, 0.6);
      border: 1px solid #3a4d6d;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      font-size: 0.95em;
      color: #d0d0d0;
    }
    
    .error {
      border-color: #6d3a3a;
      color: #ff9999;
    }
    
    .loading {
      color: #7fb3ff;
    }
    
    @media (max-width: 600px) {
      .header h1 {
        font-size: 2em;
      }
      .search-box input {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Etymology Explorer</h1>
      <p>Trace the roots of English words through language families</p>
    </div>
    
    <div class="search-box">
      <input 
        type="text" 
        id="wordInput" 
        placeholder="Enter a word (e.g., 'astronomy', 'serendipity', 'butterfly')…"
        autocomplete="off"
      >
    </div>
    
    <div id="resultContainer"></div>
  </div>

  <script>
    const wordInput = document.getElementById('wordInput');
    const resultContainer = document.getElementById('resultContainer');
    let abortController = null;

    wordInput.addEventListener('input', debounce(searchEtymology, 500));

    function debounce(func, delay) {
      let timeoutId;
      return function (...args) {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => func(...args), delay);
      };
    }

    async function searchEtymology(e) {
      const word = e.target.value.trim().toLowerCase();
      
      if (!word) {
        resultContainer.innerHTML = '';
        return;
      }

      if (abortController) abortController.abort();
      abortController = new AbortController();

      resultContainer.innerHTML = '<div class="loading">Looking up etymology…</div>';

      try {
        // Fetch from Wiktionary API (CORS-OK, public)
        const response = await fetch(
          `https://en.wiktionary.org/api/rest_v1/page/html/${encodeURIComponent(word)}`,
          { signal: abortController.signal }
        );

        if (!response.ok) throw new Error('Word not found');

        const html = await response.text();

        // Parse etymology from the HTML response
        const etymologyMatch = html.match(/<h3[^>]*>Etymology[^<]*<\/h3>([\s\S]*?)(?=<h3|$)/i);
        if (!etymologyMatch) throw new Error('No etymology data available');

        const etymologyHtml = etymologyMatch[1];

        // Extract origin language and path
        const originMatch = etymologyHtml.match(/From\s+([^,.<]+)(?:\s+([^,.<]+))?/i);
        const origin = originMatch ? originMatch[1] : 'Unknown origin';
        
        // Extract historical stages
        const stagesMatch = etymologyHtml.match(/(?:from|via)\s+(.+?)(?:\.\s*From|\.\s*(?:Cognate|Related))/is);
        const stages = stagesMatch ? stagesMatch[1] : '';

        // Build language-family tree (simplified, based on common patterns)
        const languageTree = buildLanguageTree(word, origin, stages);

        // Try to find related words mentioned in etymology
        const relatedMatch = etymologyHtml.match(/Cognate with\s+([^.]+)/i);
        const related = relatedMatch ? relatedMatch[1].split(/,\s+/).slice(0, 5) : [];

        // Clean up text content
        const text = etymologyHtml
          .replace(/<[^>]*>/g, '')
          .replace(/\[\d+\]/g, '')
          .trim()
          .substring(0, 300);

        renderResult(word, origin, languageTree, text, related);
      } catch (error) {
        if (error.name !== 'AbortError') {
          resultContainer.innerHTML = `<div class="error">No etymology found for "${word}". Try another word.</div>`;
        }
      }
    }

    function buildLanguageTree(word, origin, stages) {
      // Simplified Indo-European language family tree
      const baseTree = `Modern English (present day)
  ↓
Middle English (1150–1500)
  ↓
Old English (450–1150)
  ↓
Proto-Germanic
  ↓
Proto-Indo-European`;

      if (origin.toLowerCase().includes('french') || origin.toLowerCase().includes('latin')) {
        return `Modern English (present day)
  ↓
Middle English (1150–1500)
  ↓
Old French / Latin
  ↓
Vulgar Latin
  ↓
Proto-Indo-European`;
      } else if (origin.toLowerCase().includes('greek')) {
        return `Modern English (present day)
  ↓
Ancient Greek
  ↓
Proto-Indo-European`;
      } else if (origin.toLowerCase().includes('german')) {
        return `Modern English (present day)
  ↓
Middle English (1150–1500)
  ↓
Old English (450–1150)
  ↓
Proto-Germanic
  ↓
Proto-Indo-European`;
      }

      return baseTree;
    }

    function renderResult(word, origin, languageTree, text, related) {
      const relatedHtml = related.length > 0 
        ? `<div class="result-section">
             <h3>Related Words</h3>
             <div class="related-words">
               ${related.map(w => `<span class="tag">${w.trim()}</span>`).join('')}
             </div>
           </div>`
        : '';

      resultContainer.innerHTML = `
        <div class="result">
          <h2>${word}</h2>
          
          <div class="result-section">
            <h3>Origin</h3>
            <p>${origin}</p>
          </div>
          
          <div class="result-section">
            <h3>Language Family Tree</h3>
            <div class="tree">${languageTree}</div>
          </div>
          
          <div class="result-section">
            <h3>Etymology Path</h3>
            <p>${text || 'Etymology information available at Wiktionary.'}</p>
          </div>
          
          ${relatedHtml}
        </div>
      `;
    }

    // Auto-load on page load with example
    window.addEventListener('load', () => {
      wordInput.value = 'etymology';
      wordInput.dispatchEvent(new Event('input'));
    });
  </script>
</body>
</html>
