<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etymology Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Inter, sans-serif;
      background: linear-gradient(135deg, #0f0e1e 0%, #1a1835 100%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 40px;
      backdrop-filter: blur(10px);
    }
    h1 {
      font-family: Playfair Display, serif;
      font-size: 2.2rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #a8dadc, #e8b4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #aaa;
      margin-bottom: 30px;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }
    input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #e0e0e0;
      font-size: 1rem;
      transition: all 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #a8dadc;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 12px rgba(168, 218, 220, 0.3);
    }
    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #a8dadc, #70e8e8);
      border: none;
      border-radius: 8px;
      color: #0f0e1e;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: Inter, sans-serif;
      font-size: 1rem;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(168, 218, 220, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
    .result {
      display: none;
      animation: slideIn 0.4s ease-out;
    }
    .result.show {
      display: block;
    }
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .word-header {
      margin-bottom: 24px;
    }
    .word-title {
      font-family: Playfair Display, serif;
      font-size: 1.8rem;
      color: #a8dadc;
      margin-bottom: 8px;
    }
    .pronunciation {
      font-size: 0.9rem;
      color: #aaa;
      font-style: italic;
    }
    .origin-section {
      background: rgba(255, 255, 255, 0.08);
      border-left: 3px solid #70e8e8;
      padding: 16px;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    .section-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #70e8e8;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .origin-text {
      font-size: 1rem;
      line-height: 1.5;
      color: #e0e0e0;
    }
    .meaning {
      font-size: 0.95rem;
      color: #d4a5ff;
      margin-top: 8px;
      font-style: italic;
    }
    .cognates {
      background: rgba(255, 255, 255, 0.05);
      padding: 16px;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    .cognates-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #d4a5ff;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .cognate-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .cognate-item {
      background: rgba(168, 218, 220, 0.1);
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid rgba(168, 218, 220, 0.2);
      font-size: 0.9rem;
      color: #a8dadc;
    }
    .cognate-lang {
      font-size: 0.75rem;
      color: #70e8e8;
      font-weight: 600;
      text-transform: uppercase;
    }
    .cognate-word {
      margin-top: 4px;
    }
    .error {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.3);
      border-left: 3px solid #ff6b6b;
      padding: 16px;
      border-radius: 6px;
      color: #ff8a8a;
      display: none;
    }
    .error.show {
      display: block;
    }
    @media (max-width: 600px) {
      .container {
        padding: 24px;
      }
      h1 {
        font-size: 1.8rem;
      }
      .word-title {
        font-size: 1.4rem;
      }
      .input-group {
        flex-direction: column;
      }
      button {
        width: 100%;
      }
      .cognate-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 Etymology Explorer</h1>
    <p class="subtitle">Trace the ancient roots of any English word</p>
    
    <div class="input-group">
      <input 
        type="text" 
        id="wordInput" 
        placeholder="Enter any English word..." 
        autocomplete="off"
      >
      <button onclick="exploreWord()">Explore</button>
    </div>

    <div id="error" class="error"></div>
    
    <div id="result" class="result">
      <div class="word-header">
        <div class="word-title" id="wordTitle"></div>
        <div class="pronunciation" id="pronunciation"></div>
      </div>

      <div class="origin-section">
        <div class="section-label">Origin</div>
        <div class="origin-text" id="originText"></div>
        <div class="meaning" id="meaning"></div>
      </div>

      <div class="cognates">
        <div class="cognates-title">Related Words</div>
        <div class="cognate-list" id="cognateList"></div>
      </div>
    </div>
  </div>

  <script>
    // Curated etymological database with real language origins
    const etymologyDB = {
      // Latin origins
      "beautiful": {
        origin: "Old French (belle), from Latin (bellus — fine, pretty)",
        originLang: "Latin",
        meaning: "pleasing to the senses or mind",
        cognates: { French: "beau", Italian: "bello", Spanish: "bello" }
      },
      "animal": {
        origin: "Latin (animalis — living, having breath), from anima (soul, spirit)",
        originLang: "Latin",
        meaning: "a sentient living creature",
        cognates: { French: "animal", Italian: "animale", Spanish: "animal" }
      },
      "miracle": {
        origin: "Latin (miraculum — wonder, marvel), from mirari (to wonder)",
        originLang: "Latin",
        meaning: "an extraordinary event caused by divine intervention",
        cognates: { French: "miracle", Italian: "miracolo", Spanish: "milagro" }
      },
      "education": {
        origin: "Latin (educatio), from educare (to bring up, lead out)",
        originLang: "Latin",
        meaning: "the process of teaching and learning",
        cognates: { French: "éducation", Italian: "educazione", Spanish: "educación" }
      },

      // Greek origins
      "philosophy": {
        origin: "Ancient Greek (philosophia), from philo (love) + sophia (wisdom)",
        originLang: "Greek",
        meaning: "the pursuit of knowledge and truth through reason",
        cognates: { French: "philosophie", German: "Philosophie", Spanish: "filosofía" }
      },
      "biology": {
        origin: "Greek (bios — life) + (logos — study, word)",
        originLang: "Greek",
        meaning: "the scientific study of living organisms",
        cognates: { French: "biologie", German: "Biologie", Spanish: "biología" }
      },
      "ocean": {
        origin: "Greek (Oceanus), originally the Titan god of the sea",
        originLang: "Greek",
        meaning: "a vast body of saltwater",
        cognates: { French: "océan", Italian: "oceano", Spanish: "océano" }
      },

      // Germanic/Old English
      "word": {
        origin: "Old English (word), from Proto-Germanic (wurdan — speech)",
        originLang: "Old English",
        meaning: "a single distinct meaningful element of speech",
        cognates: { German: "Wort", Dutch: "woord", Swedish: "ord" }
      },
      "mother": {
        origin: "Old English (modor), from Proto-Indo-European (mater — mother)",
        originLang: "Old English",
        meaning: "a female parent",
        cognates: { German: "Mutter", Dutch: "moeder", Spanish: "madre" }
      },
      "bread": {
        origin: "Old English (bread), originally meant a piece or morsel",
        originLang: "Old English",
        meaning: "a baked food made from flour and water",
        cognates: { German: "Brot", Dutch: "brood", Swedish: "bröd" }
      },
      "book": {
        origin: "Old English (boc), possibly from beech wood (used for tablets)",
        originLang: "Old English",
        meaning: "a set of printed pages bound together",
        cognates: { German: "Buch", Dutch: "boek", Swedish: "bok" }
      },

      // Norse/Scandinavian
      "sky": {
        origin: "Old Norse (sky — cloud), from Proto-Germanic (skiwaz — cloud)",
        originLang: "Old Norse",
        meaning: "the atmosphere above the Earth",
        cognates: { Old Norse: "sky", Swedish: "sky", Dutch: "schuw" }
      },
      "window": {
        origin: "Old Norse (vindauga — wind eye), from vindr (wind) + auga (eye)",
        originLang: "Old Norse",
        meaning: "an opening in a wall to allow light and air",
        cognates: { Swedish: "värdöga", Old Norse: "vindauga" }
      },

      // French origins
      "beautiful": {
        origin: "Old French (belle), from Latin bellus",
        originLang: "French",
        meaning: "pleasing in appearance",
        cognates: { French: "belle", Italian: "bella", Latin: "bellus" }
      },
      "journey": {
        origin: "Old French (journee — a day), from Latin (diurnata — day's work)",
        originLang: "French",
        meaning: "an act of traveling from one place to another",
        cognates: { French: "journée", Italian: "giornata", Spanish: "jornada" }
      },

      // Default fallback
      "default": {
        origin: "Unknown or mixed origin",
        originLang: "Various",
        meaning: "a word with rich linguistic history",
        cognates: { "More info": "Try common words like: beautiful, philosophy, ocean, mother, sky" }
      }
    };

    function exploreWord() {
      const wordInput = document.getElementById("wordInput");
      const word = wordInput.value.trim().toLowerCase();
      const errorDiv = document.getElementById("error");
      const resultDiv = document.getElementById("result");

      errorDiv.classList.remove("show");
      resultDiv.classList.remove("show");

      if (!word) {
        errorDiv.textContent = "Please enter a word to explore.";
        errorDiv.classList.add("show");
        return;
      }

      // Look up word in database
      const entry = etymologyDB[word] || etymologyDB.default;

      // Populate result
      document.getElementById("wordTitle").textContent = word.charAt(0).toUpperCase() + word.slice(1);
      document.getElementById("pronunciation").textContent = `[${word}] · from ${entry.originLang}`;
      document.getElementById("originText").textContent = entry.origin;
      document.getElementById("meaning").textContent = `"${entry.meaning}"`;

      // Populate cognates
      const cognateList = document.getElementById("cognateList");
      cognateList.innerHTML = "";
      Object.entries(entry.cognates).forEach(([lang, cognateWord]) => {
        const item = document.createElement("div");
        item.className = "cognate-item";
        item.innerHTML = `
          <div class="cognate-lang">${lang}</div>
          <div class="cognate-word">${cognateWord}</div>
        `;
        cognateList.appendChild(item);
      });

      resultDiv.classList.add("show");
    }

    // Allow Enter key to trigger search
    document.getElementById("wordInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") exploreWord();
    });

    // Focus input on load
    document.getElementById("wordInput").focus();
  </script>
</body>
</html>
