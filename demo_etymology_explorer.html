<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etymology Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Space Mono', monospace; 
      background: #0f1419; 
      color: #e0e0e0; 
      height: 100vh; 
      display: flex; 
      overflow: hidden;
    }
    .container { 
      display: flex; 
      width: 100%; 
      height: 100%; 
    }
    .sidebar { 
      width: 320px; 
      background: #1a2332; 
      border-right: 1px solid #333; 
      padding: 20px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 15px;
    }
    .sidebar h1 { 
      font-family: 'Playfair Display', serif; 
      font-size: 20px; 
      color: #4da8da; 
      margin-bottom: 10px;
    }
    .search-box { 
      display: flex; 
      flex-direction: column; 
      gap: 8px;
    }
    .search-box input { 
      padding: 10px; 
      background: #0f1419; 
      border: 1px solid #4da8da; 
      color: #e0e0e0; 
      border-radius: 4px; 
      font-family: 'Space Mono', monospace;
    }
    .search-box button { 
      padding: 8px 12px; 
      background: #4da8da; 
      border: none; 
      color: #0f1419; 
      border-radius: 4px; 
      cursor: pointer; 
      font-weight: bold;
    }
    .search-box button:hover { background: #5eb8ea; }
    .timeline-section { 
      display: flex; 
      flex-direction: column; 
      gap: 8px;
    }
    .timeline-section label { 
      font-size: 12px; 
      color: #4da8da;
    }
    .timeline-slider { 
      width: 100%;
    }
    .info-box { 
      background: #252e3f; 
      border-left: 3px solid #4da8da; 
      padding: 12px; 
      border-radius: 4px; 
      font-size: 12px; 
      line-height: 1.4;
    }
    .info-box strong { color: #4da8da; }
    .language-legend { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 8px; 
      font-size: 11px;
    }
    .lang-item { 
      display: flex; 
      align-items: center; 
      gap: 6px;
    }
    .lang-dot { 
      width: 8px; 
      height: 8px; 
      border-radius: 50%; 
    }
    .canvas-container { 
      flex: 1; 
      position: relative; 
      overflow: hidden;
    }
    canvas { 
      display: block; 
      width: 100%; 
      height: 100%;
    }
    @media (max-width: 768px) {
      .sidebar { width: 100%; max-height: 35%; }
      .container { flex-direction: column; }
      .canvas-container { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h1>Etymology Tree</h1>
      
      <div class="search-box">
        <label>Word</label>
        <input type="text" id="wordInput" placeholder="kitchen, sentiment, algorithm..." value="kitchen">
        <button onclick="exploreWord()">Explore</button>
      </div>

      <div class="timeline-section">
        <label>Time Range: <span id="timeLabel">0 AD - 2024</span></label>
        <input type="range" class="timeline-slider" id="timelineSlider" min="0" max="100" value="100">
      </div>

      <div class="info-box" id="infoBox">
        <strong>Kitchen</strong><br>
        From Old English <i>cycene</i>, Latin <i>coquina</i> (cooking place), from <i>coquere</i> (to cook). Proto-Indo-European root <i>*pekw-</i>.
      </div>

      <div>
        <label style="font-size: 12px; color: #4da8da;">Language Families</label>
        <div class="language-legend">
          <div class="lang-item"><div class="lang-dot" style="background: #ff4444;"></div>Old English</div>
          <div class="lang-item"><div class="lang-dot" style="background: #44ff44;"></div>Latin</div>
          <div class="lang-item"><div class="lang-dot" style="background: #4444ff;"></div>Germanic</div>
          <div class="lang-item"><div class="lang-dot" style="background: #ff44ff;"></div>Romance</div>
          <div class="lang-item"><div class="lang-dot" style="background: #ffaa44;"></div>Greek</div>
          <div class="lang-item"><div class="lang-dot" style="background: #ffdd44;"></div>Arabic</div>
        </div>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <script>
    // Real etymology database
    const etymologyDB = {
      kitchen: {
        word: 'Kitchen',
        definition: 'Place for cooking',
        yearAdopted: 1150,
        root: { word: 'coquina', lang: 'Latin', year: 100, def: 'cooking place' },
        branches: [
          { word: 'Küche', lang: 'Germanic', year: 850, def: 'German kitchen', cognate: true },
          { word: 'keuken', lang: 'Germanic', year: 900, def: 'Dutch kitchen', cognate: true },
          { word: 'kök', lang: 'Germanic', year: 950, def: 'Swedish kitchen', cognate: true },
          { word: 'coquere', lang: 'Latin', year: 100, def: 'to cook (root)', root: true },
          { word: 'kitchenette', lang: 'Old English', year: 1950, def: 'small kitchen', derived: true },
          { word: 'cookery', lang: 'Old English', year: 1400, def: 'art of cooking', related: true }
        ]
      },
      sentiment: {
        word: 'Sentiment',
        definition: 'Feeling or emotion',
        yearAdopted: 1769,
        root: { word: 'sentire', lang: 'Latin', year: 100, def: 'to feel' },
        branches: [
          { word: 'sentiment', lang: 'French', year: 1500, def: 'French feeling', cognate: true },
          { word: 'sentimiento', lang: 'Romance', year: 1500, def: 'Spanish feeling', cognate: true },
          { word: 'sentire', lang: 'Latin', year: 100, def: 'to perceive/feel', root: true },
          { word: 'sentimental', lang: 'Old English', year: 1800, def: 'emotional', derived: true },
          { word: 'sense', lang: 'Old English', year: 1300, def: 'perception', related: true },
          { word: 'sensible', lang: 'Old English', year: 1400, def: 'aware/conscious', related: true }
        ]
      },
      algorithm: {
        word: 'Algorithm',
        definition: 'Step-by-step procedure',
        yearAdopted: 1881,
        root: { word: 'al-Khwarizmi', lang: 'Arabic', year: 820, def: 'mathematician (9th c.)' },
        branches: [
          { word: 'algorism', lang: 'Arabic', year: 1200, def: 'old term for algorithm', derived: true },
          { word: 'al-Khwarizmi', lang: 'Arabic', year: 820, def: 'Persian mathematician', root: true },
          { word: 'logarithm', lang: 'Greek', year: 1614, def: 'log (mathematics)', related: true },
          { word: 'arithmos', lang: 'Greek', year: -100, def: 'number', root: true },
          { word: 'algebraic', lang: 'Arabic', year: 1500, def: 'algebra-related', related: true },
          { word: 'algorithmic', lang: 'Old English', year: 1976, def: 'computer science', derived: true }
        ]
      },
      democracy: {
        word: 'Democracy',
        definition: 'Government by the people',
        yearAdopted: 1576,
        root: { word: 'demos + kratos', lang: 'Greek', year: -600, def: 'people + power' },
        branches: [
          { word: 'demos', lang: 'Greek', year: -600, def: 'people/district', root: true },
          { word: 'kratos', lang: 'Greek', year: -600, def: 'power/rule', root: true },
          { word: 'democratic', lang: 'Old English', year: 1500, def: 'relating to democracy', derived: true },
          { word: 'democrat', lang: 'Old English', year: 1789, def: 'advocate of democracy', derived: true },
          { word: 'epidemic', lang: 'Greek', year: 1600, def: 'among people (epi + demos)', related: true },
          { word: 'aristocracy', lang: 'Greek', year: 1400, def: 'rule by best', related: true }
        ]
      }
    };

    const langColors = {
      'Old English': '#ff4444',
      'Latin': '#44ff44',
      'Germanic': '#4444ff',
      'Romance': '#ff44ff',
      'Greek': '#ffaa44',
      'Arabic': '#ffdd44',
      'French': '#ff99ff',
      'Default': '#888888'
    };

    let currentData = etymologyDB.kitchen;
    let nodes = [];
    let links = [];
    let canvas, ctx;
    let simulation = { active: false, alpha: 1 };

    class Node {
      constructor(word, lang, year, x, y, type) {
        this.word = word;
        this.lang = lang;
        this.year = year;
        this.x = x || Math.random() * 400;
        this.y = y || Math.random() * 400;
        this.vx = 0;
        this.vy = 0;
        this.type = type || 'branch';
        this.radius = type === 'root' ? 12 : 8;
      }
    }

    function initTree() {
      nodes = [];
      links = [];
      
      let rootNode = new Node(currentData.root.word, currentData.root.lang, currentData.root.year, 200, 200, 'root');
      nodes.push(rootNode);

      let centerNode = new Node(currentData.word, 'Old English', currentData.yearAdopted, 200, 100, 'center');
      nodes.push(centerNode);
      links.push([1, 0]); // center to root

      currentData.branches.forEach((branch, i) => {
        let angle = (i / currentData.branches.length) * Math.PI * 2;
        let dist = 80;
        let x = 200 + Math.cos(angle) * dist;
        let y = 200 + Math.sin(angle) * dist;
        let node = new Node(branch.word, branch.lang, branch.year, x, y, 'branch');
        nodes.push(node);
        links.push([nodes.length - 1, 1]); // branch to center
      });

      simulation.alpha = 1;
      simulation.active = true;
    }

    function forceSimulate() {
      if (!simulation.active || simulation.alpha < 0.01) return;

      // Repulsion
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          let dx = nodes[j].x - nodes[i].x;
          let dy = nodes[j].y - nodes[i].y;
          let dist = Math.hypot(dx, dy) || 1;
          let force = 50 / (dist * dist);
          nodes[i].vx -= (dx / dist) * force * 0.1;
          nodes[i].vy -= (dy / dist) * force * 0.1;
          nodes[j].vx += (dx / dist) * force * 0.1;
          nodes[j].vy += (dy / dist) * force * 0.1;
        }
      }

      // Spring attraction
      links.forEach(([i, j]) => {
        let dx = nodes[j].x - nodes[i].x;
        let dy = nodes[j].y - nodes[i].y;
        let dist = Math.hypot(dx, dy) || 1;
        let force = (dist - 60) * 0.02;
        nodes[i].vx += (dx / dist) * force;
        nodes[i].vy += (dy / dist) * force;
        nodes[j].vx -= (dx / dist) * force;
        nodes[j].vy -= (dy / dist) * force;
      });

      // Damping & center pull
      nodes.forEach((n, i) => {
        n.vx *= 0.95;
        n.vy *= 0.95;
        if (i === 0) {
          n.x = 200;
          n.y = 200;
          n.vx = 0;
          n.vy = 0;
        } else {
          n.x += n.vx;
          n.y += n.vy;
        }
      });

      simulation.alpha *= 0.98;
    }

    function render() {
      ctx.fillStyle = '#0f1419';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw links
      ctx.strokeStyle = '#4da8da33';
      ctx.lineWidth = 2;
      links.forEach(([i, j]) => {
        ctx.beginPath();
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[j].x, nodes[j].y);
        ctx.stroke();
      });

      // Draw nodes
      nodes.forEach((node, idx) => {
        ctx.fillStyle = langColors[node.lang] || langColors.Default;
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
        ctx.fill();

        // Label
        ctx.fillStyle = '#e0e0e0';
        ctx.font = 'bold 11px Space Mono';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(node.word, node.x, node.y + node.radius + 12);
      });
    }

    function animate() {
      forceSimulate();
      render();
      requestAnimationFrame(animate);
    }

    function exploreWord() {
      let word = document.getElementById('wordInput').value.toLowerCase().trim();
      if (etymologyDB[word]) {
        currentData = etymologyDB[word];
        initTree();
        updateInfo();
      } else {
        alert('Word not in database. Try: kitchen, sentiment, algorithm, democracy');
      }
    }

    function updateInfo() {
      let info = document.getElementById('infoBox');
      info.innerHTML = `
        <strong>${currentData.word}</strong><br>
        <i>${currentData.definition}</i><br><br>
        From <b>${currentData.root.word}</b> (${currentData.root.lang}, ~${currentData.root.year} AD)<br>
        Adopted into English: ~${currentData.yearAdopted} AD
      `;
    }

    function resizeCanvas() {
      let container = document.querySelector('.canvas-container');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }

    window.addEventListener('DOMContentLoaded', () => {
      canvas = document.getElementById('canvas');
      ctx = canvas.getContext('2d');
      resizeCanvas();
      initTree();
      updateInfo();
      animate();
    });

    document.getElementById('timelineSlider').addEventListener('input', (e) => {
      let year = Math.round(parseInt(e.target.value) / 100) * 100;
      document.getElementById('timeLabel').textContent = `0 AD - ${year}`;
    });

    window.addEventListener('resize', resizeCanvas);
  </script>
</body>
</html>
