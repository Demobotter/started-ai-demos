<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluid Flow Tracer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: rgba(10, 14, 39, 0.8);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 255, 136, 0.1);
      border: 1px solid rgba(0, 255, 255, 0.15);
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #00ffff, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      color: #00d9ff;
      font-size: 13px;
      margin-bottom: 25px;
      opacity: 0.8;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
      padding: 20px;
      background: rgba(0, 255, 255, 0.05);
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 255, 0.1);
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      color: #00ffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select, input[type="range"], input[type="number"] {
      padding: 8px 12px;
      border: 1px solid rgba(0, 255, 136, 0.3);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.3);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
    }
    input[type="range"] {
      cursor: pointer;
      height: 6px;
      accent-color: #00ff88;
    }
    select:focus, input[type="range"]:focus, input[type="number"]:focus {
      outline: none;
      border-color: #00ff88;
      box-shadow: 0 0 8px rgba(0, 255, 136, 0.3);
    }
    .canvas-wrapper {
      position: relative;
      margin-bottom: 20px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(0, 255, 255, 0.15);
      background: #0a0e27;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      cursor: crosshair;
      background: #0a0e27;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .stat-box {
      background: rgba(0, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 136, 0.2);
      border-radius: 6px;
      padding: 12px;
      text-align: center;
    }
    .stat-label {
      font-size: 11px;
      color: #00d9ff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      opacity: 0.7;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 600;
      color: #00ff88;
      font-family: 'Syne', sans-serif;
    }
    .instruction {
      font-size: 12px;
      color: #00d9ff;
      margin-top: 15px;
      opacity: 0.7;
      border-left: 2px solid rgba(0, 255, 136, 0.3);
      padding-left: 10px;
    }
    button {
      padding: 10px 16px;
      background: linear-gradient(135deg, #00ff88, #00ffff);
      color: #0a0e27;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0, 255, 136, 0.3);
    }
    button:active {
      transform: translateY(0);
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Fluid Flow Tracer</h1>
    <p class="subtitle">RK4 Lagrangian particle integration • 5 vector fields • Click to emit</p>

    <div class="controls">
      <div class="control-group">
        <label for="fieldSelect">Vector Field</label>
        <select id="fieldSelect">
          <option value="vortex">Vortex (Spinning)</option>
          <option value="source">Source (Expanding)</option>
          <option value="sink">Sink (Collapsing)</option>
          <option value="shear">Shear Flow</option>
          <option value="doublet">Doublet (Repelling)</option>
        </select>
      </div>
      <div class="control-group">
        <label for="strengthSlider">Field Strength: <span id="strengthValue">1.0</span></label>
        <input type="range" id="strengthSlider" min="0.1" max="3" step="0.1" value="1">
      </div>
      <div class="control-group">
        <label for="particleCountSlider">Particle Count: <span id="particleCountValue">50</span></label>
        <input type="range" id="particleCountSlider" min="10" max="200" step="10" value="50">
      </div>
      <div class="control-group">
        <label for="trailLengthSlider">Trail Length: <span id="trailLengthValue">50</span></label>
        <input type="range" id="trailLengthSlider" min="5" max="150" step="5" value="50">
      </div>
    </div>

    <div class="button-group">
      <button id="resetBtn">Reset Particles</button>
      <button id="pauseBtn">Pause</button>
    </div>

    <div class="canvas-wrapper">
      <canvas id="canvas"></canvas>
    </div>

    <div class="stats">
      <div class="stat-box">
        <div class="stat-label">Max Speed</div>
        <div class="stat-value" id="maxSpeed">0.0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Avg Speed</div>
        <div class="stat-value" id="avgSpeed">0.0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Active Particles</div>
        <div class="stat-value" id="particleCount">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">FPS</div>
        <div class="stat-value" id="fps">60</div>
      </div>
    </div>

    <p class="instruction">💡 Click anywhere on the canvas to emit particles. Use the sliders to adjust field strength and particle behavior.</p>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // Resize canvas
    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = Math.max(500, rect.width * 0.6);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Particle system
    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.trail = [];
        this.speed = 0;
      }

      getSpeed() {
        return Math.sqrt(this.vx ** 2 + this.vy ** 2);
      }
    }

    let particles = [];
    let isPaused = false;
    let fieldType = 'vortex';
    let fieldStrength = 1;
    let trailLength = 50;
    let maxParticles = 50;

    // Vector field functions
    const fields = {
      vortex: (x, y, str) => {
        const dx = x - canvas.width / 2;
        const dy = y - canvas.height / 2;
        const r = Math.sqrt(dx ** 2 + dy ** 2) + 1;
        return { vx: -dy / r * str, vy: dx / r * str };
      },
      source: (x, y, str) => {
        const dx = x - canvas.width / 2;
        const dy = y - canvas.height / 2;
        const r = Math.sqrt(dx ** 2 + dy ** 2) + 1;
        return { vx: dx / r * str, vy: dy / r * str };
      },
      sink: (x, y, str) => {
        const dx = x - canvas.width / 2;
        const dy = y - canvas.height / 2;
        const r = Math.sqrt(dx ** 2 + dy ** 2) + 1;
        return { vx: -dx / r * str, vy: -dy / r * str };
      },
      shear: (x, y, str) => {
        const dy = y - canvas.height / 2;
        return { vx: dy * 0.01 * str, vy: 0 };
      },
      doublet: (x, y, str) => {
        const x1 = x - canvas.width / 3;
        const x2 = x - (2 * canvas.width / 3);
        const dy = y - canvas.height / 2;
        const r1 = Math.sqrt(x1 ** 2 + dy ** 2) + 1;
        const r2 = Math.sqrt(x2 ** 2 + dy ** 2) + 1;
        return {
          vx: (x1 / r1 ** 3 - x2 / r2 ** 3) * str,
          vy: (dy / r1 ** 3 - dy / r2 ** 3) * str
        };
      }
    };

    // RK4 integration
    function rk4Step(particle, h = 1) {
      const field = fields[fieldType];
      
      // k1
      const f1 = field(particle.x, particle.y, fieldStrength);
      const k1x = f1.vx;
      const k1y = f1.vy;

      // k2
      const f2 = field(particle.x + k1x * h / 2, particle.y + k1y * h / 2, fieldStrength);
      const k2x = f2.vx;
      const k2y = f2.vy;

      // k3
      const f3 = field(particle.x + k2x * h / 2, particle.y + k2y * h / 2, fieldStrength);
      const k3x = f3.vx;
      const k3y = f3.vy;

      // k4
      const f4 = field(particle.x + k3x * h, particle.y + k3y * h, fieldStrength);
      const k4x = f4.vx;
      const k4y = f4.vy;

      particle.vx = (k1x + 2 * k2x + 2 * k3x + k4x) / 6;
      particle.vy = (k1y + 2 * k2y + 2 * k3y + k4y) / 6;

      particle.x += particle.vx * h;
      particle.y += particle.vy * h;
      particle.speed = particle.getSpeed();

      if (particle.trail.length > trailLength) {
        particle.trail.shift();
      }
      particle.trail.push({ x: particle.x, y: particle.y });
    }

    // Draw particles
    function draw() {
      ctx.fillStyle = '#0a0e27';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw grid
      ctx.strokeStyle = 'rgba(0, 255, 255, 0.05)';
      ctx.lineWidth = 1;
      const gridSize = 50;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Draw particles and trails
      particles.forEach(p => {
        // Trail
        ctx.strokeStyle = 'rgba(0, 255, 136, 0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        p.trail.forEach((point, i) => {
          const t = i / p.trail.length;
          const hue = 240 + t * 120; // Blue to green
          if (i === 0) ctx.moveTo(point.x, point.y);
          else ctx.lineTo(point.x, point.y);
        });
        ctx.stroke();

        // Particle with velocity gradient
        const speed = p.speed;
        const maxSpeed = 5;
        const t = Math.min(speed / maxSpeed, 1);
        const hue = 240 + t * 120; // Blue → cyan → green → yellow → red
        ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3 + t * 2, 0, Math.PI * 2);
        ctx.fill();

        // Velocity vector
        if (speed > 0.1) {
          ctx.strokeStyle = `hsl(${hue}, 100%, 60%)`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x + p.vx * 10, p.y + p.vy * 10);
          ctx.stroke();
        }
      });

      // Update stats
      if (particles.length > 0) {
        const speeds = particles.map(p => p.speed);
        const maxSpeed = Math.max(...speeds);
        const avgSpeed = speeds.reduce((a, b) => a + b, 0) / speeds.length;
        document.getElementById('maxSpeed').textContent = maxSpeed.toFixed(2);
        document.getElementById('avgSpeed').textContent = avgSpeed.toFixed(2);
      }
      document.getElementById('particleCount').textContent = particles.length;
    }

    // Animation loop
    let lastTime = performance.now();
    let frameCount = 0;
    function animate(now) {
      const deltaTime = (now - lastTime) / 1000;
      lastTime = now;

      if (!isPaused) {
        particles = particles.filter(p => {
          rk4Step(p);
          // Remove particles that are too slow or out of bounds
          return p.speed > 0.01 && 
                 p.x > -100 && p.x < canvas.width + 100 &&
                 p.y > -100 && p.y < canvas.height + 100;
        });
      }

      draw();

      frameCount++;
      if (frameCount % 10 === 0) {
        const fps = Math.round(1 / deltaTime);
        document.getElementById('fps').textContent = fps;
      }

      requestAnimationFrame(animate);
    }
    animate(performance.now());

    // Canvas click handler
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height);

      for (let i = 0; i < maxParticles / 5; i++) {
        if (particles.length < maxParticles) {
          const angle = (i / (maxParticles / 5)) * Math.PI * 2;
          const spread = 15;
          const px = x + Math.cos(angle) * spread;
          const py = y + Math.sin(angle) * spread;
          particles.push(new Particle(px, py));
        }
      }
    });

    // Control handlers
    document.getElementById('fieldSelect').addEventListener('change', (e) => {
      fieldType = e.target.value;
    });

    document.getElementById('strengthSlider').addEventListener('input', (e) => {
      fieldStrength = parseFloat(e.target.value);
      document.getElementById('strengthValue').textContent = fieldStrength.toFixed(1);
    });

    document.getElementById('particleCountSlider').addEventListener('input', (e) => {
      maxParticles = parseInt(e.target.value);
      document.getElementById('particleCountValue').textContent = maxParticles;
    });

    document.getElementById('trailLengthSlider').addEventListener('input', (e) => {
      trailLength = parseInt(e.target.value);
      document.getElementById('trailLengthValue').textContent = trailLength;
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      particles = [];
    });

    document.getElementById('pauseBtn').addEventListener('click', () => {
      isPaused = !isPaused;
      document.getElementById('pauseBtn').textContent = isPaused ? 'Resume' : 'Pause';
    });

    // Auto-emit initial particles
    function emitInitial() {
      for (let i = 0; i < 20; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        particles.push(new Particle(x, y));
      }
    }
    emitInitial();
  </script>
</body>
</html>
