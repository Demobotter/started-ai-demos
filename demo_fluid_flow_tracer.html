<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluid Flow Tracer</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0e27;
      color: #e0e0e0;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      width: 100%;
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      margin-bottom: 8px;
      color: #00ffff;
    }
    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 20px;
    }
    .canvas-wrapper {
      background: #0d1825;
      border: 1px solid #1a3a4a;
      border-radius: 8px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
    }
    .controls {
      background: #0d1825;
      border: 1px solid #1a3a4a;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .control-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
    }
    label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #00ff88;
      margin-bottom: 6px;
      font-weight: 500;
    }
    select, input[type="range"], button {
      background: #0a0e27;
      border: 1px solid #1a3a4a;
      color: #e0e0e0;
      padding: 8px 12px;
      border-radius: 4px;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      font-size: 13px;
    }
    input[type="range"] {
      height: 5px;
      padding: 0;
      accent-color: #00ffff;
    }
    button {
      background: #00ffff;
      color: #0a0e27;
      border: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.8;
    }
    .stats {
      background: #0d1825;
      border: 1px solid #1a3a4a;
      border-radius: 8px;
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }
    .stat-item {
      text-align: center;
    }
    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #00ffff;
      font-family: 'Syne', sans-serif;
    }
    @media (max-width: 600px) {
      h1 { font-size: 24px; }
      .control-row { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Fluid Flow Tracer</h1>
    <p class="subtitle">Real-time Lagrangian particle dynamics in vector fields</p>

    <div class="canvas-wrapper">
      <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
      <div class="control-row">
        <div class="control-group">
          <label>Vector Field</label>
          <select id="fieldType">
            <option value="vortex">Vortex (Spinning)</option>
            <option value="source">Source (Expanding)</option>
            <option value="sink">Sink (Collapsing)</option>
            <option value="shear">Shear (Layered)</option>
            <option value="cylinder">Wind Over Cylinder</option>
          </select>
        </div>
        <div class="control-group">
          <label>Field Strength</label>
          <input type="range" id="fieldStrength" min="0.1" max="3" step="0.1" value="1">
        </div>
        <div class="control-group">
          <label>Particle Count</label>
          <input type="range" id="particleCount" min="50" max="300" step="10" value="150">
        </div>
      </div>
      <div class="control-row">
        <button id="resetBtn">Reset Particles</button>
        <button id="toggleQuiverBtn">Toggle Quiver Plot</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat-item">
        <div class="stat-label">Max Speed</div>
        <div class="stat-value" id="maxSpeed">0.0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Avg Speed</div>
        <div class="stat-value" id="avgSpeed">0.0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Active</div>
        <div class="stat-value" id="particleCountStat">150</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Field Type</div>
        <div class="stat-value" id="fieldTypeStat">Vortex</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // DPI scaling for crisp rendering
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.offsetWidth * dpr;
    canvas.height = 600 * dpr;
    ctx.scale(dpr, dpr);
    const w = canvas.offsetWidth;
    const h = 600;

    // State
    let particles = [];
    let fieldType = 'vortex';
    let fieldStrength = 1;
    let targetParticleCount = 150;
    let showQuiver = false;

    // Color palette
    const colorGradient = ['#0066ff', '#00ffff', '#00ff88', '#ffff00', '#ff8800', '#ff0000'];

    // RK4 integrator for particle trajectories
    function getVelocity(x, y, field, strength) {
      const cx = w / 2, cy = h / 2;
      const dx = x - cx, dy = y - cy;
      const r = Math.sqrt(dx * dx + dy * dy) + 0.1;
      const theta = Math.atan2(dy, dx);

      let vx = 0, vy = 0;

      switch (field) {
        case 'vortex':
          vx = -strength * (dy / (r * r)) * 100;
          vy = strength * (dx / (r * r)) * 100;
          break;
        case 'source':
          vx = strength * (dx / r) * 50;
          vy = strength * (dy / r) * 50;
          break;
        case 'sink':
          vx = -strength * (dx / r) * 50;
          vy = -strength * (dy / r) * 50;
          break;
        case 'shear':
          vx = strength * Math.sin(y / 50) * 50;
          vy = strength * Math.cos(x / 50) * 30;
          break;
        case 'cylinder':
          const angle = Math.atan2(dy, dx);
          const mag = Math.cos(theta - angle);
          vx = strength * mag * Math.cos(angle) * 60;
          vy = strength * mag * Math.sin(angle) * 60;
          break;
      }

      return { vx, vy };
    }

    function rk4Step(x, y, dt) {
      const k1 = getVelocity(x, y, fieldType, fieldStrength);
      const k2 = getVelocity(x + k1.vx * dt * 0.5, y + k1.vy * dt * 0.5, fieldType, fieldStrength);
      const k3 = getVelocity(x + k2.vx * dt * 0.5, y + k2.vy * dt * 0.5, fieldType, fieldStrength);
      const k4 = getVelocity(x + k3.vx * dt, y + k3.vy * dt, fieldType, fieldStrength);

      const nx = x + (dt / 6) * (k1.vx + 2*k2.vx + 2*k3.vx + k4.vx);
      const ny = y + (dt / 6) * (k1.vy + 2*k2.vy + 2*k3.vy + k4.vy);

      return { x: nx, y: ny };
    }

    function initParticles() {
      particles = [];
      for (let i = 0; i < targetParticleCount; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: 0,
          vy: 0,
          trail: []
        });
      }
    }

    function updateParticles() {
      const dt = 0.016; // ~60fps
      for (let p of particles) {
        const vel = getVelocity(p.x, p.y, fieldType, fieldStrength);
        p.vx = vel.vx;
        p.vy = vel.vy;
        
        const newPos = rk4Step(p.x, p.y, dt);
        p.x = newPos.x;
        p.y = newPos.y;

        // Wrap around edges
        if (p.x < 0) p.x = w;
        if (p.x > w) p.x = 0;
        if (p.y < 0) p.y = h;
        if (p.y > h) p.y = 0;

        // Keep trail
        p.trail.push({ x: p.x, y: p.y });
        if (p.trail.length > 20) p.trail.shift();
      }
    }

    function speedToColor(speed) {
      const maxSpeed = 150;
      const normalized = Math.min(speed / maxSpeed, 1);
      const idx = Math.floor(normalized * (colorGradient.length - 1));
      return colorGradient[idx];
    }

    function drawQuiverPlot() {
      const gridSize = 60;
      ctx.strokeStyle = 'rgba(0, 255, 136, 0.15)';
      ctx.fillStyle = 'rgba(0, 255, 136, 0.2)';
      ctx.lineWidth = 0.8;

      for (let x = 0; x < w; x += gridSize) {
        for (let y = 0; y < h; y += gridSize) {
          const vel = getVelocity(x, y, fieldType, fieldStrength);
          const len = Math.sqrt(vel.vx * vel.vx + vel.vy * vel.vy);
          const scale = 8;
          const endX = x + (vel.vx / Math.max(len, 1)) * scale;
          const endY = y + (vel.vy / Math.max(len, 1)) * scale;

          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(endX, endY);
          ctx.stroke();

          // Arrow head
          const angle = Math.atan2(vel.vy, vel.vx);
          ctx.beginPath();
          ctx.moveTo(endX - 3 * Math.cos(angle - Math.PI / 6), endY - 3 * Math.sin(angle - Math.PI / 6));
          ctx.lineTo(endX, endY);
          ctx.lineTo(endX - 3 * Math.cos(angle + Math.PI / 6), endY - 3 * Math.sin(angle + Math.PI / 6));
          ctx.stroke();
        }
      }
    }

    function draw() {
      // Background
      ctx.fillStyle = '#0d1825';
      ctx.fillRect(0, 0, w, h);

      // Grid
      ctx.strokeStyle = 'rgba(26, 58, 74, 0.4)';
      ctx.lineWidth = 0.5;
      for (let x = 0; x < w; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      for (let y = 0; y < h; y += 50) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      if (showQuiver) drawQuiverPlot();

      // Particles
      for (let p of particles) {
        const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        const color = speedToColor(speed);

        // Trail
        ctx.strokeStyle = color;
        ctx.globalAlpha = 0.3;
        ctx.lineWidth = 1;
        if (p.trail.length > 1) {
          ctx.beginPath();
          ctx.moveTo(p.trail[0].x, p.trail[0].y);
          for (let i = 1; i < p.trail.length; i++) {
            ctx.lineTo(p.trail[i].x, p.trail[i].y);
          }
          ctx.stroke();
        }

        // Particle
        ctx.globalAlpha = 1;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function updateStats() {
      if (particles.length === 0) return;
      let maxSpeed = 0, totalSpeed = 0;
      for (let p of particles) {
        const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        maxSpeed = Math.max(maxSpeed, speed);
        totalSpeed += speed;
      }
      const avgSpeed = totalSpeed / particles.length;
      document.getElementById('maxSpeed').textContent = (maxSpeed / 100).toFixed(2);
      document.getElementById('avgSpeed').textContent = (avgSpeed / 100).toFixed(2);
      document.getElementById('particleCountStat').textContent = particles.length;
      document.getElementById('fieldTypeStat').textContent = fieldType.charAt(0).toUpperCase() + fieldType.slice(1);
    }

    function animate() {
      updateParticles();
      draw();
      updateStats();
      requestAnimationFrame(animate);
    }

    // Controls
    document.getElementById('fieldType').addEventListener('change', (e) => {
      fieldType = e.target.value;
    });
    document.getElementById('fieldStrength').addEventListener('input', (e) => {
      fieldStrength = parseFloat(e.target.value);
    });
    document.getElementById('particleCount').addEventListener('input', (e) => {
      targetParticleCount = parseInt(e.target.value);
      if (particles.length < targetParticleCount) {
        for (let i = 0; i < targetParticleCount - particles.length; i++) {
          particles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            vx: 0,
            vy: 0,
            trail: []
          });
        }
      } else {
        particles = particles.slice(0, targetParticleCount);
      }
    });
    document.getElementById('resetBtn').addEventListener('click', initParticles);
    document.getElementById('toggleQuiverBtn').addEventListener('click', () => {
      showQuiver = !showQuiver;
    });

    // Start
    initParticles();
    animate();
  </script>
</body>
</html>
