<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluid Flow Tracer</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: #0a0e27; 
      color: #e0e0e0; 
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #0f1437;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 255, 255, 0.1);
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.2em;
      margin-bottom: 8px;
      color: #00ffff;
      font-weight: 700;
    }
    .subtitle {
      font-size: 0.9em;
      color: #888;
      margin-bottom: 24px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
      padding: 16px;
      background: rgba(0, 255, 255, 0.05);
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 255, 0.2);
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-group label {
      font-size: 0.85em;
      font-weight: 600;
      color: #00ffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select, input[type="range"] {
      padding: 8px 12px;
      background: #1a1f3a;
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 6px;
      color: #e0e0e0;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
    }
    input[type="range"] {
      padding: 8px;
    }
    select:focus, input[type="range"]:focus { outline: none; border-color: #00ffff; }
    .canvas-wrapper {
      position: relative;
      background: #0a0e27;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid rgba(0, 255, 255, 0.2);
      margin-bottom: 24px;
      cursor: crosshair;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      padding: 16px;
      background: rgba(0, 255, 136, 0.05);
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 136, 0.2);
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-label {
      font-size: 0.75em;
      text-transform: uppercase;
      color: #00ff88;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .stat-value {
      font-size: 1.4em;
      font-weight: 700;
      color: #00ffff;
      font-family: 'Syne', sans-serif;
    }
    .hint {
      margin-top: 16px;
      padding: 12px;
      background: rgba(255, 183, 0, 0.05);
      border-left: 3px solid #ffb700;
      font-size: 0.85em;
      color: #ffb700;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Fluid Flow Tracer</h1>
    <p class="subtitle">Lagrangian particle tracing through real fluid vector fields</p>
    
    <div class="controls">
      <div class="control-group">
        <label>Vector Field</label>
        <select id="fieldType">
          <option value="vortex">Vortex</option>
          <option value="source">Source</option>
          <option value="sink">Sink</option>
          <option value="shear">Shear</option>
          <option value="cylinder">Wind over Cylinder</option>
        </select>
      </div>
      <div class="control-group">
        <label>Field Strength</label>
        <input type="range" id="strength" min="0.5" max="3" step="0.1" value="1">
      </div>
      <div class="control-group">
        <label>Particle Count</label>
        <input type="range" id="particleCount" min="10" max="300" step="10" value="150">
      </div>
      <div class="control-group">
        <label>Emission Rate</label>
        <input type="range" id="emissionRate" min="1" max="10" step="1" value="3">
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="flowCanvas"></canvas>
    </div>

    <div class="stats">
      <div class="stat-item">
        <div class="stat-label">Max Speed</div>
        <div class="stat-value" id="maxSpeed">0.00</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Avg Speed</div>
        <div class="stat-value" id="avgSpeed">0.00</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Active Particles</div>
        <div class="stat-value" id="particleCountStat">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Field Type</div>
        <div class="stat-value" id="fieldLabel">Vortex</div>
      </div>
    </div>

    <div class="hint">
      💡 Click on the canvas to emit particles at that location. Real vector field math, no fake data.
    </div>
  </div>

  <script>
    const canvas = document.getElementById('flowCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width - 4;
      canvas.height = Math.max(400, Math.min(600, canvas.width * 0.6));
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const W = canvas.width;
    const H = canvas.height;
    const particles = [];
    let animationId;
    let emitterLoc = null;

    const state = {
      fieldType: 'vortex',
      strength: 1,
      particleCount: 150,
      emissionRate: 3,
    };

    document.getElementById('fieldType').addEventListener('change', (e) => {
      state.fieldType = e.target.value;
      document.getElementById('fieldLabel').textContent = 
        e.target.value.charAt(0).toUpperCase() + e.target.value.slice(1);
    });
    document.getElementById('strength').addEventListener('input', (e) => { state.strength = parseFloat(e.target.value); });
    document.getElementById('particleCount').addEventListener('input', (e) => { state.particleCount = parseInt(e.target.value); });
    document.getElementById('emissionRate').addEventListener('input', (e) => { state.emissionRate = parseInt(e.target.value); });

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      emitterLoc = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      setTimeout(() => { emitterLoc = null; }, 500);
    });

    function vortex(x, y, cx, cy, strength) {
      const dx = x - cx, dy = y - cy;
      const r2 = dx * dx + dy * dy + 1e-4;
      const s = strength / Math.sqrt(r2);
      return { vx: -s * dy / r2, vy: s * dx / r2 };
    }

    function source(x, y, cx, cy, strength) {
      const dx = x - cx, dy = y - cy;
      const r2 = dx * dx + dy * dy + 1e-4;
      const s = strength / Math.sqrt(r2);
      return { vx: s * dx / Math.sqrt(r2), vy: s * dy / Math.sqrt(r2) };
    }

    function sink(x, y, cx, cy, strength) {
      const v = source(x, y, cx, cy, strength);
      return { vx: -v.vx, vy: -v.vy };
    }

    function shear(x, y, strength) {
      return { vx: strength * y / H, vy: 0 };
    }

    function cylinderWind(x, y, strength) {
      const cx = W / 2, cy = H / 2;
      const dx = x - cx, dy = y - cy;
      const r2 = dx * dx + dy * dy;
      const r = Math.sqrt(r2);
      if (r < 30) return { vx: 0, vy: 0 };
      const u = strength * (1 - 900 / r2);
      const angle = Math.atan2(dy, dx);
      const vx = u * Math.cos(angle);
      const vy = u * Math.sin(angle);
      return { vx, vy };
    }

    function getFieldVelocity(x, y, fieldType, strength) {
      const cx = W / 2, cy = H / 2;
      switch (fieldType) {
        case 'vortex': return vortex(x, y, cx, cy, strength * 0.5);
        case 'source': return source(x, y, cx, cy, strength * 0.3);
        case 'sink': return sink(x, y, cx, cy, strength * 0.3);
        case 'shear': return shear(x, y, strength * 0.8);
        case 'cylinder': return cylinderWind(x, y, strength * 0.6);
        default: return { vx: 0, vy: 0 };
      }
    }

    function rk4Step(x, y, fieldType, strength, dt = 0.5) {
      const k1 = getFieldVelocity(x, y, fieldType, strength);
      const k2 = getFieldVelocity(x + k1.vx * dt * 0.5, y + k1.vy * dt * 0.5, fieldType, strength);
      const k3 = getFieldVelocity(x + k2.vx * dt * 0.5, y + k2.vy * dt * 0.5, fieldType, strength);
      const k4 = getFieldVelocity(x + k3.vx * dt, y + k3.vy * dt, fieldType, strength);
      return {
        x: x + (k1.vx + 2 * k2.vx + 2 * k3.vx + k4.vx) * dt / 6,
        y: y + (k1.vy + 2 * k2.vy + 2 * k3.vy + k4.vy) * dt / 6,
      };
    }

    function createParticle(x, y) {
      return {
        x, y,
        trail: [{ x, y }],
        age: 0,
        maxAge: 200 + Math.random() * 100,
      };
    }

    function updateParticles() {
      // Emission from left boundary
      for (let i = 0; i < state.emissionRate; i++) {
        if (particles.length < state.particleCount) {
          particles.push(createParticle(-5, Math.random() * H));
        }
      }

      // Emission from click
      if (emitterLoc && particles.length < state.particleCount) {
        for (let i = 0; i < state.emissionRate * 2; i++) {
          const angle = Math.random() * Math.PI * 2;
          const r = Math.random() * 10;
          particles.push(createParticle(
            emitterLoc.x + r * Math.cos(angle),
            emitterLoc.y + r * Math.sin(angle)
          ));
        }
      }

      // Update each particle
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        const newPos = rk4Step(p.x, p.y, state.fieldType, state.strength);
        p.x = newPos.x;
        p.y = newPos.y;
        p.age++;

        if (p.trail.length === 0 || 
            Math.hypot(p.x - p.trail[p.trail.length - 1].x, p.y - p.trail[p.trail.length - 1].y) > 2) {
          p.trail.push({ x: p.x, y: p.y });
        }
        if (p.trail.length > 30) p.trail.shift();

        // Remove if out of bounds or too old
        if (p.age > p.maxAge || p.x < -50 || p.x > W + 50 || p.y < -50 || p.y > H + 50) {
          particles.splice(i, 1);
        }
      }
    }

    function computeStats() {
      let maxSpeed = 0, totalSpeed = 0;
      for (const p of particles) {
        if (p.trail.length > 1) {
          const prev = p.trail[p.trail.length - 2];
          const curr = p.trail[p.trail.length - 1];
          const speed = Math.hypot(curr.x - prev.x, curr.y - prev.y);
          maxSpeed = Math.max(maxSpeed, speed);
          totalSpeed += speed;
        }
      }
      const avgSpeed = particles.length > 0 ? totalSpeed / particles.length : 0;
      document.getElementById('maxSpeed').textContent = maxSpeed.toFixed(2);
      document.getElementById('avgSpeed').textContent = avgSpeed.toFixed(2);
      document.getElementById('particleCountStat').textContent = particles.length;
    }

    function render() {
      ctx.fillStyle = '#0a0e27';
      ctx.fillRect(0, 0, W, H);

      // Render particle trails
      for (const p of particles) {
        if (p.trail.length < 2) continue;
        const progress = p.age / p.maxAge;
        const alpha = Math.max(0, 1 - progress);
        const speed = p.trail.length > 1 
          ? Math.hypot(p.trail[p.trail.length - 1].x - p.trail[p.trail.length - 2].x, 
                       p.trail[p.trail.length - 1].y - p.trail[p.trail.length - 2].y)
          : 0;
        
        // Color by speed: blue→cyan→green→yellow→red
        let color;
        if (speed < 0.5) color = `rgba(0, 100, 255, ${alpha})`;
        else if (speed < 1) color = `rgba(0, 255, 255, ${alpha})`;
        else if (speed < 2) color = `rgba(0, 255, 136, ${alpha})`;
        else if (speed < 3) color = `rgba(255, 183, 0, ${alpha})`;
        else color = `rgba(255, 100, 100, ${alpha})`;

        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(p.trail[0].x, p.trail[0].y);
        for (let i = 1; i < p.trail.length; i++) {
          ctx.lineTo(p.trail[i].x, p.trail[i].y);
        }
        ctx.stroke();

        // Draw particle head
        const last = p.trail[p.trail.length - 1];
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(last.x, last.y, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw emitter center if active
      if (emitterLoc) {
        ctx.fillStyle = 'rgba(255, 183, 0, 0.5)';
        ctx.beginPath();
        ctx.arc(emitterLoc.x, emitterLoc.y, 15, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function animate() {
      updateParticles();
      computeStats();
      render();
      animationId = requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
