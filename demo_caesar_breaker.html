<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caesar Breaker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Space Mono', monospace;
      background: #0a1428;
      color: #e0e0e0;
      padding: 2rem;
      min-height: 100vh;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: #4da8da;
      text-align: center;
    }
    
    .subtitle {
      text-align: center;
      color: #8899aa;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    
    .input-section {
      background: #0f1f3a;
      border: 2px solid #4da8da;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    
    textarea {
      width: 100%;
      min-height: 100px;
      background: #0a1428;
      color: #4da8da;
      border: 1px solid #4da8da;
      border-radius: 4px;
      padding: 1rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.95rem;
      resize: vertical;
      margin-bottom: 1rem;
    }
    
    textarea::placeholder {
      color: #446688;
    }
    
    .button-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }
    
    button {
      background: #fbbf24;
      color: #0a1428;
      border: none;
      border-radius: 4px;
      padding: 0.75rem 1.5rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    button:hover {
      background: #f59e0b;
    }
    
    button:active {
      transform: scale(0.98);
    }
    
    .results-section {
      background: #0f1f3a;
      border: 2px solid #4da8da;
      border-radius: 8px;
      padding: 1.5rem;
      display: none;
    }
    
    .results-section.active {
      display: block;
    }
    
    .selected-plaintext {
      background: #0a1428;
      border-left: 4px solid #4da8da;
      padding: 1rem;
      margin-bottom: 1.5rem;
      border-radius: 4px;
    }
    
    .plaintext-label {
      font-size: 0.85rem;
      color: #8899aa;
      margin-bottom: 0.5rem;
    }
    
    .plaintext-display {
      font-size: 1.1rem;
      color: #00ff88;
      word-break: break-all;
      margin-bottom: 0.5rem;
      min-height: 30px;
    }
    
    .copy-btn {
      background: #4da8da;
      color: #0a1428;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
    }
    
    .copy-btn:hover {
      background: #6db8e8;
    }
    
    .table-wrapper {
      overflow-x: auto;
      margin-top: 1rem;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    
    th {
      background: #1a2d4a;
      color: #4da8da;
      padding: 0.75rem;
      text-align: left;
      border-bottom: 2px solid #4da8da;
      font-weight: bold;
    }
    
    td {
      padding: 0.75rem;
      border-bottom: 1px solid #1f4d7f;
    }
    
    tr.likely {
      background: rgba(0, 255, 136, 0.1);
      color: #00ff88;
    }
    
    tr.likely:hover {
      background: rgba(0, 255, 136, 0.2);
      cursor: pointer;
    }
    
    tr.possible {
      background: rgba(251, 191, 36, 0.08);
      color: #fbbf24;
    }
    
    tr.possible:hover {
      background: rgba(251, 191, 36, 0.15);
      cursor: pointer;
    }
    
    tr.unlikely {
      background: rgba(255, 107, 107, 0.08);
      color: #ff9999;
    }
    
    tr.unlikely:hover {
      background: rgba(255, 107, 107, 0.15);
      cursor: pointer;
    }
    
    tr.selected {
      border-left: 4px solid #4da8da;
      box-shadow: inset 0 0 8px rgba(77, 168, 218, 0.3);
    }
    
    .shift-col {
      width: 60px;
      font-weight: bold;
    }
    
    .plaintext-col {
      max-width: 500px;
      word-break: break-all;
      font-family: 'Space Mono', monospace;
    }
    
    .score-col {
      width: 140px;
      text-align: right;
    }
    
    .stats-box {
      background: #0a1428;
      border-left: 4px solid #8899aa;
      padding: 1rem;
      margin-top: 1.5rem;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }
    
    .stat-label {
      color: #8899aa;
    }
    
    .stat-value {
      color: #4da8da;
      font-weight: bold;
    }
    
    .loading {
      text-align: center;
      color: #4da8da;
      font-style: italic;
      padding: 1rem;
    }
    
    @media (max-width: 768px) {
      h1 {
        font-size: 1.8rem;
      }
      
      .plaintext-col {
        max-width: 250px;
        font-size: 0.8rem;
      }
      
      table {
        font-size: 0.8rem;
      }
      
      td, th {
        padding: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Caesar Breaker</h1>
    <div class="subtitle">Paste encrypted text. The tool tests all 26 shifts and ranks them by English letter frequency match.</div>
    
    <div class="input-section">
      <textarea id="inputText" placeholder="Paste a Caesar-encrypted message…"></textarea>
      <div class="button-group">
        <button onclick="analyzeText()">Analyze</button>
        <button onclick="document.getElementById('inputText').value = ''; document.querySelector('.results-section').classList.remove('active'); selectedShift = null;">Clear</button>
      </div>
    </div>
    
    <div class="results-section" id="resultsSection">
      <div class="selected-plaintext">
        <div class="plaintext-label">Selected Plaintext:</div>
        <div class="plaintext-display" id="selectedPlaintext">(click a row to select)</div>
        <button class="copy-btn" id="copyBtn" onclick="copyToClipboard()" style="display: none;">Copy to Clipboard</button>
      </div>
      
      <div class="stats-box">
        <div class="stat-row">
          <span class="stat-label">Total Shifts Analyzed:</span>
          <span class="stat-value" id="totalShifts">26</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Input Length:</span>
          <span class="stat-value" id="inputLength">0 characters</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Most Likely Shift:</span>
          <span class="stat-value" id="likelyShift">—</span>
        </div>
      </div>
      
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th class="shift-col">Shift</th>
              <th class="plaintext-col">Decrypted Text</th>
              <th class="score-col">Chi-Squared Score</th>
            </tr>
          </thead>
          <tbody id="resultsTable">
          </tbody>
        </table>
      </div>
    </div>
  </div>
  
  <script>
    // English letter frequencies (from NCVS corpus / standard cryptanalysis reference)
    const englishFreq = {
      'E': 11.1607, 'A': 8.4966, 'R': 7.5809, 'I': 7.2448, 'O': 7.1635,
      'T': 6.9147, 'N': 6.7482, 'S': 6.3327, 'H': 6.0094, 'D': 4.2543,
      'L': 4.0365, 'C': 2.7779, 'U': 2.7601, 'M': 2.4152, 'W': 2.3612,
      'F': 2.2228, 'G': 2.0820, 'Y': 1.9740, 'P': 1.9133, 'B': 1.4697,
      'V': 0.9769, 'K': 0.5731, 'J': 0.1965, 'X': 0.1508, 'Q': 0.0995, 'Z': 0.0772
    };
    
    let selectedShift = null;
    let analysisResults = [];
    
    function decryptCaesar(text, shift) {
      return text.replace(/[a-zA-Z]/g, function(c) {
        const base = c.charCodeAt(0) <= 90 ? 65 : 97;
        return String.fromCharCode((c.charCodeAt(0) - base - shift + 26) % 26 + base);
      });
    }
    
    function getLetterFrequencies(text) {
      const cleaned = text.toUpperCase().replace(/[^A-Z]/g, '');
      if (cleaned.length === 0) return {};
      
      const freq = {};
      for (let i = 0; i < 26; i++) {
        freq[String.fromCharCode(65 + i)] = 0;
      }
      
      for (let char of cleaned) {
        freq[char]++;
      }
      
      for (let letter in freq) {
        freq[letter] = (freq[letter] / cleaned.length) * 100;
      }
      
      return freq;
    }
    
    function chiSquared(observedFreq) {
      let chi2 = 0;
      for (let letter in englishFreq) {
        const observed = observedFreq[letter] || 0;
        const expected = englishFreq[letter];
        const diff = observed - expected;
        chi2 += (diff * diff) / expected;
      }
      return chi2;
    }
    
    function analyzeText() {
      const inputText = document.getElementById('inputText').value;
      
      if (inputText.trim().length === 0) {
        alert('Please paste a Caesar-encrypted message.');
        return;
      }
      
      analysisResults = [];
      
      for (let shift = 0; shift < 26; shift++) {
        const decrypted = decryptCaesar(inputText, shift);
        const frequencies = getLetterFrequencies(decrypted);
        const score = chiSquared(frequencies);
        
        analysisResults.push({
          shift: shift,
          decrypted: decrypted,
          score: score
        });
      }
      
      analysisResults.sort((a, b) => a.score - b.score);
      
      renderResults(inputText);
      document.getElementById('resultsSection').classList.add('active');
      selectedShift = null;
    }
    
    function renderResults(inputText) {
      const tbody = document.getElementById('resultsTable');
      tbody.innerHTML = '';
      
      document.getElementById('inputLength').textContent = inputText.length + ' characters';
      document.getElementById('likelyShift').textContent = analysisResults[0].shift;
      
      analysisResults.forEach((result, index) => {
        const row = document.createElement('tr');
        let className = '';
        
        if (index < 3) {
          className = 'likely';
        } else if (index < 9) {
          className = 'possible';
        } else {
          className = 'unlikely';
        }
        
        row.className = className;
        row.innerHTML = `
          <td class="shift-col">${result.shift}</td>
          <td class="plaintext-col">${escapeHtml(result.decrypted)}</td>
          <td class="score-col">${result.score.toFixed(2)}</td>
        `;
        
        row.onclick = () => selectShift(result, row);
        tbody.appendChild(row);
      });
    }
    
    function selectShift(result, row) {
      document.querySelectorAll('#resultsTable tr').forEach(r => r.classList.remove('selected'));
      row.classList.add('selected');
      
      selectedShift = result;
      document.getElementById('selectedPlaintext').textContent = result.decrypted;
      document.getElementById('copyBtn').style.display = 'inline-block';
    }
    
    function copyToClipboard() {
      if (selectedShift) {
        navigator.clipboard.writeText(selectedShift.decrypted).then(() => {
          const btn = document.getElementById('copyBtn');
          const originalText = btn.textContent;
          btn.textContent = 'Copied!';
          setTimeout(() => {
            btn.textContent = originalText;
          }, 2000);
        });
      }
    }
    
    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }
    
    // Auto-focus input on load
    document.getElementById('inputText').focus();
  </script>
</body>
</html>
