<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISBN Reverser</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Mono', monospace;
      background: linear-gradient(135deg, #0a1428 0%, #1a2332 100%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      max-width: 700px;
      width: 100%;
      background: #0f1f2f;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      border: 1px solid #1f4d7f;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      color: #4da8da;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #7dd3fc;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }

    .input-section {
      margin-bottom: 2rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #4da8da;
      font-weight: bold;
      font-size: 0.95rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid #1f4d7f;
      border-radius: 6px;
      background: #0a1428;
      color: #e0e0e0;
      font-family: 'Space Mono', monospace;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #4da8da;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    button {
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .btn-primary {
      background: #4da8da;
      color: #0a1428;
    }

    .btn-primary:hover {
      background: #7dd3fc;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: #1f4d7f;
      color: #7dd3fc;
    }

    .btn-secondary:hover {
      background: #2a5f9f;
      transform: translateY(-2px);
    }

    .results {
      background: #1a2f3f;
      border: 1px solid #1f4d7f;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      display: none;
    }

    .results.show {
      display: block;
    }

    .badge {
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-weight: bold;
      margin-bottom: 1rem;
      font-size: 1rem;
    }

    .badge.valid {
      background: #10b981;
      color: #fff;
    }

    .badge.invalid {
      background: #ef4444;
      color: #fff;
    }

    .result-item {
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #0f3a4a;
    }

    .result-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .result-label {
      color: #4da8da;
      font-weight: bold;
      font-size: 0.85rem;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .result-value {
      color: #e0e0e0;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .calculation {
      background: #0a1428;
      padding: 0.75rem;
      border-radius: 4px;
      font-size: 0.85rem;
      color: #7dd3fc;
      margin-top: 0.5rem;
      font-family: 'Space Mono', monospace;
      word-break: break-all;
    }

    .examples {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #1f4d7f;
    }

    .examples-title {
      color: #4da8da;
      font-weight: bold;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }

    .example-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 0.5rem;
    }

    .btn-example {
      padding: 0.5rem 0.75rem;
      background: #1f4d7f;
      color: #7dd3fc;
      border: 1px solid #2a5f9f;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Space Mono', monospace;
    }

    .btn-example:hover {
      background: #2a5f9f;
      border-color: #4da8da;
      color: #4da8da;
    }

    .error {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      .container {
        padding: 1.5rem;
      }

      .button-group {
        grid-template-columns: 1fr;
      }

      .example-buttons {
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 ISBN Reverser</h1>
    <p class="subtitle">Validate check digits & decode publisher info</p>

    <div class="input-section">
      <label for="isbnInput">Enter ISBN (10 or 13 digits)</label>
      <input type="text" id="isbnInput" placeholder="978-0-123-45678-9" />
      <div class="error" id="inputError"></div>
    </div>

    <div class="button-group">
      <button class="btn-primary" onclick="validateISBN()">Validate</button>
      <button class="btn-secondary" onclick="clearResults()">Clear</button>
    </div>

    <div class="results" id="results">
      <div id="validityBadge"></div>

      <div class="result-item">
        <div class="result-label">ISBN Format</div>
        <div class="result-value" id="formatInfo"></div>
      </div>

      <div class="result-item">
        <div class="result-label">Check Digit Verification</div>
        <div class="result-value" id="checkDigitInfo"></div>
        <div class="calculation" id="checkDigitCalc"></div>
      </div>

      <div class="result-item">
        <div class="result-label">Decoded Prefix & Group</div>
        <div class="result-value" id="prefixInfo"></div>
      </div>

      <div class="result-item">
        <div class="result-label">Publisher & Title Identifiers</div>
        <div class="result-value" id="publisherInfo"></div>
      </div>
    </div>

    <div class="examples">
      <div class="examples-title">Try These Examples</div>
      <div class="example-buttons">
        <button class="btn-example" onclick="tryExample('9780747532699')">Harry Potter (13)</button>
        <button class="btn-example" onclick="tryExample('0547928211')">The Hobbit (10)</button>
        <button class="btn-example" onclick="tryExample('9780201379624')">Design Patterns</button>
        <button class="btn-example" onclick="tryExample('0262033844')">Intro to Algo</button>
        <button class="btn-example" onclick="tryExample('9781491973875')">O'Reilly 1</button>
        <button class="btn-example" onclick="tryExample('123456789X')">Invalid (fake)</button>
      </div>
    </div>
  </div>

  <script>
    // ISBN-13 prefix to country/group mapping (real ISBN Agency registry)
    const isbnGroupMap = {
      '0': { name: 'English-speaking countries (US, UK, Australia, Canada, etc.)', region: 'North America/UK', prefix: '978-0' },
      '1': { name: 'English-speaking countries (alt)', region: 'English', prefix: '978-1' },
      '2': { name: 'French-speaking countries (France, Belgium, Luxembourg, Canada-FR, etc.)', region: 'Francophone', prefix: '978-2' },
      '3': { name: 'German-speaking countries (Germany, Austria, Switzerland, etc.)', region: 'Deutschsprachig', prefix: '978-3' },
      '4': { name: 'Japan', region: 'Asia-Pacific', prefix: '978-4' },
      '5': { name: 'Russia & Russian-speaking (USSR legacy)', region: 'Eurasia', prefix: '978-5' },
      '7': { name: 'China (People\'s Republic)', region: 'Asia-Pacific', prefix: '978-7' },
      '8': { name: 'India', region: 'Asia-Pacific', prefix: '978-8' },
      '9': { name: 'Multiple countries (shared)', region: 'Various', prefix: '978-9' },
      '979-10': { name: 'France (Gallimard, alternate)', region: 'Francophone', prefix: '979-10' },
      '979-11': { name: 'South Korea', region: 'Asia-Pacific', prefix: '979-11' },
      '979-12': { name: 'Italy', region: 'European', prefix: '979-12' }
    };

    function normalizeISBN(isbn) {
      // Remove spaces, hyphens, underscores
      return isbn.replace(/[\s\-_]/g, '');
    }

    function validateISBN10(digits) {
      if (digits.length !== 10) return null;

      let sum = 0;
      for (let i = 0; i < 9; i++) {
        const digit = parseInt(digits[i], 10);
        if (isNaN(digit)) return null;
        sum += digit * (10 - i);
      }

      const checkChar = digits[9];
      const checkValue = (11 - (sum % 11)) % 11;
      const expectedCheck = checkValue === 10 ? 'X' : String(checkValue);

      const isValid = checkChar.toUpperCase() === expectedCheck;
      return {
        isValid,
        checkDigit: expectedCheck,
        calculation: `Sum = ${sum}, mod 11 = ${sum % 11}, check = ${expectedCheck}`,
        submittedDigit: checkChar.toUpperCase(),
        displayDigits: digits.substring(0, 9)
      };
    }

    function validateISBN13(digits) {
      if (digits.length !== 13) return null;

      let sum = 0;
      for (let i = 0; i < 12; i++) {
        const digit = parseInt(digits[i], 10);
        if (isNaN(digit)) return null;
        const weight = i % 2 === 0 ? 1 : 3;
        sum += digit * weight;
      }

      const checkValue = (10 - (sum % 10)) % 10;
      const submittedCheck = parseInt(digits[12], 10);
      const isValid = submittedCheck === checkValue;

      return {
        isValid,
        checkDigit: checkValue,
        calculation: `Sum (alternating 1,3) = ${sum}, mod 10 = ${sum % 10}, check = ${checkValue}`,
        submittedDigit: submittedCheck,
        displayDigits: digits.substring(0, 12)
      };
    }

    function decodeISBN13(digits) {
      // digits is the full 13-digit string
      const prefix = digits.substring(0, 3); // 978 or 979

      if (prefix === '978') {
        const groupDigit = digits[3];
        const groupInfo = isbnGroupMap[groupDigit];
        if (groupInfo) {
          return {
            prefix,
            groupDigit,
            groupName: groupInfo.name,
            groupRegion: groupInfo.region,
            publisherStart: 4,
            description: `Prefix 978-${groupDigit}: ${groupInfo.name}`
          };
        } else {
          return {
            prefix,
            groupDigit,
            groupName: 'Unknown or extended group',
            groupRegion: 'Unknown',
            publisherStart: 4,
            description: `Prefix 978-${groupDigit}: Not in common registry (may be newer or rare group)`
          };
        }
      } else if (prefix === '979') {
        // 979-10, 979-11, 979-12, etc.
        const nextTwoDigits = digits.substring(3, 5);
        const groupKey = '979-' + nextTwoDigits;
        const groupInfo = isbnGroupMap[groupKey];
        if (groupInfo) {
          return {
            prefix,
            groupDigit: nextTwoDigits,
            groupName: groupInfo.name,
            groupRegion: groupInfo.region,
            publisherStart: 5,
            description: `Prefix ${groupKey}: ${groupInfo.name}`
          };
        } else {
          return {
            prefix,
            groupDigit: nextTwoDigits,
            groupName: 'Unknown 979 group',
            groupRegion: 'Unknown',
            publisherStart: 5,
            description: `Prefix 979-${nextTwoDigits}: Not in common registry`
          };
        }
      }

      return null;
    }

    function validateISBN() {
      const inputError = document.getElementById('inputError');
      const resultsDiv = document.getElementById('results');
      inputError.textContent = '';
      resultsDiv.classList.remove('show');

      const isbnInput = document.getElementById('isbnInput').value.trim();
      if (!isbnInput) {
        inputError.textContent = 'Please enter an ISBN.';
        return;
      }

      const normalized = normalizeISBN(isbnInput);

      let result, format;

      if (normalized.length === 10) {
        result = validateISBN10(normalized);
        format = 'ISBN-10';
      } else if (normalized.length === 13) {
        result = validateISBN13(normalized);
        format = 'ISBN-13';
      } else {
        inputError.textContent = `Invalid length: ${normalized.length} digits. ISBN must be 10 or 13 digits.`;
        return;
      }

      if (!result) {
        inputError.textContent = 'Invalid ISBN format. Contains non-digit characters.';
        return;
      }

      // Build results UI
      const badge = document.getElementById('validityBadge');
      const validityClass = result.isValid ? 'valid' : 'invalid';
      const validityText = result.isValid ? '✓ Valid ISBN' : '✗ Invalid ISBN';
      badge.innerHTML = `<div class="badge ${validityClass}">${validityText}</div>`;

      document.getElementById('formatInfo').innerHTML = `
        <strong>${format}</strong> — ${normalized.length} digits<br/>
        Submitted: <code>${normalized}</code>
      `;

      document.getElementById('checkDigitInfo').innerHTML = `
        Submitted check digit: <code>${result.submittedDigit}</code><br/>
        Expected check digit: <code>${result.checkDigit}</code><br/>
        ${result.isValid ? '<span style="color: #10b981;">✓ Match</span>' : '<span style="color: #ef4444;">✗ Mismatch</span>'}
      `;

      document.getElementById('checkDigitCalc').innerHTML = result.calculation;

      // Decode ISBN-13 if applicable
      if (format === 'ISBN-13') {
        const decode = decodeISBN13(normalized);
        if (decode) {
          document.getElementById('prefixInfo').innerHTML = `
            <strong>${decode.description}</strong><br/>
            Region: ${decode.groupRegion}
          `;

          const publisherPortion = normalized.substring(decode.publisherStart, normalized.length - 1);
          document.getElementById('publisherInfo').innerHTML = `
            Publisher code: <code>${publisherPortion.substring(0, 3) || '(varies)'}</code><br/>
            Title code: <code>${publisherPortion.substring(3) || '(varies)'}</code><br/>
            <small style="color: #7dd3fc;">The exact publisher &amp; title mapping depends on national ISBN registry allocation.</small>
          `;
        }
      } else {
        // ISBN-10: show similar structure
        const publisherPortion = normalized.substring(1, 6);
        const titlePortion = normalized.substring(6, 9);
        document.getElementById('prefixInfo').innerHTML = `
          <strong>ISBN-10 Group Code</strong> (first digit)<br/>
          ${normalized[0]} — typically indicates language/country<br/>
          <small style="color: #7dd3fc;">0 or 1 = English-speaking, 2 = French, 3 = German, 4 = Japan, etc.</small>
        `;

        document.getElementById('publisherInfo').innerHTML = `
          Publisher code: <code>${publisherPortion}</code><br/>
          Title code: <code>${titlePortion}</code><br/>
          <small style="color: #7dd3fc;">Publisher &amp; title codes vary in length and are allocated by national ISBN agencies.</small>
        `;
      }

      resultsDiv.classList.add('show');
    }

    function clearResults() {
      document.getElementById('isbnInput').value = '';
      document.getElementById('results').classList.remove('show');
      document.getElementById('inputError').textContent = '';
    }

    function tryExample(isbn) {
      document.getElementById('isbnInput').value = isbn;
      setTimeout(validateISBN, 50);
    }

    // Allow Enter key
    document.getElementById('isbnInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') validateISBN();
    });
  </script>
</body>
</html>
