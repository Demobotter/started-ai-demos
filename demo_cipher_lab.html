<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipher Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Lato:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #ddd;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: #0a0e27;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 28px;
            margin-bottom: 8px;
            color: #ffd700;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 13px;
        }
        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 30px;
        }
        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; gap: 30px; }
            .container { padding: 25px; }
        }
        .section-title {
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #ffd700;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .cipher-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 16px;
            border: 2px solid #2a5a9e;
            background: transparent;
            color: #2a5a9e;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Lato', sans-serif;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        button:hover {
            background: rgba(42, 90, 158, 0.1);
        }
        button.active {
            background: #2a5a9e;
            color: #fff;
            border-color: #2a5a9e;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        textarea, input {
            width: 100%;
            padding: 10px;
            background: #1a1f3a;
            border: 1px solid #2a3a4a;
            border-radius: 6px;
            color: #2a5a9e;
            font-family: 'Lato', sans-serif;
            font-size: 13px;
            resize: vertical;
        }
        textarea:focus, input:focus {
            outline: none;
            border-color: #2a5a9e;
            background: #0f1420;
        }
        .slider-group {
            margin-bottom: 15px;
        }
        input[type="range"] {
            width: 100%;
            padding: 0;
            cursor: pointer;
        }
        .slider-value {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        .stats-panel {
            background: #141829;
            border: 1px solid #2a3a4a;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 12px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            color: #999;
        }
        .stat-value {
            color: #ffd700;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
        }
        .preset-keys {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }
        .preset-key {
            padding: 8px 12px;
            background: transparent;
            border: 1px solid #2a3a4a;
            color: #666;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .preset-key:hover {
            border-color: #2a5a9e;
            color: #2a5a9e;
        }
        .output-box {
            background: #1a1f3a;
            border: 1px solid #2a3a4a;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #d64545;
            min-height: 60px;
            max-height: 120px;
            overflow-y: auto;
        }
        .copy-btn {
            width: 100%;
            padding: 8px;
            font-size: 12px;
        }
        .toggle-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .toggle-group button {
            flex: 1;
        }
        canvas {
            border: 1px solid #2a3a4a;
            border-radius: 6px;
            width: 100%;
            height: 200px;
            background: #141829;
            margin-bottom: 15px;
        }
        .mapping-table {
            width: 100%;
            font-size: 11px;
            border-collapse: collapse;
            max-height: 150px;
            overflow-y: auto;
            display: block;
        }
        .mapping-table thead {
            position: sticky;
            top: 0;
            background: #141829;
        }
        .mapping-table th, .mapping-table td {
            padding: 6px;
            text-align: center;
            border: 1px solid #2a3a4a;
        }
        .mapping-table th {
            color: #ffd700;
            font-weight: 600;
        }
        .mapping-table td {
            color: #999;
            font-family: 'Courier New', monospace;
        }
        .mapping-table .plain { color: #2a5a9e; }
        .mapping-table .cipher { color: #d64545; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Cipher Lab</h1>
        <div class="subtitle">Real encryption transformations with live frequency analysis</div>
        
        <div class="layout">
            <!-- LEFT COLUMN -->
            <div>
                <div class="section-title">Cipher Type</div>
                <div class="cipher-buttons">
                    <button data-cipher="caesar" class="active">Caesar</button>
                    <button data-cipher="atbash">Atbash</button>
                    <button data-cipher="substitution">Substitution</button>
                    <button data-cipher="vigenere">Vigenère</button>
                </div>

                <div class="section-title">Plaintext Input</div>
                <div class="input-group">
                    <textarea id="plaintextInput" rows="4" placeholder="Enter text or pick a sample...">Hello World</textarea>
                </div>

                <div class="input-group">
                    <button style="width: 100%; margin-bottom: 8px;" onclick="setSample('The quick brown fox')">Sample: Fox</button>
                    <button style="width: 100%; margin-bottom: 8px;" onclick="setSample('Cryptography is the art of secret communication')">Sample: Crypto</button>
                    <button style="width: 100%;" onclick="setSample('SECRETMESSAGE')">Sample: Secret</button>
                </div>

                <div id="cipherControls"></div>

                <div class="section-title">Statistics</div>
                <div class="stats-panel">
                    <div class="stat-row">
                        <span>Cipher Type:</span>
                        <span class="stat-value" id="statCipher">Caesar</span>
                    </div>
                    <div class="stat-row">
                        <span>Key/Shift:</span>
                        <span class="stat-value" id="statKey">3</span>
                    </div>
                    <div class="stat-row">
                        <span>Plaintext Length:</span>
                        <span class="stat-value" id="statLength">11</span>
                    </div>
                    <div class="stat-row">
                        <span>Shannon Entropy:</span>
                        <span class="stat-value" id="statEntropy">3.2 bits</span>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN -->
            <div>
                <div class="section-title">Transformation Canvas</div>
                <canvas id="transformCanvas"></canvas>

                <div class="section-title">Frequency Analysis</div>
                <canvas id="histogramCanvas" style="height: 150px;"></canvas>

                <div class="toggle-group">
                    <button id="encryptBtn" class="active" onclick="setMode('encrypt')">Encrypt</button>
                    <button id="decryptBtn" onclick="setMode('decrypt')">Decrypt</button>
                </div>

                <div class="section-title">Ciphertext Output</div>
                <div class="output-box" id="ciphertextOutput">Khoor Zruog</div>
                <button class="copy-btn" onclick="copyCiphertext()">Copy Ciphertext</button>

                <div class="section-title" style="margin-top: 20px;">Character Mapping</div>
                <table class="mapping-table" id="mappingTable">
                    <thead>
                        <tr><th>Plain</th><th>Cipher</th></tr>
                    </thead>
                    <tbody id="mappingTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentCipher = 'caesar';
        let currentMode = 'encrypt';
        let plaintext = 'Hello World';
        let ciphertext = '';
        let caesarShift = 3;
        let vigenereKey = 'SECRET';
        let substitutionMap = {};

        // Initialize substitution map (random for each run)
        function initSubstitution() {
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
            const shuffled = [...alphabet].sort(() => Math.random() - 0.5);
            substitutionMap = {};
            alphabet.forEach((char, i) => {
                substitutionMap[char] = shuffled[i];
            });
        }
        initSubstitution();

        // Cipher implementations
        const Ciphers = {
            caesar: (text, key, encrypt) => {
                const shift = encrypt ? key : -key;
                return text.toUpperCase().split('').map(c => {
                    if (!/[A-Z]/.test(c)) return c;
                    const code = (c.charCodeAt(0) - 65 + shift + 26000) % 26;
                    return String.fromCharCode(code + 65);
                }).join('');
            },
            atbash: (text) => {
                return text.toUpperCase().split('').map(c => {
                    if (!/[A-Z]/.test(c)) return c;
                    return String.fromCharCode(90 - (c.charCodeAt(0) - 65));
                }).join('');
            },
            substitution: (text) => {
                return text.toUpperCase().split('').map(c => {
                    if (!/[A-Z]/.test(c)) return c;
                    return substitutionMap[c] || c;
                }).join('');
            },
            vigenere: (text, key, encrypt) => {
                key = key.toUpperCase();
                let keyIndex = 0;
                return text.toUpperCase().split('').map(c => {
                    if (!/[A-Z]/.test(c)) return c;
                    const keyChar = key[keyIndex % key.length];
                    const keyShift = keyChar.charCodeAt(0) - 65;
                    const shift = encrypt ? keyShift : -keyShift;
                    const code = (c.charCodeAt(0) - 65 + shift + 26000) % 26;
                    keyIndex++;
                    return String.fromCharCode(code + 65);
                }).join('');
            }
        };

        function encrypt(text, cipher, key) {
            if (cipher === 'atbash') return Ciphers.atbash(text);
            if (cipher === 'substitution') return Ciphers.substitution(text);
            return Ciphers[cipher](text, key, true);
        }

        function decrypt(text, cipher, key) {
            if (cipher === 'atbash') return Ciphers.atbash(text); // Atbash is symmetric
            if (cipher === 'substitution') {
                // Reverse substitution
                const rev = {};
                Object.entries(substitutionMap).forEach(([k, v]) => rev[v] = k);
                return text.toUpperCase().split('').map(c => rev[c] || c).join('');
            }
            return Ciphers[cipher](text, key, false);
        }

        function computeEntropy(text) {
            const freq = {};
            text.replace(/[^A-Z]/g, '').split('').forEach(c => {
                freq[c] = (freq[c] || 0) + 1;
            });
            const len = Object.values(freq).reduce((a, b) => a + b, 0);
            let entropy = 0;
            Object.values(freq).forEach(count => {
                const p = count / len;
                if (p > 0) entropy -= p * Math.log2(p);
            });
            return entropy.toFixed(2);
        }

        function updateUI() {
            const plain = plaintext.toUpperCase();
            const mode = document.getElementById('encryptBtn').classList.contains('active') ? 'encrypt' : 'decrypt';
            
            if (mode === 'encrypt') {
                ciphertext = encrypt(plain, currentCipher, currentCipher === 'vigenere' ? vigenereKey : caesarShift);
            } else {
                const source = document.getElementById('ciphertextOutput').textContent;
                ciphertext = decrypt(source, currentCipher, currentCipher === 'vigenere' ? vigenereKey : caesarShift);
                document.getElementById('ciphertextOutput').textContent = ciphertext;
                return;
            }

            document.getElementById('ciphertextOutput').textContent = ciphertext;
            document.getElementById('statLength').textContent = plain.replace(/[^A-Z]/g, '').length;
            document.getElementById('statEntropy').textContent = computeEntropy(ciphertext) + ' bits';

            drawTransformation();
            drawHistogram();
            updateMappingTable();
        }

        function drawTransformation() {
            const canvas = document.getElementById('transformCanvas');
            const ctx = canvas.getContext('2d');
            const plain = plaintext.toUpperCase();
            
            ctx.fillStyle = '#141829';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const maxChars = 20;
            const chars = plain.substring(0, maxChars).split('');
            const charWidth = canvas.width / maxChars;
            const mid = canvas.height / 2;

            chars.forEach((c, i) => {
                const x = i * charWidth + charWidth / 2;
                
                // Plain char (top, blue)
                ctx.fillStyle = '#2a5a9e';
                ctx.font = '14px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(c, x, mid - 20);

                // Arrow
                ctx.strokeStyle = '#666';
                ctx.beginPath();
                ctx.moveTo(x, mid - 10);
                ctx.lineTo(x, mid + 10);
                ctx.stroke();

                // Cipher char (bottom, red)
                const cipher = currentCipher === 'substitution' ? (substitutionMap[c] || c) :
                               currentCipher === 'atbash' ? String.fromCharCode(90 - (c.charCodeAt(0) - 65)) :
                               currentCipher === 'caesar' ? String.fromCharCode((c.charCodeAt(0) - 65 + caesarShift + 260) % 26 + 65) :
                               encrypt(c, currentCipher, vigenereKey);
                
                ctx.fillStyle = '#d64545';
                ctx.fillText(cipher, x, mid + 30);
            });
        }

        function drawHistogram() {
            const canvas = document.getElementById('histogramCanvas');
            const ctx = canvas.getContext('2d');
            const plain = plaintext.toUpperCase().replace(/[^A-Z]/g, '');
            const cipher = ciphertext.replace(/[^A-Z]/g, '');

            ctx.fillStyle = '#141829';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const freq = {};
            const cfreq = {};
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
            
            plain.split('').forEach(c => freq[c] = (freq[c] || 0) + 1);
            cipher.split('').forEach(c => cfreq[c] = (cfreq[c] || 0) + 1);

            const plainMax = Math.max(...Object.values(freq), 1);
            const cipherMax = Math.max(...Object.values(cfreq), 1);
            const barWidth = canvas.width / 26;

            alphabet.forEach((letter, i) => {
                const x = i * barWidth;
                const plainH = (freq[letter] || 0) / plainMax * (canvas.height * 0.4);
                const cipherH = (cfreq[letter] || 0) / cipherMax * (canvas.height * 0.4);

                ctx.fillStyle = '#2a5a9e';
                ctx.fillRect(x + 2, canvas.height - plainH - 40, barWidth * 0.45 - 3, plainH);

                ctx.fillStyle = '#d64545';
                ctx.fillRect(x + barWidth * 0.45 + 1, canvas.height - cipherH - 40, barWidth * 0.45 - 3, cipherH);
            });

            // Legend
            ctx.fillStyle = '#2a5a9e';
            ctx.fillRect(10, canvas.height - 25, 10, 10);
            ctx.fillStyle = '#666';
            ctx.font = '11px Lato';
            ctx.textAlign = 'left';
            ctx.fillText('Plaintext', 25, canvas.height - 18);

            ctx.fillStyle = '#d64545';
            ctx.fillRect(130, canvas.height - 25, 10, 10);
            ctx.fillStyle = '#666';
            ctx.fillText('Ciphertext', 145, canvas.height - 18);
        }

        function updateMappingTable() {
            const tbody = document.getElementById('mappingTableBody');
            tbody.innerHTML = '';
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
            
            alphabet.slice(0, 13).forEach((letter, i) => {
                let cipher = letter;
                if (currentCipher === 'caesar') {
                    cipher = String.fromCharCode((letter.charCodeAt(0) - 65 + caesarShift) % 26 + 65);
                } else if (currentCipher === 'atbash') {
                    cipher = String.fromCharCode(90 - (letter.charCodeAt(0) - 65));
                } else if (currentCipher === 'substitution') {
                    cipher = substitutionMap[letter];
                } else if (currentCipher === 'vigenere') {
                    cipher = String.fromCharCode((letter.charCodeAt(0) - 65 + 6) % 26 + 65); // Show S shift as example
                }
                
                const row = tbody.insertRow();
                row.innerHTML = `<td class="plain">${letter}</td><td class="cipher">${cipher}</td>`;
            });
        }

        function renderControls() {
            const div = document.getElementById('cipherControls');
            div.innerHTML = '';

            if (currentCipher === 'caesar') {
                div.innerHTML = `
                    <div class="section-title">Shift Value</div>
                    <div class="slider-group">
                        <input type="range" min="0" max="25" value="${caesarShift}" onchange="caesarShift = +this.value; document.getElementById('statKey').textContent = this.value; updateUI()">
                        <div class="slider-value"><span>0</span><span id="shiftVal">${caesarShift}</span><span>25</span></div>
                    </div>
                `;
            } else if (currentCipher === 'vigenere') {
                div.innerHTML = `
                    <div class="section-title">Secret Key</div>
                    <div class="input-group">
                        <input type="text" id="vigenereKey" value="${vigenereKey}" onchange="vigenereKey = this.value.toUpperCase(); document.getElementById('statKey').textContent = this.value; updateUI()" placeholder="Enter key">
                    </div>
                    <div class="preset-keys">
                        <button class="preset-key" onclick="setVigenereKey('SECRET')">SECRET</button>
                        <button class="preset-key" onclick="setVigenereKey('PASSWORD')">PASSWORD</button>
                        <button class="preset-key" onclick="setVigenereKey('CRYPTO')">CRYPTO</button>
                        <button class="preset-key" onclick="setVigenereKey('KEY')">KEY</button>
                    </div>
                `;
            } else if (currentCipher === 'substitution') {
                div.innerHTML = `
                    <div class="section-title">Substitution Key</div>
                    <button style="width: 100%" onclick="initSubstitution(); document.getElementById('statKey').textContent = 'Random'; updateUI()">Generate New Key</button>
                `;
                document.getElementById('statKey').textContent = 'Random';
            } else if (currentCipher === 'atbash') {
                div.innerHTML = `<div style="padding: 15px; background: #141829; border-radius: 6px; color: #888; font-size: 12px;">Atbash is symmetric: A↔Z, B↔Y, C↔X, etc. No key needed.</div>`;
                document.getElementById('statKey').textContent = 'N/A';
            }

            document.getElementById('statCipher').textContent = currentCipher.charAt(0).toUpperCase() + currentCipher.slice(1);
        }

        function setSample(text) {
            document.getElementById('plaintextInput').value = text;
            plaintext = text;
            updateUI();
        }

        function setVigenereKey(key) {
            vigenereKey = key;
            document.getElementById('vigenereKey').value = key;
            document.getElementById('statKey').textContent = key;
            updateUI();
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('encryptBtn').classList.toggle('active');
            document.getElementById('decryptBtn').classList.toggle('active');
            updateUI();
        }

        function copyCiphertext() {
            const text = document.getElementById('ciphertextOutput').textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied to clipboard!');
            });
        }

        // Event listeners
        document.getElementById('plaintextInput').addEventListener('change', () => {
            plaintext = document.getElementById('plaintextInput').value;
            updateUI();
        });

        document.querySelectorAll('[data-cipher]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-cipher]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCipher = btn.dataset.cipher;
                renderControls();
                updateUI();
            });
        });

        // Initial render
        renderControls();
        updateUI();
    </script>
</body>
</html>
