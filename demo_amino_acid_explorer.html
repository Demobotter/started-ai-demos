<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amino Acid Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a2a3a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(20, 28, 40, 0.9);
            border-radius: 12px;
            border: 1px solid rgba(127, 179, 255, 0.2);
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        
        h1 {
            font-family: 'Merriweather', serif;
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #7fb3ff;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #a0b0c0;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 8px;
            margin-bottom: 30px;
        }
        
        .amino-btn {
            padding: 12px 16px;
            background: rgba(127, 179, 255, 0.1);
            border: 1px solid rgba(127, 179, 255, 0.4);
            border-radius: 8px;
            color: #7fb3ff;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        
        .amino-btn:hover {
            background: rgba(127, 179, 255, 0.2);
            border-color: rgba(127, 179, 255, 0.8);
        }
        
        .amino-btn.active {
            background: #7fb3ff;
            color: #0f1419;
            border-color: #7fb3ff;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        
        .card {
            background: rgba(26, 42, 58, 0.8);
            border: 1px solid rgba(127, 179, 255, 0.15);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        
        .card h2 {
            font-family: 'Merriweather', serif;
            font-size: 1.1rem;
            color: #7fb3ff;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .formula-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(127, 179, 255, 0.1);
            font-size: 0.9rem;
        }
        
        .formula-row:last-child {
            border-bottom: none;
        }
        
        .formula-label {
            color: #a0b0c0;
        }
        
        .formula-value {
            color: #00ff88;
            font-weight: 600;
            font-family: 'Courier New', monospace;
        }
        
        .structure-svg {
            width: 100%;
            height: 200px;
            margin: 15px 0;
            background: rgba(10, 20, 30, 0.5);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .properties-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }
        
        .property-badge {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 0.8rem;
            text-align: center;
        }
        
        .property-badge.hydrophobic {
            border-color: rgba(255, 107, 157, 0.5);
            background: rgba(255, 107, 157, 0.1);
        }
        
        .property-badge.hydrophilic {
            border-color: rgba(0, 255, 136, 0.5);
            background: rgba(0, 255, 136, 0.1);
        }
        
        .property-badge.polar {
            border-color: rgba(212, 165, 116, 0.5);
            background: rgba(212, 165, 116, 0.1);
        }
        
        .property-badge.special {
            border-color: rgba(212, 165, 116, 0.7);
            background: rgba(212, 165, 116, 0.15);
        }
        
        .property-label {
            font-size: 0.7rem;
            color: #80a0c0;
            display: block;
            margin-bottom: 2px;
        }
        
        .property-value {
            font-weight: 600;
            color: #e0e0e0;
        }
        
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        
        .stat-item {
            background: rgba(10, 20, 30, 0.5);
            border-radius: 6px;
            padding: 10px;
            text-align: center;
        }
        
        .stat-label {
            font-size: 0.7rem;
            color: #a0b0c0;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        
        .stat-value {
            font-size: 1.1rem;
            color: #7fb3ff;
            font-weight: 600;
        }
        
        .error-state {
            color: #ff6b6b;
            text-align: center;
            padding: 20px;
        }
        
        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.6rem;
            }
            
            .container {
                padding: 20px;
            }
            
            .stats-panel {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧬 Amino Acid Explorer</h1>
        <p class="subtitle">Click an amino acid to explore its molecular structure and properties</p>
        
        <div class="button-grid" id="aminoButtonsContainer"></div>
        
        <div class="content-grid">
            <div class="card">
                <h2>Molecular Formula</h2>
                <div id="formulaDisplay"></div>
                <div class="stats-panel">
                    <div class="stat-item">
                        <div class="stat-label">Molecular Weight</div>
                        <div class="stat-value" id="mwDisplay">—</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">pI (pH)</div>
                        <div class="stat-value" id="piDisplay">—</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">pKa</div>
                        <div class="stat-value" id="pkaDisplay">—</div>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <h2>Chemical Properties</h2>
                <div id="propertiesDisplay"></div>
            </div>
        </div>
        
        <div class="card" style="margin-top: 20px;">
            <h2>2D Structure</h2>
            <svg class="structure-svg" id="structureSvg"></svg>
        </div>
    </div>

    <script>
        // Comprehensive amino acid database with real biochemistry data
        const aminoAcids = {
            'Ala': {
                name: 'Alanine',
                abbr: 'Ala',
                formula: { C: 3, H: 7, N: 1, O: 2, S: 0 },
                mw: 89.09,
                pKa: 2.34,
                pI: 6.00,
                classification: 'Nonpolar (Hydrophobic)',
                sideChain: 'methyl group',
                codons: 'GCU, GCC, GCA, GCG',
                abundance: 'Very common'
            },
            'Gly': {
                name: 'Glycine',
                abbr: 'Gly',
                formula: { C: 2, H: 5, N: 1, O: 2, S: 0 },
                mw: 75.07,
                pKa: 2.34,
                pI: 5.97,
                classification: 'Nonpolar (Hydrophobic)',
                sideChain: 'hydrogen atom (simplest)',
                codons: 'GGU, GGC, GGA, GGG',
                abundance: 'Very common, most flexible'
            },
            'Val': {
                name: 'Valine',
                abbr: 'Val',
                formula: { C: 5, H: 11, N: 1, O: 2, S: 0 },
                mw: 117.15,
                pKa: 2.32,
                pI: 5.96,
                classification: 'Nonpolar (Hydrophobic)',
                sideChain: 'branched alkyl chain',
                codons: 'GUU, GUC, GUA, GUG',
                abundance: 'Essential amino acid'
            },
            'Leu': {
                name: 'Leucine',
                abbr: 'Leu',
                formula: { C: 6, H: 13, N: 1, O: 2, S: 0 },
                mw: 131.17,
                pKa: 2.36,
                pI: 5.98,
                classification: 'Nonpolar (Hydrophobic)',
                sideChain: 'branched alkyl chain',
                codons: 'UUA, UUG, CUU, CUC, CUA, CUG',
                abundance: 'Most abundant, essential'
            },
            'Ile': {
                name: 'Isoleucine',
                abbr: 'Ile',
                formula: { C: 6, H: 13, N: 1, O: 2, S: 0 },
                mw: 131.17,
                pKa: 2.36,
                pI: 6.02,
                classification: 'Nonpolar (Hydrophobic)',
                sideChain: 'branched alkyl chain',
                codons: 'AUU, AUC, AUA',
                abundance: 'Essential amino acid'
            },
            'Phe': {
                name: 'Phenylalanine',
                abbr: 'Phe',
                formula: { C: 9, H: 11, N: 1, O: 2, S: 0 },
                mw: 165.19,
                pKa: 2.58,
                pI: 5.48,
                classification: 'Nonpolar (Hydrophobic)',
                sideChain: 'aromatic benzene ring',
                codons: 'UUU, UUC',
                abundance: 'Essential amino acid'
            },
            'Trp': {
                name: 'Tryptophan',
                abbr: 'Trp',
                formula: { C: 11, H: 12, N: 2, O: 2, S: 0 },
                mw: 204.23,
                pKa: 2.83,
                pI: 5.89,
                classification: 'Nonpolar (Hydrophobic)',
                sideChain: 'indole ring system',
                codons: 'UGG',
                abundance: 'Essential, rarest amino acid'
            },
            'Pro': {
                name: 'Proline',
                abbr: 'Pro',
                formula: { C: 5, H: 9, N: 1, O: 2, S: 0 },
                mw: 115.13,
                pKa: 1.99,
                pI: 6.30,
                classification: 'Special (Imino acid)',
                sideChain: 'cyclic pyrrolidine ring',
                codons: 'CCU, CCC, CCA, CCG',
                abundance: 'Rigid, chain breaker'
            },
            'Ser': {
                name: 'Serine',
                abbr: 'Ser',
                formula: { C: 3, H: 7, N: 1, O: 3, S: 0 },
                mw: 105.09,
                pKa: 2.21,
                pI: 5.68,
                classification: 'Polar (Uncharged)',
                sideChain: 'hydroxyl group (−OH)',
                codons: 'UCU, UCC, UCA, UCG',
                abundance: 'Common, phosphorylation site'
            },
            'Thr': {
                name: 'Threonine',
                abbr: 'Thr',
                formula: { C: 4, H: 9, N: 1, O: 3, S: 0 },
                mw: 119.12,
                pKa: 2.09,
                pI: 5.60,
                classification: 'Polar (Uncharged)',
                sideChain: 'hydroxyl group (−OH)',
                codons: 'ACU, ACC, ACA, ACG',
                abundance: 'Essential, phosphorylation'
            },
            'Cys': {
                name: 'Cysteine',
                abbr: 'Cys',
                formula: { C: 3, H: 7, N: 1, O: 2, S: 1 },
                mw: 121.15,
                pKa: 1.96,
                pI: 5.07,
                classification: 'Special (Thiol)',
                sideChain: 'thiol group (−SH)',
                codons: 'UGU, UGC',
                abundance: 'Disulfide bond former'
            },
            'Met': {
                name: 'Methionine',
                abbr: 'Met',
                formula: { C: 5, H: 11, N: 1, O: 2, S: 1 },
                mw: 149.21,
                pKa: 2.28,
                pI: 5.74,
                classification: 'Nonpolar (Hydrophobic)',
                sideChain: 'thioether (−S−CH₃)',
                codons: 'AUG',
                abundance: 'Start codon, essential'
            },
            'Asn': {
                name: 'Asparagine',
                abbr: 'Asn',
                formula: { C: 4, H: 8, N: 2, O: 3, S: 0 },
                mw: 132.12,
                pKa: 2.02,
                pI: 5.41,
                classification: 'Polar (Uncharged)',
                sideChain: 'primary amide (−CONH₂)',
                codons: 'AAU, AAC',
                abundance: 'N-glycosylation site'
            },
            'Gln': {
                name: 'Glutamine',
                abbr: 'Gln',
                formula: { C: 5, H: 10, N: 2, O: 3, S: 0 },
                mw: 146.14,
                pKa: 2.17,
                pI: 5.65,
                classification: 'Polar (Uncharged)',
                sideChain: 'primary amide (−CONH₂)',
                codons: 'CAA, CAG',
                abundance: 'Common, H-bonding'
            },
            'Asp': {
                name: 'Aspartic Acid',
                abbr: 'Asp',
                formula: { C: 4, H: 7, N: 1, O: 4, S: 0 },
                mw: 133.10,
                pKa: 1.88,
                pI: 2.77,
                classification: 'Acidic (Negatively charged)',
                sideChain: 'carboxyl group (−COOH)',
                codons: 'GAU, GAC',
                abundance: 'Charged, common'
            },
            'Glu': {
                name: 'Glutamic Acid',
                abbr: 'Glu',
                formula: { C: 5, H: 9, N: 1, O: 4, S: 0 },
                mw: 147.13,
                pKa: 2.19,
                pI: 3.22,
                classification: 'Acidic (Negatively charged)',
                sideChain: 'carboxyl group (−COOH)',
                codons: 'GAA, GAG',
                abundance: 'Charged, important'
            },
            'Lys': {
                name: 'Lysine',
                abbr: 'Lys',
                formula: { C: 6, H: 14, N: 2, O: 2, S: 0 },
                mw: 146.19,
                pKa: 2.18,
                pI: 9.74,
                classification: 'Basic (Positively charged)',
                sideChain: 'amino group (−NH₃⁺)',
                codons: 'AAA, AAG',
                abundance: 'Essential, charged'
            },
            'Arg': {
                name: 'Arginine',
                abbr: 'Arg',
                formula: { C: 6, H: 14, N: 4, O: 2, S: 0 },
                mw: 174.20,
                pKa: 2.17,
                pI: 10.76,
                classification: 'Basic (Positively charged)',
                sideChain: 'guanidinium group',
                codons: 'CGU, CGC, CGA, CGG, AGA, AGG',
                abundance: 'Essential, highly charged'
            },
            'His': {
                name: 'Histidine',
                abbr: 'His',
                formula: { C: 6, H: 9, N: 3, O: 2, S: 0 },
                mw: 155.15,
                pKa: 1.77,
                pI: 7.59,
                classification: 'Basic (Positively charged)',
                sideChain: 'imidazole ring',
                codons: 'CAU, CAC',
                abundance: 'Essential, buffer'
            }
        };

        let currentAminoAcid = 'Ala';

        // Atomic masses (in u)
        const atomicMasses = {
            H: 1.008,
            C: 12.011,
            N: 14.007,
            O: 15.999,
            S: 32.065
        };

        function initializeButtons() {
            const container = document.getElementById('aminoButtonsContainer');
            Object.keys(aminoAcids).forEach(abbr => {
                const btn = document.createElement('button');
                btn.className = 'amino-btn' + (abbr === 'Ala' ? ' active' : '');
                btn.textContent = abbr;
                btn.onclick = () => selectAminoAcid(abbr);
                container.appendChild(btn);
            });
        }

        function selectAminoAcid(abbr) {
            currentAminoAcid = abbr;
            document.querySelectorAll('.amino-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            updateDisplay();
        }

        function calculateMolecularWeight(formula) {
            let mw = 0;
            for (const [element, count] of Object.entries(formula)) {
                mw += atomicMasses[element] * count;
            }
            // Add backbone atoms (always present in amino acids)
            // Backbone: C, O, H, N already counted in side chain formula
            return parseFloat(mw.toFixed(2));
        }

        function updateDisplay() {
            const amino = aminoAcids[currentAminoAcid];
            
            // Update formula display
            let formulaHtml = `
                <div class="formula-row">
                    <span class="formula-label">Common Name:</span>
                    <span class="formula-value">${amino.name}</span>
                </div>
                <div class="formula-row">
                    <span class="formula-label">Formula:</span>
                    <span class="formula-value">C${amino.formula.C}H${amino.formula.H}N${amino.formula.N}O${amino.formula.O}${amino.formula.S > 0 ? 'S' + amino.formula.S : ''}</span>
                </div>
            `;
            document.getElementById('formulaDisplay').innerHTML = formulaHtml;
            
            // Molecular weight
            document.getElementById('mwDisplay').textContent = amino.mw.toFixed(1) + ' u';
            
            // pI and pKa
            document.getElementById('piDisplay').textContent = amino.pI.toFixed(2);
            document.getElementById('pkaDisplay').textContent = amino.pKa.toFixed(2);
            
            // Properties display
            let propertiesHtml = `
                <div class="property-badge ${getPropertyClass(amino.classification)}">
                    <span class="property-label">Classification</span>
                    <span class="property-value">${amino.classification}</span>
                </div>
                <div class="property-badge">
                    <span class="property-label">Side Chain</span>
                    <span class="property-value">${amino.sideChain}</span>
                </div>
                <div class="property-badge">
                    <span class="property-label">Codons</span>
                    <span class="property-value">${amino.codons}</span>
                </div>
                <div class="property-badge">
                    <span class="property-label">Abundance</span>
                    <span class="property-value">${amino.abundance}</span>
                </div>
            `;
            document.getElementById('propertiesDisplay').innerHTML = propertiesHtml;
            
            // Draw structure
            drawStructure(amino);
        }

        function getPropertyClass(classification) {
            if (classification.includes('Hydrophobic')) return 'hydrophobic';
            if (classification.includes('Hydrophilic') || classification.includes('Charged')) return 'hydrophilic';
            if (classification.includes('Polar')) return 'polar';
            return 'special';
        }

        function drawStructure(amino) {
            const svg = document.getElementById('structureSvg');
            svg.innerHTML = '';
            
            const width = svg.clientWidth;
            const height = svg.clientHeight;
            const cx = width / 2;
            const cy = height / 2;
            
            // Draw peptide backbone (simplified)
            // N-terminus → α-carbon → C-terminus
            const backbone = [
                {x: cx - 80, y: cy, label: 'N'},
                {x: cx - 40, y: cy, label: 'Cα'},
                {x: cx + 40, y: cy, label: 'C'}
            ];
            
            // Draw bonds
            for (let i = 0; i < backbone.length - 1; i++) {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', backbone[i].x);
                line.setAttribute('y1', backbone[i].y);
                line.setAttribute('x2', backbone[i + 1].x);
                line.setAttribute('y2', backbone[i + 1].y);
                line.setAttribute('stroke', '#7fb3ff');
                line.setAttribute('stroke-width', '2');
                svg.appendChild(line);
            }
            
            // Draw atoms
            backbone.forEach(atom => {
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', atom.x);
                circle.setAttribute('cy', atom.y);
                circle.setAttribute('r', '12');
                circle.setAttribute('fill', '#1a2a3a');
                circle.setAttribute('stroke', '#7fb3ff');
                circle.setAttribute('stroke-width', '2');
                svg.appendChild(circle);
                
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', atom.x);
                text.setAttribute('y', atom.y + 5);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('fill', '#7fb3ff');
                text.setAttribute('font-weight', 'bold');
                text.setAttribute('font-size', '12');
                text.textContent = atom.label;
                svg.appendChild(text);
            });
            
            // Draw side chain (R group) from Cα
            const sideChainColor = getSideChainColor(amino.classification);
            
            // Side chain position (below α-carbon)
            const rX = cx - 40;
            const rY = cy + 50;
            
            const rLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            rLine.setAttribute('x1', cx - 40);
            rLine.setAttribute('y1', cy);
            rLine.setAttribute('x2', rX);
            rLine.setAttribute('y2', rY);
            rLine.setAttribute('stroke', sideChainColor);
            rLine.setAttribute('stroke-width', '2');
            svg.appendChild(rLine);
            
            const rCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            rCircle.setAttribute('cx', rX);
            rCircle.setAttribute('cy', rY);
            rCircle.setAttribute('r', '14');
            rCircle.setAttribute('fill', '#1a2a3a');
            rCircle.setAttribute('stroke', sideChainColor);
            rCircle.setAttribute('stroke-width', '2');
            svg.appendChild(rCircle);
            
            const rText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            rText.setAttribute('x', rX);
            rText.setAttribute('y', rY + 5);
            rText.setAttribute('text-anchor', 'middle');
            rText.setAttribute('fill', sideChainColor);
            rText.setAttribute('font-weight', 'bold');
            rText.setAttribute('font-size', '12');
            rText.textContent = 'R';
            svg.appendChild(rText);
            
            // Add label
            const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            label.setAttribute('x', cx);
            label.setAttribute('y', 30);
            label.setAttribute('text-anchor', 'middle');
            label.setAttribute('fill', '#a0b0c0');
            label.setAttribute('font-size', '12');
            label.textContent = `${amino.name} (${amino.abbr})`;
            svg.appendChild(label);
        }

        function getSideChainColor(classification) {
            if (classification.includes('Hydrophobic')) return '#ff6b9d';
            if (classification.includes('Acidic')) return '#d32f2f';
            if (classification.includes('Basic')) return '#00ff88';
            if (classification.includes('Polar')) return '#ffd700';
            return '#7fb3ff';
        }

        // Initialize
        initializeButtons();
        updateDisplay();
    </script>
</body>
</html>
