<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wine Pairing Compass</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: #f5f1e8;
            color: #2c2c2c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            gap: 24px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .sidebar {
            width: 300px;
            background: #faf8f4;
            padding: 24px;
            border-right: 1px solid #e8e4d8;
            overflow-y: auto;
            max-height: 100vh;
        }
        .main {
            flex: 1;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: #6b3a2e;
            margin-bottom: 20px;
        }
        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: #4a2a1f;
            margin: 16px 0 8px 0;
        }
        .wine-selector {
            margin-bottom: 20px;
        }
        .wine-btn {
            display: block;
            width: 100%;
            padding: 8px 12px;
            margin: 4px 0;
            border: 2px solid transparent;
            border-radius: 4px;
            background: #f0ebe5;
            color: #2c2c2c;
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            text-align: left;
            transition: all 0.2s;
        }
        .wine-btn:hover {
            background: #e8e0d5;
        }
        .wine-btn.active {
            font-weight: bold;
            color: white;
            background: #8B4513;
            border-color: #6b3a2e;
        }
        .food-selector {
            margin-bottom: 20px;
        }
        .food-btn {
            display: inline-block;
            padding: 6px 10px;
            margin: 4px 4px 4px 0;
            border: 1px solid #d4c8b8;
            border-radius: 4px;
            background: white;
            color: #2c2c2c;
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            transition: all 0.2s;
        }
        .food-btn:hover {
            border-color: #8B4513;
            background: #fff8f0;
        }
        .food-btn.active {
            background: #FFD700;
            border-color: #FFD700;
            color: #2c2c2c;
            font-weight: bold;
        }
        .slider-group {
            margin-bottom: 16px;
        }
        .slider-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
            display: block;
        }
        input[type="range"] {
            width: 100%;
            height: 4px;
            cursor: pointer;
        }
        .toggle-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
            cursor: pointer;
            font-size: 13px;
        }
        input[type="checkbox"] {
            cursor: pointer;
        }
        .compass-container {
            position: relative;
            width: 500px;
            height: 500px;
            margin: 0 auto;
        }
        canvas {
            width: 100%;
            height: 100%;
            border: 1px solid #e8e4d8;
            border-radius: 6px;
        }
        .stats-panel {
            background: #faf8f4;
            border: 1px solid #e8e4d8;
            border-radius: 6px;
            padding: 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .stat-box {
            border-left: 4px solid #FFD700;
            padding-left: 12px;
        }
        .stat-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .stat-value {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            color: #2c2c2c;
        }
        .pairing-list {
            grid-column: 1 / -1;
        }
        .pairing-item {
            padding: 8px;
            margin: 4px 0;
            background: white;
            border-left: 3px solid #FFD700;
            border-radius: 3px;
            font-size: 12px;
        }
        .pairing-score {
            font-weight: bold;
            color: #6b3a2e;
        }
        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #e8e4d8;
            }
            .compass-container {
                width: 100%;
                max-width: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>🍷 Pairing</h1>
            
            <h2>Wine Type</h2>
            <div class="wine-selector" id="wineSelector"></div>
            
            <h2>Food Match</h2>
            <div class="food-selector" id="foodSelector"></div>
            
            <h2>Budget</h2>
            <div class="slider-group">
                <span class="slider-label">Max Price: $<span id="budgetDisplay">50</span></span>
                <input type="range" id="budgetSlider" min="5" max="200" value="50" step="5">
            </div>
            
            <h2>Occasion</h2>
            <div id="occasionButtons"></div>
        </div>
        
        <div class="main">
            <div class="compass-container">
                <canvas id="canvas"></canvas>
            </div>
            
            <div class="stats-panel">
                <div class="stat-box">
                    <div class="stat-label">Current Wine</div>
                    <div class="stat-value" id="wineName">Cabernet Sauvignon</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Alcohol %</div>
                    <div class="stat-value" id="wineAlcohol">13.5%</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Acidity</div>
                    <div id="acidityBar" style="margin-top: 6px; height: 6px; background: #ddd; border-radius: 3px;"><div style="height: 100%; width: 50%; background: #8B4513; border-radius: 3px;"></div></div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Body</div>
                    <div class="stat-value" id="wineBody">Full</div>
                </div>
                
                <div class="pairing-list">
                    <div class="stat-label">Best Pairings</div>
                    <div id="pairingsList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let dpi = window.devicePixelRatio || 1;
        
        function resizeCanvas() {
            let rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpi;
            canvas.height = rect.height * dpi;
            ctx.scale(dpi, dpi);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        const wines = [
            { name: 'Cabernet Sauvignon', color: '#8B0000', tannins: 8, acidity: 6, body: 'Full', alcohol: 13.5, notes: 'cherry, leather, tobacco', bestFoods: ['Beef', 'Lamb', 'Venison'], price: 15 },
            { name: 'Pinot Noir', color: '#800020', tannins: 5, acidity: 7, body: 'Medium', alcohol: 13, notes: 'strawberry, mushroom, earth', bestFoods: ['Duck', 'Mushroom', 'Salmon'], price: 18 },
            { name: 'Merlot', color: '#A52A2A', tannins: 6, acidity: 5, body: 'Full', alcohol: 13.5, notes: 'plum, cherry, cocoa', bestFoods: ['Beef', 'Pasta', 'Pork'], price: 12 },
            { name: 'Chardonnay', color: '#FFD700', tannins: 1, acidity: 7, body: 'Medium', alcohol: 13, notes: 'apple, butter, oak', bestFoods: ['Chicken', 'Cheese', 'Seafood'], price: 14 },
            { name: 'Sauvignon Blanc', color: '#F0E68C', tannins: 0, acidity: 8, body: 'Light', alcohol: 12.5, notes: 'grapefruit, grass, herbaceous', bestFoods: ['Goat Cheese', 'Vegetables', 'Shellfish'], price: 11 },
            { name: 'Riesling', color: '#E6E600', tannins: 0, acidity: 9, body: 'Light', alcohol: 11.5, notes: 'peach, honey, floral', bestFoods: ['Spicy Dishes', 'Asian', 'Desserts'], price: 10 },
            { name: 'Prosecco', color: '#90EE90', tannins: 0, acidity: 7, body: 'Light', alcohol: 11, notes: 'green apple, citrus, yeast', bestFoods: ['Appetizers', 'Seafood', 'Fruit'], price: 8 },
            { name: 'Champagne', color: '#E6F3FF', tannins: 0, acidity: 8, body: 'Light', alcohol: 12.5, notes: 'brioche, citrus, toast', bestFoods: ['Oysters', 'Caviar', 'Celebration'], price: 40 },
            { name: 'Pinot Grigio', color: '#FFFACD', tannins: 0, acidity: 7, body: 'Light', alcohol: 12, notes: 'lime, green apple, stone fruit', bestFoods: ['Fish', 'Pasta', 'Salad'], price: 10 },
            { name: 'Gewürztraminer', color: '#FFE4B5', tannins: 0, acidity: 6, body: 'Light', alcohol: 13.5, notes: 'lychee, rose, spice', bestFoods: ['Thai', 'Spicy', 'Cheese'], price: 12 },
            { name: 'Shiraz', color: '#8B1C1C', tannins: 7, acidity: 6, body: 'Full', alcohol: 14.5, notes: 'blackberry, pepper, licorice', bestFoods: ['Beef', 'Barbecue', 'Chocolate'], price: 16 },
            { name: 'Nebbiolo', color: '#721C1C', tannins: 9, acidity: 7, body: 'Full', alcohol: 14, notes: 'cherry, rose, truffle', bestFoods: ['Beef Stew', 'Truffle Pasta', 'Aged Cheese'], price: 25 }
        ];
        
        const foods = ['Beef', 'Chicken', 'Fish', 'Seafood', 'Pasta', 'Cheese', 'Vegetables', 'Dessert', 'Spices'];
        const occasions = ['Casual Weeknight', 'Date Night', 'Dinner Party', 'Celebration'];
        
        let selectedWine = 0;
        let selectedFoods = new Set();
        let maxBudget = 50;
        
        function getPairingScore(wine, food) {
            const scoreMap = {
                'Cabernet Sauvignon': { Beef: 95, Lamb: 90, Venison: 88, 'Aged Cheese': 75, Pasta: 60 },
                'Pinot Noir': { Duck: 92, Mushroom: 85, Salmon: 80, Chicken: 75, Pasta: 70 },
                'Merlot': { Beef: 85, Pasta: 80, Pork: 78, Chicken: 70, Cheese: 65 },
                'Chardonnay': { Chicken: 90, Cheese: 85, Seafood: 80, Fish: 85, Pasta: 70 },
                'Sauvignon Blanc': { 'Goat Cheese': 92, Vegetables: 80, Shellfish: 85, Seafood: 80, Salad: 75 },
                'Riesling': { 'Spicy Dishes': 90, Asian: 88, Desserts: 82, Cheese: 75, Vegetables: 70 },
                'Prosecco': { Appetizers: 85, Seafood: 80, Fruit: 85, Cheese: 70, Fish: 75 },
                'Champagne': { Oysters: 98, Caviar: 95, Celebration: 90, Seafood: 85, Appetizers: 80 },
                'Pinot Grigio': { Fish: 88, Pasta: 80, Salad: 82, Seafood: 85, Vegetables: 75 },
                'Gewürztraminer': { Thai: 92, Spicy: 90, Cheese: 80, Asian: 85, Vegetables: 70 },
                'Shiraz': { Beef: 92, Barbecue: 90, Chocolate: 85, 'Aged Cheese': 80, Spices: 75 },
                'Nebbiolo': { 'Beef Stew': 95, 'Truffle Pasta': 90, 'Aged Cheese': 92, Beef: 88, Mushroom: 85 }
            };
            return scoreMap[wine.name]?.[food] || 40;
        }
        
        function drawCompass() {
            let w = canvas.width / dpi;
            let h = canvas.height / dpi;
            let cx = w / 2;
            let cy = h / 2;
            let radius = 150;
            
            ctx.clearRect(0, 0, w, h);
            
            // Background
            ctx.fillStyle = '#faf8f4';
            ctx.fillRect(0, 0, w, h);
            
            // Compass rose
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(cx - radius * 1.1, cy);
            ctx.lineTo(cx + radius * 1.1, cy);
            ctx.moveTo(cx, cy - radius * 1.1);
            ctx.lineTo(cx, cy + radius * 1.1);
            ctx.stroke();
            
            // Draw wine circles
            wines.forEach((wine, i) => {
                let angle = (i / wines.length) * Math.PI * 2 - Math.PI / 2;
                let x = cx + Math.cos(angle) * radius;
                let y = cy + Math.sin(angle) * radius;
                
                let isSelected = selectedWine === i;
                let cardSize = isSelected ? 45 : 40;
                
                // Card background
                ctx.fillStyle = wine.color;
                ctx.globalAlpha = isSelected ? 1 : 0.75;
                ctx.beginPath();
                ctx.arc(x, y, cardSize, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
                
                if (isSelected) {
                    ctx.strokeStyle = '#FFD700';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
                
                // Wine name text
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 11px "Space Mono"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                let lines = wine.name.split(' ');
                if (lines.length > 1) {
                    ctx.fillText(lines[0], x, y - 6);
                    ctx.fillText(lines.slice(1).join(' '), x, y + 6);
                } else {
                    ctx.fillText(wine.name, x, y);
                }
                
                // Clickable area
                canvas.addEventListener('click', (e) => {
                    let rect = canvas.getBoundingClientRect();
                    let mx = (e.clientX - rect.left) / dpi;
                    let my = (e.clientY - rect.top) / dpi;
                    let d = Math.sqrt((mx - x) ** 2 + (my - y) ** 2);
                    if (d < cardSize + 5) {
                        selectedWine = i;
                        updateUI();
                        drawCompass();
                    }
                });
            });
        }
        
        function updateUI() {
            const wine = wines[selectedWine];
            document.getElementById('wineName').textContent = wine.name;
            document.getElementById('wineAlcohol').textContent = wine.alcohol + '%';
            document.getElementById('wineBody').textContent = wine.body;
            
            let acidity = (wine.acidity / 10) * 100;
            document.querySelector('#acidityBar > div').style.width = acidity + '%';
            
            // Pairings
            let pairings = foods.map(f => ({ food: f, score: getPairingScore(wine, f) }))
                .sort((a, b) => b.score - a.score)
                .slice(0, 5);
            
            let pairingHTML = pairings.map(p => 
                `<div class="pairing-item"><span class="pairing-score">${p.score}%</span> — ${p.food}</div>`
            ).join('');
            document.getElementById('pairingsList').innerHTML = pairingHTML;
            
            document.querySelector('.wine-btn.active')?.classList.remove('active');
            document.querySelectorAll('.wine-btn')[selectedWine].classList.add('active');
        }
        
        function initUI() {
            // Wine selector
            let wineHTML = wines.map((w, i) => 
                `<button class="wine-btn ${i === 0 ? 'active' : ''}" data-index="${i}">${w.name}</button>`
            ).join('');
            document.getElementById('wineSelector').innerHTML = wineHTML;
            document.querySelectorAll('.wine-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    selectedWine = parseInt(btn.dataset.index);
                    updateUI();
                    drawCompass();
                });
            });
            
            // Food selector
            let foodHTML = foods.map(f => 
                `<button class="food-btn" data-food="${f}">${f}</button>`
            ).join('');
            document.getElementById('foodSelector').innerHTML = foodHTML;
            
            // Occasion buttons
            let occasionHTML = occasions.map(o =>
                `<button class="food-btn" data-occasion="${o}">${o}</button>`
            ).join('');
            document.getElementById('occasionButtons').innerHTML = occasionHTML;
            
            // Budget slider
            document.getElementById('budgetSlider').addEventListener('input', (e) => {
                maxBudget = parseInt(e.target.value);
                document.getElementById('budgetDisplay').textContent = maxBudget;
            });
            
            updateUI();
            drawCompass();
        }
        
        initUI();
    </script>
</body>
</html>
