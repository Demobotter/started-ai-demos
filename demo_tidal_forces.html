<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tidal Forces Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #1a0f2e 100%);
            color: #7dd3fc;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            background: rgba(10, 14, 39, 0.8);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #1a3a5a;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            grid-column: 1 / -1;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #4da8da, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .control-group {
            background: #1a3a5a;
            border-left: 3px solid #4da8da;
            padding: 12px;
            border-radius: 6px;
        }
        .control-group label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4da8da;
            margin-bottom: 6px;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #0a1428;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00ffff;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
        }
        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00ffff;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
        }
        .value-display {
            font-size: 13px;
            color: #52c41a;
            margin-top: 4px;
            font-weight: bold;
        }
        .toggle-group {
            display: flex;
            gap: 6px;
        }
        button {
            flex: 1;
            padding: 8px;
            background: #0a1428;
            border: 1px solid #1a3a5a;
            color: #7dd3fc;
            border-radius: 4px;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button.active {
            background: #2d9d5f;
            border-color: #52c41a;
            color: #fff;
            box-shadow: 0 0 12px rgba(82, 196, 26, 0.4);
        }
        button:hover:not(.active) {
            background: #1a3a5a;
            border-color: #4da8da;
        }
        .stat-box {
            background: #0a1428;
            border-left: 2px solid #4da8da;
            padding: 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-bottom: 6px;
        }
        .stat-box .label { color: #7dd3fc; text-transform: uppercase; font-size: 9px; letter-spacing: 0.5px; }
        .stat-box .value { color: #52c41a; font-weight: bold; font-size: 13px; margin-top: 2px; }
        canvas {
            border: 1px solid #1a3a5a;
            border-radius: 8px;
            background: radial-gradient(ellipse at center, #0a0e27, #050810);
            display: block;
            width: 100%;
            height: auto;
        }
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
            h1 { grid-column: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌊 Tidal Forces</h1>
        
        <div class="sidebar">
            <div class="control-group">
                <label>Orbital Distance</label>
                <input type="range" id="distanceSlider" min="350000" max="450000" value="384400" step="1000">
                <div class="value-display" id="distanceValue">384,400 km</div>
            </div>
            
            <div class="control-group">
                <label>Moon Mass</label>
                <input type="range" id="massSlider" min="0.1" max="2.0" value="1.0" step="0.05">
                <div class="value-display" id="massValue">100% actual</div>
            </div>
            
            <div class="control-group">
                <label>Animation</label>
                <div class="toggle-group">
                    <button id="playBtn" class="active">Play</button>
                    <button id="pauseBtn">Pause</button>
                </div>
            </div>
            
            <div class="control-group">
                <label>Display Options</label>
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <button id="bulgesToggle" class="active" style="font-size: 9px;">Show Bulges</button>
                    <button id="forcesToggle" class="active" style="font-size: 9px;">Show Forces</button>
                    <button id="sunToggle" style="font-size: 9px;">Show Sun</button>
                </div>
            </div>
            
            <div class="stat-box">
                <div class="label">Tidal Force Differential</div>
                <div class="value" id="tidalForce">0.00 N</div>
            </div>
            
            <div class="stat-box">
                <div class="label">Bulge Height</div>
                <div class="value" id="bulgeHeight">0.00 km</div>
            </div>
            
            <div class="stat-box">
                <div class="label">Tide Type</div>
                <div class="value" id="tideType">—</div>
            </div>
            
            <div class="stat-box">
                <div class="label">Earth Rotation</div>
                <div class="value" id="rotation">0.0°</div>
            </div>
        </div>
        
        <canvas id="canvas"></canvas>
    </div>

    <script>
        // Constants
        const G = 6.674e-11; // Gravitational constant
        const EARTH_RADIUS = 6371; // km
        const MOON_MASS_ACTUAL = 7.342e22; // kg
        const EARTH_MASS = 5.972e24; // kg
        
        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.offsetWidth;
        canvas.height = Math.min(canvas.offsetWidth * 0.6, 500);
        
        // State
        let state = {
            distance: 384400, // km
            moonMass: 1.0, // multiplier
            playing: true,
            showBulges: true,
            showForces: true,
            showSun: false,
            earthRotation: 0, // degrees
            sunAngle: 0, // degrees relative to Moon
            time: 0
        };
        
        // UI Elements
        const distanceSlider = document.getElementById('distanceSlider');
        const massSlider = document.getElementById('massSlider');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const bulgesToggle = document.getElementById('bulgesToggle');
        const forcesToggle = document.getElementById('forcesToggle');
        const sunToggle = document.getElementById('sunToggle');
        
        // Event Listeners
        distanceSlider.addEventListener('input', (e) => {
            state.distance = parseFloat(e.target.value);
            document.getElementById('distanceValue').textContent = state.distance.toLocaleString() + ' km';
        });
        
        massSlider.addEventListener('input', (e) => {
            state.moonMass = parseFloat(e.target.value);
            document.getElementById('massValue').textContent = (state.moonMass * 100).toFixed(0) + '% actual';
        });
        
        playBtn.addEventListener('click', () => {
            state.playing = true;
            playBtn.classList.add('active');
            pauseBtn.classList.remove('active');
        });
        
        pauseBtn.addEventListener('click', () => {
            state.playing = false;
            pauseBtn.classList.add('active');
            playBtn.classList.remove('active');
        });
        
        bulgesToggle.addEventListener('click', () => {
            state.showBulges = !state.showBulges;
            bulgesToggle.classList.toggle('active');
        });
        
        forcesToggle.addEventListener('click', () => {
            state.showForces = !state.showForces;
            forcesToggle.classList.toggle('active');
        });
        
        sunToggle.addEventListener('click', () => {
            state.showSun = !state.showSun;
            sunToggle.classList.toggle('active');
        });
        
        // Physics calculations
        function calculateTidalForce() {
            const dKm = state.distance;
            const dM = dKm * 1000; // meters
            const moonMass = MOON_MASS_ACTUAL * state.moonMass;
            
            // Tidal force differential F = 2 * G * M_moon * R_earth / d^3
            const tidalF = (2 * G * moonMass * EARTH_RADIUS * 1000) / Math.pow(dM, 3);
            return tidalF;
        }
        
        function calculateBulgeHeight() {
            const tidalF = calculateTidalForce();
            // Bulge height (simplified) ~ 0.5m base + tidalForce effect
            const baseHeight = 0.5;
            const responseHeight = tidalF * 1e15; // Scaling for visualization
            return Math.max(0, baseHeight + responseHeight) * 100; // Scale to km
        }
        
        // Rendering
        function drawStarfield() {
            const starCount = 150;
            for (let i = 0; i < starCount; i++) {
                const x = (i * 73 + i * 11) % canvas.width;
                const y = (i * 97 + i * 13) % canvas.height;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.beginPath();
                ctx.arc(x, y, 0.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function drawEarth(x, y, radius) {
            // Earth sphere
            const earthGradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
            earthGradient.addColorStop(0, '#4169e1');
            earthGradient.addColorStop(1, '#1e90ff');
            
            ctx.fillStyle = earthGradient;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Day/night terminator
            const lightDir = Math.cos(state.earthRotation * Math.PI / 180) > 0 ? 1 : -1;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Continents (simple pattern)
            ctx.fillStyle = 'rgba(34, 85, 34, 0.4)';
            for (let i = 0; i < 3; i++) {
                const angle = (state.earthRotation + i * 120) * Math.PI / 180;
                const px = x + Math.cos(angle) * radius * 0.7;
                const py = y + Math.sin(angle) * radius * 0.7;
                ctx.beginPath();
                ctx.arc(px, py, radius * 0.25, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function drawMoon(x, y, radius) {
            const moonGradient = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, 0, x, y, radius);
            moonGradient.addColorStop(0, '#d9d9d9');
            moonGradient.addColorStop(1, '#a9a9a9');
            
            ctx.fillStyle = moonGradient;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Craters
            ctx.fillStyle = 'rgba(100, 100, 100, 0.5)';
            for (let i = 0; i < 4; i++) {
                const cx = x + (Math.random() - 0.5) * radius * 1.5;
                const cy = y + (Math.random() - 0.5) * radius * 1.5;
                const cr = radius * (0.1 + Math.random() * 0.2);
                ctx.beginPath();
                ctx.arc(cx, cy, cr, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function drawBulges(earthX, earthY, earthRadius, moonX, moonY) {
            if (!state.showBulges) return;
            
            const bulgeH = calculateBulgeHeight() * 0.5; // Scale for visualization
            const bulgeR = earthRadius + bulgeH * 0.02;
            
            // Vector from Earth to Moon
            const dx = moonX - earthX;
            const dy = moonY - earthY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const normX = dx / dist;
            const normY = dy / dist;
            
            // Near-side bulge
            const nearX = earthX + normX * bulgeR;
            const nearY = earthY + normY * bulgeR;
            
            ctx.fillStyle = 'rgba(0, 255, 255, 0.4)';
            ctx.beginPath();
            ctx.ellipse(nearX, nearY, earthRadius * 0.4, earthRadius * 0.3, Math.atan2(normY, normX), 0, Math.PI * 2);
            ctx.fill();
            
            // Far-side bulge
            const farX = earthX - normX * bulgeR;
            const farY = earthY - normY * bulgeR;
            
            ctx.fillStyle = 'rgba(0, 255, 255, 0.3)';
            ctx.beginPath();
            ctx.ellipse(farX, farY, earthRadius * 0.35, earthRadius * 0.25, Math.atan2(normY, normX), 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawForceVectors(earthX, earthY, moonX, moonY) {
            if (!state.showForces) return;
            
            const dx = moonX - earthX;
            const dy = moonY - earthY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const normX = dx / dist;
            const normY = dy / dist;
            
            // Tidal force arrow
            const arrowLen = 60;
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            
            ctx.beginPath();
            ctx.moveTo(earthX, earthY);
            ctx.lineTo(earthX + normX * arrowLen, earthY + normY * arrowLen);
            ctx.stroke();
            
            // Arrow head
            const angle = Math.atan2(normY, normX);
            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(earthX + normX * arrowLen, earthY + normY * arrowLen);
            ctx.lineTo(earthX + normX * (arrowLen - 8) + Math.cos(angle + Math.PI * 0.2) * 8, 
                       earthY + normY * (arrowLen - 8) + Math.sin(angle + Math.PI * 0.2) * 8);
            ctx.moveTo(earthX + normX * arrowLen, earthY + normY * arrowLen);
            ctx.lineTo(earthX + normX * (arrowLen - 8) + Math.cos(angle - Math.PI * 0.2) * 8, 
                       earthY + normY * (arrowLen - 8) + Math.sin(angle - Math.PI * 0.2) * 8);
            ctx.stroke();
        }
        
        function drawSun(earthX, earthY) {
            if (!state.showSun) return;
            
            const sunDist = 800;
            const sunX = earthX + Math.cos(state.sunAngle * Math.PI / 180) * sunDist;
            const sunY = earthY + Math.sin(state.sunAngle * Math.PI / 180) * sunDist;
            
            // Sun glow
            const sunGlow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 40);
            sunGlow.addColorStop(0, 'rgba(255, 215, 0, 0.6)');
            sunGlow.addColorStop(1, 'rgba(255, 215, 0, 0)');
            ctx.fillStyle = sunGlow;
            ctx.beginPath();
            ctx.arc(sunX, sunY, 40, 0, Math.PI * 2);
            ctx.fill();
            
            // Sun
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(sunX, sunY, 15, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function updateStats() {
            const tidalF = calculateTidalForce();
            const bulgeH = calculateBulgeHeight();
            
            document.getElementById('tidalForce').textContent = tidalF.toExponential(2) + ' N';
            document.getElementById('bulgeHeight').textContent = bulgeH.toFixed(2) + ' km';
            document.getElementById('rotation').textContent = (state.earthRotation % 360).toFixed(1) + '°';
            
            // Tide type
            let tideType = '—';
            if (state.showSun) {
                const angle = Math.abs(state.sunAngle);
                if (angle < 45 || angle > 315) tideType = 'Spring';
                else if (angle > 135 && angle < 225) tideType = 'Spring';
                else tideType = 'Neap';
            }
            document.getElementById('tideType').textContent = tideType;
        }
        
        function animate() {
            // Clear canvas
            ctx.fillStyle = 'rgba(10, 14, 39, 0.9)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Starfield
            drawStarfield();
            
            // Calculate positions
            const centerX = canvas.width * 0.4;
            const centerY = canvas.height * 0.5;
            const earthRadius = 40;
            const moonRadius = 15;
            
            // Scaling: distance in km → canvas pixels (simplified)
            const distScale = (canvas.width * 0.35) / 450000; // Max distance scaled to ~35% width
            const moonDist = state.distance * distScale;
            
            const moonX = centerX + moonDist;
            const moonY = centerY;
            
            // Draw orbital path
            ctx.strokeStyle = 'rgba(77, 168, 218, 0.2)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, moonDist, 0, Math.PI * 2);
            ctx.stroke();
            
            // Update and draw
            if (state.playing) {
                state.earthRotation += 1.5;
                state.sunAngle += 0.15;
            }
            
            drawBulges(centerX, centerY, earthRadius, moonX, moonY);
            drawEarth(centerX, centerY, earthRadius);
            drawForceVectors(centerX, centerY, moonX, moonY);
            drawMoon(moonX, moonY, moonRadius);
            drawSun(centerX, centerY);
            
            // Labels
            ctx.fillStyle = '#7dd3fc';
            ctx.font = '12px "Space Mono"';
            ctx.fillText('Earth', centerX - 20, centerY + earthRadius + 20);
            ctx.fillText('Moon', moonX - 15, moonY + moonRadius + 20);
            
            updateStats();
            
            requestAnimationFrame(animate);
        }
        
        // Handle canvas resize
        window.addEventListener('resize', () => {
            canvas.width = canvas.offsetWidth;
            canvas.height = Math.min(canvas.offsetWidth * 0.6, 500);
        });
        
        animate();
    </script>
</body>
</html>
