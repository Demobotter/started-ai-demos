<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Sora:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Sora', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e6ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(15, 20, 45, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 150, 255, 0.2);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 32px;
            margin-bottom: 8px;
            color: #fff;
        }
        .subtitle {
            font-size: 13px;
            color: #a0a8d0;
            margin-bottom: 24px;
        }
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        input {
            flex: 1;
            min-width: 200px;
            padding: 10px 14px;
            background: rgba(30, 40, 75, 0.8);
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 8px;
            color: #e0e6ff;
            font-size: 14px;
        }
        input::placeholder { color: #6a7599; }
        input:focus {
            outline: none;
            border-color: rgba(100, 150, 255, 0.8);
            box-shadow: 0 0 12px rgba(100, 150, 255, 0.2);
        }
        button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #4a7aff 0%, #357ff8 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(74, 122, 255, 0.4); }
        button:active { transform: translateY(0); }
        .status {
            font-size: 12px;
            color: #6a7599;
            margin-top: 8px;
        }
        .canvas-wrapper {
            position: relative;
            background: rgba(10, 15, 35, 0.6);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
            border: 1px solid rgba(100, 150, 255, 0.15);
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: radial-gradient(ellipse at center, rgba(30, 60, 120, 0.3) 0%, rgba(10, 15, 35, 0.6) 100%);
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .info-box {
            background: rgba(30, 40, 75, 0.6);
            border: 1px solid rgba(100, 150, 255, 0.2);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
        }
        .info-label {
            font-size: 11px;
            color: #6a7599;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .info-value {
            font-size: 18px;
            font-weight: 700;
            color: #4a9eff;
            font-family: 'Poppins', sans-serif;
        }
        .gauge-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }
        .gauge {
            background: rgba(30, 40, 75, 0.6);
            border: 1px solid rgba(100, 150, 255, 0.2);
            border-radius: 10px;
            padding: 16px;
        }
        .gauge-label {
            font-size: 12px;
            color: #6a7599;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .gauge-bar {
            width: 100%;
            height: 24px;
            background: rgba(10, 15, 35, 0.5);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }
        .gauge-fill {
            height: 100%;
            background: linear-gradient(90deg, #4a7aff, #ff6b6b);
            border-radius: 4px;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            font-weight: 700;
        }
        .aircraft-list {
            background: rgba(30, 40, 75, 0.6);
            border: 1px solid rgba(100, 150, 255, 0.2);
            border-radius: 10px;
            padding: 16px;
            max-height: 300px;
            overflow-y: auto;
        }
        .aircraft-list h3 {
            font-size: 12px;
            color: #6a7599;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        .aircraft-item {
            padding: 10px;
            background: rgba(10, 15, 35, 0.5);
            border-left: 3px solid #4a7aff;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .aircraft-item:hover { background: rgba(74, 122, 255, 0.1); border-left-color: #ff6b6b; }
        .aircraft-call {
            font-weight: 700;
            color: #4a9eff;
        }
        .aircraft-type {
            color: #8a92b6;
            font-size: 11px;
        }
        .error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: #ff8b8b;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 12px;
        }
        @media (max-width: 600px) {
            .container { padding: 20px; }
            h1 { font-size: 24px; }
            .gauge-container { grid-template-columns: 1fr; }
            .info-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✈️ Flight Tracker</h1>
        <p class="subtitle">Real-time aircraft near your city (OpenSky Network ADS-B)</p>

        <div class="controls">
            <input type="text" id="cityInput" placeholder="Enter city (e.g., Sydney, London, New York)" value="Sydney">
            <button onclick="searchCity()">Search</button>
        </div>
        <div class="status" id="status">Enter a city and click Search to begin tracking.</div>
        <div id="errorDiv"></div>

        <div class="canvas-wrapper">
            <canvas id="mapCanvas" width="800" height="400"></canvas>
        </div>

        <div class="info-grid">
            <div class="info-box">
                <div class="info-label">Aircraft Count</div>
                <div class="info-value" id="countDisplay">0</div>
            </div>
            <div class="info-box">
                <div class="info-label">Update Age</div>
                <div class="info-value" id="ageDisplay">—</div>
            </div>
            <div class="info-box">
                <div class="info-label">Search Radius</div>
                <div class="info-value">200 km</div>
            </div>
            <div class="info-box">
                <div class="info-label">Refresh Rate</div>
                <div class="info-value">5s</div>
            </div>
        </div>

        <div class="gauge-container">
            <div class="gauge">
                <div class="gauge-label">Avg Altitude</div>
                <div class="gauge-bar">
                    <div class="gauge-fill" id="altGauge" style="width: 50%;">—</div>
                </div>
            </div>
            <div class="gauge">
                <div class="gauge-label">Avg Speed</div>
                <div class="gauge-bar">
                    <div class="gauge-fill" id="speedGauge" style="width: 50%;">—</div>
                </div>
            </div>
        </div>

        <div class="aircraft-list">
            <h3>Nearby Aircraft</h3>
            <div id="aircraftList"></div>
        </div>
    </div>

    <script>
        let currentLat = -33.8688, currentLng = 151.2093; // Sydney default
        let aircraftData = [];
        let lastUpdate = null;

        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');

        // Nominatim geocoding (city → lat/lng)
        async function geocodeCity(city) {
            try {
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(city)}&format=json&limit=1`,
                    { headers: { 'User-Agent': 'FlightTrackerDemo' } }
                );
                const data = await response.json();
                if (data.length === 0) throw new Error('City not found');
                return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
            } catch (e) {
                showError(`Geocoding error: ${e.message}`);
                return null;
            }
        }

        // OpenSky API — states within bounding box
        async function fetchAircraft(lat, lng) {
            const radiusKm = 200;
            const radiusDeg = radiusKm / 111.32;
            const params = new URLSearchParams({
                lamin: lat - radiusDeg,
                lamax: lat + radiusDeg,
                lomin: lng - radiusDeg,
                lomax: lng + radiusDeg
            });
            try {
                const response = await fetch(
                    `https://opensky-network.org/api/states/all?${params.toString()}`
                );
                const json = await response.json();
                lastUpdate = new Date();
                return (json.states || []).map(s => ({
                    icao24: s[0],
                    callsign: (s[1] || '').trim(),
                    lat: s[6],
                    lng: s[5],
                    altitude: s[7],
                    speed: s[9],
                    track: s[10],
                    vertRate: s[11],
                    country: s[2]
                })).filter(a => a.lat && a.lng);
            } catch (e) {
                showError(`OpenSky API error: ${e.message}`);
                return [];
            }
        }

        function drawMap(lat, lng, aircraft) {
            const W = canvas.width, H = canvas.height;
            ctx.fillStyle = 'rgba(10, 15, 35, 0.3)';
            ctx.fillRect(0, 0, W, H);

            // Grid
            ctx.strokeStyle = 'rgba(100, 150, 255, 0.15)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 10; i++) {
                const x = (W / 10) * i;
                const y = (H / 10) * i;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, H);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }

            // Center circle (search location)
            ctx.fillStyle = 'rgba(74, 122, 255, 0.2)';
            ctx.beginPath();
            ctx.arc(W / 2, H / 2, 60, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(74, 122, 255, 0.6)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Aircraft points
            aircraft.forEach(a => {
                const dx = a.lng - lng;
                const dy = a.lat - lat;
                const scale = 40 / 1;
                const x = W / 2 + dx * scale;
                const y = H / 2 - dy * scale;

                if (x > 0 && x < W && y > 0 && y < H) {
                    // Altitude-based color: blue (low) → red (high)
                    const altPercent = Math.min(a.altitude / 35000, 1);
                    const r = Math.floor(255 * altPercent);
                    const b = Math.floor(255 * (1 - altPercent));
                    ctx.fillStyle = `rgb(${r}, 100, ${b})`;
                    ctx.beginPath();
                    ctx.arc(x, y, 5, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px Poppins';
            ctx.textAlign = 'center';
            ctx.fillText(`Center: ${lat.toFixed(2)}°, ${lng.toFixed(2)}°`, W / 2, 20);
        }

        function updateUI(aircraft) {
            // Count
            document.getElementById('countDisplay').textContent = aircraft.length;

            // Age
            const age = lastUpdate ? Math.floor((Date.now() - lastUpdate) / 1000) : 0;
            document.getElementById('ageDisplay').textContent = age + 's';

            // Altitude gauge
            const avgAlt = aircraft.length > 0
                ? aircraft.reduce((sum, a) => sum + (a.altitude || 0), 0) / aircraft.length
                : 0;
            const altPercent = Math.min(avgAlt / 35000 * 100, 100);
            document.getElementById('altGauge').style.width = altPercent + '%';
            document.getElementById('altGauge').textContent = Math.floor(avgAlt) + ' m';

            // Speed gauge
            const avgSpeed = aircraft.length > 0
                ? aircraft.reduce((sum, a) => sum + (a.speed || 0), 0) / aircraft.length
                : 0;
            const speedPercent = Math.min(avgSpeed / 250 * 100, 100);
            document.getElementById('speedGauge').style.width = speedPercent + '%';
            document.getElementById('speedGauge').textContent = Math.floor(avgSpeed) + ' m/s';

            // Aircraft list
            const list = document.getElementById('aircraftList');
            list.innerHTML = aircraft.slice(0, 10).map(a => `
                <div class="aircraft-item">
                    <div class="aircraft-call">${a.callsign || a.icao24}</div>
                    <div class="aircraft-type">${a.country || '—'} • ${Math.floor(a.altitude)} m • ${Math.floor(a.speed)} m/s</div>
                </div>
            `).join('');
            if (aircraft.length > 10) {
                list.innerHTML += `<div style="color: #6a7599; font-size: 11px; margin-top: 8px;">+${aircraft.length - 10} more</div>`;
            }
        }

        function showError(msg) {
            document.getElementById('errorDiv').innerHTML = `<div class="error">${msg}</div>`;
        }

        async function searchCity() {
            document.getElementById('errorDiv').innerHTML = '';
            document.getElementById('status').textContent = 'Searching...';
            const city = document.getElementById('cityInput').value.trim();
            if (!city) {
                showError('Please enter a city name.');
                return;
            }

            const coords = await geocodeCity(city);
            if (!coords) return;

            currentLat = coords.lat;
            currentLng = coords.lng;
            document.getElementById('status').textContent = `Tracking near ${city} — fetching aircraft...`;
            await pollAircraft();
        }

        async function pollAircraft() {
            aircraftData = await fetchAircraft(currentLat, currentLng);
            drawMap(currentLat, currentLng, aircraftData);
            updateUI(aircraftData);
            document.getElementById('status').textContent = `Last refresh: ${lastUpdate ? lastUpdate.toLocaleTimeString() : '—'}`;
        }

        // Initial load
        searchCity();

        // Auto-refresh every 5s
        setInterval(pollAircraft, 5000);
    </script>
</body>
</html>
