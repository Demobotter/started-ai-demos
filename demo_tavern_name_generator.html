<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tavern Name Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a0033 0%, #2d0d4d 100%);
            font-family: 'Space Mono', monospace;
            color: #e5d5ff;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
        .panel {
            background: rgba(15, 5, 35, 0.8);
            border: 2px solid #8b5a8e;
            border-radius: 12px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2em;
            color: #ffd700;
            margin-bottom: 8px;
            text-shadow: 0 2px 8px rgba(255, 215, 0, 0.3);
        }
        .tagline {
            color: #b89dcc;
            font-size: 0.9em;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-weight: bold;
            color: #d4a5ff;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        select {
            background: #0f0523;
            border: 1px solid #8b5a8e;
            color: #e5d5ff;
            padding: 10px 12px;
            border-radius: 6px;
            font-family: 'Space Mono', monospace;
            cursor: pointer;
            transition: all 0.2s;
        }
        select:hover { border-color: #d4a5ff; }
        select:focus { outline: none; border-color: #ffd700; box-shadow: 0 0 8px rgba(255, 215, 0, 0.2); }
        .gen-button {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #1a0033;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-family: 'Playfair Display', serif;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
        }
        .gen-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 215, 0, 0.4);
        }
        .gen-button:active { transform: translateY(0); }
        .output-section {
            flex: 1;
        }
        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 2px solid #8b5a8e;
            padding-bottom: 10px;
        }
        .output-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4em;
            color: #ffd700;
        }
        .export-button {
            background: #6a4c93;
            color: #e5d5ff;
            border: 1px solid #8b5a8e;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.2s;
        }
        .export-button:hover {
            background: #8b5a8e;
            border-color: #d4a5ff;
        }
        .tavern-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 8px;
        }
        .tavern-list::-webkit-scrollbar {
            width: 8px;
        }
        .tavern-list::-webkit-scrollbar-track {
            background: rgba(139, 90, 142, 0.1);
            border-radius: 4px;
        }
        .tavern-list::-webkit-scrollbar-thumb {
            background: #8b5a8e;
            border-radius: 4px;
        }
        .tavern-item {
            background: rgba(107, 70, 140, 0.3);
            border-left: 4px solid #d4a5ff;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tavern-item:hover {
            background: rgba(107, 70, 140, 0.5);
            border-left-color: #ffd700;
            transform: translateX(4px);
        }
        .tavern-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.05em;
            color: #ffd700;
            margin-bottom: 4px;
        }
        .tavern-lore {
            font-size: 0.85em;
            color: #b89dcc;
            line-height: 1.4;
        }
        .tavern-item.favorite .tavern-name::before {
            content: "★ ";
            color: #ffd700;
        }
        .empty-state {
            text-align: center;
            color: #8b5a8e;
            padding: 40px 20px;
            font-style: italic;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #8b5a8e;
            font-size: 0.85em;
        }
        .stat {
            background: rgba(107, 70, 140, 0.2);
            padding: 8px;
            border-radius: 4px;
            border-left: 2px solid #d4a5ff;
        }
        .stat-label {
            color: #8b5a8e;
            font-size: 0.75em;
            text-transform: uppercase;
        }
        .stat-value {
            color: #ffd700;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🍺 Tavern Names</h1>
        <p class="tagline">Procedural fantasy tavern names for your next adventure</p>
    </div>

    <div class="container">
        <div class="panel">
            <div class="controls">
                <div class="control-group">
                    <label for="theme">Theme</label>
                    <select id="theme">
                        <option value="cozy">Cozy Cottage</option>
                        <option value="dark">Dark & Mysterious</option>
                        <option value="exotic">Exotic & Foreign</option>
                        <option value="scholarly">Scholarly & Academic</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="region">Region</label>
                    <select id="region">
                        <option value="medieval">Medieval Europe</option>
                        <option value="pirate">Pirate Coast</option>
                        <option value="elven">Elven Forest</option>
                        <option value="dwarven">Dwarven Halls</option>
                        <option value="arcane">Arcane Academy</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="style">Style</label>
                    <select id="style">
                        <option value="serious">Serious & Historic</option>
                        <option value="punny">Punny & Clever</option>
                        <option value="mysterious">Mysterious & Cryptic</option>
                        <option value="literal">Literal & Descriptive</option>
                    </select>
                </div>
                <button class="gen-button" onclick="generateTaverns()">Generate Names</button>
            </div>
        </div>

        <div class="panel output-section">
            <div class="output-header">
                <h2>Generated Taverns</h2>
                <button class="export-button" onclick="exportNames()">📥 Export</button>
            </div>
            <div id="output" class="tavern-list">
                <div class="empty-state">Pick filters and click Generate</div>
            </div>
            <div class="stats" id="stats" style="display:none;">
                <div class="stat">
                    <div class="stat-label">Total Names</div>
                    <div class="stat-value" id="totalCount">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Favorites</div>
                    <div class="stat-value" id="favCount">0</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Syllable databases per region
        const syllables = {
            medieval: {
                prefix: ["The", "Old", "King's", "Queen's", "Royal", "Sunken", "Rising", "Merry", "Weary", "Crimson"],
                noun: ["Crown", "Oak", "Boar", "Lion", "Swan", "Hound", "Eagle", "Stag", "Rose", "Cross", "Sword", "Shield", "Ale", "Cider", "Hearth", "Hall", "Court", "Field", "Stone", "Wood"],
                suffix: ["House", "Inn", "Tavern", "Hall", "Court", "Gate", "Bridge", "Moor"]
            },
            pirate: {
                prefix: ["The", "Black", "Crimson", "Sunken", "Salty", "Cursed", "Dead", "Ghostly", "Dread", "Scurvy"],
                noun: ["Anchor", "Siren", "Skull", "Kraken", "Tide", "Wave", "Chest", "Plank", "Galleon", "Corsair", "Bounty", "Maelstrom", "Brig", "Cannon", "Rum", "Treasure"],
                suffix: ["Nest", "Cove", "Haven", "Port", "Wharf", "Shoal", "Reef", "Isle"]
            },
            elven: {
                prefix: ["Starlight", "Moonlit", "Silver", "Whisper", "Eternal", "Twilight", "Dream", "Crystal", "Mystic", "Enchanted"],
                noun: ["Glade", "Haven", "Refuge", "Clearing", "Grove", "Forest", "Myst", "Vale", "Realm", "Garden", "Spring", "Lake", "Star", "Moon", "Leaf", "Breeze"],
                suffix: ["Haven", "Refuge", "Glade", "Grove", "Sanctuary", "Realm", "Dell"]
            },
            dwarven: {
                prefix: ["The", "Stone", "Deep", "Iron", "Granite", "Golden", "Mighty", "Sturdy", "Ancient", "Forged"],
                noun: ["Hammer", "Anvil", "Stone", "Gold", "Beard", "Axe", "Pick", "Mead", "Forge", "Vault", "Pit", "Mountain", "Boulder", "Helm", "Chain", "Ale"],
                suffix: ["Hold", "Hall", "Mine", "Forge", "Vault", "Keep", "Den", "Depths"]
            },
            arcane: {
                prefix: ["The", "Arcane", "Mystical", "Ethereal", "Cosmic", "Enchanted", "Otherworldly", "Spectral", "Hidden", "Eldritch"],
                noun: ["Spellbook", "Codex", "Rune", "Crystal", "Aether", "Void", "Essence", "Grimoire", "Scroll", "Wand", "Orb", "Quill", "Starfire", "Nexus", "Portal", "Arcana"],
                suffix: ["Sanctum", "Sanctary", "Chamber", "Tower", "Study", "Library", "Athenaeum", "Haven"]
            }
        };

        // Lore templates
        const loreTemplates = {
            cozy: [
                "A warm haven where travelers rest their weary feet.",
                "Known for hearty meals and the friendliest innkeeper in the realm.",
                "Local legend says lost souls find comfort here.",
                "A favorite retreat of merchants and wandering bards.",
                "Patrons swear they've seen pixies dancing near the hearth.",
                "The perfect place to escape a storm or a broken heart."
            ],
            dark: [
                "Whispers say only the bold—or foolish—venture inside.",
                "A den of mysteries where secrets are as common as ale.",
                "Those who enter rarely speak of what they witnessed.",
                "Ancient enchantments linger in every shadow.",
                "Rumors abound of deals made in the candlelit corners.",
                "A place where heroes and villains share the same table."
            ],
            exotic: [
                "Scents of spice and distant lands fill the air.",
                "A gateway to adventure and untold riches.",
                "Filled with treasures and stories from far shores.",
                "Where merchants trade in gold and gossip alike.",
                "Patrons wear silks and speak in strange tongues.",
                "A crossroads for dreamers and fortune-seekers."
            ],
            scholarly: [
                "A sanctuary for learned minds and curious souls.",
                "Where scholars debate ancient texts over tankards of mead.",
                "Known for its extensive library and wise conversation.",
                "A place where knowledge is exchanged as freely as coin.",
                "Mages, clerics, and scribes gather here to share wisdom.",
                "The hidden university of those who seek truth."
            ]
        };

        let favorites = new Set();

        function generateTaverns() {
            const theme = document.getElementById('theme').value;
            const region = document.getElementById('region').value;
            const style = document.getElementById('style').value;

            const data = syllables[region];
            const names = new Set();

            // Generate 50 unique names using region + theme logic
            while (names.size < 50) {
                let name = "";
                const rand = Math.random();

                if (style === 'literal' || (rand > 0.5 && style !== 'punny')) {
                    // Prefix + Noun format
                    const prefix = data.prefix[hashCode(`${theme}${region}${names.size}`) % data.prefix.length];
                    const noun = data.noun[hashCode(`${theme}${region}${names.size}a`) % data.noun.length];
                    name = `The ${prefix} ${noun}`;
                } else if (style === 'mysterious' || rand > 0.3) {
                    // Noun + Suffix format
                    const noun = data.noun[hashCode(`${theme}${region}${names.size}b`) % data.noun.length];
                    const suffix = data.suffix[hashCode(`${theme}${region}${names.size}c`) % data.suffix.length];
                    name = `${noun} ${suffix}`;
                } else {
                    // Prefix + Noun + Suffix for longer names
                    const prefix = data.prefix[hashCode(`${theme}${region}${names.size}d`) % data.prefix.length];
                    const noun = data.noun[hashCode(`${theme}${region}${names.size}e`) % data.noun.length];
                    const suffix = data.suffix[hashCode(`${theme}${region}${names.size}f`) % data.suffix.length];
                    name = `The ${prefix} ${noun}`;
                }

                // Avoid duplicates
                if (!names.has(name)) {
                    names.add(name);
                }
            }

            // Get lore templates for theme
            const lores = loreTemplates[theme];

            // Render output
            const output = document.getElementById('output');
            output.innerHTML = '';
            let index = 0;

            names.forEach(name => {
                const lore = lores[hashCode(name) % lores.length];
                const item = document.createElement('div');
                item.className = 'tavern-item';
                if (favorites.has(name)) item.classList.add('favorite');

                item.innerHTML = `
                    <div class="tavern-name">${name}</div>
                    <div class="tavern-lore">${lore}</div>
                `;

                item.onclick = (e) => {
                    e.stopPropagation();
                    if (favorites.has(name)) {
                        favorites.delete(name);
                        item.classList.remove('favorite');
                    } else {
                        favorites.add(name);
                        item.classList.add('favorite');
                    }
                    updateStats();
                };

                output.appendChild(item);
                index++;
            });

            document.getElementById('stats').style.display = 'grid';
            updateStats();
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = document.querySelectorAll('.tavern-item').length;
            document.getElementById('favCount').textContent = favorites.size;
        }

        function exportNames() {
            const items = Array.from(document.querySelectorAll('.tavern-item'));
            if (items.length === 0) {
                alert('Generate tavern names first!');
                return;
            }

            let csv = '';
            items.forEach(item => {
                const name = item.querySelector('.tavern-name').textContent.replace(/★ /, '');
                const lore = item.querySelector('.tavern-lore').textContent;
                const isFav = favorites.has(name) ? '★' : '';
                csv += `${isFav} "${name}","${lore}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'tavern_names.csv';
            a.click();
            URL.revokeObjectURL(url);
        }

        // Simple hash function for deterministic selection
        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash; // Convert to 32bit integer
            }
            return Math.abs(hash);
        }
    </script>
</body>
</html>
