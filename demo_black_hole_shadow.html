<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Hole Shadow</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a15 0%, #1a1a2e 100%);
            font-family: 'Space Mono', monospace;
            color: #7dd3fc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            max-width: 1400px;
            width: 100%;
            background: rgba(20, 30, 50, 0.8);
            border-radius: 12px;
            padding: 30px;
            border: 1px solid #1e4d6d;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2em;
            color: #4da8da;
            text-align: center;
            grid-column: 1 / -1;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-group {
            background: rgba(10, 30, 50, 0.6);
            border: 1px solid #1e4d6d;
            border-radius: 8px;
            padding: 15px;
        }

        .control-group label {
            display: block;
            font-size: 0.85em;
            font-weight: 700;
            color: #2d9d5f;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #4da8da;
        }

        .control-value {
            font-size: 0.9em;
            color: #4da8da;
            margin-top: 6px;
            font-weight: 700;
        }

        .toggle-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        button {
            background: rgba(77, 168, 218, 0.15);
            border: 1px solid #4da8da;
            color: #4da8da;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: 'Space Mono', monospace;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover {
            background: rgba(77, 168, 218, 0.25);
            border-color: #7dd3fc;
            color: #7dd3fc;
        }

        button.active {
            background: #4da8da;
            color: #0a0a15;
        }

        .stat-box {
            background: rgba(45, 157, 95, 0.1);
            border-left: 3px solid #2d9d5f;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-top: 3px;
        }

        .stat-label {
            color: #9dd3c0;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .stat-value {
            color: #4da8da;
            font-weight: 700;
            font-size: 0.95em;
            margin-top: 2px;
        }

        .canvas-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        canvas {
            background: #0a0a15;
            border: 1px solid #1e4d6d;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
            display: block;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }

            h1 {
                grid-column: 1;
            }

            .sidebar {
                grid-column: 1;
            }

            .canvas-container {
                grid-column: 1;
            }
        }

        .info-text {
            font-size: 0.8em;
            color: #7dd3fc;
            text-align: center;
            opacity: 0.8;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌌 Black Hole Shadow</h1>

        <div class="sidebar">
            <div class="control-group">
                <label for="massSlider">Black Hole Mass (M☉)</label>
                <input type="range" id="massSlider" min="3" max="10" step="0.1" value="3">
                <div class="control-value" id="massValue">3.0 M☉</div>
            </div>

            <div class="control-group">
                <label for="distanceSlider">Observer Distance (light-years)</label>
                <input type="range" id="distanceSlider" min="1" max="1000" step="10" value="10">
                <div class="control-value" id="distanceValue">10 ly</div>
            </div>

            <div class="control-group">
                <label>Event Horizon</label>
                <div class="stat-box">
                    <div class="stat-label">Schwarzschild Radius</div>
                    <div class="stat-value" id="schwarzschildValue">9.42 km</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Escape Velocity</div>
                    <div class="stat-value">299,792 km/s</div>
                </div>
            </div>

            <div class="control-group">
                <label>Lensing Effect</label>
                <div class="stat-box">
                    <div class="stat-label">Light Bending Angle</div>
                    <div class="stat-value" id="bendingAngle">2.0°</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Photon Sphere</div>
                    <div class="stat-value" id="photonSphereValue">14.13 km</div>
                </div>
            </div>

            <div class="control-group">
                <label>Visualization Options</label>
                <div class="toggle-group">
                    <button id="togglePhotonSphere" class="active">Photon Sphere</button>
                    <button id="toggleLensingPaths" class="active">Lensing Paths</button>
                    <button id="toggleAccretionDisk">Accretion Disk</button>
                    <button id="toggleEinsteinRing">Einstein Ring</button>
                    <button id="toggleGridWarp">Grid Warp</button>
                </div>
            </div>

            <div class="info-text">
                Drag sliders to explore gravitational lensing around black holes. Real Schwarzschild metric physics.
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = Math.min(900, container.clientWidth - 20);
            canvas.height = canvas.width;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Physics constants
        const G = 6.674e-11;
        const c = 3e8;
        const M_sun = 1.989e30; // kg
        const ly = 9.461e15; // light-year in meters

        // UI elements
        const massSlider = document.getElementById('massSlider');
        const distanceSlider = document.getElementById('distanceSlider');
        const massValue = document.getElementById('massValue');
        const distanceValue = document.getElementById('distanceValue');
        const schwarzschildValue = document.getElementById('schwarzschildValue');
        const bendingAngle = document.getElementById('bendingAngle');
        const photonSphereValue = document.getElementById('photonSphereValue');
        
        // Toggle buttons
        const togglePhotonSphere = document.getElementById('togglePhotonSphere');
        const toggleLensingPaths = document.getElementById('toggleLensingPaths');
        const toggleAccretionDisk = document.getElementById('toggleAccretionDisk');
        const toggleEinsteinRing = document.getElementById('toggleEinsteinRing');
        const toggleGridWarp = document.getElementById('toggleGridWarp');

        // State
        let state = {
            showPhotonSphere: true,
            showLensingPaths: true,
            showAccretionDisk: false,
            showEinsteinRing: false,
            showGridWarp: false
        };

        // Toggle handlers
        togglePhotonSphere.addEventListener('click', () => {
            state.showPhotonSphere = !state.showPhotonSphere;
            togglePhotonSphere.classList.toggle('active');
        });
        toggleLensingPaths.addEventListener('click', () => {
            state.showLensingPaths = !state.showLensingPaths;
            toggleLensingPaths.classList.toggle('active');
        });
        toggleAccretionDisk.addEventListener('click', () => {
            state.showAccretionDisk = !state.showAccretionDisk;
            toggleAccretionDisk.classList.toggle('active');
        });
        toggleEinsteinRing.addEventListener('click', () => {
            state.showEinsteinRing = !state.showEinsteinRing;
            toggleEinsteinRing.classList.toggle('active');
        });
        toggleGridWarp.addEventListener('click', () => {
            state.showGridWarp = !state.showGridWarp;
            toggleGridWarp.classList.toggle('active');
        });

        // Calculate Schwarzschild radius
        function schwarzschildRadius(mass_solar) {
            const mass = mass_solar * M_sun;
            return (2 * G * mass) / (c * c) / 1000; // convert to km
        }

        // Calculate photon sphere radius (1.5 * r_s)
        function photonSphereRadius(mass_solar) {
            return 1.5 * schwarzschildRadius(mass_solar);
        }

        // Calculate light bending angle
        function lightBendingAngle(mass_solar, distance_ly) {
            const distance = distance_ly * ly;
            const mass = mass_solar * M_sun;
            const numerator = 2 * G * mass;
            const denominator = c * c * distance;
            const radians = numerator / denominator;
            return (radians * 180) / Math.PI;
        }

        // Update UI values
        function updateStats() {
            const mass = parseFloat(massSlider.value);
            const distance = parseFloat(distanceSlider.value);

            massValue.textContent = mass.toFixed(1) + ' M☉';
            distanceValue.textContent = distance.toFixed(0) + ' ly';

            const rs = schwarzschildRadius(mass);
            schwarzschildValue.textContent = rs.toFixed(2) + ' km';

            const ps = photonSphereRadius(mass);
            photonSphereValue.textContent = ps.toFixed(2) + ' km';

            const angle = lightBendingAngle(mass, distance);
            bendingAngle.textContent = angle.toFixed(1) + '°';
        }

        massSlider.addEventListener('input', updateStats);
        distanceSlider.addEventListener('input', updateStats);

        // Drawing functions
        function drawBackground() {
            ctx.fillStyle = '#0a0a15';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Starfield
            ctx.fillStyle = '#ffffff';
            ctx.globalAlpha = 0.6;
            for (let i = 0; i < 200; i++) {
                const x = Math.sin(i * 1.23) * canvas.width;
                const y = Math.cos(i * 0.87) * canvas.height;
                const size = Math.sin(i * 0.5) * 1.5 + 0.5;
                ctx.fillRect(x, y, size, size);
            }
            ctx.globalAlpha = 1;
        }

        function drawGridWarp() {
            if (!state.showGridWarp) return;

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const gridSize = 40;
            const mass = parseFloat(massSlider.value);
            const rs = schwarzschildRadius(mass);
            const maxRadius = Math.min(canvas.width, canvas.height) / 2;

            ctx.strokeStyle = 'rgba(30, 77, 109, 0.3)';
            ctx.lineWidth = 0.8;

            // Vertical lines
            for (let x = -canvas.width; x < canvas.width * 2; x += gridSize) {
                ctx.beginPath();
                for (let y = -canvas.height; y < canvas.height * 2; y += 5) {
                    const dx = x - centerX;
                    const dy = y - centerY;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    // Warp grid near black hole
                    const warp = Math.max(0, 1 - (dist / (maxRadius * 0.8)));
                    const angle = Math.atan2(dy, dx);
                    const warpedX = centerX + Math.cos(angle) * (dist - warp * 20);
                    const warpedY = centerY + Math.sin(angle) * (dist - warp * 20);

                    if (y === -canvas.height) ctx.moveTo(warpedX, warpedY);
                    else ctx.lineTo(warpedX, warpedY);
                }
                ctx.stroke();
            }
        }

        function drawEventHorizon() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const mass = parseFloat(massSlider.value);
            const rs = schwarzschildRadius(mass);
            const maxRadius = Math.min(canvas.width, canvas.height) / 2;
            const displayRadius = (rs / (rs + 100)) * maxRadius * 0.3;

            // Event horizon (black circle)
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(centerX, centerY, displayRadius, 0, Math.PI * 2);
            ctx.fill();

            // Shimmer effect
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, displayRadius, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawPhotonSphere() {
            if (!state.showPhotonSphere) return;

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const mass = parseFloat(massSlider.value);
            const ps = photonSphereRadius(mass);
            const rs = schwarzschildRadius(mass);
            const maxRadius = Math.min(canvas.width, canvas.height) / 2;
            const psDisplayRadius = (ps / (rs + 100)) * maxRadius * 0.3;

            ctx.strokeStyle = 'rgba(77, 168, 218, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(centerX, centerY, psDisplayRadius, 0, Math.PI * 2);
            ctx.stroke();

            // Glow
            ctx.strokeStyle = 'rgba(77, 168, 218, 0.1)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(centerX, centerY, psDisplayRadius, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawLensingPaths() {
            if (!state.showLensingPaths) return;

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const mass = parseFloat(massSlider.value);
            const distance = parseFloat(distanceSlider.value);
            const rs = schwarzschildRadius(mass);
            const maxRadius = Math.min(canvas.width, canvas.height) / 2;
            const displayRadius = (rs / (rs + 100)) * maxRadius * 0.3;

            const rayCount = 100;
            const angle = lightBendingAngle(mass, distance);

            for (let i = 0; i < rayCount; i++) {
                const t = i / rayCount;
                const startAngle = t * Math.PI * 2;
                const rayLength = maxRadius * 1.2;

                const startX = centerX + Math.cos(startAngle) * rayLength;
                const startY = centerY + Math.sin(startAngle) * rayLength;

                // Ray path with bending
                ctx.strokeStyle = `rgba(255, 255, 255, ${0.3 - t * 0.2})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(startX, startY);

                let x = startX;
                let y = startY;
                const steps = 50;
                for (let step = 0; step < steps; step++) {
                    const dx = centerX - x;
                    const dy = centerY - y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < displayRadius + 10) break; // Stop at event horizon

                    // Gravity-based ray bending
                    const factor = Math.max(0, 1 - (dist / (maxRadius * 0.7)));
                    const bendForce = factor * angle * 0.02;

                    const towardBHAngle = Math.atan2(dy, dx);
                    x += Math.cos(towardBHAngle - bendForce) * rayLength / steps;
                    y += Math.sin(towardBHAngle - bendForce) * rayLength / steps;

                    ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
        }

        function drawAccretionDisk() {
            if (!state.showAccretionDisk) return;

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const mass = parseFloat(massSlider.value);
            const rs = schwarzschildRadius(mass);
            const maxRadius = Math.min(canvas.width, canvas.height) / 2;
            const diskRadius = (6 * rs / (rs + 100)) * maxRadius * 0.3;

            // Rotating disk
            const time = Date.now() / 1000;
            const rotation = time * 0.5;

            // Disk ring
            ctx.fillStyle = 'rgba(255, 140, 66, 0.3)';
            ctx.beginPath();
            ctx.ellipse(centerX, centerY, diskRadius, diskRadius * 0.3, rotation, 0, Math.PI * 2);
            ctx.fill();

            // Glow
            ctx.strokeStyle = 'rgba(255, 140, 66, 0.5)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(centerX, centerY, diskRadius, diskRadius * 0.3, rotation, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawEinsteinRing() {
            if (!state.showEinsteinRing) return;

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const mass = parseFloat(massSlider.value);
            const distance = parseFloat(distanceSlider.value);
            const rs = schwarzschildRadius(mass);
            const maxRadius = Math.min(canvas.width, canvas.height) / 2;

            // Einstein ring radius (approximate)
            const einsteinRingRadius = maxRadius * 0.5;

            ctx.strokeStyle = 'rgba(157, 78, 221, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(centerX, centerY, einsteinRingRadius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(157, 78, 221, 0.15)';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.arc(centerX, centerY, einsteinRingRadius, 0, Math.PI * 2);
            ctx.stroke();
        }

        function draw() {
            drawBackground();
            drawGridWarp();
            drawLensingPaths();
            drawAccretionDisk();
            drawEinsteinRing();
            drawPhotonSphere();
            drawEventHorizon();
            updateStats();

            requestAnimationFrame(draw);
        }

        // Start animation
        updateStats();
        draw();
    </script>
</body>
</html>
