<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harmonic Series Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(135deg, #0a1428 0%, #1a0f4a 100%);
      color: #7dd3fc;
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 1400px;
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 30px;
      background: rgba(10, 20, 40, 0.6);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: #4da8da;
      margin-bottom: 20px;
    }
    h2 {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      color: #4da8da;
      margin-top: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      font-size: 12px;
      color: #52c41a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: #1a3a5a;
      border-radius: 3px;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      background: #4da8da;
      border-radius: 50%;
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: #4da8da;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }
    .display-value {
      font-size: 12px;
      color: #52c41a;
    }
    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    button {
      padding: 10px 12px;
      background: #1a3a5a;
      color: #7dd3fc;
      border: 1px solid #4da8da;
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    button:hover {
      background: #2a4a6a;
      border-color: #52c41a;
    }
    button.active {
      background: #4da8da;
      color: #0a1428;
      border-color: #52c41a;
      box-shadow: 0 0 12px rgba(77, 168, 218, 0.5);
    }
    .stats-box {
      background: rgba(26, 58, 90, 0.5);
      border-left: 3px solid #4da8da;
      padding: 12px;
      border-radius: 4px;
      margin-top: 12px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 6px;
    }
    .stat-row:last-child {
      margin-bottom: 0;
    }
    .stat-label {
      color: #7dd3fc;
    }
    .stat-value {
      color: #52c41a;
      font-weight: bold;
    }
    .canvas-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    canvas {
      background: rgba(10, 20, 40, 0.8);
      border-radius: 8px;
      border: 1px solid #4da8da;
    }
    .harmonic-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .harmonic-btn {
      padding: 8px;
      font-size: 10px;
      font-weight: bold;
    }
    @media (max-width: 1024px) {
      .container {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .button-group {
        grid-template-columns: repeat(3, 1fr);
      }
      .harmonic-buttons {
        grid-template-columns: repeat(8, 1fr);
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="sidebar">
    <h1>⚡ Harmonics</h1>
    
    <div class="control-group">
      <label>Fundamental Frequency (Hz)</label>
      <input type="range" id="fundamentalSlider" min="50" max="500" value="110" step="1">
      <div class="display-value" id="fundamentalDisplay">110 Hz (A2)</div>
    </div>

    <h2>Tuning System</h2>
    <div class="button-group">
      <button class="tuning-btn active" data-tuning="et">Equal Temp</button>
      <button class="tuning-btn" data-tuning="just">Just Inton</button>
      <button class="tuning-btn" data-tuning="pyt">Pythagorean</button>
    </div>

    <h2>Harmonics (1–16)</h2>
    <div class="harmonic-buttons" id="harmonicButtons"></div>

    <div class="stats-box">
      <div class="stat-row">
        <span class="stat-label">Selected:</span>
        <span class="stat-value" id="harmonicNum">1</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Frequency:</span>
        <span class="stat-value" id="harmonicFreq">110 Hz</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Ratio:</span>
        <span class="stat-value" id="harmonicRatio">1:1</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Cents:</span>
        <span class="stat-value" id="harmonicCents">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">System:</span>
        <span class="stat-value" id="tuningDisplay">ET</span>
      </div>
    </div>

    <h2>Info</h2>
    <div class="stats-box" style="border-left-color: #52c41a;">
      <div style="font-size: 11px; line-height: 1.6;">
        Click harmonics to select. Drag fundamental slider to change base frequency. Click tuning buttons to switch systems.
      </div>
    </div>
  </div>

  <div class="canvas-container">
    <div>
      <canvas id="spectrumCanvas" width="800" height="300"></canvas>
    </div>
    <div>
      <canvas id="waveformCanvas" width="800" height="150"></canvas>
    </div>
  </div>
</div>

<script>
// State
let state = {
  fundamental: 110,
  selectedHarmonic: 1,
  tuning: 'et',
  activeHarmonics: new Set([1])
};

const tuningNames = {
  et: 'Equal Temperament',
  just: 'Just Intonation',
  pyt: 'Pythagorean'
};

const noteNames = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];

function getHarmonicFreq(fundamental, harmonic) {
  return fundamental * harmonic;
}

function getCentsOffset(freq1, freq2) {
  if (freq2 <= 0) return 0;
  return 1200 * Math.log2(freq2 / freq1);
}

function getTuningCents(harmonic, tuning) {
  // Relative to fundamental
  if (harmonic === 1) return 0;
  
  if (tuning === 'et') {
    // Equal temperament: each semitone = 100 cents
    // Find closest note in 12-tone scale
    const ratio = Math.log2(harmonic);
    const semitones = Math.round(ratio * 12);
    return semitones * 100;
  } else if (tuning === 'just') {
    // Just intonation: pure integer ratios
    const justRatios = {
      2: 1200,    // octave
      3: 1901.96, // perfect fifth + octave
      4: 2400,    // 2 octaves
      5: 2786.31, // major third + 2 octaves
      6: 3101.96, // perfect fifth + 2 octaves
      7: 3368.83,
      8: 3600,    // 3 octaves
      9: 3803.91,
      10: 3986.31,
      11: 4150.63,
      12: 4301.96,
      13: 4440.53,
      14: 4568.83,
      15: 4688.27,
      16: 4800
    };
    return justRatios[harmonic] || 1200 * Math.log2(harmonic);
  } else if (tuning === 'pyt') {
    // Pythagorean: stacked perfect fifths (3:2)
    const pytRatios = {
      2: 1200,
      3: 1901.96, // 3:2 (perfect fifth)
      4: 2400,
      5: 2790.22, // Pythagorean major third (81:64)
      6: 3101.96,
      7: 3370.78,
      8: 3600,
      9: 3803.91,
      10: 3990.22,
      11: 4160.38,
      12: 4301.96,
      13: 4443.54,
      14: 4570.78,
      15: 4690.22,
      16: 4800
    };
    return pytRatios[harmonic] || 1200 * Math.log2(harmonic);
  }
}

// Initialize harmonic buttons
function initHarmonics() {
  const container = document.getElementById('harmonicButtons');
  for (let i = 1; i <= 16; i++) {
    const btn = document.createElement('button');
    btn.className = 'harmonic-btn';
    btn.textContent = i;
    btn.onclick = () => selectHarmonic(i);
    if (i === 1) btn.classList.add('active');
    container.appendChild(btn);
  }
}

function selectHarmonic(h) {
  state.selectedHarmonic = h;
  state.activeHarmonics.add(h);
  updateDisplay();
  renderSpectrum();
  renderWaveform();
}

function updateDisplay() {
  const freq = getHarmonicFreq(state.fundamental, state.selectedHarmonic);
  const cents = getTuningCents(state.selectedHarmonic, state.tuning);
  
  document.getElementById('fundamentalDisplay').textContent = 
    state.fundamental + ' Hz (' + getNoteFromFreq(state.fundamental) + ')';
  document.getElementById('harmonicNum').textContent = state.selectedHarmonic;
  document.getElementById('harmonicFreq').textContent = freq.toFixed(2) + ' Hz';
  document.getElementById('harmonicRatio').textContent = state.selectedHarmonic + ':1';
  document.getElementById('harmonicCents').textContent = cents.toFixed(2) + ' ¢';
  document.getElementById('tuningDisplay').textContent = 
    state.tuning === 'et' ? 'ET' : state.tuning === 'just' ? 'Just' : 'Pyt';
  
  // Update active button
  document.querySelectorAll('.harmonic-btn').forEach((btn, idx) => {
    btn.classList.toggle('active', idx + 1 === state.selectedHarmonic);
  });
}

function getNoteFromFreq(freq) {
  const a4 = 440;
  const semitones = 12 * Math.log2(freq / a4);
  const octave = Math.floor(semitones / 12) + 4;
  const note = noteNames[Math.round(semitones) % 12];
  return note + octave;
}

// Spectrum visualization
function renderSpectrum() {
  const canvas = document.getElementById('spectrumCanvas');
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  
  ctx.fillStyle = 'rgba(10, 20, 40, 0.8)';
  ctx.fillRect(0, 0, w, h);
  
  // Draw grid
  ctx.strokeStyle = 'rgba(77, 168, 218, 0.2)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 16; i++) {
    const x = (i / 16) * w;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, h);
    ctx.stroke();
  }
  
  // Harmonics
  const barWidth = w / 17;
  const colors = [
    '#ff0000', '#ff9900', '#ffff00', '#52c41a', '#4da8da', 
    '#0066ff', '#8800ff', '#ff1493', '#ff4500', '#00ff7f',
    '#00ced1', '#1e90ff', '#ff00ff', '#ff6347', '#00bfff', '#ff69b4'
  ];
  
  for (let i = 1; i <= 16; i++) {
    const x = barWidth * (i - 0.5);
    const ampDecay = Math.exp(-0.2 * (i - 1)); // Exponential decay
    const barHeight = ampDecay * (h - 40);
    const barX = x - barWidth * 0.4;
    
    ctx.fillStyle = colors[i - 1] || '#4da8da';
    ctx.fillRect(barX, h - barHeight - 20, barWidth * 0.8, barHeight);
    
    // Highlight selected
    if (i === state.selectedHarmonic) {
      ctx.strokeStyle = '#ffff00';
      ctx.lineWidth = 3;
      ctx.strokeRect(barX - 2, h - barHeight - 22, barWidth * 0.8 + 4, barHeight + 4);
    }
    
    // Labels
    ctx.fillStyle = '#7dd3fc';
    ctx.font = '11px Space Mono';
    ctx.textAlign = 'center';
    ctx.fillText(i, x, h - 5);
  }
  
  // Axes
  ctx.strokeStyle = '#4da8da';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, h - 20);
  ctx.lineTo(w, h - 20);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(barWidth * 0.5, 0);
  ctx.lineTo(barWidth * 0.5, h - 20);
  ctx.stroke();
}

// Waveform visualization
function renderWaveform() {
  const canvas = document.getElementById('waveformCanvas');
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  
  ctx.fillStyle = 'rgba(10, 20, 40, 0.8)';
  ctx.fillRect(0, 0, w, h);
  
  // Draw composite waveform
  const freq = getHarmonicFreq(state.fundamental, state.selectedHarmonic);
  const duration = 1 / state.fundamental * 4; // 4 periods of fundamental
  const samples = w;
  
  ctx.strokeStyle = '#4da8da';
  ctx.lineWidth = 2;
  ctx.beginPath();
  
  for (let x = 0; x < w; x++) {
    const t = (x / w) * duration;
    let y = 0;
    
    // Sum all active harmonics
    for (let h of state.activeHarmonics) {
      const hfreq = getHarmonicFreq(state.fundamental, h);
      const amp = Math.exp(-0.15 * (h - 1)); // Decay
      y += amp * Math.sin(2 * Math.PI * hfreq * t);
    }
    
    // Normalize and draw
    y = (y / state.activeHarmonics.size) * (h * 0.3);
    const py = h / 2 - y;
    
    if (x === 0) ctx.moveTo(x, py);
    else ctx.lineTo(x, py);
  }
  ctx.stroke();
  
  // Center line
  ctx.strokeStyle = 'rgba(77, 168, 218, 0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, h / 2);
  ctx.lineTo(w, h / 2);
  ctx.stroke();
  
  // Label
  ctx.fillStyle = '#7dd3fc';
  ctx.font = '11px Space Mono';
  ctx.textAlign = 'left';
  ctx.fillText('Composite Waveform (' + state.activeHarmonics.size + ' harmonic' + (state.activeHarmonics.size !== 1 ? 's' : '') + ')', 10, 15);
}

// Event listeners
document.getElementById('fundamentalSlider').addEventListener('input', (e) => {
  state.fundamental = parseFloat(e.target.value);
  updateDisplay();
  renderSpectrum();
  renderWaveform();
});

document.querySelectorAll('.tuning-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('.tuning-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.tuning = btn.dataset.tuning;
    updateDisplay();
    renderSpectrum();
    renderWaveform();
  });
});

// Init
initHarmonics();
updateDisplay();
renderSpectrum();
renderWaveform();
</script>

</body>
</html>
