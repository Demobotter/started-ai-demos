<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milestone Hunter</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
        }
        h1 {
            font-family: 'Merriweather', serif;
            font-size: 2.5rem;
            margin-bottom: 8px;
            color: #FFB700;
        }
        .subtitle {
            font-size: 1rem;
            color: #7fb3ff;
        }
        .controls {
            background: rgba(30, 35, 50, 0.6);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 40px;
            border: 1px solid rgba(127, 179, 255, 0.2);
        }
        .filter-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #7fb3ff;
            font-weight: 600;
        }
        select, input {
            padding: 10px;
            background: rgba(15, 20, 25, 0.8);
            border: 1px solid #7fb3ff;
            color: #e0e0e0;
            border-radius: 4px;
            font-size: 0.95rem;
        }
        input::placeholder {
            color: #555;
        }
        .timeline-container {
            position: relative;
            padding: 40px 0;
        }
        .timeline-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #FFB700;
            transform: translateX(-50%);
        }
        .milestone {
            margin-bottom: 50px;
            position: relative;
            opacity: 0;
            animation: slideIn 0.6s ease-out forwards;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .milestone:nth-child(odd) {
            margin-left: 0;
            margin-right: 52%;
            text-align: right;
        }
        .milestone:nth-child(even) {
            margin-left: 52%;
            margin-right: 0;
            text-align: left;
        }
        .milestone-dot {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #7fb3ff;
            border: 3px solid #FFB700;
            border-radius: 50%;
            right: -48%;
            top: 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .milestone:nth-child(even) .milestone-dot {
            left: -48%;
            right: auto;
        }
        .milestone-dot:hover {
            transform: scale(1.3);
            background: #FFB700;
        }
        .milestone-card {
            background: rgba(30, 35, 50, 0.8);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #7fb3ff;
            cursor: pointer;
            transition: all 0.3s ease;
            max-width: 100%;
        }
        .milestone:nth-child(even) .milestone-card {
            border-left: none;
            border-right: 4px solid #7fb3ff;
        }
        .milestone-card:hover {
            background: rgba(40, 50, 70, 0.9);
            transform: translateX(-10px);
        }
        .milestone:nth-child(even) .milestone-card:hover {
            transform: translateX(10px);
        }
        .milestone-year {
            font-family: 'Merriweather', serif;
            font-size: 1.8rem;
            color: #FFB700;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .milestone-category {
            display: inline-block;
            background: #7fb3ff;
            color: #0f1419;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .milestone-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .milestone-details {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(127, 179, 255, 0.3);
            font-size: 0.95rem;
            color: #b0b0b0;
        }
        .milestone-details.active {
            display: block;
        }
        .detail-row {
            margin-bottom: 8px;
        }
        .detail-label {
            color: #7fb3ff;
            font-weight: 600;
            display: inline-block;
            width: 80px;
        }
        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            font-size: 1.1rem;
        }
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
            .filter-row {
                grid-template-columns: 1fr;
            }
            .timeline-line {
                left: 20px;
            }
            .milestone {
                margin-left: 0 !important;
                margin-right: 0 !important;
                text-align: left !important;
                padding-left: 80px;
            }
            .milestone-dot {
                left: 5px !important;
                right: auto !important;
            }
            .milestone-card {
                border-left: 4px solid #7fb3ff !important;
                border-right: none;
            }
            .milestone-card:hover {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🕰️ Milestone Hunter</h1>
            <p class="subtitle">Explore pivotal moments in history 1800–present</p>
        </header>

        <div class="controls">
            <div class="filter-row">
                <div class="filter-group">
                    <label for="centuryFilter">Century</label>
                    <select id="centuryFilter">
                        <option value="">All Centuries</option>
                        <option value="1800">1800s</option>
                        <option value="1900">1900s</option>
                        <option value="2000">2000s</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="categoryFilter">Category</label>
                    <select id="categoryFilter">
                        <option value="">All Categories</option>
                        <option value="Science">Science</option>
                        <option value="Politics">Politics</option>
                        <option value="Technology">Technology</option>
                        <option value="Culture">Culture</option>
                        <option value="Transport">Transport</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="keywordSearch">Keyword Search</label>
                    <input type="text" id="keywordSearch" placeholder="e.g., moon, war, invention">
                </div>
            </div>
        </div>

        <div class="timeline-container">
            <div class="timeline-line"></div>
            <div id="timelineContent"></div>
        </div>
        <div id="noResults" class="no-results" style="display:none;">No milestones match your filters.</div>
    </div>

    <script>
        const milestones = [
            {
                year: 1859,
                title: "Darwin's Origin of Species",
                category: "Science",
                location: "London, England",
                figures: "Charles Darwin",
                impact: "Revolutionary theory of evolution by natural selection fundamentally changed our understanding of life's origins."
            },
            {
                year: 1876,
                title: "Telephone Invented",
                category: "Technology",
                location: "Boston, USA",
                figures: "Alexander Graham Bell",
                impact: "First practical electrical telephone enabled real-time long-distance communication across continents."
            },
            {
                year: 1903,
                title: "First Powered Flight",
                category: "Transport",
                location: "Kitty Hawk, North Carolina, USA",
                figures: "Wright Brothers (Orville & Wilbur)",
                impact: "12-second flight proved powered heavier-than-air flight possible, launching the aviation age."
            },
            {
                year: 1905,
                title: "Theory of Relativity",
                category: "Science",
                location: "Bern, Switzerland",
                figures: "Albert Einstein",
                impact: "E=mc² and relativity fundamentally reshaped physics and our understanding of space, time, and energy."
            },
            {
                year: 1945,
                title: "End of World War II",
                category: "Politics",
                location: "Europe & Pacific",
                figures: "Allied Forces",
                impact: "Global conflict ended; United Nations formed, reshaping international order and geopolitics."
            },
            {
                year: 1969,
                title: "Apollo 11 Moon Landing",
                category: "Science",
                location: "Moon",
                figures: "Neil Armstrong, Buzz Aldrin, Michael Collins",
                impact: "First humans set foot on the moon, defining the Space Age and inspiring global scientific achievement."
            },
            {
                year: 1989,
                title: "Fall of the Berlin Wall",
                category: "Politics",
                location: "Berlin, Germany",
                figures: "East German Citizens",
                impact: "Symbol of Cold War's end; Germany reunified and Eastern Europe moved toward democracy."
            },
            {
                year: 1991,
                title: "World Wide Web Goes Public",
                category: "Technology",
                location: "Geneva, Switzerland",
                figures: "Tim Berners-Lee",
                impact: "Internet became publicly accessible, launching the digital revolution and transforming global communication."
            },
            {
                year: 1997,
                title: "Dolly the Sheep Cloned",
                category: "Science",
                location: "Edinburgh, Scotland",
                figures: "Ian Wilmut, Roslin Institute",
                impact: "First mammal cloned from adult cell; opened ethical debates and advanced genetic research."
            },
            {
                year: 2001,
                title: "Wikipedia Launched",
                category: "Technology",
                location: "Online",
                figures: "Jimmy Wales, Larry Sanger",
                impact: "Free collaborative encyclopedia democratized access to human knowledge globally."
            },
            {
                year: 2007,
                title: "iPhone Released",
                category: "Technology",
                location: "Cupertino, USA",
                figures: "Steve Jobs, Apple",
                impact: "Touchscreen smartphone revolutionized mobile computing and connected the world's population."
            },
            {
                year: 2012,
                title: "Higgs Boson Discovered",
                category: "Science",
                location: "Geneva, Switzerland (CERN)",
                figures: "CERN Scientists",
                impact: "Confirmed existence of Higgs boson; validated Standard Model of particle physics."
            },
            {
                year: 2016,
                title: "AlphaGo Defeats Lee Sedol",
                category: "Technology",
                location: "Seoul, South Korea",
                figures: "DeepMind (Google), Lee Sedol",
                impact: "AI defeated world Go champion; demonstrated deep learning's power in strategic games."
            },
            {
                year: 2020,
                title: "COVID-19 Pandemic",
                category: "Science",
                location: "Global",
                figures: "Healthcare Workers, Scientists",
                impact: "Unprecedented global crisis accelerated vaccine development and reshaped work, education, and society."
            },
            {
                year: 2023,
                title: "ChatGPT Goes Viral",
                category: "Technology",
                location: "Online, Global",
                figures: "OpenAI",
                impact: "Large language models entered public consciousness; sparked AI revolution and transformed knowledge work."
            }
        ];

        function renderTimeline(filtered) {
            const content = document.getElementById('timelineContent');
            const noResults = document.getElementById('noResults');
            
            if (filtered.length === 0) {
                content.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }
            
            noResults.style.display = 'none';
            content.innerHTML = filtered.map((m, i) => `
                <div class="milestone" style="animation-delay: ${i * 0.08}s;">
                    <div class="milestone-dot"></div>
                    <div class="milestone-card" onclick="toggleDetails(this)">
                        <div class="milestone-year">${m.year}</div>
                        <div class="milestone-category">${m.category}</div>
                        <div class="milestone-title">${m.title}</div>
                        <div class="milestone-details" id="details-${i}">
                            <div class="detail-row">
                                <span class="detail-label">Location:</span> ${m.location}
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Figures:</span> ${m.figures}
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Impact:</span> ${m.impact}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleDetails(element) {
            const details = element.querySelector('.milestone-details');
            details.classList.toggle('active');
        }

        function filterMilestones() {
            const century = document.getElementById('centuryFilter').value;
            const category = document.getElementById('categoryFilter').value;
            const keyword = document.getElementById('keywordSearch').value.toLowerCase();

            let filtered = milestones.filter(m => {
                const matchCentury = !century || Math.floor(m.year / 100) * 100 === parseInt(century);
                const matchCategory = !category || m.category === category;
                const matchKeyword = !keyword || 
                    m.title.toLowerCase().includes(keyword) ||
                    m.impact.toLowerCase().includes(keyword) ||
                    m.location.toLowerCase().includes(keyword);
                
                return matchCentury && matchCategory && matchKeyword;
            });

            filtered.sort((a, b) => a.year - b.year);
            renderTimeline(filtered);
        }

        document.getElementById('centuryFilter').addEventListener('change', filterMilestones);
        document.getElementById('categoryFilter').addEventListener('change', filterMilestones);
        document.getElementById('keywordSearch').addEventListener('input', filterMilestones);

        // Initial render
        filterMilestones();
    </script>
</body>
</html>
