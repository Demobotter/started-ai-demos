<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Place Name Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0f1729 0%, #1a2847 100%);
      color: #e0e7ff;
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: rgba(20, 30, 60, 0.8);
      border: 1px solid #4da8da;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5em;
      margin-bottom: 10px;
      color: #64b5f6;
      text-align: center;
    }
    .tagline {
      text-align: center;
      color: #a0aec0;
      margin-bottom: 30px;
      font-size: 0.95em;
    }
    .control-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      margin-bottom: 30px;
    }
    @media (max-width: 600px) {
      .control-grid {
        grid-template-columns: 1fr;
      }
    }
    .control-group {
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: bold;
      color: #64b5f6;
      margin-bottom: 8px;
      font-size: 0.95em;
    }
    select, input[type="range"] {
      padding: 8px 12px;
      background: rgba(45, 85, 130, 0.5);
      border: 1px solid #4da8da;
      border-radius: 6px;
      color: #e0e7ff;
      font-family: 'Space Mono', monospace;
    }
    input[type="range"] {
      cursor: pointer;
      padding: 0;
    }
    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    button {
      flex: 1;
      padding: 12px 20px;
      background: linear-gradient(135deg, #4da8da 0%, #00bcd4 100%);
      border: none;
      border-radius: 6px;
      color: #0a1428;
      font-family: 'Space Mono', monospace;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(77, 168, 218, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
    .output-section {
      margin-top: 35px;
    }
    .output-section h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4em;
      margin-bottom: 18px;
      color: #4da8da;
    }
    .names-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .name-card {
      background: rgba(45, 85, 130, 0.4);
      border: 1px solid #4da8da;
      border-radius: 8px;
      padding: 14px;
      transition: all 0.3s;
      cursor: pointer;
    }
    .name-card:hover {
      background: rgba(77, 168, 218, 0.2);
      border-color: #00bcd4;
      transform: translateY(-2px);
    }
    .name-card.favorite {
      border-color: #ffd700;
      background: rgba(255, 215, 0, 0.1);
    }
    .name-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.3em;
      color: #64b5f6;
      margin-bottom: 6px;
    }
    .name-pronunciation {
      font-size: 0.85em;
      color: #a0aec0;
      margin-bottom: 4px;
    }
    .name-vibe {
      font-size: 0.8em;
      color: #4da8da;
      margin-bottom: 8px;
      font-style: italic;
    }
    .name-buttons {
      display: flex;
      gap: 6px;
      font-size: 0.8em;
    }
    .name-buttons button {
      flex: 1;
      padding: 4px 8px;
      font-size: 0.75em;
    }
    .favorite-btn {
      background: linear-gradient(135deg, #ffd700 0%, #ffb700 100%);
    }
    .copy-btn {
      background: linear-gradient(135deg, #4da8da 0%, #00bcd4 100%);
    }
    .download-btn {
      background: linear-gradient(135deg, #4da8da 0%, #00bcd4 100%);
    }
    .download-section {
      margin-top: 25px;
      display: flex;
      gap: 12px;
    }
    .download-section button {
      flex: 1;
    }
    .value-display {
      display: inline-block;
      color: #ffd700;
      font-weight: bold;
      margin-left: 8px;
    }
    .empty-state {
      text-align: center;
      color: #7a8ba0;
      padding: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌍 Place Names</h1>
    <p class="tagline">Generate believable town names using real phonetic patterns from different cultures.</p>

    <div class="control-grid">
      <div class="control-group">
        <label for="culture">Culture <span class="value-display" id="cultureDisplay">Nordic</span></label>
        <select id="culture">
          <option value="nordic">Nordic</option>
          <option value="celtic">Celtic</option>
          <option value="mediterranean">Mediterranean</option>
          <option value="slavic">Slavic</option>
          <option value="middle-eastern">Middle Eastern</option>
        </select>
      </div>

      <div class="control-group">
        <label for="length">Length: <span class="value-display" id="lengthDisplay">6</span> chars</label>
        <input type="range" id="length" min="4" max="12" value="6">
      </div>

      <div class="control-group">
        <label for="complexity">Phoneme Complexity</label>
        <select id="complexity">
          <option value="simple">Simple (CV patterns)</option>
          <option value="moderate" selected>Moderate</option>
          <option value="complex">Complex (clusters)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="familiarity">Familiarity: <span class="value-display" id="familiarityDisplay">50</span>%</label>
        <input type="range" id="familiarity" min="0" max="100" value="50">
      </div>
    </div>

    <div class="button-group">
      <button id="generateOne">Generate One Name</button>
      <button id="generateTen">Generate 10 Names</button>
    </div>

    <div class="download-section" id="downloadSection" style="display:none;">
      <button id="downloadTxt">📥 Download as .txt</button>
      <button id="downloadCsv">📥 Download as .csv</button>
    </div>

    <div class="output-section">
      <h2>Generated Names</h2>
      <div id="namesContainer" class="empty-state">No names generated yet. Click a button to start.</div>
    </div>
  </div>

  <script>
    // Phonotactic rules by culture (real linguistic patterns)
    const culturalPatterns = {
      nordic: {
        prefixes: ['Sv', 'Gr', 'Bj', 'St', 'Sk', 'Kn', 'Tr', 'Fl'],
        vowels: ['a', 'e', 'i', 'o', 'u', 'ö', 'ä', 'å'],
        consonants: ['b', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'm', 'n', 'p', 'r', 's', 't', 'v', 'x'],
        suffixes: ['heim', 'vik', 'stad', 'fjord', 'borg', 'berg', 'mark', 'holm', 'by'],
        vibes: ['Frosty', 'Windswept', 'Alpine', 'Coastal', 'Mountainous'],
        stress: 'first' // Germanic: stress on root
      },
      celtic: {
        prefixes: ['Bally', 'Glen', 'Drom', 'Kil', 'Lough', 'Rath', 'Tír', 'Cnoc'],
        vowels: ['a', 'e', 'i', 'o', 'u'],
        consonants: ['b', 'd', 'f', 'g', 'h', 'l', 'm', 'n', 'p', 'r', 's', 't'],
        suffixes: ['more', 'duff', 'mór', 'abhainn', 'cnoc', 'oileán', 'leac'],
        vibes: ['Misty', 'Mystical', 'Verdant', 'Rugged', 'Enchanted'],
        stress: 'first' // Celtic: initial stress
      },
      mediterranean: {
        prefixes: ['San', 'Port', 'Villa', 'Castel', 'Monte', 'Val'],
        vowels: ['a', 'e', 'i', 'o', 'u'],
        consonants: ['b', 'c', 'd', 'f', 'g', 'l', 'm', 'n', 'p', 'r', 's', 't', 'v', 'z'],
        suffixes: ['mar', 'rio', 'bella', 'grande', 'nero', 'blanca', 'ciudad', 'costa'],
        vibes: ['Sun-kissed', 'Vibrant', 'Coastal', 'Historic', 'Charming'],
        stress: 'penultimate' // Romance: penultimate stress
      },
      slavic: {
        prefixes: ['Str', 'Dr', 'Br', 'Tr', 'Gr', 'Kh', 'Tch'],
        vowels: ['a', 'e', 'i', 'o', 'u', 'y'],
        consonants: ['b', 'd', 'f', 'g', 'h', 'k', 'l', 'm', 'n', 'p', 'r', 's', 't', 'v', 'x', 'z', 'zh'],
        suffixes: ['ov', 'ova', 'ski', 'skaya', 'grad', 'gorod', 'burg'],
        vibes: ['Stark', 'Industrial', 'Historic', 'Vast', 'Resilient'],
        stress: 'penultimate'
      },
      'middle-eastern': {
        prefixes: ['Al', 'Um', 'Sidi', 'Abd', 'Jabal'],
        vowels: ['a', 'i', 'o', 'u', 'aa'],
        consonants: ['b', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'm', 'n', 'q', 'r', 's', 't', 'w', 'y', 'z', 'sh', 'kh', 'dh', 'th', 'gh'],
        suffixes: ['ah', 'ia', 'um', 'an', 'istan'],
        vibes: ['Desert', 'Sacred', 'Ancient', 'Oasis', 'Majestic'],
        stress: 'penultimate'
      }
    };

    let generatedNames = [];
    let favoriteNames = new Set(JSON.parse(localStorage.getItem('favoriteNames') || '[]'));

    // Seeded random for deterministic generation
    let seed = Date.now();
    function seededRandom() {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    }

    function pickRandom(arr, random = Math.random) {
      return arr[Math.floor(random() * arr.length)];
    }

    function generateName(culture, targetLength, complexity, familiarity) {
      const pattern = culturalPatterns[culture];
      let name = '';

      // Choose based on familiarity (higher = more common patterns)
      const rand = seededRandom();
      const usePrefix = rand < (familiarity / 100 * 0.6 + 0.2); // More likely with high familiarity

      if (usePrefix && name.length < targetLength) {
        name += pickRandom(pattern.prefixes, seededRandom);
      }

      // Build syllables
      while (name.length < targetLength) {
        const v = pickRandom(pattern.vowels, seededRandom);
        const c1 = pickRandom(pattern.consonants, seededRandom);
        const c2 = complexity !== 'simple' ? pickRandom(pattern.consonants, seededRandom) : '';
        const c3 = complexity === 'complex' ? pickRandom(pattern.consonants, seededRandom) : '';

        let syllable = c1 + v;
        if (complexity !== 'simple' && seededRandom() > 0.5) syllable += c2;
        if (complexity === 'complex' && seededRandom() > 0.7) syllable += c3;

        if (name.length + syllable.length <= targetLength) {
          name += syllable;
        } else {
          break;
        }
      }

      // Add suffix if space
      if (name.length < targetLength && seededRandom() < 0.4) {
        const suffix = pickRandom(pattern.suffixes, seededRandom);
        if (name.length + suffix.length <= targetLength + 2) {
          name += suffix;
        }
      }

      // Capitalize
      name = name.charAt(0).toUpperCase() + name.slice(1).toLowerCase();

      // Ensure reasonable length
      if (name.length < 4) name = name + pickRandom(pattern.suffixes, seededRandom).slice(0, 3);
      name = name.slice(0, targetLength + 3);

      return name;
    }

    function getPronunciation(name, culture) {
      // Simple IPA-style hints
      const hints = {
        'ö': 'uh',
        'ä': 'ah',
        'å': 'oh',
        'ch': 'kh',
        'dh': 'th',
        'sh': 'sh',
        'kh': 'kh',
        'qu': 'kw',
        'x': 'ks'
      };

      let result = name;
      for (let [k, v] of Object.entries(hints)) {
        result = result.replace(new RegExp(k, 'gi'), v);
      }

      return result.split('').join('-').toUpperCase();
    }

    function createNameCard(name, culture, isFavorite) {
      const pattern = culturalPatterns[culture];
      const pronunciation = getPronunciation(name, culture);
      const vibe = pickRandom(pattern.vibes);

      const div = document.createElement('div');
      div.className = 'name-card' + (isFavorite ? ' favorite' : '');
      div.innerHTML = `
        <div class="name-text">${name}</div>
        <div class="name-pronunciation">${pronunciation}</div>
        <div class="name-vibe">📍 ${vibe}</div>
        <div class="name-buttons">
          <button class="favorite-btn" onclick="toggleFavorite('${name}')">
            ${isFavorite ? '⭐' : '☆'}
          </button>
          <button class="copy-btn" onclick="copyToClipboard('${name}')">📋 Copy</button>
        </div>
      `;
      return div;
    }

    function renderNames() {
      const container = document.getElementById('namesContainer');
      const culture = document.getElementById('culture').value;

      if (generatedNames.length === 0) {
        container.innerHTML = '<div class="empty-state">No names generated yet. Click a button to start.</div>';
        document.getElementById('downloadSection').style.display = 'none';
        return;
      }

      container.innerHTML = '';
      generatedNames.forEach(name => {
        const isFav = favoriteNames.has(name);
        container.appendChild(createNameCard(name, culture, isFav));
      });
      document.getElementById('downloadSection').style.display = 'flex';
    }

    function generateNames(count) {
      seed = Date.now(); // Reset seed for each generation
      const culture = document.getElementById('culture').value;
      const length = parseInt(document.getElementById('length').value);
      const complexity = document.getElementById('complexity').value;
      const familiarity = parseInt(document.getElementById('familiarity').value);

      generatedNames = [];
      for (let i = 0; i < count; i++) {
        const name = generateName(culture, length, complexity, familiarity);
        if (!generatedNames.includes(name)) {
          generatedNames.push(name);
        }
      }
      renderNames();
    }

    function toggleFavorite(name) {
      if (favoriteNames.has(name)) {
        favoriteNames.delete(name);
      } else {
        favoriteNames.add(name);
      }
      localStorage.setItem('favoriteNames', JSON.stringify([...favoriteNames]));
      renderNames();
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('Copied: ' + text);
      });
    }

    function downloadNames(format) {
      if (generatedNames.length === 0) {
        alert('No names to download. Generate some first!');
        return;
      }

      const culture = document.getElementById('culture').value;
      let content = '';

      if (format === 'txt') {
        content = generatedNames.join('\n');
      } else if (format === 'csv') {
        content = 'Name,Pronunciation,Culture\n';
        generatedNames.forEach(name => {
          const pronunciation = getPronunciation(name, culture);
          content += `"${name}","${pronunciation}","${culture}"\n`;
        });
      }

      const blob = new Blob([content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `place-names-${Date.now()}.${format}`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Update displays
    document.getElementById('culture').addEventListener('change', (e) => {
      document.getElementById('cultureDisplay').textContent = e.target.options[e.target.selectedIndex].text.split(' ')[0];
      renderNames();
    });

    document.getElementById('length').addEventListener('input', (e) => {
      document.getElementById('lengthDisplay').textContent = e.target.value;
    });

    document.getElementById('familiarity').addEventListener('input', (e) => {
      document.getElementById('familiarityDisplay').textContent = e.target.value;
    });

    document.getElementById('generateOne').addEventListener('click', () => generateNames(1));
    document.getElementById('generateTen').addEventListener('click', () => generateNames(10));
    document.getElementById('downloadTxt').addEventListener('click', () => downloadNames('txt'));
    document.getElementById('downloadCsv').addEventListener('click', () => downloadNames('csv'));
  </script>
</body>
</html>
