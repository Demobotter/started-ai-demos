<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #1a472a 0%, #2d5a3d 50%, #1a472a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #f0f0f0;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(20, 35, 25, 0.95);
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(100, 200, 100, 0.2);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8em;
            text-align: center;
            margin-bottom: 10px;
            color: #a8e6c1;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
        }

        .subtitle {
            text-align: center;
            color: #7dd3a4;
            font-size: 0.95em;
            margin-bottom: 30px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 640px) {
            .controls-grid {
                grid-template-columns: 1fr;
            }
        }

        .control-group {
            background: rgba(50, 70, 55, 0.6);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #64c84f;
        }

        .control-label {
            font-size: 0.85em;
            color: #a8e6c1;
            margin-bottom: 8px;
            display: block;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 8px 10px;
            background: rgba(30, 50, 35, 0.8);
            color: #a8e6c1;
            border: 1px solid rgba(100, 200, 100, 0.4);
            border-radius: 6px;
            font-family: 'Space Mono', monospace;
            cursor: pointer;
            font-size: 0.9em;
        }

        select option {
            background: #1a2a1f;
            color: #a8e6c1;
        }

        .slider-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            background: rgba(100, 200, 100, 0.2);
            outline: none;
            -webkit-appearance: none;
            border-radius: 3px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #64c84f;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(100, 200, 79, 0.5);
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #64c84f;
            cursor: pointer;
            border-radius: 50%;
            border: none;
            box-shadow: 0 0 10px rgba(100, 200, 79, 0.5);
        }

        .slider-value {
            color: #a8e6c1;
            font-size: 0.85em;
            min-width: 30px;
            text-align: right;
        }

        .map-section {
            margin-bottom: 30px;
        }

        #orchographic-map {
            width: 100%;
            height: 300px;
            background: radial-gradient(circle, #0f3d2a 0%, #0a2a1f 100%);
            border-radius: 10px;
            border: 1px solid rgba(100, 200, 100, 0.2);
            display: block;
            cursor: pointer;
        }

        .location-detail {
            display: none;
            background: rgba(50, 70, 55, 0.6);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #64c84f;
            margin-bottom: 20px;
        }

        .location-detail.active {
            display: block;
        }

        .location-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.6em;
            color: #a8e6c1;
            margin-bottom: 10px;
        }

        .phenology-bar {
            margin: 15px 0;
            background: rgba(30, 50, 35, 0.8);
            border-radius: 6px;
            overflow: hidden;
            height: 40px;
            display: flex;
            border: 1px solid rgba(100, 200, 100, 0.2);
        }

        .phenophase {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a1a;
            font-size: 0.75em;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.3);
        }

        .phase-dormancy { background: #3a4a42; }
        .phase-budbreak { background: #7dd3a4; }
        .phase-flowering { color: white; }
        .phase-seed { background: #6b5842; }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-box {
            background: rgba(30, 50, 35, 0.8);
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #64c84f;
            text-align: center;
        }

        .stat-label {
            font-size: 0.75em;
            color: #7dd3a4;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.1em;
            color: #a8e6c1;
            font-weight: bold;
        }

        .instructions {
            background: rgba(50, 70, 55, 0.6);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #64c84f;
            font-size: 0.9em;
            color: #a8e6c1;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .month-markers {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 2px;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        .month-marker {
            text-align: center;
            font-size: 0.7em;
            color: #7dd3a4;
        }
    </style>
</head>

            4: { name: "Full Bloom", color: "#ff69b4" },
            5: { name: "Peak Bloom", color: "#ff1493" }

        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        let currentLocation = "cherry_japan";
        let currentMonth = 6;

        // Canvas drawing
        const canvas = document.getElementById("orchographic-map");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            drawMap();
        }

        function drawMap() {
            const w = canvas.width;
            const h = canvas.height;
            const centerX = w / 2;
            const centerY = h / 2;
            const radius = Math.min(w, h) / 2.2;

            // Draw globe background
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
            gradient.addColorStop(0, "#1a4d3a");
            gradient.addColorStop(0.7, "#0f3d2a");
            gradient.addColorStop(1, "#050a08");
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fill();

            // Draw continents (simple representation)
            ctx.fillStyle = "rgba(80, 120, 90, 0.4)";
            ctx.beginPath();
            ctx.arc(centerX - 80, centerY - 60, 40, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(centerX + 60, centerY + 40, 50, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(centerX - 40, centerY + 80, 35, 0, Math.PI * 2);
            ctx.fill();

            // Plot location markers
            for (const [key, data] of Object.entries(phenologyData)) {
                const x = centerX + (data.lon / 180) * radius * 0.8;
                const y = centerY - (data.lat / 90) * radius * 0.8;

                const isSelected = key === currentLocation;
                const size = isSelected ? 18 : 12;

                // Glow for selected
                if (isSelected) {
                    ctx.fillStyle = `rgba(${parseInt(data.color.slice(1, 3), 16)}, ${parseInt(data.color.slice(3, 5), 16)}, ${parseInt(data.color.slice(5, 7), 16)}, 0.3)`;
                    ctx.beginPath();
                    ctx.arc(x, y, size + 8, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Marker dot
                ctx.fillStyle = data.color;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();

                // Border
                ctx.strokeStyle = "#a8e6c1";
                ctx.lineWidth = isSelected ? 2 : 1;
                ctx.stroke();
            }

            // Grid lines
            ctx.strokeStyle = "rgba(100, 200, 100, 0.1)";
            ctx.lineWidth = 1;
            for (let i = -180; i <= 180; i += 60) {
                const x = centerX + (i / 180) * radius * 0.8;
                ctx.beginPath();
                ctx.moveTo(x, centerY - radius * 0.8);
                ctx.lineTo(x, centerY + radius * 0.8);
                ctx.stroke();
            }
        }

            const phenologyBar = document.getElementById("phenology-bar");
            phenologyBar.innerHTML = "";
            const phenology = data.phenology[year];

                const phaseData = phenoPhases[phase];
                const width = (100 / 12);
                const div = document.createElement("div");
                div.className = "phenophase";
                div.style.width = width + "%";
                div.style.backgroundColor = phaseData.color;
                div.textContent = monthNames[monthIdx].slice(0, 1);
                phenologyBar.appendChild(div);

            // Month markers

            monthNames.forEach(month => {

                div.className = "month-marker";
                div.textContent = month;

            // Stats

                    <div class="stat-value">${data.chillHours}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Frost Risk</div>
                    <div class="stat-value">${data.frostRisk}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Bloom Duration</div>
                    <div class="stat-value">${data.bloomDuration} days</div>
                </div>
            `;

            detail.classList.add("active");
        }

        // Event listeners
        document.getElementById("location-select").addEventListener("change", (e) => {
            currentLocation = e.target.value;
            drawMap();
            updateLocationDetail();
        });

        document.getElementById("year-select").addEventListener("change", (e) => {
            currentYear = e.target.value;
            updateLocationDetail();
        });

        document.getElementById("month-slider").addEventListener("input", (e) => {
            currentMonth = parseInt(e.target.value);
            document.getElementById("month-value").textContent = monthNames[currentMonth - 1];
        });

        document.getElementById("speed-slider").addEventListener("input", (e) => {
            animationSpeed = parseFloat(e.target.value);
            document.getElementById("speed-value").textContent = animationSpeed.toFixed(1) + "x";
        });

        canvas.addEventListener("click", (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Find closest marker
            let closest = null;
            let closestDist = Infinity;

            for (const [key, data] of Object.entries(phenologyData)) {
                const radius = Math.min(canvas.width, canvas.height) / 2.2;
                const px = centerX + (data.lon / 180) * radius * 0.8;
                const py = centerY - (data.lat / 90) * radius * 0.8;
                const dist = Math.hypot(x - px, y - py);

                if (dist < closestDist && dist < 25) {
                    closestDist = dist;
                    closest = key;
                }
            }

            if (closest) {
                currentLocation = closest;
                document.getElementById("location-select").value = closest;
                drawMap();
                updateLocationDetail();
            }
        });

        // Initialize
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();
        updateLocationDetail();
    </script>
</body>
</html>
