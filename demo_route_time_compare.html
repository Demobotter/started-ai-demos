<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Time Compare</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a1428 0%, #1f3a52 100%);
            color: #e8f0fa;
            font-family: 'Space Mono', monospace;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #4da8da;
        }
        .subtitle {
            font-size: 0.95rem;
            color: #aac3d1;
            opacity: 0.9;
        }
        .input-section {
            background: rgba(31, 77, 127, 0.5);
            border: 1px solid rgba(77, 168, 218, 0.3);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 35px;
            backdrop-filter: blur(10px);
        }
        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto auto;
            gap: 15px;
            align-items: end;
            margin-bottom: 15px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.85rem;
            color: #4da8da;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            font-weight: 600;
        }
        input[type="text"], select {
            background: rgba(10, 20, 40, 0.7);
            border: 1px solid rgba(77, 168, 218, 0.4);
            color: #e8f0fa;
            padding: 10px 12px;
            border-radius: 4px;
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #4da8da;
            box-shadow: 0 0 10px rgba(77, 168, 218, 0.3);
            background: rgba(10, 20, 40, 0.9);
        }
        input[type="text"]::placeholder {
            color: rgba(148, 176, 196, 0.5);
        }
        .stat-box {
            background: rgba(10, 20, 40, 0.7);
            border-left: 3px solid #4da8da;
            padding: 10px 12px;
            border-radius: 4px;
            text-align: center;
        }
        .stat-label {
            font-size: 0.75rem;
            color: #aac3d1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: #4da8da;
            margin-top: 3px;
        }
        .buttons {
            display: flex;
            gap: 10px;
        }
        button {
            background: #4da8da;
            color: #0a1428;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        button:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(77, 168, 218, 0.3);
        }
        button:active {
            transform: translateY(0);
        }
        .sample-pairs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .sample-btn {
            background: rgba(77, 168, 218, 0.2);
            padding: 6px 10px;
            font-size: 0.75rem;
            border-color: 1px solid rgba(77, 168, 218, 0.4);
        }
        .sample-btn:hover {
            background: rgba(77, 168, 218, 0.4);
        }
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 35px;
        }
        .modal-card {
            background: rgba(31, 77, 127, 0.6);
            border: 2px solid rgba(77, 168, 218, 0.3);
            border-radius: 8px;
            padding: 25px;
            backdrop-filter: blur(10px);
            position: relative;
            transition: all 0.3s ease;
        }
        .modal-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(77, 168, 218, 0.2);
            border-color: rgba(77, 168, 218, 0.6);
        }
        .modal-card.fastest {
            border-color: #00ff88;
            background: rgba(31, 77, 127, 0.8);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }
        .fastest-badge {
            position: absolute;
            top: -12px;
            right: 20px;
            background: #00ff88;
            color: #0a1428;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .mode-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .mode-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #4da8da;
            margin-bottom: 12px;
        }
        .total-time {
            font-size: 2rem;
            font-weight: 700;
            color: #7dd3fc;
            margin-bottom: 12px;
        }
        .time-breakdown {
            background: rgba(10, 20, 40, 0.6);
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #aac3d1;
        }
        .breakdown-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .breakdown-item:last-child {
            margin-bottom: 0;
        }
        .breakdown-label {
            color: #aac3d1;
        }
        .breakdown-value {
            font-weight: 700;
            color: #7dd3fc;
        }
        .cost-estimate {
            background: rgba(10, 20, 40, 0.6);
            border-radius: 4px;
            padding: 10px 12px;
            text-align: center;
            border-left: 3px solid #4da8da;
        }
        .cost-label {
            font-size: 0.75rem;
            color: #aac3d1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .cost-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: #4da8da;
            margin-top: 4px;
        }
        .error-message {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.5);
            color: #ff8a80;
            padding: 12px;
            border-radius: 4px;
            text-align: center;
            margin-top: 20px;
        }
        .empty-state {
            text-align: center;
            color: #aac3d1;
            padding: 40px 20px;
        }
        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
            .input-row {
                grid-template-columns: 1fr;
            }
            .results {
                grid-template-columns: 1fr;
            }
            .modal-card {
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚗✈️🚂 Route Time Compare</h1>
            <p class="subtitle">Find the fastest way to get there — driving, flying, or train</p>
        </header>

        <div class="input-section">
            <div class="input-row">
                <div class="input-group">
                    <label for="origin">From</label>
                    <input type="text" id="origin" placeholder="e.g., New York, London, Tokyo" />
                </div>
                <div class="input-group">
                    <label for="destination">To</label>
                    <input type="text" id="destination" placeholder="e.g., Los Angeles, Paris, Sydney" />
                </div>
                <div class="stat-box">
                    <div class="stat-label">Distance</div>
                    <div class="stat-value" id="distance">—</div>
                </div>
                <div class="buttons">
                    <button onclick="compareRoutes()">Compare</button>
                </div>
            </div>

            <div class="sample-pairs">
                <span style="font-size: 0.75rem; color: #aac3d1; margin-right: 10px; align-self: center;">SAMPLE PAIRS:</span>
                <button class="sample-btn" onclick="loadSample('New York', 'Los Angeles')">NYC → LA</button>
                <button class="sample-btn" onclick="loadSample('London', 'Paris')">London → Paris</button>
                <button class="sample-btn" onclick="loadSample('Sydney', 'Melbourne')">Sydney → Melbourne</button>
                <button class="sample-btn" onclick="loadSample('Tokyo', 'Bangkok')">Tokyo → Bangkok</button>
                <button class="sample-btn" onclick="loadSample('San Francisco', 'Seattle')">SF → Seattle</button>
            </div>
        </div>

        <div id="results"></div>
    </div>

    <script>
        // City database with coordinates
        const CITIES = {
            "New York": { lat: 40.7128, lon: -74.0060 },
            "Los Angeles": { lat: 34.0522, lon: -118.2437 },
            "Chicago": { lat: 41.8781, lon: -87.6298 },
            "Houston": { lat: 29.7604, lon: -95.3698 },
            "Phoenix": { lat: 33.4484, lon: -112.0742 },
            "Philadelphia": { lat: 39.9526, lon: -75.1652 },
            "San Antonio": { lat: 29.4241, lon: -98.4936 },
            "San Diego": { lat: 32.7157, lon: -117.1611 },
            "Dallas": { lat: 32.7767, lon: -96.7970 },
            "San Jose": { lat: 37.3382, lon: -121.8863 },
            "Austin": { lat: 30.2672, lon: -97.7431 },
            "Jacksonville": { lat: 30.3322, lon: -81.6557 },
            "Fort Worth": { lat: 32.7555, lon: -97.3308 },
            "Columbus": { lat: 39.9612, lon: -82.9988 },
            "Seattle": { lat: 47.6062, lon: -122.3321 },
            "Denver": { lat: 39.7392, lon: -104.9903 },
            "Washington DC": { lat: 38.9072, lon: -77.0369 },
            "Boston": { lat: 42.3601, lon: -71.0589 },
            "Miami": { lat: 25.7617, lon: -80.1918 },
            "San Francisco": { lat: 37.7749, lon: -122.4194 },
            "London": { lat: 51.5074, lon: -0.1278 },
            "Paris": { lat: 48.8566, lon: 2.3522 },
            "Berlin": { lat: 52.5200, lon: 13.4050 },
            "Madrid": { lat: 40.4168, lon: -3.7038 },
            "Rome": { lat: 41.9028, lon: 12.4964 },
            "Tokyo": { lat: 35.6762, lon: 139.6503 },
            "Beijing": { lat: 39.9042, lon: 116.4074 },
            "Shanghai": { lat: 31.2304, lon: 121.4737 },
            "Hong Kong": { lat: 22.3193, lon: 114.1694 },
            "Bangkok": { lat: 13.7563, lon: 100.5018 },
            "Singapore": { lat: 1.3521, lon: 103.8198 },
            "Sydney": { lat: -33.8688, lon: 151.2093 },
            "Melbourne": { lat: -37.8136, lon: 144.9631 },
            "Dubai": { lat: 25.2048, lon: 55.2708 },
            "Mumbai": { lat: 19.0760, lon: 72.8777 },
            "Delhi": { lat: 28.7041, lon: 77.1025 },
            "Toronto": { lat: 43.6532, lon: -79.3832 },
            "Vancouver": { lat: 49.2827, lon: -123.1207 },
            "Mexico City": { lat: 19.4326, lon: -99.1332 },
            "Moscow": { lat: 55.7558, lon: 37.6173 },
            "Istanbul": { lat: 41.0082, lon: 28.9784 },
            "Amsterdam": { lat: 52.3676, lon: 4.9041 }
        };

        function haversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth radius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function formatTime(hours) {
            const h = Math.floor(hours);
            const m = Math.round((hours - h) * 60);
            if (h === 0) return `${m}m`;
            if (m === 0) return `${h}h`;
            return `${h}h ${m}m`;
        }

        function calculateModes(distanceKm) {
            const modes = {};

            // Driving: 60 mph (96 km/h) avg highway + 0.5h local
            const drivingSpeed = 96; // km/h
            const drivingTime = (distanceKm / drivingSpeed) + 0.5;
            modes.drive = {
                totalHours: drivingTime,
                transitHours: distanceKm / drivingSpeed,
                overheadHours: 0.5,
                costDollars: Math.round((distanceKm * 0.621 * 0.20) + 5), // ~$0.20/mile + parking
                icon: "🚗"
            };

            // Flying: 500 mph (804 km/h) cruise + 2h pre (airport, security, boarding) + 1h post
            const flyingSpeed = 804; // km/h
            const flyingTime = (distanceKm / flyingSpeed) + 3;
            modes.fly = {
                totalHours: flyingTime,
                transitHours: distanceKm / flyingSpeed,
                overheadHours: 3,
                costDollars: Math.round(150 + (distanceKm * 0.621 * 0.05)), // ~$150 base + $0.05/mile
                icon: "✈️"
            };

            // Train: 80 mph (129 km/h) avg + 0.5h station/boarding
            const trainSpeed = 129; // km/h
            const trainTime = (distanceKm / trainSpeed) + 0.5;
            modes.train = {
                totalHours: trainTime,
                transitHours: distanceKm / trainSpeed,
                overheadHours: 0.5,
                costDollars: Math.round(50 + (distanceKm * 0.621 * 0.08)), // ~$50 base + $0.08/mile
                icon: "🚂"
            };

            return modes;
        }

        function loadSample(origin, destination) {
            document.getElementById('origin').value = origin;
            document.getElementById('destination').value = destination;
            compareRoutes();
        }

        function compareRoutes() {
            const origin = document.getElementById('origin').value.trim();
            const destination = document.getElementById('destination').value.trim();
            const resultsDiv = document.getElementById('results');

            if (!origin || !destination) {
                resultsDiv.innerHTML = '<div class="error-message">Please enter both origin and destination cities.</div>';
                return;
            }

            const originCity = Object.keys(CITIES).find(c => c.toLowerCase() === origin.toLowerCase());
            const destCity = Object.keys(CITIES).find(c => c.toLowerCase() === destination.toLowerCase());

            if (!originCity || !destCity) {
                resultsDiv.innerHTML = `<div class="error-message">City not found. Try: New York, Los Angeles, London, Paris, Tokyo, Sydney, etc.</div>`;
                return;
            }

            const originCoords = CITIES[originCity];
            const destCoords = CITIES[destCity];
            const distanceKm = haversineDistance(originCoords.lat, originCoords.lon, destCoords.lat, destCoords.lon);

            document.getElementById('distance').textContent = `${Math.round(distanceKm)} km`;

            const modes = calculateModes(distanceKm);

            // Sort by total time
            const sorted = [
                { key: 'drive', ...modes.drive },
                { key: 'fly', ...modes.fly },
                { key: 'train', ...modes.train }
            ].sort((a, b) => a.totalHours - b.totalHours);

            let html = '';
            sorted.forEach((mode, idx) => {
                const isFastest = idx === 0;
                const badgeHtml = isFastest ? '<div class="fastest-badge">⭐ FASTEST</div>' : '';
                const cardClass = isFastest ? 'modal-card fastest' : 'modal-card';

                html += `
                    <div class="${cardClass}">
                        ${badgeHtml}
                        <div class="mode-icon">${mode.icon}</div>
                        <div class="mode-title">${mode.key === 'drive' ? 'Driving' : mode.key === 'fly' ? 'Flying' : 'Train'}</div>
                        <div class="total-time">${formatTime(mode.totalHours)}</div>
                        <div class="time-breakdown">
                            <div class="breakdown-item">
                                <span class="breakdown-label">Travel Time:</span>
                                <span class="breakdown-value">${formatTime(mode.transitHours)}</span>
                            </div>
                            <div class="breakdown-item">
                                <span class="breakdown-label">Overhead:</span>
                                <span class="breakdown-value">${formatTime(mode.overheadHours)}</span>
                            </div>
                        </div>
                        <div class="cost-estimate">
                            <div class="cost-label">Est. Cost</div>
                            <div class="cost-value">$${mode.costDollars}</div>
                        </div>
                    </div>
                `;
            });

            resultsDiv.innerHTML = `<div class="results">${html}</div>`;
        }

        // Auto-focus origin on load
        window.addEventListener('load', () => {
            document.getElementById('origin').focus();
        });
    </script>
</body>
</html>
