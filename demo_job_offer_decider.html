<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Offer Decider</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #0a1428 0%, #1a2d4a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            background: #0f1f35;
            border: 1px solid #2a4a7a;
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5em;
            color: #64b5f6;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        
        .subtitle {
            color: #7dd3fc;
            margin-bottom: 30px;
            font-size: 0.95em;
        }
        
        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 768px) {
            .two-column {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            h1 {
                font-size: 1.8em;
            }
        }
        
        .job-section {
            padding: 25px;
            border-left: 4px solid #4da8da;
            background: rgba(77, 168, 218, 0.05);
            border-radius: 6px;
        }
        
        .job-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4em;
            color: #4da8da;
            margin-bottom: 20px;
        }
        
        .input-group {
            margin-bottom: 18px;
        }
        
        label {
            display: block;
            font-weight: 700;
            color: #b0d4f1;
            margin-bottom: 6px;
            font-size: 0.9em;
        }
        
        input[type="number"],
        input[type="text"],
        select {
            width: 100%;
            padding: 10px;
            background: #1a2f4a;
            border: 1px solid #3a5a7a;
            border-radius: 4px;
            color: #e0e0e0;
            font-family: 'Space Mono', monospace;
            font-size: 0.95em;
            transition: border-color 0.2s;
        }
        
        input[type="number"]:focus,
        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #64b5f6;
            box-shadow: 0 0 8px rgba(100, 181, 246, 0.3);
        }
        
        .slider-group {
            margin-bottom: 18px;
        }
        
        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .slider-label span:first-child {
            font-weight: 700;
            color: #b0d4f1;
            font-size: 0.9em;
        }
        
        .slider-value {
            color: #4ade80;
            font-weight: 700;
            font-size: 0.9em;
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, #1a3a4a, #2a5a7a);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4ade80;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(74, 222, 128, 0.5);
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4ade80;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 8px rgba(74, 222, 128, 0.5);
        }
        
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }
        
        button {
            padding: 12px 20px;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.2s;
        }
        
        .btn-compare {
            background: #4da8da;
            color: #0a1428;
            border: 1px solid #4da8da;
        }
        
        .btn-compare:hover {
            background: #64b5f6;
            border-color: #64b5f6;
            box-shadow: 0 0 12px rgba(100, 181, 246, 0.4);
        }
        
        .btn-clear {
            background: transparent;
            color: #7dd3fc;
            border: 1px solid #7dd3fc;
        }
        
        .btn-clear:hover {
            background: rgba(125, 211, 252, 0.1);
            border-color: #64b5f6;
        }
        
        .results-section {
            margin-top: 40px;
            padding: 25px;
            background: rgba(4, 222, 128, 0.08);
            border: 1px solid #4ade80;
            border-radius: 6px;
            display: none;
        }
        
        .results-section.active {
            display: block;
            animation: slideIn 0.4s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .results-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6em;
            color: #4ade80;
            margin-bottom: 20px;
        }
        
        .winner-badge {
            display: inline-block;
            background: #4ade80;
            color: #0a1428;
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: 700;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
        
        .score-display {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .score-card {
            padding: 20px;
            background: #1a2f4a;
            border-left: 4px solid #4da8da;
            border-radius: 4px;
        }
        
        .score-card h3 {
            font-family: 'Playfair Display', serif;
            color: #4da8da;
            margin-bottom: 12px;
            font-size: 1.2em;
        }
        
        .overall-score {
            font-size: 2.2em;
            font-weight: 700;
            color: #4ade80;
            margin-bottom: 8px;
        }
        
        .score-percent {
            color: #7dd3fc;
            font-size: 0.95em;
        }
        
        .breakdown {
            background: #1a2f4a;
            padding: 20px;
            border-radius: 4px;
            margin-top: 20px;
        }
        
        .breakdown h3 {
            font-family: 'Playfair Display', serif;
            color: #4da8da;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        
        .factor-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #2a4a7a;
        }
        
        .factor-row:last-child {
            border-bottom: none;
        }
        
        .factor-name {
            color: #b0d4f1;
        }
        
        .factor-score {
            color: #4ade80;
            font-weight: 700;
        }
        
        .insight {
            background: rgba(100, 181, 246, 0.1);
            border-left: 4px solid #64b5f6;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            color: #7dd3fc;
            line-height: 1.6;
        }
        
        .error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            color: #ff8787;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💼 Job Offer Decider</h1>
        <p class="subtitle">Input both job offers and get a computed recommendation based on salary, growth, and quality-of-life factors.</p>
        
        <div class="two-column">
            <!-- Job A -->
            <div class="job-section">
                <h2>Offer A</h2>
                
                <div class="input-group">
                    <label>Job Title</label>
                    <input type="text" id="titleA" placeholder="e.g., Senior Engineer" value="Software Engineer">
                </div>
                
                <div class="input-group">
                    <label>Base Salary ($)</label>
                    <input type="number" id="salaryA" min="30000" max="500000" step="1000" value="120000">
                </div>
                
                <div class="input-group">
                    <label>Bonus / Stock ($)</label>
                    <input type="number" id="bonusA" min="0" max="200000" step="5000" value="20000">
                </div>
                
                <div class="input-group">
                    <label>Company Size</label>
                    <select id="sizeA">
                        <option value="startup">Startup (&lt;50)</option>
                        <option value="scale" selected>Scale-up (50–500)</option>
                        <option value="mid">Mid-market (500–5000)</option>
                        <option value="enterprise">Enterprise (5000+)</option>
                    </select>
                </div>
                
                <div class="slider-group">
                    <div class="slider-label">
                        <span>Remote %</span>
                        <span class="slider-value"><span id="remoteAVal">80</span>%</span>
                    </div>
                    <input type="range" id="remoteA" min="0" max="100" value="80">
                </div>
                
                <div class="slider-group">
                    <div class="slider-label">
                        <span>Career Growth (1–10)</span>
                        <span class="slider-value"><span id="growthAVal">8</span></span>
                    </div>
                    <input type="range" id="growthA" min="1" max="10" value="8">
                </div>
                
                <div class="slider-group">
                    <div class="slider-label">
                        <span>Work-Life Balance (1–10)</span>
                        <span class="slider-value"><span id="balanceAVal">7</span></span>
                    </div>
                    <input type="range" id="balanceA" min="1" max="10" value="7">
                </div>
            </div>
            
            <!-- Job B -->
            <div class="job-section">
                <h2>Offer B</h2>
                
                <div class="input-group">
                    <label>Job Title</label>
                    <input type="text" id="titleB" placeholder="e.g., Principal Engineer" value="Tech Lead">
                </div>
                
                <div class="input-group">
                    <label>Base Salary ($)</label>
                    <input type="number" id="salaryB" min="30000" max="500000" step="1000" value="140000">
                </div>
                
                <div class="input-group">
                    <label>Bonus / Stock ($)</label>
                    <input type="number" id="bonusB" min="0" max="200000" step="5000" value="30000">
                </div>
                
                <div class="input-group">
                    <label>Company Size</label>
                    <select id="sizeB">
                        <option value="startup">Startup (&lt;50)</option>
                        <option value="scale">Scale-up (50–500)</option>
                        <option value="mid" selected>Mid-market (500–5000)</option>
                        <option value="enterprise">Enterprise (5000+)</option>
                    </select>
                </div>
                
                <div class="slider-group">
                    <div class="slider-label">
                        <span>Remote %</span>
                        <span class="slider-value"><span id="remoteBVal">40</span>%</span>
                    </div>
                    <input type="range" id="remoteB" min="0" max="100" value="40">
                </div>
                
                <div class="slider-group">
                    <div class="slider-label">
                        <span>Career Growth (1–10)</span>
                        <span class="slider-value"><span id="growthBVal">9</span></span>
                    </div>
                    <input type="range" id="growthB" min="1" max="10" value="9">
                </div>
                
                <div class="slider-group">
                    <div class="slider-label">
                        <span>Work-Life Balance (1–10)</span>
                        <span class="slider-value"><span id="balanceBVal">6</span></span>
                    </div>
                    <input type="range" id="balanceB" min="1" max="10" value="6">
                </div>
            </div>
        </div>
        
        <div class="action-buttons">
            <button class="btn-compare" onclick="calculateComparison()">Compare Offers</button>
            <button class="btn-clear" onclick="resetForm()">Clear All</button>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="results-section" id="results">
            <div id="winner"></div>
            <div class="score-display" id="scoreDisplay"></div>
            <div class="breakdown" id="breakdown"></div>
            <div class="insight" id="insight"></div>
        </div>
    </div>
    
    <script>
        // Update slider displays
        document.querySelectorAll('input[type="range"]').forEach(slider => {
            slider.addEventListener('input', (e) => {
                const id = e.target.id;
                const val = e.target.value;
                document.getElementById(id + 'Val').textContent = val;
            });
        });
        
        function calculateComparison() {
            const errorEl = document.getElementById('error');
            errorEl.classList.remove('show');
            
            try {
                // Get inputs
                const titleA = document.getElementById('titleA').value || 'Offer A';
                const titleB = document.getElementById('titleB').value || 'Offer B';
                
                const salaryA = parseFloat(document.getElementById('salaryA').value) || 0;
                const salaryB = parseFloat(document.getElementById('salaryB').value) || 0;
                const bonusA = parseFloat(document.getElementById('bonusA').value) || 0;
                const bonusB = parseFloat(document.getElementById('bonusB').value) || 0;
                
                const remoteA = parseFloat(document.getElementById('remoteA').value) || 0;
                const remoteB = parseFloat(document.getElementById('remoteB').value) || 0;
                const growthA = parseFloat(document.getElementById('growthA').value) || 5;
                const growthB = parseFloat(document.getElementById('growthB').value) || 5;
                const balanceA = parseFloat(document.getElementById('balanceA').value) || 5;
                const balanceB = parseFloat(document.getElementById('balanceB').value) || 5;
                
                const sizeA = document.getElementById('sizeA').value;
                const sizeB = document.getElementById('sizeB').value;
                
                // Validate
                if (salaryA < 1 || salaryB < 1) {
                    throw new Error('Salary must be greater than 0');
                }
                
                // Calculate total compensation
                const totalA = salaryA + bonusA;
                const totalB = salaryB + bonusB;
                
                // Company stability factor (0.8-1.2 multiplier)
                const stabFactors = { startup: 0.85, scale: 0.95, mid: 1.0, enterprise: 1.1 };
                const stabA = stabFactors[sizeA] || 1.0;
                const stabB = stabFactors[sizeB] || 1.0;
                
                // Normalized factors (each 0-100)
                const salaryScore = ((totalA / Math.max(totalA, totalB)) * 100);
                const salaryScoreB = ((totalB / Math.max(totalA, totalB)) * 100);
                
                const remoteScore = remoteA;
                const remoteScoreB = remoteB;
                
                const growthScore = (growthA / 10) * 100;
                const growthScoreB = (growthB / 10) * 100;
                
                const balanceScore = (balanceA / 10) * 100;
                const balanceScoreB = (balanceB / 10) * 100;
                
                const stabScore = stabA * 100;
                const stabScoreB = stabB * 100;
                
                // Weighted overall score
                // Weights: salary 35%, growth 25%, remote 20%, work-life balance 15%, stability 5%
                const weightA = (salaryScore * 0.35) + (growthScore * 0.25) + (remoteScore * 0.20) + (balanceScore * 0.15) + (stabScore * 0.05);
                const weightB = (salaryScoreB * 0.35) + (growthScoreB * 0.25) + (remoteScoreB * 0.20) + (balanceScoreB * 0.15) + (stabScoreB * 0.05);
                
                const winner = weightA > weightB ? 'A' : weightB > weightA ? 'B' : null;
                
                // Build results
                const resultEl = document.getElementById('results');
                let html = '';
                
                if (winner) {
                    const winnerTitle = winner === 'A' ? titleA : titleB;
                    const winnerScore = winner === 'A' ? Math.round(weightA) : Math.round(weightB);
                    html += `<div class="winner-badge">✓ RECOMMENDED: ${winnerTitle} (${winnerScore} pts)</div>`;
                } else {
                    html += `<div class="winner-badge">⚖ TIED (both offers equally strong)</div>`;
                }
                
                document.getElementById('winner').innerHTML = html;
                
                // Score display
                html = `
                    <div class="score-card">
                        <h3>${titleA}</h3>
                        <div class="overall-score">${Math.round(weightA)}</div>
                        <div class="score-percent">Total Compensation: $${(totalA).toLocaleString()}</div>
                    </div>
                    <div class="score-card">
                        <h3>${titleB}</h3>
                        <div class="overall-score">${Math.round(weightB)}</div>
                        <div class="score-percent">Total Compensation: $${(totalB).toLocaleString()}</div>
                    </div>
                `;
                document.getElementById('scoreDisplay').innerHTML = html;
                
                // Breakdown
                html = `
                    <h3>Factor Breakdown</h3>
                    <div class="factor-row">
                        <span class="factor-name">Compensation (35%)</span>
                        <span class="factor-score">${Math.round(salaryScore)} vs ${Math.round(salaryScoreB)}</span>
                    </div>
                    <div class="factor-row">
                        <span class="factor-name">Career Growth (25%)</span>
                        <span class="factor-score">${Math.round(growthScore)} vs ${Math.round(growthScoreB)}</span>
                    </div>
                    <div class="factor-row">
                        <span class="factor-name">Remote Flexibility (20%)</span>
                        <span class="factor-score">${Math.round(remoteScore)} vs ${Math.round(remoteScoreB)}</span>
                    </div>
                    <div class="factor-row">
                        <span class="factor-name">Work-Life Balance (15%)</span>
                        <span class="factor-score">${Math.round(balanceScore)} vs ${Math.round(balanceScoreB)}</span>
                    </div>
                    <div class="factor-row">
                        <span class="factor-name">Company Stability (5%)</span>
                        <span class="factor-score">${Math.round(stabScore)} vs ${Math.round(stabScoreB)}</span>
                    </div>
                `;
                document.getElementById('breakdown').innerHTML = html;
                
                // Insight
                let insight = '';
                const diff = Math.abs(weightA - weightB);
                if (winner) {
                    if (diff < 5) {
                        insight = `These offers are very close (${diff} points apart). Consider: which company culture aligns with your values? Which role excites you more?`;
                    } else if (diff < 15) {
                        insight = `${winnerTitle} has a modest edge. The difference is meaningful but not overwhelming—trust your instinct if the other feels right.`;
                    } else {
                        insight = `${winnerTitle} is clearly stronger across multiple dimensions. Unless there's a personal factor we haven't measured, this is the better choice.`;
                    }
                } else {
                    insight = `Both offers are equally strong—the decision hinges on non-quantifiable factors: team chemistry, project excitement, long-term vision alignment.`;
                }
                document.getElementById('insight').textContent = insight;
                
                resultEl.classList.add('active');
            } catch (e) {
                errorEl.textContent = '❌ ' + e.message;
                errorEl.classList.add('show');
            }
        }
        
        function resetForm() {
            document.querySelectorAll('input[type="number"], input[type="text"], select').forEach(el => {
                el.value = el.defaultValue || '';
            });
            document.querySelectorAll('input[type="range"]').forEach(el => {
                el.value = el.defaultValue;
                const id = el.id;
                document.getElementById(id + 'Val').textContent = el.defaultValue;
            });
            document.getElementById('results').classList.remove('active');
            document.getElementById('error').classList.remove('show');
        }
        
        // Load defaults and display
        document.querySelectorAll('input[type="range"]').forEach(slider => {
            const id = slider.id;
            document.getElementById(id + 'Val').textContent = slider.value;
        });
    </script>
</body>
</html>
