<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breath Check</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            font-size: 13px;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 24px;
        }
        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099ff 100%);
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 212, 255, 0.3);
        }
        button:active {
            transform: translateY(0);
        }
        .loading {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin: 24px 0;
            display: none;
        }
        .error {
            background: rgba(255, 59, 48, 0.15);
            border: 1px solid rgba(255, 59, 48, 0.3);
            color: #ff6b6b;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 16px;
            display: none;
        }
        .results {
            display: none;
        }
        .aqi-display {
            text-align: center;
            margin-bottom: 24px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
        }
        .aqi-number {
            font-family: 'Poppins', sans-serif;
            font-size: 64px;
            font-weight: 700;
            margin: 8px 0;
        }
        .aqi-category {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
        }
        .city-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 12px;
        }
        .pollutants-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .pollutant {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .pollutant-name {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            width: 50px;
            color: rgba(255, 255, 255, 0.7);
        }
        .pollutant-bar-wrapper {
            flex: 1;
        }
        .pollutant-bar-bg {
            height: 20px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }
        .pollutant-bar-fill {
            height: 100%;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 6px;
            font-size: 10px;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
            transition: width 0.3s ease;
        }
        .bar-green { background: linear-gradient(90deg, #10b981 0%, #34d399 100%); }
        .bar-yellow { background: linear-gradient(90deg, #f59e0b 0%, #fbbf24 100%); }
        .bar-orange { background: linear-gradient(90deg, #f97316 0%, #fb923c 100%); }
        .bar-red { background: linear-gradient(90deg, #ef4444 0%, #f87171 100%); }
        .bar-purple { background: linear-gradient(90deg, #8b5cf6 0%, #a78bfa 100%); }
        .pollutant-unit {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            min-width: 45px;
            text-align: right;
        }
        .timestamp {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Breath Check</h1>
        <p class="subtitle">Real-time air quality for any city</p>
        
        <div class="input-row">
            <input type="text" id="cityInput" placeholder="Enter city...">
            <button onclick="fetchAQI()">Check</button>
        </div>
        
        <div class="error" id="error"></div>
        <div class="loading" id="loading">Fetching air quality data...</div>
        
        <div class="results" id="results">
            <div class="aqi-display">
                <div class="aqi-number" id="aqiValue">—</div>
                <div class="aqi-category" id="aqiCategory">—</div>
                <div class="city-label" id="cityName"></div>
            </div>
            
            <div class="pollutants-section" id="pollutants"></div>
            <div class="timestamp" id="timestamp"></div>
        </div>
    </div>

    <script>
        async function fetchAQI() {
            const cityInput = document.getElementById('cityInput').value.trim();
            if (!cityInput) return;

            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const results = document.getElementById('results');

            loading.style.display = 'block';
            error.style.display = 'none';
            results.style.display = 'none';

            try {
                // Geocode city to lat/lon
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?city=${encodeURIComponent(cityInput)}&format=json&limit=1`);
                const geoData = await geoRes.json();

                if (!geoData.length) {
                    throw new Error('City not found');
                }

                const lat = parseFloat(geoData[0].lat);
                const lon = parseFloat(geoData[0].lon);
                const displayName = geoData[0].display_name.split(',')[0];

                // Fetch air quality
                const aqRes = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi,pm10,pm2_5,ozone,nitrogen_dioxide,sulphur_dioxide,carbon_monoxide&timezone=auto`);
                const aqData = await aqRes.json();
                const current = aqData.current;

                // Pollutants array
                const pollutants = [
                    { name: 'PM2.5', value: current.pm2_5, unit: 'µg/m³', max: 100 },
                    { name: 'PM10', value: current.pm10, unit: 'µg/m³', max: 150 },
                    { name: 'O3', value: current.ozone, unit: 'ppb', max: 100 },
                    { name: 'NO2', value: current.nitrogen_dioxide, unit: 'ppb', max: 100 },
                    { name: 'SO2', value: current.sulphur_dioxide, unit: 'ppb', max: 50 },
                    { name: 'CO', value: current.carbon_monoxide, unit: 'ppb', max: 1000 }
                ];

                // Determine AQI category
                const usAqi = current.us_aqi;
                let aqiCategory = '';
                if (usAqi <= 50) aqiCategory = 'Good';
                else if (usAqi <= 100) aqiCategory = 'Moderate';
                else if (usAqi <= 150) aqiCategory = 'Unhealthy for Sensitive';
                else if (usAqi <= 200) aqiCategory = 'Unhealthy';
                else if (usAqi <= 300) aqiCategory = 'Very Unhealthy';
                else aqiCategory = 'Hazardous';

                // Render
                document.getElementById('aqiValue').textContent = Math.round(usAqi);
                document.getElementById('aqiCategory').textContent = aqiCategory;
                document.getElementById('cityName').textContent = displayName;

                const pollutantsHtml = pollutants.map(p => {
                    const value = p.value !== null ? p.value : 0;
                    const pct = Math.min(100, (value / p.max) * 100);
                    let barClass = 'bar-green';
                    if (pct > 80) barClass = 'bar-red';
                    else if (pct > 60) barClass = 'bar-orange';
                    else if (pct > 40) barClass = 'bar-yellow';
                    else if (pct > 20) barClass = 'bar-purple';

                    return `
                        <div class="pollutant">
                            <div class="pollutant-name">${p.name}</div>
                            <div class="pollutant-bar-wrapper">
                                <div class="pollutant-bar-bg">
                                    <div class="pollutant-bar-fill ${barClass}" style="width: ${pct}%"></div>
                                </div>
                            </div>
                            <div class="pollutant-unit">${value.toFixed(1)} ${p.unit}</div>
                        </div>
                    `;
                }).join('');

                document.getElementById('pollutants').innerHTML = pollutantsHtml;
                document.getElementById('timestamp').textContent = `Updated: ${new Date().toLocaleTimeString()}`;

                loading.style.display = 'none';
                results.style.display = 'block';
            } catch (err) {
                loading.style.display = 'none';
                error.textContent = err.message || 'Failed to fetch data';
                error.style.display = 'block';
            }
        }

        // Allow Enter key
        document.getElementById('cityInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchAQI();
        });

        // Auto-load Melbourne on page load
        window.addEventListener('load', () => {
            document.getElementById('cityInput').value = 'Melbourne';
            fetchAQI();
        });
    </script>
</body>
</html>
