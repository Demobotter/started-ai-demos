<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chord Progressions</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: rgba(26, 31, 58, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      border: 1px solid rgba(77, 184, 255, 0.2);
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.5em;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #4db8ff, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      font-size: 0.95em;
      color: #aaa;
    }
    .builder {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .chord-slot {
      background: rgba(77, 184, 255, 0.05);
      border: 2px solid rgba(77, 184, 255, 0.2);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      transition: all 0.3s ease;
    }
    .chord-slot:hover {
      border-color: rgba(77, 184, 255, 0.5);
      background: rgba(77, 184, 255, 0.1);
    }
    .chord-slot label {
      display: block;
      font-size: 0.85em;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .chord-slot select {
      width: 100%;
      padding: 10px;
      background: rgba(10, 14, 39, 0.6);
      border: 1px solid rgba(77, 184, 255, 0.3);
      border-radius: 8px;
      color: #00ff88;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 0.95em;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .chord-slot select:hover,
    .chord-slot select:focus {
      border-color: #4db8ff;
      outline: none;
      background: rgba(10, 14, 39, 0.8);
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 0.95em;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-play {
      background: linear-gradient(90deg, #4db8ff, #00ff88);
      color: #0a0e27;
      flex: 1;
      min-width: 140px;
    }
    .btn-play:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(77, 184, 255, 0.3);
    }
    .btn-play:active {
      transform: translateY(0);
    }
    .btn-stop {
      background: rgba(255, 100, 100, 0.1);
      color: #ff6464;
      border: 1px solid rgba(255, 100, 100, 0.3);
    }
    .btn-stop:hover {
      background: rgba(255, 100, 100, 0.2);
      border-color: rgba(255, 100, 100, 0.5);
    }
    .tempo-control {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(77, 184, 255, 0.05);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid rgba(77, 184, 255, 0.2);
    }
    .tempo-control label {
      font-size: 0.9em;
      font-weight: 500;
      color: #aaa;
      white-space: nowrap;
    }
    .tempo-control input {
      flex: 1;
      min-width: 120px;
    }
    .tempo-control span {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      color: #4db8ff;
      min-width: 40px;
      text-align: right;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #4db8ff;
      cursor: pointer;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 32px;
    }
    .info-card {
      background: rgba(77, 184, 255, 0.05);
      border: 1px solid rgba(77, 184, 255, 0.15);
      border-radius: 12px;
      padding: 16px;
    }
    .info-card h3 {
      font-family: 'Syne', sans-serif;
      font-size: 0.9em;
      font-weight: 600;
      color: #4db8ff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .info-card p {
      font-size: 0.9em;
      line-height: 1.5;
      color: #ccc;
    }
    .degree {
      background: rgba(77, 184, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      color: #00ff88;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
    }
    @media (max-width: 768px) {
      .container {
        padding: 24px;
      }
      h1 {
        font-size: 1.8em;
      }
      .builder {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎼 Chord Progressions</h1>
      <p>Build a 4-chord progression, play it, explore music theory</p>
    </header>

    <div class="builder">
      <div class="chord-slot">
        <label>Chord 1</label>
        <select id="chord0">
          <option>C Major</option>
          <option>C Minor</option>
          <option>C7</option>
          <option>F Major</option>
          <option>F Minor</option>
          <option>G Major</option>
          <option>G Minor</option>
          <option>Am Major</option>
          <option>Am Minor</option>
        </select>
      </div>
      <div class="chord-slot">
        <label>Chord 2</label>
        <select id="chord1">
          <option>F Major</option>
          <option>F Minor</option>
          <option>C Major</option>
          <option>G Major</option>
          <option>Am Major</option>
          <option>Am Minor</option>
          <option>Dm Major</option>
          <option>Dm Minor</option>
        </select>
      </div>
      <div class="chord-slot">
        <label>Chord 3</label>
        <select id="chord2">
          <option>G Major</option>
          <option>G Minor</option>
          <option>C Major</option>
          <option>D Major</option>
          <option>Am Major</option>
          <option>F Major</option>
          <option>Em Major</option>
          <option>Em Minor</option>
        </select>
      </div>
      <div class="chord-slot">
        <label>Chord 4</label>
        <select id="chord3">
          <option>C Major</option>
          <option>G Major</option>
          <option>F Major</option>
          <option>Am Major</option>
          <option>C Minor</option>
          <option>G Minor</option>
          <option>F Minor</option>
        </select>
      </div>
    </div>

    <div class="tempo-control">
      <label>Tempo (BPM)</label>
      <input type="range" id="tempo" min="40" max="180" value="80">
      <span id="tempoValue">80</span>
    </div>

    <div class="controls">
      <button class="btn-play" id="playBtn">▶ Play Progression</button>
      <button class="btn-stop" id="stopBtn">■ Stop</button>
    </div>

    <div class="info-grid">
      <div class="info-card">
        <h3>Current Progression</h3>
        <p id="progressionName">C Major → F Major → G Major → C Major</p>
      </div>
      <div class="info-card">
        <h3>Key Degree</h3>
        <p>Playing in <span class="degree" id="keyDegree">C Major</span></p>
      </div>
      <div class="info-card">
        <h3>Timing</h3>
        <p><span class="degree" id="beatInfo">1 bar per chord @ 80 BPM</span></p>
      </div>
    </div>
  </div>

  <script>
    const chordData = {
      'C Major': [261.63, 329.63, 392.00],
      'C Minor': [261.63, 311.13, 392.00],
      'C7': [261.63, 329.63, 392.00, 466.16],
      'F Major': [349.23, 440.00, 523.25],
      'F Minor': [349.23, 415.30, 523.25],
      'G Major': [392.00, 493.88, 587.33],
      'G Minor': [392.00, 466.16, 587.33],
      'Am Major': [440.00, 523.25, 659.25],
      'Am Minor': [440.00, 523.25, 659.25],
      'D Major': [293.66, 369.99, 440.00],
      'Dm Major': [293.66, 349.23, 440.00],
      'Dm Minor': [293.66, 349.23, 440.00],
      'Em Major': [329.63, 392.00, 493.88],
      'Em Minor': [329.63, 392.00, 493.88],
    };

    let audioCtx = null;
    let playing = false;

    const selects = [
      document.getElementById('chord0'),
      document.getElementById('chord1'),
      document.getElementById('chord2'),
      document.getElementById('chord3')
    ];

    const tempoInput = document.getElementById('tempo');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const progressionNameEl = document.getElementById('progressionName');
    const keyDegreeEl = document.getElementById('keyDegree');
    const beatInfoEl = document.getElementById('beatInfo');
    const tempoValueEl = document.getElementById('tempoValue');

    function updateDisplay() {
      const chords = selects.map(s => s.value).join(' → ');
      progressionNameEl.textContent = chords;
      const key = selects[0].value.split(' ')[0];
      keyDegreeEl.textContent = key + ' Major';
      const tempo = tempoInput.value;
      tempoValueEl.textContent = tempo;
      const beatDuration = (60 / tempo * 1000).toFixed(0);
      beatInfoEl.textContent = `1 bar per chord @ ${tempo} BPM`;
    }

    selects.forEach(s => s.addEventListener('change', updateDisplay));
    tempoInput.addEventListener('input', updateDisplay);

    playBtn.addEventListener('click', async () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (playing) return;
      playing = true;
      playBtn.disabled = true;

      const tempo = parseInt(tempoInput.value);
      const beatDuration = 60 / tempo;

      const chords = selects.map(s => s.value);

      for (let i = 0; i < chords.length; i++) {
        if (!playing) break;
        const frequencies = chordData[chords[i]];
        const startTime = audioCtx.currentTime;
        const endTime = startTime + beatDuration;

        frequencies.forEach(freq => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.value = freq;
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          gain.gain.setValueAtTime(0.15, startTime);
          gain.gain.exponentialRampToValueAtTime(0.01, endTime);
          osc.start(startTime);
          osc.stop(endTime);
        });

        await new Promise(resolve => setTimeout(resolve, beatDuration * 1000));
      }

      playing = false;
      playBtn.disabled = false;
    });

    stopBtn.addEventListener('click', () => {
      playing = false;
      playBtn.disabled = false;
    });

    updateDisplay();
  </script>
</body>
</html>
