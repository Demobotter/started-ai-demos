<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transit Photometry</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Mono', monospace;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1d3a 100%);
      color: #e8f1f8;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: rgba(10, 14, 39, 0.85);
      border: 1px solid #2d4a8f;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5em;
      text-align: center;
      margin-bottom: 10px;
      color: #5eb3f6;
    }
    .subtitle {
      text-align: center;
      color: #90caf9;
      margin-bottom: 30px;
      font-size: 0.95em;
    }
    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }
    @media (max-width: 1200px) {
      .content { grid-template-columns: 1fr; }
    }
    .canvas-wrapper {
      background: rgba(20, 28, 60, 0.6);
      border: 1px solid #2d4a8f;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }
    canvas {
      display: block;
      margin: 0 auto;
      background: #0a0e27;
      border-radius: 4px;
      max-width: 100%;
      height: auto;
    }
    .control-group {
      background: rgba(25, 45, 85, 0.5);
      border-left: 3px solid #5eb3f6;
      border-radius: 4px;
      padding: 15px;
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9em;
      color: #90caf9;
      font-weight: bold;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #2d4a8f;
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #5eb3f6;
      cursor: pointer;
    }
    .stat-box {
      background: rgba(25, 45, 85, 0.5);
      border-left: 3px solid #5eb3f6;
      border-radius: 4px;
      padding: 12px;
      font-size: 0.85em;
      margin-bottom: 15px;
    }
    .stat-value {
      color: #00ff99;
      font-family: 'Playfair Display', serif;
      font-size: 1.2em;
      margin-top: 2px;
    }
    .value-display {
      display: inline-block;
      background: rgba(94, 179, 246, 0.2);
      padding: 2px 6px;
      border-radius: 3px;
      color: #5eb3f6;
      margin-left: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌟 Transit Photometry</h1>
    <div class="subtitle">Watch exoplanets cross in front of their stars</div>

    <div class="content">
      <div>
        <div class="canvas-wrapper">
          <canvas id="transitCanvas" width="380" height="380"></canvas>
          <div style="color:#90caf9; margin-top:10px; font-size:0.9em" id="transitLabel">Transit in progress...</div>
        </div>
        <div class="canvas-wrapper" style="margin-top:20px">
          <canvas id="photometryCanvas" width="380" height="260"></canvas>
        </div>
      </div>

      <div>
        <div class="control-group">
          <label>Exoplanet System</label>
          <select id="systemSelect" style="width:100%; padding:8px; background:#2d4a8f; color:#5eb3f6; border:1px solid #5eb3f6; border-radius:4px;">
            <option value="kepler1">Kepler-1b (Hot Jupiter)</option>
            <option value="trappist1e">TRAPPIST-1e (Earth-like)</option>
            <option value="wasp12b">WASP-12b (Ultra-Hot)</option>
          </select>
        </div>

        <div class="control-group">
          <label>Planet-Star Radius Ratio</label>
          <input type="range" id="radiusRatio" min="0.05" max="0.15" value="0.1" step="0.01">
          <div class="value-display" id="radiusDisplay">0.100</div>
        </div>

        <div class="control-group">
          <label>Impact Parameter</label>
          <input type="range" id="impactParam" min="0" max="0.9" value="0.3" step="0.1">
          <div class="value-display" id="impactDisplay">0.30</div>
        </div>

        <div class="control-group">
          <label>Transit Progress (%)</label>
          <input type="range" id="progress" min="0" max="100" value="50" step="1">
          <div class="value-display" id="progressDisplay">50%</div>
        </div>

        <div class="stat-box">
          <div style="color:#90caf9; font-weight:bold">Transit Depth (ppm)</div>
          <div class="stat-value" id="transitDepth">10,000 ppm</div>
        </div>

        <div class="stat-box">
          <div style="color:#90caf9; font-weight:bold">Brightness Drop (%)</div>
          <div class="stat-value" id="brightnessDrop">1.0%</div>
        </div>

        <div class="stat-box">
          <div style="color:#90caf9; font-weight:bold">Transit Duration</div>
          <div class="stat-value" id="transitDuration">2.4 hrs</div>
        </div>

        <div class="stat-box">
          <div style="color:#90caf9; font-weight:bold">Equilibrium Temp</div>
          <div class="stat-value" id="equilibriumTemp">1500 K</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const transitCanvas = document.getElementById('transitCanvas');
    const photometryCanvas = document.getElementById('photometryCanvas');
    const transitCtx = transitCanvas.getContext('2d');
    const photometryCtx = photometryCanvas.getContext('2d');

    const systems = {
      kepler1: { name: 'Kepler-1b', radiusRatio: 0.109, temp: 1520 },
      trappist1e: { name: 'TRAPPIST-1e', radiusRatio: 0.1146, temp: 246 },
      wasp12b: { name: 'WASP-12b', radiusRatio: 0.22, temp: 2530 }
    };

    function updateDisplays() {
      const radiusRatio = parseFloat(document.getElementById('radiusRatio').value);
      const impactParam = parseFloat(document.getElementById('impactParam').value);
      const progress = parseFloat(document.getElementById('progress').value);
      const systemKey = document.getElementById('systemSelect').value;
      const system = systems[systemKey];

      document.getElementById('radiusDisplay').textContent = radiusRatio.toFixed(3);
      document.getElementById('impactDisplay').textContent = impactParam.toFixed(2);
      document.getElementById('progressDisplay').textContent = progress.toFixed(0) + '%';
      document.getElementById('equilibriumTemp').textContent = system.temp + ' K';

      const depth = radiusRatio * radiusRatio * 1000000;
      const drop = depth / 10000;
      const duration = (2.4 * (1 + impactParam)) * Math.sqrt(1 - impactParam * impactParam);

      document.getElementById('transitDepth').textContent = depth.toFixed(0) + ' ppm';
      document.getElementById('brightnessDrop').textContent = drop.toFixed(2) + '%';
      document.getElementById('transitDuration').textContent = duration.toFixed(1) + ' hrs';

      renderTransit(radiusRatio, impactParam, progress / 100);
      renderPhotometry(radiusRatio, impactParam);
    }

    function renderTransit(radiusRatio, impactParam, progress) {
      const w = transitCanvas.width;
      const h = transitCanvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const starR = 90;
      const planetR = starR * radiusRatio;

      transitCtx.fillStyle = '#0a0e27';
      transitCtx.fillRect(0, 0, w, h);

      // Draw star
      const grad = transitCtx.createRadialGradient(cx, cy, 0, cx, cy, starR);
      grad.addColorStop(0, '#ffff99');
      grad.addColorStop(1, '#ffd700');
      transitCtx.fillStyle = grad;
      transitCtx.beginPath();
      transitCtx.arc(cx, cy, starR, 0, Math.PI * 2);
      transitCtx.fill();
      transitCtx.strokeStyle = '#ffff66';
      transitCtx.lineWidth = 2;
      transitCtx.stroke();

      // Draw planet
      const transitWidth = starR * 2 * Math.sqrt(1 - impactParam * impactParam);
      const px = cx - transitWidth / 2 + progress * transitWidth;
      const py = cy + impactParam * starR * 1.3;

      const pgra = transitCtx.createRadialGradient(px - planetR * 0.3, py - planetR * 0.3, 0, px, py, planetR);
      pgra.addColorStop(0, '#4da8da');
      pgra.addColorStop(1, '#0a1d4a');
      transitCtx.fillStyle = pgra;
      transitCtx.beginPath();
      transitCtx.arc(px, py, planetR, 0, Math.PI * 2);
      transitCtx.fill();
      transitCtx.strokeStyle = '#64b5f6';
      transitCtx.lineWidth = 2;
      transitCtx.stroke();

      const label = progress > 0.1 && progress < 0.9 ? `Crossing (${(progress * 100).toFixed(0)}%)` : (progress <= 0.1 ? 'Approaching' : 'Exiting');
      document.getElementById('transitLabel').textContent = label;
    }

    function renderPhotometry(radiusRatio, impactParam) {
      const w = photometryCanvas.width;
      const h = photometryCanvas.height;
      const pad = 40;
      const gw = w - pad * 2;
      const gh = h - pad * 2;

      photometryCtx.fillStyle = '#0a0e27';
      photometryCtx.fillRect(0, 0, w, h);

      // Grid
      photometryCtx.strokeStyle = '#2d4a8f';
      photometryCtx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = pad + (gh / 4) * i;
        photometryCtx.beginPath();
        photometryCtx.moveTo(pad, y);
        photometryCtx.lineTo(w - pad, y);
        photometryCtx.stroke();
      }

      // Axes
      photometryCtx.strokeStyle = '#5eb3f6';
      photometryCtx.lineWidth = 2;
      photometryCtx.beginPath();
      photometryCtx.moveTo(pad, pad);
      photometryCtx.lineTo(pad, h - pad);
      photometryCtx.lineTo(w - pad, h - pad);
      photometryCtx.stroke();

      // Labels
      photometryCtx.fillStyle = '#90caf9';
      photometryCtx.font = '11px Space Mono';
      photometryCtx.textAlign = 'center';
      photometryCtx.fillText('Orbital Phase', w / 2, h - 12);

      // Light curve
      const depth = radiusRatio * radiusRatio;
      photometryCtx.strokeStyle = '#5eb3f6';
      photometryCtx.lineWidth = 2;
      photometryCtx.beginPath();

      for (let x = 0; x <= gw; x += 2) {
        const phase = x / gw;
        let flux = 1.0;

        if (phase >= 0.4 && phase <= 0.6) {
          const center = 0.5;
          const width = 0.1 + impactParam * 0.1;
          const dist = Math.abs(phase - center);
          if (dist < width) {
            const norm = dist / width;
            const dip = depth * (1 - norm * norm);
            flux = 1.0 - dip;
          }
        }

        const y = (h - pad) - (flux * (gh / 2) + (gh / 2));
        if (x === 0) {
          photometryCtx.moveTo(pad + x, y);
        } else {
          photometryCtx.lineTo(pad + x, y);
        }
      }
      photometryCtx.stroke();

      // Baseline
      photometryCtx.strokeStyle = 'rgba(144, 202, 249, 0.2)';
      photometryCtx.setLineDash([4, 4]);
      photometryCtx.beginPath();
      photometryCtx.moveTo(pad, (h - pad) - (gh / 2));
      photometryCtx.lineTo(w - pad, (h - pad) - (gh / 2));
      photometryCtx.stroke();
      photometryCtx.setLineDash([]);
    }

    document.getElementById('radiusRatio').addEventListener('input', updateDisplays);
    document.getElementById('impactParam').addEventListener('input', updateDisplays);
    document.getElementById('progress').addEventListener('input', updateDisplays);
    document.getElementById('systemSelect').addEventListener('change', updateDisplays);

    updateDisplays();
  </script>
</body>
</html>
