<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exoplanet Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #0a0f15 0%, #1a1a2e 100%);
            color: #4da8da;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            color: #7dd3fc;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            background: rgba(26, 26, 46, 0.6);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #2d4a5a;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-size: 0.9rem;
            color: #7dd3fc;
        }
        input, select {
            padding: 8px;
            border: 1px solid #2d9d5f;
            border-radius: 4px;
            background: rgba(10, 15, 21, 0.8);
            color: #4da8da;
            font-family: 'Space Mono', monospace;
        }
        button {
            padding: 10px 20px;
            background: #2d9d5f;
            border: none;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            transition: background 0.3s;
        }
        button:hover { background: #3fb071; }
        .toggles {
            display: flex;
            gap: 10px;
        }
        .toggle-btn {
            flex: 1;
            padding: 8px 12px;
            background: #1a3a5a;
            border: 1px solid #2d9d5f;
            color: #4da8da;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }
        .toggle-btn.active {
            background: #2d9d5f;
            color: #fff;
        }
        .content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        .stats {
            background: rgba(26, 26, 46, 0.6);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #2d9d5f;
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: fit-content;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(45, 157, 95, 0.3);
        }
        .stat-item:last-child { border-bottom: none; }
        .stat-label { color: #7dd3fc; }
        .stat-value { color: #52c41a; font-weight: bold; }
        canvas {
            background: rgba(10, 15, 21, 0.8);
            border: 1px solid #2d4a5a;
            border-radius: 8px;
            display: block;
            width: 100%;
            height: 500px;
        }
        .info-box {
            background: rgba(45, 157, 95, 0.15);
            padding: 12px;
            border-radius: 4px;
            border-left: 3px solid #52c41a;
            font-size: 0.85rem;
            color: #7dd3fc;
            margin-top: 10px;
        }
        @media (max-width: 900px) {
            .controls { grid-template-columns: 1fr; }
            .content { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌌 Exoplanet Explorer</h1>

        <div class="controls">
            <div class="control-group">
                <label>Search by Star Name</label>
                <input type="text" id="starSearch" placeholder="e.g., TRAPPIST-1, Kepler-452, Proxima">
            </div>
            <div class="control-group">
                <label>Filter by Discovery Year</label>
                <input type="range" id="yearSlider" min="1995" max="2024" value="2024" style="width: 100%;">
                <span id="yearLabel">Through 2024</span>
            </div>
            <div class="control-group">
                <label>Planet Type</label>
                <select id="typeFilter">
                    <option value="">All Types</option>
                    <option value="rocky">Rocky</option>
                    <option value="super-earth">Super-Earth</option>
                    <option value="ice-giant">Ice Giant</option>
                    <option value="gas-giant">Gas Giant</option>
                </select>
            </div>
            <div class="control-group">
                <label>Toggle Options</label>
                <div class="toggles">
                    <button class="toggle-btn" data-toggle="habitable">Habitable Zone</button>
                    <button class="toggle-btn active" data-toggle="orbit">Orbits</button>
                </div>
            </div>
        </div>

        <div class="content">
            <div class="stats">
                <h3 style="color: #7dd3fc; margin-bottom: 10px;">System Details</h3>
                <div class="stat-item">
                    <span class="stat-label">Star:</span>
                    <span class="stat-value" id="starName">—</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Distance (ly):</span>
                    <span class="stat-value" id="distance">—</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Star Type:</span>
                    <span class="stat-value" id="starType">—</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Planet:</span>
                    <span class="stat-value" id="planetName">—</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Radius (Earth):</span>
                    <span class="stat-value" id="radius">—</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Orbital Period (days):</span>
                    <span class="stat-value" id="period">—</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Equilibrium Temp (K):</span>
                    <span class="stat-value" id="temp">—</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Semi-major Axis (AU):</span>
                    <span class="stat-value" id="axis">—</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Discovery Year:</span>
                    <span class="stat-value" id="year">—</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Discovery Method:</span>
                    <span class="stat-value" id="method">—</span>
                </div>
                <div class="info-box" id="habitableInfo" style="display: none;">
                    🌍 In habitable zone
                </div>
            </div>

            <canvas id="canvas"></canvas>
        </div>
    </div>

    <script>
        // Real exoplanet data (NASA Exoplanet Archive confirmed systems)
        const SYSTEMS = [
            {
                star: 'TRAPPIST-1',
                distance: 12.1,
                spectralType: 'M8V',
                luminosity: 0.000564,
                planets: [
                    { name: 'b', radius: 1.09, period: 1.51, axis: 0.01154, eqTemp: 288, type: 'rocky', discoveryYear: 2016, method: 'Transit' },
                    { name: 'c', radius: 1.06, period: 2.42, axis: 0.01580, eqTemp: 246, type: 'rocky', discoveryYear: 2016, method: 'Transit' },
                    { name: 'd', radius: 0.77, period: 4.05, axis: 0.02227, eqTemp: 205, type: 'rocky', discoveryYear: 2016, method: 'Transit' },
                    { name: 'e', radius: 0.92, period: 6.10, axis: 0.02925, eqTemp: 172, type: 'rocky', discoveryYear: 2017, method: 'Transit' },
                    { name: 'f', radius: 1.04, period: 9.21, axis: 0.03853, eqTemp: 142, type: 'rocky', discoveryYear: 2017, method: 'Transit' },
                    { name: 'g', radius: 1.27, period: 12.35, axis: 0.04680, eqTemp: 128, type: 'rocky', discoveryYear: 2017, method: 'Transit' }
                ]
            },
            {
                star: 'Proxima Centauri',
                distance: 4.24,
                spectralType: 'M5.5V',
                luminosity: 0.0017,
                planets: [
                    { name: 'b', radius: 1.27, period: 11.186, axis: 0.0485, eqTemp: 234, type: 'super-earth', discoveryYear: 2016, method: 'Radial Velocity' },
                    { name: 'c', radius: 10, period: 1900, axis: 1.489, eqTemp: 39, type: 'ice-giant', discoveryYear: 2020, method: 'Radial Velocity' }
                ]
            },
            {
                star: 'Kepler-452',
                distance: 449,
                spectralType: 'G1.5V',
                luminosity: 1.11,
                planets: [
                    { name: 'b', radius: 1.6, period: 384.8, axis: 1.046, eqTemp: 265, type: 'super-earth', discoveryYear: 2015, method: 'Transit' }
                ]
            },
            {
                star: 'WASP-96',
                distance: 223,
                spectralType: 'G1V',
                luminosity: 1.02,
                planets: [
                    { name: 'b', radius: 1.94, period: 3.418, axis: 0.0385, eqTemp: 969, type: 'gas-giant', discoveryYear: 2013, method: 'Transit' }
                ]
            },
            {
                star: 'Kepler-1649',
                distance: 261,
                spectralType: 'M3V',
                luminosity: 0.04,
                planets: [
                    { name: 'c', radius: 1.06, period: 19.53, axis: 0.111, eqTemp: 234, type: 'rocky', discoveryYear: 2020, method: 'Transit' }
                ]
            },
            {
                star: 'TOI-700',
                distance: 100,
                spectralType: 'M2.5V',
                luminosity: 0.024,
                planets: [
                    { name: 'd', radius: 1.19, period: 16.356, axis: 0.069, eqTemp: 278, type: 'rocky', discoveryYear: 2020, method: 'Transit' }
                ]
            },
            {
                star: 'LHS 475',
                distance: 41,
                spectralType: 'M5.5V',
                luminosity: 0.0008,
                planets: [
                    { name: 'b', radius: 1.04, period: 3.849, axis: 0.0146, eqTemp: 305, type: 'rocky', discoveryYear: 2023, method: 'Transit' }
                ]
            }
        ];

        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let selectedSystem = SYSTEMS[0];
        let selectedPlanet = SYSTEMS[0].planets[0];
        let showHabitable = false;
        let showOrbits = true;

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function getHabitableZone(luminosity) {
            const sqrtL = Math.sqrt(luminosity);
            return { inner: 0.95 * sqrtL, outer: 1.37 * sqrtL };
        }

        function draw() {
            ctx.fillStyle = '#0a0f15';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const scale = 80;

            if (showHabitable) {
                const hz = getHabitableZone(selectedSystem.luminosity);
                ctx.strokeStyle = 'rgba(82, 196, 26, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(centerX, centerY, hz.inner * scale, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(centerX, centerY, hz.outer * scale, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 12, 0, Math.PI * 2);
            ctx.fill();

            selectedSystem.planets.forEach(p => {
                const angle = Date.now() / (p.period * 500);
                const x = centerX + p.axis * scale * Math.cos(angle);
                const y = centerY + p.axis * scale * Math.sin(angle);

                if (showOrbits) {
                    ctx.strokeStyle = 'rgba(77, 168, 218, 0.3)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, p.axis * scale, 0, Math.PI * 2);
                    ctx.stroke();
                }

                const colors = {
                    'rocky': '#888888',
                    'super-earth': '#ff9900',
                    'ice-giant': '#87ceeb',
                    'gas-giant': '#d4a574'
                };
                ctx.fillStyle = colors[p.type] || '#4da8da';
                const radius = Math.max(4, p.radius * 2);
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();

                if (p === selectedPlanet) {
                    ctx.strokeStyle = '#7dd3fc';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            });

            ctx.fillStyle = '#7dd3fc';
            ctx.font = '12px "Space Mono"';
            ctx.textAlign = 'center';
            ctx.fillText(selectedSystem.star, centerX, centerY + 30);

            requestAnimationFrame(draw);
        }

        function updateStats() {
            document.getElementById('starName').textContent = selectedSystem.star;
            document.getElementById('distance').textContent = selectedSystem.distance.toFixed(2);
            document.getElementById('starType').textContent = selectedSystem.spectralType;
            document.getElementById('planetName').textContent = selectedPlanet.name;
            document.getElementById('radius').textContent = selectedPlanet.radius.toFixed(2);
            document.getElementById('period').textContent = selectedPlanet.period.toFixed(2);
            document.getElementById('temp').textContent = selectedPlanet.eqTemp.toFixed(0);
            document.getElementById('axis').textContent = selectedPlanet.axis.toFixed(4);
            document.getElementById('year').textContent = selectedPlanet.discoveryYear;
            document.getElementById('method').textContent = selectedPlanet.method;

            const hz = getHabitableZone(selectedSystem.luminosity);
            const inHZ = selectedPlanet.axis >= hz.inner && selectedPlanet.axis <= hz.outer;
            document.getElementById('habitableInfo').style.display = inHZ ? 'block' : 'none';
        }

        document.getElementById('starSearch').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const found = SYSTEMS.find(s => s.star.toLowerCase().includes(query));
            if (found) {
                selectedSystem = found;
                selectedPlanet = found.planets[0];
                updateStats();
            }
        });

        document.getElementById('typeFilter').addEventListener('change', (e) => {
            const type = e.target.value;
            if (type) {
                const planet = selectedSystem.planets.find(p => p.type === type);
                if (planet) selectedPlanet = planet;
            } else {
                selectedPlanet = selectedSystem.planets[0];
            }
            updateStats();
        });

        document.querySelectorAll('[data-toggle]').forEach(btn => {
            btn.addEventListener('click', () => {
                btn.classList.toggle('active');
                if (btn.dataset.toggle === 'habitable') showHabitable = !showHabitable;
                else if (btn.dataset.toggle === 'orbit') showOrbits = !showOrbits;
            });
        });

        updateStats();
        draw();
    </script>
</body>
</html>
