<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verse Forge — Poetic Form Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lora:ital@0;1&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Lora', serif;
            background: linear-gradient(135deg, #0a1428 0%, #0d1f3a 100%);
            color: #e0e7ff;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            border-bottom: 2px solid #4da8da;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            color: #4da8da;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }
        .subtitle {
            font-size: 0.95rem;
            color: #adbde8;
            font-style: italic;
        }
        .control-panel {
            background: rgba(15, 30, 60, 0.6);
            border: 2px solid #4da8da;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        .control-group {
            margin-bottom: 25px;
        }
        .control-group label {
            display: block;
            font-weight: 600;
            color: #7dd3fc;
            margin-bottom: 12px;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        .form-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        .form-btn {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            background: rgba(77, 168, 218, 0.2);
            border: 2px solid #4da8da;
            color: #7dd3fc;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        .form-btn:hover {
            background: rgba(77, 168, 218, 0.4);
            transform: translateY(-2px);
        }
        .form-btn.active {
            background: #4da8da;
            color: #0a1428;
            box-shadow: 0 0 20px rgba(77, 168, 218, 0.5);
        }
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }
        .theme-btn {
            padding: 12px 16px;
            background: rgba(125, 211, 252, 0.1);
            border: 2px solid #7dd3fc;
            color: #7dd3fc;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .theme-btn:hover {
            background: rgba(125, 211, 252, 0.3);
            transform: translateY(-2px);
        }
        .theme-btn.active {
            background: #7dd3fc;
            color: #0a1428;
            box-shadow: 0 0 20px rgba(125, 211, 252, 0.4);
        }
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .btn-primary {
            flex: 1;
            padding: 14px 28px;
            background: linear-gradient(135deg, #4da8da 0%, #7dd3fc 100%);
            border: none;
            color: #0a1428;
            border-radius: 6px;
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(77, 168, 218, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(77, 168, 218, 0.5);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .output-section {
            background: rgba(10, 20, 40, 0.8);
            border: 2px solid #00ff88;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
            min-height: 200px;
            display: none;
        }
        .output-section.visible {
            display: block;
            animation: slideIn 0.4s ease;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .poem-output {
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 4px;
            color: #00ff88;
            line-height: 1.8;
            font-size: 1.05rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 15px;
            border-left: 4px solid #00ff88;
        }
        .poem-metadata {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .metadata-item {
            background: rgba(77, 168, 218, 0.1);
            padding: 10px 15px;
            border-radius: 4px;
            border-left: 3px solid #4da8da;
        }
        .metadata-label {
            color: #7dd3fc;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .metadata-value {
            color: #e0e7ff;
            font-size: 0.95rem;
        }
        .output-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-secondary {
            padding: 10px 16px;
            background: rgba(77, 168, 218, 0.3);
            border: 1px solid #4da8da;
            color: #7dd3fc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            background: rgba(77, 168, 218, 0.5);
            transform: translateY(-1px);
        }
        .stats-panel {
            background: rgba(125, 211, 252, 0.05);
            border: 1px solid #4da8da;
            border-radius: 4px;
            padding: 15px;
            font-size: 0.85rem;
            color: #adbde8;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✒️ Verse Forge</h1>
            <p class="subtitle">Generate original poems in real poetic forms</p>
        </header>

        <div class="control-panel">
            <div class="control-group">
                <label>Poetic Form</label>
                <div class="form-selector">
                    <button class="form-btn active" data-form="haiku">Haiku</button>
                    <button class="form-btn" data-form="limerick">Limerick</button>
                    <button class="form-btn" data-form="sonnet">Sonnet</button>
                    <button class="form-btn" data-form="free">Free Verse</button>
                </div>
            </div>

            <div class="control-group">
                <label>Theme</label>
                <div class="theme-grid">
                    <button class="theme-btn active" data-theme="nature">Nature</button>
                    <button class="theme-btn" data-theme="love">Love</button>
                    <button class="theme-btn" data-theme="tech">Technology</button>
                    <button class="theme-btn" data-theme="food">Food</button>
                    <button class="theme-btn" data-theme="dreams">Dreams</button>
                    <button class="theme-btn" data-theme="chaos">Chaos</button>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn-primary" id="generateBtn">Generate Poem</button>
            </div>
        </div>

        <div class="output-section" id="outputSection">
            <div class="poem-metadata">
                <div class="metadata-item">
                    <div class="metadata-label">Form</div>
                    <div class="metadata-value" id="outputForm">Haiku</div>
                </div>
                <div class="metadata-item">
                    <div class="metadata-label">Theme</div>
                    <div class="metadata-value" id="outputTheme">Nature</div>
                </div>
            </div>
            <div class="poem-output" id="poemText"></div>
            <div class="stats-panel" id="statsPanel"></div>
            <div class="output-buttons" style="margin-top: 20px;">
                <button class="btn-secondary" id="copyBtn">📋 Copy to Clipboard</button>
                <button class="btn-secondary" id="regenerateBtn">🔄 Generate Another</button>
            </div>
        </div>
    </div>

    <script>
        // Word banks by theme
        const wordBanks = {
            nature: {
                season: ['spring', 'dawn', 'dusk', 'winter', 'summer', 'autumn', 'morning', 'evening'],
                object: ['dew', 'moss', 'wind', 'rain', 'stone', 'leaf', 'sky', 'water', 'branch', 'flower'],
                action: ['falls', 'blooms', 'flows', 'drifts', 'whispers', 'glows', 'soars', 'sleeps'],
                color: ['silver', 'gold', 'green', 'blue', 'pale', 'deep', 'bright', 'dark'],
                emotion: ['calm', 'wild', 'tender', 'still', 'alive', 'free']
            },
            love: {
                emotion: ['tender', 'aching', 'burning', 'soft', 'wild', 'fierce', 'gentle', 'eternal'],
                object: ['heart', 'soul', 'kiss', 'touch', 'bond', 'flame', 'tide', 'echo'],
                action: ['yearns', 'binds', 'holds', 'breaks', 'heals', 'forgives', 'transcends'],
                color: ['red', 'crimson', 'rose', 'gold', 'warm', 'bright'],
                time: ['forever', 'always', 'ever', 'once', 'now', 'never']
            },
            tech: {
                object: ['code', 'wire', 'circuit', 'data', 'network', 'signal', 'stream', 'byte', 'node'],
                action: ['transmit', 'compute', 'pulse', 'encrypt', 'decode', 'compile', 'execute'],
                emotion: ['electric', 'infinite', 'cold', 'precise', 'fast', 'bright', 'silent'],
                color: ['neon', 'cyan', 'silver', 'black', 'green'],
                state: ['live', 'real', 'raw', 'pure']
            },
            food: {
                taste: ['sweet', 'savory', 'bitter', 'salty', 'rich', 'fresh', 'warm', 'cool'],
                object: ['bread', 'wine', 'fruit', 'honey', 'spice', 'grain', 'herb', 'salt', 'fire'],
                action: ['melts', 'blooms', 'lingers', 'fills', 'nourishes', 'awakens'],
                sense: ['taste', 'smell', 'touch', 'savor', 'feast', 'hunger'],
                emotion: ['comfort', 'pleasure', 'joy', 'desire', 'gratitude']
            },
            dreams: {
                object: ['shadow', 'light', 'mirror', 'door', 'path', 'cloud', 'thread', 'veil', 'bridge'],
                action: ['fade', 'shift', 'dissolve', 'emerge', 'vanish', 'unfold', 'spiral'],
                emotion: ['strange', 'endless', 'vast', 'fragile', 'vivid', 'haunting', 'surreal'],
                color: ['silver', 'grey', 'iridescent', 'shadowed', 'luminous'],
                state: ['twilight', 'liminal', 'floating', 'falling', 'waking']
            },
            chaos: {
                action: ['crashes', 'tears', 'explodes', 'shatters', 'burns', 'drowns', 'consumes', 'ravages'],
                emotion: ['wild', 'fierce', 'untamed', 'violent', 'frenzied', 'raw', 'primal'],
                object: ['storm', 'fire', 'abyss', 'void', 'thunder', 'earthquake', 'torrent'],
                color: ['black', 'red', 'dark', 'ashen', 'blood'],
                state: ['turbulent', 'raging', 'relentless', 'limitless', 'absolute']
            }
        };

        // Syllable counter
        function countSyllables(word) {
            const w = word.toLowerCase().trim();
            if (w.length === 0) return 0;
            
            let count = 0;
            const vowels = 'aeiouy';
            let previousWasVowel = false;
            
            for (let i = 0; i < w.length; i++) {
                const isVowel = vowels.includes(w[i]);
                if (isVowel && !previousWasVowel) {
                    count++;
                }
                previousWasVowel = isVowel;
            }
            
            // Adjust for silent e
            if (w.endsWith('e')) count--;
            if (w.endsWith('le') && w.length > 2 && !vowels.includes(w[w.length - 3])) count++;
            
            return Math.max(1, count);
        }

        // Rhyme bank (words grouped by ending sound)
        const rhymeBank = {
            'igh': ['night', 'light', 'sight', 'flight', 'bright', 'height', 'might', 'right', 'tight', 'white'],
            'ay': ['day', 'way', 'say', 'play', 'stay', 'may', 'bay', 'gray', 'pay', 'ray'],
            'oo': ['moon', 'soon', 'noon', 'spoon', 'june', 'tune', 'rune', 'dune', 'prune', 'boon'],
            'own': ['down', 'town', 'crown', 'frown', 'brown', 'gown', 'shown', 'known', 'sown', 'own'],
            'ing': ['sing', 'ring', 'wing', 'thing', 'king', 'bring', 'spring', 'string', 'cling', 'ling'],
            'ore': ['more', 'door', 'core', 'store', 'shore', 'pour', 'soar', 'roar', 'score', 'lore'],
            'ear': ['clear', 'dear', 'fear', 'hear', 'near', 'tear', 'wear', 'year', 'appear', 'cheer'],
            'ight': ['fight', 'might', 'tight', 'sight', 'light', 'night', 'right', 'flight', 'bright', 'height'],
            'ove': ['love', 'dove', 'above', 'glove', 'shove'],
            'ould': ['would', 'could', 'should']
        };

        function getRandomFromArray(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function selectWordByCategory(theme, category) {
            const bank = wordBanks[theme];
            if (bank && bank[category]) {
                return getRandomFromArray(bank[category]);
            }
            return getRandomFromArray(Object.values(bank)[0]);
        }

        function padToSyllables(words, targetSyllables) {
            let totalSyll = words.reduce((sum, w) => sum + countSyllables(w), 0);
            const result = [...words];
            
            while (totalSyll < targetSyllables) {
                const word = selectWordByCategory('nature', 'object');
                result.push(word);
                totalSyll += countSyllables(word);
            }
            
            while (totalSyll > targetSyllables && result.length > 1) {
                result.pop();
                totalSyll = result.reduce((sum, w) => sum + countSyllables(w), 0);
            }
            
            return result;
        }

        function generateHaiku(theme) {
            const line1Words = padToSyllables(
                [selectWordByCategory(theme, 'season'), selectWordByCategory(theme, 'object')],
                5
            );
            const line2Words = padToSyllables(
                [selectWordByCategory(theme, 'action'), selectWordByCategory(theme, 'color'), selectWordByCategory(theme, 'object')],
                7
            );
            const line3Words = padToSyllables(
                [selectWordByCategory(theme, 'emotion'), selectWordByCategory(theme, 'object')],
                5
            );
            
            const poem = [
                line1Words.join(' '),
                line2Words.join(' '),
                line3Words.join(' ')
            ].join('\n');
            
            return {
                text: poem,
                stats: `3 lines (5-7-5 syllable structure) • Nature-focused imagery`
            };
        }

        function generateLimerick(theme) {
            const rhymeSoundA = Object.keys(rhymeBank)[Math.floor(Math.random() * Object.keys(rhymeBank).length)];
            const rhymeSoundB = Object.keys(rhymeBank)[Math.floor(Math.random() * Object.keys(rhymeBank).length)];
            
            const wordA1 = getRandomFromArray(rhymeBank[rhymeSoundA]);
            const wordA2 = getRandomFromArray(rhymeBank[rhymeSoundA]);
            const wordA3 = getRandomFromArray(rhymeBank[rhymeSoundA]);
            const wordB1 = getRandomFromArray(rhymeBank[rhymeSoundB]);
            const wordB2 = getRandomFromArray(rhymeBank[rhymeSoundB]);
            
            const verb1 = selectWordByCategory(theme, 'action');
            const verb2 = selectWordByCategory(theme, 'action');
            const adj = selectWordByCategory(theme, 'emotion');
            
            const poem = [
                `There once was a ${adj} ${wordA1}`,
                `Who loved to go out and ${verb1}`,
                `They would ${verb2} with glee`,
                `For all to see`,
                `A most remarkable ${wordA3}`
            ].join('\n');
            
            return {
                text: poem,
                stats: `5 lines • AABBA rhyme scheme • Humorous rhythm`
            };
        }

        function generateSonnet(theme) {
            const lines = [];
            const rhymeScheme = [
                ['A', 'B', 'A', 'B'],
                ['C', 'D', 'C', 'D'],
                ['E', 'F', 'E', 'F'],
                ['G', 'G']
            ];
            
            for (let quatrain = 0; quatrain < 3; quatrain++) {
                for (let i = 0; i < 4; i++) {
                    const words = [
                        selectWordByCategory(theme, 'emotion'),
                        selectWordByCategory(theme, 'action'),
                        selectWordByCategory(theme, 'object'),
                        selectWordByCategory(theme, 'color')
                    ];
                    lines.push(words.join(' '));
                }
            }
            
            // Couplet
            lines.push(selectWordByCategory(theme, 'emotion') + ' ' + selectWordByCategory(theme, 'action'));
            lines.push(selectWordByCategory(theme, 'time') + ' ' + selectWordByCategory(theme, 'object'));
            
            return {
                text: lines.join('\n'),
                stats: `14 lines • Petrarchan form • ABAB CDCD EFEF GG`
            };
        }

        function generateFreeVerse(theme) {
            const numLines = 8 + Math.floor(Math.random() * 5);
            const lines = [];
            const categories = ['emotion', 'action', 'object', 'color', 'state'];
            
            for (let i = 0; i < numLines; i++) {
                const cat = categories[Math.floor(Math.random() * categories.length)];
                const word = selectWordByCategory(theme, cat);
                const length = Math.random() > 0.5 ? 2 : 3;
                const lineWords = [word];
                
                for (let j = 0; j < length - 1; j++) {
                    const nextCat = categories[Math.floor(Math.random() * categories.length)];
                    lineWords.push(selectWordByCategory(theme, nextCat));
                }
                
                lines.push(lineWords.join(' '));
            }
            
            return {
                text: lines.join('\n'),
                stats: `${numLines} lines • No meter or rhyme • Thematic coherence`
            };
        }

        function generatePoem(form, theme) {
            let result;
            
            switch(form) {
                case 'haiku':
                    result = generateHaiku(theme);
                    break;
                case 'limerick':
                    result = generateLimerick(theme);
                    break;
                case 'sonnet':
                    result = generateSonnet(theme);
                    break;
                case 'free':
                    result = generateFreeVerse(theme);
                    break;
                default:
                    result = generateHaiku(theme);
            }
            
            return result;
        }

        // UI State
        let currentForm = 'haiku';
        let currentTheme = 'nature';
        let currentPoem = null;

        // Event listeners
        document.querySelectorAll('.form-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.form-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentForm = e.target.dataset.form;
            });
        });

        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentTheme = e.target.dataset.theme;
            });
        });

        document.getElementById('generateBtn').addEventListener('click', () => {
            currentPoem = generatePoem(currentForm, currentTheme);
            displayPoem();
        });

        document.getElementById('regenerateBtn').addEventListener('click', () => {
            currentPoem = generatePoem(currentForm, currentTheme);
            displayPoem();
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(currentPoem.text).then(() => {
                const btn = document.getElementById('copyBtn');
                const original = btn.textContent;
                btn.textContent = '✅ Copied!';
                setTimeout(() => {
                    btn.textContent = original;
                }, 2000);
            });
        });

        function displayPoem() {
            const output = document.getElementById('outputSection');
            output.classList.add('visible');
            document.getElementById('poemText').textContent = currentPoem.text;
            document.getElementById('outputForm').textContent = currentForm.charAt(0).toUpperCase() + currentForm.slice(1);
            document.getElementById('outputTheme').textContent = currentTheme.charAt(0).toUpperCase() + currentTheme.slice(1);
            document.getElementById('statsPanel').innerHTML = `<div class="stat-row"><span>Structure:</span> <span>${currentPoem.stats}</span></div>`;
            window.scrollTo({ top: output.offsetTop - 100, behavior: 'smooth' });
        }

        // Auto-generate on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('generateBtn').click();
            }, 300);
        });
    </script>
</body>
</html>
