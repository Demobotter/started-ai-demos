<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chord Tension Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #0a1428 0%, #1a2332 100%);
            color: #7dd3fc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            background: rgba(10, 20, 40, 0.8);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .sidebar {
            width: 280px;
            padding: 30px;
            background: linear-gradient(180deg, #0f1a2e 0%, #1a2f4a 100%);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid #2d5a7b;
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            gap: 20px;
        }
        h1 { font-family: 'Playfair Display', serif; font-size: 28px; margin-bottom: 10px; color: #f0f9ff; }
        h2 { font-family: 'Playfair Display', serif; font-size: 18px; margin-top: 15px; margin-bottom: 10px; color: #90e0ef; text-transform: uppercase; letter-spacing: 1px; }
        label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; color: #a0c4ff; }
        select, input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            background: #1a3a52;
            border: 1px solid #2d5a7b;
            color: #90e0ef;
            font-family: 'Space Mono', monospace;
            border-radius: 4px;
            cursor: pointer;
        }
        input:focus, select:focus { outline: none; border-color: #4da8da; }
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }
        button {
            padding: 10px;
            background: #1a3a52;
            border: 1px solid #2d5a7b;
            color: #90e0ef;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }
        button:hover { background: #2d5a7b; border-color: #4da8da; }
        button.active {
            background: #2d9d5f;
            border-color: #4fd46e;
            color: #ffffff;
            font-weight: bold;
        }
        .stat-box {
            background: rgba(26, 58, 82, 0.5);
            border-left: 3px solid #2d9d5f;
            padding: 12px;
            border-radius: 4px;
            font-size: 11px;
        }
        .stat-label { color: #7dd3fc; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 16px; font-weight: bold; color: #90e0ef; margin-top: 3px; }
        canvas { display: block; background: #0f1a2e; border-radius: 8px; border: 1px solid #2d5a7b; }
        .emotion-display {
            text-align: center;
            padding: 15px;
            background: rgba(77, 168, 218, 0.1);
            border-radius: 8px;
            margin-top: 10px;
        }
        .emotion-text {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            margin-top: 5px;
        }
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
            .button-group { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div>
                <h1>🎼 Chord Tension</h1>
            </div>

            <div>
                <label>Key</label>
                <select id="keySelect">
                    <option value="C">C Major</option>
                    <option value="G">G Major</option>
                    <option value="D">D Major</option>
                    <option value="A">A Major</option>
                    <option value="E">E Major</option>
                    <option value="B">B Major</option>
                    <option value="F#">F# Major</option>
                    <option value="Db">Db Major</option>
                    <option value="Ab">Ab Major</option>
                    <option value="Eb">Eb Major</option>
                    <option value="Bb">Bb Major</option>
                    <option value="F">F Major</option>
                </select>
            </div>

            <div>
                <h2>Chord Type</h2>
                <div class="button-group">
                    <button class="chord-btn active" data-chord="maj">Major</button>
                    <button class="chord-btn" data-chord="min">Minor</button>
                    <button class="chord-btn" data-chord="dim">Dim</button>
                    <button class="chord-btn" data-chord="aug">Aug</button>
                    <button class="chord-btn" data-chord="sus2">Sus2</button>
                    <button class="chord-btn" data-chord="sus4">Sus4</button>
                    <button class="chord-btn" data-chord="dom7">7th</button>
                    <button class="chord-btn" data-chord="maj7">Maj7</button>
                    <button class="chord-btn" data-chord="min7">Min7</button>
                </div>
            </div>

            <div>
                <label>Inversion</label>
                <div class="button-group">
                    <button class="inversion-btn active" data-inv="0">Root</button>
                    <button class="inversion-btn" data-inv="1">1st</button>
                    <button class="inversion-btn" data-inv="2">2nd</button>
                    <button class="inversion-btn" data-inv="3">3rd</button>
                </div>
            </div>

            <div>
                <label>Context</label>
                <select id="contextSelect">
                    <option value="classical">Classical</option>
                    <option value="jazz">Jazz</option>
                    <option value="pop">Pop</option>
                    <option value="film">Film Score</option>
                </select>
            </div>

            <button id="playBtn" style="width: 100%; padding: 15px; background: #2d9d5f; border-color: #4fd46e; font-size: 12px;">▶ PLAY CHORD</button>

            <div>
                <h2>Analysis</h2>
                <div class="stat-box">
                    <div class="stat-label">Chord Name</div>
                    <div class="stat-value" id="chordName">C Major</div>
                </div>
                <div class="stat-box" style="margin-top: 10px;">
                    <div class="stat-label">Roman Numeral</div>
                    <div class="stat-value" id="romanNumeral">I</div>
                </div>
                <div class="stat-box" style="margin-top: 10px;">
                    <div class="stat-label">Tension</div>
                    <div class="stat-value" id="tensionValue">15 / 100</div>
                </div>
            </div>

            <div class="emotion-display">
                <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #7dd3fc;">Emotion</div>
                <div class="emotion-text" id="emotionText" style="color: #4da8da;">Peaceful</div>
            </div>
        </div>

        <div class="main">
            <canvas id="pianoCanvas" width="700" height="400"></canvas>
            <div style="display: flex; gap: 15px; padding: 15px; background: rgba(45, 90, 123, 0.2); border-radius: 8px;">
                <div style="flex: 1;">
                    <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #7dd3fc; margin-bottom: 8px;">Tension Meter</div>
                    <div id="tensionBar" style="width: 100%; height: 24px; background: linear-gradient(90deg, #4fd46e 0%, #ffa500 50%, #dc143c 100%); border-radius: 4px; position: relative;">
                        <div id="tensionFill" style="height: 100%; background: rgba(0, 0, 0, 0.3); width: 15%; border-radius: 4px; transition: width 0.3s;"></div>
                    </div>
                </div>
                <div style="flex: 1;">
                    <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #7dd3fc; margin-bottom: 8px;">Dissonance</div>
                    <div style="font-size: 18px; font-weight: bold; color: #90e0ef;" id="dissonanceValue">0.12</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Note frequencies (A4 = 440 Hz)
        const noteFreqs = {
            'C': 261.63, 'C#': 277.18, 'D': 293.66, 'D#': 311.13, 'E': 329.63, 'F': 349.23,
            'F#': 369.99, 'G': 392.00, 'G#': 415.30, 'A': 440.00, 'A#': 466.16, 'B': 493.88
        };

        let audioCtx;
        let selectedNotes = new Set();
        let currentChordType = 'maj';
        let currentInversion = 0;
        let currentKey = 'C';
        let currentContext = 'classical';
        let oscillators = [];

        const chordIntervals = {
            'maj': [0, 4, 7],
            'min': [0, 3, 7],
            'dim': [0, 3, 6],
            'aug': [0, 4, 8],
            'sus2': [0, 2, 7],
            'sus4': [0, 5, 7],
            'dom7': [0, 4, 7, 10],
            'maj7': [0, 4, 7, 11],
            'min7': [0, 3, 7, 10]
        };

        const chordNames = {
            'maj': 'Major', 'min': 'Minor', 'dim': 'Diminished', 'aug': 'Augmented',
            'sus2': 'Sus2', 'sus4': 'Sus4', 'dom7': '7th', 'maj7': 'Maj7', 'min7': 'Min7'
        };

        const scaleNotes = {
            'C': ['C', 'D', 'E', 'F', 'G', 'A', 'B'],
            'G': ['G', 'A', 'B', 'C', 'D', 'E', 'F#'],
            'D': ['D', 'E', 'F#', 'G', 'A', 'B', 'C#'],
            'A': ['A', 'B', 'C#', 'D', 'E', 'F#', 'G#'],
            'E': ['E', 'F#', 'G#', 'A', 'B', 'C#', 'D#'],
            'B': ['B', 'C#', 'D#', 'E', 'F#', 'G#', 'A#'],
            'F#': ['F#', 'G#', 'A#', 'B', 'C#', 'D#', 'E#'],
            'Db': ['Db', 'Eb', 'F', 'Gb', 'Ab', 'Bb', 'C'],
            'Ab': ['Ab', 'Bb', 'C', 'Db', 'Eb', 'F', 'G'],
            'Eb': ['Eb', 'F', 'G', 'Ab', 'Bb', 'C', 'D'],
            'Bb': ['Bb', 'C', 'D', 'Eb', 'F', 'G', 'A'],
            'F': ['F', 'G', 'A', 'Bb', 'C', 'D', 'E']
        };

        const romanNumerals = {
            'C': ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'],
            'G': ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'],
            'D': ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'],
            'A': ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'],
            'E': ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'],
            'B': ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'],
            'F#': ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'],
            'Db': ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'],
            'Ab': ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'],
            'Eb': ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'],
            'Bb': ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'],
            'F': ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°']
        };

        function getNoteNumber(note) {
            const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            return notes.indexOf(note);
        }

        function buildChord() {
            selectedNotes.clear();
            const root = currentKey;
            const intervals = chordIntervals[currentChordType];
            const scale = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            const rootIdx = getNoteNumber(root);

            for (let i of intervals) {
                const noteIdx = (rootIdx + i) % 12;
                selectedNotes.add(scale[noteIdx]);
            }

            // Apply inversion
            if (currentInversion > 0 && currentInversion <= selectedNotes.size - 1) {
                const notes = Array.from(selectedNotes);
                for (let i = 0; i < currentInversion; i++) {
                    const n = notes.shift();
                    notes.push(n);
                }
                selectedNotes = new Set(notes);
            }

            updateDisplay();
            drawPiano();
        }

        function calculateTension() {
            if (selectedNotes.size === 0) return { tension: 0, dissonance: 0 };

            const notes = Array.from(selectedNotes);
            let tension = 10; // Base peaceful level
            let dissonance = 0;

            // Calculate dissonance from intervals
            for (let i = 0; i < notes.length; i++) {
                for (let j = i + 1; j < notes.length; j++) {
                    const n1 = getNoteNumber(notes[i]);
                    const n2 = getNoteNumber(notes[j]);
                    const interval = Math.abs(n2 - n1);
                    const normalized = Math.min(interval, 12 - interval);

                    // Dissonance based on harmonic ratios
                    const ratios = { 0: 0, 1: 0.9, 2: 0.5, 3: 0.5, 4: 0.4, 5: 0.9, 6: 0.9, 7: 0.2 };
                    dissonance += (ratios[normalized] || 0.5);
                }
            }

            dissonance = Math.min(dissonance / notes.length, 1.0);
            tension += dissonance * 40;

            // Add tritone penalty
            for (let i = 0; i < notes.length; i++) {
                for (let j = i + 1; j < notes.length; j++) {
                    const n1 = getNoteNumber(notes[i]);
                    const n2 = getNoteNumber(notes[j]);
                    const interval = Math.abs(n2 - n1);
                    if (interval === 6 || interval === 6) tension += 25;
                }
            }

            return { tension: Math.min(tension, 100), dissonance };
        }

        function getEmotion(tension) {
            if (tension < 20) return { text: 'Peaceful', color: '#4da8da' };
            if (tension < 40) return { text: 'Warm', color: '#90e0ef' };
            if (tension < 60) return { text: 'Tense', color: '#ffa500' };
            return { text: 'Unstable', color: '#dc143c' };
        }

        function updateDisplay() {
            const notes = Array.from(selectedNotes).sort((a, b) => getNoteNumber(a) - getNoteNumber(b));
            const chordName = notes[0] + ' ' + chordNames[currentChordType];
            const scale = scaleNotes[currentKey];
            const rootIdx = scale.indexOf(notes[0]);
            const roman = rootIdx >= 0 ? romanNumerals[currentKey][rootIdx] : '?';

            document.getElementById('chordName').textContent = chordName;
            document.getElementById('romanNumeral').textContent = roman;

            const { tension, dissonance } = calculateTension();
            const emotion = getEmotion(tension);

            document.getElementById('tensionValue').textContent = Math.round(tension) + ' / 100';
            document.getElementById('tensionFill').style.width = (tension) + '%';
            document.getElementById('emotionText').textContent = emotion.text;
            document.getElementById('emotionText').style.color = emotion.color;
            document.getElementById('dissonanceValue').textContent = dissonance.toFixed(2);
        }

        function drawPiano() {
            const canvas = document.getElementById('pianoCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const whiteNotes = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
            const blackOffsets = { 'C#': 0.5, 'D#': 1.5, 'F#': 3.5, 'G#': 4.5, 'A#': 5.5 };
            const whiteWidth = canvas.width / (7 * 7);
            const whiteHeight = canvas.height - 60;

            // Draw white keys
            whiteNotes.forEach((note, i) => {
                for (let octave = 0; octave < 7; octave++) {
                    const x = (octave * 7 + i) * whiteWidth;
                    const isSelected = selectedNotes.has(note);

                    ctx.fillStyle = isSelected ? '#4da8da' : '#f5f5f5';
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 2;
                    ctx.fillRect(x, 0, whiteWidth, whiteHeight);
                    ctx.strokeRect(x, 0, whiteWidth, whiteHeight);

                    if (isSelected) {
                        ctx.fillStyle = 'rgba(77, 168, 218, 0.4)';
                        ctx.fillRect(x + 2, 2, whiteWidth - 4, whiteHeight - 4);
                    }
                }
            });

            // Draw black keys
            Object.entries(blackOffsets).forEach(([note, offset]) => {
                for (let octave = 0; octave < 7; octave++) {
                    const x = (octave * 7 + offset) * whiteWidth - whiteWidth * 0.3;
                    const isSelected = selectedNotes.has(note);

                    ctx.fillStyle = isSelected ? '#90e0ef' : '#333';
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1;
                    ctx.fillRect(x, 0, whiteWidth * 0.6, whiteHeight * 0.6);
                    ctx.strokeRect(x, 0, whiteWidth * 0.6, whiteHeight * 0.6);
                }
            });

            // Draw stats at bottom
            ctx.fillStyle = '#7dd3fc';
            ctx.font = '12px "Space Mono"';
            ctx.textAlign = 'center';
            ctx.fillText(`Click keys to build chord | ${Array.from(selectedNotes).sort().join('-') || 'No notes selected'}`, canvas.width / 2, canvas.height - 20);
        }

        function playChord() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            oscillators.forEach(osc => osc.stop());
            oscillators = [];

            const now = audioCtx.currentTime;
            const notes = Array.from(selectedNotes);

            notes.forEach(note => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.frequency.value = noteFreqs[note];
                osc.type = 'sine';

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0, now + 1.5);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 1.5);
                oscillators.push(osc);
            });
        }

        // Event listeners
        document.getElementById('keySelect').addEventListener('change', (e) => {
            currentKey = e.target.value;
            buildChord();
        });

        document.querySelectorAll('.chord-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.chord-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentChordType = e.target.dataset.chord;
                buildChord();
            });
        });

        document.querySelectorAll('.inversion-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.inversion-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentInversion = parseInt(e.target.dataset.inv);
                buildChord();
            });
        });

        document.getElementById('contextSelect').addEventListener('change', (e) => {
            currentContext = e.target.value;
            updateDisplay();
        });

        document.getElementById('playBtn').addEventListener('click', playChord);

        document.getElementById('pianoCanvas').addEventListener('click', (e) => {
            const canvas = document.getElementById('pianoCanvas');
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const whiteNotes = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
            const whiteWidth = canvas.width / 49;

            const whiteIdx = Math.floor(x / whiteWidth);
            const octave = Math.floor(whiteIdx / 7);
            const noteInOctave = whiteIdx % 7;

            if (noteInOctave < whiteNotes.length) {
                const note = whiteNotes[noteInOctave];
                if (selectedNotes.has(note)) {
                    selectedNotes.delete(note);
                } else {
                    selectedNotes.add(note);
                }
                updateDisplay();
                drawPiano();
            }
        });

        // Initial setup
        buildChord();
        drawPiano();
    </script>
</body>
</html>
