<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect-4 Advanced</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Mono', monospace;
      background: linear-gradient(135deg, #0a1428 0%, #1a2a4a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }
    .container {
      max-width: 700px;
      width: 100%;
      background: #0a1d4a;
      border-radius: 16px;
      border: 2px solid #2a5a8a;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }
    h1 {
      font-family: 'Playfair Display', serif;
      text-align: center;
      margin-bottom: 10px;
      font-size: 2.5em;
      color: #4da8da;
      text-shadow: 0 2px 8px rgba(77, 168, 218, 0.3);
    }
    .subtitle {
      text-align: center;
      color: #7dd3fc;
      margin-bottom: 30px;
      font-size: 0.9em;
    }
    .board-container {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(7, 70px);
      gap: 8px;
      background: #1a3a5a;
      padding: 16px;
      border-radius: 12px;
      border: 2px solid #2a5a8a;
    }
    .column {
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
      cursor: pointer;
    }
    .cell {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #0a1d4a;
      border: 2px solid #2a4a8a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      transition: all 0.2s ease;
    }
    .cell:hover {
      background: #1a2d5a;
      border-color: #4da8da;
      transform: scale(1.05);
    }
    .cell.yellow::after {
      content: '●';
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    }
    .cell.red::after {
      content: '●';
      color: #ff4444;
      text-shadow: 0 0 10px rgba(255, 68, 68, 0.6);
    }
    .cell.highlight {
      background: #2a5a8a;
      border-color: #4da8da;
    }
    .cell.last-move {
      animation: glow 0.6s ease-in-out;
    }
    @keyframes glow {
      0%, 100% { box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.4); }
      50% { box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.8); }
    }
    .threat-warning {
      color: #ff8844;
      font-weight: bold;
      font-size: 0.85em;
      margin-top: 4px;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 20px;
      border: 2px solid #2a5a8a;
      background: #1a3a5a;
      color: #4da8da;
      font-family: 'Space Mono', monospace;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
      font-size: 0.9em;
    }
    button:hover {
      background: #2a4a8a;
      border-color: #4da8da;
      color: #fff;
      box-shadow: 0 0 12px rgba(77, 168, 218, 0.4);
    }
    button:active {
      transform: scale(0.98);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .difficulty-select {
      padding: 8px 12px;
      border: 2px solid #2a5a8a;
      background: #1a3a5a;
      color: #4da8da;
      font-family: 'Space Mono', monospace;
      border-radius: 8px;
      font-size: 0.9em;
    }
    .status {
      background: #1a3a5a;
      padding: 16px;
      border-radius: 8px;
      border-left: 4px solid #4da8da;
      margin-bottom: 20px;
      text-align: center;
    }
    .status-text {
      font-size: 1.1em;
      font-weight: bold;
      color: #4da8da;
      margin-bottom: 8px;
    }
    .status-detail {
      color: #7dd3fc;
      font-size: 0.9em;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }
    .stat-box {
      background: #1a3a5a;
      padding: 12px;
      border-radius: 8px;
      border-left: 3px solid #4da8da;
      text-align: center;
    }
    .stat-label {
      color: #7dd3fc;
      font-size: 0.8em;
      margin-bottom: 4px;
    }
    .stat-value {
      color: #ffd700;
      font-size: 1.2em;
      font-weight: bold;
    }
    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }
      h1 {
        font-size: 1.8em;
      }
      .board {
        grid-template-columns: repeat(7, 50px);
        gap: 5px;
        padding: 10px;
      }
      .cell {
        width: 50px;
        height: 50px;
        font-size: 1.5em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Connect-4</h1>
    <div class="subtitle">Beat the AI or Lose Trying</div>

    <div class="status">
      <div class="status-text" id="statusText">YOUR MOVE</div>
      <div class="status-detail" id="statusDetail">Click a column to drop your piece</div>
    </div>

    <div class="controls">
      <label>Difficulty:
        <select id="difficulty" class="difficulty-select">
          <option value="easy">Easy (Simple)</option>
          <option value="medium" selected>Medium (1-Ply)</option>
          <option value="hard">Hard (2-Ply)</option>
        </select>
      </label>
      <button onclick="resetGame()">New Game</button>
    </div>

    <div class="board-container">
      <div class="board" id="board"></div>
    </div>

    <div class="stats">
      <div class="stat-box">
        <div class="stat-label">Your Wins</div>
        <div class="stat-value" id="playerWins">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">AI Wins</div>
        <div class="stat-value" id="aiWins">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Draws</div>
        <div class="stat-value" id="draws">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Move #</div>
        <div class="stat-value" id="moveCount">0</div>
      </div>
    </div>
  </div>

  <script>
    const ROWS = 6;
    const COLS = 7;
    const PLAYER = 1;
    const AI = 2;
    const EMPTY = 0;

    let board = [];
    let gameOver = false;
    let playerTurn = true;
    let moveCount = 0;
    let lastMoveCol = -1;
    let lastMoveRow = -1;
    let playerWins = 0;
    let aiWins = 0;
    let draws = 0;

    function initBoard() {
      board = Array(ROWS).fill(null).map(() => Array(COLS).fill(EMPTY));
      gameOver = false;
      playerTurn = true;
      moveCount = 0;
      lastMoveCol = -1;
      lastMoveRow = -1;
      renderBoard();
      updateStatus("YOUR MOVE", "Click a column to drop your piece");
    }

    function resetGame() {
      initBoard();
    }

    function dropPiece(col, player) {
      if (col < 0 || col >= COLS || board[0][col] !== EMPTY) return -1;
      for (let row = ROWS - 1; row >= 0; row--) {
        if (board[row][col] === EMPTY) {
          board[row][col] = player;
          lastMoveCol = col;
          lastMoveRow = row;
          moveCount++;
          return row;
        }
      }
      return -1;
    }

    function checkWin(row, col, player) {
      const directions = [
        [0, 1], [1, 0], [1, 1], [1, -1]
      ];
      for (let [dr, dc] of directions) {
        let count = 1;
        for (let i = 1; i < 4; i++) {
          const nr = row + dr * i, nc = col + dc * i;
          if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc] === player) {
            count++;
          } else break;
        }
        for (let i = 1; i < 4; i++) {
          const nr = row - dr * i, nc = col - dc * i;
          if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc] === player) {
            count++;
          } else break;
        }
        if (count >= 4) return true;
      }
      return false;
    }

    function isBoardFull() {
      return board[0].every(cell => cell !== EMPTY);
    }

    function countPattern(row, col, player, dr, dc) {
      let count = 0;
      for (let i = -3; i <= 3; i++) {
        const nr = row + dr * i, nc = col + dc * i;
        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc] === player) {
          count++;
        }
      }
      return count;
    }

    function evaluateBoard(depth = 0) {
      let score = 0;

      // Check all cells for patterns
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c] === EMPTY) continue;

          const directions = [[0, 1], [1, 0], [1, 1], [1, -1]];
          for (let [dr, dc] of directions) {
            let playerCount = 0, aiCount = 0, emptyCount = 0;
            for (let i = -3; i < 1; i++) {
              if (i + 3 >= 4) break;
              const cells = [];
              for (let j = 0; j < 4; j++) {
                const nr = r + dr * (i + j), nc = c + dc * (i + j);
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                  cells.push(board[nr][nc]);
                }
              }
              if (cells.length === 4) {
                const pc = cells.filter(x => x === PLAYER).length;
                const ac = cells.filter(x => x === AI).length;
                const ec = cells.filter(x => x === EMPTY).length;

                if (ac === 4) score += 1000;
                if (pc === 4) score -= 1000;
                if (ac === 3 && ec === 1) score += 500;
                if (pc === 3 && ec === 1) score += 200;
                if (ac === 2 && ec === 2) score += 50;
                if (pc === 2 && ec === 2) score += 25;
              }
            }
          }
        }
      }

      // Center column preference
      for (let r = 0; r < ROWS; r++) {
        if (board[r][3] === AI) score += 10;
        if (board[r][2] === AI) score += 8;
        if (board[r][4] === AI) score += 8;
      }

      return score;
    }

    function minimax(depth, isMaximizing, alpha = -Infinity, beta = Infinity) {
      // Terminal states
      for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS; r++) {
          if (board[r][c] === AI && checkWin(r, c, AI)) return 1000 - depth;
          if (board[r][c] === PLAYER && checkWin(r, c, PLAYER)) return -1000 + depth;
        }
      }
      if (isBoardFull()) return 0;
      if (depth === 0) return evaluateBoard(depth);

      if (isMaximizing) {
        let maxScore = -Infinity;
        for (let col = 0; col < COLS; col++) {
          const row = dropPiece(col, AI);
          if (row === -1) continue;
          const score = minimax(depth - 1, false, alpha, beta);
          board[row][col] = EMPTY;
          maxScore = Math.max(maxScore, score);
          alpha = Math.max(alpha, score);
          if (beta <= alpha) break;
        }
        return maxScore === -Infinity ? evaluateBoard(0) : maxScore;
      } else {
        let minScore = Infinity;
        for (let col = 0; col < COLS; col++) {
          const row = dropPiece(col, PLAYER);
          if (row === -1) continue;
          const score = minimax(depth - 1, true, alpha, beta);
          board[row][col] = EMPTY;
          minScore = Math.min(minScore, score);
          beta = Math.min(beta, score);
          if (beta <= alpha) break;
        }
        return minScore === Infinity ? evaluateBoard(0) : minScore;
      }
    }

    function getAIMove() {
      const difficulty = document.getElementById('difficulty').value;
      let bestScore = -Infinity;
      let bestCol = -1;
      const depth = difficulty === 'easy' ? 0 : (difficulty === 'medium' ? 1 : 2);

      for (let col = 0; col < COLS; col++) {
        const row = dropPiece(col, AI);
        if (row === -1) continue;

        let score;
        if (difficulty === 'easy') {
          // Simple heuristic: check immediate wins/blocks first
          if (checkWin(row, col, AI)) {
            score = 999;
          } else {
            // Check if player has a winning threat
            score = evaluateBoard(0);
          }
        } else {
          score = minimax(depth, false);
        }

        board[row][col] = EMPTY;

        if (score > bestScore) {
          bestScore = score;
          bestCol = col;
        }
      }

      return bestCol;
    }

    function playAI() {
      if (gameOver || playerTurn) return;
      playerTurn = true;

      setTimeout(() => {
        const col = getAIMove();
        if (col !== -1) {
          const row = dropPiece(col, AI);
          if (row !== -1) {
            if (checkWin(row, col, AI)) {
              gameOver = true;
              aiWins++;
              updateStatus("AI WINS!", "The AI defeated you. Click 'New Game' to try again.");
            } else if (isBoardFull()) {
              gameOver = true;
              draws++;
              updateStatus("IT'S A DRAW!", "No winner. Click 'New Game' to try again.");
            } else {
              updateStatus("YOUR MOVE", "Click a column to continue");
            }
            renderBoard();
          }
        }
      }, 800);
    }

    function playerMove(col) {
      if (gameOver || !playerTurn) return;
      const row = dropPiece(col, PLAYER);
      if (row === -1) return;

      if (checkWin(row, col, PLAYER)) {
        gameOver = true;
        playerWins++;
        updateStatus("YOU WIN!", "Congratulations! Click 'New Game' to play again.");
      } else if (isBoardFull()) {
        gameOver = true;
        draws++;
        updateStatus("IT'S A DRAW!", "No winner. Click 'New Game' to try again.");
      } else {
        playerTurn = false;
        updateStatus("AI THINKING...", "");
        renderBoard();
        playAI();
        return;
      }

      renderBoard();
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';

      for (let col = 0; col < COLS; col++) {
        const colEl = document.createElement('div');
        colEl.className = 'column';
        colEl.onclick = () => playerMove(col);

        for (let row = 0; row < ROWS; row++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          if (lastMoveRow === row && lastMoveCol === col) {
            cell.classList.add('last-move');
          }
          if (board[row][col] === PLAYER) {
            cell.classList.add('yellow');
          } else if (board[row][col] === AI) {
            cell.classList.add('red');
          }
          colEl.appendChild(cell);
        }
        boardEl.appendChild(colEl);
      }

      document.getElementById('moveCount').textContent = moveCount;
      document.getElementById('playerWins').textContent = playerWins;
      document.getElementById('aiWins').textContent = aiWins;
      document.getElementById('draws').textContent = draws;
    }

    function updateStatus(title, detail) {
      document.getElementById('statusText').textContent = title;
      document.getElementById('statusDetail').textContent = detail;
    }

    // Init
    initBoard();
  </script>
</body>
</html>
