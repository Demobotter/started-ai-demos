<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Refraction Lens</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0e27;
      color: #e0e0e0;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      width: 100%;
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      margin-bottom: 8px;
      color: #00ffff;
    }
    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 20px;
    }
    .canvas-wrapper {
      background: #0d1825;
      border: 1px solid #1a3a4a;
      border-radius: 8px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 16 / 9;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .controls {
      background: #0d1825;
      border: 1px solid #1a3a4a;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .control-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
    }
    label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #00ff88;
      margin-bottom: 6px;
      font-weight: 500;
    }
    input[type="range"] {
      height: 5px;
      padding: 0;
      accent-color: #00ffff;
      background: #0a0e27;
      border: 1px solid #1a3a4a;
      border-radius: 4px;
      cursor: pointer;
    }
    .value-display {
      font-size: 13px;
      color: #00ffff;
      margin-top: 4px;
    }
    .stats {
      background: #0d1825;
      border: 1px solid #1a3a4a;
      border-radius: 8px;
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }
    .stat-item {
      text-align: center;
    }
    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: #00ffff;
      font-family: 'Syne', sans-serif;
    }
    .info-text {
      font-size: 12px;
      color: #888;
      margin-top: 8px;
    }
    @media (max-width: 600px) {
      h1 { font-size: 24px; }
      .control-row { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Refraction Lens</h1>
    <p class="subtitle">Real-time optical refraction using Snell's law and critical angle detection</p>

    <div class="canvas-wrapper">
      <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
      <div class="control-row">
        <div class="control-group">
          <label>Incident Angle (°)</label>
          <input type="range" id="incidentAngle" min="0" max="85" step="1" value="30">
          <div class="value-display" id="angleDisplay">30°</div>
        </div>
        <div class="control-group">
          <label>Refractive Index (n)</label>
          <input type="range" id="refractiveIndex" min="1.0" max="2.5" step="0.1" value="1.5">
          <div class="value-display" id="indexDisplay">1.5</div>
        </div>
      </div>
      <p class="info-text" id="infoText">Drag the lens to reposition. Watch rays refract and reflect in real-time.</p>
    </div>

    <div class="stats">
      <div class="stat-item">
        <div class="stat-label">Critical Angle</div>
        <div class="stat-value" id="criticalAngle">41.8°</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Refracted Angle</div>
        <div class="stat-value" id="refractedAngle">19.5°</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Reflection %</div>
        <div class="stat-value" id="reflectionPercent">7.4%</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Total Internal Reflection</div>
        <div class="stat-value" id="tirStatus">NO</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const w = canvas.width / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);

    // State
    let incidentAngle = 30; // degrees
    let refractiveIndex = 1.5; // n_glass (n_air = 1)
    let lensX = w / 2;
    let lensY = h / 2;
    let lensRadius = 60;
    let draggingLens = false;

    // Physics
    function degreesToRadians(deg) {
      return deg * Math.PI / 180;
    }

    function radiansToDegrees(rad) {
      return rad * 180 / Math.PI;
    }

    function snellsLaw(angle1_deg, n1, n2) {
      const angle1 = degreesToRadians(angle1_deg);
      const sinAngle2 = (n1 / n2) * Math.sin(angle1);
      if (sinAngle2 > 1) {
        // Total internal reflection
        return { angle: null, tir: true };
      }
      return { angle: radiansToDegrees(Math.asin(sinAngle2)), tir: false };
    }

    function fresnelReflection(angle_deg, n1, n2) {
      const angle = degreesToRadians(angle_deg);
      const cosTheta_i = Math.cos(angle);
      const sinTheta_t_sq = (n1 / n2) * Math.sin(angle);
      sinTheta_t_sq = sinTheta_t_sq * sinTheta_t_sq;
      if (sinTheta_t_sq > 1) return 1.0; // TIR, 100% reflection
      const cosTheta_t = Math.sqrt(1 - sinTheta_t_sq);
      const rsPerpendicular = (n1 * cosTheta_i - n2 * cosTheta_t) / (n1 * cosTheta_i + n2 * cosTheta_t);
      const rsParallel = (n1 * cosTheta_t - n2 * cosTheta_i) / (n1 * cosTheta_t + n2 * cosTheta_i);
      const reflectance = 0.5 * (rsPerpendicular * rsPerpendicular + rsParallel * rsParallel);
      return Math.max(0, Math.min(1, reflectance));
    }

    function getCriticalAngle(n1, n2) {
      if (n1 <= n2) return null;
      return radiansToDegrees(Math.asin(n2 / n1));
    }

    function drawRays() {
      const rayStartX = 50;
      const raySpacing = (h - 100) / 4;

      for (let i = 0; i < 5; i++) {
        const rayStartY = 50 + i * raySpacing;

        // Incident ray
        const rayDir = { x: 1, y: Math.tan(degreesToRadians(incidentAngle)) };
        const rayLen = 200;
        const rayEndX = rayStartX + rayLen * Math.cos(degreesToRadians(incidentAngle));
        const rayEndY = rayStartY + rayLen * Math.sin(degreesToRadians(incidentAngle));

        // Draw incident ray
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 2;
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(rayStartX, rayStartY);
        ctx.lineTo(rayEndX, rayEndY);
        ctx.stroke();

        // Hit lens at intersection
        const hitPoint = rayLensIntersection(rayStartX, rayStartY, rayEndX, rayEndY);
        if (hitPoint) {
          // Refracted ray
          const result = snellsLaw(incidentAngle, 1, refractiveIndex);
          if (!result.tir) {
            const refractedDir = result.angle;
            const refractedEndX = hitPoint.x + rayLen * 0.6 * Math.cos(degreesToRadians(refractedDir));
            const refractedEndY = hitPoint.y + rayLen * 0.6 * Math.sin(degreesToRadians(refractedDir));
            ctx.strokeStyle = '#00ff88';
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(hitPoint.x, hitPoint.y);
            ctx.lineTo(refractedEndX, refractedEndY);
            ctx.stroke();
          }

          // Reflected ray
          const reflectedAngle = -incidentAngle; // law of reflection
          const reflectedEndX = hitPoint.x + rayLen * 0.5 * Math.cos(degreesToRadians(reflectedAngle));
          const reflectedEndY = hitPoint.y + rayLen * 0.5 * Math.sin(degreesToRadians(reflectedAngle));
          ctx.strokeStyle = '#ff6b35';
          ctx.setLineDash([]);
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(hitPoint.x, hitPoint.y);
          ctx.lineTo(reflectedEndX, reflectedEndY);
          ctx.stroke();

          // Hit point marker
          ctx.fillStyle = '#ffb700';
          ctx.beginPath();
          ctx.arc(hitPoint.x, hitPoint.y, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function rayLensIntersection(x1, y1, x2, y2) {
      // Simple ray-circle intersection
      const dx = x2 - x1;
      const dy = y2 - y1;
      const fx = x1 - lensX;
      const fy = y1 - lensY;

      const a = dx * dx + dy * dy;
      const b = 2 * (fx * dx + fy * dy);
      const c = fx * fx + fy * fy - lensRadius * lensRadius;

      const discriminant = b * b - 4 * a * c;
      if (discriminant < 0) return null;

      const t = (-b - Math.sqrt(discriminant)) / (2 * a);
      if (t < 0 || t > 1) return null;

      return {
        x: x1 + t * dx,
        y: y1 + t * dy
      };
    }

    function draw() {
      // Background
      ctx.fillStyle = '#0d1825';
      ctx.fillRect(0, 0, w, h);

      // Grid
      ctx.strokeStyle = 'rgba(26, 58, 74, 0.3)';
      ctx.lineWidth = 0.5;
      for (let x = 0; x < w; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      for (let y = 0; y < h; y += 50) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      drawRays();

      // Lens (glass circle)
      ctx.fillStyle = 'rgba(0, 255, 255, 0.1)';
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(lensX, lensY, lensRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Lens center
      ctx.fillStyle = '#00ffff';
      ctx.beginPath();
      ctx.arc(lensX, lensY, 4, 0, Math.PI * 2);
      ctx.fill();

      // Normal line
      ctx.strokeStyle = 'rgba(255, 183, 0, 0.3)';
      ctx.setLineDash([3, 3]);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(lensX, 0);
      ctx.lineTo(lensX, h);
      ctx.stroke();
    }

    function updateStats() {
      const critAngle = getCriticalAngle(refractiveIndex, 1);
      const refResult = snellsLaw(incidentAngle, 1, refractiveIndex);
      const reflection = fresnelReflection(incidentAngle, 1, refractiveIndex);
      const isTIR = refResult.tir;

      document.getElementById('criticalAngle').textContent = critAngle ? critAngle.toFixed(1) + '°' : 'N/A';
      document.getElementById('refractedAngle').textContent = refResult.angle ? refResult.angle.toFixed(1) + '°' : 'TIR';
      document.getElementById('reflectionPercent').textContent = (reflection * 100).toFixed(1) + '%';
      document.getElementById('tirStatus').textContent = isTIR ? 'YES' : 'NO';
    }

    function animate() {
      draw();
      updateStats();
      requestAnimationFrame(animate);
    }

    // Controls
    document.getElementById('incidentAngle').addEventListener('input', (e) => {
      incidentAngle = parseFloat(e.target.value);
      document.getElementById('angleDisplay').textContent = incidentAngle.toFixed(0) + '°';
    });
    document.getElementById('refractiveIndex').addEventListener('input', (e) => {
      refractiveIndex = parseFloat(e.target.value);
      document.getElementById('indexDisplay').textContent = refractiveIndex.toFixed(1);
    });

    // Lens drag
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const x = (e.clientX - rect.left) / dpr;
      const y = (e.clientY - rect.top) / dpr;
      const dist = Math.sqrt((x - lensX) ** 2 + (y - lensY) ** 2);
      if (dist < lensRadius + 10) {
        draggingLens = true;
      }
    });
    window.addEventListener('mousemove', (e) => {
      if (draggingLens) {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        lensX = (e.clientX - rect.left) / dpr;
        lensY = (e.clientY - rect.top) / dpr;
        lensX = Math.max(lensRadius, Math.min(w - lensRadius, lensX));
        lensY = Math.max(lensRadius, Math.min(h - lensRadius, lensY));
      }
    });
    window.addEventListener('mouseup', () => {
      draggingLens = false;
    });

    // Touch support
    canvas.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const x = (touch.clientX - rect.left) / dpr;
      const y = (touch.clientY - rect.top) / dpr;
      const dist = Math.sqrt((x - lensX) ** 2 + (y - lensY) ** 2);
      if (dist < lensRadius + 10) {
        draggingLens = true;
      }
    });
    window.addEventListener('touchmove', (e) => {
      if (draggingLens) {
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        lensX = (touch.clientX - rect.left) / dpr;
        lensY = (touch.clientY - rect.top) / dpr;
        lensX = Math.max(lensRadius, Math.min(w - lensRadius, lensX));
        lensY = Math.max(lensRadius, Math.min(h - lensRadius, lensY));
      }
    });
    window.addEventListener('touchend', () => {
      draggingLens = false;
    });

    // Start
    animate();
  </script>
</body>
</html>
