<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chord Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 100%);
            color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .controls {
            margin-bottom: 30px;
        }
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 0.9rem;
        }
        select, input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(71, 85, 105, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 6px;
            color: #e5e7eb;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            margin-bottom: 15px;
            transition: border-color 0.2s;
        }
        select:hover, input:hover {
            border-color: rgba(148, 163, 184, 0.5);
        }
        select:focus, input:focus {
            outline: none;
            border-color: #60a5fa;
            background: rgba(71, 85, 105, 0.7);
        }
        .canvas-wrapper {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 4px;
        }
        .notes-display {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        .note-card {
            background: rgba(71, 85, 105, 0.4);
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 6px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .note-card:hover {
            background: rgba(96, 165, 250, 0.2);
            border-color: rgba(96, 165, 250, 0.6);
            transform: translateY(-2px);
        }
        .note-name {
            font-weight: 600;
            color: #60a5fa;
            font-size: 1rem;
            margin-bottom: 4px;
        }
        .note-freq {
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        button {
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-secondary {
            background: rgba(96, 165, 250, 0.2);
            color: #60a5fa;
            border: 1px solid #60a5fa;
        }
        .btn-secondary:hover {
            background: rgba(96, 165, 250, 0.3);
        }
        .info {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 15px;
            text-align: center;
        }
        @media (max-width: 600px) {
            .container {
                padding: 25px 20px;
            }
            h1 {
                font-size: 2rem;
            }
            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Chord Lab</h1>
        <p class="subtitle">Pick a chord and watch the frequencies play</p>
        
        <div class="controls">
            <label for="root">Root Note</label>
            <select id="root">
                <option value="C">C</option>
                <option value="C#">C# / Db</option>
                <option value="D">D</option>
                <option value="D#">D# / Eb</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="F#">F# / Gb</option>
                <option value="G">G</option>
                <option value="G#">G# / Ab</option>
                <option value="A" selected>A</option>
                <option value="A#">A# / Bb</option>
                <option value="B">B</option>
            </select>
            
            <label for="octave">Octave</label>
            <select id="octave">
                <option value="3">3</option>
                <option value="4" selected>4</option>
                <option value="5">5</option>
            </select>
            
            <label for="chord">Chord Type</label>
            <select id="chord">
                <option value="major" selected>Major</option>
                <option value="minor">Minor</option>
                <option value="maj7">Major 7th</option>
                <option value="min7">Minor 7th</option>
                <option value="dom7">Dominant 7th</option>
                <option value="sus2">Suspended 2</option>
                <option value="sus4">Suspended 4</option>
                <option value="aug">Augmented</option>
                <option value="dim">Diminished</option>
            </select>
        </div>

        <div class="canvas-wrapper">
            <canvas id="waveCanvas" width="500" height="150"></canvas>
        </div>

        <div class="notes-display" id="notesDisplay"></div>

        <div class="button-group">
            <button class="btn-primary" id="playBtn">Play Chord</button>
            <button class="btn-secondary" id="stopBtn">Stop</button>
        </div>

        <p class="info">Click on a note card to play just that note • Real frequencies (Hz) shown below each note</p>
    </div>

    <script>
        // Note-to-frequency mapping (A4 = 440 Hz, standard tuning)
        const noteFreqs = {
            'C': { 3: 130.81, 4: 261.63, 5: 523.25 },
            'C#': { 3: 138.59, 4: 277.18, 5: 554.37 },
            'D': { 3: 146.83, 4: 293.66, 5: 587.33 },
            'D#': { 3: 155.56, 4: 311.13, 5: 622.25 },
            'E': { 3: 164.81, 4: 329.63, 5: 659.25 },
            'F': { 3: 174.61, 4: 349.23, 5: 698.46 },
            'F#': { 3: 185.00, 4: 369.99, 5: 739.99 },
            'G': { 3: 196.00, 4: 392.00, 5: 783.99 },
            'G#': { 3: 207.65, 4: 415.30, 5: 830.61 },
            'A': { 3: 220.00, 4: 440.00, 5: 880.00 },
            'A#': { 3: 233.08, 4: 466.16, 5: 932.33 },
            'B': { 3: 246.94, 4: 493.88, 5: 987.77 }
        };

        const chordIntervals = {
            'major': [0, 4, 7],
            'minor': [0, 3, 7],
            'maj7': [0, 4, 7, 11],
            'min7': [0, 3, 7, 10],
            'dom7': [0, 4, 7, 10],
            'sus2': [0, 2, 7],
            'sus4': [0, 5, 7],
            'aug': [0, 4, 8],
            'dim': [0, 3, 6]
        };

        const allNotes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        let audioCtx = null;
        let oscillators = [];
        let gainNodes = [];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function getRootIndex(note) {
            return allNotes.indexOf(note);
        }

        function getChordNotes() {
            const root = document.getElementById('root').value;
            const octave = parseInt(document.getElementById('octave').value);
            const chordType = document.getElementById('chord').value;
            const intervals = chordIntervals[chordType];
            const rootIdx = getRootIndex(root);

            const notes = [];
            intervals.forEach(interval => {
                const noteIdx = (rootIdx + interval) % 12;
                const noteName = allNotes[noteIdx];
                const noteOctave = octave + Math.floor((rootIdx + interval) / 12);
                const freq = noteFreqs[noteName][noteOctave];
                notes.push({ name: noteName, octave: noteOctave, freq: freq });
            });
            return notes;
        }

        function renderNotes() {
            const notes = getChordNotes();
            const container = document.getElementById('notesDisplay');
            container.innerHTML = '';
            notes.forEach((note, idx) => {
                const card = document.createElement('div');
                card.className = 'note-card';
                card.innerHTML = `<div class="note-name">${note.name}</div><div class="note-freq">${note.freq.toFixed(2)} Hz</div>`;
                card.onclick = () => playNote(note.freq);
                container.appendChild(card);
            });
        }

        function drawWaveform(frequencies) {
            const canvas = document.getElementById('waveCanvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            ctx.fillStyle = 'rgba(15, 23, 42, 1)';
            ctx.fillRect(0, 0, w, h);

            ctx.strokeStyle = 'rgba(96, 165, 250, 0.8)';
            ctx.lineWidth = 2;
            ctx.beginPath();

            const samples = 400;
            const time = Date.now() / 1000;
            for (let x = 0; x < samples; x++) {
                let y = 0;
                frequencies.forEach((freq, idx) => {
                    y += Math.sin(2 * Math.PI * freq * (x / samples / 0.05 + time)) / frequencies.length;
                });
                const px = (x / samples) * w;
                const py = h / 2 - (y * h / 4);
                if (x === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.stroke();

            requestAnimationFrame(() => drawWaveform(frequencies));
        }

        function playChord() {
            stopAll();
            initAudio();

            const notes = getChordNotes();
            const now = audioCtx.currentTime;
            const duration = 3;

            notes.forEach(note => {
                const osc = audioCtx.createOscillator();
                osc.frequency.value = note.freq;
                osc.type = 'sine';

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + duration);

                oscillators.push(osc);
                gainNodes.push(gain);
            });

            const frequencies = notes.map(n => n.freq);
            drawWaveform(frequencies);
        }

        function playNote(freq) {
            stopAll();
            initAudio();

            const osc = audioCtx.createOscillator();
            osc.frequency.value = freq;
            osc.type = 'sine';

            const gain = audioCtx.createGain();
            const now = audioCtx.currentTime;
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 1.5);

            drawWaveform([freq]);
        }

        function stopAll() {
            oscillators.forEach(osc => {
                try { osc.stop(); } catch (e) {}
            });
            oscillators = [];
            gainNodes = [];
        }

        // Event listeners
        document.getElementById('playBtn').addEventListener('click', playChord);
        document.getElementById('stopBtn').addEventListener('click', stopAll);
        document.getElementById('root').addEventListener('change', renderNotes);
        document.getElementById('chord').addEventListener('change', renderNotes);
        document.getElementById('octave').addEventListener('change', renderNotes);

        // Init
        renderNotes();
        drawWaveform([440]);
    </script>
</body>
</html>
