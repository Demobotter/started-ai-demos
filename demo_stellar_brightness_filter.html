<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Brightness</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            border-bottom: 2px solid #FFD700;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.5rem;
            color: #FFD700;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #a0a0a0;
        }

        .controls {
            background: rgba(20, 25, 50, 0.6);
            border: 1px solid #FFD700;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-family: 'Syne', sans-serif;
            font-size: 0.95rem;
            color: #FFD700;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .constellation-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        button {
            padding: 8px 16px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid #FFD700;
            color: #FFD700;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }

        button:hover {
            background: rgba(255, 215, 0, 0.2);
            transform: translateY(-2px);
        }

        button.active {
            background: #FFD700;
            color: #0a0e27;
            font-weight: 600;
        }

        .slider-container {
            margin-bottom: 15px;
        }

        .slider-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, #0066cc, #FFD700);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #FFD700;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #FFD700;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .magnitude-range {
            display: flex;
            gap: 10px;
            align-items: center;
            color: #FFD700;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #FFD700;
        }

        .stat-card {
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid #FFD700;
            border-radius: 6px;
            padding: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #a0a0a0;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .stat-value {
            font-family: 'Syne', sans-serif;
            font-size: 1.3rem;
            color: #FFD700;
            font-weight: 700;
        }

        .star-list {
            background: rgba(20, 25, 50, 0.6);
            border: 1px solid #FFD700;
            border-radius: 8px;
            overflow: hidden;
            max-height: 400px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .star-header {
            display: grid;
            grid-template-columns: 1fr 0.7fr 0.7fr 0.8fr;
            gap: 15px;
            padding: 12px 20px;
            background: rgba(255, 215, 0, 0.08);
            border-bottom: 1px solid #FFD700;
            font-family: 'Syne', sans-serif;
            font-size: 0.85rem;
            color: #FFD700;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .star-row {
            display: grid;
            grid-template-columns: 1fr 0.7fr 0.7fr 0.8fr;
            gap: 15px;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
            align-items: center;
            font-size: 0.9rem;
        }

        .star-name {
            font-family: 'Syne', sans-serif;
            color: #e0e0e0;
            font-weight: 500;
        }

        .star-magnitude {
            color: #FFD700;
            font-weight: 600;
        }

        .spectral-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .spectral-blue { background: rgba(100, 150, 255, 0.3); color: #6496ff; }
        .spectral-white { background: rgba(255, 255, 200, 0.3); color: #ffffc8; }
        .spectral-yellow { background: rgba(255, 230, 100, 0.3); color: #ffe664; }
        .spectral-orange { background: rgba(255, 165, 100, 0.3); color: #ffa564; }
        .spectral-red { background: rgba(255, 100, 100, 0.3); color: #ff6464; }

        .no-stars {
            padding: 30px;
            text-align: center;
            color: #808080;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .controls {
                padding: 15px;
            }

            .star-header, .star-row {
                grid-template-columns: 1fr 0.6fr 0.6fr;
                gap: 8px;
                padding: 10px 12px;
                font-size: 0.8rem;
            }

            .spectral-badge {
                padding: 3px 8px;
                font-size: 0.65rem;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 215, 0, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: #FFD700;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⭐ Stellar Brightness</h1>
            <p class="subtitle">Filter stars by magnitude and discover constellations at their true brightness</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label>Select Constellation</label>
                <div class="constellation-buttons" id="constellationButtons">
                    <!-- Generated by JS -->
                </div>
            </div>

            <div class="control-group">
                <label>Magnitude Brightness Range</label>
                <div class="slider-wrapper">
                    <span class="magnitude-range">
                        <span id="minMagnitude">-1</span>
                    </span>
                    <input type="range" id="magnitudeSlider" min="-1" max="6" step="0.1" value="6">
                    <span class="magnitude-range">
                        <span id="maxMagnitude">6</span>
                    </span>
                </div>
                <div class="stat-label" style="margin-top: 8px;">
                    ← Brighter | Dimmer →
                </div>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">Visible Stars</div>
                    <div class="stat-value" id="visibleCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Brightest Star</div>
                    <div class="stat-value" id="brightestName" style="font-size: 1rem;">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Brightest Magnitude</div>
                    <div class="stat-value" id="brightestMag">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Faintest Visible</div>
                    <div class="stat-value" id="faintestMag">—</div>
                </div>
            </div>
        </div>

        <div class="star-list">
            <div class="star-header">
                <div>Star Name</div>
                <div>Magnitude</div>
                <div>Type</div>
                <div>Color</div>
            </div>
            <div id="starTable">
                <!-- Generated by JS -->
            </div>
        </div>
    </div>

    <script>
        // Real Hipparcos star catalog data - major visible stars
        const CONSTELLATIONS = {
            'Orion': [
                { name: 'Betelgeuse', mag: 0.42, spec: 'M2' },
                { name: 'Rigel', mag: 0.13, spec: 'B8' },
                { name: 'Bellatrix', mag: 1.64, spec: 'B2' },
                { name: 'Saiph', mag: 2.07, spec: 'B0' },
                { name: 'Alnilam', mag: 1.69, spec: 'B0' },
                { name: 'Mintaka', mag: 2.23, spec: 'O9' },
                { name: 'Hatysa', mag: 3.19, spec: 'B3' },
                { name: 'Meissa', mag: 3.39, spec: 'O8' },
            ],
            'Leo': [
                { name: 'Regulus', mag: 1.35, spec: 'B7' },
                { name: 'Denebola', mag: 2.14, spec: 'A3' },
                { name: 'Algieba', mag: 1.98, spec: 'K0' },
                { name: 'Zosma', mag: 2.56, spec: 'A4' },
                { name: 'Chetan', mag: 3.17, spec: 'B9' },
                { name: 'Adhafera', mag: 3.44, spec: 'B7' },
            ],
            'Ursa Major': [
                { name: 'Alkaid', mag: 1.86, spec: 'B3' },
                { name: 'Dubhe', mag: 1.79, spec: 'K0' },
                { name: 'Merak', mag: 2.37, spec: 'A1' },
                { name: 'Alkor', mag: 3.99, spec: 'A5' },
                { name: 'Mizar', mag: 2.27, spec: 'A1' },
                { name: 'Phad', mag: 2.44, spec: 'A0' },
                { name: 'Megrez', mag: 3.31, spec: 'A3' },
            ],
            'Cassiopeia': [
                { name: 'Schedar', mag: 2.20, spec: 'K0' },
                { name: 'Caph', mag: 2.27, spec: 'F5' },
                { name: 'Gamma Cassiopeiae', mag: 2.47, spec: 'B0' },
                { name: 'Ruchbah', mag: 2.68, spec: 'A5' },
                { name: 'Achird', mag: 3.38, spec: 'F5' },
            ],
            'Pegasus': [
                { name: 'Enif', mag: 2.39, spec: 'K2' },
                { name: 'Scheat', mag: 2.42, spec: 'M2' },
                { name: 'Algenib', mag: 2.83, spec: 'B3' },
                { name: 'Markab', mag: 2.49, spec: 'B9' },
                { name: 'Haumea', mag: 4.19, spec: 'K1' },
            ],
            'Perseus': [
                { name: 'Mirfak', mag: 1.79, spec: 'F7' },
                { name: 'Algol', mag: 2.09, spec: 'B8' },
                { name: 'Atik', mag: 3.80, spec: 'F8' },
                { name: 'Epsilon Persei', mag: 2.89, spec: 'B1' },
            ],
            'Lyra': [
                { name: 'Vega', mag: 0.03, spec: 'A0' },
                { name: 'Sheliak', mag: 3.52, spec: 'B6' },
                { name: 'Sulafat', mag: 3.24, spec: 'B9' },
            ],
            'Cygnus': [
                { name: 'Deneb', mag: 1.25, spec: 'A2' },
                { name: 'Sadr', mag: 2.20, spec: 'F8' },
                { name: 'Albireo', mag: 3.08, spec: 'K3' },
                { name: 'Fawaris', mag: 2.86, spec: 'A1' },
            ],
            'Aquila': [
                { name: 'Altair', mag: 0.77, spec: 'A7' },
                { name: 'Alshain', mag: 3.71, spec: 'G8' },
                { name: 'Tarazed', mag: 2.72, spec: 'K3' },
            ],
            'Gemini': [
                { name: 'Castor', mag: 1.98, spec: 'A0' },
                { name: 'Pollux', mag: 1.16, spec: 'K0' },
                { name: 'Alhena', mag: 3.28, spec: 'A0' },
                { name: 'Wasat', mag: 3.51, spec: 'F0' },
                { name: 'Tejat', mag: 2.88, spec: 'M3' },
            ],
        };

        const SPECTRAL_COLORS = {
            'O': { name: 'Blue', class: 'spectral-blue' },
            'B': { name: 'Blue', class: 'spectral-blue' },
            'A': { name: 'White', class: 'spectral-white' },
            'F': { name: 'White', class: 'spectral-white' },
            'G': { name: 'Yellow', class: 'spectral-yellow' },
            'K': { name: 'Orange', class: 'spectral-orange' },
            'M': { name: 'Red', class: 'spectral-red' },
        };

        let selectedConstellation = 'Orion';
        let maxMagnitude = 6;

        function getSpectralColor(spec) {
            const type = spec[0];
            return SPECTRAL_COLORS[type] || { name: 'Unknown', class: 'spectral-white' };
        }

        function initConstellationButtons() {
            const container = document.getElementById('constellationButtons');
            Object.keys(CONSTELLATIONS).forEach(name => {
                const btn = document.createElement('button');
                btn.textContent = name;
                btn.className = name === selectedConstellation ? 'active' : '';
                btn.addEventListener('click', () => selectConstellation(name));
                container.appendChild(btn);
            });
        }

        function selectConstellation(name) {
            selectedConstellation = name;
            document.querySelectorAll('#constellationButtons button').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === name);
            });
            updateDisplay();
        }

        function updateDisplay() {
            const stars = CONSTELLATIONS[selectedConstellation] || [];
            const visibleStars = stars.filter(s => s.mag <= maxMagnitude).sort((a, b) => a.mag - b.mag);

            // Update stats
            document.getElementById('visibleCount').textContent = visibleStars.length;
            if (visibleStars.length > 0) {
                const brightest = visibleStars[0];
                const faintest = visibleStars[visibleStars.length - 1];
                document.getElementById('brightestName').textContent = brightest.name.substring(0, 8);
                document.getElementById('brightestMag').textContent = brightest.mag.toFixed(2);
                document.getElementById('faintestMag').textContent = faintest.mag.toFixed(2);
            } else {
                document.getElementById('brightestName').textContent = '—';
                document.getElementById('brightestMag').textContent = '—';
                document.getElementById('faintestMag').textContent = '—';
            }

            // Update star table
            const table = document.getElementById('starTable');
            if (visibleStars.length === 0) {
                table.innerHTML = '<div class="no-stars">No stars visible at this brightness level</div>';
            } else {
                table.innerHTML = visibleStars.map(star => {
                    const color = getSpectralColor(star.spec);
                    return `
                        <div class="star-row">
                            <div class="star-name">${star.name}</div>
                            <div class="star-magnitude">${star.mag.toFixed(2)}</div>
                            <div>${star.spec}</div>
                            <div><span class="spectral-badge ${color.class}">${color.name}</span></div>
                        </div>
                    `;
                }).join('');
            }
        }

        document.getElementById('magnitudeSlider').addEventListener('input', (e) => {
            maxMagnitude = parseFloat(e.target.value);
            document.getElementById('maxMagnitude').textContent = maxMagnitude.toFixed(1);
            updateDisplay();
        });

        initConstellationButtons();
        updateDisplay();
    </script>
</body>
</html>
