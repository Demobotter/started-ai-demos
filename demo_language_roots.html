<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Roots</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f1e8 0%, #e8e5d9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #faf8f5;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }
        h1 {
            font-family: 'Merriweather', serif;
            color: #1a1a1a;
            margin-bottom: 10px;
            font-size: 32px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .search-box {
            margin-bottom: 30px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #d0c8b8;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #8b7355;
        }
        .presets {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .preset-btn {
            padding: 8px 14px;
            background: #e8dcc8;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            transition: all 0.2s;
        }
        .preset-btn:hover {
            background: #d8ccb8;
            transform: translateY(-2px);
        }
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        .etymology-tree {
            background: #fffbf5;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #d4a574;
        }
        .tree-node {
            margin: 12px 0;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.5;
        }
        .root-node {
            background: #fff0e6;
            border-left: 3px solid #d4a574;
            font-weight: 600;
        }
        .intermediate-node {
            background: #f5ede1;
            border-left: 3px solid #a89080;
            margin-left: 16px;
        }
        .modern-node {
            background: #1a1a1a;
            color: #faf8f5;
            border-left: 3px solid #4db8ff;
            margin-left: 32px;
            font-weight: 600;
        }
        .language-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 500;
            margin-left: 8px;
        }
        .indo-european {
            background: #ffd700;
            color: #333;
        }
        .latin {
            background: #ff6b6b;
            color: #fff;
        }
        .greek {
            background: #4db8ff;
            color: #fff;
        }
        .germanic {
            background: #2d9d5f;
            color: #fff;
        }
        .stats-panel {
            background: #f0e8dc;
            padding: 20px;
            border-radius: 8px;
            border-top: 4px solid #8b7355;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 13px;
        }
        .stat-label {
            color: #666;
            font-weight: 500;
        }
        .stat-value {
            color: #1a1a1a;
            font-weight: 600;
            font-family: 'Merriweather', serif;
        }
        .info-box {
            background: #e8f5e9;
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 4px solid #2d9d5f;
        }
        .info-title {
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .info-text {
            font-size: 12px;
            color: #333;
            line-height: 1.6;
        }
        @media (max-width: 700px) {
            .content {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔤 Language Roots</h1>
        <p class="subtitle">Trace the etymology of English words through centuries</p>
        
        <div class="search-box">
            <input type="text" id="wordInput" placeholder="Type a word (e.g., 'journey', 'algorithm', 'galaxy')..." list="wordList">
            <datalist id="wordList">
                <option value="journey">
                <option value="algorithm">
                <option value="galaxy">
                <option value="music">
                <option value="window">
                <option value="parent">
                <option value="sister">
                <option value="heart">
                <option value="sky">
            </datalist>
        </div>

        <div class="presets">
            <button class="preset-btn" onclick="loadPreset('shakespeare')">Shakespeare Words</button>
            <button class="preset-btn" onclick="loadPreset('science')">Scientific Terms</button>
            <button class="preset-btn" onclick="loadPreset('food')">Food Words</button>
        </div>

        <div class="content">
            <div class="etymology-tree">
                <div id="etymologyTree"></div>
            </div>
            <div>
                <div class="stats-panel">
                    <div class="stat-row">
                        <span class="stat-label">Current Word:</span>
                        <span class="stat-value" id="currentWord">—</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Earliest Entry:</span>
                        <span class="stat-value" id="earliestEntry">—</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Language Family:</span>
                        <span class="stat-value" id="langFamily">—</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Related Words:</span>
                        <span class="stat-value" id="relatedCount">—</span>
                    </div>
                </div>

                <div class="info-box">
                    <div class="info-title">Meaning & Usage</div>
                    <div class="info-text" id="meaning">Select a word to see its meaning and linguistic history.</div>
                </div>

                <div class="info-box">
                    <div class="info-title">Related Words</div>
                    <div class="info-text" id="related">Related words will appear here.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const etymologyData = {
            "journey": {
                meaning: "A period of traveling from one place to another; a process or passage.",
                family: "French → Latin",
                earliest: "1250 CE (Middle English jornee)",
                path: [
                    { text: "Proto-Indo-European *dyeu- (day, sky)", lang: "indo-european" },
                    { text: "Latin dies (day)", lang: "latin" },
                    { text: "Old French jornée (a day's traveling, a day's work)", lang: "latin" },
                    { text: "Middle English journee (1250)", lang: "latin" },
                    { text: "Modern English journey", lang: "germanic" }
                ],
                related: ["journal", "diurnal", "diary", "meridian", "adjourn"]
            },
            "algorithm": {
                meaning: "A step-by-step procedure for solving a problem or performing a task.",
                family: "Arabic → Persian → Medieval Latin",
                earliest: "1200 CE (from Latin algorismus)",
                path: [
                    { text: "Arabic al-Khwārizmī (the Khwarizmi mathematician)", lang: "indo-european" },
                    { text: "Medieval Latin algorismus (9th century translation)", lang: "latin" },
                    { text: "Old French/Latin algoritme (12th century mathematics)", lang: "latin" },
                    { text: "Middle English algoritme", lang: "latin" },
                    { text: "Modern English algorithm", lang: "germanic" }
                ],
                related: ["arithmetic", "logarithm"]
            },
            "galaxy": {
                meaning: "A system of billions of stars held together by gravity; a vast assemblage.",
                family: "Greek → Middle English",
                earliest: "1375 CE (from Greek galaxías kýklos)",
                path: [
                    { text: "Proto-Indo-European *gal- (milk)", lang: "indo-european" },
                    { text: "Greek gála (milk)", lang: "greek" },
                    { text: "Greek galaxías kýklos (milky circle, the Milky Way)", lang: "greek" },
                    { text: "Medieval Latin galaxia", lang: "latin" },
                    { text: "Middle English galaxie (1375)", lang: "latin" },
                    { text: "Modern English galaxy", lang: "germanic" }
                ],
                related: ["galactic", "lactose", "milk"]
            },
            "music": {
                meaning: "The art of combining sounds in time to produce beauty of form and expression.",
                family: "Greek → Latin → Old French",
                earliest: "1200s CE (Old French musique)",
                path: [
                    { text: "Proto-Indo-European *men- (to think, remember)", lang: "indo-european" },
                    { text: "Greek mousike (art of the Muses, mousiké téchnē)", lang: "greek" },
                    { text: "Latin musica", lang: "latin" },
                    { text: "Old French musique (1200s)", lang: "latin" },
                    { text: "Middle English musik/musike", lang: "latin" },
                    { text: "Modern English music", lang: "germanic" }
                ],
                related: ["musician", "musical", "muse", "museum"]
            },
            "window": {
                meaning: "An opening in a wall to admit light and air; a transparent pane of glass.",
                family: "Old Norse → Middle English",
                earliest: "1300 CE (Old Norse vindauga)",
                path: [
                    { text: "Proto-Germanic *windaz (wind)", lang: "germanic" },
                    { text: "Old Norse vindr (wind) + auga (eye)", lang: "germanic" },
                    { text: "Old Norse vindauga (wind-eye, literally an opening)", lang: "germanic" },
                    { text: "Middle English windowe (1300)", lang: "germanic" },
                    { text: "Modern English window", lang: "germanic" }
                ],
                related: ["wind", "windward", "auge (archaic: eye)"]
            },
            "parent": {
                meaning: "A biological mother or father; one that produces or brings into being.",
                family: "Latin → Old French",
                earliest: "1200s CE (Old French parent)",
                path: [
                    { text: "Proto-Indo-European *per- (to lead, pass over)", lang: "indo-european" },
                    { text: "Latin parens (parent, ancestor; literally 'one who begets')", lang: "latin" },
                    { text: "Old French parent (1200s)", lang: "latin" },
                    { text: "Middle English parent", lang: "latin" },
                    { text: "Modern English parent", lang: "germanic" }
                ],
                related: ["parental", "parentage", "father", "mother", "progenitor"]
            },
            "sister": {
                meaning: "A female sibling; a woman united with another in some common interest.",
                family: "Proto-Germanic",
                earliest: "Old English sweoster",
                path: [
                    { text: "Proto-Indo-European *swesor- (sister)", lang: "indo-european" },
                    { text: "Proto-Germanic *swistēr", lang: "germanic" },
                    { text: "Old English sweoster/swuster", lang: "germanic" },
                    { text: "Middle English sister", lang: "germanic" },
                    { text: "Modern English sister", lang: "germanic" }
                ],
                related: ["sister-in-law", "sisterhood", "sibling"]
            },
            "heart": {
                meaning: "The organ that pumps blood; the seat of emotions or courage.",
                family: "Proto-Germanic",
                earliest: "Old English heorte",
                path: [
                    { text: "Proto-Indo-European *kerd- (heart)", lang: "indo-european" },
                    { text: "Proto-Germanic *hertōn", lang: "germanic" },
                    { text: "Old English heorte (9th century)", lang: "germanic" },
                    { text: "Middle English herte/hert", lang: "germanic" },
                    { text: "Modern English heart", lang: "germanic" }
                ],
                related: ["cardiac", "cordial", "accord", "discord"]
            },
            "sky": {
                meaning: "The expanse of space that appears above the earth; the heavens.",
                family: "Old Norse → Middle English",
                earliest: "1200 CE (Old Norse ský)",
                path: [
                    { text: "Proto-Germanic *skiwaz (cloud)", lang: "germanic" },
                    { text: "Old Norse ský (cloud, sky)", lang: "germanic" },
                    { text: "Middle English sky (1200)", lang: "germanic" },
                    { text: "Modern English sky", lang: "germanic" }
                ],
                related: ["skyward", "skyscraper", "cloudy"]
            }
        };

        function displayWord(word) {
            const lower = word.toLowerCase().trim();
            if (!etymologyData[lower]) return;

            const data = etymologyData[lower];
            
            // Update tree
            const treeDiv = document.getElementById("etymologyTree");
            treeDiv.innerHTML = data.path.map((node, i) => {
                if (i === data.path.length - 1) {
                    return `<div class="tree-node modern-node">${node.text}</div>`;
                } else if (i === 0) {
                    return `<div class="tree-node root-node">${node.text}<span class="language-tag ${node.lang}">${node.lang.replace(/-/g, ' ').toUpperCase()}</span></div>`;
                } else {
                    return `<div class="tree-node intermediate-node">${node.text}<span class="language-tag ${node.lang}">${node.lang.replace(/-/g, ' ').toUpperCase()}</span></div>`;
                }
            }).join("");

            // Update stats
            document.getElementById("currentWord").textContent = lower.charAt(0).toUpperCase() + lower.slice(1);
            document.getElementById("earliestEntry").textContent = data.earliest;
            document.getElementById("langFamily").textContent = data.family;
            document.getElementById("relatedCount").textContent = data.related.length;

            // Update meaning
            document.getElementById("meaning").textContent = data.meaning;

            // Update related words
            document.getElementById("related").innerHTML = data.related.join(", ");
        }

        function loadPreset(preset) {
            const presets = {
                shakespeare: ["heart", "sky", "sister"],
                science: ["algorithm", "galaxy", "music"],
                food: ["journey", "music", "parent"]
            };
            const words = presets[preset];
            if (words && words.length > 0) {
                document.getElementById("wordInput").value = words[0];
                displayWord(words[0]);
            }
        }

        // Event listener
        document.getElementById("wordInput").addEventListener("input", (e) => {
            displayWord(e.target.value);
        });

        // Initialize with first word
        displayWord("journey");
    </script>
</body>
</html>
