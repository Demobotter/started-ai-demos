<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Formation Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(to bottom, #87CEEB 0%, #b0d4e3 50%, #E0F6FF 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            gap: 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            min-height: 700px;
        }
        .sidebar {
            width: 320px;
            padding: 24px;
            background: #f8fafb;
            border-right: 1px solid #e0e6ed;
            overflow-y: auto;
        }
        .main {
            flex: 1;
            position: relative;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: #1a1a2e;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .control-group {
            margin-bottom: 24px;
        }
        .control-label {
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: block;
        }
        .slider-container {
            margin-bottom: 12px;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #e0e6ed;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #4da8da;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(77, 168, 218, 0.3);
        }
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #4da8da;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(77, 168, 218, 0.3);
        }
        .slider-value {
            font-size: 12px;
            color: #7dd3fc;
            font-weight: 600;
            margin-top: 4px;
        }
        .cloud-buttons {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-bottom: 20px;
        }
        .cloud-btn {
            padding: 10px 12px;
            border: 2px solid #d0d8e0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Space Mono', monospace;
            font-weight: 600;
            color: #4a5568;
            transition: all 0.2s ease;
        }
        .cloud-btn:hover {
            border-color: #4da8da;
            background: #e6f3fb;
        }
        .cloud-btn.active {
            background: #4da8da;
            color: white;
            border-color: #4da8da;
        }
        .stats-box {
            background: white;
            border-left: 4px solid #4da8da;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 12px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            color: #4a5568;
        }
        .stat-row:last-child {
            margin-bottom: 0;
        }
        .stat-label {
            font-weight: 600;
            color: #7dd3fc;
        }
        .stat-value {
            color: #2d9d5f;
            font-weight: 700;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .toggle-group {
            margin-bottom: 20px;
        }
        .toggle-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
        }
        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #4da8da;
        }
        @media (max-width: 800px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #e0e6ed;
                max-height: 250px;
            }
            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>☁️ Cloud Lab</h1>
            
            <div class="control-group">
                <label class="control-label">Temperature (°C)</label>
                <div class="slider-container">
                    <input type="range" id="tempSlider" min="-50" max="30" value="20" step="1">
                    <div class="slider-value"><span id="tempVal">20</span>°C</div>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">Humidity (%)</label>
                <div class="slider-container">
                    <input type="range" id="humiditySlider" min="0" max="100" value="60" step="1">
                    <div class="slider-value"><span id="humidityVal">60</span>%</div>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">Altitude (m)</label>
                <div class="slider-container">
                    <input type="range" id="altitudeSlider" min="0" max="15000" value="0" step="100">
                    <div class="slider-value"><span id="altitudeVal">0</span> m</div>
                </div>
            </div>

            <div class="toggle-group">
                <label class="toggle-label">
                    <input type="checkbox" id="showForecast">
                    Weather Forecast
                </label>
            </div>

            <div class="control-group">
                <label class="control-label">Cloud Types</label>
                <div class="cloud-buttons" id="cloudButtons"></div>
            </div>

            <div class="stats-box">
                <div class="stat-row">
                    <span class="stat-label">Cloud Type:</span>
                    <span class="stat-value" id="cloudName">—</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Altitude Range:</span>
                    <span class="stat-value" id="altRange">—</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Dew Point:</span>
                    <span class="stat-value" id="dewPoint">—</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">LCL:</span>
                    <span class="stat-value" id="lcl">—</span>
                </div>
            </div>

            <div class="stats-box">
                <div class="stat-row">
                    <span class="stat-label">Weather:</span>
                    <span class="stat-value" id="weatherType">—</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Precip:</span>
                    <span class="stat-value" id="precipType">—</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Pressure:</span>
                    <span class="stat-value" id="pressure">—</span>
                </div>
            </div>
        </div>

        <div class="main">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <script>
        const clouds = [
            { name: 'Cirrus', alt: [10000, 13000], color: '#ffffff', icon: '〰️ ', weather: 'Clear skies', precip: 'None', opacity: 0.9 },
            { name: 'Cirrocumulus', alt: [10000, 13000], color: '#f5f5f5', icon: '∿∿ ', weather: 'Fair', precip: 'None', opacity: 0.7 },
            { name: 'Altocumulus', alt: [2000, 6000], color: '#e8e8e8', icon: '~ ', weather: 'Variable', precip: 'None', opacity: 0.8 },
            { name: 'Altostratus', alt: [2000, 6000], color: '#d0d0d0', icon: '≋ ', weather: 'Overcast', precip: 'None', opacity: 0.85 },
            { name: 'Cumulus', alt: [1000, 2000], color: '#ffffff', icon: '☁ ', weather: 'Fair', precip: 'None', opacity: 0.95 },
            { name: 'Cumulonimbus', alt: [0, 16000], color: '#333333', icon: '⛈ ', weather: 'Storms', precip: 'Rain/Snow', opacity: 0.95 },
            { name: 'Stratus', alt: [0, 500], color: '#b8b8b8', icon: '▬ ', weather: 'Gloomy', precip: 'Drizzle', opacity: 0.9 },
            { name: 'Stratocumulus', alt: [1000, 3000], color: '#c8c8c8', icon: '▭ ', weather: 'Cloudy', precip: 'Light rain', opacity: 0.85 },
            { name: 'Nimbostratus', alt: [500, 2000], color: '#606060', icon: '🌧 ', weather: 'Rainy', precip: 'Rain', opacity: 0.95 },
            { name: 'Fog', alt: [0, 100], color: '#999999', icon: '🌫 ', weather: 'Foggy', precip: 'Mist', opacity: 0.85 }
        ];

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let selectedCloud = null;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            draw();
        }

        function dewPointMagnus(t, rh) {
            const a = 17.27;
            const b = 237.7;
            const alpha = ((a * t) / (b + t)) + Math.log(rh / 100.0);
            return (b * alpha) / (a - alpha);
        }

        function liftingCondensationLevel(t, td, elev = 0) {
            const lapse = 9.8 / 1000;
            return (t - td) / lapse + elev;
        }

        function pressureAtAltitude(alt) {
            const p0 = 1013.25;
            const l = 0.0065;
            const t0 = 288.15;
            const g = 9.81;
            const m = 0.029;
            const r = 8.314;
            return p0 * Math.pow(1 - (l * alt) / t0, (g * m) / (r * l));
        }

        function update() {
            const temp = parseFloat(document.getElementById('tempSlider').value);
            const humidity = parseFloat(document.getElementById('humiditySlider').value);
            const altitude = parseFloat(document.getElementById('altitudeSlider').value);

            document.getElementById('tempVal').textContent = temp;
            document.getElementById('humidityVal').textContent = humidity;
            document.getElementById('altitudeVal').textContent = altitude.toLocaleString();

            const dp = dewPointMagnus(temp, humidity);
            const lcl = liftingCondensationLevel(temp, dp, altitude);
            const pressure = pressureAtAltitude(altitude);

            document.getElementById('dewPoint').textContent = dp.toFixed(1) + '°C';
            document.getElementById('lcl').textContent = Math.max(0, lcl).toFixed(0) + ' m';
            document.getElementById('pressure').textContent = pressure.toFixed(0) + ' hPa';

            if (!selectedCloud) {
                for (let c of clouds) {
                    if (altitude >= c.alt[0] && altitude <= c.alt[1] && humidity > 80) {
                        selectedCloud = c.name;
                        updateCloudButtons();
                        break;
                    }
                }
            }

            updateStats();
            draw();
        }

        function updateStats() {
            const cloud = clouds.find(c => c.name === selectedCloud);
            if (!cloud) {
                document.getElementById('cloudName').textContent = '—';
                document.getElementById('altRange').textContent = '—';
                document.getElementById('weatherType').textContent = '—';
                document.getElementById('precipType').textContent = '—';
                return;
            }

            document.getElementById('cloudName').textContent = cloud.name;
            document.getElementById('altRange').textContent = `${cloud.alt[0].toLocaleString()}–${cloud.alt[1].toLocaleString()} m`;
            document.getElementById('weatherType').textContent = cloud.weather;
            document.getElementById('precipType').textContent = cloud.precip;
        }

        function updateCloudButtons() {
            const container = document.getElementById('cloudButtons');
            container.innerHTML = '';
            clouds.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'cloud-btn';
                if (selectedCloud === c.name) btn.classList.add('active');
                btn.textContent = c.icon + c.name;
                btn.onclick = () => {
                    selectedCloud = c.name;
                    updateCloudButtons();
                    updateStats();
                    draw();
                };
                container.appendChild(btn);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const padding = 40;
            const graphWidth = canvas.width - padding * 2;
            const graphHeight = canvas.height - padding * 2;
            const maxAlt = 15000;

            ctx.fillStyle = '#e6f3fb';
            ctx.fillRect(padding, padding, graphWidth, (graphHeight * 11000) / maxAlt);
            ctx.fillStyle = '#d4e8f7';
            ctx.fillRect(padding, padding + (graphHeight * 11000) / maxAlt, graphWidth, (graphHeight * 4000) / maxAlt);

            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 1;
            ctx.font = 'bold 11px "Space Mono"';
            ctx.fillStyle = '#888';
            for (let alt = 0; alt <= maxAlt; alt += 1000) {
                const y = canvas.height - padding - (alt / maxAlt) * graphHeight;
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(canvas.width - padding, y);
                ctx.stroke();
                ctx.fillText(alt / 1000 + 'km', padding - 35, y + 4);
            }

            const alt = parseFloat(document.getElementById('altitudeSlider').value);
            const humidity = parseFloat(document.getElementById('humiditySlider').value);
            const temp = parseFloat(document.getElementById('tempSlider').value);
            const dp = dewPointMagnus(temp, humidity);
            const lcl = Math.max(0, liftingCondensationLevel(temp, dp, alt));

            const altY = canvas.height - padding - (alt / maxAlt) * graphHeight;
            const lclY = canvas.height - padding - (lcl / maxAlt) * graphHeight;

            ctx.strokeStyle = '#4da8da';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(padding, altY);
            ctx.lineTo(canvas.width - padding, altY);
            ctx.stroke();
            ctx.fillStyle = '#4da8da';
            ctx.font = 'bold 12px "Space Mono"';
            ctx.fillText('← Altitude', padding + 10, altY - 5);

            ctx.strokeStyle = '#2d9d5f';
            ctx.setLineDash([2, 2]);
            ctx.beginPath();
            ctx.moveTo(padding, lclY);
            ctx.lineTo(canvas.width - padding, lclY);
            ctx.stroke();
            ctx.fillStyle = '#2d9d5f';
            ctx.fillText('← LCL', padding + 10, lclY + 15);
            ctx.setLineDash([]);

            if (selectedCloud && alt < maxAlt) {
                const cloud = clouds.find(c => c.name === selectedCloud);
                const cloudWidth = 300;
                const cloudX = canvas.width / 2 - cloudWidth / 2;

                ctx.fillStyle = cloud.color;
                ctx.globalAlpha = cloud.opacity;
                drawCloud(ctx, cloudX, altY - 40, cloudWidth, 50, selectedCloud);
                ctx.globalAlpha = 1;
            }

            ctx.fillStyle = '#1a1a2e';
            ctx.font = 'bold 16px "Playfair Display"';
            ctx.fillText('Atmosphere Profile', padding + 10, 30);

            ctx.font = '11px "Space Mono"';
            ctx.fillStyle = '#666';
            ctx.fillText('Troposphere', padding + 10, padding + 20);
            ctx.fillText('Stratosphere', padding + 10, canvas.height - padding + (graphHeight * 4000) / maxAlt + 20);
        }

        function drawCloud(ctx, x, y, w, h, type) {
            switch (type) {
                case 'Cirrus':
                    for (let i = 0; i < 5; i++) {
                        ctx.beginPath();
                        ctx.arc(x + i * 60 + 30, y + 15, 20, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    break;
                case 'Cumulus':
                    for (let i = 0; i < 4; i++) {
                        ctx.beginPath();
                        ctx.arc(x + 20 + i * 70, y + 20, 35, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    break;
                case 'Cumulonimbus':
                    ctx.beginPath();
                    ctx.ellipse(x + w / 2, y + h / 2, w / 2.5, h / 1.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'Stratus':
                case 'Stratocumulus':
                case 'Nimbostratus':
                    ctx.fillRect(x, y, w, h);
                    break;
                case 'Altostratus':
                case 'Altocumulus':
                    ctx.beginPath();
                    ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                default:
                    ctx.fillRect(x, y, w, h);
            }
        }

        document.getElementById('tempSlider').addEventListener('input', update);
        document.getElementById('humiditySlider').addEventListener('input', update);
        document.getElementById('altitudeSlider').addEventListener('input', update);
        document.getElementById('showForecast').addEventListener('change', draw);

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        updateCloudButtons();
        update();
    </script>
</body>
</html>
