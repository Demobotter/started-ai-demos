<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quake Timeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
      color: #e0e0e0;
      line-height: 1.6;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: #fff;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #999;
    }
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 10px 16px;
      border: 2px solid #d32f2f;
      background: transparent;
      color: #d32f2f;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
    }
    .tab-btn.active {
      background: #d32f2f;
      color: #fff;
    }
    .tab-btn:hover {
      background: #d32f2f;
      color: #fff;
    }
    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 30px;
    }
    @media (max-width: 1024px) {
      .content {
        grid-template-columns: 1fr;
      }
    }
    .timeline-section {
      background: #1a1f2e;
      border-radius: 10px;
      padding: 20px;
      border: 1px solid #2a3f4f;
      max-height: 500px;
      overflow-y: auto;
    }
    .timeline-section::-webkit-scrollbar {
      width: 6px;
    }
    .timeline-section::-webkit-scrollbar-track {
      background: #0f1419;
      border-radius: 3px;
    }
    .timeline-section::-webkit-scrollbar-thumb {
      background: #d32f2f;
      border-radius: 3px;
    }
    .event-card {
      padding: 15px;
      border-left: 4px solid #d32f2f;
      background: #252d3a;
      margin-bottom: 12px;
      border-radius: 6px;
      transition: all 0.2s;
      cursor: pointer;
    }
    .event-card:hover {
      background: #2d3645;
      transform: translateX(4px);
    }
    .event-time {
      font-size: 0.8rem;
      color: #999;
      margin-bottom: 4px;
    }
    .event-magnitude {
      display: inline-block;
      font-size: 1.4rem;
      font-weight: 700;
      margin-right: 10px;
      min-width: 45px;
      text-align: center;
    }
    .mag-0-3 { color: #1e88e5; }
    .mag-3-5 { color: #43a047; }
    .mag-5-7 { color: #fb8c00; }
    .mag-7-plus { color: #d32f2f; }
    .event-location {
      font-size: 0.9rem;
      margin-top: 6px;
      color: #ccc;
    }
    .event-depth {
      font-size: 0.8rem;
      color: #888;
      margin-top: 3px;
    }
    .stats-section {
      background: #1a1f2e;
      border-radius: 10px;
      padding: 20px;
      border: 1px solid #2a3f4f;
    }
    .stat-box {
      background: #252d3a;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 15px;
    }
    .stat-label {
      font-size: 0.85rem;
      color: #999;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: #FFB700;
    }
    .histogram {
      margin-top: 20px;
    }
    .histogram-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: #ccc;
    }
    .histogram-bars {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      height: 120px;
    }
    .bar-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .bar {
      width: 100%;
      background: linear-gradient(180deg, #FFB700 0%, #d32f2f 100%);
      border-radius: 4px 4px 0 0;
      min-height: 2px;
      transition: all 0.2s;
    }
    .bar:hover {
      opacity: 0.8;
    }
    .bar-label {
      font-size: 0.75rem;
      color: #999;
      text-align: center;
    }
    .bar-count {
      font-size: 0.8rem;
      font-weight: 600;
      color: #FFB700;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .regional-section {
      margin-top: 20px;
    }
    .regional-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: #ccc;
    }
    .region-item {
      padding: 8px;
      background: #252d3a;
      border-radius: 4px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }
    .region-name {
      flex: 1;
    }
    .region-count {
      background: #d32f2f;
      color: white;
      padding: 2px 8px;
      border-radius: 3px;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }
    .spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid #d32f2f;
      border-top: 3px solid transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .refresh-time {
      font-size: 0.8rem;
      color: #666;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🌍 Quake Timeline</h1>
      <p class="subtitle">Live USGS earthquakes grouped by time, magnitude, region</p>
    </header>

    <div class="controls">
      <button class="tab-btn active" data-period="1h">Last 1 Hour</button>
      <button class="tab-btn" data-period="6h">Last 6 Hours</button>
      <button class="tab-btn" data-period="24h">Last 24 Hours</button>
    </div>

    <div class="content">
      <div class="timeline-section">
        <div id="timeline"></div>
      </div>

      <div class="stats-section">
        <div class="stat-box">
          <div class="stat-label">Total Events</div>
          <div class="stat-value" id="stat-total">—</div>
        </div>

        <div class="stat-box">
          <div class="stat-label">Average Magnitude</div>
          <div class="stat-value" id="stat-avg">—</div>
        </div>

        <div class="stat-box">
          <div class="stat-label">Strongest</div>
          <div id="stat-strongest">—</div>
        </div>

        <div class="histogram">
          <div class="histogram-title">Magnitude Distribution</div>
          <div class="histogram-bars" id="histogram"></div>
        </div>

        <div class="regional-section">
          <div class="regional-title">Top 5 Regions</div>
          <div id="regions"></div>
        </div>
      </div>
    </div>

    <div class="refresh-time" id="refresh-time"></div>
  </div>

  <script>
    let currentPeriod = '1h';

    const periodMap = {
      '1h': 'all_hour',
      '6h': 'all_hour',
      '24h': 'all_day'
    };

    const periodHours = {
      '1h': 1,
      '6h': 6,
      '24h': 24
    };

    function getMagnitudeClass(mag) {
      if (mag < 3) return 'mag-0-3';
      if (mag < 5) return 'mag-3-5';
      if (mag < 7) return 'mag-5-7';
      return 'mag-7-plus';
    }

    function formatTime(timestamp) {
      const now = Date.now();
      const diff = (now - timestamp) / 1000;
      if (diff < 60) return `${Math.round(diff)}s ago`;
      if (diff < 3600) return `${Math.round(diff / 60)}m ago`;
      if (diff < 86400) return `${Math.round(diff / 3600)}h ago`;
      return `${Math.round(diff / 86400)}d ago`;
    }

    function getRegionName(place) {
      if (!place) return 'Unknown';
      const parts = place.split(', ');
      return parts.length > 1 ? parts[parts.length - 1] : parts[0];
    }

    async function fetchAndRender() {
      const url = `https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/${periodMap[currentPeriod]}.geojson`;
      
      try {
        const response = await fetch(url);
        const data = await response.json();
        
        const now = Date.now();
        const hoursMs = periodHours[currentPeriod] * 3600000;
        const cutoff = now - hoursMs;
        
        let events = data.features
          .map(f => ({
            time: f.properties.time,
            mag: f.properties.mag,
            place: f.properties.place,
            depth: f.geometry.coordinates[2],
            lat: f.geometry.coordinates[1],
            lon: f.geometry.coordinates[0],
            id: f.id
          }))
          .filter(e => e.time >= cutoff && e.mag !== null && e.depth !== null)
          .sort((a, b) => b.time - a.time);

        renderTimeline(events);
        renderStats(events);
      } catch (err) {
        document.getElementById('timeline').innerHTML = `<div class="loading"><strong>Error loading data</strong></div>`;
        console.error('Fetch error:', err);
      }
    }

    function renderTimeline(events) {
      if (events.length === 0) {
        document.getElementById('timeline').innerHTML = '<div class="loading">No earthquakes in this period</div>';
        return;
      }

      const html = events.slice(0, 50).map(e => `
        <div class="event-card">
          <div class="event-time">${formatTime(e.time)}</div>
          <div>
            <span class="event-magnitude ${getMagnitudeClass(e.mag)}">${e.mag.toFixed(1)}</span>
            <span>${(e.lat > 0 ? 'N' : 'S')} ${Math.abs(e.lat).toFixed(1)}°, ${(e.lon > 0 ? 'E' : 'W')} ${Math.abs(e.lon).toFixed(1)}°</span>
          </div>
          <div class="event-location">${e.place}</div>
          <div class="event-depth">Depth: ${e.depth.toFixed(1)} km</div>
        </div>
      `).join('');

      document.getElementById('timeline').innerHTML = html;
    }

    function renderStats(events) {
      if (events.length === 0) {
        document.getElementById('stat-total').textContent = '0';
        document.getElementById('stat-avg').textContent = '—';
        document.getElementById('stat-strongest').innerHTML = '—';
        document.getElementById('histogram').innerHTML = '';
        document.getElementById('regions').innerHTML = '';
        return;
      }

      // Total
      document.getElementById('stat-total').textContent = events.length;

      // Average
      const avgMag = (events.reduce((sum, e) => sum + e.mag, 0) / events.length).toFixed(2);
      document.getElementById('stat-avg').textContent = avgMag;

      // Strongest
      const strongest = events.reduce((a, b) => a.mag > b.mag ? a : b);
      document.getElementById('stat-strongest').innerHTML = `
        <div style="font-size: 1.4rem; font-weight: 700; color: #FFB700; margin-bottom: 5px;">${strongest.mag.toFixed(1)}</div>
        <div style="font-size: 0.85rem; color: #ccc;">${strongest.place}</div>
      `;

      // Histogram
      const bins = [
        { label: '0–3', min: 0, max: 3 },
        { label: '3–5', min: 3, max: 5 },
        { label: '5–7', min: 5, max: 7 },
        { label: '7+', min: 7, max: 10 }
      ];

      const counts = bins.map(bin => events.filter(e => e.mag >= bin.min && e.mag < bin.max).length);
      const maxCount = Math.max(...counts, 1);

      const histHtml = bins.map((bin, i) => `
        <div class="bar-wrapper">
          <div class="bar" style="height: ${(counts[i] / maxCount) * 100}%;"></div>
          <div class="bar-count">${counts[i]}</div>
          <div class="bar-label">${bin.label}</div>
        </div>
      `).join('');

      document.getElementById('histogram').innerHTML = histHtml;

      // Regional breakdown
      const regionCounts = {};
      events.forEach(e => {
        const region = getRegionName(e.place);
        regionCounts[region] = (regionCounts[region] || 0) + 1;
      });

      const topRegions = Object.entries(regionCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5);

      const regionsHtml = topRegions.map(([region, count]) => `
        <div class="region-item">
          <div class="region-name">${region}</div>
          <div class="region-count">${count}</div>
        </div>
      `).join('');

      document.getElementById('regions').innerHTML = regionsHtml;

      // Refresh time
      const now = new Date();
      document.getElementById('refresh-time').textContent = `Last updated: ${now.toLocaleTimeString()}`;
    }

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentPeriod = btn.dataset.period;
        document.getElementById('timeline').innerHTML = '<div class="loading"><div class="spinner"></div>Loading earthquakes...</div>';
        fetchAndRender();
      });
    });

    // Initial load
    document.getElementById('timeline').innerHTML = '<div class="loading"><div class="spinner"></div>Loading earthquakes...</div>';
    fetchAndRender();

    // Auto-refresh every 60s
    setInterval(fetchAndRender, 60000);
  </script>
</body>
</html>
