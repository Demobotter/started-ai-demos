<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quake Timeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e0e0e0;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      margin-bottom: 20px;
      text-align: center;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #fff;
    }

    .subtitle {
      font-size: 13px;
      color: #b0b0b0;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tab-btn {
      padding: 8px 16px;
      border: 1px solid #444;
      background: transparent;
      color: #b0b0b0;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: #d32f2f;
      color: #fff;
      border-color: #d32f2f;
    }

    .tab-btn:hover {
      border-color: #d32f2f;
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 20px;
      flex: 1;
      overflow: hidden;
    }

    @media (max-width: 900px) {
      .content {
        grid-template-columns: 1fr;
      }
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      padding-right: 10px;
    }

    .timeline::-webkit-scrollbar {
      width: 6px;
    }

    .timeline::-webkit-scrollbar-track {
      background: transparent;
    }

    .timeline::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 3px;
    }

    .event-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .event-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: #d32f2f;
    }

    .event-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .magnitude-badge {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .magnitude-badge.mag-0-3 { background: #2196F3; color: #fff; }
    .magnitude-badge.mag-3-5 { background: #4CAF50; color: #fff; }
    .magnitude-badge.mag-5-7 { background: #FF9800; color: #fff; }
    .magnitude-badge.mag-7-plus { background: #d32f2f; color: #fff; }

    .event-info {
      flex: 1;
    }

    .event-location {
      font-weight: 500;
      color: #fff;
      margin-bottom: 2px;
    }

    .event-details {
      font-size: 12px;
      color: #909090;
    }

    .event-time {
      font-size: 12px;
      color: #909090;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
      padding-right: 10px;
    }

    .sidebar::-webkit-scrollbar {
      width: 6px;
    }

    .sidebar::-webkit-scrollbar-track {
      background: transparent;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 3px;
    }

    .stats-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
    }

    .stats-card h3 {
      font-family: 'Syne', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: #FFB700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .stat-label {
      font-size: 12px;
      color: #909090;
    }

    .stat-value {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      color: #fff;
    }

    .histogram {
      margin-top: 10px;
    }

    .histogram-bar {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
      gap: 8px;
    }

    .histogram-label {
      font-size: 11px;
      color: #909090;
      width: 40px;
      text-align: right;
    }

    .histogram-fill {
      height: 20px;
      border-radius: 3px;
      background: linear-gradient(90deg, #d32f2f, #FFB700);
      transition: width 0.3s ease;
    }

    .histogram-count {
      font-size: 11px;
      color: #fff;
      min-width: 30px;
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #909090;
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #444;
      border-top-color: #FFB700;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .refresh-info {
      text-align: center;
      font-size: 11px;
      color: #707070;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🌍 Quake Timeline</h1>
      <p class="subtitle">Live USGS earthquakes grouped by time, magnitude, region</p>
    </header>

    <div class="controls">
      <button class="tab-btn active" data-window="3600">Last 1 Hour</button>
      <button class="tab-btn" data-window="21600">Last 6 Hours</button>
      <button class="tab-btn" data-window="86400">Last 24 Hours</button>
    </div>

    <div class="content">
      <div class="timeline" id="timeline">
        <div class="loading">
          <div class="loading-spinner"></div>
          <p style="margin-top: 10px;">Loading earthquakes...</p>
        </div>
      </div>

      <div class="sidebar">
        <div class="stats-card">
          <h3>Summary</h3>
          <div class="stat-row">
            <span class="stat-label">Total Events</span>
            <span class="stat-value" id="stat-total">—</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Avg Magnitude</span>
            <span class="stat-value" id="stat-avg">—</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Strongest</span>
            <span class="stat-value" id="stat-max">—</span>
          </div>
        </div>

        <div class="stats-card">
          <h3>Magnitude Distribution</h3>
          <div class="histogram">
            <div class="histogram-bar">
              <span class="histogram-label">0–3</span>
              <div class="histogram-fill" id="hist-0-3" style="width: 0;"></div>
              <span class="histogram-count" id="hist-count-0-3">0</span>
            </div>
            <div class="histogram-bar">
              <span class="histogram-label">3–5</span>
              <div class="histogram-fill" id="hist-3-5" style="width: 0;"></div>
              <span class="histogram-count" id="hist-count-3-5">0</span>
            </div>
            <div class="histogram-bar">
              <span class="histogram-label">5–7</span>
              <div class="histogram-fill" id="hist-5-7" style="width: 0;"></div>
              <span class="histogram-count" id="hist-count-5-7">0</span>
            </div>
            <div class="histogram-bar">
              <span class="histogram-label">7+</span>
              <div class="histogram-fill" id="hist-7-plus" style="width: 0;"></div>
              <span class="histogram-count" id="hist-count-7-plus">0</span>
            </div>
          </div>
        </div>

        <div class="stats-card">
          <h3>Top Regions</h3>
          <div id="top-regions"></div>
        </div>

        <div class="refresh-info">
          Last updated: <span id="last-update">—</span>
          <br>
          Auto-refresh: 60s
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentWindow = 3600; // seconds
    const apiUrl = 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson';

    function getMagnitudeClass(mag) {
      if (mag < 3) return 'mag-0-3';
      if (mag < 5) return 'mag-3-5';
      if (mag < 7) return 'mag-5-7';
      return 'mag-7-plus';
    }

    function timeAgo(ms) {
      const now = Date.now();
      const diff = now - ms;
      const seconds = Math.floor(diff / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);

      if (seconds < 60) return `${seconds}s ago`;
      if (minutes < 60) return `${minutes}m ago`;
      if (hours < 24) return `${hours}h ago`;
      return `${days}d ago`;
    }

    function extractRegion(place) {
      // place format: "123 km N of City, Country"
      const match = place.match(/\d+ km\s+([A-Z])\s+of\s+([^,]+),?\s*(.+)/);
      if (match) {
        return match[3].trim() || match[2].trim();
      }
      return place.split(',')[0] || place;
    }

    async function fetchAndRender() {
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        const now = Date.now();
        const cutoff = now - (currentWindow * 1000);

        // Filter events within time window
        const events = data.features
          .filter(f => f.properties.time >= cutoff && f.properties.mag !== null)
          .map(f => ({
            time: f.properties.time,
            mag: f.properties.mag,
            place: f.properties.place,
            lat: f.geometry.coordinates[1],
            lng: f.geometry.coordinates[0],
            depth: f.geometry.coordinates[2]
          }))
          .sort((a, b) => b.time - a.time); // newest first

        // Update stats
        const total = events.length;
        const avgMag = total > 0 ? (events.reduce((sum, e) => sum + e.mag, 0) / total).toFixed(1) : '—';
        const maxEvent = total > 0 ? events.reduce((max, e) => e.mag > max.mag ? e : max) : null;

        document.getElementById('stat-total').textContent = total;
        document.getElementById('stat-avg').textContent = avgMag;
        document.getElementById('stat-max').textContent = maxEvent ? `${maxEvent.mag.toFixed(1)}` : '—';

        // Update histogram
        const histCounts = { '0-3': 0, '3-5': 0, '5-7': 0, '7+': 0 };
        events.forEach(e => {
          if (e.mag < 3) histCounts['0-3']++;
          else if (e.mag < 5) histCounts['3-5']++;
          else if (e.mag < 7) histCounts['5-7']++;
          else histCounts['7+']++;
        });

        const maxCount = Math.max(...Object.values(histCounts), 1);
        const histBuckets = [
          { id: '0-3', label: '0–3' },
          { id: '3-5', label: '3–5' },
          { id: '5-7', label: '5–7' },
          { id: '7-plus', label: '7+' }
        ];

        histBuckets.forEach(bucket => {
          const count = histCounts[bucket.id.replace('-plus', '+')];
          const pct = (count / maxCount) * 100;
          document.getElementById(`hist-${bucket.id}`).style.width = `${pct}%`;
          document.getElementById(`hist-count-${bucket.id}`).textContent = count;
        });

        // Top regions
        const regionCounts = {};
        events.forEach(e => {
          const region = extractRegion(e.place);
          regionCounts[region] = (regionCounts[region] || 0) + 1;
        });

        const topRegions = Object.entries(regionCounts)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 5);

        const regionsHtml = topRegions.map(([region, count]) =>
          `<div class="stat-row"><span class="stat-label">${region.substring(0, 20)}</span><span class="stat-value">${count}</span></div>`
        ).join('');

        document.getElementById('top-regions').innerHTML = regionsHtml || '<p style="color: #707070; font-size: 12px;">No data</p>';

        // Render timeline
        const timelineHtml = events.length > 0
          ? events.map(e => `
            <div class="event-card">
              <div class="event-header">
                <div class="magnitude-badge ${getMagnitudeClass(e.mag)}">${e.mag.toFixed(1)}</div>
                <div class="event-info">
                  <div class="event-location">${e.place}</div>
                  <div class="event-details">Depth: ${e.depth.toFixed(1)} km • ${timeAgo(e.time)}</div>
                </div>
              </div>
            </div>
          `).join('')
          : '<div class="loading"><p>No earthquakes in this window</p></div>';

        document.getElementById('timeline').innerHTML = timelineHtml;

        // Update timestamp
        document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
      } catch (error) {
        console.error('Error fetching data:', error);
        document.getElementById('timeline').innerHTML = `<div class="loading"><p>Error loading data. Retrying...</p></div>`;
      }
    }

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentWindow = parseInt(btn.dataset.window);
        fetchAndRender();
      });
    });

    // Initial load and auto-refresh
    fetchAndRender();
    setInterval(fetchAndRender, 60000);
  </script>
</body>
</html>
