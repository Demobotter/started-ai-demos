<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symbiosis Network</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a1428 0%, #0d3b66 100%);
            color: #e8f1f5;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-align: center;
            color: #7dd3fc;
        }
        .subtitle {
            text-align: center;
            color: #94d5f9;
            margin-bottom: 30px;
            font-size: 0.95em;
        }
        .main {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            margin-bottom: 20px;
        }
        #network {
            background: #0f2744;
            border-radius: 12px;
            border: 2px solid #1f4d7f;
            min-height: 600px;
            position: relative;
        }
        .controls {
            background: #0f2744;
            border-radius: 12px;
            border: 2px solid #1f4d7f;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .control-group h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.1em;
            color: #7dd3fc;
            margin-bottom: 10px;
            border-bottom: 2px solid #1f4d7f;
            padding-bottom: 8px;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        button {
            padding: 10px 14px;
            border: 2px solid #1f4d7f;
            background: #0a1428;
            color: #7dd3fc;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.85em;
            font-weight: 500;
            transition: all 0.2s;
        }
        button:hover {
            background: #1f4d7f;
            color: #e8f1f5;
        }
        button.active {
            background: #00b894;
            border-color: #00b894;
            color: #0a1428;
        }
        .stat-panel {
            background: #0a1428;
            border-left: 4px solid #7dd3fc;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85em;
        }
        .stat-label {
            color: #94d5f9;
            font-size: 0.8em;
            font-weight: 500;
        }
        .stat-value {
            color: #7dd3fc;
            font-weight: 600;
            font-size: 1em;
        }
        .legend {
            margin-top: 15px;
            font-size: 0.8em;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }
        .tooltip {
            position: absolute;
            background: rgba(15, 39, 68, 0.95);
            color: #7dd3fc;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #1f4d7f;
            font-size: 0.85em;
            pointer-events: none;
            max-width: 250px;
            z-index: 100;
            display: none;
        }
        .tooltip-title {
            font-weight: 600;
            color: #7dd3fc;
            margin-bottom: 4px;
        }
        .tooltip-relation {
            color: #94d5f9;
            margin: 2px 0;
        }
        @media (max-width: 1024px) {
            .main {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌊 Symbiosis Network</h1>
        <p class="subtitle">Explore how ocean species depend on each other</p>
        
        <div class="main">
            <div id="network"></div>
            <div class="controls">
                <div class="control-group">
                    <h3>Filter</h3>
                    <div class="button-group">
                        <button class="filter-btn active" data-filter="all">All Relationships</button>
                        <button class="filter-btn" data-filter="mutualism">✨ Mutualism</button>
                        <button class="filter-btn" data-filter="parasitism">⚠️ Parasitism</button>
                        <button class="filter-btn" data-filter="commensalism">🤝 Commensalism</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <h3>Zone</h3>
                    <div class="button-group">
                        <button class="zone-btn" data-zone="all">All Depths</button>
                        <button class="zone-btn" data-zone="shallow">🌞 Shallow (0-200m)</button>
                        <button class="zone-btn" data-zone="twilight">🌙 Twilight (200-1000m)</button>
                        <button class="zone-btn" data-zone="deep">🔵 Deep (1000m+)</button>
                    </div>
                </div>

                <div class="control-group">
                    <h3>Legend</h3>
                    <div class="legend">
                        <div class="legend-item">
                            <div class="legend-color" style="background: #00b894;"></div>
                            <span>Mutualism</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #ff6b6b;"></div>
                            <span>Parasitism</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #4da8da;"></div>
                            <span>Commensalism</span>
                        </div>
                        <hr style="border: none; border-top: 1px solid #1f4d7f; margin: 10px 0;">
                        <div class="legend-item">
                            <div class="legend-color" style="background: #7dd3fc;"></div>
                            <span>Shallow Zone</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #b8a6db;"></div>
                            <span>Twilight Zone</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #0d3b66;"></div>
                            <span>Deep Zone</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script>
        // Marine symbiosis database
        const speciesData = [
            { id: "clownfish", name: "Clownfish", emoji: "🐠", zone: "shallow", color: "#7dd3fc" },
            { id: "anemone", name: "Sea Anemone", emoji: "🌸", zone: "shallow", color: "#7dd3fc" },
            { id: "coral", name: "Coral", emoji: "🪸", zone: "shallow", color: "#7dd3fc" },
            { id: "zooxanthellae", name: "Zooxanthellae", emoji: "🌿", zone: "shallow", color: "#7dd3fc" },
            { id: "cleaner-wrasse", name: "Cleaner Wrasse", emoji: "🐟", zone: "shallow", color: "#7dd3fc" },
            { id: "grouper", name: "Grouper", emoji: "🐡", zone: "shallow", color: "#7dd3fc" },
            { id: "dolphin", name: "Dolphin", emoji: "🐬", zone: "shallow", color: "#7dd3fc" },
            { id: "fish-school", name: "Fish School", emoji: "🐠", zone: "shallow", color: "#7dd3fc" },
            { id: "remora", name: "Remora Fish", emoji: "🐟", zone: "shallow", color: "#7dd3fc" },
            { id: "shark", name: "Shark", emoji: "🦈", zone: "shallow", color: "#7dd3fc" },
            { id: "sea-turtle", name: "Sea Turtle", emoji: "🐢", zone: "shallow", color: "#7dd3fc" },
            { id: "barnacle", name: "Barnacle", emoji: "🪨", zone: "shallow", color: "#7dd3fc" },
            { id: "lamprey", name: "Lamprey", emoji: "⚫", zone: "twilight", color: "#b8a6db" },
            { id: "salmon", name: "Salmon", emoji: "🐟", zone: "twilight", color: "#b8a6db" },
            { id: "sea-lice", name: "Sea Lice", emoji: "🦟", zone: "twilight", color: "#b8a6db" },
            { id: "jellyfish", name: "Jellyfish", emoji: "🪼", zone: "twilight", color: "#b8a6db" },
            { id: "fish-larvae", name: "Fish Larvae", emoji: "🐣", zone: "twilight", color: "#b8a6db" },
            { id: "copepod", name: "Copepod", emoji: "🦐", zone: "twilight", color: "#b8a6db" },
            { id: "plankton", name: "Plankton", emoji: "🔬", zone: "twilight", color: "#b8a6db" },
            { id: "anglerfish", name: "Anglerfish", emoji: "🐠", zone: "deep", color: "#0d3b66" },
            { id: "bioluminescent-bacteria", name: "Bioluminescent Bacteria", emoji: "✨", zone: "deep", color: "#0d3b66" },
            { id: "gulper-eel", name: "Gulper Eel", emoji: "🐍", zone: "deep", color: "#0d3b66" },
            { id: "giant-squid", name: "Giant Squid", emoji: "🦑", zone: "deep", color: "#0d3b66" },
            { id: "sperm-whale", name: "Sperm Whale", emoji: "🐋", zone: "deep", color: "#0d3b66" },
            { id: "hydrothermal-worm", name: "Tube Worm", emoji: "🪱", zone: "deep", color: "#0d3b66" },
            { id: "chemosynthetic-bacteria", name: "Chemosynthetic Bacteria", emoji: "🔬", zone: "deep", color: "#0d3b66" },
            { id: "octopus", name: "Octopus", emoji: "🐙", zone: "twilight", color: "#b8a6db" },
            { id: "crab", name: "Crab", emoji: "🦀", zone: "shallow", color: "#7dd3fc" },
            { id: "sea-cucumber", name: "Sea Cucumber", emoji: "🌶️", zone: "shallow", color: "#7dd3fc" },
            { id: "nudibranch", name: "Nudibranch", emoji: "🦎", zone: "shallow", color: "#7dd3fc" }
        ];

        const linksData = [
            { source: "clownfish", target: "anemone", type: "mutualism", desc: "Protection & food scraps" },
            { source: "coral", target: "zooxanthellae", type: "mutualism", desc: "Energy & minerals exchange" },
            { source: "cleaner-wrasse", target: "grouper", type: "mutualism", desc: "Parasites removed, food gained" },
            { source: "dolphin", target: "fish-school", type: "mutualism", desc: "Hunt together & protect" },
            { source: "remora", target: "shark", type: "commensalism", desc: "Free ride & scraps" },
            { source: "sea-turtle", target: "barnacle", type: "commensalism", desc: "Transport for barnacle" },
            { source: "lamprey", target: "salmon", type: "parasitism", desc: "Feed on blood & fluids" },
            { source: "sea-lice", target: "salmon", type: "parasitism", desc: "Feed on skin & blood" },
            { source: "jellyfish", target: "fish-larvae", type: "parasitism", desc: "Larvae preyed upon" },
            { source: "coral", target: "cleaner-wrasse", type: "mutualism", desc: "Parasites removed" },
            { source: "plankton", target: "copepod", type: "mutualism", desc: "Nutrient cycling" },
            { source: "anglerfish", target: "bioluminescent-bacteria", type: "mutualism", desc: "Bacteria provide light" },
            { source: "hydrothermal-worm", target: "chemosynthetic-bacteria", type: "mutualism", desc: "Bacteria fix sulfur" },
            { source: "sperm-whale", target: "giant-squid", type: "parasitism", desc: "Predator-prey interaction" },
            { source: "crab", target: "anemone", type: "commensalism", desc: "Shelter in anemone" },
            { source: "nudibranch", target: "algae", type: "mutualism", desc: "Defense inheritance" },
            { source: "octopus", target: "crab", type: "parasitism", desc: "Predator-prey" },
            { source: "fish-school", target: "plankton", type: "parasitism", desc: "Feed on plankton" }
        ];

        let currentFilter = "all";
        let currentZone = "all";

        const margin = { top: 20, right: 20, bottom: 20, left: 20 };
        const networkDiv = document.getElementById("network");
        const width = networkDiv.offsetWidth - margin.left - margin.right;
        const height = 600;

        const svg = d3.select("#network")
            .append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        // Create simulation
        let simulation = d3.forceSimulation(speciesData)
            .force("link", d3.forceLink(linksData).id(d => d.id).distance(80))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(35));

        // Tooltip
        const tooltip = document.getElementById("tooltip");

        function updateVisualization() {
            // Filter data
            let filteredLinks = linksData;
            let filteredSpecies = speciesData;

            if (currentFilter !== "all") {
                filteredLinks = linksData.filter(l => l.type === currentFilter);
                const linkedIds = new Set();
                filteredLinks.forEach(l => {
                    linkedIds.add(l.source.id || l.source);
                    linkedIds.add(l.target.id || l.target);
                });
                filteredSpecies = speciesData.filter(s => linkedIds.has(s.id));
            }

            if (currentZone !== "all") {
                filteredSpecies = filteredSpecies.filter(s => s.zone === currentZone);
                const zoneIds = new Set(filteredSpecies.map(s => s.id));
                filteredLinks = filteredLinks.filter(l => {
                    const sourceId = l.source.id || l.source;
                    const targetId = l.target.id || l.target;
                    return zoneIds.has(sourceId) && zoneIds.has(targetId);
                });
            }

            // Remove old elements
            svg.selectAll(".link").remove();
            svg.selectAll(".node").remove();
            svg.selectAll(".node-label").remove();

            // Update simulation
            simulation.nodes(filteredSpecies);
            simulation.force("link").links(filteredLinks);
            simulation.alpha(1).restart();

            // Create links
            const links = svg.selectAll(".link")
                .data(filteredLinks)
                .enter()
                .append("line")
                .attr("class", "link")
                .attr("stroke", d => {
                    if (d.type === "mutualism") return "#00b894";
                    if (d.type === "parasitism") return "#ff6b6b";
                    return "#4da8da";
                })
                .attr("stroke-width", 2)
                .attr("opacity", 0.6);

            // Create nodes
            const nodes = svg.selectAll(".node")
                .data(filteredSpecies)
                .enter()
                .append("circle")
                .attr("class", "node")
                .attr("r", 24)
                .attr("fill", d => d.color)
                .attr("stroke", "#e8f1f5")
                .attr("stroke-width", 2)
                .style("cursor", "pointer")
                .on("mouseover", (e, d) => {
                    tooltip.style.display = "block";
                    const relations = filteredLinks.filter(l => 
                        (l.source.id === d.id || l.source === d.id || l.target.id === d.id || l.target === d.id)
                    );
                    let html = `<div class="tooltip-title">${d.emoji} ${d.name}</div>`;
                    relations.forEach(r => {
                        const other = r.source.id === d.id ? r.target : r.source;
                        const otherId = other.id || other;
                        const otherName = speciesData.find(s => s.id === otherId)?.name || otherId;
                        html += `<div class="tooltip-relation">${r.type}: ${r.desc}</div>`;
                    });
                    tooltip.innerHTML = html;
                })
                .on("mousemove", (e) => {
                    tooltip.style.left = (e.pageX + 10) + "px";
                    tooltip.style.top = (e.pageY + 10) + "px";
                })
                .on("mouseout", () => {
                    tooltip.style.display = "none";
                });

            // Node labels
            const labels = svg.selectAll(".node-label")
                .data(filteredSpecies)
                .enter()
                .append("text")
                .attr("class", "node-label")
                .attr("text-anchor", "middle")
                .attr("dy", "0.3em")
                .attr("font-size", "20px")
                .attr("pointer-events", "none")
                .text(d => d.emoji);

            // Tick function
            simulation.on("tick", () => {
                links
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);
                nodes
                    .attr("cx", d => d.x = Math.max(24, Math.min(width - 24, d.x)))
                    .attr("cy", d => d.y = Math.max(24, Math.min(height - 24, d.y)));
                labels
                    .attr("x", d => d.x)
                    .attr("y", d => d.y);
            });
        }

        // Event listeners
        document.querySelectorAll(".filter-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
                e.target.classList.add("active");
                currentFilter = e.target.dataset.filter;
                updateVisualization();
            });
        });

        document.querySelectorAll(".zone-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                currentZone = e.target.dataset.zone;
                updateVisualization();
            });
        });

        // Initial render
        updateVisualization();
    </script>
</body>
</html>
