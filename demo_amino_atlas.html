<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amino Atlas</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f1419 0%, #1a2a3a 100%);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 1000px;
      width: 100%;
      background: rgba(20, 32, 45, 0.8);
      border: 1px solid rgba(127, 179, 255, 0.2);
      border-radius: 12px;
      padding: 2rem;
      backdrop-filter: blur(10px);
    }
    h1 {
      font-family: 'Merriweather', serif;
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      color: #7fb3ff;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #a0a8c0;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    .amino-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 0.8rem;
      margin-bottom: 2rem;
    }
    .amino-btn {
      padding: 0.8rem;
      border: 2px solid rgba(127, 179, 255, 0.4);
      background: rgba(30, 50, 70, 0.6);
      color: #7fb3ff;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
      text-align: center;
    }
    .amino-btn:hover {
      border-color: #7fb3ff;
      background: rgba(127, 179, 255, 0.1);
      transform: translateY(-2px);
    }
    .amino-btn.active {
      background: #7fb3ff;
      color: #0f1419;
      border-color: #7fb3ff;
    }
    .detail-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-top: 2rem;
    }
    .structure-box {
      background: rgba(15, 20, 25, 0.6);
      border: 1px solid rgba(0, 255, 136, 0.3);
      border-radius: 8px;
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 300px;
    }
    svg {
      width: 100%;
      max-width: 250px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .stat-card {
      background: rgba(30, 50, 70, 0.6);
      border: 1px solid rgba(127, 179, 255, 0.3);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }
    .stat-label {
      font-size: 0.8rem;
      color: #8ca3c8;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-value {
      font-family: 'Merriweather', serif;
      font-size: 1.4rem;
      color: #00ff88;
      font-weight: 700;
    }
    .formula {
      font-family: monospace;
      color: #ffd700;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }
    .category-badges {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(127, 179, 255, 0.2);
    }
    .badge {
      font-size: 0.75rem;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      font-weight: 600;
    }
    .badge.charged { background: rgba(127, 179, 255, 0.3); color: #7fb3ff; }
    .badge.polar { background: rgba(0, 255, 136, 0.3); color: #00ff88; }
    .badge.nonpolar { background: rgba(255, 107, 157, 0.3); color: #ff6b9d; }
    @media (max-width: 768px) {
      .detail-panel { grid-template-columns: 1fr; }
      h1 { font-size: 1.8rem; }
      .amino-grid { grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Amino Atlas</h1>
    <p class="subtitle">Click an amino acid to explore its structure & properties</p>
    
    <div class="amino-grid" id="aminoGrid"></div>
    
    <div class="detail-panel">
      <div class="structure-box">
        <svg id="structureSvg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div>
        <div class="stats-grid" id="statsGrid"></div>
      </div>
    </div>
  </div>

  <script>
    // Real NIST biochemistry data for 20 standard amino acids
    const aminoAcids = {
      Ala: { name: 'Alanine', formula: 'C₃H₇NO₂', mw: 89.09, pI: 6.00, pKa1: 2.34, pKa2: 9.69, pKaR: null, type: 'nonpolar', codons: 'GCU, GCC, GCA, GCG' },
      Gly: { name: 'Glycine', formula: 'C₂H₅NO₂', mw: 75.07, pI: 5.97, pKa1: 2.34, pKa2: 9.60, pKaR: null, type: 'nonpolar', codons: 'GGU, GGC, GGA, GGG' },
      Val: { name: 'Valine', formula: 'C₅H₁₁NO₂', mw: 117.15, pI: 5.96, pKa1: 2.32, pKa2: 9.62, pKaR: null, type: 'nonpolar', codons: 'GUU, GUC, GUA, GUG' },
      Leu: { name: 'Leucine', formula: 'C₆H₁₃NO₂', mw: 131.17, pI: 5.98, pKa1: 2.36, pKa2: 9.60, pKaR: null, type: 'nonpolar', codons: 'UUA, UUG, CUU, CUC, CUA, CUG' },
      Ile: { name: 'Isoleucine', formula: 'C₆H₁₃NO₂', mw: 131.17, pI: 6.02, pKa1: 2.36, pKa2: 9.60, pKaR: null, type: 'nonpolar', codons: 'AUU, AUC, AUA' },
      Phe: { name: 'Phenylalanine', formula: 'C₉H₁₁NO₂', mw: 165.19, pI: 5.48, pKa1: 2.18, pKa2: 9.18, pKaR: null, type: 'nonpolar', codons: 'UUU, UUC' },
      Trp: { name: 'Tryptophan', formula: 'C₁₁H₁₂N₂O₂', mw: 204.23, pI: 5.89, pKa1: 2.38, pKa2: 10.13, pKaR: null, type: 'nonpolar', codons: 'UGG' },
      Pro: { name: 'Proline', formula: 'C₅H₉NO₂', mw: 115.13, pI: 6.30, pKa1: 1.99, pKa2: 10.96, pKaR: null, type: 'nonpolar', codons: 'CCU, CCC, CCA, CCG' },
      Ser: { name: 'Serine', formula: 'C₃H₇NO₃', mw: 105.09, pI: 5.68, pKa1: 2.21, pKa2: 9.15, pKaR: 13.0, type: 'polar', codons: 'UCU, UCC, UCA, UCG, AGU, AGC' },
      Thr: { name: 'Threonine', formula: 'C₄H₉NO₃', mw: 119.12, pI: 5.64, pKa1: 2.08, pKa2: 9.10, pKaR: 13.1, type: 'polar', codons: 'ACU, ACC, ACA, ACG' },
      Cys: { name: 'Cysteine', formula: 'C₃H₇NO₂S', mw: 121.15, pI: 5.07, pKa1: 1.96, pKa2: 10.28, pKaR: 8.33, type: 'polar', codons: 'UGU, UGC' },
      Met: { name: 'Methionine', formula: 'C₅H₁₁NO₂S', mw: 149.21, pI: 5.74, pKa1: 2.28, pKa2: 9.21, pKaR: null, type: 'nonpolar', codons: 'AUG' },
      Asn: { name: 'Asparagine', formula: 'C₄H₈N₂O₃', mw: 132.12, pI: 5.41, pKa1: 2.02, pKa2: 8.80, pKaR: null, type: 'polar', codons: 'AAU, AAC' },
      Gln: { name: 'Glutamine', formula: 'C₅H₁₀N₂O₃', mw: 146.14, pI: 5.65, pKa1: 2.17, pKa2: 9.13, pKaR: null, type: 'polar', codons: 'CAA, CAG' },
      Asp: { name: 'Aspartic Acid', formula: 'C₄H₇NO₄', mw: 133.10, pI: 2.77, pKa1: 2.10, pKa2: 9.82, pKaR: 3.71, type: 'charged', codons: 'GAU, GAC' },
      Glu: { name: 'Glutamic Acid', formula: 'C₅H₉NO₄', mw: 147.13, pI: 3.22, pKa1: 2.19, pKa2: 9.67, pKaR: 4.25, type: 'charged', codons: 'GAA, GAG' },
      Lys: { name: 'Lysine', formula: 'C₆H₁₄N₂O₂', mw: 146.19, pI: 9.74, pKa1: 2.18, pKa2: 8.95, pKaR: 10.53, type: 'charged', codons: 'AAA, AAG' },
      Arg: { name: 'Arginine', formula: 'C₆H₁₄N₄O₂', mw: 174.20, pI: 10.76, pKa1: 2.17, pKa2: 9.04, pKaR: 12.48, type: 'charged', codons: 'CGU, CGC, CGA, CGG, AGA, AGG' },
      His: { name: 'Histidine', formula: 'C₆H₉N₃O₂', mw: 155.15, pI: 7.59, pKa1: 1.77, pKa2: 9.18, pKaR: 6.10, type: 'charged', codons: 'CAU, CAC' },
      Trp: { name: 'Tryptophan', formula: 'C₁₁H₁₂N₂O₂', mw: 204.23, pI: 5.89, pKa1: 2.38, pKa2: 10.13, pKaR: null, type: 'nonpolar', codons: 'UGG' }
    };

    const shortNames = Object.keys(aminoAcids);
    let currentAcid = 'Ala';

    // Build amino acid button grid
    const grid = document.getElementById('aminoGrid');
    shortNames.forEach(short => {
      const btn = document.createElement('button');
      btn.className = 'amino-btn' + (short === 'Ala' ? ' active' : '');
      btn.textContent = short;
      btn.onclick = () => selectAcid(short);
      grid.appendChild(btn);
    });

    function selectAcid(short) {
      currentAcid = short;
      document.querySelectorAll('.amino-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      updateDisplay();
    }

    function updateDisplay() {
      const acid = aminoAcids[currentAcid];
      
      // Update structure SVG
      drawStructure(acid);
      
      // Update stats
      const statsGrid = document.getElementById('statsGrid');
      statsGrid.innerHTML = `
        <div class="stat-card">
          <div class="stat-label">Name</div>
          <div class="stat-value" style="font-size: 1.1rem; color: #7fb3ff;">${acid.name}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Molecular Weight</div>
          <div class="stat-value">${acid.mw}</div>
          <div class="stat-label" style="margin-top: 0.5rem;">u</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Formula</div>
          <div class="formula">${acid.formula}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Isoelectric Point (pI)</div>
          <div class="stat-value">${acid.pI.toFixed(2)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">pKa (Carboxyl)</div>
          <div class="stat-value">${acid.pKa1.toFixed(2)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">pKa (Amino)</div>
          <div class="stat-value">${acid.pKa2.toFixed(2)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Codons</div>
          <div style="font-size: 0.85rem; color: #a0a8c0; margin-top: 0.4rem;">${acid.codons}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Type</div>
          <div style="margin-top: 0.5rem;">
            <span class="badge ${acid.type}">${acid.type.charAt(0).toUpperCase() + acid.type.slice(1)}</span>
          </div>
        </div>
      `;
    }

    function drawStructure(acid) {
      const svg = document.getElementById('structureSvg');
      svg.innerHTML = '';

      // Backbone structure
      const cx = 150, cy = 150;
      
      // N-terminus
      svg.innerHTML += `<circle cx="${cx}" cy="${cy - 60}" r="20" fill="rgba(127, 179, 255, 0.3)" stroke="#7fb3ff" stroke-width="2"/>
        <text x="${cx}" y="${cy - 55}" text-anchor="middle" fill="#7fb3ff" font-size="12" font-weight="bold">NH₂</text>`;
      
      // α-carbon (central hub)
      svg.innerHTML += `<circle cx="${cx}" cy="${cy}" r="25" fill="rgba(0, 255, 136, 0.3)" stroke="#00ff88" stroke-width="2"/>
        <text x="${cx}" y="${cy + 5}" text-anchor="middle" fill="#00ff88" font-size="14" font-weight="bold">α-C</text>`;
      
      // C-terminus
      svg.innerHTML += `<circle cx="${cx}" cy="${cy + 60}" r="20" fill="rgba(255, 107, 157, 0.3)" stroke="#ff6b9d" stroke-width="2"/>
        <text x="${cx}" y="${cy + 65}" text-anchor="middle" fill="#ff6b9d" font-size="12" font-weight="bold">COOH</text>`;
      
      // R group (side chain)
      const rColor = acid.type === 'charged' ? '#7fb3ff' : acid.type === 'polar' ? '#00ff88' : '#ff6b9d';
      svg.innerHTML += `<circle cx="${cx + 70}" cy="${cy}" r="20" fill="rgba(0, 0, 0, 0.2)" stroke="${rColor}" stroke-width="2"/>
        <text x="${cx + 70}" y="${cy + 5}" text-anchor="middle" fill="${rColor}" font-size="12" font-weight="bold">R</text>`;
      
      // Bonds
      svg.innerHTML += `
        <line x1="${cx}" y1="${cy - 35}" x2="${cx}" y2="${cy - 25}" stroke="#a0a8c0" stroke-width="2"/>
        <line x1="${cx}" y1="${cy + 25}" x2="${cx}" y2="${cy + 40}" stroke="#a0a8c0" stroke-width="2"/>
        <line x1="${cx + 25}" y1="${cy}" x2="${cx + 50}" y2="${cy}" stroke="#a0a8c0" stroke-width="2"/>
      `;
    }

    // Initialize
    updateDisplay();
  </script>
</body>
</html>
