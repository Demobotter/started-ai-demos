<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dune World Names Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto Mono', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-family: 'Dosis', sans-serif;
            font-size: 2.5rem;
            color: #00ff88;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }
        
        .header p {
            color: #00d4ff;
            font-size: 0.9rem;
            font-family: 'Roboto Mono', monospace;
            letter-spacing: 1px;
        }
        
        .card {
            background: rgba(26, 26, 46, 0.9);
            border: 1px solid #00ff88;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 255, 136, 0.1);
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        button {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            border: 2px solid #00ff88;
            border-radius: 4px;
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        button:hover {
            background: rgba(0, 255, 136, 0.25);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .planet-name {
            text-align: center;
            font-size: 2rem;
            color: #00ff88;
            font-weight: 700;
            margin: 20px 0;
            font-family: 'Roboto Mono', monospace;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }
        
        .biome-tag {
            text-align: center;
            font-size: 0.9rem;
            color: #00d4ff;
            font-style: italic;
            margin: 15px 0;
            min-height: 30px;
            line-height: 1.5;
        }
        
        .color-palette {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .color-swatch {
            width: 60px;
            height: 60px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .color-swatch:hover {
            transform: scale(1.05);
        }
        
        .star-icon {
            display: inline-block;
            cursor: pointer;
            font-size: 1.5rem;
            margin: 0 5px;
            transition: all 0.2s;
            vertical-align: middle;
        }
        
        .star-icon.favorited {
            color: #ffd700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
        }
        
        .star-icon:hover {
            transform: scale(1.2);
        }
        
        .controls {
            margin: 20px 0;
            text-align: center;
        }
        
        .export-btn {
            min-width: 150px;
        }
        
        .favorites-section {
            margin-top: 40px;
        }
        
        .favorites-title {
            color: #ffd700;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .favorites-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #00d4ff;
            border-radius: 4px;
            padding: 12px;
            background: rgba(0, 212, 255, 0.05);
        }
        
        .favorite-item {
            padding: 10px;
            margin: 5px 0;
            background: rgba(0, 255, 136, 0.1);
            border-left: 3px solid #00ff88;
            border-radius: 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }
        
        .favorite-item-name {
            color: #00ff88;
            font-weight: 700;
        }
        
        .favorite-item-biome {
            color: #00d4ff;
            font-size: 0.75rem;
            margin-left: 10px;
            flex: 1;
            text-align: right;
        }
        
        .remove-btn {
            background: rgba(255, 100, 100, 0.2);
            border-color: #ff6464;
            color: #ff6464;
            padding: 4px 8px;
            font-size: 0.7rem;
            margin-left: 8px;
        }
        
        .remove-btn:hover {
            background: rgba(255, 100, 100, 0.4);
            box-shadow: 0 0 8px rgba(255, 100, 100, 0.5);
        }
        
        .empty-message {
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            padding: 20px;
            font-style: italic;
        }
        
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .planet-name {
                font-size: 1.5rem;
            }
            
            .card {
                padding: 20px;
            }
            
            .color-swatch {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>DUNE WORLDS</h1>
            <p>Generate sci-fi planet names & biomes</p>
        </div>
        
        <div class="card">
            <div class="button-group">
                <button onclick="generatePlanet()">Generate Planet</button>
                <button onclick="clearCurrent()">Clear</button>
            </div>
            
            <div class="planet-name" id="planetName">Click Generate to Start</div>
            <div class="biome-tag" id="biomeTag"></div>
            
            <div class="color-palette" id="colorPalette"></div>
            
            <div class="controls">
                <span class="star-icon" id="favoriteIcon" onclick="toggleFavorite()">☆</span>
            </div>
        </div>
        
        <div class="card">
            <div class="favorites-title">★ Favorites ({count})</div>
            <button class="export-btn" onclick="downloadCSV()">Download CSV</button>
            <div id="favoritesList" class="favorites-list">
                <div class="empty-message">No favorites yet. Generate and star your favorites!</div>
            </div>
        </div>
    </div>
    
    <script>
        // Syllable pool for name generation
        const syllables = [
            'Ar', 'Rak', 'Sal', 'Tar', 'Dune', 'Cal', 'Gel', 'Vor', 'Sietch', 'Kali',
            'Zan', 'Vel', 'Tor', 'Kar', 'Mal', 'Zal', 'Nir', 'Kel', 'Dra', 'Val',
            'Zek', 'Nar', 'Pel', 'Tur', 'Kris', 'Vul', 'Zar', 'Tis', 'Kal', 'Ren',
            'Tal', 'Mir', 'Skar', 'Thal', 'Var', 'Zen', 'Nil', 'Pul', 'Rix', 'Tav',
            'Keth', 'Sal', 'Vor', 'Zer', 'Vin', 'Tol', 'Kes', 'Ral', 'Sin', 'Dar'
        ];
        
        // Biome templates
        const biomes = {
            'Tundra': {
                description: 'Frozen tundra with crystalline caves and subsurface ice lakes',
                colors: ['#1e3a8a', '#60a5fa', '#e0f2fe', '#f0f9ff']
            },
            'Desert': {
                description: 'Scorching sand dunes with twin suns and subsurface water reserves',
                colors: ['#92400e', '#f59e0b', '#fbbf24', '#fcd34d']
            },
            'Ocean': {
                description: 'Deep abyssal realm with bioluminescent trenches and coral cities',
                colors: ['#0c2d48', '#0369a1', '#06b6d4', '#22d3ee']
            },
            'Jungle': {
                description: 'Overgrown jungle with floating flora and fungal towers',
                colors: ['#15803d', '#4ade80', '#86efac', '#a78bfa']
            }
        };
        
        let currentPlanet = null;
        let generatedNames = new Set();
        let favorites = [];
        
        // Load favorites from localStorage
        function loadFavorites() {
            const stored = localStorage.getItem('duneFavorites');
            favorites = stored ? JSON.parse(stored) : [];
            renderFavorites();
        }
        
        // Save favorites to localStorage
        function saveFavorites() {
            localStorage.setItem('duneFavorites', JSON.stringify(favorites));
        }
        
        // Simple hash function for biome assignment
        function hashString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash; // Convert to 32bit integer
            }
            return Math.abs(hash);
        }
        
        // Get biome type from planet name
        function getBiomeType(name) {
            const hash = hashString(name);
            const biomeNames = Object.keys(biomes);
            return biomeNames[hash % biomeNames.length];
        }
        
        // Generate unique planet name
        function generatePlanetName() {
            let name;
            let attempts = 0;
            do {
                const numSyllables = Math.random() < 0.6 ? 2 : 3;
                name = '';
                for (let i = 0; i < numSyllables; i++) {
                    name += syllables[Math.floor(Math.random() * syllables.length)];
                }
                attempts++;
            } while (generatedNames.has(name) && attempts < 20);
            
            generatedNames.add(name);
            return name;
        }
        
        // Generate planet
        function generatePlanet() {
            const name = generatePlanetName();
            const biomeType = getBiomeType(name);
            const biomeData = biomes[biomeType];
            
            currentPlanet = {
                name: name,
                biome: biomeType,
                description: biomeData.description,
                colors: biomeData.colors
            };
            
            renderPlanet();
        }
        
        // Render current planet
        function renderPlanet() {
            if (!currentPlanet) return;
            
            document.getElementById('planetName').textContent = currentPlanet.name;
            document.getElementById('biomeTag').textContent = `${currentPlanet.biome}: ${currentPlanet.description}`;
            
            const paletteDiv = document.getElementById('colorPalette');
            paletteDiv.innerHTML = '';
            currentPlanet.colors.forEach(color => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                swatch.style.backgroundColor = color;
                swatch.title = color;
                paletteDiv.appendChild(swatch);
            });
            
            // Update star icon
            const isFavorited = favorites.some(f => f.name === currentPlanet.name);
            const starIcon = document.getElementById('favoriteIcon');
            if (isFavorited) {
                starIcon.classList.add('favorited');
                starIcon.textContent = '★';
            } else {
                starIcon.classList.remove('favorited');
                starIcon.textContent = '☆';
            }
        }
        
        // Toggle favorite
        function toggleFavorite() {
            if (!currentPlanet) return;
            
            const index = favorites.findIndex(f => f.name === currentPlanet.name);
            if (index >= 0) {
                favorites.splice(index, 1);
            } else {
                favorites.push({
                    name: currentPlanet.name,
                    biome: currentPlanet.biome,
                    description: currentPlanet.description,
                    colors: currentPlanet.colors
                });
            }
            
            saveFavorites();
            renderPlanet();
            renderFavorites();
        }
        
        // Render favorites list
        function renderFavorites() {
            const list = document.getElementById('favoritesList');
            const countElem = document.querySelector('.favorites-title');
            
            countElem.textContent = `★ Favorites (${favorites.length})`;
            
            if (favorites.length === 0) {
                list.innerHTML = '<div class="empty-message">No favorites yet. Generate and star your favorites!</div>';
                return;
            }
            
            list.innerHTML = '';
            favorites.forEach(fav => {
                const item = document.createElement('div');
                item.className = 'favorite-item';
                item.innerHTML = `
                    <div class="favorite-item-name">${fav.name}</div>
                    <div class="favorite-item-biome">${fav.biome}</div>
                    <button class="remove-btn" onclick="removeFavorite('${fav.name}')">✕</button>
                `;
                list.appendChild(item);
            });
        }
        
        // Remove favorite
        function removeFavorite(name) {
            favorites = favorites.filter(f => f.name !== name);
            saveFavorites();
            renderFavorites();
            if (currentPlanet && currentPlanet.name === name) {
                renderPlanet();
            }
        }
        
        // Download as CSV
        function downloadCSV() {
            if (favorites.length === 0) {
                alert('No favorites to download.');
                return;
            }
            
            let csv = 'Name,Biome,Description\n';
            favorites.forEach(fav => {
                csv += `"${fav.name}","${fav.biome}","${fav.description}"\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', 'dune_planets.csv');
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        // Clear current
        function clearCurrent() {
            currentPlanet = null;
            document.getElementById('planetName').textContent = 'Click Generate to Start';
            document.getElementById('biomeTag').textContent = '';
            document.getElementById('colorPalette').innerHTML = '';
            document.getElementById('favoriteIcon').textContent = '☆';
            document.getElementById('favoriteIcon').classList.remove('favorited');
        }
        
        // Initialize
        loadFavorites();
    </script>
</body>
</html>
