<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creature Forge</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a0f2e 0%, #2d1b4e 50%, #1a0f2e 100%);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(20, 10, 35, 0.8);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 165, 116, 0.2);
        }
        
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            color: #d4a574;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #b0a0d0;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .control-group {
            background: rgba(212, 165, 116, 0.08);
            padding: 1.25rem;
            border-radius: 12px;
            border-left: 3px solid #d4a574;
        }
        
        .control-label {
            font-family: 'Syne', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            color: #d4a574;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.75rem;
        }
        
        .option-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.6rem;
        }
        
        .option-btn {
            padding: 0.7rem 0.9rem;
            border: 2px solid #6ba876;
            background: transparent;
            color: #6ba876;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        
        .option-btn:hover {
            background: rgba(107, 168, 118, 0.15);
        }
        
        .option-btn.active {
            background: #6ba876;
            color: #1a0f2e;
            box-shadow: 0 0 16px rgba(107, 168, 118, 0.4);
        }
        
        .viewport {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .creature-stage {
            background: linear-gradient(135deg, rgba(45, 27, 78, 0.6) 0%, rgba(45, 80, 22, 0.3) 100%);
            border: 2px solid rgba(212, 165, 116, 0.3);
            border-radius: 12px;
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            position: relative;
            overflow: hidden;
        }
        
        .creature-stage.forest {
            background: linear-gradient(135deg, rgba(45, 80, 22, 0.6) 0%, rgba(107, 168, 118, 0.2) 100%);
        }
        
        .creature-stage.mystical {
            background: radial-gradient(circle at center, rgba(181, 126, 220, 0.2) 0%, rgba(45, 27, 78, 0.8) 100%);
        }
        
        .creature-stage.hive {
            background: linear-gradient(135deg, rgba(212, 165, 116, 0.15) 0%, rgba(233, 75, 60, 0.1) 100%);
        }
        
        .creature-stage.castle {
            background: linear-gradient(135deg, rgba(127, 179, 213, 0.15) 0%, rgba(75, 27, 78, 0.6) 100%);
        }
        
        svg {
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.5));
            max-width: 100%;
            height: auto;
        }
        
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.8rem;
        }
        
        .stat-card {
            background: rgba(212, 165, 116, 0.12);
            border: 1px solid rgba(212, 165, 116, 0.25);
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .stat-value {
            font-family: 'Syne', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #d4a574;
            margin-bottom: 0.3rem;
        }
        
        .stat-name {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #9080b0;
            letter-spacing: 0.5px;
        }
        
        .abilities {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.8rem;
        }
        
        .ability-card {
            background: rgba(107, 168, 118, 0.1);
            border: 1px solid rgba(107, 168, 118, 0.3);
            border-radius: 8px;
            padding: 0.9rem;
            text-align: center;
            transition: all 0.25s ease;
        }
        
        .ability-card:hover {
            background: rgba(107, 168, 118, 0.2);
            border-color: rgba(107, 168, 118, 0.6);
        }
        
        .ability-name {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            color: #6ba876;
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
        }
        
        .ability-desc {
            font-size: 0.75rem;
            color: #a0b0a0;
        }
        
        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            
            .option-buttons {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .stats-panel {
                grid-template-columns: repeat(2, 1fr);
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .creature-stage {
                min-height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐉 Creature Forge</h1>
        <p class="subtitle">Build your fantasy companion with traits and watch its stats spring to life</p>
        
        <div class="grid-2">
            <div class="controls">
                <div class="control-group">
                    <div class="control-label">Body Type</div>
                    <div class="option-buttons" id="bodyButtons"></div>
                </div>
                
                <div class="control-group">
                    <div class="control-label">Size</div>
                    <div class="option-buttons" id="sizeButtons"></div>
                </div>
                
                <div class="control-group">
                    <div class="control-label">Diet</div>
                    <div class="option-buttons" id="dietButtons"></div>
                </div>
                
                <div class="control-group">
                    <div class="control-label">Temperament</div>
                    <div class="option-buttons" id="temperamentButtons"></div>
                </div>
            </div>
            
            <div class="viewport">
                <div class="creature-stage" id="stage">
                    <svg id="creature" width="200" height="200" viewBox="0 0 200 200"></svg>
                </div>
            </div>
        </div>
        
        <div class="stats-panel" id="stats"></div>
        
        <div style="margin-top: 2rem;">
            <div class="control-label" style="margin-bottom: 1rem;">Abilities</div>
            <div class="abilities" id="abilities"></div>
        </div>
    </div>

    <script>
        const traits = {
            body: ['Humanoid', 'Beast', 'Hybrid', 'Insectoid'],
            size: ['Tiny', 'Small', 'Medium', 'Large', 'Giant'],
            diet: ['Herbivore', 'Omnivore', 'Carnivore', 'Scavenger'],
            temperament: ['Aggressive', 'Neutral', 'Friendly', 'Fearful']
        };

        const state = {
            body: 'Humanoid',
            size: 'Medium',
            diet: 'Omnivore',
            temperament: 'Neutral'
        };

        const abilityData = {
            Humanoid: { Aggressive: 'Sword Slash', Neutral: 'Counter', Friendly: 'Guard', Fearful: 'Dodge' },
            Beast: { Aggressive: 'Maul', Neutral: 'Pounce', Friendly: 'Tackle', Fearful: 'Flee' },
            Hybrid: { Aggressive: 'Firebolt', Neutral: 'Morph', Friendly: 'Heal', Fearful: 'Cloak' },
            Insectoid: { Aggressive: 'Swarm', Neutral: 'Chitin', Friendly: 'Hive Mind', Fearful: 'Burrow' }
        };

        function initControls() {
            for (const [trait, options] of Object.entries(traits)) {
                const container = document.getElementById(`${trait}Buttons`);
                options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn' + (state[trait] === opt ? ' active' : '');
                    btn.textContent = opt;
                    btn.addEventListener('click', () => {
                        state[trait] = opt;
                        updateAll();
                    });
                    container.appendChild(btn);
                });
            }
        }

        function drawCreature() {
            const svg = document.getElementById('creature');
            svg.innerHTML = '';
            
            const bodyShapes = {
                Humanoid: () => `
                    <circle cx="100" cy="60" r="20" fill="#d4a574"/>
                    <rect x="85" y="85" width="30" height="40" fill="#2d5016" rx="5"/>
                    <rect x="70" y="130" width="15" height="40" fill="#2d5016" rx="4"/>
                    <rect x="115" y="130" width="15" height="40" fill="#2d5016" rx="4"/>
                `,
                Beast: () => `
                    <ellipse cx="100" cy="100" rx="35" ry="28" fill="#e94b3c"/>
                    <circle cx="75" cy="75" r="15" fill="#e94b3c"/>
                    <polygon points="55,70 45,60 55,55" fill="#e94b3c"/>
                    <rect x="70" y="125" width="8" height="35" fill="#1a0f2e" rx="4"/>
                    <rect x="85" y="125" width="8" height="35" fill="#1a0f2e" rx="4"/>
                    <rect x="100" y="125" width="8" height="35" fill="#1a0f2e" rx="4"/>
                    <rect x="115" y="125" width="8" height="35" fill="#1a0f2e" rx="4"/>
                `,
                Hybrid: () => `
                    <ellipse cx="100" cy="90" rx="30" ry="35" fill="#b57edc"/>
                    <polygon points="100,40 85,50 115,50" fill="#b57edc"/>
                    <circle cx="90" cy="85" r="8" fill="#d4a574"/>
                    <circle cx="110" cy="85" r="8" fill="#d4a574"/>
                    <path d="M85 125 Q85 160 80 165" stroke="#b57edc" stroke-width="6" fill="none" stroke-linecap="round"/>
                    <path d="M115 125 Q115 160 120 165" stroke="#b57edc" stroke-width="6" fill="none" stroke-linecap="round"/>
                    <circle cx="100" cy="60" r="12" fill="#7fb3d5" opacity="0.6"/>
                `,
                Insectoid: () => `
                    <ellipse cx="100" cy="85" rx="25" ry="32" fill="#2d5016"/>
                    <circle cx="100" cy="50" r="18" fill="#2d5016"/>
                    <circle cx="90" cy="45" r="6" fill="#6ba876"/>
                    <circle cx="110" cy="45" r="6" fill="#6ba876"/>
                    <path d="M75 75 L60 55" stroke="#d4a574" stroke-width="4" stroke-linecap="round"/>
                    <path d="M75 85 L55 85" stroke="#d4a574" stroke-width="4" stroke-linecap="round"/>
                    <path d="M75 95 L60 115" stroke="#d4a574" stroke-width="4" stroke-linecap="round"/>
                    <path d="M125 75 L140 55" stroke="#d4a574" stroke-width="4" stroke-linecap="round"/>
                    <path d="M125 85 L145 85" stroke="#d4a574" stroke-width="4" stroke-linecap="round"/>
                    <path d="M125 95 L140 115" stroke="#d4a574" stroke-width="4" stroke-linecap="round"/>
                    <polygon points="80,130 85,145 95,140" fill="#d4a574"/>
                    <polygon points="120,130 115,145 105,140" fill="#d4a574"/>
                `
            };
            
            const shapes = bodyShapes[state.body] || bodyShapes.Humanoid;
            svg.innerHTML = shapes();
        }

        function calcStats() {
            const sizeMap = { Tiny: 1, Small: 2, Medium: 3, Large: 4, Giant: 5 };
            const bodyMap = { Humanoid: 2, Beast: 3, Hybrid: 2.5, Insectoid: 1.5 };
            const dietMap = { Herbivore: 1, Omnivore: 2, Carnivore: 3, Scavenger: 1.5 };
            const tempMap = { Aggressive: 1.3, Neutral: 1, Friendly: 0.8, Fearful: 0.6 };
            
            const s = sizeMap[state.size];
            const b = bodyMap[state.body];
            const d = dietMap[state.diet];
            const t = tempMap[state.temperament];
            
            return {
                HP: Math.round((s * 3 + b * 2) * t),
                ATK: Math.round(d * 8 * t),
                DEF: Math.round((s * 1.5 + b) * (2 - t * 0.5)),
                SPD: Math.round((100 - s * 15) * (1 + (t - 1) * 0.3))
            };
        }

        function updateStats() {
            const stats = calcStats();
            const container = document.getElementById('stats');
            container.innerHTML = '';
            
            for (const [name, value] of Object.entries(stats)) {
                const card = document.createElement('div');
                card.className = 'stat-card';
                card.innerHTML = `<div class="stat-value">${value}</div><div class="stat-name">${name}</div>`;
                container.appendChild(card);
            }
        }

        function updateAbilities() {
            const abilitySet = abilityData[state.body][state.temperament];
            const abilities = abilitySet.split(', ');
            const container = document.getElementById('abilities');
            container.innerHTML = '';
            
            const mainAbility = abilitySet;
            const card = document.createElement('div');
            card.className = 'ability-card';
            card.style.gridColumn = '1 / -1';
            card.style.background = 'rgba(107, 168, 118, 0.2)';
            card.innerHTML = `
                <div class="ability-name">⭐ ${mainAbility}</div>
                <div class="ability-desc">${state.body} with ${state.temperament} nature</div>
            `;
            container.appendChild(card);
        }

        function updateStage() {
            const stage = document.getElementById('stage');
            stage.className = 'creature-stage';
            
            const stageClass = {
                Beast: 'forest',
                Hybrid: 'mystical',
                Insectoid: 'hive',
                Humanoid: 'castle'
            }[state.body] || 'forest';
            
            stage.classList.add(stageClass);
        }

        function updateAll() {
            drawCreature();
            updateStats();
            updateAbilities();
            updateStage();
            
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.remove('active');
                if (Object.values(state).includes(btn.textContent)) {
                    btn.classList.add('active');
                }
            });
        }

        initControls();
        updateAll();
    </script>
</body>
</html>
