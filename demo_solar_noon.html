<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Noon</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(15, 20, 40, 0.8);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #ffd700;
            text-align: center;
            letter-spacing: -1px;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }
        .control {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffb700;
            font-size: 0.9rem;
        }
        input, select {
            padding: 10px 12px;
            border: 2px solid #333;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #ffd700;
            background: rgba(255, 255, 255, 0.1);
        }
        .mode-toggle {
            grid-column: 1 / -1;
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .mode-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #333;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .mode-btn.active {
            background: #ffd700;
            color: #0a0e27;
            border-color: #ffd700;
        }
        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat {
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid #ffd700;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-label {
            font-size: 0.85rem;
            color: #ffb700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stat-value {
            font-family: 'Syne', sans-serif;
            font-size: 1.8rem;
            color: #ffd700;
            font-weight: 700;
        }
        .stat-unit {
            font-size: 0.9rem;
            color: #999;
            margin-top: 4px;
        }
        .canvas-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
        }
        canvas {
            border-radius: 8px;
            display: block;
        }
        .error {
            background: rgba(255, 53, 53, 0.1);
            border: 2px solid #ff3535;
            border-radius: 12px;
            padding: 15px;
            color: #ff6b6b;
            text-align: center;
            margin-bottom: 20px;
        }
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 1.8rem;
                margin-bottom: 20px;
            }
            .controls {
                grid-template-columns: 1fr;
            }
            .results {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>☀️ Solar Noon</h1>
        
        <div class="mode-toggle">
            <button class="mode-btn active" data-mode="noon">Solar Noon</button>
            <button class="mode-btn" data-mode="rise">Sunrise</button>
            <button class="mode-btn" data-mode="set">Sunset</button>
            <button class="mode-btn" data-mode="analemma">Analemma</button>
        </div>

        <div class="controls">
            <div class="control">
                <label>City</label>
                <input type="text" id="cityInput" placeholder="Enter city name" value="Melbourne">
            </div>
            <div class="control">
                <label>Date</label>
                <input type="date" id="dateInput">
            </div>
            <div class="control">
                <label>Latitude</label>
                <input type="number" id="latInput" placeholder="-37.81" step="0.01">
            </div>
            <div class="control">
                <label>Longitude</label>
                <input type="number" id="lonInput" placeholder="144.96" step="0.01">
            </div>
        </div>

        <div id="errorMsg" class="error" style="display:none;"></div>

        <div class="results" id="results">
            <div class="stat">
                <div class="stat-label">Time</div>
                <div class="stat-value" id="resultTime">--:--</div>
                <div class="stat-unit">HH:MM UTC</div>
            </div>
            <div class="stat">
                <div class="stat-label">Altitude</div>
                <div class="stat-value" id="resultAlt">--°</div>
                <div class="stat-unit">Above Horizon</div>
            </div>
            <div class="stat">
                <div class="stat-label">Azimuth</div>
                <div class="stat-value" id="resultAz">--°</div>
                <div class="stat-unit">From North</div>
            </div>
            <div class="stat">
                <div class="stat-label">Equation of Time</div>
                <div class="stat-value" id="resultEoT">--</div>
                <div class="stat-unit">Minutes</div>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="canvas" width="500" height="500"></canvas>
        </div>
    </div>

    <script>
        // Simplified NOAA Solar Position Algorithm (SPA)
        class SolarPosition {
            static toJD(year, month, day) {
                return 367 * year - Math.floor(7 * (year + Math.floor((month + 9) / 12)) / 4) 
                       - Math.floor(3 * (Math.floor((year + (month - 9) / 7) / 100) + 1) / 4) 
                       + Math.floor(275 * month / 9) + day + 1721028.5;
            }

            static calcEquationOfTime(JD) {
                const T = (JD - 2451545.0) / 36525.0;
                const L0 = 280.4664567 + 360007.6982779 * T + 0.03032028 * T * T + T * T * T / 49010 - T * T * T * T / 15300 - T * T * T * T * T / 2000000;
                const e = 0.016708634 - 0.000042037 * T - 0.0000001267 * T * T;
                const M = 357.52910918 + 35999.05029094 * T - 0.0001536667 * T * T;
                const Mrad = M * Math.PI / 180;
                const y = Math.tan((L0 % 360) * Math.PI / 360);
                const y2 = y * y;
                const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(Mrad) 
                        + (0.019993 - 0.000101 * T) * Math.sin(2 * Mrad) 
                        + 0.000029 * Math.sin(3 * Mrad);
                const eSun = L0 + C;
                return 229.2 * (y2 / (1 + y2)) * (Math.sin(2 * eSun * Math.PI / 180) - 2 * e * Math.sin(M * Math.PI / 180) + 4 * e * y2 * Math.sin(2 * eSun * Math.PI / 180) * Math.sin(M * Math.PI / 180) - 0.5 * y2 * y2 * Math.sin(4 * eSun * Math.PI / 180) - 1.25 * e * e * Math.sin(2 * M * Math.PI / 180));
            }

            static calcSolarNoon(year, month, day, lon) {
                const JD = this.toJD(year, month, day);
                const T = (JD - 2451545.0) / 36525.0;
                const L0 = (280.4664567 + 360007.6982779 * T) % 360;
                const eot = this.calcEquationOfTime(JD);
                const noonJD = JD - 0.5 + (lon / 360) + (0.06571 - 0.00569 * T) + (0.00898 * Math.sin(2 * (L0 % 360) * Math.PI / 180)) / 1440;
                return { JD: noonJD, eot: eot };
            }

            static calcAltitudeAzimuth(year, month, day, hour, minute, lat, lon) {
                const JD = this.toJD(year, month, day) + (hour + minute / 60) / 24;
                const T = (JD - 2451545.0) / 36525.0;
                
                const L0 = (280.4664567 + 360007.6982779 * T) % 360;
                const M = (357.52910918 + 35999.05029094 * T) % 360;
                const Mrad = M * Math.PI / 180;
                const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(Mrad) 
                        + (0.019993 - 0.000101 * T) * Math.sin(2 * Mrad) 
                        + 0.000029 * Math.sin(3 * Mrad);
                const sunLon = (L0 + C) % 360;
                
                const e = 23.439291 - 0.0130042 * T - 0.00000164 * T * T + 0.000000504 * T * T * T;
                const sunLatRad = Math.asin(Math.sin(e * Math.PI / 180) * Math.sin(sunLon * Math.PI / 180));
                
                const tau = (JD + lon / 360 - Math.floor(JD + 0.5) - 0.5) * 360;
                const ha = (tau - sunLon) % 360;
                const haRad = ha > 180 ? (ha - 360) * Math.PI / 180 : ha * Math.PI / 180;
                
                const latRad = lat * Math.PI / 180;
                const alt = Math.asin(Math.sin(sunLatRad) * Math.sin(latRad) + Math.cos(sunLatRad) * Math.cos(latRad) * Math.cos(haRad));
                const az = Math.atan2(Math.sin(haRad), Math.cos(haRad) * Math.sin(latRad) - Math.tan(sunLatRad) * Math.cos(latRad));
                
                return {
                    altitude: alt * 180 / Math.PI,
                    azimuth: ((az * 180 / Math.PI + 180) % 360)
                };
            }
        }

        let currentMode = 'noon';
        let currentLat = -37.8136, currentLon = 144.9631;

        async function geocodeCity(city) {
            try {
                const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&format=json`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    const r = data.results[0];
                    return { lat: r.latitude, lon: r.longitude };
                }
                throw new Error('City not found');
            } catch (e) {
                throw new Error(`Failed to geocode: ${e.message}`);
            }
        }

        function formatTime(jd) {
            const ms = (jd + 0.5 - Math.floor(jd + 0.5)) * 86400000;
            const h = Math.floor(ms / 3600000);
            const m = Math.floor((ms % 3600000) / 60000);
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }

        function drawNoonAnalemma(canvas, analemmaData) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(0, 0, w, h);
            
            ctx.strokeStyle = '#ffb700';
            ctx.lineWidth = 2;
            ctx.beginPath();
            const cx = w / 2, cy = h / 2, scale = 80;
            let first = true;
            for (let i = 0; i < analemmaData.length; i++) {
                const x = cx + analemmaData[i].eot * scale / 30;
                const y = cy - analemmaData[i].declination * scale;
                if (first) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                first = false;
            }
            ctx.stroke();
            
            ctx.fillStyle = '#ffd700';
            for (let i = 0; i < analemmaData.length; i += Math.floor(analemmaData.length / 12)) {
                const x = cx + analemmaData[i].eot * scale / 30;
                const y = cy - analemmaData[i].declination * scale;
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 1;
            ctx.setLineDash([2, 4]);
            ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, h);
            ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.fillStyle = '#999';
            ctx.font = '12px Inter';
            ctx.textAlign = 'center';
            ctx.fillText('Equation of Time (min)', cx, h - 10);
            ctx.save();
            ctx.translate(10, cy);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText('Declination (°)', 0, 0);
            ctx.restore();
        }

        function drawAltAzPolar(canvas, altitude, azimuth) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(0, 0, w, h);
            
            const cx = w / 2, cy = h / 2, maxRadius = 150;
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 1;
            for (let r = 30; r <= maxRadius; r += 30) {
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 0.5;
            for (let d = 0; d < 360; d += 30) {
                const rad = d * Math.PI / 180;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + maxRadius * Math.cos(rad), cy + maxRadius * Math.sin(rad));
                ctx.stroke();
            }
            
            if (altitude > -5) {
                const az_rad = (azimuth - 90) * Math.PI / 180;
                const r = (90 - altitude) / 90 * maxRadius;
                const x = cx + r * Math.cos(az_rad);
                const y = cy + r * Math.sin(az_rad);
                
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 16px Inter';
                ctx.textAlign = 'center';
                ctx.fillText('Below Horizon', cx, cy);
            }
            
            ctx.fillStyle = '#ffb700';
            ctx.font = '12px Inter';
            ctx.textAlign = 'center';
            ctx.fillText('N', cx, cy - maxRadius - 20);
            ctx.fillText('E', cx + maxRadius + 20, cy + 5);
            ctx.fillText('S', cx, cy + maxRadius + 20);
            ctx.fillText('W', cx - maxRadius - 20, cy + 5);
        }

        async function update() {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.style.display = 'none';
            
            try {
                const city = document.getElementById('cityInput').value.trim();
                if (city && city !== 'Melbourne') {
                    const geo = await geocodeCity(city);
                    currentLat = geo.lat;
                    currentLon = geo.lon;
                    document.getElementById('latInput').value = currentLat.toFixed(4);
                    document.getElementById('lonInput').value = currentLon.toFixed(4);
                } else {
                    currentLat = parseFloat(document.getElementById('latInput').value) || -37.8136;
                    currentLon = parseFloat(document.getElementById('lonInput').value) || 144.9631;
                }
                
                const dateStr = document.getElementById('dateInput').value;
                const [year, month, day] = dateStr.split('-').map(Number);
                
                if (currentMode === 'analemma') {
                    const canvas = document.getElementById('canvas');
                    const analemmaData = [];
                    for (let d = 1; d <= 365; d += 5) {
                        const m = Math.floor((d + 9) / 30.636875);
                        const dy = d - Math.floor(30.636875 * m) + 1;
                        const noon = SolarPosition.calcSolarNoon(year, m, dy, currentLon);
                        const pos = SolarPosition.calcAltitudeAzimuth(year, m, dy, 12, 0, currentLat, currentLon);
                        const T = (noon.JD - 2451545) / 36525;
                        const e = 23.439291 - 0.0130042 * T;
                        const M = (357.52910918 + 35999.05029094 * T) % 360;
                        const L0 = (280.4664567 + 360007.6982779 * T) % 360;
                        const Mrad = M * Math.PI / 180;
                        const C = (1.914602 - 0.004817 * T) * Math.sin(Mrad) + (0.019993 - 0.000101 * T) * Math.sin(2 * Mrad) + 0.000029 * Math.sin(3 * Mrad);
                        const sunLon = (L0 + C) % 360;
                        const declination = Math.asin(Math.sin(e * Math.PI / 180) * Math.sin(sunLon * Math.PI / 180)) * 180 / Math.PI;
                        analemmaData.push({ eot: noon.eot, declination: declination });
                    }
                    drawNoonAnalemma(canvas, analemmaData);
                    document.getElementById('results').style.display = 'grid';
                    document.getElementById('resultTime').textContent = 'Figure-8';
                    document.getElementById('resultAlt').textContent = 'Analemma';
                    document.getElementById('resultAz').textContent = 'Curve';
                    document.getElementById('resultEoT').textContent = '365 Days';
                } else {
                    let targetHour, targetMinute;
                    
                    if (currentMode === 'noon') {
                        const noon = SolarPosition.calcSolarNoon(year, month, day, currentLon);
                        const ms = (noon.JD + 0.5 - Math.floor(noon.JD + 0.5)) * 86400000;
                        targetHour = Math.floor(ms / 3600000);
                        targetMinute = Math.floor((ms % 3600000) / 60000);
                        document.getElementById('resultEoT').textContent = noon.eot.toFixed(2);
                    } else if (currentMode === 'rise') {
                        const searchJD = SolarPosition.toJD(year, month, day);
                        let found = false;
                        for (let h = 0; h < 24; h++) {
                            for (let m = 0; m < 60; m += 5) {
                                const pos = SolarPosition.calcAltitudeAzimuth(year, month, day, h, m, currentLat, currentLon);
                                if (pos.altitude > 0) {
                                    targetHour = h;
                                    targetMinute = m;
                                    found = true;
                                    break;
                                }
                            }
                            if (found) break;
                        }
                        if (!found) throw new Error('Sun does not rise at this latitude/date');
                        document.getElementById('resultEoT').textContent = '--';
                    } else if (currentMode === 'set') {
                        let lastHour = 0, lastMinute = 0;
                        for (let h = 0; h < 24; h++) {
                            for (let m = 0; m < 60; m += 5) {
                                const pos = SolarPosition.calcAltitudeAzimuth(year, month, day, h, m, currentLat, currentLon);
                                if (pos.altitude > 0) {
                                    lastHour = h;
                                    lastMinute = m;
                                }
                            }
                        }
                        targetHour = lastHour;
                        targetMinute = lastMinute;
                        document.getElementById('resultEoT').textContent = '--';
                    }
                    
                    const pos = SolarPosition.calcAltitudeAzimuth(year, month, day, targetHour, targetMinute, currentLat, currentLon);
                    
                    document.getElementById('resultTime').textContent = `${String(targetHour).padStart(2, '0')}:${String(targetMinute).padStart(2, '0')}`;
                    document.getElementById('resultAlt').textContent = pos.altitude.toFixed(1) + '°';
                    document.getElementById('resultAz').textContent = pos.azimuth.toFixed(1) + '°';
                    
                    const canvas = document.getElementById('canvas');
                    drawAltAzPolar(canvas, pos.altitude, pos.azimuth);
                }
            } catch (e) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = e.message;
            }
        }

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                update();
            });
        });

        document.getElementById('cityInput').addEventListener('input', update);
        document.getElementById('dateInput').addEventListener('change', update);
        document.getElementById('latInput').addEventListener('change', update);
        document.getElementById('lonInput').addEventListener('change', update);

        // Initialize with today's date
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('dateInput').value = today;
        update();
    </script>
</body>
</html>
