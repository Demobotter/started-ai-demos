<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wind Rose Compass</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Space Mono', monospace;
      background: #0a0e27;
      color: #7dd3fc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      display: flex;
      gap: 20px;
      max-width: 1400px;
      width: 100%;
    }
    
    .sidebar {
      width: 280px;
      background: #0f1835;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #1e3a5f;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    .title {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      color: #00d9ff;
      margin-bottom: 10px;
    }
    
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .control-label {
      font-size: 12px;
      text-transform: uppercase;
      color: #4da8da;
      font-weight: 700;
      letter-spacing: 1px;
    }
    
    .slider-container {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    
    input[type="range"] {
      flex: 1;
      accent-color: #00d9ff;
      cursor: pointer;
    }
    
    .slider-value {
      min-width: 50px;
      text-align: right;
      color: #00d9ff;
      font-weight: 700;
    }
    
    .button-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    
    button {
      padding: 8px 12px;
      background: #1e3a5f;
      color: #7dd3fc;
      border: 1px solid #4da8da;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      transition: all 0.2s;
    }
    
    button:hover {
      background: #2d5a8f;
      border-color: #00d9ff;
    }
    
    button.active {
      background: #00d9ff;
      color: #0a0e27;
      border-color: #00d9ff;
    }
    
    .stats-box {
      background: #1a2744;
      border-left: 3px solid #00d9ff;
      padding: 12px;
      border-radius: 4px;
      font-size: 11px;
      line-height: 1.6;
    }
    
    .stats-label {
      color: #4da8da;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.5px;
    }
    
    .stats-value {
      color: #00d9ff;
      font-weight: 700;
      margin-top: 2px;
    }
    
    .visualization {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    #canvas {
      flex: 1;
      background: #0a0e27;
      border: 1px solid #1e3a5f;
      border-radius: 8px;
      min-height: 400px;
      cursor: crosshair;
    }
    
    .wind-rose-container {
      background: #0f1835;
      border: 1px solid #1e3a5f;
      border-radius: 8px;
      padding: 15px;
      height: 200px;
    }
    
    #windRose {
      width: 100%;
      height: 100%;
    }
    
    .legend {
      display: flex;
      gap: 15px;
      font-size: 11px;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 2px;
    }
    
    @media (max-width: 1024px) {
      .container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div>
        <div class="title">🌪️ Wind Rose</div>
        <div style="font-size: 12px; color: #4da8da; margin-top: 8px;">Earth's planetary wind systems by latitude</div>
      </div>
      
      <div class="control-group">
        <div class="control-label">Latitude (°N/S)</div>
        <div class="slider-container">
          <input type="range" id="latitudeSlider" min="0" max="90" value="30" step="5">
          <div class="slider-value"><span id="latValue">30</span>°</div>
        </div>
      </div>
      
      <div class="control-group">
        <div class="control-label">Season</div>
        <div class="button-group">
          <button class="season-btn active" data-season="spring">Spring</button>
          <button class="season-btn" data-season="summer">Summer</button>
          <button class="season-btn" data-season="fall">Fall</button>
          <button class="season-btn" data-season="winter">Winter</button>
        </div>
      </div>
      
      <div class="control-group">
        <div class="control-label">Wind Speed Scale</div>
        <div class="slider-container">
          <input type="range" id="scaleSlider" min="0.5" max="2" value="1" step="0.1">
          <div class="slider-value"><span id="scaleValue">1.0</span>x</div>
        </div>
      </div>
      
      <div class="stats-box">
        <div class="stats-label">Wind Direction</div>
        <div class="stats-value" id="windDir">NE</div>
      </div>
      
      <div class="stats-box">
        <div class="stats-label">Wind Speed</div>
        <div class="stats-value" id="windSpeed">8.2 m/s</div>
      </div>
      
      <div class="stats-box">
        <div class="stats-label">Wind Name</div>
        <div class="stats-value" id="windName">Trade Wind</div>
      </div>
      
      <div class="stats-box">
        <div class="stats-label">Circulation Cell</div>
        <div class="stats-value" id="cellName">Hadley Cell</div>
      </div>
      
      <div class="legend">
        <div class="legend-item">
          <div class="legend-color" style="background: #ff4444;"></div>
          <span>Fast ≥10 m/s</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #ff8844;"></div>
          <span>Moderate 5-10 m/s</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #4da8da;"></div>
          <span>Light <5 m/s</span>
        </div>
      </div>
    </div>
    
    <div class="visualization">
      <canvas id="canvas"></canvas>
      <div class="wind-rose-container">
        <canvas id="windRose"></canvas>
      </div>
    </div>
  </div>

  <script>
    // Global state
    let state = {
      latitude: 30,
      season: 'spring',
      scale: 1.0,
      particles: []
    };
    
    // Wind cells and patterns per latitude
    const windCells = {
      hadley: { lat: [0, 30], speed: 8, dir: 60, name: 'Trade Wind', cell: 'Hadley Cell' },
      subtropical: { lat: [30, 35], speed: 4, dir: 45, name: 'Subtropical', cell: 'Hadley→Ferrel' },
      ferrel: { lat: [35, 60], speed: 6.5, dir: 225, name: 'Westerly', cell: 'Ferrel Cell' },
      polar: { lat: [60, 90], speed: 3.5, dir: 45, name: 'Polar Easterly', cell: 'Polar Cell' }
    };
    
    // Seasonal adjustments (shift jet stream, alter speeds)
    const seasonalFactors = {
      spring: { speedMult: 1, dirShift: 0 },
      summer: { speedMult: 0.95, dirShift: -15 },
      fall: { speedMult: 1.05, dirShift: 10 },
      winter: { speedMult: 1.15, dirShift: 20 }
    };
    
    function getWindAtLatitude(lat, season) {
      let cell, baseSpeed, baseDir, windName, cellName;
      
      if (lat >= 0 && lat < 30) {
        cell = windCells.hadley;
      } else if (lat >= 30 && lat < 35) {
        cell = windCells.subtropical;
      } else if (lat >= 35 && lat < 60) {
        cell = windCells.ferrel;
      } else {
        cell = windCells.polar;
      }
      
      baseSpeed = cell.speed;
      baseDir = cell.dir;
      windName = cell.name;
      cellName = cell.cell;
      
      const factor = seasonalFactors[season];
      const finalSpeed = baseSpeed * factor.speedMult;
      const finalDir = (baseDir + factor.dirShift + 360) % 360;
      
      return { speed: finalSpeed, dir: finalDir, name: windName, cell: cellName };
    }
    
    function dirToCardinal(deg) {
      const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
      return dirs[Math.round(deg / 22.5) % 16];
    }
    
    function updateStats() {
      const wind = getWindAtLatitude(state.latitude, state.season);
      const displaySpeed = (wind.speed * state.scale).toFixed(1);
      
      document.getElementById('latValue').textContent = Math.abs(state.latitude);
      document.getElementById('scaleValue').textContent = state.scale.toFixed(1);
      document.getElementById('windDir').textContent = dirToCardinal(wind.dir);
      document.getElementById('windSpeed').textContent = displaySpeed + ' m/s';
      document.getElementById('windName').textContent = wind.name;
      document.getElementById('cellName').textContent = wind.cell;
      
      // Update season buttons
      document.querySelectorAll('.season-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.season === state.season);
      });
    }
    
    function initParticles(canvas) {
      state.particles = [];
      const wind = getWindAtLatitude(state.latitude, state.season);
      const particleCount = Math.max(50, Math.floor(canvas.width / 10));
      
      for (let i = 0; i < particleCount; i++) {
        state.particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: Math.cos((wind.dir - 90) * Math.PI / 180) * wind.speed * state.scale,
          vy: Math.sin((wind.dir - 90) * Math.PI / 180) * wind.speed * state.scale,
          life: Math.random() * 0.5 + 0.5
        });
      }
    }
    
    function speedToColor(speed) {
      if (speed >= 10) return '#ff4444';
      if (speed >= 5) return '#ff8844';
      return '#4da8da';
    }
    
    function drawVisualization(canvas, ctx) {
      const w = canvas.width;
      const h = canvas.height;
      
      // Clear
      ctx.fillStyle = '#0a0e27';
      ctx.fillRect(0, 0, w, h);
      
      // Draw grid background
      ctx.strokeStyle = '#1e3a5f';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 5; i++) {
        const y = (h / 5) * i;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }
      
      // Get wind data
      const wind = getWindAtLatitude(state.latitude, state.season);
      const color = speedToColor(wind.speed);
      
      // Draw jet stream curves at high latitudes
      if (state.latitude >= 30) {
        ctx.strokeStyle = 'rgba(0, 217, 255, 0.3)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        const jetY = h * 0.25;
        ctx.moveTo(0, jetY);
        for (let x = 0; x < w; x += 10) {
          const wave = Math.sin(x / 50 + Date.now() / 3000) * 20;
          ctx.lineTo(x, jetY + wave);
        }
        ctx.stroke();
      }
      
      // Update and draw particles
      state.particles = state.particles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.005;
        
        if (p.x < 0 || p.x > w || p.y < 0 || p.y > h) {
          p.x = Math.random() * w;
          p.y = Math.random() * h;
          p.life = 1;
        }
        
        return p.life > 0;
      });
      
      // Respawn lost particles
      while (state.particles.length < 50) {
        state.particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: Math.cos((wind.dir - 90) * Math.PI / 180) * wind.speed * state.scale,
          vy: Math.sin((wind.dir - 90) * Math.PI / 180) * wind.speed * state.scale,
          life: 1
        });
      }
      
      // Draw particles with glow
      state.particles.forEach(p => {
        ctx.fillStyle = color;
        ctx.globalAlpha = p.life * 0.6;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      
      // Draw arrow showing dominant wind direction
      const arrowX = w * 0.5;
      const arrowY = h * 0.5;
      const arrowLen = 60;
      const angle = (wind.dir - 90) * Math.PI / 180;
      
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(arrowX, arrowY);
      ctx.lineTo(arrowX + Math.cos(angle) * arrowLen, arrowY + Math.sin(angle) * arrowLen);
      ctx.stroke();
      
      // Arrow head
      const headlen = 15;
      ctx.beginPath();
      ctx.moveTo(arrowX + Math.cos(angle) * arrowLen, arrowY + Math.sin(angle) * arrowLen);
      ctx.lineTo(arrowX + Math.cos(angle - Math.PI / 6) * headlen + Math.cos(angle) * arrowLen, arrowY + Math.sin(angle - Math.PI / 6) * headlen + Math.sin(angle) * arrowLen);
      ctx.moveTo(arrowX + Math.cos(angle) * arrowLen, arrowY + Math.sin(angle) * arrowLen);
      ctx.lineTo(arrowX + Math.cos(angle + Math.PI / 6) * headlen + Math.cos(angle) * arrowLen, arrowY + Math.sin(angle + Math.PI / 6) * headlen + Math.sin(angle) * arrowLen);
      ctx.stroke();
    }
    
    function drawWindRose(canvas, ctx) {
      const w = canvas.width;
      const h = canvas.height;
      const centerX = w / 2;
      const centerY = h / 2;
      const radius = Math.min(w, h) / 2 - 20;
      
      ctx.fillStyle = '#0f1835';
      ctx.fillRect(0, 0, w, h);
      
      // Draw compass rose
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1;
      
      for (let i = 0; i < 16; i++) {
        const angle = (i * 22.5 - 90) * Math.PI / 180;
        const isCardinal = i % 4 === 0;
        const len = isCardinal ? radius : radius * 0.8;
        
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * len, centerY + Math.sin(angle) * len);
        ctx.lineWidth = isCardinal ? 1.5 : 1;
        ctx.stroke();
      }
      
      // Draw wind direction indicator
      const wind = getWindAtLatitude(state.latitude, state.season);
      const windAngle = (wind.dir - 90) * Math.PI / 180;
      const arrowRadius = radius * 0.6;
      
      ctx.fillStyle = speedToColor(wind.speed);
      ctx.beginPath();
      ctx.arc(centerX + Math.cos(windAngle) * arrowRadius, centerY + Math.sin(windAngle) * arrowRadius, 8, 0, Math.PI * 2);
      ctx.fill();
      
      // Cardinal directions
      ctx.fillStyle = '#7dd3fc';
      ctx.font = 'bold 12px Space Mono';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      const dirs = ['N', 'E', 'S', 'W'];
      dirs.forEach((dir, i) => {
        const angle = (i * 90 - 90) * Math.PI / 180;
        ctx.fillText(dir, centerX + Math.cos(angle) * (radius + 15), centerY + Math.sin(angle) * (radius + 15));
      });
    }
    
    // Setup canvases
    const canvas = document.getElementById('canvas');
    const windRoseCanvas = document.getElementById('windRose');
    const ctx = canvas.getContext('2d');
    const roseCtx = windRoseCanvas.getContext('2d');
    
    function resizeCanvases() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      windRoseCanvas.width = windRoseCanvas.offsetWidth;
      windRoseCanvas.height = windRoseCanvas.offsetHeight;
      initParticles(canvas);
    }
    
    resizeCanvases();
    window.addEventListener('resize', resizeCanvases);
    
    // Event listeners
    document.getElementById('latitudeSlider').addEventListener('input', (e) => {
      state.latitude = parseInt(e.target.value);
      updateStats();
      initParticles(canvas);
    });
    
    document.getElementById('scaleSlider').addEventListener('input', (e) => {
      state.scale = parseFloat(e.target.value);
      updateStats();
      initParticles(canvas);
    });
    
    document.querySelectorAll('.season-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        state.season = e.target.dataset.season;
        updateStats();
        initParticles(canvas);
      });
    });
    
    // Animation loop
    function animate() {
      drawVisualization(canvas, ctx);
      drawWindRose(windRoseCanvas, roseCtx);
      requestAnimationFrame(animate);
    }
    
    updateStats();
    animate();
  </script>
</body>
</html>
