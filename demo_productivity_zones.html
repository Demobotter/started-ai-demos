<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Zones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f3460 0%, #1a1f3a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-align: center;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .subtitle {
            font-size: 1rem;
            color: #00d9ff;
            margin-bottom: 5px;
        }
        .current-utc {
            font-size: 0.9rem;
            color: #7db3d9;
        }
        .zones-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .zone-card {
            padding: 25px;
            border-radius: 12px;
            border-left: 6px solid;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .zone-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            opacity: 0.05;
            z-index: 1;
            pointer-events: none;
        }
        .zone-card > * {
            position: relative;
            z-index: 2;
        }
        .zone-peak {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(34, 197, 94, 0.05));
            border-left-color: #22c55e;
        }
        .zone-lunch {
            background: linear-gradient(135deg, rgba(234, 179, 8, 0.15), rgba(234, 179, 8, 0.05));
            border-left-color: #eab308;
        }
        .zone-offhours {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(239, 68, 68, 0.05));
            border-left-color: #ef4444;
        }
        .zone-name {
            font-family: 'Syne', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .zone-time {
            font-size: 2.2rem;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            margin: 15px 0;
            letter-spacing: 2px;
        }
        .zone-status {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 10px 0;
        }
        .status-peak {
            color: #22c55e;
        }
        .status-lunch {
            color: #eab308;
        }
        .status-offhours {
            color: #ef4444;
        }
        .zone-availability {
            font-size: 0.75rem;
            color: #b3d9ff;
            margin-top: 10px;
            line-height: 1.5;
        }
        .availability-good {
            color: #22c55e;
        }
        .availability-moderate {
            color: #eab308;
        }
        .availability-poor {
            color: #ef4444;
        }
        .legend {
            background: rgba(15, 52, 96, 0.6);
            border: 1px solid #00d9ff;
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
            backdrop-filter: blur(10px);
        }
        .legend h3 {
            font-family: 'Syne', sans-serif;
            color: #00d9ff;
            margin-bottom: 15px;
            font-size: 1rem;
        }
        .legend-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .legend-item {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .legend-color {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .legend-peak {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.3), rgba(34, 197, 94, 0.1));
            border: 2px solid #22c55e;
        }
        .legend-lunch {
            background: linear-gradient(135deg, rgba(234, 179, 8, 0.3), rgba(234, 179, 8, 0.1));
            border: 2px solid #eab308;
        }
        .legend-offhours {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.3), rgba(239, 68, 68, 0.1));
            border: 2px solid #ef4444;
        }
        .legend-text {
            font-size: 0.9rem;
            color: #b3d9ff;
        }
        .refresh-info {
            text-align: center;
            margin-top: 20px;
            font-size: 0.75rem;
            color: #7db3d9;
        }
        .update-countdown {
            font-size: 0.9rem;
            color: #00d9ff;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 Productivity Zones</h1>
            <div class="subtitle">Live work hours across global hubs</div>
            <div class="current-utc" id="utcTime"></div>
        </div>

        <div class="zones-grid" id="zonesGrid">
            <!-- Generated by JavaScript -->
        </div>

        <div class="legend">
            <h3>Status Legend</h3>
            <div class="legend-items">
                <div class="legend-item">
                    <div class="legend-color legend-peak"></div>
                    <div class="legend-text"><strong>Peak Hours</strong> (9 AM – 5 PM) — Best availability</div>
                </div>
                <div class="legend-item">
                    <div class="legend-color legend-lunch"></div>
                    <div class="legend-text"><strong>Lunch/Evening</strong> (12–1 PM, 5–6 PM) — Lower availability</div>
                </div>
                <div class="legend-item">
                    <div class="legend-color legend-offhours"></div>
                    <div class="legend-text"><strong>Off-Hours</strong> (6 PM – 9 AM) — Limited availability</div>
                </div>
            </div>
        </div>

        <div class="refresh-info">
            Updates every 10 seconds
            <div class="update-countdown" id="updateCountdown">--</div>
        </div>
    </div>

    <script>
        const ZONES = [
            { name: 'New York', timezone: 'America/New_York', utcOffset: -5 },
            { name: 'London', timezone: 'Europe/London', utcOffset: 0 },
            { name: 'Tokyo', timezone: 'Asia/Tokyo', utcOffset: 9 },
            { name: 'Sydney', timezone: 'Australia/Sydney', utcOffset: 10 },
            { name: 'Singapore', timezone: 'Asia/Singapore', utcOffset: 8 },
            { name: 'São Paulo', timezone: 'America/Sao_Paulo', utcOffset: -3 }
        ];

        let secondsUntilRefresh = 10;
        let countdownInterval = null;

        function updateUTC() {
            const now = new Date();
            const utcHours = now.getUTCHours().toString().padStart(2, '0');
            const utcMins = now.getUTCMinutes().toString().padStart(2, '0');
            document.getElementById('utcTime').textContent = `UTC: ${utcHours}:${utcMins}`;
        }

        function getTimeStatus(hour) {
            // 9am-12pm: peak
            // 12pm-1pm: lunch
            // 1pm-5pm: peak
            // 5pm-6pm: evening wind-down
            // 6pm-9am: off-hours
            if (hour >= 9 && hour < 12) return { status: 'peak', label: 'Peak Hours', availability: 'Excellent availability' };
            if (hour >= 12 && hour < 13) return { status: 'lunch', label: 'Lunch Break', availability: 'Lower availability' };
            if (hour >= 13 && hour < 17) return { status: 'peak', label: 'Peak Hours', availability: 'Excellent availability' };
            if (hour >= 17 && hour < 18) return { status: 'lunch', label: 'Evening', availability: 'Lower availability' };
            return { status: 'offhours', label: 'Off-Hours', availability: 'Limited availability' };
        }

        function renderZones() {
            const grid = document.getElementById('zonesGrid');
            const now = new Date();

            grid.innerHTML = ZONES.map(zone => {
                // Use Intl API to get correct time in each timezone
                const formatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: zone.timezone,
                    hour12: true,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                const timeStr = formatter.format(now);

                // Also get hour (24h format) for status check
                const hourFormatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: zone.timezone,
                    hour: '2-digit',
                    hour12: false
                });
                const hour = parseInt(hourFormatter.format(now));

                const timeStatus = getTimeStatus(hour);
                const statusClass = timeStatus.status;
                const availabilityClass = statusClass === 'peak' ? 'availability-good' : 
                                        statusClass === 'lunch' ? 'availability-moderate' : 
                                        'availability-poor';

                return `
                    <div class="zone-card zone-${statusClass}">
                        <div class="zone-name">${zone.name}</div>
                        <div class="zone-time">${timeStr}</div>
                        <div class="zone-status status-${statusClass}">${timeStatus.label}</div>
                        <div class="zone-availability ${availabilityClass}">${timeStatus.availability}</div>
                    </div>
                `;
            }).join('');
        }

        function startCountdown() {
            if (countdownInterval) clearInterval(countdownInterval);
            secondsUntilRefresh = 10;
            countdownInterval = setInterval(() => {
                secondsUntilRefresh--;
                document.getElementById('updateCountdown').textContent = `Updating in ${secondsUntilRefresh}s`;
                if (secondsUntilRefresh <= 0) {
                    renderZones();
                    updateUTC();
                    startCountdown();
                }
            }, 1000);
        }

        // Initialize
        setInterval(() => {
            updateUTC();
        }, 1000);
        updateUTC();
        renderZones();
        startCountdown();
    </script>
</body>
</html>
