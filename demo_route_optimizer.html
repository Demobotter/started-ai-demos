<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route Optimizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a1428 0%, #1a2332 100%);
      color: #e8f0f8;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(10, 20, 40, 0.8);
      border-radius: 12px;
      border: 1px solid rgba(77, 168, 218, 0.3);
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .header {
      background: linear-gradient(90deg, #0a1428 0%, #1a3a5c 100%);
      padding: 24px;
      border-bottom: 2px solid #4da8da;
      text-align: center;
    }
    .header h1 {
      font-family: 'Fraunces', serif;
      font-size: 2.2em;
      color: #4da8da;
      margin-bottom: 4px;
    }
    .header p {
      color: #a0c4e8;
      font-size: 0.95em;
    }
    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding: 24px;
    }
    @media (max-width: 800px) {
      .content { grid-template-columns: 1fr; }
    }
    .panel {
      background: rgba(26, 51, 76, 0.6);
      border: 1px solid rgba(77, 168, 218, 0.2);
      border-radius: 8px;
      padding: 20px;
    }
    .panel h2 {
      font-family: 'Fraunces', serif;
      font-size: 1.2em;
      color: #7dd3fc;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(77, 168, 218, 0.3);
      padding-bottom: 8px;
    }
    .control-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 0.85em;
      color: #a0c4e8;
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select {
      width: 100%;
      padding: 10px;
      background: rgba(15, 30, 50, 0.9);
      color: #e8f0f8;
      border: 1px solid #4da8da;
      border-radius: 4px;
      font-size: 0.95em;
      cursor: pointer;
    }
    select:focus {
      outline: none;
      border-color: #7dd3fc;
      box-shadow: 0 0 8px rgba(77, 168, 218, 0.3);
    }
    .metric-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .metric-radio {
      flex: 1;
      min-width: 100px;
    }
    .metric-radio input[type="radio"] {
      display: none;
    }
    .metric-radio label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(15, 30, 50, 0.7);
      border: 1px solid rgba(77, 168, 218, 0.3);
      border-radius: 4px;
      cursor: pointer;
      text-transform: none;
      font-size: 0.85em;
      margin-bottom: 0;
      transition: all 0.2s;
    }
    .metric-radio label:hover {
      border-color: #4da8da;
      background: rgba(77, 168, 218, 0.1);
    }
    .metric-radio input[type="radio"]:checked + label {
      background: rgba(77, 168, 218, 0.3);
      border-color: #4da8da;
      color: #7dd3fc;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #4da8da 0%, #3d8cb8 100%);
      color: #0a1428;
      border: none;
      border-radius: 4px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn:hover {
      background: linear-gradient(135deg, #7dd3fc 0%, #4da8da 100%);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(77, 168, 218, 0.3);
    }
    .btn:active {
      transform: translateY(0);
    }
    .results {
      background: rgba(26, 51, 76, 0.6);
      border: 1px solid rgba(77, 168, 218, 0.2);
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
    }
    .results.hidden { display: none; }
    .route-step {
      background: rgba(15, 30, 50, 0.7);
      border-left: 3px solid #4da8da;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .route-step .city-name {
      font-weight: 600;
      color: #7dd3fc;
    }
    .route-step .details {
      color: #a0c4e8;
      font-size: 0.85em;
      margin-top: 4px;
    }
    .summary {
      background: rgba(77, 168, 218, 0.1);
      border: 1px solid rgba(77, 168, 218, 0.3);
      padding: 16px;
      border-radius: 4px;
      margin-bottom: 16px;
    }
    .summary-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.95em;
    }
    .summary-item:last-child { margin-bottom: 0; }
    .summary-label {
      color: #a0c4e8;
      text-transform: uppercase;
      font-size: 0.8em;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .summary-value {
      color: #7dd3fc;
      font-weight: 600;
      font-size: 1.1em;
    }
    .error {
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(220, 38, 38, 0.5);
      color: #fca5a5;
      padding: 12px;
      border-radius: 4px;
      margin-top: 12px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🌍 Route Optimizer</h1>
      <p>Find the fastest, cheapest, or shortest path between cities</p>
    </div>
    
    <div class="content">
      <div class="panel">
        <h2>Plan Your Route</h2>
        
        <div class="control-group">
          <label for="startCity">Start City</label>
          <select id="startCity">
            <option value="">Select a city...</option>
          </select>
        </div>
        
        <div class="control-group">
          <label for="endCity">End City</label>
          <select id="endCity">
            <option value="">Select a city...</option>
          </select>
        </div>
        
        <div class="control-group">
          <label>Optimization Metric</label>
          <div class="metric-group">
            <div class="metric-radio">
              <input type="radio" id="metric-distance" name="metric" value="distance" checked>
              <label for="metric-distance">📏 Distance</label>
            </div>
            <div class="metric-radio">
              <input type="radio" id="metric-time" name="metric" value="time">
              <label for="metric-time">⏱️ Time</label>
            </div>
            <div class="metric-radio">
              <input type="radio" id="metric-cost" name="metric" value="cost">
              <label for="metric-cost">💰 Cost</label>
            </div>
          </div>
        </div>
        
        <button class="btn" onclick="computeRoute()">Find Route</button>
      </div>
      
      <div class="panel results hidden" id="resultsPanel">
        <h2>Optimal Route</h2>
        <div id="resultContent"></div>
      </div>
    </div>
  </div>

  <script>
    // City database with real coordinates
    const cities = {
      'New York': { lat: 40.7128, lon: -74.0060, code: 'NYC' },
      'Los Angeles': { lat: 34.0522, lon: -118.2437, code: 'LAX' },
      'London': { lat: 51.5074, lon: -0.1278, code: 'LHR' },
      'Tokyo': { lat: 35.6762, lon: 139.6503, code: 'NRT' },
      'Sydney': { lat: -33.8688, lon: 151.2093, code: 'SYD' },
      'Paris': { lat: 48.8566, lon: 2.3522, code: 'CDG' },
      'Dubai': { lat: 25.2048, lon: 55.2708, code: 'DXB' },
      'Singapore': { lat: 1.3521, lon: 103.8198, code: 'SIN' },
      'Hong Kong': { lat: 22.3193, lon: 114.1694, code: 'HKG' },
      'Bangkok': { lat: 13.7563, lon: 100.5018, code: 'BKK' },
      'São Paulo': { lat: -23.5505, lon: -46.6333, code: 'GRU' },
      'Moscow': { lat: 55.7558, lon: 37.6173, code: 'SVO' },
      'Mumbai': { lat: 19.0760, lon: 72.8777, code: 'BOM' },
      'Toronto': { lat: 43.6532, lon: -79.3832, code: 'YYZ' },
      'Mexico City': { lat: 19.4326, lon: -99.1332, code: 'MEX' },
      'Istanbul': { lat: 41.0082, lon: 28.9784, code: 'IST' },
      'Seoul': { lat: 37.5665, lon: 126.9780, code: 'ICN' },
      'Amsterdam': { lat: 52.3676, lon: 4.9041, code: 'AMS' },
      'Barcelona': { lat: 41.3851, lon: 2.1734, code: 'BCN' },
      'Berlin': { lat: 52.5200, lon: 13.4050, code: 'BER' },
      'Rome': { lat: 41.9028, lon: 12.4964, code: 'FCO' },
      'Madrid': { lat: 40.4168, lon: -3.7038, code: 'MAD' },
      'Melbourne': { lat: -37.8136, lon: 144.9631, code: 'MEL' },
      'Auckland': { lat: -37.0882, lon: 174.8860, code: 'AKL' },
      'Johannesburg': { lat: -26.1425, lon: 28.2453, code: 'JNB' },
      'Cairo': { lat: 30.0444, lon: 31.2357, code: 'CAI' },
      'Vancouver': { lat: 49.2827, lon: -123.1207, code: 'YVR' },
      'Miami': { lat: 25.7617, lon: -80.1918, code: 'MIA' },
      'Chicago': { lat: 41.8781, lon: -87.6298, code: 'ORD' },
      'Frankfurt': { lat: 50.0379, lon: 8.5622, code: 'FRA' },
      'Geneva': { lat: 46.2044, lon: 6.1432, code: 'GVA' },
      'Zurich': { lat: 47.3769, lon: 8.5472, code: 'ZRH' }
    };

    // Calculate great-circle distance in km
    function distance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    // Build adjacency with edges for all city pairs
    function buildGraph() {
      const graph = {};
      const cityList = Object.keys(cities);
      
      for (const city of cityList) {
        graph[city] = [];
      }

      for (let i = 0; i < cityList.length; i++) {
        for (let j = i + 1; j < cityList.length; j++) {
          const c1 = cityList[i];
          const c2 = cityList[j];
          const d = distance(cities[c1].lat, cities[c1].lon,
                            cities[c2].lat, cities[c2].lon);
          
          // Compute time and cost
          const flightTime = d / 900 + 1; // hours (900 km/h cruise + 1h overhead)
          const flightCost = Math.round(d * 0.1 + 100); // rough cost model
          
          graph[c1].push({ to: c2, distance: d, time: flightTime, cost: flightCost });
          graph[c2].push({ to: c1, distance: d, time: flightTime, cost: flightCost });
        }
      }
      return graph;
    }

    // Dijkstra's algorithm
    function dijkstra(graph, start, end, metric) {
      const dist = {};
      const prev = {};
      const visited = new Set();
      
      for (const city of Object.keys(graph)) {
        dist[city] = Infinity;
        prev[city] = null;
      }
      dist[start] = 0;

      while (visited.size < Object.keys(graph).length) {
        let minCity = null;
        let minDist = Infinity;
        
        for (const city of Object.keys(graph)) {
          if (!visited.has(city) && dist[city] < minDist) {
            minCity = city;
            minDist = dist[city];
          }
        }
        
        if (minCity === null || minDist === Infinity) break;
        visited.add(minCity);
        
        for (const edge of graph[minCity]) {
          const edgeWeight = edge[metric];
          const alt = dist[minCity] + edgeWeight;
          
          if (alt < dist[edge.to]) {
            dist[edge.to] = alt;
            prev[edge.to] = minCity;
          }
        }
      }

      // Reconstruct path
      const path = [];
      let current = end;
      while (current !== null) {
        path.unshift(current);
        current = prev[current];
      }

      return { path, totalCost: dist[end], graph };
    }

    // Initialize city selects
    function initializeCitySelects() {
      const cityList = Object.keys(cities).sort();
      const startSel = document.getElementById('startCity');
      const endSel = document.getElementById('endCity');
      
      for (const city of cityList) {
        startSel.innerHTML += `<option value="${city}">${city}</option>`;
        endSel.innerHTML += `<option value="${city}">${city}</option>`;
      }
    }

    // Compute and display route
    function computeRoute() {
      const startCity = document.getElementById('startCity').value;
      const endCity = document.getElementById('endCity').value;
      const metric = document.querySelector('input[name="metric"]:checked').value;
      const resultsPanel = document.getElementById('resultsPanel');
      const resultContent = document.getElementById('resultContent');

      if (!startCity || !endCity) {
        resultContent.innerHTML = '<div class="error">Please select both start and end cities</div>';
        resultsPanel.classList.remove('hidden');
        return;
      }

      if (startCity === endCity) {
        resultContent.innerHTML = '<div class="error">Start and end cities must be different</div>';
        resultsPanel.classList.remove('hidden');
        return;
      }

      const graph = buildGraph();
      const result = dijkstra(graph, startCity, endCity, metric);

      if (result.path[0] !== startCity || result.path[result.path.length - 1] !== endCity) {
        resultContent.innerHTML = '<div class="error">No route found</div>';
        resultsPanel.classList.remove('hidden');
        return;
      }

      // Format results
      let metricLabel = metric === 'distance' ? 'km' : (metric === 'time' ? 'hours' : '$');
      let metricValue = result.totalCost;
      if (metric === 'distance') {
        metricValue = Math.round(metricValue);
      } else if (metric === 'time') {
        metricValue = metricValue.toFixed(1);
      }

      let html = `<div class="summary">
        <div class="summary-item">
          <span class="summary-label">Route</span>
          <span class="summary-value">${result.path.join(' → ')}</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">${metric.toUpperCase()}</span>
          <span class="summary-value">${metricValue} ${metricLabel}</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Stops</span>
          <span class="summary-value">${result.path.length - 1}</span>
        </div>
      </div>`;

      html += '<div style="margin-bottom: 12px;"><strong style="color: #7dd3fc;">Route Steps:</strong></div>';
      for (let i = 0; i < result.path.length - 1; i++) {
        const from = result.path[i];
        const to = result.path[i + 1];
        const edges = result.graph[from].find(e => e.to === to);
        
        let edgeInfo = '';
        if (metric === 'distance') {
          edgeInfo = `${Math.round(edges.distance)} km`;
        } else if (metric === 'time') {
          edgeInfo = `${edges.time.toFixed(1)} hours`;
        } else {
          edgeInfo = `$${edges.cost}`;
        }

        html += `<div class="route-step">
          <div class="city-name">${from} → ${to}</div>
          <div class="details">${edgeInfo}</div>
        </div>`;
      }

      resultContent.innerHTML = html;
      resultsPanel.classList.remove('hidden');
    }

    initializeCitySelects();
  </script>
</body>
</html>
