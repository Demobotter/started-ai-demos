<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Crop Yield</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #5a4a3a 0%, #3a2a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 30px;
            align-items: start;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            color: #d4a574;
            margin-bottom: 20px;
            font-size: 2.5em;
            grid-column: 1 / -1;
        }
        canvas {
            background: linear-gradient(135deg, #2a1a0a 0%, #1a0a00 100%);
            border: 3px solid #d4a574;
            border-radius: 12px;
            display: block;
            width: 100%;
            height: auto;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid #2d9d5f;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .control-group label {
            font-size: 12px;
            color: #9dd3c0;
            font-weight: bold;
            text-transform: uppercase;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #333;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #d4a574;
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #d4a574;
            cursor: pointer;
            border: none;
        }
        .value-display {
            font-size: 11px;
            color: #4da8da;
            text-align: right;
        }
        button {
            background: #2d9d5f;
            color: #fff;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-family: 'Space Mono', monospace;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        button:hover {
            background: #4da8da;
            transform: scale(1.05);
        }
        button:active {
            background: #ffff99;
            color: #000;
        }
        .stats-box {
            background: rgba(45, 157, 95, 0.1);
            border-left: 5px solid #2d9d5f;
            padding: 12px;
            border-radius: 6px;
            font-size: 11px;
        }
        .stats-box .stat-label {
            color: #9dd3c0;
            text-transform: uppercase;
            font-size: 9px;
            margin-bottom: 3px;
        }
        .stats-box .stat-value {
            color: #4da8da;
            font-weight: bold;
            font-size: 14px;
        }
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            h1 { font-size: 1.8em; }
            .controls {
                order: 3;
            }
            canvas {
                order: 2;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌾 Quantum Crop Yield</h1>
        
        <canvas id="canvas"></canvas>
        
        <div class="controls">
            <div class="control-group">
                <label>Rainfall (mm/yr)</label>
                <input type="range" id="rainfall" min="50" max="400" value="250">
                <div class="value-display" id="rainfallValue">250</div>
            </div>
            
            <div class="control-group">
                <label>Temperature (°C)</label>
                <input type="range" id="temperature" min="10" max="30" value="20">
                <div class="value-display" id="tempValue">20</div>
            </div>
            
            <div class="control-group">
                <label>Mass / Uncertainty</label>
                <input type="range" id="mass" min="0.5" max="3" step="0.1" value="1.5">
                <div class="value-display" id="massValue">1.5</div>
            </div>
            
            <div class="control-group">
                <label>Observation Strength</label>
                <input type="range" id="light" min="0.5" max="3" step="0.1" value="1.5">
                <div class="value-display" id="lightValue">1.5</div>
            </div>
            
            <button id="plantBtn">Plant Crop</button>
            
            <div class="stats-box">
                <div class="stat-label">Expected Yield</div>
                <div class="stat-value" id="expectedYield">6.2</div>
                <div style="color: #666; font-size: 9px;">tonnes/hectare</div>
            </div>
            
            <div class="stats-box">
                <div class="stat-label">Variance (σ)</div>
                <div class="stat-value" id="variance">0.8</div>
            </div>
            
            <div class="stats-box">
                <div class="stat-label">Confidence (68%)</div>
                <div class="stat-value" id="confidence">5.4–6.9</div>
            </div>
            
            <div class="stats-box">
                <div class="stat-label">Actual Harvest</div>
                <div class="stat-value" id="actualYield">—</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const rainfallInput = document.getElementById('rainfall');
        const tempInput = document.getElementById('temperature');
        const massInput = document.getElementById('mass');
        const lightInput = document.getElementById('light');
        const plantBtn = document.getElementById('plantBtn');
        
        let state = {
            rainfall: 250,
            temperature: 20,
            mass: 1.5,
            light: 1.5,
            particles: [],
            collapsing: false,
            collapseProgress: 0,
            finalYield: null,
            expectedYield: 6.2,
            variance: 0.8
        };
        
        // Box-Muller Gaussian sampler
        function gaussianRandom(mean = 0, stddev = 1) {
            const u1 = Math.random();
            const u2 = Math.random();
            const z0 = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
            return mean + z0 * stddev;
        }
        
        // Calculate expected yield based on environment
        function calculateExpectedYield(rainfall, temp) {
            const tempFactor = Math.exp(-Math.pow((temp - 20) / 6, 2));
            const rainfallFactor = Math.exp(-Math.pow((rainfall - 250) / 120, 2));
            const baseYield = 8.5;
            return baseYield * tempFactor * rainfallFactor;
        }
        
        // Calculate variance based on environmental uncertainty
        function calculateVariance(mass, rainfall, temp) {
            const baseVar = 0.6;
            const envVar = Math.abs(20 - temp) * 0.05 + Math.abs(250 - rainfall) * 0.002;
            return (baseVar + envVar) * mass;
        }
        
        // Initialize particles in probability cloud
        function initParticles() {
            state.particles = [];
            const particleCount = Math.floor(150 * state.mass);
            const cloudX = canvas.width / 2;
            const cloudY = canvas.height / 2;
            const spreadX = 80 * state.mass;
            const spreadY = 60 * state.mass;
            
            for (let i = 0; i < particleCount; i++) {
                state.particles.push({
                    x: cloudX + gaussianRandom(0, spreadX),
                    y: cloudY + gaussianRandom(0, spreadY),
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    originalX: 0,
                    originalY: 0
                });
            }
        }
        
        // Update state from inputs
        function updateState() {
            state.rainfall = parseFloat(rainfallInput.value);
            state.temperature = parseFloat(tempInput.value);
            state.mass = parseFloat(massInput.value);
            state.light = parseFloat(lightInput.value);
            
            state.expectedYield = calculateExpectedYield(state.rainfall, state.temperature);
            state.variance = calculateVariance(state.mass, state.rainfall, state.temperature);
            
            document.getElementById('rainfallValue').textContent = Math.round(state.rainfall);
            document.getElementById('tempValue').textContent = Math.round(state.temperature);
            document.getElementById('massValue').textContent = state.mass.toFixed(1);
            document.getElementById('lightValue').textContent = state.light.toFixed(1);
            
            document.getElementById('expectedYield').textContent = state.expectedYield.toFixed(1);
            document.getElementById('variance').textContent = state.variance.toFixed(1);
            
            const lower = (state.expectedYield - state.variance).toFixed(1);
            const upper = (state.expectedYield + state.variance).toFixed(1);
            document.getElementById('confidence').textContent = lower + '–' + upper;
            
            initParticles();
        }
        
        function plantCrop() {
            if (state.collapsing) return;
            
            state.collapsing = true;
            state.collapseProgress = 0;
            state.finalYield = gaussianRandom(state.expectedYield, state.variance);
            state.finalYield = Math.max(2, Math.min(10, state.finalYield));
            
            // Store particle initial positions for collapse animation
            state.particles.forEach((p, i) => {
                p.originalX = p.x;
                p.originalY = p.y;
            });
            
            document.getElementById('actualYield').textContent = state.finalYield.toFixed(1);
            document.getElementById('actualYield').style.color = '#ffff99';
        }
        
        function drawCrop(x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            
            // Soil
            ctx.fillStyle = '#3a2a1a';
            ctx.beginPath();
            ctx.ellipse(0, scale * 0.6, scale * 0.5, scale * 0.2, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Stalk
            const stalkHeight = scale * (state.expectedYield / 10);
            ctx.strokeStyle = '#8b7355';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(scale * 0.1, -stalkHeight * 0.5, 0, -stalkHeight);
            ctx.stroke();
            
            // Wheat head
            ctx.fillStyle = '#d4a574';
            ctx.beginPath();
            ctx.ellipse(0, -stalkHeight - scale * 0.15, scale * 0.12, scale * 0.2, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }
        
        function draw() {
            // Clear canvas
            ctx.fillStyle = 'rgba(26, 10, 0, 0.9)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // Draw probability heatmap background
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;
            
            for (let py = 0; py < canvas.height; py++) {
                for (let px = 0; px < canvas.width; px++) {
                    const dx = (px - centerX) / (80 * state.mass);
                    const dy = (py - centerY) / (60 * state.mass);
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    // Gaussian probability heatmap
                    const prob = Math.exp(-dist * dist / 2);
                    
                    const idx = (py * canvas.width + px) * 4;
                    
                    if (prob > 0.05) {
                        // Cool to hot: blue → purple → red
                        if (prob < 0.33) {
                            data[idx] = Math.floor(30 + prob * 3 * 225);
                            data[idx + 1] = Math.floor(50 + prob * 3 * 100);
                            data[idx + 2] = Math.floor(200);
                        } else if (prob < 0.66) {
                            data[idx] = Math.floor(150 + (prob - 0.33) * 3 * 105);
                            data[idx + 1] = Math.floor(50);
                            data[idx + 2] = Math.floor(200 - (prob - 0.33) * 3 * 100);
                        } else {
                            data[idx] = Math.floor(255);
                            data[idx + 1] = Math.floor(50 - (prob - 0.66) * 3 * 30);
                            data[idx + 2] = Math.floor(100 - (prob - 0.66) * 3 * 100);
                        }
                        data[idx + 3] = Math.floor(40 + prob * 100);
                    } else {
                        data[idx + 3] = 0;
                    }
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
            
            // Draw particles (uncertainty cloud)
            state.particles.forEach(p => {
                if (!state.collapsing) {
                    // Brownian motion
                    p.x += p.vx;
                    p.y += p.vy;
                    
                    const dx = (centerX - p.x) * 0.02;
                    const dy = (centerY - p.y) * 0.02;
                    p.vx = p.vx * 0.95 + dx + (Math.random() - 0.5) * 0.5;
                    p.vy = p.vy * 0.95 + dy + (Math.random() - 0.5) * 0.5;
                    
                    // Constrain to cloud
                    const dist = Math.sqrt((p.x - centerX) ** 2 + (p.y - centerY) ** 2);
                    const maxDist = 150 * state.mass;
                    if (dist > maxDist) {
                        const angle = Math.atan2(p.y - centerY, p.x - centerX);
                        p.x = centerX + Math.cos(angle) * (maxDist - 10);
                        p.y = centerY + Math.sin(angle) * (maxDist - 10);
                    }
                } else {
                    // Collapse towards center
                    const targetX = centerX;
                    const targetY = centerY;
                    p.x += (targetX - p.x) * 0.15;
                    p.y += (targetY - p.y) * 0.15;
                }
                
                ctx.fillStyle = 'rgba(157, 211, 192, 0.6)';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Draw contour lines (probability envelope)
            ctx.strokeStyle = 'rgba(77, 168, 218, 0.3)';
            ctx.lineWidth = 2;
            for (let r = 1; r <= 3; r++) {
                const radius = r * 40 * state.mass;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            // Draw crop in center
            drawCrop(centerX, centerY, 40 * (state.expectedYield / 10));
            
            // Collapse flash
            if (state.collapsing) {
                state.collapseProgress += 0.05;
                if (state.collapseProgress > 1) {
                    state.collapsing = false;
                }
                
                const flashAlpha = Math.sin(state.collapseProgress * Math.PI) * 0.3;
                ctx.fillStyle = `rgba(255, 255, 153, ${flashAlpha})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            requestAnimationFrame(draw);
        }
        
        // Event listeners
        rainfallInput.addEventListener('input', updateState);
        tempInput.addEventListener('input', updateState);
        massInput.addEventListener('input', updateState);
        lightInput.addEventListener('input', updateState);
        plantBtn.addEventListener('click', plantCrop);
        
        // Initialize
        function init() {
            canvas.width = Math.min(700, window.innerWidth - 360);
            canvas.height = canvas.width * 0.75;
            updateState();
            draw();
        }
        
        window.addEventListener('resize', () => {
            canvas.width = Math.min(700, window.innerWidth - 360);
            canvas.height = canvas.width * 0.75;
        });
        
        init();
    </script>
</body>
</html>
