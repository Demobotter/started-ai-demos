<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Activity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a2540 0%, #1a4d7a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-align: center;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .subtitle {
            font-size: 1rem;
            color: #7bb3d9;
            margin-bottom: 5px;
        }
        .current-time {
            font-size: 0.9rem;
            color: #b3d9ff;
        }
        .controls {
            background: rgba(10, 37, 64, 0.6);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid #2e7ab8;
        }
        .search-group {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        @media (max-width: 768px) {
            .search-group {
                grid-template-columns: 1fr;
            }
        }
        input[type="text"], input[type="number"], select {
            padding: 12px;
            border: 2px solid #2e7ab8;
            border-radius: 6px;
            background: rgba(46, 122, 184, 0.1);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
        }
        input[type="text"]::placeholder {
            color: #7bb3d9;
        }
        button {
            padding: 12px 24px;
            background: #00d4ff;
            color: #0a2540;
            border: none;
            border-radius: 6px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #66e6ff;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        .panel {
            background: rgba(10, 37, 64, 0.6);
            border: 1px solid #2e7ab8;
            border-radius: 8px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .panel h2 {
            font-family: 'Syne', sans-serif;
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        canvas {
            width: 100%;
            height: 400px;
            border: 1px solid #2e7ab8;
            border-radius: 6px;
            background: rgba(10, 37, 64, 0.4);
        }
        .aircraft-list {
            max-height: 600px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .aircraft-card {
            background: rgba(46, 122, 184, 0.15);
            border-left: 4px solid #00d4ff;
            padding: 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .aircraft-card:hover {
            background: rgba(46, 122, 184, 0.25);
            border-left-color: #66e6ff;
        }
        .aircraft-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .callsign {
            font-family: 'Syne', sans-sans-serif;
            font-weight: 700;
            color: #00d4ff;
            font-size: 1rem;
        }
        .altitude {
            color: #66e6ff;
            font-size: 0.85rem;
        }
        .aircraft-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.75rem;
            color: #7bb3d9;
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
        }
        .stats-panel {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        .stat-box {
            background: rgba(46, 122, 184, 0.15);
            border: 1px solid #2e7ab8;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }
        .stat-label {
            font-size: 0.8rem;
            color: #7bb3d9;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .stat-value {
            font-family: 'Syne', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #00d4ff;
        }
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #7bb3d9;
        }
        .error {
            background: rgba(211, 47, 47, 0.2);
            border: 1px solid #d32f2f;
            color: #ff7b7b;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
        }
        .refresh-info {
            font-size: 0.75rem;
            color: #2e7ab8;
            margin-top: 10px;
            text-align: right;
        }
        .scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #2e7ab8 rgba(10, 37, 64, 0.4);
        }
        .scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .scrollbar::-webkit-scrollbar-track {
            background: rgba(10, 37, 64, 0.4);
            border-radius: 3px;
        }
        .scrollbar::-webkit-scrollbar-thumb {
            background: #2e7ab8;
            border-radius: 3px;
        }
        .country {
            font-size: 0.7rem;
            color: #7bb3d9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✈️ Flight Activity</h1>
            <div class="subtitle">Real-time aircraft tracking from OpenSky Network</div>
            <div class="current-time" id="timeDisplay"></div>
        </div>

        <div class="controls">
            <div class="search-group">
                <input type="text" id="callsignFilter" placeholder="Filter by callsign (e.g., AAL, DAL)..." value="">
                <input type="number" id="altitudeMin" placeholder="Min altitude (ft)" value="0">
                <input type="number" id="altitudeMax" placeholder="Max altitude (ft)" value="40000">
                <button onclick="refreshData()">Refresh Now</button>
            </div>
        </div>

        <div class="main-grid">
            <!-- Left Panel: Map Canvas -->
            <div class="panel">
                <h2>Aircraft Positions (5km radius grid)</h2>
                <canvas id="mapCanvas"></canvas>
                <div class="refresh-info">Live data updates every 30s. Last update: <span id="lastUpdate">--:--</span></div>
            </div>

            <!-- Right Panel: Aircraft List + Stats -->
            <div>
                <div class="panel" style="margin-bottom: 20px;">
                    <h2>Statistics</h2>
                    <div class="stats-panel">
                        <div class="stat-box">
                            <div class="stat-label">Aircraft Detected</div>
                            <div class="stat-value" id="totalAircraft">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Avg Altitude</div>
                            <div class="stat-value" id="avgAltitude">--</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Avg Speed</div>
                            <div class="stat-value" id="avgSpeed">--</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Next Update In</div>
                            <div id="updateCountdown" style="font-size: 1rem; color: #00d4ff; margin-top: 5px;">--</div>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <h2>Nearby Aircraft</h2>
                    <div class="aircraft-list scrollbar" id="aircraftList">
                        <div class="loading">Loading aircraft data...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const LATITUDE = 40.6413;  // NYC area
        const LONGITUDE = -73.7781;
        const GRID_SIZE = 5;  // 5km grid cells

        let allAircraft = [];
        let filteredAircraft = [];
        let updateInterval = null;
        let countdownInterval = null;
        let secondsUntilRefresh = 30;

        function updateTime() {
            const now = new Date();
            document.getElementById('timeDisplay').textContent = now.toLocaleTimeString('en-US', { hour12: true });
        }

        async function refreshData() {
            try {
                document.getElementById('aircraftList').innerHTML = '<div class="loading">Fetching live aircraft...</div>';
                const response = await fetch('https://opensky-network.org/api/states/all');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                
                if (!data.states) throw new Error('No states in response');
                
                // Parse aircraft data: [icao24, callsign, origin_country, time_position, time_velocity, lon, lat, altitude, on_ground, velocity, true_track, vertical_rate, sensors, geo_altitude, squawk, spi, position_source, category]
                allAircraft = data.states
                    .filter(s => s[5] !== null && s[6] !== null && s[7] !== null)  // Has lon, lat, altitude
                    .map(s => ({
                        icao24: s[0],
                        callsign: (s[1] || '').trim() || s[0].toUpperCase(),
                        country: s[2] || 'Unknown',
                        longitude: s[5],
                        latitude: s[6],
                        altitude: s[7],
                        velocity: s[9] || 0,
                        track: s[10] || 0,
                        distance: haversineDistance(LATITUDE, LONGITUDE, s[6], s[5])
                    }))
                    .filter(a => a.distance <= 50)  // Within 50km
                    .sort((a, b) => a.distance - b.distance);

                filterAircraft();
                drawMap();
                updateStats();
                updateLastRefresh();
                secondsUntilRefresh = 30;
                startCountdown();
            } catch (err) {
                document.getElementById('aircraftList').innerHTML = `<div class="error">Error: ${err.message}</div>`;
                console.error('Fetch error:', err);
            }
        }

        function haversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;  // Earth radius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function filterAircraft() {
            const callsign = document.getElementById('callsignFilter').value.toUpperCase();
            const minAlt = parseInt(document.getElementById('altitudeMin').value) || 0;
            const maxAlt = parseInt(document.getElementById('altitudeMax').value) || 40000;

            filteredAircraft = allAircraft.filter(a => {
                const csMatch = !callsign || a.callsign.includes(callsign);
                const altMatch = a.altitude >= minAlt && a.altitude <= maxAlt;
                return csMatch && altMatch;
            });

            displayAircraft();
        }

        function displayAircraft() {
            const list = document.getElementById('aircraftList');
            if (filteredAircraft.length === 0) {
                list.innerHTML = '<div class="loading">No aircraft match filters</div>';
                return;
            }

            list.innerHTML = filteredAircraft.slice(0, 25).map(a => {
                const speedKnots = Math.round(a.velocity * 1.944);
                return `
                    <div class="aircraft-card">
                        <div class="aircraft-header">
                            <div>
                                <div class="callsign">${a.callsign}</div>
                                <div class="country">${a.country}</div>
                            </div>
                            <div class="altitude">${Math.round(a.altitude)} ft</div>
                        </div>
                        <div class="aircraft-details">
                            <div class="detail-item">
                                <span>Speed:</span>
                                <strong>${speedKnots} kts</strong>
                            </div>
                            <div class="detail-item">
                                <span>Track:</span>
                                <strong>${Math.round(a.track) || '--'}°</strong>
                            </div>
                            <div class="detail-item">
                                <span>Distance:</span>
                                <strong>${a.distance.toFixed(1)} km</strong>
                            </div>
                            <div class="detail-item">
                                <span>Position:</span>
                                <strong>${a.latitude.toFixed(3)}°, ${a.longitude.toFixed(3)}°</strong>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function drawMap() {
            const canvas = document.getElementById('mapCanvas');
            const ctx = canvas.getContext('2d');
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const scale = Math.min(canvas.width, canvas.height) / 20;  // Fit 20km view

            // Draw grid background
            ctx.fillStyle = 'rgba(10, 37, 64, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid lines (5km cells)
            ctx.strokeStyle = 'rgba(46, 122, 184, 0.3)';
            ctx.lineWidth = 1;
            for (let i = -10; i <= 10; i++) {
                ctx.beginPath();
                ctx.moveTo(centerX + i * GRID_SIZE * scale, 0);
                ctx.lineTo(centerX + i * GRID_SIZE * scale, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, centerY + i * GRID_SIZE * scale);
                ctx.lineTo(canvas.width, centerY + i * GRID_SIZE * scale);
                ctx.stroke();
            }

            // Draw center marker
            ctx.fillStyle = '#00d4ff';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 4, 0, Math.PI * 2);
            ctx.fill();

            // Draw aircraft
            filteredAircraft.forEach(a => {
                const dLat = a.latitude - LATITUDE;
                const dLon = a.longitude - LONGITUDE;
                const x = centerX + dLon * 111 * scale;
                const y = centerY - dLat * 111 * scale;

                // Altitude color (blue low, red high)
                const altPercent = Math.min(a.altitude / 40000, 1);
                const hue = (1 - altPercent) * 240;  // 240 blue to 0 red
                ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(a.track * Math.PI / 180);

                // Draw aircraft icon (triangle)
                ctx.beginPath();
                ctx.moveTo(0, -8);
                ctx.lineTo(-5, 6);
                ctx.lineTo(5, 6);
                ctx.closePath();
                ctx.fill();

                ctx.restore();

                // Draw altitude label
                ctx.fillStyle = '#7bb3d9';
                ctx.font = '10px Inter';
                ctx.textAlign = 'center';
                ctx.fillText(Math.round(a.altitude / 1000) + 'k', x, y + 18);
            });
        }

        function updateStats() {
            if (allAircraft.length === 0) {
                document.getElementById('totalAircraft').textContent = '0';
                document.getElementById('avgAltitude').textContent = '--';
                document.getElementById('avgSpeed').textContent = '--';
                return;
            }

            const avgAlt = Math.round(allAircraft.reduce((s, a) => s + a.altitude, 0) / allAircraft.length);
            const avgSpd = Math.round(allAircraft.reduce((s, a) => s + a.velocity * 1.944, 0) / allAircraft.length);

            document.getElementById('totalAircraft').textContent = allAircraft.length;
            document.getElementById('avgAltitude').textContent = avgAlt.toLocaleString() + ' ft';
            document.getElementById('avgSpeed').textContent = avgSpd + ' kts';
        }

        function updateLastRefresh() {
            const now = new Date();
            document.getElementById('lastUpdate').textContent = 
                now.getHours().toString().padStart(2, '0') + ':' + 
                now.getMinutes().toString().padStart(2, '0');
        }

        function startCountdown() {
            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                secondsUntilRefresh--;
                const mins = Math.floor(secondsUntilRefresh / 60);
                const secs = secondsUntilRefresh % 60;
                document.getElementById('updateCountdown').textContent = `${secs}s`;
                if (secondsUntilRefresh <= 0) {
                    refreshData();
                }
            }, 1000);
        }

        // Event listeners
        document.getElementById('callsignFilter').addEventListener('input', filterAircraft);
        document.getElementById('altitudeMin').addEventListener('change', filterAircraft);
        document.getElementById('altitudeMax').addEventListener('change', filterAircraft);

        // Initialize
        setInterval(updateTime, 1000);
        updateTime();
        refreshData();
    </script>
</body>
</html>
