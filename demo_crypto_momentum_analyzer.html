<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Momentum Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0d0e11 0%, #1a1f2e 100%);
      color: #e4e8f0;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 30px;
      padding: 25px;
      background: rgba(26, 31, 46, 0.8);
      border-radius: 12px;
      border-left: 5px solid #f7931a;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #f7931a;
      letter-spacing: -0.5px;
    }

    header .subtitle {
      color: #8fa3ba;
      font-size: 0.95rem;
    }

    header .meta {
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #566375;
    }

    .crypto-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .crypto-card {
      background: linear-gradient(135deg, rgba(26, 31, 46, 0.9), rgba(45, 50, 65, 0.9));
      border: 2px solid #2d3241;
      border-radius: 12px;
      padding: 20px;
      transition: all 0.3s;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .crypto-card:hover {
      border-color: #f7931a;
      background: linear-gradient(135deg, rgba(26, 31, 46, 1), rgba(45, 50, 65, 1));
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(247, 147, 26, 0.15);
    }

    .crypto-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .crypto-name {
      font-family: 'Syne', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: #f7931a;
    }

    .crypto-symbol {
      font-size: 0.85rem;
      color: #566375;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .price-section {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }

    .price {
      font-family: 'Courier New', monospace;
      font-size: 1.5rem;
      font-weight: 700;
      color: #e4e8f0;
    }

    .change-24h {
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(247, 147, 26, 0.1);
      border: 1px solid #f7931a;
    }

    .change-24h.positive {
      color: #0ecb81;
      border-color: #0ecb81;
      background: rgba(14, 203, 129, 0.1);
    }

    .change-24h.negative {
      color: #f5515f;
      border-color: #f5515f;
      background: rgba(245, 81, 95, 0.1);
    }

    .momentum-gauge {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .gauge-label {
      font-size: 0.8rem;
      color: #8fa3ba;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .gauge-bar {
      height: 24px;
      background: linear-gradient(90deg, rgba(245, 81, 95, 0.3), rgba(247, 147, 26, 0.3), rgba(14, 203, 129, 0.3));
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    .gauge-fill {
      height: 100%;
      background: linear-gradient(90deg, #f5515f, #f7931a, #0ecb81);
      width: 50%;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #0d0e11;
    }

    .momentum-score {
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #f7931a;
      text-align: center;
    }

    .market-stats {
      background: rgba(26, 31, 46, 0.8);
      border: 2px solid #f7931a;
      border-radius: 12px;
      padding: 20px;
      margin-top: 30px;
    }

    .market-stats h3 {
      font-family: 'Syne', sans-serif;
      color: #f7931a;
      margin-bottom: 16px;
      font-size: 1.1rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .stat-box {
      background: rgba(0, 0, 0, 0.3);
      border-left: 3px solid #f7931a;
      border-radius: 6px;
      padding: 12px 16px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #8fa3ba;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .stat-value {
      font-family: 'Courier New', monospace;
      font-size: 1.1rem;
      font-weight: 700;
      color: #f7931a;
    }

    .stat-value.positive {
      color: #0ecb81;
    }

    .stat-value.negative {
      color: #f5515f;
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #f7931a;
      font-style: italic;
    }

    .error {
      background: rgba(245, 81, 95, 0.15);
      border: 2px solid #f5515f;
      border-radius: 8px;
      padding: 15px;
      color: #ff9999;
      margin-bottom: 20px;
    }

    .timestamp {
      text-align: center;
      font-size: 0.85rem;
      color: #566375;
      margin-top: 20px;
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 1.6rem;
      }

      .crypto-grid {
        grid-template-columns: 1fr;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>₿ Crypto Momentum Analyzer</h1>
      <p class="subtitle">Live momentum scores for major cryptocurrencies</p>
      <div class="meta">
        <div>Real-time CoinGecko data</div>
        <div id="current-time">--:-- UTC</div>
      </div>
    </header>

    <div id="error-container"></div>

    <div id="main-content" style="display: none;">
      <div class="crypto-grid" id="crypto-grid"></div>

      <div class="market-stats">
        <h3>Market Overview</h3>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-label">Strongest</div>
            <div class="stat-value" id="stat-strongest">--</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Weakest</div>
            <div class="stat-value negative" id="stat-weakest">--</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Avg Momentum</div>
            <div class="stat-value" id="stat-avg">--</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Total Volume</div>
            <div class="stat-value" id="stat-volume">--</div>
          </div>
        </div>
      </div>

      <div class="timestamp">
        Last updated: <span id="last-updated">--:-- UTC</span> | Auto-refresh every 60s
      </div>
    </div>

    <div id="welcome">
      <div class="loading">Fetching live crypto data...</div>
    </div>
  </div>

  <script>
    const cryptoList = [
      { id: 'bitcoin', name: 'Bitcoin', symbol: 'BTC' },
      { id: 'ethereum', name: 'Ethereum', symbol: 'ETH' },
      { id: 'cardano', name: 'Cardano', symbol: 'ADA' },
      { id: 'solana', name: 'Solana', symbol: 'SOL' },
      { id: 'ripple', name: 'Ripple', symbol: 'XRP' },
      { id: 'polkadot', name: 'Polkadot', symbol: 'DOT' }
    ];

    let lastDataTime = null;

    // Update current time
    setInterval(() => {
      const now = new Date();
      const timeStr = now.toUTCString().split(' ')[4];
      document.getElementById('current-time').textContent = timeStr + ' UTC';
    }, 1000);

    async function fetchCryptoData() {
      try {
        document.getElementById('error-container').innerHTML = '';
        document.getElementById('welcome').innerHTML = '<div class="loading">Fetching live crypto data...</div>';

        // Fetch from CoinGecko (proven CORS-safe, no auth required)
        const cryptoIds = cryptoList.map(c => c.id).join(',');
        const url = `https://api.coingecko.com/api/v3/simple/price?ids=${cryptoIds}&vs_currencies=usd&include_24hr_change=true&include_market_cap=true`;

        const response = await fetch(url);
        if (!response.ok) throw new Error(`API returned ${response.status}`);

        const data = await response.json();

        // Process and analyze
        const cryptoData = cryptoList.map(crypto => {
          const prices = data[crypto.id] || {};
          const usd = prices.usd || 0;
          const change24h = prices.usd_24h_change || 0;
          const marketCap = prices.usd_market_cap || 0;

          // Momentum score (0-100): combines strength of 24h move + volatility
          const volatility = Math.abs(change24h);
          const direction = change24h >= 0 ? 1 : -1;
          const momentum = Math.max(0, Math.min(100, 50 + direction * (volatility / 2)));

          return {
            ...crypto,
            usd,
            change24h,
            marketCap,
            momentum: momentum.toFixed(1)
          };
        });

        // Sort by momentum (descending)
        cryptoData.sort((a, b) => parseFloat(b.momentum) - parseFloat(a.momentum));

        // Render cards
        const grid = document.getElementById('crypto-grid');
        grid.innerHTML = cryptoData.map(crypto => {
          const changeClass = crypto.change24h >= 0 ? 'positive' : 'negative';
          const changeSign = crypto.change24h >= 0 ? '+' : '';
          const momentumFill = (parseFloat(crypto.momentum) * 1.5).toFixed(0); // Scale for visual

          return `
            <div class="crypto-card">
              <div class="crypto-header">
                <div>
                  <div class="crypto-name">${crypto.name}</div>
                  <div class="crypto-symbol">${crypto.symbol}</div>
                </div>
                <div class="change-24h ${changeClass}">
                  ${changeSign}${crypto.change24h.toFixed(2)}%
                </div>
              </div>

              <div class="price-section">
                <div class="price">$${crypto.usd.toLocaleString('en-US', { maximumFractionDigits: crypto.usd > 100 ? 0 : 2 })}</div>
              </div>

              <div class="momentum-gauge">
                <div class="gauge-label">24h Momentum Score</div>
                <div class="gauge-bar">
                  <div class="gauge-fill" style="width: ${momentumFill}%">
                    ${crypto.momentum}
                  </div>
                </div>
              </div>

              <div class="momentum-score">${crypto.momentum}/100</div>
            </div>
          `;
        }).join('');

        // Update stats
        const strongest = cryptoData[0];
        const weakest = cryptoData[cryptoData.length - 1];
        const avgMomentum = (cryptoData.reduce((a, b) => a + parseFloat(b.momentum), 0) / cryptoData.length).toFixed(1);
        const totalVolume = cryptoData.reduce((a, b) => a + (b.marketCap || 0), 0);
        const volumeStr = totalVolume > 1e12 ? `$${(totalVolume / 1e12).toFixed(1)}T` : `$${(totalVolume / 1e9).toFixed(1)}B`;

        document.getElementById('stat-strongest').textContent = strongest.symbol;
        document.getElementById('stat-weakest').textContent = weakest.symbol;
        document.getElementById('stat-avg').textContent = avgMomentum;
        document.getElementById('stat-volume').textContent = volumeStr;

        lastDataTime = new Date();
        document.getElementById('last-updated').textContent = lastDataTime.toUTCString().split(' ')[4];

        document.getElementById('welcome').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
      } catch (error) {
        document.getElementById('error-container').innerHTML = `<div class="error">⚠️ Failed to load data: ${error.message}</div>`;
        document.getElementById('welcome').innerHTML = '<div style="text-align: center; padding: 40px; color: #f5515f;">Unable to fetch crypto data. Please try again.</div>';
      }
    }

    // Initial load
    fetchCryptoData();

    // Refresh every 60 seconds
    setInterval(fetchCryptoData, 60000);
  </script>
</body>
</html>
