<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coupled Pendulum Array</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(10, 14, 39, 0.8);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.2);
        }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00ffff, #00d9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            color: #20b2aa;
            margin-bottom: 30px;
            font-size: 0.95em;
        }
        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .control-group label {
            font-family: 'Syne', sans-serif;
            font-weight: 600;
            color: #00d9ff;
            font-size: 0.9em;
        }
        input[type="range"] {
            width: 150px;
            cursor: pointer;
            accent-color: #00d9ff;
        }
        .control-value {
            color: #00ffff;
            font-family: monospace;
            font-size: 0.85em;
        }
        .canvas-container {
            background: rgba(0, 20, 40, 0.4);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(0, 217, 255, 0.15);
            display: flex;
            justify-content: center;
        }
        canvas {
            max-width: 100%;
            height: auto;
            display: block;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }
        .stat-box {
            background: rgba(0, 217, 255, 0.05);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .stat-label {
            color: #20b2aa;
            font-size: 0.85em;
            margin-bottom: 5px;
        }
        .stat-value {
            font-family: monospace;
            font-size: 1.2em;
            color: #00ffff;
        }
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        button {
            background: rgba(0, 217, 255, 0.15);
            border: 1px solid rgba(0, 217, 255, 0.4);
            color: #00ffff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Syne', sans-serif;
            font-weight: 600;
            transition: all 0.2s;
        }
        button:hover {
            background: rgba(0, 217, 255, 0.3);
            border-color: #00d9ff;
        }
        @media (max-width: 600px) {
            h1 { font-size: 1.8em; }
            .controls { gap: 15px; }
            input[type="range"] { width: 120px; }
            .canvas-container { padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌊 Coupled Pendulum Array</h1>
        <p class="subtitle">5 pendulums linked by torsional springs — watch energy flow and resonant modes.</p>

        <div class="controls">
            <div class="control-group">
                <label for="coupling">Coupling Strength</label>
                <input type="range" id="coupling" min="0" max="200" value="80">
                <span class="control-value" id="couplingVal">80 N·m/rad</span>
            </div>
            <div class="control-group">
                <label for="angle0">Initial Angle 1</label>
                <input type="range" id="angle0" min="-180" max="180" value="45">
                <span class="control-value" id="angle0Val">45°</span>
            </div>
            <div class="control-group">
                <label for="angle2">Initial Angle 3 (Center)</label>
                <input type="range" id="angle2" min="-180" max="180" value="0">
                <span class="control-value" id="angle2Val">0°</span>
            </div>
            <div class="control-group">
                <label for="damping">Damping</label>
                <input type="range" id="damping" min="0" max="50" value="15">
                <span class="control-value" id="dampingVal">15</span>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="pendulumCanvas" width="700" height="600"></canvas>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Max Frequency</div>
                <div class="stat-value" id="freqStat">0.00 Hz</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Total Kinetic Energy</div>
                <div class="stat-value" id="keStat">0.00 J</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Total Potential Energy</div>
                <div class="stat-value" id="peStat">0.00 J</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">System Damping</div>
                <div class="stat-value" id="dampStat">15.0</div>
            </div>
        </div>

        <div class="buttons">
            <button id="resetBtn">Reset</button>
            <button id="pauseBtn">Pause</button>
        </div>
    </div>

    <script>
        // Coupled pendulum array simulator with Lagrangian mechanics
        const canvas = document.getElementById('pendulumCanvas');
        const ctx = canvas.getContext('2d');

        // Physical parameters
        const N = 5; // 5 pendulums
        const L = 150; // rod length (px)
        const m = 1; // mass per bob (kg, normalized)
        const g = 9.81; // gravity (m/s²)

        let state = {
            theta: [0.785, 0.2, 0, -0.2, -0.785], // Initial angles (rad)
            omega: [0, 0, 0, 0, 0],  // Angular velocities (rad/s)
            k: 80,   // Coupling spring constant (N·m/rad)
            c: 15,   // Damping coefficient
            time: 0
        };

        let paused = false;
        let freqHistory = [];
        let peakFreq = 0;

        // UI bindings
        document.getElementById('coupling').addEventListener('input', (e) => {
            state.k = parseFloat(e.target.value);
            document.getElementById('couplingVal').textContent = state.k + ' N·m/rad';
        });
        document.getElementById('angle0').addEventListener('input', (e) => {
            state.theta[0] = (parseFloat(e.target.value) * Math.PI) / 180;
            document.getElementById('angle0Val').textContent = e.target.value + '°';
            resetVelocities();
        });
        document.getElementById('angle2').addEventListener('input', (e) => {
            state.theta[2] = (parseFloat(e.target.value) * Math.PI) / 180;
            document.getElementById('angle2Val').textContent = e.target.value + '°';
            resetVelocities();
        });
        document.getElementById('damping').addEventListener('input', (e) => {
            state.c = parseFloat(e.target.value);
            document.getElementById('dampingVal').textContent = e.target.value;
            document.getElementById('dampStat').textContent = e.target.value.toFixed(1);
        });
        document.getElementById('resetBtn').addEventListener('click', reset);
        document.getElementById('pauseBtn').addEventListener('click', togglePause);

        function resetVelocities() {
            state.omega = [0, 0, 0, 0, 0];
        }

        function reset() {
            state.theta = [0.785, 0.2, 0, -0.2, -0.785];
            state.omega = [0, 0, 0, 0, 0];
            state.time = 0;
            peakFreq = 0;
            freqHistory = [];
            paused = false;
            document.getElementById('pauseBtn').textContent = 'Pause';
        }

        function togglePause() {
            paused = !paused;
            document.getElementById('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
        }

        function computeAccelerations(theta, omega) {
            const alpha = new Array(N).fill(0);
            for (let i = 0; i < N; i++) {
                // Gravity torque: -mg*L*sin(theta)
                let tau = -m * g * L * Math.sin(theta[i]);
                
                // Coupling torques from springs
                if (i > 0) {
                    tau += state.k * (theta[i-1] - theta[i]); // Spring to left neighbor
                }
                if (i < N - 1) {
                    tau += state.k * (theta[i+1] - theta[i]); // Spring to right neighbor
                }
                
                // Damping: -c * omega
                tau -= state.c * omega[i];
                
                // Moment of inertia: I = m*L²
                alpha[i] = tau / (m * L * L);
            }
            return alpha;
        }

        function step(dt = 0.016) {
            if (paused) return;

            // RK4 integration
            const alpha1 = computeAccelerations(state.theta, state.omega);
            const k1_theta = state.omega.map(v => v * dt);
            const k1_omega = alpha1.map(a => a * dt);

            const theta2 = state.theta.map((t, i) => t + k1_theta[i] * 0.5);
            const omega2 = state.omega.map((w, i) => w + k1_omega[i] * 0.5);
            const alpha2 = computeAccelerations(theta2, omega2);
            const k2_theta = omega2.map(v => v * dt);
            const k2_omega = alpha2.map(a => a * dt);

            const theta3 = state.theta.map((t, i) => t + k2_theta[i] * 0.5);
            const omega3 = state.omega.map((w, i) => w + k2_omega[i] * 0.5);
            const alpha3 = computeAccelerations(theta3, omega3);
            const k3_theta = omega3.map(v => v * dt);
            const k3_omega = alpha3.map(a => a * dt);

            const theta4 = state.theta.map((t, i) => t + k3_theta[i]);
            const omega4 = state.omega.map((w, i) => w + k3_omega[i]);
            const alpha4 = computeAccelerations(theta4, omega4);
            const k4_theta = omega4.map(v => v * dt);
            const k4_omega = alpha4.map(a => a * dt);

            for (let i = 0; i < N; i++) {
                state.theta[i] += (k1_theta[i] + 2*k2_theta[i] + 2*k3_theta[i] + k4_theta[i]) / 6;
                state.omega[i] += (k1_omega[i] + 2*k2_omega[i] + 2*k3_omega[i] + k4_omega[i]) / 6;
            }

            state.time += dt;

            // Track frequency via oscillation peaks
            const centerOmega = Math.abs(state.omega[2]);
            freqHistory.push(centerOmega);
            if (freqHistory.length > 100) freqHistory.shift();

            if (freqHistory.length > 10) {
                const sorted = [...freqHistory].sort((a, b) => b - a);
                peakFreq = sorted[0] / (2 * Math.PI);
            }
        }

        function getEnergies() {
            let KE = 0, PE = 0;
            for (let i = 0; i < N; i++) {
                KE += 0.5 * m * (L * state.omega[i]) ** 2; // KE = 0.5*m*v²
                PE += m * g * L * (1 - Math.cos(state.theta[i])); // PE from height
            }
            // Add spring potential energy
            for (let i = 0; i < N - 1; i++) {
                const dtheta = state.theta[i+1] - state.theta[i];
                PE += 0.5 * state.k * dtheta * dtheta;
            }
            return { KE, PE };
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(10, 14, 39, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const pivotX = canvas.width / 2;
            const pivotY = 80;
            const spacing = (canvas.width - 100) / (N - 1);

            // Draw springs between adjacent pendulums
            ctx.strokeStyle = 'rgba(32, 178, 170, 0.4)';
            ctx.lineWidth = 2;
            for (let i = 0; i < N - 1; i++) {
                const x1 = pivotX - (N - 1) * spacing / 2 + i * spacing + L * Math.sin(state.theta[i]);
                const y1 = pivotY + L * Math.cos(state.theta[i]);
                const x2 = pivotX - (N - 1) * spacing / 2 + (i + 1) * spacing + L * Math.sin(state.theta[i+1]);
                const y2 = pivotY + L * Math.cos(state.theta[i+1]);
                
                // Draw wavy spring line
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }

            // Draw each pendulum
            for (let i = 0; i < N; i++) {
                const px = pivotX - (N - 1) * spacing / 2 + i * spacing;
                const bobX = px + L * Math.sin(state.theta[i]);
                const bobY = pivotY + L * Math.cos(state.theta[i]);

                // Pivot point
                ctx.fillStyle = '#00d9ff';
                ctx.beginPath();
                ctx.arc(px, pivotY, 6, 0, Math.PI * 2);
                ctx.fill();

                // Rod
                ctx.strokeStyle = `hsl(${180 + i * 30}, 100%, 60%)`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(px, pivotY);
                ctx.lineTo(bobX, bobY);
                ctx.stroke();

                // Bob with glow
                const hue = 180 + i * 30;
                ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
                ctx.beginPath();
                ctx.arc(bobX, bobY, 12, 0, Math.PI * 2);
                ctx.fill();

                // Phase label
                ctx.fillStyle = '#00ffff';
                ctx.font = '12px Inter';
                ctx.textAlign = 'center';
                ctx.fillText(`${i+1}`, px, pivotY - 20);
            }

            // Update stats
            const { KE, PE } = getEnergies();
            document.getElementById('freqStat').textContent = peakFreq.toFixed(2) + ' Hz';
            document.getElementById('keStat').textContent = KE.toFixed(2) + ' J';
            document.getElementById('peStat').textContent = PE.toFixed(2) + ' J';

            step();
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
