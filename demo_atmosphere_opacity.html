<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmosphere Opacity</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a2847 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(15, 20, 40, 0.9);
            border: 1px solid rgba(135, 206, 235, 0.2);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(135, 206, 235, 0.1);
        }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.2em;
            margin-bottom: 20px;
            color: #87ceeb;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-weight: 500;
            font-size: 0.95em;
            color: #a0e7ff;
        }
        input[type="date"],
        input[type="time"],
        input[type="number"],
        select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(135, 206, 235, 0.3);
            color: #e0e0e0;
            padding: 10px 12px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95em;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            cursor: pointer;
        }
        .canvas-box {
            background: rgba(0, 20, 50, 0.7);
            border: 1px solid rgba(255, 183, 0, 0.2);
            border-radius: 8px;
            padding: 20px;
            margin: 30px 0;
        }
        canvas {
            width: 100%;
            height: 400px;
            display: block;
            background: linear-gradient(to right, rgba(10, 14, 39, 0.5), rgba(10, 14, 39, 0.5));
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 25px 0;
        }
        .stat-card {
            background: rgba(135, 206, 235, 0.08);
            border: 1px solid rgba(135, 206, 235, 0.2);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .stat-label {
            font-size: 0.85em;
            color: #a0e7ff;
            margin-bottom: 8px;
        }
        .stat-value {
            font-family: 'Syne', sans-serif;
            font-size: 1.4em;
            color: #ffb700;
            font-weight: 700;
        }
        .sky-preview {
            height: 120px;
            border-radius: 8px;
            border: 1px solid rgba(255, 183, 0, 0.3);
            margin: 20px 0;
        }
        .message {
            text-align: center;
            padding: 15px;
            background: rgba(255, 183, 0, 0.1);
            border-radius: 6px;
            border-left: 4px solid #ffb700;
            color: #ffd700;
            margin-top: 15px;
        }
        .error {
            background: rgba(255, 53, 53, 0.1);
            border-left-color: #ff3535;
            color: #ff8787;
        }
        @media (max-width: 600px) {
            .container { padding: 20px; }
            h1 { font-size: 1.6em; }
            canvas { height: 300px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Atmosphere Opacity</h1>
        
        <div class="controls">
            <div class="control-group">
                <label>Date</label>
                <input type="date" id="dateInput">
            </div>
            <div class="control-group">
                <label>Time (UTC)</label>
                <input type="time" id="timeInput">
            </div>
            <div class="control-group">
                <label>City</label>
                <input type="text" id="cityInput" placeholder="London, Paris, Tokyo...">
                <button onclick="geocodeCity()" style="padding: 10px; background: rgba(135, 206, 235, 0.2); border: 1px solid rgba(135, 206, 235, 0.4); color: #87ceeb; border-radius: 6px; cursor: pointer; font-weight: 500;">Search</button>
            </div>
            <div class="control-group">
                <label>Wavelength (nm)</label>
                <input type="range" id="wavelengthSlider" min="200" max="2000" value="550" oninput="updateWavelength()">
                <span id="wavelengthValue">550 nm (green)</span>
            </div>
            <div class="control-group">
                <label>Solar Angle (°)</label>
                <input type="range" id="solarAngleSlider" min="0" max="90" value="45" oninput="updateSolarAngle()">
                <span id="solarAngleValue">45°</span>
            </div>
            <div class="control-group">
                <label>Aerosol Loading</label>
                <input type="range" id="aerosolSlider" min="0.5" max="3" step="0.1" value="1" oninput="updateAerosol()">
                <span id="aerosolValue">1.0</span>
            </div>
        </div>

        <div class="canvas-box">
            <canvas id="canvas"></canvas>
        </div>

        <div class="sky-preview">
            <canvas id="skyPreview" style="width: 100%; height: 100%;"></canvas>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Optical Depth (τ)</div>
                <div class="stat-value" id="opticalDepth">0.0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Ground Transparency</div>
                <div class="stat-value" id="groundTransparency">100%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Visibility (km)</div>
                <div class="stat-value" id="visibility">50</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">UV Index</div>
                <div class="stat-value" id="uvIndex">8.5</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Scattering Type</div>
                <div class="stat-value" id="scatteringType" style="font-size: 1.1em;">Rayleigh</div>
            </div>
        </div>

        <div id="message" class="message" style="display: none;"></div>
    </div>

    <script>
        // Initialize with today's date/time
        const now = new Date();
        document.getElementById('dateInput').valueAsDate = now;
        document.getElementById('timeInput').value = now.toTimeString().slice(0, 5);
        document.getElementById('cityInput').value = 'London';

        let latitude = 51.5074;
        let longitude = -0.1278;
        let wavelength = 550;
        let solarAngle = 45;
        let aerosol = 1.0;

        async function geocodeCity() {
            const city = document.getElementById('cityInput').value.trim();
            if (!city) return;

            try {
                const response = await fetch(
                    `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`
                );
                if (!response.ok) throw new Error('Geocoding failed');
                const data = await response.json();
                if (!data.results || data.results.length === 0) {
                    showMessage('City not found. Try another name.', true);
                    return;
                }
                const result = data.results[0];
                latitude = result.latitude;
                longitude = result.longitude;
                showMessage(`Location: ${result.name}, ${result.country || ''} (${latitude.toFixed(2)}°, ${longitude.toFixed(2)}°)`);
                render();
            } catch (error) {
                showMessage('Error: ' + error.message, true);
            }
        }

        function updateWavelength() {
            wavelength = parseFloat(document.getElementById('wavelengthSlider').value);
            const names = {
                200: 'UV-C',
                280: 'UV-B',
                350: 'UV-A',
                450: 'blue',
                550: 'green',
                650: 'red',
                900: 'near-IR',
                1500: 'short-wave IR',
                2000: 'thermal'
            };
            let name = 'custom';
            Object.keys(names).forEach(w => {
                if (Math.abs(wavelength - parseInt(w)) < 50) name = names[w];
            });
            document.getElementById('wavelengthValue').textContent = `${wavelength} nm (${name})`;
            render();
        }

        function updateSolarAngle() {
            solarAngle = parseFloat(document.getElementById('solarAngleSlider').value);
            document.getElementById('solarAngleValue').textContent = solarAngle.toFixed(1) + '°';
            render();
        }

        function updateAerosol() {
            aerosol = parseFloat(document.getElementById('aerosolSlider').value);
            document.getElementById('aerosolValue').textContent = aerosol.toFixed(1);
            render();
        }

        function rayleighCrossSection(lambda_nm) {
            // Rayleigh scattering: σ ∝ λ^-4
            // Reference at 550 nm ≈ 0.11 × 10^-24 cm²
            const ref_lambda = 550;
            return 0.11 * Math.pow(ref_lambda / lambda_nm, 4);
        }

        function mieCrossSection(lambda_nm) {
            // Mie scattering for aerosols (simplified)
            // Larger particles, less wavelength dependence
            const ref_lambda = 550;
            return 0.05 * Math.pow(ref_lambda / lambda_nm, 1.5);
        }

        function calculateOpticalDepth() {
            const rayleigh = rayleighCrossSection(wavelength);
            const mie = mieCrossSection(wavelength) * aerosol;
            // Total optical depth for zenith
            const zenith_tau = 0.1 + rayleigh + mie;
            // Adjust for solar zenith angle (air mass approximation)
            const air_mass = 1 / Math.cos(solarAngle * Math.PI / 180 + 0.07);
            return zenith_tau * air_mass;
        }

        function render() {
            const tau = calculateOpticalDepth();
            const transmission = Math.exp(-tau);
            const ground_transparency = (transmission * 100).toFixed(1);
            const visibility_km = 20 / Math.max(tau, 0.01);

            document.getElementById('opticalDepth').textContent = tau.toFixed(3);
            document.getElementById('groundTransparency').textContent = ground_transparency + '%';
            document.getElementById('visibility').textContent = Math.min(visibility_km.toFixed(1), 999);

            // UV index (simplified)
            const uv_base = 12 * Math.cos(solarAngle * Math.PI / 180);
            const uv_transmission = uv_base * Math.exp(-rayleighCrossSection(310));
            document.getElementById('uvIndex').textContent = Math.max(0, uv_transmission).toFixed(1);

            // Scattering type
            const rayleigh_contrib = rayleighCrossSection(wavelength);
            const mie_contrib = mieCrossSection(wavelength) * aerosol;
            const scatterType = rayleigh_contrib > mie_contrib ? 'Rayleigh' : 'Mie';
            document.getElementById('scatteringType').textContent = scatterType;

            renderAtmosphereProfile();
            renderSkyColor();
        }

        function renderAtmosphereProfile() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            const w = canvas.width;
            const h = canvas.height;
            const padding = 40;

            // Background
            ctx.fillStyle = 'rgba(10, 20, 50, 0.3)';
            ctx.fillRect(0, 0, w, h);

            // Axes
            ctx.strokeStyle = 'rgba(135, 206, 235, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(padding, h - padding);
            ctx.lineTo(w - padding, h - padding);
            ctx.moveTo(padding, h - padding);
            ctx.lineTo(padding, padding);
            ctx.stroke();

            // Labels
            ctx.fillStyle = '#a0e7ff';
            ctx.font = '12px Inter';
            ctx.textAlign = 'center';
            ctx.fillText('Distance', w / 2, h - 10);
            ctx.save();
            ctx.translate(10, h / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText('Altitude (km)', 0, 0);
            ctx.restore();

            // Draw altitude profile (pressure/temp curves)
            const plot_w = w - 2 * padding;
            const plot_h = h - 2 * padding;

            // Pressure curve (normalized)
            ctx.strokeStyle = '#ff8c00';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let x = 0; x < plot_w; x += 2) {
                const alt_frac = x / plot_w;
                // Exponential pressure profile
                const pressure = Math.exp(-alt_frac * 2.5);
                const y = h - padding - pressure * plot_h;
                if (x === 0) ctx.moveTo(padding + x, y);
                else ctx.lineTo(padding + x, y);
            }
            ctx.stroke();

            // Optical depth curve
            ctx.strokeStyle = '#ffb700';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let x = 0; x < plot_w; x += 2) {
                const alt_frac = x / plot_w;
                const tau_at_alt = calculateOpticalDepth() * (1 - alt_frac);
                const transmission = Math.exp(-tau_at_alt);
                const y = h - padding - transmission * plot_h;
                if (x === 0) ctx.moveTo(padding + x, y);
                else ctx.lineTo(padding + x, y);
            }
            ctx.stroke();

            // Legend
            ctx.fillStyle = '#ff8c00';
            ctx.fillRect(w - 150, padding + 10, 12, 12);
            ctx.fillStyle = '#a0e7ff';
            ctx.font = '12px Inter';
            ctx.textAlign = 'left';
            ctx.fillText('Pressure', w - 130, padding + 20);

            ctx.fillStyle = '#ffb700';
            ctx.fillRect(w - 150, padding + 35, 12, 12);
            ctx.fillStyle = '#a0e7ff';
            ctx.fillText('Transparency', w - 130, padding + 45);
        }

        function renderSkyColor() {
            const canvas = document.getElementById('skyPreview');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            const w = canvas.width;
            const h = canvas.height;

            const tau = calculateOpticalDepth();
            const rayleigh = rayleighCrossSection(wavelength);

            // Sky color simulation based on scattering
            // Rayleigh scattering produces blue sky; aerosols → haze
            const blue_intensity = Math.exp(-rayleigh * 2) * Math.cos(solarAngle * Math.PI / 180);
            const red_intensity = Math.cos(solarAngle * Math.PI / 180) * 0.5;

            // Gradient from horizon to zenith
            const grad = ctx.createLinearGradient(0, 0, 0, h);
            
            if (solarAngle < 30) {
                // Sunrise/sunset colors
                grad.addColorStop(0, `rgb(${255}, ${Math.max(100, 180 - tau * 40)}, ${Math.max(50, 100 - tau * 50)})`);
                grad.addColorStop(1, `rgb(${255 * blue_intensity}, ${180 * blue_intensity}, ${220})`);
            } else {
                // Daytime colors
                grad.addColorStop(0, `rgb(${150 * blue_intensity}, ${200 * blue_intensity}, ${255})`);
                grad.addColorStop(1, `rgb(${100 * blue_intensity}, ${150 * blue_intensity}, ${200})`);
            }

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // Sun position
            const sun_x = w * 0.3;
            const sun_y = h * (1 - Math.sin(solarAngle * Math.PI / 180) * 0.8);
            const sun_glow_radius = 60;
            const glow = ctx.createRadialGradient(sun_x, sun_y, 0, sun_x, sun_y, sun_glow_radius);
            glow.addColorStop(0, `rgba(255, 200, 0, ${0.8 * Math.exp(-rayleigh)})`);
            glow.addColorStop(1, 'rgba(255, 150, 0, 0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, w, h);
        }

        function showMessage(text, isError = false) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message' + (isError ? ' error' : '');
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 4000);
        }

        // Initial render
        render();
    </script>
</body>
</html>
