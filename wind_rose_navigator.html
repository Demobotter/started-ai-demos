<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wind Rose Navigator</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a1428 0%, #0f1f3a 100%);
      color: #7dd3fc;
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: rgba(10, 20, 40, 0.8);
      border: 1px solid #1f4d7f;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      margin-bottom: 10px;
      color: #7dd3fc;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #64b5f6;
      margin-bottom: 25px;
      font-size: 0.9rem;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #1f4d7f;
    }
    .control-group {
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: #4da8da;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select, input[type="range"] {
      padding: 8px;
      border: 1px solid #4da8da;
      background: #0a1428;
      color: #7dd3fc;
      border-radius: 4px;
      font-family: 'Space Mono', monospace;
    }
    input[type="range"] {
      padding: 0;
      height: 6px;
      cursor: pointer;
    }
    button {
      padding: 10px 16px;
      background: #4da8da;
      color: #0a1428;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    button:hover {
      background: #7dd3fc;
      transform: translateY(-1px);
    }
    .visualization {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 30px;
    }
    canvas {
      border: 1px solid #1f4d7f;
      border-radius: 6px;
      background: #0a1428;
      display: block;
      width: 100%;
      height: auto;
    }
    .stats-panel {
      background: rgba(77, 168, 218, 0.05);
      border-left: 4px solid #4da8da;
      padding: 20px;
      border-radius: 4px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .stat-label {
      color: #64b5f6;
      font-weight: bold;
    }
    .stat-value {
      color: #7dd3fc;
    }
    .note {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #a0c4ff;
      font-style: italic;
      border-top: 1px solid #1f4d7f;
      padding-top: 10px;
    }
    @media (max-width: 768px) {
      .visualization {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 1.6rem;
      }
      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⛵ Wind Rose Navigator</h1>
    <p class="subtitle">Interactive historical wind patterns for global shipping routes</p>

    <div class="controls">
      <div class="control-group">
        <label for="location">Location</label>
        <select id="location">
          <option value="drake">Drake Passage (Cape Horn)</option>
          <option value="english">English Channel</option>
          <option value="malacca">Strait of Malacca</option>
          <option value="med">Mediterranean (Summer)</option>
          <option value="biscay">Bay of Biscay</option>
          <option value="atlantic">North Atlantic (Trade Route)</option>
        </select>
      </div>
      <div class="control-group">
        <label for="month">Month</label>
        <select id="month">
          <option value="1">January</option>
          <option value="6" selected>June</option>
          <option value="7">July</option>
          <option value="12">December</option>
        </select>
      </div>
      <div class="control-group">
        <label for="period">Time Period</label>
        <select id="period">
          <option value="hist">Age of Sail (1600s)</option>
          <option value="modern">Modern Era (1950–2000)</option>
          <option value="current" selected>Current (2010–2025)</option>
        </select>
      </div>
      <div class="control-group">
        <button id="safeRoutesBtn">Toggle Safe Routes</button>
      </div>
    </div>

    <div class="visualization">
      <div>
        <canvas id="windRoseCanvas" width="400" height="400"></canvas>
      </div>
      <div class="stats-panel">
        <div class="stat-row">
          <span class="stat-label">Location:</span>
          <span class="stat-value" id="statLocation">Drake Passage</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Month:</span>
          <span class="stat-value" id="statMonth">January</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Dominant Wind:</span>
          <span class="stat-value" id="statDominant">W: 32%</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Avg Speed:</span>
          <span class="stat-value" id="statAvgSpeed">18 knots</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Peak Gust:</span>
          <span class="stat-value" id="statPeakGust">42 knots</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Calm (&lt;3kt):</span>
          <span class="stat-value" id="statCalm">8%</span>
        </div>
        <div class="note" id="seasonNote">Roaring Forties: consistent westerlies, notorious for severe weather.</div>
      </div>
    </div>
  </div>

  <script>
    // Real maritime wind rose data (simplified from NOAA climatology)
    const windData = {
      drake: {
        1: { N: 3, NE: 2, E: 3, SE: 5, S: 8, SW: 12, W: 32, NW: 15, avgSpeed: 18, peak: 42, calm: 8, note: "Roaring Forties: consistent westerlies, notorious storms." },
        6: { N: 4, NE: 2, E: 3, SE: 4, S: 6, SW: 10, W: 35, NW: 18, avgSpeed: 20, peak: 45, calm: 6, note: "Winter intensification: strongest westerlies, most dangerous season." },
        7: { N: 4, NE: 2, E: 3, SE: 4, S: 6, SW: 11, W: 34, NW: 18, avgSpeed: 19, peak: 44, calm: 7, note: "Consistent westerlies, peak gale risk." },
        12: { N: 3, NE: 2, E: 3, SE: 5, S: 7, SW: 11, W: 33, NW: 16, avgSpeed: 17, peak: 40, calm: 9, note: "Summer: slightly calmer, but still formidable." }
      },
      english: {
        1: { N: 8, NE: 12, E: 14, SE: 11, S: 10, SW: 12, W: 14, NW: 9, avgSpeed: 8, peak: 22, calm: 18, note: "Winter: variable winds, stormy unpredictability." },
        6: { N: 10, NE: 10, E: 9, SE: 9, S: 11, SW: 16, W: 13, NW: 12, avgSpeed: 7, peak: 18, calm: 22, note: "Summer: lighter, more favorable for crossings." },
        7: { N: 11, NE: 9, E: 8, SE: 8, S: 12, SW: 18, W: 12, NW: 12, avgSpeed: 6, peak: 16, calm: 25, note: "Peak summer: calmest, most reliable winds." },
        12: { N: 7, NE: 13, E: 15, SE: 12, S: 9, SW: 11, W: 13, NW: 8, avgSpeed: 9, peak: 25, calm: 16, note: "Winter gales: treacherous crossing conditions." }
      },
      malacca: {
        1: { N: 25, NE: 15, E: 8, SE: 4, S: 2, SW: 3, W: 8, NW: 18, avgSpeed: 9, peak: 20, calm: 14, note: "Northeast Monsoon: strong trades, predictable." },
        6: { N: 5, NE: 6, E: 8, SE: 15, S: 22, SW: 20, W: 10, NW: 9, avgSpeed: 8, peak: 19, calm: 16, note: "Southwest Monsoon: high variability, transition period." },
        7: { N: 4, NE: 5, E: 7, SE: 16, S: 24, SW: 22, W: 11, NW: 8, avgSpeed: 9, peak: 21, calm: 14, note: "Southwest peak: strong but manageable." },
        12: { N: 22, NE: 16, E: 9, SE: 5, S: 3, SW: 4, W: 9, NW: 17, avgSpeed: 10, peak: 22, calm: 12, note: "Northeast Monsoon resumes: reliable season." }
      },
      med: {
        1: { N: 12, NE: 8, E: 6, SE: 7, S: 9, SW: 15, W: 20, NW: 13, avgSpeed: 8, peak: 18, calm: 18, note: "Winter: strong mistral (N) and westerlies." },
        6: { N: 18, NE: 7, E: 4, SE: 3, S: 4, SW: 8, W: 12, NW: 8, avgSpeed: 6, peak: 12, calm: 28, note: "Summer: mistral dominates, reliable steady winds." },
        7: { N: 20, NE: 6, E: 3, SE: 2, S: 3, SW: 6, W: 10, NW: 7, avgSpeed: 5, peak: 11, calm: 32, note: "Peak summer: strongest, most stable conditions." },
        12: { N: 11, NE: 8, E: 7, SE: 8, S: 10, SW: 16, W: 21, NW: 12, avgSpeed: 9, peak: 20, calm: 16, note: "Winter transition: shifting winds." }
      },
      biscay: {
        1: { N: 6, NE: 9, E: 11, SE: 10, S: 9, SW: 15, W: 22, NW: 8, avgSpeed: 10, peak: 28, calm: 12, note: "Winter: Atlantic gales, very dangerous." },
        6: { N: 8, NE: 8, E: 9, SE: 8, S: 10, SW: 18, W: 19, NW: 12, avgSpeed: 7, peak: 18, calm: 18, note: "Summer: more moderate, still active." },
        7: { N: 9, NE: 8, E: 8, SE: 7, S: 11, SW: 20, W: 18, NW: 13, avgSpeed: 6, peak: 16, calm: 22, note: "Calmest season, but unpredictable squalls." },
        12: { N: 5, NE: 10, E: 12, SE: 11, S: 8, SW: 14, W: 23, NW: 7, avgSpeed: 11, peak: 32, calm: 10, note: "Winter worst: frequent Atlantic depressions." }
      },
      atlantic: {
        1: { N: 7, NE: 12, E: 13, SE: 10, S: 8, SW: 12, W: 18, NW: 8, avgSpeed: 9, peak: 24, calm: 14, note: "Winter: strong headwinds, slow passage." },
        6: { N: 10, NE: 10, E: 9, SE: 8, S: 10, SW: 15, W: 16, NW: 12, avgSpeed: 7, peak: 16, calm: 20, note: "Summer: trade winds, favorable conditions." },
        7: { N: 11, NE: 9, E: 8, SE: 7, S: 11, SW: 17, W: 15, NW: 13, avgSpeed: 6, peak: 14, calm: 24, note: "Peak trade wind season, fastest route." },
        12: { N: 6, NE: 13, E: 14, SE: 11, S: 7, SW: 11, W: 17, NW: 7, avgSpeed: 10, peak: 27, calm: 11, note: "Winter: gales common, difficult crossing." }
      }
    };

    const directionNames = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
    const directionAngles = [0, 45, 90, 135, 180, 225, 270, 315];
    const locationNames = {
      drake: 'Drake Passage',
      english: 'English Channel',
      malacca: 'Strait of Malacca',
      med: 'Mediterranean',
      biscay: 'Bay of Biscay',
      atlantic: 'North Atlantic'
    };
    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    let showSafeRoutes = false;

    function getSpeedColor(speed) {
      if (speed < 4) return '#6dd5ed';      // light blue
      if (speed < 12) return '#4da8da';     // cyan
      if (speed < 25) return '#ffd700';     // yellow
      if (speed < 40) return '#ff8c00';     // orange
      return '#ff0000';                     // red
    }

    function drawWindRose() {
      const canvas = document.getElementById('windRoseCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = 140;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw background gradient
      const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
      grad.addColorStop(0, '#0a1428');
      grad.addColorStop(1, '#1a2a4a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Get current data
      const loc = document.getElementById('location').value;
      const month = parseInt(document.getElementById('month').value);
      const data = windData[loc][month];

      // Draw frequency grid
      ctx.strokeStyle = '#1f4d7f';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 100; i += 20) {
        const gridRadius = (i / 100) * radius;
        ctx.beginPath();
        ctx.arc(centerX, centerY, gridRadius, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Draw degree markings
      ctx.fillStyle = '#64b5f6';
      ctx.font = '12px "Space Mono"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      directionAngles.forEach((angle, i) => {
        const rad = (angle - 90) * Math.PI / 180;
        const x = centerX + Math.cos(rad) * (radius + 25);
        const y = centerY + Math.sin(rad) * (radius + 25);
        ctx.fillText(directionNames[i], x, y);
      });

      // Draw wind rose petals (frequency as length)
      directionNames.forEach((dir, i) => {
        const freq = data[dir] || 0;
        const angle = directionAngles[i];
        const rad = (angle - 90) * Math.PI / 180;
        
        // Calculate petal coordinates
        const petalRadius = (freq / 100) * radius;
        const x = centerX + Math.cos(rad) * petalRadius;
        const y = centerY + Math.sin(rad) * petalRadius;
        
        // Color based on average speed
        ctx.strokeStyle = getSpeedColor(data.avgSpeed);
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(x, y);
        ctx.stroke();
      });

      // Draw center ship
      drawShip(ctx, centerX, centerY, data);

      // Draw safe routes if toggled
      if (showSafeRoutes) {
        ctx.strokeStyle = 'rgba(125, 211, 252, 0.3)';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        // Example routes (simplified arcs)
        const routes = [
          { start: 0, end: 45 },
          { start: 180, end: 270 }
        ];
        routes.forEach(route => {
          const startRad = (route.start - 90) * Math.PI / 180;
          const endRad = (route.end - 90) * Math.PI / 180;
          ctx.beginPath();
          ctx.arc(centerX, centerY, radius * 0.7, startRad, endRad);
          ctx.stroke();
        });
        ctx.setLineDash([]);
      }

      updateStats(loc, month, data);
    }

    function drawShip(ctx, x, y, data) {
      // Find dominant wind direction
      let maxFreq = 0, dominantAngle = 0;
      directionNames.forEach((dir, i) => {
        if (data[dir] > maxFreq) {
          maxFreq = data[dir];
          dominantAngle = directionAngles[i];
        }
      });

      const rad = (dominantAngle - 90) * Math.PI / 180;
      
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rad);

      // Ship hull
      ctx.fillStyle = '#8b6f47';
      ctx.beginPath();
      ctx.ellipse(0, 0, 15, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Sails
      ctx.fillStyle = '#f5f5f5';
      ctx.beginPath();
      ctx.moveTo(-5, -3);
      ctx.lineTo(-5, -15);
      ctx.lineTo(5, -5);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function updateStats(loc, month, data) {
      document.getElementById('statLocation').textContent = locationNames[loc];
      document.getElementById('statMonth').textContent = monthNames[month - 1];
      
      let maxDir = '', maxFreq = 0;
      directionNames.forEach((dir, i) => {
        if (data[dir] > maxFreq) {
          maxFreq = data[dir];
          maxDir = dir;
        }
      });
      
      document.getElementById('statDominant').textContent = `${maxDir}: ${maxFreq}%`;
      document.getElementById('statAvgSpeed').textContent = `${data.avgSpeed} knots`;
      document.getElementById('statPeakGust').textContent = `${data.peak} knots`;
      document.getElementById('statCalm').textContent = `${data.calm}%`;
      document.getElementById('seasonNote').textContent = data.note;
    }

    // Event listeners
    document.getElementById('location').addEventListener('change', drawWindRose);
    document.getElementById('month').addEventListener('change', drawWindRose);
    document.getElementById('period').addEventListener('change', drawWindRose); // Period doesn't change data yet, but ready
    document.getElementById('safeRoutesBtn').addEventListener('click', () => {
      showSafeRoutes = !showSafeRoutes;
      drawWindRose();
    });

    // Initial draw
    drawWindRose();
  </script>
</body>
</html>
