<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Spectrum</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Space Mono', monospace;
            background: #0a0e27;
            color: #e8e8e8;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
            color: #fff;
        }
        .layout {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .control-group {
            background: #1a1f3a;
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #7209b7;
        }
        .control-group h3 {
            font-size: 0.9em;
            text-transform: uppercase;
            color: #a0a0c0;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .star-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        button {
            padding: 10px 12px;
            border: 2px solid #3d4a6e;
            background: #0f1419;
            color: #e8e8e8;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            font-family: 'Space Mono', monospace;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #2a3550;
            border-color: #7209b7;
        }
        button.active {
            background: #7209b7;
            border-color: #7209b7;
            color: #fff;
        }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            color: #a0a0c0;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, #2e3ba6, #00d9ff, #ffff00, #cc2200);
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(114, 9, 183, 0.5);
        }
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: none;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stat-box {
            background: #0f1419;
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid #7209b7;
            font-size: 0.8em;
        }
        .stat-box .label {
            color: #a0a0c0;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-box .value {
            font-size: 1.1em;
            color: #00ff88;
            font-weight: 700;
            margin-top: 4px;
        }
        .vis-container {
            background: #0f1419;
            border: 1px solid #3d4a6e;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        canvas {
            border-radius: 4px;
            background: #000;
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid #3d4a6e;
        }
        .spectrum-bar {
            height: 30px;
            border-radius: 4px;
            border: 1px solid #3d4a6e;
            background: linear-gradient(to right, 
                #7500ff 0%, #4500ff 8%, #2e3ba6 15%, 
                #0050ff 25%, #00a0ff 35%, #00ffff 45%, 
                #00ff99 50%, #ccff00 55%, #ffff00 60%, 
                #ff8800 70%, #ff4400 80%, #cc2200 90%, #990000 100%);
        }
        .preset-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .preset-buttons button {
            font-size: 0.8em;
            padding: 8px;
        }
        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }
            .star-buttons {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌌 Stellar Spectrum</h1>
        
        <div class="layout">
            <div class="controls">
                <div class="control-group">
                    <h3>Star Type</h3>
                    <div class="star-buttons">
                        <button class="star-btn" data-type="O" data-temp="30000">O-Type</button>
                        <button class="star-btn" data-type="B" data-temp="11000">B-Type</button>
                        <button class="star-btn" data-type="A" data-temp="9800">A-Type</button>
                        <button class="star-btn" data-type="F" data-temp="7500">F-Type</button>
                        <button class="star-btn" data-type="G" data-temp="5778">G-Type</button>
                        <button class="star-btn" data-type="K" data-temp="3900">K-Type</button>
                        <button class="star-btn" data-type="M" data-temp="3040">M-Type</button>
                    </div>
                </div>

                <div class="control-group">
                    <h3>Temperature (K)</h3>
                    <div class="slider-group">
                        <div class="slider-label">
                            <span>Cool</span>
                            <span id="tempValue">5778</span>
                            <span>Hot</span>
                        </div>
                        <input type="range" id="tempSlider" min="2000" max="50000" value="5778" step="100">
                    </div>
                </div>

                <div class="control-group">
                    <h3>Famous Stars</h3>
                    <div class="preset-buttons">
                        <button class="preset-btn" data-name="Betelgeuse" data-temp="3500">Betelgeuse</button>
                        <button class="preset-btn" data-name="Rigel" data-temp="11000">Rigel</button>
                        <button class="preset-btn" data-name="Sun" data-temp="5778">Sun</button>
                        <button class="preset-btn" data-name="Sirius" data-temp="9800">Sirius A</button>
                        <button class="preset-btn" data-name="Proxima" data-temp="3040">Proxima</button>
                    </div>
                </div>

                <div class="control-group">
                    <h3>Star Stats</h3>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="label">Type</div>
                            <div class="value" id="starType">G</div>
                        </div>
                        <div class="stat-box">
                            <div class="label">Temp (K)</div>
                            <div class="value" id="tempStat">5778</div>
                        </div>
                        <div class="stat-box">
                            <div class="label">Peak (nm)</div>
                            <div class="value" id="peakWave">501</div>
                        </div>
                        <div class="stat-box">
                            <div class="label">Color</div>
                            <div class="value" id="colorName">Yellow</div>
                        </div>
                        <div class="stat-box">
                            <div class="label">Luminosity (L☉)</div>
                            <div class="value" id="luminosity">1.0</div>
                        </div>
                        <div class="stat-box">
                            <div class="label">Age (Myr)</div>
                            <div class="value" id="age">4600</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="vis-container">
                <div style="flex: 1;">
                    <canvas id="sedCanvas" width="500" height="350"></canvas>
                </div>
                <div>
                    <div style="font-size: 0.8em; color: #a0a0c0; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px;">Visible Spectrum</div>
                    <div class="spectrum-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('sedCanvas');
        const ctx = canvas.getContext('2d');
        
        // Planck's constant and other constants
        const h = 6.626e-34; // J·s
        const c = 3e8; // m/s
        const k = 1.381e-23; // J/K
        
        // Wien's displacement law constant
        const wien = 2.898e-3; // m·K
        
        // Star data: age (Myr), luminosity (L☉), examples
        const starData = {
            'O': { age: 10, lum: 50000, example: 'Orion' },
            'B': { age: 300, lum: 1000, example: 'Rigel' },
            'A': { age: 2000, lum: 40, example: 'Sirius' },
            'F': { age: 5000, lum: 5, example: 'Procyon' },
            'G': { age: 10000, lum: 1, example: 'Sun' },
            'K': { age: 30000, lum: 0.5, example: 'Aldebaran' },
            'M': { age: 100000, lum: 0.1, example: 'Proxima' }
        };
        
        let currentTemp = 5778;
        let currentType = 'G';
        
        function planckIntensity(wavelength, temperature) {
            // Planck function: I(λ,T) = (2hc²/λ⁵) / (exp(hc/λkT) - 1)
            const numerator = 2 * h * c * c / Math.pow(wavelength, 5);
            const exponent = (h * c) / (wavelength * k * temperature);
            const denominator = Math.exp(exponent) - 1;
            return numerator / denominator;
        }
        
        function getColorFromWavelength(nm) {
            // Convert nm to RGB color
            const wavelength = nm;
            
            let r, g, b;
            
            if (wavelength < 380) {
                r = 0; g = 0; b = 1;
            } else if (wavelength < 440) {
                r = -(wavelength - 440) / (440 - 380); g = 0; b = 1;
            } else if (wavelength < 490) {
                r = 0; g = (wavelength - 440) / (490 - 440); b = 1;
            } else if (wavelength < 510) {
                r = 0; g = 1; b = -(wavelength - 510) / (510 - 490);
            } else if (wavelength < 580) {
                r = (wavelength - 510) / (580 - 510); g = 1; b = 0;
            } else if (wavelength < 645) {
                r = 1; g = -(wavelength - 645) / (645 - 580); b = 0;
            } else if (wavelength < 750) {
                r = 1; g = 0; b = 0;
            } else {
                r = 0.3; g = 0; b = 0;
            }
            
            // Apply gamma correction
            const gamma = 0.8;
            r = Math.pow(Math.max(0, r), gamma);
            g = Math.pow(Math.max(0, g), gamma);
            b = Math.pow(Math.max(0, b), gamma);
            
            return `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`;
        }
        
        function getColorNameFromPeak(peakNm) {
            if (peakNm < 380) return 'UV (Invisible)';
            if (peakNm < 450) return 'Violet';
            if (peakNm < 495) return 'Blue';
            if (peakNm < 570) return 'Green';
            if (peakNm < 590) return 'Yellow';
            if (peakNm < 620) return 'Orange';
            if (peakNm < 750) return 'Red';
            return 'IR (Invisible)';
        }
        
        function getStarTypeFromTemp(temp) {
            if (temp > 25000) return 'O';
            if (temp > 11000) return 'B';
            if (temp > 7500) return 'A';
            if (temp > 6000) return 'F';
            if (temp > 5200) return 'G';
            if (temp > 3700) return 'K';
            return 'M';
        }
        
        function drawSED(temperature) {
            const width = canvas.width;
            const height = canvas.height;
            const padding = 40;
            
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            
            // Draw axes
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(padding, height - padding);
            ctx.lineTo(width - padding, height - padding);
            ctx.moveTo(padding, height - padding);
            ctx.lineTo(padding, padding);
            ctx.stroke();
            
            // X-axis labels (wavelength in nm)
            ctx.fillStyle = '#a0a0c0';
            ctx.font = '12px "Space Mono"';
            ctx.textAlign = 'center';
            const wavelengths = [200, 400, 600, 800, 1000, 1500, 2000];
            for (let wl of wavelengths) {
                const x = padding + (wl / 2500) * (width - 2 * padding);
                ctx.fillText(wl, x, height - 20);
            }
            
            ctx.textAlign = 'left';
            ctx.fillText('Wavelength (nm)', width - 100, height - 5);
            ctx.save();
            ctx.translate(15, height / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.textAlign = 'center';
            ctx.fillText('Intensity', 0, 0);
            ctx.restore();
            
            // Calculate and draw spectrum curve
            const points = [];
            const maxIntensity = planckIntensity(wien / temperature, temperature);
            
            for (let x = padding; x < width - padding; x += 2) {
                const wavelength = ((x - padding) / (width - 2 * padding)) * 2500 * 1e-9; // meters
                const nm = wavelength * 1e9;
                const intensity = planckIntensity(wavelength, temperature);
                const normalizedIntensity = intensity / maxIntensity;
                const y = height - padding - normalizedIntensity * (height - 2 * padding);
                points.push({ x, y, nm });
            }
            
            // Draw gradient fill under curve
            const gradient = ctx.createLinearGradient(0, 0, width, 0);
            gradient.addColorStop(0, 'rgba(46, 59, 166, 0.2)');
            gradient.addColorStop(0.4, 'rgba(0, 209, 255, 0.3)');
            gradient.addColorStop(0.6, 'rgba(255, 255, 0, 0.3)');
            gradient.addColorStop(1, 'rgba(204, 34, 0, 0.2)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(points[0].x, height - padding);
            for (let p of points) {
                ctx.lineTo(p.x, p.y);
            }
            ctx.lineTo(points[points.length - 1].x, height - padding);
            ctx.closePath();
            ctx.fill();
            
            // Draw curve line
            ctx.strokeStyle = '#00d9ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.stroke();
            
            // Mark peak wavelength
            const peakWavelength = wien / temperature;
            const peakNm = peakWavelength * 1e9;
            const peakX = padding + (peakNm / 2500) * (width - 2 * padding);
            const peakY = height - padding - (height - 2 * padding);
            
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(peakX, peakY, 5, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw peak line
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(peakX, peakY);
            ctx.lineTo(peakX, height - padding);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Update stats
            document.getElementById('tempValue').textContent = Math.round(temperature);
            document.getElementById('tempStat').textContent = Math.round(temperature);
            document.getElementById('peakWave').textContent = Math.round(peakNm);
            document.getElementById('colorName').textContent = getColorNameFromPeak(peakNm);
            
            // Update star type
            currentType = getStarTypeFromTemp(temperature);
            document.getElementById('starType').textContent = currentType;
            
            // Update luminosity (rough estimate based on type)
            const lum = starData[currentType].lum;
            document.getElementById('luminosity').textContent = (lum / 1).toLocaleString('en-US', {
                notation: 'scientific',
                maximumFractionDigits: 1
            });
            
            document.getElementById('age').textContent = starData[currentType].age.toLocaleString();
        }
        
        // Event listeners
        document.getElementById('tempSlider').addEventListener('input', (e) => {
            currentTemp = parseInt(e.target.value);
            drawSED(currentTemp);
        });
        
        document.querySelectorAll('.star-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.star-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const temp = parseInt(btn.dataset.temp);
                currentTemp = temp;
                document.getElementById('tempSlider').value = temp;
                drawSED(temp);
            });
        });
        
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const temp = parseInt(btn.dataset.temp);
                currentTemp = temp;
                document.getElementById('tempSlider').value = temp;
                document.querySelectorAll('.star-btn').forEach(b => b.classList.remove('active'));
                drawSED(temp);
            });
        });
        
        // Initialize
        document.querySelector('[data-type="G"]').classList.add('active');
        drawSED(5778);
    </script>
</body>
</html>
