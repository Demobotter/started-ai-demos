<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Star Brightness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Mono', monospace;
      background: #0a0e27;
      color: #e0e0e0;
      padding: 20px;
      line-height: 1.5;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 20px;
    }
    .canvas-wrapper {
      background: #0a0e27;
      border: 1px solid #2a3a5a;
      border-radius: 8px;
      padding: 15px;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: radial-gradient(circle at 50% 50%, #1a1a3a 0%, #0a0e27 100%);
      border-radius: 4px;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .control-section {
      background: #0f1428;
      border: 1px solid #2a3a5a;
      border-radius: 8px;
      padding: 15px;
    }
    .control-section h3 {
      font-family: 'Playfair Display', serif;
      font-size: 14px;
      text-transform: uppercase;
      color: #4da8da;
      margin-bottom: 10px;
      border-bottom: 1px solid #2a3a5a;
      padding-bottom: 8px;
    }
    .constellation-btn {
      width: 100%;
      padding: 8px;
      margin-bottom: 5px;
      background: #1a2a4a;
      color: #b0c4de;
      border: 1px solid #3a5a7a;
      border-radius: 4px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }
    .constellation-btn:hover {
      background: #2a3a6a;
      border-color: #4da8da;
      color: #4da8da;
    }
    .constellation-btn.active {
      background: #4da8da;
      color: #0a0e27;
      border-color: #4da8da;
      font-weight: bold;
    }
    .slider-group {
      margin-bottom: 12px;
    }
    .slider-group label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      color: #7dd3fc;
      margin-bottom: 5px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #4da8da;
      cursor: pointer;
    }
    .stat-box {
      background: #0a1428;
      border-left: 3px solid #4da8da;
      padding: 10px;
      font-size: 11px;
      margin-top: 10px;
      border-radius: 3px;
    }
    .stat-box strong {
      color: #4da8da;
      display: block;
      margin-bottom: 2px;
    }
    .tooltip {
      position: fixed;
      background: #1a2a4a;
      border: 1px solid #4da8da;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 11px;
      pointer-events: none;
      display: none;
      z-index: 10;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .tooltip.visible {
      display: block;
    }
    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
      .control-section {
        max-height: 300px;
        overflow-y: auto;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="canvas-wrapper">
    <canvas id="canvas"></canvas>
  </div>

  <div class="sidebar">
    <div class="control-section">
      <h3>🌟 Constellations</h3>
      <button class="constellation-btn active" data-const="orion">Orion</button>
      <button class="constellation-btn" data-const="cassiopeia">Cassiopeia</button>
      <button class="constellation-btn" data-const="ursa-major">Ursa Major</button>
      <button class="constellation-btn" data-const="ursa-minor">Ursa Minor</button>
      <button class="constellation-btn" data-const="leo">Leo</button>
      <button class="constellation-btn" data-const="lyra">Lyra</button>
      <button class="constellation-btn" data-const="aquila">Aquila</button>
      <button class="constellation-btn" data-const="pegasus">Pegasus</button>
    </div>

    <div class="control-section">
      <h3>📊 Filter</h3>
      <div class="slider-group">
        <label for="magnitude">Max Magnitude (brightness)</label>
        <input type="range" id="magnitude" min="0" max="7" step="0.5" value="6" />
        <div class="stat-box">
          <strong id="mag-display">6.0</strong>
          Dimmer stars hidden
        </div>
      </div>
    </div>

    <div class="control-section">
      <h3>📈 Stats</h3>
      <div class="stat-box">
        <strong id="star-count">0</strong> visible stars
      </div>
      <div class="stat-box">
        <strong id="brightest">—</strong>
        Brightest star
      </div>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>

  lyra: {

    stars: [
      { name: 'Vega', ra: 279.2, dec: 38.8, mag: 0.03, color: '#4da8ff' },

      { name: 'Sulafat', ra: 286.4, dec: 37.6, mag: 3.24, color: '#9ab0c8' },
      { name: 'Epsilon Lyrae', ra: 284.3, dec: 39.7, mag: 4.02, color: '#b0c4de' },
    ],
    lines: [
      [279.2, 38.8, 282.7, 33.4],
      [282.7, 33.4, 286.4, 37.6],

  aquila: {
    name: 'Aquila',
    stars: [
      { name: 'Altair', ra: 297.7, dec: 8.9, mag: 0.76, color: '#7dd3fc' },
      { name: 'Alshain', ra: 300.2, dec: 1.0, mag: 3.94, color: '#b0c4de' },
      { name: 'Tarazed', ra: 313.6, dec: 13.9, mag: 2.72, color: '#b0c4de' },

    ],
    lines: [
      [297.7, 8.9, 300.2, 1.0],
      [297.7, 8.9, 313.6, 13.9],

    ]
  },
  pegasus: {
    name: 'Pegasus',
    stars: [
      { name: 'Enif', ra: 329.2, dec: 9.9, mag: 2.38, color: '#ffb84d' },
      { name: 'Scheat', ra: 350.2, dec: 28.1, mag: 2.44, color: '#ff6b5b' },
      { name: 'Markab', ra: 343.2, dec: 15.1, mag: 2.49, color: '#7dd3fc' },
      { name: 'Algenib', ra: 7.9, dec: 27.1, mag: 2.83, color: '#b0c4de' },
      { name: 'Matar', ra: 337.6, dec: 20.8, mag: 2.95, color: '#b0c4de' },
    ],
    lines: [
      [329.2, 9.9, 350.2, 28.1],
      [350.2, 28.1, 343.2, 15.1],
      [343.2, 15.1, 7.9, 27.1],
      [343.2, 15.1, 337.6, 20.8],
    ]

};

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const magInput = document.getElementById('magnitude');
const tooltip = document.getElementById('tooltip');
const starCountEl = document.getElementById('star-count');
const brightestEl = document.getElementById('brightest');
const magDisplayEl = document.getElementById('mag-display');

let currentConstellation = 'orion';
let maxMagnitude = 6;
let hoveredStar = null;

function resizeCanvas() {
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  render();
}

function raDecToPixel(ra, dec) {
  // Simple stereographic projection from RA/Dec to canvas
  const canvasW = canvas.width;
  const canvasH = canvas.height;
  
  // Normalize RA (0-360) and Dec (-90 to 90)
  const x = (ra / 360) * canvasW;
  const y = ((90 - dec) / 180) * canvasH;
  return { x, y };
}

function magToRadius(mag) {
  // Brighter (lower mag) = bigger circle
  // mag 0 → 8px, mag 7 → 2px
  return Math.max(2, 8 - mag);
}

function render() {
  ctx.fillStyle = 'rgba(10, 14, 39, 0.95)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  const data = CONSTELLATIONS[currentConstellation];
  
  // Draw constellation lines
  ctx.strokeStyle = 'rgba(200, 200, 200, 0.4)';
  ctx.lineWidth = 1;
  for (const line of data.lines) {
    const p1 = raDecToPixel(line[0], line[1]);
    const p2 = raDecToPixel(line[2], line[3]);
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  }
  
  // Draw stars
  const visibleStars = data.stars.filter(s => s.mag <= maxMagnitude);
  let brightest = null;
  
  for (const star of visibleStars) {
    const pos = raDecToPixel(star.ra, star.dec);
    const radius = magToRadius(star.mag);
    
    // Glow effect
    ctx.fillStyle = star.color + '33';
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, radius * 2, 0, Math.PI * 2);
    ctx.fill();
    
    // Star
    ctx.fillStyle = star.color;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
    ctx.fill();
    
    // Highlight if hovered
    if (hoveredStar === star.name) {
      ctx.strokeStyle = '#4da8da';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, radius + 4, 0, Math.PI * 2);
      ctx.stroke();
    }
    
    if (!brightest || star.mag < brightest.mag) {
      brightest = star;
    }
  }
  
  // Update stats
  starCountEl.textContent = visibleStars.length;
  if (brightest) {
    brightestEl.textContent = `${brightest.name} (mag ${brightest.mag.toFixed(2)})`;
  }
}

function updateMagnitude() {
  maxMagnitude = parseFloat(magInput.value);
  magDisplayEl.textContent = maxMagnitude.toFixed(1);
  render();
}

function setConstellation(slug) {
  currentConstellation = slug;
  document.querySelectorAll('.constellation-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.const === slug);
  });
  hoveredStar = null;
  tooltip.classList.remove('visible');
  render();
}

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  
  const data = CONSTELLATIONS[currentConstellation];
  let found = null;
  
  for (const star of data.stars) {
    if (star.mag > maxMagnitude) continue;
    const pos = raDecToPixel(star.ra, star.dec);
    const dist = Math.hypot(mx - pos.x, my - pos.y);
    if (dist < magToRadius(star.mag) + 8) {
      found = star;
      break;
    }
  }
  
  if (found) {
    hoveredStar = found.name;
    tooltip.textContent = `${found.name} · mag ${found.mag.toFixed(2)}`;
    tooltip.classList.add('visible');
    tooltip.style.left = (e.clientX - rect.left + 10) + 'px';
    tooltip.style.top = (e.clientY - rect.top + 10) + 'px';
  } else {
    hoveredStar = null;
    tooltip.classList.remove('visible');
  }
  
  render();
});

canvas.addEventListener('mouseleave', () => {
  hoveredStar = null;
  tooltip.classList.remove('visible');
  render();
});

magInput.addEventListener('change', updateMagnitude);
magInput.addEventListener('input', updateMagnitude);

document.querySelectorAll('.constellation-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    setConstellation(btn.dataset.const);
  });
});

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
</script>

</body>
</html>
