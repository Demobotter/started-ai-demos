<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coral Bleaching Thermal Stress Simulator</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Mono', monospace;
      background: linear-gradient(135deg, #0a1f4a 0%, #0d2a5c 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: rgba(10, 31, 74, 0.8);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2em;
      margin-bottom: 8px;
      color: #d4a574;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
      font-size: 0.9em;
    }
    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 30px;
    }
    @media (max-width: 768px) {
      .content { grid-template-columns: 1fr; }
      h1 { font-size: 1.8em; }
    }
    .canvas-wrapper {
      background: #0a1f4a;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .control-group {
      background: rgba(255, 255, 255, 0.05);
      padding: 15px;
      border-radius: 8px;
      border-left: 3px solid #06b6d4;
    }
    .control-label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #06b6d4;
      font-size: 0.9em;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #1f4d7f;
      outline: none;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #06b6d4;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(6, 182, 212, 0.4);
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #06b6d4;
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 6px rgba(6, 182, 212, 0.4);
    }
    .temp-display {
      font-size: 1.8em;
      color: #06b6d4;
      font-family: 'Playfair Display', serif;
      text-align: center;
      margin: 10px 0;
    }
    .temp-zone {
      text-align: center;
      font-size: 0.85em;
      color: #aaa;
      margin-top: 8px;
    }
    select {
      width: 100%;
      padding: 10px;
      background: #0a1f4a;
      color: #06b6d4;
      border: 1px solid #06b6d4;
      border-radius: 4px;
      font-family: 'Space Mono', monospace;
      cursor: pointer;
      font-size: 0.9em;
    }
    .stat-card {
      background: rgba(6, 182, 212, 0.1);
      border-left: 3px solid #06b6d4;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    .stat-label {
      color: #aaa;
      font-size: 0.8em;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 1.3em;
      color: #06b6d4;
      font-family: 'Playfair Display', serif;
    }
    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }
    button {
      padding: 10px 16px;
      background: #06b6d4;
      color: #0a1f4a;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 0.85em;
      font-weight: bold;
      transition: all 0.3s;
    }
    button:hover {
      background: #00d4e8;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
    }
    button.active {
      background: #00d4e8;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }
    .reef-selector {
      background: rgba(255, 255, 255, 0.05);
      padding: 15px;
      border-radius: 8px;
      border-left: 3px solid #f39c12;
    }
    .modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #0a1f4a;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      z-index: 1000;
      max-width: 400px;
      border: 2px solid #06b6d4;
    }
    .modal.active {
      display: block;
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translate(-50%, -40%);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%);
      }
    }
    .modal-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.4em;
      margin-bottom: 15px;
      color: #d4a574;
    }
    .modal-content {
      max-height: 300px;
      overflow-y: auto;
    }
    .reef-option {
      padding: 10px;
      margin-bottom: 8px;
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid #06b6d4;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
      font-size: 0.9em;
      transition: all 0.2s;
    }
    .reef-option:hover {
      background: rgba(6, 182, 212, 0.2);
    }
    .chart-wrapper {
      background: #0a1f4a;
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
      overflow: hidden;
    }
    .chart-label {
      color: #aaa;
      font-size: 0.8em;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🪸 Coral Bleaching Sim</h1>
    <div class="subtitle">Watch symbiosis collapse as ocean heat rises</div>
    
    <div class="content">
      <div>
        <div class="canvas-wrapper">
          <canvas id="coralCanvas" width="400" height="300"></canvas>
        </div>
        <div class="chart-wrapper">
          <div class="chart-label">Temperature Trend</div>
          <canvas id="tempChart" width="400" height="120"></canvas>
        </div>
      </div>
      
      <div class="controls">
        <div class="control-group">
          <label class="control-label">Ocean Temperature (°C)</label>
          <input type="range" id="tempSlider" min="15" max="35" value="26" step="0.1">
          <div class="temp-display" id="tempDisplay">26°C</div>
          <div class="temp-zone" id="tempZone">Optimal zone (safe)</div>
        </div>
        
        <div class="stat-card">
          <div class="stat-label">Zooxanthellae Health</div>
          <div class="stat-value" id="healthStat">100%</div>
        </div>
        
        <div class="stat-card">
          <div class="stat-label">Bleaching Status</div>
          <div class="stat-value" id="statusStat">Healthy</div>
        </div>
        
        <div class="stat-card">
          <div class="stat-label">Recovery Time</div>
          <div class="stat-value" id="recoveryStat">N/A</div>
        </div>
        
        <div class="reef-selector">
          <label class="control-label" style="margin-bottom: 12px;">Select Real Reef Location</label>
          <button onclick="openReefModal()" style="width: 100%;">Choose Reef →</button>
        </div>
        
        <div class="button-group">
          <button onclick="startTutorial()">📖 Tutorial</button>
          <button onclick="resetSimulation()">↻ Reset</button>
        </div>
      </div>
    </div>
  </div>
  
  <div class="modal" id="reefModal">
    <div class="modal-title">Real Coral Reef Locations</div>
    <div class="modal-content" id="reefList"></div>
  </div>

  <script>
    const reefs = [
      { name: 'Great Barrier Reef', lat: -16.3, lon: 145.8, risk: 'High' },
      { name: 'Caribbean Reefs', lat: 18.0, lon: -75.0, risk: 'High' },
      { name: 'Coral Triangle', lat: 0.0, lon: 120.0, risk: 'Extreme' },
      { name: 'Red Sea Reefs', lat: 20.0, lon: 37.0, risk: 'Moderate' },
      { name: 'Indo-Pacific Triangle', lat: -5.0, lon: 118.0, risk: 'Extreme' },
      { name: 'Florida Keys', lat: 24.7, lon: -81.0, risk: 'High' }
    ];
    
    let currentReef = reefs[0];
    let globalTemp = 26;
    let health = 100;
    let bleachingStartTime = null;
    let recoveryStartTime = null;
    
    const coralCanvas = document.getElementById('coralCanvas');
    const ctx = coralCanvas.getContext('2d');
    const tempSlider = document.getElementById('tempSlider');
    const tempChart = document.getElementById('tempChart');
    const chartCtx = tempChart.getContext('2d');
    
    const OPTIMAL_ZONE = { min: 24, max: 30, peak: 28 };
    const BLEACH_THRESHOLD = 30;
    const SEVERE_THRESHOLD = 32;
    
    let animationFrameId;
    let zooxanthellae = generateZooxanthellae();
    
    function generateZooxanthellae() {
      const count = 40;
      const particles = [];
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * 280 + 60,
          y: Math.random() * 180 + 60,
          vx: 0,
          vy: 0,
          targetX: 0,
          targetY: 0,
          opacity: 1,
          scale: 1
        });
      }
      return particles;
    }
    
    function updateZooxanthellae() {
      const healthRatio = Math.max(0, Math.min(1, health / 100));
      
      if (globalTemp > BLEACH_THRESHOLD) {
        // Bleaching: particles fade and escape
        zooxanthellae.forEach(p => {
          p.opacity = Math.max(0, p.opacity - 0.02);
          p.scale = Math.max(0.2, p.scale - 0.015);
          p.vx += (Math.random() - 0.5) * 0.5;
          p.vy -= 0.3;
          p.x += p.vx;
          p.y += p.vy;
        });
      } else if (globalTemp <= OPTIMAL_ZONE.max && globalTemp >= OPTIMAL_ZONE.min) {
        // Recovery: particles drift back and brighten
        zooxanthellae.forEach((p, i) => {
          const polyp = getPolyp(i);
          p.targetX = polyp.x;
          p.targetY = polyp.y;
          p.x += (p.targetX - p.x) * 0.08;
          p.y += (p.targetY - p.y) * 0.08;
          p.opacity = Math.min(1, p.opacity + 0.02);
          p.scale = Math.min(1, p.scale + 0.015);
          p.vx *= 0.95;
          p.vy *= 0.95;
        });
      }
    }
    
    function getPolyp(index) {
      const polypPerRow = 5;
      const row = Math.floor(index / polypPerRow);
      const col = index % polypPerRow;
      return {
        x: 80 + col * 70,
        y: 100 + row * 50
      };
    }
    
    function drawCoral() {
      ctx.fillStyle = '#0a1f4a';
      ctx.fillRect(0, 0, coralCanvas.width, coralCanvas.height);
      
      // Update health based on temperature
      const tempDiff = Math.max(0, globalTemp - OPTIMAL_ZONE.max);
      const newHealth = Math.max(0, 100 - tempDiff * 6);
      health = health * 0.98 + newHealth * 0.02;
      
      if (health < 50 && !bleachingStartTime) bleachingStartTime = Date.now();
      if (health > 80) { bleachingStartTime = null; recoveryStartTime = null; }
      
      // Draw ocean
      ctx.fillStyle = 'rgba(10, 31, 74, 0.5)';
      ctx.fillRect(0, 0, coralCanvas.width, coralCanvas.height);
      
      // Draw grid
      ctx.strokeStyle = 'rgba(31, 77, 127, 0.3)';
      ctx.lineWidth = 1;
      for (let i = 0; i < coralCanvas.width; i += 40) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, coralCanvas.height);
        ctx.stroke();
      }
      
      // Draw polyps
      const polypsPerRow = 5;
      const polypsPerCol = 3;
      for (let row = 0; row < polypsPerCol; row++) {
        for (let col = 0; col < polypsPerRow; col++) {
          const x = 80 + col * 70;
          const y = 100 + row * 50;
          drawPolyp(x, y);
        }
      }
      
      // Draw zooxanthellae
      updateZooxanthellae();
      zooxanthellae.forEach((p, i) => {
        ctx.fillStyle = `rgba(212, 165, 116, ${p.opacity * 0.9})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3 * p.scale, 0, Math.PI * 2);
        ctx.fill();
      });
      
      // Draw temperature indicator bar (top)
      const barWidth = 350;
      const barX = 25;
      const barY = 20;
      
      // Background bar
      ctx.fillStyle = '#1f4d7f';
      ctx.fillRect(barX, barY, barWidth, 12);
      
      // Color zones
      const safeZone = (OPTIMAL_ZONE.max - 15) / 20 * barWidth;
      const stressStart = (BLEACH_THRESHOLD - 15) / 20 * barWidth;
      const severeStart = (SEVERE_THRESHOLD - 15) / 20 * barWidth;
      
      ctx.fillStyle = 'rgba(6, 182, 212, 0.3)'; // Safe
      ctx.fillRect(barX, barY, safeZone, 12);
      ctx.fillStyle = 'rgba(243, 156, 18, 0.3)'; // Stress
      ctx.fillRect(barX + safeZone, barY, stressStart - safeZone, 12);
      ctx.fillStyle = 'rgba(231, 76, 60, 0.3)'; // Severe
      ctx.fillRect(barX + stressStart, barY, severeStart - stressStart, 12);
      
      // Temperature marker
      const markerX = barX + ((globalTemp - 15) / 20) * barWidth;
      ctx.fillStyle = '#06b6d4';
      ctx.beginPath();
      ctx.moveTo(markerX, barY - 4);
      ctx.lineTo(markerX + 4, barY + 12);
      ctx.lineTo(markerX - 4, barY + 12);
      ctx.closePath();
      ctx.fill();
    }
    
    function drawPolyp(x, y) {
      const healthRatio = Math.max(0, Math.min(1, health / 100));
      
      // Polyp body (white when bleached, cream when healthy)
      const r = healthRatio * 15 + 15;
      const bleachColor = `rgba(245, 241, 222, ${0.3 + healthRatio * 0.7})`;
      ctx.fillStyle = bleachColor;
      ctx.beginPath();
      ctx.ellipse(x, y, r * 0.8, r, 0, 0, Math.PI * 2);
      ctx.fill();
      
      // Polyp outline
      ctx.strokeStyle = `rgba(245, 241, 222, ${0.5 + healthRatio * 0.5})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      
      // Tentacles (if healthy)
      if (healthRatio > 0.3) {
        ctx.strokeStyle = `rgba(212, 165, 116, ${healthRatio})`;
        ctx.lineWidth = 1;
        for (let i = 0; i < 4; i++) {
          const angle = (Math.PI * 2 / 4) * i;
          const tx = x + Math.cos(angle) * r * 1.2;
          const ty = y + Math.sin(angle) * r * 1.2;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(tx, ty);
          ctx.stroke();
        }
      }
    }
    
    function drawChart() {
      chartCtx.fillStyle = '#0a1f4a';
      chartCtx.fillRect(0, 0, tempChart.width, tempChart.height);
      
      // Simple temperature trend line
      chartCtx.strokeStyle = '#06b6d4';
      chartCtx.lineWidth = 2;
      chartCtx.beginPath();
      const points = 50;
      for (let i = 0; i < points; i++) {
        const x = (i / points) * tempChart.width;
        const baseTemp = 26 + Math.sin(i / 10) * 1.5;
        const y = tempChart.height - 20 - (baseTemp - 20) / 15 * (tempChart.height - 40);
        if (i === 0) chartCtx.moveTo(x, y);
        else chartCtx.lineTo(x, y);
      }
      chartCtx.stroke();
      
      // Threshold line (bleach threshold)
      chartCtx.strokeStyle = 'rgba(243, 156, 18, 0.5)';
      chartCtx.setLineDash([4, 4]);
      const thresholdY = tempChart.height - 20 - (BLEACH_THRESHOLD - 20) / 15 * (tempChart.height - 40);
      chartCtx.beginPath();
      chartCtx.moveTo(0, thresholdY);
      chartCtx.lineTo(tempChart.width, thresholdY);
      chartCtx.stroke();
      chartCtx.setLineDash([]);
    }
    
    function updateDisplay() {
      document.getElementById('tempDisplay').textContent = globalTemp.toFixed(1) + '°C';
      document.getElementById('healthStat').textContent = Math.max(0, health).toFixed(0) + '%';
      
      let zone = 'Optimal zone (safe)';
      let zoneColor = '#06b6d4';
      if (globalTemp > SEVERE_THRESHOLD) {
        zone = 'Severe stress — bleaching';
        zoneColor = '#e74c3c';
      } else if (globalTemp > BLEACH_THRESHOLD) {
        zone = 'Stress zone — bleaching risk';
        zoneColor = '#f39c12';
      } else if (globalTemp > OPTIMAL_ZONE.max) {
        zone = 'Warm — approaching stress';
        zoneColor = '#f39c12';
      }
      document.getElementById('tempZone').textContent = zone;
      document.getElementById('tempZone').style.color = zoneColor;
      
      let status = 'Healthy';
      if (health < 20) status = 'Severely Bleached';
      else if (health < 50) status = 'Heavily Bleached';
      else if (health < 80) status = 'Partially Bleached';
      document.getElementById('statusStat').textContent = status;
      
      if (bleachingStartTime && health < 50) {
        const seconds = Math.ceil((Date.now() - bleachingStartTime) / 1000);
        document.getElementById('recoveryStat').textContent = seconds + 's bleached';
      } else if (health < 80 && !bleachingStartTime) {
        document.getElementById('recoveryStat').textContent = 'Recovering...';
      } else {
        document.getElementById('recoveryStat').textContent = 'N/A';
      }
    }
    
    function animate() {
      drawCoral();
      drawChart();
      updateDisplay();
      animationFrameId = requestAnimationFrame(animate);
    }
    
    tempSlider.addEventListener('input', (e) => {
      globalTemp = parseFloat(e.target.value);
    });
    
    function openReefModal() {
      const modal = document.getElementById('reefModal');
      const list = document.getElementById('reefList');
      list.innerHTML = reefs.map((reef, idx) => `
        <div class="reef-option" onclick="selectReef(${idx})">
          <strong>${reef.name}</strong><br>
          <small>Risk: ${reef.risk}</small>
        </div>
      `).join('');
      modal.classList.add('active');
    }
    
    function selectReef(idx) {
      currentReef = reefs[idx];
      document.getElementById('reefModal').classList.remove('active');
    }
    
    function startTutorial() {
      alert(
        '🌊 CORAL BLEACHING TUTORIAL\n\n' +
        '1. Drag the temperature slider UP and watch zooxanthellae (golden dots) fade.\n' +
        '2. At 30°C, bleaching begins — polyps turn white.\n' +
        '3. Lower temperature back to 26°C — polyps slowly recover.\n' +
        '4. Real corals take weeks to recover; this sim compresses it to seconds.\n' +
        '5. Zooxanthellae are algae living IN coral polyps — they photosynthesize and feed the coral.\n' +
        '6. When ocean heats above ~28°C, corals expel their algae to survive (bleaching).\n' +
        '7. Without algae, corals starve and die if stress lasts too long.\n' +
        'Current reef: ' + currentReef.name + ' (Risk: ' + currentReef.risk + ')'
      );
    }
    
    function resetSimulation() {
      globalTemp = 26;
      health = 100;
      bleachingStartTime = null;
      recoveryStartTime = null;
      zooxanthellae = generateZooxanthellae();
      tempSlider.value = 26;
      updateDisplay();
    }
    
    animate();
  </script>
</body>
</html>
