<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nim Master</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Playfair Display', 'Space Mono', monospace;
            background: linear-gradient(135deg, #0a1428 0%, #1a2d4d 100%);
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: rgba(15, 30, 60, 0.95);
            border: 2px solid #4da8da;
            border-radius: 12px;
            padding: 40px;
            max-width: 600px;
            box-shadow: 0 0 40px rgba(77, 168, 218, 0.3);
        }
        h1 {
            text-align: center;
            color: #4da8da;
            margin-bottom: 10px;
            font-size: 2.2em;
            font-weight: 400;
            letter-spacing: 2px;
        }
        .subtitle {
            text-align: center;
            color: #7dd3fc;
            margin-bottom: 30px;
            font-size: 0.9em;
            font-style: italic;
        }
        .game-status {
            background: rgba(77, 168, 218, 0.1);
            border-left: 4px solid #4da8da;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .status-text {
            font-size: 1.1em;
            color: #e0e0e0;
            margin-bottom: 5px;
        }
        .status-detail {
            font-size: 0.85em;
            color: #7dd3fc;
        }
        .piles {
            margin-bottom: 30px;
        }
        .pile {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(30, 50, 90, 0.6);
            border: 1px solid #2d5a9f;
            border-radius: 6px;
        }
        .pile-label {
            color: #4da8da;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        .pile-objects {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            min-height: 30px;
            align-items: center;
        }
        .object {
            width: 24px;
            height: 24px;
            background: #4da8da;
            border-radius: 3px;
            display: inline-block;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .object:hover {
            opacity: 1;
        }
        .pile-input {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .pile-input input {
            width: 60px;
            padding: 8px;
            background: rgba(10, 20, 40, 0.8);
            border: 1px solid #4da8da;
            color: #e0e0e0;
            border-radius: 4px;
            font-size: 1em;
            text-align: center;
        }
        .pile-input input:focus {
            outline: none;
            border-color: #64b5f6;
            background: rgba(10, 20, 40, 1);
        }
        .pile-input button {
            padding: 8px 16px;
            background: #4da8da;
            border: none;
            color: #0a1428;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .pile-input button:hover:not(:disabled) {
            background: #64b5f6;
            transform: translateY(-2px);
        }
        .pile-input button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            min-width: 140px;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.2s;
            font-family: 'Space Mono', monospace;
        }
        .btn-primary {
            background: #4da8da;
            color: #0a1428;
        }
        .btn-primary:hover:not(:disabled) {
            background: #64b5f6;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(77, 168, 218, 0.4);
        }
        .btn-secondary {
            background: rgba(77, 168, 218, 0.2);
            color: #7dd3fc;
            border: 1px solid #4da8da;
        }
        .btn-secondary:hover:not(:disabled) {
            background: rgba(77, 168, 218, 0.3);
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .stats {
            background: rgba(77, 168, 218, 0.05);
            border: 1px solid #2d5a9f;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            color: #7dd3fc;
        }
        .game-over {
            background: rgba(200, 100, 100, 0.15);
            border: 2px solid #ff6b6b;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .game-over h2 {
            color: #ff6b6b;
            margin-bottom: 10px;
            font-size: 1.4em;
        }
        .game-over p {
            color: #e0e0e0;
            margin-bottom: 8px;
            line-height: 1.5;
        }
        .difficulty {
            margin-bottom: 20px;
        }
        .difficulty label {
            color: #7dd3fc;
            font-size: 0.9em;
            display: block;
            margin-bottom: 8px;
        }
        .difficulty select {
            width: 100%;
            padding: 8px;
            background: rgba(10, 20, 40, 0.8);
            border: 1px solid #4da8da;
            color: #e0e0e0;
            border-radius: 4px;
            font-size: 1em;
        }
        .nim-sum {
            background: rgba(100, 50, 200, 0.1);
            border-left: 4px solid #9966ff;
            padding: 10px;
            margin-top: 15px;
            border-radius: 4px;
            font-size: 0.85em;
            color: #b099ff;
            font-family: 'Space Mono', monospace;
        }
        .ai-thinking {
            text-align: center;
            color: #7dd3fc;
            font-style: italic;
            margin: 15px 0;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>♟ Nim Master</h1>
        <p class="subtitle">Beat the perfect-play AI at combinatorial math</p>

        <div class="game-status">
            <div class="status-text" id="statusText">Game started. Your turn.</div>
            <div class="status-detail" id="statusDetail">Remove any number of objects from one pile.</div>
        </div>

        <div class="difficulty">
            <label for="difficulty">AI Difficulty:</label>
            <select id="difficulty" onchange="changeDifficulty()">
                <option value="easy">Easy (AI plays randomly 50%)</option>
                <option value="medium" selected>Medium (AI plays perfectly)</option>
                <option value="hard">Hard (AI plays perfectly + commentary)</option>
            </select>
        </div>

        <div class="stats">
            <div class="stat-row">
                <span>Nim-Sum (XOR):</span>
                <span id="nimSum" style="color: #ff9999; font-weight: bold;">0</span>
            </div>
            <div class="stat-row">
                <span>Total Objects:</span>
                <span id="totalObjects">0</span>
            </div>
            <div class="stat-row">
                <span>Game Position:</span>
                <span id="position" style="color: #99ff99;">-</span>
            </div>
        </div>

        <div class="nim-sum" id="nimSumExplanation">Nim-Sum = 0 means losing position (with perfect play).</div>

        <div class="piles" id="pilesContainer"></div>

        <div class="controls">
            <button class="btn btn-primary" onclick="startNewGame()">New Game</button>
            <button class="btn btn-secondary" onclick="toggleRules()">How to Play</button>
        </div>

        <div id="gameOverContainer"></div>
    </div>

    <script>
        let piles = [3, 5, 7];
        let gameOver = false;
        let playerTurn = true;
        let selectedPile = null;
        let difficulty = 'medium';

        function calculateNimSum(piles) {
            return piles.reduce((xor, pile) => xor ^ pile, 0);
        }

        function getPosition(nimSum) {
            if (nimSum === 0) {
                return playerTurn ? 'Losing' : 'Winning';
            } else {
                return playerTurn ? 'Winning' : 'Losing';
            }
        }

        function findWinningMove(piles) {
            const nimSum = calculateNimSum(piles);
            if (nimSum === 0) return null; // No winning move available

            for (let i = 0; i < piles.length; i++) {
                const targetSize = piles[i] ^ nimSum;
                if (targetSize < piles[i]) {
                    return { pileIndex: i, removeCount: piles[i] - targetSize };
                }
            }
            return null;
        }

        function render() {
            const container = document.getElementById('pilesContainer');
            container.innerHTML = '';

            piles.forEach((count, index) => {
                const pileDiv = document.createElement('div');
                pileDiv.className = 'pile';
                if (selectedPile === index) pileDiv.style.borderColor = '#64b5f6';

                const label = document.createElement('div');
                label.className = 'pile-label';
                label.textContent = `Pile ${index + 1}`;

                const objects = document.createElement('div');
                objects.className = 'pile-objects';
                for (let i = 0; i < count; i++) {
                    const obj = document.createElement('div');
                    obj.className = 'object';
                    objects.appendChild(obj);
                }

                const input = document.createElement('div');
                input.className = 'pile-input';

                const inputField = document.createElement('input');
                inputField.type = 'number';
                inputField.min = '1';
                inputField.max = count;
                inputField.value = '1';
                inputField.disabled = !playerTurn || gameOver || selectedPile !== index;

                const takeBtn = document.createElement('button');
                takeBtn.textContent = 'Take';
                takeBtn.disabled = !playerTurn || gameOver || selectedPile !== index;
                takeBtn.onclick = () => playerMove(index, parseInt(inputField.value));

                input.appendChild(inputField);
                input.appendChild(takeBtn);

                pileDiv.appendChild(label);
                pileDiv.appendChild(objects);
                pileDiv.appendChild(input);

                pileDiv.onclick = () => selectPile(index);

                container.appendChild(pileDiv);
            });

            updateStats();
        }

        function selectPile(index) {
            if (!gameOver && playerTurn) {
                selectedPile = selectedPile === index ? null : index;
                render();
            }
        }

        function playerMove(pileIndex, count) {
            if (count < 1 || count > piles[pileIndex] || gameOver) return;

            piles[pileIndex] -= count;
            selectedPile = null;

            if (isGameOver()) {
                playerTurn ? showGameOver('You took the last object! You lose.') : showGameOver('AI took the last object. You win!');
                return;
            }

            playerTurn = false;
            updateStatus();
            render();
            setTimeout(aiMove, 800);
        }

        function aiMove() {
            const nimSum = calculateNimSum(piles);

            let move = null;
            if (difficulty === 'easy' && Math.random() < 0.5) {
                // Random move
                const validPiles = piles.map((p, i) => p > 0 ? i : -1).filter(i => i !== -1);
                const pileIdx = validPiles[Math.floor(Math.random() * validPiles.length)];
                const removeCount = Math.floor(Math.random() * piles[pileIdx]) + 1;
                move = { pileIndex: pileIdx, removeCount };
            } else {
                // Perfect play
                move = findWinningMove(piles);
                if (!move) {
                    const validPiles = piles.map((p, i) => p > 0 ? i : -1).filter(i => i !== -1);
                    const pileIdx = validPiles[Math.floor(Math.random() * validPiles.length)];
                    move = { pileIndex: pileIdx, removeCount: 1 };
                }
            }

            if (move) {
                piles[move.pileIndex] -= move.removeCount;
                const commentary = getAICommentary(nimSum, move);
                updateStatus(`AI removed ${move.removeCount} from Pile ${move.pileIndex + 1}. ${commentary}`);

                if (isGameOver()) {
                    playerTurn ? showGameOver('AI took the last object. AI wins!') : showGameOver('You took the last object! You lose.');
                    return;
                }

                playerTurn = true;
                selectedPile = null;
                render();
            }
        }

        function getAICommentary(previousNimSum, move) {
            if (difficulty === 'easy') return '';
            const newNimSum = calculateNimSum(piles);
            if (newNimSum === 0) {
                return difficulty === 'hard' ? '(Setting nim-sum to 0. Your move is now losing.)' : '';
            }
            return '';
        }

        function isGameOver() {
            return piles.every(p => p === 0);
        }

        function showGameOver(message) {
            gameOver = true;
            const container = document.getElementById('gameOverContainer');
            container.innerHTML = `
                <div class="game-over">
                    <h2>${message.includes('win') ? '🎉 Victory!' : '💀 Defeated'}</h2>
                    <p>${message}</p>
                    <p style="font-size: 0.85em; color: #b099ff;">Nim is a "solved" game. With perfect play, the outcome depends on nim-sum.</p>
                </div>
            `;
            render();
        }

        function updateStatus(customText = null) {
            if (customText) {
                document.getElementById('statusText').textContent = customText;
                document.getElementById('statusDetail').textContent = playerTurn ? 'Your turn. Pick a pile.' : 'AI is thinking...';
            } else {
                if (playerTurn) {
                    document.getElementById('statusText').textContent = 'Your turn.';
                    document.getElementById('statusDetail').textContent = 'Select a pile and choose how many objects to remove.';
                } else {
                    document.getElementById('statusText').textContent = '🤖 AI is moving...';
                    document.getElementById('statusDetail').textContent = 'Computing optimal play.';
                }
            }
        }

        function updateStats() {
            const nimSum = calculateNimSum(piles);
            const total = piles.reduce((a, b) => a + b, 0);
            const pos = getPosition(nimSum);

            document.getElementById('nimSum').textContent = nimSum;
            document.getElementById('totalObjects').textContent = total;
            document.getElementById('position').textContent = pos;

            let explanation = `Nim-Sum = ${nimSum} (${nimSum === 0 ? 'losing' : 'winning'} position for you with perfect play).`;
            document.getElementById('nimSumExplanation').textContent = explanation;
        }

        function startNewGame() {
            piles = [3, 5, 7];
            gameOver = false;
            playerTurn = true;
            selectedPile = null;
            document.getElementById('gameOverContainer').innerHTML = '';
            updateStatus();
            render();
        }

        function changeDifficulty() {
            difficulty = document.getElementById('difficulty').value;
        }

        function toggleRules() {
            alert('Nim Rules:\n\n1. Players alternate removing any number of objects from a single pile.\n2. The player forced to take the last object LOSES.\n3. The AI uses nim-sum (XOR) to play perfectly.\n4. When nim-sum = 0, that position is losing (with best play).\n\nStrategy: Try to always leave the AI with nim-sum = 0!');
        }

        startNewGame();
    </script>
</body>
</html>
