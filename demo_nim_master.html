<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nim Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0a1428 0%, #0f1f3c 100%);
            color: #e0e7ff;
            font-family: 'Space Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: #0a1428;
            border: 2px solid #4da8da;
            border-radius: 12px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 0 30px rgba(77, 168, 218, 0.2);
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3em;
            text-align: center;
            color: #4da8da;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(77, 168, 218, 0.5);
        }
        
        .subtitle {
            text-align: center;
            color: #a0aec0;
            margin-bottom: 30px;
            font-size: 0.95em;
        }
        
        .game-board {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin: 40px 0;
            flex-wrap: wrap;
        }
        
        .pile {
            text-align: center;
            flex: 1;
            min-width: 120px;
        }
        
        .pile-label {
            font-size: 1.2em;
            color: #fbbf24;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .objects {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            min-height: 200px;
            align-content: flex-start;
            background: rgba(15, 31, 60, 0.5);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #1f4d7f;
        }
        
        .object {
            width: 30px;
            height: 30px;
            background: #4da8da;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0a1428;
            font-weight: bold;
            font-size: 1.2em;
            box-shadow: 0 0 8px rgba(77, 168, 218, 0.6);
        }
        
        .count-display {
            margin-top: 15px;
            font-size: 1.1em;
            color: #cbd5e1;
            font-weight: bold;
        }
        
        .game-state {
            background: rgba(15, 31, 60, 0.7);
            border: 1px solid #1f4d7f;
            border-radius: 8px;
            padding: 20px;
            margin: 30px 0;
            text-align: center;
        }
        
        .status {
            font-size: 1.3em;
            color: #4da8da;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .last-move {
            color: #a0aec0;
            font-size: 0.95em;
            margin-top: 10px;
        }
        
        .game-over {
            background: rgba(20, 40, 70, 0.9);
            border: 2px solid #00ff88;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            margin: 30px 0;
        }
        
        .winner {
            font-family: 'Playfair Display', serif;
            font-size: 2.5em;
            color: #00ff88;
            margin: 20px 0;
        }
        
        .loser {
            font-family: 'Playfair Display', serif;
            font-size: 2.5em;
            color: #ff6b6b;
            margin: 20px 0;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin: 30px 0;
            justify-content: center;
        }
        
        select, input, button {
            padding: 10px 15px;
            font-family: 'Space Mono', monospace;
            border: 1px solid #4da8da;
            border-radius: 6px;
            background: #0f1f3c;
            color: #e0e7ff;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        select:hover, input:hover, button:hover {
            border-color: #fbbf24;
            box-shadow: 0 0 8px rgba(251, 191, 36, 0.3);
        }
        
        button {
            background: #4da8da;
            color: #0a1428;
            font-weight: bold;
            min-width: 150px;
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .info-panel {
            background: rgba(15, 31, 60, 0.7);
            border: 1px solid #1f4d7f;
            border-radius: 8px;
            padding: 20px;
            margin: 30px 0;
        }
        
        .toggle-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            cursor: pointer;
        }
        
        .toggle-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .nim-sum-display {
            background: rgba(5, 15, 35, 0.7);
            border-left: 3px solid #fbbf24;
            padding: 15px;
            border-radius: 4px;
            margin-top: 10px;
            font-family: 'Space Mono', monospace;
        }
        
        .ai-reasoning {
            background: rgba(5, 15, 35, 0.7);
            border-left: 3px solid #00ff88;
            padding: 15px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 0.9em;
            line-height: 1.6;
        }
        
        .new-game-btn {
            background: #fbbf24;
            color: #0a1428;
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 200px;
        }
        
        .new-game-btn:hover {
            background: #f59e0b;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .game-board {
                gap: 10px;
            }
            
            .pile {
                min-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>♟️ Nim Master</h1>
        <p class="subtitle">Beat the AI at this ancient mathematical game</p>
        
        <div class="game-board" id="gameBoard"></div>
        
        <div class="game-state">
            <div class="status" id="status">Your Turn</div>
            <div class="last-move" id="lastMove"></div>
        </div>
        
        <div id="gameOverDiv" style="display: none;" class="game-over">
            <div id="outcomeText"></div>
            <button class="new-game-btn" onclick="resetGame()">Play Again</button>
        </div>
        
        <div id="activeGameControls">
            <div class="controls">
                <select id="pileSelect" onchange="updateMoveInput()">
                    <option value="">Select a pile</option>
                    <option value="0">Pile 1</option>
                    <option value="1">Pile 2</option>
                    <option value="2">Pile 3</option>
                </select>
                <input type="number" id="countInput" min="1" max="10" placeholder="How many?" value="1">
                <button onclick="makeMove()">Make Move</button>
            </div>
            
            <div class="info-panel">
                <label class="toggle-label">
                    <input type="checkbox" class="toggle-checkbox" id="nimSumToggle" onchange="toggleNimSum()">
                    <span>Show Nim-Sum (educational)</span>
                </label>
                <div id="nimSumPanel" style="display: none;" class="nim-sum-display">
                    <div><strong>Nim-Sum:</strong> <span id="nimSumValue"></span></div>
                    <div id="nimSumExplanation" style="margin-top: 8px; color: #a0aec0; font-size: 0.9em;"></div>
                </div>
                <div id="aiReasoningPanel" style="display: none;" class="ai-reasoning">
                    <strong>AI's Move Logic:</strong>
                    <div id="aiReasoning" style="margin-top: 8px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Game state
        let piles = [3, 4, 5];
        let isPlayerTurn = true;
        let gameOver = false;
        let moveHistory = [];

        // Initialize game
        function init() {
            renderPiles();
            updateStatus();
        }

        // Render piles
        function renderPiles() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            piles.forEach((count, idx) => {
                const pile = document.createElement('div');
                pile.className = 'pile';
                pile.innerHTML = `
                    <div class="pile-label">Pile ${idx + 1}</div>
                    <div class="objects" id="pile${idx}">
                        ${Array(count).fill('●').map(o => `<div class="object">●</div>`).join('')}
                    </div>
                    <div class="count-display">${count} object${count !== 1 ? 's' : ''}</div>
                `;
                board.appendChild(pile);
            });
            
            if (document.getElementById('nimSumToggle').checked) {
                updateNimSum();
            }
        }

        // Calculate nim-sum (XOR of all piles)
        function calculateNimSum() {
            return piles.reduce((acc, p) => acc ^ p, 0);
        }

        // Update nim-sum display
        function updateNimSum() {
            const nimSum = calculateNimSum();
            const parts = piles.map(p => p.toString(2).padStart(3, '0')).join(' ⊕ ');
            const result = nimSum.toString(2);
            document.getElementById('nimSumValue').textContent = `${parts} = ${result} (${nimSum})`;
            
            if (nimSum === 0) {
                document.getElementById('nimSumExplanation').textContent = '✓ Nim-sum = 0: You are in a LOSING position. Any move you make will give the AI a winning position.';
                document.getElementById('nimSumExplanation').style.color = '#ff6b6b';
            } else {
                document.getElementById('nimSumExplanation').textContent = '✗ Nim-sum ≠ 0: You are in a WINNING position. A perfect move exists that puts the AI in losing position.';
                document.getElementById('nimSumExplanation').style.color = '#00ff88';
            }
        }

        // Toggle nim-sum display
        function toggleNimSum() {
            const panel = document.getElementById('nimSumPanel');
            const isChecked = document.getElementById('nimSumToggle').checked;
            panel.style.display = isChecked ? 'block' : 'none';
            if (isChecked && !gameOver) {
                updateNimSum();
            }
        }

        // Update status text
        function updateStatus() {
            const status = document.getElementById('status');
            if (gameOver) {
                return;
            }
            status.textContent = isPlayerTurn ? '🎮 Your Turn' : '🤖 AI is thinking...';
        }

        // Update move input max
        function updateMoveInput() {
            const pileIdx = parseInt(document.getElementById('pileSelect').value);
            if (pileIdx !== '' && pileIdx >= 0) {
                document.getElementById('countInput').max = piles[pileIdx];
                document.getElementById('countInput').value = 1;
            }
        }

        // Make player move
        function makeMove() {
            if (!isPlayerTurn || gameOver) return;
            
            const pileIdx = parseInt(document.getElementById('pileSelect').value);
            const count = parseInt(document.getElementById('countInput').value);
            
            if (pileIdx === '' || isNaN(pileIdx) || pileIdx < 0 || pileIdx > 2) {
                alert('Please select a pile');
                return;
            }
            
            if (isNaN(count) || count < 1 || count > piles[pileIdx]) {
                alert(`Please take 1–${piles[pileIdx]} objects`);
                return;
            }
            
            piles[pileIdx] -= count;
            moveHistory.push(`You took ${count} from Pile ${pileIdx + 1}`);
            document.getElementById('lastMove').textContent = `You took ${count} from Pile ${pileIdx + 1}, leaving [${piles.join(', ')}]`;
            
            // Check if player won
            if (piles.every(p => p === 0)) {
                endGame(false);
                return;
            }
            
            renderPiles();
            isPlayerTurn = false;
            updateStatus();
            
            // Reset controls
            document.getElementById('pileSelect').value = '';
            document.getElementById('countInput').value = '1';
            
            // AI move after short delay
            setTimeout(aiMove, 1000);
        }

        // AI move (nim-sum strategy)
        function aiMove() {
            if (isPlayerTurn || gameOver) return;
            
            const nimSum = calculateNimSum();
            let bestMove = null;
            let reasoning = '';
            
            // Try to find move that makes nim-sum = 0
            for (let i = 0; i < 3; i++) {
                for (let take = 1; take <= piles[i]; take++) {
                    const newPiles = [...piles];
                    newPiles[i] -= take;
                    const newNimSum = newPiles.reduce((acc, p) => acc ^ p, 0);
                    
                    if (newNimSum === 0) {
                        bestMove = { pile: i, count: take };
                        break;
                    }
                }
                if (bestMove) break;
            }
            
            // If no winning move found, take from largest pile
            if (!bestMove) {
                const maxIdx = piles.indexOf(Math.max(...piles));
                const takeCount = piles[maxIdx] > 0 ? piles[maxIdx] - (Math.max(...piles) > 1 ? Math.max(...piles) - 1 : 0) : 1;
                bestMove = { pile: maxIdx, count: takeCount || 1 };
                reasoning = `Nim-sum is not zero yet. Taking from the largest pile.`;
            } else {
                reasoning = `Nim-sum calculation shows this move creates nim-sum = 0, putting you in a losing position.`;
            }
            
            piles[bestMove.pile] -= bestMove.count;
            moveHistory.push(`AI took ${bestMove.count} from Pile ${bestMove.pile + 1}`);
            document.getElementById('lastMove').textContent = `AI took ${bestMove.count} from Pile ${bestMove.pile + 1}, leaving [${piles.join(', ')}]`;
            
            // Show AI reasoning
            const aiReasoningPanel = document.getElementById('aiReasoningPanel');
            aiReasoningPanel.style.display = 'block';
            document.getElementById('aiReasoning').textContent = reasoning;
            
            // Check if AI won
            if (piles.every(p => p === 0)) {
                endGame(true);
                return;
            }
            
            renderPiles();
            isPlayerTurn = true;
            updateStatus();
        }

        // End game
        function endGame(aiWon) {
            gameOver = true;
            const gameOverDiv = document.getElementById('gameOverDiv');
            const outcomeText = document.getElementById('outcomeText');
            
            gameOverDiv.style.display = 'block';
            document.getElementById('activeGameControls').style.display = 'none';
            
            if (aiWon) {
                outcomeText.innerHTML = `<div class="loser">You Lost</div><p style="color: #a0aec0;">The AI mastered the nim-sum strategy. Try again!</p>`;
            } else {
                outcomeText.innerHTML = `<div class="winner">You Won!</div><p style="color: #a0aec0;">You forced the AI to take the last object. Outstanding!</p>`;
            }
        }

        // Reset game
        function resetGame() {
            piles = [3, 4, 5];
            isPlayerTurn = true;
            gameOver = false;
            moveHistory = [];
            
            document.getElementById('gameOverDiv').style.display = 'none';
            document.getElementById('activeGameControls').style.display = 'block';
            document.getElementById('nimSumToggle').checked = false;
            document.getElementById('nimSumPanel').style.display = 'none';
            document.getElementById('aiReasoningPanel').style.display = 'none';
            document.getElementById('pileSelect').value = '';
            document.getElementById('countInput').value = '1';
            
            init();
            updateStatus();
        }

        // Start
        init();
    </script>
</body>
</html>
