<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nim Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #0a1428 0%, #1a2840 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #4da8da;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            color: #4da8da;
            font-size: 48px;
            margin-bottom: 10px;
            letter-spacing: -2px;
        }

        .subtitle {
            text-align: center;
            color: #a0b0d0;
            font-size: 14px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .game-board {
            background: #0a1428;
            border: 1px solid #2a5a8a;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .piles {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .pile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .pile-label {
            color: #4da8da;
            font-weight: bold;
            min-width: 50px;
            font-size: 14px;
        }

        .pile-objects {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1;
            align-items: center;
            min-height: 30px;
        }

        .object {
            width: 24px;
            height: 24px;
            background: #4da8da;
            border-radius: 4px;
            border: 2px solid #7dd3fc;
            box-shadow: 0 0 8px rgba(77, 168, 218, 0.4);
        }

        .pile-count {
            color: #a0b0d0;
            font-weight: bold;
            min-width: 35px;
            text-align: right;
        }

        .control-section {
            background: #0f172a;
            border: 1px solid #2a5a8a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .control-label {
            color: #7dd3fc;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 13px;
            display: block;
        }

        .pile-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .pile-btn {
            background: #1f4d7f;
            border: 2px solid #4da8da;
            color: #4da8da;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            transition: all 0.2s;
        }

        .pile-btn:hover {
            background: #2a6ba0;
            box-shadow: 0 0 12px rgba(77, 168, 218, 0.5);
        }

        .pile-btn.selected {
            background: #4da8da;
            color: #0a1428;
            box-shadow: 0 0 16px rgba(77, 168, 218, 0.8);
        }

        .pile-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .remove-section {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }

        .remove-input {
            flex: 1;
            padding: 8px;
            background: #1f4d7f;
            border: 2px solid #4da8da;
            color: #4da8da;
            border-radius: 4px;
            font-family: 'Space Mono', monospace;
            font-size: 14px;
        }

        .remove-input:focus {
            outline: none;
            box-shadow: 0 0 12px rgba(77, 168, 218, 0.6);
        }

        .btn-primary {
            background: #4da8da;
            border: none;
            color: #0a1428;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn-primary:hover:not(:disabled) {
            background: #7dd3fc;
            box-shadow: 0 0 16px rgba(125, 211, 252, 0.5);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .difficulty-section {
            display: flex;
            gap: 10px;
        }

        .diff-btn {
            flex: 1;
            background: #1f4d7f;
            border: 2px solid #4da8da;
            color: #4da8da;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            transition: all 0.2s;
        }

        .diff-btn:hover {
            background: #2a6ba0;
        }

        .diff-btn.active {
            background: #4da8da;
            color: #0a1428;
        }

        .status {
            background: #0f172a;
            border: 1px solid #2a5a8a;
            border-radius: 8px;
            padding: 15px;
            color: #a0b0d0;
            margin-bottom: 20px;
            line-height: 1.6;
            text-align: center;
        }

        .status.ai-turn {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .status.your-turn {
            border-color: #4da8da;
            color: #4da8da;
        }

        .status.game-over {
            border-color: #ffd700;
            color: #ffd700;
            font-weight: bold;
        }

        .outcome {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .outcome.win {
            color: #51cf66;
        }

        .outcome.lose {
            color: #ff6b6b;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: #1f4d7f;
            border-left: 3px solid #4da8da;
            padding: 10px;
            border-radius: 4px;
            color: #a0b0d0;
        }

        .stat-label {
            font-size: 11px;
            color: #7dd3fc;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 18px;
            color: #4da8da;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 36px;
            }

            .pile-selector {
                grid-template-columns: 1fr;
            }

            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nim Master</h1>
        <div class="subtitle">Beat the Math</div>

        <div id="gameContainer">
            <div class="status your-turn" id="status">Your turn: Pick a pile and remove objects</div>

            <div class="game-board">
                <div class="piles" id="piles"></div>
            </div>

            <div class="control-section">
                <label class="control-label">DIFFICULTY</label>
                <div class="difficulty-section">
                    <button class="diff-btn" data-difficulty="easy">Easy</button>
                    <button class="diff-btn active" data-difficulty="medium">Medium</button>
                    <button class="diff-btn" data-difficulty="hard">Hard</button>
                </div>
            </div>

            <div class="control-section">
                <label class="control-label">YOUR MOVE</label>
                <div class="pile-selector" id="pileSelector"></div>
                <div class="remove-section">
                    <input type="number" id="removeCount" min="1" class="remove-input" placeholder="How many?" disabled>
                    <button class="btn-primary" id="takeBtn" disabled>Take</button>
                </div>
            </div>

            <div class="stats">
                <div class="stat-box">
                    <div class="stat-label">Nim Sum</div>
                    <div class="stat-value" id="nimSum">-</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Objects Left</div>
                    <div class="stat-value" id="objCount">-</div>
                </div>
            </div>

            <button class="btn-primary" id="newGameBtn" style="width: 100%; margin-top: 10px;">New Game</button>
        </div>

        <div id="gameOverContainer" style="display: none;">
            <div class="outcome" id="outcomeText"></div>
            <div class="status game-over" id="gameOverStatus"></div>
            <button class="btn-primary" id="playAgainBtn" style="width: 100%; margin-top: 20px;">Play Again</button>
        </div>
    </div>

    <script>
        // Nim game logic
        class NimGame {
            constructor() {
                this.piles = [3, 5, 7];
                this.selectedPile = null;
                this.difficulty = 'medium';
                this.gameOver = false;
                this.playerWon = null;
                this.moves = [];
            }

            reset() {
                this.piles = [3, 5, 7];
                this.selectedPile = null;
                this.gameOver = false;
                this.playerWon = null;
                this.moves = [];
            }

            getNimSum() {
                return this.piles.reduce((a, b) => a ^ b, 0);
            }

            getTotalObjects() {
                return this.piles.reduce((a, b) => a + b, 0);
            }

            // AI finds the winning move using nim-sum strategy
            findWinningMove() {
                const nimSum = this.getNimSum();

                // If nim-sum is 0, we're in a losing position; make a random move
                if (nimSum === 0) {
                    let pileIdx = -1;
                    let count = -1;
                    do {
                        pileIdx = Math.floor(Math.random() * this.piles.length);
                        count = Math.floor(Math.random() * this.piles[pileIdx]) + 1;
                    } while (this.piles[pileIdx] === 0 || count > this.piles[pileIdx]);
                    return { pileIdx, count };
                }

                // Find a move that makes nim-sum = 0
                for (let pileIdx = 0; pileIdx < this.piles.length; pileIdx++) {
                    const targetSize = this.piles[pileIdx] ^ nimSum;
                    if (targetSize < this.piles[pileIdx]) {
                        const count = this.piles[pileIdx] - targetSize;
                        return { pileIdx, count };
                    }
                }

                return null;
            }

            makeAIMove() {
                const move = this.findWinningMove();
                if (move) {
                    this.piles[move.pileIdx] -= move.count;
                    return move;
                }
                return null;
            }

            makePlayerMove(pileIdx, count) {
                if (pileIdx < 0 || pileIdx >= this.piles.length) return false;
                if (count <= 0 || count > this.piles[pileIdx]) return false;
                this.piles[pileIdx] -= count;
                return true;
            }

            isGameOver() {
                return this.getTotalObjects() === 0;
            }

            checkWin(playerMadeLastMove) {
                // In normal Nim, the player who takes the last object wins
                // The other player loses (because they can't move)
                return playerMadeLastMove;
            }
        }

        // UI Controller
        const game = new NimGame();
        let aiThinking = false;

        function renderGame() {
            const pilesContainer = document.getElementById('piles');
            pilesContainer.innerHTML = '';

            game.piles.forEach((count, idx) => {
                const pileEl = document.createElement('div');
                pileEl.className = 'pile';
                pileEl.innerHTML = `
                    <div class="pile-label">Pile ${idx + 1}</div>
                    <div class="pile-objects" id="pile-${idx}">
                        ${Array(count).fill(0).map(() => '<div class="object"></div>').join('')}
                    </div>
                    <div class="pile-count">${count}</div>
                `;
                pilesContainer.appendChild(pileEl);
            });

            const pileSelector = document.getElementById('pileSelector');
            pileSelector.innerHTML = game.piles.map((_, idx) => `
                <button class="pile-btn ${game.selectedPile === idx ? 'selected' : ''}" 
                    data-pile="${idx}" ${game.gameOver ? 'disabled' : ''}>
                    Pile ${idx + 1} (${game.piles[idx]})
                </button>
            `).join('');

            document.getElementById('nimSum').textContent = game.getNimSum();
            document.getElementById('objCount').textContent = game.getTotalObjects();

            updateStatus();
        }

        function updateStatus() {
            const status = document.getElementById('status');
            if (game.gameOver) {
                status.className = 'status game-over';
                status.textContent = game.playerWon ? '✓ You won!' : 'AI took the last object. You lose.';
            } else if (aiThinking) {
                status.className = 'status ai-turn';
                status.textContent = 'AI is thinking...';
            } else {
                status.className = 'status your-turn';
                status.textContent = 'Your turn: Pick a pile and remove objects';
            }
        }

        function selectPile(idx) {
            if (game.gameOver || aiThinking) return;
            if (game.piles[idx] === 0) return;
            game.selectedPile = idx;
            document.getElementById('removeCount').disabled = false;
            document.getElementById('removeCount').focus();
            document.getElementById('removeCount').value = '';
            document.getElementById('takeBtn').disabled = false;
            renderGame();
        }

        function playerTake() {
            if (game.selectedPile === null) return;
            const count = parseInt(document.getElementById('removeCount').value) || 0;

            if (count <= 0 || count > game.piles[game.selectedPile]) {
                alert('Invalid move');
                return;
            }

            game.makePlayerMove(game.selectedPile, count);
            game.selectedPile = null;
            document.getElementById('removeCount').value = '';
            document.getElementById('removeCount').disabled = true;
            document.getElementById('takeBtn').disabled = true;

            if (game.isGameOver()) {
                game.gameOver = true;
                game.playerWon = true;
                endGame();
                return;
            }

            renderGame();
            aiMove();
        }

        function aiMove() {
            if (game.gameOver) return;
            aiThinking = true;
            updateStatus();

            setTimeout(() => {
                // Determine if AI should play randomly
                const nimSum = game.getNimSum();
                let shouldRandom = false;

                if (game.difficulty === 'easy') {
                    shouldRandom = Math.random() < 0.5;
                } else if (game.difficulty === 'medium') {
                    shouldRandom = false; // Always play winning
                } else if (game.difficulty === 'hard') {
                    shouldRandom = false; // Always play winning (hard is perfect play)
                }

                let move;
                if (shouldRandom && nimSum !== 0) {
                    // Make random move
                    let pileIdx = -1;
                    let count = -1;
                    do {
                        pileIdx = Math.floor(Math.random() * game.piles.length);
                        count = Math.floor(Math.random() * game.piles[pileIdx]) + 1;
                    } while (game.piles[pileIdx] === 0 || count > game.piles[pileIdx]);
                    game.piles[pileIdx] -= count;
                    move = { pileIdx, count };
                } else {
                    move = game.makeAIMove();
                }

                aiThinking = false;

                if (game.isGameOver()) {
                    game.gameOver = true;
                    game.playerWon = false;
                    endGame();
                    return;
                }

                renderGame();
                updateStatus();
            }, 800);
        }

        function endGame() {
            renderGame();
            document.getElementById('gameContainer').style.display = 'none';
            document.getElementById('gameOverContainer').style.display = 'block';

            const outcomeEl = document.getElementById('outcomeText');
            const statusEl = document.getElementById('gameOverStatus');

            if (game.playerWon) {
                outcomeEl.className = 'outcome win';
                outcomeEl.textContent = '🎉 You Won!';
                statusEl.textContent = `You took the last object and beat the AI!`;
            } else {
                outcomeEl.className = 'outcome lose';
                outcomeEl.textContent = '🤖 AI Wins';
                statusEl.textContent = `The AI forced you to take the last object.`;
            }
        }

        function newGame() {
            game.reset();
            document.getElementById('gameContainer').style.display = 'block';
            document.getElementById('gameOverContainer').style.display = 'none';
            renderGame();
        }

        // Event listeners
        document.getElementById('takeBtn').addEventListener('click', playerTake);
        document.getElementById('removeCount').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') playerTake();
        });
        document.getElementById('newGameBtn').addEventListener('click', newGame);
        document.getElementById('playAgainBtn').addEventListener('click', newGame);

        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('pile-btn')) {
                selectPile(parseInt(e.target.dataset.pile));
            }
            if (e.target.classList.contains('diff-btn')) {
                document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                game.difficulty = e.target.dataset.difficulty;
            }
        });

        // Initialize
        renderGame();
    </script>
</body>
</html>
