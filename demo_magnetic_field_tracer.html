<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnetic Field Tracer</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a0f3f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: rgba(26, 15, 63, 0.8);
      border: 2px solid #9d4edd;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(157, 78, 221, 0.3);
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.5rem;
      color: #e0aaff;
      margin-bottom: 10px;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #c77dff;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }
    .canvas-wrapper {
      background: #0a0e27;
      border: 2px solid #9d4edd;
      border-radius: 8px;
      margin-bottom: 30px;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .control-group {
      background: rgba(157, 78, 221, 0.1);
      padding: 15px;
      border-radius: 8px;
      border-left: 3px solid #9d4edd;
    }
    .control-label {
      color: #e0aaff;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .control-value {
      color: #c77dff;
      font-size: 0.9rem;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(90deg, #0a0e27, #9d4edd);
      outline: none;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #e0aaff;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(224, 170, 255, 0.6);
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #e0aaff;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 8px rgba(224, 170, 255, 0.6);
    }
    select {
      width: 100%;
      padding: 8px 12px;
      background: #0a0e27;
      color: #e0aaff;
      border: 2px solid #9d4edd;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      font-size: 0.95rem;
    }
    select option {
      background: #1a0f3f;
      color: #e0aaff;
    }
    .info-bar {
      background: rgba(157, 78, 221, 0.1);
      padding: 15px;
      border-radius: 8px;
      border-left: 3px solid #9d4edd;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }
    .info-item {
      text-align: center;
    }
    .info-label {
      color: #c77dff;
      font-size: 0.85rem;
      margin-bottom: 4px;
    }
    .info-value {
      color: #e0aaff;
      font-weight: 600;
      font-size: 1.1rem;
      font-family: 'Syne', sans-serif;
    }
    .button-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    button {
      padding: 10px 20px;
      background: linear-gradient(135deg, #9d4edd, #c77dff);
      color: #0a0e27;
      border: none;
      border-radius: 6px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(157, 78, 221, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }
      h1 {
        font-size: 2rem;
      }
      .controls {
        grid-template-columns: 1fr;
      }
      .info-bar {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧲 Magnetic Field</h1>
    <p class="subtitle">Real Lorentz force particle physics</p>
    
    <div class="canvas-wrapper">
      <canvas id="canvas"></canvas>
    </div>
    
    <div class="info-bar">
      <div class="info-item">
        <div class="info-label">Cyclotron Frequency</div>
        <div class="info-value" id="cyclotron">0.0 Hz</div>
      </div>
      <div class="info-item">
        <div class="info-label">Active Particles</div>
        <div class="info-value" id="particleCount">0</div>
      </div>
      <div class="info-item">
        <div class="info-label">Avg Speed</div>
        <div class="info-value" id="avgSpeed">0.0 px/s</div>
      </div>
      <div class="info-item">
        <div class="info-label">Field Pattern</div>
        <div class="info-value" id="fieldLabel">Uniform</div>
      </div>
    </div>
    
    <div class="controls">
      <div class="control-group">
        <div class="control-label">
          <span>Magnetic Field Strength</span>
          <span class="control-value" id="bVal">0.015</span>
        </div>
        <input type="range" id="bSlider" min="0.005" max="0.05" step="0.001" value="0.015">
      </div>
      
      <div class="control-group">
        <div class="control-label">
          <span>Particle Velocity</span>
          <span class="control-value" id="vVal">150</span>
        </div>
        <input type="range" id="vSlider" min="50" max="300" step="10" value="150">
      </div>
      
      <div class="control-group">
        <div class="control-label">Particle Count</div>
        <input type="range" id="pSlider" min="3" max="20" step="1" value="8">
        <div class="control-value" id="pVal">8 particles</div>
      </div>
      
      <div class="control-group">
        <div class="control-label">Field Pattern</div>
        <select id="fieldSelect">
          <option value="uniform">Uniform</option>
          <option value="radial">Radial</option>
          <option value="vortex">Vortex</option>
        </select>
      </div>
    </div>
    
    <div class="button-group">
      <button id="playBtn">▶ Play</button>
      <button id="resetBtn">↻ Reset</button>
    </div>
  </div>
  
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let animationId = null;
    let isPlaying = true;
    
    // Set canvas size
    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = Math.min(rect.width * 0.6, 500);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    // Particle class
    class Particle {
      constructor(x, y, vx, vy) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.trail = [];
        this.color = `hsl(${Math.random() * 60 + 260}, 80%, 60%)`;
        this.maxTrail = 50;
      }
      
      addTrailPoint() {
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > this.maxTrail) {
          this.trail.shift();
        }
      }
      
      update(bx, by, bz, dt) {
        // Lorentz force: F = q(v × B)
        // Assuming q/m = 1 for simplicity, and unit charge
        const ax = (this.vy * bz - 0 * by); // v×B in x
        const ay = (0 * bx - this.vx * bz); // v×B in y
        
        this.vx += ax * dt;
        this.vy += ay * dt;
        
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        
        // Wrap around
        if (this.x < 0) this.x += canvas.width;
        if (this.x > canvas.width) this.x -= canvas.width;
        if (this.y < 0) this.y += canvas.height;
        if (this.y > canvas.height) this.y -= canvas.height;
        
        this.addTrailPoint();
      }
      
      draw() {
        // Trail
        if (this.trail.length > 1) {
          ctx.strokeStyle = this.color.replace('60%', '30%');
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(this.trail[0].x, this.trail[0].y);
          for (let i = 1; i < this.trail.length; i++) {
            ctx.lineTo(this.trail[i].x, this.trail[i].y);
          }
          ctx.stroke();
        }
        
        // Particle
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
        ctx.fill();
        
        // Velocity vector
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        const scale = 0.03;
        ctx.lineTo(this.x + this.vx * scale, this.y + this.vy * scale);
        ctx.stroke();
      }
    }
    
    let particles = [];
    let bStrength = 0.015;
    let velocity = 150;
    let particleCount = 8;
    let fieldType = 'uniform';
    let dt = 0.016; // ~60fps
    
    function initParticles() {
      particles = [];
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const radius = Math.min(canvas.width, canvas.height) * 0.25;
      
      for (let i = 0; i < particleCount; i++) {
        const angle = (i / particleCount) * Math.PI * 2;
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius;
        
        // Initial velocity perpendicular to radius
        const vx = -Math.sin(angle) * velocity;
        const vy = Math.cos(angle) * velocity;
        
        particles.push(new Particle(x, y, vx, vy));
      }
    }
    
    function getMagneticField(x, y) {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const dx = x - cx;
      const dy = y - cy;
      const r = Math.sqrt(dx * dx + dy * dy) + 1;
      
      if (fieldType === 'uniform') {
        return { bx: 0, by: 0, bz: bStrength };
      } else if (fieldType === 'radial') {
        const nx = dx / r;
        const ny = dy / r;
        return { bx: 0, by: 0, bz: bStrength * (0.5 + 0.5 * (r / (canvas.width / 2))) };
      } else if (fieldType === 'vortex') {
        const angle = Math.atan2(dy, dx);
        const bz = bStrength * Math.sin(angle * 3);
        return { bx: 0, by: 0, bz };
      }
      return { bx: 0, by: 0, bz: bStrength };
    }
    
    function update() {
      for (let p of particles) {
        const field = getMagneticField(p.x, p.y);
        p.update(field.bx, field.by, field.bz, dt);
      }
    }
    
    function drawBackground() {
      ctx.fillStyle = '#0a0e27';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Grid
      ctx.strokeStyle = 'rgba(157, 78, 221, 0.1)';
      ctx.lineWidth = 0.5;
      const gridSize = 50;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }
    
    function drawFieldIndicator() {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const arrowLen = 40;
      
      ctx.fillStyle = 'rgba(224, 170, 255, 0.3)';
      ctx.font = 'bold 12px "Inter"';
      ctx.textAlign = 'center';
      
      if (fieldType === 'uniform') {
        // Draw field into page (⊗ symbol)
        ctx.strokeStyle = 'rgba(224, 170, 255, 0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, 8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx - 4, cy - 4);
        ctx.lineTo(cx + 4, cy + 4);
        ctx.moveTo(cx + 4, cy - 4);
        ctx.lineTo(cx - 4, cy + 4);
        ctx.stroke();
        ctx.fillText('B ⊗', cx, cy - 20);
      }
    }
    
    function draw() {
      drawBackground();
      drawFieldIndicator();
      for (let p of particles) {
        p.draw();
      }
      updateStats();
    }
    
    function updateStats() {
      // Cyclotron frequency: f = qB/(2πm) - for unit charge/mass = B/(2π)
      const freq = (bStrength / (2 * Math.PI)) * 1000; // Scale for visibility
      document.getElementById('cyclotron').textContent = freq.toFixed(2) + ' Hz';
      document.getElementById('particleCount').textContent = particles.length;
      
      let totalSpeed = 0;
      for (let p of particles) {
        const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        totalSpeed += speed;
      }
      const avgSpeed = particles.length > 0 ? (totalSpeed / particles.length).toFixed(1) : 0;
      document.getElementById('avgSpeed').textContent = avgSpeed + ' px/s';
      
      const labels = { uniform: 'Uniform', radial: 'Radial', vortex: 'Vortex' };
      document.getElementById('fieldLabel').textContent = labels[fieldType];
    }
    
    function animate() {
      if (isPlaying) {
        update();
      }
      draw();
      animationId = requestAnimationFrame(animate);
    }
    
    // Event listeners
    document.getElementById('bSlider').addEventListener('input', (e) => {
      bStrength = parseFloat(e.target.value);
      document.getElementById('bVal').textContent = bStrength.toFixed(3);
    });
    
    document.getElementById('vSlider').addEventListener('input', (e) => {
      velocity = parseFloat(e.target.value);
      document.getElementById('vVal').textContent = velocity.toFixed(0);
      initParticles();
    });
    
    document.getElementById('pSlider').addEventListener('input', (e) => {
      particleCount = parseInt(e.target.value);
      document.getElementById('pVal').textContent = particleCount + ' particles';
      initParticles();
    });
    
    document.getElementById('fieldSelect').addEventListener('change', (e) => {
      fieldType = e.target.value;
    });
    
    document.getElementById('playBtn').addEventListener('click', () => {
      isPlaying = !isPlaying;
      document.getElementById('playBtn').textContent = isPlaying ? '⏸ Pause' : '▶ Play';
    });
    
    document.getElementById('resetBtn').addEventListener('click', () => {
      initParticles();
      isPlaying = true;
      document.getElementById('playBtn').textContent = '⏸ Pause';
    });
    
    // Initialize
    initParticles();
    animate();
  </script>
</body>
</html>
