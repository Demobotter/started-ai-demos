<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetic Field Tracer</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a0033 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(13, 27, 61, 0.7);
            border: 1px solid #9d4edd;
            border-radius: 12px;
            padding: 40px;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.2em;
            margin-bottom: 10px;
            color: #e0aaff;
        }
        .subtitle {
            font-size: 0.85em;
            color: #c77dff;
            margin-bottom: 25px;
            opacity: 0.9;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.8em;
            font-weight: 600;
            color: #c77dff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(157, 78, 221, 0.2);
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #e0aaff;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(224, 170, 255, 0.6);
        }
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #e0aaff;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 8px rgba(224, 170, 255, 0.6);
        }
        .value-display {
            font-size: 0.9em;
            color: #e0aaff;
            margin-top: 5px;
            font-weight: 600;
        }
        .button-group {
            display: flex;
            gap: 10px;
            grid-column: 1 / -1;
        }
        button {
            flex: 1;
            padding: 12px;
            border: 1px solid #9d4edd;
            border-radius: 6px;
            background: rgba(157, 78, 221, 0.2);
            color: #e0aaff;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: 'Inter', sans-serif;
        }
        button:hover {
            background: rgba(224, 170, 255, 0.2);
            border-color: #e0aaff;
            box-shadow: 0 0 12px rgba(224, 170, 255, 0.3);
        }
        button.active {
            background: rgba(224, 170, 255, 0.4);
            border-color: #e0aaff;
        }
        .canvas-container {
            background: rgba(10, 14, 39, 0.9);
            border: 1px solid #9d4edd;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 4px;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }
        .stat {
            background: rgba(157, 78, 221, 0.15);
            border: 1px solid #9d4edd;
            border-radius: 6px;
            padding: 12px;
            text-align: center;
        }
        .stat-label {
            font-size: 0.75em;
            color: #c77dff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            opacity: 0.9;
        }
        .stat-value {
            font-family: 'Syne', sans-serif;
            font-size: 1.3em;
            color: #e0aaff;
            font-weight: 700;
        }
        @media (max-width: 600px) {
            .container { padding: 25px; }
            h1 { font-size: 1.8em; }
            .controls { grid-template-columns: 1fr; }
            .button-group { flex-direction: column; }
            .stats { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧲 Magnetic Field Tracer</h1>
        <p class="subtitle">Watch charged particles spiral in real Lorentz force fields</p>

        <div class="controls">
            <div class="control-group">
                <label>Magnetic Strength</label>
                <input type="range" id="magneticField" min="0.01" max="0.5" step="0.01" value="0.15">
                <div class="value-display" id="magValue">0.15</div>
            </div>
            <div class="control-group">
                <label>Particle Velocity</label>
                <input type="range" id="velocity" min="1" max="8" step="0.5" value="4">
                <div class="value-display" id="velValue">4.0</div>
            </div>
            <div class="control-group">
                <label>Field Pattern</label>
                <select id="fieldType" style="padding: 10px; border-radius: 6px; background: rgba(157, 78, 221, 0.3); border: 1px solid #9d4edd; color: #e0aaff; font-family: 'Inter', sans-serif; cursor: pointer;">
                    <option value="uniform">Uniform</option>
                    <option value="radial">Radial</option>
                    <option value="vortex">Vortex</option>
                </select>
            </div>
            <div class="control-group">
                <label>Particle Count</label>
                <input type="range" id="particleCount" min="3" max="20" step="1" value="8">
                <div class="value-display" id="countValue">8</div>
            </div>
            <div class="button-group">
                <button id="playBtn" class="active">▶ Play</button>
                <button id="pauseBtn">⏸ Pause</button>
                <button id="resetBtn">⟳ Reset</button>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="fieldCanvas" width="700" height="400"></canvas>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-label">Particles</div>
                <div class="stat-value" id="activeParticles">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Rotation Freq</div>
                <div class="stat-value" id="rotationFreq">0.00 Hz</div>
            </div>
            <div class="stat">
                <div class="stat-label">Field Type</div>
                <div class="stat-value" id="fieldDisplay">Uniform</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('fieldCanvas');
        const ctx = canvas.getContext('2d');

        let state = {
            magneticField: 0.15,
            velocity: 4,
            fieldType: 'uniform',
            particleCount: 8,
            playing: true,
            time: 0,
            particles: []
        };

        class Particle {
            constructor(x, y, angle, speed) {
                this.x = x;
                this.y = y;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.trail = [];
                this.color = `hsl(${angle * 180 / Math.PI}, 100%, 60%)`;
            }

            step(dt, B, fieldType, centerX, centerY) {
                // Calculate magnetic field based on type
                let Bx = 0, By = 0, Bz = B;

                if (fieldType === 'radial') {
                    const dx = this.x - centerX;
                    const dy = this.y - centerY;
                    const r = Math.sqrt(dx * dx + dy * dy) + 1;
                    Bz = B * (200 / r);
                } else if (fieldType === 'vortex') {
                    const dx = this.x - centerX;
                    const dy = this.y - centerY;
                    const r = Math.sqrt(dx * dx + dy * dy) + 1;
                    const theta = Math.atan2(dy, dx);
                    Bx = B * Math.sin(theta) * (200 / r);
                    By = B * Math.cos(theta) * (200 / r);
                }

                // Lorentz force: F = q(v × B)
                const ax = (this.vy * Bz - 0 * By) * 0.01;
                const ay = (0 * Bx - this.vx * Bz) * 0.01;

                this.vx += ax * dt;
                this.vy += ay * dt;

                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > 0) {
                    const maxSpeed = state.velocity;
                    if (speed > maxSpeed) {
                        this.vx = (this.vx / speed) * maxSpeed;
                        this.vy = (this.vy / speed) * maxSpeed;
                    }
                }

                this.x += this.vx * dt;
                this.y += this.vy * dt;

                // Bounce off walls
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                this.x = Math.max(0, Math.min(canvas.width, this.x));
                this.y = Math.max(0, Math.min(canvas.height, this.y));

                this.trail.push({x: this.x, y: this.y});
                if (this.trail.length > 50) this.trail.shift();
            }

            draw(ctx) {
                if (this.trail.length > 1) {
                    ctx.strokeStyle = this.color;
                    ctx.globalAlpha = 0.4;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(this.trail[0].x, this.trail[0].y);
                    for (let i = 1; i < this.trail.length; i++) {
                        ctx.lineTo(this.trail[i].x, this.trail[i].y);
                    }
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                }

                // Particle
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fill();

                // Velocity vector
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 1;
                ctx.globalAlpha = 0.6;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + this.vx * 3, this.y + this.vy * 3);
                ctx.stroke();
                ctx.globalAlpha = 1;
            }
        }

        function initParticles() {
            state.particles = [];
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const radius = 80;

            for (let i = 0; i < state.particleCount; i++) {
                const angle = (i / state.particleCount) * Math.PI * 2;
                const px = cx + Math.cos(angle) * radius;
                const py = cy + Math.sin(angle) * radius;
                const vel_angle = angle + Math.PI / 2;
                state.particles.push(new Particle(px, py, vel_angle, state.velocity));
            }
        }

        function drawFieldVisualization() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            ctx.fillStyle = 'rgba(10, 14, 39, 0.95)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (state.fieldType === 'uniform') {
                // Draw grid to show uniform field
                ctx.strokeStyle = 'rgba(157, 78, 221, 0.1)';
                ctx.lineWidth = 1;
                for (let x = 0; x < canvas.width; x += 40) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                for (let y = 0; y < canvas.height; y += 40) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
            } else if (state.fieldType === 'radial') {
                // Concentric circles for radial field
                ctx.strokeStyle = 'rgba(157, 78, 221, 0.15)';
                ctx.lineWidth = 1;
                for (let r = 40; r < 300; r += 40) {
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.stroke();
                }
            } else if (state.fieldType === 'vortex') {
                // Spiral for vortex field
                ctx.strokeStyle = 'rgba(157, 78, 221, 0.15)';
                ctx.lineWidth = 1;
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    for (let angle = 0; angle < Math.PI * 6; angle += 0.1) {
                        const r = 20 + angle * 10;
                        const x = cx + Math.cos(angle + i * 2) * r;
                        const y = cy + Math.sin(angle + i * 2) * r;
                        if (angle === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }
            }
        }

        function animate() {
            drawFieldVisualization();

            if (state.playing) {
                const dt = 0.03;
                for (let p of state.particles) {
                    p.step(dt, state.magneticField, state.fieldType, canvas.width / 2, canvas.height / 2);
                }
                state.time += dt;
            }

            for (let p of state.particles) {
                p.draw(ctx);
            }

            // Update stats
            const cyclotronFreq = state.magneticField * 100;
            document.getElementById('activeParticles').textContent = state.particles.length;
            document.getElementById('rotationFreq').textContent = cyclotronFreq.toFixed(2) + ' Hz';
            document.getElementById('fieldDisplay').textContent = state.fieldType.charAt(0).toUpperCase() + state.fieldType.slice(1);

            requestAnimationFrame(animate);
        }

        // Event listeners
        document.getElementById('magneticField').addEventListener('input', (e) => {
            state.magneticField = parseFloat(e.target.value);
            document.getElementById('magValue').textContent = state.magneticField.toFixed(2);
        });

        document.getElementById('velocity').addEventListener('input', (e) => {
            state.velocity = parseFloat(e.target.value);
            document.getElementById('velValue').textContent = state.velocity.toFixed(1);
            for (let p of state.particles) {
                const speed = Math.sqrt(p.vx ** 2 + p.vy ** 2);
                if (speed > 0) {
                    p.vx = (p.vx / speed) * state.velocity;
                    p.vy = (p.vy / speed) * state.velocity;
                }
            }
        });

        document.getElementById('fieldType').addEventListener('change', (e) => {
            state.fieldType = e.target.value;
            initParticles();
        });

        document.getElementById('particleCount').addEventListener('input', (e) => {
            state.particleCount = parseInt(e.target.value);
            document.getElementById('countValue').textContent = state.particleCount;
            initParticles();
        });

        document.getElementById('playBtn').addEventListener('click', () => {
            state.playing = true;
            document.getElementById('playBtn').classList.add('active');
            document.getElementById('pauseBtn').classList.remove('active');
        });

        document.getElementById('pauseBtn').addEventListener('click', () => {
            state.playing = false;
            document.getElementById('playBtn').classList.remove('active');
            document.getElementById('pauseBtn').classList.add('active');
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            initParticles();
            state.time = 0;
        });

        // Initialize
        initParticles();
        animate();
    </script>
</body>
</html>
