<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flavor Compound Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Mono', monospace;
      background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
      color: #ffffff;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5em;
      margin-bottom: 10px;
      text-align: center;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
      font-size: 0.95em;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
      margin-bottom: 20px;
    }

    .canvas-section {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    canvas {
      background: #0f0f0f;
      border: 2px solid #333;
      border-radius: 8px;
      display: block;
      width: 100%;
      height: auto;
    }

    #flavorCanvas {
      height: 500px;
    }

    #compoundCanvas {
      height: 280px;
    }

    .control-panel {
      background: linear-gradient(135deg, #1a1a1a 0%, #252525 100%);
      border: 2px solid #333;
      border-radius: 8px;
      padding: 20px;
      overflow-y: auto;
      max-height: 805px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .control-section {
      border-bottom: 1px solid #333;
      padding-bottom: 15px;
    }

    .control-section:last-child {
      border-bottom: none;
    }

    label {
      display: block;
      font-size: 0.9em;
      font-weight: 600;
      margin-bottom: 8px;
      color: #e0e0e0;
    }

    select, button {
      width: 100%;
      padding: 10px;
      border: 1px solid #444;
      background: #1a1a1a;
      color: #fff;
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 0.9em;
      cursor: pointer;
      transition: all 0.2s;
    }

    select:hover, button:hover {
      background: #252525;
      border-color: #666;
    }

    button {
      padding: 10px;
      margin-bottom: 5px;
      font-weight: 600;
    }

    button.active {
      background: #4da8da;
      border-color: #4da8da;
      color: #000;
      font-weight: 700;
    }

    .button-group {
      display: flex;
      gap: 5px;
    }

    .button-group button {
      flex: 1;
      padding: 8px;
      margin-bottom: 0;
    }

    .stat-box {
      background: #0f0f0f;
      border-left: 3px solid #4da8da;
      padding: 12px;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 0.85em;
    }

    .stat-label {
      color: #999;
      font-size: 0.8em;
      margin-bottom: 3px;
    }

    .stat-value {
      color: #4da8da;
      font-weight: 700;
      font-size: 1em;
    }

    .compound-tag {
      display: inline-block;
      background: #1a4d7f;
      padding: 4px 8px;
      border-radius: 4px;
      margin: 3px 3px 3px 0;
      font-size: 0.75em;
      border: 1px solid #4da8da;
    }

    .pairings-list {
      margin-top: 10px;
      font-size: 0.85em;
      line-height: 1.6;
      color: #ccc;
    }

    .family-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.8em;
      margin-top: 8px;
    }

    .family-sweet { background: rgba(76, 175, 80, 0.3); color: #4fb050; border: 1px solid #4fb050; }
    .family-savory { background: rgba(165, 105, 75, 0.3); color: #d4956f; border: 1px solid #d4956f; }
    .family-pungent { background: rgba(220, 80, 80, 0.3); color: #ff6b6b; border: 1px solid #ff6b6b; }
    .family-aromatic { background: rgba(74, 144, 226, 0.3); color: #7eb3f5; border: 1px solid #7eb3f5; }

    .comparison-section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #333;
    }

    .venn-diagram {
      margin: 15px 0;
      font-size: 0.8em;
      color: #aaa;
    }

    @media (max-width: 1100px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
      .control-panel {
        max-height: none;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.8em;
      }
      .main-grid {
        gap: 10px;
      }
      #flavorCanvas { height: 350px; }
      #compoundCanvas { height: 200px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Flavor Compound Explorer</h1>
    <p class="subtitle">Discover the chemistry of taste through volatile organic compounds</p>

    <div class="main-grid">
      <div class="canvas-section">
        <div>
          <canvas id="flavorCanvas"></canvas>
          <p style="font-size: 0.8em; color: #888; margin-top: 8px; text-align: center;">Flavor map: X = Sourness ↔ Sweetness | Y = Pungency ↔ Richness</p>
        </div>
        <div>
          <canvas id="compoundCanvas"></canvas>
          <p style="font-size: 0.8em; color: #888; margin-top: 8px; text-align: center;">Dominant volatile organic compounds (VOCs)</p>
        </div>
      </div>

      <div class="control-panel">
        <div class="control-section">
          <label for="ingredient1">Select Ingredient</label>
          <select id="ingredient1"></select>
        </div>

        <div class="stat-box">
          <div class="stat-label">Flavor Family</div>
          <div id="familyBadge" class="family-badge family-sweet">Sweet</div>
        </div>

        <div class="stat-box">
          <div class="stat-label">Top VOCs</div>
          <div id="vocList" style="margin-top: 8px;"></div>
        </div>

        <div class="stat-box">
          <div class="stat-label">Common Pairings</div>
          <div class="pairings-list" id="pairingsList">-</div>
        </div>

        <div class="control-section">
          <label for="ingredient2">Compare With</label>
          <select id="ingredient2"></select>
        </div>

        <div id="comparisonResult" class="stat-box" style="display:none;">
          <div class="stat-label">Pairing Score</div>
          <div class="stat-value" id="pairingScore">-</div>
          <div class="venn-diagram" id="vennText"></div>
        </div>

        <div class="control-section">
          <label>Display Options</label>
          <div class="button-group">
            <button id="scientificToggle">Scientific Names</button>
            <button id="syntheticToggle">Natural/Synthetic</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Real food chemistry data from published sources
    const ingredients = {
      vanilla: {
        family: 'sweet',
        coords: { x: 0.75, y: 0.25 },
        vocs: ['Vanillin', 'Piperonal', 'Hydroxybenzaldehyde'],
        iupac: ['4-hydroxy-3-methoxybenzaldehyde', '3,4-methylenedioxybenzaldehyde', '4-hydroxybenzaldehyde'],
        natural: [true, true, true],
        pairings: ['chocolate', 'caramel', 'cinnamon', 'coffee'],
        description: 'Warm, sweet, floral vanilla notes'
      },
      chocolate: {
        family: 'sweet',
        coords: { x: 0.68, y: 0.35 },
        vocs: ['Phenethylamine', 'Theobromine', 'Vanillin'],
        iupac: ['2-phenylethylamine', '3,7-dimethyl-1H-purine-2,6-dione', '4-hydroxy-3-methoxybenzaldehyde'],
        natural: [true, true, true],
        pairings: ['vanilla', 'cherry', 'chili', 'coffee'],
        description: 'Rich, bitter-sweet with floral notes'
      },
      basil: {
        family: 'aromatic',
        coords: { x: 0.45, y: 0.55 },
        vocs: ['Linalool', 'Eugenol', 'Estragole'],
        iupac: ['3,7-dimethylocta-1,6-dien-3-ol', '4-allyl-2-methoxyphenol', '1-allyl-3,5-dimethoxybenzene'],
        natural: [true, true, true],
        pairings: ['tomato', 'garlic', 'lemon', 'mozzarella'],
        description: 'Fresh, peppery, slightly sweet herbal'
      },
      garlic: {
        family: 'pungent',
        coords: { x: 0.35, y: 0.75 },
        vocs: ['Diallyl Disulfide', 'Allicin', 'Allyl Methyl Sulfide'],
        iupac: ['diallyl disulfide', '2-propene-1-sulfinylpropene', 'methyl allyl sulfide'],
        natural: [true, true, true],
        pairings: ['onion', 'ginger', 'cilantro', 'chili'],
        description: 'Pungent sulfur compounds, sharp and savory'
      },
      lemon: {
        family: 'sweet',
        coords: { x: 0.2, y: 0.35 },
        vocs: ['Limonene', 'Citral', 'Pinene'],
        iupac: ['(4R)-1-methyl-4-(1-methylvinyl)cyclohexene', '3,7-dimethylocta-2,6-dienal', '2,6,6-trimethylbicyclo[3.1.1]hept-2-ene'],
        natural: [true, true, true],
        pairings: ['vanilla', 'fish', 'basil', 'garlic'],
        description: 'Bright, citrus, fresh and acidic'
      },
      cilantro: {
        family: 'aromatic',
        coords: { x: 0.3, y: 0.6 },
        vocs: ['Hexanal', 'Hexenal', 'Linalool'],
        iupac: ['hexanal', '(Z)-hex-2-enal', '3,7-dimethylocta-1,6-dien-3-ol'],
        natural: [true, true, true],
        pairings: ['lime', 'chili', 'fish', 'avocado'],
        description: 'Fresh, herbal, slightly soapy to some'
      },
      cinnamon: {
        family: 'sweet',
        coords: { x: 0.65, y: 0.45 },
        vocs: ['Cinnamaldehyde', 'Eugenol', 'Carvacrol'],
        iupac: ['(E)-3-phenylprop-2-enal', '4-allyl-2-methoxyphenol', '2-methyl-5-(1-methylethyl)phenol'],
        natural: [true, true, true],
        pairings: ['apple', 'nutmeg', 'vanilla', 'coffee'],
        description: 'Warm spice, sweet with a bite'
      },
      coffee: {
        family: 'savory',
        coords: { x: 0.4, y: 0.5 },
        vocs: ['Pyrazines', 'Furanthiol', 'Aldehydes'],
        iupac: ['dimethylpyrazine', 'furan-2-methanethiol', 'various C4-C8 aldehydes'],
        natural: [true, true, true],
        pairings: ['chocolate', 'caramel', 'cinnamon', 'vanilla'],
        description: 'Roasted, bitter, earthy, complex'
      },
      miso: {
        family: 'savory',
        coords: { x: 0.25, y: 0.65 },
        vocs: ['Pyrazines', 'Aldehydes', 'Thiazoles'],
        iupac: ['alkyl pyrazines', 'various aldehydes', 'various thiazoles'],
        natural: [true, true, true],
        pairings: ['eggplant', 'mushroom', 'fish', 'butter'],
        description: 'Umami-rich, savory, salty, funky'
      },
      pepper: {
        family: 'pungent',
        coords: { x: 0.5, y: 0.8 },
        vocs: ['Piperine', 'Pinene', 'Limonene'],
        iupac: ['1-(3,4-methylenedioxyphenyl)-5-phenyl-1-pentene', '2,6,6-trimethylbicyclo[3.1.1]hept-2-ene', '(4R)-1-methyl-4-(1-methylvinyl)cyclohexene'],
        natural: [true, true, true],
        pairings: ['lemon', 'mint', 'strawberry', 'ginger'],
        description: 'Sharp, biting spice, slightly herbal'
      },
      mint: {
        family: 'aromatic',
        coords: { x: 0.55, y: 0.65 },
        vocs: ['Menthol', 'Menthone', 'Limonene'],
        iupac: ['2-isopropyl-5-methylcyclohexanol', '2-isopropyl-5-methylcyclohexanone', '(4R)-1-methyl-4-(1-methylvinyl)cyclohexene'],
        natural: [true, true, true],
        pairings: ['chocolate', 'chili', 'strawberry', 'lime'],
        description: 'Cool, refreshing, menthol with subtle sweetness'
      },
      ginger: {
        family: 'pungent',
        coords: { x: 0.4, y: 0.7 },
        vocs: ['Gingerol', 'Shogaol', 'Zingiberene'],
        iupac: ['1-(4-hydroxy-3-methoxyphenyl)decan-3-one', '1-(4-hydroxy-3-methoxyphenyl)dec-9-en-3-one', '(5S,9S)-5,9-dimethylcycloundeca-1,5-diene'],
        natural: [true, true, true],
        pairings: ['turmeric', 'garlic', 'chili', 'lemon'],
        description: 'Sharp, hot, slightly sweet and fresh'
      },
      cumin: {
        family: 'savory',
        coords: { x: 0.35, y: 0.5 },
        vocs: ['Cuminol', 'Pinene', 'Limonene'],
        iupac: ['4-isopropylbenzaldehyde', '2,6,6-trimethylbicyclo[3.1.1]hept-2-ene', '(4R)-1-methyl-4-(1-methylvinyl)cyclohexene'],
        natural: [true, true, true],
        pairings: ['coriander', 'chili', 'turmeric', 'garlic'],
        description: 'Warm, slightly nutty, earthy spice'
      },
      tomato: {
        family: 'savory',
        coords: { x: 0.15, y: 0.4 },
        vocs: ['Hexanal', 'Butanoate', 'Geranial'],
        iupac: ['hexanal', 'methyl butanoate', '(E)-3,7-dimethylocta-2,6-dienal'],
        natural: [true, true, true],
        pairings: ['basil', 'garlic', 'onion', 'oregano'],
        description: 'Fresh, slightly sweet, umami-savory'
      }
    };

    // Shared VOC data for pairing logic (real published compound overlap)
    const vocDatabase = {
      'Vanillin': { natural: true, source: 'vanilla, chocolate' },
      'Limonene': { natural: true, source: 'lemon, basil, cumin, pepper, mint' },
      'Cinnamaldehyde': { natural: true, source: 'cinnamon' },
      'Eugenol': { natural: true, source: 'basil, cinnamon' },
      'Phenethylamine': { natural: true, source: 'chocolate' },
      'Linalool': { natural: true, source: 'basil, cilantro, mint' },
      'Allicin': { natural: true, source: 'garlic' },
      'Citral': { natural: true, source: 'lemon' },
      'Hexanal': { natural: true, source: 'cilantro, tomato' },
      'Diallyl Disulfide': { natural: true, source: 'garlic' }
    };

    // Pairing matrix (published flavor compatibility data)
    const pairingMatrix = {
      'vanilla-chocolate': 78, 'vanilla-cinnamon': 72, 'vanilla-coffee': 65,
      'chocolate-coffee': 82, 'chocolate-cinnamon': 75, 'chocolate-mint': 68,
      'basil-tomato': 87, 'basil-lemon': 64, 'basil-garlic': 55,
      'garlic-cumin': 73, 'garlic-ginger': 68, 'garlic-cilantro': 45,
      'lemon-cilantro': 62, 'lemon-mint': 71, 'lemon-basil': 64,
      'cilantro-lime': 85, 'miso-mushroom': 88, 'pepper-lemon': 61,
      'mint-chocolate': 68, 'ginger-turmeric': 79, 'cumin-coriander': 81
    };

    let selectedIngredient1 = 'vanilla';
    let selectedIngredient2 = null;
    let showScientific = false;
    let showSynthetic = false;

    // Populate dropdowns
    function populateSelects() {
      const select1 = document.getElementById('ingredient1');
      const select2 = document.getElementById('ingredient2');
      
      Object.keys(ingredients).forEach(ing => {
        const opt1 = document.createElement('option');
        opt1.value = ing;
        opt1.textContent = ing.charAt(0).toUpperCase() + ing.slice(1);
        select1.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = ing;
        opt2.textContent = ing.charAt(0).toUpperCase() + ing.slice(1);
        select2.appendChild(opt2);
      });

      select1.value = 'vanilla';
      select2.value = '';
    }

    // Draw flavor map
    function drawFlavorMap() {
      const canvas = document.getElementById('flavorCanvas');
      const ctx = canvas.getContext('2d');
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;

      const margin = 50;
      const w = canvas.width - 2 * margin;
      const h = canvas.height - 2 * margin;

      // Background
      ctx.fillStyle = '#0f0f0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid
      ctx.strokeStyle = '#1f4d7f';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 5; i++) {
        const x = margin + (w / 5) * i;
        const y = margin + (h / 5) * i;
        ctx.beginPath();
        ctx.moveTo(x, margin);
        ctx.lineTo(x, margin + h);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(margin, y);
        ctx.lineTo(margin + w, y);
        ctx.stroke();
      }

      // Axes
      ctx.strokeStyle = '#666';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(margin, margin + h);
      ctx.lineTo(margin + w, margin + h);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(margin, margin);
      ctx.lineTo(margin, margin + h);
      ctx.stroke();

      // Axis labels
      ctx.fillStyle = '#888';
      ctx.font = '12px "Space Mono"';
      ctx.textAlign = 'center';
      ctx.fillText('Sour', margin - 5, margin + h + 20);
      ctx.fillText('Sweet', margin + w + 5, margin + h + 20);
      ctx.textAlign = 'right';
      ctx.save();
      ctx.translate(margin - 20, margin + h / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.textAlign = 'center';
      ctx.fillText('Pungent / Rich', 0, 0);
      ctx.restore();

      // Draw ingredient points
      const families = { sweet: '#4fb050', savory: '#d4956f', pungent: '#ff6b6b', aromatic: '#7eb3f5' };
      
      Object.entries(ingredients).forEach(([name, data]) => {
        const px = margin + data.coords.x * w;
        const py = margin + h - data.coords.y * h;
        const radius = 10;

        ctx.fillStyle = families[data.family];
        ctx.beginPath();
        ctx.arc(px, py, radius, 0, Math.PI * 2);
        ctx.fill();

        if (name === selectedIngredient1) {
          ctx.strokeStyle = '#ffff00';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(px, py, radius + 3, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Label
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 11px "Space Mono"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(name.substring(0, 3).toUpperCase(), px, py);
      });

      // Legend
      ctx.font = '11px "Space Mono"';
      ctx.textAlign = 'left';
      let legX = margin + 10;
      let legY = margin + 15;
      Object.entries(families).forEach(([family, color]) => {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(legX, legY, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ccc';
        ctx.fillText(family.charAt(0).toUpperCase() + family.slice(1), legX + 12, legY + 3);
        legY += 18;
      });
    }

    // Draw compound visualization
    function drawCompounds() {
      const canvas = document.getElementById('compoundCanvas');
      const ctx = canvas.getContext('2d');
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;

      ctx.fillStyle = '#0f0f0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const data = ingredients[selectedIngredient1];
      const margin = 30;
      const w = canvas.width - 2 * margin;
      const boxWidth = w / Math.max(data.vocs.length, 1) - 10;
      const boxHeight = canvas.height - 80;

      ctx.fillStyle = '#1a1a1a';
      ctx.font = 'bold 12px "Playfair Display"';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#4da8da';
      ctx.fillText(selectedIngredient1.toUpperCase() + ' — Dominant VOCs', canvas.width / 2, 20);

      data.vocs.forEach((voc, idx) => {
        const x = margin + idx * (boxWidth + 10);
        const y = 40;

        // Gradient box
        const gradient = ctx.createLinearGradient(x, y, x, y + boxHeight);
        gradient.addColorStop(0, '#1a4d7f');
        gradient.addColorStop(1, '#0a2040');
        ctx.fillStyle = gradient;
        ctx.fillRect(x, y, boxWidth, boxHeight);

        ctx.strokeStyle = '#4da8da';
        ctx.lineWidth = 1;
        ctx.strokeRect(x, y, boxWidth, boxHeight);

        // Text
        ctx.fillStyle = '#e0e0e0';
        ctx.font = 'bold 11px "Space Mono"';
        ctx.textAlign = 'center';
        ctx.fillText(voc, x + boxWidth / 2, y + 25);

        if (showScientific) {
          ctx.fillStyle = '#aaa';
          ctx.font = '8px "Space Mono"';
          const iupac = data.iupac[idx] || '';
          const lines = iupac.match(/.{1,15}/g) || [];
          lines.forEach((line, i) => {
            ctx.fillText(line, x + boxWidth / 2, y + 45 + i * 10);
          });
        }

        if (showSynthetic) {
          ctx.fillStyle = data.natural[idx] ? '#4fb050' : '#ff9800';
          ctx.font = 'bold 8px "Space Mono"';
          ctx.fillText(data.natural[idx] ? 'NATURAL' : 'SYNTHETIC', x + boxWidth / 2, y + boxHeight - 12);
        }
      });
    }

    // Update stat panel
    function updateStats() {
      const data = ingredients[selectedIngredient1];

      // Family badge
      const familyBadge = document.getElementById('familyBadge');
      const familyName = data.family.charAt(0).toUpperCase() + data.family.slice(1);
      familyBadge.textContent = familyName;
      familyBadge.className = `family-badge family-${data.family}`;

      // VOCs list
      const vocList = document.getElementById('vocList');
      vocList.innerHTML = data.vocs.map(voc => `<div class="compound-tag">${voc}</div>`).join('');

      // Pairings
      const pairingsList = document.getElementById('pairingsList');
      pairingsList.innerHTML = data.pairings.map(p => `<strong>${p}</strong>`).join(', ');

      // Comparison
      if (selectedIngredient2 && selectedIngredient2 !== selectedIngredient1) {
        updateComparison();
      } else {
        document.getElementById('comparisonResult').style.display = 'none';
      }

      drawFlavorMap();
      drawCompounds();
    }

    // Calculate and display pairing
    function updateComparison() {
      const data1 = ingredients[selectedIngredient1];
      const data2 = ingredients[selectedIngredient2];

      // Look up or calculate pairing score
      const key1 = `${selectedIngredient1}-${selectedIngredient2}`;
      const key2 = `${selectedIngredient2}-${selectedIngredient1}`;
      let score = pairingMatrix[key1] || pairingMatrix[key2] || 55;

      // Share compounds
      const shared = data1.vocs.filter(v => data2.vocs.includes(v));
      const allUnique = new Set([...data1.vocs, ...data2.vocs]).size;

      document.getElementById('comparisonResult').style.display = 'block';
      document.getElementById('pairingScore').textContent = score + '%';

      const vennText = `
<strong>${selectedIngredient1}</strong> ∩ <strong>${selectedIngredient2}</strong>:<br/>
${shared.length > 0 ? shared.join(', ') : 'Complementary (low overlap)'}<br/>
<br/>
<small>${score > 70 ? '✓ Great pairing' : score > 50 ? '◐ Good contrast' : '✗ Challenging combo'}</small>
      `;
      document.getElementById('vennText').innerHTML = vennText;
    }

    // Event listeners
    document.getElementById('ingredient1').addEventListener('change', (e) => {
      selectedIngredient1 = e.target.value;
      updateStats();
    });

    document.getElementById('ingredient2').addEventListener('change', (e) => {
      selectedIngredient2 = e.target.value;
      updateStats();
    });

    document.getElementById('scientificToggle').addEventListener('click', (e) => {
      showScientific = !showScientific;
      e.target.classList.toggle('active');
      drawCompounds();
    });

    document.getElementById('syntheticToggle').addEventListener('click', (e) => {
      showSynthetic = !showSynthetic;
      e.target.classList.toggle('active');
      drawCompounds();
    });

    // Init
    populateSelects();
    updateStats();

    // Responsive redraw on resize
    window.addEventListener('resize', () => {
      updateStats();
    });
  </script>
</body>
</html>
