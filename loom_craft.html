<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loom Craft — Textile Weaving Simulator</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inconsolata:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: Inconsolata, monospace;
      background: linear-gradient(135deg, #f5ead6 0%, #e8f5e9 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #2a2a2a;
    }
    
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      max-width: 1200px;
      width: 100%;
      padding: 40px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }
    
    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
        padding: 20px;
        gap: 30px;
      }
    }
    
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      margin-bottom: 30px;
      grid-column: 1 / -1;
      color: #2a1810;
    }
    
    .controls {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #5a4a42;
    }
    
    button {
      padding: 10px 14px;
      background: #2d9d5f;
      color: white;
      border: none;
      border-radius: 6px;
      font-family: Inconsolata, monospace;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    button:hover {
      background: #1f6f42;
    }
    
    button:active {
      transform: scale(0.98);
    }
    
    .button-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    
    .button-group.patterns {
      grid-template-columns: repeat(2, 1fr);
    }
    
    .button-group.presets {
      grid-template-columns: 1fr;
    }
    
    input[type="range"] {
      width: 100%;
      cursor: pointer;
    }
    
    input[type="color"] {
      width: 50px;
      height: 40px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    .color-inputs {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }
    
    .stat-box {
      background: #f9f9f9;
      padding: 12px;
      border-left: 4px solid #2d9d5f;
      border-radius: 4px;
      font-size: 11px;
    }
    
    .stat-label {
      color: #999;
      text-transform: uppercase;
      font-size: 9px;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    
    .stat-value {
      font-size: 16px;
      font-weight: 700;
      color: #2a1810;
    }
    
    .canvas-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    canvas {
      border: 2px solid #ddd;
      border-radius: 8px;
      background: white;
      display: block;
    }
    
    .fabric-canvas {
      margin-top: 20px;
    }
    
    .tip {
      font-size: 11px;
      color: #999;
      font-style: italic;
      margin-top: 10px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧵 Loom Craft</h1>
    
    <div class="controls">
      <div class="control-group">
        <label>Weaving Pattern</label>
        <div class="button-group patterns">
          <button onclick="selectPattern('plain')">Plain</button>
          <button onclick="selectPattern('twill')">Twill</button>
          <button onclick="selectPattern('herringbone')">Herringbone</button>
          <button onclick="selectPattern('satin')">Satin</button>
        </div>
      </div>
      
      <div class="control-group">
        <label>Warp Colors (threads)</label>
        <input type="range" min="2" max="16" value="8" id="warpCountSlider" oninput="handleWarpCountChange()">
        <span id="warpCountDisplay">8 threads</span>
      </div>
      
      <div class="control-group">
        <label>Weft Color</label>
        <div class="color-inputs">
          <input type="color" id="weftColor" value="#ff6b9d" oninput="render()">
          <span id="weftLabel">#ff6b9d</span>
        </div>
      </div>
      
      <div class="control-group">
        <label>Weave Speed</label>
        <input type="range" min="0.5" max="3" step="0.5" value="1" id="speedSlider" oninput="updateSpeed()">
        <span id="speedDisplay">1.0x</span>
      </div>
      
      <div class="control-group">
        <label>Thread Diameter</label>
        <input type="range" min="1" max="6" step="0.5" value="3" id="diameterSlider" oninput="render()">
        <span id="diameterDisplay">3.0 (medium)</span>
      </div>
      
      <div class="control-group">
        <label>Color Presets</label>
        <div class="button-group presets">
          <button onclick="loadPreset('tartan')">Tartan Red</button>
          <button onclick="loadPreset('tweed')">Scottish Tweed</button>
          <button onclick="loadPreset('indigo')">Japanese Indigo</button>
          <button onclick="loadPreset('navajo')">Navajo Pattern</button>
          <button onclick="loadPreset('kente')">African Kente</button>
          <button onclick="loadPreset('ikat')">Indian Ikat</button>
        </div>
      </div>
      
      <div class="control-group" style="margin-top: 10px;">
        <button onclick="startWeaving()" style="padding: 14px; font-size: 14px; background: #c17a5c;">Start Weaving</button>
        <button onclick="resetLoom()" style="padding: 12px; font-size: 12px;">Reset</button>
      </div>
      
      <div class="stats">
        <div class="stat-box">
          <div class="stat-label">Rows Woven</div>
          <div class="stat-value" id="rowsWoven">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Pattern</div>
          <div class="stat-value" id="patternName">Plain</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Warp Threads</div>
          <div class="stat-value" id="warpCount">8</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Fabric Size</div>
          <div class="stat-value" id="fabricSize">0 cm²</div>
        </div>
      </div>
      
      <div class="tip">
        💡 Plain = basic grid. Twill = diagonal ridges. Herringbone = alternating V. Satin = smooth long floats.
      </div>
    </div>
    
    <div class="canvas-section">
      <div>
        <label style="display: block; margin-bottom: 8px; font-size: 12px; color: #5a4a42;">Active Loom</label>
        <canvas id="loomCanvas" width="400" height="400"></canvas>
      </div>
      <div>
        <label style="display: block; margin-bottom: 8px; font-size: 12px; color: #5a4a42;">Woven Fabric</label>
        <canvas id="fabricCanvas" width="400" height="200"></canvas>
      </div>
    </div>
  </div>
  
  <script>
    const loomCanvas = document.getElementById('loomCanvas');
    const fabricCanvas = document.getElementById('fabricCanvas');
    const loomCtx = loomCanvas.getContext('2d');
    const fabricCtx = fabricCanvas.getContext('2d');
    
    // State
    let state = {
      pattern: 'plain',
      warpCount: 8,
      weftColor: '#ff6b9d',
      threadDiameter: 3,
      speed: 1,
      isWeaving: false,
      rowsWoven: 0,
      wefts: [], // Array of {color, rowIndex}
      shuttleX: 0, // 0 to 1
      shuttleDirection: 1, // 1 = right, -1 = left
      animationId: null,
      startTime: Date.now()
    };
    
    // Pattern definitions: array of booleans representing over/under for each warp thread
    const patterns = {
      plain: (row, warpIdx) => (row + warpIdx) % 2 === 0,
      twill: (row, warpIdx) => (row + warpIdx * 2) % 4 < 2,
      herringbone: (row, warpIdx) => {
        const phase = Math.floor((row + warpIdx) / 4) % 2;
        return phase === 0 ? (row + warpIdx) % 4 < 2 : (row + warpIdx) % 4 >= 2;
      },
      satin: (row, warpIdx) => (row * 3 + warpIdx) % 8 < 4
    };
    
    function hslToHex(h, s, l) {
      s /= 100;
      l /= 100;
      const a = s * Math.min(l, 1 - l);
      const f = n => {
        const k = (n + h / 30) % 12;
        const color = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
        return Math.round(255 * color).toString(16).padStart(2, '0');
      };
      return `#${f(0)}${f(8)}${f(4)}`;
    }
    
    function selectPattern(p) {
      state.pattern = p;
      document.getElementById('patternName').textContent = p.charAt(0).toUpperCase() + p.slice(1);
      render();
    }
    
    function handleWarpCountChange() {
      const val = parseInt(document.getElementById('warpCountSlider').value);
      state.warpCount = val;
      document.getElementById('warpCountDisplay').textContent = `${val} threads`;
      document.getElementById('warpCount').textContent = val;
      render();
    }
    
    function updateSpeed() {
      const val = parseFloat(document.getElementById('speedSlider').value);
      state.speed = val;
      document.getElementById('speedDisplay').textContent = `${val.toFixed(1)}x`;
    }
    
    function loadPreset(name) {
      const presets = {
        tartan: { pattern: 'plain', warpCount: 12, weftColor: '#d32f2f', speed: 1 },
        tweed: { pattern: 'twill', warpCount: 10, weftColor: '#8b7355', speed: 1.2 },
        indigo: { pattern: 'satin', warpCount: 8, weftColor: '#0066cc', speed: 1 },
        navajo: { pattern: 'herringbone', warpCount: 14, weftColor: '#ff9933', speed: 1.5 },
        kente: { pattern: 'plain', warpCount: 16, weftColor: '#ffd700', speed: 1.3 },
        ikat: { pattern: 'twill', warpCount: 9, weftColor: '#9b59b6', speed: 1.2 }
      };
      
      const p = presets[name] || presets.tartan;
      state.pattern = p.pattern;
      state.warpCount = p.warpCount;
      state.weftColor = p.weftColor;
      state.speed = p.speed;
      
      document.getElementById('speedSlider').value = p.speed;
      document.getElementById('warpCountSlider').value = p.warpCount;
      document.getElementById('weftColor').value = p.weftColor;
      document.getElementById('weftLabel').textContent = p.weftColor;
      
      handleWarpCountChange();
      updateSpeed();
      render();
    }
    
    function startWeaving() {
      state.isWeaving = true;
      state.rowsWoven = 0;
      state.wefts = [];
      state.shuttleX = 0;
      state.shuttleDirection = 1;
      state.startTime = Date.now();
      animate();
    }
    
    function resetLoom() {
      if (state.animationId) {
        cancelAnimationFrame(state.animationId);
      }
      state.isWeaving = false;
      state.rowsWoven = 0;
      state.wefts = [];
      state.shuttleX = 0;
      state.shuttleDirection = 1;
      render();
    }
    
    function animate() {
      const elapsed = (Date.now() - state.startTime) * state.speed / 1000;
      const shuttleSpeed = 2; // pixels/sec traversal, one direction
      state.shuttleX = (elapsed * shuttleSpeed) % 2;
      
      if (state.shuttleX > 1) {
        state.shuttleX = 2 - state.shuttleX;
        if (Math.floor(elapsed * shuttleSpeed) % 2 === 1) {
          // Shuttle reached end, add new row
          if (state.wefts.length < 30) { // Max 30 rows
            state.wefts.push({ color: state.weftColor, rowIndex: state.wefts.length });
            state.rowsWoven = state.wefts.length;
            document.getElementById('rowsWoven').textContent = state.rowsWoven;
            const fabricArea = (state.warpCount * state.threadDiameter * state.rowsWoven * state.threadDiameter / 4).toFixed(0);
            document.getElementById('fabricSize').textContent = `${fabricArea} cm²`;
          }
        }
      }
      
      render();
      
      if (state.isWeaving && state.wefts.length < 30) {
        state.animationId = requestAnimationFrame(animate);
      } else if (state.wefts.length >= 30) {
        state.isWeaving = false;
      }
    }
    
    function render() {
      // Clear canvases
      loomCtx.fillStyle = 'white';
      loomCtx.fillRect(0, 0, loomCanvas.width, loomCanvas.height);
      fabricCtx.fillStyle = 'white';
      fabricCtx.fillRect(0, 0, fabricCanvas.width, fabricCanvas.height);
      
      const w = loomCanvas.width;
      const h = loomCanvas.height;
      const threadW = (w * 0.8) / state.warpCount;
      const startX = (w * 0.1);
      const startY = 40;
      const loomH = h - 80;
      
      // Draw warp threads (vertical)
      loomCtx.strokeStyle = '#5a4a42';
      loomCtx.lineWidth = state.threadDiameter;
      loomCtx.lineCap = 'round';
      
      for (let i = 0; i < state.warpCount; i++) {
        const x = startX + i * threadW + threadW / 2;
        loomCtx.beginPath();
        loomCtx.moveTo(x, startY);
        loomCtx.lineTo(x, startY + loomH);
        loomCtx.stroke();
      }
      
      // Draw weft rows (horizontal) with over/under logic
      const rowH = 6;
      for (let row = 0; row < state.wefts.length; row++) {
        const weft = state.wefts[row];
        const y = startY + loomH - (row + 1) * rowH;
        
        loomCtx.strokeStyle = weft.color;
        loomCtx.lineWidth = state.threadDiameter + 1;
        
        for (let i = 0; i < state.warpCount - 1; i++) {
          const x1 = startX + i * threadW + threadW / 2;
          const x2 = startX + (i + 1) * threadW + threadW / 2;
          
          const isOver = patterns[state.pattern](row, i);
          const yOff = isOver ? -2 : 2;
          
          loomCtx.beginPath();
          loomCtx.moveTo(x1, y + yOff);
          loomCtx.lineTo(x2, y + yOff);
          loomCtx.stroke();
        }
      }
      
      // Draw shuttle
      if (state.isWeaving && state.wefts.length < 30) {
        const nextRowIdx = state.wefts.length;
        const shuttleY = startY + loomH - (nextRowIdx + 1) * rowH;
        const shuttleXPos = startX + state.shuttleX * (w * 0.8 - threadW);
        
        loomCtx.fillStyle = '#c17a5c';
        loomCtx.fillRect(shuttleXPos - 8, shuttleY - 4, 16, 8);
        loomCtx.strokeStyle = '#5a4a42';
        loomCtx.lineWidth = 1;
        loomCtx.strokeRect(shuttleXPos - 8, shuttleY - 4, 16, 8);
      }
      
      // Draw warp thread colors gradient (multi-color warp)
      loomCtx.font = '10px Inconsolata';
      loomCtx.fillStyle = '#999';
      loomCtx.textAlign = 'center';
      loomCtx.fillText('Warp threads', w / 2, 25);
      
      // Draw fabric canvas (showing completed weave)
      if (state.wefts.length > 0) {
        const fabricW = fabricCanvas.width;
        const fabricH = fabricCanvas.height;
        const cellW = fabricW / state.warpCount;
        const cellH = fabricH / Math.min(state.wefts.length, 15);
        
        fabricCtx.fillStyle = '#f5f5f5';
        for (let row = 0; row < Math.min(state.wefts.length, 15); row++) {
          const weft = state.wefts[row];
          for (let col = 0; col < state.warpCount; col++) {
            const isOver = patterns[state.pattern](row, col);
            
            const x = col * cellW;
            const y = fabricH - (row + 1) * cellH;
            
            fabricCtx.fillStyle = isOver ? '#5a4a42' : weft.color;
            fabricCtx.fillRect(x, y, cellW, cellH);
            
            fabricCtx.strokeStyle = '#ddd';
            fabricCtx.lineWidth = 0.5;
            fabricCtx.strokeRect(x, y, cellW, cellH);
          }
        }
      }
    }
    
    // Initial render
    document.getElementById('patternName').textContent = 'Plain';
    document.getElementById('warpCount').textContent = '8';
    render();
  </script>
</body>
</html>
