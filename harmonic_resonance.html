<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harmonic Resonance</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #e0e6ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container {
      background: rgba(10, 14, 39, 0.8);
      border: 1px solid rgba(0, 255, 153, 0.2);
      border-radius: 12px;
      padding: 2rem;
      max-width: 900px;
      width: 100%;
      backdrop-filter: blur(10px);
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #00ff99 0%, #00d9ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #a0a6b8;
      margin-bottom: 2rem;
    }
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-bottom: 2rem;
    }
    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 1.8rem;
      }
    }
    .canvas-wrapper {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 255, 153, 0.15);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      border-radius: 4px;
      background: #0a0e27;
      max-width: 100%;
      height: auto;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .control-group {
      background: rgba(0, 255, 153, 0.05);
      border: 1px solid rgba(0, 255, 153, 0.1);
      border-radius: 6px;
      padding: 1rem;
    }
    .control-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: #00ff99;
    }
    .control-value {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      color: #00d9ff;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(90deg, rgba(0, 255, 153, 0.2), rgba(0, 217, 255, 0.2));
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #00ff99;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0, 255, 153, 0.6);
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #00ff99;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 8px rgba(0, 255, 153, 0.6);
    }
    .response-plot {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 217, 255, 0.15);
      border-radius: 8px;
      padding: 1rem;
      margin-top: 2rem;
    }
    .response-plot h3 {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      margin-bottom: 1rem;
      color: #00d9ff;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 1rem;
    }
    @media (max-width: 480px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
    .stat-box {
      background: rgba(0, 255, 153, 0.05);
      border: 1px solid rgba(0, 255, 153, 0.1);
      border-radius: 4px;
      padding: 0.8rem;
      text-align: center;
    }
    .stat-label {
      font-size: 0.75rem;
      color: #a0a6b8;
      margin-bottom: 0.3rem;
    }
    .stat-value {
      font-family: 'Syne', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Harmonic Resonance</h1>
    <p class="subtitle">Dual-mass spring system with real classical mechanics</p>
    
    <div class="main-grid">
      <div class="canvas-wrapper">
        <canvas id="physicsCanvas" width="300" height="300"></canvas>
      </div>
      
      <div class="controls">
        <div class="control-group">
          <div class="control-label">
            <span>Spring Constant K1</span>
            <span class="control-value" id="k1Val">1.5</span>
          </div>
          <input type="range" id="k1Slider" min="0.5" max="3" step="0.1" value="1.5">
        </div>
        
        <div class="control-group">
          <div class="control-label">
            <span>Spring Constant K2</span>
            <span class="control-value" id="k2Val">1.5</span>
          </div>
          <input type="range" id="k2Slider" min="0.5" max="3" step="0.1" value="1.5">
        </div>
        
        <div class="control-group">
          <div class="control-label">
            <span>Damping Coefficient</span>
            <span class="control-value" id="cVal">0.1</span>
          </div>
          <input type="range" id="cSlider" min="0" max="0.5" step="0.01" value="0.1">
        </div>
        
        <div class="control-group">
          <div class="control-label">
            <span>Excitation Frequency</span>
            <span class="control-value" id="fVal">1.0</span>
          </div>
          <input type="range" id="fSlider" min="0.5" max="3" step="0.1" value="1.0">
        </div>
        
        <div class="stats">
          <div class="stat-box">
            <div class="stat-label">M1 Velocity</div>
            <div class="stat-value" id="stat1">0.0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">M2 Velocity</div>
            <div class="stat-value" id="stat2">0.0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Energy</div>
            <div class="stat-value" id="stat3">0.0</div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="response-plot">
      <h3>Frequency Response (Amplitude vs. Excitation Freq)</h3>
      <canvas id="responseCanvas" width="800" height="200"></canvas>
    </div>
  </div>

  <script>
    // Physics constants
    const mass = 1.0;
    let k1 = 1.5, k2 = 1.5, c = 0.1, excFreq = 1.0;
    
    // State: positions and velocities
    let x1 = 0, v1 = 0;
    let x2 = 0, v2 = 0;
    
    const dt = 0.01;
    let time = 0;
    
    // RK4 integration for the two-mass system
    function rk4Step(state, dt) {
      const [x1, v1, x2, v2] = state;
      
      const f = (s) => {
        const [x1, v1, x2, v2] = s;
        // a1 = (k1 * (x2 - x1) - c * v1 + F * sin(wt)) / m
        // a2 = (-k1 * (x2 - x1) + k2 * (-x2) - c * v2) / m
        const externalForce = 0.5 * Math.sin(2 * Math.PI * excFreq * time);
        const a1 = (k1 * (x2 - x1) - c * v1 + externalForce) / mass;
        const a2 = (-k1 * (x2 - x1) + k2 * (-x2) - c * v2) / mass;
        return [v1, a1, v2, a2];
      };
      
      const k1s = f(state);
      const s2 = [x1 + k1s[0] * dt / 2, v1 + k1s[1] * dt / 2, x2 + k1s[2] * dt / 2, v2 + k1s[3] * dt / 2];
      const k2s = f(s2);
      const s3 = [x1 + k2s[0] * dt / 2, v1 + k2s[1] * dt / 2, x2 + k2s[2] * dt / 2, v2 + k2s[3] * dt / 2];
      const k3s = f(s3);
      const s4 = [x1 + k3s[0] * dt, v1 + k3s[1] * dt, x2 + k3s[2] * dt, v2 + k3s[3] * dt];
      const k4s = f(s4);
      
      return [
        x1 + (k1s[0] + 2 * k2s[0] + 2 * k3s[0] + k4s[0]) * dt / 6,
        v1 + (k1s[1] + 2 * k2s[1] + 2 * k3s[1] + k4s[1]) * dt / 6,
        x2 + (k1s[2] + 2 * k2s[2] + 2 * k3s[2] + k4s[2]) * dt / 6,
        v2 + (k1s[3] + 2 * k2s[3] + 2 * k3s[3] + k4s[3]) * dt / 6
      ];
    }
    
    // Frequency response: scan excitation frequency and measure steady-state amplitude of M2
    function computeFrequencyResponse() {
      const response = [];
      for (let f = 0.5; f <= 3.0; f += 0.1) {
        // Simulate for 100 cycles at this frequency to reach steady state
        let tx1 = 0, tv1 = 0, tx2 = 0, tv2 = 0;
        let maxAmplitude = 0;
        const cycles = 100;
        const stepsPerCycle = Math.round(1 / (f * dt));
        
        for (let step = 0; step < cycles * stepsPerCycle; step++) {
          const externalForce = 0.5 * Math.sin(2 * Math.PI * f * step * dt);
          const a1 = (k1 * (tx2 - tx1) - c * tv1 + externalForce) / mass;
          const a2 = (-k1 * (tx2 - tx1) + k2 * (-tx2) - c * tv2) / mass;
          
          tv1 += a1 * dt;
          tx1 += tv1 * dt;
          tv2 += a2 * dt;
          tx2 += tv2 * dt;
          
          if (step > cycles * stepsPerCycle * 0.8) {
            maxAmplitude = Math.max(maxAmplitude, Math.abs(tx2));
          }
        }
        response.push(maxAmplitude);
      }
      return response;
    }
    
    let frequencyResponse = computeFrequencyResponse();
    
    // Slider updates
    document.getElementById('k1Slider').addEventListener('input', (e) => {
      k1 = parseFloat(e.target.value);
      document.getElementById('k1Val').textContent = k1.toFixed(1);
      frequencyResponse = computeFrequencyResponse();
    });
    
    document.getElementById('k2Slider').addEventListener('input', (e) => {
      k2 = parseFloat(e.target.value);
      document.getElementById('k2Val').textContent = k2.toFixed(1);
      frequencyResponse = computeFrequencyResponse();
    });
    
    document.getElementById('cSlider').addEventListener('input', (e) => {
      c = parseFloat(e.target.value);
      document.getElementById('cVal').textContent = c.toFixed(2);
      frequencyResponse = computeFrequencyResponse();
    });
    
    document.getElementById('fSlider').addEventListener('input', (e) => {
      excFreq = parseFloat(e.target.value);
      document.getElementById('fVal').textContent = excFreq.toFixed(1);
    });
    
    // Canvas setup
    const canvas = document.getElementById('physicsCanvas');
    const ctx = canvas.getContext('2d');
    const responseCanvas = document.getElementById('responseCanvas');
    const respCtx = responseCanvas.getContext('2d');
    
    function drawPhysics() {
      ctx.fillStyle = '#0a0e27';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const scale = 40;
      
      // Background grid
      ctx.strokeStyle = 'rgba(0, 255, 153, 0.1)';
      ctx.lineWidth = 0.5;
      for (let i = -3; i <= 3; i++) {
        ctx.beginPath();
        ctx.moveTo(centerX + i * 30, centerY - 80);
        ctx.lineTo(centerX + i * 30, centerY + 80);
        ctx.stroke();
      }
      
      // Fixed anchor
      ctx.fillStyle = '#a0a6b8';
      ctx.fillRect(centerX - 4, centerY - 80 - 4, 8, 8);
      
      // Mass 1 position
      const x1Pos = centerX + x1 * scale;
      ctx.fillStyle = '#00ff99';
      ctx.beginPath();
      ctx.arc(x1Pos, centerY - 40, 8, 0, 2 * Math.PI);
      ctx.fill();
      
      // Spring 1 (anchor to mass 1)
      ctx.strokeStyle = '#00d9ff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(centerX, centerY - 80);
      ctx.lineTo(x1Pos, centerY - 40);
      ctx.stroke();
      
      // Mass 2 position
      const x2Pos = centerX + x2 * scale;
      ctx.fillStyle = '#ff6b6b';
      ctx.beginPath();
      ctx.arc(x2Pos, centerY + 40, 8, 0, 2 * Math.PI);
      ctx.fill();
      
      // Spring 2 (mass 1 to mass 2)
      ctx.strokeStyle = '#ffb700';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x1Pos, centerY - 40);
      ctx.lineTo(x2Pos, centerY + 40);
      ctx.stroke();
      
      // Force vectors
      if (Math.abs(v1) > 0.01) {
        ctx.strokeStyle = '#00ff99';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x1Pos, centerY - 40);
        ctx.lineTo(x1Pos + v1 * 10, centerY - 40);
        ctx.stroke();
      }
      
      if (Math.abs(v2) > 0.01) {
        ctx.strokeStyle = '#ff6b6b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x2Pos, centerY + 40);
        ctx.lineTo(x2Pos + v2 * 10, centerY + 40);
        ctx.stroke();
      }
      
      // Labels
      ctx.fillStyle = '#a0a6b8';
      ctx.font = '12px Inter';
      ctx.textAlign = 'center';
      ctx.fillText('M1', x1Pos, centerY - 30);
      ctx.fillText('M2', x2Pos, centerY + 55);
    }
    
    function drawResponsePlot() {
      respCtx.fillStyle = '#0a0e27';
      respCtx.fillRect(0, 0, responseCanvas.width, responseCanvas.height);
      
      const margin = 30;
      const plotW = responseCanvas.width - 2 * margin;
      const plotH = responseCanvas.height - 2 * margin;
      
      // Axes
      respCtx.strokeStyle = 'rgba(0, 255, 153, 0.3)';
      respCtx.lineWidth = 1;
      respCtx.beginPath();
      respCtx.moveTo(margin, responseCanvas.height - margin);
      respCtx.lineTo(responseCanvas.width - margin, responseCanvas.height - margin);
      respCtx.stroke();
      
      respCtx.beginPath();
      respCtx.moveTo(margin, margin);
      respCtx.lineTo(margin, responseCanvas.height - margin);
      respCtx.stroke();
      
      // Grid
      respCtx.strokeStyle = 'rgba(0, 255, 153, 0.1)';
      respCtx.lineWidth = 0.5;
      for (let i = 0; i <= 5; i++) {
        const y = responseCanvas.height - margin - (plotH / 5) * i;
        respCtx.beginPath();
        respCtx.moveTo(margin, y);
        respCtx.lineTo(responseCanvas.width - margin, y);
        respCtx.stroke();
      }
      
      // Plot response curve
      respCtx.strokeStyle = '#ff6b6b';
      respCtx.lineWidth = 2;
      respCtx.beginPath();
      
      const maxResponse = Math.max(...frequencyResponse) || 1;
      
      for (let i = 0; i < frequencyResponse.length; i++) {
        const freqNorm = i / (frequencyResponse.length - 1);
        const ampNorm = frequencyResponse[i] / maxResponse;
        const x = margin + freqNorm * plotW;
        const y = responseCanvas.height - margin - ampNorm * plotH;
        
        if (i === 0) respCtx.moveTo(x, y);
        else respCtx.lineTo(x, y);
      }
      respCtx.stroke();
      
      // Highlight current excitation freq
      const currentIdx = Math.round((excFreq - 0.5) / 0.1);
      if (currentIdx >= 0 && currentIdx < frequencyResponse.length) {
        respCtx.fillStyle = '#00ff99';
        const freqNorm = currentIdx / (frequencyResponse.length - 1);
        const ampNorm = frequencyResponse[currentIdx] / maxResponse;
        const x = margin + freqNorm * plotW;
        const y = responseCanvas.height - margin - ampNorm * plotH;
        respCtx.beginPath();
        respCtx.arc(x, y, 4, 0, 2 * Math.PI);
        respCtx.fill();
      }
      
      // Labels
      respCtx.fillStyle = '#a0a6b8';
      respCtx.font = '10px Inter';
      respCtx.textAlign = 'center';
      respCtx.fillText('Frequency (rad/s)', responseCanvas.width / 2, responseCanvas.height - 5);
    }
    
    function updateStats() {
      document.getElementById('stat1').textContent = Math.abs(v1).toFixed(2);
      document.getElementById('stat2').textContent = Math.abs(v2).toFixed(2);
      const E = 0.5 * mass * (v1 * v1 + v2 * v2) + 0.5 * k1 * (x1 - x2) ** 2 + 0.5 * k2 * x2 ** 2;
      document.getElementById('stat3').textContent = E.toFixed(1);
    }
    
    function animate() {
      // Step physics
      for (let i = 0; i < 3; i++) {
        const state = rk4Step([x1, v1, x2, v2], dt);
        x1 = state[0];
        v1 = state[1];
        x2 = state[2];
        v2 = state[3];
        time += dt;
      }
      
      drawPhysics();
      drawResponsePlot();
      updateStats();
      requestAnimationFrame(animate);
    }
    
    animate();
  </script>
</body>
</html>
