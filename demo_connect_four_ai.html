<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Four AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Playfair Display', 'Georgia', serif;
            background: linear-gradient(135deg, #0a1428 0%, #1f4d7f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container {
            max-width: 600px;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        h1 {
            text-align: center;
            font-size: 2.2em;
            margin-bottom: 8px;
            color: #4da8da;
        }
        .subtitle {
            text-align: center;
            font-family: monospace;
            font-size: 0.9em;
            color: #a0aec0;
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 14px;
            background: #4da8da;
            color: #0a1428;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85em;
            transition: all 0.2s ease;
        }
        .btn:hover:not(:disabled) { background: #64b5f6; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn.active { background: #ff00ff; color: #fff; }
        .status {
            text-align: center;
            font-size: 1em;
            margin-bottom: 15px;
            height: 24px;
            color: #a0aec0;
        }
        .status.active { color: #4da8da; font-weight: bold; }
        .board-container {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }
        canvas {
            background: #0f172a;
            border: 3px solid #4da8da;
            border-radius: 10px;
            display: block;
            cursor: pointer;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .modal.show { display: flex; }
        .modal-box {
            background: linear-gradient(135deg, #1f4d7f 0%, #0a1428 100%);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #4da8da;
            max-width: 350px;
        }
        .modal-box h2 { font-size: 1.8em; margin-bottom: 15px; }
        .modal-box p { color: #a0aec0; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ Connect Four AI</h1>
        <div class="subtitle">Beat the Minimax engine</div>
        
        <div class="controls">
            <button class="btn diff-btn active" data-level="0">Easy</button>
            <button class="btn diff-btn" data-level="1">Medium</button>
            <button class="btn diff-btn" data-level="2">Hard</button>
            <button class="btn" id="newBtn">New Game</button>
        </div>
        
        <div class="status" id="status"></div>
        
        <div class="board-container">
            <canvas id="board" width="420" height="360"></canvas>
        </div>
    </div>

    <div class="modal" id="endModal">
        <div class="modal-box">
            <h2 id="endTitle"></h2>
            <p id="endMsg"></p>
            <button class="btn" id="playBtn">Play Again</button>
        </div>
    </div>

    <script>
        const ROWS = 6, COLS = 7;
        const EMPTY = 0, RED = 1, YELLOW = 2;
        
        let board = [], gameOver = false, playerTurn = RED;
        let difficulty = 1, thinking = false;
        
        const settings = {
            0: { depth: 3, randn: 0.3 },
            1: { depth: 5, randn: 0 },
            2: { depth: 7, randn: 0 }
        };

        function newBoard() {
            board = Array(ROWS).fill(null).map(() => Array(COLS).fill(EMPTY));
            gameOver = false;
            playerTurn = RED;
            thinking = false;
            draw();
            updateStatus();
        }

        function dropAt(col) {
            if (gameOver || thinking || col < 0 || col >= COLS) return;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r][col] === EMPTY) {
                    board[r][col] = RED;
                    if (hasWon(RED)) { endGame('🏆 You Win!', 'Nice!'); return; }
                    if (isFull()) { endGame('🤝 Draw', 'Well played!'); return; }
                    playerTurn = YELLOW;
                    updateStatus();
                    setTimeout(aiPlay, 500);
                    return;
                }
            }
        }

        function aiPlay() {
            thinking = true;
            updateStatus();
            setTimeout(() => {
                const set = settings[difficulty];
                let col;
                if (difficulty === 0 && Math.random() < set.randn) {
                    const ok = [];
                    for (let c = 0; c < COLS; c++) if (board[0][c] === EMPTY) ok.push(c);
                    col = ok[Math.floor(Math.random() * ok.length)];
                } else {
                    const { move } = minimax(board, set.depth, true, -Infinity, Infinity);
                    col = move;
                }
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (board[r][col] === EMPTY) {
                        board[r][col] = YELLOW;
                        if (hasWon(YELLOW)) { endGame('💻 I Win!', 'Try again?'); return; }
                        if (isFull()) { endGame('🤝 Draw', 'Well played!'); return; }
                        playerTurn = RED;
                        thinking = false;
                        updateStatus();
                        return;
                    }
                }
            }, 300);
        }

        function minimax(st, d, max, a, b) {
            const w = checkWin(st);
            if (w === YELLOW) return { score: 1000 };
            if (w === RED) return { score: -1000 };
            if (isFull(st)) return { score: 0 };
            if (d === 0) return { score: evalBoard(st) };
            
            if (max) {
                let best = -Infinity, move = 0;
                for (let c = 0; c < COLS; c++) {
                    const ns = makeMove(st, c, YELLOW);
                    if (!ns) continue;
                    const { score } = minimax(ns, d - 1, false, a, b);
                    if (score > best) { best = score; move = c; }
                    a = Math.max(a, best);
                    if (b <= a) break;
                }
                return { score: best, move };
            } else {
                let best = Infinity, move = 0;
                for (let c = 0; c < COLS; c++) {
                    const ns = makeMove(st, c, RED);
                    if (!ns) continue;
                    const { score } = minimax(ns, d - 1, true, a, b);
                    if (score < best) { best = score; move = c; }
                    b = Math.min(b, best);
                    if (b <= a) break;
                }
                return { score: best, move };
            }
        }

        function makeMove(st, col, p) {
            for (let r = ROWS - 1; r >= 0; r--) {
                if (st[r][col] === EMPTY) {
                    const ns = st.map(row => [...row]);
                    ns[r][col] = p;
                    return ns;
                }
            }
            return null;
        }

        function checkWin(st) {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    for (const [dr, dc] of [[0,1],[1,0],[1,1],[1,-1]]) {
                        let cnt = 0;
                        for (let i = 0; i < 4; i++) {
                            const nr = r + i * dr, nc = c + i * dc;
                            if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) break;
                            if (st[nr][nc] === st[r][c] && st[r][c] !== EMPTY) cnt++;
                            else break;
                        }
                        if (cnt === 4) return st[r][c];
                    }
                }
            }
            return EMPTY;
        }

        function hasWon(p) { return checkWin(board) === p; }
        function isFull(st) {
            st = st || board;
            for (let c = 0; c < COLS; c++) if (st[0][c] === EMPTY) return false;
            return true;
        }

        function evalBoard(st) {
            let score = 0;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    score += evalAt(st, r, c, 1, 0);
                    score += evalAt(st, r, c, 0, 1);
                    score += evalAt(st, r, c, 1, 1);
                    score += evalAt(st, r, c, 1, -1);
                }
            }
            for (let r = 0; r < ROWS; r++) {
                if (st[r][3] === YELLOW) score += 5;
                if (st[r][3] === RED) score -= 5;
            }
            return score;
        }

        function evalAt(st, r, c, dr, dc) {
            let ai = 0, pl = 0, empty = 0;
            for (let i = 0; i < 4; i++) {
                const nr = r + i * dr, nc = c + i * dc;
                if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) return 0;
                if (st[nr][nc] === YELLOW) ai++;
                else if (st[nr][nc] === RED) pl++;
                else empty++;
            }
            if (ai > 0 && pl > 0) return 0;
            if (ai === 3) return 100;
            if (pl === 3) return -100;
            if (ai === 2) return 10;
            if (pl === 2) return -10;
            if (ai === 1) return 1;
            if (pl === 1) return -1;
            return 0;
        }

        function updateStatus() {
            if (gameOver) return;
            document.getElementById('status').textContent = thinking ? '⏳ AI thinking...' : '🔴 Your turn';
            document.getElementById('status').className = 'status active';
        }

        function endGame(title, msg) {
            gameOver = true;
            document.getElementById('endTitle').textContent = title;
            document.getElementById('endMsg').textContent = msg;
            document.getElementById('endModal').classList.add('show');
        }

        function draw() {
            const c = document.getElementById('board');
            const ctx = c.getContext('2d');
            const w = c.width, h = c.height;
            const cw = w / COLS, ch = h / ROWS;
            const r = Math.min(cw, ch) * 0.35;
            
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, w, h);
            
            ctx.strokeStyle = '#4da8da';
            ctx.lineWidth = 2;
            for (let i = 1; i < COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cw, 0);
                ctx.lineTo(i * cw, h);
                ctx.stroke();
            }
            for (let i = 1; i < ROWS; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * ch);
                ctx.lineTo(w, i * ch);
                ctx.stroke();
            }
            
            for (let r = 0; r < ROWS; r++) {
                for (let col = 0; col < COLS; col++) {
                    const x = col * cw + cw / 2;
                    const y = r * ch + ch / 2;
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    
                    if (board[r][col] === RED) ctx.fillStyle = '#ff6b6b';
                    else if (board[r][col] === YELLOW) ctx.fillStyle = '#ffd93d';
                    else ctx.fillStyle = '#2a3a4a';
                    
                    ctx.fill();
                    ctx.strokeStyle = '#1f4d7f';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }
        }

        function animate() {
            draw();
            requestAnimationFrame(animate);
        }

        document.getElementById('board').addEventListener('click', (e) => {
            const c = document.getElementById('board');
            const x = e.clientX - c.getBoundingClientRect().left;
            const col = Math.floor(x / (c.width / COLS));
            dropAt(col);
        });

        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                difficulty = parseInt(e.target.dataset.level);
                newBoard();
            });
        });

        document.getElementById('newBtn').addEventListener('click', newBoard);
        document.getElementById('playBtn').addEventListener('click', () => {
            document.getElementById('endModal').classList.remove('show');
            newBoard();
        });

        newBoard();
        animate();
    </script>
</body>
</html>
