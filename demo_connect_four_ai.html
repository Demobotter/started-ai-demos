<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Four AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Playfair Display', serif;
            background: linear-gradient(135deg, #0a1428 0%, #1f4d7f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container {
            max-width: 600px;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #4da8da;
        }
        .subtitle {
            text-align: center;
            font-family: 'Space Mono', monospace;
            font-size: 0.95em;
            color: #a0aec0;
            margin-bottom: 25px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 16px;
            background: #4da8da;
            color: #0a1428;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Space Mono', monospace;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }
        .btn:hover:not(:disabled) {
            background: #64b5f6;
            transform: scale(1.05);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn.active {
            background: #ff00ff;
            color: #fff;
        }
        .difficulty-group {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .diff-btn {
            padding: 8px 14px;
            font-size: 0.85em;
        }
        .status {
            text-align: center;
            font-family: 'Space Mono', monospace;
            font-size: 1.1em;
            margin-bottom: 15px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .status.red { color: #ff6b6b; }
        .status.yellow { color: #ffd93d; }
        .status.thinking { color: #4da8da; }
        .board-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        canvas {
            background: #0f172a;
            border: 3px solid #4da8da;
            border-radius: 12px;
            display: block;
            cursor: pointer;
        }
        .info {
            font-family: 'Space Mono', monospace;
            font-size: 0.85em;
            color: #a0aec0;
            text-align: center;
            margin-top: 15px;
            line-height: 1.4;
        }
        .end-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .end-modal.show {
            display: flex;
        }
        .modal-content {
            background: linear-gradient(135deg, #1f4d7f 0%, #0a1428 100%);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            border: 2px solid #4da8da;
            max-width: 400px;
        }
        .modal-content h2 {
            font-size: 2em;
            margin-bottom: 20px;
        }
        .modal-content p {
            font-family: 'Space Mono', monospace;
            margin-bottom: 25px;
            color: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ Connect Four AI</h1>
        <div class="subtitle">Play against Minimax engine</div>
        
        <div class="controls">
            <div class="difficulty-group">
                <button class="btn diff-btn active" data-level="0">Easy</button>
                <button class="btn diff-btn" data-level="1">Medium</button>
                <button class="btn diff-btn" data-level="2">Hard</button>
            </div>
            <button class="btn" id="newGameBtn">New Game</button>
        </div>
        
        <div class="status" id="status"></div>
        
        <div class="board-container">
            <canvas id="boardCanvas" width="420" height="360"></canvas>
        </div>
        
        <div class="info">
            <div id="moveLog"></div>
        </div>
    </div>

    <div class="end-modal" id="endModal">
        <div class="modal-content">
            <h2 id="modalTitle"></h2>
            <p id="modalMessage"></p>
            <button class="btn" id="replayBtn">Play Again</button>
        </div>
    </div>

    <script>
        const ROWS = 6, COLS = 7;
        const EMPTY = 0, RED = 1, YELLOW = 2;
        
        let board = [];
        let gameOver = false;
        let currentPlayer = RED;
        let difficulty = 1; // 0=Easy, 1=Medium, 2=Hard
        let isAIThinking = false;
        let moveCount = 0;
        
        const difficultySettings = {
            0: { depth: 3, randomChance: 0.3 },
            1: { depth: 5, randomChance: 0 },
            2: { depth: 7, randomChance: 0 }
        };

        function initBoard() {
            board = Array(ROWS).fill(null).map(() => Array(COLS).fill(EMPTY));
            gameOver = false;
            currentPlayer = RED;
            moveCount = 0;
            isAIThinking = false;
            updateStatus();
        }

        function dropPiece(col) {
            if (gameOver || isAIThinking || col < 0 || col >= COLS) return;
            
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r][col] === EMPTY) {
                    board[r][col] = RED;
                    moveCount++;
                    
                    if (checkWin(RED)) {
                        gameOver = true;
                        endGame('🏆 You Win!', 'Nice job beating the AI!');
                        return;
                    }
                    if (isBoardFull()) {
                        gameOver = true;
                        endGame('🤝 Draw', 'Well played!');
                        return;
                    }
                    
                    currentPlayer = YELLOW;
                    updateStatus();
                    setTimeout(aiMove, 600);
                    return;
                }
            }
        }

        function aiMove() {
            isAIThinking = true;
            updateStatus();
            
            setTimeout(() => {
                const settings = difficultySettings[difficulty];
                let col;
                
                if (difficulty === 0 && Math.random() < settings.randomChance) {
                    const validCols = [];
                    for (let c = 0; c < COLS; c++) {
                        if (board[0][c] === EMPTY) validCols.push(c);
                    }
                    col = validCols[Math.floor(Math.random() * validCols.length)];
                } else {
                    const { move } = minimax(board, settings.depth, true, -Infinity, Infinity);
                    col = move;
                }
                
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (board[r][col] === EMPTY) {
                        board[r][col] = YELLOW;
                        moveCount++;
                        
                        if (checkWin(YELLOW)) {
                            gameOver = true;
                            endGame('💻 I Win!', 'Try again?');
                            return;
                        }
                        if (isBoardFull()) {
                            gameOver = true;
                            endGame('🤝 Draw', 'Well played!');
                            return;
                        }
                        
                        currentPlayer = RED;
                        isAIThinking = false;
                        updateStatus();
                        return;
                    }
                }
            }, 400);
        }

        function minimax(state, depth, isMaximizing, alpha, beta) {
            const winner = checkWinState(state);
            if (winner === YELLOW) return { score: 1000 };
            if (winner === RED) return { score: -1000 };
            if (isBoardFullState(state)) return { score: 0 };
            if (depth === 0) return { score: evaluateBoard(state) };
            
            if (isMaximizing) {
                let maxScore = -Infinity;
                let bestMove = 0;
                for (let col = 0; col < COLS; col++) {
                    const newState = makeMove(state, col, YELLOW);
                    if (!newState) continue;
                    const { score } = minimax(newState, depth - 1, false, alpha, beta);
                    if (score > maxScore) {
                        maxScore = score;
                        bestMove = col;
                    }
                    alpha = Math.max(alpha, score);
                    if (beta <= alpha) break;
                }
                return { score: maxScore, move: bestMove };
            } else {
                let minScore = Infinity;
                let bestMove = 0;
                for (let col = 0; col < COLS; col++) {
                    const newState = makeMove(state, col, RED);
                    if (!newState) continue;
                    const { score } = minimax(newState, depth - 1, true, alpha, beta);
                    if (score < minScore) {
                        minScore = score;
                        bestMove = col;
                    }
                    beta = Math.min(beta, score);
                    if (beta <= alpha) break;
                }
                return { score: minScore, move: bestMove };
            }
        }

        function makeMove(state, col, player) {
            for (let r = ROWS - 1; r >= 0; r--) {
                if (state[r][col] === EMPTY) {
                    const newState = state.map(row => [...row]);
                    newState[r][col] = player;
                    return newState;
                }
            }
            return null;
        }

        function evaluateBoard(state) {
            let score = 0;
            
            // Check all lines for chains
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    score += evalLine(state, r, c, 1, 0); // horizontal
                    score += evalLine(state, r, c, 0, 1); // vertical
                    score += evalLine(state, r, c, 1, 1); // diag down-right
                    score += evalLine(state, r, c, 1, -1); // diag down-left
                }
            }
            
            // Center column control bonus
            for (let r = 0; r < ROWS; r++) {
                if (state[r][3] === YELLOW) score += 5;
                if (state[r][3] === RED) score -= 5;
            }
            
            return score;
        }

        function evalLine(state, r, c, dr, dc) {
            let aiCount = 0, playerCount = 0, empty = 0;
            for (let i = 0; i < 4; i++) {
                const nr = r + i * dr, nc = c + i * dc;
                if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) return 0;
                if (state[nr][nc] === YELLOW) aiCount++;
                else if (state[nr][nc] === RED) playerCount++;
                else empty++;
            }
            if (aiCount > 0 && playerCount > 0) return 0;
            if (aiCount === 3) return 100;
            if (playerCount === 3) return -100;
            if (aiCount === 2) return 10;
            if (playerCount === 2) return -10;
            if (aiCount === 1) return 1;
            if (playerCount === 1) return -1;
            return 0;
        }

        function checkWin(player) {
            return checkWinState(board) === player;
        }

        function checkWinState(state) {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    for (const [dr, dc] of [[0,1],[1,0],[1,1],[1,-1]]) {
                        let count = 0;
                        for (let i = 0; i < 4; i++) {
                            const nr = r + i * dr, nc = c + i * dc;
                            if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) break;
                            if (state[nr][nc] === state[r][c] && state[r][c] !== EMPTY) {
                                count++;
                            } else break;
                        }
                        if (count === 4) return state[r][c];
                    }
                }
            }
            return EMPTY;
        }

        function isBoardFull() {
            return isBoardFullState(board);
        }

        function isBoardFullState(state) {
            for (let c = 0; c < COLS; c++) {
                if (state[0][c] === EMPTY) return false;
            }
            return true;
        }

        function updateStatus() {
            const el = document.getElementById('status');
            if (gameOver) return;
            if (isAIThinking) {
                el.textContent = '⏳ AI thinking...';
                el.className = 'status thinking';
            } else {
                el.textContent = currentPlayer === RED ? '🔴 Your turn' : '🟡 AI turn';
                el.className = currentPlayer === RED ? 'status red' : 'status yellow';
            }
        }

        function endGame(title, msg) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = msg;
            document.getElementById('endModal').classList.add('show');
        }

        function drawBoard() {
            const canvas = document.getElementById('boardCanvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            const cellW = w / COLS, cellH = h / ROWS;
            const radius = Math.min(cellW, cellH) * 0.35;
            
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, w, h);
            
            ctx.strokeStyle = '#4da8da';
            ctx.lineWidth = 2;
            for (let c = 1; c < COLS; c++) {
                ctx.beginPath();
                ctx.moveTo(c * cellW, 0);
                ctx.lineTo(c * cellW, h);
                ctx.stroke();
            }
            for (let r = 1; r < ROWS; r++) {
                ctx.beginPath();
                ctx.moveTo(0, r * cellH);
                ctx.lineTo(w, r * cellH);
                ctx.stroke();
            }
            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const x = c * cellW + cellW / 2;
                    const y = r * cellH + cellH / 2;
                    
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, Math.PI * 2);
                    
                    if (board[r][c] === RED) {
                        ctx.fillStyle = '#ff6b6b';
                        ctx.fill();
                    } else if (board[r][c] === YELLOW) {
                        ctx.fillStyle = '#ffd93d';
                        ctx.fill();
                    } else {
                        ctx.fillStyle = '#2a3a4a';
                        ctx.fill();
                    }
                    
                    ctx.strokeStyle = '#1f4d7f';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }
        }

        function animate() {
            drawBoard();
            requestAnimationFrame(animate);
        }

        document.getElementById('boardCanvas').addEventListener('click', (e) => {
            const canvas = document.getElementById('boardCanvas');
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const col = Math.floor(x / (canvas.width / COLS));
            dropPiece(col);
        });

        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                difficulty = parseInt(e.target.dataset.level);
                if (!gameOver) initBoard();
            });
        });

        document.getElementById('newGameBtn').addEventListener('click', () => {
            document.getElementById('endModal').classList.remove('show');
            initBoard();
        });

        document.getElementById('replayBtn').addEventListener('click', () => {
            document.getElementById('endModal').classList.remove('show');
            initBoard();
        });

        initBoard();
        animate();
    </script>
</head>
</html>
