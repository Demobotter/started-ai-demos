<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex Strength Ranker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            background: #1a1f35;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        
        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 12px;
            margin-bottom: 30px;
            align-items: end;
        }
        
        .input-field {
            display: flex;
            flex-direction: column;
        }
        
        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        input {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 10px 12px;
            color: #e2e8f0;
            font-family: 'Inter', monospace;
            font-size: 1rem;
            font-weight: 500;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: #fbbf24;
            background: #1e293b;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.1);
        }
        
        button {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            border: none;
            border-radius: 8px;
            padding: 10px 24px;
            font-weight: 600;
            color: #0f172a;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(251, 191, 36, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #cbd5e1;
        }
        
        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #334155;
            border-top-color: #fbbf24;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .chart-container {
            margin-top: 40px;
        }
        
        .chart-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #e2e8f0;
        }
        
        .pair-bar {
            display: flex;
            align-items: center;
            margin-bottom: 14px;
            gap: 10px;
        }
        
        .pair-label {
            width: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #cbd5e1;
            text-align: right;
        }
        
        .bar-bg {
            flex: 1;
            height: 32px;
            background: #0f172a;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            border: 1px solid #334155;
        }
        
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6 0%, #06b6d4 100%);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        
        .pair-bar.highlight .bar-fill {
            background: linear-gradient(90deg, #fbbf24 0%, #f59e0b 100%);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
        }
        
        .pair-value {
            width: 70px;
            text-align: right;
            font-family: 'Inter', monospace;
            font-weight: 600;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        
        .pair-bar.highlight .pair-value {
            color: #fbbf24;
        }
        
        .error {
            background: #7f1d1d;
            color: #fca5a5;
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 4px solid #dc2626;
            margin-top: 20px;
        }
        
        .info {
            background: #1e293b;
            border-left: 4px solid #0ea5e9;
            padding: 12px 16px;
            border-radius: 6px;
            color: #bae6fd;
            font-size: 0.85rem;
            margin-top: 20px;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .input-group {
                grid-template-columns: 1fr;
            }
            
            .pair-bar {
                font-size: 0.85rem;
            }
            
            .pair-label {
                width: 50px;
            }
            
            .pair-value {
                width: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💱 Forex Strength</h1>
        <p class="subtitle">Compare currency strength across 15 major pairs in real time</p>
        
        <div class="input-group">
            <div class="input-field">
                <label for="currency1">Currency 1</label>
                <input type="text" id="currency1" placeholder="USD" value="USD" maxlength="3">
            </div>
            <div class="input-field">
                <label for="currency2">Currency 2</label>
                <input type="text" id="currency2" placeholder="EUR" value="EUR" maxlength="3">
            </div>
            <button onclick="fetchRates()">Compare</button>
        </div>
        
        <div id="content"></div>
        <div class="info">Live rates from Frankfurter (hourly updates). Enter ISO codes like USD, EUR, GBP, JPY, AUD, CAD, CHF, CNY, INR, MXN, NZD, SEK, SGD, ZAR.</div>
    </div>
    
    <script>
        const MAJOR_PAIRS = [
            'USD', 'EUR', 'GBP', 'JPY', 'AUD', 'CAD', 'CHF', 'CNY', 'INR', 'MXN', 'NZD', 'SEK', 'SGD', 'ZAR', 'HKD'
        ];
        
        async function fetchRates() {
            const c1 = document.getElementById('currency1').value.toUpperCase().trim();
            const c2 = document.getElementById('currency2').value.toUpperCase().trim();
            const content = document.getElementById('content');
            
            if (!c1 || !c2) {
                content.innerHTML = '<div class="error">Please enter both currency codes.</div>';
                return;
            }
            
            if (c1 === c2) {
                content.innerHTML = '<div class="error">Currencies must be different.</div>';
                return;
            }
            
            content.innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top: 15px;">Fetching live rates...</p></div>';
            
            try {
                // Fetch latest rates (base USD)
                const resp = await fetch('https://api.frankfurter.dev/v1/latest?base=USD');
                if (!resp.ok) throw new Error('API error: ' + resp.status);
                const data = await resp.json();
                
                // Fetch 24h ago rates for comparison
                const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
                const respYest = await fetch(`https://api.frankfurter.dev/v1/${yesterday}?base=USD`);
                const dataYest = respYest.ok ? await respYest.json() : null;
                
                // Get rates for all pairs
                const rates = data.rates || {};
                const ratesYest = dataYest?.rates || {};
                
                // Calculate 24h change for each currency pair
                const pairs = MAJOR_PAIRS.filter(p => p !== c1 && p !== c2).slice(0, 15);
                const changes = [];
                
                pairs.forEach(pair => {
                    const r = rates[pair] || 0;
                    const rY = ratesYest[pair] || r;
                    const change = rY ? ((r - rY) / rY) * 100 : 0;
                    changes.push({ pair, change, rate: r });
                });
                
                // Also get the selected pair
                const selectedChange = (() => {
                    const r = rates[c2] || 0;
                    const rY = ratesYest[c2] || r;
                    return rY ? ((r - rY) / rY) * 100 : 0;
                })();
                
                changes.sort((a, b) => b.change - a.change);
                
                // Render chart
                const maxChange = Math.max(...changes.map(c => Math.abs(c.change))) || 1;
                let html = `<div class="chart-container">
                    <div class="chart-title">24h Strength: ${c1} pairs (ranked by % change)</div>`;
                
                changes.forEach(c => {
                    const absChange = Math.abs(c.change);
                    const width = (absChange / maxChange) * 100;
                    const isSelected = c.pair === c2;
                    const highlightClass = isSelected ? 'highlight' : '';
                    const sign = c.change >= 0 ? '+' : '';
                    
                    html += `
                        <div class="pair-bar ${highlightClass}">
                            <div class="pair-label">${c1}/${c.pair}</div>
                            <div class="bar-bg">
                                <div class="bar-fill" style="width: ${width}%"></div>
                            </div>
                            <div class="pair-value">${sign}${c.change.toFixed(2)}%</div>
                        </div>
                    `;
                });
                
                html += `<div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #334155;">
                    <div style="font-size: 0.9rem; color: #cbd5e1; margin-bottom: 8px;">
                        <strong>Your pair:</strong> ${c1}/${c2}
                    </div>
                    <div style="font-size: 1.1rem; font-weight: 600; color: #fbbf24;">
                        ${selectedChange >= 0 ? '+' : ''}${selectedChange.toFixed(2)}% (24h)
                    </div>
                </div>`;
                
                html += '</div>';
                content.innerHTML = html;
                
            } catch (err) {
                content.innerHTML = `<div class="error">Error: ${err.message}. Check your currency codes and try again.</div>`;
            }
        }
        
        // Load on page open
        window.addEventListener('load', () => {
            setTimeout(() => fetchRates(), 100);
        });
    </script>
</body>
</html>
