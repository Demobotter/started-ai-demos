<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forex Strength</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      width: 100%;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #60a5fa, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      color: #94a3b8;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    input[type="text"] {
      flex: 1;
      min-width: 100px;
      padding: 10px 12px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #60a5fa;
      box-shadow: 0 0 8px rgba(96, 165, 250, 0.3);
    }
    button {
      padding: 10px 20px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
    .status {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 20px;
      min-height: 20px;
      font-size: 13px;
    }
    .status.loading {
      color: #60a5fa;
    }
    .status.error {
      color: #ef4444;
    }
    .chart-area {
      background: #0f172a;
      border-radius: 8px;
      padding: 20px;
      border: 1px solid #334155;
      margin-bottom: 20px;
    }
    .pair-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      margin-bottom: 8px;
      background: #1e293b;
      border-radius: 6px;
      border-left: 4px solid #475569;
      transition: all 0.2s;
    }
    .pair-row.selected {
      border-left-color: #fbbf24;
      background: rgba(251, 191, 36, 0.1);
    }
    .pair-row:hover {
      background: #334155;
      cursor: pointer;
    }
    .pair-label {
      font-weight: 600;
      font-size: 14px;
      min-width: 70px;
    }
    .bar-container {
      flex: 1;
      height: 24px;
      background: #0f172a;
      border-radius: 4px;
      margin: 0 12px;
      overflow: hidden;
      position: relative;
    }
    .bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      border-radius: 4px;
      transition: all 0.3s;
    }
    .bar.negative {
      background: linear-gradient(90deg, #ef4444, #f87171);
    }
    .pair-value {
      text-align: right;
      font-weight: 600;
      font-size: 14px;
      min-width: 50px;
      color: #f0fdf4;
    }
    .pair-value.negative {
      color: #fecaca;
    }
    .info-box {
      background: rgba(96, 165, 250, 0.1);
      border-left: 3px solid #60a5fa;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.5;
    }
    .rank-legend {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #334155;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }
    @media (max-width: 500px) {
      .container {
        padding: 24px;
      }
      h1 {
        font-size: 24px;
      }
      .input-group {
        flex-direction: column;
      }
      .pair-row {
        flex-direction: column;
        align-items: flex-start;
      }
      .bar-container {
        width: 100%;
        margin: 8px 0;
      }
      .pair-value {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💱 Forex Strength</h1>
    <div class="subtitle">Compare currency strength across 24h</div>
    
    <div class="input-group">
      <input type="text" id="curr1" placeholder="USD" value="USD" maxlength="3" style="text-transform: uppercase;">
      <input type="text" id="curr2" placeholder="EUR" value="EUR" maxlength="3" style="text-transform: uppercase;">
      <button onclick="loadData()">Rank</button>
    </div>
    
    <div class="status" id="status"></div>
    
    <div class="chart-area" id="chartArea" style="display: none;">
      <div id="bars"></div>
      <div class="rank-legend">
        Bars show 24h % change in each pair. Longer = stronger currency over 24h.
      </div>
    </div>
    
    <div class="info-box" id="infoBox" style="display: none;">
      <div id="infoText"></div>
    </div>
  </div>

  <script>
    const majorPairs = [
      'EURUSD', 'GBPUSD', 'USDJPY', 'USDCHF', 'AUDUSD',
      'NZDUSD', 'USDCAD', 'USDSEK', 'USDHKD', 'USDNOK',
      'USDSGD', 'USDTRY', 'USDZAR', 'EURCAD', 'EURGBP'
    ];

    async function loadData() {
      const curr1 = document.getElementById('curr1').value.toUpperCase().trim();
      const curr2 = document.getElementById('curr2').value.toUpperCase().trim();

      if (!curr1 || !curr2 || curr1 === curr2) {
        setStatus('Enter two different currency codes', 'error');
        return;
      }

      setStatus('Fetching live rates...', 'loading');
      document.getElementById('chartArea').style.display = 'none';
      document.getElementById('infoBox').style.display = 'none';

      try {
        const changes = {};

        for (const pair of majorPairs) {
          const r1 = await fetch(`https://api.frankfurter.app/latest?from=${pair.substring(0, 3)}&to=${pair.substring(3)}`);
          const r2 = await fetch(`https://api.frankfurter.app/1970-01-01?from=${pair.substring(0, 3)}&to=${pair.substring(3)}`);

          const d1 = await r1.json();
          const d2 = await r2.json();

          if (d1.rates && d2.rates) {
            const curr = pair.substring(3);
            const today = d1.rates[curr];
            const yesterday = d2.rates[curr];
            const pct = ((today - yesterday) / yesterday) * 100;
            changes[pair] = pct;
          }
        }

        renderChart(curr1, curr2, changes);
        setStatus(`Updated • ${new Date().toLocaleTimeString()}`);
      } catch (err) {
        setStatus('Failed to fetch rates. Check currencies.', 'error');
        console.error(err);
      }
    }

    function renderChart(curr1, curr2, allChanges) {
      const filtered = {};
      for (const pair in allChanges) {
        if (pair.includes(curr1) || pair.includes(curr2)) {
          filtered[pair] = allChanges[pair];
        }
      }

      if (Object.keys(filtered).length === 0) {
        setStatus('No pairs found with these currencies', 'error');
        return;
      }

      const sorted = Object.entries(filtered).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
      const max = Math.max(...sorted.map(([, v]) => Math.abs(v)));

      let html = '';
      for (const [pair, change] of sorted) {
        const pct = (change / max) * 100;
        const isNeg = change < 0;
        const barWidth = Math.abs(pct);
        const barClass = isNeg ? 'bar negative' : 'bar';
        const valueClass = isNeg ? 'pair-value negative' : 'pair-value';
        const isSelected = pair === `${curr1}${curr2}` || pair === `${curr2}${curr1}`;
        const rowClass = isSelected ? 'pair-row selected' : 'pair-row';

        html += `
          <div class="${rowClass}">
            <div class="pair-label">${pair}</div>
            <div class="bar-container">
              <div class="${barClass}" style="width: ${barWidth}%"></div>
            </div>
            <div class="${valueClass}">${change.toFixed(2)}%</div>
          </div>
        `;
      }

      document.getElementById('bars').innerHTML = html;
      document.getElementById('chartArea').style.display = 'block';

      const strength1 = calculateStrength(curr1, allChanges);
      const strength2 = calculateStrength(curr2, allChanges);
      const stronger = strength1 > strength2 ? curr1 : curr2;

      document.getElementById('infoText').innerHTML = `
        <strong>${curr1}:</strong> +${strength1.toFixed(2)}% strength (24h)<br>
        <strong>${curr2}:</strong> +${strength2.toFixed(2)}% strength (24h)<br>
        <strong>Stronger:</strong> ${stronger}
      `;
      document.getElementById('infoBox').style.display = 'block';
    }

    function calculateStrength(curr, changes) {
      let sum = 0;
      let count = 0;
      for (const [pair, change] of Object.entries(changes)) {
        if (pair.includes(curr)) {
          const isFirst = pair.substring(0, 3) === curr;
          sum += isFirst ? change : -change;
          count++;
        }
      }
      return count > 0 ? sum / count : 0;
    }

    function setStatus(msg, type = '') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + type;
    }

    // Load on start
    loadData();
  </script>
</body>
</html>
