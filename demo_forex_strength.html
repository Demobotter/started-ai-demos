<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forex Strength</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      width: 100%;
      background: #1e293b;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 2rem;
      margin-bottom: 8px;
      color: #f1f5f9;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }
    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    input {
      flex: 1;
      padding: 12px 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 1rem;
      text-transform: uppercase;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #06b6d4;
    }
    button {
      padding: 12px 28px;
      background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(6, 182, 212, 0.3);
    }
    button:active {
      transform: translateY(0);
    }
    .loading {
      text-align: center;
      padding: 24px;
      color: #94a3b8;
    }
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #334155;
      border-top-color: #06b6d4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .error {
      background: #7f1d1d;
      color: #fca5a5;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.95rem;
    }
    .results {
      display: none;
    }
    .results.show {
      display: block;
    }
    .pair-label {
      font-family: 'Poppins', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 20px;
      text-align: center;
    }
    .chart {
      margin-bottom: 28px;
    }
    .bar-row {
      display: flex;
      align-items: center;
      margin-bottom: 14px;
      gap: 12px;
    }
    .bar-label {
      width: 60px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: #cbd5e1;
    }
    .bar-container {
      flex: 1;
      height: 28px;
      background: #0f172a;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .bar {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      color: white;
      transition: width 0.4s ease;
    }
    .bar.positive {
      background: linear-gradient(90deg, #10b981 0%, #059669 100%);
    }
    .bar.negative {
      background: linear-gradient(90deg, #ef4444 0%, #dc2626 100%);
    }
    .bar-value {
      margin-left: 8px;
      min-width: 50px;
      text-align: right;
      color: #94a3b8;
      font-size: 0.85rem;
    }
    .highlight {
      background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
    }
    .highlight .bar {
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
    }
    .info-box {
      background: #0f172a;
      padding: 16px;
      border-radius: 8px;
      border-left: 3px solid #06b6d4;
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.5;
    }
    .timestamp {
      font-size: 0.8rem;
      color: #64748b;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💱 Forex Strength</h1>
    <p class="subtitle">Compare real 24h currency pair performance</p>

    <div class="input-group">
      <input type="text" id="curr1" placeholder="USD" maxlength="3" value="USD">
      <input type="text" id="curr2" placeholder="EUR" maxlength="3" value="EUR">
      <button onclick="fetchRates()">Compare</button>
    </div>

    <div id="error" class="error" style="display: none;"></div>
    <div id="loading" class="loading" style="display: none;">
      <div class="spinner"></div>
      <p style="margin-top: 12px;">Fetching live rates...</p>
    </div>

    <div id="results" class="results">
      <div class="pair-label" id="pairLabel"></div>
      <div class="chart" id="chart"></div>
      <div class="info-box">
        <strong>How it works:</strong> Each bar shows how much that currency pair moved in the last 24h. Positive = pair gained value, negative = pair fell. The highlighted pair is your selection.
      </div>
      <div class="timestamp" id="timestamp"></div>
    </div>
  </div>

  <script>
    const MAJOR_PAIRS = [
      'EURUSD', 'GBPUSD', 'USDJPY', 'AUDUSD', 'NZDUSD',
      'USDCAD', 'USDCHF', 'EURJPY', 'GBPJPY', 'EURGBP',
      'EURCAD', 'EURCHF', 'AUDNZD', 'NZDJPY', 'CADJPY'
    ];

    async function fetchRates() {
      const curr1 = document.getElementById('curr1').value.toUpperCase().trim();
      const curr2 = document.getElementById('curr2').value.toUpperCase().trim();

      if (!curr1 || !curr2 || curr1.length !== 3 || curr2.length !== 3) {
        showError('Enter valid 3-letter currency codes (e.g., USD, EUR)');
        return;
      }

      if (curr1 === curr2) {
        showError('Select two different currencies');
        return;
      }

      const selectedPair = curr1 + curr2;
      document.getElementById('error').style.display = 'none';
      document.getElementById('loading').style.display = 'block';
      document.getElementById('results').classList.remove('show');

      try {
        // Fetch today's rates
        const today = new Date();
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);

        const todayStr = formatDate(today);
        const yesterdayStr = formatDate(yesterday);

        const [todayData, yesterdayData] = await Promise.all([
          fetch(`https://api.frankfurter.dev/${todayStr}`).then(r => r.json()),
          fetch(`https://api.frankfurter.dev/${yesterdayStr}`).then(r => r.json())
        ]);

        if (!todayData.rates || !yesterdayData.rates) {
          throw new Error('Unable to fetch exchange rates');
        }

        // Calculate 24h changes for major pairs
        const changes = [];
        for (const pair of MAJOR_PAIRS) {
          const base = pair.substring(0, 3);
          const quote = pair.substring(3, 6);

          const todayRate = getTodayRate(todayData, base, quote);
          const yesterdayRate = getYesterdayRate(yesterdayData, base, quote);

          if (todayRate && yesterdayRate) {
            const change = ((todayRate - yesterdayRate) / yesterdayRate) * 100;
            changes.push({ pair, change });
          }
        }

        changes.sort((a, b) => b.change - a.change);

        renderChart(changes, selectedPair, todayStr);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('results').classList.add('show');
      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        showError('Error fetching rates: ' + err.message);
      }
    }

    function getTodayRate(data, base, quote) {
      // Use EUR as reference
      const baseToEur = base === 'EUR' ? 1 : (1 / (data.rates[base] || null));
      const quoteToEur = quote === 'EUR' ? 1 : (1 / (data.rates[quote] || null));
      if (!baseToEur || !quoteToEur) return null;
      return baseToEur / quoteToEur;
    }

    function getYesterdayRate(data, base, quote) {
      const baseToEur = base === 'EUR' ? 1 : (1 / (data.rates[base] || null));
      const quoteToEur = quote === 'EUR' ? 1 : (1 / (data.rates[quote] || null));
      if (!baseToEur || !quoteToEur) return null;
      return baseToEur / quoteToEur;
    }

    function renderChart(changes, selectedPair, date) {
      const maxChange = Math.max(...changes.map(c => Math.abs(c.change)));
      let html = '';

      for (const { pair, change } of changes) {
        const isHighlight = pair === selectedPair;
        const isPositive = change > 0;
        const width = (Math.abs(change) / maxChange) * 100;
        const sign = change > 0 ? '+' : '';

        html += `
          <div class="bar-row ${isHighlight ? 'highlight' : ''}">
            <div class="bar-label">${pair}</div>
            <div class="bar-container">
              <div class="bar ${isPositive ? 'positive' : 'negative'}" style="width: ${width}%">
                <span>${sign}${change.toFixed(2)}%</span>
              </div>
            </div>
            <div class="bar-value">${sign}${change.toFixed(3)}%</div>
          </div>
        `;
      }

      document.getElementById('pairLabel').textContent = `Strength Rank — ${selectedPair}`;
      document.getElementById('chart').innerHTML = html;
      document.getElementById('timestamp').textContent = `Last update: ${date}`;
    }

    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('results').classList.remove('show');
    }

    // Load on enter
    document.getElementById('curr1').addEventListener('keypress', (e) => e.key === 'Enter' && fetchRates());
    document.getElementById('curr2').addEventListener('keypress', (e) => e.key === 'Enter' && fetchRates());
  </script>
</body>
</html>
