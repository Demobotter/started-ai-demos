<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habitable Zone Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Mono', monospace;
      background: linear-gradient(135deg, #0B1929 0%, #0D1F2D 100%);
      color: #7DD3FC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      display: flex;
      gap: 30px;
      max-width: 1300px;
      width: 100%;
      background: rgba(10, 25, 41, 0.7);
      padding: 30px;
      border-radius: 8px;
      border: 1px solid #1E4D5F;
    }
    .sidebar {
      width: 300px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .canvas-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 650px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      color: #00FF00;
      margin-bottom: 10px;
      text-align: center;
      grid-column: 1 / -1;
    }
    canvas {
      border: 1px solid #1E4D5F;
      background: #0B1929;
      border-radius: 4px;
      flex: 1;
      min-height: 600px;
    }
    .control-group {
      background: rgba(0, 0, 0, 0.3);
      padding: 15px;
      border-radius: 4px;
      border: 1px solid #1E4D5F;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    label {
      font-size: 12px;
      text-transform: uppercase;
      color: #4DA8DA;
      font-weight: 700;
      letter-spacing: 1px;
    }
    select, input[type="range"] {
      background: #0D1F2D;
      color: #7DD3FC;
      border: 1px solid #1E4D5F;
      padding: 8px;
      border-radius: 4px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
    }
    input[type="range"] {
      cursor: pointer;
      width: 100%;
    }
    .stat-box {
      background: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-left: 3px solid #2D9D5F;
      border-radius: 2px;
      font-size: 11px;
      line-height: 1.6;
    }
    .stat-label {
      color: #4DA8DA;
      font-weight: 700;
    }
    .stat-value {
      color: #7DD3FC;
    }
    .habitability-indicator {
      text-align: center;
      padding: 10px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 14px;
    }
    .habitability-yes {
      background: rgba(45, 157, 95, 0.3);
      border: 1px solid #2D9D5F;
      color: #4FD46E;
    }
    .habitability-no {
      background: rgba(220, 20, 60, 0.2);
      border: 1px solid #DC143C;
      color: #FF6B6B;
    }
    .value-display {
      font-weight: 700;
      color: #00FF00;
    }
    @media (max-width: 1024px) {
      .container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
      }
      canvas {
        min-height: 400px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h1 style="text-align: left; margin: 0; margin-bottom: 20px;">Habitable Zone</h1>
      
      <div class="control-group">
        <label>Star</label>
        <select id="starSelect">
          <option value="sun">Sun (G-type)</option>
          <option value="proxima">Proxima Centauri (M-type)</option>
          <option value="sirius">Sirius (A-type)</option>
          <option value="trappist1">TRAPPIST-1 (M-type)</option>
          <option value="betelgeuse">Betelgeuse (M-type)</option>
        </select>
      </div>

      <div class="control-group">
        <label>Orbital Distance (AU): <span class="value-display" id="distDisplay">1.0</span></label>
        <input type="range" id="distanceSlider" min="0.1" max="10" step="0.05" value="1">
      </div>

      <div class="control-group">
        <label>Planet Mass (M⊕): <span class="value-display" id="massDisplay">1.0</span></label>
        <input type="range" id="massSlider" min="0.1" max="10" step="0.1" value="1">
      </div>

      <div class="control-group">
        <label>Orbit Eccentricity: <span class="value-display" id="eccDisplay">0.0</span></label>
        <input type="range" id="eccentricitySlider" min="0" max="0.9" step="0.05" value="0">
      </div>

      <div class="control-group">
        <label>Surface Pressure (atm): <span class="value-display" id="pressDisplay">1.0</span></label>
        <input type="range" id="pressureSlider" min="0.1" max="5" step="0.1" value="1">
      </div>

      <div class="control-group">
        <label>Albedo: <span class="value-display" id="albedoDisplay">0.3</span></label>
        <input type="range" id="albedoSlider" min="0.1" max="0.9" step="0.05" value="0.3">
      </div>

      <div class="stat-box">
        <div class="stat-label">STAR</div>
        <div class="stat-value" id="starName">Sun</div>
        <div style="color: #666; margin-top: 3px;" id="starStats"></div>
      </div>

      <div class="stat-box">
        <div class="stat-label">EQUILIBRIUM TEMP</div>
        <div class="stat-value" id="tempValue">288 K</div>
        <div style="color: #666; margin-top: 3px;">↑ closer to star | ↓ farther away</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">HABITABLE ZONE</div>
        <div class="stat-value" id="hzValue">0.95 - 1.37 AU</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">STELLAR FLUX</div>
        <div class="stat-value" id="fluxValue">1361 W/m²</div>
        <div style="color: #666; margin-top: 3px;">(Earth = 1361)</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">WATER STATE</div>
        <div id="waterPhase"></div>
      </div>

      <div id="habitability" class="habitability-indicator habitability-no">⚠ Not Habitable</div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <script>
    // REAL STELLAR DATA (Hipparcos/Gaia catalogues)
    const stars = {
      sun: { name: 'Sun', luminosity: 1.0, temp: 5778, color: '#FFFF00', radius: 1.0, type: 'G2V' },
      proxima: { name: 'Proxima Centauri', luminosity: 0.0017, temp: 3042, color: '#DC143C', radius: 0.14, type: 'M5.5V' },
      sirius: { name: 'Sirius A', luminosity: 25.4, temp: 9940, color: '#4169E1', radius: 1.71, type: 'A1V' },
      trappist1: { name: 'TRAPPIST-1', luminosity: 0.0005, temp: 2566, color: '#8B0000', radius: 0.117, type: 'M8V' },
      betelgeuse: { name: 'Betelgeuse', luminosity: 170000, temp: 3500, color: '#FF4500', radius: 700, type: 'M1-2 Ia' }
    };

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const container = canvas.parentElement;

    function resizeCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let currentStar = 'sun';
    let currentDistance = 1.0;
    let currentMass = 1.0;
    let currentEccentricity = 0.0;
    let currentPressure = 1.0;
    let currentAlbedo = 0.3;
    let animationTime = 0;

    // PHYSICS: Stefan-Boltzmann equation for equilibrium temperature
    // T_eq = [L / (16π d² σ)]^0.25 × (1 - albedo)^0.25 × greenhouse_factor
    function calculateEquilibriumTemp(luminosity, distance, albedo, pressure) {
      const sigma = 5.67e-8; // Stefan-Boltzmann constant
      const au_to_m = 1.496e11; // AU to meters
      const d_m = distance * au_to_m;
      
      // Stellar flux at planet: F = L / (4π d²)
      const flux = (luminosity * 3.828e26) / (4 * Math.PI * d_m * d_m);
      
      // Temperature: T = [F(1-A) / σ]^0.25 with greenhouse warming
      const greenhouse = 1.0 + (pressure - 1.0) * 0.15; // pressure increases greenhouse effect
      const temp_K = Math.pow((flux * (1 - albedo)) / sigma, 0.25) * greenhouse;
      
      return temp_K;
    }

    // Habitable zone calculation (inner and outer bounds in AU)
    function calculateHabitableZone(luminosity) {
      // Inner edge: where CO₂ greenhouse runaway begins (~340 K effective with albedo 0.3)
      // Outer edge: where CO₂ condenses (~273 K effective)
      // Using Kopparapu et al. empirical formula scaled to luminosity
      const inner_AU = Math.sqrt(luminosity / 1.1);
      const outer_AU = Math.sqrt(luminosity / 0.53);
      return { inner: inner_AU, outer: outer_AU };
    }

    // Water phase based on temperature and pressure
    function getWaterPhase(temp_K, pressure) {
      // Pressure-dependent boiling points (approximated)
      const boiling_points = {
        0.1: 319,   // 46°C
        0.5: 384,   // 111°C
        1.0: 373,   // 100°C
        2.0: 394,   // 121°C
        5.0: 426    // 153°C
      };
      
      let boil = 373;
      if (pressure <= 0.1) boil = 319;
      else if (pressure <= 1.0) boil = 273 + 100 * (pressure - 0.1) / 0.9;
      else if (pressure <= 5.0) boil = 373 + 53 * (pressure - 1.0) / 4.0;
      else boil = 426;
      
      const melt = 273; // Ice melts at 0°C
      
      if (temp_K < melt) return 'ice';
      if (temp_K > boil) return 'vapor';
      return 'liquid';
    }

    function updateStats() {
      const star = stars[currentStar];
      const temp = calculateEquilibriumTemp(star.luminosity, currentDistance, currentAlbedo, currentPressure);
      const hz = calculateHabitableZone(star.luminosity);
      const phase = getWaterPhase(temp, currentPressure);
      const flux = (star.luminosity * 1361) / (currentDistance * currentDistance);
      
      // Check habitability: is planet in HZ and is water liquid?
      const inHZ = currentDistance >= hz.inner && currentDistance <= hz.outer;
      const waterLiquid = phase === 'liquid';
      const isHabitable = inHZ && waterLiquid;
      
      document.getElementById('starName').textContent = star.name;
      document.getElementById('starStats').textContent = `Type: ${star.type} | ${star.temp}K`;
      document.getElementById('tempValue').textContent = `${Math.round(temp)} K`;
      document.getElementById('hzValue').textContent = `${hz.inner.toFixed(2)} - ${hz.outer.toFixed(2)} AU`;
      document.getElementById('fluxValue').textContent = `${Math.round(flux)} W/m²`;
      
      const phaseEmoji = { liquid: '💧', ice: '❄️', vapor: '☁️' };
      const phaseText = { liquid: 'Liquid Water', ice: 'Frozen', vapor: 'Vapor' };
      document.getElementById('waterPhase').innerHTML = `${phaseEmoji[phase]} ${phaseText[phase]}`;
      
      const habitDiv = document.getElementById('habitability');
      if (isHabitable) {
        habitDiv.className = 'habitability-indicator habitability-yes';
        habitDiv.textContent = '✓ Habitable';
      } else {
        habitDiv.className = 'habitability-indicator habitability-no';
        habitDiv.textContent = '⚠ Not Habitable';
      }
      
      document.getElementById('distDisplay').textContent = currentDistance.toFixed(2);
      document.getElementById('massDisplay').textContent = currentMass.toFixed(1);
      document.getElementById('eccDisplay').textContent = currentEccentricity.toFixed(2);
      document.getElementById('pressDisplay').textContent = currentPressure.toFixed(1);
      document.getElementById('albedoDisplay').textContent = currentAlbedo.toFixed(2);
    }

    function drawScene() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      
      // Clear background with stars
      ctx.fillStyle = '#0B1929';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Draw background stars
      ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
      for (let i = 0; i < 50; i++) {
        const x = (i * 73.5 + animationTime * 5) % canvas.width;
        const y = (i * 47.3) % canvas.height;
        ctx.fillRect(x, y, 1, 1);
      }
      
      const star = stars[currentStar];
      const hz = calculateHabitableZone(star.luminosity);
      const temp = calculateEquilibriumTemp(star.luminosity, currentDistance, currentAlbedo, currentPressure);
      
      // Scale: 1 AU = 120 pixels (adjusted for large luminosity range)
      let scale = 120;
      if (star.luminosity > 100) scale = 40;
      else if (star.luminosity > 10) scale = 60;
      else if (star.luminosity < 0.01) scale = 200;
      
      const starRadius = Math.max(10, Math.min(80, Math.sqrt(star.luminosity) * 30));
      
      // Draw star
      ctx.fillStyle = star.color;
      ctx.beginPath();
      ctx.arc(centerX, centerY, starRadius, 0, Math.PI * 2);
      ctx.fill();
      
      // Star glow
      const grad = ctx.createRadialGradient(centerX, centerY, starRadius, centerX, centerY, starRadius * 2.5);
      grad.addColorStop(0, `${star.color}80`);
      grad.addColorStop(1, `${star.color}00`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(centerX, centerY, starRadius * 2.5, 0, Math.PI * 2);
      ctx.fill();
      
      // Draw habitable zone (inner)
      const hzInnerRadius = hz.inner * scale;
      const hzOuterRadius = hz.outer * scale;
      ctx.strokeStyle = `rgba(0, 255, 0, ${0.3 + 0.2 * Math.sin(animationTime * 0.05)})`;
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(centerX, centerY, hzInnerRadius, 0, Math.PI * 2);
      ctx.stroke();
      
      // Draw habitable zone (outer)
      ctx.beginPath();
      ctx.arc(centerX, centerY, hzOuterRadius, 0, Math.PI * 2);
      ctx.stroke();
      
      // Zone fill (subtle)
      ctx.fillStyle = 'rgba(0, 255, 0, 0.05)';
      ctx.beginPath();
      ctx.arc(centerX, centerY, hzOuterRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(centerX, centerY, hzInnerRadius, 0, Math.PI * 2);
      ctx.fill();
      
      // Orbital path
      const a = currentDistance * scale;
      const b = a * Math.sqrt(1 - currentEccentricity * currentEccentricity);
      ctx.strokeStyle = 'rgba(100, 150, 200, 0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let t = 0; t < Math.PI * 2; t += 0.05) {
        const x = centerX + a * Math.cos(t);
        const y = centerY + b * Math.sin(t);
        if (t === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
      
      // Planet position (elliptical orbit with eccentricity)
      const orbitTime = (animationTime * 0.01 + Math.PI) % (Math.PI * 2);
      const planetX = centerX + a * Math.cos(orbitTime);
      const planetY = centerY + b * Math.sin(orbitTime);
      
      // Temperature-based planet color
      let planetColor;
      if (temp < 273) planetColor = '#F0F8FF'; // frozen white
      else if (temp < 280) planetColor = '#00D4FF'; // cold cyan
      else if (temp < 288) planetColor = '#4DA8DA'; // cool blue
      else if (temp < 310) planetColor = '#4FD46E'; // habitable green-blue
      else if (temp < 330) planetColor = '#FFA500'; // warm orange
      else planetColor = '#FF4444'; // hot red
      
      ctx.fillStyle = planetColor;
      ctx.beginPath();
      ctx.arc(planetX, planetY, 8, 0, Math.PI * 2);
      ctx.fill();
      
      // Planet glow
      const pGrad = ctx.createRadialGradient(planetX, planetY, 8, planetX, planetY, 16);
      pGrad.addColorStop(0, `${planetColor}60`);
      pGrad.addColorStop(1, `${planetColor}00`);
      ctx.fillStyle = pGrad;
      ctx.beginPath();
      ctx.arc(planetX, planetY, 16, 0, Math.PI * 2);
      ctx.fill();
      
      // Labels
      ctx.fillStyle = '#7DD3FC';
      ctx.font = '12px "Space Mono"';
      ctx.textAlign = 'center';
      ctx.fillText('HZ', centerX, centerY - (hzInnerRadius + hzOuterRadius) / 2);
      
      animationTime++;
    }

    function animate() {
      drawScene();
      requestAnimationFrame(animate);
    }

    document.getElementById('starSelect').addEventListener('change', (e) => {
      currentStar = e.target.value;
      updateStats();
    });

    document.getElementById('distanceSlider').addEventListener('input', (e) => {
      currentDistance = parseFloat(e.target.value);
      updateStats();
    });

    document.getElementById('massSlider').addEventListener('input', (e) => {
      currentMass = parseFloat(e.target.value);
    });

    document.getElementById('eccentricitySlider').addEventListener('input', (e) => {
      currentEccentricity = parseFloat(e.target.value);
      updateStats();
    });

    document.getElementById('pressureSlider').addEventListener('input', (e) => {
      currentPressure = parseFloat(e.target.value);
      updateStats();
    });

    document.getElementById('albedoSlider').addEventListener('input', (e) => {
      currentAlbedo = parseFloat(e.target.value);
      updateStats();
    });

    updateStats();
    animate();
  </script>
</body>
</html>
