<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbital Mechanics Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Space Mono', monospace;
      background: linear-gradient(135deg, #0a0e27 0%, #1a0a3a 50%, #0e1f3a 100%);
      color: #e0e6ff;
      overflow-x: hidden;
    }

    /* Starfield background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(1px 1px at 20% 30%, #00ffff, transparent),
        radial-gradient(1px 1px at 60% 70%, #ff00ff, transparent),
        radial-gradient(1px 1px at 50% 50%, #00ff88, transparent),
        radial-gradient(1px 1px at 80% 10%, #ffff00, transparent),
        radial-gradient(1px 1px at 10% 90%, #ff0088, transparent);
      background-size: 200% 200%, 150% 150%, 180% 180%, 220% 220%, 190% 190%;
      background-position: 0% 0%, 100% 100%, 50% 50%, 75% 25%, 25% 75%;
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Hero */
    .hero {
      text-align: center;
      margin-bottom: 2rem;
      animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(3rem, 8vw, 5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #00ffff, #ff00ff, #ff88ff, #00ffff);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 4s ease-in-out infinite;
      margin-bottom: 0.5rem;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .subtitle {
      font-family: 'Space Mono', monospace;
      font-size: 0.95rem;
      color: #b0b8ff;
      margin-bottom: 1.5rem;
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Main grid */
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
    }

    /* Orbit canvas */
    .canvas-panel {
      display: flex;
      flex-direction: column;
      background: rgba(10, 15, 40, 0.5);
      border: 2px solid #00ffff;
      border-radius: 12px;
      padding: 1.5rem;
      backdrop-filter: blur(8px);
      min-height: 600px;
      justify-content: center;
      align-items: center;
    }

    svg {
      width: 100%;
      max-width: 500px;
      height: auto;
      aspect-ratio: 1;
      filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.2));
    }

    /* Controls panel */
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .control-box {
      background: rgba(20, 10, 50, 0.6);
      border: 2px solid #ff00ff;
      border-radius: 12px;
      padding: 1.5rem;
      backdrop-filter: blur(8px);
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .control-box:nth-child(1) { animation-delay: 0.4s; }
    .control-box:nth-child(2) { animation-delay: 0.5s; }
    .control-box:nth-child(3) { animation-delay: 0.6s; }
    .control-box:nth-child(4) { animation-delay: 0.7s; }

    .control-label {
      font-size: 0.9rem;
      font-weight: 700;
      color: #00ffff;
      margin-bottom: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="range"] {
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(90deg, #00ffff, #ff00ff);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00ffff, #ff00ff);
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
      transition: box-shadow 0.2s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      box-shadow: 0 0 20px rgba(0, 255, 255, 1);
    }

    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00ffff, #ff00ff);
      cursor: pointer;
      border: none;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
      transition: box-shadow 0.2s;
    }

    input[type="range"]::-moz-range-thumb:hover {
      box-shadow: 0 0 20px rgba(0, 255, 255, 1);
    }

    .control-value {
      margin-top: 0.8rem;
      font-size: 1.2rem;
      font-weight: 700;
      color: #00ffff;
      font-family: 'Space Mono', monospace;
      letter-spacing: 0.05em;
    }

    /* Stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .stat-item {
      background: rgba(10, 20, 60, 0.7);
      border-left: 4px solid #ff00ff;
      padding: 1.2rem;
      border-radius: 8px;
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .stat-item:nth-child(1) { animation-delay: 0.8s; }
    .stat-item:nth-child(2) { animation-delay: 0.9s; }
    .stat-item:nth-child(3) { animation-delay: 1s; }
    .stat-item:nth-child(4) { animation-delay: 1.1s; }

    .stat-label {
      font-size: 0.75rem;
      color: #80a8ff;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: #00ffff;
      font-family: 'Space Mono', monospace;
    }

    /* Mobile */
    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .canvas-panel {
        min-height: 400px;
      }

      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      main {
        padding: 1rem;
      }

      h1 {
        font-size: clamp(1.8rem, 6vw, 3rem);
      }

      .canvas-panel {
        min-height: 300px;
        padding: 1rem;
      }

      .control-box {
        padding: 1rem;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Respect motion preference */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="hero">
      <h1>Orbital Mechanics</h1>
      <p class="subtitle">Adjust the orbit parameters and watch a satellite dance around the Earth</p>
    </div>

    <div class="container">
      <!-- Orbit visualization -->
      <div class="canvas-panel">
        <svg id="orbitSVG" viewBox="0 0 600 600">
          <!-- Defs for styling -->
          <defs>
            <radialGradient id="earthGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" style="stop-color:#4da6ff;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#003d99;stop-opacity:1" />
            </radialGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>

          <!-- Stars (background)-->
          <circle cx="150" cy="80" r="1" fill="#ffffff" opacity="0.6"/>
          <circle cx="500" cy="120" r="0.8" fill="#ffff00" opacity="0.5"/>
          <circle cx="120" cy="480" r="1.2" fill="#ff00ff" opacity="0.4"/>
          <circle cx="550" cy="450" r="0.7" fill="#00ffff" opacity="0.5"/>

          <!-- Orbit ellipse -->
          <ellipse id="orbitEllipse" cx="300" cy="300" rx="200" ry="150" 
                   fill="none" stroke="#00ffff" stroke-width="1" opacity="0.4" stroke-dasharray="5,5"/>

          <!-- Focus points (faint) -->
          <circle id="focus1" cx="300" cy="300" r="2" fill="#ff00ff" opacity="0.3"/>
          <circle id="focus2" cx="300" cy="300" r="2" fill="#ff00ff" opacity="0.3"/>

          <!-- Earth at primary focus -->
          <circle cx="300" cy="300" r="18" fill="url(#earthGrad)" filter="url(#glow)"/>
          <circle cx="305" cy="295" r="6" fill="#00ff88" opacity="0.4"/>

          <!-- Satellite -->
          <g id="satellite">
            <circle id="satCircle" cx="500" cy="300" r="4" fill="#ffff00" filter="url(#glow)"/>
            <path id="satTrail" d="" stroke="#00ffff" stroke-width="0.5" fill="none" opacity="0.3"/>
          </g>

          <!-- Aphelion/perihelion markers -->
          <line id="apheliLine" x1="300" y1="300" x2="500" y2="300" 
                stroke="#ff88ff" stroke-width="1" opacity="0.2" stroke-dasharray="3,3"/>
          <circle id="apheliMarker" cx="500" cy="300" r="3" fill="none" stroke="#ff00ff" stroke-width="1" opacity="0.5"/>
          <text id="apheliLabel" x="510" y="295" font-size="10" fill="#ff00ff" opacity="0.6">AP</text>

          <line id="periheliLine" x1="300" y1="300" x2="100" y2="300" 
                stroke="#88ff88" stroke-width="1" opacity="0.2" stroke-dasharray="3,3"/>
          <circle id="periheliMarker" cx="100" cy="300" r="3" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
          <text id="periheliLabel" x="70" y="295" font-size="10" fill="#00ff88" opacity="0.6">PE</text>

          <!-- Speed indicator -->
          <text id="speedLabel" x="300" y="530" font-size="11" fill="#ffff00" text-anchor="middle" opacity="0.7">Speed: -- km/s</text>
        </svg>
      </div>

      <!-- Controls -->
      <div class="controls-panel">
        <!-- Semimajor axis -->
        <div class="control-box">
          <div class="control-label">Semimajor Axis (a)</div>
          <input type="range" id="semiMajorSlider" min="4000" max="15000" value="8000" step="100">
          <div class="control-value"><span id="semiMajorValue">8000</span> km</div>
        </div>

        <!-- Eccentricity -->
        <div class="control-box">
          <div class="control-label">Eccentricity (e)</div>
          <input type="range" id="eccentricitySlider" min="0" max="0.95" value="0.3" step="0.05">
          <div class="control-value"><span id="eccentricityValue">0.30</span></div>
        </div>

        <!-- Stats -->
        <div class="control-box">
          <div class="stats-grid">
            <div class="stat-item">
              <div class="stat-label">Orbital Period</div>
              <div class="stat-value"><span id="periodValue">2.8</span>h</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">Aphelion</div>
              <div class="stat-value"><span id="aphelionValue">10.4</span>k km</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">Perihelion</div>
              <div class="stat-value"><span id="perihelionValue">5.6</span>k km</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">Semi-minor Axis</div>
              <div class="stat-value"><span id="semiMinorValue">7.6</span>k km</div>
            </div>
          </div>
        </div>

        <!-- Reset button -->
        <button id="resetBtn" style="
          padding: 1rem;
          background: linear-gradient(135deg, #00ffff, #ff00ff);
          color: #000;
          border: none;
          border-radius: 8px;
          font-size: 1rem;
          font-weight: 700;
          cursor: pointer;
          transition: transform 0.2s, box-shadow 0.2s;
          font-family: 'Syne', sans-serif;
          letter-spacing: 0.05em;
        ">RESET ORBIT</button>
      </div>
    </div>
  </main>

  <script>
    // ============ KEPLER ORBITAL MECHANICS ============

    function calculateOrbitalPeriod(a_km) {
      const GM = 398600; // km³/s² (Earth)
      const T_seconds = 2 * Math.PI * Math.sqrt((a_km ** 3) / GM);
      return T_seconds / 3600; // hours
    }

    function calculateSemiminorAxis(a, e) {
      if (e >= 1) return 0;
      return a * Math.sqrt(1 - e * e);
    }

    function calculateAphelion(a, e) {
      return a * (1 + e);
    }

    function calculatePerihelion(a, e) {
      return a * (1 - e);
    }

    function getSatellitePositionAtTrueAnomaly(a, e, trueAnomaly_rad) {
      const numerator = a * (1 - e * e);
      const denominator = 1 + e * Math.cos(trueAnomaly_rad);
      return numerator / denominator;
    }

    function getOrbitalSpeed(a, e, r) {
      const GM = 398600;
      const v_squared = GM * (2 / r - 1 / a);
      return Math.sqrt(Math.max(0, v_squared)); // km/s
    }

    function getCartesianFromPolar(r, angle, cx, cy, pixelScale) {
      return {
        x: cx + r * Math.cos(angle) * pixelScale,
        y: cy + r * Math.sin(angle) * pixelScale
      };
    }

    // ============ DOM & STATE ============

    const semiMajorSlider = document.getElementById('semiMajorSlider');
    const eccentricitySlider = document.getElementById('eccentricitySlider');
    const orbitEllipse = document.getElementById('orbitEllipse');
    const satCircle = document.getElementById('satCircle');
    const satTrail = document.getElementById('satTrail');
    const apheliLine = document.getElementById('apheliLine');
    const apheliMarker = document.getElementById('apheliMarker');
    const apheliLabel = document.getElementById('apheliLabel');
    const periheliLine = document.getElementById('periheliLine');
    const periheliMarker = document.getElementById('periheliMarker');
    const periheliLabel = document.getElementById('periheliLabel');
    const focus1 = document.getElementById('focus1');
    const focus2 = document.getElementById('focus2');
    const speedLabel = document.getElementById('speedLabel');
    const resetBtn = document.getElementById('resetBtn');

    const svg = document.getElementById('orbitSVG');
    const viewBoxW = 600, viewBoxH = 600;
    const centerX = 300, centerY = 300;

    let state = {
      a: 8000,
      e: 0.3,
      trueAnomaly: 0,
      trail: []
    };

    let animationId = null;
    const pixelsPerKm = 0.025; // scale factor for orbit display

    function updateOrbits() {
      state.a = parseFloat(semiMajorSlider.value);
      state.e = parseFloat(eccentricitySlider.value);
      state.trueAnomaly = 0; // reset animation
      state.trail = [];

      const b = calculateSemiminorAxis(state.a, state.e);
      const aph = calculateAphelion(state.a, state.e);
      const per = calculatePerihelion(state.a, state.e);
      const c = state.a * state.e; // distance from center to focus

      // Update ellipse
      const rxPixels = state.a * pixelsPerKm;
      const ryPixels = b * pixelsPerKm;
      orbitEllipse.setAttribute('rx', rxPixels);
      orbitEllipse.setAttribute('ry', ryPixels);

      // Update foci positions
      const focusOffsetX = c * pixelsPerKm;
      focus1.setAttribute('cx', centerX - focusOffsetX);
      focus1.setAttribute('cy', centerY);
      focus2.setAttribute('cx', centerX + focusOffsetX);
      focus2.setAttribute('cy', centerY);

      // Update perihelion/aphelion lines & markers
      const perPixels = per * pixelsPerKm;
      const aphPixels = aph * pixelsPerKm;
      periheliLine.setAttribute('x2', centerX - perPixels);
      periheliMarker.setAttribute('cx', centerX - perPixels);
      periheliLabel.setAttribute('x', centerX - perPixels - 30);
      apheliLine.setAttribute('x2', centerX + aphPixels);
      apheliMarker.setAttribute('cx', centerX + aphPixels);
      apheliLabel.setAttribute('x', centerX + aphPixels + 10);

      // Update stats
      const period = calculateOrbitalPeriod(state.a);
      document.getElementById('semiMajorValue').textContent = state.a.toLocaleString();
      document.getElementById('eccentricityValue').textContent = state.e.toFixed(2);
      document.getElementById('periodValue').textContent = period.toFixed(1);
      document.getElementById('aphelionValue').textContent = (aph / 1000).toFixed(1);
      document.getElementById('perihelionValue').textContent = (per / 1000).toFixed(1);
      document.getElementById('semiMinorValue').textContent = (b / 1000).toFixed(1);

      // Reset animation
      if (animationId) cancelAnimationFrame(animationId);
      animateSatellite();
    }

    function animateSatellite() {
      function step() {
        state.trueAnomaly += 0.02; // radians per frame
        if (state.trueAnomaly > 2 * Math.PI) {
          state.trueAnomaly = 0;
          state.trail = [];
        }

        const r = getSatellitePositionAtTrueAnomaly(state.a, state.e, state.trueAnomaly);
        const angle = state.trueAnomaly;
        const pos = getCartesianFromPolar(r, angle, centerX, centerY, pixelsPerKm);

        satCircle.setAttribute('cx', pos.x);
        satCircle.setAttribute('cy', pos.y);

        // Trail
        state.trail.push(`${pos.x},${pos.y}`);
        if (state.trail.length > 120) state.trail.shift();
        satTrail.setAttribute('d', `M ${state.trail.join(' L ')}`);

        // Speed
        const speed = getOrbitalSpeed(state.a, state.e, r);
        speedLabel.textContent = `Speed: ${speed.toFixed(2)} km/s`;

        animationId = requestAnimationFrame(step);
      }
      step();
    }

    function reset() {
      semiMajorSlider.value = 8000;
      eccentricitySlider.value = 0.3;
      updateOrbits();
    }

    // Event listeners
    semiMajorSlider.addEventListener('input', updateOrbits);
    eccentricitySlider.addEventListener('input', updateOrbits);
    resetBtn.addEventListener('click', reset);

    // Initialize
    updateOrbits();
  </script>
</body>
</html>
