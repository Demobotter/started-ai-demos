<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbital Mechanics</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: #0a0e27; 
      color: #e0e0e0; 
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #0f1437;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 255, 255, 0.1);
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.2em;
      margin-bottom: 8px;
      color: #00ffff;
      font-weight: 700;
    }
    .subtitle {
      font-size: 0.9em;
      color: #888;
      margin-bottom: 24px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
      padding: 16px;
      background: rgba(0, 255, 255, 0.05);
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 255, 0.2);
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-group label {
      font-size: 0.85em;
      font-weight: 600;
      color: #00ffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select, input[type="range"] {
      padding: 8px 12px;
      background: #1a1f3a;
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 6px;
      color: #e0e0e0;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
    }
    select:focus, input[type="range"]:focus { outline: none; border-color: #00ffff; }
    .visualization {
      background: #0a0e27;
      border-radius: 8px;
      border: 2px solid rgba(0, 255, 255, 0.2);
      margin-bottom: 24px;
      padding: 16px;
      text-align: center;
    }
    svg {
      width: 100%;
      max-width: 600px;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      padding: 16px;
      background: rgba(0, 255, 136, 0.05);
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 136, 0.2);
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-label {
      font-size: 0.75em;
      text-transform: uppercase;
      color: #00ff88;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .stat-value {
      font-size: 1.3em;
      font-weight: 700;
      color: #00ffff;
      font-family: 'Syne', sans-serif;
    }
    .hint {
      margin-top: 16px;
      padding: 12px;
      background: rgba(255, 183, 0, 0.05);
      border-left: 3px solid #ffb700;
      font-size: 0.85em;
      color: #ffb700;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛰️ Orbital Mechanics</h1>
    <p class="subtitle">Real Kepler physics — watch satellites orbit with true gravitational dynamics</p>
    
    <div class="controls">
      <div class="control-group">
        <label>Orbit Type</label>
        <select id="orbitType">
          <option value="ellipse">Elliptical</option>
          <option value="circle">Circular</option>
          <option value="parabolic">Parabolic Escape</option>
        </select>
      </div>
      <div class="control-group">
        <label>Semi-Major Axis</label>
        <input type="range" id="semiMajor" min="80" max="200" step="5" value="120">
      </div>
      <div class="control-group">
        <label>Eccentricity</label>
        <input type="range" id="eccentricity" min="0" max="0.8" step="0.05" value="0.3">
      </div>
      <div class="control-group">
        <label>Time Warp</label>
        <input type="range" id="timeWarp" min="0.5" max="5" step="0.5" value="1">
      </div>
    </div>

    <div class="visualization">
      <svg viewBox="0 0 500 500" id="orbitSvg">
        <defs>
          <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#ffff00;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ff8800;stop-opacity:1" />
          </radialGradient>
        </defs>
        <!-- Orbital ellipse -->
        <ellipse id="orbitPath" cx="250" cy="250" rx="120" ry="90" fill="none" stroke="rgba(0,255,255,0.3)" stroke-width="1.5"/>
        <!-- Sun -->
        <circle id="sun" cx="250" cy="250" r="12" fill="url(#sunGrad)" />
        <!-- Satellite trail -->
        <polyline id="trail" points="" fill="none" stroke="rgba(0,255,255,0.4)" stroke-width="1"/>
        <!-- Satellite -->
        <circle id="satellite" cx="250" cy="140" r="5" fill="#00ffff" />
        <!-- Velocity vector -->
        <line id="velocityVec" x1="250" y1="140" x2="250" y2="140" stroke="rgba(255,0,255,0.6)" stroke-width="2" />
      </svg>
    </div>

    <div class="stats">
      <div class="stat-item">
        <div class="stat-label">Distance (AU)</div>
        <div class="stat-value" id="distance">1.00</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Speed (km/s)</div>
        <div class="stat-value" id="speed">30.0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Orbital Period</div>
        <div class="stat-value" id="period">365d</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Anomaly (°)</div>
        <div class="stat-value" id="anomaly">0°</div>
      </div>
    </div>

    <div class="hint">
      💡 Adjust semi-major axis & eccentricity to see real Kepler physics. Period squares with axis cubed.
    </div>
  </div>

  <script>
    (function() {
      const svg = document.getElementById('orbitSvg');
      const orbitPath = document.getElementById('orbitPath');
      const satellite = document.getElementById('satellite');
      const velocityVec = document.getElementById('velocityVec');
      const trail = document.getElementById('trail');
      
      const state = {
        orbitType: 'ellipse',
        semiMajor: 120,
        eccentricity: 0.3,
        timeWarp: 1,
        trueAnomaly: 0,
        trailPoints: [],
      };

      // Controls
      document.getElementById('orbitType').addEventListener('change', (e) => {
        state.orbitType = e.target.value;
        if (e.target.value === 'parabolic') {
          document.getElementById('eccentricity').value = 1;
          document.getElementById('eccentricity').disabled = true;
        } else {
          document.getElementById('eccentricity').disabled = false;
        }
      });
      document.getElementById('semiMajor').addEventListener('input', (e) => {
        state.semiMajor = parseFloat(e.target.value);
      });
      document.getElementById('eccentricity').addEventListener('input', (e) => {
        state.eccentricity = parseFloat(e.target.value);
      });
      document.getElementById('timeWarp').addEventListener('input', (e) => {
        state.timeWarp = parseFloat(e.target.value);
      });

      const center = { x: 250, y: 250 };
      const AU = 50; // pixels per AU

      function updateOrbitalPath() {
        const a = state.semiMajor;
        const e = Math.min(state.eccentricity, 0.99);
        const b = a * Math.sqrt(1 - e * e);
        orbitPath.setAttribute('rx', a);
        orbitPath.setAttribute('ry', b);
        // Offset by focal distance
        const c = a * e;
        orbitPath.setAttribute('cx', center.x + c);
      }

      function polarToCartesian(r, theta) {
        return {
          x: center.x + r * Math.cos(theta),
          y: center.y - r * Math.sin(theta),
        };
      }

      function getOrbitalRadius(anomaly, a, e) {
        // r = a(1 - e²) / (1 + e cos(ν))
        return (a * (1 - e * e)) / (1 + e * Math.cos(anomaly));
      }

      function getOrbitalSpeed(r, a) {
        // vis-viva: v² = GM(2/r - 1/a)  [normalized units]
        const mu = 1; // gravitational parameter
        return Math.sqrt(mu * (2 / r - 1 / a));
      }

      function step() {
        updateOrbitalPath();

        const a = state.semiMajor;
        const e = Math.min(state.eccentricity, 0.99);
        
        // Update true anomaly
        const period = 365 * Math.sqrt((a / 150) ** 3); // Kepler's 3rd law (earth-relative)
        const dAnomaly = (2 * Math.PI / period) * state.timeWarp * 0.05; // 50ms step
        state.trueAnomaly = (state.trueAnomaly + dAnomaly) % (2 * Math.PI);

        // Orbital radius
        const r = getOrbitalRadius(state.trueAnomaly, a, e);

        // Position
        const pos = polarToCartesian(r, state.trueAnomaly);
        satellite.setAttribute('cx', pos.x);
        satellite.setAttribute('cy', pos.y);

        // Trail
        state.trailPoints.push(`${pos.x},${pos.y}`);
        if (state.trailPoints.length > 60) state.trailPoints.shift();
        trail.setAttribute('points', state.trailPoints.join(' '));

        // Orbital speed
        const v = getOrbitalSpeed(r, a);
        const vx = -v * Math.sin(state.trueAnomaly) * 30;
        const vy = -v * Math.cos(state.trueAnomaly) * 30;
        velocityVec.setAttribute('x2', pos.x + vx);
        velocityVec.setAttribute('y2', pos.y + vy);

        // Stats
        const distAU = r / AU;
        document.getElementById('distance').textContent = distAU.toFixed(2);
        document.getElementById('speed').textContent = (v * 30).toFixed(1);
        document.getElementById('period').textContent = period.toFixed(0) + 'd';
        document.getElementById('anomaly').textContent = (state.trueAnomaly * 180 / Math.PI).toFixed(0) + '°';
      }

      setInterval(step, 50);
    })();
  </script>
</body>
</html>
