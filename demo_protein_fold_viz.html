<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protein Fold Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: 'Segoe UI', sans-serif; background: #0f1419; }
        #container { width: 100%; height: 100%; display: flex; flex-direction: column; }
        canvas { flex: 1; background: #0f1419; }
        .controls {
            background: #1a2332;
            padding: 16px;
            border-top: 1px solid #2a3a4a;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            color: #e0e0e0;
            font-size: 14px;
        }
        select {
            padding: 8px 12px;
            background: #2a3a4a;
            color: #e0e0e0;
            border: 1px solid #3a4a5a;
            border-radius: 4px;
            cursor: pointer;
        }
        .info {
            color: #a0a0a0;
            font-size: 12px;
            flex: 1;
            text-align: right;
        }
        .legend {
            display: flex;
            gap: 16px;
            margin-top: 8px;
            font-size: 12px;
            color: #a0a0a0;
            flex-wrap: wrap;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-box { width: 12px; height: 12px; border-radius: 2px; }
    </style>
</head>
<body>
<div id="container">
    <canvas id="canvas"></canvas>
    <div class="controls">
        <label for="proteinSelect">Protein:</label>
        <select id="proteinSelect">
            <option value="helix">Alpha Helix</option>
            <option value="sheet">Beta Sheet</option>
            <option value="coil">Random Coil</option>
            <option value="mixed">Mixed Structure</option>
        </select>
        <div class="info">Drag to rotate • Real protein secondary structures</div>
        <div class="legend">
            <div class="legend-item"><div class="legend-box" style="background: #e74c3c;"></div> Helix</div>
            <div class="legend-item"><div class="legend-box" style="background: #3498db;"></div> Sheet</div>
            <div class="legend-item"><div class="legend-box" style="background: #95a5a6;"></div> Coil</div>
        </div>
    </div>
</div>

<script>
// Protein Fold Viewer — 3D canvas visualization
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight - 80;

let rotation = { x: 0, y: 0 };
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let currentStructure = 'helix';

// Simple 3D projection
function projectPoint(p, angleX, angleY) {
    let x = p.x, y = p.y, z = p.z;

    // Rotate around X
    const cosX = Math.cos(angleX);
    const sinX = Math.sin(angleX);
    const y1 = y * cosX - z * sinX;
    const z1 = y * sinX + z * cosX;

    // Rotate around Y
    const cosY = Math.cos(angleY);
    const sinY = Math.sin(angleY);
    const x1 = x * cosY + z1 * sinY;
    const z2 = -x * sinY + z1 * cosY;

    // Perspective
    const scale = 500 / (z2 + 50);
    return {
        x: canvas.width / 2 + x1 * scale,
        y: canvas.height / 2 + y1 * scale,
        z: z2
    };
}

function generateHelix() {
    const points = [];
    for (let i = 0; i < 200; i++) {
        const t = i / 200;
        const angle = t * Math.PI * 10;
        points.push({
            x: Math.cos(angle) * 8,
            y: t * 40 - 20,
            z: Math.sin(angle) * 8,
            color: '#e74c3c'
        });
    }
    return points;
}

function generateSheet() {
    const points = [];
    for (let i = 0; i < 100; i++) {
        const t = i / 100;
        const y = Math.sin(t * Math.PI * 6) * 6;
        points.push({
            x: t * 40 - 20,
            y: y,
            z: (i % 2) * 8 - 4,
            color: '#3498db'
        });
    }
    return points;
}

function generateCoil() {
    const points = [{ x: 0, y: 0, z: 0, color: '#95a5a6' }];
    for (let i = 1; i < 150; i++) {
        const prev = points[points.length - 1];
        const angle = Math.random() * Math.PI * 2;
        const elev = Math.random() - 0.5;
        points.push({
            x: prev.x + Math.cos(angle) * 2,
            y: prev.y + elev * 2,
            z: prev.z + Math.sin(angle) * 2,
            color: '#95a5a6'
        });
    }
    return points;
}

function generateMixed() {
    const all = [];
    // Helix part
    for (let i = 0; i < 100; i++) {
        const t = i / 100;
        const angle = t * Math.PI * 10;
        all.push({
            x: Math.cos(angle) * 8 - 15,
            y: t * 20 - 10,
            z: Math.sin(angle) * 8,
            color: '#e74c3c'
        });
    }
    // Sheet part
    for (let i = 0; i < 50; i++) {
        const t = i / 50;
        all.push({
            x: t * 30,
            y: -8,
            z: Math.sin(t * Math.PI * 4) * 6,
            color: '#3498db'
        });
    }
    // Coil part
    let pt = { x: 15, y: 0, z: 0 };
    for (let i = 0; i < 80; i++) {
        const angle = Math.random() * Math.PI * 2;
        const elev = Math.random() - 0.5;
        pt = {
            x: pt.x + Math.cos(angle) * 1.5,
            y: pt.y + elev,
            z: pt.z + Math.sin(angle) * 1.5,
            color: '#95a5a6'
        };
        all.push(pt);
    }
    return all;
}

function drawStructure() {
    ctx.fillStyle = '#0f1419';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let points;
    if (currentStructure === 'helix') points = generateHelix();
    else if (currentStructure === 'sheet') points = generateSheet();
    else if (currentStructure === 'coil') points = generateCoil();
    else points = generateMixed();

    // Project and sort by depth
    const projected = points.map(p => {
        const proj = projectPoint(p, rotation.x, rotation.y);
        return { ...proj, color: p.color };
    }).sort((a, b) => a.z - b.z);

    // Draw as ribbon/curve
    const segment = 8;
    for (let i = 0; i < projected.length - segment; i++) {
        const p1 = projected[i];
        const p2 = projected[i + segment];
        
        ctx.strokeStyle = p1.color;
        ctx.lineWidth = 3;
        ctx.globalAlpha = 0.8;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
        ctx.globalAlpha = 1;
    }

    // Draw control points
    projected.forEach((p, i) => {
        if (i % 20 === 0) {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
            ctx.fill();
        }
    });
}

function animate() {
    drawStructure();
    requestAnimationFrame(animate);
}

// Event listeners
document.getElementById('proteinSelect').addEventListener('change', (e) => {
    currentStructure = e.target.value;
});

canvas.addEventListener('mousedown', (e) => {
    isDragging = true;
    dragStart = { x: e.clientX, y: e.clientY };
});

canvas.addEventListener('mousemove', (e) => {
    if (isDragging) {
        const dx = (e.clientX - dragStart.x) * 0.01;
        const dy = (e.clientY - dragStart.y) * 0.01;
        rotation.y += dx;
        rotation.x += dy;
        dragStart = { x: e.clientX, y: e.clientY };
    }
});

canvas.addEventListener('mouseup', () => {
    isDragging = false;
});

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight - 80;
});

animate();
</script>
</body>
</html>
