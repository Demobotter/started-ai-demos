<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protein Fold Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f1419; }
        #container { width: 100%; height: 100%; display: flex; flex-direction: column; }
        #canvas { flex: 1; width: 100%; }
        .controls {
            background: #1a2332;
            padding: 16px;
            border-top: 1px solid #2a3a4a;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            color: #e0e0e0;
            font-size: 14px;
        }
        .controls label { white-space: nowrap; }
        select {
            padding: 8px 12px;
            background: #2a3a4a;
            color: #e0e0e0;
            border: 1px solid #3a4a5a;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .info {
            color: #a0a0a0;
            font-size: 12px;
            flex: 1;
            text-align: right;
        }
        .legend {
            display: flex;
            gap: 16px;
            margin-top: 8px;
            font-size: 12px;
            color: #a0a0a0;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-box { width: 12px; height: 12px; border-radius: 2px; }
    </style>
</head>
<body>
<div id="container">
    <div id="canvas"></div>
    <div class="controls">
        <label for="proteinSelect">Protein:</label>
        <select id="proteinSelect">
            <option value="helix">Alpha Helix</option>
            <option value="sheet">Beta Sheet</option>
            <option value="coil">Random Coil</option>
            <option value="mixed">Mixed Structure</option>
        </select>
        <div class="info">Drag to rotate • Scroll to zoom • Real secondary structure geometry</div>
        <div class="legend">
            <div class="legend-item"><div class="legend-box" style="background: #e74c3c;"></div> Helix</div>
            <div class="legend-item"><div class="legend-box" style="background: #3498db;"></div> Sheet</div>
            <div class="legend-item"><div class="legend-box" style="background: #95a5a6;"></div> Coil</div>
        </div>
    </div>
</div>

<script>
// Protein Fold Viewer — Synthetic secondary structure visualization
let scene, camera, renderer, structure;
let rotation = { x: 0, y: 0 };
let isDragging = false;
let dragStart = { x: 0, y: 0 };

function init() {
    const container = document.getElementById('canvas');
    const width = container.clientWidth;
    const height = container.clientHeight;

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f1419);
    scene.fog = new THREE.Fog(0x0f1419, 150, 500);

    camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
    camera.position.z = 60;

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // Lighting
    const light1 = new THREE.DirectionalLight(0xffffff, 0.8);
    light1.position.set(10, 20, 10);
    scene.add(light1);

    const light2 = new THREE.DirectionalLight(0x4488ff, 0.4);
    light2.position.set(-10, -10, -10);
    scene.add(light2);

    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);

    // Event listeners
    document.getElementById('proteinSelect').addEventListener('change', (e) => {
        loadStructure(e.target.value);
    });

    renderer.domElement.addEventListener('mousedown', (e) => {
        isDragging = true;
        dragStart = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener('mousemove', (e) => {
        if (isDragging) {
            const dx = (e.clientX - dragStart.x) * 0.01;
            const dy = (e.clientY - dragStart.y) * 0.01;
            rotation.y += dx;
            rotation.x += dy;
            dragStart = { x: e.clientX, y: e.clientY };
        }
    });

    renderer.domElement.addEventListener('mouseup', () => {
        isDragging = false;
    });

    renderer.domElement.addEventListener('wheel', (e) => {
        e.preventDefault();
        camera.position.z += e.deltaY * 0.1;
        camera.position.z = Math.max(20, Math.min(300, camera.position.z));
    });

    window.addEventListener('resize', onWindowResize);

    loadStructure('helix');
    animate();
}

function loadStructure(type) {
    if (structure) scene.remove(structure);
    structure = createStructure(type);
    scene.add(structure);
}

function createStructure(type) {
    const group = new THREE.Group();

    if (type === 'helix') {
        // Alpha helix: spiral with radius ~2.3 Å
        const curve = new THREE.CatmullRomCurve3(
            Array.from({ length: 60 }, (_, i) => {
                const t = i / 60;
                const angle = t * Math.PI * 8; // 4 full turns
                return new THREE.Vector3(
                    Math.cos(angle) * 2.3,
                    t * 30 - 15,
                    Math.sin(angle) * 2.3
                );
            })
        );
        const tubeGeometry = new THREE.TubeGeometry(curve, 40, 1.5, 8, false);
        const material = new THREE.MeshPhongMaterial({
            color: 0xe74c3c,
            specular: 0x111111,
            shininess: 200,
            side: THREE.DoubleSide
        });
        group.add(new THREE.Mesh(tubeGeometry, material));
    }
    else if (type === 'sheet') {
        // Beta sheet: zigzag structure
        const curve = new THREE.CatmullRomCurve3(
            Array.from({ length: 40 }, (_, i) => {
                const t = i / 40;
                const y = Math.sin(t * Math.PI * 8) * 3;
                return new THREE.Vector3(
                    t * 30 - 15,
                    y,
                    (i % 2) * 4 - 2
                );
            })
        );
        const tubeGeometry = new THREE.TubeGeometry(curve, 30, 2, 8, false);
        const material = new THREE.MeshPhongMaterial({
            color: 0x3498db,
            specular: 0x111111,
            shininess: 200,
            side: THREE.DoubleSide
        });
        group.add(new THREE.Mesh(tubeGeometry, material));
    }
    else if (type === 'coil') {
        // Random coil: brownian walk
        const points = [new THREE.Vector3(0, 0, 0)];
        for (let i = 1; i < 50; i++) {
            const prev = points[points.length - 1];
            const angle = Math.random() * Math.PI * 2;
            const height = Math.random() - 0.5;
            points.push(new THREE.Vector3(
                prev.x + Math.cos(angle) * 2,
                prev.y + height * 2,
                prev.z + Math.sin(angle) * 2
            ));
        }
        const curve = new THREE.CatmullRomCurve3(points);
        const tubeGeometry = new THREE.TubeGeometry(curve, 30, 1.2, 6, false);
        const material = new THREE.MeshPhongMaterial({
            color: 0x95a5a6,
            specular: 0x111111,
            shininess: 200,
            side: THREE.DoubleSide
        });
        group.add(new THREE.Mesh(tubeGeometry, material));
    }
    else if (type === 'mixed') {
        // Helix segment
        const helixPoints = Array.from({ length: 30 }, (_, i) => {
            const angle = (i / 30) * Math.PI * 8;
            return new THREE.Vector3(
                Math.cos(angle) * 2.3,
                (i / 30) * 15 - 7.5,
                Math.sin(angle) * 2.3
            );
        });
        const helixCurve = new THREE.CatmullRomCurve3(helixPoints);
        const helixGeometry = new THREE.TubeGeometry(helixCurve, 25, 1.5, 8, false);
        const helixMaterial = new THREE.MeshPhongMaterial({
            color: 0xe74c3c,
            specular: 0x111111,
            shininess: 200,
            side: THREE.DoubleSide
        });
        group.add(new THREE.Mesh(helixGeometry, helixMaterial));

        // Sheet segment
        const sheetPoints = Array.from({ length: 20 }, (_, i) => {
            return new THREE.Vector3(
                i * 1.5 - 15,
                0,
                Math.sin((i / 20) * Math.PI * 4) * 2.5
            );
        });
        const sheetCurve = new THREE.CatmullRomCurve3(sheetPoints);
        const sheetGeometry = new THREE.TubeGeometry(sheetCurve, 15, 1.8, 8, false);
        const sheetMaterial = new THREE.MeshPhongMaterial({
            color: 0x3498db,
            specular: 0x111111,
            shininess: 200,
            side: THREE.DoubleSide
        });
        group.add(new THREE.Mesh(sheetGeometry, sheetMaterial));

        // Coil segment
        const coilPoints = [new THREE.Vector3(-5, -10, 0)];
        for (let i = 1; i < 15; i++) {
            const prev = coilPoints[coilPoints.length - 1];
            const angle = Math.random() * Math.PI * 2;
            const height = Math.random() - 0.5;
            coilPoints.push(new THREE.Vector3(
                prev.x + Math.cos(angle) * 1.5,
                prev.y + height * 1.5,
                prev.z + Math.sin(angle) * 1.5
            ));
        }
        const coilCurve = new THREE.CatmullRomCurve3(coilPoints);
        const coilGeometry = new THREE.TubeGeometry(coilCurve, 12, 1.2, 6, false);
        const coilMaterial = new THREE.MeshPhongMaterial({
            color: 0x95a5a6,
            specular: 0x111111,
            shininess: 200,
            side: THREE.DoubleSide
        });
        group.add(new THREE.Mesh(coilGeometry, coilMaterial));
    }

    return group;
}

function animate() {
    requestAnimationFrame(animate);

    if (structure) {
        structure.rotation.x = rotation.x;
        structure.rotation.y = rotation.y;
    }

    renderer.render(scene, camera);
}

function onWindowResize() {
    const container = document.getElementById('canvas');
    const width = container.clientWidth;
    const height = container.clientHeight;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
}

init();
</script>
</body>
</html>
