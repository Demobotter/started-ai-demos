<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Air Quality Live</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: rgba(15, 20, 40, 0.8);
      border-radius: 16px;
      padding: 32px;
      border: 1px solid rgba(0, 255, 153, 0.1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      margin-bottom: 8px;
      color: #00ff99;
    }
    .subtitle {
      color: #888;
      font-size: 13px;
      margin-bottom: 24px;
    }
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 153, 0.2);
      color: #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
    }
    input::placeholder {
      color: #666;
    }
    input:focus {
      outline: none;
      border-color: #00ff99;
      background: rgba(0, 255, 153, 0.05);
    }
    button {
      padding: 10px 20px;
      background: #00ff99;
      color: #0a0e27;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    button:hover {
      background: #00dd88;
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(0);
    }
    .loading, .error {
      padding: 16px;
      border-radius: 8px;
      margin: 16px 0;
      text-align: center;
      font-size: 14px;
    }
    .loading {
      background: rgba(0, 255, 153, 0.1);
      color: #00ff99;
    }
    .error {
      background: rgba(255, 100, 100, 0.1);
      color: #ff6464;
    }
    .data-section {
      margin: 24px 0;
      padding: 16px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 153, 0.1);
    }
    .city-name {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #00ff99;
    }
    .aqi-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
    }
    .aqi-value {
      font-size: 24px;
      font-weight: 700;
      font-family: 'Syne', sans-serif;
    }
    .aqi-label {
      font-size: 12px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .aqi-color {
      width: 12px;
      height: 40px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .pollutants {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .pollutant {
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
      border-left: 3px solid #00ff99;
    }
    .pollutant-name {
      font-size: 11px;
      color: #aaa;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .pollutant-value {
      font-size: 16px;
      font-weight: 600;
      color: #e0e0e0;
    }
    .recommendation {
      padding: 12px;
      background: rgba(0, 255, 153, 0.08);
      border-radius: 6px;
      border-left: 3px solid #00ff99;
      font-size: 13px;
      line-height: 1.5;
      color: #d0d0d0;
    }
    .defaults {
      margin: 20px 0;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      font-size: 12px;
      color: #888;
    }
    .defaults button {
      padding: 6px 12px;
      font-size: 12px;
      margin: 4px 4px 4px 0;
      background: rgba(0, 255, 153, 0.2);
      color: #00ff99;
    }
    .defaults button:hover {
      background: rgba(0, 255, 153, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌍 Air Quality Live</h1>
    <p class="subtitle">Real-time air quality worldwide</p>

    <div class="search-box">
      <input 
        type="text" 
        id="cityInput" 
        placeholder="Enter city name…"
        onkeydown="if(event.key==='Enter') searchCity()"
      >
      <button onclick="searchCity()">Search</button>
    </div>

    <div id="results"></div>

    <div class="defaults">
      <strong>Popular cities:</strong><br>
      <button onclick="loadCity('beijing')">Beijing</button>
      <button onclick="loadCity('delhi')">Delhi</button>
      <button onclick="loadCity('lagos')">Lagos</button>
      <button onclick="loadCity('bangkok')">Bangkok</button>
      <button onclick="loadCity('shanghai')">Shanghai</button>
    </div>
  </div>

  <script>
    const AQI_LEVELS = {
      1: { label: 'Good', color: '#00ff99', range: '0-50' },
      2: { label: 'Moderate', color: '#ffb700', range: '51-100' },
      3: { label: 'Unhealthy (Sensitive)', color: '#ff9500', range: '101-150' },
      4: { label: 'Unhealthy', color: '#ff6464', range: '151-200' },
      5: { label: 'Very Unhealthy', color: '#9d4edd', range: '201-300' },
      6: { label: 'Hazardous', color: '#8b0000', range: '301+' }
    };

    const RECOMMENDATIONS = {
      1: 'Air quality is satisfactory. Enjoy outdoor activities.',
      2: 'Air quality is acceptable. Sensitive groups should limit prolonged outdoor exposure.',
      3: 'Members of sensitive groups may experience health effects. Limit outdoor activity.',
      4: 'Some members of the general public may experience health effects. Avoid prolonged outdoor activity.',
      5: 'Health alert. Everyone may experience serious health effects. Avoid outdoor activity.',
      6: 'Health warning. Everyone should avoid outdoor activity. Stay indoors and keep activity levels low.'
    };

    function getAQILevel(aqi) {
      if (aqi <= 50) return 1;
      if (aqi <= 100) return 2;
      if (aqi <= 150) return 3;
      if (aqi <= 200) return 4;
      if (aqi <= 300) return 5;
      return 6;
    }

    async function searchCity() {
      const input = document.getElementById('cityInput').value.trim().toLowerCase();
      if (!input) return;
      await loadCity(input);
    }

    async function loadCity(cityName) {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '<div class="loading">Loading air quality data…</div>';
      
      try {
        // Use WAQI API which has CORS enabled
        // Fetch city data first
        const geoRes = await fetch(
          `https://api.waqi.info/feed/${encodeURIComponent(cityName)}/?token=demo`
        );
        const data = await geoRes.json();
        
        if (data.status !== 'ok') {
          resultsDiv.innerHTML = '<div class="error">City not found. Try another search.</div>';
          return;
        }
        
        const station = data.data;
        const aqi = station.aqi;
        
        if (!aqi || aqi === '-') {
          resultsDiv.innerHTML = '<div class="error">No AQI data available for this location.</div>';
          return;
        }
        
        const level = getAQILevel(parseInt(aqi));
        const levelInfo = AQI_LEVELS[level];
        
        // Build pollutant display from available data
        let pollutantHTML = '';
        const pollutants = [];
        
        if (station.iaqi) {
          if (station.iaqi.pm25) pollutants.push({ name: 'PM2.5', value: station.iaqi.pm25.v.toFixed(1) });
          if (station.iaqi.pm10) pollutants.push({ name: 'PM10', value: station.iaqi.pm10.v.toFixed(1) });
          if (station.iaqi.no2) pollutants.push({ name: 'NO₂', value: station.iaqi.no2.v.toFixed(1) });
          if (station.iaqi.o3) pollutants.push({ name: 'O₃', value: station.iaqi.o3.v.toFixed(1) });
          if (station.iaqi.co) pollutants.push({ name: 'CO', value: station.iaqi.co.v.toFixed(1) });
          if (station.iaqi.so2) pollutants.push({ name: 'SO₂', value: station.iaqi.so2.v.toFixed(1) });
        }
        
        for (const p of pollutants.slice(0, 6)) {
          pollutantHTML += `
            <div class="pollutant">
              <div class="pollutant-name">${p.name}</div>
              <div class="pollutant-value">${p.value}</div>
            </div>
          `;
        }
        
        const cityDisplay = station.city?.name || station.station?.name || cityName;
        
        document.getElementById('cityInput').value = '';
        resultsDiv.innerHTML = `
          <div class="data-section">
            <div class="city-name">${cityDisplay}</div>
            <div class="aqi-display">
              <div>
                <div class="aqi-label">AQI</div>
                <div class="aqi-value">${aqi}</div>
              </div>
              <div style="flex: 1; margin: 0 16px;">
                <div class="aqi-label">${levelInfo.label}</div>
                <div style="font-size: 14px; color: #d0d0d0; margin-top: 4px;">${levelInfo.range}</div>
              </div>
              <div class="aqi-color" style="background: ${levelInfo.color};"></div>
            </div>
            ${pollutantHTML ? `<div class="pollutants">${pollutantHTML}</div>` : ''}
            <div class="recommendation">
              <strong>Health Advice:</strong> ${RECOMMENDATIONS[level]}
            </div>
          </div>
        `;
      } catch (err) {
        resultsDiv.innerHTML = `<div class="error">Error loading data: ${err.message}</div>`;
      }
    }

    // Load a default city on load
    window.addEventListener('load', () => {
      loadCity('beijing');
    });
  </script>
</body>
</html>
