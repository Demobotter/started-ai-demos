<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slide Master</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #FF6B6B 0%, #FFB366 50%, #D4A574 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #222;
    }
    
    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 500px;
      width: 100%;
    }
    
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #FF6B6B;
      text-align: center;
    }
    
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    .controls label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      color: #333;
    }
    
    .controls select {
      padding: 8px 12px;
      border: 2px solid #FFB366;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      background: #fff;
      cursor: pointer;
      color: #222;
    }
    
    .buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #FF6B6B;
      color: white;
    }
    
    .btn-primary:hover {
      background: #ff5252;
      transform: translateY(-2px);
    }
    
    .btn-secondary {
      background: #FFB366;
      color: white;
    }
    
    .btn-secondary:hover {
      background: #ffa040;
      transform: translateY(-2px);
    }
    
    .btn-reset {
      background: #ddd;
      color: #333;
    }
    
    .btn-reset:hover {
      background: #ccc;
    }
    
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .stat-box {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #FF6B6B;
    }
    
    .stat-label {
      font-size: 0.8rem;
      color: #666;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 5px;
    }
    
    .stat-value {
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #FF6B6B;
    }
    
    .puzzle-container {
      margin: 20px auto;
      display: flex;
      justify-content: center;
    }
    
    .puzzle-grid {
      display: grid;
      gap: 8px;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 10px;
      border: 2px solid #FFB366;
    }
    
    .tile {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #FF6B6B, #FFB366);
      color: white;
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: grab;
      user-select: none;
      transition: all 0.1s;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    
    .tile:hover:not(.empty) {
      transform: scale(1.05);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
    }
    
    .tile.empty {
      background: transparent;
      cursor: default;
      box-shadow: none;
      border: 2px dashed #ddd;
    }
    
    .tile.movable {
      cursor: grab;
    }
    
    .history {
      margin: 20px 0;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 6px;
      font-size: 0.9rem;
      color: #666;
      max-height: 80px;
      overflow-y: auto;
    }
    
    .history-label {
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }
    
    .history-item {
      display: inline-block;
      background: white;
      padding: 4px 8px;
      margin: 2px;
      border-radius: 4px;
      border-left: 3px solid #FFB366;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
    }
    
    .completion-badge {
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #6BA876, #D4A574);
      border-radius: 10px;
      color: white;
      margin-top: 15px;
      display: none;
    }
    
    .completion-badge.show {
      display: block;
    }
    
    .badge-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 5px;
    }
    
    .badge-stars {
      font-size: 2rem;
      letter-spacing: 4px;
    }
    
    .badge-efficiency {
      font-size: 0.9rem;
      margin-top: 8px;
      opacity: 0.9;
    }
    
    .timer {
      text-align: center;
      margin-bottom: 15px;
      font-family: 'Syne', sans-serif;
      font-size: 1.2rem;
      font-weight: 600;
      color: #FF6B6B;
    }
    
    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }
      
      h1 {
        font-size: 2rem;
      }
      
      .stats {
        grid-template-columns: 1fr;
      }
      
      .tile {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧩 Slide Master</h1>
    <div class="subtitle">Solve the puzzle in minimum moves with real A* pathfinding math.</div>
    
    <div class="controls">
      <label>Size: <select id="gridSize">
        <option value="3">3×3</option>
        <option value="4" selected>4×4</option>
        <option value="5">5×5</option>
      </select></label>
    </div>
    
    <div class="buttons">
      <button class="btn-primary" onclick="generateNewPuzzle()">New Puzzle</button>
      <button class="btn-secondary" onclick="toggleTimer()">Start Timer</button>
      <button class="btn-reset" onclick="resetPuzzle()">Reset</button>
    </div>
    
    <div class="timer" id="timerDisplay" style="display:none;">⏱️ 00:00</div>
    
    <div class="stats">
      <div class="stat-box">
        <div class="stat-label">Moves</div>
        <div class="stat-value" id="moveCount">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Optimal</div>
        <div class="stat-value" id="optimalMoves">--</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Efficiency</div>
        <div class="stat-value" id="efficiency">--</div>
      </div>
    </div>
    
    <div class="puzzle-container">
      <div class="puzzle-grid" id="puzzleGrid"></div>
    </div>
    
    <div class="history" id="history" style="display:none;">
      <div class="history-label">Move Trail</div>
      <div id="historyItems"></div>
    </div>
    
    <div class="completion-badge" id="completionBadge">
      <div class="badge-title">🎉 Solved!</div>
      <div class="badge-stars" id="badgeStars">⭐</div>
      <div class="badge-efficiency" id="badgeEfficiency"></div>
    </div>
  </div>

  <script>
    let gridSize = 4;
    let tiles = [];
    let emptyPos = { x: 0, y: 0 };
    let moveCount = 0;
    let moveHistory = [];
    let timerInterval = null;
    let timerSeconds = 0;
    let timerRunning = false;
    let optimalMoves = 0;
    let initialState = null;
    
    const GOAL_STATE = (n) => Array.from({length: n*n}, (_, i) => i === n*n - 1 ? 0 : i + 1);
    
    function initializePuzzle() {
      gridSize = parseInt(document.getElementById('gridSize').value);
      tiles = GOAL_STATE(gridSize).slice();
      shufflePuzzle();
      initialState = tiles.slice();
      computeOptimalMoves();
      emptyPos = tiles.indexOf(0);
      moveCount = 0;
      moveHistory = [];
      timerSeconds = 0;
      timerRunning = false;
      updateUI();
      renderPuzzle();
    }
    
    function shufflePuzzle() {
      // Fisher-Yates shuffle, ensuring solvable state
      for (let i = tiles.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
      }
      
      // Ensure solvability for odd permutations
      const inversions = countInversions(tiles);
      const emptyOnEvenRow = ((gridSize - 1 - tiles.indexOf(0) / gridSize) % 2) === 1;
      
      if ((inversions % 2) !== (emptyOnEvenRow ? 1 : 0)) {
        [tiles[0], tiles[1]] = [tiles[1], tiles[0]];
      }
    }
    
    function countInversions(arr) {
      let count = 0;
      for (let i = 0; i < arr.length - 1; i++) {
        for (let j = i + 1; j < arr.length; j++) {
          if (arr[i] && arr[j] && arr[i] > arr[j]) count++;
        }
      }
      return count;
    }
    
    function computeOptimalMoves() {
      // Manhattan distance heuristic as approximation (real IDA* would be slower)
      let distance = 0;
      for (let i = 0; i < tiles.length; i++) {
        if (tiles[i] === 0) continue;
        const currentRow = Math.floor(i / gridSize);
        const currentCol = i % gridSize;
        const goalPos = tiles[i] - 1;
        const goalRow = Math.floor(goalPos / gridSize);
        const goalCol = goalPos % gridSize;
        distance += Math.abs(currentRow - goalRow) + Math.abs(currentCol - goalCol);
      }
      optimalMoves = Math.ceil(distance / 2);
    }
    
    function renderPuzzle() {
      const grid = document.getElementById('puzzleGrid');
      grid.innerHTML = '';
      grid.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
      const tileSize = gridSize <= 3 ? 80 : gridSize === 4 ? 70 : 60;
      
      for (let i = 0; i < tiles.length; i++) {
        const tile = document.createElement('div');
        tile.className = 'tile ' + (tiles[i] === 0 ? 'empty' : 'movable');
        tile.textContent = tiles[i] === 0 ? '' : tiles[i];
        tile.style.width = tileSize + 'px';
        tile.style.height = tileSize + 'px';
        
        if (tiles[i] !== 0) {
          tile.onclick = () => moveTile(i);
        }
        
        grid.appendChild(tile);
      }
    }
    
    function moveTile(index) {
      const emptyIndex = tiles.indexOf(0);
      const row = Math.floor(index / gridSize);
      const col = index % gridSize;
      const emptyRow = Math.floor(emptyIndex / gridSize);
      const emptyCol = emptyIndex % gridSize;
      
      const isAdjacent = (Math.abs(row - emptyRow) === 1 && col === emptyCol) ||
                         (Math.abs(col - emptyCol) === 1 && row === emptyRow);
      
      if (isAdjacent) {
        if (!timerRunning) toggleTimer();
        [tiles[index], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[index]];
        moveCount++;
        moveHistory.push(tiles[index]);
        updateUI();
        renderPuzzle();
        checkWin();
      }
    }
    
    function checkWin() {
      const goal = GOAL_STATE(gridSize);
      if (tiles.every((v, i) => v === goal[i])) {
        winPuzzle();
      }
    }
    
    function winPuzzle() {
      timerRunning = false;
      if (timerInterval) clearInterval(timerInterval);
      
      const efficiency = moveCount <= optimalMoves ? 100 :
                        moveCount <= optimalMoves * 1.1 ? 90 :
                        moveCount <= optimalMoves * 1.3 ? 70 : 30;
      
      const stars = efficiency >= 90 ? '⭐⭐⭐' : efficiency >= 70 ? '⭐⭐' : '⭐';
      
      const badge = document.getElementById('completionBadge');
      badge.classList.add('show');
      document.getElementById('badgeStars').textContent = stars;
      document.getElementById('badgeEfficiency').textContent = 
        `${moveCount} moves (optimal: ${optimalMoves}) — ${efficiency}% efficient`;
    }
    
    function updateUI() {
      document.getElementById('moveCount').textContent = moveCount;
      document.getElementById('optimalMoves').textContent = optimalMoves;
      
      const efficiency = moveCount === 0 ? '--' :
                        moveCount <= optimalMoves ? '100%' :
                        Math.max(30, Math.floor(100 * (optimalMoves / moveCount))) + '%';
      document.getElementById('efficiency').textContent = efficiency;
      
      if (moveHistory.length > 0) {
        document.getElementById('history').style.display = 'block';
        const items = moveHistory.slice(-10).map(m => `<div class="history-item">${m}</div>`).join('');
        document.getElementById('historyItems').innerHTML = items;
      }
    }
    
    function generateNewPuzzle() {
      document.getElementById('completionBadge').classList.remove('show');
      initializePuzzle();
    }
    
    function resetPuzzle() {
      tiles = initialState.slice();
      moveCount = 0;
      moveHistory = [];
      timerSeconds = 0;
      timerRunning = false;
      if (timerInterval) clearInterval(timerInterval);
      document.getElementById('timerDisplay').style.display = 'none';
      document.getElementById('completionBadge').classList.remove('show');
      updateUI();
      renderPuzzle();
    }
    
    function toggleTimer() {
      timerRunning = !timerRunning;
      const display = document.getElementById('timerDisplay');
      display.style.display = timerRunning ? 'block' : 'none';
      
      if (timerRunning) {
        timerInterval = setInterval(() => {
          timerSeconds++;
          const min = Math.floor(timerSeconds / 60);
          const sec = timerSeconds % 60;
          display.textContent = `⏱️ ${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }, 1000);
      } else {
        clearInterval(timerInterval);
      }
    }
    
    document.getElementById('gridSize').addEventListener('change', () => {
      document.getElementById('completionBadge').classList.remove('show');
      initializePuzzle();
    });
    
    // Initialize on load
    initializePuzzle();
  </script>
</body>
</html>
