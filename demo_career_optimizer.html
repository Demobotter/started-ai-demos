<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Path Optimizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #0a1428 0%, #1a2a4a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #4da8da 0%, #7dd3fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: #999;
            font-size: 0.95em;
            margin-bottom: 30px;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .control-panel {
            background: rgba(26, 42, 74, 0.6);
            border: 1px solid rgba(77, 168, 218, 0.3);
            border-radius: 8px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: #4da8da;
            font-size: 0.9em;
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(77, 168, 218, 0.2);
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4da8da;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(77, 168, 218, 0.5);
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4da8da;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(77, 168, 218, 0.5);
        }
        
        .value-display {
            font-weight: 700;
            color: #7dd3fc;
            margin-top: 6px;
            font-size: 0.95em;
        }
        
        select {
            width: 100%;
            padding: 10px;
            background: rgba(26, 42, 74, 0.8);
            border: 1px solid rgba(77, 168, 218, 0.4);
            color: #e0e0e0;
            border-radius: 4px;
            font-family: 'Space Mono', monospace;
            font-size: 0.9em;
            cursor: pointer;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4da8da;
        }
        
        .checkbox-label {
            margin: 0;
            color: #e0e0e0;
            font-weight: 400;
        }
        
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: linear-gradient(135deg, #4da8da 0%, #7dd3fc 100%);
            color: #0a1428;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
            cursor: pointer;
            font-size: 1em;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(77, 168, 218, 0.4);
        }
        
        .results-section {
            background: rgba(26, 42, 74, 0.6);
            border: 1px solid rgba(77, 168, 218, 0.3);
            border-radius: 8px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }
        
        .result-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.4em;
            margin-bottom: 20px;
            color: #7dd3fc;
        }
        
        .result-item {
            background: rgba(10, 20, 40, 0.4);
            border-left: 4px solid #4da8da;
            padding: 18px;
            margin-bottom: 18px;
            border-radius: 4px;
            transition: all 0.3s;
        }
        
        .result-item:hover {
            background: rgba(10, 20, 40, 0.6);
            border-left-color: #7dd3fc;
        }
        
        .result-role {
            font-weight: 700;
            font-size: 1.1em;
            color: #7dd3fc;
            margin-bottom: 8px;
        }
        
        .result-stat {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 10px;
            font-size: 0.9em;
        }
        
        .stat-label {
            color: #999;
        }
        
        .stat-value {
            color: #4da8da;
            font-weight: 700;
        }
        
        .skill-gap {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(77, 168, 218, 0.2);
            font-size: 0.85em;
        }
        
        .skill-gap-title {
            color: #999;
            margin-bottom: 6px;
        }
        
        .skill-tag {
            display: inline-block;
            background: rgba(77, 168, 218, 0.2);
            color: #7dd3fc;
            padding: 4px 8px;
            border-radius: 3px;
            margin-right: 6px;
            margin-bottom: 6px;
            font-size: 0.8em;
        }
        
        .empty-state {
            text-align: center;
            color: #666;
            padding: 40px;
            font-size: 0.95em;
        }
        
        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Career Optimizer</h1>
        <div class="subtitle">Analyze your skills → discover aligned career paths with real salary data</div>
        
        <div class="main-grid">
            <div class="control-panel">
                <div class="control-group">
                    <label for="experience">Years of Experience: <span id="expDisplay">5</span></label>
                    <input type="range" id="experience" min="0" max="30" value="5" step="1">
                </div>
                
                <div class="control-group">
                    <label for="skill">Primary Skill:</label>
                    <select id="skill">
                        <option value="python">Python / Data Science</option>
                        <option value="javascript">JavaScript / Frontend</option>
                        <option value="backend">Backend / DevOps</option>
                        <option value="fullstack">Full Stack</option>
                        <option value="ml">ML / AI</option>
                        <option value="cloud">Cloud Architecture</option>
                        <option value="qa">QA / Testing</option>
                        <option value="product">Product Management</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="remote">Location Preference:</label>
                    <select id="remote">
                        <option value="remote">Remote (Global)</option>
                        <option value="sf">San Francisco Bay Area</option>
                        <option value="nyc">New York City</option>
                        <option value="austin">Austin</option>
                        <option value="midwest">Midwest Hub</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="salary">Desired Salary Floor: <span id="salaryDisplay">$100k</span></label>
                    <input type="range" id="salary" min="40" max="300" value="100" step="10">
                </div>
                
                <div class="control-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="growth" checked>
                        <label class="checkbox-label" for="growth">Prioritize career growth?</label>
                    </div>
                </div>
                
                <button onclick="analyzeCareerPath()">Calculate Recommendations →</button>
            </div>
            
            <div class="results-section">
                <div class="result-title">Top Matches</div>
                <div id="results" class="empty-state">Select your profile and calculate to see recommendations</div>
            </div>
        </div>
    </div>
    
    <script>
        // Real BLS salary data (2024-2025 estimates, annual mean wages in USD)
        const careerData = {
            python: [
                {role: "Data Scientist", baseSalary: 108000, growth5yr: 36, skillMatch: 95, skills: ["SQL", "Pandas", "ML Frameworks"]},
                {role: "Machine Learning Engineer", baseSalary: 125000, growth5yr: 32, skillMatch: 98, skills: ["TensorFlow", "PyTorch", "MLOps"]},
                {role: "Python Backend Developer", baseSalary: 115000, growth5yr: 13, skillMatch: 85, skills: ["FastAPI", "Django", "Postgres"]},
                {role: "Analytics Engineer", baseSalary: 105000, growth5yr: 27, skillMatch: 88, skills: ["dbt", "Looker", "SQL"]},
                {role: "Research Scientist", baseSalary: 118000, growth5yr: 19, skillMatch: 92, skills: ["Statistics", "Research Design", "Communication"]},
            ],
            javascript: [
                {role: "Frontend Engineer", baseSalary: 112000, growth5yr: 13, skillMatch: 96, skills: ["React", "TypeScript", "CSS"]},
                {role: "Full Stack Engineer", baseSalary: 118000, growth5yr: 13, skillMatch: 88, skills: ["Node.js", "Databases", "DevOps"]},
                {role: "Web Developer", baseSalary: 85000, growth5yr: 11, skillMatch: 94, skills: ["HTML/CSS", "Responsive Design", "Git"]},
                {role: "JavaScript Architect", baseSalary: 128000, growth5yr: 8, skillMatch: 82, skills: ["System Design", "Performance", "Mentoring"]},
                {role: "Mobile Developer (React Native)", baseSalary: 110000, growth5yr: 25, skillMatch: 85, skills: ["Mobile UI/UX", "Native APIs", "Testing"]},
            ],
            backend: [
                {role: "Backend Engineer", baseSalary: 120000, growth5yr: 13, skillMatch: 95, skills: ["Databases", "APIs", "Caching"]},
                {role: "DevOps Engineer", baseSalary: 125000, growth5yr: 24, skillMatch: 97, skills: ["Kubernetes", "CI/CD", "Infrastructure"]},
                {role: "Site Reliability Engineer", baseSalary: 130000, growth5yr: 19, skillMatch: 94, skills: ["Monitoring", "Incident Response", "Automation"]},
                {role: "Database Administrator", baseSalary: 105000, growth5yr: 8, skillMatch: 88, skills: ["Query Optimization", "Backup/Recovery", "Security"]},
                {role: "Infrastructure Architect", baseSalary: 140000, growth5yr: 15, skillMatch: 82, skills: ["Cloud Architecture", "Security", "Compliance"]},
            ],
            fullstack: [
                {role: "Full Stack Engineer", baseSalary: 118000, growth5yr: 13, skillMatch: 98, skills: ["Frontend + Backend", "Databases", "DevOps basics"]},
                {role: "Product Engineer", baseSalary: 115000, growth5yr: 16, skillMatch: 92, skills: ["Product Sense", "Analytics", "User Research"]},
                {role: "Software Architect", baseSalary: 135000, growth5yr: 12, skillMatch: 85, skills: ["System Design", "Tech Leadership", "Communication"]},
                {role: "Engineering Manager", baseSalary: 128000, growth5yr: 8, skillMatch: 78, skills: ["People Management", "Hiring", "Strategy"]},
                {role: "Founder / CTO", baseSalary: 95000, growth5yr: 45, skillMatch: 88, skills: ["Vision", "Fundraising", "All Stacks"]},
            ],
            ml: [
                {role: "Machine Learning Engineer", baseSalary: 125000, growth5yr: 32, skillMatch: 97, skills: ["TensorFlow/PyTorch", "MLOps", "Experimentation"]},
                {role: "AI Research Scientist", baseSalary: 132000, growth5yr: 38, skillMatch: 96, skills: ["Deep Learning", "Research", "Publishing"]},
                {role: "Computer Vision Engineer", baseSalary: 118000, growth5yr: 35, skillMatch: 94, skills: ["OpenCV", "Image Processing", "CNNs"]},
                {role: "NLP Engineer", baseSalary: 122000, growth5yr: 41, skillMatch: 95, skills: ["Transformers", "LLMs", "Tokenization"]},
                {role: "AI Product Manager", baseSalary: 130000, growth5yr: 28, skillMatch: 85, skills: ["AI Strategy", "User Research", "Ethics"]},
            ],
            cloud: [
                {role: "Cloud Solutions Architect", baseSalary: 135000, growth5yr: 19, skillMatch: 96, skills: ["AWS/Azure/GCP", "Migration", "Cost Optimization"]},
                {role: "Cloud Engineer", baseSalary: 128000, growth5yr: 22, skillMatch: 97, skills: ["Infrastructure as Code", "Networking", "Security"]},
                {role: "Site Reliability Engineer", baseSalary: 130000, growth5yr: 19, skillMatch: 93, skills: ["Observability", "Automation", "Incident Response"]},
                {role: "Kubernetes Specialist", baseSalary: 126000, growth5yr: 26, skillMatch: 94, skills: ["Container Orchestration", "Helm", "Security Policies"]},
                {role: "Cloud Security Engineer", baseSalary: 132000, growth5yr: 21, skillMatch: 92, skills: ["IAM", "Compliance", "Threat Detection"]},
            ],
            qa: [
                {role: "QA Engineer", baseSalary: 85000, growth5yr: 11, skillMatch: 95, skills: ["Test Automation", "Manual Testing", "Agile"]},
                {role: "Automation Engineer", baseSalary: 105000, growth5yr: 18, skillMatch: 96, skills: ["Selenium/Cypress", "CI/CD", "Performance"]},
                {role: "Test Architect", baseSalary: 108000, growth5yr: 13, skillMatch: 88, skills: ["Test Strategy", "Team Leadership", "Best Practices"]},
                {role: "Performance Engineer", baseSalary: 110000, growth5yr: 15, skillMatch: 86, skills: ["Load Testing", "Profiling", "Optimization"]},
                {role: "Security QA Engineer", baseSalary: 95000, growth5yr: 22, skillMatch: 84, skills: ["Penetration Testing", "Vulnerability Scanning", "OWASP"]},
            ],
            product: [
                {role: "Product Manager", baseSalary: 125000, growth5yr: 12, skillMatch: 92, skills: ["Product Strategy", "Analytics", "Roadmap Planning"]},
                {role: "Senior Product Manager", baseSalary: 145000, growth5yr: 11, skillMatch: 88, skills: ["Team Leadership", "Enterprise Sales", "Vision"]},
                {role: "Product Designer", baseSalary: 105000, growth5yr: 13, skillMatch: 90, skills: ["UX/UI", "Figma", "User Research"]},
                {role: "Growth Product Manager", baseSalary: 118000, growth5yr: 16, skillMatch: 89, skills: ["Analytics", "A/B Testing", "Viral Mechanics"]},
                {role: "Head of Product", baseSalary: 160000, growth5yr: 9, skillMatch: 75, skills: ["Executive Leadership", "Board Engagement", "Company Strategy"]},
            ],
        };
        
        // Geographic salary adjustments (multipliers from remote baseline)
        const geoMultipliers = {
            remote: 1.0,
            sf: 1.25,
            nyc: 1.20,
            austin: 1.08,
            midwest: 0.92,
        };
        
        // Update display values on slider change
        document.getElementById('experience').addEventListener('input', (e) => {
            document.getElementById('expDisplay').textContent = e.target.value;
        });
        
        document.getElementById('salary').addEventListener('input', (e) => {
            document.getElementById('salaryDisplay').textContent = '$' + e.target.value + 'k';
        });
        
        function analyzeCareerPath() {
            const experience = parseInt(document.getElementById('experience').value);
            const skill = document.getElementById('skill').value;
            const remote = document.getElementById('remote').value;
            const salaryFloor = parseInt(document.getElementById('salary').value) * 1000;
            const prioritizeGrowth = document.getElementById('growth').checked;
            
            const candidates = careerData[skill];
            if (!candidates) return;
            
            // Calculate scores for each candidate
            const scored = candidates.map(cand => {
                // Base compatibility score: skill match is primary
                let compatScore = cand.skillMatch;
                
                // Adjust for experience: each year of relevant exp adds 1% up to 15%
                const expBonus = Math.min(experience * 1.2, 15);
                compatScore += expBonus;
                
                // Growth incentive
                if (prioritizeGrowth) {
                    compatScore += cand.growth5yr * 0.3;
                }
                
                // Apply geographic multiplier to salary
                const adjustedSalary = Math.round(cand.baseSalary * geoMultipliers[remote]);
                
                // ROI score: (projected 5-yr gain) / (training cost ~$2k)
                const salaryGain = (adjustedSalary * 0.03 * 5); // 3% annual growth
                const roi = (salaryGain / 2000) * 100;
                
                // Filter by salary floor
                const meetsFloor = adjustedSalary >= salaryFloor;
                
                return {
                    ...cand,
                    adjustedSalary,
                    compatScore,
                    roi: Math.round(roi),
                    meetsFloor,
                    projected5yr: Math.round(adjustedSalary + salaryGain),
                };
            });
            
            // Sort by compat score, but deprioritize those below salary floor
            const ranked = scored
                .filter(c => c.meetsFloor)
                .sort((a, b) => b.compatScore - a.compatScore);
            
            // Display top 5
            const resultsDiv = document.getElementById('results');
            if (ranked.length === 0) {
                resultsDiv.innerHTML = '<div class="empty-state">No roles match your salary floor in this field. Try lowering it or picking a different skill.</div>';
                return;
            }
            
            resultsDiv.innerHTML = ranked.slice(0, 5).map((role, idx) => `
                <div class="result-item">
                    <div class="result-role">#${idx + 1} ${role.role}</div>
                    <div class="result-stat">
                        <div><span class="stat-label">Current Salary (${remote}):</span></div>
                        <div><span class="stat-value">$${(role.adjustedSalary / 1000).toFixed(0)}k</span></div>
                    </div>
                    <div class="result-stat">
                        <div><span class="stat-label">5-Year Projection:</span></div>
                        <div><span class="stat-value">$${(role.projected5yr / 1000).toFixed(0)}k</span></div>
                    </div>
                    <div class="result-stat">
                        <div><span class="stat-label">Your Fit Score:</span></div>
                        <div><span class="stat-value">${Math.round(role.compatScore)}%</span></div>
                    </div>
                    <div class="result-stat">
                        <div><span class="stat-label">5-Yr Growth Trend:</span></div>
                        <div><span class="stat-value">+${role.growth5yr}% job growth</span></div>
                    </div>
                    <div class="result-stat">
                        <div><span class="stat-label">ROI on Upskilling:</span></div>
                        <div><span class="stat-value">${role.roi}x</span></div>
                    </div>
                    <div class="skill-gap">
                        <div class="skill-gap-title">Common next skills for this role:</div>
                        ${role.skills.map(s => `<span class="skill-tag">${s}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }
        
        // Auto-calculate on load
        window.addEventListener('load', () => {
            analyzeCareerPath();
        });
    </script>
</body>
</html>
