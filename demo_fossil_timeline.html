<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fossil Timeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Mono', monospace;
      background: #0d1b2a;
      color: #e0e7ff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 1000px;
      background: #1a2a3a;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      margin-bottom: 8px;
      color: #ffd700;
    }
    .subtitle {
      color: #a0aec0;
      margin-bottom: 30px;
      font-size: 0.9rem;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: bold;
      margin-bottom: 8px;
      color: #cbd5e1;
      font-size: 0.85rem;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #334155;
      outline: none;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #3b82f6;
      cursor: pointer;
      transition: background 0.2s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      background: #60a5fa;
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #3b82f6;
      cursor: pointer;
      border: none;
    }
    .display-value {
      font-weight: bold;
      color: #4da8da;
      margin-top: 4px;
      font-size: 0.9rem;
    }
    .toggles {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .toggle-btn {
      background: #334155;
      color: #e0e7ff;
      border: 2px solid #475569;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .toggle-btn.active {
      background: #3b82f6;
      border-color: #60a5fa;
      color: #fff;
    }
    .toggle-btn:hover {
      border-color: #60a5fa;
    }
    .canvas-container {
      display: flex;
      justify-content: center;
      background: linear-gradient(135deg, #0d1b2a 0%, #1a2a3a 100%);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    canvas {
      display: block;
      border-radius: 6px;
      background: #0f172a;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }
    .stat-box {
      background: #0f172a;
      padding: 14px;
      border-radius: 6px;
      border-left: 4px solid #2d9d5f;
    }
    .stat-label {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .stat-value {
      font-weight: bold;
      color: #4da8da;
      font-size: 1.1rem;
      word-wrap: break-word;
    }
    @media (max-width: 600px) {
      .controls {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 1.6rem;
      }
      .container {
        padding: 16px;
      }
      canvas {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⛏️ Fossil Timeline</h1>
    <p class="subtitle">Watch organisms transform into stone over geological time</p>
    
    <div class="controls">
      <div class="control-group">
        <label for="timeSlider">Geological Time (log scale)</label>
        <input type="range" id="timeSlider" min="0" max="100" value="0">
        <div class="display-value" id="timeDisplay">Fresh (0 years)</div>
      </div>
      <div class="control-group">
        <label for="organismSelect">Organism Type</label>
        <select id="organismSelect" style="padding: 8px; border-radius: 6px; border: 2px solid #475569; background: #334155; color: #e0e7ff; font-family: 'Space Mono', monospace;">
          <option value="dinosaur">Dinosaur</option>
          <option value="trilobite">Trilobite</option>
          <option value="ammonite">Ammonite</option>
        </select>
      </div>
    </div>

    <div class="toggles">
      <button class="toggle-btn active" id="toggleLayers">🪨 Show Layers</button>
      <button class="toggle-btn" id="toggleMinerals">✨ Show Minerals</button>
      <button class="toggle-btn" id="toggleTimeScale">⏱️ Show Time Scale</button>
    </div>

    <div class="canvas-container">
      <canvas id="canvas" width="700" height="500"></canvas>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Stage</div>
        <div class="stat-value" id="stageValue">Fresh Carcass</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Time Elapsed</div>
        <div class="stat-value" id="timeValue">0 years</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Decomposition</div>
        <div class="stat-value" id="decompValue">0%</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Mineralization</div>
        <div class="stat-value" id="mineralValue">0%</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Depth</div>
        <div class="stat-value" id="depthValue">0 m</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Pressure</div>
        <div class="stat-value" id="pressureValue">1 atm</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const timeSlider = document.getElementById('timeSlider');
    const timeDisplay = document.getElementById('timeDisplay');
    const stageValue = document.getElementById('stageValue');
    const timeValue = document.getElementById('timeValue');
    const decompValue = document.getElementById('decompValue');
    const mineralValue = document.getElementById('mineralValue');
    const depthValue = document.getElementById('depthValue');
    const pressureValue = document.getElementById('pressureValue');
    const organismSelect = document.getElementById('organismSelect');

    // Toggles
    const toggleLayers = document.getElementById('toggleLayers');
    const toggleMinerals = document.getElementById('toggleMinerals');
    const toggleTimeScale = document.getElementById('toggleTimeScale');
    let showLayers = true;
    let showMinerals = false;
    let showTimeScale = false;

    toggleLayers.addEventListener('click', () => {
      showLayers = !showLayers;
      toggleLayers.classList.toggle('active');
      render();
    });
    toggleMinerals.addEventListener('click', () => {
      showMinerals = !showMinerals;
      toggleMinerals.classList.toggle('active');
      render();
    });
    toggleTimeScale.addEventListener('click', () => {
      showTimeScale = !showTimeScale;
      toggleTimeScale.classList.toggle('active');
      render();
    });

    // Geological stages with time boundaries
    const stages = [
      { name: 'Fresh Carcass', min: 0, max: 100, depth: 0 },
      { name: 'Early Decay', min: 100, max: 10000, depth: 0.5 },
      { name: 'Burial', min: 10000, max: 100000, depth: 200 },
      { name: 'Early Fossilization', min: 100000, max: 1000000, depth: 2000 },
      { name: 'Fossilization Complete', min: 1000000, max: 10000000, depth: 5000 },
      { name: 'Deep Burial', min: 10000000, max: 50000000, depth: 8000 },
      { name: 'Exposure', min: 50000000, max: 100000000, depth: 500 }
    ];

    function getYearValue(slider) {
      // Convert slider (0-100) to years using log scale
      if (slider === 0) return 0;
      return Math.pow(10, (slider / 100) * 8); // 10^0 to 10^8
    }

    function getStageIndex(years) {
      for (let i = 0; i < stages.length; i++) {
        if (years >= stages[i].min && years < stages[i].max) {
          return i;
        }
      }
      return stages.length - 1;
    }

    function formatYears(years) {
      if (years === 0) return '0 years';
      if (years < 1000) return Math.round(years) + ' years';
      if (years < 1000000) return (years / 1000).toFixed(1) + 'k years';
      return (years / 1000000).toFixed(1) + 'M years';
    }

    function interpolateColor(c1, c2, t) {
      const r1 = parseInt(c1.substr(1, 2), 16);
      const g1 = parseInt(c1.substr(3, 2), 16);
      const b1 = parseInt(c1.substr(5, 2), 16);
      const r2 = parseInt(c2.substr(1, 2), 16);
      const g2 = parseInt(c2.substr(3, 2), 16);
      const b2 = parseInt(c2.substr(5, 2), 16);
      const r = Math.round(r1 + (r2 - r1) * t);
      const g = Math.round(g1 + (g2 - g1) * t);
      const b = Math.round(b1 + (b2 - b1) * t);
      return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
    }

    function render() {
      const years = getYearValue(timeSlider.value);
      const stageIdx = getStageIndex(years);
      const stage = stages[stageIdx];

      // Calculate progress within stage
      const stageRange = stage.max - stage.min;
      const stageProgress = Math.max(0, Math.min(1, (years - stage.min) / stageRange));

      // Update displays
      stageValue.textContent = stage.name;
      timeValue.textContent = formatYears(years);
      decompValue.textContent = Math.round(Math.min(100, stageProgress * 100 * 1.5)) + '%';
      mineralValue.textContent = Math.round(Math.max(0, (stageIdx - 1) / 5 * 100)) + '%';
      depthValue.textContent = Math.round(stage.depth) + ' m';
      const pressure = 1 + (stage.depth / 2500);
      pressureValue.textContent = pressure.toFixed(1) + ' atm';

      timeDisplay.textContent = stage.name + ' (' + formatYears(years) + ')';

      // Clear canvas
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw background gradient (depth visualization)
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      const surfaceColor = '#8b7355';
      const deepColor = '#3a4452';
      gradient.addColorStop(0, surfaceColor);
      gradient.addColorStop(1, deepColor);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw sediment layers if showLayers is true
      if (showLayers) {
        const layerCount = Math.min(8, Math.floor(stage.depth / 1000) + 2);
        for (let i = 0; i < layerCount; i++) {
          const y = (i / layerCount) * canvas.height;
          ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 - i * 0.01})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }
      }

      // Draw organism at center
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2 + 40;
      drawOrganism(centerX, centerY, stageIdx, stageProgress);

      // Draw depth scale on right
      ctx.fillStyle = '#a0aec0';
      ctx.font = '12px Space Mono';
      ctx.textAlign = 'right';
      for (let i = 0; i <= 5; i++) {
        const y = (i / 5) * canvas.height;
        const depth = (i / 5) * Math.max(10000, stage.depth);
        ctx.fillText(Math.round(depth / 1000) + 'km', canvas.width - 10, y + 4);
      }

      // Draw time scale annotations if enabled
      if (showTimeScale) {
        ctx.fillStyle = 'rgba(255, 215, 0, 0.7)';
        ctx.font = 'bold 14px Playfair Display';
        ctx.textAlign = 'center';
        ctx.fillText('Log Scale: Each increment = 10x time', canvas.width / 2, 30);
      }
    }

    function drawOrganism(x, y, stageIdx, progress) {
      const organism = organismSelect.value;

      if (stageIdx < 2) {
        // Fresh/early decay: visible flesh and bones
        const fleshAlpha = Math.max(0, 1 - progress * 2);
        ctx.fillStyle = `rgba(200, 150, 100, ${fleshAlpha})`;
        ctx.beginPath();
        ctx.ellipse(x, y, 50, 35, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Bones always visible, color changes
      if (organism === 'dinosaur') {
        // Dinosaur skeleton
        ctx.strokeStyle = interpolateColor('#d4a574', '#b0a0a0', Math.min(1, stageIdx / 4));
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(x - 30, y - 10);
        ctx.lineTo(x + 30, y - 10); // spine
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x - 30, y - 10);
        ctx.lineTo(x - 35, y + 15); // back leg
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x + 30, y - 10);
        ctx.lineTo(x + 35, y + 15); // back leg
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x - 20, y - 15);
        ctx.lineTo(x - 25, y - 25); // front leg
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x + 20, y - 15);
        ctx.lineTo(x + 25, y - 25); // front leg
        ctx.stroke();
      } else if (organism === 'trilobite') {
        // Trilobite (segmented oval)
        ctx.strokeStyle = interpolateColor('#d4a574', '#888888', Math.min(1, stageIdx / 4));
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.ellipse(x, y, 45, 25, 0, 0, Math.PI * 2);
        ctx.stroke();

        for (let i = 1; i <= 5; i++) {
          ctx.beginPath();
          ctx.moveTo(x - 45, y - 25 + i * 10);
          ctx.lineTo(x + 45, y - 25 + i * 10);
          ctx.stroke();
        }
      } else {
        // Ammonite (spiral)
        ctx.strokeStyle = interpolateColor('#d4a574', '#888888', Math.min(1, stageIdx / 4));
        ctx.lineWidth = 4;
        ctx.beginPath();
        for (let i = 0; i < Math.PI * 6; i += 0.1) {
          const r = 30 - i * 4;
          const px = x + r * Math.cos(i);
          const py = y + r * Math.sin(i);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }

      // Mineral crystallization (sparkles in later stages)
      if (showMinerals && stageIdx >= 3) {
        const mineralAlpha = (stageIdx - 3) / 4;
        ctx.fillStyle = `rgba(255, 255, 255, ${mineralAlpha * 0.8})`;
        for (let i = 0; i < 5 + stageIdx * 2; i++) {
          const sparkX = x + (Math.random() - 0.5) * 100;
          const sparkY = y + (Math.random() - 0.5) * 70;
          ctx.beginPath();
          ctx.arc(sparkX, sparkY, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    timeSlider.addEventListener('input', render);
    organismSelect.addEventListener('change', render);

    // Initial render
    render();

    // Responsive canvas
    window.addEventListener('resize', () => {
      const rect = canvas.parentElement.getBoundingClientRect();
      const size = Math.min(rect.width - 40, 700);
      canvas.width = Math.min(size, 700);
      render();
    });
  </script>
</body>
</html>
