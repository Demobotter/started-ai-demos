<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creature Finder</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Inter, sans-serif; background: linear-gradient(135deg, #4a5a3a, #1a2519); color: #e8e8e8; padding: 20px; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-family: Syne, sans-serif; font-size: 2.5em; margin-bottom: 8px; color: #d4a574; text-align: center; }
        .subtitle { text-align: center; color: #a8b8a8; margin-bottom: 30px; }
        .controls { background: rgba(20, 25, 20, 0.7); border-radius: 12px; padding: 25px; margin-bottom: 30px; border: 1px solid rgba(212, 165, 116, 0.2); }
        .trait-group { margin-bottom: 20px; }
        .trait-label { font-family: Syne, sans-serif; font-weight: 600; color: #d4a574; margin-bottom: 8px; }
        .trait-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
        button { padding: 8px 14px; border: 1.5px solid rgba(135, 206, 235, 0.4); background: rgba(50, 60, 50, 0.6); color: #7fb3d5; border-radius: 6px; cursor: pointer; font-size: 0.9em; transition: all 0.2s; }
        button:hover { border-color: #7fb3d5; background: rgba(70, 90, 70, 0.8); }
        button.active { background: #7fb3d5; color: #1a2519; border-color: #7fb3d5; }
        .results { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: rgba(30, 35, 30, 0.8); border: 1px solid rgba(212, 165, 116, 0.3); border-radius: 10px; overflow: hidden; }
        .card:hover { border-color: #d4a574; transform: translateY(-2px); }
        .emoji { font-size: 3em; padding: 20px; text-align: center; background: linear-gradient(135deg, #4a5a3a, #2d3a2a); }
        .info { padding: 15px; }
        .name { font-family: Syne, sans-serif; font-size: 1.3em; font-weight: 600; color: #d4a574; margin-bottom: 4px; }
        .family { font-size: 0.85em; color: #8B6F47; margin-bottom: 8px; }
        .conservation { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 0.8em; font-weight: 600; margin-bottom: 10px; }
        .stable { background: rgba(45, 80, 22, 0.7); color: #7eda7e; }
        .vulnerable { background: rgba(139, 111, 71, 0.7); color: #ffd700; }
        .endangered { background: rgba(200, 50, 50, 0.7); color: #ff6b6b; }
        .fact { font-size: 0.85em; color: #7fb3d5; font-style: italic; margin-top: 8px; }
        .match { font-family: Syne, sans-serif; color: #ffd700; font-weight: 600; margin-top: 8px; }
        .no-results { text-align: center; padding: 40px 20px; color: #8B6F47; }
        @media (max-width: 768px) { h1 { font-size: 2em; } .results { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦁 Creature Finder</h1>
        <p class="subtitle">Pick traits, find animals that match</p>
        <div class="controls">
            <div class="trait-group">
                <div class="trait-label">Size</div>
                <div class="trait-buttons" id="sizeButtons"></div>
            </div>
            <div class="trait-group">
                <div class="trait-label">Habitat</div>
                <div class="trait-buttons" id="habitatButtons"></div>
            </div>
            <div class="trait-group">
                <div class="trait-label">Diet</div>
                <div class="trait-buttons" id="dietButtons"></div>
            </div>
            <div class="trait-group">
                <div class="trait-label">Activity</div>
                <div class="trait-buttons" id="activityButtons"></div>
            </div>
            <div class="trait-group">
                <div class="trait-label">Speed</div>
                <div class="trait-buttons" id="speedButtons"></div>
            </div>
        </div>
        <div class="results" id="results"></div>
    </div>

    <script>
        const animals = [
            { name: 'Lion', emoji: '🦁', family: 'Felidae', traits: { size: 'large', habitat: 'savanna', diet: 'carnivore', activity: 'day', speed: 'fast' }, conservation: 'vulnerable', fact: 'Only truly social cats; form coalitions.' },
            { name: 'Rabbit', emoji: '🐰', family: 'Leporidae', traits: { size: 'small', habitat: 'forest', diet: 'herbivore', activity: 'night', speed: 'medium' }, conservation: 'stable', fact: 'Ears rotate 270°, detecting predators.' },
            { name: 'Dolphin', emoji: '🐬', family: 'Delphinidae', traits: { size: 'medium', habitat: 'ocean', diet: 'carnivore', activity: 'day', speed: 'fast' }, conservation: 'stable', fact: 'Use echolocation and complex vocalizations.' },
            { name: 'Elephant', emoji: '🐘', family: 'Elephantidae', traits: { size: 'large', habitat: 'savanna', diet: 'herbivore', activity: 'day', speed: 'medium' }, conservation: 'vulnerable', fact: 'Exceptional memory, recognize themselves.' },
            { name: 'Owl', emoji: '🦉', family: 'Strigidae', traits: { size: 'small', habitat: 'forest', diet: 'carnivore', activity: 'night', speed: 'fast' }, conservation: 'stable', fact: 'Rotate heads 270°.' },
            { name: 'Deer', emoji: '🦌', family: 'Cervidae', traits: { size: 'medium', habitat: 'forest', diet: 'herbivore', activity: 'day', speed: 'fast' }, conservation: 'stable', fact: 'Grow new antlers yearly.' },
            { name: 'Penguin', emoji: '🐧', family: 'Spheniscidae', traits: { size: 'small', habitat: 'ocean', diet: 'carnivore', activity: 'day', speed: 'fast' }, conservation: 'vulnerable', fact: 'Flightless, "fly" through water.' },
            { name: 'Tiger', emoji: '🐯', family: 'Felidae', traits: { size: 'large', habitat: 'forest', diet: 'carnivore', activity: 'night', speed: 'fast' }, conservation: 'endangered', fact: 'Unique stripe patterns like fingerprints.' },
            { name: 'Bee', emoji: '🐝', family: 'Apidae', traits: { size: 'small', habitat: 'savanna', diet: 'herbivore', activity: 'day', speed: 'medium' }, conservation: 'stable', fact: 'Dance to communicate food locations.' },
            { name: 'Whale', emoji: '🐋', family: 'Balaenopteridae', traits: { size: 'large', habitat: 'ocean', diet: 'herbivore', activity: 'day', speed: 'medium' }, conservation: 'vulnerable', fact: 'Largest animals ever to exist.' },
            { name: 'Squirrel', emoji: '🐿️', family: 'Sciuridae', traits: { size: 'small', habitat: 'forest', diet: 'herbivore', activity: 'day', speed: 'fast' }, conservation: 'stable', fact: 'Cache nuts, accidentally plant forests.' },
            { name: 'Bear', emoji: '🐻', family: 'Ursidae', traits: { size: 'large', habitat: 'forest', diet: 'omnivore', activity: 'day', speed: 'medium' }, conservation: 'vulnerable', fact: 'Enter torpor, not true hibernation.' },
            { name: 'Snake', emoji: '🐍', family: 'Serpentes', traits: { size: 'medium', habitat: 'forest', diet: 'carnivore', activity: 'night', speed: 'slow' }, conservation: 'stable', fact: 'Unhinge jaws for large prey.' },
            { name: 'Gorilla', emoji: '🦍', family: 'Hominidae', traits: { size: 'large', habitat: 'forest', diet: 'herbivore', activity: 'day', speed: 'slow' }, conservation: 'endangered', fact: 'Live in groups led by silverbacks.' },
            { name: 'Cheetah', emoji: '🐆', family: 'Felidae', traits: { size: 'medium', habitat: 'savanna', diet: 'carnivore', activity: 'day', speed: 'fast' }, conservation: 'vulnerable', fact: '70 mph in 30 seconds, fastest land animal.' }
        ];

        const traits = {
            size: ['small', 'medium', 'large'],
            habitat: ['forest', 'ocean', 'savanna'],
            diet: ['herbivore', 'omnivore', 'carnivore'],
            activity: ['day', 'night'],
            speed: ['slow', 'medium', 'fast']
        };

        let selected = {};

        function init() {
            Object.keys(traits).forEach(t => {
                const div = document.getElementById(t + 'Buttons');
                traits[t].forEach(v => {
                    const btn = document.createElement('button');
                    btn.textContent = v.charAt(0).toUpperCase() + v.slice(1);
                    btn.onclick = () => {
                        btn.classList.toggle('active');
                        selected[t] = selected[t] || [];
                        if (btn.classList.contains('active')) {
                            if (!selected[t].includes(v)) selected[t].push(v);
                        } else {
                            selected[t] = selected[t].filter(x => x !== v);
                        }
                        show();
                    };
                    div.appendChild(btn);
                });
            });
            show();
        }

        function show() {
            const hasSelect = Object.values(selected).some(a => a && a.length > 0);
            const res = document.getElementById('results');

            if (!hasSelect) {
                res.innerHTML = '<div class="no-results">Select traits to find matching animals</div>';
                return;
            }

            const matched = animals.map(a => {
                let score = 0, total = 0;
                Object.keys(selected).forEach(t => {
                    if (selected[t] && selected[t].length > 0) {
                        total += selected[t].length;
                        if (selected[t].includes(a.traits[t])) score++;
                    }
                });
                return { ...a, score: total > 0 ? Math.round(score / total * 100) : 0 };
            }).filter(a => a.score >= 60).sort((a, b) => b.score - a.score);

            if (matched.length === 0) {
                res.innerHTML = '<div class="no-results">No matches found</div>';
                return;
            }

            res.innerHTML = matched.map(a => `
                <div class="card">
                    <div class="emoji">${a.emoji}</div>
                    <div class="info">
                        <div class="name">${a.name}</div>
                        <div class="family">${a.family}</div>
                        <div class="conservation ${a.conservation.toLowerCase()}">${a.conservation.toUpperCase()}</div>
                        <div class="fact">${a.fact}</div>
                        <div class="match">Match: ${a.score}%</div>
                    </div>
                </div>
            `).join('');
        }

        init();
    </script>
</body>
</html>
