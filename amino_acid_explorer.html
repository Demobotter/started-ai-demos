<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Amino Acid Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f1419 0%, #1a2a3a 100%);
      color: #e0e6ff;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: rgba(20, 30, 48, 0.8);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 60px rgba(127, 179, 255, 0.1);
      border: 1px solid rgba(127, 179, 255, 0.2);
    }
    h1 {
      font-family: 'Merriweather', serif;
      font-size: 2.2em;
      margin-bottom: 10px;
      text-align: center;
      background: linear-gradient(135deg, #7fb3ff, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      text-align: center;
      font-size: 0.95em;
      color: #b0b8d4;
      margin-bottom: 30px;
    }
    .button-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 8px;
      margin-bottom: 30px;
    }
    .aa-btn {
      padding: 10px;
      background: linear-gradient(135deg, rgba(127, 179, 255, 0.15), rgba(0, 255, 136, 0.1));
      border: 1px solid rgba(127, 179, 255, 0.3);
      color: #e0e6ff;
      font-family: 'Merriweather', serif;
      font-weight: bold;
      font-size: 0.9em;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .aa-btn:hover {
      background: linear-gradient(135deg, rgba(127, 179, 255, 0.3), rgba(0, 255, 136, 0.2));
      border-color: rgba(127, 179, 255, 0.6);
      box-shadow: 0 0 20px rgba(127, 179, 255, 0.3);
    }
    .aa-btn.active {
      background: linear-gradient(135deg, #7fb3ff, #00ff88);
      color: #0f1419;
      box-shadow: 0 0 30px rgba(127, 179, 255, 0.5);
    }
    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-top: 30px;
    }
    @media (max-width: 768px) {
      .content { grid-template-columns: 1fr; }
      .container { padding: 20px; }
      h1 { font-size: 1.8em; }
    }
    .structure-box {
      background: rgba(10, 20, 40, 0.6);
      border: 1px solid rgba(0, 255, 136, 0.2);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 280px;
    }
    svg {
      width: 100%;
      height: 100%;
      max-width: 200px;
      max-height: 200px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-card {
      background: rgba(10, 20, 40, 0.6);
      border: 1px solid rgba(127, 179, 255, 0.2);
      border-radius: 10px;
      padding: 14px;
    }
    .stat-label {
      font-size: 0.75em;
      color: #7fb3ff;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 1.1em;
      font-weight: 600;
      color: #00ff88;
      font-family: 'Merriweather', serif;
    }
    .info-box {
      background: rgba(10, 20, 40, 0.6);
      border: 1px solid rgba(127, 179, 255, 0.2);
      border-radius: 10px;
      padding: 14px;
      font-size: 0.9em;
      line-height: 1.5;
    }
    .property-badge {
      display: inline-block;
      background: rgba(127, 179, 255, 0.15);
      border: 1px solid rgba(127, 179, 255, 0.3);
      border-radius: 6px;
      padding: 4px 10px;
      margin: 4px 4px 4px 0;
      font-size: 0.8em;
      color: #b0d4ff;
    }
  </style>
</head>

    function renderAminoAcid(code) {
      const aa = aminoAcids[code];
      if (!aa) return;

      // Update title and info
      document.getElementById('aaName').textContent = code;
      document.getElementById('aaFullName').textContent = aa.fullName;
      document.getElementById('codon').textContent = aa.codons.join(', ');
      document.getElementById('sidechain').textContent = aa.property;

      // Update structure
      const svg = document.getElementById('structureSVG');
      svg.innerHTML = aa.structure;

      // Update stats
      const statsGrid = document.getElementById('statsGrid');
      statsGrid.innerHTML = `
        <div class="stat-card">
          <div class="stat-label">Molecular Weight</div>
          <div class="stat-value">${aa.mw.toFixed(2)} u</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Isoelectric Point (pI)</div>
          <div class="stat-value">${aa.pI.toFixed(2)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">pKa (Carboxyl)</div>
          <div class="stat-value">${aa.pKa_carboxyl.toFixed(2)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">pKa (Amino)</div>
          <div class="stat-value">${aa.pKa_amino.toFixed(2)}</div>
        </div>
        ${aa.pKa_sidechain ? `
        <div class="stat-card">
          <div class="stat-label">pKa (Side Chain)</div>
          <div class="stat-value">${aa.pKa_sidechain.toFixed(2)}</div>
        </div>
        ` : ''}
        <div class="stat-card">
          <div class="stat-label">Protein Abundance</div>
          <div class="stat-value">${aa.abundance.toFixed(1)}%</div>
        </div>
      `;

      // Update property badges
      const properties = document.getElementById('properties');
      const badges = [];
      if (aa.pKa_sidechain !== null) {
        if (aa.pI < 6.5) badges.push('Acidic');
        else if (aa.pI > 8) badges.push('Basic');
        else badges.push('Polar');
      }
      properties.innerHTML = badges.map(b => `<span class="property-badge">${b}</span>`).join('');

      // Update active button
      document.querySelectorAll('.aa-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.textContent === code) btn.classList.add('active');
      });
    }

    // Initialize
    const buttonGrid = document.getElementById('buttonGrid');
    Object.keys(aminoAcids).forEach(code => {
      const btn = document.createElement('button');
      btn.className = 'aa-btn';
      btn.textContent = code;
      btn.onclick = () => renderAminoAcid(code);
      buttonGrid.appendChild(btn);
    });

    // Start with Alanine
    renderAminoAcid('Ala');
