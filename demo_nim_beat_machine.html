<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nim: Beat the Machine</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #2a1810 0%, #3d2817 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: #1a0f0a;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      border: 1px solid #4a3a2a;
    }
    h1 {
      font-family: 'Fraunces', serif;
      font-size: 2.5rem;
      color: #d4a574;
      margin-bottom: 10px;
      text-align: center;
    }
    .subtitle {
      color: #999;
      text-align: center;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }
    .scoreboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
      background: #0a0503;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #3a2a1a;
    }
    .score-box {
      text-align: center;
    }
    .score-box h3 {
      color: #d4a574;
      font-size: 0.85rem;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .score-box .value {
      font-size: 2rem;
      color: #fff;
      font-weight: 600;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .control-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .control-group label {
      color: #bbb;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    select, button {
      padding: 8px 16px;
      border: 1px solid #4a3a2a;
      background: #2a1810;
      color: #d4a574;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      transition: all 0.3s;
    }
    select:hover, button:hover {
      background: #3a2810;
      border-color: #d4a574;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .game-area {
      background: #0a0503;
      padding: 30px;
      border-radius: 8px;
      border: 1px solid #3a2a1a;
      margin-bottom: 20px;
      min-height: 250px;
    }
    .rows-display {
      display: grid;
      gap: 20px;
      margin-bottom: 20px;
    }
    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .row-label {
      color: #d4a574;
      font-weight: 600;
      min-width: 60px;
      font-size: 0.9rem;
    }
    .sticks {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .stick {
      width: 6px;
      height: 40px;
      background: linear-gradient(90deg, #d4a574 0%, #c99456 100%);
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .stick::after {
      content: '';
      position: absolute;
      top: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 4px;
      background: #c41e3a;
      border-radius: 2px;
    }
    .stick:hover {
      transform: scaleY(1.05);
      filter: brightness(1.1);
    }
    .stick.selected {
      background: linear-gradient(90deg, #e4b584 0%, #d99466 100%);
      filter: brightness(1.2);
      box-shadow: 0 0 8px rgba(212, 165, 116, 0.6);
    }
    .row.player-disabled .stick {
      cursor: not-allowed;
      opacity: 0.6;
    }
    .status {
      background: #2a1810;
      padding: 16px;
      border-radius: 6px;
      text-align: center;
      color: #d4a574;
      font-weight: 600;
      margin-bottom: 20px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #4a3a2a;
    }
    .status.thinking {
      color: #c99456;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .status.win {
      background: #1a4a2a;
      color: #6fd86f;
      border-color: #4a8a4a;
    }
    .status.lose {
      background: #4a1a2a;
      color: #ff6f6f;
      border-color: #8a4a5a;
    }
    .move-reason {
      color: #999;
      font-size: 0.85rem;
      font-weight: 400;
      margin-top: 8px;
    }
    .action-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 24px;
    }
    .math-toggle {
      margin-top: 20px;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }
    .math-toggle input[type="checkbox"] {
      cursor: pointer;
    }
    .math-display {
      background: #0a0503;
      padding: 12px;
      border-radius: 6px;
      color: #999;
      font-size: 0.85rem;
      font-family: 'Courier New', monospace;
      margin-top: 12px;
      display: none;
      border: 1px solid #3a2a1a;
    }
    .math-display.show {
      display: block;
    }
    .footer {
      text-align: center;
      color: #666;
      font-size: 0.85rem;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>♟️ Nim</h1>
    <p class="subtitle">Beat the Machine at the Ancient Game of Logic</p>
    
    <div class="scoreboard">
      <div class="score-box">
        <h3>You</h3>
        <div class="value" id="playerScore">0</div>
      </div>
      <div class="score-box">
        <h3>Machine</h3>
        <div class="value" id="machineScore">0</div>
      </div>
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="difficulty">Difficulty:</label>
        <select id="difficulty" onchange="changeDifficulty()">
          <option value="perfect">Perfect (Unbeatable)</option>
          <option value="fair">Fair (12% Blunder)</option>
        </select>
      </div>
      <div class="control-group">
        <label for="variant">Variant:</label>
        <select id="variant" onchange="changeVariant()">
          <option value="misere">Misère (Last Loses)</option>
          <option value="normal">Normal (Last Wins)</option>
        </select>
      </div>
      <button onclick="newGame()">New Game</button>
    </div>

    <div class="game-area">
      <div class="status" id="status">Your turn — pick sticks to remove</div>
      <div class="rows-display" id="rows"></div>
      
      <div class="math-toggle">
        <input type="checkbox" id="showMath" onchange="toggleMath()">
        <label for="showMath">Show the math (nim-sum)</label>
      </div>
      <div class="math-display" id="mathDisplay"></div>

      <div class="action-buttons" style="margin-top: 20px;">
        <button id="confirmBtn" onclick="confirmMove()" disabled>Confirm Move</button>
        <button onclick="resetSelection()">Reset Selection</button>
      </div>
    </div>

    <div class="footer">
      Classic Nim with Sprague-Grundy strategy. Click sticks to select, confirm your move.
    </div>
  </div>

  <script>
    const MISERE = 'misere';
    const NORMAL = 'normal';
    let gameState = {
      rows: [1, 3, 5, 7],
      difficulty: 'perfect',
      variant: MISERE,
      playerTurn: true,
      selectedRow: null,
      selectedCount: 0,
      playerScore: 0,
      machineScore: 0,
      gameOver: false
    };
    let showMathFlag = false;

    function initGame() {
      gameState.rows = [1, 3, 5, 7];
      gameState.playerTurn = true;
      gameState.selectedRow = null;
      gameState.selectedCount = 0;
      gameState.gameOver = false;
      renderGame();
    }

    function newGame() {
      initGame();
      updateStatus('Your turn — pick sticks to remove');
    }

    function changeDifficulty() {
      gameState.difficulty = document.getElementById('difficulty').value;
    }

    function changeVariant() {
      gameState.variant = document.getElementById('variant').value;
    }

    function toggleMath() {
      showMathFlag = document.getElementById('showMath').checked;
      updateMathDisplay();
    }

    function updateMathDisplay() {
      const display = document.getElementById('mathDisplay');
      if (!showMathFlag) {
        display.classList.remove('show');
        return;
      }
      const nimSum = calculateNimSum();
      display.classList.add('show');
      display.innerHTML = `XOR of rows: ${gameState.rows.map(r => r === 0 ? '0' : r).join(' ⊕ ')} = ${nimSum}`;
    }

    function calculateNimSum() {
      return gameState.rows.reduce((acc, val) => acc ^ val, 0);
    }

    function renderGame() {
      const rowsDiv = document.getElementById('rows');
      rowsDiv.innerHTML = '';
      
      gameState.rows.forEach((count, idx) => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'row' + (!gameState.playerTurn ? ' player-disabled' : '');
        
        const label = document.createElement('div');
        label.className = 'row-label';
        label.textContent = `Row ${idx + 1}`;
        rowDiv.appendChild(label);
        
        const sticksDiv = document.createElement('div');
        sticksDiv.className = 'sticks';
        
        for (let i = 0; i < count; i++) {
          const stick = document.createElement('div');
          stick.className = 'stick';
          if (gameState.selectedRow === idx && i < gameState.selectedCount) {
            stick.classList.add('selected');
          }
          stick.onclick = () => gameState.playerTurn && !gameState.gameOver && selectStick(idx, i + 1);
          sticksDiv.appendChild(stick);
        }
        
        rowDiv.appendChild(sticksDiv);
        rowsDiv.appendChild(rowDiv);
      });
      
      const confirmBtn = document.getElementById('confirmBtn');
      confirmBtn.disabled = gameState.playerTurn === false || gameState.selectedRow === null || gameState.gameOver;
      
      updateMathDisplay();
    }

    function selectStick(rowIdx, count) {
      if (gameState.selectedRow === rowIdx) {
        if (gameState.selectedCount === count) {
          gameState.selectedRow = null;
          gameState.selectedCount = 0;
        } else {
          gameState.selectedCount = count;
        }
      } else {
        gameState.selectedRow = rowIdx;
        gameState.selectedCount = count;
      }
      renderGame();
    }

    function resetSelection() {
      gameState.selectedRow = null;
      gameState.selectedCount = 0;
      renderGame();
    }

    function confirmMove() {
      if (gameState.selectedRow === null) return;
      
      const rowIdx = gameState.selectedRow;
      const count = gameState.selectedCount;
      gameState.rows[rowIdx] -= count;
      
      checkGameEnd();
      if (!gameState.gameOver) {
        gameState.playerTurn = false;
        gameState.selectedRow = null;
        gameState.selectedCount = 0;
        updateStatus('Machine thinking...');
        updateMathDisplay();
        renderGame();
        setTimeout(machineMove, 800);
      }
    }

    function checkGameEnd() {
      const totalSticks = gameState.rows.reduce((a, b) => a + b, 0);
      
      if (totalSticks === 0) {
        // Someone took the last stick
        if (gameState.variant === MISERE) {
          // Last player loses in misère
          gameState.gameOver = true;
          gameState.playerScore++;
          updateStatus('You win! Machine took the last stick.', 'win');
        } else {
          gameState.gameOver = true;
          gameState.playerScore++;
          updateStatus('You win! Machine took the last stick.', 'win');
        }
      }
    }

    function machineMove() {
      const move = findBestMove();
      if (!move) {
        // No winning move available; stall
        updateStatus('Machine stalling...', 'thinking');
        setTimeout(() => {
          const anyRow = gameState.rows.findIndex(r => r > 0);
          if (anyRow >= 0) {
            const removeCount = 1;
            gameState.rows[anyRow] -= removeCount;
          }
          finalizeMachineMove('No winning move; I made a stall move.');
        }, 600);
        return;
      }
      
      const [rowIdx, removeCount] = move;
      gameState.rows[rowIdx] -= removeCount;
      finalizeMachineMove(`nim-sum was ${calculateNimSum()}, I balanced row ${rowIdx + 1}.`);
    }

    function finalizeMachineMove(reason) {
      const totalSticks = gameState.rows.reduce((a, b) => a + b, 0);
      
      if (totalSticks === 0) {
        gameState.gameOver = true;
        gameState.machineScore++;
        updateStatus('Machine wins! You take the last stick.', 'lose');
      } else {
        gameState.playerTurn = true;
        updateStatus('Your turn. ' + reason);
        renderGame();
      }
    }

    function findBestMove() {
      const nimSum = calculateNimSum();
      
      if (nimSum === 0) {
        // Already losing position, or endgame check
        if (isEndgame() && gameState.variant === MISERE) {
          return findMisereEndgameMove();
        }
        return null; // No winning move
      }
      
      // Try to make nim-sum = 0
      for (let i = 0; i < gameState.rows.length; i++) {
        const newVal = gameState.rows[i] ^ nimSum;
        if (newVal < gameState.rows[i]) {
          const removeCount = gameState.rows[i] - newVal;
          return [i, removeCount];
        }
      }
      
      return null;
    }

    function isEndgame() {
      return gameState.rows.filter(r => r > 1).length === 0;
    }

    function findMisereEndgameMove() {
      // In misère endgame, we want to leave odd number of size-1 rows
      const onesCount = gameState.rows.filter(r => r === 1).length;
      const nonZeroRows = gameState.rows.filter(r => r > 0);
      
      if (nonZeroRows.length === 1) {
        // Last row; leave it empty
        const idx = gameState.rows.findIndex(r => r > 0);
        return [idx, gameState.rows[idx]];
      }
      
      // Try to manipulate to leave opponent with odd number of 1s
      for (let i = 0; i < gameState.rows.length; i++) {
        if (gameState.rows[i] > 1) {
          // Reduce to 0 or 1, aiming for odd parity
          const resultOnes = (onesCount + 1) % 2;
          return [i, gameState.rows[i] - (resultOnes === 1 ? 1 : 0)];
        }
      }
      
      return null;
    }

    function updateStatus(msg, className = '') {
      const status = document.getElementById('status');
      status.textContent = msg;
      status.className = 'status';
      if (className) status.classList.add(className);
    }

    document.getElementById('playerScore').textContent = gameState.playerScore;
    document.getElementById('machineScore').textContent = gameState.machineScore;

    // Start the game
    initGame();
  </script>
</body>
</html>
