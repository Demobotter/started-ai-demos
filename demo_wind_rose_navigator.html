<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wind Rose Navigator</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Space Mono', monospace;
      background: #0a1428;
      color: #7dd3fc;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: #0f1d38;
      border: 2px solid #4da8da;
      border-radius: 8px;
      padding: 30px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      text-align: center;
      margin-bottom: 10px;
      color: #7dd3fc;
    }
    .subtitle {
      text-align: center;
      color: #64b5f6;
      margin-bottom: 30px;
      font-size: 12px;
      letter-spacing: 1px;
    }
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 250px;
      gap: 30px;
      align-items: start;
    }
    .canvas-wrapper {
      display: flex;
      justify-content: center;
      background: #0a1428;
      border-radius: 8px;
      padding: 20px;
      border: 1px solid #1f4d7f;
    }
    canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .control-group {
      background: #0a1428;
      padding: 12px;
      border-radius: 6px;
      border-left: 4px solid #4da8da;
    }
    .control-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64b5f6;
      margin-bottom: 6px;
      display: block;
    }
    select, input {
      width: 100%;
      padding: 8px;
      background: #0f1d38;
      border: 1px solid #4da8da;
      color: #7dd3fc;
      font-family: 'Space Mono', monospace;
      border-radius: 4px;
      font-size: 12px;
    }
    select:hover, input:hover {
      border-color: #7dd3fc;
    }
    .stats {
      background: #0a1428;
      padding: 12px;
      border-radius: 6px;
      border-left: 4px solid #4da8da;
      font-size: 11px;
      line-height: 1.6;
    }
    .stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 6px;
    }
    .stat-label {
      color: #64b5f6;
    }
    .stat-value {
      color: #00ff88;
      font-weight: bold;
    }
    .safe-routes-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .safe-routes-toggle input {
      width: auto;
      cursor: pointer;
    }
    .safe-routes-toggle label {
      cursor: pointer;
      font-size: 11px;
      flex: 1;
    }
    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
      .container {
        padding: 15px;
      }
      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

    function getWindowData() {
      const location = document.getElementById('locationSelect').value;
      const month = parseInt(document.getElementById('monthSelect').value);
      const era = document.getElementById('eraSelect').value;

      let monthKey = month;
      if (!windData[location][era][monthKey]) {
        monthKey = Object.keys(windData[location][era]).map(Number).sort((a, b) => Math.abs(a - month) - Math.abs(b - month))[0];
      }

      return windData[location][era][monthKey];
    }

    function updateStats() {
      const location = document.getElementById('locationSelect').value;
      const month = parseInt(document.getElementById('monthSelect').value);
      const era = document.getElementById('eraSelect').value;
      const data = getWindowData();

      const maxFreq = Math.max(...Object.values(data).filter(v => typeof v === 'number' && v < 20));
      let maxDir = '';
      let maxVal = 0;
      directionNames.forEach((dir, i) => {
        if (data[dir] > maxVal) {
          maxVal = data[dir];
          maxDir = dir;
        }
      });

      document.getElementById('dominantDir').textContent = `${maxDir} ${maxVal}%`;
      document.getElementById('avgSpeed').textContent = `${data.avgSpeed} kts`;
      document.getElementById('peakGust').textContent = `${data.peakGust} kts`;
      document.getElementById('calmness').textContent = `${data.calmness}%`;

      const isSummer = month >= 5 && month <= 8;
      document.getElementById('seasonalNote').textContent = seasonalNotes[location] || 'Varied winds';
    }

    function drawWindRose() {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const maxRadius = 120;
      const data = getWindowData();

      ctx.fillStyle = '#0a1428';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Frequency heatmap background
      ctx.fillStyle = 'rgba(10, 20, 40, 0.8)';
      ctx.beginPath();
      ctx.arc(cx, cy, maxRadius, 0, Math.PI * 2);
      ctx.fill();

      // Radial grid
      ctx.strokeStyle = '#1f4d7f';
      ctx.lineWidth = 1;
      for (let r = 20; r <= maxRadius; r += 20) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Degree labels
      ctx.fillStyle = '#64b5f6';
      ctx.font = '10px Space Mono';
      ctx.textAlign = 'center';
      directionNames.forEach((dir, i) => {
        const angle = (i * 22.5 - 90) * Math.PI / 180;
        const x = cx + Math.cos(angle) * (maxRadius + 20);
        const y = cy + Math.sin(angle) * (maxRadius + 20);
        ctx.fillText(dir, x, y + 3);
      });

      // Draw wind rose
      directionNames.forEach((dir, i) => {
        const freq = data[dir];
        const radius = (freq / 16) * maxRadius;
        const angle = ((i * 22.5) - 90) * Math.PI / 180;

        // Speed-based color
        const speed = data.avgSpeed * (freq / 10);
        let color = '#6dd5ed';
        if (speed > 3 && speed <= 12) color = '#4da8da';
        if (speed > 12 && speed <= 25) color = '#ffd700';
        if (speed > 25 && speed <= 40) color = '#ff8c00';
        if (speed > 40) color = '#ff0000';

        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius;
        ctx.lineTo(x, y);
        ctx.stroke();
      });

      // Central ship icon
      drawShip(cx, cy);

      // Safe routes toggle
      if (document.getElementById('safeRoutesToggle').checked) {
        drawSafeRoutes(cx, cy, maxRadius);
      }

      // Center dot
      ctx.fillStyle = '#7dd3fc';
      ctx.beginPath();
      ctx.arc(cx, cy, 4, 0, Math.PI * 2);
      ctx.fill();

      updateStats();
    }

    function drawShip(x, y) {
      const location = document.getElementById('locationSelect').value;
      const data = getWindowData();

      let maxDir = directionNames[0];
      let maxVal = 0;
      directionNames.forEach((dir, i) => {
        if (data[dir] > maxVal) {
          maxVal = data[dir];
          maxDir = dir;
        }
      });

      const shipAngle = (directionNames.indexOf(maxDir) * 22.5 - 90) * Math.PI / 180;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(shipAngle);

      ctx.strokeStyle = '#8b6f47';
      ctx.fillStyle = '#8b6f47';
      ctx.lineWidth = 2;

      // Hull
      ctx.beginPath();
      ctx.ellipse(0, 0, 8, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      // Sail
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(-2, -8);
      ctx.lineTo(6, 8);
      ctx.lineTo(2, 8);
      ctx.lineTo(-2, -6);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawSafeRoutes(cx, cy, maxRadius) {
      const location = document.getElementById('locationSelect').value;
      const month = parseInt(document.getElementById('monthSelect').value);
      const isSummer = month >= 5 && month <= 8;
      const season = isSummer ? 'summer' : 'winter';

      const routes = safeRoutes[location][season];

      ctx.strokeStyle = '#4da8da';
      ctx.setLineDash([5, 5]);
      ctx.lineWidth = 2;

      routes.forEach(([startAngle, endAngle]) => {
        const start = (startAngle - 90) * Math.PI / 180;
        const end = (endAngle - 90) * Math.PI / 180;

        ctx.beginPath();
        ctx.arc(cx, cy, maxRadius - 10, start, end);
        ctx.stroke();
      });

      ctx.setLineDash([]);
    }

    document.getElementById('locationSelect').addEventListener('change', drawWindRose);
    document.getElementById('monthSelect').addEventListener('change', drawWindRose);
    document.getElementById('eraSelect').addEventListener('change', drawWindRose);
    document.getElementById('safeRoutesToggle').addEventListener('change', drawWindRose);

    // Initial draw
    drawWindRose();
  </script>
</body>
</html>
