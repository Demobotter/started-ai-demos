<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Lato:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e8e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
        }
        
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
        
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .section {
            background: rgba(42, 51, 80, 0.5);
            border: 1px solid rgba(77, 184, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
        }
        
        .section h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #4db8ff;
            margin-bottom: 15px;
        }
        
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }
        
        .slider-group:last-child {
            margin-bottom: 0;
        }
        
        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #b0b0c0;
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(77, 184, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00d9ff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00d9ff;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
        }
        
        .stat-box {
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }
        
        .stat-box:last-child {
            margin-bottom: 0;
        }
        
        .stat-label {
            font-size: 11px;
            color: #8890a0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        
        .stat-value {
            font-family: 'Poppins', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: #00d9ff;
        }
        
        .stat-value.highlight {
            color: #ffd700;
        }
        
        .canvas-wrapper {
            background: rgba(10, 14, 36, 0.8);
            border: 1px solid rgba(77, 184, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 500px;
        }
        
        canvas {
            width: 100%;
            height: 100%;
            max-width: 500px;
            max-height: 500px;
            background: radial-gradient(circle, rgba(26, 31, 58, 0.9) 0%, rgba(10, 14, 36, 0.95) 100%);
            border-radius: 8px;
        }
        
        button {
            background: rgba(77, 184, 255, 0.2);
            color: #4db8ff;
            border: 1px solid #4db8ff;
            padding: 10px 16px;
            border-radius: 8px;
            font-family: 'Lato', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        button:hover {
            background: rgba(77, 184, 255, 0.4);
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Panel -->
        <div class="control-panel">
            <!-- Orbital Parameters -->
            <div class="section">
                <h3>Orbital Parameters</h3>
                
                <div class="slider-group">
                    <div class="slider-label">
                        <span>Semi-major Axis (AU)</span>
                        <span id="smaValue">1.0</span>
                    </div>
                    <input type="range" id="smaSlider" min="0.4" max="30" step="0.1" value="1.0">
                </div>
                
                <div class="slider-group">
                    <div class="slider-label">
                        <span>Eccentricity</span>
                        <span id="eccValue">0.2</span>
                    </div>
                    <input type="range" id="eccSlider" min="0" max="0.9" step="0.05" value="0.2">
                </div>
                
                <div class="slider-group">
                    <div class="slider-label">
                        <span>Inclination (°)</span>
                        <span id="incValue">0</span>
                    </div>
                    <input type="range" id="incSlider" min="0" max="90" step="5" value="0">
                </div>
            </div>
            
            <!-- Orbital Metrics -->
            <div class="section">
                <h3>Orbital Metrics</h3>
                
                <div class="stat-box">
                    <div class="stat-label">Orbital Period</div>
                    <div class="stat-value highlight" id="period">1.0 years</div>
                </div>
                
                <div class="stat-box">
                    <div class="stat-label">Aphelion Distance</div>
                    <div class="stat-value" id="aphelion">1.2 AU</div>
                </div>
                
                <div class="stat-box">
                    <div class="stat-label">Perihelion Distance</div>
                    <div class="stat-value" id="perihelion">0.8 AU</div>
                </div>
                
                <div class="stat-box">
                    <div class="stat-label">Orbital Velocity (avg)</div>
                    <div class="stat-value" id="velocity">29.8 km/s</div>
                </div>
            </div>
            
            <!-- Presets -->
            <div class="section">
                <h3>Preset Orbits</h3>
                <div class="button-group">
                    <button onclick="setOrbit(1.0, 0.017)">Earth</button>
                    <button onclick="setOrbit(1.52, 0.093)">Mars</button>
                    <button onclick="setOrbit(5.2, 0.048)">Jupiter</button>
                    <button onclick="setOrbit(0.39, 0.206)">Mercury</button>
                </div>
            </div>
        </div>
        
        <!-- Orbit Visualization -->
        <div class="canvas-wrapper">
            <canvas id="orbitCanvas"></canvas>
        </div>
    </div>
    
    <script>
        class OrbitSimulator {
            constructor() {
                this.canvas = document.getElementById('orbitCanvas');
                this.ctx = this.canvas.getContext('2d');
                
                // Orbital parameters
                this.sma = 1.0; // semi-major axis (AU)
                this.ecc = 0.2; // eccentricity
                this.inc = 0;   // inclination (degrees)
                
                this.scale = 50; // pixels per AU
                this.animationTime = 0;
                
                this.setupEventListeners();
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
                
                this.animate();
            }
            
            setupEventListeners() {
                document.getElementById('smaSlider').addEventListener('input', (e) => {
                    this.sma = parseFloat(e.target.value);
                    document.getElementById('smaValue').textContent = this.sma.toFixed(1);
                    this.updateMetrics();
                });
                
                document.getElementById('eccSlider').addEventListener('input', (e) => {
                    this.ecc = parseFloat(e.target.value);
                    document.getElementById('eccValue').textContent = this.ecc.toFixed(2);
                    this.updateMetrics();
                });
                
                document.getElementById('incSlider').addEventListener('input', (e) => {
                    this.inc = parseFloat(e.target.value);
                    document.getElementById('incValue').textContent = this.inc;
                    this.updateMetrics();
                });
            }
            
            resizeCanvas() {
                const rect = this.canvas.getBoundingClientRect();
                this.canvas.width = rect.width * window.devicePixelRatio;
                this.canvas.height = rect.height * window.devicePixelRatio;
                this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            }
            
            updateMetrics() {
                // Kepler's 3rd law: P² = a³ (in solar system units)
                const period = Math.pow(this.sma, 1.5);
                
                // Aphelion and perihelion
                const aphelion = this.sma * (1 + this.ecc);
                const perihelion = this.sma * (1 - this.ecc);
                
                // Average orbital velocity (km/s) for Earth's orbit around Sun
                const velocity = 29.8 / Math.sqrt(this.sma);
                
                document.getElementById('period').textContent = period.toFixed(2) + ' years';
                document.getElementById('aphelion').textContent = aphelion.toFixed(2) + ' AU';
                document.getElementById('perihelion').textContent = perihelion.toFixed(2) + ' AU';
                document.getElementById('velocity').textContent = velocity.toFixed(1) + ' km/s';
            }
            
            draw() {
                const w = this.canvas.width / window.devicePixelRatio;
                const h = this.canvas.height / window.devicePixelRatio;
                const cx = w / 2;
                const cy = h / 2;
                
                // Clear with space gradient
                const grad = this.ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h));
                grad.addColorStop(0, 'rgba(26, 31, 58, 0.9)');
                grad.addColorStop(1, 'rgba(10, 14, 36, 0.95)');
                this.ctx.fillStyle = grad;
                this.ctx.fillRect(0, 0, w, h);
                
                // Draw star at focus
                this.ctx.fillStyle = '#ffd700';
                this.ctx.beginPath();
                this.ctx.arc(cx, cy, 8, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Draw glow around star
                this.ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
                this.ctx.beginPath();
                this.ctx.arc(cx, cy, 20, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Draw orbital ellipse
                this.drawEllipse(cx, cy, this.sma * this.scale, this.sma * Math.sqrt(1 - this.ecc * this.ecc) * this.scale);
                
                // Draw planet at current position
                const trueAnomaly = (this.animationTime * Math.PI * 2) % (Math.PI * 2);
                const r = (this.sma * (1 - this.ecc * this.ecc)) / (1 + this.ecc * Math.cos(trueAnomaly));
                const x = cx + r * this.scale * Math.cos(trueAnomaly);
                const y = cy + r * this.scale * Math.sin(trueAnomaly);
                
                this.ctx.fillStyle = '#00d9ff';
                this.ctx.beginPath();
                this.ctx.arc(x, y, 5, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Planet glow
                this.ctx.fillStyle = 'rgba(0, 217, 255, 0.3)';
                this.ctx.beginPath();
                this.ctx.arc(x, y, 12, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Draw distance line
                this.ctx.strokeStyle = 'rgba(0, 217, 255, 0.4)';
                this.ctx.lineWidth = 1;
                this.ctx.setLineDash([4, 4]);
                this.ctx.beginPath();
                this.ctx.moveTo(cx, cy);
                this.ctx.lineTo(x, y);
                this.ctx.stroke();
                this.ctx.setLineDash([]);
                
                // Draw velocity vector
                const speed = 1 + 0.5 * (this.ecc * Math.cos(trueAnomaly));
                const vx = -speed * this.scale * Math.sin(trueAnomaly);
                const vy = speed * this.scale * Math.cos(trueAnomaly);
                const vlen = 15;
                this.ctx.strokeStyle = '#ff9800';
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                this.ctx.moveTo(x, y);
                this.ctx.lineTo(x + vx / (Math.sqrt(vx*vx + vy*vy)) * vlen, y + vy / (Math.sqrt(vx*vx + vy*vy)) * vlen);
                this.ctx.stroke();
            }
            
            drawEllipse(cx, cy, rx, ry) {
                this.ctx.strokeStyle = 'rgba(77, 184, 255, 0.5)';
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                
                for (let angle = 0; angle < Math.PI * 2; angle += 0.05) {
                    const x = cx + rx * Math.cos(angle);
                    const y = cy + ry * Math.sin(angle);
                    if (angle === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }
                
                this.ctx.closePath();
                this.ctx.stroke();
            }
            
            animate() {
                const period = Math.pow(this.sma, 1.5);
                this.animationTime += 0.01 / period;
                
                this.draw();
                requestAnimationFrame(() => this.animate());
            }
        }
        
        function setOrbit(sma, ecc) {
            document.getElementById('smaSlider').value = sma;
            document.getElementById('smaValue').textContent = sma.toFixed(1);
            
            document.getElementById('eccSlider').value = ecc;
            document.getElementById('eccValue').textContent = ecc.toFixed(2);
            
            simulator.sma = sma;
            simulator.ecc = ecc;
            simulator.updateMetrics();
        }
        
        let simulator;
        window.addEventListener('DOMContentLoaded', () => {
            simulator = new OrbitSimulator();
            simulator.updateMetrics();
        });
    </script>
</body>
</html>
