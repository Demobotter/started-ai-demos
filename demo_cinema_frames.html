<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema Frames — Aspect Ratio Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0a0a0a; color: #e0f2fe; font-family: 'Space Mono', monospace; }
    body { display: flex; flex-direction: column; }
    .header {
      background: #0f1419;
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #1a3a5a;
      text-align: center;
    }
    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
    }
    .header p {
      font-size: 0.9rem;
      color: #7dd3fc;
      font-weight: 400;
    }
    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 0;
    }
    .sidebar {
      width: 280px;
      background: #0f1419;
      border-right: 1px solid #1a3a5a;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .section {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #d4af37;
    }
    .ratio-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }
    .ratio-btn {
      padding: 0.7rem 0.8rem;
      background: #1a2a3a;
      border: 1px solid #1a3a5a;
      color: #7dd3fc;
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.2s ease;
    }
    .ratio-btn:hover {
      background: #2a3a4a;
      border-color: #4da8da;
    }
    .ratio-btn.active {
      background: #d4af37;
      color: #0a0a0a;
      border-color: #d4af37;
      font-weight: 700;
    }
    .image-preset {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.4rem;
    }
    .img-btn {
      padding: 0.6rem 0.4rem;
      background: #1a2a3a;
      border: 1px solid #1a3a5a;
      color: #7dd3fc;
      font-size: 0.75rem;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.2s ease;
    }
    .img-btn:hover {
      background: #2a3a4a;
      border-color: #4da8da;
    }
    .img-btn.active {
      background: #4da8da;
      border-color: #4da8da;
      color: #0a0a0a;
      font-weight: 700;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .control-label {
      font-size: 0.8rem;
      color: #7dd3fc;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .control-label .value {
      color: #d4af37;
      font-weight: 700;
    }
    input[type="range"] {
      width: 100%;
      height: 4px;
      background: #1a3a5a;
      border: none;
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      background: #d4af37;
      cursor: pointer;
      border-radius: 50%;
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: #d4af37;
      cursor: pointer;
      border-radius: 50%;
      border: none;
    }
    .stats-box {
      background: #1a2a3a;
      border-left: 3px solid #2d9d5f;
      padding: 0.8rem;
      border-radius: 3px;
      font-size: 0.8rem;
      line-height: 1.6;
    }
    .stats-label {
      color: #7dd3fc;
    }
    .stats-value {
      color: #d4af37;
      font-weight: 700;
      font-family: 'Space Mono', monospace;
    }
    .toggle-check {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem;
      background: #1a2a3a;
      border: 1px solid #1a3a5a;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .toggle-check:hover {
      background: #2a3a4a;
      border-color: #4da8da;
    }
    .toggle-check input {
      cursor: pointer;
      accent-color: #d4af37;
    }
    .toggle-check label {
      cursor: pointer;
      font-size: 0.8rem;
      flex: 1;
    }
    .canvas-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      padding: 2rem;
      overflow: hidden;
    }
    #canvas {
      max-width: 100%;
      max-height: 100%;
      border: 1px solid #1a3a5a;
      border-radius: 0;
      image-rendering: crisp-edges;
    }
    @media (max-width: 768px) {
      .container { flex-direction: column; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #1a3a5a; }
      .header h1 { font-size: 1.6rem; }
      .ratio-buttons { grid-template-columns: 1fr 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎬 Cinema Frames</h1>
    <p>Explore how aspect ratio shapes film composition</p>
  </div>
  <div class="container">
    <div class="sidebar">
      <div class="section">
        <div class="section-title">Preset Ratios</div>
        <div class="ratio-buttons">
          <button class="ratio-btn" data-ratio="1.37">Academy</button>
          <button class="ratio-btn" data-ratio="1.78">16:9</button>
          <button class="ratio-btn" data-ratio="1.85">Scope</button>
          <button class="ratio-btn" data-ratio="2.39">Epic</button>
          <button class="ratio-btn" data-ratio="1.44">IMAX</button>
          <button class="ratio-btn" data-ratio="0.5625">Vertical</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Image Preset</div>
        <div class="image-preset">
          <button class="img-btn active" data-img="landscape">Landscape</button>
          <button class="img-btn" data-img="portrait">Portrait</button>
          <button class="img-btn" data-img="nature">Nature</button>
        </div>
      </div>

      <div class="section">
        <div class="control-group">
          <label class="control-label">
            <span>Aspect Ratio</span>
            <span class="value" id="ratioDisplay">16:9</span>
          </label>
          <input type="range" id="ratioSlider" min="0.5" max="3" step="0.01" value="1.78">
        </div>
      </div>

      <div class="section">
        <div class="control-group">
          <label class="control-label">
            <span>Dimensions</span>
          </label>
          <div class="stats-box">
            <div><span class="stats-label">Width:</span> <span class="stats-value" id="width">1920</span>px</div>
            <div><span class="stats-label">Height:</span> <span class="stats-value" id="height">1080</span>px</div>
            <div><span class="stats-label">Visible:</span> <span class="stats-value" id="visible">100%</span></div>
          </div>
        </div>
      </div>

      <div class="section">
        <label class="toggle-check">
          <input type="checkbox" id="safeZoneToggle">
          <label for="safeZoneToggle">Show Safe Zones</label>
        </label>
      </div>

      <div class="section">
        <div class="stats-box">
          <div><span class="stats-label">Format:</span><br><span class="stats-value" id="formatName">16:9 (Digital)</span></div>
          <div style="margin-top: 0.6rem;"><span class="stats-label">Context:</span><br><span class="stats-value" style="font-size: 0.75rem;" id="formatContext">Modern TV & streaming</span></div>
        </div>
      </div>
    </div>

    <div class="canvas-area">
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <script>
    // Image presets (base64 for self-contained demo)
    const presets = {
      landscape: 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTkyMCIgaGVpZ2h0PSIxMDgwIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxkZWZzPjxsaW5lYXJHcmFkaWVudCBpZD0ic2t5IiB4MT0iMCUiIHkxPSIwJSIgeDI9IjAlIiB5Mj0iMTAwJSI+PHN0b3Agb2Zmc2V0PSIwJSIgc3R5bGU9InN0b3AtY29sb3I6IzY3YjBkZTtzdG9wLW9wYWNpdHk6MSIgLz48c3RvcCBvZmZzZXQ9IjEwMCUiIHN0eWxlPSJzdG9wLWNvbG9yOiNkNGE1ZmY7c3RvcC1vcGFjaXR5OjEiIC8+PC9saW5lYXJHcmFkaWVudD48L2RlZnM+PHJlY3Qgd2lkdGg9IjE5MjAiIGhlaWdodD0iNjQ4IiBmaWxsPSJ1cmwoI3NreSkiIC8+PHJlY3QgeT0iNjQ4IiB3aWR0aD0iMTkyMCIgaGVpZ2h0PSI0MzIiIGZpbGw9IiMyYTcwNTEiIC8+PGNpcmNsZSBjeD0iMzIwIiBjeT0iMzAwIiByPSIxNjAiIGZpbGw9IiNmZmQ3MDAiIG9wYWNpdHk9IjAuOCIgLz48cG9seWdvbiBwb2ludHM9IjQwMCw5MjAgNjAwLDcwMCA4MDAsMjAwIDE2MDAsMjAwIDE4MDAsMTAwIDE5MjAsMjAwIDE5MjAsMTA4MCAwLDEwODAiIGZpbGw9IiMxYjQwMjAiIC8+PHBvbHlnb24gcG9pbnRzPSI2MDAsMTA4MCAxMDAwLDcwMCAxNDAwLDEwODAgMTkyMCw5MjAgMTkyMCwxMDgwIDAsIDEwODAiIGZpbGw9IiMzYzYwMzAiIC8+PC9zdmc+',
      portrait: 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTkyMCIgaGVpZ2h0PSIxMDgwIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxkZWZzPjxsaW5lYXJHcmFkaWVudCBpZD0idGlybSIgeDE9IjAlIiB5MT0iMCUiIHgyPSIxMDAlIiB5Mj0iMTAwJSI+PHN0b3Agb2Zmc2V0PSIwJSIgc3R5bGU9InN0b3AtY29sb3I6I2YyZjRmNztzdG9wLW9wYWNpdHk6MSIgLz48c3RvcCBvZmZzZXQ9IjEwMCUiIHN0eWxlPSJzdG9wLWNvbG9yOiNlMGUwZTA7c3RvcC1vcGFjaXR5OjEiIC8+PC9saW5lYXJHcmFkaWVudD48L2RlZnM+PHJlY3Qgd2lkdGg9IjE5MjAiIGhlaWdodD0iMTA4MCIgZmlsbD0idXJsKCN0aXJtKSIgLz48Y2lyY2xlIGN4PSI5NjAiIGN5PSIzMzAiIHI9IjIyMCIgZmlsbD0iIzhkMzg2MiIgLz48cmVjdCB4PSI4MjAiIHk9IjYwMCIgd2lkdGg9IjI4MCIgaGVpZ2h0PSI0MzAiIGZpbGw9IiMzMzMiIC8+PHBvbHlnb24gcG9pbnRzPSI4NjAsNzAwIDk2MCw2NjAgMTA2MCw3MDAiIGZpbGw9IiM1NTUiIC8+PC9zdmc+',
      nature: 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTkyMCIgaGVpZ2h0PSIxMDgwIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxkZWZzPjxmaWx0ZXIgaWQ9Im5vaXNlIj48ZlRpcmJ1bGVuY2UgdHlwZT0iZnJhY3RhbE5vaXNlIiBiYXNlRnJlcXVlbmN5PSIwLjAyIiBudW1PY3RhdmVzPSI0IiBzZWVkPSIyIi8+PGZlQ29sb3JNYXRyaXggdHlwZT0ic2F0dXJhdGUiIHZhbHVlcz0iMC41Ii8+PC9maWx0ZXI+PC9kZWZzPjxyZWN0IHdpZHRoPSIxOTIwIiBoZWlnaHQ9IjEwODAiIGZpbGw9IiMyMjY2MzMiIC8+PHJlY3Qgd2lkdGg9IjE5MjAiIGhlaWdodD0iNTQwIiBmaWxsPSIjNjdhYWQzIiBmaWx0ZXI9InVybCgjbm9pc2UpIiAvPjxjaXJjbGUgY3g9IjI0MCIgY3k9IjI0MCIgcj0iMTIwIiBmaWxsPSIjZmZkNzAwIiBvcGFjaXR5PSIwLjciIC8+PHBvbHlnb24gcG9pbnRzPSI0MDAsMjAwIDYwMCw1MzAgODAwLDIwMCAxMDAwLDYwMCAxMjAwLDIwMCAxNDAwLDMwMCAxNjAwLDIwMCAxODAwLDYwMCAxOTIwLDIwMCAxOTIwLDEwODAgMCwxMDgwIiBmaWxsPSIjMmE0NjMwIiBvcGFjaXR5PSIwLjkiIC8+PHBvbHlnb24gcG9pbnRzPSI2MDAsMTA4MCAxMDAwLDc1MCAxNDAwLDEwODAgMTkyMCw5MzAgMTkyMCwxMDgwIDAsMTA4MCIgZmlsbD0iIzE2MzAyMCIgLz48L3N2Zz4='
    };

    // Format metadata
    const formats = {
      1.37: { name: 'Academy', context: 'Classic B&W 1930–1950s', info: 'Early cinema standard' },
      1.78: { name: '16:9', context: 'Modern digital & TV', info: 'Current broadcast standard' },
      1.85: { name: 'Widescreen', context: 'Theatrical 1950s–present', info: 'Cinema standard 35mm' },
      2.39: { name: 'Cinescope', context: 'Epic scope cinematography', info: 'Anamorphic widescreen' },
      1.44: { name: 'IMAX', context: 'Large-format cinema', info: 'Immersive experience' },
      0.5625: { name: 'Vertical', context: 'Social media (TikTok/Insta)', info: 'Mobile-first vertical' }
    };

    let currentRatio = 1.78;
    let currentImageKey = 'landscape';
    let img = null;

    // Initialize image
    function loadImage(key) {
      currentImageKey = key;
      img = new Image();
      img.src = presets[key];
      img.onload = () => redraw();
    }

    // Format ratio display
    function formatRatio(r) {
      if (r < 0.6) return (r).toFixed(2) + ':1';
      if (Math.abs(r - 1.37) < 0.01) return '1.37:1 (Academy)';
      if (Math.abs(r - 1.78) < 0.01) return '16:9';
      if (Math.abs(r - 1.85) < 0.01) return '1.85:1 (Scope)';
      if (Math.abs(r - 2.39) < 0.01) return '2.39:1 (Epic)';
      if (Math.abs(r - 1.44) < 0.01) return '1.44:1 (IMAX)';
      return r.toFixed(2) + ':1';
    }

    // Find nearest format
    function getNearestFormat(ratio) {
      let nearest = 1.78;
      let minDist = Infinity;
      for (let r of [1.37, 1.78, 1.85, 2.39, 1.44, 0.5625]) {
        let dist = Math.abs(r - ratio);
        if (dist < minDist) { minDist = dist; nearest = r; }
      }
      return nearest;
    }

    // Redraw canvas
    function redraw() {
      if (!img) return;
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      
      const referenceWidth = 1920;
      const referenceHeight = 1080;
      const targetHeight = Math.min(600, window.innerHeight - 100);
      const targetWidth = targetHeight * currentRatio;
      
      canvas.width = targetWidth;
      canvas.height = targetHeight;
      
      // Clear
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Draw letterboxing and image
      let imgDisplayWidth, imgDisplayHeight, imgX, imgY;
      const imgRatio = img.width / img.height;
      
      if (imgRatio > currentRatio) {
        // Image wider than frame
        imgDisplayHeight = canvas.height;
        imgDisplayWidth = imgDisplayHeight * imgRatio;
        imgX = (canvas.width - imgDisplayWidth) / 2;
        imgY = 0;
      } else {
        // Image taller than frame
        imgDisplayWidth = canvas.width;
        imgDisplayHeight = imgDisplayWidth / imgRatio;
        imgX = 0;
        imgY = (canvas.height - imgDisplayHeight) / 2;
      }
      
      // Draw letterbox
      ctx.fillStyle = '#1a1a1a';
      if (imgX > 0) {
        ctx.fillRect(0, 0, imgX, canvas.height);
        ctx.fillRect(canvas.width - imgX, 0, imgX, canvas.height);
      }
      if (imgY > 0) {
        ctx.fillRect(0, 0, canvas.width, imgY);
        ctx.fillRect(0, canvas.height - imgY, canvas.width, imgY);
      }
      
      // Draw image
      ctx.drawImage(img, imgX, imgY, imgDisplayWidth, imgDisplayHeight);
      
      // Draw safe zones if enabled
      if (document.getElementById('safeZoneToggle').checked) {
        const actionMargin = canvas.width * 0.03;
        const tvMargin = canvas.width * 0.045;
        
        ctx.strokeStyle = '#4da8da';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.strokeRect(actionMargin, actionMargin, canvas.width - 2*actionMargin, canvas.height - 2*actionMargin);
        ctx.strokeStyle = '#7dd3fc';
        ctx.setLineDash([4, 2]);
        ctx.strokeRect(tvMargin, tvMargin, canvas.width - 2*tvMargin, canvas.height - 2*tvMargin);
        ctx.setLineDash([]);
      }
      
      // Update stats
      const displayHeight = referenceHeight;
      const displayWidth = Math.round(displayHeight * currentRatio);
      const origArea = referenceWidth * referenceHeight;
      const newArea = displayWidth * displayHeight;
      const visiblePercent = Math.round(newArea / origArea * 100);
      
      document.getElementById('width').textContent = displayWidth;
      document.getElementById('height').textContent = displayHeight;
      document.getElementById('visible').textContent = visiblePercent + '%';
      document.getElementById('ratioDisplay').textContent = formatRatio(currentRatio);
      
      // Update format info
      const nearest = getNearestFormat(currentRatio);
      const fmt = formats[nearest];
      document.getElementById('formatName').textContent = fmt.name + ' (' + fmt.context + ')';
      document.getElementById('formatContext').textContent = fmt.info;
    }

    // Event listeners
    document.getElementById('ratioSlider').addEventListener('input', (e) => {
      currentRatio = parseFloat(e.target.value);
      redraw();
    });

    document.querySelectorAll('.ratio-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const r = parseFloat(btn.dataset.ratio);
        currentRatio = r;
        document.getElementById('ratioSlider').value = r;
        document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        redraw();
      });
    });

    document.querySelectorAll('.img-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.img-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadImage(btn.dataset.img);
      });
    });

    document.getElementById('safeZoneToggle').addEventListener('change', redraw);

    // Initialize
    loadImage('landscape');
    document.querySelectorAll('.ratio-btn')[1].classList.add('active');

    // Handle resize
    window.addEventListener('resize', redraw);
  </script>
</body>
</html>
