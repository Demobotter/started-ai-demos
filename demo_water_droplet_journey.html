<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Droplet Journey</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Lato:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(135deg, #cce7ff 0%, #e8f5ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 100, 200, 0.15);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #0099ff 0%, #0077cc 100%);
            color: white;
            padding: 32px 24px;
            text-align: center;
        }
        .header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 2.2em;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .header p {
            font-size: 1em;
            opacity: 0.95;
        }
        .content {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 24px;
            padding: 32px;
        }
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .section {
            background: #f8fbff;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #0099ff;
        }
        .section h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1em;
            color: #0077cc;
            margin-bottom: 16px;
            font-weight: 600;
        }
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }
        .btn {
            padding: 10px 12px;
            border: 2px solid #0099ff;
            background: white;
            color: #0099ff;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }
        .btn:hover {
            background: #f0f8ff;
        }
        .btn.active {
            background: #0099ff;
            color: white;
        }
        .slider-group {
            margin-bottom: 16px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.9em;
            font-weight: 500;
            color: #333;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, #0099ff, #00ffff);
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #0099ff;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 100, 200, 0.4);
        }
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #0099ff;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(0, 100, 200, 0.4);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }
        .stat-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d4e8ff;
        }
        .stat-label {
            font-size: 0.75em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .stat-value {
            font-family: 'Poppins', sans-serif;
            font-size: 1.2em;
            font-weight: 600;
            color: #0077cc;
        }
        .canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #cce7ff 0%, #e8f5ff 100%);
            border-radius: 12px;
            padding: 20px;
            min-height: 500px;
        }
        canvas {
            border-radius: 8px;
            background: white;
            box-shadow: 0 4px 16px rgba(0, 100, 200, 0.1);
        }
        .phase-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-top: 8px;
            width: 100%;
            text-align: center;
        }
        .phase-liquid {
            background: #e8f5ff;
            color: #0099ff;
        }
        .phase-vapor {
            background: #f0f8ff;
            color: #00d9ff;
        }
        .phase-ice {
            background: #f8f8ff;
            color: #4db8ff;
        }
        @media (max-width: 900px) {
            .content {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💧 Water Droplet Journey</h1>
            <p>Follow a water droplet through Earth's hydrologic cycle</p>
        </div>
        <div class="content">
            <div class="control-panel">
                <div class="section">
                    <h3>Starting Location</h3>
                    <div class="button-group">
                        <button class="btn location-btn active" data-location="ocean">Ocean</button>
                        <button class="btn location-btn" data-location="lake">Lake</button>
                        <button class="btn location-btn" data-location="river">River</button>
                        <button class="btn location-btn" data-location="soil">Soil</button>
                        <button class="btn location-btn" data-location="cloud">Cloud</button>
                        <button class="btn location-btn" data-location="glacier">Glacier</button>
                    </div>
                    <h3 style="margin-top: 16px;">Starting Phase</h3>
                    <div class="button-group">
                        <button class="btn phase-btn active" data-phase="liquid">Liquid</button>
                        <button class="btn phase-btn" data-phase="vapor">Vapor</button>
                        <button class="btn phase-btn" data-phase="ice">Ice</button>
                    </div>
                </div>

                <div class="section">
                    <h3>Conditions</h3>
                    <div class="slider-group">
                        <div class="slider-label">
                            <span>Temperature</span>
                            <span id="tempValue">15</span>°C
                        </div>
                        <input type="range" id="tempSlider" min="-20" max="50" value="15" step="1">
                    </div>
                    <div class="slider-group">
                        <div class="slider-label">
                            <span>Elevation</span>
                            <span id="elevValue">0</span>m
                        </div>
                        <input type="range" id="elevSlider" min="0" max="5000" value="0" step="100">
                    </div>
                    <div class="slider-group">
                        <div class="slider-label">
                            <span>Animation Speed</span>
                            <span id="speedValue">1</span>x
                        </div>
                        <input type="range" id="speedSlider" min="0.5" max="2" value="1" step="0.25">
                    </div>
                </div>

                <div class="section">
                    <h3>Journey Stats</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-label">Current Location</div>
                            <div class="stat-value" id="statLocation">Ocean</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Current Phase</div>
                            <div class="stat-value" id="statPhase">Liquid</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Travel Days</div>
                            <div class="stat-value" id="statDays">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Distance (km)</div>
                            <div class="stat-value" id="statDistance">0</div>
                        </div>
                    </div>
                    <div class="phase-badge" id="phaseBadge" style="margin-top: 12px;">Liquid Water</div>
                </div>
            </div>

            <div class="canvas-container">
                <canvas id="canvas" width="500" height="600"></canvas>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let state = {
            location: 'ocean',
            phase: 'liquid',
            temperature: 15,
            elevation: 0,
            animationSpeed: 1,
            journeyTime: 0,
            journeyDistance: 0,
            animationFrame: 0
        };

        // Location cycle paths and properties
        const locationPaths = {
            ocean: {
                points: [[100, 500], [150, 450], [200, 350], [250, 200], [300, 100]],
                nextLocation: 'cloud',
                color: '#0099ff',
                label: 'Ocean',
                travelDays: 3
            },
            cloud: {
                points: [[350, 80], [400, 150], [380, 250]],
                nextLocation: 'river',
                color: '#f0f8ff',
                label: 'Cloud',
                travelDays: 2
            },
            river: {
                points: [[350, 300], [320, 350], [280, 400], [200, 480]],
                nextLocation: 'soil',
                color: '#0099ff',
                label: 'River',
                travelDays: 1.5
            },
            soil: {
                points: [[180, 510], [150, 520], [120, 530]],
                nextLocation: 'groundwater',
                color: '#8b6914',
                label: 'Soil',
                travelDays: 0.5
            },
            groundwater: {
                points: [[100, 540], [50, 520], [40, 450], [60, 350]],
                nextLocation: 'ocean',
                color: '#4db8ff',
                label: 'Groundwater',
                travelDays: 2
            },
            glacier: {
                points: [[450, 150], [420, 180], [380, 250], [300, 350]],
                nextLocation: 'melt',
                color: '#e8f8ff',
                label: 'Glacier',
                travelDays: 4
            },
            melt: {
                points: [[280, 380], [250, 420], [200, 480]],
                nextLocation: 'ocean',
                color: '#00d9ff',
                label: 'Melt',
                travelDays: 1
            },
            lake: {
                points: [[300, 400], [320, 380], [350, 300], [380, 200], [400, 100]],
                nextLocation: 'atmosphere',
                color: '#0099ff',
                label: 'Lake',
                travelDays: 2
            },
            atmosphere: {
                points: [[420, 80], [450, 60], [380, 150], [320, 250]],
                nextLocation: 'precipitation',
                color: '#00ffff',
                label: 'Atmosphere',
                travelDays: 1.5
            },
            precipitation: {
                points: [[300, 280], [280, 350], [250, 450]],
                nextLocation: 'ocean',
                color: '#4db8ff',
                label: 'Precipitation',
                travelDays: 1
            }
        };

        function getBoilingPoint(elevationM) {
            // Real atmospheric pressure effect: boiling point drops ~0.036°C per 100m elevation
            const baseBP = 100;
            const reduction = (elevationM / 100) * 0.36;
            return Math.max(70, baseBP - reduction);
        }

        function updatePhase() {
            const bp = getBoilingPoint(state.elevation);
            if (state.temperature <= 0) {
                state.phase = 'ice';
            } else if (state.temperature >= bp) {
                state.phase = 'vapor';
            } else {
                state.phase = 'liquid';
            }
            updateUI();
        }

        function updateUI() {
            document.getElementById('tempValue').textContent = state.temperature;
            document.getElementById('elevValue').textContent = state.elevation;
            document.getElementById('speedValue').textContent = state.animationSpeed.toFixed(2);
            document.getElementById('statLocation').textContent = locationPaths[state.location].label;
            document.getElementById('statPhase').textContent = state.phase.charAt(0).toUpperCase() + state.phase.slice(1);
            document.getElementById('statDays').textContent = Math.floor(state.journeyTime / 10);
            document.getElementById('statDistance').textContent = Math.floor(state.journeyDistance);

            const phaseBadge = document.getElementById('phaseBadge');
            const phaseNames = { liquid: 'Liquid Water', vapor: 'Water Vapor', ice: 'Ice' };
            phaseBadge.textContent = phaseNames[state.phase];
            phaseBadge.className = `phase-badge phase-${state.phase}`;
        }

        function drawBackground() {
            // Sky gradient
            const skyGradient = ctx.createLinearGradient(0, 0, 0, 300);
            skyGradient.addColorStop(0, '#cce7ff');
            skyGradient.addColorStop(1, '#e8f5ff');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, 300);

            // Ground
            ctx.fillStyle = '#d4a574';
            ctx.fillRect(0, 480, canvas.width, canvas.height - 480);

            // Ocean (if needed)
            if (['ocean', 'lake', 'river'].includes(state.location)) {
                ctx.fillStyle = 'rgba(0, 153, 255, 0.1)';
                ctx.fillRect(0, 500, canvas.width, canvas.height - 500);
            }

            // Mountains
            ctx.fillStyle = '#8b7355';
            ctx.beginPath();
            ctx.moveTo(350, 480);
            ctx.lineTo(450, 250);
            ctx.lineTo(500, 480);
            ctx.fill();

            // Cloud zones if in upper atmosphere
            if (['cloud', 'atmosphere', 'vapor'].includes(state.location) || state.phase === 'vapor') {
                ctx.fillStyle = 'rgba(240, 248, 255, 0.6)';
                ctx.beginPath();
                ctx.ellipse(300, 100, 80, 40, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawDroplet(x, y, phaseType) {
            const colors = {
                liquid: '#0099ff',
                vapor: '#00ffff',
                ice: '#e8f8ff'
            };
            ctx.fillStyle = colors[phaseType];
            ctx.beginPath();
            ctx.arc(x, y, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#0077cc';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawPath() {
            const path = locationPaths[state.location].points;
            ctx.strokeStyle = 'rgba(0, 153, 255, 0.3)';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(path[0][0], path[0][1]);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i][0], path[i][1]);
            }
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBackground();
            drawPath();

            const path = locationPaths[state.location].points;
            const progress = (state.animationFrame % 300) / 300;

            // Interpolate position along path
            let x, y;
            const segmentCount = path.length - 1;
            const segment = Math.floor(progress * segmentCount);
            const nextSegment = Math.min(segment + 1, path.length - 1);
            const segmentProgress = (progress * segmentCount) - segment;

            x = path[segment][0] + (path[nextSegment][0] - path[segment][0]) * segmentProgress;
            y = path[segment][1] + (path[nextSegment][1] - path[segment][1]) * segmentProgress;

            drawDroplet(x, y, state.phase);

            // Update journey metrics
            state.journeyTime += state.animationSpeed * 0.1;
            state.journeyDistance += state.animationSpeed * 0.05;

            state.animationFrame += state.animationSpeed;

            // Transition to next location after completing path
            if (state.animationFrame > 300 * state.animationSpeed) {
                const nextLoc = locationPaths[state.location].nextLocation;
                state.location = nextLoc;
                state.animationFrame = 0;

                // Auto-update phase based on elevation
                if (state.location === 'glacier') {
                    state.temperature = Math.max(-10, state.temperature - 5);
                } else if (state.location === 'ocean') {
                    state.temperature = Math.max(15, Math.min(25, state.temperature + 2));
                }
                updatePhase();
            }

            updateUI();
            requestAnimationFrame(animate);
        }

        // Event listeners
        document.querySelectorAll('.location-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.location-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                state.location = e.target.dataset.location;
                state.animationFrame = 0;
                state.journeyTime = 0;
                state.journeyDistance = 0;
                updatePhase();
            });
        });

        document.querySelectorAll('.phase-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.phase-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                state.phase = e.target.dataset.phase;
                updateUI();
            });
        });

        document.getElementById('tempSlider').addEventListener('input', (e) => {
            state.temperature = parseInt(e.target.value);
            updatePhase();
        });

        document.getElementById('elevSlider').addEventListener('input', (e) => {
            state.elevation = parseInt(e.target.value);
            updatePhase();
        });

        document.getElementById('speedSlider').addEventListener('input', (e) => {
            state.animationSpeed = parseFloat(e.target.value);
        });

        updatePhase();
        animate();
    </script>
</body>
</html>
