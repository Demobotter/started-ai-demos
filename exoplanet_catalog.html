<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exoplanet Catalog</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a1428 0%, #1a2d4a 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 10px; text-align: center; color: #ffd700; }
    .subtitle { text-align: center; color: #aaa; margin-bottom: 30px; font-size: 0.95rem; }
    
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid rgba(77, 168, 218, 0.3);
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .control-label {
      font-size: 0.85rem;
      color: #4da8da;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="range"], select, button {
      padding: 8px 12px;
      background: rgba(77, 168, 218, 0.1);
      border: 1px solid #4da8da;
      color: #fff;
      border-radius: 4px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    input[type="range"] { padding: 5px; }
    select:hover, button:hover { background: rgba(77, 168, 218, 0.2); }
    button.active { background: #4da8da; color: #000; }
    
    .timeline-wrapper {
      margin-bottom: 30px;
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid rgba(77, 168, 218, 0.3);
    }
    .timeline-label {
      color: #4da8da;
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 0.9rem;
      text-transform: uppercase;
    }
    canvas#timeline { width: 100%; display: block; background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
    
    .discovery-rate {
      margin-bottom: 30px;
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid rgba(77, 168, 218, 0.3);
    }
    .section-title {
      color: #4da8da;
      font-weight: 600;
      margin-bottom: 15px;
      font-size: 0.9rem;
      text-transform: uppercase;
    }
    canvas#discoveryChart { width: 100%; display: block; background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
    
    .habitability-scatter {
      margin-bottom: 30px;
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid rgba(77, 168, 218, 0.3);
    }
    canvas#habitability { width: 100%; display: block; background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
    
    .exoplanet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .exoplanet-card {
      background: rgba(77, 168, 218, 0.1);
      border: 1px solid #4da8da;
      border-radius: 6px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .exoplanet-card:hover { background: rgba(77, 168, 218, 0.2); transform: translateY(-2px); }
    .card-name { font-weight: 600; font-size: 1.1rem; color: #ffd700; margin-bottom: 5px; }
    .card-stat { font-size: 0.85rem; color: #aaa; margin: 3px 0; }
    .card-stat-label { color: #4da8da; font-weight: 500; }
    .esi-bar {
      background: rgba(0, 0, 0, 0.3);
      height: 6px;
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }
    .esi-fill { height: 100%; background: #51cf66; transition: width 0.3s; }
    
    .detail-panel {
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #4da8da;
      max-height: 300px;
      overflow-y: auto;
    }
    .detail-title { font-size: 1.3rem; color: #ffd700; font-weight: 600; margin-bottom: 15px; }
    .detail-row { display: grid; grid-template-columns: 150px 1fr; gap: 15px; margin: 8px 0; font-size: 0.9rem; }
    .detail-label { color: #4da8da; font-weight: 600; }
    .detail-value { color: #ddd; }
    
    .stats-box {
      background: rgba(77, 168, 218, 0.15);
      border-left: 3px solid #4da8da;
      padding: 12px;
      margin: 10px 0;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .stat-name { color: #4da8da; font-weight: 600; }
    .stat-value { color: #ffd700; font-weight: 600; }
    
    @media (max-width: 768px) {
      h1 { font-size: 1.8rem; }
      .controls { grid-template-columns: 1fr; }
      .exoplanet-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <div class="container">
    <h1>🪐 Exoplanet Catalog</h1>
    <p class="subtitle">5600+ confirmed worlds orbiting distant stars</p>
    
    <div class="controls">
      <div class="control-group">
        <label class="control-label">Discovery Timeline</label>
        <input type="range" id="yearSlider" min="1995" max="2026" value="2026" step="1">
        <span id="yearDisplay" style="font-size: 0.85rem; color: #4da8da;">2026</span>
      </div>
      <div class="control-group">
        <label class="control-label">Habitability (ESI)</label>
        <input type="range" id="esiSlider" min="0" max="100" value="0" step="5">
        <span id="esiDisplay" style="font-size: 0.85rem; color: #4da8da;">0.00 – 1.00</span>
      </div>
      <div class="control-group">
        <label class="control-label">Distance (Light-years)</label>
        <select id="distanceFilter">
          <option value="10000">All (up to 10,000 LY)</option>
          <option value="50">Within 50 LY</option>
          <option value="100">Within 100 LY</option>
          <option value="500">Within 500 LY</option>
        </select>
      </div>
      <div class="control-group">
        <label class="control-label">Planet Type</label>
        <select id="typeFilter">
          <option value="all">All Types</option>
          <option value="terrestrial">Terrestrial</option>
          <option value="super-earth">Super-Earth</option>
          <option value="mini-neptune">Mini-Neptune</option>
          <option value="gas-giant">Gas Giant</option>
          <option value="ice-giant">Ice Giant</option>
        </select>
      </div>
      <div class="control-group">
        <label class="control-label">Sort By</label>
        <select id="sortBy">
          <option value="esi">Habitability (ESI)</option>
          <option value="distance">Distance</option>
          <option value="year">Discovery Year</option>
          <option value="radius">Planet Radius</option>
        </select>
      </div>
      <div class="control-group">
        <label class="control-label">Discovery Method</label>
        <div style="display: flex; flex-wrap: wrap; gap: 5px;">
          <button class="method-btn active" data-method="all">All</button>
          <button class="method-btn" data-method="transit">Transit</button>
          <button class="method-btn" data-method="radial">Radial Velocity</button>
          <button class="method-btn" data-method="direct">Direct Imaging</button>
        </div>
      </div>
    </div>
    
    <div class="timeline-wrapper">
      <div class="timeline-label">Discovery Timeline (1995–2026)</div>
      <canvas id="timeline" width="1200" height="80"></canvas>
    </div>
    
    <div class="discovery-rate">
      <div class="section-title">Exoplanets Discovered Per Year</div>
      <canvas id="discoveryChart" width="1200" height="250"></canvas>
    </div>
    
    <div class="habitability-scatter">
      <div class="section-title">Habitability vs Radius (Earth = Gold Star)</div>
      <canvas id="habitability" width="1200" height="300"></canvas>
    </div>
    
    <div>
      <div class="exoplanet-grid" id="exoplanetGrid"></div>
      <div class="detail-panel" id="detailPanel" style="display: none;"></div>
    </div>
  </div>

      { name: "Kepler-33f", star: "Kepler-33", year: 2011, distance: 430, radius: 2.6, mass: 9.0, type: "mini-neptune", temp: 198, esi: 0.69, method: "transit", period: 102 },
      { name: "Kepler-62b", star: "Kepler-62", year: 2013, distance: 1200, radius: 1.31, mass: 1.3, type: "terrestrial", temp: 695, esi: 0.32, method: "transit", period: 5.71 },
      { name: "Kepler-62c", star: "Kepler-62", year: 2013, distance: 1200, radius: 1.61, mass: 2.0, type: "super-earth", temp: 546, esi: 0.42, method: "transit", period: 12.44 },
      { name: "Kepler-62d", star: "Kepler-62", year: 2013, distance: 1200, radius: 1.95, mass: 3.0, type: "super-earth", temp: 413, esi: 0.52, method: "transit", period: 18.16 },
      { name: "Kepler-62e", star: "Kepler-62", year: 2013, distance: 1200, radius: 1.61, mass: 2.4, type: "super-earth", temp: 246, esi: 0.72, method: "transit", period: 122.4 },
    ];

    let filteredPlanets = [...exoplanets];
    let selectedMethod = "all";

    function calculateESI(temp, radius) {
      const earthTemp = 288;
      const earthRadius = 1.0;
      const radiusTerm = Math.pow(1 - Math.abs(Math.log10(radius / earthRadius)) / Math.log10(5), 0.57);
      const tempTerm = Math.pow(1 - Math.abs(Math.log10(temp / earthTemp)) / Math.log10(1.5), 0.25);
      return Math.max(0, Math.min(1, radiusTerm * tempTerm));
    }

    function updateESI() {
      exoplanets.forEach(p => {
        p.esi = calculateESI(p.temp, p.radius);
      });
    }

    updateESI();

    function getPlanetColor(type) {
      const colors = {
        'terrestrial': '#4da8da',
        'super-earth': '#f0ad4e',
        'mini-neptune': '#ff9999',
        'gas-giant': '#d9a5d9',
        'ice-giant': '#5dade2'
      };
      return colors[type] || '#aaa';
    }

    function getPlanetTypeLabel(type) {
      const labels = {
        'terrestrial': 'Terrestrial',
        'super-earth': 'Super-Earth',
        'mini-neptune': 'Mini-Neptune',
        'gas-giant': 'Gas Giant',
        'ice-giant': 'Ice Giant'
      };
      return labels[type] || type;
    }

    function filterAndSort() {
      const year = parseInt(document.getElementById('yearSlider').value);
      const esiMin = parseInt(document.getElementById('esiSlider').value) / 100;
      const distance = parseInt(document.getElementById('distanceFilter').value);
      const type = document.getElementById('typeFilter').value;
      const sortBy = document.getElementById('sortBy').value;

      filteredPlanets = exoplanets.filter(p => {
        if (p.year > year) return false;
        if (p.esi < esiMin) return false;
        if (p.distance > distance) return false;
        if (type !== 'all' && p.type !== type) return false;
        if (selectedMethod !== 'all' && p.method !== selectedMethod) return false;
        return true;
      });

      filteredPlanets.sort((a, b) => {
        switch (sortBy) {
          case 'esi': return b.esi - a.esi;
          case 'distance': return a.distance - b.distance;
          case 'year': return b.year - a.year;
          case 'radius': return b.radius - a.radius;
          default: return 0;
        }
      });

      render();
    }

    function render() {
      renderTimeline();
      renderDiscoveryChart();
      renderHabitability();
      renderGrid();
    }

    function renderTimeline() {
      const canvas = document.getElementById('timeline');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const startYear = 1995;
      const endYear = 2026;
      const padding = 40;
      const lineY = 40;

      ctx.strokeStyle = '#4da8da';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(padding, lineY);
      ctx.lineTo(canvas.width - padding, lineY);
      ctx.stroke();

      // Discovery milestones
      const milestones = [
        { year: 1995, label: '51 Peg b' },
        { year: 2009, label: 'Kepler Launch' },
        { year: 2023, label: 'JWST' }
      ];

      milestones.forEach(m => {
        const x = padding + (m.year - startYear) / (endYear - startYear) * (canvas.width - 2 * padding);
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(x - 3, lineY - 3, 6, 6);
        ctx.fillStyle = '#aaa';
        ctx.font = '11px Inter';
        ctx.textAlign = 'center';
        ctx.fillText(m.label, x, lineY + 15);
      });

      // Current year slider position
      const year = parseInt(document.getElementById('yearSlider').value);
      const x = padding + (year - startYear) / (endYear - startYear) * (canvas.width - 2 * padding);
      ctx.fillStyle = '#51cf66';
      ctx.beginPath();
      ctx.arc(x, lineY, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    function renderDiscoveryChart() {
      const canvas = document.getElementById('discoveryChart');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Count exoplanets discovered per year
      const yearCounts = {};
      exoplanets.forEach(p => {
        yearCounts[p.year] = (yearCounts[p.year] || 0) + 1;
      });

      const years = Object.keys(yearCounts).map(Number).sort((a, b) => a - b);
      let cumulativeCount = 0;
      const cumulativeCounts = years.map(y => {
        cumulativeCount += yearCounts[y];
        return cumulativeCount;
      });

      const padding = 40;
      const maxCount = Math.max(...cumulativeCounts);

      // Draw grid
      ctx.strokeStyle = '#1f4d7f';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= 5; i++) {
        const y = padding + i * (canvas.height - 2 * padding) / 5;
        ctx.beginPath();
        ctx.moveTo(padding, y);
        ctx.lineTo(canvas.width - padding, y);
        ctx.stroke();
      }

      // Draw bars
      const barWidth = (canvas.width - 2 * padding) / years.length;
      years.forEach((y, idx) => {
        const count = cumulativeCounts[idx];
        const barHeight = (count / maxCount) * (canvas.height - 2 * padding);
        const x = padding + idx * barWidth;
        const barY = canvas.height - padding - barHeight;

        ctx.fillStyle = '#4da8da';
        ctx.fillRect(x + 2, barY, barWidth - 4, barHeight);
      });

      // Axes labels
      ctx.fillStyle = '#aaa';
      ctx.font = '11px Inter';
      ctx.textAlign = 'center';
      ctx.fillText('1995', padding, canvas.height - 15);
      ctx.fillText('2026', canvas.width - padding, canvas.height - 15);
      ctx.textAlign = 'right';
      ctx.fillText('0', padding - 5, canvas.height - padding + 3);
      ctx.fillText(maxCount.toString(), padding - 5, padding + 3);
    }

    function renderHabitability() {
      const canvas = document.getElementById('habitability');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const padding = 60;
      const minTemp = 100;
      const maxTemp = 1600;
      const minRadius = 0;
      const maxRadius = 15;

      // Habitable zone shading (light green)
      const habitableMinTemp = 240;
      const habitableMaxTemp = 320;
      const x1 = padding + (habitableMinTemp - minTemp) / (maxTemp - minTemp) * (canvas.width - 2 * padding);
      const x2 = padding + (habitableMaxTemp - minTemp) / (maxTemp - minTemp) * (canvas.width - 2 * padding);
      ctx.fillStyle = 'rgba(81, 207, 102, 0.15)';
      ctx.fillRect(x1, padding, x2 - x1, canvas.height - 2 * padding);

      // Earth
      const earthX = padding + (288 - minTemp) / (maxTemp - minTemp) * (canvas.width - 2 * padding);
      const earthY = canvas.height - padding - (1.0 - minRadius) / (maxRadius - minRadius) * (canvas.height - 2 * padding);
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(earthX, earthY, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Plot planets
      exoplanets.forEach(p => {
        const x = padding + (p.temp - minTemp) / (maxTemp - minTemp) * (canvas.width - 2 * padding);
        const y = canvas.height - padding - (p.radius - minRadius) / (maxRadius - minRadius) * (canvas.height - 2 * padding);
        const color = getPlanetColor(p.type);

        ctx.fillStyle = color;
        ctx.globalAlpha = 0.6 + p.esi * 0.4; // More opaque for habitable
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      });

      // Axes
      ctx.strokeStyle = '#4da8da';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(padding, padding);
      ctx.lineTo(padding, canvas.height - padding);
      ctx.lineTo(canvas.width - padding, canvas.height - padding);
      ctx.stroke();

      // Labels
      ctx.fillStyle = '#aaa';
      ctx.font = '11px Inter';
      ctx.textAlign = 'center';
      ctx.fillText('Equilibrium Temperature (K)', canvas.width / 2, canvas.height - 5);
      ctx.save();
      ctx.translate(15, canvas.height / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText('Planet Radius (Earth radii)', 0, 0);
      ctx.restore();

      ctx.fillStyle = '#4da8da';
      ctx.textAlign = 'right';
      ctx.fillText(minTemp.toString(), padding - 10, padding + 3);
      ctx.fillText(maxTemp.toString(), canvas.width - padding, padding + 3);
    }

    function renderGrid() {
      const grid = document.getElementById('exoplanetGrid');
      grid.innerHTML = '';

      filteredPlanets.forEach(p => {
        const card = document.createElement('div');
        card.className = 'exoplanet-card';
        card.innerHTML = `
          <div class="card-name">${p.name}</div>
          <div class="card-stat"><span class="card-stat-label">Star:</span> ${p.star}</div>
          <div class="card-stat"><span class="card-stat-label">Year:</span> ${p.year}</div>
          <div class="card-stat"><span class="card-stat-label">Distance:</span> ${p.distance.toFixed(1)} LY</div>
          <div class="card-stat"><span class="card-stat-label">Type:</span> ${getPlanetTypeLabel(p.type)}</div>
          <div class="card-stat"><span class="card-stat-label">Radius:</span> ${p.radius.toFixed(2)} R⊕</div>
          <div class="card-stat"><span class="card-stat-label">Temp:</span> ${p.temp} K</div>
          <div class="card-stat"><span class="card-stat-label">ESI:</span> ${p.esi.toFixed(2)}</div>
          <div class="esi-bar"><div class="esi-fill" style="width: ${p.esi * 100}%; background: ${p.esi > 0.6 ? '#51cf66' : p.esi > 0.3 ? '#f0ad4e' : '#ff6666'};"></div></div>
        `;
        card.addEventListener('click', () => showDetail(p));
        grid.appendChild(card);
      });

      // Show count
      const count = document.createElement('div');
      count.style.gridColumn = '1 / -1';
      count.style.textAlign = 'center';
      count.style.color = '#4da8da';
      count.style.marginTop = '20px';
      count.style.fontSize = '0.9rem';
      count.innerHTML = `Showing ${filteredPlanets.length} of ${exoplanets.length} exoplanet${filteredPlanets.length !== 1 ? 's' : ''}`;
      grid.appendChild(count);
    }

    function showDetail(planet) {
      const panel = document.getElementById('detailPanel');
      panel.style.display = 'block';
      panel.innerHTML = `
        <div class="detail-title">${planet.name}</div>
        <div class="detail-row">
          <div class="detail-label">Host Star:</div>
          <div class="detail-value">${planet.star}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Discovered:</div>
          <div class="detail-value">${planet.year}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Discovery Method:</div>
          <div class="detail-value">${planet.method === 'transit' ? 'Transit Photometry' : planet.method === 'radial' ? 'Radial Velocity' : 'Direct Imaging'}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Distance:</div>
          <div class="detail-value">${planet.distance.toFixed(1)} light-years</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Type:</div>
          <div class="detail-value">${getPlanetTypeLabel(planet.type)}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Radius:</div>
          <div class="detail-value">${planet.radius.toFixed(2)} Earth radii</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Mass:</div>
          <div class="detail-value">${planet.mass.toFixed(2)} Earth masses</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Orbital Period:</div>
          <div class="detail-value">${planet.period.toFixed(2)} days</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Equilibrium Temp:</div>
          <div class="detail-value">${planet.temp} K</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Earth Similarity Index:</div>
          <div class="detail-value">${planet.esi.toFixed(3)} (1.0 = Earth-like)</div>
        </div>
        <div class="stats-box">
          <div><span class="stat-name">Habitability:</span> <span class="stat-value">${planet.esi > 0.6 ? '🟢 High' : planet.esi > 0.3 ? '🟡 Moderate' : '🔴 Low'}</span></div>
        </div>
      `;
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Event listeners
    document.getElementById('yearSlider').addEventListener('input', (e) => {
      document.getElementById('yearDisplay').textContent = e.target.value;
      filterAndSort();
    });

    document.getElementById('esiSlider').addEventListener('input', (e) => {
      const esi = (parseInt(e.target.value) / 100).toFixed(2);
      document.getElementById('esiDisplay').textContent = `${(parseInt(e.target.value) / 100).toFixed(2)} – 1.00`;
      filterAndSort();
    });

    document.getElementById('distanceFilter').addEventListener('change', filterAndSort);
    document.getElementById('typeFilter').addEventListener('change', filterAndSort);
    document.getElementById('sortBy').addEventListener('change', filterAndSort);

    document.querySelectorAll('.method-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        selectedMethod = e.target.dataset.method;
        filterAndSort();
      });
    });

    render();
  </script>
</body>
</html>
